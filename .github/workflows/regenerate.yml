name: Regenerate Site

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (aggregate only, skip generation)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily

permissions:
  contents: write

jobs:
  # Job 1: Aggregate data (runs once)
  aggregate:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Run smoke test
        run: npm run smoke

      - name: Aggregate data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
        run: npm run aggregate

      - name: Show aggregated data
        run: |
          echo "=== Narrative Signals ==="
          cat data/latest.json | jq '.narrative_signals'
          echo ""
          echo "=== Context ==="
          cat data/latest.json | jq '.context'

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-data
          path: |
            data/latest.json
            data/fetch-summary.json
          retention-days: 1

  # Job 2: Generate with each model (parallel matrix)
  generate:
    needs: aggregate
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [composer-1, claude-4.5-opus-high-thinking, gpt-5.1-codex-max-low-fast]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: aggregated-data
          path: data/

      - name: Install Cursor CLI
        run: curl https://cursor.com/install -fsS | bash

      - name: Clear existing build (start fresh)
        run: rm -f generated/index.html

      - name: Build generation prompt
        run: |
          cat > /tmp/generation-prompt.txt << 'PROMPT_END'
          Read infra/prompts/system.md for the design guidelines.
          Read data/latest.json for the current aggregated data.
          
          Create a new generated/index.html from scratch.
          Output a complete HTML file with embedded CSS.
          Use the data to create a personal website that reflects who Erik is.
          PROMPT_END
          
          echo "Prompt built for model: ${{ matrix.model }}"
          cat /tmp/generation-prompt.txt

      - name: Generate site with ${{ matrix.model }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          cursor-agent -p --force --model "${{ matrix.model }}" --output-format stream-json "$(cat /tmp/generation-prompt.txt)" > /tmp/build-output.json 2>&1 || true
          echo "Build output captured for ${{ matrix.model }}"

      - name: Prepare build artifact
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          MODEL="${{ matrix.model }}"
          mkdir -p "builds/${DATE}"
          
          # Copy generated HTML to date folder
          if [ -f generated/index.html ]; then
            cp generated/index.html "builds/${DATE}/${MODEL}.html"
            echo "Saved build: builds/${DATE}/${MODEL}.html"
          else
            echo "No generated/index.html found"
          fi
          
          # Save build output for logging
          cp /tmp/build-output.json "builds/${DATE}/${MODEL}-output.json"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.model }}
          path: |
            builds/${{ needs.aggregate.outputs.date }}/
            generated/index.html
          retention-days: 1

  # Job 3: Commit all builds
  commit:
    needs: [aggregate, generate]
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: aggregated-data
          path: data/

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts/

      - name: Organize builds
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          mkdir -p "builds/${DATE}"
          
          # Copy all builds from artifacts to builds folder
          for dir in artifacts/build-*/builds/${DATE}; do
            if [ -d "$dir" ]; then
              cp -r "$dir"/* "builds/${DATE}/" 2>/dev/null || true
            fi
          done
          
          echo "Builds collected:"
          ls -la "builds/${DATE}/"

      - name: Process build logs and update manifest
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          
          # Process each model's build output
          for model in composer-1 claude-4.5-opus-high-thinking gpt-5.1-codex-max-low-fast; do
            output_file="builds/${DATE}/${model}-output.json"
            if [ -f "$output_file" ]; then
              echo "Processing build log for ${model}..."
              npm run save-build-log -- "$output_file" --model "$model"
            fi
          done

      - name: Set generated/index.html (keep shell at root)
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          DEFAULT_MODEL="composer-1"
          
          # Only update generated/index.html for backward compatibility
          # DO NOT overwrite index.html - that's the shell with model switcher
          if [ -f "builds/${DATE}/${DEFAULT_MODEL}.html" ]; then
            cp "builds/${DATE}/${DEFAULT_MODEL}.html" generated/index.html
            echo "Set generated/index.html from ${DEFAULT_MODEL}"
          else
            echo "Warning: Default model build not found"
          fi

      - name: Cleanup build outputs
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          # Remove the JSON output files (logs are in history.json)
          rm -f builds/${DATE}/*-output.json

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage all build files (index.html is the shell, don't touch it)
          git add data/latest.json
          git add data/fetch-summary.json
          git add builds/
          git add generated/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate site (3 models) - $(date -u +%Y-%m-%d)"
            git push
          fi
