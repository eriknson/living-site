name: Regenerate Site

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (aggregate only, skip generation)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily

concurrency:
  group: regenerate-site
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Aggregate data (runs once)
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Run smoke test
        run: npm run smoke

      - name: Aggregate data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
        run: npm run aggregate

      - name: Show aggregated data
        run: |
          echo "=== Narrative Signals ==="
          cat data/latest.json | jq '.narrative_signals'
          echo ""
          echo "=== Context ==="
          cat data/latest.json | jq '.context'

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-data
          path: |
            data/latest.json
            data/fetch-summary.json
          retention-days: 3

  # Job 2: Generate with each model (parallel matrix)
  generate:
    needs: aggregate
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [composer-1, claude-4.5-opus-high-thinking, gpt-5.1-codex]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: aggregated-data
          path: data/

      - name: Install Cursor CLI
        run: curl https://cursor.com/install -fsS | bash

      - name: Clear existing build (start fresh)
        run: rm -f generated/${{ matrix.model }}.html

      - name: Build generation prompt
        run: |
          cat > /tmp/generation-prompt.txt << PROMPT_END
          Read infra/prompts/system.md for the design guidelines.
          Read data/latest.json for the current aggregated data.
          
          Create a new generated/${{ matrix.model }}.html from scratch.
          Output a complete HTML file with embedded CSS.
          Use the data to create a personal website that reflects who Erik is.
          PROMPT_END
          
          echo "Prompt built for model: ${{ matrix.model }}"
          cat /tmp/generation-prompt.txt

      - name: Generate site with ${{ matrix.model }}
        id: generate
        continue-on-error: true
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          cursor-agent -p --force --model "${{ matrix.model }}" --output-format stream-json "$(cat /tmp/generation-prompt.txt)" > /tmp/build-output.json 2>&1
          echo "Build output captured for ${{ matrix.model }}"

      - name: Verify sandbox (no unauthorized changes)
        run: |
          # Check if any files outside generated/ were modified
          UNAUTHORIZED=$(git diff --name-only | grep -v '^generated/' | grep -v '^$' || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "ERROR: Agent modified files outside sandbox:"
            echo "$UNAUTHORIZED"
            git checkout -- .  # Revert unauthorized changes
          fi
          echo "Sandbox verified: no unauthorized changes"
          
      - name: Prepare build artifact
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          MODEL="${{ matrix.model }}"
          mkdir -p "public/builds/${DATE}"
          
          # Copy generated HTML to date folder (each model has its own sandbox file)
          # Final naming with timestamp will happen in commit job
          if [ -f "generated/${MODEL}.html" ]; then
            cp "generated/${MODEL}.html" "public/builds/${DATE}/${MODEL}.html"
            echo "Saved build: public/builds/${DATE}/${MODEL}.html"
          else
            echo "No generated/${MODEL}.html found"
          fi
          
          # Save build output for logging
          cp /tmp/build-output.json "public/builds/${DATE}/${MODEL}-output.json"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.model }}
          path: |
            public/builds/${{ needs.aggregate.outputs.date }}/
            generated/${{ matrix.model }}.html
          retention-days: 3

  # Job 3: Commit all builds
  commit:
    needs: [aggregate, generate]
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: aggregated-data
          path: data/

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts/

      - name: Organize builds
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          mkdir -p "public/builds/${DATE}"
          mkdir -p "generated"
          
          # Copy build output JSONs from artifacts (for log processing)
          for dir in artifacts/build-*/public/builds/${DATE}; do
            if [ -d "$dir" ]; then
              # Only copy the output.json files, not the HTML (save-build-log will handle HTML with timestamps)
              cp "$dir"/*-output.json "public/builds/${DATE}/" 2>/dev/null || true
            fi
          done
          
          # Copy model-specific generated files from artifacts (derive models from artifact dirs)
          # These will be copied to timestamped paths by save-build-log
          for artifact_dir in artifacts/build-*/; do
            model=$(basename "$artifact_dir" | sed 's/^build-//')
            src="${artifact_dir}generated/${model}.html"
            if [ -f "$src" ]; then
              cp "$src" "generated/${model}.html"
              echo "Copied generated/${model}.html"
            fi
          done
          
          echo "Build outputs collected:"
          ls -la "public/builds/${DATE}/"
          echo "Generated files:"
          ls -la "generated/"

      - name: Process build logs and update manifest
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          # Generate a shared batch timestamp for all models in this run
          BATCH_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          
          # Process each model's build output (derive models from artifact dirs)
          # --date: Use the workflow date to ensure consistency across jobs
          # --batch-timestamp: Shared timestamp for all models in this batch
          # --github-run-url: Link to this GitHub Actions run
          # save-build-log will copy HTML from generated/{model}.html to builds/{date}/{model}-{timestamp}.html
          for artifact_dir in artifacts/build-*/; do
            model=$(basename "$artifact_dir" | sed 's/^build-//')
            output_file="public/builds/${DATE}/${model}-output.json"
            if [ -f "$output_file" ]; then
              echo "Processing build log for ${model}..."
              npm run save-build-log -- "$output_file" --model "$model" --date "$DATE" --batch-timestamp "$BATCH_TIMESTAMP" --github-run-url "$GITHUB_RUN_URL"
            fi
          done

      - name: Cleanup build outputs
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          # Remove the JSON output files (logs are in history.json)
          rm -f public/builds/${DATE}/*-output.json

      - name: Copy fetch summary to public
        run: |
          mkdir -p public/data
          cp data/fetch-summary.json public/data/fetch-summary.json

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage all build files
          git add data/latest.json
          git add data/fetch-summary.json
          git add public/data/
          git add public/builds/
          git add generated/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate site (3 models) - $(date -u +%Y-%m-%d)"
            
            # Pull latest changes and rebase before pushing
            # This handles the case where another push happened during the workflow
            git pull --rebase origin main
            git push
          fi

      - name: Write job summary
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          echo "## 🔄 Regenerate Site Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${DATE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Model Builds" >> $GITHUB_STEP_SUMMARY
          for artifact_dir in artifacts/build-*/; do
            model=$(basename "$artifact_dir" | sed 's/^build-//')
            if [ -f "generated/${model}.html" ]; then
              echo "- ✅ ${model}" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ ${model} (no HTML generated)" >> $GITHUB_STEP_SUMMARY
            fi
          done
