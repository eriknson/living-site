name: Regenerate Site

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (aggregate only, skip generation)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # Uncomment for daily regeneration:
  # schedule:
  #   - cron: '0 6 * * *'  # 6am UTC daily

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run smoke test
        run: npm run smoke

      - name: Aggregate data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run aggregate

      - name: Generate site
        if: inputs.dry_run != 'true'
        run: |
          echo "TODO: Cursor CLI integration"
          echo "For now, run 'npm run generate' locally"
          echo ""
          echo "Aggregated data preview:"
          cat data/latest.json | head -50

      # Uncomment when Cursor CLI is integrated:
      # - name: Generate site
      #   if: inputs.dry_run != 'true'
      #   env:
      #     CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      #   run: npm run generate

      - name: Commit changes
        if: inputs.dry_run != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Only commit changes in allowed directories
          git add data/latest.json
          git add generated/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate site - $(date -u +%Y-%m-%d)"
            git push
          fi
