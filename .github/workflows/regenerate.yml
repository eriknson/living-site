name: Regenerate Site

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (aggregate only, skip generation)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # Uncomment for daily regeneration:
  # schedule:
  #   - cron: '0 6 * * *'  # 6am UTC daily

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run smoke test
        run: npm run smoke

      - name: Aggregate data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run aggregate

      - name: Show aggregated themes
        run: |
          echo "=== Aggregated Themes ==="
          cat data/latest.json | jq '.themes'
          echo ""
          echo "=== Context ==="
          cat data/latest.json | jq '.context'

      # TODO: Cursor CLI integration
      # For now, generation happens locally. This workflow just aggregates data.
      # - name: Generate site
      #   if: inputs.dry_run != 'true'
      #   run: npm run generate

      - name: Sync index.html from generated
        if: inputs.dry_run != 'true'
        run: cp generated/index.html index.html

      - name: Commit changes
        if: inputs.dry_run != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage allowed files
          git add data/latest.json
          git add generated/
          git add index.html
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate site - $(date -u +%Y-%m-%d)"
            git push
          fi
