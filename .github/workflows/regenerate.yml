name: Regenerate Site

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (aggregate only, skip generation)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      build_id:
        description: 'Build ID for live streaming (auto-generated if empty)'
        required: false
        type: string
      debug_models:
        description: 'Print available Cursor CLI models (diagnostic only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily

concurrency:
  group: regenerate-site
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  BUILD_ID: ${{ inputs.build_id || github.run_id }}
  BUILD_WEBHOOK_URL: ${{ secrets.BUILD_WEBHOOK_URL }}
  BUILD_WEBHOOK_SECRET: ${{ secrets.BUILD_WEBHOOK_SECRET }}

jobs:
  cursor-models-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.debug_models == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          cursor-agent --version || echo "Failed to get cursor-agent version"

      - name: Print available Cursor models
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY is not set"
            exit 0
          fi
          cursor-agent models || true

  # Job 1: Aggregate data (runs once)
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Notify aggregate started
        if: env.BUILD_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"aggregate.started","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Run smoke test
        run: pnpm run smoke

      - name: Fetch live site for curator
        run: |
          echo "Fetching styled page for curator to process..."
          curl -sL "https://eriks.design" -o data/styled-page.html
          echo "Saved data/styled-page.html ($(wc -c < data/styled-page.html) bytes)"

      - name: Aggregate data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
        run: |
          pnpm run aggregate 2>&1 | while IFS= read -r line; do
            echo "$line"
            # Send log lines to webhook (limit to avoid spam)
            if [ -n "$BUILD_WEBHOOK_URL" ] && [[ "$line" == *"✓"* ]] || [[ "$line" == *"fetched"* ]] || [[ "$line" == *"Fetching"* ]]; then
              curl -s -X POST "$BUILD_WEBHOOK_URL" \
                -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
                -H "Content-Type: application/json" \
                -d '{"buildId":"'"$BUILD_ID"'","event":"aggregate.log","data":"'"$(echo "$line" | sed 's/"/\\"/g')"'"}' || true
            fi
          done

      - name: Show aggregated data
        run: |
          echo "=== Sources ==="
          cat data/latest.json | jq '.sources | keys'
          echo ""
          echo "=== Context ==="
          cat data/latest.json | jq '.context'

      - name: Notify aggregate complete
        if: env.BUILD_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"aggregate.complete","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-data
          path: |
            data/latest.json
            data/fetch-summary.json
            data/styled-page.html
            data/news.json
          if-no-files-found: warn
          retention-days: 3

  # Job 2: Curator agent synthesizes raw data into creative direction
  curator:
    needs: aggregate
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: aggregated-data
          path: artifacts/

      - name: Organize downloaded files
        run: |
          # Move data files to data/
          cp artifacts/latest.json data/latest.json
          cp artifacts/fetch-summary.json data/fetch-summary.json
          cp artifacts/styled-page.html data/styled-page.html
          cp artifacts/news.json data/news.json 2>/dev/null || true
          echo "Artifacts organized"

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          cursor-agent --version || echo "Failed to get cursor-agent version"

      - name: Notify curator started
        if: env.BUILD_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"curator.started","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Create clean worktree for curator
        run: |
          git worktree add /tmp/curator-workspace --detach HEAD
          cp data/latest.json /tmp/curator-workspace/data/latest.json
          cp data/styled-page.html /tmp/curator-workspace/data/styled-page.html
          cp data/news.json /tmp/curator-workspace/data/news.json 2>/dev/null || true
          rm -f /tmp/curator-workspace/data/brief.json
          rm -f /tmp/curator-workspace/data/reference.html
          echo "Curator workspace created"

      - name: Run curator agent
        working-directory: /tmp/curator-workspace
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          PROMPT="Read infra/prompts/curator.md for your instructions.
          
          Task 1: Read data/latest.json → Write data/brief.json
          Task 2: Read data/styled-page.html → Write data/reference.html (semantic version)"
          
          cursor-agent -p --force --model composer-2-fast "$PROMPT" 2>&1 || true

      - name: Copy curator output or create fallback
        run: |
          # Copy brief.json
          if [ -f "/tmp/curator-workspace/data/brief.json" ]; then
            cp /tmp/curator-workspace/data/brief.json data/brief.json
            echo "=== Brief Output (from curator) ==="
          else
            echo "⚠ Curator did not create brief.json, generating fallback..."
            node -e "
              const latest = require('./data/latest.json');
              const gh = latest.sources?.github || {};
              const spotify = latest.sources?.spotify || {};
              const weather = latest.sources?.weather || {};
              const repos = (gh.active_repos || []).filter(r => r.is_owned).slice(0, 2).map(r => r.name);
              const artists = (spotify.medium_term?.artists || []).slice(0, 3).map(a => a.name);
              const gameDirections = {
                'composer-2-fast': { concept: 'Catch brief bright signals while dodging heavier shadows in a 45-second one-thumb survival round.', mechanic: 'dodge and collect', touch_control: 'drag anywhere to steer', session_hook: 'quick score chase with near-miss bonuses', escalation: 'signal density and shadow speed increase every 10 seconds', aesthetic: 'crisp monochrome with warm accent sparks' },
                'gpt-5.4-high-fast': { concept: 'Flick small orbiting moons into matching gates before the orbit collapses.', mechanic: 'physics flick timing', touch_control: 'hold, aim, release', session_hook: 'satisfying flicks and combo chains', escalation: 'the orbit shrinks and gates rotate faster', aesthetic: 'soft orbital diagrams on dark paper' },
                'claude-opus-4-7-thinking-max': { concept: 'Trace safe paths through a shifting rain map before the next weather pulse lands.', mechanic: 'path drawing', touch_control: 'draw a route with one finger', session_hook: 'tiny route-planning bursts', escalation: 'new hazards appear and old paths decay', aesthetic: 'misty map lines and glassy droplets' },
                'gemini-3.1-pro': { concept: 'Switch lanes to sort falling notes into the right columns before the rhythm stutters.', mechanic: 'lane switching and sorting', touch_control: 'swipe left or right', session_hook: 'fast readable sorting flow', escalation: 'tempo rises and decoy notes appear', aesthetic: 'minimal music staff with bright impacts' },
                'kimi-k2.5': { concept: 'Memorize and repeat a tiny constellation pattern as new stars flare in.', mechanic: 'memory pattern', touch_control: 'tap glowing nodes', session_hook: 'one-screen pattern mastery', escalation: 'patterns lengthen and stars fade faster', aesthetic: 'quiet sky chart with ink labels' }
              };
              const brief = {
                mood: latest.context?.season + ' focus',
                intro: repos.length ? 'Working on ' + repos.join(' and ') + '.' : 'Building with AI.',
                currently: [{ label: 'building', value: repos.join(', ') || 'projects' }],
                listening: artists.join(', ') || 'music',
                footer: latest.identity?.name?.split(' ')[0]?.toLowerCase() || 'erik',
                world_signals: [latest.context?.season, weather.conditions].filter(Boolean).slice(0, 3),
                game_directions: gameDirections
              };
              console.log(JSON.stringify(brief, null, 2));
            " > data/brief.json
            echo "=== Brief Output (fallback) ==="
          fi
          cat data/brief.json
          
          # Copy reference.html (semantic version)
          if [ -f "/tmp/curator-workspace/data/reference.html" ]; then
            cp /tmp/curator-workspace/data/reference.html data/reference.html
            echo "=== Reference HTML (from curator) ==="
            head -20 data/reference.html
          else
            echo "⚠ Curator did not create reference.html, creating minimal fallback..."
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Erik Nilsson</title></head><body><main><p>Designer at <a href="https://cursor.com">Cursor</a>, making tools for building software with AI.</p><ul><li><a href="https://x.com/flowstated">Follow on X</a></li><li><a href="mailto:contact@eriks.design">Send an email</a></li><li><a href="https://github.com/eriknson">GitHub</a></li></ul></main></body></html>' > data/reference.html
            echo "=== Reference HTML (fallback) ==="
          fi
          
          git worktree remove /tmp/curator-workspace --force || true

      - name: Notify curator complete
        if: env.BUILD_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"curator.complete","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Upload curator artifact
        uses: actions/upload-artifact@v4
        with:
          name: curator-data
          path: |
            data/brief.json
            data/reference.html
          retention-days: 3

  # Job 3: Generate with each model (parallel matrix)
  # Uses git worktree for isolation - agent sees no previous builds
  generate:
    needs: [aggregate, curator]
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [composer-2-fast, gpt-5.4-high-fast, claude-opus-4-7-thinking-max, gemini-3.1-pro, kimi-k2.5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: aggregated-data
          path: artifacts/aggregated/

      - name: Download curator artifact
        uses: actions/download-artifact@v4
        with:
          name: curator-data
          path: artifacts/curator/

      - name: Organize downloaded files
        run: |
          # Move data files to data/
          cp artifacts/aggregated/latest.json data/latest.json
          cp artifacts/aggregated/fetch-summary.json data/fetch-summary.json
          cp artifacts/curator/brief.json data/brief.json
          cp artifacts/curator/reference.html data/reference.html
          echo "Artifacts organized"

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          # Verify installation
          which cursor-agent || echo "cursor-agent not found in PATH"
          cursor-agent --version || echo "Failed to get cursor-agent version"

      - name: Notify model started
        if: env.BUILD_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"model.started","model":"${{ matrix.model }}","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Create clean worktree (isolated workspace)
        run: |
          # Create isolated workspace from current commit
          git worktree add /tmp/clean-gen --detach HEAD
          
          # Remove all build history so agent starts fresh
          rm -rf /tmp/clean-gen/generated/*.html
          rm -rf /tmp/clean-gen/public/builds/
          
          # Ensure generated folder exists but is empty
          mkdir -p /tmp/clean-gen/generated
          touch /tmp/clean-gen/generated/.gitkeep
          
          echo "=== Clean workspace created ==="
          echo "Generated folder contents:"
          ls -la /tmp/clean-gen/generated/
          echo ""
          echo "No public/builds/ visible to agent"

      - name: Copy fresh data to worktree
        run: |
          # Copy only what the generator needs: brief.json + reference.html
          cp data/brief.json /tmp/clean-gen/data/brief.json
          cp data/reference.html /tmp/clean-gen/data/reference.html
          echo "Copied brief.json and reference.html to worktree"

      - name: Build generation prompt
        run: |
          cat > /tmp/generation-prompt.txt << PROMPT_END
          $(cat /tmp/clean-gen/infra/prompts/system.md)

          ---

          Reference: data/reference.html
          Today: data/brief.json

          Output: generated/${{ matrix.model }}.html
          PROMPT_END
          
          echo "=== Generation Prompt ==="
          cat /tmp/generation-prompt.txt

      - name: Generate site with ${{ matrix.model }}
        id: generate
        continue-on-error: true
        working-directory: /tmp/clean-gen
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          echo "Working directory: $(pwd)"
          echo "Agent can only see:"
          find . -name "*.html" -o -name "*.json" | grep -v node_modules | head -20
          echo ""
          
          # Debug: Check if API key is set (without revealing it)
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "ERROR: CURSOR_API_KEY is not set!"
            exit 1
          else
            echo "CURSOR_API_KEY is set (length: ${#CURSOR_API_KEY})"
          fi
          
          # Debug: Verify cursor-agent is available
          echo "cursor-agent location: $(which cursor-agent 2>/dev/null || echo 'NOT FOUND')"
          
          # Debug: Check if required files exist
          echo "Checking required files..."
          ls -la infra/prompts/system.md || echo "system.md NOT FOUND"
          ls -la data/brief.json || echo "brief.json NOT FOUND"
          ls -la data/reference.html || echo "reference.html NOT FOUND"
          
          # Run cursor-agent and capture exit code properly
          set -o pipefail
          cursor-agent -p --force --model "${{ matrix.model }}" --output-format stream-json "$(cat /tmp/generation-prompt.txt)" 2>&1 | tee /tmp/build-output.json | while IFS= read -r line; do
            # Parse JSON and forward to webhook if it's a valid event
            if [ -n "$BUILD_WEBHOOK_URL" ]; then
              TYPE=$(echo "$line" | jq -r '.type // empty' 2>/dev/null)
              if [ -n "$TYPE" ]; then
                # Send the stream event to webhook (fire and forget, don't block)
                curl -s -X POST "$BUILD_WEBHOOK_URL" \
                  -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
                  -H "Content-Type: application/json" \
                  -d '{"buildId":"'"$BUILD_ID"'","event":"model.stream","model":"${{ matrix.model }}","data":'"$line"'}' &
              fi
            fi
          done
          AGENT_EXIT=$?
          
          echo "Build output captured for ${{ matrix.model }}"
          echo "cursor-agent exit code: $AGENT_EXIT"
          
          # Show last part of build output for debugging
          echo "=== Last 50 lines of build output ==="
          tail -50 /tmp/build-output.json 2>/dev/null || echo "No build output captured"

      - name: Copy result back to main checkout
        run: |
          if [ -f "/tmp/clean-gen/generated/${{ matrix.model }}.html" ]; then
            cp "/tmp/clean-gen/generated/${{ matrix.model }}.html" "generated/${{ matrix.model }}.html"
            echo "Copied generated file back to main checkout"
            echo "Line count: $(wc -l < generated/${{ matrix.model }}.html)"
          else
            echo "No generated file found in worktree"
          fi

      - name: Notify model complete
        if: always() && env.BUILD_WEBHOOK_URL != ''
        run: |
          if [ -f "generated/${{ matrix.model }}.html" ]; then
            STATUS="model.complete"
          else
            STATUS="model.error"
          fi
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"'"$STATUS"'","model":"${{ matrix.model }}","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Cleanup worktree
        if: always()
        run: |
          git worktree remove /tmp/clean-gen --force || true
          echo "Worktree cleaned up"

      - name: Prepare build artifact
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          MODEL="${{ matrix.model }}"
          mkdir -p "public/builds/${DATE}"
          
          # Copy generated HTML to date folder (each model has its own sandbox file)
          # Final naming with timestamp will happen in commit job
          if [ -f "generated/${MODEL}.html" ]; then
            cp "generated/${MODEL}.html" "public/builds/${DATE}/${MODEL}.html"
            echo "Saved build: public/builds/${DATE}/${MODEL}.html"
          else
            echo "No generated/${MODEL}.html found"
          fi
          
          # Save build output for logging
          cp /tmp/build-output.json "public/builds/${DATE}/${MODEL}-output.json"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.model }}
          path: |
            public/builds/${{ needs.aggregate.outputs.date }}/
            generated/${{ matrix.model }}.html
          retention-days: 3

  # Job 3b: Generate games with each model (parallel matrix)
  generate-game:
    needs: [aggregate, curator]
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [composer-2-fast, gpt-5.4-high-fast, claude-opus-4-7-thinking-max, gemini-3.1-pro, kimi-k2.5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: aggregated-data
          path: artifacts/aggregated/

      - name: Download curator artifact
        uses: actions/download-artifact@v4
        with:
          name: curator-data
          path: artifacts/curator/

      - name: Organize downloaded files
        run: |
          cp artifacts/aggregated/latest.json data/latest.json
          cp artifacts/aggregated/fetch-summary.json data/fetch-summary.json
          cp artifacts/curator/brief.json data/brief.json
          cp artifacts/curator/reference.html data/reference.html
          echo "Artifacts organized"

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          cursor-agent --version || echo "Failed to get cursor-agent version"

      - name: Notify game model started
        if: env.BUILD_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"game.model.started","model":"${{ matrix.model }}","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Create clean worktree for game
        run: |
          git worktree add /tmp/clean-game --detach HEAD
          rm -rf /tmp/clean-game/generated/games/*.html
          mkdir -p /tmp/clean-game/generated/games
          touch /tmp/clean-game/generated/games/.gitkeep
          echo "=== Clean game workspace created ==="

      - name: Copy fresh data to worktree
        run: |
          cp data/brief.json /tmp/clean-game/data/brief.json
          echo "Copied brief.json to game worktree"

      - name: Build game generation prompt
        run: |
          cat > /tmp/game-generation-prompt.txt << PROMPT_END
          $(cat /tmp/clean-game/infra/prompts/games-system.md)

          ---

          You are model: ${{ matrix.model }}
          Look up your assigned direction in data/brief.json under game_directions["${{ matrix.model }}"].

          Today: data/brief.json

          Output: generated/games/${{ matrix.model }}.html
          PROMPT_END

          echo "=== Game Generation Prompt ==="
          cat /tmp/game-generation-prompt.txt

      - name: Generate game with ${{ matrix.model }}
        id: generate-game
        continue-on-error: true
        working-directory: /tmp/clean-game
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "ERROR: CURSOR_API_KEY is not set!"
            exit 1
          fi

          set -o pipefail
          cursor-agent -p --force --model "${{ matrix.model }}" --output-format stream-json "$(cat /tmp/game-generation-prompt.txt)" 2>&1 | tee /tmp/game-build-output.json | while IFS= read -r line; do
            if [ -n "$BUILD_WEBHOOK_URL" ]; then
              TYPE=$(echo "$line" | jq -r '.type // empty' 2>/dev/null)
              if [ -n "$TYPE" ]; then
                curl -s -X POST "$BUILD_WEBHOOK_URL" \
                  -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
                  -H "Content-Type: application/json" \
                  -d '{"buildId":"'"$BUILD_ID"'","event":"game.model.stream","model":"${{ matrix.model }}","data":'"$line"'}' &
              fi
            fi
          done

      - name: Copy game result back
        run: |
          if [ -f "/tmp/clean-game/generated/games/${{ matrix.model }}.html" ]; then
            mkdir -p generated/games
            cp "/tmp/clean-game/generated/games/${{ matrix.model }}.html" "generated/games/${{ matrix.model }}.html"
            echo "Copied generated game back"
            echo "Line count: $(wc -l < generated/games/${{ matrix.model }}.html)"
          else
            echo "No generated game file found"
          fi

      - name: Notify game model complete
        if: always() && env.BUILD_WEBHOOK_URL != ''
        run: |
          if [ -f "generated/games/${{ matrix.model }}.html" ]; then
            STATUS="game.model.complete"
          else
            STATUS="game.model.error"
          fi
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"'"$STATUS"'","model":"${{ matrix.model }}","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Cleanup worktree
        if: always()
        run: |
          git worktree remove /tmp/clean-game --force || true

      - name: Prepare game build artifact
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          MODEL="${{ matrix.model }}"
          mkdir -p "public/games/${DATE}"

          if [ -f "generated/games/${MODEL}.html" ]; then
            cp "generated/games/${MODEL}.html" "public/games/${DATE}/${MODEL}.html"
            echo "Saved game build: public/games/${DATE}/${MODEL}.html"
          else
            echo "No generated/games/${MODEL}.html found"
          fi

          cp /tmp/game-build-output.json "public/games/${DATE}/${MODEL}-output.json"

      - name: Upload game build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-build-${{ matrix.model }}
          path: |
            public/games/${{ needs.aggregate.outputs.date }}/
            generated/games/${{ matrix.model }}.html
          retention-days: 3

  # Job 4: Validate and optionally polish builds
  validate:
    needs: [aggregate, curator, generate]
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [composer-2-fast, gpt-5.4-high-fast, claude-opus-4-7-thinking-max, gemini-3.1-pro, kimi-k2.5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.model }}
          path: artifacts/

      - name: Organize files
        run: |
          mkdir -p generated
          cp artifacts/generated/${{ matrix.model }}.html generated/ 2>/dev/null || echo "No HTML to copy"
          
          # Also keep the output.json for commit job
          DATE="${{ needs.aggregate.outputs.date }}"
          mkdir -p "public/builds/${DATE}"
          cp artifacts/public/builds/${DATE}/*-output.json "public/builds/${DATE}/" 2>/dev/null || true

      - name: Validate build
        id: validate
        run: |
          if [ -f "generated/${{ matrix.model }}.html" ]; then
            set +e
            RESULT=$(pnpm run validate-build -- "generated/${{ matrix.model }}.html" 2>&1)
            EXIT_CODE=$?
            set -e
            
            echo "$RESULT"
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "needs_polish=false" >> $GITHUB_OUTPUT
            else
              echo "needs_polish=true" >> $GITHUB_OUTPUT
              # Extract just the issues for the polish prompt
              ISSUES=$(echo "$RESULT" | grep -A20 "ISSUES" | head -15 || echo "$RESULT")
              echo "issues<<EOF" >> $GITHUB_OUTPUT
              echo "$ISSUES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "No build to validate"
            echo "needs_polish=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify validation result
        if: env.BUILD_WEBHOOK_URL != ''
        run: |
          STATUS="validate.passed"
          if [ "${{ steps.validate.outputs.needs_polish }}" = "true" ]; then
            STATUS="validate.needs_polish"
          fi
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"'"$STATUS"'","model":"${{ matrix.model }}","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Install Cursor CLI
        if: steps.validate.outputs.needs_polish == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          cursor-agent --version || echo "Failed to get cursor-agent version"

      - name: Download curator artifact for polish
        if: steps.validate.outputs.needs_polish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: curator-data
          path: data/

      - name: Run polish agent
        if: steps.validate.outputs.needs_polish == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          ISSUES="${{ steps.validate.outputs.issues }}"
          
          PROMPT="Read infra/prompts/polish.md for instructions.
          
          Validation issues to fix:
          $ISSUES
          
          File to fix: generated/${{ matrix.model }}.html
          
          Read the file, fix the issues, write it back."
          
          echo "=== Running polish agent for ${{ matrix.model }} ==="
          cursor-agent -p --force --model composer-2-fast "$PROMPT" 2>&1 || true

      - name: Re-validate after polish
        if: steps.validate.outputs.needs_polish == 'true'
        run: |
          echo "=== Re-validating after polish ==="
          pnpm run validate-build -- "generated/${{ matrix.model }}.html" || echo "Still has issues after polish"

      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ matrix.model }}
          path: |
            generated/${{ matrix.model }}.html
            public/builds/${{ needs.aggregate.outputs.date }}/
          retention-days: 3

  # Job 4b: Validate and optionally polish game builds
  # Fail-closed: games that still fail after polish are NOT published.
  validate-game:
    needs: [aggregate, curator, generate-game]
    if: ${{ inputs.dry_run != 'true' && always() && needs.aggregate.result == 'success' && needs.curator.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        model: [composer-2-fast, gpt-5.4-high-fast, claude-opus-4-7-thinking-max, gemini-3.1-pro, kimi-k2.5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Download game build artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: game-build-${{ matrix.model }}
          path: artifacts/

      - name: Organize files
        run: |
          mkdir -p generated/games
          cp artifacts/generated/games/${{ matrix.model }}.html generated/games/ 2>/dev/null || echo "No game HTML to copy"

          DATE="${{ needs.aggregate.outputs.date }}"
          mkdir -p "public/games/${DATE}"
          cp artifacts/public/games/${DATE}/*-output.json "public/games/${DATE}/" 2>/dev/null || true

      - name: Static validation
        id: static-validate
        run: |
          if [ -f "generated/games/${{ matrix.model }}.html" ]; then
            set +e
            RESULT=$(pnpm run validate-game -- "generated/games/${{ matrix.model }}.html" 2>&1)
            EXIT_CODE=$?
            set -e

            echo "$RESULT"

            if [ $EXIT_CODE -eq 0 ]; then
              echo "needs_polish=false" >> $GITHUB_OUTPUT
            else
              echo "needs_polish=true" >> $GITHUB_OUTPUT
              ISSUES=$(echo "$RESULT" | grep -A20 "ISSUES" | head -15 || echo "$RESULT")
              echo "issues<<EOF" >> $GITHUB_OUTPUT
              echo "$ISSUES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "No game build to validate"
            echo "needs_polish=false" >> $GITHUB_OUTPUT
            echo "no_file=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Cursor CLI
        if: steps.static-validate.outputs.needs_polish == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          cursor-agent --version || echo "Failed to get cursor-agent version"

      - name: Download curator artifact for polish
        if: steps.static-validate.outputs.needs_polish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: curator-data
          path: data/

      - name: Run game polish agent
        if: steps.static-validate.outputs.needs_polish == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          ISSUES="${{ steps.static-validate.outputs.issues }}"

          PROMPT="Read infra/prompts/games-polish.md for instructions.

          Validation issues to fix:
          $ISSUES

          File to fix: generated/games/${{ matrix.model }}.html

          Read the file, fix the issues, write it back."

          echo "=== Running game polish agent for ${{ matrix.model }} ==="
          cursor-agent -p --force --model composer-2-fast "$PROMPT" 2>&1 || true

      - name: Re-validate after polish (static)
        id: revalidate
        if: steps.static-validate.outputs.needs_polish == 'true'
        run: |
          echo "=== Re-validating game after polish ==="
          if pnpm run validate-game -- "generated/games/${{ matrix.model }}.html"; then
            echo "static_passed=true" >> $GITHUB_OUTPUT
          else
            echo "static_passed=false" >> $GITHUB_OUTPUT
            echo "::warning::${{ matrix.model }} game still fails static validation after polish"
          fi

      - name: Runtime smoke test
        id: smoke
        if: steps.static-validate.outputs.no_file != 'true'
        run: |
          GAME_FILE="generated/games/${{ matrix.model }}.html"
          if [ ! -f "$GAME_FILE" ]; then
            echo "smoke_passed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          DATE="${{ needs.aggregate.outputs.date }}"
          SHOTS_DIR="public/games/${DATE}/screenshots"
          mkdir -p "$SHOTS_DIR"

          set +e
          pnpm run smoke-game -- "$GAME_FILE" --screenshots-dir "$SHOTS_DIR" 2>&1
          SMOKE_EXIT=$?
          set -e

          if [ $SMOKE_EXIT -eq 0 ]; then
            echo "smoke_passed=true" >> $GITHUB_OUTPUT
          else
            echo "smoke_passed=false" >> $GITHUB_OUTPUT
            echo "::warning::${{ matrix.model }} game failed runtime smoke test"
          fi

      - name: Determine final status
        id: final
        run: |
          GAME_FILE="generated/games/${{ matrix.model }}.html"
          if [ ! -f "$GAME_FILE" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "No game file — skipping publish"
            exit 0
          fi

          # Static must pass (either initially or after polish)
          NEEDS_POLISH="${{ steps.static-validate.outputs.needs_polish }}"
          STATIC_AFTER="${{ steps.revalidate.outputs.static_passed }}"

          if [ "$NEEDS_POLISH" = "true" ] && [ "$STATIC_AFTER" != "true" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Static validation failed after polish — not publishing"
            exit 0
          fi

          # Smoke test must pass
          SMOKE="${{ steps.smoke.outputs.smoke_passed }}"
          if [ "$SMOKE" = "false" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Smoke test failed — not publishing"
            exit 0
          fi

          echo "publish=true" >> $GITHUB_OUTPUT
          echo "All checks passed — publishing game"

      - name: Upload validated game artifact
        if: steps.final.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validated-game-${{ matrix.model }}
          path: |
            generated/games/${{ matrix.model }}.html
            public/games/${{ needs.aggregate.outputs.date }}/
          retention-days: 3

  # Job 5: Commit site builds
  commit-site:
    needs: [aggregate, curator, generate, validate]
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Notify commit started
        if: env.BUILD_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"commit.started","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: aggregated-data
          path: artifacts/aggregated/

      - name: Download curator artifact
        uses: actions/download-artifact@v4
        with:
          name: curator-data
          path: artifacts/curator/

      - name: Organize data files
        run: |
          # Move data files to data/
          cp artifacts/aggregated/latest.json data/latest.json
          cp artifacts/aggregated/fetch-summary.json data/fetch-summary.json
          cp artifacts/curator/brief.json data/brief.json
          cp artifacts/curator/reference.html data/reference.html
          echo "Data files organized"

      - name: Download all validated artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: validated-*
          path: artifacts/

      - name: Organize site builds
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          mkdir -p "public/builds/${DATE}"
          mkdir -p "generated"
          rm -f generated/*.html
          
          # Copy site build output JSONs
          for dir in artifacts/validated-*/public/builds/${DATE}; do
            if [ -d "$dir" ]; then
              cp "$dir"/*-output.json "public/builds/${DATE}/" 2>/dev/null || true
            fi
          done
          
          # Copy validated site generated files
          for artifact_dir in artifacts/validated-*/; do
            artifact_name=$(basename "$artifact_dir")
            # Skip game artifacts
            if [[ "$artifact_name" == validated-game-* ]]; then continue; fi
            model=$(echo "$artifact_name" | sed 's/^validated-//')
            src="${artifact_dir}generated/${model}.html"
            if [ -f "$src" ]; then
              cp "$src" "generated/${model}.html"
              echo "Copied validated generated/${model}.html"
            fi
          done
          
          echo "=== Site builds ==="
          ls -la "public/builds/${DATE}/"
          ls -la "generated/"

      - name: Process build logs and update manifest
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          BATCH_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          
          # Process site build logs
          for artifact_dir in artifacts/validated-*/; do
            artifact_name=$(basename "$artifact_dir")
            if [[ "$artifact_name" == validated-game-* ]]; then continue; fi
            model=$(echo "$artifact_name" | sed 's/^validated-//')
            output_file="public/builds/${DATE}/${model}-output.json"
            if [ -f "$output_file" ]; then
              echo "Processing site build log for ${model}..."
              pnpm run save-build-log -- "$output_file" --model "$model" --date "$DATE" --batch-timestamp "$BATCH_TIMESTAMP" --github-run-url "$GITHUB_RUN_URL" --kind site
            else
              echo "Warning: No site output file for ${model}"
            fi
          done

      - name: Cleanup build outputs
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          rm -f public/builds/${DATE}/*-output.json

      - name: Copy fetch summary to public
        run: |
          mkdir -p public/data
          cp data/fetch-summary.json public/data/fetch-summary.json

      - name: Commit site changes
        run: |
          git config --local user.email "eriks@mail.se"
          git config --local user.name "Erik Nilsson"
          
          # Stage only normal site outputs. Game outputs are committed separately.
          git add data/latest.json
          git add data/fetch-summary.json
          git add data/brief.json
          git add public/data/
          git add public/builds/
          git add generated/*.html 2>/dev/null || true
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
            echo "Target branch: ${TARGET_BRANCH}"

            git commit -m "Regenerate site (6 models) - $(date -u +%Y-%m-%d)"
            
            # Pull/rebase before every push attempt so independent commit jobs can land cleanly.
            MAX_RETRIES=3
            RETRY_DELAY=10
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Sync + push attempt $i of $MAX_RETRIES..."
              if git pull --rebase origin "${TARGET_BRANCH}" && git push origin "HEAD:${TARGET_BRANCH}"; then
                echo "Push succeeded on attempt $i"
                break
              else
                git rebase --abort 2>/dev/null || true
                if [ $i -lt $MAX_RETRIES ]; then
                  echo "Push failed, retrying in ${RETRY_DELAY}s..."
                  sleep $RETRY_DELAY
                  RETRY_DELAY=$((RETRY_DELAY * 2))
                else
                  echo "Push failed after $MAX_RETRIES attempts"
                  exit 1
                fi
              fi
            done
          fi

      - name: Notify commit complete
        if: env.BUILD_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"commit.complete","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Notify build complete
        if: always() && env.BUILD_WEBHOOK_URL != ''
        run: |
          # Determine final status
          if [ -f "generated/composer-2-fast.html" ] || [ -f "generated/gpt-5.4-high-fast.html" ] || [ -f "generated/claude-opus-4-7-thinking-max.html" ] || [ -f "generated/gemini-3.1-pro.html" ] || [ -f "generated/kimi-k2.5.html" ]; then
            STATUS="build.complete"
          else
            STATUS="build.error"
          fi
          curl -s -X POST "$BUILD_WEBHOOK_URL" \
            -H "Authorization: Bearer $BUILD_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"'"$BUILD_ID"'","event":"'"$STATUS"'","timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"}' || true

      - name: Write job summary
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          echo "## 🔄 Regenerate Site Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${DATE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Site Builds (Validated)" >> $GITHUB_STEP_SUMMARY
          for artifact_dir in artifacts/validated-*/; do
            artifact_name=$(basename "$artifact_dir")
            if [[ "$artifact_name" == validated-game-* ]]; then continue; fi
            model=$(echo "$artifact_name" | sed 's/^validated-//')
            if [ -f "generated/${model}.html" ]; then
              echo "- ✅ ${model}" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ ${model} (no HTML generated)" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # Job 6: Commit game builds separately so failures never block the site commit.
  commit-game:
    needs: [aggregate, validate-game]
    if: ${{ inputs.dry_run != 'true' && always() && needs.aggregate.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: aggregated-data
          path: artifacts/aggregated/

      - name: Organize data files
        run: |
          mkdir -p data
          cp artifacts/aggregated/fetch-summary.json data/fetch-summary.json
          echo "Data files organized"

      - name: Download validated game artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: validated-game-*
          path: artifacts/

      - name: Organize game builds
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          mkdir -p "public/games/${DATE}"
          mkdir -p "generated/games"
          rm -f generated/games/*.html

          shopt -s nullglob
          artifact_dirs=(artifacts/validated-game-*/)

          if [ ${#artifact_dirs[@]} -eq 0 ]; then
            echo "No validated game artifacts found"
          fi

          for artifact_dir in "${artifact_dirs[@]}"; do
            if [ ! -d "$artifact_dir" ]; then continue; fi
            model=$(basename "$artifact_dir" | sed 's/^validated-game-//')

            output_dir="${artifact_dir}public/games/${DATE}"
            if [ -d "$output_dir" ]; then
              cp "$output_dir"/*-output.json "public/games/${DATE}/" 2>/dev/null || true
            fi

            src="${artifact_dir}generated/games/${model}.html"
            if [ -f "$src" ]; then
              cp "$src" "generated/games/${model}.html"
              echo "Copied validated generated/games/${model}.html"
            fi
          done

          echo "=== Game builds ==="
          ls -la "public/games/${DATE}/"
          ls -la "generated/games/"

      - name: Process game build logs and update manifest
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          BATCH_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)

          shopt -s nullglob
          artifact_dirs=(artifacts/validated-game-*/)

          for artifact_dir in "${artifact_dirs[@]}"; do
            if [ ! -d "$artifact_dir" ]; then continue; fi
            model=$(basename "$artifact_dir" | sed 's/^validated-game-//')
            output_file="public/games/${DATE}/${model}-output.json"
            if [ -f "$output_file" ]; then
              echo "Processing game build log for ${model}..."
              pnpm run save-build-log -- "$output_file" --model "$model" --date "$DATE" --batch-timestamp "$BATCH_TIMESTAMP" --github-run-url "$GITHUB_RUN_URL" --kind game
            else
              echo "Warning: No game output file for ${model}"
            fi
          done

      - name: Cleanup game build outputs
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          rm -f public/games/${DATE}/*-output.json

      - name: Commit game changes
        run: |
          git config --local user.email "eriks@mail.se"
          git config --local user.name "Erik Nilsson"

          git add public/games/
          git add generated/games/

          if git diff --staged --quiet; then
            echo "No game changes to commit"
          else
            TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
            echo "Target branch: ${TARGET_BRANCH}"

            git commit -m "Regenerate games (6 models) - $(date -u +%Y-%m-%d)"

            MAX_RETRIES=3
            RETRY_DELAY=10
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Sync + push attempt $i of $MAX_RETRIES..."
              if git pull --rebase origin "${TARGET_BRANCH}" && git push origin "HEAD:${TARGET_BRANCH}"; then
                echo "Push succeeded on attempt $i"
                break
              else
                git rebase --abort 2>/dev/null || true
                if [ $i -lt $MAX_RETRIES ]; then
                  echo "Push failed, retrying in ${RETRY_DELAY}s..."
                  sleep $RETRY_DELAY
                  RETRY_DELAY=$((RETRY_DELAY * 2))
                else
                  echo "Push failed after $MAX_RETRIES attempts"
                  exit 1
                fi
              fi
            done
          fi

      - name: Write game job summary
        run: |
          DATE="${{ needs.aggregate.outputs.date }}"
          echo "## Regenerate Game Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${DATE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Game Builds (Validated)" >> $GITHUB_STEP_SUMMARY

          shopt -s nullglob
          artifact_dirs=(artifacts/validated-game-*/)

          if [ ${#artifact_dirs[@]} -eq 0 ]; then
            echo "- No validated game artifacts" >> $GITHUB_STEP_SUMMARY
          fi

          for artifact_dir in "${artifact_dirs[@]}"; do
            model=$(basename "$artifact_dir" | sed 's/^validated-game-//')
            if [ -f "generated/games/${model}.html" ]; then
              echo "- ✅ ${model} (game)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ ${model} (no game HTML generated)" >> $GITHUB_STEP_SUMMARY
            fi
          done

