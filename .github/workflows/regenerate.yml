name: Regenerate Site

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (aggregate only, skip generation)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Cursor CLI
        run: curl https://cursor.com/install -fsS | bash

      - name: Run smoke test
        run: npm run smoke

      - name: Aggregate data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run aggregate

      - name: Show aggregated themes
        run: |
          echo "=== Aggregated Themes ==="
          cat data/latest.json | jq '.themes'
          echo ""
          echo "=== Context ==="
          cat data/latest.json | jq '.context'

      - name: Generate site with Cursor CLI
        if: inputs.dry_run != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          # Build the prompt
          SYSTEM_PROMPT=$(cat infra/prompts/system.md)
          DATA=$(cat data/latest.json)
          
          PROMPT="$SYSTEM_PROMPT

---

## Current Data

\`\`\`json
$DATA
\`\`\`

---

Regenerate generated/index.html based on the data above. Output a complete HTML file with embedded CSS following the design language specified."

          # Run Cursor CLI in headless mode
          cursor-agent -p --force "$PROMPT"

      - name: Sync index.html from generated
        if: inputs.dry_run != 'true'
        run: cp generated/index.html index.html

      - name: Commit changes
        if: inputs.dry_run != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage allowed files
          git add data/latest.json
          git add generated/
          git add index.html
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate site - $(date -u +%Y-%m-%d)"
            git push
          fi
