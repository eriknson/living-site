name: Sync Notion Posts

# DISABLED - Image paths and content preservation issues need fixing
# on:
#   # Triggered by webhook from Notion automation
#   repository_dispatch:
#     types: [notion-posts-updated]
#   # Manual trigger for testing
#   workflow_dispatch:

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "sync" to confirm manual sync'
        required: true

concurrency:
  group: sync-notion-posts
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Debounce (wait for more edits)
        run: |
          echo "Waiting 30s for additional edits..."
          sleep 30

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          echo "=== Fetching posts from Notion ==="
          pnpm run fetch-notion-posts
          
          echo ""
          echo "=== Raw files ==="
          ls -la data/posts/_raw/ || echo "No raw files"

      - name: Format posts (deterministic)
        run: |
          echo "=== Formatting posts (deterministic) ==="
          pnpm run format-posts
          
          echo ""
          echo "=== Formatted files ==="
          for f in data/posts/*.json; do
            if [ "$f" != "data/posts/index.json" ]; then
              echo "- $f ($(wc -c < "$f") bytes)"
            fi
          done

      - name: Install Cursor CLI
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Validate and fix posts (agent)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          echo "=== Running validator agent ==="
          
          # Check if there are raw files to validate against
          if [ ! -d "data/posts/_raw" ] || [ -z "$(ls -A data/posts/_raw/*.md 2>/dev/null)" ]; then
            echo "No raw markdown files to validate against, skipping"
            exit 0
          fi
          
          PROMPT="Read infra/prompts/post-formatter.md for your instructions.
          
          Validate all posts in data/posts/*.json against their raw sources in data/posts/_raw/.
          Fix any formatting issues you find.
          
          Focus on:
          1. Images: Verify all images from raw markdown appear in contentHtml
          2. Code blocks: Check syntax highlighting is applied
          3. Tweet embeds: Verify proper blockquote structure
          4. Links: Check external links have target=_blank
          
          If a post looks correct, move on. Only fix actual issues."
          
          # Run agent with timeout
          timeout 300 cursor-agent -p --force --model composer-1 "$PROMPT" 2>&1 || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "Agent timed out after 5 minutes, continuing with current output"
            else
              echo "Agent exited with code $EXIT_CODE"
            fi
          }
          
          echo ""
          echo "=== Post validation complete ==="

      - name: Cleanup raw files
        run: |
          rm -rf data/posts/_raw/
          echo "Cleaned up raw files"

      - name: Verify posts
        run: |
          echo "=== Posts index ==="
          cat data/posts/index.json | head -50
          
          echo ""
          echo "=== Post count ==="
          cat data/posts/index.json | jq '.posts | length' || echo "Unable to count"
          
          echo ""
          echo "=== Image counts per post ==="
          for f in data/posts/*.json; do
            if [ "$f" != "data/posts/index.json" ]; then
              SLUG=$(basename "$f" .json)
              IMG_COUNT=$(grep -o '<img' "$f" | wc -l | tr -d ' ')
              echo "- $SLUG: $IMG_COUNT images"
            fi
          done

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage post files and images
          git add data/posts/
          git add public/posts/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Sync posts from Notion"
          
          # Pull latest and rebase
          git pull --rebase origin main
          
          # Push with retry
          MAX_RETRIES=3
          RETRY_DELAY=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i of $MAX_RETRIES..."
            if git push; then
              echo "Push succeeded"
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Push failed, pulling and retrying in ${RETRY_DELAY}s..."
                git pull --rebase origin main
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY * 2))
              else
                echo "Push failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Write job summary
        run: |
          echo "## 📝 Notion Posts Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Fetched posts from Notion" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Formatted with deterministic converter" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Validated with agent" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Posts" >> $GITHUB_STEP_SUMMARY
          cat data/posts/index.json | jq -r '.posts[] | "- \(.title)"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "- (unable to parse index)" >> $GITHUB_STEP_SUMMARY
