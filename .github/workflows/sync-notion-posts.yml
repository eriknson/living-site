name: Sync Notion Posts

on:
  # Triggered by webhook from Notion automation
  repository_dispatch:
    types: [notion-posts-updated]
  # Manual trigger for testing
  workflow_dispatch:

concurrency:
  group: sync-notion-posts
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Debounce (wait for more edits)
        run: |
          echo "Waiting 30s for additional edits..."
          sleep 30

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          echo "=== Fetching posts from Notion ==="
          pnpm run fetch-notion-posts
          
          echo ""
          echo "=== Raw files ==="
          ls -la data/posts/_raw/ || echo "No raw files"

      - name: Format posts (deterministic)
        run: |
          echo "=== Formatting posts (deterministic) ==="
          pnpm run format-posts
          
          echo ""
          echo "=== Formatted files ==="
          for f in data/posts/*.json; do
            if [ "$f" != "data/posts/index.json" ]; then
              echo "- $f ($(wc -c < "$f") bytes)"
            fi
          done

      - name: Validate sync output
        id: validate
        run: |
          echo "=== Validating sync output ==="
          if pnpm run validate-sync; then
            echo "validation_passed=true" >> $GITHUB_OUTPUT
          else
            echo "validation_passed=false" >> $GITHUB_OUTPUT
            echo "⚠️ Validation failed - will run agent for fixes"
          fi

      - name: Install Cursor CLI
        if: steps.validate.outputs.validation_passed == 'false'
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Run agent to fix issues
        if: steps.validate.outputs.validation_passed == 'false'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          echo "=== Running agent to fix validation failures ==="
          
          PROMPT="The Notion sync validation failed. Your job is to fix the issues.

          Read the validation output above and fix the posts in data/posts/.
          Reference versions are in data/posts/_reference/.
          
          Common issues to fix:
          1. Image paths should be relative (/posts/...) not absolute (https://eriks.design/...)
          2. Content should not be significantly shorter than reference
          3. Code blocks need proper styling with CSS variables
          4. All images from reference should be present
          
          Compare each post with its reference and fix any issues.
          DO NOT modify the reference files."
          
          timeout 300 cursor-agent -p --force --model composer-1 "$PROMPT" 2>&1 || {
            echo "Agent completed or timed out"
          }

      - name: Re-validate after fixes
        run: |
          echo "=== Re-validating ==="
          pnpm run validate-sync || {
            echo "⚠️ Validation still failing after agent fixes"
            echo "Restoring from reference..."
            for f in data/posts/_reference/*.json; do
              SLUG=$(basename "$f" .json)
              cp "$f" "data/posts/${SLUG}.json"
              echo "Restored: $SLUG"
            done
          }

      - name: Update reference files
        run: |
          echo "=== Updating reference files ==="
          
          # Update all reference files from current posts
          mkdir -p data/posts/_reference/
          for f in data/posts/*.json; do
            if [ "$f" != "data/posts/index.json" ]; then
              SLUG=$(basename "$f" .json)
              cp "$f" "data/posts/_reference/${SLUG}.json"
              echo "Updated reference: $SLUG"
            fi
          done

      - name: Cleanup raw files
        run: |
          rm -rf data/posts/_raw/
          echo "Cleaned up raw files"

      - name: Final validation
        run: |
          echo "=== Final validation ==="
          pnpm run validate-sync
          
          echo ""
          echo "=== Post summary ==="
          for f in data/posts/*.json; do
            if [ "$f" != "data/posts/index.json" ]; then
              SLUG=$(basename "$f" .json)
              SIZE=$(wc -c < "$f" | tr -d ' ')
              IMGS=$(grep -o '<img' "$f" | wc -l | tr -d ' ')
              echo "- $SLUG: ${SIZE} bytes, ${IMGS} images"
            fi
          done

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage post files, images, and reference files
          git add data/posts/
          git add public/posts/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Sync posts from Notion (validated)"
          
          # Pull latest and rebase
          git pull --rebase origin main
          
          # Push with retry
          MAX_RETRIES=3
          RETRY_DELAY=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i of $MAX_RETRIES..."
            if git push; then
              echo "Push succeeded"
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Push failed, pulling and retrying in ${RETRY_DELAY}s..."
                git pull --rebase origin main
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY * 2))
              else
                echo "Push failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Write job summary
        run: |
          echo "## 📝 Notion Posts Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** Smart sync (content hashing)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Fetched all posts from Notion" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Detected changes (hash comparison)" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Formatted only changed posts" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Validated against reference" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Posts" >> $GITHUB_STEP_SUMMARY
          cat data/posts/index.json | jq -r '.posts[] | "- \(.title)"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "- (unable to parse index)" >> $GITHUB_STEP_SUMMARY
