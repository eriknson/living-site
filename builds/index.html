<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build History | Erik</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 800px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 2.5rem;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      color: #0066cc;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .back-link::before {
      content: "← ";
    }
    .builds-list {
      list-style: none;
    }
    .build-item {
      background: #fff;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .build-header {
      padding: 1rem 1.25rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .build-header:hover {
      background: #fafafa;
    }
    .build-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .build-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .build-status.success {
      background: #22c55e;
    }
    .build-status.failure {
      background: #ef4444;
    }
    .build-time {
      font-size: 0.9375rem;
      font-weight: 500;
    }
    .build-id {
      font-size: 0.75rem;
      color: #999;
      font-family: monospace;
    }
    .build-chevron {
      font-size: 0.75rem;
      color: #999;
      transition: transform 0.2s ease;
    }
    .build-item.open .build-chevron {
      transform: rotate(180deg);
    }
    .build-content {
      display: none;
      padding: 0 1.25rem 1.25rem;
      border-top: 1px solid #eee;
    }
    .build-item.open .build-content {
      display: block;
    }
    .build-output {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      border-radius: 6px;
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      font-size: 0.8125rem;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 400px;
      overflow-y: auto;
    }
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #666;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: #666;
    }
  </style>
</head>
<body>
  <a href="/" class="back-link">Back to site</a>
  
  <header>
    <h1>Build History</h1>
    <p class="subtitle">Agent-generated site builds</p>
  </header>
  
  <main>
    <div id="loading" class="loading">Loading build history...</div>
    <ul id="builds-list" class="builds-list" style="display: none;"></ul>
    <div id="empty-state" class="empty-state" style="display: none;">
      No builds yet. The site regenerates daily at 6am UTC.
    </div>
  </main>

  <script>
    async function loadBuilds() {
      const loadingEl = document.getElementById('loading');
      const listEl = document.getElementById('builds-list');
      const emptyEl = document.getElementById('empty-state');
      
      try {
        const response = await fetch('/builds/history.json');
        const data = await response.json();
        
        loadingEl.style.display = 'none';
        
        if (!data.builds || data.builds.length === 0) {
          emptyEl.style.display = 'block';
          return;
        }
        
        listEl.style.display = 'block';
        listEl.innerHTML = data.builds.map(build => `
          <li class="build-item" data-id="${build.id}">
            <div class="build-header" onclick="toggleBuild('${build.id}')">
              <div class="build-info">
                <span class="build-status ${build.status}"></span>
                <span class="build-time">${build.formatted_timestamp}</span>
                <span class="build-id">${build.id}</span>
              </div>
              <span class="build-chevron">▼</span>
            </div>
            <div class="build-content">
              <pre class="build-output">${escapeHtml(build.agent_output)}</pre>
            </div>
          </li>
        `).join('');
      } catch (err) {
        loadingEl.textContent = 'Failed to load build history';
        console.error('Failed to load builds:', err);
      }
    }
    
    function toggleBuild(id) {
      const item = document.querySelector(`.build-item[data-id="${id}"]`);
      if (item) {
        item.classList.toggle('open');
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    loadBuilds();
  </script>
</body>
</html>
