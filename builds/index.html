<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build History | Erik</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1rem;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 2rem;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: #0066cc;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .back-link::before {
      content: "← ";
    }
    .builds-list {
      list-style: none;
    }
    .build-item {
      background: #fff;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .build-header {
      padding: 0.875rem 1rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      user-select: none;
    }
    .build-header:hover {
      background: #fafafa;
    }
    .build-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }
    .build-time {
      font-size: 0.9375rem;
      font-weight: 500;
    }
    .build-meta {
      font-size: 0.8125rem;
      color: #666;
    }
    .build-chevron {
      font-size: 0.75rem;
      color: #999;
      transition: transform 0.2s ease;
      flex-shrink: 0;
      padding-top: 0.125rem;
    }
    .build-item.open .build-chevron {
      transform: rotate(180deg);
    }
    .build-content {
      display: none;
      padding: 0 1rem 1rem;
      border-top: 1px solid #eee;
    }
    .build-item.open .build-content {
      display: block;
    }
    .build-output {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      border-radius: 6px;
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      font-size: 0.75rem;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 400px;
      overflow-y: auto;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #666;
    }
    .loading {
      text-align: center;
      padding: 3rem 1rem;
      color: #666;
    }
    @media (max-width: 480px) {
      body {
        padding: 2rem 0.875rem;
      }
      .build-header {
        padding: 0.75rem;
      }
      .build-content {
        padding: 0 0.75rem 0.75rem;
      }
      .build-output {
        padding: 0.75rem;
        font-size: 0.6875rem;
      }
    }
  </style>
</head>
<body>
  <a href="/" class="back-link">Back to site</a>
  
  <header>
    <h1>Build History</h1>
    <p class="subtitle">Agent-generated site builds</p>
  </header>
  
  <main>
    <div id="loading" class="loading">Loading build history...</div>
    <ul id="builds-list" class="builds-list" style="display: none;"></ul>
    <div id="empty-state" class="empty-state" style="display: none;">
      No builds yet. The site regenerates daily at 6am UTC.
    </div>
  </main>

  <script>
    function relativeTime(timestamp) {
      const now = Date.now();
      const date = new Date(timestamp);
      const seconds = Math.floor((now - date.getTime()) / 1000);
      
      if (seconds < 60) return 'just now';
      if (seconds < 3600) {
        const mins = Math.floor(seconds / 60);
        return `${mins} minute${mins === 1 ? '' : 's'} ago`;
      }
      if (seconds < 86400) {
        const hours = Math.floor(seconds / 3600);
        return `${hours} hour${hours === 1 ? '' : 's'} ago`;
      }
      if (seconds < 604800) {
        const days = Math.floor(seconds / 86400);
        return `${days} day${days === 1 ? '' : 's'} ago`;
      }
      if (seconds < 2592000) {
        const weeks = Math.floor(seconds / 604800);
        return `${weeks} week${weeks === 1 ? '' : 's'} ago`;
      }
      const months = Math.floor(seconds / 2592000);
      return `${months} month${months === 1 ? '' : 's'} ago`;
    }
    
    function formatDuration(ms) {
      if (!ms) return '';
      const seconds = ms / 1000;
      return seconds < 10 ? seconds.toFixed(1) + 's' : Math.round(seconds) + 's';
    }
    
    function formatAgent(model) {
      if (!model) return 'Agent';
      return model.replace(/\s+/g, '-');
    }
    
    async function loadBuilds() {
      const loadingEl = document.getElementById('loading');
      const listEl = document.getElementById('builds-list');
      const emptyEl = document.getElementById('empty-state');
      
      try {
        const response = await fetch('/builds/history.json');
        const data = await response.json();
        
        loadingEl.style.display = 'none';
        
        if (!data.builds || data.builds.length === 0) {
          emptyEl.style.display = 'block';
          return;
        }
        
        listEl.style.display = 'block';
        listEl.innerHTML = data.builds.map(build => {
          const timeAgo = relativeTime(build.timestamp);
          const duration = formatDuration(build.duration_ms);
          const agent = formatAgent(build.model);
          const meta = duration ? `Built by ${agent} in ${duration}` : `Built by ${agent}`;
          
          return `
          <li class="build-item" data-id="${build.id}">
            <div class="build-header" onclick="toggleBuild('${build.id}')">
              <div class="build-info">
                <span class="build-time">${timeAgo}</span>
                <span class="build-meta">${meta}</span>
              </div>
              <span class="build-chevron">▼</span>
            </div>
            <div class="build-content">
              <pre class="build-output">${escapeHtml(build.agent_output)}</pre>
            </div>
          </li>
        `}).join('');
      } catch (err) {
        loadingEl.textContent = 'Failed to load build history';
        console.error('Failed to load builds:', err);
      }
    }
    
    function toggleBuild(id) {
      const item = document.querySelector(`.build-item[data-id="${id}"]`);
      if (item) {
        item.classList.toggle('open');
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    loadBuilds();
  </script>
</body>
</html>
