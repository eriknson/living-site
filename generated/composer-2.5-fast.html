<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erik Nilsson</title>
  <style>
  :root {
    --bg: #f4f0ea;
    --text: #141210;
    --muted: #6a6560;
    --slab: color(display-p3 0.98 0.18 0.42);
    --signal-a: color(display-p3 0.12 0.88 0.72);
    --signal-b: color(display-p3 0.95 0.78 0.08);
    --signal-c: color(display-p3 0.38 0.42 1);
    --link: color(display-p3 0.08 0.42 0.98);
    --max: 40rem;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121110;
      --text: #ede9e4;
      --muted: #8a8580;
      --slab: color(display-p3 1 0.22 0.48);
      --signal-a: color(display-p3 0.18 0.95 0.78);
      --signal-b: color(display-p3 1 0.86 0.12);
      --signal-c: color(display-p3 0.48 0.52 1);
      --link: color(display-p3 0.42 0.72 1);
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    line-height: 1.4;
    min-height: 100dvh;
  }

  .wrap {
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 1.25rem 4rem;
  }

  .slab {
    background: var(--slab);
    margin: 0 calc(-1 * 1.25rem);
    padding: 2.75rem 1.25rem 2.25rem;
    color: color(display-p3 1 1 1);
  }

  h1 {
    font-size: clamp(2.75rem, 11vw, 4.5rem);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 0.92;
  }

  .role {
    margin-top: 1rem;
    font-size: 0.8125rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.85;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-top: 2.5rem;
  }

  .signal {
    padding: 1.1rem 1rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.3;
    color: color(display-p3 0.06 0.06 0.08);
  }

  .signal:nth-child(1) { background: var(--signal-a); }
  .signal:nth-child(2) { background: var(--signal-b); }
  .signal:nth-child(3) { background: var(--signal-c); grid-column: 1 / -1; }

  .signal span {
    display: block;
    font-size: 1.625rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 0.2rem;
  }

  .note {
    margin-top: 2.5rem;
    font-size: 0.9375rem;
    max-width: 28ch;
    color: var(--muted);
  }

  .links {
    margin-top: 3rem;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 1.5rem;
  }

  .links a {
    color: var(--link);
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-decoration: none;
    text-transform: uppercase;
  }

  .links a:hover {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .stamp {
    margin-top: 4rem;
    font-size: 0.6875rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    .slab { padding: 2rem 1.25rem 1.75rem; }
    .grid { grid-template-columns: 1fr; }
    .signal:nth-child(3) { grid-column: auto; }
    .note { max-width: none; }
  }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="slab">
      <h1>Erik<br>Nilsson</h1>
      <p class="role">Product Designer · Cursor · SF</p>
    </header>

    <div class="grid" aria-label="Today">
      <div class="signal"><span>13°</span>overcast</div>
      <div class="signal"><span>summer</span>jun 21</div>
      <div class="signal"><span>fred again..</span>on repeat</div>
    </div>

    <p class="note">Designing how people build with AI. This page rebuilds daily.</p>

    <ul class="links">
      <li><a href="https://cursor.com">Cursor</a></li>
      <li><a href="https://x.com/flowstated">X</a></li>
      <li><a href="https://github.com/eriknson">GitHub</a></li>
      <li><a href="https://linkedin.com/in/eriknson">LinkedIn</a></li>
      <li><a href="mailto:contact@eriks.design">Email</a></li>
    </ul>

    <p class="stamp">living-site · 2026</p>
  </div>
</body>
</html>
