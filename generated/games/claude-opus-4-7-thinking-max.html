<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4ede2" media="(prefers-color-scheme: light)">
<title>PRISM — moodshard triage</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;
    overflow:hidden;
    background:#06080f;
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
    color:#fff;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
    touch-action:none;
  }
  @media (prefers-color-scheme: light){
    html,body{background:#efe2cd;color:#1a1a1a}
  }
  #game{
    position:fixed;inset:0;
    width:100dvw;height:100dvh;
    display:block;
    touch-action:none;
  }
  #safe-probe{
    position:fixed;visibility:hidden;pointer-events:none;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
</style>
</head>
<body>
<canvas id="game" aria-label="PRISM moodshard triage game"></canvas>
<div id="safe-probe"></div>
<script>
(()=>{
'use strict';

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', { alpha: false });
const safeProbe = document.getElementById('safe-probe');

let W = 0, H = 0, DPR = 1;
let safeT = 0, safeB = 0, safeL = 0, safeR = 0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  cvs.width = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const cs = getComputedStyle(safeProbe);
  safeT = parseFloat(cs.paddingTop) || 0;
  safeB = parseFloat(cs.paddingBottom) || 0;
  safeL = parseFloat(cs.paddingLeft) || 0;
  safeR = parseFloat(cs.paddingRight) || 0;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

let isDark = matchMedia('(prefers-color-scheme: dark)').matches;
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { isDark = e.matches; }); } catch(e){}

const GENRES = [
  { id:'dp', name:'dream pop',     short:'dream', c1:'#ff8fa8', c2:'#ffc7d4', cDark:'#ff6e8f', glow:'rgba(255,143,168,0.55)' },
  { id:'hs', name:'house stutter', short:'house', c1:'#4dd4e8', c2:'#aef0f4', cDark:'#2cc1d8', glow:'rgba(77,212,232,0.55)' },
  { id:'rc', name:'rap cadence',   short:'rap',   c1:'#ffc352', c2:'#ffe199', cDark:'#f5a82a', glow:'rgba(255,195,82,0.55)' }
];

const STATE_TITLE = 0, STATE_PLAY = 1, STATE_OVER = 2;

let state = STATE_TITLE;
let score = 0, bestScore = 0;
let lives = 3, wave = 1;
let shards = [];
let particles = [];
let scoreFloats = [];
let bgParticles = [];
let titleShards = [];
let waveData = null;
let spawnTimer = 0;
let zenTime = 0;
let comboCount = 0, bestCombo = 0;
let shake = 0;
let flashAmt = 0, flashColor = '#fff';
let lastTime = 0;
let titleTime = 0;
let waveAnnounceTime = 0, waveAnnounceText = '';
let binPulse = [0,0,0];
let binBadPulse = [0,0,0];
let timeNow = 0;
let runTime = 0;
let lastResult = null;
let finalWave = 1;

function hudTop(){ return Math.max(16, safeT + 10); }
function binH(){ return Math.max(110, Math.min(160, H * 0.18)); }
function binTopY(){ return H - binH() - Math.max(0, safeB); }
function arenaBottom(){ return binTopY(); }

function newWaveData(n){
  return {
    spawned: 0,
    target: Math.min(18, 5 + n),
    sorted: 0,
    perfect: true,
    baseSpeed: 65 + n * 7,
    interval: Math.max(0.45, 1.6 - n * 0.09),
    monoChance: n >= 4 ? Math.min(0.28, (n - 3) * 0.06) : 0,
    fakeChance: n >= 5 ? Math.min(0.24, (n - 4) * 0.05) : 0,
    rotChance: n >= 3 ? Math.min(0.4, (n - 2) * 0.08) : 0
  };
}

function spawnBgParticles(){
  bgParticles = [];
  const count = 36;
  for (let i = 0; i < count; i++){
    bgParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.6 + Math.random() * 1.6,
      vy: 6 + Math.random() * 14,
      vx: (Math.random() - 0.5) * 4,
      a: 0.06 + Math.random() * 0.16,
      hueShift: Math.random()
    });
  }
}
spawnBgParticles();

function spawnTitleShards(){
  titleShards = [];
  for (let i = 0; i < 4; i++){
    const g = GENRES[i % 3];
    titleShards.push({
      x: Math.random() * W,
      y: H * 0.05 + Math.random() * H * 0.9,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.5) * 14,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.4,
      size: 18 + Math.random() * 10,
      genre: g,
      foilOffset: Math.random() * Math.PI * 2,
      mono: false,
      isAmbient: true
    });
  }
}
spawnTitleShards();

// ---------- AUDIO ----------
const audio = {
  ctx: null,
  master: null,
  ready: false,
  enabled: true,
  init(){
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      this.ready = true;
    } catch(e){ this.enabled = false; }
  },
  resume(){
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type, vol, delay){
    if (!this.ready || !this.enabled) return;
    const t = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.18, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.05);
  },
  noise(dur, vol){
    if (!this.ready || !this.enabled) return;
    const t = this.ctx.currentTime;
    const bufferSize = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.value = vol || 0.15;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 1200;
    src.connect(f).connect(g).connect(this.master);
    src.start(t);
  },
  start(){ this.tone(440,0.08,'sine',0.12); this.tone(660,0.12,'sine',0.1,0.08); this.tone(880,0.16,'triangle',0.08,0.16); },
  correct(combo){
    const base = 523;
    const m = 1 + Math.min(8, combo) * 0.06;
    this.tone(base * m, 0.08, 'triangle', 0.16);
    this.tone(base * m * 1.5, 0.1, 'sine', 0.12, 0.02);
  },
  wrong(){
    this.tone(150,0.18,'sawtooth',0.18);
    this.tone(120,0.22,'sawtooth',0.12, 0.04);
    this.noise(0.15, 0.08);
  },
  grab(){ this.tone(880, 0.04, 'sine', 0.06); },
  release(){ this.tone(720, 0.04, 'sine', 0.05); },
  zen(){
    const notes = [392, 523, 659, 784, 988];
    notes.forEach((n,i)=> this.tone(n, 0.55, 'triangle', 0.12, i * 0.06));
  },
  wave(){ this.tone(330,0.1,'triangle',0.12); this.tone(440,0.12,'triangle',0.1,0.08); },
  over(){ [440,360,280,220,180].forEach((f,i)=> this.tone(f, 0.22, 'triangle', 0.16, i * 0.1)); }
};

// ---------- INPUT ----------
let grabbed = null;
let grabOffset = { x:0, y:0 };
let pointerDown = false;
let pointerHistory = [];
let pointerLast = { x:0, y:0 };
let downX = 0, downY = 0, downTime = 0;
let didDrag = false;

function clientPos(e){
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function findShardAt(x, y){
  let best = null;
  let bestD = Infinity;
  for (let i = shards.length - 1; i >= 0; i--){
    const s = shards[i];
    if (s.settled) continue;
    const dx = s.x - x, dy = s.y - y;
    const d = dx*dx + dy*dy;
    const grabR = (s.size + 18) * (s.size + 18);
    if (d < grabR && d < bestD){ bestD = d; best = s; }
  }
  return best;
}

function onDown(x, y){
  audio.init(); audio.resume();
  downX = x; downY = y; downTime = performance.now();
  didDrag = false;
  pointerDown = true;
  pointerLast = { x, y };
  pointerHistory = [{ x, y, t: downTime }];

  if (state === STATE_TITLE){
    return; // handled on up
  }
  if (state === STATE_OVER){
    if (hitRestartButton(x, y)) {
      pointerDown = false;
      startGame();
    }
    return;
  }

  const s = findShardAt(x, y);
  if (s){
    grabbed = s;
    s.grabbed = true;
    s.vx = 0; s.vy = 0;
    grabOffset = { x: s.x - x, y: s.y - y };
    s.grabBoost = 0;
    audio.grab();
  }
}

function onMove(x, y){
  const now = performance.now();
  pointerHistory.push({ x, y, t: now });
  while (pointerHistory.length > 2 && now - pointerHistory[0].t > 90) pointerHistory.shift();
  if (!didDrag && (Math.abs(x - downX) > 6 || Math.abs(y - downY) > 6)) didDrag = true;
  pointerLast = { x, y };

  if (grabbed){
    let nx = x + grabOffset.x;
    let ny = y + grabOffset.y;
    nx = Math.max(safeL + 28, Math.min(W - safeR - 28, nx));
    ny = Math.max(safeT + 28, Math.min(H - 28, ny));
    grabbed.x = nx;
    grabbed.y = ny;
  }
}

function onUp(x, y){
  pointerDown = false;
  const now = performance.now();
  const dragDist = Math.hypot((x||pointerLast.x) - downX, (y||pointerLast.y) - downY);

  if (state === STATE_TITLE){
    // Any tap starts game
    startGame();
    return;
  }
  if (state === STATE_OVER){
    return;
  }

  if (grabbed){
    let vx = 0, vy = 0;
    if (pointerHistory.length >= 2){
      const first = pointerHistory[0];
      const last = pointerHistory[pointerHistory.length - 1];
      const dt = (last.t - first.t) / 1000;
      if (dt > 0){
        vx = (last.x - first.x) / dt;
        vy = (last.y - first.y) / dt;
      }
    }
    // Cap velocity to keep things readable
    const cap = 1800;
    const mag = Math.hypot(vx, vy);
    if (mag > cap){ vx *= cap/mag; vy *= cap/mag; }
    // Slight boost for snappy flick
    grabbed.vx = vx * 1.05;
    grabbed.vy = vy * 1.05;
    grabbed.grabbed = false;
    grabbed.grabBoost = 0.35;
    grabbed = null;
    audio.release();
  } else {
    // Tap (no drag) — check if it's on a bin to send the lowest active shard there
    if (!didDrag && dragDist < 8){
      const py = y || pointerLast.y;
      const px = x || pointerLast.x;
      if (py >= binTopY() - 16){
        let bi = Math.floor(px / (W / 3));
        bi = Math.max(0, Math.min(2, bi));
        sendLowestShard(bi);
      }
    }
  }
}

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cvs.setPointerCapture(e.pointerId); } catch(_){}
  onDown(e.clientX, e.clientY);
}, { passive: false });
cvs.addEventListener('pointermove', e => {
  e.preventDefault();
  if (pointerDown) onMove(e.clientX, e.clientY);
}, { passive: false });
cvs.addEventListener('pointerup', e => {
  e.preventDefault();
  onUp(e.clientX, e.clientY);
}, { passive: false });
cvs.addEventListener('pointercancel', e => {
  e.preventDefault();
  onUp(pointerLast.x, pointerLast.y);
}, { passive: false });

window.addEventListener('keydown', (e) => {
  audio.init(); audio.resume();
  if (state === STATE_TITLE){
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); startGame(); }
    return;
  }
  if (state === STATE_OVER){
    if (e.key === ' ' || e.key === 'Enter' || e.key.toLowerCase() === 'r') { e.preventDefault(); startGame(); }
    return;
  }
  let target = -1;
  const k = e.key;
  if (k === 'a' || k === 'A' || k === '1' || k === 'ArrowLeft') target = 0;
  else if (k === 's' || k === 'S' || k === '2' || k === 'ArrowDown') target = 1;
  else if (k === 'd' || k === 'D' || k === '3' || k === 'ArrowRight') target = 2;
  if (target >= 0){ e.preventDefault(); sendLowestShard(target); }
});

function sendLowestShard(binIdx){
  let lowest = null;
  let lowY = -Infinity;
  for (const s of shards){
    if (s.settled || s.grabbed) continue;
    if (s.y > lowY){ lowY = s.y; lowest = s; }
  }
  if (!lowest) return;
  const w = W / 3;
  const targetX = (binIdx + 0.5) * w;
  const dx = targetX - lowest.x;
  const dy = binTopY() + 30 - lowest.y;
  const ay = Math.max(380, dy * 2.4);
  lowest.vx = dx * 2.4;
  lowest.vy = ay;
  lowest.grabBoost = 0.35;
  audio.release();
}

// ---------- GAME STATE ----------
function makeShard(){
  const gi = Math.floor(Math.random() * 3);
  const genre = GENRES[gi];
  const isMono = Math.random() < (waveData ? waveData.monoChance : 0);
  let fakeGenre = null;
  if (!isMono && Math.random() < (waveData ? waveData.fakeChance : 0)){
    const others = GENRES.filter(g => g.id !== genre.id);
    fakeGenre = others[Math.floor(Math.random() * others.length)];
  }
  const margin = 50 + safeL + safeR;
  const x = margin/2 + Math.random() * (W - margin);
  const size = 30 + Math.random() * 6;
  const baseSpeed = waveData ? waveData.baseSpeed : 70;
  const rotChance = waveData ? waveData.rotChance : 0;
  return {
    x, y: -60 - Math.random()*40,
    vx: (Math.random() - 0.5) * 20,
    vy: baseSpeed + Math.random() * 25,
    rot: Math.random() * Math.PI * 2,
    rotV: (Math.random() < rotChance ? (Math.random() - 0.5) * 2.2 : (Math.random() - 0.5) * 0.6),
    size,
    genre,
    fakeGenre,
    mono: isMono,
    grabbed: false,
    settled: false,
    sortProgress: 0,
    sortBin: null,
    correct: null,
    foilOffset: Math.random() * Math.PI * 2,
    age: 0,
    grabBoost: 0,
    spawnIn: 0.25
  };
}

function startGame(){
  state = STATE_PLAY;
  score = 0; lives = 3; wave = 1;
  shards = []; particles = []; scoreFloats = [];
  comboCount = 0; bestCombo = 0;
  shake = 0; flashAmt = 0;
  spawnTimer = 0; zenTime = 0; runTime = 0;
  waveData = newWaveData(wave);
  waveAnnounceTime = 1.4;
  waveAnnounceText = 'WAVE 1';
  binPulse = [0,0,0]; binBadPulse = [0,0,0];
  audio.init(); audio.resume();
  audio.start();
}

function gameOver(){
  state = STATE_OVER;
  finalWave = wave;
  if (score > bestScore) bestScore = score;
  audio.over();
}

function nextWave(){
  const wasPerfect = waveData.perfect;
  if (wasPerfect){
    zenTime = 2.2;
    const bonus = 40 + wave * 12;
    score += bonus;
    scoreFloats.push({
      x: W/2, y: H * 0.42,
      text: 'PERFECT WAVE  +' + bonus,
      life: 2.2, maxLife: 2.2, color: '#ffe199', big: true
    });
    flashAmt = 0.35; flashColor = '#ffe199';
    audio.zen();
    if (navigator.vibrate) navigator.vibrate([10,40,10,40,10]);
  } else {
    audio.wave();
  }
  wave++;
  waveData = newWaveData(wave);
  waveAnnounceTime = 1.3;
  waveAnnounceText = 'WAVE ' + wave;
}

function sortShard(s, binIdx){
  s.settled = true;
  s.sortBin = binIdx;
  const target = GENRES[binIdx];
  const correct = target.id === s.genre.id;
  s.correct = correct;
  s.sortProgress = 0;
  if (correct){
    comboCount++;
    if (comboCount > bestCombo) bestCombo = comboCount;
    const mult = 1 + Math.floor(comboCount / 3);
    const base = 10;
    let zenMul = (zenTime > 0) ? 2 : 1;
    const pts = base * mult * zenMul;
    score += pts;
    waveData.sorted++;
    scoreFloats.push({ x: s.x, y: s.y, text: '+' + pts + (mult > 1 ? '  ×' + mult : '') + (zenMul > 1 ? '  ZEN' : ''), life: 1.0, maxLife: 1.0, color: '#ffffff' });
    audio.correct(comboCount);
    if (navigator.vibrate) navigator.vibrate(8);
    spawnParticles(s.x, s.y, s.mono ? '#eef0f5' : s.genre.c1, 14, 2.6);
    flashAmt = Math.max(flashAmt, 0.12);
    flashColor = s.mono ? '#ffffff' : s.genre.c1;
    binPulse[binIdx] = 1;
  } else {
    waveData.perfect = false;
    comboCount = 0;
    lives--;
    scoreFloats.push({ x: s.x, y: s.y, text: 'MISFILE', life: 1.2, maxLife: 1.2, color: '#ff6f80' });
    audio.wrong();
    if (navigator.vibrate) navigator.vibrate([24, 36, 24]);
    spawnParticles(s.x, s.y, '#ff6f80', 18, 3);
    shake = 16;
    binBadPulse[binIdx] = 1;
    if (lives <= 0){
      setTimeout(gameOver, 200);
    }
  }
}

function spawnParticles(x, y, color, n, vel){
  vel = vel || 2.5;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = (0.4 + Math.random()) * vel;
    particles.push({
      x, y,
      vx: Math.cos(a) * s * 60,
      vy: Math.sin(a) * s * 60 - 40,
      life: 0.5 + Math.random() * 0.5,
      maxLife: 0.5 + Math.random() * 0.5,
      size: 2 + Math.random() * 3.5,
      color
    });
  }
}

function hitRestartButton(x, y){
  const r = getRestartRect();
  return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}
function getRestartRect(){
  const bw = Math.min(220, W * 0.62);
  const bh = 56;
  return { x: W/2 - bw/2, y: H * 0.66, w: bw, h: bh };
}

// ---------- UPDATE ----------
function update(dt){
  timeNow += dt;
  if (state === STATE_TITLE){
    titleTime += dt;
    for (const s of titleShards){
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += s.rotV * dt;
      if (s.x < s.size) { s.x = s.size; s.vx = Math.abs(s.vx); }
      if (s.x > W - s.size) { s.x = W - s.size; s.vx = -Math.abs(s.vx); }
      if (s.y < s.size) { s.y = s.size; s.vy = Math.abs(s.vy); }
      if (s.y > H - s.size) { s.y = H - s.size; s.vy = -Math.abs(s.vy); }
    }
    for (const p of bgParticles){
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.y > H + 4) { p.y = -6; p.x = Math.random() * W; }
      if (p.x < -4) p.x = W + 2;
      if (p.x > W + 4) p.x = -2;
    }
    return;
  }
  if (state === STATE_OVER){
    for (const p of particles){
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 360 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    for (const p of bgParticles){
      p.x += p.vx * dt;
      p.y += p.vy * dt * 0.4;
      if (p.y > H + 4) { p.y = -6; p.x = Math.random() * W; }
    }
    return;
  }

  // PLAYING
  runTime += dt;
  if (waveAnnounceTime > 0) waveAnnounceTime -= dt;

  let effDt = dt;
  if (zenTime > 0){
    effDt = dt * 0.32;
    zenTime -= dt;
  }

  // BG particles
  for (const p of bgParticles){
    p.x += p.vx * effDt;
    p.y += p.vy * effDt;
    if (p.y > H + 4) { p.y = -6; p.x = Math.random() * W; }
    if (p.x < -4) p.x = W + 2;
    if (p.x > W + 4) p.x = -2;
  }

  // Spawn
  spawnTimer += effDt;
  if (waveData.spawned < waveData.target){
    const iv = waveData.interval * (zenTime > 0 ? 1.4 : 1) * (waveAnnounceTime > 0 ? 1.6 : 1);
    if (spawnTimer >= iv){
      spawnTimer = 0;
      shards.push(makeShard());
      waveData.spawned++;
    }
  }

  // Update shards
  const binTop = binTopY();
  for (const s of shards){
    if (s.settled){
      s.sortProgress += dt * 3.5;
      continue;
    }
    if (s.spawnIn > 0) s.spawnIn -= dt;
    s.age += effDt;
    s.grabBoost = Math.max(0, s.grabBoost - dt * 2);

    if (s.grabbed){
      // Position set in onMove
      continue;
    }
    // Physics
    s.vy += 90 * effDt;
    if (s.vy > 720) s.vy = 720;
    s.x += s.vx * effDt;
    s.y += s.vy * effDt;
    s.rot += s.rotV * effDt;
    s.vx *= Math.pow(0.985, effDt * 60);

    // Walls
    if (s.x < 28){ s.x = 28; s.vx = Math.abs(s.vx) * 0.55; }
    if (s.x > W - 28){ s.x = W - 28; s.vx = -Math.abs(s.vx) * 0.55; }
    // Ceiling soft
    if (s.y < -120){ s.y = -100; s.vy = Math.max(40, s.vy); }

    // Settle check
    if (s.y > binTop + 8){
      let bi = Math.floor(s.x / (W / 3));
      bi = Math.max(0, Math.min(2, bi));
      sortShard(s, bi);
    }
    // Off bottom (shouldn't happen due to bin settle, but safety)
    if (s.y > H + 80){
      s.settled = true;
      s.sortProgress = 1.2;
      waveData.perfect = false;
      comboCount = 0;
      lives--;
      audio.wrong();
      if (lives <= 0) setTimeout(gameOver, 200);
    }
  }

  // Remove finished settled shards
  shards = shards.filter(s => !(s.settled && s.sortProgress >= 1));

  // Wave end
  if (waveData.spawned >= waveData.target && shards.length === 0 && lives > 0 && state === STATE_PLAY){
    nextWave();
  }

  // Particles
  for (const p of particles){
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 360 * dt;
    p.vx *= 0.985;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const sf of scoreFloats){
    sf.y -= 50 * dt;
    sf.life -= dt;
  }
  scoreFloats = scoreFloats.filter(sf => sf.life > 0);

  // Shake + flash decay
  shake *= Math.pow(0.0001, dt);
  if (shake < 0.05) shake = 0;
  flashAmt *= Math.pow(0.05, dt);
  for (let i = 0; i < 3; i++){
    binPulse[i] *= Math.pow(0.02, dt);
    binBadPulse[i] *= Math.pow(0.02, dt);
  }
}

// ---------- RENDER ----------
function bgColor(stop){
  if (isDark){
    return stop === 0 ? '#10182b' : '#04060c';
  }
  return stop === 0 ? '#f8ecd6' : '#e0c8aa';
}

function drawBackground(){
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, bgColor(0));
  grad.addColorStop(1, bgColor(1));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Soft horizontal scanline
  ctx.save();
  ctx.globalAlpha = isDark ? 0.04 : 0.06;
  for (let y = 0; y < H; y += 4){
    ctx.fillStyle = isDark ? '#ffffff' : '#000000';
    ctx.fillRect(0, y, W, 1);
  }
  ctx.restore();

  // Bin auras (vertical light columns)
  const bt = binTopY();
  for (let i = 0; i < 3; i++){
    const x = (i + 0.5) * (W / 3);
    const g = GENRES[i];
    const grd = ctx.createLinearGradient(x, bt - 280, x, bt + 20);
    const intensity = isDark ? 0.16 : 0.12;
    grd.addColorStop(0, g.c1 + '00');
    grd.addColorStop(1, g.c1 + Math.round(intensity * 255).toString(16).padStart(2,'0'));
    ctx.fillStyle = grd;
    const colW = W / 3;
    ctx.fillRect(i * colW, bt - 280, colW, 300);
  }

  // BG particles
  for (const p of bgParticles){
    ctx.fillStyle = isDark ? `rgba(180,205,230,${p.a})` : `rgba(120,90,70,${p.a * 0.7})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawBins(){
  const bt = binTopY();
  const bh = binH();
  const w = W / 3;
  for (let i = 0; i < 3; i++){
    const x = i * w;
    const g = GENRES[i];
    const pulse = binPulse[i];
    const bad = binBadPulse[i];

    // Bin panel
    const grad = ctx.createLinearGradient(0, bt, 0, H);
    const alpha1 = isDark ? 0.20 : 0.30;
    const alpha2 = isDark ? 0.06 : 0.10;
    grad.addColorStop(0, hexA(g.c1, alpha1 + pulse * 0.4));
    grad.addColorStop(1, hexA(g.c1, alpha2 + pulse * 0.2));
    ctx.fillStyle = grad;
    ctx.fillRect(x, bt, w, bh);

    // Bad pulse overlay
    if (bad > 0.02){
      ctx.fillStyle = hexA('#ff6f80', bad * 0.4);
      ctx.fillRect(x, bt, w, bh);
    }

    // Top edge line
    const lineW = w - 16;
    const cx = x + w/2;
    ctx.strokeStyle = hexA(g.c1, 0.9);
    ctx.lineWidth = 2 + pulse * 3;
    ctx.beginPath();
    ctx.moveTo(cx - lineW/2, bt);
    ctx.lineTo(cx + lineW/2, bt);
    ctx.stroke();

    // Small ticks
    ctx.strokeStyle = hexA(g.c1, 0.4);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx - lineW/2, bt - 4); ctx.lineTo(cx - lineW/2, bt + 6);
    ctx.moveTo(cx + lineW/2, bt - 4); ctx.lineTo(cx + lineW/2, bt + 6);
    ctx.stroke();

    // Divider between bins
    if (i > 0){
      ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.10)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, bt + 4);
      ctx.lineTo(x, H);
      ctx.stroke();
    }

    // Label (two-line for cleaner fit)
    ctx.fillStyle = g.c1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const parts = g.name.toUpperCase().split(' ');
    const fSize = Math.max(11, Math.min(14, w / 11));
    ctx.font = 'bold ' + fSize + 'px ui-monospace, monospace';
    const lblY = bt + bh * 0.32;
    ctx.fillText(parts[0], cx, lblY);
    ctx.fillText(parts[1] || '', cx, lblY + fSize + 3);

    // Hint
    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.45)';
    ctx.font = '10px ui-monospace, monospace';
    ctx.fillText(['◀ LEFT', '▼ CENTER', '▶ RIGHT'][i], cx, lblY + fSize * 2 + 14);

    // Key hint
    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.3)';
    ctx.font = '9px ui-monospace, monospace';
    ctx.fillText(['A · 1', 'S · 2', 'D · 3'][i], cx, lblY + fSize * 2 + 30);
  }
}

function drawShard(s){
  if (s.settled){
    drawSettledShard(s);
    return;
  }
  const r = s.size;
  const scale = s.grabbed ? 1.18 : (1 + s.grabBoost * 0.12);
  const breathing = 1 + Math.sin(timeNow * 2 + s.foilOffset) * 0.02;

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  ctx.scale(scale * breathing, scale * breathing);

  // Outer glow
  const glowColor = s.mono ? (isDark ? 'rgba(220,228,240,0.7)' : 'rgba(120,120,140,0.5)') : hexA(s.genre.c1, 0.8);
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 18 + (s.grabbed ? 14 : 0) + s.grabBoost * 12;

  // Hexagon
  const pts = [];
  for (let i = 0; i < 6; i++){
    const a = (i / 6) * Math.PI * 2 - Math.PI/2;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  ctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.closePath();

  // Foil gradient
  const t = timeNow * 1.4 + s.foilOffset;
  const gx = Math.cos(t) * r;
  const gy = Math.sin(t) * r;

  let c1, c2, c3;
  if (s.mono){
    c1 = isDark ? '#9aa3b4' : '#aaa0a0';
    c2 = isDark ? '#e8ecf2' : '#f4eee6';
    c3 = isDark ? '#6b7480' : '#857a72';
  } else {
    c1 = s.genre.c1;
    c2 = s.genre.c2;
    c3 = s.genre.cDark;
  }
  const grad = ctx.createLinearGradient(-gx, -gy, gx, gy);
  grad.addColorStop(0, hexA(c1, 0.85));
  grad.addColorStop(0.5, hexA(c2, 0.95));
  grad.addColorStop(1, hexA(c3, 0.85));
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.shadowBlur = 0;

  // Inner facet lines (prismatic refraction)
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++){
    ctx.beginPath();
    ctx.moveTo(pts[i].x, pts[i].y);
    ctx.lineTo(pts[i+3].x, pts[i+3].y);
    ctx.stroke();
  }

  // Highlight (small inner shape)
  ctx.beginPath();
  ctx.moveTo(-r*0.25, -r*0.45);
  ctx.lineTo(r*0.4, -r*0.15);
  ctx.lineTo(r*0.1, r*0.1);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();

  // Outer stroke
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.55)' : 'rgba(20,20,30,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.closePath();
  ctx.stroke();

  ctx.restore();

  // Active-shard indicator (lowest non-grabbed)
  if (s === lowestShardActive){
    ctx.save();
    ctx.translate(s.x, s.y);
    const ringR = s.size + 12 + Math.sin(timeNow * 6) * 1.5;
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.22)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, ringR, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Label (axis-aligned for readability) - stroked white text
  const labelGenre = s.fakeGenre || s.genre;
  const labelText = labelGenre.short.toUpperCase();
  ctx.save();
  ctx.font = 'bold 10px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.strokeText(labelText, s.x, s.y);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(labelText, s.x, s.y);
  ctx.restore();
}

function drawAmbientShard(s){
  const r = s.size;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  ctx.shadowColor = hexA(s.genre.c1, 0.6);
  ctx.shadowBlur = 14;
  const pts = [];
  for (let i = 0; i < 6; i++){
    const a = (i / 6) * Math.PI * 2 - Math.PI/2;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  ctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.closePath();
  const t = timeNow * 1.2 + s.foilOffset;
  const gx = Math.cos(t) * r;
  const gy = Math.sin(t) * r;
  const grad = ctx.createLinearGradient(-gx, -gy, gx, gy);
  grad.addColorStop(0, hexA(s.genre.c1, 0.8));
  grad.addColorStop(0.5, hexA(s.genre.c2, 0.9));
  grad.addColorStop(1, hexA(s.genre.cDark, 0.8));
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.4)' : 'rgba(20,20,30,0.25)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();
}

function drawSettledShard(s){
  // Shrink + fade into bin
  const p = Math.min(1, s.sortProgress);
  if (p >= 1) return;
  const sc = 1 - p * 0.85;
  const w = W / 3;
  const targetX = (s.sortBin + 0.5) * w;
  const targetY = binTopY() + binH() * 0.35;
  const ix = s.x + (targetX - s.x) * p;
  const iy = s.y + (targetY - s.y) * p;
  const alpha = 1 - p;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(ix, iy);
  ctx.rotate(s.rot + p * 2);
  ctx.scale(sc, sc);
  const r = s.size;
  ctx.shadowColor = s.correct ? (s.mono ? '#ffffff' : s.genre.c1) : '#ff6f80';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  for (let i = 0; i < 6; i++){
    const a = (i / 6) * Math.PI * 2 - Math.PI/2;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = s.correct ? hexA(s.mono ? '#eef0f5' : s.genre.c1, 0.9) : '#ff6f80';
  ctx.fill();
  ctx.restore();
}

function drawAimGuide(){
  if (!grabbed) return;
  const bi = Math.max(0, Math.min(2, Math.floor(grabbed.x / (W/3))));
  const tx = (bi + 0.5) * (W/3);
  const ty = binTopY() + 14;
  ctx.save();
  ctx.strokeStyle = hexA(grabbed.genre.c1, 0.55);
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 6]);
  ctx.beginPath();
  ctx.moveTo(grabbed.x, grabbed.y + grabbed.size);
  ctx.lineTo(tx, ty);
  ctx.stroke();
  ctx.setLineDash([]);

  // Bin highlight
  const w = W / 3;
  ctx.fillStyle = hexA(grabbed.genre.c1, 0.10);
  ctx.fillRect(bi * w, binTopY(), w, binH());
  ctx.restore();
}

function drawParticles(){
  for (const p of particles){
    const a = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = hexA(p.color, a);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawScoreFloats(){
  for (const sf of scoreFloats){
    const a = Math.max(0, sf.life / sf.maxLife);
    ctx.fillStyle = hexA(sf.color, a);
    ctx.font = sf.big ? 'bold ' + Math.max(18, Math.min(26, W * 0.06)) + 'px ui-monospace, monospace' : 'bold 14px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(sf.text, sf.x, sf.y);
  }
}

function drawHUD(){
  const top = hudTop();
  const padL = Math.max(14, safeL + 14);
  const padR = Math.max(14, safeR + 14);

  // Score
  ctx.fillStyle = isDark ? '#ffffff' : '#1a1a1a';
  ctx.font = 'bold ' + Math.max(20, Math.min(28, W * 0.07)) + 'px ui-monospace, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(String(score).padStart(4, '0'), padL, top);

  ctx.font = '10px ui-monospace, monospace';
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.55)';
  ctx.fillText('SCORE', padL, top + Math.max(28, Math.min(34, W * 0.085)));

  // Wave (center)
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px ui-monospace, monospace';
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.85)' : 'rgba(0,0,0,0.85)';
  ctx.fillText('WAVE ' + String(wave).padStart(2,'0'), W/2, top + 4);
  ctx.font = '10px ui-monospace, monospace';
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.5)';
  ctx.fillText(waveData.sorted + '/' + waveData.target, W/2, top + 22);

  // Lives (right) - hex pips
  ctx.textAlign = 'right';
  const livesY = top + 6;
  const px = W - padR;
  for (let i = 0; i < 3; i++){
    const lit = i < lives;
    const cx = px - (2 - i) * 22;
    drawMiniHex(cx, livesY + 8, 8, lit ? (isDark ? '#ffffff' : '#1a1a1a') : (isDark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.2)'), lit);
  }
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.55)';
  ctx.font = '10px ui-monospace, monospace';
  ctx.textAlign = 'right';
  ctx.fillText('LIVES', px, top + 24);

  // Combo
  if (comboCount >= 3){
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px ui-monospace, monospace';
    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.85)' : 'rgba(0,0,0,0.85)';
    ctx.fillText('COMBO ×' + comboCount, W/2, top + 42);
  }

  // Zen indicator
  if (zenTime > 0){
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px ui-monospace, monospace';
    ctx.fillStyle = '#ffe199';
    const a = Math.min(1, zenTime);
    ctx.globalAlpha = a;
    ctx.fillText('ZEN  ' + zenTime.toFixed(1) + 's', W/2, top + 58);
    ctx.globalAlpha = 1;
  }
}

function drawWaveAnnounce(){
  if (waveAnnounceTime <= 0) return;
  const a = Math.min(1, waveAnnounceTime * 1.4) * Math.min(1, (1.4 - waveAnnounceTime) * 2);
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, a));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = isDark ? '#ffffff' : '#1a1a1a';
  ctx.font = 'bold ' + Math.max(34, Math.min(54, W * 0.13)) + 'px ui-monospace, monospace';
  ctx.fillText(waveAnnounceText, W/2, H * 0.42);
  ctx.restore();
}

function drawMiniHex(cx, cy, r, color, filled){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  for (let i = 0; i < 6; i++){
    const a = (i / 6) * Math.PI * 2 - Math.PI/2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  if (filled){
    ctx.fillStyle = color;
    ctx.fill();
  } else {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.restore();
}

function drawFlash(){
  if (flashAmt < 0.01) return;
  ctx.fillStyle = hexA(flashColor, flashAmt);
  ctx.fillRect(0, 0, W, H);
}

function drawTitleScreen(){
  const cx = W/2;

  // Ambient title shards (subtle, no labels)
  for (const s of titleShards){
    ctx.save();
    ctx.globalAlpha = 0.28;
    drawAmbientShard(s);
    ctx.restore();
  }

  // Re-clear shard labels region with no extra (they got drawn fully)
  // Title block
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Big P R I S M
  const titleSize = Math.max(48, Math.min(86, W * 0.18));
  ctx.font = '900 ' + titleSize + 'px ui-monospace, monospace';
  ctx.fillStyle = isDark ? '#ffffff' : '#1a1a1a';
  ctx.fillText('PRISM', cx, H * 0.24);

  // Underline
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1.5;
  const lineW = Math.min(220, W * 0.5);
  ctx.beginPath();
  ctx.moveTo(cx - lineW/2, H * 0.24 + titleSize * 0.55);
  ctx.lineTo(cx + lineW/2, H * 0.24 + titleSize * 0.55);
  ctx.stroke();

  // Subtitle
  ctx.font = '12px ui-monospace, monospace';
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.6)';
  ctx.fillText('moodshard triage  ·  v1', cx, H * 0.24 + titleSize * 0.55 + 22);

  // How to
  ctx.font = '13px ui-monospace, monospace';
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.85)' : 'rgba(0,0,0,0.85)';
  ctx.fillText('flick each shard into its chute', cx, H * 0.41);
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.5)';
  ctx.font = '11px ui-monospace, monospace';
  ctx.fillText('drag · release · or tap a chute', cx, H * 0.41 + 20);
  ctx.fillText('three misfiles ends the run', cx, H * 0.41 + 38);

  // Mini diagram
  const dy = H * 0.55;
  const spread = Math.min(110, W * 0.26);
  for (let i = 0; i < 3; i++){
    const x = cx + (i - 1) * spread;
    // Mini shard
    ctx.save();
    ctx.translate(x, dy);
    const r = 16;
    ctx.shadowColor = GENRES[i].c1;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    for (let k = 0; k < 6; k++){
      const a = (k / 6) * Math.PI * 2 - Math.PI/2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    const gr = ctx.createLinearGradient(-r, -r, r, r);
    gr.addColorStop(0, GENRES[i].c1);
    gr.addColorStop(1, GENRES[i].c2);
    ctx.fillStyle = gr;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    // Arrow
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, dy + 22);
    ctx.lineTo(x, dy + 44);
    ctx.moveTo(x - 4, dy + 39);
    ctx.lineTo(x, dy + 44);
    ctx.lineTo(x + 4, dy + 39);
    ctx.stroke();

    // Chute label
    ctx.fillStyle = GENRES[i].c1;
    ctx.font = 'bold 11px ui-monospace, monospace';
    ctx.fillText(GENRES[i].short.toUpperCase(), x, dy + 58);
  }

  // Play prompt (blink)
  const blink = 0.65 + 0.35 * Math.sin(titleTime * 3);
  ctx.fillStyle = isDark ? `rgba(255,255,255,${blink})` : `rgba(0,0,0,${blink})`;
  ctx.font = 'bold ' + Math.max(15, Math.min(20, W * 0.05)) + 'px ui-monospace, monospace';
  ctx.fillText('▼  TAP TO PLAY  ▼', cx, H * 0.78);

  // Footer
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.32)';
  ctx.font = '10px ui-monospace, monospace';
  ctx.fillText('keyboard  ·  A · S · D  ·  or  ·  1 · 2 · 3', cx, H - Math.max(28, safeB + 22));
}

function drawGameOver(){
  const cx = W/2;
  // Dim
  ctx.fillStyle = isDark ? 'rgba(6,8,15,0.78)' : 'rgba(239,226,205,0.86)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = isDark ? '#ffffff' : '#1a1a1a';
  ctx.font = '900 ' + Math.max(34, Math.min(56, W * 0.12)) + 'px ui-monospace, monospace';
  ctx.fillText('GAME OVER', cx, H * 0.26);

  ctx.font = '12px ui-monospace, monospace';
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.5)';
  ctx.fillText('— moodshard triage —', cx, H * 0.26 + 36);

  // Stats card
  const sw = Math.min(280, W * 0.78);
  const sx = cx - sw/2;
  const sy = H * 0.36;
  const sh = 150;
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.05)';
  ctx.fillRect(sx, sy, sw, sh);
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1;
  ctx.strokeRect(sx, sy, sw, sh);

  ctx.font = '11px ui-monospace, monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.55)';
  ctx.fillText('SCORE', sx + 16, sy + 22);
  ctx.fillText('WAVE', sx + 16, sy + 60);
  ctx.fillText('BEST COMBO', sx + 16, sy + 98);
  ctx.fillText('BEST', sx + 16, sy + 130);

  ctx.textAlign = 'right';
  ctx.fillStyle = isDark ? '#ffffff' : '#1a1a1a';
  ctx.font = 'bold 22px ui-monospace, monospace';
  ctx.fillText(String(score), sx + sw - 16, sy + 22);
  ctx.font = 'bold 18px ui-monospace, monospace';
  ctx.fillText(String(finalWave), sx + sw - 16, sy + 60);
  ctx.fillText('×' + bestCombo, sx + sw - 16, sy + 98);
  ctx.fillText(String(bestScore), sx + sw - 16, sy + 130);

  // Restart button
  const r = getRestartRect();
  // Pulsing border
  const pulse = 0.6 + 0.4 * Math.sin(timeNow * 4);
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.08)';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = isDark ? `rgba(255,255,255,${0.5 + pulse * 0.3})` : `rgba(0,0,0,${0.5 + pulse * 0.3})`;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(r.x, r.y, r.w, r.h);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = isDark ? '#ffffff' : '#1a1a1a';
  ctx.font = 'bold 16px ui-monospace, monospace';
  ctx.fillText('▶  PLAY AGAIN', r.x + r.w/2, r.y + r.h/2);

  ctx.font = '10px ui-monospace, monospace';
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)';
  ctx.fillText('tap · or press R', cx, r.y + r.h + 18);
}

// Helper: hex color + alpha
function hexA(hex, a){
  if (hex.startsWith('rgba')) return hex;
  if (hex.length === 4){
    hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
  }
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${Math.max(0,Math.min(1,a))})`;
}

// Active shard for keyboard
let lowestShardActive = null;
function findActiveShard(){
  let low = null, lowY = -Infinity;
  for (const s of shards){
    if (s.settled || s.grabbed) continue;
    if (s.y > lowY) { lowY = s.y; low = s; }
  }
  lowestShardActive = low;
}

// ---------- MAIN LOOP ----------
function draw(){
  ctx.save();
  if (shake > 0.05){
    const sa = shake;
    ctx.translate((Math.random() - 0.5) * sa, (Math.random() - 0.5) * sa);
  }

  drawBackground();

  if (state === STATE_TITLE){
    drawTitleScreen();
  } else {
    drawBins();
    drawAimGuide();

    findActiveShard();
    // Draw shards (grabbed on top)
    for (const s of shards) { if (!s.grabbed) drawShard(s); }
    if (grabbed) drawShard(grabbed);
    drawParticles();
    drawScoreFloats();
    drawWaveAnnounce();
  }
  ctx.restore();

  if (state !== STATE_TITLE){
    drawHUD();
  }
  drawFlash();

  if (state === STATE_OVER){
    drawGameOver();
  }
}

function frame(now){
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  if (dt > 0.08) dt = 0.08;
  lastTime = now;
  try {
    update(dt);
    draw();
  } catch(err){
    console.error(err);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Prevent default touch behaviors on document
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

})();
</script>
