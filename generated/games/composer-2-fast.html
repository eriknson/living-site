<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Phosphor Tide</title>
  <style>
    :root {
      --bg: #0d1216;
      --bg2: #152025;
      --fg: #e7eef0;
      --muted: #8aa3a8;
      --accent: #6ee7d8;
      --accent2: #ffb59a;
      --danger: #ff6b5e;
      --glass: rgba(255,255,255,.06);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #e9ecee;
        --bg2: #dfe6ea;
        --fg: #1a2228;
        --muted: #5c6f76;
        --accent: #1fa896;
        --accent2: #e86848;
        --danger: #d94438;
        --glass: rgba(0,0,0,.05);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #wrap {
      width: 100dvw;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
    }
    .layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top))
               max(12px, env(safe-area-inset-right))
               max(12px, env(safe-area-inset-bottom))
               max(12px, env(safe-area-inset-left));
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      font-size: 13px;
      letter-spacing: .04em;
      color: var(--muted);
      transition: opacity .35s ease;
    }
    .hud strong { color: var(--fg); font-weight: 600; }
    .beat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .35;
      transition: transform .06s ease, opacity .06s;
    }
    .beat-dot.kick {
      transform: scale(1.9);
      opacity: 1;
      box-shadow: 0 0 14px var(--accent);
    }
    .overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in oklab, var(--bg) 82%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .4s ease, visibility .4s;
    }
    .overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .panel {
      pointer-events: auto;
      width: min(340px, 92%);
      padding: 28px 22px;
      border-radius: 18px;
      background: var(--glass);
      border: 1px solid color-mix(in oklab, var(--fg) 14%, transparent);
      text-align: center;
    }
    .panel h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .18em;
      margin-bottom: 10px;
      color: var(--fg);
    }
    .panel p {
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 18px;
    }
    button.primary {
      pointer-events: auto;
      min-height: 48px;
      min-width: 160px;
      padding: 0 22px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--accent), color-mix(in oklab, var(--accent2) 65%, var(--accent)));
      color: #081015;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      cursor: pointer;
      transition: transform .15s ease, filter .15s;
    }
    @media (prefers-color-scheme: light) {
      button.primary { color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.12); }
    }
    button.primary:active { transform: scale(.96); filter: brightness(1.05); }
    .hint {
      margin-top: 14px;
      font-size: 11px;
      color: var(--muted);
      opacity: .85;
    }
    #tip-go .hint { color: var(--accent2); }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" aria-label="Phosphor Tide game"></canvas>
    <div class="layer">
      <div class="hud" id="hud">
        <div><strong id="score">0</strong> seeds · tide <strong id="time">0.0</strong>s</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:11px;">gate</span>
          <div class="beat-dot" id="bd"></div>
        </div>
      </div>
      <div></div>
    </div>
    <div class="overlay show" id="titleOv">
      <div class="panel">
        <h1>PHOSPHOR TIDE</h1>
        <p>Drag anywhere — your droplet follows. Stay inside the luminous vein. Snag seeds on the bright pulse for combo juice. When the marine layer clamps, margins vanish.</p>
        <button type="button" class="primary" id="btnStart">ENTER THE VEIN</button>
        <div class="hint">Desktop: ← → or A D · ~45s tide</div>
      </div>
    </div>
    <div class="overlay" id="goOv">
      <div class="panel" id="tip-go">
        <h1 id="goHead">TIDE CLOSED</h1>
        <p id="goTxt"></p>
        <button type="button" class="primary" id="btnAgain">AGAIN</button>
        <div class="hint">Beat ~118 — glowing seeds love the kick.</div>
      </div>
    </div>
  </div>
  <script>
(function () {
  'use strict';

  var BPM = 118;
  var ROUND_TARGET = 46;
  var PLAYER_R = 11;
  var SEED_R = 9;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var hud = document.getElementById('hud');
  var elScore = document.getElementById('score');
  var elTime = document.getElementById('time');
  var elBd = document.getElementById('bd');
  var titleOv = document.getElementById('titleOv');
  var goOv = document.getElementById('goOv');
  var goTxt = document.getElementById('goTxt');
  var btnStart = document.getElementById('btnStart');
  var btnAgain = document.getElementById('btnAgain');

  var W = 1, H = 1, DPR = 1;
  var state = 'title';
  var t0 = 0;
  var now = 0;
  var runT = 0;
  var difficulty = 0;
  var score = 0;
  var combo = 0;
  var bestCombo = 0;
  var playerX = 0;
  var targetX = 0;
  var playerY = 0;
  var seeds = [];
  var particles = [];
  var shake = 0;
  var marine = 0;
  var windPhase = 0;
  var scroll = 0;
  var audioCtx = null;
  var beatGain = null;
  var beatHeld = false;
  var keys = { L: false, R: false };
  var schemeMq = window.matchMedia('(prefers-color-scheme: dark)');
  var goHead = document.getElementById('goHead');

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    var r = canvas.getBoundingClientRect();
    W = Math.max(120, Math.floor(r.width * DPR));
    H = Math.max(160, Math.floor(r.height * DPR));
    canvas.width = W;
    canvas.height = H;
    playerY = H * 0.72;
    if (state === 'title') {
      playerX = targetX = W * 0.5;
    }
  }

  function vibrate(p) {
    try {
      if (navigator.vibrate) navigator.vibrate(p);
    } catch (e) {}
  }

  function ensureAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      beatGain = audioCtx.createGain();
      beatGain.gain.value = 0.045;
      beatGain.connect(audioCtx.destination);
    } catch (e) {}
  }

  function beep(freq, dur, vol) {
    if (!audioCtx || !beatGain) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.value = vol || 0.08;
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(beatGain);
    o.start();
    o.stop(audioCtx.currentTime + dur + 0.02);
  }

  function pulseGate(playAudio) {
    elBd.classList.add('kick');
    if (playAudio && audioCtx && audioCtx.state === 'running') {
      beep(156, 0.045, 0.09);
      beep(392, 0.028, 0.04);
    }
    setTimeout(function () { elBd.classList.remove('kick'); }, 72);
  }

  function corridorAt(y, time) {
    var tide = Math.min(1, time / ROUND_TARGET);
    var mar = Math.max(0, time - 14) * 0.14;

    var braid = Math.sin(scroll * 0.018 + y * 0.009) * (26 + tide * 42);
    braid += Math.sin(scroll * 0.031 + y * 0.017 + 1.7) * (18 + tide * 28);

    var cx = W * 0.5 +
      Math.sin(windPhase * 0.7) * W * (0.07 + tide * 0.11) +
      Math.sin(time * 0.55 + y * 0.004) * (12 + tide * 22);

    var base = W * (0.34 - tide * 0.115 - mar * 0.004);
    base -= mar * 1.1;

    var wave =
      Math.sin(scroll * 0.024 + y * 0.011) * (34 + tide * 55) +
      Math.sin(scroll * 0.039 + y * 0.019 + 2.1) * (22 + tide * 36);

    var phaseShift = Math.sin(time * 1.1 + y * 0.007) * tide * 14;
    var half = Math.max(PLAYER_R * 2.2, base + wave * 0.5 + braid * 0.35 + phaseShift * 0.25);

    return { cx: cx, half: half };
  }

  function corridorPlayer(time) {
    return corridorAt(playerY, time);
  }

  function spawnSeed(time) {
    var co = corridorPlayer(time);
    var jitter = (Math.random() - 0.5) * co.half * 1.05;
    var x = co.cx + jitter;
    x = Math.max(PLAYER_R + 8, Math.min(W - PLAYER_R - 8, x));
    var onBeatAlign = Math.random() < 0.62;
    seeds.push({
      x: x,
      y: -20 - Math.random() * 40,
      vy: 55 + difficulty * 95 + Math.random() * 40,
      rad: SEED_R + Math.random() * 3,
      phase: onBeatAlign ? 0 : Math.PI * (0.85 + Math.random() * 0.3),
      alive: true
    });
  }

  function burst(x, y, col) {
    var n = 14;
    for (var i = 0; i < n; i++) {
      var a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * (120 + Math.random() * 160),
        vy: Math.sin(a) * (120 + Math.random() * 160),
        life: 0.35 + Math.random() * 0.25,
        col: col
      });
    }
  }

  function resetPlay() {
    score = 0;
    combo = 0;
    bestCombo = 0;
    seeds.length = 0;
    particles.length = 0;
    shake = 0;
    marine = 0;
    windPhase = Math.random() * 6;
    scroll = 0;
    runT = 0;
    playerX = targetX = W * 0.5;
    elScore.textContent = '0';
    elTime.textContent = '0.0';
    beatHeld = false;
  }

  function gameOver(msg) {
    state = 'dead';
    shake = 16;
    vibrate([42, 35, 42]);
    goHead.textContent = 'TIDE CLOSED';
    goTxt.textContent = msg + ' Final ' + score + ' seeds · best chain ×' + bestCombo + '.';
    goOv.classList.add('show');
    hud.style.opacity = '0.35';
  }

  function startGame() {
    ensureAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    titleOv.classList.remove('show');
    goOv.classList.remove('show');
    hud.style.opacity = '1';
    resetPlay();
    state = 'playing';
    t0 = performance.now();
  }

  function clientToWorldX(clientX) {
    var r = canvas.getBoundingClientRect();
    var x = (clientX - r.left) / r.width * W;
    return Math.max(PLAYER_R + 2, Math.min(W - PLAYER_R - 2, x));
  }

  function pointerEdge(ev) {
    if (ev.cancelable) ev.preventDefault();
  }

  canvas.addEventListener('pointerdown', function (e) {
    pointerEdge(e);
    canvas.setPointerCapture(e.pointerId);
    if (state !== 'playing') {
      startGame();
    }
    targetX = clientToWorldX(e.clientX);
  });
  canvas.addEventListener('pointermove', function (e) {
    pointerEdge(e);
    targetX = clientToWorldX(e.clientX);
  });
  canvas.addEventListener('pointerup', function (e) { pointerEdge(e); });
  canvas.addEventListener('pointercancel', function (e) { pointerEdge(e); });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.L = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.R = true;
    if (state !== 'playing' && (keys.L || keys.R)) startGame();
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.L = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.R = false;
  });

  btnStart.addEventListener('click', function (e) {
    e.preventDefault();
    startGame();
  });
  btnAgain.addEventListener('click', function (e) {
    e.preventDefault();
    startGame();
  });

  window.addEventListener('resize', resize);

  var beatMs = 60000 / BPM;

  function update(dt, time) {
    difficulty = Math.min(1, runT / ROUND_TARGET);
    marine = Math.max(0, runT - 14) * 0.14;
    windPhase += dt * (0.018 + difficulty * 0.022);
    scroll += dt * (42 + difficulty * 110);

    var kb = (keys.R ? 1 : 0) - (keys.L ? 1 : 0);
    if (kb) targetX += kb * W * 0.52 * dt;

    playerX += (targetX - playerX) * Math.min(1, dt * 14);

    var beatClock = ((time % beatMs) + beatMs) % beatMs;
    var nearKick = beatClock < 86;
    if (nearKick && !beatHeld) {
      beatHeld = true;
      pulseGate(state === 'playing');
    }
    if (!nearKick) beatHeld = false;

    var co = corridorPlayer(runT);
    var limL = co.cx - co.half + PLAYER_R;
    var limR = co.cx + co.half - PLAYER_R;
    if (playerX < limL || playerX > limR) {
      gameOver('Vein sheared.');
      return;
    }

    if (Math.random() < (0.85 + difficulty * 0.95) * dt) spawnSeed(runT);

    for (var i = seeds.length - 1; i >= 0; i--) {
      var s = seeds[i];
      if (!s.alive) continue;
      s.y += s.vy * dt;
      var beatPhase = Math.sin((time * (Math.PI * 2 / beatMs)) + s.phase);
      var glow = 0.55 + 0.45 * beatPhase;

      var dx = s.x - playerX;
      var dy = s.y - playerY;
      var hitR = PLAYER_R + s.rad + (nearKick && glow > 0.85 ? 10 : 4);
      if (dx * dx + dy * dy < hitR * hitR) {
        var onBeat = glow > 0.82;
        var mul = onBeat ? 2 : 1;
        combo = onBeat ? combo + 1 : 1;
        bestCombo = Math.max(bestCombo, combo);
        var pts = mul * (10 + Math.floor(combo * 0.5));
        score += pts;
        s.alive = false;
        burst(s.x, s.y, onBeat ? '#b9fff4' : '#ffc8a8');
        vibrate(onBeat ? [12, 20, 14] : [10]);
        if (audioCtx && audioCtx.state === 'running') {
          beep(onBeat ? 720 : 520, 0.06, onBeat ? 0.12 : 0.07);
        }
        elScore.textContent = String(score);
        seeds.splice(i, 1);
        continue;
      }
      if (s.y > H + 40) seeds.splice(i, 1);
    }

    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 180 * dt;
      if (p.life <= 0) particles.splice(j, 1);
    }

    elTime.textContent = runT.toFixed(1);

    if (runT >= ROUND_TARGET) {
      state = 'won';
      vibrate([20, 40, 20]);
      goHead.textContent = 'TIDE OUT';
      goTxt.textContent = 'You rode the phosphor seam — ' + score + ' seeds · ×' + bestCombo + ' peak pulse.';
      goOv.classList.add('show');
      hud.style.opacity = '0.45';
    }
  }

  function drawBg(dark) {
    var g = ctx.createLinearGradient(0, 0, W, H);
    if (dark) {
      g.addColorStop(0, '#0a1014');
      g.addColorStop(0.45, '#132024');
      g.addColorStop(1, '#0c161c');
    } else {
      g.addColorStop(0, '#dde4e8');
      g.addColorStop(0.5, '#cfd9df');
      g.addColorStop(1, '#e3eae9');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var marDraw = marine;
    var marineAlpha = Math.min(0.55, marDraw * 0.022);
    if (marineAlpha > 0) {
      var mg = ctx.createLinearGradient(0, 0, 0, H);
      mg.addColorStop(0, dark ? 'rgba(12,22,28,' + marineAlpha + ')' : 'rgba(180,190,195,' + marineAlpha + ')');
      mg.addColorStop(0.35, 'rgba(0,0,0,0)');
      mg.addColorStop(0.65, 'rgba(0,0,0,0)');
      mg.addColorStop(1, dark ? 'rgba(10,18,24,' + marineAlpha + ')' : 'rgba(175,185,190,' + marineAlpha + ')');
      ctx.fillStyle = mg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawCorridor(time, dark) {
    var step = 6;
    var fogL = dark ? 'rgba(16,28,32,.92)' : 'rgba(210,218,222,.94)';
    var vein = dark ? 'rgba(110,231,216,.08)' : 'rgba(31,168,150,.09)';

    ctx.save();
    ctx.fillStyle = vein;
    for (var y = 0; y <= H; y += step) {
      var c = corridorAt(y, time);
      ctx.fillRect(c.cx - c.half, y, c.half * 2, step + 1);
    }

    ctx.globalCompositeOperation = 'source-over';
    for (var y2 = 0; y2 <= H; y2 += step) {
      var c2 = corridorAt(y2, time);
      ctx.fillStyle = fogL;
      ctx.fillRect(0, y2, Math.max(0, c2.cx - c2.half), step + 1);
      ctx.fillRect(c2.cx + c2.half, y2, W - (c2.cx + c2.half), step + 1);
    }

    ctx.strokeStyle = dark ? 'rgba(180,240,230,.22)' : 'rgba(40,120,110,.28)';
    ctx.lineWidth = 2 * DPR;
    ctx.beginPath();
    for (var i = 0; i <= H; i += 10) {
      var ci = corridorAt(i, time);
      if (i === 0) ctx.moveTo(ci.cx - ci.half, i);
      else ctx.lineTo(ci.cx - ci.half, i);
    }
    ctx.stroke();
    ctx.beginPath();
    for (var j = 0; j <= H; j += 10) {
      var cj = corridorAt(j, time);
      if (j === 0) ctx.moveTo(cj.cx + cj.half, j);
      else ctx.lineTo(cj.cx + cj.half, j);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawSeeds(time, dark) {
    for (var i = 0; i < seeds.length; i++) {
      var s = seeds[i];
      if (!s.alive) continue;
      var glow = 0.55 + 0.45 * Math.sin((time * (Math.PI * 2 / beatMs)) + s.phase);
      var r = s.rad * (0.9 + 0.14 * glow);

      var cg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 2.4);
      cg.addColorStop(0, dark ? '#f4fffc' : '#fffdf8');
      cg.addColorStop(0.35, glow > 0.8 ? (dark ? '#7ee8dc' : '#2db8a8') : (dark ? '#ffc5a8' : '#e87858'));
      cg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = dark ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.6)';
      ctx.beginPath();
      ctx.arc(s.x - r * 0.25, s.y - r * 0.25, r * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlayer(dark) {
    var g = ctx.createRadialGradient(playerX - 4, playerY - 4, 2, playerX, playerY, PLAYER_R * 2.2);
    g.addColorStop(0, dark ? '#ffffff' : '#ffffff');
    g.addColorStop(0.45, dark ? '#b9fff4' : '#7fdccf');
    g.addColorStop(1, dark ? 'rgba(30,80,90,.15)' : 'rgba(60,140,130,.2)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(playerX, playerY, PLAYER_R * 1.35, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = dark ? 'rgba(255,255,255,.45)' : 'rgba(20,60,55,.35)';
    ctx.lineWidth = 1.5 * DPR;
    ctx.stroke();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life * 2.5);
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * DPR, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function loop(ts) {
    if (!t0) t0 = ts;
    var dt = Math.min(0.05, (ts - (loop.prev || ts)) / 1000);
    loop.prev = ts;
    now = ts;

    if (state === 'playing') {
      runT += dt;
      update(dt, ts - t0);
    } else if (state === 'title') {
      scroll += dt * 30;
      windPhase += dt * 0.4;
      difficulty = 0.38;
      marine = 1.55;
      playerX += (targetX - playerX) * Math.min(1, dt * 8);
      runT = 0;
      var demoBeat = ((ts - t0) % beatMs + beatMs) % beatMs;
      var dk = demoBeat < 86;
      if (dk && !beatHeld) {
        beatHeld = true;
        pulseGate(false);
      }
      if (!dk) beatHeld = false;
    }

    var sx = (Math.random() - 0.5) * shake;
    var sy = (Math.random() - 0.5) * shake;
    shake *= 0.88;

    ctx.save();
    ctx.translate(sx, sy);

    var simTime = state === 'playing' || state === 'won' || state === 'dead'
      ? runT
      : (ts - t0) * 0.001;
    var dark = schemeMq.matches;
    drawBg(dark);
    drawCorridor(simTime, dark);

    if (state === 'title' || state === 'playing' || state === 'won' || state === 'dead') {
      if (state !== 'title') drawSeeds(now - t0, dark);
      drawPlayer(dark);
      drawParticles();
    }

    ctx.restore();

    requestAnimationFrame(loop);
  }

  resize();
  targetX = playerX = W * 0.5;
  requestAnimationFrame(loop);
})();
  </script>
