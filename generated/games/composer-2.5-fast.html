<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Lane</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ui-bg:rgba(250,248,245,.92);
  --ui-text:#1a1a1a;
  --ui-muted:#5c5c5c;
  --btn-bg:#c47a2c;
  --btn-text:#fff;
  --btn-shadow:rgba(196,122,44,.35);
}
@media (prefers-color-scheme:dark){
  :root{
    --ui-bg:rgba(18,20,24,.94);
    --ui-text:#eceae6;
    --ui-muted:#9a9690;
    --btn-bg:#d4924a;
    --btn-text:#121418;
    --btn-shadow:rgba(212,146,74,.4);
  }
}
html,body{width:100dvw;height:100dvh;overflow:hidden;background:#8a939c;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#gameCanvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13px;line-height:1.4;color:var(--ui-text);text-shadow:0 1px 3px rgba(0,0,0,.25)}
.hud-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-muted)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:none;transition:opacity .35s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.panel{background:var(--ui-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:28px 24px 24px;max-width:min(340px,88vw);text-align:center;pointer-events:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.panel h1{font-size:1.5rem;font-weight:600;color:var(--ui-text);margin-bottom:6px;letter-spacing:-.02em}
.panel p{font-size:.85rem;color:var(--ui-muted);line-height:1.55;margin-bottom:18px}
.panel .score-final{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:2rem;color:var(--ui-text);margin:8px 0 4px}
.panel .score-label{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ui-muted);margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:160px;padding:0 28px;border:none;border-radius:999px;background:var(--btn-bg);color:var(--btn-text);font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 4px 16px var(--btn-shadow);transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:scale(.96)}
.hint{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;color:rgba(255,255,255,.55);pointer-events:none;z-index:3;transition:opacity .3s}
.hint.hidden{opacity:0}
.combo-flash{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 80%,rgba(255,180,80,.45),transparent 70%);pointer-events:none;z-index:1;opacity:0;transition:opacity .15s}
.combo-flash.on{opacity:1}
</style>
</head>
<body>
<canvas id="gameCanvas" aria-label="Fog Lane game"></canvas>
<div id="hud">
  <div class="hud-block"><div class="hud-label">Score</div><div id="scoreVal">0</div></div>
  <div class="hud-block" style="text-align:center"><div class="hud-label">Combo</div><div id="comboVal">×0</div></div>
  <div class="hud-block" style="text-align:right"><div class="hud-label">Time</div><div id="timeVal">45</div></div>
</div>
<div class="hint" id="hint">Swipe lanes · Tap gaps</div>
<div class="combo-flash" id="comboFlash"></div>
<div class="overlay" id="titleOverlay">
  <div class="panel">
    <h1>Fog Lane</h1>
    <p>Swipe between fog lanes over the bay. Tap when a warm gap opens to let sunrise through before the overcast closes.</p>
    <button class="btn" data-smoke="start" id="startBtn">Begin</button>
  </div>
</div>
<div class="overlay hidden" id="gameOverOverlay">
  <div class="panel">
    <h1>Overcast</h1>
    <div class="score-final" id="finalScore">0</div>
    <div class="score-label">Gaps cleared</div>
    <p id="gameOverMsg">The fog won this round.</p>
    <button class="btn" data-smoke="restart" id="restartBtn">Play Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('gameCanvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('scoreVal');
var comboEl = document.getElementById('comboVal');
var timeEl = document.getElementById('timeVal');
var hintEl = document.getElementById('hint');
var titleOverlay = document.getElementById('titleOverlay');
var gameOverOverlay = document.getElementById('gameOverOverlay');
var finalScoreEl = document.getElementById('finalScore');
var gameOverMsgEl = document.getElementById('gameOverMsg');
var comboFlashEl = document.getElementById('comboFlash');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');

var W = 390, H = 844;
var state = 'title';
var lane = 1;
var laneCount = 3;
var score = 0;
var combo = 0;
var maxCombo = 0;
var lives = 3;
var timeLeft = 45;
var warmth = 0;
var sunriseFlash = 0;
var shake = 0;
var elapsed = 0;
var difficulty = 0;
var fogSpeed = 90;
var spawnTimer = 0;
var spawnInterval = 1.8;
var gaps = [];
var particles = [];
var floatingTexts = [];
var playerPulse = 0;
var lastFrame = 0;
var lastDt = 0.016;
var audioCtx = null;

var touchStartX = 0, touchStartY = 0, touchStartT = 0;
var playerYRatio = 0.78;

function safeVibrate(ms){
  try{ if(typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function initAudio(){
  try{
    if(typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
  }catch(e){ audioCtx = null; }
}

function playTone(freq, dur, vol, type){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function resize(){
  if(!canvas) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 390;
  H = window.innerHeight || 844;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function laneX(l){
  var pad = W * 0.06;
  var usable = W - pad * 2;
  var lw = usable / laneCount;
  return pad + l * lw + lw * 0.5;
}

function laneWidth(){
  return (W - W * 0.12) / laneCount;
}

function playerY(){ return H * playerYRatio; }

function resetGame(){
  lane = 1;
  score = 0;
  combo = 0;
  maxCombo = 0;
  lives = 3;
  timeLeft = 45;
  warmth = 0;
  sunriseFlash = 0;
  shake = 0;
  elapsed = 0;
  difficulty = 0;
  fogSpeed = 90;
  spawnTimer = 0;
  spawnInterval = 1.8;
  gaps = [];
  particles = [];
  floatingTexts = [];
  playerPulse = 0;
  updateHUD();
}

function updateHUD(){
  if(scoreEl) scoreEl.textContent = String(score);
  if(comboEl) comboEl.textContent = '×' + combo;
  if(timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
}

function startGame(){
  resetGame();
  state = 'playing';
  if(titleOverlay) titleOverlay.classList.add('hidden');
  if(gameOverOverlay) gameOverOverlay.classList.add('hidden');
  if(hintEl) hintEl.classList.remove('hidden');
  initAudio();
  safeVibrate(20);
  spawnTimer = 0.4;
  gaps.push({
    lane: lane,
    y: H * 0.08,
    h: 58,
    decoy: false,
    pulse: 0,
    closed: false,
    id: 1
  });
  gaps.push({
    lane: (lane + 1) % laneCount,
    y: H * 0.02,
    h: 52,
    decoy: false,
    pulse: 1.2,
    closed: false,
    id: 2
  });
}

function endGame(msg){
  state = 'gameover';
  if(hintEl) hintEl.classList.add('hidden');
  if(gameOverOverlay) gameOverOverlay.classList.remove('hidden');
  if(finalScoreEl) finalScoreEl.textContent = String(score);
  if(gameOverMsgEl) gameOverMsgEl.textContent = msg || 'The fog won this round.';
  playTone(180, 0.4, 0.06, 'triangle');
}

function spawnGap(){
  var l = Math.floor(Math.random() * laneCount);
  var isDecoy = difficulty > 0.3 && Math.random() < 0.15 + difficulty * 0.25;
  var gh = 50 + Math.random() * 30;
  gaps.push({
    lane: l,
    y: -gh - 20,
    h: gh,
    decoy: isDecoy,
    pulse: Math.random() * Math.PI * 2,
    closed: false,
    id: Math.random()
  });
  if(difficulty > 0.5 && Math.random() < 0.35){
    var l2 = (l + 1 + Math.floor(Math.random() * (laneCount - 1))) % laneCount;
    gaps.push({
      lane: l2,
      y: -gh - 40 - Math.random() * 60,
      h: gh * 0.85,
      decoy: Math.random() < 0.6,
      pulse: Math.random() * Math.PI * 2,
      closed: false,
      id: Math.random()
    });
  }
}

function addParticles(x, y, color, n){
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 120;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 40,
      life: 0.5 + Math.random() * 0.5,
      maxLife: 0.5 + Math.random() * 0.5,
      r: 2 + Math.random() * 4,
      color: color
    });
  }
}

function addFloatText(x, y, text, color){
  floatingTexts.push({ x: x, y: y, text: text, life: 1, color: color || '#ffd080' });
}

function tryBurst(){
  if(state !== 'playing') return;
  var py = playerY();
  var tol = 55;
  var found = null;
  var bestDist = 9999;
  for(var i = 0; i < gaps.length; i++){
    var g = gaps[i];
    if(g.lane !== lane || g.closed) continue;
    var cy = g.y + g.h * 0.5;
    var dist = Math.abs(cy - py);
    if(dist < tol && dist < bestDist){
      bestDist = dist;
      found = g;
    }
  }
  if(!found){
    combo = 0;
    shake = 4;
    playerPulse = 0;
    playTone(120, 0.15, 0.05, 'square');
    safeVibrate(30);
    addFloatText(laneX(lane), py - 30, 'miss', '#aaa');
    updateHUD();
    return;
  }
  if(found.decoy){
    lives--;
    combo = 0;
    shake = 10;
    warmth = Math.max(0, warmth - 0.15);
    playTone(80, 0.3, 0.08, 'sawtooth');
    safeVibrate([40, 30, 40]);
    addFloatText(laneX(lane), py - 30, 'decoy!', '#c06040');
    addParticles(laneX(lane), py, '#886655', 12);
    found.closed = true;
    updateHUD();
    if(lives <= 0) endGame('Mistimed taps cost you three lives.');
    return;
  }
  found.closed = true;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  var pts = 10 + combo * 5;
  score += pts;
  warmth = Math.min(1, warmth + 0.12);
  playerPulse = 1;
  playTone(440 + combo * 30, 0.12, 0.07, 'sine');
  safeVibrate(15);
  addParticles(laneX(lane), py, '#ffb040', 16);
  addFloatText(laneX(lane), py - 40, '+' + pts, '#ffd080');
  if(combo >= 5 && combo % 5 === 0){
    sunriseFlash = 1.2;
    warmth = 1;
    if(comboFlashEl){ comboFlashEl.classList.add('on'); setTimeout(function(){ comboFlashEl.classList.remove('on'); }, 400); }
    playTone(660, 0.25, 0.09, 'sine');
    playTone(880, 0.35, 0.06, 'sine');
    safeVibrate([20, 40, 20]);
    addFloatText(W * 0.5, H * 0.35, 'shipping by sunrise', '#ffe0a0');
  }
  updateHUD();
}

function changeLane(dir){
  if(state !== 'playing') return;
  var nl = lane + dir;
  if(nl < 0 || nl >= laneCount) return;
  lane = nl;
  playTone(280, 0.06, 0.04, 'sine');
  safeVibrate(8);
}

function drawSky(t){
  if(!ctx) return;
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var baseTop = dark ? '#1a2030' : '#9aa8b5';
  var baseBot = dark ? '#2a3545' : '#b8c4cc';
  var warm = warmth * 0.35 + (sunriseFlash > 0 ? sunriseFlash * 0.5 : 0);
  var g = ctx.createLinearGradient(0, 0, 0, H * 0.65);
  g.addColorStop(0, lerpColor(baseTop, '#3a3028', warm));
  g.addColorStop(0.5, lerpColor(baseBot, '#6a5040', warm * 0.7));
  g.addColorStop(1, lerpColor('#687880', '#a07050', warm * 0.5));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if(sunriseFlash > 0){
    var sg = ctx.createLinearGradient(0, H * 0.45, 0, H * 0.75);
    sg.addColorStop(0, 'rgba(255,180,80,0)');
    sg.addColorStop(0.5, 'rgba(255,160,60,' + (sunriseFlash * 0.55) + ')');
    sg.addColorStop(1, 'rgba(255,120,40,' + (sunriseFlash * 0.3) + ')');
    ctx.fillStyle = sg;
    ctx.fillRect(0, H * 0.4, W, H * 0.4);
  }
}

function lerpColor(c1, c2, t){
  t = Math.max(0, Math.min(1, t));
  var a = hexToRgb(c1), b = hexToRgb(c2);
  if(!a) return c1;
  if(!b) return c2;
  var r = Math.round(a.r + (b.r - a.r) * t);
  var g = Math.round(a.g + (b.g - a.g) * t);
  var bl = Math.round(a.b + (b.b - a.b) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

function hexToRgb(h){
  if(!h || h.charAt(0) !== '#') return null;
  var x = h.slice(1);
  if(x.length === 3) x = x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
  var n = parseInt(x, 16);
  if(isNaN(n)) return null;
  return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };
}

function drawSkyline(){
  if(!ctx) return;
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var base = dark ? '#0e1218' : '#3d4850';
  var warmMix = warmth * 0.4;
  ctx.fillStyle = lerpColor(base, '#4a3828', warmMix);
  ctx.beginPath();
  ctx.moveTo(0, H);
  var pts = [
    [0, 0.62], [0.08, 0.58], [0.12, 0.61], [0.18, 0.52], [0.22, 0.54],
    [0.28, 0.48], [0.32, 0.50], [0.38, 0.55], [0.42, 0.53], [0.48, 0.47],
    [0.52, 0.49], [0.55, 0.56], [0.58, 0.44], [0.62, 0.46], [0.65, 0.52],
    [0.70, 0.50], [0.74, 0.57], [0.78, 0.54], [0.82, 0.60], [0.86, 0.55],
    [0.90, 0.58], [0.94, 0.62], [1, 0.60]
  ];
  for(var i = 0; i < pts.length; i++){
    ctx.lineTo(W * pts[i][0], H * pts[i][1]);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = lerpColor(dark ? '#1a2530' : '#5a6870', '#6a5038', warmMix * 0.6);
  ctx.beginPath();
  ctx.moveTo(W * 0.56, H * 0.56);
  ctx.lineTo(W * 0.585, H * 0.30);
  ctx.lineTo(W * 0.595, H * 0.30);
  ctx.lineTo(W * 0.62, H * 0.56);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = lerpColor(dark ? '#121820' : '#4a5560', '#5a4030', warmMix * 0.5);
  ctx.fillRect(0, H * 0.62, W, H * 0.38);
}

function drawLanes(){
  if(!ctx) return;
  var pad = W * 0.06;
  var lw = laneWidth();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for(var i = 1; i < laneCount; i++){
    var x = pad + i * lw;
    ctx.beginPath();
    ctx.moveTo(x, H * 0.15);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  var narrow = difficulty * 0.08;
  for(var j = 0; j < laneCount; j++){
    var cx = laneX(j);
    var hw = lw * (0.38 - narrow);
    if(j === lane){
      ctx.fillStyle = 'rgba(255,180,80,' + (0.06 + playerPulse * 0.08) + ')';
      ctx.fillRect(cx - hw, H * 0.12, hw * 2, H * 0.88);
    }
  }
}

function drawFogAndGaps(t){
  if(!ctx) return;
  var lw = laneWidth();
  var topY = H * 0.12;
  for(var li = 0; li < laneCount; li++){
    var cx = laneX(li);
    var hw = lw * 0.42;
    var left = cx - hw;
    ctx.fillStyle = 'rgba(165,175,188,0.52)';
    ctx.fillRect(left, topY, hw * 2, H - topY);
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    for(var gi = 0; gi < gaps.length; gi++){
      var gp = gaps[gi];
      if(gp.closed || gp.lane !== li) continue;
      ctx.fillRect(left + 1, gp.y, hw * 2 - 2, gp.h);
    }
    ctx.restore();
  }
  for(var i = 0; i < gaps.length; i++){
    var g = gaps[i];
    if(g.closed) continue;
    var cx = laneX(g.lane);
    var hw = lw * 0.42;
    var pulse = Math.sin(t * 4 + g.pulse) * 0.5 + 0.5;
    var gapCol = g.decoy
      ? 'rgba(190,150,115,' + (0.22 + pulse * 0.12) + ')'
      : 'rgba(255,188,95,' + (0.38 + pulse * 0.28 + warmth * 0.22) + ')';
    ctx.fillStyle = gapCol;
    ctx.fillRect(cx - hw, g.y, hw * 2, g.h);
    if(!g.decoy){
      ctx.strokeStyle = 'rgba(255,210,130,' + (0.35 + pulse * 0.35) + ')';
      ctx.lineWidth = 2;
      ctx.strokeRect(cx - hw + 3, g.y + 3, hw * 2 - 6, g.h - 6);
      ctx.fillStyle = 'rgba(255,220,150,' + (0.12 + pulse * 0.15) + ')';
      ctx.fillRect(cx - hw + 8, g.y + g.h * 0.35, hw * 2 - 16, g.h * 0.3);
    } else {
      ctx.strokeStyle = 'rgba(180,140,105,0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 5]);
      ctx.strokeRect(cx - hw + 3, g.y + 3, hw * 2 - 6, g.h - 6);
      ctx.setLineDash([]);
    }
  }
  ctx.fillStyle = 'rgba(200,210,220,0.06)';
  ctx.fillRect(0, topY, W, H - topY);
}

function drawPlayer(t){
  if(!ctx) return;
  var cx = laneX(lane);
  var cy = playerY();
  var pulse = Math.sin(t * 6) * 0.15 + 0.85 + playerPulse * 0.3;
  playerPulse *= 0.92;
  var r = 14 * pulse;
  var grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.5);
  grd.addColorStop(0, 'rgba(255,220,150,0.9)');
  grd.addColorStop(0.4, 'rgba(255,170,80,0.5)');
  grd.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffe8b0';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.arc(cx - 3, cy - 3, r * 0.35, 0, Math.PI * 2);
  ctx.fill();
  var tol = 55;
  ctx.strokeStyle = 'rgba(255,200,120,0.15)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 6]);
  ctx.beginPath();
  ctx.moveTo(cx - laneWidth() * 0.4, cy);
  ctx.lineTo(cx + laneWidth() * 0.4, cy);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawParticles(dt){
  if(!ctx) return;
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 80 * dt;
    var a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatingTexts(dt){
  if(!ctx) return;
  ctx.font = '600 14px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  for(var i = floatingTexts.length - 1; i >= 0; i--){
    var f = floatingTexts[i];
    f.life -= dt;
    if(f.life <= 0){ floatingTexts.splice(i, 1); continue; }
    ctx.globalAlpha = f.life;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y - (1 - f.life) * 30);
  }
  ctx.globalAlpha = 1;
}

function drawLives(){
  if(!ctx) return;
  for(var i = 0; i < 3; i++){
    ctx.fillStyle = i < lives ? 'rgba(255,180,100,0.8)' : 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.arc(W - 24 - i * 18, H - 24, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function update(dt, t){
  if(state !== 'playing') return;
  elapsed += dt;
  difficulty = Math.min(1, elapsed / 40);
  fogSpeed = 90 + difficulty * 110;
  spawnInterval = Math.max(0.7, 1.8 - difficulty * 1.0);
  timeLeft -= dt;
  if(timeLeft <= 0){
    timeLeft = 0;
    updateHUD();
    endGame('Sunrise window closed — ' + score + ' gaps cleared.');
    return;
  }
  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnGap();
    spawnTimer = spawnInterval;
  }
  if(sunriseFlash > 0) sunriseFlash -= dt;
  if(shake > 0) shake *= 0.85;
  for(var i = gaps.length - 1; i >= 0; i--){
    gaps[i].y += fogSpeed * dt;
    if(gaps[i].y > H + 100) gaps.splice(i, 1);
    else if(!gaps[i].closed && gaps[i].y + gaps[i].h < playerY() - 70){
      if(!gaps[i].decoy && gaps[i].lane === lane){
        lives--;
        combo = 0;
        shake = 8;
        playTone(100, 0.2, 0.06, 'square');
        safeVibrate(35);
        addFloatText(laneX(lane), playerY() - 20, 'too slow', '#aaa');
        gaps[i].closed = true;
        updateHUD();
        if(lives <= 0) endGame('The fog swallowed three gaps.');
      }
    }
  }
  updateHUD();
}

function draw(t){
  if(!ctx){
    if(canvas){ canvas.style.background = '#8a939c'; }
    return;
  }
  ctx.save();
  var sx = (Math.random() - 0.5) * shake;
  var sy = (Math.random() - 0.5) * shake;
  ctx.translate(sx, sy);
  drawSky(t);
  drawSkyline();
  drawLanes();
  if(state === 'playing' || state === 'gameover') drawFogAndGaps(t);
  if(state === 'playing') drawPlayer(t);
  drawParticles(lastDt);
  drawFloatingTexts(lastDt);
  if(state === 'playing') drawLives();
  ctx.restore();
}

function loop(now){
  if(!lastFrame) lastFrame = now;
  var dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  lastDt = dt;
  update(dt, now / 1000);
  draw(now / 1000);
  requestAnimationFrame(loop);
}

function handleSwipe(dx){
  if(Math.abs(dx) < 28) return false;
  changeLane(dx > 0 ? 1 : -1);
  return true;
}

function onTouchStart(e){
  if(e.cancelable) e.preventDefault();
  var t = e.changedTouches ? e.changedTouches[0] : e;
  if(!t) return;
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartT = Date.now();
}

function onTouchEnd(e){
  if(e.cancelable) e.preventDefault();
  var t = e.changedTouches ? e.changedTouches[0] : e;
  if(!t) return;
  var dx = t.clientX - touchStartX;
  var dy = t.clientY - touchStartY;
  var dt = Date.now() - touchStartT;
  if(!handleSwipe(dx)){
    if(Math.abs(dx) < 24 && Math.abs(dy) < 24 && dt < 350){
      tryBurst();
    }
  }
}

function onKeyDown(e){
  if(!e) return;
  var k = e.key;
  if(k === 'ArrowLeft'){ changeLane(-1); if(e.preventDefault) e.preventDefault(); }
  else if(k === 'ArrowRight'){ changeLane(1); if(e.preventDefault) e.preventDefault(); }
  else if(k === ' ' || k === 'Enter'){
    if(state === 'playing') tryBurst();
    if(e.preventDefault) e.preventDefault();
  }
}

if(startBtn) startBtn.addEventListener('click', function(e){ if(e && e.stopPropagation) e.stopPropagation(); startGame(); });
if(restartBtn) restartBtn.addEventListener('click', function(e){ if(e && e.stopPropagation) e.stopPropagation(); startGame(); });

if(canvas){
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('mousedown', function(e){
    touchStartX = e.clientX; touchStartY = e.clientY; touchStartT = Date.now();
  });
  canvas.addEventListener('mouseup', function(e){
    var dx = e.clientX - touchStartX;
    var dy = e.clientY - touchStartY;
    var dt = Date.now() - touchStartT;
    if(!handleSwipe(dx)){
      if(Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 350) tryBurst();
    }
  });
}

window.addEventListener('keydown', onKeyDown);
window.addEventListener('resize', resize);

resize();
draw(0);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
