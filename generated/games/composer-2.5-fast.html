<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Static Salvage</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#080810;--ghost:#c8d8e8;--neon:#00e5c0;--neon-dim:#008870;
  --noise:#ff4060;--noise-dim:#802030;--amber:#e8a030;
  --hud-bg:rgba(8,8,16,.82);--overlay:rgba(8,8,16,.88);
  --btn-bg:#00e5c0;--btn-text:#080810;--muted:#607080;
  --scanline:rgba(0,229,192,.03);--grid:rgba(0,229,192,.06);
}
@media(prefers-color-scheme:light){
  :root{
    --void:#eef2f0;--ghost:#1a2830;--neon:#007a68;--neon-dim:#005848;
    --noise:#c02040;--noise-dim:#902030;--amber:#b07018;
    --hud-bg:rgba(238,242,240,.9);--overlay:rgba(238,242,240,.92);
    --btn-bg:#007a68;--btn-text:#eef2f0;--muted:#607880;
    --scanline:rgba(0,122,104,.04);--grid:rgba(0,122,104,.08);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--ghost);
  font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
#scanlines{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,var(--scanline) 2px,var(--scanline) 4px);opacity:.6}
#hud{position:relative;z-index:3;display:flex;flex-direction:column;gap:6px;
  padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));flex-shrink:0;background:var(--hud-bg)}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud-item{display:flex;flex-direction:column;gap:1px}
.hud-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hud-value{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--neon)}
#clarity-dots{display:flex;gap:5px;align-items:center}
.clarity-dot{width:10px;height:10px;border-radius:50%;background:var(--neon);transition:background .2s,transform .2s}
.clarity-dot.lost{background:var(--noise-dim);transform:scale(.7)}
#timer-wrap{flex:1;max-width:120px;height:4px;background:var(--grid);border-radius:2px;overflow:hidden;margin:0 8px}
#timer-bar{height:100%;width:100%;background:var(--amber);border-radius:2px;transition:width .15s linear}
#sentence-panel{padding:8px 14px;padding-bottom:6px;flex-shrink:0;background:var(--hud-bg);z-index:3;position:relative}
#sentence-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#sentence-text{font-size:13px;line-height:1.5;color:var(--ghost);min-height:20px}
.word-caught{color:var(--neon);text-shadow:0 0 8px rgba(0,229,192,.4)}
.word-pending{color:var(--muted);opacity:.45}
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--overlay);pointer-events:none;
  transition:opacity .4s,visibility .4s}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-content{text-align:center;padding:28px 24px;max-width:360px;pointer-events:none}
.overlay-title{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ghost);margin-bottom:4px}
.overlay-title .accent{color:var(--neon)}
.overlay-sub{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:22px}
.overlay-hint{font-size:10px;color:var(--muted);margin-top:14px;line-height:1.45;opacity:.8}
.legend{display:flex;gap:16px;justify-content:center;margin-bottom:20px;font-size:11px}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:50%}
.legend-good{background:var(--neon);box-shadow:0 0 6px var(--neon)}
.legend-bad{background:var(--noise);box-shadow:0 0 6px var(--noise)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:168px;min-height:48px;
  padding:12px 28px;background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:6px;
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;pointer-events:auto;touch-action:manipulation;transition:transform .1s,box-shadow .1s}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
#go-stats{margin:14px 0 18px;font-size:13px;line-height:1.7;color:var(--ghost)}
#go-stats .val{color:var(--neon);font-weight:700}
#salvaged-quote{font-size:12px;color:var(--amber);font-style:italic;margin:10px 0 16px;line-height:1.5;
  padding:10px 14px;border-left:2px solid var(--neon-dim);text-align:left}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="scanlines"></div>
  <div id="hud">
    <div class="hud-row">
      <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="hud-score">0</span></div>
      <div id="timer-wrap"><div id="timer-bar"></div></div>
      <div class="hud-item" style="align-items:flex-end"><span class="hud-label">Combo</span><span class="hud-value" id="hud-combo">×1</span></div>
    </div>
    <div class="hud-row">
      <div class="hud-item"><span class="hud-label">Clarity</span>
        <div id="clarity-dots"><div class="clarity-dot"></div><div class="clarity-dot"></div><div class="clarity-dot"></div></div>
      </div>
      <div class="hud-item" style="align-items:flex-end"><span class="hud-label">Shards</span><span class="hud-value" id="hud-shards">0/0</span></div>
    </div>
  </div>
  <div id="sentence-panel">
    <div id="sentence-label">salvaging signal…</div>
    <div id="sentence-text"></div>
  </div>
  <div id="overlay-title" class="overlay">
    <div class="overlay-content">
      <div class="overlay-title">Static <span class="accent">Salvage</span></div>
      <div class="overlay-sub">Flash thought fragments rain through the terminal.<br>Tap coherent insight shards. Dodge the noise.</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot legend-good"></div><span>catch</span></div>
        <div class="legend-item"><div class="legend-dot legend-bad"></div><span>avoid</span></div>
      </div>
      <button class="btn" data-smoke="start" id="btn-start">Boot Sequence</button>
      <div class="overlay-hint">One-thumb tap · 45s per round · Salvage one brilliant sentence</div>
    </div>
  </div>
  <div id="overlay-go" class="overlay hidden">
    <div class="overlay-content">
      <div class="overlay-title" id="go-title">Signal Lost</div>
      <div id="salvaged-quote"></div>
      <div id="go-stats"></div>
      <button class="btn" data-smoke="restart" id="btn-restart">Reboot</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var SENTENCES = [
  { words: ['agents','wake','at','sunrise','from','pocket','screens'], quote: '"Spin up brilliance from a pocket screen."' },
  { words: ['flash','models','surface','in','autumn','clear','night'], quote: '"DeepSeek flash models surfacing overnight."' },
  { words: ['bay','wind','carries','coherent','thought','through','static'], quote: '"Thirteen-degree wind drifting off the bay."' },
  { words: ['super','intelligence','blooms','among','builders','by','dawn'], quote: '"Super intelligence trending among builders."' },
  { words: ['imagine','twenty','twenty','six','then','ship','it'], quote: '"Imagine 2026 — shipping by sunrise."' }
];

var NOISE_FRAGMENTS = [
  'undefined is not a function','Lorem ipsum dolor','NaN NaN NaN','404 brain not found',
  'null pointer exception','TODO: fix later','asdf jkl;','[object Object]',
  'segmentation fault','k8s pod crashloop','npm ERR! peer dep','git push --force',
  'WARNING: deprecated','stack overflow','malloc failed','connection reset',
  'rate limit exceeded','syntax error line 0','cannot read property',
  'unexpected token','ENOMEM','kernel panic','dbus timeout',
  'chmod 777 /','rm -rf /*','while(true){}','eval is evil',
  'crypto rugpull','vibe coded','hallucination detected','context window full'
];

var ROUND_MS = 45000;
var MAX_CLARITY = 3;
var FONT_BASE = 14;

var canvas, ctx, W, H, hudH, sentH;
var state = 'title';
var shards = [], particles = [];
var score = 0, combo = 1, clarity = MAX_CLARITY;
var caught = 0, targetWords = [], sentenceIdx = 0;
var roundStart = 0, lastSpawn = 0, spawnInterval = 900;
var fallSpeed = 55, decoyRatio = 0.35;
var shakeT = 0, hitPause = 0, flashT = 0, audioCtx = null;
var rafId = 0, resizeObs = null;

var el = {
  score: document.getElementById('hud-score'),
  combo: document.getElementById('hud-combo'),
  shards: document.getElementById('hud-shards'),
  timerBar: document.getElementById('timer-bar'),
  clarityDots: document.querySelectorAll('.clarity-dot'),
  sentenceText: document.getElementById('sentence-text'),
  overlayTitle: document.getElementById('overlay-title'),
  overlayGo: document.getElementById('overlay-go'),
  goTitle: document.getElementById('go-title'),
  goStats: document.getElementById('go-stats'),
  salvagedQuote: document.getElementById('salvaged-quote'),
  btnStart: document.getElementById('btn-start'),
  btnRestart: document.getElementById('btn-restart')
};

function initAudio(){
  try{
    if(typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
  }catch(e){ audioCtx = null; }
}

function playTone(freq, dur, type, vol){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var hud = document.getElementById('hud');
  var sent = document.getElementById('sentence-panel');
  hudH = hud ? hud.offsetHeight : 70;
  sentH = sent ? sent.offsetHeight : 50;
}

function pickSentence(){
  var s = SENTENCES[sentenceIdx % SENTENCES.length];
  sentenceIdx++;
  targetWords = s.words.slice();
  return s;
}

function renderSentenceDisplay(){
  var html = '';
  for(var i = 0; i < targetWords.length; i++){
    if(i > 0) html += ' ';
    if(i < caught){
      html += '<span class="word-caught">' + targetWords[i] + '</span>';
    } else {
      html += '<span class="word-pending">' + targetWords[i] + '</span>';
    }
  }
  el.sentenceText.innerHTML = html;
  el.shards.textContent = caught + '/' + targetWords.length;
}

function nextGoodWord(){
  if(caught >= targetWords.length) return null;
  return targetWords[caught];
}

function measureText(text, size){
  ctx.font = '600 ' + size + 'px ui-monospace, Menlo, Consolas, monospace';
  return ctx.measureText(text).width;
}

function spawnShard(forceGood){
  var playTop = hudH + sentH + 8;
  var playBot = H - 12;
  if(playBot - playTop < 60) return;

  var isGood = forceGood === true ? true : (forceGood === false ? false : Math.random() > decoyRatio);
  var text, wordIdx = -1;

  if(isGood){
    var word = nextGoodWord();
    if(!word){
      isGood = false;
    } else {
      text = word;
      wordIdx = caught;
    }
  }
  if(!isGood){
    text = NOISE_FRAGMENTS[Math.floor(Math.random() * NOISE_FRAGMENTS.length)];
  }

  var size = FONT_BASE + Math.random() * 4;
  var tw = measureText(text, size);
  var margin = tw / 2 + 16;
  var x = margin + Math.random() * (W - margin * 2);

  shards.push({
    x: x, y: playTop - 20 - Math.random() * 30,
    text: text, isGood: isGood, wordIdx: wordIdx,
    size: size, w: tw, speed: fallSpeed * (0.85 + Math.random() * 0.3),
    alpha: 1, pulse: Math.random() * Math.PI * 2,
    dissolve: 0, caught: false, drift: (Math.random() - 0.5) * 18
  });
}

function spawnBurst(x, y, color, n){
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 120;
    particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.4 + Math.random() * 0.4, maxLife: 0.8, color: color, size: 2 + Math.random() * 3
    });
  }
}

function loseClarity(){
  if(state !== 'playing') return;
  clarity--;
  for(var i = 0; i < el.clarityDots.length; i++){
    el.clarityDots[i].classList.toggle('lost', i >= clarity);
  }
  shakeT = 0.35;
  playTone(80, 0.25, 'sawtooth', 0.1);
  vibrate(80);
  combo = 1;
  el.combo.textContent = '×1';
  if(clarity <= 0) endGame(false);
}

function catchShard(idx){
  var s = shards[idx];
  if(s.caught) return;
  s.caught = true;

  if(s.isGood){
    caught++;
    combo = Math.min(combo + 1, 12);
    var pts = 100 * combo;
    score += pts;
    el.score.textContent = score;
    el.combo.textContent = '×' + combo;
    renderSentenceDisplay();
    spawnBurst(s.x, s.y, '#00e5c0', 14);
    hitPause = 0.06;
    flashT = 0.12;
    playTone(440 + combo * 30, 0.08, 'square', 0.07);
    vibrate(15);
    if(caught >= targetWords.length){
      score += 500 + Math.floor((ROUND_MS - (performance.now() - roundStart)) / 100);
      el.score.textContent = score;
      endGame(true);
    }
  } else {
    spawnBurst(s.x, s.y, '#ff4060', 10);
    loseClarity();
  }
  shards.splice(idx, 1);
}

function findShardAt(px, py){
  for(var i = shards.length - 1; i >= 0; i--){
    var s = shards[i];
    var hw = s.w / 2 + 14;
    var hh = s.size / 2 + 14;
    if(Math.abs(px - s.x) < hw && Math.abs(py - s.y) < hh) return i;
  }
  return -1;
}

function handleTap(clientX, clientY){
  if(state !== 'playing') return;
  var idx = findShardAt(clientX, clientY);
  if(idx >= 0) catchShard(idx);
}

function onPointerDown(e){
  e.preventDefault();
  var x = e.clientX, y = e.clientY;
  if(e.touches && e.touches.length) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
  handleTap(x, y);
}

function getColors(){
  var dark = true;
  try{ if(window.matchMedia) dark = window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){}
  return {
    neon: dark ? '#00e5c0' : '#007a68',
    noise: dark ? '#ff4060' : '#c02040',
    ghost: dark ? '#c8d8e8' : '#1a2830',
    void: dark ? '#080810' : '#eef2f0',
    grid: dark ? 'rgba(0,229,192,0.06)' : 'rgba(0,122,104,0.08)',
    amber: dark ? '#e8a030' : '#b07018'
  };
}

function drawBackground(c){
  ctx.fillStyle = c.void;
  ctx.fillRect(0, 0, W, H);

  var playTop = hudH + sentH;
  var playH = H - playTop;

  var grad = ctx.createLinearGradient(0, playTop, 0, H);
  grad.addColorStop(0, c.void);
  grad.addColorStop(1, c.void);
  ctx.fillStyle = grad;
  ctx.fillRect(0, playTop, W, playH);

  ctx.globalAlpha = 0.07;
  ctx.fillStyle = c.amber;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for(var bx = 0; bx <= W; bx += 40){
    var bh = 18 + Math.sin(bx * 0.02) * 8 + Math.sin(bx * 0.05) * 5;
    ctx.lineTo(bx, H - bh);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.strokeStyle = c.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, playTop); ctx.lineTo(W, playTop);
  ctx.stroke();

  var t = performance.now() * 0.001;
  ctx.globalAlpha = 0.035;
  for(var i = 0; i < 4; i++){
    var gy = playTop + ((t * 28 + i * 90) % playH);
    ctx.fillStyle = c.neon;
    ctx.fillRect(0, gy, W, 1);
  }
  ctx.globalAlpha = 1;

  if(flashT > 0){
    ctx.fillStyle = c.neon;
    ctx.globalAlpha = flashT * 0.15;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    flashT -= 0.016;
  }
}

function drawShard(s, c){
  if(s.caught) return;
  var glow = s.isGood ? c.neon : c.noise;
  var pulse = 0.7 + 0.3 * Math.sin(s.pulse + performance.now() * 0.004);

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.globalAlpha = s.alpha * (1 - s.dissolve * 0.8);

  ctx.font = '600 ' + s.size + 'px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.shadowColor = glow;
  ctx.shadowBlur = 12 * pulse;
  ctx.fillStyle = glow;
  ctx.fillText(s.text, 0, 0);

  if(!s.isGood){
    var glitch = Math.sin(s.pulse * 5) > 0.6 ? 3 : 0;
    ctx.globalAlpha *= 0.45;
    ctx.fillStyle = c.noise;
    ctx.fillText(s.text, glitch, 1);
    ctx.globalAlpha *= 0.5;
    ctx.fillText(s.text.slice(0, Math.max(3, s.text.length - 2)), -glitch, -1);
  }

  ctx.save();
  ctx.globalAlpha = s.alpha * 0.25 * (1 - s.dissolve * 0.8);
  ctx.strokeStyle = glow;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-s.w / 2, s.size * 0.6);
  ctx.lineTo(s.w / 2, s.size * 0.6);
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function drawParticles(){
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= 0.016;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * 0.016;
    p.y += p.vy * 0.016;
    p.vy += 120 * 0.016;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function update(dt){
  if(state !== 'playing') return;

  var elapsed = performance.now() - roundStart;
  var progress = Math.min(elapsed / ROUND_MS, 1);

  el.timerBar.style.width = ((1 - progress) * 100) + '%';

  if(progress >= 1){ endGame(caught >= targetWords.length); return; }

  fallSpeed = 55 + progress * 90;
  decoyRatio = 0.35 + progress * 0.4;
  spawnInterval = Math.max(350, 900 - progress * 550);

  if(performance.now() - lastSpawn > spawnInterval){
    lastSpawn = performance.now();
    var n = progress > 0.5 ? (Math.random() < 0.35 ? 2 : 1) : 1;
    for(var j = 0; j < n; j++) spawnShard();
    if(Math.random() < 0.15 + progress * 0.2) spawnShard(false);
  }

  var playBot = H - 16;
  for(var i = shards.length - 1; i >= 0; i--){
    var s = shards[i];
    s.y += s.speed * dt;
    s.x += s.drift * dt;
    s.pulse += dt * 3;

    if(s.y > playBot - 30){
      s.dissolve += dt * 2;
      s.alpha = Math.max(0, 1 - s.dissolve);
    }

    if(s.y > playBot + 20 || s.dissolve > 1){
      if(s.isGood && !s.caught && s.dissolve > 0.5){
        loseClarity();
      }
      shards.splice(i, 1);
    }
  }
}

function render(){
  var c = getColors();
  var sx = shakeT > 0 ? (Math.random() - 0.5) * 8 * shakeT : 0;
  var sy = shakeT > 0 ? (Math.random() - 0.5) * 6 * shakeT : 0;
  if(shakeT > 0) shakeT -= 0.016;

  ctx.save();
  ctx.translate(sx, sy);
  drawBackground(c);
  for(var i = 0; i < shards.length; i++) drawShard(shards[i], c);
  drawParticles();
  ctx.restore();
}

var lastTime = 0;
function loop(now){
  rafId = requestAnimationFrame(loop);
  if(hitPause > 0){ hitPause -= (now - lastTime) / 1000; lastTime = now; return; }
  var dt = Math.min((now - lastTime) / 1000, 0.05);
  if(lastTime === 0) dt = 0.016;
  lastTime = now;
  update(dt);
  render();
}

function startGame(){
  var sent = pickSentence();
  shards = []; particles = [];
  score = 0; combo = 1; clarity = MAX_CLARITY; caught = 0;
  fallSpeed = 55; decoyRatio = 0.35; spawnInterval = 900;
  shakeT = 0; hitPause = 0;
  roundStart = performance.now();
  lastSpawn = roundStart - 500;

  el.score.textContent = '0';
  el.combo.textContent = '×1';
  el.timerBar.style.width = '100%';
  for(var i = 0; i < el.clarityDots.length; i++) el.clarityDots[i].classList.remove('lost');
  renderSentenceDisplay();

  el.overlayTitle.classList.add('hidden');
  el.overlayGo.classList.add('hidden');
  state = 'playing';

  for(var w = 0; w < 3; w++) spawnShard(true);

  initAudio();
  playTone(220, 0.15, 'sine', 0.06);
  setTimeout(function(){ playTone(330, 0.15, 'sine', 0.06); }, 80);
  setTimeout(function(){ playTone(440, 0.2, 'sine', 0.07); }, 160);
}

function endGame(won){
  if(state === 'gameover') return;
  state = 'gameover';

  var sent = SENTENCES[(sentenceIdx - 1 + SENTENCES.length) % SENTENCES.length];
  el.goTitle.textContent = won ? 'Signal Salvaged' : 'Signal Lost';
  el.salvagedQuote.textContent = won ? sent.quote : (caught > 0 ? 'Partial: "' + targetWords.slice(0, caught).join(' ') + '…"' : 'Only static remains.');

  el.goStats.innerHTML =
    'Score <span class="val">' + score + '</span> · ' +
    'Best combo <span class="val">×' + combo + '</span><br>' +
    'Words caught <span class="val">' + caught + '/' + targetWords.length + '</span>';

  el.overlayGo.classList.remove('hidden');
  playTone(won ? 523 : 150, won ? 0.3 : 0.4, won ? 'sine' : 'sawtooth', 0.08);
  if(won) vibrate([30, 20, 30]);
}

function resetToTitle(){
  shards = []; particles = [];
  state = 'title';
  el.overlayGo.classList.add('hidden');
  el.overlayTitle.classList.remove('hidden');
}

canvas = document.getElementById('gameCanvas');
if(canvas && canvas.getContext){
  ctx = canvas.getContext('2d');
}

if(!ctx){
  document.body.innerHTML = '<div style="padding:24px;font-family:monospace">Canvas unavailable.</div>';
} else {
  resize();
  window.addEventListener('resize', resize);
  canvas.addEventListener('pointerdown', onPointerDown, {passive: false});
  canvas.addEventListener('touchstart', onPointerDown, {passive: false});

  el.btnStart.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });
  el.btnRestart.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });

  document.addEventListener('keydown', function(e){
    if(e.code === 'Space'){
      e.preventDefault();
      if(state === 'title') startGame();
      else if(state === 'gameover') startGame();
    }
  });

  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(state === 'playing') render(); });
  }

  renderSentenceDisplay();
  targetWords = SENTENCES[0].words;
  render();
  lastTime = 0;
  rafId = requestAnimationFrame(loop);
}

})();
</script>
</body>
</html>
