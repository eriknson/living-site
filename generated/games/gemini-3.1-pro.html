<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sorting Flow</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --line-color: #dee2e6;
            --text-color: #212529;
            --ui-bg: rgba(248, 249, 250, 0.85);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --line-color: #2b3035;
                --text-color: #f8f9fa;
                --ui-bg: rgba(18, 18, 18, 0.85);
            }
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--ui-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        #ui.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            font-weight: 800;
        }
        p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }
        .btn {
            pointer-events: auto;
            padding: 1.2rem 2.5rem;
            font-size: 1.2rem;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn:active {
            transform: scale(0.92);
        }
        #score-display {
            position: absolute;
            top: 15%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 4rem;
            font-weight: 800;
            opacity: 0.1;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.2); opacity: 0.3; }
            100% { transform: scale(1); opacity: 0.1; }
        }
        .pop {
            animation: pop 0.2s ease-out;
        }
    </style>
</head>
<body>
    <div id="score-display">0</div>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="start-screen" class="screen">
            <h1>SORTING FLOW</h1>
            <p>Swipe Left/Right to shift targets.<br>Match the falling notes.</p>
            <button class="btn" id="start-btn">PLAY</button>
        </div>
        <div id="game-over-screen" class="screen" style="display: none;">
            <h1>GAME OVER</h1>
            <p>Score: <span id="final-score">0</span></p>
            <button class="btn" id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function getThemeColor(name) {
            return getComputedStyle(document.body).getPropertyValue(name).trim();
        }

        const colors = [
            '#ff4757', // Coral
            '#ffa502', // Sunflower
            '#2ed573', // Mint
            '#1e90ff'  // Sky
        ];

        function getColor(index) {
            return colors[((index % 4) + 4) % 4];
        }

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(lane) {
            if (!audioCtx) return;
            const freqs = [261.63, 293.66, 329.63, 392.00];
            const freq = freqs[lane % 4];
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = freq;
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playGameOver() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function vibrate(ms) {
            if (navigator.vibrate) {
                navigator.vibrate(ms);
            }
        }

        let state = 'START';
        let score = 0;
        let notes = [];
        let particles = [];
        let targetShift = 0;
        let visualShift = 0;
        let spawnTimer = 0;
        
        let lastTime = 0;
        let reqId;

        function startGame() {
            initAudio();
            state = 'PLAYING';
            score = 0;
            notes = [];
            particles = [];
            targetShift = 0;
            visualShift = 0;
            spawnTimer = 1.0;
            
            document.getElementById('score-display').innerText = '0';
            document.getElementById('ui').classList.add('hidden');
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            
            if (!reqId) {
                lastTime = performance.now();
                reqId = requestAnimationFrame(loop);
            }
        }

        function setGameOver() {
            state = 'GAMEOVER';
            document.getElementById('final-score').innerText = score;
            document.getElementById('ui').classList.remove('hidden');
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function spawnNotes() {
            let shift = Math.floor(Math.random() * 4);
            let count = 1;
            if (score > 15) count = Math.random() < 0.5 ? 2 : 1;
            if (score > 40) count = Math.random() < 0.3 ? 3 : (Math.random() < 0.5 ? 2 : 1);
            
            let availableLanes = [0, 1, 2, 3];
            for (let i = availableLanes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableLanes[i], availableLanes[j]] = [availableLanes[j], availableLanes[i]];
            }
            
            for (let i = 0; i < count; i++) {
                let lane = availableLanes[i];
                let color = getColor(lane + shift);
                notes.push({
                    lane: lane,
                    color: color,
                    y: -50
                });
            }
        }

        function spawnHitParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 200,
                    vy: (Math.random() - 0.5) * 200,
                    life: 1.0,
                    color: color
                });
            }
        }

        function spawnMissParticles(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 300,
                    vy: (Math.random() - 0.5) * 300,
                    life: 1.0,
                    color: '#868e96'
                });
            }
        }

        function update(dt) {
            // Update particles regardless of state
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (state !== 'PLAYING') return;
            
            visualShift += (targetShift - visualShift) * 15 * dt;
            
            let speed = Math.min(800, 250 + score * 5);
            let distance = Math.max(200, 450 - score * 4);
            let spawnInterval = distance / speed;
            
            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                spawnNotes();
                spawnTimer = spawnInterval;
            }
            
            let targetY = height * 0.85;
            let hitZoneTop = targetY - 40;
            let hitZoneBottom = targetY + 40;
            let laneWidth = width / 4;
            
            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                note.y += speed * dt;
                
                let x = note.lane * laneWidth + laneWidth / 2;
                
                if (note.y > hitZoneTop && note.y < hitZoneBottom) {
                    let targetColor = getColor(note.lane + targetShift);
                    if (note.color === targetColor) {
                        score++;
                        let scoreEl = document.getElementById('score-display');
                        scoreEl.innerText = score;
                        scoreEl.classList.remove('pop');
                        void scoreEl.offsetWidth;
                        scoreEl.classList.add('pop');
                        
                        playTone(note.lane);
                        vibrate(10);
                        spawnHitParticles(x, targetY, note.color);
                        notes.splice(i, 1);
                        continue;
                    }
                }
                
                if (note.y >= hitZoneBottom) {
                    playGameOver();
                    vibrate(50);
                    spawnMissParticles(x, note.y);
                    notes.splice(i, 1);
                    setGameOver();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            let lineColor = getThemeColor('--line-color');
            let laneWidth = width / 4;
            
            // Draw staff lines
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i <= 4; i++) {
                let x = i * laneWidth;
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            ctx.stroke();
            
            let targetY = height * 0.85;
            let hitZoneTop = targetY - 40;
            let hitZoneBottom = targetY + 40;
            
            // Draw hit zone
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, hitZoneTop);
            ctx.lineTo(width, hitZoneTop);
            ctx.moveTo(0, hitZoneBottom);
            ctx.lineTo(width, hitZoneBottom);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Draw targets
            let startI = Math.floor(visualShift) - 1;
            let endI = Math.ceil(visualShift) + 4;
            let pulse = Math.sin(Date.now() / 200) * 2;
            
            for (let i = startI; i <= endI; i++) {
                let x = (i - visualShift) * laneWidth + laneWidth / 2;
                let color = getColor(i);
                
                ctx.beginPath();
                ctx.arc(x, targetY, 25 + pulse, 0, Math.PI * 2);
                ctx.lineWidth = 6;
                ctx.strokeStyle = color;
                ctx.stroke();
            }
            
            // Draw notes
            for (let note of notes) {
                let x = note.lane * laneWidth + laneWidth / 2;
                let y = note.y;
                
                ctx.fillStyle = note.color;
                
                // Note head
                ctx.beginPath();
                ctx.ellipse(x, y, 16, 12, -Math.PI / 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Stem
                ctx.beginPath();
                ctx.moveTo(x + 12, y - 5);
                ctx.lineTo(x + 12, y - 45);
                ctx.lineWidth = 4;
                ctx.strokeStyle = note.color;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
            
            // Draw particles
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        function loop(time) {
            let dt = (time - lastTime) / 1000;
            lastTime = time;
            if (dt > 0.1) dt = 0.1;
            
            update(dt);
            draw();
            
            reqId = requestAnimationFrame(loop);
        }

        // Controls
        let touchStartX = 0;
        let swipeThreshold = 50;

        window.addEventListener('touchstart', (e) => {
            if (state !== 'PLAYING') return;
            touchStartX = e.touches[0].clientX;
            swipeThreshold = Math.min(60, width / 6);
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if (state !== 'PLAYING') return;
            e.preventDefault();
            let currentX = e.touches[0].clientX;
            let deltaX = currentX - touchStartX;
            
            if (Math.abs(deltaX) > swipeThreshold) {
                if (deltaX > 0) {
                    targetShift--;
                } else {
                    targetShift++;
                }
                touchStartX = currentX;
            }
        }, {passive: false});

        window.addEventListener('keydown', (e) => {
            if (state !== 'PLAYING') return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                targetShift++;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                targetShift--;
            }
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        
        // Initial draw
        draw();
    </script>
</body>
</html>
