<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ricochet Patch</title>
    <style>
        :root {
            --bg-color: #f0fcf0;
            --fg-color: #008800;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #051005;
                --fg-color: #33ff33;
            }
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--fg-color);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        .screen {
            background: var(--bg-color);
            padding: 2rem;
            border: 1px solid var(--fg-color);
            max-width: 80%;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 136, 0, 0.2);
        }
        
        @media (prefers-color-scheme: dark) {
            .screen {
                box-shadow: 0 0 20px rgba(51, 255, 51, 0.2);
            }
        }
        
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--fg-color);
        }
        
        p {
            font-size: 1rem;
            line-height: 1.5;
            text-shadow: 0 0 4px var(--fg-color);
        }
        
        button {
            background: var(--bg-color);
            color: var(--fg-color);
            border: 2px solid var(--fg-color);
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 1rem;
            transition: background 0.2s, color 0.2s;
            pointer-events: auto;
            text-shadow: 0 0 4px var(--fg-color);
            box-shadow: 0 0 10px rgba(0, 136, 0, 0.2);
        }
        
        @media (prefers-color-scheme: dark) {
            button {
                box-shadow: 0 0 10px rgba(51, 255, 51, 0.2);
            }
        }
        
        button:active, button:hover {
            background: var(--fg-color);
            color: var(--bg-color);
            text-shadow: none;
        }
        
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 4px var(--bg-color), 0 0 8px var(--fg-color);
            z-index: 5;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div id="menuScreen" class="screen">
            <h1>SERVER OFFLINE</h1>
            <p>Flick anywhere to shoot braces { }<br>and patch tumbling PHP errors.<br><br>Ricochets clear more errors.</p>
            <button data-smoke="start" id="startBtn">INITIALIZE PATCH</button>
        </div>
        
        <div id="gameOverScreen" class="screen" style="display: none;">
            <h1>KERNEL PANIC</h1>
            <p>Downtime reached critical.</p>
            <p>Errors Patched: <span id="scoreDisplay">0</span></p>
            <button data-smoke="restart" id="restartBtn">REBOOT SERVER</button>
        </div>
    </div>
    
    <div id="hud" style="display: none;">
        <div id="timeDisplay">30.0s</div>
        <div id="scoreHud">0</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let colors = { bg: '#051005', fg: '#33ff33' };
        let scanlinePattern = null;
        let shooterPos = { x: 0, y: 0 };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            shooterPos = { x: width / 2, y: height - 40 };
            createScanlinePattern();
        }

        function createScanlinePattern() {
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 1;
            pCanvas.height = 4;
            const pCtx = pCanvas.getContext('2d');
            pCtx.fillStyle = colors.fg;
            pCtx.globalAlpha = 0.05;
            pCtx.fillRect(0, 0, 1, 1);
            scanlinePattern = ctx.createPattern(pCanvas, 'repeat');
        }

        function updateColors() {
            const style = getComputedStyle(document.body);
            colors.bg = style.getPropertyValue('--bg-color').trim() || '#051005';
            colors.fg = style.getPropertyValue('--fg-color').trim() || '#33ff33';
            createScanlinePattern();
        }

        window.addEventListener('resize', resize);
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                updateColors();
                if (state !== 'PLAYING') drawInitial();
            });
        }

        let audioCtx = null;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        } catch (e) {
            console.warn("Audio not supported");
        }

        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function vibrate(pattern) {
            try {
                if (navigator.vibrate) navigator.vibrate(pattern);
            } catch (e) {}
        }

        let state = 'MENU';
        let lastTime = 0;
        let score = 0;
        let timeLeft = 30;
        const MAX_TIME = 30;

        let logs = [];
        let braces = [];
        let particles = [];
        let floatingTexts = [];

        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };
        let screenShake = 0;
        let damageFlash = 0;
        let logSpawnTimer = 0;
        let logSpawnInterval = 2.0;

        const LOG_MESSAGES = [
            "Parse error: syntax error",
            "Fatal error: Uncaught TypeError",
            "Warning: Undefined variable",
            "Notice: Array to string conversion",
            "Exception: Connection refused",
            "Error: Call to undefined function",
            "Deprecated: Function is deprecated"
        ];

        class ErrorLog {
            constructor(x, y, text, speed, scale, ctx) {
                this.text = text;
                this.speed = speed;
                this.scale = scale;
                this.markedForDeletion = false;
                
                ctx.font = `${Math.floor(14 * scale)}px ui-monospace, monospace`;
                this.w = ctx.measureText(text).width + 20 * scale;
                this.h = 30 * scale;
                
                this.w = Math.min(this.w, width - 20);
                this.x = Math.max(10, Math.min(x, width - this.w - 10));
                this.y = y;
            }
            update(dt) {
                this.y += this.speed * dt;
                if (this.y > height) {
                    this.markedForDeletion = true;
                    timeLeft -= 5;
                    createParticles(this.x + this.w/2, height, 30, '#ff3333');
                    vibrate([50, 50, 50]);
                    screenShake = 15;
                    damageFlash = 0.5;
                    playTone(100, 'sawtooth', 0.3, 0.2);
                }
            }
            draw(ctx) {
                ctx.fillStyle = colors.bg;
                ctx.fillRect(this.x, this.y, this.w, this.h);
                
                ctx.strokeStyle = colors.fg;
                ctx.lineWidth = 4;
                ctx.globalAlpha = 0.3;
                ctx.strokeRect(this.x, this.y, this.w, this.h);
                
                ctx.lineWidth = 2;
                ctx.globalAlpha = 1.0;
                ctx.strokeRect(this.x, this.y, this.w, this.h);

                ctx.fillStyle = colors.fg;
                ctx.font = `${Math.floor(14 * this.scale)}px ui-monospace, monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.text, this.x + this.w/2, this.y + this.h/2);
            }
        }

        class Brace {
            constructor(x, y, vx, vy, type) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.r = 14;
                this.type = type;
                this.markedForDeletion = false;
                this.hitCount = 0;
            }
            update(dt) {
                this.vy += 800 * dt;
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                if (this.x - this.r < 0) {
                    this.x = this.r;
                    this.vx *= -1;
                    playTone(600, 'sine', 0.1, 0.05);
                } else if (this.x + this.r > width) {
                    this.x = width - this.r;
                    this.vx *= -1;
                    playTone(600, 'sine', 0.1, 0.05);
                }

                if (this.y - this.r < 0) {
                    this.y = this.r;
                    this.vy *= -1;
                    playTone(600, 'sine', 0.1, 0.05);
                } else if (this.y - this.r > height) {
                    this.markedForDeletion = true;
                }
            }
            draw(ctx) {
                ctx.fillStyle = colors.bg;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = colors.fg;
                ctx.lineWidth = 4;
                ctx.globalAlpha = 0.3;
                ctx.stroke();
                
                ctx.lineWidth = 2;
                ctx.globalAlpha = 1.0;
                ctx.stroke();
                
                ctx.fillStyle = colors.fg;
                ctx.font = 'bold 18px ui-monospace, monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type, this.x, this.y + 1);
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 400;
                this.vy = (Math.random() - 0.5) * 400;
                this.life = 1.0;
                this.color = color || colors.fg;
                this.size = Math.random() * 3 + 1;
            }
            update(dt) {
                this.vy += 400 * dt;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt * 1.5;
            }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1.0;
            }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.life = 1.0;
                this.color = color;
            }
            update(dt) {
                this.y -= 50 * dt;
                this.life -= dt;
            }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = 'bold 16px ui-monospace, monospace';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }
        }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function getPullVector() {
            if (!isDragging) return { x: 0, y: 0 };
            let dx = dragCurrent.x - dragStart.x;
            let dy = dragCurrent.y - dragStart.y;
            const maxPull = 150;
            const dist = Math.hypot(dx, dy);
            if (dist > maxPull) {
                dx = (dx / dist) * maxPull;
                dy = (dy / dist) * maxPull;
            }
            return { x: dx, y: dy };
        }

        function resolveCollision(circle, rect) {
            let closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
            let closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
            let dx = circle.x - closestX;
            let dy = circle.y - closestY;
            let distanceSquared = dx * dx + dy * dy;

            if (distanceSquared < circle.r * circle.r) {
                let distance = Math.sqrt(distanceSquared);
                let nx = 0, ny = -1;
                if (distance > 0.001) {
                    nx = dx / distance;
                    ny = dy / distance;
                } else {
                    let distLeft = circle.x - rect.x;
                    let distRight = (rect.x + rect.w) - circle.x;
                    let distTop = circle.y - rect.y;
                    let distBottom = (rect.y + rect.h) - circle.y;
                    let minDist = Math.min(distLeft, distRight, distTop, distBottom);
                    if (minDist === distLeft) { nx = -1; ny = 0; }
                    else if (minDist === distRight) { nx = 1; ny = 0; }
                    else if (minDist === distTop) { nx = 0; ny = -1; }
                    else { nx = 0; ny = 1; }
                }
                return { hit: true, nx, ny };
            }
            return { hit: false };
        }

        function spawnLog() {
            let text = LOG_MESSAGES[Math.floor(Math.random() * LOG_MESSAGES.length)];
            let scale = Math.max(0.6, 1.0 - (score * 0.005));
            let x = Math.random() * width;
            let speed = 40 + (score * 2.5);
            logs.push(new ErrorLog(x, -50, text, speed, scale, ctx));
        }

        function handleStart(e) {
            e.preventDefault();
            if (state !== 'PLAYING') return;
            isDragging = true;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragStart = { x: clientX, y: clientY };
            dragCurrent = { x: clientX, y: clientY };
        }

        function handleMove(e) {
            e.preventDefault();
            if (!isDragging) return;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragCurrent = { x: clientX, y: clientY };
        }

        function handleEnd(e) {
            e.preventDefault();
            if (!isDragging) return;
            isDragging = false;
            
            if (braces.length >= 5) return;
            
            let pull = getPullVector();
            if (Math.hypot(pull.x, pull.y) > 10) {
                let vx = pull.x * 8;
                let vy = pull.y * 8;
                let type = Math.random() > 0.5 ? '{' : '}';
                braces.push(new Brace(shooterPos.x, shooterPos.y, vx, vy, type));
                playTone(800, 'triangle', 0.1, 0.05);
            }
        }

        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleEnd, { passive: false });
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);

        const keys = {};

        function updateKeyboardAim() {
            let dx = 0, dy = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
            if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
            if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
            if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
            if (dx === 0 && dy === 0) {
                isDragging = false;
                return;
            }
            isDragging = true;
            dragStart = { x: shooterPos.x, y: shooterPos.y };
            const len = Math.hypot(dx, dy) || 1;
            dragCurrent = { x: shooterPos.x + (dx / len) * 80, y: shooterPos.y + (dy / len) * 80 };
        }

        function shootBrace() {
            if (state !== 'PLAYING' || braces.length >= 5) return;
            let pull = getPullVector();
            if (Math.hypot(pull.x, pull.y) <= 10) {
                pull = { x: 0, y: -80 };
            }
            let vx = pull.x * 8;
            let vy = pull.y * 8;
            let type = Math.random() > 0.5 ? '{' : '}';
            braces.push(new Brace(shooterPos.x, shooterPos.y, vx, vy, type));
            playTone(800, 'triangle', 0.1, 0.05);
            isDragging = false;
        }

        function handleKeyDown(e) {
            keys[e.code] = true;
            if (state === 'MENU' && (e.code === 'Space' || e.code === 'Enter')) {
                e.preventDefault();
                startGame();
                return;
            }
            if (state === 'GAMEOVER' && (e.code === 'Space' || e.code === 'Enter')) {
                e.preventDefault();
                startGame();
                return;
            }
            if (state === 'PLAYING') {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
                    e.preventDefault();
                    updateKeyboardAim();
                }
                if (e.code === 'Space') {
                    e.preventDefault();
                    updateKeyboardAim();
                    shootBrace();
                }
            }
        }

        function handleKeyUp(e) {
            keys[e.code] = false;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
                updateKeyboardAim();
            }
            if (e.code === 'Space' || e.code === 'Enter') e.preventDefault();
        }

        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);

        function startGame() {
            if (audioCtx && audioCtx.state === 'suspended') {
                try { audioCtx.resume(); } catch(e){}
            }
            state = 'PLAYING';
            score = 0;
            timeLeft = MAX_TIME;
            logs = [];
            braces = [];
            particles = [];
            floatingTexts = [];
            logSpawnTimer = 0;
            screenShake = 0;
            damageFlash = 0;
            logSpawnInterval = 2.0;
            
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            
            lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            state = 'GAMEOVER';
            playTone(150, 'sawtooth', 1.0, 0.2);
            vibrate([100, 50, 100]);
            
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('scoreDisplay').innerText = score;
        }

        function loop(timestamp) {
            if (state !== 'PLAYING') return;
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(loop);
        }

        function update(dt) {
            timeLeft -= dt;
            if (timeLeft <= 0) {
                timeLeft = 0;
                gameOver();
                return;
            }

            if (screenShake > 0) {
                screenShake -= dt * 50;
                if (screenShake < 0) screenShake = 0;
            }
            if (damageFlash > 0) damageFlash -= dt * 2;

            logSpawnTimer -= dt;
            if (logSpawnTimer <= 0) {
                spawnLog();
                logSpawnInterval = Math.max(0.4, 2.0 - (score * 0.03));
                logSpawnTimer = logSpawnInterval;
            }

            logs.forEach(l => l.update(dt));
            braces.forEach(b => b.update(dt));
            particles.forEach(p => p.update(dt));
            floatingTexts.forEach(ft => ft.update(dt));

            for (let i = braces.length - 1; i >= 0; i--) {
                let b = braces[i];
                for (let j = logs.length - 1; j >= 0; j--) {
                    let l = logs[j];
                    if (l.markedForDeletion) continue;
                    let col = resolveCollision(b, l);
                    if (col.hit) {
                        let dot = b.vx * col.nx + b.vy * col.ny;
                        b.vx = b.vx - 2 * dot * col.nx;
                        b.vy = b.vy - 2 * dot * col.ny;
                        
                        let speed = Math.hypot(b.vx, b.vy);
                        if (speed < 400) {
                            b.vx = (b.vx / speed) * 400;
                            b.vy = (b.vy / speed) * 400;
                        } else if (speed > 1500) {
                            b.vx = (b.vx / speed) * 1500;
                            b.vy = (b.vy / speed) * 1500;
                        }

                        l.markedForDeletion = true;
                        createParticles(l.x + l.w/2, l.y + l.h/2, 15, colors.fg);
                        playTone(300, 'square', 0.15, 0.1);
                        vibrate(20);
                        
                        b.hitCount++;
                        score += b.hitCount;
                        let timeToAdd = Math.max(0.2, (1.0 - (score * 0.01)) * b.hitCount);
                        timeLeft = Math.min(MAX_TIME, timeLeft + timeToAdd);
                        
                        floatingTexts.push(new FloatingText(l.x + l.w/2, l.y, `+${b.hitCount}`, colors.fg));
                        break;
                    }
                }
            }

            logs = logs.filter(l => !l.markedForDeletion);
            braces = braces.filter(b => !b.markedForDeletion);
            particles = particles.filter(p => p.life > 0);
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);

            document.getElementById('timeDisplay').innerText = timeLeft.toFixed(1) + 's';
            document.getElementById('scoreHud').innerText = score;
        }

        function draw() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);
            
            if (scanlinePattern) {
                ctx.fillStyle = scanlinePattern;
                ctx.fillRect(0, 0, width, height);
            }

            if (damageFlash > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${damageFlash})`;
                ctx.fillRect(0, 0, width, height);
            }

            ctx.save();
            if (screenShake > 0) {
                let dx = (Math.random() - 0.5) * screenShake;
                let dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
            }

            ctx.fillStyle = colors.bg;
            ctx.strokeStyle = colors.fg;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(shooterPos.x, shooterPos.y, 20, Math.PI, 0);
            ctx.fill();
            ctx.stroke();

            let angle = -Math.PI / 2;
            if (isDragging) {
                let pull = getPullVector();
                if (Math.hypot(pull.x, pull.y) > 10) {
                    angle = Math.atan2(pull.y, pull.x);
                    
                    let simX = shooterPos.x;
                    let simY = shooterPos.y;
                    let simVx = pull.x * 8;
                    let simVy = pull.y * 8;
                    
                    ctx.strokeStyle = colors.fg;
                    ctx.setLineDash([5, 10]);
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(simX, simY);
                    for (let i = 0; i < 20; i++) {
                        simVy += 800 * 0.03;
                        simX += simVx * 0.03;
                        simY += simVy * 0.03;
                        ctx.lineTo(simX, simY);
                    }
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
            
            ctx.save();
            ctx.translate(shooterPos.x, shooterPos.y);
            ctx.rotate(angle);
            ctx.fillStyle = colors.fg;
            ctx.fillRect(0, -5, 30, 10);
            ctx.restore();

            logs.forEach(l => l.draw(ctx));
            braces.forEach(b => b.draw(ctx));
            particles.forEach(p => p.draw(ctx));
            floatingTexts.forEach(ft => ft.draw(ctx));

            ctx.restore();
        }

        function drawInitial() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);
            if (scanlinePattern) {
                ctx.fillStyle = scanlinePattern;
                ctx.fillRect(0, 0, width, height);
            }
        }

        function init() {
            resize();
            updateColors();
            drawInitial();
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        init();
    </script>
</body>
</html>
