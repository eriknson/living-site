<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synapse Sync</title>
<style>
  :root {
    --bg: #050505;
    --text: #eee;
    --bg-overlay: rgba(5, 5, 5, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #050505;
      --text: #eee;
      --bg-overlay: rgba(5, 5, 5, 0.85);
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5f5;
      --text: #111;
      --bg-overlay: rgba(245, 245, 245, 0.85);
    }
  }
  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }
  #uiLayer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex; justify-content: center; align-items: center;
  }
  .screen {
    pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    z-index: 10;
  }
  .screen-content {
    background: var(--bg-overlay);
    padding: 20px 30px;
    border-radius: 8px;
    pointer-events: none;
    border: 1px solid var(--text);
  }
  h1, h2 { margin: 0 0 10px 0; letter-spacing: 2px; }
  p { margin: 0 0 20px 0; line-height: 1.5; color: inherit; opacity: 0.8; }
  button {
    pointer-events: auto;
    padding: 15px 40px;
    font-size: 1.2rem;
    font-family: inherit;
    font-weight: bold;
    background: var(--bg);
    color: var(--text);
    border: 2px solid var(--text);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: transform 0.1s, background 0.2s, color 0.2s;
    border-radius: 4px;
  }
  button:active {
    transform: scale(0.95);
    background: var(--text);
    color: var(--bg);
  }
  #hud {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    box-sizing: border-box;
  }
  .hud-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 30px;
  }
  #scoreDisplay {
    font-size: 1.5rem; font-weight: bold;
    text-shadow: 0 0 5px var(--bg);
  }
  #healthBarContainer {
    width: 120px; height: 12px;
    border: 2px solid var(--text);
    padding: 2px;
    background: var(--bg-overlay);
  }
  #healthBar {
    width: 100%; height: 100%;
    background: var(--text);
    transition: width 0.1s;
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="hud" style="display: none;">
    <div class="hud-top">
      <div id="scoreDisplay">0</div>
      <div id="healthBarContainer"><div id="healthBar"></div></div>
    </div>
  </div>

  <div id="uiLayer">
    <div id="titleScreen" class="screen">
      <div class="screen-content">
        <h1>SYNAPSE SYNC</h1>
        <p>Alternate Left and Right.<br>Tap when pulses hit the targets.<br>Keep the brains in sync.</p>
        <button data-smoke="start" id="startBtn">INITIALIZE</button>
      </div>
    </div>
    
    <div id="gameOverScreen" class="screen" style="display: none;">
      <div class="screen-content">
        <h2>DESYNC</h2>
        <p>Score: <span id="finalScore">0</span></p>
        <button data-smoke="restart" id="restartBtn">REBOOT</button>
      </div>
    </div>
  </div>

  <script>
    // --- Audio System ---
    let audioCtx = null;
    function initAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext && !audioCtx) {
          audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn('Audio init failed', e);
      }
    }

    function playTone(freq, type, duration, vol, detune=0) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.detune.value = detune;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playHitL() {
      playTone(440, 'sine', 0.15, 0.5);
      playTone(880, 'triangle', 0.1, 0.2);
    }
    function playHitR() {
      playTone(523.25, 'sine', 0.15, 0.5);
      playTone(1046.5, 'triangle', 0.1, 0.2);
    }
    function playMiss() {
      playTone(150, 'sawtooth', 0.3, 0.3);
      playTone(140, 'square', 0.3, 0.3);
    }
    function playHarmonic() {
      playTone(261.63, 'sine', 0.5, 0.4);
      playTone(329.63, 'sine', 0.5, 0.4);
      playTone(392.00, 'sine', 0.5, 0.4);
      playTone(523.25, 'sine', 0.5, 0.4);
      playTone(65.41, 'triangle', 0.6, 0.6);
    }

    function vibrate(pattern) {
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch(e) {}
      }
    }

    // --- Core Game State ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height, centerX, lWireX, rWireX, targetY, startY;
    let gameState = 'title'; // title, playing, gameover
    let score = 0;
    let health = 100;
    let gameTime = 0;
    let lastFrameTime = 0;
    
    let pulses = [];
    let particles = [];
    let bgNodes = [];
    
    let baseInterval = 1000;
    let desync = 0;
    let nextLTime = 2000;
    let nextRTime = 2500;
    
    let lastHitL = { targetTime: -9999, timeHit: -9999 };
    let lastHitR = { targetTime: -9999, timeHit: -9999 };
    
    let lTargetScale = 1.0;
    let rTargetScale = 1.0;
    let flashAlpha = 0;

    const SPAWN_AHEAD_TIME = 1500;
    const HIT_WINDOW = 150;
    const PERFECT_WINDOW = 50;

    // --- Colors & Theme ---
    let isLightMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
        isLightMode = e.matches;
      });
    }

    function getColors() {
      return {
        bg: isLightMode ? '#f5f5f5' : '#050505',
        text: isLightMode ? '#111' : '#eee',
        wire: isLightMode ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)',
        wireStrong: isLightMode ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.3)',
        colorL: isLightMode ? '#007799' : '#00e5ff',
        colorR: isLightMode ? '#cc5500' : '#ffaa00',
        error: '#ff0044'
      };
    }

    // --- Initialization & Resize ---
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      centerX = width / 2;
      const gameWidth = Math.min(width, 600);
      lWireX = centerX - gameWidth * 0.25;
      rWireX = centerX + gameWidth * 0.25;
      targetY = height * 0.8;
      startY = height * 0.1;
    }
    window.addEventListener('resize', resize);
    resize();

    function initBgNodes() {
      bgNodes = [];
      for(let i=0; i<40; i++) {
        bgNodes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.2,
          vy: Math.random() * 0.5 + 0.2
        });
      }
    }
    initBgNodes();

    // --- Visual Effects ---
    function createParticles(x, y, color) {
      for (let i=0; i<8; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          life: 300 + Math.random() * 200,
          maxLife: 500,
          color: color,
          size: 5 + Math.random() * 10,
          type: 'line'
        });
      }
      particles.push({
        x: x, y: y, vx: 0, vy: 0, life: 300, maxLife: 300, color: color, size: 20, type: 'square'
      });
    }

    function createErrorParticles(x, y) {
      const colors = getColors();
      for (let i=0; i<5; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 5,
          vy: Math.random() * 5,
          life: 400, maxLife: 400,
          color: colors.error,
          size: 10, type: 'line'
        });
      }
    }

    function createHarmonicParticles() {
      const colors = getColors();
      for (let i=0; i<20; i++) {
        particles.push({
          x: width/2, y: targetY,
          vx: (Math.random() - 0.5) * 20,
          vy: (Math.random() - 0.5) * 20,
          life: 800, maxLife: 800,
          color: i%2===0 ? colors.colorL : colors.colorR,
          size: 10 + Math.random() * 15,
          type: 'circle'
        });
      }
    }

    // --- Input Handling ---
    function processTap(side) {
      if (gameState !== 'playing') return;
      
      let targetPulse = null;
      for (let p of pulses) {
        if (p.side === side && !p.hit && !p.missed) {
          if (!targetPulse || p.targetTime < targetPulse.targetTime) {
            targetPulse = p;
          }
        }
      }
      
      if (targetPulse && Math.abs(targetPulse.targetTime - gameTime) <= HIT_WINDOW) {
        // Hit!
        targetPulse.hit = true;
        const isPerfect = Math.abs(targetPulse.targetTime - gameTime) <= PERFECT_WINDOW;
        
        score += isPerfect ? 20 : 10;
        health = Math.min(100, health + (isPerfect ? 8 : 4));
        
        const colors = getColors();
        const color = side === 'L' ? colors.colorL : colors.colorR;
        createParticles(side === 'L' ? lWireX : rWireX, targetY, color);
        
        if (side === 'L') {
          playHitL();
          lastHitL = { targetTime: targetPulse.targetTime, timeHit: gameTime };
          lTargetScale = 1.5;
        } else {
          playHitR();
          lastHitR = { targetTime: targetPulse.targetTime, timeHit: gameTime };
          rTargetScale = 1.5;
        }
        
        vibrate(isPerfect ? 20 : 10);
        
        // Check Harmonic Burst
        const otherLastHit = side === 'L' ? lastHitR : lastHitL;
        if (Math.abs(targetPulse.targetTime - otherLastHit.targetTime) <= 100 &&
            Math.abs(gameTime - otherLastHit.timeHit) <= 300) {
          // Harmonic Burst
          score += 50;
          health = Math.min(100, health + 15);
          playHarmonic();
          createHarmonicParticles();
          vibrate([50, 50, 50]);
          otherLastHit.targetTime = -9999; // Consume
          flashAlpha = 0.4;
        }
        
      } else {
        // Bad tap
        health -= 10;
        playMiss();
        vibrate([30, 30, 30]);
        createErrorParticles(side === 'L' ? lWireX : rWireX, targetY);
      }
    }

    function handleInputEvent(x) {
      if (gameState !== 'playing') return;
      const side = x < width / 2 ? 'L' : 'R';
      processTap(side);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      for (let i=0; i<e.changedTouches.length; i++) {
        handleInputEvent(e.changedTouches[i].clientX);
      }
    }, {passive: false});

    window.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      handleInputEvent(e.clientX);
    });

    window.addEventListener('keydown', (e) => {
      if (gameState !== 'playing') return;
      if (e.key === 'ArrowLeft' || e.key === 'f' || e.key === 'F') {
        processTap('L');
      }
      if (e.key === 'ArrowRight' || e.key === 'j' || e.key === 'J') {
        processTap('R');
      }
    });

    // --- Game Loop ---
    function startGame() {
      initAudio();
      gameState = 'playing';
      score = 0;
      health = 100;
      gameTime = 0;
      pulses = [];
      particles = [];
      baseInterval = 1000;
      desync = 0;
      nextLTime = 2000;
      nextRTime = 2500;
      lastHitL = { targetTime: -9999, timeHit: -9999 };
      lastHitR = { targetTime: -9999, timeHit: -9999 };
      
      document.getElementById('titleScreen').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
    }

    function triggerGameOver() {
      gameState = 'gameover';
      document.getElementById('hud').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'flex';
      document.getElementById('finalScore').innerText = Math.floor(score);
      vibrate([200, 100, 200]);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    function update(dt) {
      // Update background nodes
      for(let i=0; i<bgNodes.length; i++) {
        let n1 = bgNodes[i];
        n1.x += n1.vx * (dt/16);
        n1.y += n1.vy * (dt/16);
        if (n1.y > height) n1.y = 0;
        if (n1.x < 0) n1.x = width;
        if (n1.x > width) n1.x = 0;
      }

      if (gameState !== 'playing') return;
      
      gameTime += dt;
      
      // Difficulty curve
      baseInterval = Math.max(350, 1000 - gameTime * 0.012);
      desync = Math.min(0.6, Math.max(0, (gameTime - 10000) * 0.000015));
      
      // Spawn pulses
      while (gameTime + SPAWN_AHEAD_TIME >= nextLTime) {
        pulses.push({ side: 'L', targetTime: nextLTime, hit: false, missed: false, y: startY });
        nextLTime += baseInterval * (1 - desync/2);
      }
      while (gameTime + SPAWN_AHEAD_TIME >= nextRTime) {
        pulses.push({ side: 'R', targetTime: nextRTime, hit: false, missed: false, y: startY });
        nextRTime += baseInterval * (1 + desync/2);
      }
      
      // Update pulses
      for (let i = pulses.length - 1; i >= 0; i--) {
        let p = pulses[i];
        if (p.hit) {
          pulses.splice(i, 1);
          continue;
        }
        
        p.y = targetY - ((p.targetTime - gameTime) / SPAWN_AHEAD_TIME) * (targetY - startY);
        
        if (!p.missed && gameTime > p.targetTime + HIT_WINDOW) {
          p.missed = true;
          health -= 15;
          playMiss();
          vibrate([30, 30, 30]);
          createErrorParticles(p.side === 'L' ? lWireX : rWireX, targetY);
        }
        
        if (p.y > height + 50) {
          pulses.splice(i, 1);
        }
      }
      
      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * (dt/16);
        p.y += p.vy * (dt/16);
        if (p.type === 'square' || p.type === 'circle') {
          p.size += 2 * (dt/16);
        }
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      
      // Update animations
      lTargetScale += (1.0 - lTargetScale) * 0.1 * (dt/16);
      rTargetScale += (1.0 - rTargetScale) * 0.1 * (dt/16);
      flashAlpha = Math.max(0, flashAlpha - 0.02 * (dt/16));
      
      // Update HUD
      document.getElementById('scoreDisplay').innerText = Math.floor(score);
      document.getElementById('healthBar').style.width = `${Math.max(0, health)}%`;
      
      if (health <= 0) {
        health = 0;
        triggerGameOver();
      }
    }

    function drawHexagon(ctx, x, y, radius) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 2;
        const px = x + radius * Math.cos(angle);
        const py = y + radius * Math.sin(angle);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function drawDiamond(ctx, x, y, radius) {
      ctx.beginPath();
      ctx.moveTo(x, y - radius);
      ctx.lineTo(x + radius, y);
      ctx.lineTo(x, y + radius);
      ctx.lineTo(x - radius, y);
      ctx.closePath();
      ctx.stroke();
    }

    function render() {
      const colors = getColors();
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, width, height);
      
      if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
        ctx.fillRect(0, 0, width, height);
      }
      
      // Background nodes
      ctx.strokeStyle = colors.wire;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for(let i=0; i<bgNodes.length; i++) {
        let n1 = bgNodes[i];
        for(let j=i+1; j<bgNodes.length; j++) {
          let n2 = bgNodes[j];
          let dx = n1.x - n2.x;
          let dy = n1.y - n2.y;
          if (dx*dx + dy*dy < 15000) {
            ctx.moveTo(n1.x, n1.y);
            ctx.lineTo(n2.x, n2.y);
          }
        }
      }
      ctx.stroke();
      
      // Center line
      ctx.strokeStyle = colors.wireStrong;
      ctx.setLineDash([5, 10]);
      ctx.beginPath();
      ctx.moveTo(centerX, 0);
      ctx.lineTo(centerX, height);
      ctx.stroke();
      ctx.setLineDash([]);
      
      // Wires
      ctx.strokeStyle = colors.wireStrong;
      ctx.beginPath();
      ctx.moveTo(lWireX, 0); ctx.lineTo(lWireX, height);
      ctx.moveTo(rWireX, 0); ctx.lineTo(rWireX, height);
      ctx.stroke();
      
      // Hit windows
      const speed = (targetY - startY) / SPAWN_AHEAD_TIME;
      const hitRadius = HIT_WINDOW * speed;
      ctx.strokeStyle = colors.wireStrong;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.arc(lWireX, targetY, hitRadius, 0, Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(rWireX, targetY, hitRadius, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      
      // Connecting lines for synced pulses
      ctx.strokeStyle = colors.wireStrong;
      ctx.beginPath();
      for (let l of pulses) {
        if (l.side !== 'L' || l.missed) continue;
        for (let r of pulses) {
          if (r.side !== 'R' || r.missed) continue;
          if (Math.abs(l.targetTime - r.targetTime) <= 100) {
            ctx.moveTo(lWireX, l.y);
            ctx.lineTo(rWireX, r.y);
          }
        }
      }
      ctx.stroke();
      
      // Target nodes
      ctx.lineWidth = 2;
      ctx.strokeStyle = colors.colorL;
      drawHexagon(ctx, lWireX, targetY, 20 * lTargetScale);
      ctx.strokeStyle = colors.colorR;
      drawHexagon(ctx, rWireX, targetY, 20 * rTargetScale);
      
      // Pulses
      ctx.lineWidth = 2;
      for (let p of pulses) {
        if (p.missed) continue;
        ctx.strokeStyle = p.side === 'L' ? colors.colorL : colors.colorR;
        drawDiamond(ctx, p.side === 'L' ? lWireX : rWireX, p.y, 12);
        
        ctx.beginPath();
        ctx.moveTo(p.side === 'L' ? lWireX : rWireX, p.y - 12);
        ctx.lineTo(p.side === 'L' ? lWireX : rWireX, p.y - 40);
        let grad = ctx.createLinearGradient(0, p.y - 12, 0, p.y - 40);
        grad.addColorStop(0, p.side === 'L' ? colors.colorL : colors.colorR);
        grad.addColorStop(1, 'transparent');
        ctx.strokeStyle = grad;
        ctx.stroke();
      }
      
      // Particles
      for (let p of particles) {
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.lineWidth = 2;
        if (p.type === 'square') {
          ctx.strokeRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        } else if (p.type === 'circle') {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.vx * 5, p.y + p.vy * 5);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1.0;
    }

    function loop(timestamp) {
      requestAnimationFrame(loop);
      if (!lastFrameTime) lastFrameTime = timestamp;
      const dt = timestamp - lastFrameTime;
      lastFrameTime = timestamp;
      
      const safeDt = Math.min(dt, 50);
      update(safeDt);
      render();
    }
    
    requestAnimationFrame(loop);

  </script>
</body>
</html>
