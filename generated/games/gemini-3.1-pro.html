<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff Sort</title>
<style>
  :root {
    --bg-top: #ffffff;
    --bg-bottom: #f0f0f0;
    --text: #121212;
    --staff: #E0E0E0;
    --active: #121212;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-top: #1a1a1a;
      --bg-bottom: #0a0a0a;
      --text: #F9F9F9;
      --staff: #333333;
      --active: #F9F9F9;
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100dvw; height: 100dvh;
    background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden; touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  #gameCanvas {
    display: block; width: 100%; height: 100%;
  }
  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column;
  }
  .header {
    display: flex; justify-content: space-between; padding: 20px;
    font-size: 1.2rem; font-weight: bold;
  }
  #screens {
    flex: 1; display: flex; align-items: center; justify-content: center;
  }
  .screen {
    text-align: center; padding: 40px;
    background: var(--bg-top);
    border: 2px solid var(--staff); border-radius: 20px;
    pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; gap: 20px; align-items: center;
  }
  @media (prefers-color-scheme: dark) {
    .screen { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  }
  h1 { margin: 0; font-size: 2rem; letter-spacing: -1px; }
  p { margin: 0; opacity: 0.7; line-height: 1.5; }
  button {
    appearance: none; background: var(--text); color: var(--bg-top);
    border: none; padding: 15px 30px; font-size: 1.2rem;
    font-family: inherit; font-weight: bold; border-radius: 10px;
    cursor: pointer; transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div class="header">
    <div id="scoreDisplay">SCORE: 0</div>
    <div id="livesDisplay">♥♥♥</div>
  </div>
  <div id="screens">
    <div id="startScreen" class="screen">
      <h1>STAFF SORT</h1>
      <p>Swipe left/right to sort notes.<br>Swipe down to fast drop.</p>
      <button id="startBtn">PLAY</button>
    </div>
    <div id="gameOverScreen" class="screen hidden">
      <h1>GAME OVER</h1>
      <p id="finalScore">SCORE: 0</p>
      <button id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScore = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

let width, height;
let staffWidth, staffLeft, laneWidth;
let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

const colors = {
    light: ['#FF2D55', '#34C759', '#007AFF', '#FF9500'],
    dark: ['#FF375F', '#32D74B', '#0A84FF', '#FF9F0A']
};

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    
    staffWidth = Math.min(width * 0.8, 400);
    staffLeft = (width - staffWidth) / 2;
    laneWidth = staffWidth / 4;
    
    if (state === 'start') draw();
}
window.addEventListener('resize', resize);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    isDark = e.matches;
    if (state !== 'playing') draw();
});

// Audio
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playTone(lane) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const freqs = [261.63, 329.63, 392.00, 493.88]; // C4, E4, G4, B4
    osc.frequency.value = freqs[lane];
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.stop(audioCtx.currentTime + 0.5);
}

function playError() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
    osc.type = 'sawtooth';
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.stop(audioCtx.currentTime + 0.2);
}

// Game State
let state = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let notes = [];
let particles = [];
let lastTime = 0;
let spawnTimer = 0;
let currentSpawnInterval = 1.5;
let currentFallSpeed = 200;
let shakeTime = 0;
let receptorsPulse = [0,0,0,0];

function resetGame() {
    initAudio();
    score = 0;
    lives = 3;
    notes = [];
    particles = [];
    currentSpawnInterval = 1.5;
    currentFallSpeed = 200;
    shakeTime = 0;
    receptorsPulse = [0,0,0,0];
    updateHUD();
    state = 'playing';
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    lastTime = performance.now();
    spawnTimer = 0;
    requestAnimationFrame(loop);
}

function updateHUD() {
    scoreDisplay.innerText = `SCORE: ${score}`;
    livesDisplay.innerText = '♥'.repeat(lives) + '♡'.repeat(3-lives);
}

// Input
let touchStartX = 0;
let touchStartY = 0;
const SWIPE_THRESH_X = 30;
const SWIPE_THRESH_Y = 40;

document.addEventListener('touchmove', e => {
    e.preventDefault();
}, {passive: false});

window.addEventListener('touchstart', e => {
    if (state !== 'playing') return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, {passive: false});

window.addEventListener('touchmove', e => {
    if (state !== 'playing') return;
    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;
    const dx = x - touchStartX;
    const dy = y - touchStartY;
    
    if (Math.abs(dx) > SWIPE_THRESH_X) {
        moveActiveNote(dx > 0 ? 1 : -1);
        touchStartX = x; 
        touchStartY = y; 
    } else if (dy > SWIPE_THRESH_Y) {
        fastDropActiveNote();
        touchStartY = y + 1000; 
    }
}, {passive: false});

window.addEventListener('keydown', e => {
    if (state !== 'playing') return;
    if (e.key === 'ArrowLeft') moveActiveNote(-1);
    if (e.key === 'ArrowRight') moveActiveNote(1);
    if (e.key === 'ArrowDown') fastDropActiveNote();
});

function getActiveNote() {
    let active = null;
    let maxY = -1000;
    for (let n of notes) {
        if (!n.fastDropping && n.y > maxY) {
            maxY = n.y;
            active = n;
        }
    }
    return active;
}

function moveActiveNote(dir) {
    const active = getActiveNote();
    if (active) {
        active.lane += dir;
        if (active.lane < 0) active.lane = 0;
        if (active.lane > 3) active.lane = 3;
    }
}

function fastDropActiveNote() {
    const active = getActiveNote();
    if (active) {
        active.fastDropping = true;
    }
}

function spawnNote() {
    const colorIdx = Math.floor(Math.random() * 4);
    const lane = Math.floor(Math.random() * 4);
    notes.push({
        lane: lane,
        colorIdx: colorIdx,
        y: -50,
        drawX: staffLeft + lane * laneWidth + laneWidth/2,
        fastDropping: false
    });
}

function spawnParticles(x, y, color) {
    for(let i=0; i<15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
            type: 'dot',
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color
        });
    }
}

function spawnTextParticle(x, y, text, color) {
    particles.push({
        type: 'text',
        x, y,
        vx: 0, vy: -2,
        life: 1,
        color,
        text
    });
}

function loop(time) {
    if (state !== 'playing') return;
    let dt = (time - lastTime) / 1000;
    lastTime = time;
    if (dt > 0.1) dt = 0.1;
    
    update(dt);
    draw();
    
    requestAnimationFrame(loop);
}

function update(dt) {
    currentFallSpeed = Math.min(800, 200 + score * 5);
    currentSpawnInterval = Math.max(0.4, 1.5 - score * 0.02);
    
    spawnTimer += dt;
    if (spawnTimer >= currentSpawnInterval) {
        spawnTimer = 0;
        spawnNote();
    }
    
    if (shakeTime > 0) shakeTime -= dt;
    
    for (let i=0; i<4; i++) {
        if (receptorsPulse[i] > 0) receptorsPulse[i] -= dt * 5;
    }
    
    const receptorY = height - 120;
    
    for (let i = notes.length - 1; i >= 0; i--) {
        const n = notes[i];
        const speed = n.fastDropping ? currentFallSpeed * 5 : currentFallSpeed;
        n.y += speed * dt;
        
        const targetX = staffLeft + n.lane * laneWidth + laneWidth/2;
        n.drawX += (targetX - n.drawX) * 15 * dt;
        
        if (n.y >= receptorY) {
            const palette = isDark ? colors.dark : colors.light;
            if (n.lane === n.colorIdx) {
                const pts = n.fastDropping ? 2 : 1;
                score += pts;
                playTone(n.lane);
                spawnParticles(targetX, receptorY, palette[n.colorIdx]);
                spawnTextParticle(targetX, receptorY - 30, `+${pts}`, palette[n.colorIdx]);
                receptorsPulse[n.lane] = 1;
                if (navigator.vibrate) navigator.vibrate(10);
            } else {
                lives--;
                playError();
                shakeTime = 0.3;
                if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
            }
            updateHUD();
            notes.splice(i, 1);
            
            if (lives <= 0) {
                state = 'gameover';
                finalScore.innerText = `SCORE: ${score}`;
                gameOverScreen.classList.remove('hidden');
                draw(); // one last draw to show final state
            }
        }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, width, height);
    
    if (shakeTime > 0) {
        const amt = shakeTime * 20;
        ctx.save();
        ctx.translate((Math.random()-0.5)*amt, (Math.random()-0.5)*amt);
    }
    
    const staffColor = isDark ? '#333333' : '#E0E0E0';
    const activeColor = isDark ? '#F9F9F9' : '#121212';
    const palette = isDark ? colors.dark : colors.light;
    
    // Draw background clef
    ctx.fillStyle = staffColor;
    ctx.font = `${laneWidth * 2}px serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.globalAlpha = 0.1;
    ctx.fillText("𝄞", staffLeft + staffWidth/2, height / 2);
    ctx.globalAlpha = 1.0;
    
    // Draw staff lines
    ctx.strokeStyle = staffColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i=0; i<=4; i++) {
        const x = staffLeft + i * laneWidth;
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
    }
    ctx.stroke();
    
    const receptorY = height - 120;
    const noteRadius = laneWidth * 0.25;
    
    // Draw receptors
    for (let i=0; i<4; i++) {
        const x = staffLeft + i * laneWidth + laneWidth/2;
        const pulse = Math.max(0, receptorsPulse[i]);
        const r = noteRadius + pulse * 10;
        
        ctx.strokeStyle = palette[i];
        ctx.lineWidth = 3 + pulse * 2;
        ctx.beginPath();
        ctx.arc(x, receptorY, r, 0, Math.PI*2);
        ctx.stroke();
        
        ctx.fillStyle = palette[i];
        ctx.globalAlpha = 0.2 + pulse * 0.5;
        ctx.beginPath();
        ctx.arc(x, receptorY, r * 0.5, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
    
    // Draw notes
    const activeNote = getActiveNote();
    
    for (const n of notes) {
        if (n.fastDropping) {
            ctx.fillStyle = palette[n.colorIdx];
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.arc(n.drawX, n.y - 20, noteRadius, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(n.drawX, n.y - 40, noteRadius * 0.8, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
        
        ctx.fillStyle = palette[n.colorIdx];
        ctx.beginPath();
        ctx.arc(n.drawX, n.y, noteRadius, 0, Math.PI*2);
        ctx.fill();
        
        if (n === activeNote) {
            ctx.strokeStyle = activeColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(n.drawX, n.y, noteRadius + 6, 0, Math.PI*2);
            ctx.stroke();
        }
    }
    
    // Draw particles
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        if (p.type === 'text') {
            ctx.fillStyle = p.color;
            ctx.font = "bold 20px ui-monospace, 'SFMono-Regular', Menlo, monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1.0;
    
    if (shakeTime > 0) {
        ctx.restore();
    }
}

startBtn.addEventListener('click', resetGame);
restartBtn.addEventListener('click', resetGame);

resize();
</script>
</body>
</html>
