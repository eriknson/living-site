<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latent Gradient</title>
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1a1a1a;
        color: #fff;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    @media (prefers-color-scheme: light) {
        body {
            background: #f0f0f5;
            color: #111;
        }
    }
    @media (prefers-color-scheme: dark) {
        body {
            background: #1a1a1a;
            color: #f5f5f5;
        }
        .haze {
            opacity: 0.95;
        }
        .scanlines {
            opacity: 0.85;
        }
    }
    .haze {
        position: absolute;
        top: -50%; left: -50%; right: -50%; bottom: -50%;
        background: radial-gradient(circle at 50% 50%, rgba(136,224,239,0.15), rgba(255,153,200,0.1), rgba(252,246,189,0.05), transparent 60%);
        animation: swirl 20s infinite linear;
        pointer-events: none;
        z-index: -1;
    }
    @keyframes swirl {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.2); }
        100% { transform: rotate(360deg) scale(1); }
    }
    .scanlines {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.05));
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 10;
    }
    canvas {
        display: block;
        width: 100dvw;
        height: 100dvh;
    }
</style>
</head>
<body>
<div class="haze"></div>
<div class="scanlines"></div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: true });

const PALETTE = {
    cyan: '#88E0EF',
    magenta: '#FF99C8',
    yellow: '#FCF6BD',
    grey: '#D0D0D0',
    mint: '#D0F4DE',
    orange: '#FFC9A9'
};

let isLightMode = window.matchMedia('(prefers-color-scheme: light)').matches;
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
    isLightMode = e.matches;
});

let gameState = 'title'; // title, playing, level_complete, game_over
let level = 1;
let timeRemaining = 60;
let gridSize = 3;
let cellSize = 100;
let boardWidth = 300;
let boardHeight = 300;
let boardX = 0;
let boardY = 0;

let grid = [];
let targetGrid = [];
let currentLevelColors = [];

let dragInfo = null;
let winAnimTimer = 0;
let keyboardFocusRow = 0;
let keyboardFocusCol = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, type, duration, vol=0.1) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playSwipe() { playTone(200, 'sine', 0.1, 0.05); }
function playLock() {
    playTone(600, 'sine', 0.2, 0.1);
    setTimeout(() => playTone(800, 'sine', 0.3, 0.1), 100);
}
function playWin() {
    [400, 500, 600, 800].forEach((f, i) => {
        setTimeout(() => playTone(f, 'square', 0.4, 0.1), i * 150);
    });
}

function resize() {
    let dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
    
    let logicalWidth = window.innerWidth;
    let logicalHeight = window.innerHeight;
    
    let maxBoardSize = Math.min(logicalWidth * 0.9, logicalHeight * 0.6);
    cellSize = maxBoardSize / gridSize;
    boardWidth = cellSize * gridSize;
    boardHeight = cellSize * gridSize;
    boardX = (logicalWidth - boardWidth) / 2;
    boardY = (logicalHeight - boardHeight) / 2 + 30;
}
window.addEventListener('resize', resize);

function startLevel(lvl) {
    level = lvl;
    gridSize = Math.min(3 + Math.floor((level - 1) / 3), 5);
    keyboardFocusRow = Math.floor(gridSize / 2);
    keyboardFocusCol = Math.floor(gridSize / 2);
    resize();
    generateTargetGrid();
    generateTiles();
    checkAlignment();
}

function generateTargetGrid() {
    targetGrid = [];
    let colors = [PALETTE.cyan, PALETTE.magenta, PALETTE.yellow, PALETTE.mint, PALETTE.orange];
    currentLevelColors = colors.slice(0, gridSize);
    let patternType = (level - 1) % 4;

    for (let y = 0; y < gridSize; y++) {
        targetGrid[y] = [];
        for (let x = 0; x < gridSize; x++) {
            if (patternType === 0) targetGrid[y][x] = currentLevelColors[y % currentLevelColors.length];
            else if (patternType === 1) targetGrid[y][x] = currentLevelColors[x % currentLevelColors.length];
            else if (patternType === 2) {
                let halfY = y < gridSize/2 ? 0 : 1;
                let halfX = x < gridSize/2 ? 0 : 1;
                targetGrid[y][x] = currentLevelColors[(halfY * 2 + halfX) % currentLevelColors.length];
            } else {
                targetGrid[y][x] = currentLevelColors[(x + y) % currentLevelColors.length];
            }
        }
    }
}

function generateTiles() {
    let requiredColors = [];
    for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
            requiredColors.push(targetGrid[y][x]);
        }
    }
    
    let isSolved = true;
    while(isSolved) {
        requiredColors.sort(() => Math.random() - 0.5);
        isSolved = true;
        let idx = 0;
        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
                if (requiredColors[idx] !== targetGrid[y][x]) isSolved = false;
                idx++;
            }
        }
    }

    grid = [];
    let idx = 0;
    for (let y = 0; y < gridSize; y++) {
        grid[y] = [];
        for (let x = 0; x < gridSize; x++) {
            let trueColor = requiredColors[idx++];
            let isDummy = (level >= 3 && Math.random() < 0.2);
            let displayColor = trueColor;
            if (isDummy) {
                let otherColors = currentLevelColors.filter(c => c !== trueColor);
                if (otherColors.length > 0) {
                    displayColor = otherColors[Math.floor(Math.random() * otherColors.length)];
                }
            }

            grid[y][x] = {
                trueColor: trueColor,
                displayColor: displayColor,
                isDummy: isDummy,
                glitchTimer: Math.random() * 5,
                glitchDuration: 0,
                isGlitching: false,
                isRevealed: false,
                peekTimer: 0,
                animOffsetX: 0,
                animOffsetY: 0,
                flipAnim: 0,
                isAligned: false
            };
        }
    }
}

function checkAlignment() {
    let allAligned = true;
    let newlyAligned = false;
    for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
            let tile = grid[y][x];
            if (tile.trueColor === targetGrid[y][x]) {
                if (!tile.isAligned) {
                    tile.isAligned = true;
                    newlyAligned = true;
                }
            } else {
                tile.isAligned = false;
                allAligned = false;
            }
        }
    }
    if (newlyAligned) {
        playLock();
        if (navigator.vibrate) navigator.vibrate(15);
    }
    if (allAligned && gameState === 'playing') {
        gameState = 'level_complete';
        winAnimTimer = 0;
        playWin();
        if (navigator.vibrate) navigator.vibrate([30, 50, 30, 50, 100]);
        setTimeout(() => {
            startLevel(level + 1);
            timeRemaining += 15;
            gameState = 'playing';
        }, 2000);
    }
}

function shiftRow(row, amount, dragOffset) {
    let newRow = [];
    for (let x = 0; x < gridSize; x++) {
        let oldX = (x - amount + gridSize) % gridSize;
        newRow[x] = grid[row][oldX];
        let visualX = oldX * cellSize + dragOffset;
        while (visualX < x * cellSize - boardWidth/2) visualX += boardWidth;
        while (visualX > x * cellSize + boardWidth/2) visualX -= boardWidth;
        newRow[x].animOffsetX = visualX - x * cellSize;
    }
    grid[row] = newRow;
}

function shiftCol(col, amount, dragOffset) {
    let newCol = [];
    for (let y = 0; y < gridSize; y++) {
        let oldY = (y - amount + gridSize) % gridSize;
        newCol[y] = grid[oldY][col];
        let visualY = oldY * cellSize + dragOffset;
        while (visualY < y * cellSize - boardHeight/2) visualY += boardHeight;
        while (visualY > y * cellSize + boardHeight/2) visualY -= boardHeight;
        newCol[y].animOffsetY = visualY - y * cellSize;
    }
    for (let y = 0; y < gridSize; y++) {
        grid[y][col] = newCol[y];
    }
}

window.addEventListener('pointerdown', e => {
    if (gameState === 'title') {
        gameState = 'playing';
        timeRemaining = 60;
        startLevel(1);
        playTone(400, 'sine', 0.1);
        return;
    }
    if (gameState === 'game_over') {
        let cx = window.innerWidth/2;
        let cy = window.innerHeight/2 + 105;
        if (Math.abs(e.clientX - cx) < 80 && Math.abs(e.clientY - cy) < 25) {
            gameState = 'playing';
            timeRemaining = 60;
            startLevel(1);
            playTone(400, 'sine', 0.1);
        }
        return;
    }
    
    if (gameState !== 'playing') return;

    let col = Math.floor((e.clientX - boardX) / cellSize);
    let row = Math.floor((e.clientY - boardY) / cellSize);
    
    if (col >= 0 && col < gridSize && row >= 0 && row < gridSize) {
        keyboardFocusRow = row;
        keyboardFocusCol = col;
        dragInfo = {
            col, row,
            startX: e.clientX,
            startY: e.clientY,
            axis: null,
            offset: 0
        };
    }
});

window.addEventListener('pointermove', e => {
    if (!dragInfo || gameState !== 'playing') return;
    let dx = e.clientX - dragInfo.startX;
    let dy = e.clientY - dragInfo.startY;
    
    if (!dragInfo.axis) {
        if (Math.abs(dx) > 10) dragInfo.axis = 'x';
        else if (Math.abs(dy) > 10) dragInfo.axis = 'y';
    }
    
    if (dragInfo.axis === 'x') dragInfo.offset = dx;
    if (dragInfo.axis === 'y') dragInfo.offset = dy;
});

function handlePointerUp(e) {
    if (!dragInfo || gameState !== 'playing') return;

    if (!dragInfo.axis) {
        let tile = grid[dragInfo.row][dragInfo.col];
        if (!tile.isAligned) {
            tile.isRevealed = true;
            tile.peekTimer = 2.0;
            playTone(300, 'triangle', 0.1, 0.05);
        }
    } else {
        let shiftAmount = Math.round(dragInfo.offset / cellSize);
        shiftAmount = shiftAmount % gridSize;
        if (shiftAmount < 0) shiftAmount += gridSize;

        if (shiftAmount !== 0) {
            if (dragInfo.axis === 'x') shiftRow(dragInfo.row, shiftAmount, dragInfo.offset);
            else shiftCol(dragInfo.col, shiftAmount, dragInfo.offset);
            playSwipe();
            checkAlignment();
        } else {
            if (dragInfo.axis === 'x') {
                for (let x = 0; x < gridSize; x++) grid[dragInfo.row][x].animOffsetX = dragInfo.offset;
            } else {
                for (let y = 0; y < gridSize; y++) grid[y][dragInfo.col].animOffsetY = dragInfo.offset;
            }
        }
    }
    dragInfo = null;
}

window.addEventListener('pointerup', handlePointerUp);
window.addEventListener('pointercancel', handlePointerUp);
canvas.addEventListener('pointerdown', e => e.preventDefault());
canvas.addEventListener('pointermove', e => e.preventDefault());

function handleKeyDown(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
    }
    if (e.repeat) return;

    if (gameState === 'title') {
        if (e.code === 'Space' || e.code === 'Enter') {
            gameState = 'playing';
            timeRemaining = 60;
            startLevel(1);
            playTone(400, 'sine', 0.1);
        }
        return;
    }
    if (gameState === 'game_over') {
        if (e.code === 'Space' || e.code === 'Enter') {
            gameState = 'playing';
            timeRemaining = 60;
            startLevel(1);
            playTone(400, 'sine', 0.1);
        }
        return;
    }
    if (gameState !== 'playing') return;

    if (e.code === 'ArrowLeft') {
        e.preventDefault();
        shiftRow(keyboardFocusRow, gridSize - 1, 0);
        playSwipe();
        checkAlignment();
    } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        shiftRow(keyboardFocusRow, 1, 0);
        playSwipe();
        checkAlignment();
    } else if (e.code === 'ArrowUp') {
        e.preventDefault();
        shiftCol(keyboardFocusCol, gridSize - 1, 0);
        playSwipe();
        checkAlignment();
    } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        shiftCol(keyboardFocusCol, 1, 0);
        playSwipe();
        checkAlignment();
    } else if (e.code === 'Space') {
        let tile = grid[keyboardFocusRow][keyboardFocusCol];
        if (!tile.isAligned) {
            tile.isRevealed = true;
            tile.peekTimer = 2.0;
            playTone(300, 'triangle', 0.1, 0.05);
        }
    }
}

function handleKeyUp() {}

document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

function update(dt) {
    if (gameState === 'playing') {
        timeRemaining -= dt;
        if (timeRemaining <= 0) {
            timeRemaining = 0;
            gameState = 'game_over';
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }

        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
                let tile = grid[y][x];
                
                tile.animOffsetX *= 0.7;
                tile.animOffsetY *= 0.7;
                if (Math.abs(tile.animOffsetX) < 0.5) tile.animOffsetX = 0;
                if (Math.abs(tile.animOffsetY) < 0.5) tile.animOffsetY = 0;

                if (tile.isRevealed && !tile.isAligned) {
                    tile.peekTimer -= dt;
                    if (tile.peekTimer <= 0) tile.isRevealed = false;
                }

                if (tile.isDummy) {
                    if (tile.isGlitching) {
                        tile.glitchDuration -= dt;
                        if (tile.glitchDuration <= 0) {
                            tile.isGlitching = false;
                            tile.glitchTimer = 2 + Math.random() * 3;
                        }
                    } else {
                        tile.glitchTimer -= dt;
                        if (tile.glitchTimer <= 0) {
                            tile.isGlitching = true;
                            tile.glitchDuration = 0.3;
                        }
                    }
                }

                let targetFlip = (tile.isRevealed || tile.isAligned) ? 1 : 0;
                tile.flipAnim += (targetFlip - tile.flipAnim) * 15 * dt;
            }
        }
    } else if (gameState === 'level_complete') {
        winAnimTimer += dt;
        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
                let tile = grid[y][x];
                tile.flipAnim += (1 - tile.flipAnim) * 15 * dt;
            }
        }
    }
}

function drawFaceDown(size, tileX, tileY, time) {
    let angle = time + (tileX + tileY) * 0.5;
    let x2 = Math.cos(angle) * size;
    let y2 = Math.sin(angle) * size;
    
    let grad = ctx.createLinearGradient(-x2, -y2, x2, y2);
    grad.addColorStop(0, '#d0d0d0');
    grad.addColorStop(0.5, '#ffffff');
    grad.addColorStop(1, '#e0e0e0');
    ctx.fillStyle = grad;
    ctx.fillRect(-size/2 + 2, -size/2 + 2, size - 4, size - 4);

    ctx.globalCompositeOperation = 'overlay';
    let grad2 = ctx.createLinearGradient(x2, -y2, -x2, y2);
    grad2.addColorStop(0, 'rgba(136, 224, 239, 0.6)');
    grad2.addColorStop(0.5, 'rgba(255, 153, 200, 0.6)');
    grad2.addColorStop(1, 'rgba(252, 246, 189, 0.6)');
    ctx.fillStyle = grad2;
    ctx.fillRect(-size/2 + 2, -size/2 + 2, size - 4, size - 4);
    ctx.globalCompositeOperation = 'source-over';

    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(-size/2 + 2, -size/2 + 2, size - 4, size - 4);
}

function drawFaceUp(tile, size) {
    if (tile.isGlitching) {
        ctx.save();
        ctx.translate((Math.random()-0.5)*4, (Math.random()-0.5)*4);
        ctx.fillStyle = tile.trueColor;
        ctx.fillRect(-size/2 + 2, -size/2 + 2, size - 4, size - 4);
        
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        for(let i=0; i<5; i++) {
            let y = -size/2 + Math.random() * size;
            let h = Math.random() * 4;
            ctx.fillRect(-size/2 + 2, y, size - 4, h);
        }
        ctx.restore();
    } else {
        ctx.fillStyle = tile.displayColor;
        ctx.fillRect(-size/2 + 2, -size/2 + 2, size - 4, size - 4);
    }

    if (tile.isAligned) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.strokeRect(-size/2 + 4, -size/2 + 4, size - 8, size - 8);
    }
}

function drawTileAt(tile, px, py, logicalX, logicalY, time) {
    ctx.save();
    ctx.translate(px + cellSize/2, py + cellSize/2);
    
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(-cellSize/2 + 6, -cellSize/2 + 6, cellSize - 4, cellSize - 4);

    let scaleX = Math.cos(tile.flipAnim * Math.PI);
    ctx.scale(scaleX, 1);

    if (scaleX > 0) {
        drawFaceDown(cellSize, logicalX, logicalY, time);
    } else {
        ctx.scale(-1, 1);
        drawFaceUp(tile, cellSize);
    }
    ctx.restore();
}

function drawTiles(time) {
    for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
            let tile = grid[y][x];
            let drawX = boardX + x * cellSize + tile.animOffsetX;
            let drawY = boardY + y * cellSize + tile.animOffsetY;

            if (dragInfo && dragInfo.axis === 'x' && dragInfo.row === y) drawX += dragInfo.offset;
            if (dragInfo && dragInfo.axis === 'y' && dragInfo.col === x) drawY += dragInfo.offset;

            let wrappedX = boardX + ((drawX - boardX) % boardWidth);
            if (wrappedX < boardX) wrappedX += boardWidth;
            let wrappedY = boardY + ((drawY - boardY) % boardHeight);
            if (wrappedY < boardY) wrappedY += boardHeight;

            drawTileAt(tile, wrappedX, wrappedY, x, y, time);

            if (wrappedX < boardX + cellSize) drawTileAt(tile, wrappedX + boardWidth, wrappedY, x, y, time);
            if (wrappedX > boardX + boardWidth - cellSize) drawTileAt(tile, wrappedX - boardWidth, wrappedY, x, y, time);
            if (wrappedY < boardY + cellSize) drawTileAt(tile, wrappedX, wrappedY + boardHeight, x, y, time);
            if (wrappedY > boardY + boardHeight - cellSize) drawTileAt(tile, wrappedX, wrappedY - boardHeight, x, y, time);
        }
    }
}

function drawWinAnimation(width, height) {
    let scale = Math.min(winAnimTimer * 2, 1);
    let alpha = 1 - Math.max(0, (winAnimTimer - 1.5) * 2);

    ctx.save();
    ctx.translate(width/2, height/2);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(-50, 0, 30, Math.PI/2, Math.PI*1.5);
    ctx.arc(50, 0, 30, -Math.PI/2, Math.PI/2);
    ctx.closePath();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(-50, 0, 15, 0, Math.PI*2);
    ctx.arc(50, 0, 15, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.fill();

    for(let i=0; i<8; i++) {
        let angle = winAnimTimer * 5 + i * Math.PI/4;
        let r = 80 + Math.sin(winAnimTimer * 10 + i) * 20;
        ctx.fillStyle = PALETTE.cyan;
        ctx.beginPath();
        ctx.arc(Math.cos(angle)*r, Math.sin(angle)*r, 6, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.restore();
}

function draw(time) {
    let width = window.innerWidth;
    let height = window.innerHeight;
    
    ctx.clearRect(0, 0, width, height);

    if (gameState === 'title') {
        ctx.fillStyle = isLightMode ? '#111' : 'white';
        ctx.textAlign = 'center';
        ctx.font = 'bold 32px ui-monospace, monospace';
        ctx.fillText('LATENT GRADIENT', width/2, height/2 - 50);
        ctx.font = '16px ui-monospace, monospace';
        ctx.fillText('Tap to peek. Swipe to align.', width/2, height/2 + 20);
        ctx.globalAlpha = 0.5 + Math.sin(time*5)*0.5;
        ctx.fillText('TAP TO START', width/2, height/2 + 80);
        ctx.globalAlpha = 1.0;
        return;
    }

    ctx.save();
    for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
            let drawX = boardX + x * cellSize;
            let drawY = boardY + y * cellSize;
            ctx.fillStyle = targetGrid[y][x];
            ctx.globalAlpha = 0.15;
            ctx.fillRect(drawX + 4, drawY + 4, cellSize - 8, cellSize - 8);
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = isLightMode ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.2)';
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(drawX + 4, drawY + 4, cellSize - 8, cellSize - 8);
            ctx.setLineDash([]);
        }
    }

    ctx.beginPath();
    ctx.rect(boardX - 20, boardY - 20, boardWidth + 40, boardHeight + 40);
    ctx.clip();
    drawTiles(time);
    ctx.restore();

    let textColor = isLightMode ? '#111' : 'white';
    ctx.fillStyle = textColor;
    ctx.textAlign = 'left';
    ctx.font = '20px ui-monospace, monospace';
    ctx.fillText(`LVL ${level}`, 20, 40);
    
    ctx.textAlign = 'right';
    ctx.fillStyle = timeRemaining < 10 ? PALETTE.magenta : textColor;
    ctx.fillText(timeRemaining.toFixed(1), width - 20, 40);

    if (gameState === 'level_complete') {
        drawWinAnimation(width, height);
    } else if (gameState === 'game_over') {
        ctx.fillStyle = isLightMode ? 'rgba(255,255,255,0.8)' : 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px ui-monospace, monospace';
        ctx.fillText('HAZE FADED', width/2, height/2 - 20);
        ctx.font = '18px ui-monospace, monospace';
        ctx.fillText(`Reached Level ${level}`, width/2, height/2 + 30);
        
        ctx.beginPath();
        ctx.roundRect(width/2 - 80, height/2 + 80, 160, 50, 25);
        ctx.fillStyle = PALETTE.cyan;
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.font = 'bold 20px ui-monospace, monospace';
        ctx.fillText('RESTART', width/2, height/2 + 112);
    }
}

let lastTime = performance.now();
function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;
    update(dt);
    draw(now / 1000);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
