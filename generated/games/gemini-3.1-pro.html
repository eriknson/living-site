<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Prism Bloom</title>
<style>
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #F2EBE3;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column;
  }
  #score {
    padding: 20px; font-size: 24px; font-weight: bold; color: #333;
    text-align: center; text-shadow: 0 2px 4px rgba(255,255,255,0.5);
  }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(242, 235, 227, 0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: auto; transition: opacity 0.3s;
  }
  #overlay h1 { font-size: 32px; color: #333; margin: 0 0 10px 0; }
  #overlay p { font-size: 18px; color: #666; margin: 0 0 30px 0; max-width: 300px; text-align: center; line-height: 1.4; }
  button {
    appearance: none; background: #FF7733; color: white; border: none;
    padding: 15px 30px; font-size: 20px; font-family: inherit; font-weight: bold;
    border-radius: 30px; cursor: pointer; box-shadow: 0 4px 12px rgba(255,119,51,0.3);
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }
  
  @media (prefers-color-scheme: dark) {
    body { background: #1A1C23; }
    #score { color: #EEE; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    #overlay { background: rgba(26, 28, 35, 0.9); }
    #overlay h1 { color: #EEE; }
    #overlay p { color: #AAA; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="score">0</div>
</div>
<div id="overlay">
  <h1>Prism Bloom</h1>
  <p>Flick prisms to bend the sun's rays onto the origami flowers before they wither in the shade.</p>
  <button id="startBtn">Play</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let width, height;

const FRICTION = 0.95;
const BOUNCE = 0.7;

let gameStarted = false;
let gameOver = false;
let score = 0;
let time = 0;

let prisms = [];
let flowers = [];
let clouds = [];
let particles = [];
let activeRays = [];

let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playBell(noteIndex) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
    let octave = Math.floor(noteIndex / scale.length);
    let note = scale[noteIndex % scale.length];
    osc.frequency.value = note * Math.pow(2, octave);
    osc.type = 'sine';
    
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 2.0);
}

function playClink() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.frequency.setValueAtTime(1500 + Math.random()*500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
    osc.type = 'sine';
    
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

function vibrate(pattern) {
    if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch(e) {}
    }
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

function startGame() {
    initAudio();
    gameStarted = true;
    gameOver = false;
    score = 0;
    document.getElementById('score').innerText = score;
    document.getElementById('overlay').style.opacity = '0';
    setTimeout(() => {
        if (gameStarted) document.getElementById('overlay').style.display = 'none';
    }, 300);
    
    prisms = [
        {type: 'prism', x: width*0.3, y: height*0.8, vx: 0, vy: 0, radius: 25, angle: 0, isActive: false, dragging: false},
        {type: 'prism', x: width*0.5, y: height*0.7, vx: 0, vy: 0, radius: 25, angle: 0, isActive: false, dragging: false},
        {type: 'prism', x: width*0.7, y: height*0.8, vx: 0, vy: 0, radius: 25, angle: 0, isActive: false, dragging: false}
    ];
    flowers = [];
    clouds = [];
    particles = [];
}

function endGame() {
    gameOver = true;
    vibrate([100, 50, 100, 50, 200]);
    document.getElementById('overlay').style.display = 'flex';
    void document.getElementById('overlay').offsetWidth;
    document.getElementById('overlay').style.opacity = '1';
    document.querySelector('#overlay h1').innerText = 'Game Over';
    document.querySelector('#overlay p').innerText = `You bloomed ${score} flowers.`;
    document.getElementById('startBtn').innerText = 'Play Again';
}

document.getElementById('startBtn').addEventListener('click', startGame);

function rayCircleIntersect(ro, rd, center, radius) {
    let vx = ro.x - center.x;
    let vy = ro.y - center.y;
    let b = 2 * (rd.x * vx + rd.y * vy);
    let c = (vx * vx + vy * vy) - radius * radius;
    let d = b * b - 4 * c;
    if (d < 0) return null;
    let t1 = (-b - Math.sqrt(d)) / 2;
    let t2 = (-b + Math.sqrt(d)) / 2;
    let t = -1;
    if (t1 > 0.001) t = t1;
    else if (t2 > 0.001) t = t2;
    if (t < 0) return null;
    return t;
}

function castRay(ro, rd, ignoreObj) {
    let closestT = Infinity;
    let closestObj = null;

    for (let c of clouds) {
        let t = rayCircleIntersect(ro, rd, c, c.radius);
        if (t !== null && t < closestT) { closestT = t; closestObj = c; }
    }
    for (let f of flowers) {
        if (f === ignoreObj) continue;
        let t = rayCircleIntersect(ro, rd, f, f.radius);
        if (t !== null && t < closestT) { closestT = t; closestObj = f; }
    }
    for (let p of prisms) {
        if (p === ignoreObj) continue;
        let t = rayCircleIntersect(ro, rd, p, p.radius);
        if (t !== null && t < closestT) { closestT = t; closestObj = p; }
    }

    if (closestT === Infinity) return null;
    return {t: closestT, object: closestObj, type: closestObj.type};
}

function processPrism(prism, depth = 0) {
    if (depth > 10) return;
    
    let validTargets = [];
    let candidates = [...flowers, ...prisms.filter(p => !p.isActive && p !== prism)];
    for (let target of candidates) {
        let dx = target.x - prism.x;
        let dy = target.y - prism.y;
        let dist = Math.hypot(dx, dy);
        let dir = {x: dx/dist, y: dy/dist};
        
        let losHit = castRay({x: prism.x, y: prism.y}, dir, prism);
        if (losHit && losHit.object === target) {
            validTargets.push({target, dist});
        }
    }
    
    validTargets.sort((a, b) => a.dist - b.dist);
    let targetsToHit = validTargets.slice(0, 2);
    
    for (let {target} of targetsToHit) {
        activeRays.push({start: {x: prism.x, y: prism.y}, end: {x: target.x, y: target.y}});
        if (target.type === 'flower') {
            target.isLit = true;
        } else if (target.type === 'prism') {
            target.isActive = true;
            processPrism(target, depth + 1);
        }
    }
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 20; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 50 + Math.random() * 100;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: color
        });
    }
}

let draggedPrism = null;
let lastTouch = null;
let touchVel = {x: 0, y: 0};

function handleDown(x, y) {
    if (gameOver || !gameStarted) return;
    for (let p of prisms) {
        let dist = Math.hypot(p.x - x, p.y - y);
        if (dist < p.radius + 30) {
            draggedPrism = p;
            p.dragging = true;
            p.vx = 0; p.vy = 0;
            lastTouch = {x, y, time: performance.now()};
            break;
        }
    }
}

function handleMove(x, y) {
    if (draggedPrism) {
        let now = performance.now();
        let dt = (now - lastTouch.time) / 1000;
        if (dt > 0) {
            touchVel.x = (x - lastTouch.x) / dt;
            touchVel.y = (y - lastTouch.y) / dt;
        }
        draggedPrism.x = x;
        draggedPrism.y = y;
        lastTouch = {x, y, time: now};
    }
}

function handleUp() {
    if (draggedPrism) {
        draggedPrism.dragging = false;
        let speed = Math.hypot(touchVel.x, touchVel.y);
        if (speed > 2000) {
            touchVel.x = (touchVel.x / speed) * 2000;
            touchVel.y = (touchVel.y / speed) * 2000;
        }
        draggedPrism.vx = touchVel.x;
        draggedPrism.vy = touchVel.y;
        draggedPrism = null;
    }
}

canvas.addEventListener('touchstart', e => { e.preventDefault(); let t = e.touches[0]; handleDown(t.clientX, t.clientY); }, {passive: false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); let t = e.touches[0]; handleMove(t.clientX, t.clientY); }, {passive: false});
canvas.addEventListener('touchend', e => { e.preventDefault(); handleUp(); }, {passive: false});
canvas.addEventListener('mousedown', e => { handleDown(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { handleMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', e => { handleUp(); });

let lastTime = 0;
function loop(t) {
    requestAnimationFrame(loop);
    let dt = (t - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = t;
    time = t;
    
    if (!gameOver && gameStarted) {
        update(dt, t);
    }
    draw(t);
}

function update(dt, t) {
    let wind = Math.sin(t * 0.0005) * Math.cos(t * 0.0002) * Math.min(score * 20, 300);
    
    // Prisms
    prisms.forEach(p => {
        if (!p.dragging) {
            p.vx += wind * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= Math.pow(FRICTION, dt * 60);
            p.vy *= Math.pow(FRICTION, dt * 60);
            
            if (p.x - p.radius < 0) { p.x = p.radius; if(Math.abs(p.vx)>50){ p.vx *= -BOUNCE; playClink(); } else p.vx=0; }
            if (p.x + p.radius > width) { p.x = width - p.radius; if(Math.abs(p.vx)>50){ p.vx *= -BOUNCE; playClink(); } else p.vx=0; }
            if (p.y - p.radius < 0) { p.y = p.radius; if(Math.abs(p.vy)>50){ p.vy *= -BOUNCE; playClink(); } else p.vy=0; }
            if (p.y + p.radius > height) { p.y = height - p.radius; if(Math.abs(p.vy)>50){ p.vy *= -BOUNCE; playClink(); } else p.vy=0; }
        }
        p.angle += (Math.abs(p.vx) + Math.abs(p.vy)) * 0.001 * dt;
    });
    
    // Prism collisions
    for (let i=0; i<prisms.length; i++) {
        for (let j=i+1; j<prisms.length; j++) {
            let p1 = prisms[i];
            let p2 = prisms[j];
            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let dist = Math.hypot(dx, dy);
            let minDist = p1.radius + p2.radius;
            if (dist < minDist) {
                let overlap = minDist - dist;
                let nx = dx / dist;
                let ny = dy / dist;
                p1.x -= nx * overlap / 2;
                p1.y -= ny * overlap / 2;
                p2.x += nx * overlap / 2;
                p2.y += ny * overlap / 2;
                let kx = (p1.vx - p2.vx);
                let ky = (p1.vy - p2.vy);
                let p = 2.0 * (nx * kx + ny * ky) / 2.0;
                p1.vx -= p * nx * BOUNCE;
                p1.vy -= p * ny * BOUNCE;
                p2.vx += p * nx * BOUNCE;
                p2.vy += p * ny * BOUNCE;
                if (Math.abs(p) > 50) playClink();
            }
        }
    }
    
    // Clouds
    if (Math.random() < dt * (0.2 + score * 0.02)) {
        let r = 40 + Math.random() * 60;
        let y = r + Math.random() * (height - 2*r);
        let fromLeft = Math.random() > 0.5;
        clouds.push({
            type: 'cloud',
            x: fromLeft ? -r : width + r,
            y: y,
            radius: r,
            vx: (fromLeft ? 1 : -1) * (50 + Math.random() * 50 + score * 2)
        });
    }
    for (let i = clouds.length - 1; i >= 0; i--) {
        let c = clouds[i];
        c.x += c.vx * dt;
        if ((c.vx > 0 && c.x - c.radius > width) || (c.vx < 0 && c.x + c.radius < 0)) {
            clouds.splice(i, 1);
        }
    }
    
    // Flowers
    if (flowers.length < Math.min(1 + Math.floor(score / 5), 4)) {
        if (Math.random() < dt * 0.5) {
            let r = 15;
            let x = r + 20 + Math.random() * (width - 2*r - 40);
            let y = height * 0.3 + Math.random() * (height * 0.6);
            flowers.push({
                type: 'flower', x, y, radius: r, life: 15, maxLife: 15, bloomProgress: 0, isLit: false
            });
        }
    }
    
    // Light Logic
    prisms.forEach(p => p.isActive = false);
    flowers.forEach(f => f.isLit = false);
    activeRays = [];
    
    let sunX = width/2 + Math.sin(t * 0.001) * (width/3);
    let sunOrigin = {x: sunX, y: 0};
    let sunDir = {x: 0, y: 1};
    
    let hit = castRay(sunOrigin, sunDir, null);
    if (hit) {
        activeRays.push({start: sunOrigin, end: {x: sunOrigin.x + sunDir.x * hit.t, y: sunOrigin.y + sunDir.y * hit.t}});
        if (hit.type === 'prism') {
            hit.object.isActive = true;
            processPrism(hit.object);
        } else if (hit.type === 'flower') {
            hit.object.isLit = true;
        }
    } else {
        activeRays.push({start: sunOrigin, end: {x: sunOrigin.x + sunDir.x * height, y: sunOrigin.y + sunDir.y * height}});
    }
    
    // Flower state
    for (let i = flowers.length - 1; i >= 0; i--) {
        let f = flowers[i];
        if (f.isLit) {
            f.bloomProgress += dt / 0.5;
            if (f.bloomProgress >= 1) {
                score++;
                document.getElementById('score').innerText = score;
                playBell(score);
                vibrate([30, 50, 30]);
                spawnParticles(f.x, f.y, '#FF7733');
                flowers.splice(i, 1);
            }
        } else {
            f.bloomProgress = Math.max(0, f.bloomProgress - dt);
            f.life -= dt;
            if (f.life <= 0) {
                endGame();
            }
        }
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawHexagon(ctx, x, y, r, angle) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        let a = angle + i * Math.PI / 3;
        let px = x + Math.cos(a) * r;
        let py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
}

function drawFlower(ctx, x, y, r, bloomProgress, isLit, colors) {
    let scale = 1 + bloomProgress * 0.2;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
        let a = i * Math.PI / 4;
        let rad = i % 2 === 0 ? r : r * 0.4;
        let px = Math.cos(a) * rad;
        let py = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = isLit ? colors.flowerLit : colors.flowerUnlit;
    ctx.fill();
    
    ctx.beginPath();
    for (let i = 0; i < 8; i+=2) {
        let a = i * Math.PI / 4;
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    ctx.restore();
}

function draw(t) {
    let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    let colors = {
        bgTop: isDark ? '#2D323C' : '#DCE2E8',
        bgBot: isDark ? '#1A1C23' : '#F2EBE3',
        cloud: isDark ? 'rgba(0,0,0,0.4)' : 'rgba(0,0,0,0.1)',
        beam: isDark ? '#FFDD44' : '#FFBB00',
        beamGlow: isDark ? 'rgba(255,221,68,0.3)' : 'rgba(255,187,0,0.3)',
        prismFill: isDark ? 'rgba(136,204,255,0.2)' : 'rgba(255,255,255,0.6)',
        prismStroke: isDark ? '#88CCFF' : '#FFFFFF',
        flowerUnlit: isDark ? '#444' : '#A0A5B0',
        flowerLit: '#FF7733',
        text: isDark ? '#EEE' : '#333'
    };
    
    let grd = ctx.createLinearGradient(0, 0, 0, height);
    grd.addColorStop(0, colors.bgTop);
    grd.addColorStop(1, colors.bgBot);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, width, height);
    
    // Wind haze
    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
    let wind = Math.sin(t * 0.0005) * Math.cos(t * 0.0002) * Math.min(score * 20, 300);
    for(let i=0; i<20; i++) {
        let px = (t * 0.05 * (wind > 0 ? 1 : -1) + i * 50) % width;
        if (px < 0) px += width;
        let py = (i * 37) % height;
        ctx.fillRect(px, py, 20 + Math.abs(wind)*0.1, 2);
    }
    
    // Clouds
    ctx.fillStyle = colors.cloud;
    clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2);
        ctx.fill();
    });
    
    // Rays
    ctx.lineCap = 'round';
    activeRays.forEach(ray => {
        ctx.beginPath();
        ctx.moveTo(ray.start.x, ray.start.y);
        ctx.lineTo(ray.end.x, ray.end.y);
        ctx.strokeStyle = colors.beamGlow;
        ctx.lineWidth = 12;
        ctx.stroke();
        ctx.strokeStyle = colors.beam;
        ctx.lineWidth = 4;
        ctx.stroke();
    });
    
    // Flowers
    flowers.forEach(f => {
        drawFlower(ctx, f.x, f.y, f.radius, f.bloomProgress, f.isLit, colors);
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius + 8, -Math.PI/2, -Math.PI/2 + (f.life / f.maxLife) * Math.PI * 2);
        ctx.strokeStyle = f.life < 3 ? '#FF3333' : colors.text;
        ctx.lineWidth = 2;
        ctx.stroke();
    });
    
    // Prisms
    prisms.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        drawHexagon(ctx, 0, 0, p.radius, 0);
        ctx.fillStyle = colors.prismFill;
        ctx.fill();
        ctx.strokeStyle = colors.prismStroke;
        ctx.lineWidth = 2;
        if (p.isActive) {
            ctx.shadowColor = colors.beam;
            ctx.shadowBlur = 10;
            ctx.strokeStyle = colors.beam;
        }
        ctx.stroke();
        ctx.restore();
    });
    
    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });
    
    // Sun
    let sunX = width/2 + Math.sin(t * 0.001) * (width/3);
    ctx.fillStyle = colors.beam;
    ctx.beginPath();
    ctx.arc(sunX, 0, 20, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowColor = colors.beam;
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;
}

requestAnimationFrame(loop);
</script>
</body>
</html>
