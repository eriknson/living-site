<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sort Flow</title>
<style>
    body, html {
        margin: 0; padding: 0;
        width: 100dvw; height: 100dvh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    :root {
        --bg: #f4f4f5;
        --text: #18181b;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0f0f11;
            --text: #eee;
        }
    }
    #ui {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .screen {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        background: var(--bg);
        padding: 40px;
        border: 2px solid var(--text);
        border-radius: 24px;
        pointer-events: auto;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    @media (prefers-color-scheme: dark) {
        .screen { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    }
    .active { display: flex; }
    h1 { 
        font-size: 2.5rem; 
        font-weight: 600; 
        margin: 0 0 10px 0; 
        letter-spacing: -2px; 
        text-transform: uppercase; 
    }
    p { 
        font-size: 1.1rem; 
        opacity: 0.7; 
        margin: 0 0 30px 0; 
    }
    .btn {
        padding: 16px 40px;
        font-size: 1.2rem;
        font-weight: 600;
        border: 2px solid var(--text);
        border-radius: 50px;
        background: var(--bg);
        color: var(--text);
        font-family: inherit;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s ease;
    }
    .btn:active {
        background: var(--text);
        color: var(--bg);
        transform: scale(0.95);
    }
    #score-display {
        position: absolute;
        top: 8dvh;
        width: 100%;
        text-align: center;
        font-size: 5rem;
        font-weight: 200;
        opacity: 0.08;
        pointer-events: none;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score-display">0</div>
<div id="ui">
    <div id="title-screen" class="screen active">
        <h1>SORT FLOW</h1>
        <p>Swipe left/right to align bins<br>with falling notes.</p>
        <button class="btn" id="start-btn">PLAY</button>
    </div>
    <div id="gameover-screen" class="screen">
        <h1>GAME OVER</h1>
        <p id="final-score">Score: 0</p>
        <button class="btn" id="restart-btn">REPLAY</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let width, height;
let staffWidth, laneWidth, staffLeft, staffTop, staffHeight, catchY, binHeight;
let swipeThreshold = 60;

function getColors() {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    return {
        bg: isDark ? '#0f0f11' : '#f4f4f5',
        staff: isDark ? '#2a2a2a' : '#d4d4d8',
        note: isDark ? '#ffffff' : '#18181b',
        accent: isDark ? '#5ce1e6' : '#00a8cc'
    };
}
let colors = getColors();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    colors = getColors();
});

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    
    staffWidth = Math.min(width * 0.85, 450);
    laneWidth = staffWidth / 4;
    staffLeft = (width - staffWidth) / 2;
    staffTop = 0;
    staffHeight = height;
    catchY = height - Math.max(100, height * 0.15);
    binHeight = Math.min(80, laneWidth);
    
    swipeThreshold = Math.max(40, Math.min(80, width / 6));
}
window.addEventListener('resize', resize);
resize();

// Audio
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'catch') {
        osc.type = 'sine';
        const freq = scale[score % scale.length] * (1 + Math.floor(score/scale.length)*0.25);
        osc.frequency.setValueAtTime(freq, t);
        
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        
        osc.start(t);
        osc.stop(t + 0.3);
    } else if (type === 'over') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.3);
        
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        
        osc.start(t);
        osc.stop(t + 0.3);
    }
}

// Game State
let state = 'title'; // title, playing, gameover
let score = 0;
let highScore = 0;
let notes = [];
let particles = [];
let binFlashes = [0, 0, 0, 0];

let currentOffset = 0;
let targetOffset = 0;
let offsetVel = 0;

let currentReqOffset = 0;
let spawnTimer = 0;

function startGame() {
    initAudio();
    state = 'playing';
    score = 0;
    notes = [];
    particles = [];
    binFlashes = [0, 0, 0, 0];
    
    // Snap to center gently
    targetOffset = Math.round(currentOffset);
    currentReqOffset = targetOffset;
    
    spawnTimer = 1.0;
    document.getElementById('title-screen').classList.remove('active');
    document.getElementById('gameover-screen').classList.remove('active');
    updateScore();
}

function gameOver() {
    state = 'gameover';
    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
    playSound('over');
    if (score > highScore) highScore = score;
    document.getElementById('gameover-screen').classList.add('active');
    document.getElementById('final-score').innerText = 'Score: ' + score + '\nBest: ' + highScore;
}

function updateScore() {
    document.getElementById('score-display').innerText = score;
}

// Input
let touchStartX = 0;
let currentSwipeOffset = 0;

window.addEventListener('touchstart', e => {
    if (state !== 'playing') return;
    if (e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    if (e.touches.length > 1) return;
    touchStartX = e.touches[0].clientX;
    currentSwipeOffset = targetOffset;
}, {passive: false});

window.addEventListener('touchmove', e => {
    if (state !== 'playing') return;
    if (e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    if (e.touches.length > 1) return;
    let x = e.touches[0].clientX;
    let dx = x - touchStartX;
    let swipes = Math.round(dx / swipeThreshold);
    if (currentSwipeOffset + swipes !== targetOffset) {
        targetOffset = currentSwipeOffset + swipes;
        if (navigator.vibrate) navigator.vibrate(10);
    }
}, {passive: false});

window.addEventListener('keydown', e => {
    if (state !== 'playing') return;
    if (e.key === 'ArrowRight') { targetOffset += 1; }
    if (e.key === 'ArrowLeft') { targetOffset -= 1; }
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

function createParticles(x, y, color) {
    for (let i=0; i<12; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 200 + 50;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 100,
            life: 1.0,
            color: color
        });
    }
}

// Draw Utils
function drawNoteSymbol(ctx, type, x, y, size, color) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(2, size * 0.15);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    if (type === 0) { // Quarter
        ctx.beginPath();
        ctx.ellipse(x - size*0.1, y + size*0.2, size*0.35, size*0.25, -0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x + size*0.2, y + size*0.2);
        ctx.lineTo(x + size*0.2, y - size*0.5);
        ctx.stroke();
    } else if (type === 1) { // Beamed
        ctx.beginPath();
        ctx.ellipse(x - size*0.3, y + size*0.2, size*0.25, size*0.18, -0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + size*0.4, y + size*0.05, size*0.25, size*0.18, -0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x - size*0.1, y + size*0.2);
        ctx.lineTo(x - size*0.1, y - size*0.4);
        ctx.moveTo(x + size*0.6, y + size*0.05);
        ctx.lineTo(x + size*0.6, y - size*0.55);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - size*0.1, y - size*0.4);
        ctx.lineTo(x + size*0.6, y - size*0.55);
        ctx.lineWidth = size*0.25;
        ctx.stroke();
    } else if (type === 2) { // Sharp
        let w = size * 0.2;
        ctx.beginPath();
        ctx.moveTo(x - w, y - size*0.5);
        ctx.lineTo(x - w, y + size*0.5);
        ctx.moveTo(x + w, y - size*0.5);
        ctx.lineTo(x + w, y + size*0.5);
        ctx.stroke();
        ctx.lineWidth = size*0.2;
        ctx.beginPath();
        ctx.moveTo(x - size*0.5, y - size*0.1);
        ctx.lineTo(x + size*0.5, y - size*0.3);
        ctx.moveTo(x - size*0.5, y + size*0.3);
        ctx.lineTo(x + size*0.5, y + size*0.1);
        ctx.stroke();
    } else if (type === 3) { // Flat
        ctx.beginPath();
        ctx.moveTo(x - size*0.15, y - size*0.6);
        ctx.lineTo(x - size*0.15, y + size*0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - size*0.15, y - size*0.1);
        ctx.bezierCurveTo(x + size*0.6, y - size*0.3, x + size*0.6, y + size*0.5, x - size*0.15, y + size*0.4);
        ctx.stroke();
    }
}

function update(dt) {
    // Spring physics for bins
    let force = (targetOffset - currentOffset) * 300;
    let damping = offsetVel * 15;
    offsetVel += (force - damping) * dt;
    currentOffset += offsetVel * dt;
    
    for (let i=0; i<4; i++) if (binFlashes[i] > 0) binFlashes[i] -= dt * 4;
    
    let speed = (height * 0.4) * dt;
    if (state === 'playing') speed *= (1 + score * 0.02);
    
    // Spawning
    if (state === 'playing' || state === 'title') {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            let diff = 0;
            if (state === 'title') {
                diff = Math.random() < 0.5 ? 1 : -1;
                spawnTimer = 1.0;
            } else {
                let options = [-1, 0, 1];
                if (score > 10) options = [-1, 1];
                if (score > 25) options = [-1, 1, -2, 2];
                diff = score === 0 ? 0 : options[Math.floor(Math.random() * options.length)];
                
                let timePerSwipe = 0.25; 
                let baseTime = Math.max(0.35, 0.8 - score * 0.015);
                spawnTimer = baseTime + Math.abs(diff) * timePerSwipe;
            }
            
            currentReqOffset += diff;
            let lane = Math.floor(Math.random() * 4);
            let type = (((lane - currentReqOffset) % 4) + 4) % 4;
            
            notes.push({
                lane: lane,
                type: type,
                y: -50,
                caught: false,
                missed: false
            });
        }
    }
    
    // Demo mode auto-swipe
    if (state === 'title' && notes.length > 0) {
        let lowestNote = notes.find(n => !n.caught && !n.missed);
        if (lowestNote && lowestNote.y > catchY - 150) {
            let req = lowestNote.lane - lowestNote.type;
            let diff = (req - (targetOffset % 4)) % 4;
            diff = ((diff % 4) + 4) % 4; // positive modulo
            if (diff === 3) diff = -1;
            targetOffset += diff;
        }
    }
    
    // Move and catch notes
    for (let i = notes.length - 1; i >= 0; i--) {
        let note = notes[i];
        note.y += speed;
        
        if (note.y > catchY - binHeight/2 && note.y < catchY + binHeight/2) {
            if (!note.caught && !note.missed) {
                let binType = (((note.lane - Math.round(targetOffset)) % 4) + 4) % 4;
                if (binType === note.type) {
                    note.caught = true;
                    binFlashes[note.lane] = 1.0;
                    createParticles(staffLeft + note.lane * laneWidth + laneWidth/2, catchY, colors.accent);
                    if (state === 'playing') {
                        score++;
                        playSound('catch');
                        if (navigator.vibrate) navigator.vibrate(15);
                        updateScore();
                    }
                } else {
                    note.missed = true;
                    if (state === 'playing') gameOver();
                }
            }
        }
        
        if (note.y > height + 100) {
            notes.splice(i, 1);
        }
    }
    
    notes = notes.filter(n => !n.caught);
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 1000 * dt; // gravity
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, width, height);
    
    // Staff
    ctx.strokeStyle = colors.staff;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 4; i++) {
        let x = staffLeft + i * laneWidth;
        ctx.moveTo(x, staffTop);
        ctx.lineTo(x, staffHeight);
    }
    ctx.stroke();
    
    // Catch line
    ctx.strokeStyle = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(staffLeft, catchY);
    ctx.lineTo(staffLeft + staffWidth, catchY);
    ctx.stroke();
    
    // Bin flashes
    for (let i=0; i<4; i++) {
        if (binFlashes[i] > 0) {
            ctx.fillStyle = colors.accent;
            ctx.globalAlpha = binFlashes[i] * 0.3;
            ctx.fillRect(staffLeft + i * laneWidth, catchY - binHeight/2, laneWidth, binHeight);
            ctx.globalAlpha = 1;
        }
    }
    
    // Bins
    ctx.save();
    ctx.beginPath();
    ctx.rect(staffLeft, catchY - binHeight/2 - 20, staffWidth, binHeight + 40);
    ctx.clip();
    
    for (let i = -Math.ceil(currentOffset) - 2; i <= -Math.floor(currentOffset) + 5; i++) {
        let type = ((i % 4) + 4) % 4;
        let lane = i + currentOffset;
        let x = staffLeft + lane * laneWidth + laneWidth / 2;
        let y = catchY;
        
        ctx.fillStyle = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
        ctx.beginPath();
        ctx.roundRect(x - laneWidth/2 + 6, y - binHeight/2 + 6, laneWidth - 12, binHeight - 12, 12);
        ctx.fill();
        
        drawNoteSymbol(ctx, type, x, y, laneWidth * 0.3, colors.note);
    }
    ctx.restore();
    
    // Notes
    for (let note of notes) {
        let x = staffLeft + note.lane * laneWidth + laneWidth / 2;
        
        // Trail
        ctx.strokeStyle = colors.accent;
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.moveTo(x, note.y);
        ctx.lineTo(x, note.y - 40);
        ctx.stroke();
        ctx.globalAlpha = 1.0;
        
        let pop = Math.max(0, 50 - note.y) / 50;
        let size = laneWidth * 0.3 * (1 + pop * 0.4);
        
        drawNoteSymbol(ctx, note.type, x, note.y, size, note.missed ? '#ff4444' : colors.note);
    }
    
    // Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

let lastTime = performance.now();
function loop(time) {
    let dt = (time - lastTime) / 1000;
    lastTime = time;
    if (dt > 0.1) dt = 0.1;
    
    update(dt);
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
</body>
</html>
