<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorting Flow</title>
<style>
  :root {
    --bg: #F7F7F7;
    --line: #DDDDDD;
    --text: #111111;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --line: #333333;
      --text: #EEEEEE;
    }
  }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
  }
  #ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 10;
  }
  .screens {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    pointer-events: auto;
    transition: opacity 0.3s;
  }
  @supports (backdrop-filter: blur(10px)) {
    .screens {
      background: transparent;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    /* Add a semi-transparent overlay for contrast */
    .screens::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      opacity: 0.8;
      z-index: -1;
    }
  }
  .hidden {
    opacity: 0;
    pointer-events: none;
  }
  h1 {
    font-size: 32px;
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  p {
    font-size: 16px;
    opacity: 0.7;
    margin-bottom: 40px;
  }
  button {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 16px 32px;
    font-size: 20px;
    font-family: inherit;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s;
  }
  button:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
    <div id="start-screen" class="screens">
        <h1>Sorting Flow</h1>
        <p>Swipe left/right to sort notes</p>
        <button id="start-btn">Play</button>
    </div>
    <div id="game-over-screen" class="screens hidden">
        <h1>Game Over</h1>
        <p id="final-score">Score: 0</p>
        <button id="restart-btn">Play Again</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let width, height;
let dpr = 1;

// Game state
let gameState = 'start'; // start, playing, gameover
let notes = [];
let particles = [];
let score = 0;
let lives = 3;
let combo = 0;
let multiplier = 1;
let speed = 200;
let spawnInterval = 2.0;
let spawnTimer = 0;
let timeElapsed = 0;
let targets = [0, 1, 2, 3];
let hitScales = [0, 0, 0, 0];
let scoreScale = 1.0;
let shake = 0;

// Layout
const laneCount = 4;
let staffWidth, laneWidth, startX, targetY;

// Colors & Shapes
const colors = ['#FF5252', '#448AFF', '#FFB300', '#00E676'];

// Audio
let audioCtx;
const frequencies = [261.63, 293.66, 329.63, 392.00]; // C4, D4, E4, G4

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playNoteSound(lane) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(frequencies[lane], audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.stop(audioCtx.currentTime + 0.5);
}

function playMissSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.stop(audioCtx.currentTime + 0.2);
}

function playShiftSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.stop(audioCtx.currentTime + 0.05);
}

function triggerHaptic(heavy = false) {
    if (navigator.vibrate) {
        navigator.vibrate(heavy ? [50] : [15]);
    }
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    
    staffWidth = Math.min(width * 0.8, 400); // max width for tablets
    laneWidth = staffWidth / laneCount;
    startX = (width - staffWidth) / 2;
    targetY = height * 0.85;
}
window.addEventListener('resize', resize);
resize();

function drawShape(ctx, type, x, y, size, color, outlined = false, scale = 1.0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 4;
    
    const r = size / 2;
    
    if (type === 0) { // Circle
        ctx.arc(0, 0, r, 0, Math.PI * 2);
    } else if (type === 1) { // Square
        ctx.rect(-r, -r, size, size);
    } else if (type === 2) { // Triangle
        ctx.moveTo(0, -r);
        ctx.lineTo(r, r);
        ctx.lineTo(-r, r);
        ctx.closePath();
    } else if (type === 3) { // Diamond
        ctx.moveTo(0, -r);
        ctx.lineTo(r, 0);
        ctx.lineTo(0, r);
        ctx.lineTo(-r, 0);
        ctx.closePath();
    }
    
    if (outlined) {
        ctx.stroke();
    } else {
        ctx.fill();
    }
    
    ctx.restore();
}

function createParticles(x, y, type) {
    const color = colors[type];
    for (let i = 0; i < 20; i++) {
        let angle = Math.random() * Math.PI * 2;
        let pSpeed = Math.random() * 200 + 50;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * pSpeed,
            vy: Math.sin(angle) * pSpeed,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 2
        });
    }
}

function createMissParticles(x, y) {
    const color = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
    for (let i = 0; i < 20; i++) {
        let angle = Math.random() * Math.PI * 2;
        let pSpeed = Math.random() * 150 + 50;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * pSpeed,
            vy: Math.sin(angle) * pSpeed + 200,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 2
        });
    }
}

function spawnNote() {
    let lane = Math.floor(Math.random() * laneCount);
    let type = Math.floor(Math.random() * 4);
    
    notes.push({
        lane: lane,
        type: type,
        x: startX + lane * laneWidth + laneWidth / 2,
        y: -50
    });
}

function shiftRight() {
    targets.unshift(targets.pop());
    hitScales.unshift(hitScales.pop());
    playShiftSound();
}

function shiftLeft() {
    targets.push(targets.shift());
    hitScales.push(hitScales.shift());
    playShiftSound();
}

// Input
let touchStartX = 0;
let accumulatedSwipe = 0;
const SWIPE_THRESH = 40;
let isTouching = false;

window.addEventListener('touchstart', e => {
    if (gameState !== 'playing') return;
    touchStartX = e.touches[0].clientX;
    accumulatedSwipe = 0;
    isTouching = true;
}, {passive: false});

window.addEventListener('touchmove', e => {
    if (gameState !== 'playing') return;
    e.preventDefault();
    
    let currentX = e.touches[0].clientX;
    let diff = currentX - touchStartX;
    
    accumulatedSwipe += diff;
    touchStartX = currentX;
    
    while (accumulatedSwipe > SWIPE_THRESH) {
        shiftRight();
        accumulatedSwipe -= SWIPE_THRESH;
    }
    while (accumulatedSwipe < -SWIPE_THRESH) {
        shiftLeft();
        accumulatedSwipe += SWIPE_THRESH;
    }
}, {passive: false});

window.addEventListener('touchend', e => {
    isTouching = false;
});

window.addEventListener('keydown', e => {
    if (gameState !== 'playing') return;
    if (e.key === 'ArrowLeft' || e.key === 'a') {
        shiftLeft();
        accumulatedSwipe = -SWIPE_THRESH * 0.5; 
    }
    if (e.key === 'ArrowRight' || e.key === 'd') {
        shiftRight();
        accumulatedSwipe = SWIPE_THRESH * 0.5;
    }
});

function gameOver() {
    gameState = 'gameover';
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = `Score: ${score}`;
    triggerHaptic(true);
}

function restart() {
    notes = [];
    particles = [];
    score = 0;
    lives = 3;
    combo = 0;
    multiplier = 1;
    speed = 200;
    spawnInterval = 2.0;
    spawnTimer = 1.0;
    timeElapsed = 0;
    targets = [0, 1, 2, 3];
    hitScales = [0, 0, 0, 0];
    accumulatedSwipe = 0;
    gameState = 'playing';
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.add('hidden');
    initAudio();
}

document.getElementById('start-btn').addEventListener('click', restart);
document.getElementById('restart-btn').addEventListener('click', restart);

function update(dt) {
    if (gameState !== 'playing') return;
    
    timeElapsed += dt;
    speed = 200 + timeElapsed * 10;
    spawnInterval = Math.max(0.4, 2.0 - timeElapsed * 0.02);
    
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
        spawnNote();
        spawnTimer = spawnInterval;
    }
    
    if (!isTouching && Math.abs(accumulatedSwipe) > 0) {
        accumulatedSwipe *= 0.8;
        if (Math.abs(accumulatedSwipe) < 1) accumulatedSwipe = 0;
    }
    
    for (let i = 0; i < 4; i++) {
        hitScales[i] = Math.max(0, hitScales[i] - dt * 5);
    }
    scoreScale = Math.max(1.0, scoreScale - dt * 2);
    
    for (let i = notes.length - 1; i >= 0; i--) {
        let note = notes[i];
        note.y += speed * dt;
        
        if (note.y >= targetY) {
            if (targets[note.lane] === note.type) {
                // Hit
                combo++;
                multiplier = 1 + Math.floor(combo / 10);
                score += 10 * multiplier;
                scoreScale = 1.5;
                hitScales[note.lane] = 1.0;
                createParticles(note.x, targetY, note.type);
                playNoteSound(note.lane);
                triggerHaptic();
            } else {
                // Miss
                lives--;
                combo = 0;
                multiplier = 1;
                shake = 20;
                createMissParticles(note.x, targetY);
                playMissSound();
                triggerHaptic(true);
            }
            notes.splice(i, 1);
            
            if (lives <= 0) {
                gameOver();
            }
        }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function render() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    ctx.fillRect(0, 0, width, height);
    
    if (shake > 0) {
        ctx.save();
        let dx = (Math.random() - 0.5) * shake;
        let dy = (Math.random() - 0.5) * shake;
        ctx.translate(dx, dy);
        shake *= 0.9;
        if (shake < 1) shake = 0;
    }
    
    // Draw staff lines
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
    ctx.lineWidth = 2;
    for (let i = 0; i <= laneCount; i++) {
        let x = startX + i * laneWidth;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
    }
    
    // Draw target zone highlight
    let grad = ctx.createLinearGradient(0, targetY - 60, 0, targetY + 60);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.5, 'rgba(128, 128, 128, 0.1)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(startX, targetY - 60, staffWidth, 120);
    
    // Clip area for targets to stay within staff
    ctx.save();
    ctx.beginPath();
    ctx.rect(startX, 0, staffWidth, height);
    ctx.clip();
    
    let currentVisualOffset = (accumulatedSwipe / SWIPE_THRESH) * laneWidth;
    
    for (let i = 0; i < laneCount; i++) {
        let type = targets[i];
        let baseX = startX + i * laneWidth + laneWidth / 2;
        let x = baseX + currentVisualOffset;
        let scale = 1.0 + hitScales[i] * 0.5;
        
        drawShape(ctx, type, x, targetY, 40, colors[type], true, scale);
        
        // Duplicates for seamless wrapping
        drawShape(ctx, type, x - laneCount * laneWidth, targetY, 40, colors[type], true, scale);
        drawShape(ctx, type, x + laneCount * laneWidth, targetY, 40, colors[type], true, scale);
    }
    
    ctx.restore(); // end clip
    
    // Draw notes
    for (let note of notes) {
        // Trail
        ctx.beginPath();
        ctx.moveTo(note.x, note.y);
        ctx.lineTo(note.x, note.y - 40);
        let trailGrad = ctx.createLinearGradient(0, note.y, 0, note.y - 40);
        trailGrad.addColorStop(0, colors[note.type]);
        trailGrad.addColorStop(1, 'transparent');
        ctx.strokeStyle = trailGrad;
        ctx.lineWidth = 4;
        ctx.stroke();
        
        drawShape(ctx, note.type, note.x, note.y, 30, colors[note.type], false);
    }
    
    // Draw particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;
    
    // UI
    if (gameState === 'playing') {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
        ctx.textAlign = 'center';
        
        // Score
        ctx.save();
        ctx.translate(width / 2, 60);
        ctx.scale(scoreScale, scoreScale);
        ctx.font = 'bold 36px ui-monospace, "SFMono-Regular", Menlo, monospace';
        ctx.fillText(score.toString(), 0, 0);
        ctx.restore();
        
        // Multiplier
        if (multiplier > 1) {
            ctx.font = 'bold 18px ui-monospace, "SFMono-Regular", Menlo, monospace';
            ctx.fillStyle = colors[combo % 4];
            ctx.fillText('x' + multiplier, width / 2, 90);
        }
        
        // Lives
        const livesX = width - 40;
        const livesY = 50;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(livesX - i * 25, livesY, 8, 0, Math.PI * 2);
            if (i < lives) {
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
                ctx.fill();
            } else {
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
    }
    
    if (shake > 0) {
        ctx.restore();
    }
}

let lastTime = performance.now();
function loop(time) {
    requestAnimationFrame(loop);
    let dt = (time - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = time;
    
    update(dt);
    render();
}
requestAnimationFrame(loop);

</script>
</body>
</html>
