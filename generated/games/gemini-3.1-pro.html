<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricochet Bay</title>
<style>
/* Reset and base styles */
html, body {
  margin: 0; padding: 0;
  width: 100dvw; height: 100dvh;
  overflow: hidden;
  background-color: #020813;
  color: #E2E8F0;
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
canvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}
#ui {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 10;
  pointer-events: none;
  display: flex; flex-direction: column;
}
.hidden { display: none !important; }

/* HUD */
#hud {
  display: flex; justify-content: space-between; padding: clamp(10px, 3vw, 20px);
  font-size: clamp(0.9rem, 3.5vw, 1.2rem); font-weight: bold;
  text-shadow: 0 2px 5px rgba(0,0,0,0.8);
}
.hud-left { flex: 1; text-align: left; }
.hud-center { flex: 1; display: flex; justify-content: center; align-items: flex-start; }
.hud-right { flex: 1; text-align: right; }
#combo-el { transition: transform 0.2s ease-out, color 0.2s; display: inline-block; }

/* Screens */
.screens {
  flex-grow: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
.screen-panel {
  text-align: center;
  background: rgba(2, 8, 19, 0.7);
  padding: clamp(20px, 5vw, 40px); 
  border-radius: 20px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  pointer-events: auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  max-width: 90%;
}
h1 { margin: 0 0 10px 0; font-size: clamp(1.8rem, 6vw, 2.5rem); }
p { margin: 0 0 20px 0; color: #A0C0E0; font-size: clamp(0.9rem, 3vw, 1.1rem); line-height: 1.4; }

/* Button */
button {
  background: #FFB800; color: #000;
  border: none; padding: 15px 30px; font-size: 1.1rem;
  border-radius: 30px; font-family: inherit; font-weight: bold;
  cursor: pointer; margin-top: 10px;
  box-shadow: 0 4px 15px rgba(255, 184, 0, 0.3);
  transition: transform 0.1s, box-shadow 0.1s;
  touch-action: manipulation;
}
button:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(255, 184, 0, 0.3); }

/* specific styles */
.text-cyan { color: #00FFFF; text-shadow: 0 0 15px rgba(0,255,255,0.4); }
.text-amber { color: #FFB800; text-shadow: 0 0 15px rgba(255,184,0,0.4); }
.text-red { color: #FF4444; }
.text-muted { color: #88AABB; font-size: 0.8em; margin-top: 4px; }

@media (prefers-color-scheme: dark) {
  html, body {
    background-color: #01060f;
    color: #E8EDF5;
  }
  #hud { color: #E8EDF5; }
  .screen-panel {
    background: rgba(1, 6, 15, 0.82);
    border-color: rgba(255, 255, 255, 0.14);
    box-shadow: 0 24px 56px rgba(0, 0, 0, 0.65);
  }
  p { color: #9BB8D9; }
  button {
    background: #FFC033;
    color: #0a0a0a;
    box-shadow: 0 4px 18px rgba(255, 192, 51, 0.35);
  }
  .text-muted { color: #7a9ab8; }
}
</style>
</head>
<body>

<div id="ui">
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div>SCORE: <span id="score-el">0</span></div>
      <div class="text-muted">WAVE <span id="wave-el">1</span></div>
    </div>
    <div class="hud-center">
      <div style="width: clamp(80px, 25vw, 150px); height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; margin-top: 6px; overflow: hidden;">
         <div id="time-bar" style="width: 100%; height: 100%; background: #FFB800; border-radius: 4px; transition: width 0.1s linear, background-color 0.3s;"></div>
      </div>
    </div>
    <div class="hud-right">
      <div id="combo-el" class="text-cyan">1x COMBO</div>
      <div id="wind-el" class="text-muted">WIND: CALM</div>
    </div>
  </div>
  
  <div class="screens">
    <div id="title-screen" class="screen-panel">
      <h1 class="text-cyan">RICOCHET BAY</h1>
      <p style="max-width: 320px;">Drag anywhere to aim. Release to flick.<br><br>Bounce off seawalls to build combo multiplier. Hit gold targets to restore time.</p>
      <button id="start-btn">NIGHT SHIFT</button>
    </div>
    
    <div id="game-over-screen" class="screen-panel hidden">
      <h1 class="text-red">NIGHT FALLS</h1>
      <p style="font-size: 1.5rem; color: #FFF;">SCORE: <span id="final-score" class="text-amber"></span></p>
      <p>WAVES SURVIVED: <span id="final-wave" class="text-cyan"></span></p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>
</div>

<canvas id="game-canvas"></canvas>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;

// Audio context
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, type, duration, vol) {
  if(audioCtx.state === 'suspended') return; // Don't queue if suspended
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// State
let state = 'TITLE'; 
let score = 0, wave = 1, timeLeft = 0, combo = 1, targetsHit = 0;
let puck = { x: 0, y: 0, vx: 0, vy: 0, r: 16 };
let bumpers = [];
let target = { x: 0, y: 0, r: 24, angle: 0 };
let particles = [], floatTexts = [], trail = [];
let wind = { x: 0, y: 0 };

// Input
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let dragCurrent = { x: 0, y: 0 };
let timeScale = 1.0;
let shake = 0;
const keysDown = {};
let mouseDragging = false;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * window.devicePixelRatio;
  canvas.height = height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
window.addEventListener('resize', resize);
resize();

function spawnBumper(radius) {
  for(let i=0; i<50; i++) {
    let x = 40 + Math.random() * (width - 80);
    let y = 100 + Math.random() * (height - 150);
    let valid = true;
    for(let b of bumpers) {
      if(Math.hypot(x - b.x, y - b.y) < radius + b.r + 40) valid = false;
    }
    if (Math.hypot(x - puck.x, y - puck.y) < radius + puck.r + 60) valid = false;
    if (valid) {
      bumpers.push({x, y, r: radius, hitFlash: 0});
      break;
    }
  }
}

function spawnTarget() {
  for(let i=0; i<50; i++) {
    target.x = 50 + Math.random() * (width - 100);
    target.y = 100 + Math.random() * (height - 200);
    let valid = true;
    for (let b of bumpers) {
      if (Math.hypot(target.x - b.x, target.y - b.y) < target.r + b.r + 30) valid = false;
    }
    if (valid) break;
  }
}

function spawnParticles(x, y, count, color) {
  for(let i=0; i<count; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = Math.random() * 8 + 2;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 1, decay: Math.random() * 0.05 + 0.02,
      color, size: Math.random() * 4 + 2
    });
  }
}

function addFloatText(x, y, text, color) {
  floatTexts.push({x, y, text, life: 1, color});
}

function updateHUD() {
  document.getElementById('score-el').textContent = score;
  document.getElementById('wave-el').textContent = wave;
  
  let el = document.getElementById('combo-el');
  el.textContent = `${combo}x COMBO`;
  el.className = combo > 5 ? 'text-red' : (combo > 2 ? 'text-amber' : 'text-cyan');
  el.style.transform = 'scale(1.4)';
  setTimeout(() => el.style.transform = 'scale(1)', 150);
  
  let windSpeed = Math.round(Math.hypot(wind.x, wind.y) / 20);
  let wEl = document.getElementById('wind-el');
  if(windSpeed > 0) {
     let angle = Math.atan2(wind.y, wind.x);
     let deg = (angle * 180 / Math.PI + 360) % 360;
     let dir = deg < 45 || deg >= 315 ? 'E' : deg < 135 ? 'S' : deg < 225 ? 'W' : 'N';
     wEl.textContent = `WIND: ${windSpeed}KT ${dir}`;
     wEl.className = 'text-red';
  } else {
     wEl.textContent = 'WIND: CALM';
     wEl.className = 'text-muted';
  }
}

function nextWave() {
  wave++;
  spawnBumper(Math.max(16, 40 - wave * 2));
  
  // Increase wind with wave
  if (wave > 1) {
    let windMag = wave * 30;
    let wAngle = Math.random() * Math.PI * 2;
    wind.x = Math.cos(wAngle) * windMag;
    wind.y = Math.sin(wAngle) * windMag;
  }
  
  addFloatText(width/2, height/2, `WAVE ${wave}`, '#FFF');
  playTone(300, 'sine', 0.5, 0.4);
}

function onBumperHit(b) {
  b.hitFlash = 1;
  combo++;
  updateHUD();
  
  puck.vx *= 1.15;
  puck.vy *= 1.15;
  let maxS = 2500;
  let s = Math.hypot(puck.vx, puck.vy);
  if (s > maxS) { puck.vx = puck.vx/s*maxS; puck.vy = puck.vy/s*maxS; }
  
  playTone(Math.min(900, 300 + combo * 50), 'triangle', 0.1, 0.3);
  spawnParticles(b.x, b.y, 8, '#4287F5');
  shake = Math.min(12, combo * 1.5);
  navigator.vibrate?.(10);
}

function onTargetHit() {
  let pts = 100 * combo;
  score += pts;
  targetsHit++;
  timeLeft = Math.min(45, timeLeft + 5); 
  
  addFloatText(target.x, target.y, `+${pts}`, '#FFB800');
  playTone(600, 'square', 0.1, 0.3);
  setTimeout(() => playTone(800, 'square', 0.1, 0.3), 80);
  setTimeout(() => playTone(1200, 'square', 0.15, 0.3), 160);
  
  spawnParticles(target.x, target.y, 25, '#FFB800');
  shake = 8;
  navigator.vibrate?.([20, 30, 20]);
  
  if (targetsHit % 3 === 0) nextWave();
  spawnTarget();
  updateHUD();
}

function puckToScreen() {
  const rect = canvas.getBoundingClientRect();
  return {
    x: rect.left + (puck.x / width) * rect.width,
    y: rect.top + (puck.y / height) * rect.height
  };
}

function aimVectorFromKeys() {
  let ax = (keysDown.ArrowRight || keysDown.KeyD ? 1 : 0) - (keysDown.ArrowLeft || keysDown.KeyA ? 1 : 0);
  let ay = (keysDown.ArrowDown || keysDown.KeyS ? 1 : 0) - (keysDown.ArrowUp || keysDown.KeyW ? 1 : 0);
  const len = Math.hypot(ax, ay);
  if (len < 1e-6) return null;
  return { ax: ax / len, ay: ay / len };
}

function syncKeyboardDragLine() {
  const aim = aimVectorFromKeys();
  if (!aim) return false;
  const pull = 200;
  const p = puckToScreen();
  dragStart.x = p.x;
  dragStart.y = p.y;
  dragCurrent.x = p.x - aim.ax * pull;
  dragCurrent.y = p.y - aim.ay * pull;
  return true;
}

function applyFlickFromPull(dx, dy) {
  let power = Math.hypot(dx, dy);
  if (power <= 15) return;
  let maxPower = 350;
  if (power > maxPower) {
    dx = (dx / power) * maxPower;
    dy = (dy / power) * maxPower;
  }
  combo = 1;
  updateHUD();
  puck.vx = dx * 6.5;
  puck.vy = dy * 6.5;
  playTone(200, 'square', 0.1, 0.3);
  playTone(150, 'triangle', 0.2, 0.4);
  spawnParticles(puck.x, puck.y, 12, '#00FFFF');
  navigator.vibrate?.(20);
  shake = 5;
}

function resetGame() {
  score = 0; wave = 1; timeLeft = 30; combo = 1; targetsHit = 0;
  bumpers = []; particles = []; floatTexts = []; trail = [];
  wind = { x: 0, y: 0 };
  
  puck.x = width/2; puck.y = height*0.75;
  puck.vx = 0; puck.vy = 0;
  
  for(let i=0; i<4; i++) spawnBumper(35);
  spawnTarget();
  updateHUD();
}

function setUIState(newState) {
  state = newState;
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  
  if (state === 'TITLE') {
     document.getElementById('title-screen').classList.remove('hidden');
  } else if (state === 'PLAY') {
     document.getElementById('hud').classList.remove('hidden');
  } else if (state === 'OVER') {
     document.getElementById('game-over-screen').classList.remove('hidden');
     document.getElementById('final-score').textContent = score;
     document.getElementById('final-wave').textContent = wave;
  }
}

// Input handling
canvas.addEventListener('pointerdown', e => {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  if (state !== 'PLAY') return;
  mouseDragging = true;
  isDragging = true;
  dragStart.x = e.clientX; dragStart.y = e.clientY;
  dragCurrent.x = e.clientX; dragCurrent.y = e.clientY;
  timeScale = 0.1; // Bullet time
  navigator.vibrate?.(5);
});
canvas.addEventListener('pointermove', e => {
  if (mouseDragging) { dragCurrent.x = e.clientX; dragCurrent.y = e.clientY; }
});
canvas.addEventListener('pointerup', e => {
  if (state !== 'PLAY') return;
  if (mouseDragging) {
     mouseDragging = false;
     isDragging = false;
     timeScale = 1.0;
     applyFlickFromPull(dragStart.x - dragCurrent.x, dragStart.y - dragCurrent.y);
  }
});

function handleKeyDown(e) {
  const navKeys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter'];
  const wasd = ['KeyW', 'KeyA', 'KeyS', 'KeyD'];
  if (navKeys.includes(e.code) || wasd.includes(e.code)) e.preventDefault();
  keysDown[e.code] = true;
  if (audioCtx.state === 'suspended' && (e.code === 'Space' || e.code === 'Enter')) audioCtx.resume();
  if (state !== 'PLAY') return;
  if ((e.code === 'Space' || e.code === 'Enter') && e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    if (syncKeyboardDragLine()) {
      isDragging = false;
      timeScale = 1.0;
      applyFlickFromPull(dragStart.x - dragCurrent.x, dragStart.y - dragCurrent.y);
    }
  }
}

function handleKeyUp(e) {
  keysDown[e.code] = false;
}

document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

// Main logic
function update(rawDt) {
  const k = aimVectorFromKeys();
  if (state === 'PLAY' && k && !mouseDragging) {
    syncKeyboardDragLine();
    isDragging = true;
    timeScale = 0.1;
  } else if (state === 'PLAY' && !k && !mouseDragging) {
    timeScale = 1.0;
    if (isDragging) isDragging = false;
  }

  let dt = rawDt * timeScale;
  
  // Real time ticks down at a hybrid rate during slowmo, so aiming has a small cost
  timeLeft -= rawDt * (timeScale * 0.5 + 0.5); 
  
  if (timeLeft <= 0) {
     timeLeft = 0;
     setUIState('OVER');
     playTone(200, 'sawtooth', 0.4, 0.5);
     setTimeout(() => playTone(150, 'sawtooth', 0.6, 0.5), 250);
     navigator.vibrate?.([50, 100, 50, 100, 200]);
     return;
  }
  
  let barPct = Math.max(0, timeLeft / 45) * 100;
  let bar = document.getElementById('time-bar');
  bar.style.width = `${barPct}%`;
  bar.style.backgroundColor = timeLeft < 5 ? '#FF4444' : '#FFB800';

  puck.x += puck.vx * dt;
  puck.y += puck.vy * dt;
  puck.vx += wind.x * dt;
  puck.vy += wind.y * dt;
  
  // Friction
  puck.vx *= Math.pow(0.99, dt * 60);
  puck.vy *= Math.pow(0.99, dt * 60);

  // Wall collisions
  let bounceHit = false;
  if (puck.x - puck.r < 0) { puck.x = puck.r; puck.vx *= -0.8; bounceHit = true; }
  if (puck.x + puck.r > width) { puck.x = width - puck.r; puck.vx *= -0.8; bounceHit = true; }
  if (puck.y - puck.r < 0) { puck.y = puck.r; puck.vy *= -0.8; bounceHit = true; }
  if (puck.y + puck.r > height) { puck.y = height - puck.r; puck.vy *= -0.8; bounceHit = true; }
  if (bounceHit && Math.hypot(puck.vx, puck.vy) > 100) {
     playTone(100, 'sine', 0.05, 0.2);
     spawnParticles(puck.x, puck.y, 4, '#FFF');
  }

  // Bumper collisions
  for(let b of bumpers) {
    let dx = puck.x - b.x, dy = puck.y - b.y;
    let dist = Math.hypot(dx, dy);
    if(dist < puck.r + b.r) {
      let overlap = (puck.r + b.r) - dist;
      let nx = dx / dist, ny = dy / dist;
      puck.x += nx * overlap; puck.y += ny * overlap;
      
      let dot = puck.vx * nx + puck.vy * ny;
      if (dot < 0) {
         puck.vx -= 2 * dot * nx;
         puck.vy -= 2 * dot * ny;
         onBumperHit(b);
      }
    }
  }

  // Target collision
  if(Math.hypot(puck.x - target.x, puck.y - target.y) < puck.r + target.r) {
     onTargetHit();
  }
  
  // Trail
  if (Math.hypot(puck.vx, puck.vy) > 20) {
    trail.push({x: puck.x, y: puck.y});
    if (trail.length > 12) trail.shift();
  } else if (trail.length > 0) {
    trail.shift();
  }
}

function draw() {
  // Background
  let bgGrad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height)*0.8);
  bgGrad.addColorStop(0, '#0B1B3D');
  bgGrad.addColorStop(1, '#020813');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, width, height);
  
  ctx.save();
  if (shake > 0.5) {
     ctx.translate((Math.random() - 0.5)*shake, (Math.random() - 0.5)*shake);
     shake *= 0.85;
  }
  
  // Bumpers
  for(let b of bumpers) {
     ctx.beginPath();
     ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
     ctx.fillStyle = '#0F2547';
     ctx.fill();
     ctx.strokeStyle = `rgba(66, 135, 245, ${0.3 + b.hitFlash*0.7})`;
     ctx.lineWidth = 2 + b.hitFlash * 6;
     ctx.stroke();
     if(b.hitFlash > 0) b.hitFlash -= 0.03;
  }
  
  // Target
  ctx.save();
  ctx.translate(target.x, target.y);
  target.angle += 0.02 * timeScale;
  ctx.rotate(target.angle);
  ctx.beginPath();
  ctx.rect(-target.r*0.7, -target.r*0.7, target.r*1.4, target.r*1.4);
  ctx.fillStyle = 'rgba(255, 184, 0, 0.15)';
  ctx.strokeStyle = '#FFB800';
  ctx.lineWidth = 3;
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#FFB800';
  ctx.fill();
  ctx.stroke();
  
  ctx.rotate(Math.PI/4);
  ctx.beginPath();
  ctx.rect(-target.r*0.4, -target.r*0.4, target.r*0.8, target.r*0.8);
  ctx.fillStyle = '#FFB800';
  ctx.fill();
  ctx.restore();
  
  // Trail
  if (trail.length > 1) {
     ctx.beginPath();
     ctx.moveTo(trail[0].x, trail[0].y);
     for(let i=1; i<trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
     ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
     ctx.lineWidth = puck.r * 1.2;
     ctx.lineCap = 'round'; ctx.lineJoin = 'round';
     ctx.stroke();
  }
  
  // Drag Aim Line
  if (isDragging && state === 'PLAY') {
     let dx = dragStart.x - dragCurrent.x;
     let dy = dragStart.y - dragCurrent.y;
     let power = Math.hypot(dx, dy);
     let maxPower = 350;
     if (power > maxPower) { dx = dx/power*maxPower; dy = dy/power*maxPower; }
     
     if (power > 15) {
       ctx.beginPath();
       ctx.moveTo(puck.x, puck.y);
       ctx.lineTo(puck.x + dx * 2, puck.y + dy * 2);
       ctx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
       ctx.lineWidth = 4;
       ctx.setLineDash([8, 12]);
       ctx.stroke();
       ctx.setLineDash([]);
       
       ctx.beginPath();
       ctx.arc(puck.x + dx * 2, puck.y + dy * 2, 6, 0, Math.PI*2);
       ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
       ctx.fill();
     }
  }
  
  // Puck
  ctx.beginPath();
  ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI*2);
  let pGrad = ctx.createLinearGradient(puck.x - puck.r, puck.y - puck.r, puck.x + puck.r, puck.y + puck.r);
  pGrad.addColorStop(0, '#FFFFFF');
  pGrad.addColorStop(0.4, '#A0C0E0');
  pGrad.addColorStop(1, '#1A3B5C');
  ctx.fillStyle = pGrad;
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#00FFFF';
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Particles
  for(let p of particles) {
     ctx.globalAlpha = Math.max(0, p.life);
     ctx.fillStyle = p.color;
     ctx.beginPath();
     ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
     ctx.fill();
  }
  
  // Float Texts
  ctx.font = "bold 24px ui-monospace, 'SFMono-Regular', Menlo, monospace";
  ctx.textAlign = "center";
  for(let t of floatTexts) {
     ctx.globalAlpha = Math.max(0, t.life);
     ctx.fillStyle = t.color;
     ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1.0;
  ctx.textAlign = "left";
  
  ctx.restore();
}

let lastTime = performance.now();
function loop(time) {
  let dt = (time - lastTime) / 1000;
  lastTime = time;
  if (dt > 0.1) dt = 0.1;
  
  if (state === 'PLAY') {
    update(dt);
  } else if (state === 'TITLE') {
    puck.x += puck.vx * dt; puck.y += puck.vy * dt;
    if(puck.x < puck.r || puck.x > width-puck.r) puck.vx *= -1;
    if(puck.y < puck.r || puck.y > height-puck.r) puck.vy *= -1;
    
    // gentle rotation for background target
    target.angle += dt;
  }
  
  for(let i = particles.length - 1; i >= 0; i--) {
     let p = particles[i];
     p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
     p.life -= p.decay;
     if(p.life <= 0) particles.splice(i, 1);
  }
  
  for(let i = floatTexts.length - 1; i >= 0; i--) {
     let t = floatTexts[i];
     t.life -= dt * 1.5; t.y -= 40 * dt;
     if(t.life <= 0) floatTexts.splice(i, 1);
  }
  
  draw();
  requestAnimationFrame(loop);
}

// Init
puck.x = width/2; puck.y = height/2;
puck.vx = 80; puck.vy = 110;
spawnTarget();
for(let i=0; i<3; i++) spawnBumper(40);
setUIState('TITLE');
requestAnimationFrame(loop);

document.getElementById('start-btn').addEventListener('click', () => {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  resetGame(); setUIState('PLAY');
});
document.getElementById('restart-btn').addEventListener('click', () => {
  resetGame(); setUIState('PLAY');
});
</script>
