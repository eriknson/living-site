<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chrono Sync</title>
<style>
  :root {
    --bg-color: #050a10;
    --text-color: #aaddff;
    --btn-bg: #0a1f33;
    --btn-border: #2288cc;
    --accent: #00eeff;
    --accent-glow: 0, 238, 255;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #050a10;
      --text-color: #aaddff;
      --btn-bg: #0a1f33;
      --btn-border: #2288cc;
      --accent: #00eeff;
      --accent-glow: 0, 238, 255;
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-color: #eef2f5;
      --text-color: #113344;
      --btn-bg: #ccddee;
      --btn-border: #4499cc;
      --accent: #ee6600;
      --accent-glow: 238, 102, 0;
    }
  }
  body, html {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .screen {
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 2rem;
    background: var(--bg-color);
    border: 1px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(var(--accent-glow), 0.2);
  }
  .screen h1 {
    color: var(--accent);
    margin-top: 0;
    margin-bottom: 0.5rem;
    text-shadow: 0 0 10px rgba(var(--accent-glow), 0.5);
  }
  button {
    pointer-events: auto;
    margin-top: 2rem;
    padding: 1rem 2rem;
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--accent);
    background: var(--btn-bg);
    border: 2px solid var(--btn-border);
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 15px rgba(var(--accent-glow), 0.4);
    transition: transform 0.1s, background 0.1s;
  }
  button:active {
    transform: scale(0.95);
    background: var(--accent);
    color: var(--bg-color);
  }
  .hidden {
    display: none !important;
  }
  #hud {
    position: absolute;
    top: 1rem; left: 1rem; right: 1rem;
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: bold;
    text-shadow: 0 0 4px var(--bg-color);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui-layer">
  <div id="hud" class="hidden">
    <div id="score">Time: 0.0s</div>
    <div id="streak">Streak: 0</div>
  </div>
  
  <div id="start-screen" class="screen">
    <h1>CHRONO SYNC</h1>
    <p>Tap to keep the hourglass alive.</p>
    <p>On-beat = +Sand</p>
    <p>Off-beat = -Sand</p>
    <button id="btn-start" data-smoke="start">Start Sync</button>
  </div>

  <div id="game-over-screen" class="screen hidden">
    <h1 style="color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.5);">DESYNCED</h1>
    <p>You survived <span id="final-score">0</span>s</p>
    <button id="btn-restart" data-smoke="restart">Re-Sync</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const btnStart = document.getElementById('btn-start');
const btnRestart = document.getElementById('btn-restart');
const screenStart = document.getElementById('start-screen');
const screenGameOver = document.getElementById('game-over-screen');
const hud = document.getElementById('hud');
const scoreEl = document.getElementById('score');
const streakEl = document.getElementById('streak');
const finalScoreEl = document.getElementById('final-score');

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
window.addEventListener('resize', resize);

let colBg = '#050a10', colText = '#aaddff', colAccent = '#00eeff', colGlow = '0, 238, 255';
let isLightMode = false;
function updateColors() {
    isLightMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    if (isLightMode) {
        colBg = '#eef2f5'; colText = '#113344'; colAccent = '#ee6600'; colGlow = '238, 102, 0';
    } else {
        colBg = '#050a10'; colText = '#aaddff'; colAccent = '#00eeff'; colGlow = '0, 238, 255';
    }
}
if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateColors);
}

let state = 'INIT'; 
let score = 0, streak = 0;
let sand = 30, maxSand = 30;
let gameStartTime = 0;
let prevTime = 0;

let audioCtx;
let nextNoteTime = 0;
let current16thNote = 0;
let tempo = 100;
let scheduleAheadTime = 0.1;
let fallDuration = 1.5;

let beats = [];
let particles = [];
let floatingTexts = [];
let currentPattern = [];
let cameraShakeTime = 0, hourglassGlowTime = 0, fogTime = 0;

function initAudio() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {
        console.warn("AudioContext init failed", e);
    }
}

function getCurrentTime() {
    if (audioCtx && audioCtx.state === 'running') return audioCtx.currentTime;
    return performance.now() / 1000;
}

function playSound(type, time, perfect = false) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'kick') {
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
            gain.gain.setValueAtTime(0.8, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
        } else if (type === 'hat') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(4000, time);
            gain.gain.setValueAtTime(0.2, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
        } else if (type === 'hit') {
            osc.type = 'sine';
            if (perfect) {
                osc.frequency.setValueAtTime(800, time);
                osc.frequency.linearRampToValueAtTime(1200, time + 0.1);
                gain.gain.setValueAtTime(0.5, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
            } else {
                osc.frequency.setValueAtTime(600, time);
                gain.gain.setValueAtTime(0.3, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            }
        } else if (type === 'miss') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, time);
            osc.frequency.linearRampToValueAtTime(100, time + 0.2);
            gain.gain.setValueAtTime(0.4, time);
            gain.gain.linearRampToValueAtTime(0.01, time + 0.2);
        } else if (type === 'bonus') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, time);
            osc.frequency.setValueAtTime(554, time + 0.1);
            osc.frequency.setValueAtTime(659, time + 0.2);
            gain.gain.setValueAtTime(0.5, time);
            gain.gain.linearRampToValueAtTime(0.01, time + 0.5);
        }
        osc.start(time);
        osc.stop(time + 0.5);
    } catch(e) {}
}

function generatePattern(t) {
    let p = [1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0];
    let density = Math.min(0.8, (t - 100) / 100); 
    if (density < 0) density = 0;
    for (let i = 2; i < 16; i+=4) {
        if (Math.random() < density) p[i] = 1; 
    }
    if (density > 0.5) {
        for (let i = 1; i < 16; i+=2) {
            if (Math.random() < (density - 0.5)) p[i] = 1;
        }
    }
    return p;
}

function schedule(now) {
    while (nextNoteTime < now + scheduleAheadTime) {
        if (currentPattern[current16thNote]) {
            let type = current16thNote === 0 ? 'kick' : 'hat';
            playSound(type, nextNoteTime);
            beats.push({
                targetTime: nextNoteTime,
                hit: false, missed: false, type: type
            });
        }
        const secondsPerBeat = 60.0 / tempo;
        nextNoteTime += 0.25 * secondsPerBeat;
        current16thNote++;
        if (current16thNote === 16) {
            current16thNote = 0;
            tempo += 0.5;
            if (Math.random() < 0.3) currentPattern = generatePattern(tempo);
        }
    }
}

function startGame() {
    initAudio();
    state = 'PLAYING';
    score = 0; streak = 0; sand = 20; tempo = 100;
    beats = []; particles = []; floatingTexts = [];
    current16thNote = 0;
    
    let now = getCurrentTime();
    gameStartTime = now;
    nextNoteTime = now + fallDuration + 0.5;
    currentPattern = generatePattern(tempo);
    
    screenStart.classList.add('hidden');
    screenGameOver.classList.add('hidden');
    hud.classList.remove('hidden');
    updateHUD();
}

function gameOver() {
    state = 'GAMEOVER';
    hud.classList.add('hidden');
    screenGameOver.classList.remove('hidden');
    finalScoreEl.innerText = score.toFixed(1);
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 50 + Math.random() * 150;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 0.5 + Math.random() * 0.5, maxLife: 1.0,
            size: 2 + Math.random() * 4, color: color
        });
    }
}

function spawnText(text, x, y, color) {
    floatingTexts.push({ text: text, x: x, y: y, life: 1.0, maxLife: 1.0, color: color });
}

function updateHUD() {
    scoreEl.innerText = `Time: ${score.toFixed(1)}s`;
    streakEl.innerText = `Streak: ${streak}`;
    scoreEl.style.color = (sand < 5) ? '#ff3333' : '';
}

function onPointerDown(e) {
    if (e && e.cancelable) e.preventDefault();
    if (state !== 'PLAYING') return;
    
    const now = getCurrentTime();
    if (navigator.vibrate) { try { navigator.vibrate(10); } catch(err){} }
    
    let windowSec = 0.25;
    let closestBeat = null, minDiff = Infinity;
    
    for (let b of beats) {
        if (!b.hit && !b.missed) {
            let diff = Math.abs(b.targetTime - now);
            if (diff < minDiff && diff < windowSec) {
                minDiff = diff; closestBeat = b;
            }
        }
    }
    
    let px = e && e.clientX ? e.clientX : width/2;
    let py = e && e.clientY ? e.clientY : height/2;
    
    if (closestBeat) {
        closestBeat.hit = true;
        let perfect = minDiff < 0.08;
        playSound('hit', now, perfect);
        
        if (perfect) {
            streak++;
            sand = Math.min(maxSand, sand + 1.5);
            spawnText('PERFECT!', px, py, colAccent);
            spawnParticles(px, py, colAccent, 10);
            
            if (streak > 0 && streak % 5 === 0) {
                sand = Math.min(maxSand, sand + 5);
                spawnText('+5 SEC BONUS!', width/2, height * 0.4, '#ffdd00');
                playSound('bonus', now);
                if (navigator.vibrate) { try { navigator.vibrate([30, 50, 30]); } catch(err){} }
                hourglassGlowTime = now + 1.0;
            }
        } else {
            streak = 0;
            sand = Math.min(maxSand, sand + 0.5);
            spawnText('GOOD', px, py, colText);
            spawnParticles(px, py, colText, 5);
        }
    } else {
        streak = 0;
        sand = Math.max(0, sand - 2);
        playSound('miss', now);
        spawnText('MISS', px, py, '#ff3333');
        if (navigator.vibrate) { try { navigator.vibrate(50); } catch(err){} }
        cameraShakeTime = now + 0.2;
    }
    updateHUD();
}

canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        if (state === 'PLAYING') onPointerDown(null);
    }
});
btnStart.addEventListener('click', startGame);
btnRestart.addEventListener('click', startGame);

function drawCabinet(hx, hy, hw, hh, now) {
    ctx.strokeStyle = `rgba(${colGlow}, 0.3)`;
    ctx.lineWidth = 2;
    
    let fw = hw * 1.5, fh = hh * 1.8, bw = fw * 0.7, bh = fh * 0.7, byOffset = -20;
    ctx.strokeRect(hx - fw, hy - fh, fw * 2, fh * 2);
    ctx.strokeRect(hx - bw, hy - bh + byOffset, bw * 2, bh * 2);
    
    ctx.beginPath();
    ctx.moveTo(hx - fw, hy - fh); ctx.lineTo(hx - bw, hy - bh + byOffset);
    ctx.moveTo(hx + fw, hy - fh); ctx.lineTo(hx + bw, hy - bh + byOffset);
    ctx.moveTo(hx - fw, hy + fh); ctx.lineTo(hx - bw, hy + bh + byOffset);
    ctx.moveTo(hx + fw, hy + fh); ctx.lineTo(hx + bw, hy + bh + byOffset);
    ctx.stroke();
    
    let pulse = (Math.sin(now * Math.PI) + 1) / 2;
    ctx.fillStyle = `rgba(${colGlow}, ${0.03 + 0.03 * pulse})`;
    ctx.fillRect(hx - fw, hy - fh, fw * 2, fh * 2);
}

function draw(now, dt) {
    fogTime += dt;
    ctx.fillStyle = colBg;
    ctx.fillRect(0, 0, width, height);

    ctx.globalCompositeOperation = isLightMode ? 'darken' : 'screen';
    for (let i = 0; i < 3; i++) {
        let x = width/2 + Math.sin(fogTime * 0.5 + i * 2) * width * 0.4;
        let y = height/2 + Math.cos(fogTime * 0.3 + i * 3) * height * 0.4;
        let grad = ctx.createRadialGradient(x, y, 0, x, y, width * 0.5);
        grad.addColorStop(0, `rgba(${colGlow}, 0.15)`);
        grad.addColorStop(1, `rgba(${colGlow}, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, width*0.5, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    ctx.strokeStyle = `rgba(${colGlow}, 0.15)`;
    ctx.lineWidth = 1;
    let horizon = height * 0.8;
    ctx.beginPath();
    for (let i = -20; i <= 20; i++) {
        let xBottom = width/2 + i * 80;
        let xTop = width/2 + i * 10;
        ctx.moveTo(xTop, horizon);
        ctx.lineTo(xBottom, height);
    }
    let speed = 150, zOffset = (fogTime * speed) % 100;
    for (let z = 10; z < 1000; z += 100) {
        let realZ = z - zOffset;
        if (realZ < 10) continue;
        let scale = 300 / realZ;
        let y = horizon + scale * 100;
        if (y > height) continue;
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
    }
    ctx.stroke();

    let hx = width / 2;
    let hy = height / 2;
    let hw = Math.min(width * 0.25, 80);
    let hh = Math.min(height * 0.18, 120);
    
    if (now < cameraShakeTime) {
        let intensity = (cameraShakeTime - now) * 20;
        hx += (Math.random() - 0.5) * intensity;
        hy += (Math.random() - 0.5) * intensity;
    }
    
    drawCabinet(hx, hy, hw, hh, now);
    
    ctx.strokeStyle = colAccent;
    ctx.lineWidth = 3;
    if (now < hourglassGlowTime) {
        ctx.shadowBlur = 20; ctx.shadowColor = colAccent; ctx.lineWidth = 5;
    } else {
        ctx.shadowBlur = 5; ctx.shadowColor = colAccent;
    }

    ctx.beginPath();
    ctx.moveTo(hx - hw, hy - hh); ctx.lineTo(hx + hw, hy - hh);
    ctx.lineTo(hx, hy);
    ctx.lineTo(hx + hw, hy + hh); ctx.lineTo(hx - hw, hy + hh);
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur = 0; 
    
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10; ctx.shadowColor = '#ffffff';
    ctx.beginPath(); ctx.moveTo(hx - 20, hy); ctx.lineTo(hx + 20, hy); ctx.stroke();
    ctx.shadowBlur = 0;

    let sandRatio = Math.max(0, Math.min(1, sand / maxSand));
    let sandH = hh * Math.sqrt(sandRatio);
    let sandTopY = hy - sandH;
    let sandW = hw * (sandH / hh);

    ctx.fillStyle = `rgba(${colGlow}, 0.5)`;
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(hx - sandW, sandTopY); ctx.lineTo(hx + sandW, sandTopY);
    ctx.fill();
    
    let bottomSandH = hh * Math.sqrt(1 - sandRatio);
    if (bottomSandH > 0) {
        let bottomSandTopY = hy + hh - bottomSandH;
        let bottomSandW = hw * (bottomSandH / hh);
        ctx.beginPath();
        ctx.moveTo(hx - hw, hy + hh); ctx.lineTo(hx + hw, hy + hh);
        ctx.lineTo(hx + bottomSandW, bottomSandTopY); ctx.lineTo(hx - bottomSandW, bottomSandTopY);
        ctx.fill();
    }
    
    ctx.fillStyle = colAccent;
    ctx.shadowBlur = 15; ctx.shadowColor = colAccent;
    let startY = hy - hh - 20;
    for (let b of beats) {
        if (b.hit || b.missed) continue;
        let progress = 1 - ((b.targetTime - now) / fallDuration);
        if (progress < 0) continue; 
        
        let y = startY + progress * (hy - startY);
        let currentW = hw * (1 - Math.max(0, progress - 0.2)); 
        
        ctx.beginPath();
        ctx.arc(hx, y, b.type === 'kick' ? 8 : 4, 0, Math.PI*2);
        ctx.fill();
        
        ctx.globalAlpha = 0.3;
        ctx.fillRect(hx - currentW, y - 1, currentW * 2, 2);
        ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = 0;

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 40 * dt; ft.life -= dt;
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
        ctx.font = 'bold 20px ui-monospace, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
}

function loop(timestamp) {
    requestAnimationFrame(loop);
    
    if (prevTime === 0) prevTime = timestamp;
    let dt = (timestamp - prevTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    prevTime = timestamp;
    
    const now = getCurrentTime();
    
    if (state === 'PLAYING') {
        schedule(now);
        sand -= dt; score += dt;
        
        for (let b of beats) {
            if (!b.hit && !b.missed && now > b.targetTime + 0.15) {
                b.missed = true; streak = 0; sand = Math.max(0, sand - 2);
                playSound('miss', now);
                spawnText('MISSED', width/2, height * 0.7, '#ff3333');
                cameraShakeTime = now + 0.2;
                if (navigator.vibrate) { try { navigator.vibrate(50); } catch(err){} }
            }
        }
        beats = beats.filter(b => now < b.targetTime + 1.0);
        if (sand <= 0) gameOver();
    }
    
    updateHUD();
    draw(now, dt);
}

updateColors();
resize();
requestAnimationFrame(loop);

</script>
</body>
</html>
