<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erik's Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    .model-switcher {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.8125rem;
    }
    
    .model-switcher label {
      color: #999;
    }
    
    .model-switcher select {
      font-family: inherit;
      font-size: 0.8125rem;
      padding: 0.25rem 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      color: #333;
      cursor: pointer;
    }
    
    .model-switcher select:hover {
      border-color: #bbb;
    }
    
    .model-switcher select:focus {
      outline: none;
      border-color: #0066cc;
    }
    
    #build-container {
      min-height: 100vh;
    }
    
    #build-container iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #999;
      font-size: 0.875rem;
    }
    
    .error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #666;
      font-size: 0.875rem;
      text-align: center;
      padding: 2rem;
    }
    
    .error p {
      margin-bottom: 1rem;
    }
    
    .error a {
      color: #0066cc;
      text-decoration: none;
    }
    
    .error a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav class="model-switcher">
    <label for="model-select">model:</label>
    <select id="model-select">
      <option value="composer-1">Composer</option>
      <option value="claude-4.5-opus-high-thinking">Opus 4.5</option>
      <option value="gpt-5.1-codex-max-low-fast">GPT-5.1 Fast</option>
    </select>
  </nav>
  
  <main id="build-container">
    <div class="loading">loading...</div>
  </main>

  <script>
    const container = document.getElementById('build-container');
    const select = document.getElementById('model-select');
    
    let manifest = null;
    let currentModel = null;
    let currentDate = null;
    
    // Model display names
    const modelNames = {
      'composer-1': 'Composer',
      'claude-4.5-opus-high-thinking': 'Opus 4.5',
      'gpt-5.1-codex-max-low-fast': 'GPT-5.1 Fast'
    };
    
    // Parse URL parameters
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        model: params.get('model'),
        date: params.get('date')
      };
    }
    
    // Update URL without reload
    function updateUrl(model, date) {
      const params = new URLSearchParams();
      if (model && model !== manifest?.default_model) {
        params.set('model', model);
      }
      if (date && date !== manifest?.latest_date) {
        params.set('date', date);
      }
      const newUrl = params.toString() 
        ? `${window.location.pathname}?${params.toString()}`
        : window.location.pathname;
      window.history.replaceState({}, '', newUrl);
    }
    
    // Load manifest
    async function loadManifest() {
      try {
        const response = await fetch('/builds/manifest.json');
        if (!response.ok) throw new Error('Manifest not found');
        manifest = await response.json();
        return manifest;
      } catch (err) {
        console.error('Failed to load manifest:', err);
        return null;
      }
    }
    
    // Update select options based on available builds
    function updateSelectOptions(date) {
      const dateEntry = manifest?.dates?.find(d => d.date === date);
      if (!dateEntry) return;
      
      // Update options to show which models have builds
      Array.from(select.options).forEach(option => {
        const model = option.value;
        const hasBuild = dateEntry.builds.some(b => b.model === model && b.status === 'success');
        option.disabled = !hasBuild;
        option.textContent = modelNames[model] + (hasBuild ? '' : ' (unavailable)');
      });
    }
    
    // Load build HTML
    async function loadBuild(model, date) {
      container.innerHTML = '<div class="loading">loading...</div>';
      
      const buildPath = `/builds/${date}/${model}.html`;
      
      try {
        const response = await fetch(buildPath);
        if (!response.ok) throw new Error('Build not found');
        
        const html = await response.text();
        
        // Use srcdoc iframe to isolate the build's styles
        container.innerHTML = `<iframe srcdoc="${html.replace(/"/g, '&quot;')}" title="Site build by ${modelNames[model] || model}"></iframe>`;
        
        currentModel = model;
        currentDate = date;
        select.value = model;
        updateUrl(model, date);
        
      } catch (err) {
        console.error('Failed to load build:', err);
        container.innerHTML = `
          <div class="error">
            <p>Build not available for ${modelNames[model] || model} on ${date}</p>
            <a href="/" onclick="loadBuild('${manifest?.default_model || 'composer-1'}', '${manifest?.latest_date}'); return false;">Load default build</a>
          </div>
        `;
      }
    }
    
    // Handle model change
    select.addEventListener('change', (e) => {
      const model = e.target.value;
      const date = currentDate || manifest?.latest_date;
      if (date) {
        loadBuild(model, date);
      }
    });
    
    // Initialize
    async function init() {
      const loadedManifest = await loadManifest();
      
      if (!loadedManifest || !loadedManifest.latest_date) {
        // No manifest or no builds - show fallback
        container.innerHTML = `
          <div class="error">
            <p>No builds available yet.</p>
            <p>The site regenerates daily with multiple AI models.</p>
          </div>
        `;
        return;
      }
      
      // Get params from URL
      const { model: urlModel, date: urlDate } = getUrlParams();
      
      // Determine which model and date to load
      const date = urlDate || loadedManifest.latest_date;
      const model = urlModel || loadedManifest.default_model || 'composer-1';
      
      // Update select options
      updateSelectOptions(date);
      
      // Load the build
      loadBuild(model, date);
    }
    
    init();
  </script>
</body>
</html>
