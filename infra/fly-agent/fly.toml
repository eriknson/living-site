app = "living-site-agent"
primary_region = "arn"  # Stockholm - closest to user

[build]
  # Dockerfile is in the same directory as fly.toml
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # Keep warm for fast response
  auto_start_machines = true
  min_machines_running = 1     # Always have 1 machine ready

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
