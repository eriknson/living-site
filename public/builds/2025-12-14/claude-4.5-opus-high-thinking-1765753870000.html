<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erik — Product Designer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0d0f14;
      --surface: #14171f;
      --text: #e8e4df;
      --text-muted: #7a7872;
      --accent: #c4a77d;
      --link: #9ba3b0;
      --link-hover: #e8e4df;
    }

    html {
      font-size: 17px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 520px;
      width: 100%;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .name {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .role {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }

    .now {
      font-size: 1rem;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 2.5rem;
    }

    .now span {
      color: var(--accent);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .links a {
      color: var(--link);
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s ease;
      position: relative;
    }

    .links a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 1px;
      background: var(--link-hover);
      transition: width 0.25s ease;
    }

    .links a:hover {
      color: var(--link-hover);
    }

    .links a:hover::after {
      width: 100%;
    }

    .location {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      html {
        font-size: 16px;
      }

      body {
        padding: 1.5rem;
        align-items: flex-start;
        padding-top: 20vh;
      }

      .links {
        gap: 1.25rem;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <main class="container">
    <h1 class="name">Erik</h1>
    <p class="role">Product Designer</p>
    <p class="now">
      Building with AI agents—shaping ideas into software through <span>surgical iteration</span> rather than sweeping rewrites.
    </p>
    <nav class="links">
      <a href="https://github.com/eriknson">GitHub</a>
      <a href="https://x.com/erikoverse">X</a>
      <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
      <a href="mailto:contact@eriks.design">Email</a>
    </nav>
    <p class="location">Stockholm</p>
  </main>
</body>
</html>
