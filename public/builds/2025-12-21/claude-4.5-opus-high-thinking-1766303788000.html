<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erik</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text: #3d3d3d;
      --text-light: #6b6b6b;
      --bg: #faf9f7;
      --border: #e8e6e3;
    }

    html {
      font-size: 17px;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 15vh 24px 12vh;
    }

    .note {
      margin-bottom: 4rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .section-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-light);
      margin-bottom: 0.75rem;
      opacity: 0.7;
    }

    .currently-item {
      margin-bottom: 1.25rem;
    }

    .currently-item span {
      display: block;
    }

    .project-name {
      font-style: italic;
    }

    .project-desc {
      color: var(--text-light);
      font-size: 0.9rem;
    }

    .listening {
      font-size: 0.9rem;
      color: var(--text-light);
      font-style: italic;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
    }

    a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.2s;
      font-size: 0.9rem;
    }

    a:hover {
      border-color: var(--text-light);
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 2rem;
      margin-top: 2rem;
    }

    .location {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      color: var(--text-light);
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      html {
        font-size: 16px;
      }

      main {
        padding: 10vh 20px 8vh;
      }

      .note {
        margin-bottom: 3rem;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <main>
    <section class="note">
      <h1>Erik</h1>
      <p>product designer, building with ai</p>
    </section>

    <section class="note">
      <div class="section-label">currently</div>
      <div class="currently-item">
        <span class="project-name">shipflow</span>
        <span class="project-desc">point-and-click editing for next.js</span>
      </div>
      <div class="currently-item">
        <span class="project-name">cursor-commands</span>
        <span class="project-desc">cli tooling for cursor</span>
      </div>
    </section>

    <section class="note">
      <div class="section-label">listening</div>
      <p class="listening">tame impala, beach house, fred again.., a$ap rocky</p>
    </section>

    <section class="note">
      <div class="section-label">elsewhere</div>
      <div class="links">
        <a href="https://twitter.com/flowstated" target="_blank" rel="noopener">twitter</a>
        <a href="https://github.com/eriknson" target="_blank" rel="noopener">github</a>
        <a href="https://linkedin.com/in/eriknson" target="_blank" rel="noopener">linkedin</a>
        <a href="mailto:contact@eriks.design">email</a>
      </div>
    </section>

    <footer>
      <span class="location">stockholm, 3°c, clear</span>
    </footer>
  </main>
</body>
</html>
