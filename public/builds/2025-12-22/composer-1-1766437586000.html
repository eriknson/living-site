<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <meta name="description" content="Product designer at Cursor, making tools for building software with AI.">
  <style>
    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Variables */
    :root {
      --bg: #fafaf9;
      --text: #1a1a1a;
      --text-muted: rgba(26, 26, 26, 0.85);
      --text-light: rgba(26, 26, 26, 0.5);
      --text-lighter: rgba(26, 26, 26, 0.35);
      --pill-bg: rgba(0, 0, 0, 0.03);
      --pill-bg-hover: rgba(0, 0, 0, 0.05);
      --accent: rgba(26, 26, 26, 0.08);
      color-scheme: light dark;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --text: #e5e5e5;
        --text-muted: rgba(229, 229, 229, 0.85);
        --text-light: rgba(229, 229, 229, 0.5);
        --text-lighter: rgba(229, 229, 229, 0.35);
        --pill-bg: rgba(255, 255, 255, 0.06);
        --pill-bg-hover: rgba(255, 255, 255, 0.08);
        --accent: rgba(255, 255, 255, 0.1);
      }
    }
    
    /* Base */
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
    }
    
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    
    /* Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 680px;
      margin: 0 auto;
      padding: 64px 24px 32px;
      width: 100%;
    }
    
    @media (min-width: 768px) {
      main { padding-top: 96px; }
    }
    
    /* Bio */
    .bio {
      font-size: clamp(21px, 5.2vw, 36px);
      line-height: 1.35;
      color: var(--text-muted);
      margin-bottom: 48px;
    }
    
    /* Cursor pill (inline in bio) */
    .cursor-link {
      display: inline-flex;
      align-items: center;
      padding: 0.15em 0.4em;
      height: 1.5em;
      border-radius: 999px;
      background: var(--pill-bg);
      text-decoration: none;
      color: inherit;
      transition: background 0.2s ease;
      transform: translateY(0.2em);
    }
    
    .cursor-link:hover {
      background: var(--pill-bg-hover);
    }
    
    /* Currently section */
    .currently {
      margin-bottom: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--accent);
    }
    
    .currently-label {
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-lighter);
      margin-bottom: 16px;
    }
    
    .currently-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .currently-item {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--pill-bg);
      font-size: 14px;
      color: var(--text-muted);
      transition: background 0.2s ease;
    }
    
    .currently-item:hover {
      background: var(--pill-bg-hover);
    }
    
    /* Spacer */
    .spacer {
      flex: 1;
      min-height: 64px;
    }
    
    @media (max-width: 767px) {
      .spacer { min-height: 32px; }
    }
    
    /* Links list */
    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .link {
      display: inline-flex;
      align-items: center;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--pill-bg);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      color: var(--text-muted);
      transition: background 0.2s ease, transform 0.1s ease;
    }
    
    @media (min-width: 640px) {
      .link { font-size: 17px; padding: 11px 20px; }
    }
    
    .link:hover {
      background: var(--pill-bg-hover);
      transform: translateY(-1px);
    }
    
    .link:active {
      transform: translateY(0);
    }
    
    .link-disabled {
      background: var(--pill-bg);
      color: var(--text-lighter);
      cursor: not-allowed;
    }
    
    .link-disabled:hover {
      transform: none;
    }
    
    /* Footer */
    .footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--accent);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      color: var(--text-lighter);
    }
    
    .footer-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .footer-separator {
      color: var(--text-lighter);
      opacity: 0.3;
    }
    
    @media (max-width: 640px) {
      .footer {
        flex-direction: column;
        gap: 8px;
      }
      .footer-separator { display: none; }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
