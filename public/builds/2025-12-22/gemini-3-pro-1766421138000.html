<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666666;
            --accent: #333333;
            --spacing: 1.5rem;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111111;
                --text: #eeeeee;
                --text-secondary: #999999;
                --accent: #ffffff;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: var(--spacing);
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding-top: 4rem;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .intro {
            font-size: 1.5rem;
            line-height: 1.4;
            font-weight: 400;
            margin-bottom: 3rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .item {
            margin-bottom: 0.5rem;
        }

        .item-label {
            color: var(--text-secondary);
        }

        .item-value {
            font-weight: 500;
        }

        a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid var(--text-secondary);
            transition: border-color 0.2s;
        }

        a:hover {
            border-bottom-color: var(--text);
        }

        .footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--text-secondary);
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .mood-tag {
            display: inline-block;
            background: rgba(128,128,128,0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        /* Subtle animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        main > * {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        .intro { animation-delay: 0.1s; }
        .grid { animation-delay: 0.2s; }
        .footer { animation-delay: 0.3s; }
    </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
    <main>
        <header>
            <h1>Erik</h1>
            <div style="color: var(--text-secondary); font-size: 0.9rem;">Stockholm, Sweden</div>
        </header>

        <div style="margin-top: 2rem;">
            <div class="mood-tag">
                overcast stockholm focus
            </div>
            
            <p class="intro">
                Building shipflow, point-and-click editing for Next.js. Working on cursor-commands.
            </p>
        </div>

        <div class="grid">
            <div>
                <div class="section-title">Currently</div>
                <div class="item">
                    <span class="item-value">Building shipflow</span>
                </div>
                <div class="item">
                    <span class="item-value">24 commits this week</span>
                </div>
            </div>

            <div>
                <div class="section-title">Listening</div>
                <div class="item">
                    <span class="item-value">Tame Impala, Beach House, Fred again.., dream pop, neo-psychedelic, stutter house</span>
                </div>
            </div>
        </div>

        <footer class="footer">
            <a href="mailto:contact@eriks.design">Email</a>
            <a href="https://twitter.com/flowstated" target="_blank" rel="noopener">Twitter</a>
            <a href="https://github.com/eriknson" target="_blank" rel="noopener">GitHub</a>
        </footer>
    </main>
</body>
</html>
