<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erik — Stockholm Winter Focus</title>
  <style>
    :root {
      --bg: #fafaf9;
      --text: #1a1a1a;
      --text-secondary: rgba(0, 0, 0, 0.6);
      --text-tertiary: rgba(0, 0, 0, 0.3);
      --accent: #2a2a2a;
      --card-bg: rgba(255, 255, 255, 0.5);
      --border: rgba(0, 0, 0, 0.06);
      --animation-ease: cubic-bezier(0.2, 0.0, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --text: #e5e5e5;
        --text-secondary: rgba(255, 255, 255, 0.6);
        --text-tertiary: rgba(255, 255, 255, 0.3);
        --accent: #ffffff;
        --card-bg: rgba(255, 255, 255, 0.05);
        --border: rgba(255, 255, 255, 0.06);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Subtle grain texture */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 50;
    }

    main {
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
      padding: 80px 24px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 64px;
    }

    /* Typography & Sections */
    h1 {
      font-size: 28px;
      font-weight: 550;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 24px;
      color: var(--text);
      opacity: 0;
      animation: slideUp 0.6s var(--animation-ease) forwards 0.1s;
    }

    .mood-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--card-bg);
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeIn 0.6s var(--animation-ease) forwards;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      opacity: 0;
      animation: slideUp 0.6s var(--animation-ease) forwards 0.2s;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.2s var(--animation-ease), border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--text-tertiary);
    }

    .card-label {
      font-size: 13px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-value {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }

    .listening-section {
      opacity: 0;
      animation: slideUp 0.6s var(--animation-ease) forwards 0.3s;
    }

    .section-title {
      font-size: 13px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      display: block;
    }

    .track-list {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .track-list span {
      display: inline-block;
      margin-right: 8px;
      transition: color 0.2s;
    }
    
    .track-list span:not(:last-child)::after {
      content: "/";
      margin-left: 8px;
      color: var(--text-tertiary);
    }

    .track-list span:hover {
      color: var(--text);
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 32px;
      margin-top: auto;
      font-size: 13px;
      color: var(--text-tertiary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      animation: fadeIn 0.8s var(--animation-ease) forwards 0.5s;
    }

    .location-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Selection Color */
    ::selection {
      background: var(--text);
      color: var(--bg);
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <main>
    <div>
      <div class="mood-badge">Stockholm winter focus</div>
      <h1>Building shipflow and cursor-commands.<br>Point-and-click editing for Next.js.</h1>
    </div>

    <div class="status-grid">
      <div class="card">
        <span class="card-label">Active Repos</span>
        <span class="card-value">cursor-commands, shipflow</span>
      </div>
      <div class="card">
        <span class="card-label">Commits this week</span>
        <span class="card-value">24</span>
      </div>
    </div>

    <div class="listening-section">
      <span class="section-title">Heavy Rotation</span>
      <div class="track-list">
        <span>Tame Impala</span>
        <span>Taylor Swift</span>
        <span>Beach House</span>
        <span>Kanye West</span>
        <span>Fred again..</span>
      </div>
    </div>

    <footer>
      <div>
        <span class="location-dot"></span>
        Stockholm &mdash; 1°C, Partly Cloudy
      </div>
      <div>© 2025</div>
    </footer>
  </main>
</body>
</html>
