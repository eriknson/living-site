<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Erik Nilsson — Designer at Cursor</title>
  <meta name="description" content="Erik Nilsson. Product designer at Cursor. San Francisco.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f4eb;
      --ink: #0d1a99;
      --dim: #5c6ce0;
      --accent: #c4b800;
      --line: rgba(13, 26, 153, 0.14);
      --accent-glow: rgba(196, 184, 0, 0.38);
    }
    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --bg: color(display-p3 0.97 0.96 0.93);
        --ink: color(display-p3 0.06 0.1 0.55);
        --dim: color(display-p3 0.4 0.44 0.85);
        --accent: color(display-p3 0.78 0.74 0.06);
        --line: color(display-p3 0.06 0.1 0.55 / 0.14);
        --accent-glow: color(display-p3 0.78 0.74 0.06 / 0.38);
      }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0612ff;
        --ink: #f4eed5;
        --dim: #8395ff;
        --accent: #fff200;
        --line: rgba(244, 238, 213, 0.14);
        --accent-glow: rgba(255, 242, 0, 0.42);
      }
      @supports (color: color(display-p3 1 1 1)) {
        :root {
          --bg: color(display-p3 0.035 0.06 0.99);
          --ink: color(display-p3 0.96 0.94 0.85);
          --dim: color(display-p3 0.52 0.6 1);
          --accent: color(display-p3 1 0.96 0.04);
          --line: color(display-p3 0.96 0.94 0.85 / 0.14);
          --accent-glow: color(display-p3 1 0.96 0.04 / 0.42);
        }
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.005em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }

    ::selection {
      background: var(--accent);
      color: var(--bg);
    }

    .page {
      min-height: 100vh;
      max-width: 40rem;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 22px clamp(20px, 4vw, 44px);
      gap: 24px;
      position: relative;
    }

    /* tiny corner registration marks — Bauhaus telegram detail */
    .page::before,
    .page::after {
      content: "+";
      position: absolute;
      font-size: 11px;
      color: var(--dim);
      opacity: 0.7;
      pointer-events: none;
    }
    .page::before { top: 8px; left: 8px; }
    .page::after  { bottom: 8px; right: 8px; }

    /* TOP STRIP */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .top .id {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pip {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 999px;
      box-shadow: 0 0 14px var(--accent-glow), 0 0 32px var(--accent-glow);
      flex-shrink: 0;
      animation: breath 3.2s ease-in-out infinite;
    }

    @keyframes breath {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(0.82); opacity: 0.7; }
    }

    .top b { font-weight: 600; }
    .dim { color: var(--dim); }

    .top .id a {
      transition: color 0.18s ease;
    }
    .top .id a:hover { color: var(--accent); }

    .when {
      display: flex;
      gap: 14px;
      align-items: center;
      color: var(--dim);
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .when span {
      position: relative;
    }

    .when span + span::before {
      content: "·";
      margin-right: 14px;
      opacity: 0.55;
    }

    /* HERO */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(20px, 3vw, 36px);
      padding: clamp(20px, 4vw, 48px) 0;
    }

    .name {
      font-family: inherit;
      font-weight: 500;
      font-size: clamp(60px, 16vw, 224px);
      line-height: 0.84;
      letter-spacing: -0.055em;
      color: var(--ink);
    }

    .name span.row { display: block; }

    .name .nilsson {
      font-weight: 300;
      font-style: italic;
      margin-left: 0.55em;
    }

    .disc {
      display: inline-block;
      width: 0.62em;
      height: 0.62em;
      vertical-align: -2%;
      border-radius: 999px;
      background: var(--accent);
      margin-left: 0.06em;
      box-shadow:
        0 0 0 1px var(--accent-glow),
        0 0 90px var(--accent-glow);
    }

    .tagline {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: 0.55em;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .tagline .rule {
      width: 32px;
      height: 1px;
      background: var(--accent);
    }

    .tagline em {
      font-style: italic;
      color: var(--ink);
      text-transform: lowercase;
      letter-spacing: 0.005em;
      font-weight: 300;
      font-size: 15px;
    }

    /* BOTTOM STRIP */
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .now {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--dim);
    }

    .now .blink {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 999px;
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.78); }
    }

    .now em {
      font-style: italic;
      color: var(--ink);
      text-transform: lowercase;
      letter-spacing: 0.01em;
    }

    .links {
      display: flex;
      gap: 22px;
    }

    .links a {
      position: relative;
      transition: color 0.18s ease;
    }

    .links a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.28s ease;
    }

    .links a:hover { color: var(--accent); }
    .links a:hover::after { transform: scaleX(1); }

    /* MOBILE */
    @media (max-width: 640px) {
      .page { padding: 20px; gap: 18px; }
      .top { flex-direction: column; gap: 10px; align-items: flex-start; }
      .when { justify-content: flex-start; }
      .name { font-size: clamp(54px, 18vw, 120px); letter-spacing: -0.05em; }
      .name .nilsson { margin-left: 0.4em; }
      .tagline { margin-left: 0; }
      .bottom { flex-direction: column; align-items: flex-start; gap: 14px; }
      .links { flex-wrap: wrap; gap: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0ms !important;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="page">

    <header class="top">
      <div class="id">
        <span class="pip" aria-hidden="true"></span>
        <span><b>Erik Nilsson</b></span>
        <span class="dim">designer · <a href="https://cursor.com">cursor</a></span>
      </div>
      <div class="when">
        <span>2026·05·15</span>
        <span>San Francisco</span>
        <span>11°C clear</span>
      </div>
    </header>

    <section class="hero">
      <h1 class="name">
        <span class="row">Erik</span>
        <span class="row nilsson">Nilsson<span class="disc" aria-hidden="true"></span></span>
      </h1>
      <div class="tagline">
        <span class="rule" aria-hidden="true"></span>
        <em>shipping by sunrise.</em>
      </div>
    </section>

    <footer class="bottom">
      <div class="now">
        <span class="blink" aria-hidden="true"></span>
        <span>on rotation <em>fred again..</em></span>
      </div>
      <nav class="links" aria-label="Elsewhere">
        <a href="https://x.com/flowstated">x</a>
        <a href="https://github.com/eriknson">github</a>
        <a href="https://linkedin.com/in/eriknson">linkedin</a>
        <a href="mailto:contact@eriks.design">contact</a>
      </nav>
    </footer>

  </div>
</body>
</html>
