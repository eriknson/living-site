<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Erik Nilsson</title>
  <style>
    :root {
      /* light (prefers-color-scheme: light / no-preference fallback) */
      --void: #f0f4fc;
      --ink: #0c0514;
      --panel-a: #00c9a0;
      --panel-b: #ff2d6a;
      --panel-c: #6c40ff;
      --signal: #4d6600;
      --bg: #f0f4fc;

      color-scheme: light dark;
      --font-display: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "SF Mono", "Cascadia Code", ui-monospace, monospace;

      background: var(--bg);
      color: var(--ink);

      font-synthesis-weight: none;
    }

    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --void: color(display-p3 0.94 0.95 0.98);
        --ink: color(display-p3 0.045 0.018 0.078);
        --panel-a: color(display-p3 0.10 0.88 0.68);
        --panel-b: color(display-p3 1 0.22 0.48);
        --panel-c: color(display-p3 0.52 0.28 1);
        --signal: color(display-p3 0.35 0.48 0.05);
        --bg: color(display-p3 0.94 0.95 0.98);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --void: #0c0514;
        --ink: #f4f8ff;
        --panel-a: #00d4aa;
        --panel-b: #ff2d6a;
        --panel-c: #6c40ff;
        --signal: #c8ff4a;
        --bg: #0c0514;

        color-scheme: dark;
        background: var(--bg);
        color: var(--ink);
      }
    }

    @supports (color: color(display-p3 1 1 1)) {
      @media (prefers-color-scheme: dark) {
        :root {
          --void: color(display-p3 0.045 0.018 0.078);
          --ink: color(display-p3 0.96 0.97 0.99);
          --panel-a: color(display-p3 0.12 0.96 0.72);
          --panel-b: color(display-p3 1 0.22 0.48);
          --panel-c: color(display-p3 0.52 0.28 1);
          --signal: color(display-p3 0.82 1 0.35);
          --bg: color(display-p3 0.045 0.018 0.078);
        }
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-display);
      font-weight: 400;
      line-height: 1.05;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--ink);
      overflow-x: clip;
    }

    .wrap {
      max-width: 40rem;
      margin: 0 auto;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(260px, 34vw, 420px);
      grid-template-rows: 1fr auto;
    }

    @media (max-width: 640px) {
      .wrap {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
      }
    }

    main {
      padding: clamp(1.25rem, 4vw, 3rem);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: clamp(1.75rem, 5vw, 3.25rem);
      position: relative;
    }

    .beat {
      position: absolute;
      inset: clamp(1rem, 3vw, 2rem) clamp(1rem, 3vw, 2rem) auto auto;
      width: min(72vw, 420px);
      height: clamp(52px, 9vw, 88px);
      background: var(--panel-a);
      mix-blend-mode: screen;
      opacity: 0.92;
      transform-origin: 100% 50%;
      animation: snap 2.08s steps(4, jump-end) infinite;
      pointer-events: none;
    }

    @keyframes snap {
      0%, 100% { transform: scaleX(1) translateX(0); }
      25% { transform: scaleX(0.68) translateX(-6%); }
      50% { transform: scaleX(1.12) translateX(2%); }
      75% { transform: scaleX(0.82) translateX(-3%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .beat { animation: none; transform: scaleX(0.88); opacity: 0.55; }
    }

    h1 {
      margin: 0;
      font-size: clamp(3.1rem, 11vw, 7.4rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      text-transform: lowercase;
      max-width: 12ch;
    }

    h1 span {
      display: inline-block;
      color: var(--signal);
    }

    .meta {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.78;
      max-width: 36ch;
    }

    .meta em {
      font-style: normal;
      color: var(--panel-b);
    }

    .strip {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-left: 3px solid var(--panel-c);
      padding-left: 0.85rem;
      margin-top: 0.5rem;
      max-width: 40ch;
      line-height: 1.35;
      opacity: 0.72;
    }

    aside {
      background: var(--panel-b);
      color: #0c0514;
      padding: clamp(1.5rem, 4.5vw, 2.75rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2rem;
      min-height: 100%;
    }

    @supports (color: color(display-p3 1 1 1)) {
      aside {
        color: color(display-p3 0.02 0.01 0.06);
      }
    }

    .blurb {
      font-size: clamp(1rem, 2.1vw, 1.15rem);
      font-weight: 600;
      font-style: italic;
      line-height: 1.28;
      max-width: 28ch;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      align-items: baseline;
    }

    nav a {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: inherit;
      text-decoration: none;
      border-bottom: 2px solid currentColor;
      padding-bottom: 0.12em;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--panel-c);
      border-color: var(--panel-c);
    }

    @supports (color: color(display-p3 1 1 1)) {
      nav a:hover,
      nav a:focus-visible {
        color: color(display-p3 0.35 0.12 0.95);
      }
    }

    nav a:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 4px;
    }

    footer {
      grid-column: 1 / -1;
      background: var(--panel-c);
      color: var(--ink);
      padding: 0.65rem clamp(1.25rem, 4vw, 3rem);
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: center;
    }

    footer strong {
      font-weight: 500;
      color: var(--signal);
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="wrap">
    <main>
      <div class="beat" aria-hidden="true"></div>
      <h1>erik <span>nilsson</span></h1>
      <div>
        <p class="meta">Product design @ <em>Cursor</em> · SF</p>
        <p class="strip">2026-05-15 · spring · 11° · clear</p>
      </div>
    </main>
    <aside>
      <p class="blurb">AI-native tools by day. This URL rewrites when the data does.</p>
      <nav aria-label="Links">
        <a href="https://eriks.design">Site</a>
        <a href="https://cursor.com">Cursor</a>
        <a href="https://x.com/flowstated">X</a>
        <a href="https://github.com/eriknson">GitHub</a>
        <a href="https://linkedin.com/in/eriknson">in</a>
        <a href="mailto:contact@eriks.design">Mail</a>
      </nav>
    </aside>
    <footer>
      <span><strong>now</strong> · quiet feed · side repos idle</span>
      <span>Fred again.. · stutter house · dream pop</span>
    </footer>
  </div>
</body>
</html>
