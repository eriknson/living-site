<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erik Nilsson</title>
  <style>
    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --c-red: color(display-p3 1 0.15 0);
        --c-blue: color(display-p3 0 0.1 1);
        --c-lime: color(display-p3 0.75 1 0);
        --c-pink: color(display-p3 1 0 0.8);
      }
    }
    @supports not (color: color(display-p3 1 1 1)) {
      :root {
        --c-red: #ff2600;
        --c-blue: #001aff;
        --c-lime: #bfff00;
        --c-pink: #ff00cc;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #eaeaea;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: stretch;
      box-sizing: border-box;
    }

    .container {
      max-width: 40rem;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      height: 100vh;
      max-height: 100vh;
      gap: 2px;
      overflow: hidden;
      box-sizing: border-box;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #000;
      }
    }

    .block {
      padding: 2.5vw;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .block:hover {
      transform: scale(0.98);
      z-index: 10;
    }

    .b-name {
      grid-column: 1 / 3;
      grid-row: 1 / 3;
      background: var(--c-red);
      color: #000;
      justify-content: space-between;
    }

    .b-role {
      grid-column: 3 / 5;
      grid-row: 1 / 2;
      background: var(--c-blue);
      color: #fff;
      justify-content: center;
    }

    .b-about {
      grid-column: 1 / 3;
      grid-row: 3 / 5;
      background: var(--c-lime);
      color: #000;
      justify-content: space-between;
    }

    .b-data {
      grid-column: 3 / 5;
      grid-row: 2 / 5;
      background: var(--c-pink);
      color: #fff;
      justify-content: space-between;
    }

    .label {
      font-size: 1vw;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.8;
    }

    .title {
      font-size: 9vw;
      font-weight: 800;
      line-height: 0.85;
      letter-spacing: -0.04em;
      margin-top: -1vw;
    }

    .title-small {
      font-size: 3vw;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .text {
      font-size: 3.5vw;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .data-group {
      display: flex;
      flex-direction: column;
      gap: 0.5vw;
    }

    .val {
      font-size: 2vw;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .links {
      flex-direction: row;
      gap: 2vw;
      margin-top: 1vw;
    }

    .links a {
      font-size: 1.2vw;
      font-weight: 700;
      color: inherit;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      padding-bottom: 0.2vw;
      transition: opacity 0.2s;
    }

    .links a:hover {
      opacity: 0.6;
    }

    @media (max-width: 640px) {
      body {
        display: flex;
        flex-direction: column;
        height: auto;
        overflow: auto;
      }
      .container {
        display: flex;
        flex-direction: column;
        height: auto;
        max-height: none;
        gap: 2px;
        overflow: auto;
      }
      .block {
        min-height: 40vh;
        padding: 6vw;
      }
      .block:hover {
        transform: none;
      }
      .title { font-size: 18vw; margin-top: 0; margin-bottom: 4vw; }
      .title-small { font-size: 8vw; }
      .text { font-size: 8vw; }
      .label { font-size: 3.5vw; margin-bottom: 1vw; }
      .val { font-size: 6vw; }
      .links { flex-direction: column; gap: 4vw; margin-top: 4vw; }
      .links a { font-size: 4.5vw; }
      .b-data { gap: 6vw; }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="container">

  <div class="block b-name">
    <div class="title">ERIK<br>NILSSON</div>
    <div class="label">SAN FRANCISCO, CA</div>
  </div>

  <div class="block b-role">
    <div class="title-small">PRODUCT DESIGNER<br>@ CURSOR</div>
  </div>

  <div class="block b-about">
    <div class="text">Working on how people build software with AI.</div>
    <div class="label">OFF-HOURS: LIVING-SITE</div>
  </div>

  <div class="block b-data">
    <div class="data-group">
      <div class="label">LISTENING</div>
      <div class="val">Fred again.., Drake, Beach House</div>
    </div>
    <div class="data-group">
      <div class="label">RECENT</div>
      <div class="val">"imagine 2026"</div>
    </div>
    <div class="data-group">
      <div class="label">WEATHER</div>
      <div class="val">11°C, Clear</div>
    </div>
    <div class="data-group links">
      <a href="https://x.com/flowstated">X / TWITTER</a>
      <a href="https://github.com/eriknson">GITHUB</a>
      <a href="https://eriks.design">SITE</a>
      <a href="https://cursor.com">CURSOR</a>
    </div>
  </div>

  </div>
</body>
</html>
