<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <style>
    :root {
      --ink: #171612;
      --muted: #6f6b63;
      --void: #f6f3ea;
      --paper: #fffcf5;
      --line: rgba(23, 22, 18, .14);
      --pink: #ff3ac8;
      --lime: #baff00;
      --cyan: #00e5ff;
      --blue: #222cff;
      --orange: #ff6a00;
    }

    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --ink: color(display-p3 .09 .09 .07);
        --muted: color(display-p3 .44 .42 .39);
        --void: color(display-p3 .96 .95 .91);
        --paper: color(display-p3 1 .99 .96);
        --line: color(display-p3 .09 .09 .07 / .14);
        --pink: color(display-p3 1 .08 .78);
        --lime: color(display-p3 .72 1 0);
        --cyan: color(display-p3 0 .88 1);
        --blue: color(display-p3 .08 .08 1);
        --orange: color(display-p3 1 .36 0);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f8f1df;
        --muted: #9f9b91;
        --void: #080908;
        --paper: #11120f;
        --line: rgba(248, 241, 223, .18);
        --pink: #ff3ac8;
        --lime: #baff00;
        --cyan: #00e5ff;
        --blue: #222cff;
        --orange: #ff6a00;
      }

      @supports (color: color(display-p3 1 1 1)) {
        :root {
          --ink: color(display-p3 .98 .94 .84);
          --muted: color(display-p3 .62 .60 .55);
          --void: color(display-p3 .025 .028 .022);
          --paper: color(display-p3 .065 .068 .055);
          --line: color(display-p3 .98 .94 .84 / .18);
          --pink: color(display-p3 1 .08 .78);
          --lime: color(display-p3 .72 1 0);
          --cyan: color(display-p3 0 .88 1);
          --blue: color(display-p3 .08 .08 1);
          --orange: color(display-p3 1 .36 0);
        }
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--void);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: var(--void);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
      padding: clamp(18px, 3vw, 44px);
      display: grid;
      place-items: center;
    }

    .site::before,
    .site::after {
      content: "";
      position: fixed;
      z-index: -3;
      pointer-events: none;
    }

    .site::before {
      width: 50vw;
      height: 38vh;
      top: 7vh;
      right: -10vw;
      background: var(--blue);
      transform: rotate(-11deg);
      box-shadow: -24vw 50vh 0 var(--pink);
    }

    .site::after {
      width: 34vw;
      height: 72vh;
      left: -13vw;
      bottom: -18vh;
      background: var(--lime);
      transform: rotate(17deg);
      box-shadow: 58vw -16vh 0 var(--orange), 78vw 31vh 0 var(--cyan);
    }

    .shell {
      position: relative;
      width: 100%;
      max-width: 40rem;
      margin-left: auto;
      margin-right: auto;
      min-height: min(760px, calc(100svh - clamp(36px, 6vw, 88px)));
      border: 1px solid var(--line);
      background: var(--paper);
      box-shadow: 0 34px 90px rgb(0 0 0 / .48);
      overflow: hidden;
    }

    .glyphs {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      color: var(--line);
      font-family: "Times New Roman", ui-serif, Georgia, serif;
      font-size: clamp(2.5rem, 8vw, 8.5rem);
      line-height: 1;
    }

    .glyphs span {
      position: absolute;
      left: var(--x);
      top: var(--y);
      color: var(--c);
      opacity: var(--o, .78);
      transform: rotate(var(--r, 0deg));
      text-shadow: 0 0 26px currentColor;
    }

    .panel {
      position: absolute;
      border: 1px solid var(--line);
      background: var(--void);
    }

    .panel.one {
      width: 168px;
      height: 168px;
      top: 26px;
      left: 26px;
    }

    .panel.two {
      width: 26vw;
      height: 86px;
      right: 28px;
      top: 28px;
      background: var(--cyan);
    }

    .panel.three {
      width: 92px;
      height: 42vh;
      right: 12%;
      bottom: 0;
      background: var(--pink);
    }

    .content {
      min-height: inherit;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 330px);
      gap: clamp(28px, 6vw, 96px);
      align-items: end;
      padding: clamp(28px, 7vw, 88px);
      position: relative;
      z-index: 1;
    }

    .hero {
      max-width: 700px;
    }

    .kicker,
    .meta,
    .link-row,
    .stamp {
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .72rem;
    }

    .kicker {
      color: var(--lime);
      margin: 0 0 28px;
    }

    h1 {
      margin: 0;
      max-width: 10ch;
      font-family: "Times New Roman", ui-serif, Georgia, serif;
      font-size: clamp(4.7rem, 16vw, 13.5rem);
      font-weight: 400;
      line-height: .78;
      letter-spacing: -.09em;
    }

    .role {
      margin: clamp(22px, 4vw, 44px) 0 0;
      max-width: 16ch;
      font-size: clamp(1.35rem, 3vw, 3.6rem);
      line-height: .95;
      letter-spacing: -.055em;
    }

    .side {
      display: grid;
      gap: 18px;
      align-content: end;
    }

    .card {
      border: 1px solid var(--line);
      background: rgb(0 0 0 / .06);
      padding: 18px;
    }

    @media (prefers-color-scheme: dark) {
      .card {
        background: rgb(0 0 0 / .34);
      }
    }

    .card.hot {
      background: var(--lime);
      color: var(--void);
      border-color: transparent;
    }

    .meta {
      color: var(--muted);
      margin: 0 0 16px;
    }

    .card.hot .meta {
      color: rgb(23 22 18 / .64);
    }

    @media (prefers-color-scheme: dark) {
      .card.hot .meta {
        color: rgb(8 9 8 / .64);
      }
    }

    .card p:last-child {
      margin-bottom: 0;
    }

    .compact {
      margin: 0;
      font-size: 1.03rem;
      line-height: 1.34;
      letter-spacing: -.025em;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .link-row a {
      border: 1px solid var(--line);
      padding: 10px 12px;
      background: var(--void);
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .link-row a:hover,
    .link-row a:focus-visible {
      background: var(--pink);
      color: var(--void);
      transform: translateY(-2px);
      outline: 0;
    }

    .stamp {
      position: absolute;
      left: 28px;
      bottom: 24px;
      color: var(--muted);
      writing-mode: vertical-rl;
    }

    @media (max-width: 640px) {
      .content {
        padding-inline: 18px;
      }
    }

    @media (max-width: 760px) {
      body {
        overflow-x: hidden;
      }

      .site {
        display: block;
      }

      .shell {
        min-height: calc(100svh - 36px);
      }

      .panel.one {
        width: 112px;
        height: 112px;
      }

      .panel.two {
        width: 52vw;
        height: 56px;
      }

      .panel.three {
        width: 52px;
        right: 0;
      }

      .content {
        min-height: calc(100svh - 36px);
        grid-template-columns: 1fr;
        align-content: end;
        padding: 120px 22px 28px;
      }

      h1 {
        font-size: clamp(4.8rem, 25vw, 8rem);
      }

      .role {
        max-width: 12ch;
      }

      .stamp {
        display: none;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <main class="site" aria-label="Erik Nilsson">
    <section class="shell">
      <div class="glyphs" aria-hidden="true">
        <span style="--x: 9%; --y: 12%; --c: var(--lime); --r: -18deg;">Æ</span>
        <span style="--x: 63%; --y: 19%; --c: var(--pink); --r: 11deg; --o: .65;">§</span>
        <span style="--x: 39%; --y: 44%; --c: var(--cyan); --r: 24deg;">ø</span>
        <span style="--x: 76%; --y: 58%; --c: var(--orange); --r: -8deg; --o: .72;">¶</span>
        <span style="--x: 16%; --y: 71%; --c: var(--blue); --r: 7deg;">∞</span>
      </div>

      <div class="panel one" aria-hidden="true"></div>
      <div class="panel two" aria-hidden="true"></div>
      <div class="panel three" aria-hidden="true"></div>

      <div class="content">
        <article class="hero">
          <p class="kicker">San Francisco / clear / 11 C</p>
          <h1>Erik Nilsson</h1>
          <p class="role">Product Designer at Cursor.</p>
        </article>

        <aside class="side" aria-label="Today">
          <section class="card hot">
            <p class="meta">Now</p>
            <p class="compact">Designing how people build software with AI.</p>
          </section>

          <section class="card">
            <p class="meta">Signal</p>
            <p class="compact">Quiet public week. Agents still humming.</p>
          </section>

          <section class="card">
            <p class="meta">Sound</p>
            <p class="compact">Fred again.. / Beach House / Ben Böhmer</p>
          </section>

          <nav class="link-row" aria-label="Links">
            <a href="https://eriks.design">Site</a>
            <a href="https://cursor.com">Cursor</a>
            <a href="https://x.com/flowstated">X</a>
            <a href="https://github.com/eriknson">GitHub</a>
            <a href="mailto:contact@eriks.design">Email</a>
          </nav>
        </aside>
      </div>

      <div class="stamp">May 15 / living-site</div>
    </section>
  </main>
</body>
</html>
