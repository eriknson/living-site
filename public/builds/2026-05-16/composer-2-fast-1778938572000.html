<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      /* sRGB fallbacks — light */
      --void: #f6f4fc;
      --ink: #120c1c;
      --muted: rgba(18,12,28,0.55);
      --ribbon-a: color(display-p3 0.18 1 0.82);
      --ribbon-b: color(display-p3 0.97 0.22 0.58);
      --ribbon-c: color(display-p3 0.55 0.35 1);
      --field: color(display-p3 0.88 0.86 0.96);
      --panel: color(display-p3 0.93 0.91 0.98);
      --spot: color(display-p3 0.06 0.58 0.45);
      --link-rest: color(display-p3 0.25 0.28 0.65);
      --link-hover: color(display-p3 0.08 0.08 0.22);
      --rule: color(display-p3 0.55 0.52 0.72);
      color-scheme: light;
      --pad: clamp(1.25rem, 4vw, 3.5rem);
      --rail: clamp(8px, 1.2vw, 14px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --void: #0c0618;
        --ink: #e8eef8;
        --muted: rgba(232,238,248,0.55);
        --field: color(display-p3 0.05 0.02 0.12);
        --panel: color(display-p3 0.08 0.04 0.16);
        --spot: color(display-p3 0.12 0.95 0.68);
        --link-rest: color(display-p3 0.75 0.78 1);
        --link-hover: color(display-p3 1 1 1);
        --rule: color(display-p3 0.4 0.35 0.62);
        color-scheme: dark;
      }
    }

    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --void: color(display-p3 0.96 0.95 0.99);
        --ink: color(display-p3 0.08 0.05 0.12);
        --muted: color(display-p3 0.38 0.36 0.45);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --void: color(display-p3 0.05 0.02 0.08);
          --ink: color(display-p3 0.94 0.96 0.98);
          --muted: color(display-p3 0.55 0.58 0.68);
        }
      }
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--void);
      color: var(--ink);
      min-height: 100dvh;
      line-height: 1.35;
      font-weight: 400;
      letter-spacing: -0.015em;
      font-size: clamp(15px, 1.05vw + 13px, 18px);
    }

    .wrap {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: var(--rail) 1fr;
      position: relative;
      overflow: clip;
    }

    .ribbon-stack {
      display: grid;
      grid-template-rows: 38% 1fr 28%;
      z-index: 2;
      mix-blend-mode: normal;
    }

    .ribbon-stack span {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--ribbon-a);
    }
    .ribbon-stack span:nth-child(2) { background: var(--ribbon-c); opacity: 0.92; }
    .ribbon-stack span:nth-child(3) { background: var(--ribbon-b); opacity: 0.88; }

    main {
      max-width: 40rem;
      width: 100%;
      margin-inline: auto;
      padding: var(--pad);
      padding-left: clamp(1.5rem, 5vw, 4rem);
      display: grid;
      align-content: space-between;
      gap: clamp(3rem, 12vh, 7rem);
      position: relative;
      z-index: 1;
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: var(--panel);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 18% 100%, 0 62%);
      z-index: -1;
    }

    /* Hard fog plane — flat, no gradients */
    .fog {
      position: fixed;
      right: -12vw;
      top: -8vh;
      width: 56vw;
      height: 42vh;
      background: var(--field);
      transform: rotate(-8deg);
      z-index: 0;
      border: 1px solid color(display-p3 0.25 0.6 0.95);
      box-shadow: 0 0 0 1px color(display-p3 0.52 1 0.88 / 0.22);
    }

    h1 {
      font-weight: 700;
      font-size: clamp(2.4rem, 6.5vw + 1rem, 6rem);
      letter-spacing: -0.04em;
      line-height: 0.94;
      max-width: 12ch;
    }

    .tag {
      margin-top: 1.1rem;
      font-family: ui-monospace, "SFMono-Regular", "Menlo", Consolas, monospace;
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--spot);
      max-width: 36em;
    }

    .gist {
      max-width: 28em;
      color: var(--muted);
      font-size: clamp(14px, 0.85vw + 12px, 17px);
      margin-top: 2rem;
      font-weight: 400;
    }

    footer {
      display: grid;
      gap: 1.5rem;
    }

    .today {
      font-family: ui-monospace, "SFMono-Regular", "Menlo", Consolas, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1.25rem;
      align-items: baseline;
      border-top: 1px solid var(--rule);
      padding-top: 1rem;
      max-width: 56rem;
    }

    .today b {
      font-weight: 500;
      color: var(--spot);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.6rem;
      font-family: ui-monospace, "SFMono-Regular", "Menlo", Consolas, monospace;
      font-size: 0.74rem;
    }

    nav a {
      color: var(--link-rest);
      text-decoration: none;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.15s ease, text-shadow 0.15s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--link-hover);
      outline: none;
      text-shadow:
        0 0 12px color(display-p3 0.62 1 0.95 / 0.55),
        0 0 28px color(display-p3 0.85 0.4 1 / 0.35);
    }

    /* phosphor bead — purely flat disk */
    .seed {
      position: fixed;
      width: clamp(54px, 8vw, 92px);
      height: clamp(54px, 8vw, 92px);
      border-radius: 50%;
      background: var(--spot);
      left: clamp(72%, 80vw, 92%);
      top: clamp(18%, 22vh, 38%);
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.94;
    }

    @media (prefers-reduced-motion: reduce) {
      nav a { transition: none; }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="fog" aria-hidden="true"></div>
  <div class="wrap">
    <div class="ribbon-stack" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <main>
      <div>
        <h1>Erik Nilsson</h1>
        <p class="tag">Product design · Cursor · San Francisco</p>
        <p class="gist">AI-native tools by day; this page is a daily rebuild from fresh signal — not the portfolio canon.</p>
      </div>
      <footer>
        <nav aria-label="Contact">
          <a href="https://cursor.com">Cursor</a>
          <a href="https://eriks.design">Site</a>
          <a href="mailto:contact@eriks.design">Mail</a>
          <a href="https://x.com/flowstated">X</a>
          <a href="https://github.com/eriknson">GitHub</a>
          <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
        </nav>
        <p class="today">
          <span><b>2026‑05‑16</b></span>
          <span>Spring · 11°c · Clear</span>
          <span>Listening: stutter‑house drift</span>
          <span>Git: quiet week</span>
        </p>
      </footer>
    </main>
  </div>
  <span class="seed" aria-hidden="true"></span>
</body>
</html>
