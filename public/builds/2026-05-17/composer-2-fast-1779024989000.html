<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <style>
    :root {
      --ink: #0c0b12;
      --mist: #f4f2eb;
      --bolt: #7a1acb;
      --flare: #ff4d3a;
      --lime: #2ee8a8;
    }
    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --ink: color(display-p3 0.05 0.04 0.07);
        --mist: color(display-p3 0.96 0.95 0.92);
        --bolt: color(display-p3 0.42 0.12 0.78);
        --flare: color(display-p3 0.95 0.32 0.24);
        --lime: color(display-p3 0.2 0.91 0.65);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8e6e3;
        --mist: #e8e8e8;
        --bolt: #0f0d14;
        --flare: #8b2418;
        --lime: #1fc78f;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-font-smoothing: antialiased; }

    body {
      min-height: 100svh;
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      font-size: clamp(0.8125rem, 0.75rem + 0.35vw, 0.9375rem);
      font-weight: 400;
      line-height: 1.45;
      color: var(--mist);
      background: var(--bolt);
      overflow-x: hidden;
    }

    .shell {
      max-width: 40rem;
      margin: 0 auto;
      min-height: 100svh;
      display: grid;
      grid-template-columns: 1fr;
      position: relative;
      isolation: isolate;
    }

    @media (min-width: 840px) {
      .shell {
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.95fr);
      }
    }

    .panel-main {
      padding: clamp(1.5rem, 4vw, 3.25rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(2rem, 6vw, 4rem);
      position: relative;
    }

    .panel-main::after {
      content: "";
      position: absolute;
      width: clamp(18rem, 42vw, 34rem);
      height: clamp(18rem, 42vw, 34rem);
      border: 2px solid var(--lime);
      border-radius: 50%;
      right: clamp(-6rem, -8vw, -2rem);
      bottom: clamp(-7rem, -12vw, -3rem);
      opacity: 0.55;
      pointer-events: none;
      z-index: -1;
    }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.86;
    }

    h1 {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 800;
      font-size: clamp(2.75rem, 9vw, 6.75rem);
      line-height: 0.92;
      letter-spacing: -0.045em;
      margin-top: 0.35rem;
      max-width: 14ch;
    }

    .lede {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 550;
      font-size: clamp(1rem, 1.9vw, 1.2rem);
      line-height: 1.35;
      max-width: 36ch;
      opacity: 0.92;
    }

    .lede a {
      color: inherit;
      text-underline-offset: 0.18em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      margin-top: 1.75rem;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.78;
    }

    .meta span::before {
      content: "·";
      margin-right: 0.5rem;
      opacity: 0.5;
    }
    .meta span:first-child::before { content: none; margin-right: 0; }

    .orbit-zone {
      margin-top: clamp(1.75rem, 4vw, 2.75rem);
      position: relative;
      width: min(100%, 22rem);
      aspect-ratio: 1;
    }

    .orbit-track {
      position: absolute;
      inset: 8%;
      border: 1px solid color-mix(in srgb, var(--mist) 45%, transparent);
      border-radius: 50%;
    }

    @supports (color: color(display-p3 1 1 1)) {
      .orbit-track {
        border-color: color(display-p3 0.96 0.95 0.92 / 0.38);
      }
    }

    .node {
      --a: 0deg;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0.55rem;
      height: 0.55rem;
      margin: -0.275rem;
      border-radius: 50%;
      background: var(--mist);
      transform: rotate(var(--a)) translateX(calc(50% - 0.2rem)) rotate(calc(-1 * var(--a)));
      cursor: pointer;
      border: none;
      appearance: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .node.lit {
      background: #ff8a14;
      box-shadow: 0 0 0 3px rgba(255, 138, 20, 0.35);
    }

    @supports (color: color(display-p3 1 1 1)) {
      .node.lit {
        background: color(display-p3 1 0.55 0.08);
        box-shadow: 0 0 0 3px color(display-p3 1 0.55 0.08 / 0.35);
      }
    }

    .node:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 2px;
    }

    .node:hover {
      transform: rotate(var(--a)) translateX(calc(50% - 0.2rem)) rotate(calc(-1 * var(--a))) scale(1.2);
    }

    .orbit-zone > .node:nth-of-type(1) { --a: 0deg; }
    .orbit-zone > .node:nth-of-type(2) { --a: 60deg; }
    .orbit-zone > .node:nth-of-type(3) { --a: 120deg; }
    .orbit-zone > .node:nth-of-type(4) { --a: 180deg; }
    .orbit-zone > .node:nth-of-type(5) { --a: 240deg; }
    .orbit-zone > .node:nth-of-type(6) { --a: 300deg; }

    .orbit-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.45;
      text-align: center;
      width: 8rem;
      pointer-events: none;
    }

    .panel-side {
      background: var(--flare);
      color: var(--ink);
      padding: clamp(1.5rem, 4vw, 3.25rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2rem;
      position: relative;
      overflow: hidden;
    }

    .panel-side::before {
      content: "";
      position: absolute;
      width: 120%;
      height: 42%;
      right: -22%;
      bottom: -8%;
      background: var(--lime);
      transform: rotate(-12deg);
      pointer-events: none;
    }

    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      position: relative;
      z-index: 1;
    }

    .links a {
      color: inherit;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 22%, transparent);
      transition: border-color 0.12s ease, padding-left 0.12s ease;
    }

    .links a:hover {
      border-color: var(--ink);
      padding-left: 0.35rem;
    }

    .links code {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      opacity: 0.55;
      font-weight: 400;
    }

    .pulse-wrap {
      position: relative;
      z-index: 1;
    }

    .pulse {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: clamp(1.35rem, 3.2vw, 2rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
      max-width: 22ch;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.75rem;
    }

    .tags li {
      list-style: none;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 0.55rem;
      background: color-mix(in srgb, var(--ink) 10%, transparent);
    }

    @supports (color: color(display-p3 1 1 1)) {
      .tags li {
        background: color(display-p3 0.05 0.04 0.07 / 0.1);
      }
    }

    .footnote {
      font-size: 0.68rem;
      opacity: 0.72;
      position: relative;
      z-index: 1;
      max-width: 40ch;
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="panel-main">
      <header>
        <p class="eyebrow">2026-05-17 · spring</p>
        <h1>Erik Nilsson</h1>
        <p class="lede">Product design, <a href="https://cursor.com">Cursor</a>. Off-hours: <a href="https://eriks.design">living-site</a>.</p>
        <div class="meta">
          <span>San Francisco</span>
          <span>10°C · clear</span>
        </div>
      </header>

      <div>
        <div class="orbit-zone" aria-label="Ring nodes">
          <div class="orbit-track"></div>
          <span class="orbit-hint">tap</span>
          <button type="button" class="node" aria-pressed="false" aria-label="orbit node"></button>
          <button type="button" class="node" aria-pressed="false" aria-label="orbit node"></button>
          <button type="button" class="node" aria-pressed="false" aria-label="orbit node"></button>
          <button type="button" class="node" aria-pressed="false" aria-label="orbit node"></button>
          <button type="button" class="node" aria-pressed="false" aria-label="orbit node"></button>
          <button type="button" class="node" aria-pressed="false" aria-label="orbit node"></button>
        </div>
      </div>
    </div>

    <aside class="panel-side">
      <div class="pulse-wrap">
        <p class="pulse">Calm surface. Loud color.</p>
        <ul class="tags">
          <li>stutter house</li>
          <li>dream pop</li>
          <li>swedish pop</li>
        </ul>
      </div>
      <nav aria-label="Links">
        <ul class="links">
          <li><a href="https://eriks.design">Site <code>www</code></a></li>
          <li><a href="mailto:contact@eriks.design">Email</a></li>
          <li><a href="https://x.com/flowstated">X</a></li>
          <li><a href="https://github.com/eriknson">GitHub</a></li>
          <li><a href="https://linkedin.com/in/eriknson">LinkedIn</a></li>
        </ul>
      </nav>
      <p class="footnote">GitHub: side tinkering, not the job.</p>
    </aside>
  </div>
  <script>
    document.querySelectorAll(".node").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var on = btn.classList.toggle("lit");
        btn.setAttribute("aria-pressed", on ? "true" : "false");
      });
    });
  </script>
</body>
</html>
