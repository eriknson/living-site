<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Nilsson</title>
<style>
  :root {
    --bg-red: #ff2200;
    --bg-blue: #0022ff;
    --bg-yellow: #ccff00;
    --bg-black: #000000;
    --text-white: #ffffff;
  }

  @supports (color: color(display-p3 1 1 1)) {
    :root {
      --bg-red: color(display-p3 1 0.1 0);
      --bg-blue: color(display-p3 0 0.1 1);
      --bg-yellow: color(display-p3 0.8 1 0);
      --bg-black: color(display-p3 0 0 0);
      --text-white: color(display-p3 1 1 1);
    }
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior: none;
    background: #ececec;
  }

  @media (prefers-color-scheme: dark) {
    body, html {
      background: var(--bg-black);
    }
  }

  .container {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 60vh 40vh;
    height: 100vh;
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
  }

  @media (max-width: 640px) {
    .container {
      display: flex;
      flex-direction: column;
      height: auto;
      min-height: 100vh;
    }
    .panel {
      min-height: 45vh;
      padding: 6vw;
    }
    h1 {
      font-size: clamp(3rem, 12vw, 8rem);
    }
    h2 {
      font-size: clamp(1.25rem, 5vw, 3rem);
    }
    .large-text {
      font-size: clamp(2.25rem, 8vw, 6rem);
    }
    .signal-text {
      font-size: clamp(1.25rem, 5vw, 3rem);
    }
    a {
      font-size: clamp(1.5rem, 6vw, 3rem);
    }
  }

  .panel {
    padding: 2.5vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .panel-1 {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
    background-color: var(--bg-red);
    color: var(--text-white);
  }

  .panel-2 {
    grid-column: 3 / 4;
    grid-row: 1 / 2;
    background-color: var(--bg-blue);
    color: var(--text-white);
  }

  .panel-3 {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
    background-color: var(--bg-yellow);
    color: var(--bg-black);
  }

  .panel-4 {
    grid-column: 2 / 4;
    grid-row: 2 / 3;
    background-color: var(--bg-black);
    color: var(--text-white);
  }

  h1 {
    font-size: clamp(4rem, 8vw, 12rem);
    margin: 0;
    line-height: 0.85;
    letter-spacing: -0.05em;
    font-weight: 600;
  }

  h2 {
    font-size: clamp(1.5rem, 3.5vw, 5rem);
    margin: 1vw 0 0 0;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .meta {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
    opacity: 0.8;
  }

  .large-text {
    font-size: clamp(3rem, 5vw, 8rem);
    font-weight: 500;
    line-height: 0.9;
    letter-spacing: -0.04em;
  }

  .signal-text {
    font-size: clamp(1.5rem, 2.5vw, 4rem);
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin: 0;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    gap: 3vw;
    flex-wrap: wrap;
  }

  a {
    color: inherit;
    text-decoration: none;
    font-size: clamp(2rem, 4vw, 5rem);
    font-weight: 500;
    letter-spacing: -0.03em;
    border-bottom: 2px solid transparent;
    transition: border-bottom-color 0.2s ease;
  }

  a:hover {
    border-bottom-color: currentColor;
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="panel panel-1">
      <div class="meta">San Francisco, CA</div>
      <div class="content">
        <h1>Erik Nilsson</h1>
        <h2>Product Designer</h2>
      </div>
    </div>
    
    <div class="panel panel-2">
      <div class="meta">Currently</div>
      <div class="content">
        <div class="large-text">@<br><a href="https://cursor.com">Cursor</a></div>
      </div>
    </div>

    <div class="panel panel-3">
      <div class="meta">2026.05.17</div>
      <div class="content">
        <p class="signal-text">Shipping by sunrise.</p>
      </div>
    </div>

    <div class="panel panel-4">
      <div class="meta">Index</div>
      <div class="content">
        <ul>
          <li><a href="https://eriks.design">Site</a></li>
          <li><a href="https://x.com/flowstated">X</a></li>
          <li><a href="https://github.com/eriknson">GitHub</a></li>
          <li><a href="mailto:contact@eriks.design">Email</a></li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
