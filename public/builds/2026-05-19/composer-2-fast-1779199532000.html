<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Erik Nilsson</title>
  <style>
    :root {
      --ink: #07070a;
      --paper: #f4f0e8;
      /* sRGB fallbacks near P3 targets */
      --a: #ff2568;
      --b: #0090ff;
      --c: #0f0f14;
      --d: #d7ff3a;
      --e: #ff5c00;
    }

    @supports (color: color(display-p3 1 0 0)) {
      :root {
        --a: color(display-p3 0.93 0.22 0.48);
        --b: color(display-p3 0.12 0.62 1);
        --c: color(display-p3 0.06 0.06 0.08);
        --d: color(display-p3 0.78 0.98 0.35);
        --e: color(display-p3 1 0.45 0.08);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f0f0f5;
        --paper: #d6d6df;
        --c: #08080d;
      }
    }

    body {
      margin: 0;
      font-family: ui-monospace, "SF Mono", "Segoe UI Mono", "Roboto Mono", Menlo, Monaco, Consolas, monospace;
      font-size: clamp(0.8rem, 0.9vw + 0.65rem, 0.95rem);
      font-weight: 400;
      line-height: 1.45;
      color: var(--paper);
      background: var(--c);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 0.12em;
      transition: opacity 0.15s ease, border-color 0.15s ease;
    }

    a:hover,
    a:focus-visible {
      opacity: 0.82;
      border-bottom-color: transparent;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    .wrap {
      max-width: 40rem;
      width: 100%;
      margin: 0 auto;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "hero hero"
        "lane-l lane-r"
        "foot foot";
    }

    @media (max-width: 820px) {
      .wrap {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto;
        grid-template-areas:
          "hero"
          "lane-l"
          "lane-r"
          "foot";
      }
    }

    @media (max-width: 640px) {
      .lane {
        padding: clamp(1.25rem, 5vw, 2rem);
      }
    }

    header {
      grid-area: hero;
      background: var(--a);
      color: var(--ink);
      padding: clamp(1.25rem, 4vw, 2.75rem);
      display: grid;
      gap: clamp(0.75rem, 2vw, 1.25rem);
      align-content: end;
      min-height: clamp(14rem, 38vh, 22rem);
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      /* structural line only — not a gradient fill */
      box-shadow: inset 0 -4px 0 0 var(--ink);
      opacity: 0.12;
    }

    h1 {
      margin: 0;
      font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(2.8rem, 8vw + 1rem, 6.5rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
    }

    .tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-weight: 500;
      opacity: 0.88;
    }

    .lane {
      padding: clamp(1.5rem, 4vw, 2.75rem);
      min-height: clamp(12rem, 32vh, 20rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .lane--l {
      grid-area: lane-l;
      background: var(--b);
      color: var(--ink);
    }

    .lane--r {
      grid-area: lane-r;
      background: var(--e);
      color: var(--ink);
    }

    .lane p {
      margin: 0;
      max-width: 28ch;
      font-size: clamp(0.85rem, 0.5vw + 0.75rem, 0.95rem);
    }

    .meta {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .shard {
      align-self: flex-end;
      width: 100%;
      height: 3px;
      background: var(--ink);
      opacity: 0.2;
      transform-origin: left center;
      transform: skewX(-12deg);
    }

    footer {
      grid-area: foot;
      background: var(--c);
      color: var(--d);
      padding: clamp(1.25rem, 3vw, 2rem) clamp(1.25rem, 4vw, 2.75rem);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.65rem 1.75rem;
    }

    footer a {
      border-bottom-color: rgba(215, 255, 58, 0.35);
    }

    .now {
      flex: 1 1 12rem;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1.25rem;
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="tag">Product · Cursor</p>
      <h1>Erik Nilsson</h1>
    </header>

    <section class="lane lane--l" aria-label="Left lane">
      <p>Design for AI-native tooling. SF.</p>
      <p class="meta" id="ambient">2026-05-19 · spring · 13° · clear</p>
      <div class="shard" aria-hidden="true"></div>
    </section>

    <section class="lane lane--r" aria-label="Right lane">
      <p>Off-hours: living-site — rewritten from daily signals.</p>
      <div class="shard" aria-hidden="true"></div>
    </section>

    <footer>
      <span class="now" aria-live="polite">Side repos stay experimental.</span>
      <nav class="links" aria-label="Contact">
        <a href="https://eriks.design">Site</a>
        <a href="mailto:contact@eriks.design">Email</a>
        <a href="https://x.com/flowstated">X</a>
        <a href="https://github.com/eriknson">GitHub</a>
        <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
        <a href="https://cursor.com">Cursor</a>
      </nav>
    </footer>
  </div>
</body>
</html>
