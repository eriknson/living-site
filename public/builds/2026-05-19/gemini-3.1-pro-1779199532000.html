<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Nilsson</title>
<style>
  :root {
    --bg-left: #ff0000;
    --bg-right: #00ffff;
    --fg: #ffffff;
  }
  
  @supports (color: color(display-p3 1 1 1)) {
    :root {
      --bg-left: color(display-p3 1 0 0);
      --bg-right: color(display-p3 0 1 1);
      --fg: color(display-p3 1 1 1);
    }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-left: #1a0606;
      --bg-right: #061a1a;
      --fg: #e8e8e8;
    }
  }

  @media (prefers-color-scheme: dark) {
    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --bg-left: color(display-p3 0.12 0.02 0.02);
        --bg-right: color(display-p3 0.02 0.12 0.12);
        --fg: color(display-p3 0.92 0.92 0.92);
      }
    }
  }

  body {
    margin: 0;
    height: 100vh;
    background-color: var(--bg-left);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  .split {
    position: absolute;
    top: 0;
    right: 0;
    width: 50vw;
    height: 100vh;
    background-color: var(--bg-right);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    color: var(--fg);
    mix-blend-mode: difference;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100vh;
    max-width: 40rem;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem;
    box-sizing: border-box;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
  }

  .top-bar, .bottom-bar {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .bottom-bar {
    align-items: flex-end;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .col.right {
    text-align: right;
  }

  .hero {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-grow: 1;
    width: 100%;
  }

  h1 {
    font-size: 20vw;
    font-weight: 800;
    margin: 0;
    line-height: 0.8;
    letter-spacing: -0.06em;
    text-align: center;
    white-space: nowrap;
    user-select: none;
  }

  a {
    color: var(--fg);
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  a:hover {
    opacity: 0.4;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  @media (max-width: 640px) {
    .split {
      width: 100vw;
      height: 50vh;
      top: 50vh;
      right: auto;
      left: 0;
    }
    h1 {
      font-size: 25vw;
      white-space: normal;
    }
    .content {
      padding: 1rem;
    }
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="split"></div>
  <div class="content">
    <div class="top-bar">
      <div class="col">
        <span>Erik Nilsson</span>
        <span>Product Designer</span>
      </div>
      <div class="col right">
        <span>San Francisco, CA</span>
        <span>Cursor</span>
      </div>
    </div>

    <div class="hero">
      <h1>ERIK<br>NILSSON</h1>
    </div>

    <div class="bottom-bar">
      <div class="col">
        <span>2026-05-19</span>
        <span>Living-site</span>
        <span>13°C / Clear</span>
      </div>
      <div class="col right links">
        <a href="https://cursor.com" target="_blank" rel="noopener noreferrer">Cursor</a>
        <a href="https://x.com/flowstated" target="_blank" rel="noopener noreferrer">X</a>
        <a href="https://github.com/eriknson" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://linkedin.com/in/eriknson" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>
    </div>
  </div>
</body>
</html>
