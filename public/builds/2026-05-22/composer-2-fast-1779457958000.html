<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Erik Nilsson</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --text: #122232;
      /* sRGB fallback */
      --bg-srgb: #eef2fa;
      --bg-p3: color(display-p3 0.94 0.96 0.995);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e8eef6;
        --bg-srgb: #03080f;
        --bg-p3: color(display-p3 0.035 0.055 0.11);
      }
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
      font-size: clamp(13px, 1.55vw, 15px);
      line-height: 1.55;
      color: var(--text);
      background-color: var(--bg-srgb);
    }
    @supports (color: color(display-p3 1 1 1)) {
      body {
        background-color: var(--bg-p3);
      }
    }

    .frame {
      min-height: 100vh;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      position: relative;
      overflow-x: clip;
    }

    .signal {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: clamp(1.25rem, 4vw, 2rem) clamp(0.85rem, 2vw, 1.35rem);
      font-size: 0.72rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      white-space: nowrap;
      align-self: start;
      /* fallback */
      background: #bf00ff;
      color: #050308;
      font-weight: 500;
    }
    @supports (color: color(display-p3 1 1 1)) {
      .signal {
        background: color(display-p3 0.88 0.02 1);
        color: color(display-p3 0.04 0.02 0.08);
      }
    }

    main {
      padding: clamp(1.75rem, 7vw, 5rem);
      padding-right: clamp(1.75rem, 5vw, 4rem);
      display: grid;
      align-content: start;
      gap: clamp(2.5rem, 8vw, 5rem);
      max-width: 52rem;
      margin-inline: auto;
    }

    h1 {
      margin: 0;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: clamp(2.9rem, 11vw, 8rem);
      line-height: 0.92;
      letter-spacing: -0.045em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.75rem;
      align-items: baseline;
      font-size: 0.85rem;
      opacity: 0.88;
    }
    .meta span { white-space: nowrap; }
    .meta .dot {
      display: inline-block;
      width: 0.45em;
      height: 0.45em;
      border-radius: 50%;
      margin-right: 0.35em;
      vertical-align: 0.05em;
      background: #00ffc8;
    }
    @supports (color: color(display-p3 1 1 1)) {
      .meta .dot {
        background: color(display-p3 0.15 1 0.82);
      }
    }

    .strip {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      border: 2px solid;
      border-color: #00ffc8;
    }
    @supports (color: color(display-p3 1 1 1)) {
      .strip {
        border-color: color(display-p3 0.2 0.95 0.78);
      }
    }

    .strip p {
      margin: 0;
      padding: 1.1rem 1.25rem;
      max-width: 38ch;
    }
    .strip .fill {
      /* fallback */
      background: #fff200;
      color: #0a0a00;
    }
    @supports (color: color(display-p3 1 1 1)) {
      .strip .fill {
        background: color(display-p3 0.98 0.95 0.12);
        color: color(display-p3 0.05 0.05 0.02);
      }
    }

    .grid-links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr));
      gap: 0.65rem 1.25rem;
    }
    .grid-links a {
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid color-mix(in srgb, currentColor 35%, transparent);
      padding-bottom: 0.15rem;
      width: fit-content;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .grid-links a:hover,
    .grid-links a:focus-visible {
      /* fallback */
      color: #ff4d6d;
      border-bottom-color: #ff4d6d;
    }
    @supports (color: color(display-p3 1 1 1)) {
      .grid-links a:hover,
      .grid-links a:focus-visible {
        color: color(display-p3 1 0.35 0.45);
        border-bottom-color: color(display-p3 1 0.35 0.45);
      }
    }
    .grid-links a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    .aside {
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      opacity: 0.72;
      max-width: 36ch;
    }

    .foot {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 2rem;
      align-items: center;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      opacity: 0.55;
    }
    .foot time { font-variant-numeric: tabular-nums; }

    @media (max-width: 640px) {
      .frame {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .signal {
        writing-mode: horizontal-tb;
        width: 100%;
        text-align: center;
        letter-spacing: 0.22em;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="frame">
    <aside class="signal">spring · fog · 10°</aside>
    <main>
      <header>
        <h1>Erik Nilsson</h1>
        <div class="meta">
          <span><span class="dot" aria-hidden="true"></span>Product design, Cursor</span>
          <span>San Francisco</span>
        </div>
      </header>

      <section class="strip" aria-label="Note">
        <p class="fill">AI-native product work. Living-site rebuilds from daily signals; repos stay faint.</p>
      </section>

      <section class="grid-links" aria-label="Links">
        <a href="https://eriks.design">Site</a>
        <a href="https://cursor.com">Cursor</a>
        <a href="https://x.com/flowstated">X</a>
        <a href="https://github.com/eriknson">GitHub</a>
        <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
        <a href="mailto:contact@eriks.design">Email</a>
      </section>

      <p class="aside">Listening: Fred again.., Drake, Beach House. Tags drift—house, stutter, dream pop.</p>

      <footer class="foot">
        <time datetime="2026-05-22">2026-05-22</time>
        <span>Living-site</span>
      </footer>
    </main>
  </div>
</body>
</html>
