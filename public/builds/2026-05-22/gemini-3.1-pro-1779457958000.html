<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Nilsson</title>
<style>
  :root {
    --c1: color(display-p3 1 0.25 0);
    --c2: color(display-p3 0.85 1 0);
    --c3: color(display-p3 0 0.15 1);
    --c4: color(display-p3 1 0 0.85);
    --bg: color(display-p3 0.96 0.96 0.96);
    --fg: color(display-p3 0 0 0);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: color(display-p3 0.02 0.02 0.02);
      --fg: color(display-p3 0 0 0);
    }
  }

  /* Fallbacks for non-P3 displays */
  @supports not (color: color(display-p3 1 0 0)) {
    :root {
      --c1: #ff4000;
      --c2: #d9ff00;
      --c3: #0026ff;
      --c4: #ff00d9;
      --bg: #f5f5f5;
      --fg: #111111;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --fg: #111111;
      }
    }
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  .wrapper {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    grid-template-rows: 1fr 1.2fr;
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    height: 100vh;
    gap: 4px;
    padding: 4px;
    box-sizing: border-box;
  }

  .panel {
    position: relative;
    overflow: hidden;
    border-radius: 2px;
  }

  .p-1 { background: var(--c1); color: var(--fg); }
  .p-2 { background: var(--c2); color: var(--fg); }
  .p-3 { background: var(--c3); color: color(display-p3 1 1 1); }
  .p-4 { background: var(--c4); color: var(--fg); }

  /* Fallback text color for p-3 */
  @supports not (color: color(display-p3 1 1 1)) {
    .p-3 { color: #ffffff; }
  }

  .huge {
    position: absolute;
    bottom: -1.5vw;
    left: -0.5vw;
    font-size: clamp(5rem, 13vw, 25rem);
    line-height: 0.85;
    margin: 0;
    letter-spacing: -0.05em;
    font-weight: 800;
    white-space: nowrap;
  }

  .top-right {
    position: absolute;
    top: 2vw;
    right: 2vw;
    text-align: right;
    font-size: clamp(1.2rem, 2vw, 3rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-weight: 600;
  }

  .bottom-right {
    position: absolute;
    bottom: 2vw;
    right: 2vw;
    text-align: right;
    font-size: clamp(1.2rem, 2vw, 3rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-weight: 600;
  }

  .bottom-left {
    position: absolute;
    bottom: 2vw;
    left: 2vw;
    font-size: clamp(1.5rem, 3vw, 4rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    font-weight: 700;
  }

  .top-left {
    position: absolute;
    top: 2vw;
    left: 2vw;
    font-size: clamp(0.9rem, 1.2vw, 2rem);
    max-width: 60%;
    line-height: 1.2;
    font-weight: 500;
  }

  .center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    gap: 1vw;
    font-size: clamp(2rem, 4vw, 6rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    text-align: center;
  }

  .links a {
    color: inherit;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }

  .links a:hover {
    opacity: 0.4;
  }

  .top-right a {
    color: inherit;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }

  .top-right a:hover {
    opacity: 0.4;
  }

  @media (max-width: 768px) {
    .wrapper {
      grid-template-columns: 1fr;
      grid-template-rows: 1.2fr 0.8fr 1fr 1fr;
      height: 100svh;
    }
    .huge {
      font-size: 28vw;
      bottom: -2vw;
      left: -1vw;
    }
    .top-right, .bottom-right {
      top: 4vw; right: 4vw; bottom: auto;
      font-size: 6vw;
    }
    .p-2 .bottom-right {
      top: auto; bottom: 4vw;
    }
    .bottom-left {
      bottom: 4vw; left: 4vw;
      font-size: 8vw;
    }
    .top-left {
      top: 4vw; left: 4vw;
      font-size: 4vw;
      max-width: 80%;
    }
    .center {
      font-size: 10vw;
      gap: 3vw;
    }
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="panel p-1">
      <h1 class="huge">ERIK<br>NILSSON</h1>
    </div>
    <div class="panel p-2">
      <div class="top-right">
        PRODUCT DESIGNER<br>
        <a href="https://cursor.com" target="_blank" rel="noopener">CURSOR</a>
      </div>
      <div class="bottom-right">
        SF, CA<br>
        10°C / FOGGY
      </div>
    </div>
    <div class="panel p-3">
      <div class="top-left">
        MARINE FOG SWALLOWING STREET EDGES
      </div>
      <div class="bottom-left">
        FRED AGAIN..<br>
        DRAKE<br>
        BEACH HOUSE
      </div>
    </div>
    <div class="panel p-4">
      <div class="center links">
        <a href="https://x.com/flowstated" target="_blank" rel="noopener">X</a>
        <a href="https://github.com/eriknson" target="_blank" rel="noopener">GITHUB</a>
        <a href="https://linkedin.com/in/eriknson" target="_blank" rel="noopener">LINKEDIN</a>
      </div>
    </div>
  </div>
</body>
</html>
