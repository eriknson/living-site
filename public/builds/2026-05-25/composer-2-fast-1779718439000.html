<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <meta name="theme-color" content="#12061c">
  <style>
    :root {
      /* light mode — paper field, ink type */
      --void: #f4eff7;
      --fog: #e8e2ef;
      --paper: #0c0614;
      --mute: #635c72;
      --strike: #c41068;
      --lime: #3d9a22;
      --cyan: #007a87;
      --vio: #5c34b3;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", "Consolas", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --void: #0c0614;
        --fog: #1a1622;
        --paper: #f4eff7;
        --mute: #9a93a8;
        --strike: #ff2d8b;
        --lime: #7cff4a;
        --cyan: #00e8ff;
        --vio: #9d5cff;
      }
    }

    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --void: color(display-p3 0.96 0.94 0.97);
        --fog: color(display-p3 0.92 0.89 0.95);
        --paper: color(display-p3 0.045 0.018 0.072);
        --mute: color(display-p3 0.42 0.38 0.48);
        --strike: color(display-p3 0.72 0.12 0.44);
        --lime: color(display-p3 0.28 0.58 0.18);
        --cyan: color(display-p3 0.02 0.5 0.55);
        --vio: color(display-p3 0.4 0.24 0.72);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --void: color(display-p3 0.045 0.018 0.072);
          --fog: color(display-p3 0.098 0.082 0.128);
          --paper: color(display-p3 0.96 0.94 0.97);
          --mute: color(display-p3 0.62 0.58 0.68);
          --strike: color(display-p3 0.98 0.22 0.52);
          --lime: color(display-p3 0.62 1 0.35);
          --cyan: color(display-p3 0.05 0.93 1);
          --vio: color(display-p3 0.62 0.38 1);
        }
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100%;
      font-family: var(--sans);
      background: var(--void);
      color: var(--paper);
      overflow-x: hidden;
    }

    /* Solid planes only — no gradients */
    .stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .slab-a {
      position: absolute;
      top: -8%;
      right: -14%;
      width: 58vmin;
      height: 58vmin;
      background: var(--vio);
      transform: rotate(12deg);
      clip-path: polygon(12% 0, 100% 14%, 88% 100%, 0 72%);
      opacity: 0.94;
    }

    .slab-b {
      position: absolute;
      bottom: -18%;
      left: -22%;
      width: 72vmin;
      height: 44vmin;
      background: var(--cyan);
      transform: rotate(-8deg);
      clip-path: polygon(0 20%, 100% 0, 94% 100%, 6% 88%);
      mix-blend-mode: plus-lighter;
      opacity: 0.42;
    }

    .beam {
      position: absolute;
      top: -5%;
      left: clamp(14%, 22vw, 28%);
      width: 6px;
      height: 110vh;
      background: var(--lime);
      opacity: 0.85;
      box-shadow:
        0 0 0 1px var(--void),
        28px 0 0 -2px color-mix(in srgb, var(--lime), transparent 70%);
    }

    @supports (color: color(display-p3 1 1 1)) {
      .beam {
        box-shadow:
          0 0 0 1px var(--void),
          28px 0 0 -2px color(display-p3 0.62 1 0.35 / 0.35);
      }
    }

    .haze {
      position: absolute;
      inset: 0;
      background: var(--fog);
      opacity: 0.35;
      mix-blend-mode: multiply;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.75rem, 5vw, 3.5rem);
      padding-left: clamp(2.75rem, 12vw, 7rem);
      max-width: 40rem;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 640px) {
      main {
        padding: clamp(1.25rem, 4vw, 2rem);
        padding-left: clamp(1.25rem, 5vw, 2rem);
      }

      h1 {
        font-size: clamp(1.85rem, 10vw, 2.75rem);
      }

      .whisper {
        max-width: none;
      }
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 4.6rem);
      font-weight: 650;
      letter-spacing: -0.045em;
      line-height: 0.94;
      color: var(--paper);
      text-shadow:
        0 0 0 var(--void),
        4px 0 0 color-mix(in srgb, var(--strike), transparent 55%);
    }

    @supports (color: color(display-p3 1 1 1)) {
      h1 {
        text-shadow:
          0 0 0 var(--void),
          4px 0 0 color(display-p3 0.98 0.22 0.52 / 0.5);
      }
    }

    .row {
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--mute);
      margin-top: 1.25rem;
    }

    .row span {
      color: var(--lime);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-right: 0.5rem;
    }

    .whisper {
      margin-top: 2rem;
      font-size: 1rem;
      line-height: 1.55;
      color: color-mix(in srgb, var(--paper), var(--mute) 28%);
      max-width: 22em;
    }

    @supports (color: color(display-p3 1 1 1)) {
      .whisper {
        color: color(display-p3 0.92 0.88 0.96 / 0.76);
      }
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.85rem;
      margin-top: 3rem;
      margin-bottom: 0.5rem;
    }

    nav a {
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--strike);
      text-decoration: none;
      padding: 0.35rem 0.1rem;
      border-bottom: 2px solid var(--cyan);
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    nav a:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 4px;
    }

    nav a:hover {
      color: var(--cyan);
      border-bottom-color: var(--lime);
    }

    footer {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mute);
    }

    footer kbd {
      font: inherit;
      color: color-mix(in srgb, var(--mute), var(--vio) 40%);
      padding: 0 0.25em;
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="slab-a"></div>
    <div class="slab-b"></div>
    <div class="beam"></div>
    <div class="haze"></div>
  </div>

  <main>
    <div>
      <h1>Erik Nilsson</h1>
      <p class="row"><span>2026-05-25</span>Product design · Cursor · SF</p>
      <p class="whisper">Product&nbsp;×&nbsp;AI. living-site reloads off fresh activity.</p>
    </div>

    <nav aria-label="Contact">
      <a href="https://eriks.design">Site</a>
      <a href="https://cursor.com">Cursor</a>
      <a href="https://x.com/flowstated">X</a>
      <a href="https://github.com/eriknson">Git</a>
      <a href="https://linkedin.com/in/eriknson">In</a>
      <a href="mailto:contact@eriks.design">Mail</a>
    </nav>

    <footer>
      Twelve&nbsp;celsius · fog · <kbd>p3</kbd>
    </footer>
  </main>
</body>
</html>
