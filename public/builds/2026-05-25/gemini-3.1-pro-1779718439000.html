<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Nilsson</title>
<style>
  :root {
    --bg: color(display-p3 0.98 0.98 0.97);
    --fg: color(display-p3 0.08 0.08 0.09);
    --primary: color(display-p3 1 0.2 0); /* Luminous Orange/Red */
    --secondary: color(display-p3 0.1 0.75 0.25); /* Electric Green tuned for light */
  }

  @supports not (color: color(display-p3 1 0 0)) {
    :root {
      --bg: #faf9f7;
      --fg: #1a1a1a;
      --primary: #ff3300;
      --secondary: #0d9428;
    }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: color(display-p3 0.02 0.02 0.02);
      --fg: color(display-p3 0.9 0.9 0.9);
      --primary: color(display-p3 1 0.2 0);
      --secondary: color(display-p3 0.1 1 0.3); /* Electric Green */
    }

    @supports not (color: color(display-p3 1 0 0)) {
      :root {
        --bg: #050505;
        --fg: #e6e6e6;
        --primary: #ff3300;
        --secondary: #1aff4d;
      }
    }
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
    height: 100vh;
    max-width: 40rem;
    margin: 0 auto;
    padding: 3vw;
    box-sizing: border-box;
  }

  .main-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 100%;
  }

  h1 {
    font-size: clamp(4rem, 15vw, 12rem);
    line-height: 0.85;
    letter-spacing: -0.05em;
    margin: 0 0 2rem 0;
    font-weight: 600;
  }

  .hi {
    color: var(--primary);
  }

  .details {
    font-size: clamp(1.2rem, 3vw, 3rem);
    line-height: 1.1;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--fg);
  }

  .details span {
    color: var(--secondary);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 1rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-top: 2px solid var(--fg);
    padding-top: 1.5rem;
  }

  .info {
    display: flex;
    gap: 3rem;
  }

  .links {
    display: flex;
    gap: 2rem;
  }

  a {
    color: var(--fg);
    text-decoration: none;
    transition: color 0.2s;
  }

  a:hover {
    color: var(--primary);
  }

  @media (max-width: 640px) {
    .footer {
      flex-direction: column;
      align-items: flex-start;
      gap: 2rem;
    }
    .info {
      flex-direction: column;
      gap: 0.5rem;
    }
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="main-content">
      <h1><span class="hi">Erik</span> Nilsson</h1>
      <div class="details">
        Product Designer at <span>Cursor</span>.<br>
        San Francisco.
      </div>
    </div>
    
    <div class="footer">
      <div class="info">
        <div>12°C / Overcast</div>
        <div>Playing: Fred again..</div>
      </div>
      <div class="links">
        <a href="https://cursor.com">Cursor</a>
        <a href="https://x.com/flowstated">X</a>
        <a href="https://github.com/eriknson">GitHub</a>
      </div>
    </div>
  </div>
</body>
</html>
