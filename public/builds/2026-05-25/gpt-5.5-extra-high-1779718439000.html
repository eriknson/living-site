<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Erik Nilsson</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080d;
      --fg: #f7f1e8;
      --muted: rgba(247, 241, 232, 0.58);
      --line: rgba(247, 241, 232, 0.18);
      --panel: rgba(7, 8, 13, 0.74);
      --hot: #ff4fd8;
      --acid: #d9ff00;
      --blue: #0037ff;
      --mint: #00ffc8;
      --red: #ff2a1f;
      --paper: #fff5db;
    }

    @supports (color: color(display-p3 1 0 0)) {
      :root {
        --fg: color(display-p3 0.98 0.94 0.88);
        --muted: color(display-p3 0.98 0.94 0.88 / 0.58);
        --line: color(display-p3 0.98 0.94 0.88 / 0.18);
        --hot: color(display-p3 1 0.08 0.78);
        --acid: color(display-p3 0.82 1 0);
        --blue: color(display-p3 0 0.12 1);
        --mint: color(display-p3 0 1 0.72);
        --red: color(display-p3 1 0.05 0.02);
        --paper: color(display-p3 1 0.95 0.78);
      }
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f8f1df;
        --fg: #101014;
        --muted: rgba(16, 16, 20, 0.58);
        --line: rgba(16, 16, 20, 0.18);
        --panel: rgba(248, 241, 223, 0.78);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #07080d;
        --fg: #f7f1e8;
        --muted: rgba(247, 241, 232, 0.58);
        --line: rgba(247, 241, 232, 0.18);
        --panel: rgba(7, 8, 13, 0.74);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      content: "";
      pointer-events: none;
    }

    body::before {
      width: 9px;
      height: 9px;
      inset: 9vmin auto auto 8vmin;
      background: var(--line);
      box-shadow:
        48px 0 0 var(--line),
        96px 0 0 var(--line),
        144px 0 0 var(--line),
        192px 0 0 var(--line),
        240px 0 0 var(--line),
        288px 0 0 var(--line),
        0 48px 0 var(--line),
        48px 48px 0 var(--line),
        96px 48px 0 var(--line),
        144px 48px 0 var(--line),
        192px 48px 0 var(--line),
        240px 48px 0 var(--line),
        288px 48px 0 var(--line),
        0 96px 0 var(--line),
        48px 96px 0 var(--line),
        96px 96px 0 var(--line),
        144px 96px 0 var(--line),
        192px 96px 0 var(--line),
        240px 96px 0 var(--line),
        288px 96px 0 var(--line);
      opacity: 0.5;
      transform: rotate(-6deg);
    }

    body::after {
      width: 38vmin;
      height: 38vmin;
      right: -10vmin;
      bottom: -11vmin;
      background: var(--acid);
      border: 1px solid color-mix(in srgb, var(--fg), transparent 72%);
      box-shadow: -22vmin -36vmin 0 -7vmin var(--hot), -54vmin -12vmin 0 -10vmin var(--blue);
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(22px, 4vw, 48px);
    }

    .shell {
      width: min(100%, 640px);
      max-width: 640px;
      margin: 0 auto;
      position: relative;
      isolation: isolate;
    }

    .color-stack {
      position: absolute;
      inset: -46px -34px auto auto;
      z-index: -1;
      display: grid;
      grid-template-columns: repeat(4, clamp(38px, 8vw, 72px));
      grid-auto-rows: clamp(38px, 8vw, 72px);
      gap: 8px;
      transform: rotate(7deg);
    }

    .chip {
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.34);
    }

    .chip:nth-child(1) { background: var(--hot); grid-column: span 2; }
    .chip:nth-child(2) { background: var(--acid); }
    .chip:nth-child(3) { background: var(--blue); grid-row: span 2; }
    .chip:nth-child(4) { background: var(--mint); }
    .chip:nth-child(5) { background: var(--red); grid-column: span 2; }
    .chip:nth-child(6) { background: var(--paper); }

    main {
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(18px);
    }

    .eyebrow,
    .meta,
    .links,
    .pulse {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
    }

    h1 {
      max-width: 9ch;
      margin: 58px 0 0;
      font-size: clamp(64px, 18vw, 142px);
      line-height: 0.76;
      letter-spacing: -0.095em;
      font-weight: 900;
    }

    .role {
      max-width: 18rem;
      margin: 26px 0 0 auto;
      font-size: clamp(20px, 4vw, 38px);
      line-height: 0.96;
      letter-spacing: -0.055em;
      font-weight: 780;
    }

    .quiet {
      color: var(--muted);
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 60px;
      color: var(--muted);
    }

    .meta span {
      min-height: 76px;
      display: grid;
      align-content: space-between;
      padding: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
    }

    .meta b {
      color: var(--fg);
      font-size: 15px;
      letter-spacing: -0.02em;
      text-transform: none;
    }

    .pulse {
      width: fit-content;
      margin-top: 14px;
      padding: 9px 11px;
      background: var(--acid);
      color: #050505;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 30px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .links a {
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.045);
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .links a:hover,
    .links a:focus-visible {
      background: var(--fg);
      color: var(--bg);
      transform: translateY(-2px);
      outline: none;
    }

    .mark {
      position: absolute;
      left: -18px;
      bottom: -18px;
      width: 84px;
      height: 84px;
      z-index: -1;
      background: var(--mint);
      box-shadow: 20px 20px 0 var(--red);
    }

    @media (max-width: 640px) {
      .stage {
        place-items: start center;
        padding-top: calc(18px + env(safe-area-inset-top));
      }

      .color-stack {
        inset: -20px -16px auto auto;
        gap: 6px;
      }

      main {
        padding: 26px;
      }

      .eyebrow,
      .meta,
      .links,
      .pulse {
        font-size: 11px;
      }

      h1 {
        margin-top: 76px;
      }

      .role {
        margin-left: 0;
      }

      .meta {
        grid-template-columns: 1fr;
        margin-top: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="shell">
      <div class="color-stack" aria-hidden="true">
        <i class="chip"></i>
        <i class="chip"></i>
        <i class="chip"></i>
        <i class="chip"></i>
        <i class="chip"></i>
        <i class="chip"></i>
      </div>

      <main aria-label="Erik Nilsson">
        <div class="eyebrow">
          <span>Erik Nilsson</span>
          <span>SF / 12 C</span>
        </div>

        <h1>Designing for AI software.</h1>

        <p class="role">
          Product designer at <a href="https://cursor.com">Cursor</a>.
          <span class="quiet">Building tools that think with you.</span>
        </p>

        <div class="meta" aria-label="Today">
          <span>Now <b>overcast spring</b></span>
          <span>Signal <b>imagine 2026</b></span>
          <span>Sound <b>Fred again.. / Beach House</b></span>
        </div>

        <div class="pulse">fresh rebuild / quiet week</div>

        <nav class="links" aria-label="Links">
          <a href="https://eriks.design">site</a>
          <a href="https://cursor.com">cursor</a>
          <a href="https://x.com/flowstated">x</a>
          <a href="https://github.com/eriknson">github</a>
          <a href="https://linkedin.com/in/eriknson">linkedin</a>
          <a href="mailto:contact@eriks.design">email</a>
        </nav>
      </main>

      <div class="mark" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
