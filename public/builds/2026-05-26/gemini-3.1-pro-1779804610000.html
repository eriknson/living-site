<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Nilsson</title>
<style>
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    padding: 1vw;
    background: color(display-p3 0.02 0.02 0.02);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: -0.04em;
  }

  .site-container {
    max-width: 40rem;
    margin: 0 auto;
    width: 100%;
    height: 100vh;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(12, 1fr);
    gap: 1vw;
    overflow: hidden;
  }

  .box {
    padding: 2vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .box-1 {
    grid-column: 1 / 10;
    grid-row: 1 / 10;
    background: color(display-p3 1 0.2 0);
    color: color(display-p3 0.05 0.05 0.05);
  }

  .box-2 {
    grid-column: 10 / 13;
    grid-row: 1 / 6;
    background: color(display-p3 0.8 1 0);
    color: color(display-p3 0.05 0.05 0.05);
  }

  .box-3 {
    grid-column: 10 / 13;
    grid-row: 6 / 13;
    background: color(display-p3 0 0.2 1);
    color: color(display-p3 0.98 0.98 0.98);
  }

  .box-4 {
    grid-column: 1 / 6;
    grid-row: 10 / 13;
    background: color(display-p3 0.95 0.95 0.95);
    color: color(display-p3 0.05 0.05 0.05);
  }

  .box-5 {
    grid-column: 6 / 10;
    grid-row: 10 / 13;
    background: color(display-p3 1 0.1 0.7);
    color: color(display-p3 0.05 0.05 0.05);
  }

  h1 {
    font-size: 13vw;
    line-height: 0.75;
    margin: 0;
    letter-spacing: -0.06em;
  }

  p {
    margin: 0;
    font-size: 1.25vw;
    line-height: 1.1;
  }

  .large-text {
    font-size: 2vw;
    line-height: 1;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover {
    opacity: 0.5;
  }

  .label {
    font-size: 0.85vw;
    opacity: 0.7;
    margin-bottom: 1vw;
  }

  @media (max-width: 640px) {
    .site-container {
      display: flex;
      flex-direction: column;
      height: auto;
      min-height: auto;
      overflow: auto;
    }
    .box {
      min-height: 30vh;
      padding: 4vw;
    }
    h1 { font-size: 24vw; }
    p { font-size: 4vw; }
    .large-text { font-size: 6vw; }
    .label { font-size: 3vw; margin-bottom: 4vw; }
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: #0d0d0d;
    }
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>

  <div class="site-container">

  <div class="box box-1">
    <div class="label">Erik Nilsson</div>
    <h1>Erik<br>Nilsson</h1>
    <p class="large-text">Product Designer at <a href="https://cursor.com">Cursor</a><br>San Francisco, CA</p>
  </div>

  <div class="box box-2">
    <div class="label">Index</div>
    <p class="large-text">
      <a href="https://x.com/flowstated">X</a><br>
      <a href="https://github.com/eriknson">GitHub</a><br>
      <a href="https://linkedin.com/in/eriknson">LinkedIn</a><br>
      <a href="mailto:contact@eriks.design">Email</a>
    </p>
  </div>

  <div class="box box-3">
    <div class="label">Context</div>
    <p class="large-text">2026-05-26<br>17°C, Partly Cloudy</p>
    <p style="margin-top: auto;">Pocket shortcuts wiring agents while the city hums.</p>
  </div>

  <div class="box box-4">
    <div class="label">Focus</div>
    <p class="large-text">Working on how people build software with AI.</p>
  </div>

  <div class="box box-5">
    <div class="label">Audio</div>
    <p class="large-text">Fred again..<br>Drake<br>Beach House</p>
  </div>

  </div>

</body>
</html>
