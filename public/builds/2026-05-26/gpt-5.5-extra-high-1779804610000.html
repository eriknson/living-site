<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Erik Nilsson</title>
  <style>
    :root {
      --ink: #050506;
      --paper: #f4f0e8;
      --quiet: #aaa39a;
      --hot: #ff246d;
      --acid: #b7ff24;
      --blue: #2533ff;
      --pool: #00e6ff;
      --sun: #ff7a1f;
      --page-bg: var(--paper);
      --page-fg: var(--ink);
      --rule: rgba(5, 5, 6, 0.12);
      --chip: rgba(255, 255, 255, 0.58);
      --chip-mid: rgba(255, 255, 255, 0.72);
      --chip-strong: rgba(255, 255, 255, 0.88);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: var(--ink);
        --page-fg: var(--paper);
        --rule: rgba(244, 240, 232, 0.2);
        --chip: rgba(5, 5, 6, 0.42);
        --chip-mid: rgba(5, 5, 6, 0.56);
        --chip-strong: rgba(5, 5, 6, 0.78);
      }
    }

    @supports (color: color(display-p3 1 0 0)) {
      :root {
        --ink: color(display-p3 0.012 0.012 0.016);
        --paper: color(display-p3 0.95 0.925 0.87);
        --quiet: color(display-p3 0.66 0.63 0.58);
        --hot: color(display-p3 1 0.08 0.38);
        --acid: color(display-p3 0.72 1 0.02);
        --blue: color(display-p3 0.08 0.1 1);
        --pool: color(display-p3 0 0.9 1);
        --sun: color(display-p3 1 0.45 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --rule: color(display-p3 0.95 0.925 0.87 / 0.2);
        }
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page-bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: var(--page-bg);
      color: var(--page-fg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      letter-spacing: -0.035em;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: min(64vw, 880px);
      height: min(64vw, 880px);
      right: -18vw;
      top: -14vw;
      border-radius: 50%;
      background: var(--hot);
      box-shadow:
        -18vw 28vh 0 -9vw var(--blue),
        -48vw 82vh 0 -14vw var(--acid);
      opacity: 0.94;
    }

    body::after {
      width: 31vw;
      min-width: 290px;
      height: 52vh;
      left: 7vw;
      bottom: -18vh;
      border-radius: 999px 999px 0 0;
      background: var(--pool);
      box-shadow: 36vw -8vh 0 -12vw var(--sun);
      opacity: 0.86;
      transform: rotate(-7deg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 640px;
      width: calc(100% - 32px);
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(38px, 8vh, 92px);
      padding: clamp(22px, 4vw, 48px) 0;
    }

    .topline,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--quiet);
      font-size: clamp(12px, 1.2vw, 15px);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .topline span,
    .footer span {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 12px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--chip);
      backdrop-filter: blur(16px);
    }

    .stage {
      align-self: center;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      gap: clamp(28px, 7vw, 92px);
      align-items: end;
    }

    h1 {
      max-width: 920px;
      margin: 0;
      font-size: clamp(70px, 15vw, 208px);
      line-height: 0.78;
      letter-spacing: -0.12em;
      text-wrap: balance;
    }

    .role {
      width: fit-content;
      margin: clamp(22px, 4vh, 46px) 0 0;
      padding: 12px 16px 14px;
      border: 1px solid var(--rule);
      border-radius: 24px;
      background: var(--chip-mid);
      color: var(--page-fg);
      font-size: clamp(18px, 2.6vw, 34px);
      line-height: 1;
      backdrop-filter: blur(18px);
    }

    .panel {
      border: 1px solid var(--rule);
      border-radius: 34px;
      background: var(--chip-mid);
      backdrop-filter: blur(22px);
      overflow: hidden;
    }

    .panel > * {
      padding: 22px;
    }

    .now {
      display: grid;
      gap: 1px;
      background: var(--rule);
    }

    .now div {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      background: var(--chip-strong);
    }

    .label {
      color: var(--quiet);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .value {
      color: var(--page-fg);
      font-size: 18px;
      line-height: 1.1;
      text-align: right;
    }

    .quote {
      border-top: 1px solid var(--rule);
      color: var(--page-fg);
      font-size: clamp(25px, 3vw, 42px);
      line-height: 0.96;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .links a {
      display: grid;
      min-height: 86px;
      place-items: center;
      border: 1px solid var(--rule);
      border-radius: 26px;
      background: var(--chip);
      color: var(--page-fg);
      font-size: clamp(16px, 2.2vw, 28px);
      letter-spacing: -0.08em;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    .links a:hover {
      transform: translateY(-4px);
      background: var(--page-fg);
      color: var(--page-bg);
    }

    .links a:nth-child(2):hover { background: var(--acid); color: var(--ink); }
    .links a:nth-child(3):hover { background: var(--pool); color: var(--ink); }
    .links a:nth-child(4):hover { background: var(--sun); color: var(--ink); }
    .links a:nth-child(5):hover { background: var(--hot); color: var(--page-bg); }

    .mark {
      position: absolute;
      right: min(4vw, 42px);
      top: 48%;
      width: clamp(52px, 7vw, 96px);
      aspect-ratio: 1;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: var(--acid);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: rotate(10deg);
    }

    @media (max-width: 820px) {
      body::before {
        width: 92vw;
        height: 92vw;
        right: -42vw;
        top: -20vw;
        box-shadow:
          -44vw 35vh 0 -26vw var(--blue),
          -34vw 77vh 0 -24vw var(--acid);
      }

      body::after {
        left: -20vw;
      }

      .stage {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .topline,
      .footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .links {
        grid-template-columns: 1fr 1fr;
      }

      .links a:first-child {
        grid-column: 1 / -1;
      }

      .mark {
        position: static;
        margin-left: auto;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <main>
    <header class="topline" aria-label="Today">
      <span>San Francisco</span>
      <span>May 26 · 17°C · partly cloudy</span>
    </header>

    <section class="stage" aria-label="Erik Nilsson">
      <div>
        <h1>Erik<br>Nilsson</h1>
        <p class="role">Product Designer at Cursor</p>
      </div>

      <aside class="panel" aria-label="Current signals">
        <div class="now">
          <div>
            <span class="label">Now</span>
            <span class="value">living-site</span>
          </div>
          <div>
            <span class="label">Sound</span>
            <span class="value">Fred again.. / Beach House</span>
          </div>
          <div>
            <span class="label">Signal</span>
            <span class="value">agents from a phone</span>
          </div>
        </div>
        <div class="quote">shipping by sunrise</div>
      </aside>
    </section>

    <nav class="links" aria-label="Links">
      <a href="https://eriks.design">site</a>
      <a href="https://cursor.com">cursor</a>
      <a href="https://x.com/flowstated">x</a>
      <a href="https://github.com/eriknson">github</a>
      <a href="mailto:contact@eriks.design">email</a>
    </nav>

    <div class="mark" aria-hidden="true">P3</div>

    <footer class="footer">
      <span>AI software, small experiments</span>
      <span>2026</span>
    </footer>
  </main>
</body>
</html>
