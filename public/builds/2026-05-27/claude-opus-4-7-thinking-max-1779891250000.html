<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#d6ff29">
<title>Erik Nilsson</title>
<meta name="description" content="Erik Nilsson — Designer at Cursor.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d6ff29'/%3E%3Cpath d='M9 23V9h7M9 16h6' fill='none' stroke='%230c1908' stroke-width='3' stroke-linecap='square'/%3E%3C/svg%3E">
<style>
:root {
  --bg:        color(display-p3 0.86 1 0.16);
  --ink:       color(display-p3 0.05 0.10 0.04);
  --ink-65:    color(display-p3 0.05 0.10 0.04 / .65);
  --ink-35:    color(display-p3 0.05 0.10 0.04 / .35);
  --accent:    color(display-p3 0.32 0.06 0.96);
  --accent-x:  color(display-p3 0.32 0.06 0.96 / .55);
}
@supports not (color: color(display-p3 1 1 1)) {
  :root {
    --bg:        #d6ff29;
    --ink:       #0c1908;
    --ink-65:    rgba(12,25,8,.65);
    --ink-35:    rgba(12,25,8,.35);
    --accent:    #4910f1;
    --accent-x:  rgba(73,16,241,.55);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.45 "Berkeley Mono", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -.005em;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent); color: var(--bg); }

.page {
  position: relative;
  min-height: 100svh;
  padding: 32px 36px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 36px;
}

/* corner registration marks */
.reg {
  position: absolute;
  width: 14px; height: 14px;
  color: var(--accent);
  pointer-events: none;
}
.reg.tl { top: 12px; left: 12px; }
.reg.tr { top: 12px; right: 12px; }
.reg.bl { bottom: 12px; left: 12px; }
.reg.br { bottom: 12px; right: 12px; }

/* top header strip */
.top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  font-size: 11px;
  letter-spacing: .15em;
  text-transform: uppercase;
}
.top .lhs { display: inline-flex; gap: 10px; align-items: baseline; }
.top .lhs .mark { color: var(--accent); }
.top .rhs {
  display: flex; gap: 22px; flex-wrap: wrap;
  justify-content: flex-end;
  color: var(--ink-65);
}

/* hero */
.hero { align-self: end; }
.name {
  margin: 0;
  font-weight: 500;
  font-size: clamp(76px, 17.2vw, 264px);
  letter-spacing: -.06em;
  line-height: .82;
  display: block;
}
.name .row { display: block; white-space: nowrap; }
.name .row.b { color: transparent; -webkit-text-stroke: 1.5px var(--ink); text-stroke: 1.5px var(--ink); }
.caret {
  display: inline-block;
  width: .055em; height: .78em;
  background: var(--ink);
  margin-left: .05em;
  vertical-align: -0.05em;
  animation: blink 1.05s steps(1) infinite;
}
@keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }

.sub {
  margin: 30px 0 0;
  font-size: 14px;
  line-height: 1.55;
  letter-spacing: 0;
  max-width: 48ch;
}
.sub .mk { color: var(--accent); font-weight: 500; }

/* bottom */
.bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 28px;
  flex-wrap: wrap;
}
.links {
  display: flex; gap: 22px; flex-wrap: wrap;
  font-size: 13px; text-transform: lowercase;
}
.links a {
  position: relative;
  padding-bottom: 3px;
  transition: color .2s ease;
}
.links a::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 1.5px;
  background: currentColor;
  transform-origin: left;
  transform: scaleX(0);
  transition: transform .45s cubic-bezier(.7,.05,.15,1);
}
.links a:hover { color: var(--accent); }
.links a:hover::after { transform: scaleX(1); }
.links a:focus-visible { outline: 1.5px dashed var(--accent); outline-offset: 4px; border-radius: 2px; }

.signals {
  font-size: 11px;
  letter-spacing: .15em;
  text-transform: uppercase;
  text-align: right;
  display: flex; flex-direction: column;
  gap: 6px;
}
.signals .row {
  display: flex; gap: 12px;
  justify-content: flex-end;
  align-items: center;
}
.signals .muted { color: var(--ink-65); }
.pulse {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 2.4s ease-out infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0   var(--accent-x); }
  80%, 100% { box-shadow: 0 0 0 10px transparent; }
}

@media (prefers-reduced-motion: reduce) {
  .caret, .pulse { animation: none; }
}

@media (max-width: 760px) {
  .page { padding: 22px; gap: 24px; }
  .top { font-size: 10px; flex-direction: column; align-items: flex-start; gap: 8px; }
  .top .rhs { justify-content: flex-start; gap: 14px; }
  .name { font-size: 22vw; letter-spacing: -.05em; }
  .sub { font-size: 13px; margin-top: 22px; }
  .signals { text-align: left; }
  .signals .row { justify-content: flex-start; }
  .bottom { flex-direction: column; align-items: flex-start; gap: 20px; }
  .reg { width: 10px; height: 10px; }
}
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
<main class="page">
  <svg class="reg tl" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M7 0v14M0 7h14"/><circle cx="7" cy="7" r="2.4"/></svg>
  <svg class="reg tr" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M7 0v14M0 7h14"/><circle cx="7" cy="7" r="2.4"/></svg>
  <svg class="reg bl" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M7 0v14M0 7h14"/><circle cx="7" cy="7" r="2.4"/></svg>
  <svg class="reg br" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M7 0v14M0 7h14"/><circle cx="7" cy="7" r="2.4"/></svg>

  <header class="top">
    <span class="lhs">
      <span>Eriks.design</span>
      <span class="mark">●</span>
      <span>Living site</span>
    </span>
    <span class="rhs">
      <span>27.05.2026</span>
      <span>San Francisco</span>
    </span>
  </header>

  <section class="hero">
    <h1 class="name">
      <span class="row">Erik</span>
      <span class="row b">Nilsson<span class="caret" aria-hidden="true"></span></span>
    </h1>
    <p class="sub">Designer at <span class="mk">Cursor</span>. Off-hours — <span class="mk">living-site</span>, a page that rewrites itself from fresh activity each day.</p>
  </section>

  <footer class="bottom">
    <nav class="links" aria-label="elsewhere">
      <a href="https://cursor.com">cursor</a>
      <a href="https://github.com/eriknson">github</a>
      <a href="https://x.com/flowstated">x</a>
      <a href="https://linkedin.com/in/eriknson">linkedin</a>
      <a href="mailto:contact@eriks.design">email</a>
    </nav>
    <div class="signals">
      <div class="row"><span class="pulse" aria-hidden="true"></span><span>Spring · 11° clear</span></div>
      <div class="row muted"><span>On rotation — Fred again..</span></div>
    </div>
  </footer>
</main>
</body>
</html>
