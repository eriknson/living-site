<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ebff21">
<title>Erik Nilsson — Product Designer, Cursor</title>
<meta name="description" content="Product designer at Cursor. Working on how people build software with AI.">
<style>
  :root {
    --bg: #ebff21;
    --fg: #0a0a0a;
    --dim: rgba(10, 10, 10, 0.56);
    --faint: rgba(10, 10, 10, 0.14);
  }

  @supports (color: color(display-p3 1 1 1)) {
    :root {
      --bg: color(display-p3 0.93 1 0.105);
      --fg: color(display-p3 0.04 0.04 0.04);
      --dim: color(display-p3 0.04 0.04 0.04 / 0.56);
      --faint: color(display-p3 0.04 0.04 0.04 / 0.14);
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--fg);
    font-family: "Berkeley Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-variant-numeric: tabular-nums;
    text-rendering: geometricPrecision;
    padding: clamp(20px, 3.5vw, 36px);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: clamp(28px, 6vh, 56px);
  }

  .meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: start;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 11px;
    gap: 24px;
  }

  .meta > div { display: flex; flex-direction: column; gap: 2px; }
  .meta .right { text-align: right; align-items: flex-end; }
  .meta .dim { color: var(--dim); }

  .meta .pulse {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .pulse::before {
    content: "";
    width: 7px;
    height: 7px;
    background: var(--fg);
    border-radius: 50%;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.35; transform: scale(0.7); }
  }

  main {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    align-content: center;
    column-gap: clamp(8px, 1vw, 16px);
    row-gap: clamp(20px, 4vh, 36px);
    padding: clamp(20px, 6vh, 72px) 0;
  }

  h1 {
    grid-column: 1 / -1;
    font-weight: 400;
    font-size: clamp(40px, 8.4vw, 112px);
    line-height: 0.92;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }

  h1 .caret {
    display: inline-block;
    width: 0.46em;
    height: 0.78em;
    background: var(--fg);
    margin-left: 0.08em;
    vertical-align: -0.08em;
    animation: blink 1.6s steps(2, jump-none) infinite;
  }

  @keyframes blink {
    0%, 50%       { opacity: 1; }
    50.01%, 100%  { opacity: 0; }
  }

  .lede {
    grid-column: 2 / span 8;
    font-size: 14px;
    color: var(--dim);
    max-width: 54ch;
    text-wrap: balance;
  }

  footer { display: grid; gap: clamp(14px, 2.5vh, 22px); }

  .now {
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr);
    align-items: baseline;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 11px;
    border-top: 1px solid var(--faint);
    padding-top: clamp(12px, 2vh, 18px);
    gap: 16px;
  }

  .now .label { color: var(--dim); }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 1px;
    margin-left: -10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 11px;
  }

  nav a {
    color: var(--fg);
    text-decoration: none;
    padding: 7px 10px;
    border-radius: 999px;
    transition: background 180ms ease, color 180ms ease;
  }

  nav a:hover, nav a:focus-visible {
    background: var(--fg);
    color: var(--bg);
    outline: none;
  }

  ::selection { background: var(--fg); color: var(--bg); }

  @media (prefers-reduced-motion: reduce) {
    h1 .caret, .pulse::before { animation: none; }
    h1 .caret { opacity: 0.85; }
  }

  @media (max-width: 720px) {
    .meta { grid-template-columns: 1fr; gap: 16px; }
    .meta .right { text-align: left; align-items: flex-start; }
    .lede { grid-column: 1 / -1; }
    h1 { line-height: 0.95; }
    body { gap: 32px; }
  }

  @media (max-width: 480px) {
    .now { grid-template-columns: 1fr; gap: 4px; }
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <header class="meta">
    <div>
      <span>Erik Nilsson</span>
      <span class="dim">Product Designer, Cursor</span>
    </div>
    <div class="right">
      <span>San Francisco</span>
      <span class="dim pulse">2026.05.29 — 13° clear</span>
    </div>
  </header>

  <main>
    <h1>How people build<br>software with AI<span class="caret" aria-hidden="true"></span></h1>
    <p class="lede">Off-hours: an agent redrafts this site at dawn, from yesterday's data.</p>
  </main>

  <footer>
    <div class="now">
      <span class="label">Listening</span>
      <span>Fred again.. · Drake · Beach House</span>
    </div>
    <nav aria-label="links">
      <a href="https://eriks.design">Site</a>
      <a href="https://cursor.com">Cursor</a>
      <a href="https://x.com/flowstated">X</a>
      <a href="https://github.com/eriknson">GitHub</a>
      <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
      <a href="mailto:contact@eriks.design">Email</a>
    </nav>
  </footer>
</body>
</html>
