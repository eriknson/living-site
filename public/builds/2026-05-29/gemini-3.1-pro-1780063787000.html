<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Nilsson</title>
<style>
  :root {
    --bg: #ccff00;
    --fg: #000000;
    --accent: #ff00ff;
  }
  @supports (color: color(display-p3 1 1 1)) {
    :root {
      --bg: color(display-p3 0.85 1 0);
      --fg: color(display-p3 0 0 0);
      --accent: color(display-p3 1 0 1);
    }
  }

  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2vw;
    box-sizing: border-box;
    overflow: hidden;
  }

  .header {
    display: flex;
    justify-content: space-between;
    font-size: 1.2vw;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .hero {
    font-size: 13vw;
    font-weight: 600;
    line-height: 0.85;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }

  .accent {
    color: var(--accent);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 1.2vw;
    font-weight: 500;
    line-height: 1.4;
  }

  .links {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    font-weight: 600;
    text-transform: uppercase;
  }

  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }

  @media (max-width: 768px) {
    body {
      height: auto;
      min-height: 100vh;
      padding: 5vw;
      overflow: auto;
    }
    .header, .footer { font-size: 4vw; flex-direction: column; gap: 5vw; }
    .hero { font-size: 18vw; margin: 15vw 0; }
    .links { align-items: flex-start; }
    .header > div:last-child { align-self: flex-start; }
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="header">
    <div>Erik Nilsson</div>
    <div>2026-05-29</div>
  </div>

  <div class="hero">
    Product<br>
    Designer<br>
    <span class="accent">At Cursor</span>
  </div>

  <div class="footer">
    <div>
      San Francisco, CA<br>
      13°C / Clear<br>
      <br>
      Listening: Fred again..
    </div>

    <div class="links">
      <a href="https://cursor.com">Cursor ↗</a>
      <a href="https://x.com/flowstated">X ↗</a>
      <a href="https://github.com/eriknson">GitHub ↗</a>
      <a href="https://linkedin.com/in/eriknson">LinkedIn ↗</a>
      <a href="mailto:contact@eriks.design">Email ↗</a>
    </div>
  </div>
</body>
</html>
