<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <meta name="description" content="Erik Nilsson, Product Designer at Cursor.">
  <style>
    :root {
      --ink: #070707;
      --paper: #fff7df;
      --paper-p3: color(display-p3 1 0.965 0.84);
      --blue: #0037ff;
      --blue-p3: color(display-p3 0 0.12 1);
      --green: #00ff66;
      --green-p3: color(display-p3 0 1 0.34);
      --pink: #ff008c;
      --pink-p3: color(display-p3 1 0 0.55);
      --yellow: #f2ff00;
      --yellow-p3: color(display-p3 0.93 1 0);
      --orange: #ff4b00;
      --orange-p3: color(display-p3 1 0.23 0);
      --line: rgba(7, 7, 7, 0.18);
      --shadow: 0 1.6rem 5rem rgba(0, 0, 0, 0.22);
    }

    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --paper: var(--paper-p3);
        --blue: var(--blue-p3);
        --green: var(--green-p3);
        --pink: var(--pink-p3);
        --yellow: var(--yellow-p3);
        --orange: var(--orange-p3);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--blue);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: var(--blue);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-feature-settings: "ss01", "ss02", "cv01", "cv03";
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      display: block;
      content: "";
      pointer-events: none;
    }

    body::before {
      inset: auto -12rem -16rem auto;
      width: min(55vw, 42rem);
      aspect-ratio: 1;
      border-radius: 999px;
      background: var(--pink);
      box-shadow: -18vw -58vh 0 -8vw var(--yellow), -72vw -10vh 0 -12vw var(--green);
      mix-blend-mode: multiply;
    }

    body::after {
      inset: -8rem auto auto 9vw;
      width: min(26vw, 22rem);
      aspect-ratio: 1 / 1.35;
      border: clamp(.85rem, 1.6vw, 1.4rem) solid var(--green);
      border-radius: 999px;
      transform: rotate(24deg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: .18rem solid var(--yellow);
      outline-offset: .24rem;
    }

    .page {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      padding: clamp(1rem, 2.2vw, 2rem);
    }

    .shell {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(17rem, 28rem);
      gap: clamp(1rem, 2vw, 1.4rem);
      width: min(100%, 88rem);
      min-height: calc(100vh - clamp(2rem, 4.4vw, 4rem));
      margin: auto;
    }

    .hero,
    .panel {
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .hero {
      position: relative;
      display: grid;
      align-content: space-between;
      min-height: 38rem;
      overflow: hidden;
      padding: clamp(1.2rem, 4vw, 4rem);
      border-radius: clamp(1.8rem, 4vw, 4rem);
      background: var(--paper);
      isolation: isolate;
    }

    .hero::before {
      position: absolute;
      inset: 9% auto auto 52%;
      z-index: -1;
      width: min(34vw, 31rem);
      aspect-ratio: 1;
      border: clamp(.8rem, 1.6vw, 1.25rem) solid var(--blue);
      border-radius: 999px;
      content: "";
      transform: translateX(-50%);
    }

    .hero::after {
      position: absolute;
      inset: auto -9% 12% auto;
      z-index: -2;
      width: min(45vw, 38rem);
      aspect-ratio: 1;
      border-radius: 999px;
      background: var(--green);
      content: "";
    }

    .mark {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .7rem;
      width: fit-content;
      align-items: center;
      color: rgba(7, 7, 7, .68);
      font-size: clamp(.72rem, .8vw, .82rem);
      font-weight: 760;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .mark::before {
      width: .76rem;
      aspect-ratio: 1;
      border-radius: 99px;
      background: var(--orange);
      content: "";
    }

    h1 {
      max-width: 10ch;
      margin: 11vh 0 0;
      font-size: clamp(5.4rem, 15vw, 15rem);
      line-height: .78;
      letter-spacing: -.095em;
      text-wrap: balance;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1.2rem;
      align-items: end;
      margin-top: clamp(3rem, 10vw, 8rem);
    }

    .intro p {
      max-width: 31rem;
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.65rem);
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .temperature {
      display: grid;
      min-width: 7.2rem;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--yellow);
      font-size: clamp(1.7rem, 3vw, 2.8rem);
      font-weight: 850;
      letter-spacing: -.09em;
    }

    .rail {
      display: grid;
      gap: clamp(1rem, 2vw, 1.4rem);
      grid-template-rows: 1fr auto;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border-radius: clamp(1.5rem, 3vw, 3rem);
      background: var(--ink);
      color: var(--paper);
    }

    .today {
      display: grid;
      align-content: space-between;
      min-height: 28rem;
      padding: clamp(1.2rem, 2.4vw, 2rem);
    }

    .today::before {
      position: absolute;
      inset: 9% -24% auto auto;
      width: min(24rem, 72%);
      aspect-ratio: 1;
      border-radius: 999px;
      background: var(--orange);
      content: "";
    }

    .today::after {
      position: absolute;
      inset: auto auto -12% -10%;
      width: min(20rem, 64%);
      aspect-ratio: 1;
      border: .9rem solid var(--pink);
      border-radius: 999px;
      content: "";
    }

    .kicker,
    .label {
      position: relative;
      z-index: 1;
      margin: 0;
      color: rgba(255, 247, 223, .68);
      font-size: .75rem;
      font-weight: 760;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .today-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: .6rem;
      margin: 5rem 0 0;
      padding: 0;
      list-style: none;
    }

    .today-list li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding-top: .65rem;
      border-top: 1px solid rgba(255, 247, 223, .18);
      font-size: clamp(1.3rem, 2.6vw, 2.15rem);
      font-weight: 760;
      line-height: .95;
      letter-spacing: -.07em;
    }

    .today-list span {
      color: rgba(255, 247, 223, .52);
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
      padding: clamp(.85rem, 1.5vw, 1.15rem);
      background: var(--green);
      color: var(--ink);
    }

    .links a {
      display: inline-flex;
      min-height: 2.7rem;
      align-items: center;
      justify-content: center;
      padding: .65rem .9rem;
      border: 1px solid rgba(7, 7, 7, .28);
      border-radius: 999px;
      background: rgba(255, 255, 255, .22);
      font-size: .82rem;
      font-weight: 780;
      letter-spacing: -.02em;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .links a:hover {
      background: var(--paper);
      transform: translateY(-2px);
    }

    .orbital {
      position: absolute;
      inset: 50% auto auto 50%;
      z-index: -1;
      width: min(54rem, 72vw);
      aspect-ratio: 1;
      border: 1px solid rgba(7, 7, 7, .16);
      border-radius: 999px;
      transform: translate(-50%, -42%) rotate(-11deg);
    }

    .orbital i {
      position: absolute;
      display: block;
      width: clamp(1rem, 3vw, 2.25rem);
      aspect-ratio: 1;
      border-radius: 999px;
      background: var(--pink);
      box-shadow: 0 0 0 .35rem var(--paper);
    }

    .orbital i:nth-child(1) {
      inset: 9% auto auto 18%;
      background: var(--pink);
    }

    .orbital i:nth-child(2) {
      inset: auto 13% 23% auto;
      background: var(--yellow);
    }

    .orbital i:nth-child(3) {
      inset: 39% auto auto -1%;
      background: var(--orange);
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: 34rem;
      }

      .intro {
        grid-template-columns: 1fr;
      }

      .temperature {
        width: 7rem;
      }

      .rail {
        grid-template-rows: auto;
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: .7rem;
      }

      .hero,
      .today {
        min-height: 30rem;
      }

      h1 {
        margin-top: 7vh;
      }

      .today-list li {
        display: grid;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <main class="page">
    <div class="shell" aria-label="Erik Nilsson">
      <section class="hero">
        <div class="orbital" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
        </div>

        <p class="mark">San Francisco · clear</p>

        <div>
          <h1>Erik Nilsson</h1>
          <div class="intro">
            <p>Product designer at Cursor. Building interfaces for people and agents.</p>
            <div class="temperature" aria-label="Current temperature in San Francisco">13°</div>
          </div>
        </div>
      </section>

      <aside class="rail" aria-label="Today and links">
        <section class="panel today">
          <p class="kicker">May 29 · spring</p>
          <ul class="today-list">
            <li><span>Music</span> Fred again..</li>
            <li><span>Also</span> Drake / Beach House</li>
            <li><span>Side quests</span> quiet</li>
          </ul>
        </section>

        <nav class="panel links" aria-label="Links">
          <a href="https://eriks.design">Site</a>
          <a href="https://cursor.com">Cursor</a>
          <a href="https://x.com/flowstated">X</a>
          <a href="https://github.com/eriknson">GitHub</a>
          <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
          <a href="mailto:contact@eriks.design">Email</a>
        </nav>
      </aside>
    </div>
  </main>
</body>
</html>
