<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Erik Nilsson — Designer</title>
<meta name="description" content="Erik Nilsson, product designer at Cursor. Living site, rebuilt today.">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #c8ff2a;
    --ink: #0a0d12;
    --hot: #ff3b14;
    --hot-glow: rgba(255, 59, 20, 0.55);
    --rule: rgba(10, 13, 18, 0.18);
  }

  @supports (background: color(display-p3 1 0 0)) {
    :root {
      --bg: color(display-p3 0.82 1 0.18);
      --ink: color(display-p3 0.04 0.05 0.07);
      --hot: color(display-p3 1 0.25 0.08);
      --hot-glow: color(display-p3 1 0.25 0.08 / 0.55);
      --rule: color(display-p3 0.04 0.05 0.07 / 0.2);
    }
  }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior: none;
  }

  ::selection { background: var(--ink); color: var(--bg); }

  body {
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(1.1rem, 2.4vw, 2.25rem);
    gap: clamp(1.75rem, 5vw, 4rem);
    overflow-x: hidden;
  }

  .strip {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: clamp(0.7rem, 0.85vw, 0.82rem);
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .strip > div { display: inline-flex; align-items: center; gap: 0.6em; }

  .dot {
    width: 0.5em; height: 0.5em;
    border-radius: 50%;
    background: var(--hot);
    box-shadow: 0 0 0 0 var(--hot-glow);
    animation: pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    flex: none;
  }
  @keyframes pulse {
    0%   { transform: scale(1);    box-shadow: 0 0 0 0 var(--hot-glow); }
    55%  { transform: scale(1.08); }
    100% { transform: scale(1);    box-shadow: 0 0 0 0.85em transparent; }
  }

  main {
    display: grid;
    align-content: center;
    gap: clamp(1.25rem, 2.6vw, 2rem);
    will-change: transform;
  }

  .name {
    font-family: "Iowan Old Style", "Hoefler Text", "Apple Garamond", "Times New Roman", ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(4rem, 19vw, 21rem);
    line-height: 0.84;
    letter-spacing: -0.045em;
    margin-left: -0.04em;
    color: var(--ink);
    transition: transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .name span { display: block; }
  .name .last { padding-left: 0.34em; }
  .name .amp {
    color: var(--hot);
    font-style: italic;
    display: inline-block;
    transform: translateY(0.05em);
    margin: 0 0.04em;
  }

  .lead {
    max-width: 36ch;
    font-size: clamp(1.05rem, 1.5vw, 1.35rem);
    line-height: 1.4;
    font-weight: 450;
    letter-spacing: -0.005em;
  }

  footer {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 1.25rem 2rem;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: clamp(0.7rem, 0.85vw, 0.82rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .lab { opacity: 0.55; margin-right: 0.55em; }
  .marquee-track {
    display: inline-flex;
    gap: 0.5em;
    align-items: baseline;
  }
  .pip {
    display: inline-block;
    width: 0.32em; height: 0.32em;
    background: var(--ink);
    margin: 0 0.4em 0.05em;
    transform: rotate(45deg);
    opacity: 0.4;
  }

  .links {
    display: flex;
    gap: 1.4rem;
    list-style: none;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .links a {
    color: inherit;
    text-decoration: none;
    position: relative;
    padding-bottom: 0.22em;
    transition: color 0.18s ease;
  }
  .links a::after {
    content: "";
    position: absolute;
    left: 0; right: 100%;
    bottom: 0;
    height: 1.5px;
    background: currentColor;
    transition: right 0.32s cubic-bezier(0.22, 0.6, 0.18, 1);
  }
  .links a:hover { color: var(--hot); }
  .links a:hover::after { right: 0; }

  .stamp {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    gap: 0.75rem 1rem;
    flex-wrap: wrap;
    padding-top: 1rem;
    border-top: 1px solid var(--rule);
    opacity: 0.7;
    font-size: 0.7rem;
  }

  /* corner glyph */
  .glyph {
    position: fixed;
    right: clamp(1.1rem, 2.4vw, 2.25rem);
    bottom: clamp(1.1rem, 2.4vw, 2.25rem);
    width: 1.1rem; height: 1.1rem;
    pointer-events: none;
    color: var(--hot);
    animation: spin 14s linear infinite;
    opacity: 0.85;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .dot, .glyph, .name { animation: none !important; transition: none !important; }
  }

  @media (max-width: 700px) {
    footer { grid-template-columns: 1fr; }
    .links { justify-content: flex-start; }
    .name .last { padding-left: 0.45em; }
    .glyph { display: none; }
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>

  <header class="strip">
    <div><span class="dot" aria-hidden="true"></span>Live · Spring '26</div>
    <div>San Francisco · 10° clear</div>
  </header>

  <main id="main">
    <h1 class="name" aria-label="Erik Nilsson">
      <span>Erik</span><span class="last">Nilsson<span class="amp">.</span></span>
    </h1>
    <p class="lead">Designing how people build software with AI at Cursor.</p>
  </main>

  <footer>
    <div>
      <span class="lab">Now</span>
      <span class="marquee-track">Fred again..<span class="pip"></span>Drake<span class="pip"></span>Beach House</span>
    </div>
    <ul class="links" role="list">
      <li><a href="https://cursor.com">Cursor&nbsp;↗</a></li>
      <li><a href="https://x.com/flowstated">X&nbsp;↗</a></li>
      <li><a href="https://github.com/eriknson">GitHub&nbsp;↗</a></li>
      <li><a href="mailto:contact@eriks.design">Email&nbsp;↗</a></li>
    </ul>
    <div class="stamp">
      <span>Rebuilt by an agent · <span id="stamp-time">26.05.31</span></span>
      <span>v.living-site</span>
    </div>
  </footer>

  <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 2 L13 11 L22 12 L13 13 L12 22 L11 13 L2 12 L11 11 Z" fill="currentColor"/>
  </svg>

  <script>
    (function () {
      const stamp = document.getElementById('stamp-time');
      function fmt() {
        try {
          const now = new Date();
          const date = now.toLocaleDateString('en-CA', {
            year: '2-digit', month: '2-digit', day: '2-digit',
            timeZone: 'America/Los_Angeles'
          }).replace(/-/g, '.');
          const time = now.toLocaleTimeString('en-US', {
            hour: '2-digit', minute: '2-digit', hour12: false,
            timeZone: 'America/Los_Angeles'
          });
          stamp.textContent = date + ' · ' + time + ' PT';
        } catch (e) { /* keep fallback */ }
      }
      fmt(); setInterval(fmt, 30000);

      // subtle parallax on the name — only on fine pointers, respects reduced motion
      const main = document.getElementById('main');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const fine = window.matchMedia('(pointer: fine)').matches;
      if (!reduce && fine) {
        let tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
        window.addEventListener('mousemove', (e) => {
          const x = (e.clientX / window.innerWidth - 0.5);
          const y = (e.clientY / window.innerHeight - 0.5);
          tx = x * 10; ty = y * 6;
          if (!raf) raf = requestAnimationFrame(loop);
        }, { passive: true });
        function loop() {
          cx += (tx - cx) * 0.08;
          cy += (ty - cy) * 0.08;
          main.style.transform = `translate3d(${cx.toFixed(2)}px, ${cy.toFixed(2)}px, 0)`;
          if (Math.abs(tx - cx) > 0.05 || Math.abs(ty - cy) > 0.05) {
            raf = requestAnimationFrame(loop);
          } else { raf = null; }
        }
      }
    })();
  </script>
</body>
</html>
