<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Nilsson</title>
<style>
  :root {
    --bg: color(display-p3 0.75 1 0.05); /* Luminous chartreuse */
    --fg: color(display-p3 0.1 0.05 0.95); /* Deep electric blue/indigo */
    --ac: color(display-p3 1 0.1 0.4); /* Luminous hot pink */
  }
  
  @supports not (color: color(display-p3 1 1 1)) {
    :root {
      --bg: #c0ff0d;
      --fg: #1a0df2;
      --ac: #ff1a66;
    }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
    padding: 2vw;
    box-sizing: border-box;
    overflow: hidden;
  }

  a { color: inherit; text-decoration: none; transition: color 0.2s; }
  a:hover { color: var(--ac); }

  .header {
    display: flex;
    justify-content: space-between;
    font-size: 1.25vw;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    z-index: 10;
  }

  .header .left, .header .right {
    display: flex;
    gap: 3vw;
  }

  .hero {
    align-self: center;
    font-size: clamp(5rem, 18vw, 20rem);
    line-height: 0.8;
    letter-spacing: -0.05em;
    font-weight: 800;
    margin: 0;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
  }

  .hero span {
    display: block;
  }
  .hero span:last-child {
    color: var(--ac);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 1.25vw;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    z-index: 10;
  }

  .footer .links {
    display: flex;
    gap: 2vw;
  }

  /* Minimal Music Staff & Falling Notes */
  .staff {
    position: absolute;
    top: 0;
    right: 5vw;
    width: 40vw;
    height: 100vh;
    display: flex;
    z-index: 0;
    border-left: 1px solid var(--fg);
    border-right: 1px solid var(--fg);
  }
  
  .lane {
    flex: 1;
    border-right: 1px solid var(--fg);
    position: relative;
    overflow: hidden;
  }
  .lane:last-child {
    border-right: none;
  }

  .note {
    position: absolute;
    width: 100%;
    background: var(--fg);
    mix-blend-mode: normal;
  }

  .note.accent {
    background: var(--ac);
  }

  @keyframes drop {
    0% { top: -20vh; }
    100% { top: 120vh; }
  }

  @media (max-width: 768px) {
    .header, .footer { font-size: 4vw; flex-direction: column; gap: 1rem; }
    .header .right, .footer .links { gap: 1rem; flex-direction: column; }
    .header .right { align-items: flex-start; }
    .staff { width: 100vw; right: 0; opacity: 0.5; border: none; }
  }

</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>

  <div class="staff">
    <div class="lane"><div class="note accent" style="height: 15vh; animation: drop 3.2s infinite linear 0.1s;"></div></div>
    <div class="lane"><div class="note" style="height: 8vh; animation: drop 4s infinite linear 1.5s;"></div></div>
    <div class="lane"><div class="note accent" style="height: 20vh; animation: drop 2.8s infinite linear 0.8s;"></div></div>
    <div class="lane"><div class="note" style="height: 12vh; animation: drop 3.6s infinite linear 2.2s;"></div></div>
    <div class="lane"><div class="note" style="height: 6vh; animation: drop 4.5s infinite linear 0.4s;"></div></div>
  </div>

  <header class="header">
    <div class="left">
      <span>Erik Nilsson</span>
      <span>Product Designer</span>
    </div>
    <div class="right">
      <span><a href="https://cursor.com" target="_blank">Cursor</a></span>
      <span>San Francisco</span>
    </div>
  </header>

  <h1 class="hero">
    <span>Tinkering</span>
    <span>Daily</span>
  </h1>

  <footer class="footer">
    <div>
      <div>10°C / Clear</div>
      <div>Listening to Fred again..</div>
    </div>
    <div class="links">
      <a href="https://x.com/flowstated" target="_blank">X</a>
      <a href="https://github.com/eriknson" target="_blank">GitHub</a>
      <a href="https://linkedin.com/in/eriknson" target="_blank">LinkedIn</a>
      <a href="mailto:contact@eriks.design">Email</a>
    </div>
  </footer>

</body>
</html>
