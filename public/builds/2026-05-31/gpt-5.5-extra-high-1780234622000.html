<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f0e6;
      --ink: #111111;
      --muted: #53514b;
      --line: #111111;
      --panel: color(display-p3 0.98 0.94 0.84);
      --hot: color(display-p3 1 0.16 0.07);
      --acid: color(display-p3 0.72 1 0.02);
      --blue: color(display-p3 0.04 0.19 1);
      --violet: color(display-p3 0.7 0.18 1);
      --paper: color(display-p3 0.98 0.96 0.9);
      --rail-left: var(--blue);
      --rail-right: var(--acid);
      --rail-left-size: 18vw;
      --rail-right-size: 16vw;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -0.035em;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      left: 0;
      width: var(--rail-left-size);
      background: var(--rail-left);
    }

    body::after {
      right: 0;
      width: var(--rail-right-size);
      background: var(--rail-right);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(calc(100% - 32px), 640px);
      max-width: 640px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 0;
      display: grid;
      align-items: center;
    }

    .stage {
      position: relative;
      min-height: min(760px, calc(100vh - 48px));
      border: 2px solid var(--line);
      background: var(--paper);
      overflow: hidden;
      box-shadow: 12px 12px 0 var(--ink);
      isolation: isolate;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 2px solid var(--line);
    }

    .stage::before {
      width: 46%;
      height: 46%;
      right: -2px;
      top: -2px;
      background: var(--hot);
    }

    .stage::after {
      width: 42%;
      height: 24%;
      left: 12%;
      bottom: 12%;
      background: var(--violet);
      transform: rotate(-7deg);
      transform-origin: left bottom;
    }

    .grid {
      min-height: inherit;
      display: grid;
      grid-template-columns: 0.82fr 1.18fr;
      grid-template-rows: auto 1fr auto;
    }

    .stamp {
      grid-column: 1;
      grid-row: 1 / 3;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      border-left: 2px solid var(--line);
      background: var(--acid);
      padding: 22px 16px;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .hero {
      grid-column: 2;
      padding: clamp(28px, 6vw, 58px) clamp(24px, 6vw, 54px) 20px;
    }

    .kicker {
      display: inline-block;
      margin: 0 0 18px;
      padding: 8px 10px;
      border: 2px solid var(--line);
      background: var(--blue);
      color: white;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 8ch;
      margin: 0;
      font-size: clamp(4.1rem, 19vw, 8.9rem);
      line-height: 0.76;
      letter-spacing: -0.12em;
      text-transform: uppercase;
    }

    .role {
      max-width: 19rem;
      margin: 26px 0 0;
      font-size: clamp(1.08rem, 4vw, 1.7rem);
      line-height: 1;
      font-weight: 760;
    }

    .note {
      grid-column: 1 / 3;
      align-self: end;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 2px solid var(--line);
      background: var(--panel);
    }

    .cell {
      min-height: 138px;
      padding: 18px;
      border-right: 2px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .cell:last-child {
      border-right: 0;
      background: var(--hot);
      color: #090909;
    }

    .label {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 850;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .value {
      margin: 0;
      font-size: clamp(1.15rem, 3.6vw, 1.7rem);
      line-height: 0.96;
      font-weight: 780;
    }

    .links {
      grid-column: 1 / 3;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 2px solid var(--line);
      background: var(--ink);
      color: white;
    }

    .links a {
      min-height: 64px;
      display: grid;
      place-items: center;
      border-right: 2px solid var(--paper);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 160ms ease, color 160ms ease;
    }

    .links a:last-child {
      border-right: 0;
    }

    .links a:hover,
    .links a:focus-visible {
      background: var(--acid);
      color: var(--ink);
      outline: 0;
    }

    .orbital {
      position: absolute;
      right: clamp(14px, 4vw, 32px);
      bottom: clamp(190px, 28vh, 260px);
      width: clamp(132px, 34vw, 226px);
      aspect-ratio: 1;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: transparent;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .orbital i {
      position: absolute;
      width: 30px;
      aspect-ratio: 1;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: var(--acid);
    }

    .orbital i:nth-child(1) {
      top: 10%;
      left: 18%;
    }

    .orbital i:nth-child(2) {
      right: -7%;
      top: 42%;
      background: var(--blue);
    }

    .orbital i:nth-child(3) {
      left: 40%;
      bottom: -8%;
      background: var(--hot);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #080808;
        --ink: #f4f0e6;
        --muted: #bbb4a7;
        --line: #f4f0e6;
        --panel: color(display-p3 0.06 0.06 0.06);
        --paper: color(display-p3 0.02 0.025 0.03);
        --hot: color(display-p3 1 0.2 0.04);
        --acid: color(display-p3 0.68 1 0);
        --blue: color(display-p3 0.08 0.2 1);
        --violet: color(display-p3 0.76 0.22 1);
        --rail-left: var(--hot);
        --rail-right: var(--blue);
        --rail-left-size: 14vw;
        --rail-right-size: 18vw;
      }

      .stage {
        box-shadow: 12px 12px 0 color(display-p3 0.68 1 0);
      }

      .kicker {
        color: #ffffff;
      }

      .cell:last-child {
        color: #090909;
      }
    }

    @media (max-width: 620px) {
      :root {
        --rail-left-size: 12px;
        --rail-right-size: 12px;
      }

      .wrap {
        width: min(calc(100% - 24px), 640px);
        padding: 12px 0;
      }

      .stage {
        min-height: calc(100vh - 24px);
        box-shadow: 7px 7px 0 var(--ink);
      }

      .grid {
        grid-template-columns: 42px 1fr;
      }

      .stamp {
        padding: 16px 10px;
        font-size: 0.62rem;
      }

      .hero {
        padding: 28px 22px 132px;
      }

      h1 {
        font-size: clamp(4rem, 24vw, 6.8rem);
      }

      .note {
        grid-template-columns: 1fr;
      }

      .cell {
        min-height: 112px;
        border-right: 0;
        border-bottom: 2px solid var(--line);
      }

      .cell:last-child {
        border-bottom: 0;
      }

      .links {
        grid-template-columns: 1fr;
      }

      .links a {
        min-height: 48px;
        border-right: 0;
        border-bottom: 2px solid var(--paper);
      }

      .links a:last-child {
        border-bottom: 0;
      }

      .orbital {
        right: 18px;
        bottom: 328px;
        width: 132px;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <main class="wrap" aria-label="Erik Nilsson">
    <section class="stage">
      <div class="grid">
        <div class="stamp">San Francisco / clear spring</div>

        <header class="hero">
          <p class="kicker">Product Designer / Cursor</p>
          <h1>Erik Nilsson</h1>
          <p class="role">Designing how people build software with AI.</p>
        </header>

        <div class="orbital" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
        </div>

        <section class="note" aria-label="Today">
          <div class="cell">
            <p class="label">Today</p>
            <p class="value">10 C now. Clear. Spring.</p>
          </div>
          <div class="cell">
            <p class="label">On loop</p>
            <p class="value">Fred again.. / Drake / Beach House</p>
          </div>
        </section>

        <nav class="links" aria-label="Links">
          <a href="https://cursor.com">Cursor</a>
          <a href="https://eriks.design">Site</a>
          <a href="https://x.com/flowstated">X</a>
          <a href="https://github.com/eriknson">GitHub</a>
          <a href="mailto:contact@eriks.design">Email</a>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
