<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <meta name="description" content="Erik Nilsson, product designer at Cursor.">
  <style>
    :root {
      color-scheme: dark;
      --ink: #050505;
      --paper: #f6f3e8;
      --acid: #d8ff00;
      --hot: #ff3355;
      --sky: #00b7ff;
      --violet: #6d3cff;
      --deep: #111111;
    }

    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --paper: color(display-p3 0.97 0.94 0.84);
        --acid: color(display-p3 0.77 1 0);
        --hot: color(display-p3 1 0.08 0.18);
        --sky: color(display-p3 0 0.72 1);
        --violet: color(display-p3 0.45 0.17 1);
        --deep: color(display-p3 0.015 0.014 0.012);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--acid);
    }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background: var(--acid);
      color: var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -0.04em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .stage {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
      display: grid;
      place-items: center;
      padding: clamp(18px, 3vw, 44px);
      background:
        var(--acid);
    }

    .field {
      position: absolute;
      inset: clamp(12px, 2vw, 28px);
      overflow: hidden;
      border: 1px solid rgb(0 0 0 / 0.18);
      background: var(--deep);
      box-shadow: 0 18px 80px rgb(0 0 0 / 0.36);
      z-index: -2;
    }

    .shape {
      position: absolute;
      display: block;
      pointer-events: none;
    }

    .shape.one {
      width: 44vw;
      height: 44vw;
      min-width: 330px;
      min-height: 330px;
      right: -13vw;
      top: -16vw;
      border-radius: 999px;
      background: var(--hot);
      box-shadow: 0 0 0 18px var(--deep), 0 0 0 20px var(--paper);
    }

    .shape.two {
      width: 30vw;
      height: 52vh;
      left: -8vw;
      bottom: -12vh;
      border: 2px solid var(--paper);
      background: var(--violet);
      transform: rotate(-8deg);
    }

    .shape.three {
      width: 18vw;
      height: 18vw;
      min-width: 148px;
      min-height: 148px;
      right: 18vw;
      bottom: 11vh;
      border-radius: 999px;
      background: var(--sky);
      box-shadow: 0 0 0 12px var(--deep);
    }

    .shape.four {
      width: 10px;
      height: 72vh;
      left: 54vw;
      top: 14vh;
      background: var(--acid);
      transform: rotate(21deg);
    }

    main {
      width: min(1120px, calc(100vw - clamp(44px, 8vw, 108px)));
      min-height: min(780px, calc(100svh - clamp(44px, 8vw, 108px)));
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.72fr);
      gap: clamp(20px, 4vw, 64px);
      align-items: end;
      padding: clamp(24px, 5vw, 72px);
      border: 1px solid rgb(246 243 232 / 0.18);
      background: rgb(5 5 5 / 0.72);
      backdrop-filter: blur(14px);
    }

    .hero {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 56px;
    }

    .eyebrow {
      width: fit-content;
      margin: 0;
      padding: 8px 12px 9px;
      border: 1px solid currentColor;
      background: var(--paper);
      color: var(--ink);
      font-size: clamp(13px, 1.15vw, 16px);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 8ch;
      color: var(--paper);
      font-size: clamp(76px, 14vw, 188px);
      line-height: 0.76;
      letter-spacing: -0.12em;
      text-wrap: balance;
    }

    .line {
      display: block;
    }

    .line:nth-child(2) {
      color: var(--acid);
    }

    .intro {
      max-width: 520px;
      margin: 0;
      color: rgb(246 243 232 / 0.88);
      font-size: clamp(21px, 2.5vw, 36px);
      line-height: 0.96;
    }

    .panel {
      display: grid;
      gap: 14px;
    }

    .card {
      position: relative;
      min-height: 154px;
      padding: 18px;
      border: 1px solid rgb(246 243 232 / 0.2);
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
    }

    .card.dark {
      background: var(--ink);
      color: var(--paper);
    }

    .card.hot {
      background: var(--hot);
      color: var(--paper);
    }

    .card.sky {
      background: var(--sky);
      color: var(--ink);
    }

    .label {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 42px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .value {
      margin: 0;
      max-width: 14ch;
      font-size: clamp(28px, 4vw, 54px);
      font-weight: 900;
      line-height: 0.86;
      letter-spacing: -0.08em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .meta li,
    .links a {
      border: 1px solid currentColor;
      padding: 8px 10px 9px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 18px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      background: rgb(255 255 255 / 0.04);
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .links a::after {
      content: "->";
      font-size: 15px;
    }

    .links a:hover {
      background: var(--acid);
      color: var(--ink);
      transform: translateY(-2px);
    }

    .orbit {
      position: absolute;
      right: -56px;
      bottom: -56px;
      width: 148px;
      height: 148px;
      border: 1px solid currentColor;
      border-radius: 999px;
    }

    .orbit::before,
    .orbit::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      border: 1px solid currentColor;
      inset: 18px;
    }

    .orbit::after {
      inset: 44px;
      background: currentColor;
    }

    .footer {
      position: absolute;
      left: clamp(22px, 4vw, 54px);
      right: clamp(22px, 4vw, 54px);
      bottom: clamp(20px, 3vw, 42px);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      mix-blend-mode: multiply;
      z-index: 2;
    }

    @media (max-width: 820px) {
      .stage {
        place-items: stretch;
      }

      .field {
        inset: 8px;
      }

      main {
        width: auto;
        min-height: auto;
        grid-template-columns: 1fr;
        align-self: center;
        padding: 22px;
      }

      h1 {
        font-size: clamp(72px, 27vw, 132px);
      }

      .intro {
        font-size: 24px;
      }

      .hero {
        gap: 44px;
      }

      .shape.one {
        right: -180px;
        top: -160px;
      }

      .shape.two {
        width: 260px;
        height: 380px;
      }

      .shape.four {
        display: none;
      }

      .footer {
        position: static;
        margin-top: 18px;
        color: var(--paper);
        mix-blend-mode: normal;
      }
    }

    @media (max-width: 520px) {
      .links {
        grid-template-columns: 1fr;
      }

      .label {
        margin-bottom: 28px;
      }

      .card {
        min-height: 132px;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="field" aria-hidden="true">
      <span class="shape one"></span>
      <span class="shape two"></span>
      <span class="shape three"></span>
      <span class="shape four"></span>
    </div>

    <main aria-label="Erik Nilsson">
      <section class="hero">
        <p class="eyebrow">San Francisco / Clear / Summer</p>

        <div>
          <h1>
            <span class="line">Erik</span>
            <span class="line">Nilsson</span>
          </h1>
          <p class="intro">Product designer at Cursor. Working on how people build with AI.</p>
        </div>
      </section>

      <aside class="panel" aria-label="Current signals">
        <section class="card sky">
          <p class="label"><span>Today</span><span>14 C</span></p>
          <p class="value">Clear light, long evening.</p>
          <span class="orbit" aria-hidden="true"></span>
        </section>

        <section class="card hot">
          <p class="label"><span>Listening</span><span>Now</span></p>
          <ul class="meta" aria-label="Top artists">
            <li>Fred again..</li>
            <li>Drake</li>
            <li>Beach House</li>
          </ul>
        </section>

        <section class="card dark">
          <p class="label"><span>Off-hours</span><span>Living-site</span></p>
          <p class="value">Fresh data, rebuilt daily.</p>
          <nav class="links" aria-label="Links">
            <a href="https://eriks.design">Site</a>
            <a href="https://x.com/flowstated">X</a>
            <a href="https://github.com/eriknson">GitHub</a>
            <a href="mailto:contact@eriks.design">Email</a>
          </nav>
        </section>
      </aside>
    </main>

    <div class="footer" aria-hidden="true">
      <span>Cursor</span>
      <span>2026-06-01</span>
    </div>
  </div>
</body>
</html>
