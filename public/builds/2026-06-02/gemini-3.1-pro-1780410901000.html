<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik Nilsson</title>
    <style>
        :root {
            /* Luminous Display-P3 colors for maximum contrast */
            --bg-color: color(display-p3 0.05 0.05 0.05); /* Deepest near-black */
            --text-color: color(display-p3 0.95 0.95 0.95);
            --accent-1: color(display-p3 1 0.2 0.2); /* Vibrant Red */
            --accent-2: color(display-p3 0.2 1 0.2); /* Vibrant Green */
            --accent-3: color(display-p3 0.2 0.2 1); /* Vibrant Blue */
            --accent-4: color(display-p3 1 1 0); /* Vibrant Yellow */
            --accent-5: color(display-p3 1 0 1); /* Vibrant Magenta */
            --accent-6: color(display-p3 0 1 1); /* Vibrant Cyan */
            
            --font-mono: 'SF Mono', 'Roboto Mono', Menlo, monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        @supports (color: color(display-p3 1 1 1)) {
            :root {
                --bg-color: color(display-p3 0.02 0.02 0.02);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            line-height: 1.4;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr auto;
            padding: 2rem;
            overflow-x: hidden;
            letter-spacing: -0.02em;
        }

        /* Experimental Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            height: 100%;
        }

        .block {
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        .block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: currentColor;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .block:hover {
            border-color: transparent;
            color: var(--bg-color);
        }

        .block:hover::before {
            opacity: 1;
        }

        /* Specific Block Colors */
        .block-identity { color: var(--accent-1); grid-column: span 12; min-height: 40vh; justify-content: flex-end; }
        .block-role { color: var(--accent-2); grid-column: span 6; }
        .block-location { color: var(--accent-3); grid-column: span 6; }
        .block-weather { color: var(--accent-4); grid-column: span 4; }
        .block-music { color: var(--accent-5); grid-column: span 4; }
        .block-links { color: var(--accent-6); grid-column: span 4; }

        @media (max-width: 1024px) {
            .block-role, .block-location { grid-column: span 12; }
            .block-weather, .block-music, .block-links { grid-column: span 12; }
        }

        h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 800;
            line-height: 0.9;
            text-transform: uppercase;
            mix-blend-mode: difference;
        }

        h2 {
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: auto;
            opacity: 0.8;
            font-family: var(--font-mono);
        }

        p, ul {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 500;
            margin-top: 2rem;
            list-style: none;
        }

        li {
            margin-bottom: 0.5rem;
        }

        a {
            color: inherit;
            text-decoration: none;
            display: inline-block;
            position: relative;
        }

        a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: currentColor;
            transform: scaleX(0);
            transform-origin: bottom right;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        /* Abstract Data Visualization Elements */
        .data-viz {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            text-align: right;
            opacity: 0.5;
        }

        .signal {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: currentColor;
            margin-left: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        /* Game Mechanic Mini-Interaction */
        .game-area {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 50px;
            height: 150px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            z-index: 100;
            mix-blend-mode: difference;
        }

        .game-note {
            width: 100%;
            height: 10px;
            background-color: var(--text-color);
            animation: fall linear infinite;
        }

        .game-note:nth-child(1) { animation-duration: 3s; }
        .game-note:nth-child(2) { animation-duration: 2.5s; animation-delay: 1s; }
        .game-note:nth-child(3) { animation-duration: 4s; animation-delay: 2s; }

        @keyframes fall {
            0% { transform: translateY(-10px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(140px); opacity: 0; }
        }

        .meta-info {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            opacity: 0.4;
            text-transform: uppercase;
            mix-blend-mode: difference;
            pointer-events: none;
        }

    </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>

    <div class="grid-container">
        
        <div class="block block-identity">
            <div class="data-viz">SYS.ID<br>0xEN</div>
            <h1>Erik Nilsson</h1>
        </div>

        <div class="block block-role">
            <h2>Role</h2>
            <p>Product Designer<br>@ Cursor</p>
        </div>

        <div class="block block-location">
            <h2>LOC</h2>
            <p>San Francisco, CA</p>
            <div class="data-viz">37.7749° N<br>122.4194° W</div>
        </div>

        <div class="block block-weather">
            <h2>ENV</h2>
            <p>11°C<br>Foggy</p>
            <div class="data-viz">SUMMER<br><span class="signal"></span></div>
        </div>

        <div class="block block-music">
            <h2>FREQ</h2>
            <ul>
                <li>Fred again..</li>
                <li>Drake</li>
                <li>Beach House</li>
            </ul>
        </div>

        <div class="block block-links">
            <h2>NET</h2>
            <ul>
                <li><a href="https://cursor.com">Cursor</a></li>
                <li><a href="https://x.com/flowstated">X</a></li>
                <li><a href="https://github.com/eriknson">GitHub</a></li>
                <li><a href="mailto:contact@eriks.design">Email</a></li>
            </ul>
        </div>

    </div>

    <!-- Abstract representation of the Gemini game mechanic -->
    <div class="game-area">
        <div class="game-note"></div>
        <div class="game-note"></div>
        <div class="game-note"></div>
    </div>

    <div class="meta-info">
        GENERATED 2026.06.02<br>
        LIVING SITE V.EXPERIMENTAL
    </div>

</body>
</html>
