<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Nilsson</title>
<style>
  :root {
    --c-1: color(display-p3 0.8 1 0.1);
    --c-2: color(display-p3 1 0.1 0.5);
    --c-3: color(display-p3 0.1 0.3 1);
    --c-4: color(display-p3 1 0.5 0.0);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    text-transform: uppercase;
    font-weight: 500;
    overflow: hidden;
    background: #000;
  }

  .panel {
    position: relative;
    padding: 2vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .p1 { background: #ccff19; background: var(--c-1); color: #000; }
  .p2 { background: #ff1a80; background: var(--c-2); color: #fff; }
  .p3 { background: #1a4dff; background: var(--c-3); color: #fff; }
  .p4 { background: #ff8000; background: var(--c-4); color: #000; align-items: flex-end; text-align: right; }

  .center-mark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16vw;
    font-weight: 600;
    line-height: 0.85;
    letter-spacing: -0.06em;
    margin: 0;
    white-space: nowrap;
    mix-blend-mode: exclusion;
    color: #fff;
    z-index: 10;
    pointer-events: none;
    text-align: center;
  }

  .data {
    font-size: 1.5vw;
    line-height: 1.1;
    letter-spacing: -0.03em;
  }

  .label {
    font-size: 0.8vw;
    opacity: 0.6;
    margin-bottom: 1vw;
    letter-spacing: 0.05em;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.5vw;
  }

  a {
    color: inherit;
    text-decoration: none;
    font-size: 2vw;
    letter-spacing: -0.04em;
    line-height: 1;
    transition: opacity 0.2s;
  }

  a:hover {
    opacity: 0.5;
  }

  .top-left { align-self: flex-start; }

  @media (max-width: 800px) {
    body {
      display: flex;
      flex-direction: column;
      height: auto;
      overflow: auto;
    }
    .panel { min-height: 50vh; padding: 5vw; justify-content: flex-end; }
    .center-mark { font-size: 24vw; position: fixed; }
    .data { font-size: 5vw; margin-bottom: 2vw; }
    .label { font-size: 3vw; }
    a { font-size: 8vw; }
    .p4 { align-items: flex-start; text-align: left; }
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>

  <div class="center-mark">
    ERIK<br>NILSSON
  </div>

  <div class="panel p1">
    <div class="label">Identity</div>
    <div class="data top-left">
      Product Designer<br>
      Cursor, SF
    </div>
  </div>

  <div class="panel p2">
    <div class="label">Context</div>
    <div class="data">
      13°C, Overcast<br><br>
      Fred again..<br>
      Drake<br>
      Beach House
    </div>
  </div>

  <div class="panel p3">
    <div class="label">gemini-3.1-pro</div>
    <div class="data">
      Sort falling notes.<br>
      Swipe L/R.<br>
      Tempo rises.<br>
      Minimal staff.
    </div>
  </div>

  <div class="panel p4">
    <div class="label">Index</div>
    <div class="links">
      <a href="https://eriks.design">Site</a>
      <a href="https://x.com/flowstated">X / Twitter</a>
      <a href="https://github.com/eriknson">GitHub</a>
      <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
    </div>
  </div>

</body>
</html>
