<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0df" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090914" media="(prefers-color-scheme: dark)">
  <title>Erik Nilsson</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f4f0df;
      --paper-p3: color(display-p3 0.955 0.925 0.815);
      --ink: #101014;
      --muted: #5d5b55;
      --hair: rgba(16, 16, 20, 0.18);
      --acid: #ccff00;
      --acid-p3: color(display-p3 0.78 1 0);
      --hot: #ff2bd6;
      --hot-p3: color(display-p3 1 0.08 0.78);
      --blue: #0047ff;
      --blue-p3: color(display-p3 0 0.24 1);
      --orange: #ff5f00;
      --orange-p3: color(display-p3 1 0.31 0);
      --panel: rgba(244, 240, 223, 0.78);
      --shadow: rgba(12, 12, 16, 0.16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #090914;
        --paper-p3: color(display-p3 0.035 0.035 0.075);
        --ink: #f7f4e9;
        --muted: #aaa59a;
        --hair: rgba(247, 244, 233, 0.18);
        --acid: #d6ff00;
        --acid-p3: color(display-p3 0.82 1 0);
        --hot: #ff38dc;
        --hot-p3: color(display-p3 1 0.12 0.82);
        --blue: #1e5bff;
        --blue-p3: color(display-p3 0.05 0.28 1);
        --orange: #ff6a00;
        --orange-p3: color(display-p3 1 0.34 0);
        --panel: rgba(9, 9, 20, 0.76);
        --shadow: rgba(0, 0, 0, 0.55);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
      background: var(--paper-p3);
    }

    body {
      min-height: 100svh;
      margin: 0;
      background: var(--paper);
      background: var(--paper-p3);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.1;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      top: 10svh;
      left: 6vw;
      width: min(22rem, 38vw);
      height: 1px;
      background: var(--hair);
      box-shadow:
        0 18svh 0 var(--hair),
        0 36svh 0 var(--hair),
        0 54svh 0 var(--hair),
        19vw 9svh 0 var(--hair),
        19vw 27svh 0 var(--hair),
        19vw 45svh 0 var(--hair);
      opacity: 0.72;
    }

    body::after {
      width: 39vmin;
      height: 39vmin;
      right: -9vmin;
      top: 10svh;
      background: var(--hot);
      background: var(--hot-p3);
      border-radius: 999px;
      box-shadow:
        -72vmin 49svh 0 8vmin var(--blue),
        -18vmin 61svh 0 -5vmin var(--acid),
        -61vmin -6svh 0 -8vmin var(--orange);
      mix-blend-mode: multiply;
      opacity: 0.9;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(1rem, 1fr) minmax(0, 640px) minmax(1rem, 1fr);
      padding: clamp(1rem, 3vw, 2rem);
    }

    .frame {
      grid-column: 2;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: calc(100svh - clamp(2rem, 6vw, 4rem));
      border: 1px solid var(--ink);
      background: var(--panel);
      box-shadow: 18px 18px 0 var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.78rem 0.9rem;
      border-bottom: 1px solid var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .footer {
      border-top: 1px solid var(--ink);
      border-bottom: 0;
      flex-wrap: wrap;
    }

    .mark {
      display: inline-grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      background: var(--acid);
      background: var(--acid-p3);
      border: 1px solid var(--ink);
      font-weight: 900;
      letter-spacing: -0.12em;
      color: #0a0a0a;
    }

    main {
      display: grid;
      grid-template-columns: 1fr;
      align-content: end;
      padding: clamp(1.1rem, 4vw, 2.25rem);
      min-height: 34rem;
    }

    .hero {
      display: grid;
      gap: clamp(1.2rem, 4vw, 2.2rem);
    }

    h1 {
      max-width: 9ch;
      margin: 0;
      font-size: clamp(4.8rem, 18vw, 9.4rem);
      line-height: 0.78;
      letter-spacing: -0.12em;
      font-weight: 950;
      text-wrap: balance;
    }

    .role {
      max-width: 20rem;
      margin: 0 0 0 auto;
      padding: 0.72rem 0.78rem;
      background: var(--blue);
      background: var(--blue-p3);
      border: 1px solid var(--ink);
      color: white;
      font-size: clamp(1.15rem, 4vw, 2.05rem);
      font-weight: 850;
      letter-spacing: -0.05em;
      text-align: right;
      transform: rotate(-1.5deg);
    }

    .signal {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      margin-top: clamp(0.5rem, 3vw, 1.5rem);
      background: var(--ink);
      border: 1px solid var(--ink);
    }

    .tile {
      min-height: 8.4rem;
      padding: 0.75rem;
      background: var(--paper);
      background: var(--paper-p3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
    }

    .tile strong {
      font-size: clamp(1.55rem, 5vw, 2.65rem);
      line-height: 0.88;
      letter-spacing: -0.08em;
    }

    .tile span {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .tile.hot {
      background: var(--hot);
      background: var(--hot-p3);
      color: #090914;
    }

    .tile.acid {
      background: var(--acid);
      background: var(--acid-p3);
      color: #090914;
    }

    .tile.orange {
      background: var(--orange);
      background: var(--orange-p3);
      color: #090914;
    }

    .tile.dark {
      background: var(--ink);
      color: var(--paper);
    }

    .tile.hot span,
    .tile.acid span,
    .tile.orange span {
      color: rgba(9, 9, 20, 0.62);
    }

    .tile.dark span {
      color: rgba(244, 240, 223, 0.62);
    }

    .links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      min-height: 2.2rem;
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--ink);
      background: var(--paper);
      background: var(--paper-p3);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .links a:hover {
      background: var(--acid);
      background: var(--acid-p3);
      color: #090914;
      transform: translate(-2px, -2px);
    }

    .now {
      color: var(--muted);
    }

    .weather {
      color: var(--ink);
    }

    @media (max-width: 600px) {
      body::before {
        top: 8svh;
        left: 1rem;
        width: 34vw;
        box-shadow:
          0 20svh 0 var(--hair),
          0 40svh 0 var(--hair),
          44vw 10svh 0 var(--hair),
          44vw 30svh 0 var(--hair);
      }

      body::after {
        width: 48vmin;
        height: 48vmin;
        right: -22vmin;
        top: 5svh;
        box-shadow:
          -45vmin 54svh 0 7vmin var(--blue),
          -2vmin 68svh 0 -4vmin var(--acid),
          -38vmin 9svh 0 -9vmin var(--orange);
      }

      .stage {
        display: block;
        padding: 0;
      }

      .frame {
        min-height: 100svh;
        border-left: 0;
        border-right: 0;
        box-shadow: none;
      }

      .topbar,
      .footer {
        align-items: flex-start;
      }

      main {
        min-height: auto;
        padding: 1rem;
      }

      .role {
        max-width: 15rem;
      }

      .signal {
        grid-template-columns: 1fr;
      }

      .tile {
        min-height: 6.6rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="stage">
    <section class="frame" aria-label="Erik Nilsson">
      <header class="topbar">
        <span class="mark" aria-hidden="true">EN</span>
        <span>San Francisco</span>
        <span class="now">03 Jun</span>
      </header>

      <main>
        <div class="hero">
          <h1>Erik Nilsson</h1>
          <p class="role">Product designer at Cursor.</p>

          <div class="signal" aria-label="Today's signals">
            <div class="tile hot">
              <span>Today</span>
              <strong>Overcast, 13 C.</strong>
            </div>
            <div class="tile acid">
              <span>Season</span>
              <strong>Summer, muted sky.</strong>
            </div>
            <div class="tile dark">
              <span>Listening</span>
              <strong>Fred again.. Drake Beach House.</strong>
            </div>
            <div class="tile orange">
              <span>Mode</span>
              <strong>Quiet experiments.</strong>
            </div>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="links" aria-label="Links">
          <a href="https://cursor.com">Cursor</a>
          <a href="https://x.com/flowstated">X</a>
          <a href="https://github.com/eriknson">GitHub</a>
          <a href="https://eriks.design">Site</a>
          <a href="mailto:contact@eriks.design">Email</a>
        </div>
        <span class="weather">Living site.</span>
      </footer>
    </section>
  </div>
</body>
</html>
