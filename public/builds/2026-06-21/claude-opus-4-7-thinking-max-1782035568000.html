<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Nilsson</title>
<meta name="description" content="Erik Nilsson — product designer at Cursor.">
<style>
  :root {
    color-scheme: light;

    --bg: #fff200;
    --ink: #08090b;
    --accent: #ff1860;
    --hairline: rgba(8, 9, 11, 0.16);
    --muted: rgba(8, 9, 11, 0.5);
  }

  @supports (background: color(display-p3 1 1 1)) {
    :root {
      --bg: color(display-p3 1.0 0.93 0.08);
      --ink: color(display-p3 0.04 0.05 0.07);
      --accent: color(display-p3 1.0 0.08 0.38);
      --hairline: color(display-p3 0.04 0.05 0.07 / 0.16);
      --muted: color(display-p3 0.04 0.05 0.07 / 0.5);
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    min-height: 100vh;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
    padding: clamp(20px, 3vw, 36px);
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    gap: clamp(40px, 7vw, 72px);
    overflow-x: hidden;
  }

  /* ---- Top meta strip ---- */
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    font: 500 11px/1.4 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  .meta > div {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .meta .sep { opacity: 0.4; }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .live::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ink);
    animation: pulse 2.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50%     { opacity: 1;   transform: scale(1.45); }
  }

  /* ---- Hero ---- */
  .hero {
    align-self: center;
    display: grid;
    gap: clamp(20px, 2.8vw, 36px);
  }

  .name {
    font-weight: 620;
    font-size: clamp(72px, 19.5vw, 280px);
    line-height: 0.83;
    letter-spacing: -0.052em;
    margin-left: -0.04em;
  }

  .name .nilsson {
    display: block;
    color: transparent;
    -webkit-text-stroke: clamp(1.4px, 0.22vw, 2.75px) var(--ink);
  }

  .name .stop {
    color: var(--accent);
    -webkit-text-stroke: 0;
  }

  .role {
    font-size: clamp(15px, 1.3vw, 18px);
    font-weight: 400;
    letter-spacing: -0.005em;
    line-height: 1.4;
    max-width: 44ch;
  }

  /* ---- Now block ---- */
  .now {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 24px 40px;
    padding-top: 26px;
    border-top: 1px solid var(--hairline);
  }

  .now .field {
    display: grid;
    gap: 8px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }

  .now .k {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 500;
  }

  .now .v {
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.003em;
  }

  /* Daylight bar */
  .sun {
    position: relative;
    height: 1.5px;
    background: var(--hairline);
    margin-top: 8px;
  }
  .sun > i {
    position: absolute;
    inset: 0 auto 0 0;
    width: var(--p, 26%);
    background: var(--ink);
  }
  .sun > b {
    position: absolute;
    top: -3px;
    left: var(--p, 26%);
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    transform: translateX(-50%);
    box-shadow: 0 0 0 2px var(--bg);
  }

  /* ---- Footer ---- */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    font: 500 12px/1.4 ui-monospace, "SF Mono", monospace;
    letter-spacing: 0.01em;
  }

  .foot nav {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
  }

  .foot a {
    color: var(--ink);
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
    transition: color 0.2s ease;
  }
  .foot a::after {
    content: '';
    position: absolute;
    inset: auto 0 0 0;
    height: 1.5px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .foot a:hover { color: var(--accent); }
  .foot a:hover::after { transform: scaleX(1); }

  .foot .copy { color: var(--muted); }

  ::selection {
    background: var(--ink);
    color: var(--bg);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;

      --bg: #1a1a1a;
      --ink: #e0e0e0;
      --accent: #ff1860;
      --hairline: rgba(224, 224, 224, 0.16);
      --muted: rgba(224, 224, 224, 0.5);
    }
  }

  /* ---- Responsive ---- */
  @media (max-width: 640px) {
    .meta { flex-direction: column; align-items: flex-start; gap: 8px; }
    .name { font-size: clamp(56px, 22vw, 130px); line-height: 0.85; }
    .role { font-size: 15px; }
    .foot { flex-direction: column; align-items: flex-start; gap: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>

  <div class="meta">
    <div>
      <span class="live">Erik Nilsson</span>
      <span class="sep">·</span>
      <span>eriks.design</span>
    </div>
    <div>
      <span>San Francisco</span>
      <span class="sep">·</span>
      <span>13° overcast</span>
      <span class="sep">·</span>
      <span>Sun 21·06·26</span>
    </div>
  </div>

  <main class="hero">
    <h1 class="name">Erik<span class="nilsson">Nilsson<span class="stop">.</span></span></h1>
    <p class="role">Product designer at Cursor &mdash; on how people build software with AI.</p>
  </main>

  <section class="now" aria-label="Today">
    <div class="field">
      <span class="k">Today</span>
      <span class="v">Sunday, 21 June</span>
    </div>
    <div class="field">
      <span class="k">Daylight · 14h 46m</span>
      <span class="v">05:48 &rarr; 20:34</span>
      <div class="sun" style="--p: 26%"><i></i><b></b></div>
    </div>
    <div class="field">
      <span class="k">Listening</span>
      <span class="v">Fred again..</span>
    </div>
  </section>

  <footer class="foot">
    <span class="copy">&copy; Erik Nilsson &middot; 2026</span>
    <nav>
      <a href="https://cursor.com">Cursor</a>
      <a href="https://github.com/eriknson">GitHub</a>
      <a href="https://x.com/flowstated">X</a>
      <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
      <a href="mailto:contact@eriks.design">Email</a>
    </nav>
  </footer>

</body>
</html>
