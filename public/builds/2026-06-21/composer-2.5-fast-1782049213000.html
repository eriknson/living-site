<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <style>
    :root {
      --fog: color(display-p3 0.72 0.74 0.78);
      --fog-deep: color(display-p3 0.58 0.61 0.66);
      --ink: color(display-p3 0.12 0.13 0.16);
      --mute: color(display-p3 0.42 0.44 0.48);
      --pulse: color(display-p3 1 0.08 0.62);
      --pulse-dim: color(display-p3 0.82 0.22 0.58);
      --glow: color(display-p3 0.15 1 0.88);
      --sheet: color(display-p3 0.94 0.95 0.97);
      --line: color(display-p3 0.12 0.13 0.16 / 0.1);
      --max: 640px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fog: color(display-p3 0.16 0.17 0.2);
        --fog-deep: color(display-p3 0.1 0.11 0.13);
        --ink: color(display-p3 0.92 0.93 0.95);
        --mute: color(display-p3 0.52 0.54 0.58);
        --pulse: color(display-p3 1 0.2 0.72);
        --pulse-dim: color(display-p3 0.7 0.18 0.52);
        --glow: color(display-p3 0.2 1 0.92);
        --sheet: color(display-p3 0.08 0.09 0.11);
        --line: color(display-p3 0.92 0.93 0.95 / 0.1);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      background: var(--fog);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font: 400 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      letter-spacing: -0.01em;
    }

    ::selection {
      background: var(--pulse);
      color: var(--sheet);
    }

    .frame {
      max-width: var(--max);
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 3rem) clamp(1.25rem, 4vw, 2rem) 4rem;
      position: relative;
    }

    /* fog slabs — solid layers, no gradients */
    .fog-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fog-field span {
      position: absolute;
      background: var(--fog-deep);
      opacity: 0.55;
    }

    .fog-field span:nth-child(1) { width: 42%; height: 28%; top: -4%; right: -8%; }
    .fog-field span:nth-child(2) { width: 55%; height: 18%; bottom: 12%; left: -12%; }
    .fog-field span:nth-child(3) { width: 22%; height: 40%; top: 38%; right: 6%; opacity: 0.35; }

    .content { position: relative; z-index: 1; }

    .mast {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 3.5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .stamp {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--mute);
      white-space: nowrap;
    }

    .role {
      margin: 0.35rem 0 0;
      color: var(--mute);
      font-size: 0.95rem;
    }

    .role a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      transition: color 0.15s, border-color 0.15s;
    }

    .role a:hover { color: var(--pulse); border-color: var(--pulse); }

    /* beat grid — stutter-house fragments */
    .beat {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 3px;
      margin: 0 0 2.75rem;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .beat button {
      aspect-ratio: 1;
      border: none;
      padding: 0;
      cursor: pointer;
      background: var(--fog-deep);
      transition: background 0.05s, transform 0.05s;
    }

    .beat button.on {
      background: var(--pulse);
      transform: scale(0.92);
    }

    .beat button.ghost {
      background: var(--glow);
      opacity: 0.45;
    }

    .beat button:nth-child(3n) { grid-column: span 1; }
    .beat button:nth-child(5) { grid-column: span 2; }
    .beat button:nth-child(11) { grid-column: span 2; }

    @media (max-width: 520px) {
      .beat { grid-template-columns: repeat(6, 1fr); }
      .beat button:nth-child(5),
      .beat button:nth-child(11) { grid-column: span 1; }
    }

    .now {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem 1.5rem;
      align-items: baseline;
      padding: 1rem 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin-bottom: 2rem;
      font-size: 0.88rem;
    }

    .now dt {
      margin: 0;
      color: var(--mute);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .now dd {
      margin: 0;
      grid-column: 2;
      text-align: right;
    }

    .now .wide {
      grid-column: 1 / -1;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      padding-top: 0.25rem;
    }

    .signal {
      margin: 0 0 2.5rem;
      padding-left: 0.85rem;
      border-left: 3px solid var(--pulse);
      font-size: 0.92rem;
      line-height: 1.5;
      max-width: 28em;
    }

    .signal cite {
      display: block;
      margin-top: 0.6rem;
      font-style: normal;
      font-size: 0.72rem;
      color: var(--mute);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0 0 2.75rem;
      list-style: none;
      padding: 0;
    }

    .tags li {
      font-size: 0.75rem;
      padding: 0.28rem 0.55rem;
      background: var(--sheet);
      color: var(--mute);
      letter-spacing: 0.02em;
    }

    .tags li:first-child {
      background: var(--pulse);
      color: var(--sheet);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1.25rem;
      font-size: 0.82rem;
    }

    nav a {
      color: var(--ink);
      text-decoration: none;
      position: relative;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 1px;
      background: var(--glow);
      transition: width 0.2s;
    }

    nav a:hover::after { width: 100%; }

    .pulse-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--fog-deep);
      z-index: 2;
    }

    .pulse-bar i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--pulse);
      animation: stutter 2.4s steps(8) infinite;
    }

    @keyframes stutter {
      0%   { width: 8%; }
      12%  { width: 8%; }
      18%  { width: 34%; }
      24%  { width: 34%; }
      31%  { width: 52%; }
      38%  { width: 52%; }
      44%  { width: 71%; }
      55%  { width: 71%; }
      62%  { width: 88%; }
      72%  { width: 88%; }
      80%  { width: 100%; }
      100% { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-bar i { animation: none; width: 100%; }
      .beat button { transition: none; }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="fog-field" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <div class="frame">
    <main class="content">
      <header class="mast">
        <div>
          <h1>Erik Nilsson</h1>
          <p class="role">Product design · <a href="https://cursor.com">Cursor</a></p>
        </div>
        <span class="stamp">SF · 2026-06-21</span>
      </header>

      <div class="beat" role="group" aria-label="Beat fragments">
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
        <button type="button" aria-label="beat"></button>
      </div>

      <dl class="now">
        <dt>Sky</dt>
        <dd>14° overcast</dd>
        <dt>Git</dt>
        <dd>quiet week</dd>
        <dt class="wide">longest daylight, gray bay</dt>
      </dl>

      <blockquote class="signal">
        imagine 2026
        <cite><a href="https://x.com/flowstated/status/2002167999353241901">@flowstated</a></cite>
      </blockquote>

      <ul class="tags" aria-label="Listening">
        <li>Fred again..</li>
        <li>stutter house</li>
        <li>swedish pop</li>
      </ul>

      <nav>
        <a href="https://cursor.com">Cursor</a>
        <a href="https://x.com/flowstated">X</a>
        <a href="https://github.com/eriknson">GitHub</a>
        <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
        <a href="mailto:contact@eriks.design">Mail</a>
      </nav>
    </main>
  </div>

  <div class="pulse-bar" aria-hidden="true"><i></i></div>

  <script>
    (function () {
      var grid = document.querySelector(".beat");
      if (!grid) return;
      var pads = grid.querySelectorAll("button");
      var seq = [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 15];
      var ghost = [1, 5, 9, 13];
      var i = 0;
      var auto = setInterval(tick, 280);

      ghost.forEach(function (n) {
        if (pads[n]) pads[n].classList.add("ghost");
      });

      function tick() {
        pads.forEach(function (p) { p.classList.remove("on"); });
        var idx = seq[i % seq.length];
        if (pads[idx]) pads[idx].classList.add("on");
        i++;
      }

      grid.addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) return;
        clearInterval(auto);
        pads.forEach(function (p) { p.classList.remove("on"); });
        btn.classList.add("on");
        setTimeout(function () { btn.classList.remove("on"); }, 120);
        auto = setInterval(tick, 280);
      });
    })();
  </script>
</body>
</html>
