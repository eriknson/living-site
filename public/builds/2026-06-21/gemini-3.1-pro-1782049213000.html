<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erik Nilsson</title>
  <style>
    :root {
      --bg: color(display-p3 0.05 0.15 1);
      --fg: color(display-p3 0.98 0.98 0.98);
      --accent: color(display-p3 1 0.9 0);
    }
    @supports not (color: color(display-p3 1 1 1)) {
      :root { 
        --bg: #0d26ff; 
        --fg: #fafafa;
        --accent: #ffe600;
      }
    }
    body {
      margin: 0 auto;
      max-width: 640px;
      height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      overflow: hidden;
      padding: 2vw;
      position: relative;
      text-transform: uppercase;
      font-weight: 600;
      -webkit-font-smoothing: antialiased;
    }
    ::selection {
      background: var(--accent);
      color: color(display-p3 0 0 0);
    }
    .center-type {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20vw;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 0.85;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }
    
    .corners {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 100%;
      font-size: clamp(0.75rem, 1vw, 1.25rem);
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .corner {
      z-index: 10;
      display: flex;
      flex-direction: column;
    }
    .top-left { align-items: flex-start; justify-content: flex-start; }
    .top-right { align-items: flex-end; justify-content: flex-start; text-align: right; }
    .bottom-left { align-items: flex-start; justify-content: flex-end; }
    .bottom-right { align-items: flex-end; justify-content: flex-end; text-align: right; }
    
    .role-block { max-width: 32ch; }
    
    a { 
      color: inherit; 
      text-decoration: none; 
      transition: color 0.2s;
    }
    a:hover { 
      color: var(--accent); 
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: color(display-p3 0.02 0.04 0.12);
        --fg: color(display-p3 0.95 0.95 0.95);
        --accent: color(display-p3 1 0.9 0);
      }
      @supports not (color: color(display-p3 1 1 1)) {
        :root {
          --bg: #0a1030;
          --fg: #f0f0f0;
          --accent: #ffe600;
        }
      }
    }
    
    @media (max-width: 640px) {
      .center-type { font-size: 26vw; }
      .corners {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .corner { align-items: center; justify-content: center; text-align: center; margin-bottom: 2rem; }
      .top-right, .bottom-right { align-items: center; text-align: center; }
      body { padding: 6vw; overflow: auto; min-height: 100vh; height: auto; }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="center-type">ERIK<br>NILSSON</div>
  
  <div class="corners">
    <div class="corner top-left role-block">
      <span>Product Designer @ Cursor.</span>
      <span style="opacity: 0.6;">Working on how people build software with AI. Tinkering with living-site.</span>
    </div>
    
    <div class="corner top-right">
      <span>San Francisco, CA</span>
      <span>2026.06.21</span>
      <span style="opacity: 0.6;">14°C, Overcast</span>
    </div>
    
    <div class="corner bottom-left">
      <span>Signals</span>
      <span style="opacity: 0.6;">Fred again.., Drake, Ben Böhmer</span>
      <span style="opacity: 0.6;">0 Commits this week</span>
    </div>
    
    <div class="corner bottom-right">
      <a href="https://cursor.com">Cursor ↗</a>
      <a href="https://eriks.design">Site ↗</a>
      <a href="https://x.com/flowstated">X ↗</a>
      <a href="https://github.com/eriknson">GitHub ↗</a>
      <a href="https://linkedin.com/in/eriknson">LinkedIn ↗</a>
    </div>
  </div>
</body>
</html>
