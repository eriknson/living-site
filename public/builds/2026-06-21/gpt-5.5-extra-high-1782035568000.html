<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f1e8;
      --fg: #090908;
      --muted: rgba(9, 9, 8, .56);
      --line: rgba(9, 9, 8, .18);
      --panel: rgba(246, 241, 232, .72);
      --acid: #baff00;
      --signal: #ff3d1f;
      --sky: #1446ff;
      --pink: #ff4bce;
    }

    @supports (color: color(display-p3 1 0 0)) {
      :root {
        --bg: color(display-p3 .965 .94 .875);
        --fg: color(display-p3 .025 .022 .018);
        --muted: color(display-p3 .025 .022 .018 / .58);
        --line: color(display-p3 .025 .022 .018 / .18);
        --panel: color(display-p3 .965 .94 .875 / .74);
        --acid: color(display-p3 .72 1 0);
        --signal: color(display-p3 1 .19 .05);
        --sky: color(display-p3 0 .18 1);
        --pink: color(display-p3 1 .08 .75);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 500 15px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -.01em;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      inset: -10vh auto auto -8vw;
      width: min(58vw, 760px);
      height: 118vh;
      background: var(--sky);
      transform: skewX(-16deg);
      mix-blend-mode: multiply;
    }

    body::after {
      right: -12vw;
      bottom: -16vh;
      width: min(56vw, 720px);
      height: min(56vw, 720px);
      border-radius: 50%;
      background: var(--acid);
      box-shadow: -34vw -38vh 0 -18vw var(--signal), -12vw -6vh 0 -24vw var(--pink);
      mix-blend-mode: multiply;
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      width: min(calc(100% - 32px), 640px);
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 0;
      align-content: center;
    }

    .card {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      padding: clamp(28px, 6vw, 58px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 34px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .14);
      overflow: hidden;
      backdrop-filter: blur(20px) saturate(1.25);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 18px 18px auto auto;
      width: 108px;
      height: 108px;
      border: 1px solid var(--fg);
      border-radius: 50%;
      opacity: .24;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: auto auto 20px 20px;
      width: 12px;
      height: 12px;
      background: var(--fg);
      box-shadow: 20px 0 0 var(--fg), 40px 0 0 var(--fg);
      opacity: .82;
    }

    header {
      display: grid;
      gap: 18px;
      max-width: 34rem;
    }

    .eyebrow,
    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 9ch;
      margin: 0;
      font-size: clamp(58px, 17vw, 128px);
      line-height: .78;
      letter-spacing: -.08em;
      text-wrap: balance;
    }

    .role {
      margin: 0;
      max-width: 26rem;
      font-size: clamp(19px, 3vw, 28px);
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .today {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .today div {
      min-height: 108px;
      padding: 16px 14px;
      border-right: 1px solid var(--line);
    }

    .today div:last-child {
      border-right: 0;
    }

    .today strong {
      display: block;
      margin-top: 20px;
      font-size: 24px;
      line-height: 1;
      letter-spacing: -.04em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .links a {
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .18);
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .links a:hover,
    .links a:focus-visible {
      background: var(--fg);
      border-color: var(--fg);
      color: var(--bg);
      transform: translateY(-2px);
      outline: 0;
    }

    .ticker {
      position: absolute;
      right: 24px;
      bottom: 23px;
      max-width: 16rem;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #050505;
        --fg: #f7f1e7;
        --muted: rgba(247, 241, 231, .6);
        --line: rgba(247, 241, 231, .2);
        --panel: rgba(5, 5, 5, .7);
      }

      @supports (color: color(display-p3 1 0 0)) {
        :root {
          --bg: color(display-p3 .018 .018 .016);
          --fg: color(display-p3 .97 .94 .88);
          --muted: color(display-p3 .97 .94 .88 / .62);
          --line: color(display-p3 .97 .94 .88 / .2);
          --panel: color(display-p3 .018 .018 .016 / .72);
          --acid: color(display-p3 .66 1 0);
          --signal: color(display-p3 1 .16 .03);
          --sky: color(display-p3 0 .13 1);
          --pink: color(display-p3 1 .05 .68);
        }
      }

      body::before,
      body::after {
        mix-blend-mode: screen;
      }

      .links a {
        background: rgba(255, 255, 255, .04);
      }
    }

    @media (max-width: 560px) {
      main {
        width: min(calc(100% - 20px), 640px);
        padding: 10px 0;
        align-content: stretch;
      }

      .card {
        min-height: calc(100vh - 20px);
        padding: 28px 24px 72px;
        border-radius: 26px;
      }

      .today {
        grid-template-columns: 1fr;
      }

      .today div {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .today div:last-child {
        border-bottom: 0;
      }

      .today strong {
        margin-top: 8px;
      }

      .ticker {
        left: 24px;
        right: 24px;
        text-align: left;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <main>
    <section class="card" aria-label="Erik Nilsson">
      <header>
        <div class="eyebrow">San Francisco / Summer</div>
        <h1>Erik Nilsson</h1>
        <p class="role">Product designer at <a href="https://cursor.com">Cursor</a>, working on how people build with AI.</p>
      </header>

      <section class="today" aria-label="Today">
        <div>
          <span class="meta">Outside</span>
          <strong>13 C</strong>
          <span>overcast</span>
        </div>
        <div>
          <span class="meta">Listening</span>
          <strong>Fred</strong>
          <span>Drake / Ben</span>
        </div>
        <div>
          <span class="meta">Signal</span>
          <strong>Quiet</strong>
          <span>building, mostly</span>
        </div>
      </section>

      <nav class="links" aria-label="Links">
        <a href="https://eriks.design">site</a>
        <a href="https://cursor.com">Cursor</a>
        <a href="https://x.com/flowstated">X</a>
        <a href="https://github.com/eriknson">GitHub</a>
        <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
        <a href="mailto:contact@eriks.design">email</a>
      </nav>

      <div class="ticker">living-site / rebuilt from today</div>
    </section>
  </main>
</body>
</html>
