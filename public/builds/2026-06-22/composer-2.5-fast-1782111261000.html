<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <style>
    :root {
      --fog: color(display-p3 0.38 0.41 0.46);
      --void: color(display-p3 0.11 0.12 0.14);
      --paper: color(display-p3 0.94 0.95 0.97);
      --lime: color(display-p3 0.62 1.0 0.08);
      --magenta: color(display-p3 1.0 0.14 0.58);
      --cyan: color(display-p3 0.05 0.88 1.0);
      --amber: color(display-p3 1.0 0.72 0.12);
      --rule: color(display-p3 0.55 0.58 0.63 / 0.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      background: var(--paper);
      color: var(--void);
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .shell {
      position: relative;
      min-height: 100dvh;
      max-width: 40rem;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      grid-template-rows: auto 1fr auto;
    }

    @media (max-width: 640px) {
      .shell { grid-template-columns: 1fr; }
      header { padding: 1.8rem 1.4rem 1rem; }
      main, aside, nav { padding-left: 1.4rem; padding-right: 1.4rem; }
    }

    .panel-fog {
      position: absolute;
      inset: 0;
      background: var(--fog);
      clip-path: polygon(0 0, 62% 0, 48% 100%, 0 100%);
      z-index: 0;
    }

    .panel-lime {
      position: absolute;
      top: 0;
      right: 0;
      width: 38%;
      height: 28%;
      background: var(--lime);
      clip-path: polygon(18% 0, 100% 0, 100% 100%, 0 72%);
      z-index: 0;
    }

    .panel-magenta {
      position: absolute;
      bottom: 12%;
      right: 6%;
      width: 11rem;
      height: 11rem;
      background: var(--magenta);
      z-index: 1;
    }

    .panel-cyan {
      position: absolute;
      bottom: 0;
      left: 38%;
      width: 5.5rem;
      height: 100%;
      background: var(--cyan);
      z-index: 0;
      mix-blend-mode: hard-light;
    }

    .wire {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.22;
    }

    .wire line {
      stroke: var(--paper);
      stroke-width: 0.5;
      vector-effect: non-scaling-stroke;
    }

    canvas#field {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    header {
      position: relative;
      z-index: 4;
      grid-column: 1 / -1;
      padding: 2.4rem 2rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 2rem;
    }

    .name {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 0.92;
      color: var(--void);
      mix-blend-mode: difference;
    }

    .stamp {
      font-variant-numeric: tabular-nums;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--void);
      mix-blend-mode: difference;
      white-space: nowrap;
    }

    main {
      position: relative;
      z-index: 4;
      padding: 0 2rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 2.8rem;
    }

    .role {
      font-size: 1rem;
      letter-spacing: -0.01em;
      max-width: 14ch;
      line-height: 1.35;
    }

    .role a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--lime);
      text-underline-offset: 0.2em;
    }

    .role a:hover { color: var(--lime); }

    .telemetry {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: color(display-p3 0.72 0.74 0.78);
    }

    .telemetry span {
      display: block;
      width: fit-content;
      padding: 0.15rem 0;
      border-bottom: 1px solid var(--rule);
    }

    aside {
      position: relative;
      z-index: 4;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3rem;
    }

    .signal {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 0.7rem;
      line-height: 1.65;
      letter-spacing: 0.02em;
      color: var(--void);
      max-width: 28ch;
    }

    .signal em {
      font-style: normal;
      display: block;
      margin-top: 1.2rem;
      color: color(display-p3 0.18 0.19 0.22);
    }

    nav {
      position: relative;
      z-index: 4;
      grid-column: 1 / -1;
      padding: 1.4rem 2rem 2.4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.6rem;
      border-top: 1px solid var(--rule);
    }

    nav a {
      font-size: 0.82rem;
      color: var(--void);
      text-decoration: none;
      letter-spacing: 0.04em;
    }

    nav a:hover { color: var(--amber); }

    nav a::before {
      content: "→ ";
      color: var(--magenta);
    }

    .pulse {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 12px 4px color(display-p3 0.62 1.0 0.08 / 0.55);
      pointer-events: none;
      z-index: 10;
      transform: translate(-50%, -50%);
      transition: opacity 0.4s;
      opacity: 0;
    }

    .pulse.on { opacity: 1; }

    @media (prefers-color-scheme: dark) {
      body {
        background: var(--void);
        color: var(--paper);
      }

      nav a { color: var(--paper); }
    }

    @media (prefers-reduced-motion: reduce) {
      canvas#field { display: none; }
      .pulse { display: none; }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="panel-fog" aria-hidden="true"></div>
    <div class="panel-lime" aria-hidden="true"></div>
    <div class="panel-magenta" aria-hidden="true"></div>
    <div class="panel-cyan" aria-hidden="true"></div>

    <svg class="wire" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" y1="72" x2="100" y2="38"/>
      <line x1="48" y1="0" x2="62" y2="100"/>
      <line x1="18" y1="0" x2="0" y2="72"/>
      <line x1="72" y1="100" x2="88" y2="12"/>
    </svg>

    <canvas id="field" aria-hidden="true"></canvas>
    <div class="pulse" id="pulse" aria-hidden="true"></div>

    <header>
      <h1 class="name">Erik<br>Nilsson</h1>
      <p class="stamp">2026-06-22 · sf</p>
    </header>

    <main>
      <p class="role">Product designer at <a href="https://cursor.com">Cursor</a></p>
      <div class="telemetry">
        <span>13°c fog</span>
        <span>fred again.. · stutter house</span>
        <span>living-site · daily</span>
      </div>
    </main>

    <aside>
      <p class="signal">
        imagine 2026
        <em>karl the fog · deno on desktop · sakana fugu</em>
      </p>
    </aside>

    <nav>
      <a href="https://x.com/flowstated">X</a>
      <a href="https://github.com/eriknson">GitHub</a>
      <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
      <a href="mailto:contact@eriks.design">Email</a>
      <a href="https://eriks.design">Site</a>
    </nav>
  </div>

  <script>
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const canvas = document.getElementById("field");
      const pulse = document.getElementById("pulse");
      const ctx = canvas.getContext("2d");
      let w, h, dpr, mx = -99, my = -99, active = false;

      const fog = [];
      const FIREFLY = "color(display-p3 0.62 1.0 0.08)";
      const WISP = "color(display-p3 0.94 0.95 0.97)";

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        w = canvas.clientWidth;
        h = canvas.clientHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fog.length = 0;
        for (let i = 0; i < 14; i++) {
          fog.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: 40 + Math.random() * 90,
            a: 0.04 + Math.random() * 0.06,
            vx: (Math.random() - 0.5) * 0.15,
            vy: (Math.random() - 0.5) * 0.08
          });
        }
      }

      function drawFirefly(x, y) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = FIREFLY;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, 14, 0, Math.PI * 2);
        ctx.fillStyle = "color(display-p3 0.62 1.0 0.08 / 0.18)";
        ctx.fill();
        ctx.restore();
      }

      function frame() {
        ctx.clearRect(0, 0, w, h);

        for (const f of fog) {
          f.x += f.vx;
          f.y += f.vy;
          if (f.x < -f.r) f.x = w + f.r;
          if (f.x > w + f.r) f.x = -f.r;
          if (f.y < -f.r) f.y = h + f.r;
          if (f.y > h + f.r) f.y = -f.r;

          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.strokeStyle = WISP;
          ctx.globalAlpha = f.a;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        if (active) drawFirefly(mx, my);
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize);
      document.addEventListener("pointermove", (e) => {
        mx = e.clientX;
        my = e.clientY;
        active = true;
        pulse.classList.add("on");
        pulse.style.left = mx + "px";
        pulse.style.top = my + "px";
      });
      document.addEventListener("pointerleave", () => {
        active = false;
        pulse.classList.remove("on");
      });

      resize();
      frame();
    })();
  </script>
</body>
</html>
