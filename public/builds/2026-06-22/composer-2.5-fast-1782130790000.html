<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <style>
    :root {
      --void: color(display-p3 0.06 0.07 0.09);
      --fog: color(display-p3 0.40 0.43 0.47);
      --fog-thick: color(display-p3 0.30 0.33 0.37);
      --paper: color(display-p3 0.93 0.94 0.96);
      --gold: color(display-p3 1.0 0.76 0.08);
      --lime: color(display-p3 0.58 1.0 0.04);
      --magenta: color(display-p3 1.0 0.10 0.52);
      --cyan: color(display-p3 0.0 0.90 1.0);
      --rule: color(display-p3 0.55 0.58 0.62 / 0.22);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100dvh;
      background: var(--void);
      color: var(--paper);
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      cursor: crosshair;
      touch-action: manipulation;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 4.5rem;
      grid-template-rows: auto 1fr auto;
    }

    @media (max-width: 720px) {
      .stage { grid-template-columns: 1fr; }
      .drops { display: none; }
    }

    .block {
      position: absolute;
      z-index: 0;
      pointer-events: none;
    }

    .block-gold {
      top: 0;
      left: 0;
      width: 54%;
      height: 36%;
      background: var(--gold);
      clip-path: polygon(0 0, 100% 0, 68% 100%, 0 72%);
    }

    .block-fog {
      top: 0;
      right: 4.5rem;
      width: 42%;
      height: 100%;
      background: var(--fog);
      clip-path: polygon(24% 0, 100% 0, 100% 100%, 0 100%);
    }

    @media (max-width: 720px) {
      .block-fog { right: 0; width: 56%; }
    }

    .block-magenta {
      bottom: 0;
      left: 30%;
      width: 8.5rem;
      height: 8.5rem;
      background: var(--magenta);
      transition: transform 0.05s ease;
    }

    .block-magenta.kick { transform: scale(1.06); }

    .block-cyan {
      bottom: 20%;
      left: 0;
      width: 2.8rem;
      height: 38%;
      background: var(--cyan);
    }

    .hill {
      position: absolute;
      left: 0;
      right: 4.5rem;
      bottom: 0;
      height: 42%;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.4s ease;
    }

    @media (max-width: 720px) {
      .hill { right: 0; height: 36%; }
    }

    .hill.revealed { opacity: 1; }

    .hill path, .hill line {
      fill: none;
      stroke: var(--lime);
      stroke-width: 0.55;
      vector-effect: non-scaling-stroke;
    }

    .hill circle {
      fill: var(--gold);
      stroke: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .hill.revealed circle { opacity: 1; }

    #fog {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .drops {
      grid-row: 1 / -1;
      grid-column: 2;
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 2px 0;
      background: var(--void);
    }

    .drop {
      flex: 1;
      min-height: 0;
      background: var(--fog-thick);
      transition: background 0.035s ease, transform 0.035s ease;
    }

    .drop.hit {
      background: var(--lime);
      transform: scaleX(1.1);
    }

    .drop.miss { background: var(--fog); }

    .mobile-beat {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 6;
      background: var(--void);
    }

    .mobile-beat span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--lime);
      transition: width 0.04s ease;
    }

    @media (max-width: 720px) {
      .mobile-beat { display: block; }
    }

    header {
      position: relative;
      z-index: 4;
      grid-column: 1;
      padding: clamp(1.6rem, 4vw, 2.8rem) clamp(1.4rem, 4vw, 2.4rem) 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      pointer-events: none;
    }

    .name {
      font-family: "Helvetica Neue", "Arial Narrow", Arial, sans-serif;
      font-size: clamp(3.4rem, 10.5vw, 7.2rem);
      font-weight: 700;
      letter-spacing: -0.048em;
      line-height: 0.84;
      text-transform: uppercase;
      color: var(--void);
      mix-blend-mode: difference;
    }

    .stamp {
      font-variant-numeric: tabular-nums;
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--paper);
      mix-blend-mode: difference;
      padding-top: 0.55rem;
      white-space: nowrap;
    }

    main {
      position: relative;
      z-index: 4;
      grid-column: 1;
      padding: clamp(1.4rem, 4vw, 2.4rem);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: clamp(2rem, 5vh, 3.2rem);
      align-self: end;
      pointer-events: none;
    }

    .role {
      font-size: 0.94rem;
      letter-spacing: -0.01em;
      line-height: 1.3;
      max-width: 16ch;
      color: var(--paper);
      mix-blend-mode: difference;
    }

    .role a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--lime);
      pointer-events: auto;
    }

    .role a:hover { color: var(--lime); }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 0.48rem;
      font-variant-numeric: tabular-nums;
      font-size: 0.7rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .feed span {
      display: block;
      width: fit-content;
      color: color(display-p3 0.58 0.60 0.64);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.1rem;
    }

    .pulse-line {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 0.76rem;
      letter-spacing: 0.02em;
      text-transform: none;
      color: var(--paper);
      mix-blend-mode: difference;
      max-width: 20ch;
      line-height: 1.45;
    }

    nav {
      position: relative;
      z-index: 4;
      grid-column: 1;
      padding: 1.1rem clamp(1.4rem, 4vw, 2.4rem) clamp(1.5rem, 4vw, 2.5rem);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.3rem;
      border-top: 1px solid var(--rule);
    }

    nav a {
      font-size: 0.76rem;
      color: color(display-p3 0.54 0.56 0.60);
      text-decoration: none;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      transition: color 0.15s;
      pointer-events: auto;
      position: relative;
      z-index: 4;
    }

    nav a:hover { color: var(--gold); }

    .beat-ring {
      position: fixed;
      width: 0;
      height: 0;
      border-radius: 50%;
      border: 1.5px solid var(--lime);
      pointer-events: none;
      z-index: 6;
      transform: translate(-50%, -50%);
      opacity: 0;
    }

    .beat-ring.on { animation: ring 0.32s ease-out forwards; }

    @keyframes ring {
      0% { width: 0; height: 0; opacity: 0.85; }
      100% { width: 44px; height: 44px; opacity: 0; }
    }

    .hint {
      position: fixed;
      bottom: 1rem;
      right: 1.2rem;
      z-index: 6;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: color(display-p3 0.42 0.44 0.48);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.8s;
    }

    .hint.gone { opacity: 0; }

    @media (max-width: 720px) {
      .hint { right: auto; left: 1.4rem; bottom: 1.2rem; }
    }

    @media (max-width: 640px) {
      header { padding: 1.4rem 1.2rem 0; }
      main { padding: 1.2rem; }
      nav { padding: 1rem 1.2rem 1.4rem; }
      .name { font-size: clamp(2.8rem, 12vw, 4rem); }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --void: color(display-p3 0.06 0.07 0.09);
        --fog: color(display-p3 0.40 0.43 0.47);
        --fog-thick: color(display-p3 0.30 0.33 0.37);
        --paper: color(display-p3 0.93 0.94 0.96);
        --gold: color(display-p3 1.0 0.76 0.08);
        --lime: color(display-p3 0.58 1.0 0.04);
        --magenta: color(display-p3 1.0 0.10 0.52);
        --cyan: color(display-p3 0.0 0.90 1.0);
        --rule: color(display-p3 0.55 0.58 0.62 / 0.22);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #fog, .hill, .beat-ring, .hint, .drops, .mobile-beat { display: none; }
      body { cursor: auto; overflow: auto; }
      .block-magenta { transition: none; }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="block block-gold" aria-hidden="true"></div>
    <div class="block block-fog" aria-hidden="true"></div>
    <div class="block block-magenta" id="kick" aria-hidden="true"></div>
    <div class="block block-cyan" aria-hidden="true"></div>

    <svg class="hill" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0 168 L55 148 L110 158 L165 128 L220 138 L275 108 L330 118 L400 98 L400 200 L0 200 Z"/>
      <line x1="55" y1="148" x2="55" y2="168"/>
      <line x1="110" y1="158" x2="110" y2="168"/>
      <line x1="165" y1="128" x2="165" y2="168"/>
      <line x1="220" y1="138" x2="220" y2="168"/>
      <line x1="275" y1="108" x2="275" y2="168"/>
      <line x1="330" y1="118" x2="330" y2="168"/>
      <line x1="0" y1="168" x2="400" y2="168"/>
      <line x1="28" y1="158" x2="82" y2="158"/>
      <line x1="82" y1="158" x2="138" y2="138"/>
      <line x1="138" y1="138" x2="192" y2="148"/>
      <line x1="192" y1="148" x2="248" y2="122"/>
      <line x1="248" y1="122" x2="302" y2="132"/>
      <line x1="302" y1="132" x2="400" y2="112"/>
      <circle cx="55" cy="158" r="2.2"/>
      <circle cx="110" cy="158" r="2.2"/>
      <circle cx="165" cy="148" r="2.2"/>
      <circle cx="220" cy="148" r="2.2"/>
      <circle cx="275" cy="122" r="2.2"/>
      <circle cx="330" cy="132" r="2.2"/>
    </svg>

    <canvas id="fog" aria-hidden="true"></canvas>
    <div class="beat-ring" id="ring" aria-hidden="true"></div>

    <header>
      <h1 class="name">Erik<br>Nilsson</h1>
      <p class="stamp">jun 22 · sf</p>
    </header>

    <main>
      <p class="role">Product designer at <a href="https://cursor.com">Cursor</a></p>
      <div class="feed">
        <span>12° fog</span>
        <span>fred again.. · stutter house</span>
        <p class="pulse-line">imagine 2026</p>
      </div>
    </main>

    <nav>
      <a href="https://x.com/flowstated">X</a>
      <a href="https://github.com/eriknson">GitHub</a>
      <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
      <a href="mailto:contact@eriks.design">Email</a>
    </nav>

    <div class="drops" id="drops" aria-hidden="true"></div>
  </div>

  <div class="mobile-beat" aria-hidden="true"><span id="mbeat"></span></div>
  <p class="hint" id="hint">tap the beat</p>

  <script>
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const BPM = 128;
      const BEAT_MS = 60000 / BPM;
      const STUTTER = [1, 0, 1, 0, 1, 1, 0, 1];

      const canvas = document.getElementById("fog");
      const ctx = canvas.getContext("2d");
      const hill = document.querySelector(".hill");
      const ring = document.getElementById("ring");
      const hint = document.getElementById("hint");
      const dropsEl = document.getElementById("drops");
      const kick = document.getElementById("kick");
      const mbeat = document.getElementById("mbeat");

      let w, h, dpr;
      let beat = 0;
      let lastBeat = 0;
      let fogDensity = 0.78;
      let holes = [];
      let wisp = [];
      let drops = [];
      let lights = [];
      let audioCtx = null;
      let started = false;
      let reveal = 0;

      const DROP_COUNT = 16;
      for (let i = 0; i < DROP_COUNT; i++) {
        const el = document.createElement("div");
        el.className = "drop";
        dropsEl.appendChild(el);
        drops.push(el);
      }

      lights = [
        { x: 0.14, y: 0.79 }, { x: 0.28, y: 0.79 }, { x: 0.42, y: 0.74 },
        { x: 0.55, y: 0.76 }, { x: 0.69, y: 0.66 }, { x: 0.83, y: 0.69 }
      ];

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        w = canvas.clientWidth;
        h = canvas.clientHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        wisp = [];
        for (let i = 0; i < 16; i++) {
          wisp.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: 55 + Math.random() * 100,
            vx: (Math.random() - 0.5) * 0.1,
            vy: (Math.random() - 0.5) * 0.05,
            a: 0.025 + Math.random() * 0.045
          });
        }
      }

      function onBeat() {
        const idx = beat % STUTTER.length;
        const on = STUTTER[idx];
        const dropIdx = beat % DROP_COUNT;
        drops[dropIdx].classList.remove("hit", "miss");
        drops[dropIdx].classList.add(on ? "hit" : "miss");
        setTimeout(() => drops[dropIdx].classList.remove("hit", "miss"), BEAT_MS * 0.65);
        if (on) {
          kick.classList.add("kick");
          setTimeout(() => kick.classList.remove("kick"), 60);
          mbeat.style.width = "100%";
          setTimeout(() => { mbeat.style.width = "0"; }, BEAT_MS * 0.5);
        }
        beat++;
      }

      function tick() {
        const now = performance.now();
        if (now - lastBeat >= BEAT_MS) {
          lastBeat = now;
          onBeat();
        }
        requestAnimationFrame(tick);
      }

      function punch(x, y, good) {
        holes.push({ x, y, r: 0, max: good ? 42 + Math.random() * 24 : 16, life: 1 });
        reveal = Math.min(1, reveal + (good ? 0.09 : 0.015));
        if (reveal > 0.12) hill.classList.add("revealed");
        fogDensity = Math.max(0.32, fogDensity - (good ? 0.045 : 0.008));
        ring.style.left = x + "px";
        ring.style.top = y + "px";
        ring.classList.remove("on");
        void ring.offsetWidth;
        ring.classList.add("on");
        if (good) blip();
      }

      function blip() {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(88, t);
        o.frequency.exponentialRampToValueAtTime(52, t + 0.05);
        g.gain.setValueAtTime(0.1, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(t);
        o.stop(t + 0.1);
      }

      function onBeatWindow() {
        const elapsed = performance.now() - lastBeat;
        const phase = elapsed / BEAT_MS;
        return phase < 0.2 || phase > 0.86;
      }

      function draw() {
        ctx.fillStyle = "color(display-p3 0.30 0.33 0.37 / " + fogDensity + ")";
        ctx.fillRect(0, 0, w, h);

        for (const f of wisp) {
          f.x += f.vx;
          f.y += f.vy;
          if (f.x < -f.r) f.x = w + f.r;
          if (f.x > w + f.r) f.x = -f.r;
          if (f.y < -f.r) f.y = h + f.r;
          if (f.y > h + f.r) f.y = -f.r;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.strokeStyle = "color(display-p3 0.52 0.55 0.59 / " + f.a + ")";
          ctx.lineWidth = 0.45;
          ctx.stroke();
        }

        if (reveal > 0.1) {
          ctx.globalCompositeOperation = "lighter";
          for (const l of lights) {
            const lx = l.x * w;
            const ly = l.y * h;
            let lit = false;
            for (const hole of holes) {
              const dx = lx - hole.x;
              const dy = ly - hole.y;
              if (dx * dx + dy * dy < hole.r * hole.r * 2.2) { lit = true; break; }
            }
            if (lit || reveal > 0.55) {
              ctx.beginPath();
              ctx.arc(lx, ly, 3, 0, Math.PI * 2);
              ctx.fillStyle = "color(display-p3 1.0 0.76 0.08 / " + (lit ? 0.95 : 0.25 * reveal) + ")";
              ctx.fill();
              ctx.beginPath();
              ctx.arc(lx, ly, 10, 0, Math.PI * 2);
              ctx.fillStyle = "color(display-p3 1.0 0.76 0.08 / " + (lit ? 0.15 : 0.04 * reveal) + ")";
              ctx.fill();
            }
          }
          ctx.globalCompositeOperation = "source-over";
        }

        ctx.globalCompositeOperation = "destination-out";
        for (let i = holes.length - 1; i >= 0; i--) {
          const hole = holes[i];
          hole.r += (hole.max - hole.r) * 0.2;
          hole.life -= 0.0018;
          ctx.beginPath();
          ctx.arc(hole.x, hole.y, hole.r, 0, Math.PI * 2);
          ctx.fillStyle = "#000";
          ctx.fill();
          if (hole.life <= 0) holes.splice(i, 1);
        }
        ctx.globalCompositeOperation = "source-over";

        fogDensity = Math.min(0.85, fogDensity + 0.00035);
        requestAnimationFrame(draw);
      }

      function start() {
        if (started) return;
        started = true;
        hint.classList.add("gone");
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        lastBeat = performance.now();
        tick();
      }

      function handleTap(e) {
        if (e.target.closest("a")) return;
        start();
        const x = e.clientX ?? (e.touches && e.touches[0].clientX);
        const y = e.clientY ?? (e.touches && e.touches[0].clientY);
        punch(x, y, onBeatWindow());
      }

      document.addEventListener("pointerdown", handleTap);

      document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          start();
          punch(w * 0.5, h * 0.55, onBeatWindow());
        }
      });

      window.addEventListener("resize", resize);
      resize();
      draw();
    })();
  </script>
</body>
</html>
