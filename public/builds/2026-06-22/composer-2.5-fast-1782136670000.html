<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Nilsson</title>
  <style>
    :root {
      --void: color(display-p3 0.95 0.96 0.98);
      --paper: color(display-p3 0.06 0.05 0.08);
      --fog: color(display-p3 0.46 0.49 0.58);
      --hot: color(display-p3 1.0 0.02 0.36);
      --volt: color(display-p3 0.0 0.62 1.0);
      --acid: color(display-p3 0.62 1.0 0.0);
      --gold: color(display-p3 1.0 0.72 0.0);
      --dim: color(display-p3 0.40 0.42 0.46);
      --rule: color(display-p3 0.20 0.22 0.26 / 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --void: color(display-p3 0.06 0.05 0.08);
        --paper: color(display-p3 0.95 0.96 0.98);
        --fog: color(display-p3 0.46 0.49 0.58);
        --hot: color(display-p3 1.0 0.02 0.36);
        --volt: color(display-p3 0.0 0.62 1.0);
        --acid: color(display-p3 0.62 1.0 0.0);
        --gold: color(display-p3 1.0 0.72 0.0);
        --dim: color(display-p3 0.50 0.52 0.56);
        --rule: color(display-p3 0.54 0.56 0.60 / 0.24);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100dvh;
      background: var(--void);
      color: var(--paper);
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      cursor: crosshair;
      transition: background 0.05s ease;
    }

    body.flash { background: var(--hot); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100dvh;
      max-width: 640px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .hairline {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 61.8%;
      width: 2px;
      background: var(--volt);
      z-index: 1;
      pointer-events: none;
      transform: translateX(var(--px, 0));
      transition: transform 0.08s linear;
    }

    .notch {
      position: fixed;
      top: 0;
      left: 0;
      width: 5.5rem;
      height: 5.5rem;
      background: var(--gold);
      clip-path: polygon(0 0, 100% 0, 0 100%);
      z-index: 1;
      pointer-events: none;
      transform: translate(var(--nx, 0), var(--ny, 0));
    }

    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 1rem;
      padding: clamp(1.2rem, 3.5vw, 2rem) clamp(1.2rem, 3.5vw, 2rem) 0.75rem;
      border-bottom: 1px solid var(--rule);
    }

    .identity {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .firstname {
      font-family: "Helvetica Neue", "Arial Narrow", Arial, sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 700;
      font-stretch: condensed;
      letter-spacing: -0.04em;
      line-height: 1;
      text-transform: uppercase;
    }

    .surname {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.2rem;
      font-variant-numeric: tabular-nums;
      font-size: 0.64rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .columns {
      display: grid;
      grid-template-columns: 0.9fr 1fr 0.85fr 1.1fr;
      position: relative;
      min-height: 0;
      transition: grid-template-columns 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .columns.h-e { grid-template-columns: 1.35fr 0.8fr 0.75fr 0.9fr; }
    .columns.h-r { grid-template-columns: 0.75fr 1.4fr 0.75fr 0.9fr; }
    .columns.h-i { grid-template-columns: 0.75fr 0.8fr 1.35fr 0.9fr; }
    .columns.h-k { grid-template-columns: 0.75fr 0.8fr 0.75fr 1.45fr; }

    .beat-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 1px;
      z-index: 4;
      pointer-events: none;
    }

    .beat-bar span {
      background: color(display-p3 0.20 0.22 0.26);
      transform-origin: bottom;
      transition: background 0.035s ease, transform 0.035s ease;
    }

    .beat-bar span.on {
      background: var(--gold);
      transform: scaleY(2.2);
    }

    .beat-bar span.off {
      background: color(display-p3 0.34 0.36 0.40);
      transform: scaleY(1.4);
    }

    .col {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(1.2rem, 3vw, 2.2rem);
      overflow: hidden;
      border-right: 1px solid var(--rule);
      outline: none;
    }

    .col:last-child { border-right: none; }

    .col::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      transition: filter 0.25s ease;
    }

    .col-e::before { background: var(--fog); }
    .col-r::before { background: var(--hot); }
    .col-i::before { background: var(--volt); }
    .col-k::before { background: var(--acid); }

    .col:hover::before,
    .col:focus-visible::before { filter: brightness(1.08); }

    .col.stutter::before {
      animation: slice 0.22s steps(2, end) 5;
    }

    @keyframes slice {
      0%, 100% { transform: translateX(0) skewX(0); }
      20% { transform: translateX(-7px) skewX(-1.5deg); }
      40% { transform: translateX(6px) skewX(1deg); }
      60% { transform: translateX(-4px) skewX(0); }
      80% { transform: translateX(3px) skewX(-0.5deg); }
    }

    .glyph {
      position: relative;
      z-index: 1;
      font-family: "Helvetica Neue", "Arial Narrow", Arial, sans-serif;
      font-size: clamp(5.5rem, 24vw, 15rem);
      font-weight: 800;
      font-stretch: ultra-condensed;
      line-height: 0.76;
      letter-spacing: -0.07em;
      text-transform: uppercase;
      color: var(--void);
      mix-blend-mode: difference;
      pointer-events: none;
      user-select: none;
      transform: translateY(var(--lift, 0));
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .col:hover .glyph,
    .col:focus-visible .glyph,
    .col.open .glyph { --lift: -0.4rem; }

    .reveal {
      position: relative;
      z-index: 2;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.28s ease,
                  margin 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      margin-top: 0;
      font-size: 0.72rem;
      line-height: 1.4;
      letter-spacing: 0.01em;
      color: var(--void);
      mix-blend-mode: difference;
    }

    .col:hover .reveal,
    .col:focus-visible .reveal,
    .col.open .reveal {
      max-height: 5rem;
      opacity: 1;
      margin-top: 0.7rem;
    }

    .reveal a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1.5rem;
      padding: 0.85rem clamp(1.2rem, 3.5vw, 2rem) clamp(1.2rem, 3.5vw, 1.8rem);
      border-top: 1px solid var(--rule);
    }

    .pulse {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.03em;
      line-height: 1.45;
      color: var(--paper);
      max-width: 24ch;
      transition: color 0.12s ease;
    }

    .pulse.hit { color: var(--acid); }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.45rem 1.1rem;
    }

    nav a {
      font-size: 0.66rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      transition: color 0.12s;
      cursor: pointer;
    }

    nav a:hover { color: var(--gold); }

    .ring {
      position: fixed;
      width: 0;
      height: 0;
      border: 1.5px solid var(--acid);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      transform: translate(-50%, -50%);
      opacity: 0;
    }

    .ring.pop { animation: pop 0.34s ease-out forwards; }

    @keyframes pop {
      0% { width: 0; height: 0; opacity: 0.9; }
      100% { width: 48px; height: 48px; opacity: 0; }
    }

    .hint {
      position: fixed;
      bottom: 4.5rem;
      right: clamp(1.2rem, 3.5vw, 2rem);
      font-size: 0.56rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: color(display-p3 0.36 0.38 0.42);
      z-index: 5;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.7s;
    }

    .hint.gone { opacity: 0; }

    @media (max-width: 640px) {
      .columns,
      .columns.h-e, .columns.h-r, .columns.h-i, .columns.h-k {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: 1fr 1fr;
      }
      .col:nth-child(3) { border-bottom: 1px solid var(--rule); }
      .col:nth-child(2), .col:nth-child(4) { border-right: none; }
      .glyph { font-size: clamp(4.2rem, 30vw, 9rem); }
      .hairline, .notch { display: none; }
      .bottom { flex-direction: column; align-items: flex-start; }
      nav { justify-content: flex-start; }
      .hint { right: auto; left: clamp(1.2rem, 3.5vw, 2rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      body { cursor: auto; overflow: auto; }
      .beat-bar, .hint, .hairline, .notch, .ring { display: none; }
      .col::before, .glyph, .reveal, .columns { transition: none; animation: none; }
      .reveal { max-height: none; opacity: 1; margin-top: 0.5rem; }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <h1 class="sr-only">Erik Nilsson — Product Designer at Cursor</h1>

  <div class="notch" id="notch" aria-hidden="true"></div>
  <div class="hairline" id="hair" aria-hidden="true"></div>
  <div class="ring" id="ring" aria-hidden="true"></div>

  <div class="shell">
    <header class="top">
      <div class="identity">
        <span class="firstname">Erik</span>
        <span class="surname">Nilsson</span>
      </div>
      <div class="meta">
        <span>jun 22 · sf</span>
        <span>13° overcast</span>
      </div>
    </header>

    <section class="columns" id="cols" aria-label="Register">
      <div class="beat-bar" id="beat" aria-hidden="true"></div>

      <div class="col col-e" tabindex="0" data-col="e">
        <span class="glyph" aria-hidden="true">E</span>
        <p class="reveal">summer fog</p>
      </div>
      <div class="col col-r" tabindex="0" data-col="r">
        <span class="glyph" aria-hidden="true">R</span>
        <p class="reveal">product designer · <a href="https://cursor.com">Cursor</a></p>
      </div>
      <div class="col col-i" tabindex="0" data-col="i">
        <span class="glyph" aria-hidden="true">I</span>
        <p class="reveal">fred again.. · stutter house</p>
      </div>
      <div class="col col-k" tabindex="0" data-col="k">
        <span class="glyph" aria-hidden="true">K</span>
        <p class="reveal">imagine 2026</p>
      </div>
    </section>

    <footer class="bottom">
      <p class="pulse" id="pulse">shipping by sunrise</p>
      <nav>
        <a href="https://x.com/flowstated">X</a>
        <a href="https://github.com/eriknson">GitHub</a>
        <a href="https://linkedin.com/in/eriknson">LinkedIn</a>
        <a href="mailto:contact@eriks.design">Email</a>
      </nav>
    </footer>
  </div>

  <p class="hint" id="hint">tap the grid</p>

  <script>
    (function () {
      const BPM = 128;
      const BEAT = 60000 / BPM;
      const STUTTER = [1, 0, 1, 0, 1, 1, 0, 1, 1, 0, 1, 0, 1, 0, 1, 1];
      const LINES = [
        "imagine 2026",
        "shipping by sunrise",
        "agents from my phone"
      ];

      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const mobile = matchMedia("(max-width: 640px)").matches;

      const beatEl = document.getElementById("beat");
      const cols = document.getElementById("cols");
      const hint = document.getElementById("hint");
      const pulse = document.getElementById("pulse");
      const ring = document.getElementById("ring");
      const notch = document.getElementById("notch");
      const hair = document.getElementById("hair");
      const colEls = [...document.querySelectorAll(".col")];

      const ticks = [];
      let step = 0;
      let last = 0;
      let live = false;
      let line = 0;
      let audio = null;

      for (let i = 0; i < 16; i++) {
        const s = document.createElement("span");
        beatEl.appendChild(s);
        ticks.push(s);
      }

      function blip() {
        if (!audio) return;
        const t = audio.currentTime;
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = "square";
        o.frequency.setValueAtTime(110, t);
        o.frequency.exponentialRampToValueAtTime(55, t + 0.04);
        g.gain.setValueAtTime(0.07, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
        o.connect(g);
        g.connect(audio.destination);
        o.start(t);
        o.stop(t + 0.08);
      }

      function onBeat() {
        const i = step % 16;
        ticks.forEach((el, n) => {
          el.classList.remove("on", "off");
          if (n === i) el.classList.add(STUTTER[i] ? "on" : "off");
        });
        if (live && STUTTER[i]) {
          const c = colEls[i % 4];
          c.classList.remove("stutter");
          void c.offsetWidth;
          c.classList.add("stutter");
        }
        step++;
      }

      function loop(now) {
        if (now - last >= BEAT) {
          last = now;
          onBeat();
        }
        requestAnimationFrame(loop);
      }

      function wake() {
        if (live) return;
        live = true;
        hint.classList.add("gone");
        audio = new (window.AudioContext || window.webkitAudioContext)();
        last = performance.now();
      }

      function ripple(x, y) {
        ring.style.left = x + "px";
        ring.style.top = y + "px";
        ring.classList.remove("pop");
        void ring.offsetWidth;
        ring.classList.add("pop");
      }

      function hit(x, y) {
        wake();
        ripple(x, y);
        blip();
        document.body.classList.add("flash");
        setTimeout(() => document.body.classList.remove("flash"), 70);
        colEls.forEach((c, n) => {
          setTimeout(() => {
            c.classList.remove("stutter");
            void c.offsetWidth;
            c.classList.add("stutter");
          }, n * 38);
        });
        pulse.classList.add("hit");
        line = (line + 1) % LINES.length;
        pulse.textContent = LINES[line];
        setTimeout(() => pulse.classList.remove("hit"), 160);
      }

      cols.addEventListener("pointerenter", (e) => {
        const col = e.target.closest(".col");
        if (!col || mobile) return;
        cols.className = "columns h-" + col.dataset.col;
      });

      cols.addEventListener("pointerleave", () => {
        if (!mobile) cols.className = "columns";
      });

      colEls.forEach((col) => {
        col.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          if (mobile) {
            const open = col.classList.contains("open");
            colEls.forEach((c) => c.classList.remove("open"));
            if (!open) col.classList.add("open");
          }
          hit(e.clientX, e.clientY);
        });
      });

      document.addEventListener("pointerdown", (e) => {
        if (e.target.closest("a") || e.target.closest(".col")) return;
        hit(e.clientX, e.clientY);
      });

      document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          hit(innerWidth * 0.5, innerHeight * 0.5);
        }
      });

      if (!reduced) {
        document.addEventListener("pointermove", (e) => {
          const nx = (e.clientX / innerWidth - 0.5) * 10;
          const ny = (e.clientY / innerHeight - 0.5) * 8;
          const px = (e.clientX / innerWidth - 0.5) * 18;
          notch.style.setProperty("--nx", nx + "px");
          notch.style.setProperty("--ny", ny + "px");
          hair.style.setProperty("--px", px + "px");
        });
        requestAnimationFrame(loop);
      }
    })();
  </script>
</body>
</html>
