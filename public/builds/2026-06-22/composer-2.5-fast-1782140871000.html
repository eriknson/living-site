<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erik Nilsson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  background:var(--fog);
  color:var(--snow);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
:root{
  --fog:color(display-p3 0.47 0.50 0.53);
  --slate:color(display-p3 0.30 0.33 0.37);
  --mist:color(display-p3 0.60 0.63 0.66);
  --snow:color(display-p3 0.96 0.97 0.98);
  --void:color(display-p3 0.07 0.08 0.10);
  --pulse:color(display-p3 1.0 0.07 0.50);
  --wave:color(display-p3 0.0 0.96 0.86);
  --sting:color(display-p3 0.76 1.0 0.04);
  --dim:color(display-p3 0.47 0.50 0.53 / 0.55);
}
.site{
  position:fixed;inset:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(280px,3fr) minmax(0,1fr);
  grid-template-rows:auto 1fr auto;
  grid-template-areas:
    "left main right"
    "left main right"
    "foot foot foot";
  padding:
    max(16px,env(safe-area-inset-top))
    max(16px,env(safe-area-inset-right))
    max(12px,env(safe-area-inset-bottom))
    max(16px,env(safe-area-inset-left));
  gap:0 20px;
}
.identity{
  grid-area:left;
  display:flex;flex-direction:column;justify-content:space-between;
  padding-bottom:8px;
  min-width:0;
  border-left:3px solid var(--pulse);
  padding-left:14px;
}
.identity h1{
  font-family:'Syne',system-ui,sans-serif;
  font-weight:800;
  font-size:clamp(1.1rem,2.4vw,1.65rem);
  line-height:0.92;
  letter-spacing:-0.03em;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  align-self:flex-start;
  color:var(--snow);
}
.identity .role{
  font-size:clamp(0.58rem,1.1vw,0.68rem);
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--mist);
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  align-self:flex-end;
  margin-top:auto;
}
.signal{
  grid-area:right;
  display:flex;flex-direction:column;justify-content:space-between;
  align-items:flex-end;
  text-align:right;
  font-size:clamp(0.58rem,1.1vw,0.68rem);
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--mist);
  min-width:0;
}
.signal .temp{font-size:clamp(1.4rem,3vw,2rem);color:var(--snow);letter-spacing:-0.04em;line-height:1}
.signal .whisper{
  max-width:12ch;
  line-height:1.5;
  color:var(--dim);
  font-weight:300;
  text-transform:none;
  letter-spacing:0.02em;
  font-size:clamp(0.62rem,1.2vw,0.72rem);
}
.booth{
  grid-area:main;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  min-height:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#wave{
  width:100%;height:100%;
  display:block;
  touch-action:none;
}
.hit-line{
  position:absolute;
  top:8%;bottom:8%;
  left:72%;
  width:2px;
  background:var(--wave);
  pointer-events:none;
  opacity:0.85;
  box-shadow:0 0 12px color(display-p3 0.0 0.96 0.86 / 0.6);
}
.hit-line::before,.hit-line::after{
  content:'';
  position:absolute;left:50%;transform:translateX(-50%);
  width:8px;height:8px;
  background:var(--wave);
}
.hit-line::before{top:-4px}
.hit-line::after{bottom:-4px}
.hud{
  position:absolute;
  top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;
  font-size:clamp(0.58rem,1.2vw,0.7rem);
  letter-spacing:0.12em;
  text-transform:uppercase;
}
.hud .bpm{color:var(--pulse)}
.hud .bars{color:var(--sting)}
.hud .timer{color:var(--mist)}
.judge{
  position:absolute;
  left:50%;top:42%;
  transform:translate(-50%,-50%) scale(0.8);
  font-size:clamp(0.7rem,1.6vw,0.85rem);
  letter-spacing:0.28em;
  text-transform:uppercase;
  opacity:0;
  transition:opacity 0.1s,transform 0.1s;
  pointer-events:none;
}
.judge.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.judge.perfect{color:var(--wave)}
.judge.good{color:var(--sting)}
.judge.miss{color:var(--pulse)}
.tap-cue{
  position:absolute;
  bottom:12%;left:50%;transform:translateX(-50%);
  font-size:clamp(0.55rem,1.1vw,0.65rem);
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--mist);
  pointer-events:none;
  animation:blink 2.4s step-end infinite;
}
.tap-cue.off{opacity:0;animation:none}
@keyframes blink{50%{opacity:0.25}}
.glitch-layer{
  position:absolute;inset:0;
  pointer-events:none;overflow:hidden;
}
.glitch-frag{
  position:absolute;
  height:3px;
  background:var(--pulse);
  opacity:0.9;
  animation:glitch-out 0.45s steps(4) forwards;
}
@keyframes glitch-out{
  0%{transform:translateX(0);opacity:0.9}
  100%{transform:translateX(var(--dx,40px));opacity:0}
}
.foot{
  grid-area:foot;
  display:flex;justify-content:space-between;align-items:center;
  padding-top:10px;
  border-top:1px solid color(display-p3 0.38 0.41 0.45);
  font-size:clamp(0.58rem,1.1vw,0.68rem);
  letter-spacing:0.08em;
}
.foot a{
  color:var(--mist);
  text-decoration:none;
  transition:color 0.15s;
}
.foot a:hover,.foot a:focus-visible{color:var(--wave);outline:none}
.foot .links{display:flex;gap:clamp(12px,2.5vw,24px)}
.foot .tag{color:var(--dim);letter-spacing:0.14em;text-transform:uppercase}
.loop-panel{
  position:fixed;
  bottom:max(56px,env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--void);
  border:1px solid var(--slate);
  padding:14px 20px;
  display:flex;align-items:center;gap:16px;
  opacity:0;pointer-events:none;
  transition:opacity 0.35s,transform 0.35s;
  z-index:10;
}
.loop-panel.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.loop-panel span{
  font-size:0.62rem;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--mist);
}
.loop-panel button{
  font-family:inherit;
  font-size:0.62rem;
  letter-spacing:0.18em;
  text-transform:uppercase;
  background:var(--pulse);
  color:var(--snow);
  border:none;
  padding:10px 18px;
  cursor:pointer;
  transition:background 0.15s,transform 0.1s;
}
.loop-panel button:active{transform:scale(0.96)}
.loop-panel button.replay{background:var(--wave);color:var(--void)}
.loop-panel button:hover{background:color(display-p3 1.0 0.20 0.58)}
.loop-panel button.replay:hover{background:color(display-p3 0.15 1.0 0.92)}
.collapse-flash{
  position:fixed;inset:0;
  background:var(--pulse);
  opacity:0;pointer-events:none;
  z-index:20;
  transition:opacity 0.08s;
}
.collapse-flash.on{opacity:0.35}
@media(max-width:720px){
  .site{
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr auto auto;
    grid-template-areas:
      "left"
      "main"
      "right"
      "foot";
    gap:8px 0;
  }
  .identity{flex-direction:row;align-items:baseline;gap:12px;padding-bottom:0}
  .identity h1,.identity .role{
    writing-mode:horizontal-tb;transform:none;
  }
  .signal{flex-direction:row;align-items:baseline;gap:16px;text-align:left}
  .signal .whisper{margin-left:auto;text-align:right}
  .hit-line{left:78%}
  .booth{min-height:50vh}
}
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
<div class="site">
  <header class="identity">
    <h1>Erik Nilsson</h1>
    <p class="role">Cursor · SF</p>
  </header>

  <main class="booth" id="booth" aria-label="Rhythm booth — tap on the downbeat">
    <canvas id="wave"></canvas>
    <div class="hit-line" aria-hidden="true"></div>
    <div class="hud">
      <span class="bpm" id="bpm">124</span>
      <span class="timer" id="timer">30</span>
      <span class="bars" id="bars">0/4</span>
    </div>
    <div class="judge" id="judge"></div>
    <p class="tap-cue" id="tap-cue">tap the pulse</p>
    <div class="glitch-layer" id="glitches"></div>
  </main>

  <aside class="signal">
    <p class="temp">14°</p>
    <p class="whisper">overcast</p>
    <p class="whisper">fred again..</p>
  </aside>

  <footer class="foot">
    <span class="tag">imagine 2026</span>
    <nav class="links">
      <a href="https://cursor.com">cursor</a>
      <a href="https://x.com/flowstated">x</a>
      <a href="https://github.com/eriknson">github</a>
      <a href="mailto:contact@eriks.design">mail</a>
    </nav>
  </footer>
</div>

<div class="loop-panel" id="loop-panel">
  <span id="loop-label">4 bars locked</span>
  <button type="button" id="btn-replay" class="replay">replay</button>
  <button type="button" id="btn-again">again</button>
</div>
<div class="collapse-flash" id="flash"></div>

<script>
(function(){
'use strict';

const canvas = document.getElementById('wave');
const ctx = canvas.getContext('2d');
const booth = document.getElementById('booth');
const judgeEl = document.getElementById('judge');
const tapCue = document.getElementById('tap-cue');
const glitches = document.getElementById('glitches');
const loopPanel = document.getElementById('loop-panel');
const flash = document.getElementById('flash');
const bpmEl = document.getElementById('bpm');
const barsEl = document.getElementById('bars');
const timerEl = document.getElementById('timer');

const SESSION_MS = 30000;
const BEATS_PER_BAR = 4;
const TARGET_BARS = 4;
const MAX_GLITCH = 6;
const BPM_START = 124;
const BPM_END = 152;
const HIT_X_RATIO = 0.72;

const COLORS = {
  fog: 'color(display-p3 0.47 0.50 0.53)',
  slate: 'color(display-p3 0.30 0.33 0.37)',
  pulse: 'color(display-p3 1.0 0.07 0.50)',
  wave: 'color(display-p3 0.0 0.96 0.86)',
  sting: 'color(display-p3 0.76 1.0 0.04)',
  snow: 'color(display-p3 0.96 0.97 0.98)',
  mist: 'color(display-p3 0.60 0.63 0.66)'
};

let W, H, hitX, laneY, laneH;
let audioCtx = null;
let masterGain = null;
let playing = false;
let sessionStart = 0;
let sessionEnd = 0;
let bpm = BPM_START;
let beatIdx = 0;
let barCount = 0;
let glitchCount = 0;
let combo = 0;
let rafId = 0;
let lastFrame = 0;

const pulses = [];
const loopHits = [];
let hitFlash = 0;
let collapseT = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hitX = W * HIT_X_RATIO;
  laneY = H * 0.38;
  laneH = H * 0.24;
}
window.addEventListener('resize', resize);
resize();

function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.55;
  masterGain.connect(audioCtx.destination);
}

function playKick(time, vel){
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(42, time + 0.08);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(vel * 0.9, time + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.14);
  osc.connect(g).connect(masterGain);
  osc.start(time);
  osc.stop(time + 0.16);
}

function playHat(time, vel){
  const len = Math.floor(audioCtx.sampleRate * 0.04);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'highpass';
  f.frequency.value = 7000;
  g.gain.setValueAtTime(vel * 0.35, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
  src.connect(f).connect(g).connect(masterGain);
  src.start(time);
  src.stop(time + 0.04);
}

function playStab(time){
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(220 + Math.random() * 80, time);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(0.22, time + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.09);
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 1200;
  osc.connect(f).connect(g).connect(masterGain);
  osc.start(time);
  osc.stop(time + 0.1);
}

function playStutter(time){
  const len = Math.floor(audioCtx.sampleRate * 0.06);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++){
    const t = i / len;
    d[i] = Math.sin(i * 0.35) * (1 - t) * 0.6;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = 0.85 + Math.random() * 0.3;
  const g = audioCtx.createGain();
  g.gain.value = 0.4;
  src.connect(g).connect(masterGain);
  src.start(time);
  src.stop(time + 0.07);
}

function beatInterval(){ return 60000 / bpm; }

function schedulePattern(){
  if(!playing || !audioCtx) return;
  const now = audioCtx.currentTime;
  const lookAhead = 0.2;
  const scheduleUntil = now + lookAhead;

  while(nextBeatTime < scheduleUntil){
    const bi = scheduledBeat;
    const barBeat = bi % BEATS_PER_BAR;
    const vel = 0.7 + (barCount / TARGET_BARS) * 0.2;

    if(barBeat === 0) playKick(nextBeatTime, vel);
    else if(barBeat === 2) playKick(nextBeatTime, vel * 0.75);
    if(barBeat === 1 || barBeat === 3) playHat(nextBeatTime, 0.5 + glitchCount * 0.04);

    if(glitchCount > 2 && barBeat === 0 && Math.random() < glitchCount * 0.08){
      playStutter(nextBeatTime + 0.04);
    }

    spawnPulse(nextBeatTime);
    scheduledBeat++;
    nextBeatTime += beatInterval() / 1000;

    if(scheduledBeat % BEATS_PER_BAR === 0){
      const newBar = Math.floor(scheduledBeat / BEATS_PER_BAR);
      if(newBar > barCount){
        barCount = Math.min(newBar, TARGET_BARS);
        barsEl.textContent = barCount + '/' + TARGET_BARS;
      }
    }
    if(scheduledBeat % 8 === 0 && bpm < BPM_END){
      bpm = Math.min(BPM_END, bpm + 2);
      bpmEl.textContent = bpm;
    }
  }
}

let nextBeatTime = 0;
let scheduledBeat = 0;
let sessionTimer = null;

function spawnPulse(audioTime){
  pulses.push({
    audioTime,
    hit: false,
    missed: false,
    color: beatIdx % BEATS_PER_BAR === 0 ? 'pulse' : (beatIdx % 2 === 0 ? 'wave' : 'sting'),
    id: beatIdx++
  });
}

function startSession(){
  initAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume();

  playing = true;
  sessionStart = performance.now();
  sessionEnd = sessionStart + SESSION_MS;
  bpm = BPM_START;
  beatIdx = 0;
  barCount = 0;
  glitchCount = 0;
  combo = 0;
  scheduledBeat = 0;
  pulses.length = 0;
  loopHits.length = 0;
  nextBeatTime = audioCtx.currentTime + 0.15;

  bpmEl.textContent = bpm;
  barsEl.textContent = '0/4';
  timerEl.textContent = '30';
  tapCue.classList.add('off');
  loopPanel.classList.remove('on');

  if(sessionTimer) clearInterval(sessionTimer);
  sessionTimer = setInterval(() => {
    const left = Math.ceil((sessionEnd - performance.now()) / 1000);
    timerEl.textContent = Math.max(0, left);
    if(left <= 0) endSession('time');
  }, 250);

  if(rafId) cancelAnimationFrame(rafId);
  lastFrame = performance.now();
  tick();
}

function endSession(reason){
  playing = false;
  if(sessionTimer){ clearInterval(sessionTimer); sessionTimer = null; }

  if(reason === 'collapse'){
    collapseT = 1;
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 120);
    setTimeout(() => {
      tapCue.classList.remove('off');
      tapCue.textContent = 'rebuild';
    }, 400);
  } else if(loopHits.length >= BEATS_PER_BAR){
    const exportBpm = bpm;
    loopPanel.classList.add('on');
    document.getElementById('loop-label').textContent =
      '4 bars · ' + exportBpm + ' bpm';
    loopPanel.dataset.bpm = exportBpm;
    tapCue.classList.add('off');
  } else {
    tapCue.classList.remove('off');
    tapCue.textContent = reason === 'time' ? 'time' : 'tap the pulse';
  }
}

function registerMiss(){
  glitchCount++;
  combo = 0;
  spawnGlitch();
  if(glitchCount >= MAX_GLITCH) endSession('collapse');
}

function spawnGlitch(){
  const el = document.createElement('div');
  el.className = 'glitch-frag';
  const w = 30 + Math.random() * 120;
  el.style.width = w + 'px';
  el.style.left = (Math.random() * 80 + 10) + '%';
  el.style.top = (laneY + Math.random() * laneH) + 'px';
  el.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
  el.style.background = Math.random() > 0.5 ? COLORS.pulse : COLORS.sting;
  glitches.appendChild(el);
  setTimeout(() => el.remove(), 500);
}

function showJudge(text, cls){
  judgeEl.textContent = text;
  judgeEl.className = 'judge on ' + cls;
  clearTimeout(showJudge._t);
  showJudge._t = setTimeout(() => judgeEl.classList.remove('on'), 220);
}

function handleTap(){
  if(!playing){
    startSession();
    return;
  }
  if(!audioCtx) return;

  const now = audioCtx.currentTime;
  let best = null;
  let bestDiff = Infinity;

  for(const p of pulses){
    if(p.hit) continue;
    const diff = Math.abs(now - p.audioTime);
    if(diff < bestDiff && diff < 0.28){
      bestDiff = diff;
      best = p;
    }
  }

  if(!best){
    showJudge('—', 'miss');
    return;
  }

  const ms = bestDiff * 1000;
  let quality;
  if(ms < 55){ quality = 'perfect'; combo++; }
  else if(ms < 110){ quality = 'good'; combo = Math.max(1, combo); }
  else { quality = 'miss'; combo = 0; }

  if(quality === 'miss'){
    best.hit = true;
    registerMiss();
    showJudge('miss', 'miss');
    return;
  }

  best.hit = true;
  const t = audioCtx.currentTime;
  playStab(t);
  if(quality === 'perfect') playStutter(t + 0.05);
  const beatOffset = loopHits.length ? t - loopHits[0].time : 0;
  loopHits.push({ time: t, offset: beatOffset, quality, color: best.color });
  hitFlash = 1;
  showJudge(quality, quality);
}

booth.addEventListener('pointerdown', e => {
  e.preventDefault();
  handleTap();
});
document.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); handleTap(); }
});

function drawWaveform(t){
  const laneTop = laneY;
  const mid = laneTop + laneH / 2;

  ctx.fillStyle = COLORS.fog;
  ctx.fillRect(0, 0, W, H);

  if(collapseT > 0){
    ctx.fillStyle = COLORS.pulse;
    ctx.globalAlpha = collapseT * 0.4;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    collapseT -= 0.04;
  }

  ctx.fillStyle = COLORS.slate;
  ctx.fillRect(0, laneTop - 8, W, laneH + 16);

  ctx.strokeStyle = COLORS.mist;
  ctx.globalAlpha = playing ? 0.1 : 0.05;
  ctx.lineWidth = 1;
  const gridStep = Math.max(32, W / 14);
  for(let gx = hitX; gx > 0; gx -= gridStep){
    ctx.beginPath();
    ctx.moveTo(gx, laneTop);
    ctx.lineTo(gx, laneTop + laneH);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  if(hitFlash > 0){
    ctx.fillStyle = COLORS.wave;
    ctx.globalAlpha = hitFlash * 0.18;
    ctx.fillRect(hitX - 50, laneTop - 12, 100, laneH + 24);
    ctx.globalAlpha = 1;
    hitFlash *= 0.82;
    if(hitFlash < 0.02) hitFlash = 0;
  }

  const amp = playing ? 0.35 + combo * 0.02 + glitchCount * 0.04 : 0.12;
  ctx.beginPath();
  for(let x = 0; x <= W; x += 2){
    const norm = x / W;
    const y = mid +
      Math.sin(norm * 14 + t * 0.004) * laneH * amp * 0.22 +
      Math.sin(norm * 7 - t * 0.003) * laneH * amp * 0.14 +
      (playing ? Math.sin(norm * 28 + t * 0.008) * laneH * 0.04 : 0);
    if(x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = playing ? COLORS.wave : COLORS.mist;
  ctx.lineWidth = playing ? 1.5 : 1;
  ctx.globalAlpha = playing ? 0.7 : 0.35;
  ctx.stroke();
  ctx.globalAlpha = 1;

  if(glitchCount > 0){
    for(let i = 0; i < glitchCount; i++){
      const gy = laneTop + (i * 17 + (t * 0.1) % 40) % laneH;
      ctx.fillStyle = i % 2 ? COLORS.pulse : COLORS.sting;
      ctx.globalAlpha = 0.25 + (t % 300) / 600;
      ctx.fillRect(0, gy, W, 2);
    }
    ctx.globalAlpha = 1;
  }
}

function drawPulses(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const travel = W * 0.85;
  const speed = travel / (beatInterval() / 1000);

  for(let i = pulses.length - 1; i >= 0; i--){
    const p = pulses[i];
    const elapsed = now - p.audioTime;
    const x = hitX - elapsed * speed;

    if(!p.hit && !p.missed && elapsed > 0.13){
      p.missed = true;
      registerMiss();
    }

    if(x < -40 || (p.hit && elapsed > 0.15)){
      if(elapsed > 0.5) pulses.splice(i, 1);
      continue;
    }

    const isDown = p.color === 'pulse';
    const w = isDown ? 14 : 8;
    const h = isDown ? laneH * 0.7 : laneH * 0.4;
    const y = laneY + (laneH - h) / 2;

    ctx.fillStyle = COLORS[p.color];
    ctx.globalAlpha = p.hit ? 0.25 : (isDown ? 0.95 : 0.65);
    ctx.fillRect(x - w / 2, y, w, h);

    if(!p.hit && Math.abs(x - hitX) < 20){
      ctx.globalAlpha = 0.15;
      ctx.fillRect(hitX - 30, laneY, 60, laneH);
    }
    ctx.globalAlpha = 1;
  }
}

function tick(){
  const t = performance.now();
  schedulePattern();
  drawWaveform(t);
  drawPulses();

  if(playing && barCount >= TARGET_BARS && loopHits.length >= BEATS_PER_BAR * 2){
    endSession('complete');
  }

  lastFrame = t;
  rafId = requestAnimationFrame(tick);
}

tick();

document.getElementById('btn-replay').addEventListener('click', () => {
  if(!audioCtx || !loopHits.length) return;
  const exportBpm = parseInt(loopPanel.dataset.bpm || bpm, 10);
  const interval = 60 / exportBpm;
  const start = audioCtx.currentTime + 0.05;
  const base = loopHits[0].time;

  loopHits.forEach(h => {
    const rel = h.offset !== undefined ? h.offset : h.time - base;
    const t = start + rel;
    playStab(t);
    if(h.quality === 'perfect') playStutter(t + interval * 0.12);
  });

  playKick(start, 0.8);
  playKick(start + interval * 2, 0.7);
  playKick(start + interval * BEATS_PER_BAR * TARGET_BARS, 0.65);
});

document.getElementById('btn-again').addEventListener('click', () => {
  loopPanel.classList.remove('on');
  startSession();
});

})();
</script>
