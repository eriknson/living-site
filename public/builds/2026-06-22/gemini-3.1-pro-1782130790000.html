<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Nilsson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: 50vw;
    --c2: 50vw;
    --r1: 50vh;
    --r2: 50vh;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #000;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* The Grid */
  .grid {
    display: grid;
    width: 100%;
    height: 100%;
    grid-template-columns: var(--c1) var(--c2);
    grid-template-rows: var(--r1) var(--r2);
    transition: grid-template-columns 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                grid-template-rows 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Hover logic */
  @media (hover: hover) {
    .grid:has(.pane-tl:hover) { --c1: 65vw; --c2: 35vw; --r1: 65vh; --r2: 35vh; }
    .grid:has(.pane-tr:hover) { --c1: 35vw; --c2: 65vw; --r1: 65vh; --r2: 35vh; }
    .grid:has(.pane-bl:hover) { --c1: 65vw; --c2: 35vw; --r1: 35vh; --r2: 65vh; }
    .grid:has(.pane-br:hover) { --c1: 35vw; --c2: 65vw; --r1: 35vh; --r2: 65vh; }
  }

  .pane {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Fallback Colors */
  .pane-tl { background-color: #E6FF00; color: #000; }
  .pane-tr { background-color: #FF2E00; color: #FFF; }
  .pane-bl { background-color: #0011FF; color: #FFF; }
  .pane-br { background-color: #00FFAA; color: #000; }

  /* Luminous Display-P3 Colors */
  @supports (color: color(display-p3 1 1 1)) {
    .pane-tl { background-color: color(display-p3 0.9 1 0); }
    .pane-tr { background-color: color(display-p3 1 0.1 0); }
    .pane-bl { background-color: color(display-p3 0 0.05 1); }
    .pane-br { background-color: color(display-p3 0 1 0.7); }
  }

  .content-wrapper {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .parallax {
    font-size: 14vw;
    font-weight: 800;
    line-height: 0.85;
    letter-spacing: -0.04em;
    white-space: nowrap;
    text-align: center;
    will-change: transform;
    animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Staggered entrance */
  .pane-tl .parallax { animation-delay: 0.1s; }
  .pane-tr .parallax { animation-delay: 0.2s; }
  .pane-bl .parallax { animation-delay: 0.3s; }
  .pane-br .parallax { animation-delay: 0.4s; }

  .meta {
    position: absolute;
    bottom: 2.5rem;
    left: 2.5rem;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.5;
    z-index: 10;
    animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: 0.6s;
  }

  .meta-title {
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    margin-bottom: 0.75rem;
    opacity: 0.6;
    text-transform: uppercase;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .links a {
    display: inline-block;
    color: inherit;
    text-decoration: none;
    font-weight: 600;
    position: relative;
    width: max-content;
    pointer-events: auto;
  }

  .links a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background-color: currentColor;
    transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .links a:hover::after {
    width: 100%;
  }

  .center-mark {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    color: white;
    mix-blend-mode: difference;
    pointer-events: none;
    animation: fadeIn 2s ease both 1s;
  }

  @keyframes slideUp {
    from { transform: translateY(8vh); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: #0d0d0d;
    }
  }

  /* Mobile optimizations */
  @media (max-width: 640px) {
    .grid {
      grid-template-columns: 100vw !important;
      grid-template-rows: var(--r1) var(--r2) var(--r3) var(--r4) !important;
      overflow-y: auto;
      height: 100dvh;
    }
    :root {
      --r1: 25dvh; --r2: 25dvh; --r3: 25dvh; --r4: 25dvh;
    }
    .grid:has(.pane-tl:active) { --r1: 40dvh; --r2: 20dvh; --r3: 20dvh; --r4: 20dvh; }
    .grid:has(.pane-tr:active) { --r1: 20dvh; --r2: 40dvh; --r3: 20dvh; --r4: 20dvh; }
    .grid:has(.pane-bl:active) { --r1: 20dvh; --r2: 20dvh; --r3: 40dvh; --r4: 20dvh; }
    .grid:has(.pane-br:active) { --r1: 20dvh; --r2: 20dvh; --r3: 20dvh; --r4: 40dvh; }

    .parallax {
      font-size: 22vw;
    }
    
    .meta {
      bottom: 1.5rem;
      left: 1.5rem;
    }
    
    .center-mark {
      display: none;
    }
  }
</style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>

<div class="container">
<div class="center-mark">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 2v20M2 12h20"/>
  </svg>
</div>

<div class="grid">
  <!-- Pane TL -->
  <div class="pane pane-tl">
    <div class="content-wrapper">
      <div class="parallax">ERIK<br>NILSSON</div>
    </div>
    <div class="meta">
      <div class="meta-title">IDENTITY</div>
      PRODUCT DESIGNER<br>
      @ CURSOR
    </div>
  </div>

  <!-- Pane TR -->
  <div class="pane pane-tr">
    <div class="content-wrapper">
      <div class="parallax">SAN<br>FRANCISCO</div>
    </div>
    <div class="meta">
      <div class="meta-title">2026.06.22 / WEATHER</div>
      12°C — FOGGY<br>
      "FOG ROLLING THROUGH SAN FRANCISCO BEFORE DAWN"
    </div>
  </div>

  <!-- Pane BL -->
  <div class="pane pane-bl">
    <div class="content-wrapper">
      <div class="parallax">LIVING<br>SITE</div>
    </div>
    <div class="meta">
      <div class="meta-title">CURRENT STATUS</div>
      TINKERING WITH AGENTS<br>
      LISTENING TO FRED AGAIN..
    </div>
  </div>

  <!-- Pane BR -->
  <div class="pane pane-br">
    <div class="content-wrapper">
      <div class="parallax">INDEX</div>
    </div>
    <div class="meta links">
      <div class="meta-title">LINKS</div>
      <a href="https://cursor.com" target="_blank">CURSOR</a>
      <a href="https://x.com/flowstated" target="_blank">X (TWITTER)</a>
      <a href="https://github.com/eriknson" target="_blank">GITHUB</a>
      <a href="https://linkedin.com/in/eriknson" target="_blank">LINKEDIN</a>
      <a href="mailto:contact@eriks.design">EMAIL</a>
    </div>
  </div>
</div>
</div>

<script>
  // Smooth parallax tracking for the massive typography
  if (window.matchMedia("(pointer: fine)").matches) {
    const parallaxes = document.querySelectorAll('.parallax');
    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;

    document.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth - 0.5) * -80;
      targetY = (e.clientY / window.innerHeight - 0.5) * -80;
    });

    function animate() {
      // Lerp for weight and fluidity
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;
      
      parallaxes.forEach(el => {
        el.style.transform = `translate(${currentX}px, ${currentY}px)`;
      });
      
      requestAnimationFrame(animate);
    }
    animate();
  }
</script>
</body>
</html>
