<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erik Nilsson — Product Designer</title>
  <style>
    :root {
      --bg: #d9fc0d;
      --fg: #050505;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --fg: #e0e0e0;
      }
    }

    @supports (color: color(display-p3 1 1 1)) {
      :root {
        --bg: color(display-p3 0.85 0.99 0.05); /* Acid Yellow */
        --fg: color(display-p3 0.02 0.02 0.02); /* Near Black */
      }
      body:has(.link-cursor:hover) {
        --bg: color(display-p3 0.1 0.2 0.98); /* Electric Blue */
        --fg: color(display-p3 0.98 0.98 0.98); /* White */
      }
      body:has(.link-x:hover) {
        --bg: color(display-p3 0.02 0.02 0.02); /* Black */
        --fg: color(display-p3 0.98 0.98 0.98); /* White */
      }
      body:has(.link-github:hover) {
        --bg: color(display-p3 0.1 0.98 0.3); /* Neon Green */
        --fg: color(display-p3 0.02 0.02 0.02); /* Black */
      }
      body:has(.link-linkedin:hover) {
        --bg: color(display-p3 0.98 0.1 0.6); /* Hot Pink */
        --fg: color(display-p3 0.98 0.98 0.98); /* White */
      }
      body:has(.link-email:hover) {
        --bg: color(display-p3 0.98 0.4 0.05); /* Vibrant Orange */
        --fg: color(display-p3 0.02 0.02 0.02); /* Black */
      }
    }

    body:has(.link-cursor:hover) {
      --bg: #1a33fa;
      --fg: #fafafa;
    }
    body:has(.link-x:hover) {
      --bg: #050505;
      --fg: #fafafa;
    }
    body:has(.link-github:hover) {
      --bg: #1afa4d;
      --fg: #050505;
    }
    body:has(.link-linkedin:hover) {
      --bg: #fa1a99;
      --fg: #fafafa;
    }
    body:has(.link-email:hover) {
      --bg: #fa660d;
      --fg: #050505;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 3vw;
      height: 100vh;
      box-sizing: border-box;
      font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.5s cubic-bezier(0.22, 1, 0.36, 1), color 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status {
      position: absolute;
      top: 3vw;
      right: 3vw;
      font-size: 0.85vw;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .layout {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      flex-grow: 1;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }

    .main-text {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .first-name, .last-name {
      font-size: clamp(6rem, 16vw, 24rem);
      line-height: 0.8;
      font-weight: 700;
      letter-spacing: -0.05em;
      margin: 0;
      margin-left: -0.05em; /* Optical alignment */
      text-transform: uppercase;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: clamp(0.9rem, 1.25vw, 2rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .info p {
      margin: 0;
    }

    .links {
      display: flex;
      gap: clamp(1.5rem, 2.5vw, 4rem);
    }

    a {
      color: inherit;
      text-decoration: none;
      position: relative;
      padding-bottom: 0.1em;
    }

    a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 0.08em;
      background-color: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    @media (max-width: 768px) {
      body {
        padding: 6vw;
      }
      .status {
        top: 6vw;
        right: 6vw;
        font-size: 0.7rem;
        max-width: 50%;
        text-align: right;
        line-height: 1.4;
      }
      .meta {
        flex-direction: column;
        align-items: flex-start;
        gap: 3rem;
      }
      .links {
        flex-wrap: wrap;
        gap: 1.5rem;
      }
      .first-name, .last-name {
        font-size: 22vw;
      }
    }
  </style>

<style id="__living_site_scroll_guard">
  /* Scroll guard injected at build time to ensure generated pages remain scrollable in iframes. */
  html, body {
    height: auto !important;
    min-height: 100% !important;
    max-height: none !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    position: static !important;
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-y !important;
    overscroll-behavior-y: contain !important;
  }
  /* Avoid accidental fixed full-screen traps that break scrolling on mobile. */
  body {
    inset: auto !important;
  }
</style>
</head>
<body>
  <div class="status">
    14°C OVERCAST, SF<br>
    LISTENING TO FRED AGAIN..
  </div>

  <div class="layout">
    <div class="main-text">
      <div class="first-name">ERIK</div>
      <div class="last-name">NILSSON</div>
    </div>
    
    <div class="meta">
      <div class="info">
        <p>PRODUCT DESIGNER @ CURSOR</p>
        <p>SAN FRANCISCO, CA</p>
      </div>
      
      <div class="links">
        <a href="https://cursor.com" class="link-cursor">CURSOR</a>
        <a href="https://x.com/flowstated" class="link-x">X</a>
        <a href="https://github.com/eriknson" class="link-github">GITHUB</a>
        <a href="https://linkedin.com/in/eriknson" class="link-linkedin">LINKEDIN</a>
        <a href="mailto:contact@eriks.design" class="link-email">EMAIL</a>
      </div>
    </div>
  </div>
</body>
</html>
