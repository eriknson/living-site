<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build History | Erik</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
      padding: 3rem 1rem;
      line-height: 1.5;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      color: #666;
      text-decoration: none;
      font-size: 0.8125rem;
    }
    .back-link:hover {
      color: #111;
    }
    h1 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      font-size: 0.8125rem;
      color: #666;
      margin-bottom: 2.5rem;
    }
    
    /* Table */
    .builds-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e5e5;
    }
    .builds-table th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      border-bottom: 1px solid #e5e5e5;
      background: #fafafa;
    }
    .builds-table td {
      padding: 0.875rem 1rem;
      font-size: 0.875rem;
      border-bottom: 1px solid #f0f0f0;
    }
    .builds-table tr:last-child td {
      border-bottom: none;
    }
    
    /* Batch rows */
    .batch-row {
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .batch-row:hover {
      background: #fafafa;
    }
    .batch-row td:first-child {
      font-weight: 500;
    }
    .batch-row .time-relative {
      color: #111;
    }
    .batch-row .time-exact {
      color: #999;
      font-size: 0.75rem;
      margin-left: 0.5rem;
      font-weight: 400;
    }
    .batch-row .models-count {
      color: #666;
    }
    .batch-row .duration-range {
      color: #666;
      font-variant-numeric: tabular-nums;
    }
    .batch-row .chevron {
      color: #ccc;
      font-size: 0.625rem;
      margin-left: 0.5rem;
      transition: transform 0.15s ease;
      display: inline-block;
    }
    .batch-row.expanded .chevron {
      transform: rotate(90deg);
    }
    
    /* Model sub-rows */
    .model-row {
      background: #fafafa;
    }
    .model-row.hidden {
      display: none;
    }
    .model-row td {
      padding: 0.625rem 1rem;
      font-size: 0.8125rem;
      color: #666;
      border-bottom: 1px solid #f0f0f0;
    }
    .model-row td:first-child {
      padding-left: 2rem;
    }
    .model-row .model-name {
      color: #444;
    }
    .model-row .model-link {
      color: #0066cc;
      text-decoration: none;
      font-variant-numeric: tabular-nums;
    }
    .model-row .model-link:hover {
      text-decoration: underline;
    }
    .model-row .failed {
      color: #999;
    }
    
    /* States */
    .loading, .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #666;
      font-size: 0.875rem;
    }
    
    @media (max-width: 480px) {
      body {
        padding: 2rem 0.875rem;
      }
      .batch-row .time-exact {
        display: none;
      }
      .builds-table th,
      .builds-table td {
        padding: 0.75rem 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back</a>
    
    <header>
      <h1>Build History</h1>
      <p class="subtitle">Daily regenerations from multiple AI models</p>
    </header>
    
    <div id="loading" class="loading">Loading...</div>
    
    <table id="builds-table" class="builds-table" style="display: none;">
      <thead>
        <tr>
          <th>Time</th>
          <th>Models</th>
          <th>Duration</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    
    <div id="empty-state" class="empty-state" style="display: none;">
      No builds yet.
    </div>
  </div>

  <script>
    const modelNames = {
      'composer-1': 'Composer 1',
      'claude-4.5-opus-high-thinking': 'Opus 4.5',
      'gpt-5.1-codex': 'GPT-5.1 Codex',
      'gpt-5.1-codex-max-low-fast': 'GPT-5.1 Codex Max'
    };
    
    const modelSlugs = {
      'composer-1': null, // default, goes to /
      'claude-4.5-opus-high-thinking': 'opus-4.5',
      'gpt-5.1-codex': 'gpt-5.1-codex',
      'gpt-5.1-codex-max-low-fast': 'gpt-5.1-codex-max'
    };
    
    function getModelUrl(model, defaultModel) {
      if (model === defaultModel) return '/';
      return '/' + (modelSlugs[model] || model);
    }
    
    function relativeTime(isoTimestamp) {
      const date = new Date(isoTimestamp);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      
      if (diffMins < 1) return 'just now';
      if (diffMins === 1) return '1 min ago';
      if (diffMins < 60) return `${diffMins} mins ago`;
      if (diffHours === 1) return '1 hour ago';
      if (diffHours < 24) return `${diffHours} hours ago`;
      if (diffDays === 1) return 'yesterday';
      if (diffDays < 7) return `${diffDays} days ago`;
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    
    function exactTime(isoTimestamp) {
      const date = new Date(isoTimestamp);
      return date.toLocaleString('en-US', { 
        month: 'short', 
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }
    
    function formatDuration(ms) {
      if (!ms) return '—';
      const seconds = ms / 1000;
      if (seconds < 60) return Math.round(seconds) + 's';
      const mins = Math.floor(seconds / 60);
      const secs = Math.round(seconds % 60);
      return `${mins}m ${secs}s`;
    }
    
    function formatDurationRange(builds) {
      const durations = builds.filter(b => b.duration_ms).map(b => b.duration_ms);
      if (durations.length === 0) return '—';
      
      const min = Math.min(...durations);
      const max = Math.max(...durations);
      
      if (min === max || durations.length === 1) return formatDuration(min);
      return `${formatDuration(min)} – ${formatDuration(max)}`;
    }
    
    function groupBuildsByBatch(builds) {
      const batches = [];
      let currentBatch = null;
      
      // Sort by timestamp descending
      const sorted = [...builds].sort((a, b) => 
        new Date(b.timestamp) - new Date(a.timestamp)
      );
      
      for (const build of sorted) {
        const buildTime = new Date(build.timestamp).getTime();
        
        // New batch if >5 minutes apart from previous
        if (!currentBatch || currentBatch.timestamp - buildTime > 300000) {
          currentBatch = {
            id: build.id,
            timestamp: buildTime,
            isoTimestamp: build.timestamp,
            builds: []
          };
          batches.push(currentBatch);
        }
        currentBatch.builds.push(build);
      }
      
      return batches;
    }
    
    async function loadBuilds() {
      const loadingEl = document.getElementById('loading');
      const tableEl = document.getElementById('builds-table');
      const tableBodyEl = document.getElementById('table-body');
      const emptyEl = document.getElementById('empty-state');
      
      try {
        const [manifestRes, historyRes] = await Promise.all([
          fetch('/builds/manifest.json'),
          fetch('/builds/history.json')
        ]);
        
        const manifest = await manifestRes.json();
        const history = await historyRes.json();
        
        loadingEl.style.display = 'none';
        
        if (!history.builds || history.builds.length === 0) {
          emptyEl.style.display = 'block';
          return;
        }
        
        const batches = groupBuildsByBatch(history.builds);
        const defaultModel = manifest.default_model;
        
        let html = '';
        
        for (const batch of batches) {
          const batchId = batch.id;
          const successBuilds = batch.builds.filter(b => b.status === 'success' && b.duration_ms);
          const modelCount = batch.builds.length;
          
          html += `
            <tr class="batch-row" data-batch="${batchId}" onclick="toggleBatch('${batchId}')">
              <td>
                <span class="time-relative">${relativeTime(batch.isoTimestamp)}</span>
                <span class="time-exact">${exactTime(batch.isoTimestamp)}</span>
                <span class="chevron">▶</span>
              </td>
              <td class="models-count">${modelCount} model${modelCount !== 1 ? 's' : ''}</td>
              <td class="duration-range">${formatDurationRange(batch.builds)}</td>
            </tr>
          `;
          
          for (const build of batch.builds) {
            const name = modelNames[build.model] || build.model;
            const duration = formatDuration(build.duration_ms);
            const url = getModelUrl(build.model, defaultModel);
            const isFailed = build.status !== 'success' || !build.duration_ms;
            
            html += `
              <tr class="model-row hidden" data-batch="${batchId}">
                <td><span class="model-name">${name}</span></td>
                <td></td>
                <td>${isFailed 
                  ? '<span class="failed">failed</span>' 
                  : `<a href="${url}" class="model-link">${duration} →</a>`
                }</td>
              </tr>
            `;
          }
        }
        
        tableBodyEl.innerHTML = html;
        tableEl.style.display = 'table';
        
      } catch (err) {
        loadingEl.textContent = 'Failed to load builds';
        console.error('Failed to load builds:', err);
      }
    }
    
    function toggleBatch(batchId) {
      const batchRow = document.querySelector(`.batch-row[data-batch="${batchId}"]`);
      const modelRows = document.querySelectorAll(`.model-row[data-batch="${batchId}"]`);
      
      batchRow.classList.toggle('expanded');
      modelRows.forEach(row => row.classList.toggle('hidden'));
    }
    
    loadBuilds();
  </script>
</body>
</html>
