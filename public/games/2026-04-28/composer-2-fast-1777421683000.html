<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Commit Petals — composer-2-fast</title>
  <style>
    :root {
      --bg0: #0d1218;
      --bg1: #1a252e;
      --fog: rgba(232, 184, 120, 0.08);
      --ink: #e8eef2;
      --muted: #8a9aa8;
      --accent: #3dd9c8;
      --accent2: #ffb070;
      --bad: #ff6b5c;
      --lane: rgba(61, 217, 200, 0.15);
      --hud: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg0: #e8eef2;
        --bg1: #cfd8dc;
        --fog: rgba(40, 80, 120, 0.12);
        --ink: #0d1218;
        --muted: #4a5a68;
        --accent: #00897b;
        --accent2: #e65100;
        --bad: #c62828;
        --lane: rgba(0, 137, 123, 0.12);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: var(--bg0);
      color: var(--ink);
      font-family: var(--hud);
      -webkit-tap-highlight-color: transparent;
    }
    #wrap {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }
    #hud {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(12px, env(safe-area-inset-top)) 16px 8px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
      user-select: none;
      z-index: 2;
    }
    #hud strong { color: var(--ink); font-weight: 600; }
    #canvas-wrap {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      touch-action: none;
      user-select: none;
    }
    canvas#game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(13, 18, 24, 0.72);
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    @media (prefers-color-scheme: light) {
      .overlay { background: rgba(232, 238, 242, 0.85); }
    }
    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .overlay h1 {
      margin: 0 0 8px;
      font-size: clamp(1.1rem, 4.5vw, 1.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
      color: var(--ink);
    }
    .overlay p {
      margin: 0 0 20px;
      max-width: 320px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
    }
    .btn {
      min-height: 48px;
      min-width: 160px;
      padding: 0 28px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      font-family: var(--hud);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .btn:active { transform: scale(0.96); }
    @media (hover: hover) {
      .btn:hover {
        background: var(--accent);
        color: var(--bg0);
      }
    }
    .overlay .sub { margin-top: 16px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span><strong id="score">0</strong> sync</span>
      <span id="beat">○</span>
      <span><strong id="lives">●●●</strong> · <strong id="time">45</strong>s</span>
    </div>
    <div id="canvas-wrap">
      <canvas id="game" aria-label="Commit Petals game"></canvas>
      <div id="overlay-title" class="overlay visible">
        <h1>Commit Petals</h1>
        <p>Tap to cycle lanes. Catch wireframe petals on the kick — skip the <span style="color:var(--bad)">blinking</span> fakes. Double-tap for a 1.2s shield (fake hits ignored).</p>
        <button type="button" class="btn" id="btn-start">Play 45s run</button>
        <p class="sub">Keyboard: ← → lane · S shield · Space start</p>
      </div>
      <div id="overlay-end" class="overlay">
        <h1 id="end-title">Round end</h1>
        <p id="end-body"></p>
        <button type="button" class="btn" id="btn-again">Play again</button>
      </div>
    </div>
  </div>
  <script>
(function () {
  'use strict';

  const ROUND_MS = 45000;
  const BPM = 124;
  const BEAT_MS = 60000 / BPM;
  const LANES = 4;
  const MAX_MISSES = 3;
  const SHIELD_MS = 1200;
  const DOUBLE_TAP_MS = 280;
  const CATCH_TOLERANCE_BEATS = 0.22;
  const WIND_RAMP = 0.0000008;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hudScore = document.getElementById('score');
  const hudLives = document.getElementById('lives');
  const hudTime = document.getElementById('time');
  const hudBeat = document.getElementById('beat');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayEnd = document.getElementById('overlay-end');
  const endTitle = document.getElementById('end-title');
  const endBody = document.getElementById('end-body');

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  let isDark = true;

  function syncTheme() {
    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  syncTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  let state = 'title';
  let startTime = 0;
  let lastFrame = 0;
  let audioCtx = null;
  let nextBeatTime = 0;
  let beatIndex = 0;
  let laneIndex = 1;
  let misses = 0;
  let score = 0;
  let petals = [];
  let particles = [];
  let shieldUntil = 0;
  let windBias = 0;
  let lanePhase = 0;
  let shake = 0;
  let lastTap = 0;
  let lastTouchTs = 0;
  let beatFlash = 0;
  let spawnSkew = 0;

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }

  function playKick(time) {
    if (!audioCtx) return;
    const t = time || audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(52, t);
    osc.frequency.exponentialRampToValueAtTime(38, t + 0.06);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.16);
    const noise = audioCtx.createBufferSource();
    const nlen = audioCtx.sampleRate * 0.04;
    const nb = audioCtx.createBuffer(1, nlen, audioCtx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nlen; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nlen);
    noise.buffer = nb;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.12, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    noise.connect(ng);
    ng.connect(audioCtx.destination);
    noise.start(t);
  }

  function playCatch(good) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = good ? 'triangle' : 'square';
    osc.frequency.setValueAtTime(good ? 440 : 120, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(good ? 0.08 : 0.05, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.1);
  }

  function laneCenters() {
    const margin = W * 0.08;
    const usable = W - margin * 2;
    const wobble = Math.sin(lanePhase) * windBias * W * 0.04;
    const centers = [];
    for (let i = 0; i < LANES; i++) {
      const t = (i + 0.5) / LANES;
      centers.push(margin + usable * t + wobble * (i - 1.5) * 0.3);
    }
    return centers;
  }

  function petalFallSpeed() {
    const catchY = H * 0.82;
    const dist = Math.max(40, catchY + 24);
    return dist / (BEAT_MS / 1000);
  }

  function spawnPetal(targetHitTime) {
    const r = Math.random();
    let lane = Math.floor(Math.random() * LANES);
    if (r < 0.35 + spawnSkew) lane = Math.max(0, Math.min(LANES - 1, lane + (windBias > 0 ? 1 : -1)));
    const fake = Math.random() < 0.14 + Math.abs(windBias) * 0.08;
    petals.push({
      lane,
      y: -24,
      vy: petalFallSpeed(),
      targetHit: targetHitTime,
      fake,
      caught: false,
      blink: 0
    });
  }

  function resetGame() {
    petals = [];
    particles = [];
    laneIndex = 1;
    misses = 0;
    score = 0;
    beatIndex = 0;
    windBias = 0;
    lanePhase = 0;
    shieldUntil = 0;
    shake = 0;
    spawnSkew = 0;
    lastTap = 0;
    startTime = performance.now();
    nextBeatTime = startTime;
    lastFrame = startTime;
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startPlaying() {
    initAudio();
    resetGame();
    state = 'playing';
    overlayTitle.classList.remove('visible');
    overlayEnd.classList.remove('visible');
  }

  function endRound(won, reason) {
    if (state !== 'playing') return;
    state = 'over';
    overlayEnd.classList.add('visible');
    if (won) {
      endTitle.textContent = 'Run cleared';
      endBody.textContent = 'Score ' + score + ' sync · ' + (MAX_MISSES - misses) + ' lives left · dusk held.';
    } else {
      endTitle.textContent = 'Branch forked';
      endBody.textContent = reason || ('Final sync ' + score + ' · wind won this one.');
    }
    vibrate(won ? 25 : [40, 30, 40]);
  }

  function livesDots() {
    let s = '';
    for (let i = 0; i < MAX_MISSES; i++) s += i < misses ? '○' : '●';
    return s;
  }

  function tryDoubleTap(now) {
    if (now - lastTap < DOUBLE_TAP_MS) {
      shieldUntil = now + SHIELD_MS;
      vibrate(15);
      lastTap = 0;
      return true;
    }
    lastTap = now;
    return false;
  }

  function bindCanvas() {
    const passive = { passive: false };
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      lastTouchTs = performance.now();
      if (state !== 'playing') return;
      const now = performance.now();
      if (e.touches.length >= 2) {
        shieldUntil = now + SHIELD_MS;
        vibrate(15);
        lastTap = 0;
        return;
      }
      if (tryDoubleTap(now)) return;
      laneIndex = (laneIndex + 1) % LANES;
      vibrate(8);
    }, passive);
    canvas.addEventListener('mousedown', function (e) {
      if (state !== 'playing') return;
      if (performance.now() - lastTouchTs < 450) return;
      e.preventDefault();
      const now = performance.now();
      if (tryDoubleTap(now)) return;
      laneIndex = (laneIndex + 1) % LANES;
      vibrate(8);
    });
  }
  bindCanvas();

  document.getElementById('btn-start').addEventListener('click', function () {
    initAudio();
    startPlaying();
  });
  document.getElementById('btn-again').addEventListener('click', startPlaying);

  window.addEventListener('keydown', function (e) {
    if ((state === 'title' || state === 'over') && (e.code === 'Space' || e.code === 'Enter')) {
      e.preventDefault();
      initAudio();
      startPlaying();
      return;
    }
    if (state !== 'playing') return;
    if (e.code === 'ArrowLeft') { laneIndex = (laneIndex + LANES - 1) % LANES; e.preventDefault(); vibrate(8); }
    if (e.code === 'ArrowRight') { laneIndex = (laneIndex + 1) % LANES; e.preventDefault(); vibrate(8); }
    if (e.code === 'KeyS' || e.code === 'Space') {
      e.preventDefault();
      shieldUntil = performance.now() + SHIELD_MS;
      vibrate(15);
    }
  });

  function drawHills() {
    const hillY = H * 0.72;
    ctx.fillStyle = isDark ? '#0a0e12' : '#263238';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, hillY + 40);
    ctx.bezierCurveTo(W * 0.2, hillY - 20, W * 0.35, hillY + 60, W * 0.5, hillY);
    ctx.bezierCurveTo(W * 0.65, hillY - 30, W * 0.82, hillY + 50, W, hillY + 20);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = isDark ? 'rgba(61,217,200,0.25)' : 'rgba(0,137,123,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (isDark) {
      g.addColorStop(0, '#1a2832');
      g.addColorStop(0.45, '#2d3a42');
      g.addColorStop(0.78, '#3d3028');
      g.addColorStop(1, '#1c1814');
    } else {
      g.addColorStop(0, '#b8cfe0');
      g.addColorStop(0.5, '#d4c4b0');
      g.addColorStop(1, '#c8b09a');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = isDark ? 'rgba(255,176,112,0.06)' : 'rgba(230,81,0,0.08)';
    ctx.fillRect(0, 0, W, H * 0.55);

    drawHills();

    const centers = laneCenters();
    ctx.strokeStyle = isDark ? 'rgba(61,217,200,0.12)' : 'rgba(0,137,123,0.15)';
    for (let i = 0; i < LANES; i++) {
      ctx.beginPath();
      ctx.moveTo(centers[i], 0);
      ctx.lineTo(centers[i], H);
      ctx.stroke();
    }
  }

  function drawPetal(p, centers) {
    const x = centers[p.lane];
    const fakeBlink = p.fake ? (Math.sin(p.blink * 0.012) > 0.35) : true;
    ctx.save();
    ctx.translate(x, p.y);
    ctx.rotate(p.y * 0.008);
    const stroke = p.fake ? (fakeBlink ? (isDark ? '#ff6b5c' : '#c62828') : (isDark ? '#ff8a75' : '#e57373')) : (isDark ? '#3dd9c8' : '#00897b');
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = p.fake && !fakeBlink ? 0.35 : 0.95;
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * Math.PI * 2 - Math.PI / 2;
      const r = 14;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r * 0.85;
      if (k === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(0, 6);
    ctx.moveTo(-6, 0);
    ctx.lineTo(6, 0);
    ctx.stroke();
    ctx.restore();
    p.blink += 16;
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 4;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, col });
    }
  }

  function drawCatcher(centers) {
    const cx = centers[laneIndex];
    const cy = H * 0.82;
    const now = performance.now();
    const shieldOn = now < shieldUntil;
    if (shieldOn) {
      ctx.strokeStyle = isDark ? 'rgba(61,217,200,0.45)' : 'rgba(0,137,123,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 36 + Math.sin(now * 0.008) * 3, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.strokeStyle = isDark ? '#3dd9c8' : '#00897b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 22, cy);
    ctx.lineTo(cx + 22, cy);
    ctx.stroke();
    ctx.fillStyle = isDark ? 'rgba(61,217,200,0.2)' : 'rgba(0,137,123,0.15)';
    ctx.fillRect(cx - 24, cy - 4, 48, 8);
  }

  function update(now) {
    const elapsed = now - startTime;
    hudTime.textContent = String(Math.max(0, Math.ceil((ROUND_MS - elapsed) / 1000)));
    hudScore.textContent = String(score);
    hudLives.textContent = livesDots();

    if (elapsed > ROUND_MS) {
      endRound(true);
      return;
    }

    windBias = Math.sin(elapsed * WIND_RAMP * 1000) * Math.min(0.85, elapsed * WIND_RAMP * 800);
    lanePhase += 0.018 + Math.abs(windBias) * 0.02;
    spawnSkew = windBias * 0.15;

    while (nextBeatTime <= now) {
      if (audioCtx && audioCtx.state === 'running') {
        playKick((nextBeatTime - now) / 1000 + audioCtx.currentTime);
      }
      const landAt = nextBeatTime + BEAT_MS;
      spawnPetal(landAt);
      nextBeatTime += BEAT_MS;
      beatIndex++;
      beatFlash = 1;
    }

    if (beatFlash > 0) {
      beatFlash -= 0.12;
      hudBeat.textContent = '●';
      hudBeat.style.color = isDark ? '#3dd9c8' : '#00897b';
    } else {
      hudBeat.textContent = '○';
      hudBeat.style.color = '';
    }

    const centers = laneCenters();
    const catchY = H * 0.82;
    const shieldOn = now < shieldUntil;
    const dtSec = lastFrame ? Math.min(0.048, (now - lastFrame) / 1000) : 0;

    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      p.y += p.vy * dtSec;

      if (!p.caught && Math.abs(p.y - catchY) < 26 && p.lane === laneIndex) {
        p.caught = true;
        const dt = Math.abs(now - p.targetHit);
        const near = dt < BEAT_MS * CATCH_TOLERANCE_BEATS;
        if (p.fake) {
          if (shieldOn) {
            burst(centers[p.lane], p.y, isDark ? '#88fff0' : '#4db6ac', 8);
            playCatch(true);
          } else {
            misses++;
            shake = 12;
            playCatch(false);
            vibrate([30, 20]);
            burst(centers[p.lane], p.y, isDark ? '#ff6b5c' : '#c62828', 14);
            if (misses >= MAX_MISSES) {
              endRound(false, 'Three misses — the branch diverged.');
              petals.splice(i, 1);
              return;
            }
          }
        } else {
          const mult = near ? 1.6 : 1;
          score += Math.round(100 * mult + (near ? 40 : 0));
          burst(centers[p.lane], p.y, isDark ? '#3dd9c8' : '#00897b', 12);
          playCatch(true);
          vibrate(near ? [10, 8] : 12);
        }
        petals.splice(i, 1);
        continue;
      }

      if (!p.caught && p.y > H + 30) {
        if (!p.fake) {
          misses++;
          shake = 10;
          vibrate(35);
          if (misses >= MAX_MISSES) {
            endRound(false, 'Missed too many clean petals.');
            petals.splice(i, 1);
            return;
          }
        }
        petals.splice(i, 1);
      }
    }

    lastFrame = now;
    if (shake > 0) shake *= 0.85;
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.x += q.vx;
      q.y += q.vy;
      q.life -= 0.05;
      if (q.life <= 0) { particles.splice(i, 1); continue; }
      ctx.fillStyle = q.col;
      ctx.globalAlpha = q.life * 0.8;
      ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function loop(now) {
    if (state !== 'playing') {
      lastFrame = 0;
      drawBackground();
      const c = laneCenters();
      drawCatcher(c);
      requestAnimationFrame(loop);
      return;
    }

    update(now);

    ctx.save();
    if (shake > 0.5) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawBackground();
    const centers = laneCenters();
    for (const p of petals) drawPetal(p, centers);
    drawCatcher(centers);
    drawParticles();
    ctx.restore();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
