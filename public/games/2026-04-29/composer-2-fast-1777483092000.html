<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stutter Grid — 45s Run</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      -webkit-tap-highlight-color: transparent;
    }
    #wrap {
      width: 100dvw;
      height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
    }
    #cv {
      flex: 1;
      width: 100%;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay.panel { pointer-events: auto; }
    .overlay.panel.hidden { pointer-events: none; }
    h1 {
      font-size: clamp(1.1rem, 5vw, 1.6rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.35em;
    }
    p.sub {
      font-size: clamp(0.75rem, 3.2vw, 0.95rem);
      opacity: 0.85;
      max-width: 20rem;
      text-align: center;
      line-height: 1.45;
      margin-bottom: 1.25rem;
    }
    button.big {
      pointer-events: auto;
      min-height: 48px;
      min-width: min(280px, 88vw);
      padding: 14px 28px;
      font: inherit;
      font-size: clamp(0.85rem, 3.5vw, 1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 2px solid var(--stroke);
      background: var(--btn-bg);
      color: var(--fg);
      border-radius: 4px;
      cursor: pointer;
    }
    button.big:active { transform: scale(0.98); }
    #hud {
      position: absolute;
      left: 0; right: 0;
      top: max(8px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      padding: 0 12px;
      font-size: clamp(0.7rem, 3vw, 0.85rem);
      pointer-events: none;
      z-index: 2;
      letter-spacing: 0.04em;
    }
    #toast {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(0.65rem, 2.8vw, 0.8rem);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 3;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #e8ecf0;
        --fg: #0a1628;
        --stroke: #0a1628;
        --btn-bg: rgba(255,255,255,0.85);
        --glass: rgba(255,255,255,0.65);
      }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #06090e;
        --fg: #e8f4ff;
        --stroke: #8cb8e8;
        --btn-bg: rgba(18, 28, 42, 0.92);
        --glass: rgba(20, 30, 48, 0.55);
      }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud" aria-hidden="true"></div>
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div id="titleOv" class="overlay panel">
      <h1>Stutter Grid</h1>
      <p class="sub">Tap real pulses on the line — ignore phantoms.<br>Hold on stacked reals for chord bonus.<br>Keyboard: D&nbsp;F&nbsp;J&nbsp;K · 45s round</p>
      <button type="button" class="big" id="btnStart">Begin run</button>
    </div>
    <div id="goOv" class="overlay panel hidden">
      <h1 id="goTitle">Cracked</h1>
      <p class="sub" id="goSub"></p>
      <button type="button" class="big" id="btnAgain">Play again</button>
    </div>
  </div>
  <script>
(function () {
  'use strict';

  var ROUND_MS = 45000;
  var LANES = 4;
  var MISS_REAL = 3;
  var PHANTOM_TAP_PENALTY = 1;

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var hud = document.getElementById('hud');
  var toastEl = document.getElementById('toast');
  var titleOv = document.getElementById('titleOv');
  var goOv = document.getElementById('goOv');
  var btnStart = document.getElementById('btnStart');
  var btnAgain = document.getElementById('btnAgain');

  var W = 0, H = 0, DPR = 1;
  var laneW = 0;
  var hitY = 0;

  var mode = 'title';
  var startT = 0;
  var nowMs = 0;
  var elapsed = 0;
  var remMs = ROUND_MS;

  var bpm = 92;
  var spawnAcc = 0;

  var notes = [];
  var nextId = 1;

  var score = 0;
  var combo = 0;
  var bestCombo = 0;
  var phantomStrikes = 0;
  var missedReal = 0;

  var laneOrder = [0, 1, 2, 3];
  var laneSwapUntil = 0;
  var falseDropFired = false;

  var ghostBlinkPhase = 0;
  var particles = [];

  var holdLane = -1;
  var holdStart = 0;
  var audioCtx = null;

  function prefersDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function vibe() {
    var dark = prefersDark();
    return {
      dark: dark,
      bg: dark ? '#06090e' : '#e4e9ef',
      grid: dark ? 'rgba(120,200,255,0.08)' : 'rgba(30,60,90,0.12)',
      line: dark ? '#3dd6ff' : '#078ecf',
      real: dark ? '#00ffc8' : '#00a078',
      phantom: dark ? '#ff4466' : '#cc2244',
      chord: dark ? '#ffcc00' : '#cc8800',
      text: dark ? '#e8f4ff' : '#0a1628',
      glow: dark ? 'rgba(61,214,255,0.35)' : 'rgba(7,142,207,0.25)'
    };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.floor(cv.clientWidth * DPR);
    H = Math.floor(cv.clientHeight * DPR);
    cv.width = W;
    cv.height = H;
    laneW = W / LANES;
    hitY = H * 0.78;
  }

  window.addEventListener('resize', resize);

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, ms || 900);
  }

  function vibrate(p) {
    try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {}
  }

  function audioInit() {
    if (audioCtx) return audioCtx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }

  function beep(freq, dur, vol, type) {
    var ac = audioInit();
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = vol * 0.08;
    o.connect(g);
    g.connect(ac.destination);
    var t = ac.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol * 0.08, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  function sfxHit() { beep(440, 0.06, 1.2, 'square'); }
  function sfxPhantom() { beep(120, 0.15, 2, 'sawtooth'); }
  function sfxChord() { beep(330, 0.12, 1.5, 'triangle'); beep(495, 0.1, 1, 'triangle'); }
  function sfxPerfect() { beep(880, 0.08, 0.8, 'sine'); }

  function currentBpm(tSec) {
    var x = tSec / 45;
    return 92 + x * 52 + Math.sin(tSec * 0.7) * 4;
  }

  function spawnNote(tSpawn, logicalLane, typ, chordGroup) {
    notes.push({
      id: nextId++,
      laneLogical: logicalLane,
      y: -40 - Math.random() * 30,
      vy: 0,
      typ: typ,
      hit: false,
      missed: false,
      spawnT: tSpawn,
      chordGroup: chordGroup || 0,
      absorbable: false
    });
  }

  function laneVisual(logical) {
    var i = laneOrder.indexOf(logical);
    return i >= 0 ? i : logical;
  }

  function resetGame() {
    notes = [];
    particles = [];
    score = 0;
    combo = 0;
    bestCombo = 0;
    phantomStrikes = 0;
    missedReal = 0;
    spawnAcc = 0;
    elapsed = 0;
    remMs = ROUND_MS;
    laneOrder = [0, 1, 2, 3];
    laneSwapUntil = 0;
    falseDropFired = false;
    nextId = 1;
    holdLane = -1;
    bpm = 92;
    lastFrame = 0;
  }

  function startPlay() {
    resetGame();
    audioInit();
    mode = 'play';
    startT = performance.now();
    titleOv.classList.add('hidden');
    goOv.classList.add('hidden');
    titleOv.classList.remove('panel');
    goOv.classList.remove('panel');
  }

  function gameOver(reason) {
    mode = 'over';
    goOv.classList.remove('hidden');
    goOv.classList.add('panel');
    document.getElementById('goTitle').textContent = reason === 'time' ? 'Waveform clear' : 'Grid cracked';
    document.getElementById('goSub').textContent =
      'Score ' + score + ' · best chain ×' + bestCombo +
      (reason === 'time' ? ' · full 45s clear.' : ' · three missed reals or phantom taps.');
    vibrate([30, 40, 30]);
  }

  function windowGood(n) {
    return Math.abs(n.y - hitY) < laneW * 0.42;
  }

  function burstParticles(px, py, col) {
    for (var i = 0; i < 36; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = 2 + Math.random() * 5;
      particles.push({
        x: px,
        y: py,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 1,
        life: 1,
        col: col
      });
    }
  }

  function tapLaneScreen(screenX) {
    var rect = cv.getBoundingClientRect();
    var x = ((screenX - rect.left) / rect.width) * W;
    var visual = Math.floor(x / laneW);
    visual = Math.max(0, Math.min(LANES - 1, visual));

    var phys = laneOrder[visual];

    var cand = [];
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.hit || n.laneLogical !== phys || !windowGood(n)) continue;
      cand.push(n);
    }

    if (cand.length === 0) {
      combo = 0;
      toast('Late', 450);
      return;
    }

    cand.sort(function (a, b) {
      return Math.abs(a.y - hitY) - Math.abs(b.y - hitY);
    });
    var top = cand[0];

    if (top.typ === 'phantom') {
      phantomStrikes += PHANTOM_TAP_PENALTY;
      combo = 0;
      top.hit = true;
      sfxPhantom();
      vibrate(60);
      toast('Phantom!', 700);
      checkFail();
      return;
    }

    var best = top;
    var stack = 1;
    for (var k = 0; k < notes.length; k++) {
      var o = notes[k];
      if (o.hit || o.typ !== 'real' || o.laneLogical !== phys) continue;
      if (Math.abs(o.y - best.y) < 18 && o !== best) stack++;
    }
    best.hit = true;
    var mult = stack > 1 ? 2 : 1;
    combo++;
    if (combo > bestCombo) bestCombo = combo;
    var pts = 100 + combo * 5;
    if (stack > 1) {
      pts *= mult;
      sfxChord();
      toast('Chord ×' + mult, 600);
    } else {
      sfxHit();
    }
    if (combo % 10 === 0 && combo > 0) {
      sfxPerfect();
      toast('Chain ×' + combo, 800);
      vibrate([15, 25, 15]);
      burstParticles(visual * laneW + laneW * 0.5, hitY, '#00ffc8');
    }
    score += pts;
  }

  function holdAbsorb(laneLogical) {
    var phys = laneOrder[laneLogical];
    var reals = [];
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.hit || n.typ !== 'real' || n.laneLogical !== phys) continue;
      if (windowGood(n)) reals.push(n);
    }
    if (reals.length < 2) return;
    reals.sort(function (a, b) { return a.y - b.y; });
    var dt = performance.now() - holdStart;
    if (dt < 220) return;
    for (var j = 0; j < reals.length; j++) reals[j].hit = true;
    combo++;
    if (combo > bestCombo) bestCombo = combo;
    var pts = 180 * reals.length + combo * 8;
    score += pts;
    sfxChord();
    toast('Absorb +' + pts, 700);
    vibrate([20, 30, 20]);
  }

  function checkFail() {
    if (missedReal >= MISS_REAL || phantomStrikes >= MISS_REAL) {
      gameOver('miss');
    }
  }

  function update(dt) {
    elapsed += dt;
    remMs = Math.max(0, ROUND_MS - elapsed);
    if (remMs <= 0 && mode === 'play') {
      gameOver('time');
      return;
    }

    var tSec = elapsed / 1000;
    bpm = currentBpm(tSec);

    if (!falseDropFired && tSec >= 23 && tSec < 23.15) {
      falseDropFired = true;
      laneOrder = [2, 3, 0, 1];
      laneSwapUntil = elapsed + 4200;
      toast('FALSE DROP — lanes swapped', 1200);
      vibrate([40, 80, 40]);
    }
    if (laneSwapUntil > 0 && elapsed > laneSwapUntil) {
      laneOrder = [0, 1, 2, 3];
      laneSwapUntil = 0;
      toast('Grid restored', 700);
    }

    ghostBlinkPhase += dt * 0.008;

    for (var pi = particles.length - 1; pi >= 0; pi--) {
      var p = particles[pi];
      p.x += p.vx * dt * 0.12;
      p.y += p.vy * dt * 0.12;
      p.vy += 0.04 * dt;
      p.life -= dt * 0.002;
      if (p.life <= 0) particles.splice(pi, 1);
    }

    var pxPerMs = (laneW * 0.009) * (bpm / 100);
    for (var i = notes.length - 1; i >= 0; i--) {
      var n = notes[i];
      if (n.hit) {
        notes.splice(i, 1);
        continue;
      }
      n.y += pxPerMs * dt;
      if (!n.missed && n.typ === 'real' && n.y > hitY + laneW * 0.55) {
        n.missed = true;
        missedReal++;
        combo = 0;
        sfxPhantom();
        vibrate(45);
        toast('Missed beat', 600);
        checkFail();
      }
      if (n.y > H + 80) notes.splice(i, 1);
    }

    spawnAcc += dt;
    var beatMs = 60000 / bpm;
    var spawnGuard = 0;
    while (spawnAcc >= beatMs * 0.25 && mode === 'play' && spawnGuard++ < 120) {
      spawnAcc -= beatMs * 0.25;
      var phase = Math.floor(elapsed / (beatMs * 0.25)) % 16;
      if (phase === 4 || phase === 12) continue;

      var phantomChance = 0.22 + tSec * 0.012;
      var lanesPicked = [];
      var num = 1 + (Math.random() < 0.35 ? 1 : 0);
      if (tSec > 28 && Math.random() < 0.2) num = 3;

      for (var q = 0; q < num; q++) {
        var ln = Math.floor(Math.random() * LANES);
        var tries = 0;
        while (lanesPicked.indexOf(ln) >= 0 && tries++ < 8) ln = Math.floor(Math.random() * LANES);
        lanesPicked.push(ln);
        var isPh = Math.random() < phantomChance;
        spawnNote(elapsed, ln, isPh ? 'phantom' : 'real', num > 1 ? 1 : 0);
      }
    }

    hud.textContent =
      'TIME ' + (remMs / 1000).toFixed(1) +
      's  ·  SCR ' + score +
      '  ·  ×' + combo +
      '  ·  BPM ' + Math.round(bpm);
  }

  function drawWaveBg(v, t) {
    ctx.save();
    ctx.globalAlpha = v.dark ? 0.45 : 0.35;
    ctx.strokeStyle = v.line;
    ctx.lineWidth = DPR * 1.2;
    ctx.beginPath();
    for (var px = 0; px <= W; px += 8 * DPR) {
      var yy = H * 0.35 + Math.sin(px * 0.004 + t * 0.002) * H * 0.06 + Math.sin(px * 0.015 + t * 0.004) * H * 0.02;
      if (px === 0) ctx.moveTo(px, yy);
      else ctx.lineTo(px, yy);
    }
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    var v = vibe();
    var tDraw = elapsed / 1000;
    ctx.fillStyle = v.bg;
    ctx.fillRect(0, 0, W, H);

    drawWaveBg(v, elapsed);

    for (var gx = 1; gx < LANES; gx++) {
      var lx = gx * laneW;
      ctx.strokeStyle = v.grid;
      ctx.lineWidth = DPR;
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, H);
      ctx.stroke();
    }

    ctx.strokeStyle = v.line;
    ctx.lineWidth = 3 * DPR;
    ctx.shadowColor = v.glow;
    ctx.shadowBlur = 14 * DPR;
    ctx.beginPath();
    ctx.moveTo(0, hitY);
    ctx.lineTo(W, hitY);
    ctx.stroke();
    ctx.shadowBlur = 0;

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.hit) continue;
      var vis = laneVisual(n.laneLogical);
      var cx = vis * laneW + laneW * 0.5;
      var glow = n.typ === 'real' ? v.real : v.phantom;
      var blink = Math.sin(ghostBlinkPhase + vis) > 0.65 && tDraw > 12;
      ctx.globalAlpha = blink ? 0.35 : 1;

      ctx.strokeStyle = glow;
      ctx.fillStyle = n.typ === 'real' ? v.real : 'transparent';
      ctx.lineWidth = 3 * DPR;
      var rad = laneW * 0.32;
      ctx.beginPath();
      ctx.arc(cx, n.y, rad, 0, Math.PI * 2);
      if (n.typ === 'real') {
        ctx.globalAlpha *= v.dark ? 0.35 : 0.45;
        ctx.fill();
        ctx.globalAlpha = blink ? 0.35 : 1;
      }
      ctx.stroke();

      if (n.typ === 'phantom') {
        ctx.setLineDash([6 * DPR, 8 * DPR]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.globalAlpha = 1;
    }

    ctx.save();
    for (var pj = 0; pj < particles.length; pj++) {
      var q = particles[pj];
      ctx.globalAlpha = Math.max(0, q.life);
      ctx.fillStyle = q.col;
      ctx.fillRect(q.x - 2 * DPR, q.y - 2 * DPR, 4 * DPR, 4 * DPR);
    }
    ctx.restore();
  }

  var lastFrame = 0;
  function frame(now) {
    nowMs = now;
    if (!lastFrame) lastFrame = now;
    var dt = Math.min(48, now - lastFrame);
    lastFrame = now;

    if (mode === 'play') update(dt);

    draw();
    requestAnimationFrame(frame);
  }

  function pointerDown(ev) {
    ev.preventDefault();
    if (mode !== 'play') return;
    var x = ev.clientX != null ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0);
    var rect = cv.getBoundingClientRect();
    var lx = Math.floor(((x - rect.left) / rect.width) * LANES);
    lx = Math.max(0, Math.min(LANES - 1, lx));
    holdLane = lx;
    holdStart = performance.now();
  }

  function pointerUp(ev) {
    ev.preventDefault();
    if (mode !== 'play') return;
    var x = ev.clientX != null ? ev.clientX : (ev.changedTouches && ev.changedTouches[0] ? ev.changedTouches[0].clientX : 0);
    var dt = performance.now() - holdStart;

    if (holdLane >= 0 && dt > 240) {
      holdAbsorb(holdLane);
      holdLane = -1;
      return;
    }

    tapLaneScreen(x);
    holdLane = -1;
  }

  cv.addEventListener('touchstart', pointerDown, { passive: false });
  cv.addEventListener('touchend', pointerUp, { passive: false });
  cv.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    pointerDown(e);
  });
  window.addEventListener('mouseup', function (e) {
    pointerUp(e);
  });

  var keys = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3 };
  window.addEventListener('keydown', function (e) {
    if (keys[e.code] === undefined) return;
    if (e.repeat) return;
    e.preventDefault();
    if (mode !== 'play') return;
    var ln = keys[e.code];
    holdLane = ln;
    holdStart = performance.now();
  });
  window.addEventListener('keyup', function (e) {
    if (keys[e.code] === undefined) return;
    e.preventDefault();
    if (mode !== 'play') return;
    var ln = keys[e.code];
    var dt = performance.now() - holdStart;
    var rect = cv.getBoundingClientRect();
    var frac = (ln + 0.5) / LANES;
    var fakeX = rect.left + frac * rect.width;

    if (holdLane === ln && dt > 240) {
      holdAbsorb(ln);
      holdLane = -1;
      return;
    }

    tapLaneScreen(fakeX);
    holdLane = -1;
  });

  btnStart.addEventListener('click', function () {
    startPlay();
  });
  btnAgain.addEventListener('click', function () {
    startPlay();
  });

  resize();
  requestAnimationFrame(frame);

  document.addEventListener('touchmove', function (e) {
    if (mode === 'play') e.preventDefault();
  }, { passive: false });
})();
  </script>
</body>
</html>
