<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glassline Kick — commute mix</title>
  <style>
    :root {
      --bg: #0a1014;
      --fg: #e8f4f2;
      --muted: rgba(232, 244, 242, 0.55);
      --accent: #2dd4bf;
      --warn: #f59e0b;
      --danger: #f43f5e;
      --glass: rgba(45, 212, 191, 0.12);
      --ui-font: ui-monospace, '_sfmono-regular', menlo, monaco, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a1014;
        --fg: #e8f4f2;
        --muted: rgba(232, 244, 242, 0.55);
        --accent: #2dd4bf;
        --warn: #f59e0b;
        --danger: #f43f5e;
        --glass: rgba(45, 212, 191, 0.12);
      }
      .overlay {
        background: rgba(10, 16, 20, 0.72);
      }
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f0f7f5;
        --fg: #0c1816;
        --muted: rgba(12, 24, 22, 0.5);
        --accent: #0d9488;
        --warn: #d97706;
        --danger: #e11d48;
        --glass: rgba(13, 148, 136, 0.15);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      width: 100dvw;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      user-select: none;
      -webkit-user-select: none;
    }
    header.hud {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(10px, env(safe-area-inset-top)) 16px 8px;
      font-family: var(--ui-font);
      font-size: 12px;
      letter-spacing: 0.04em;
      z-index: 3;
    }
    header.hud span { color: var(--muted); }
    #score { font-variant-numeric: tabular-nums; color: var(--fg); }
    #lane-wrap {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
    }
    canvas#game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: pointer;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(10, 16, 20, 0.72);
      z-index: 4;
      transition: opacity 0.35s ease;
    }
    @media (prefers-color-scheme: light) {
      .overlay { background: rgba(240, 247, 245, 0.85); }
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h1 {
      font-family: var(--ui-font);
      font-size: clamp(18px, 4.5vw, 22px);
      font-weight: 600;
      margin: 0 0 8px;
      text-align: center;
      letter-spacing: 0.06em;
    }
    .overlay p {
      margin: 0 0 20px;
      max-width: 320px;
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
      color: var(--muted);
    }
    .overlay button {
      min-height: 48px;
      min-width: 160px;
      padding: 0 24px;
      font-family: var(--ui-font);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--accent);
      background: var(--glass);
      color: var(--fg);
      border-radius: 999px;
      cursor: pointer;
    }
    .overlay button:active { transform: scale(0.97); }
    #go-stats {
      font-family: var(--ui-font);
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header class="hud">
      <div><span>MIX</span> <strong id="combo">×1</strong></div>
      <div id="score">0</div>
      <div><span id="timer">50.0</span><span>s</span></div>
    </header>
    <div id="lane-wrap">
      <canvas id="game" aria-label="Rhythm lane"></canvas>
      <div id="title-screen" class="overlay">
        <h1>Glassline Kick</h1>
        <p>Tap real kicks on the line. Ignore ghost echoes. In stutter windows, tap twice before the beat leaves.</p>
        <button type="button" id="btn-play">Start run</button>
      </div>
      <div id="game-over" class="overlay hidden">
        <h1>Stretch cleared</h1>
        <p id="go-stats"></p>
        <button type="button" id="btn-again">Ride again</button>
      </div>
    </div>
  </div>
  <script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var titleEl = document.getElementById('title-screen');
  var goEl = document.getElementById('game-over');
  var scoreEl = document.getElementById('score');
  var comboEl = document.getElementById('combo');
  var timerEl = document.getElementById('timer');
  var goStatsEl = document.getElementById('go-stats');

  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, hitY = 0;
  var TRAVEL_MS = 1100;
  var ROUND_MS = 50000;
  var state = 'title';
  var startTime = 0;
  var lastFrame = 0;
  var audioCtx = null;
  var metroNext = 0;

  var bpm = 92;
  var beatDur = 60000 / bpm;
  var ghostChance = 0.22;
  var stutterChance = 0.12;
  var blindUntil = 0;
  var blindNextAt = 7000;
  var shakeUntil = 0;
  var shakeMag = 0;

  var score = 0;
  var combo = 0;
  var maxCombo = 0;
  var mult = 1;
  var hits = 0;
  var ghostsTriggered = 0;
  var misses = 0;

  var notes = [];
  var beatIndex = 0;
  var nextBeatAt = 0;
  var rngSeed = 0x4b1c25;

  function rnd() {
    rngSeed ^= rngSeed << 13;
    rngSeed ^= rngSeed >>> 17;
    rngSeed ^= rngSeed << 5;
    return (rngSeed >>> 0) / 4294967296;
  }

  function isLight() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    W = Math.max(1, rect.width);
    H = Math.max(1, rect.height);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    hitY = H * 0.78;
  }

  function vibrate(ms) {
    try {
      if (navigator.vibrate) navigator.vibrate(ms);
    } catch (e) {}
  }

  function ensureAudio() {
    if (audioCtx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }

  function playKick(vol) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    var f = audioCtx.createBiquadFilter();
    o.type = 'sine';
    o.frequency.setValueAtTime(52, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.08);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(280, t);
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(vol * 0.45, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(f);
    f.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.2);
  }

  function playTick(high) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(high ? 880 : 220, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.03, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.06);
  }

  function playBad() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(90, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.15);
  }

  function playMetroQuiet() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(58, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.014, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.09);
  }

  function spawnForBeat(hitAt) {
    var roll = rnd();
    var isGhost = roll < ghostChance;
    var isStutter = !isGhost && roll < ghostChance + stutterChance;
    if (isGhost) {
      notes.push({
        hitAt: hitAt,
        kind: 'ghost',
        hit: false,
        resolved: false,
        taps: 0
      });
      return;
    }
    if (isStutter) {
      notes.push({
        hitAt: hitAt,
        kind: 'stutter',
        hit: false,
        resolved: false,
        taps: 0,
        firstBy: hitAt + beatDur * 0.42
      });
      return;
    }
    notes.push({
      hitAt: hitAt,
      kind: 'real',
      hit: false,
      resolved: false,
      taps: 0
    });
  }

  function resetGame() {
    rngSeed = (Date.now() ^ (Math.floor(Math.random() * 0xffff) << 16)) >>> 0;
    notes = [];
    beatIndex = 0;
    score = 0;
    combo = 0;
    maxCombo = 0;
    mult = 1;
    hits = 0;
    ghostsTriggered = 0;
    misses = 0;
    bpm = 88;
    beatDur = 60000 / bpm;
    ghostChance = 0.2;
    stutterChance = 0.14;
    blindUntil = 0;
    blindNextAt = 6000 + rnd() * 2000;
    shakeUntil = 0;
    shakeMag = 0;
    startTime = performance.now();
    lastFrame = startTime;
    nextBeatAt = startTime + TRAVEL_MS;
    metroNext = startTime + TRAVEL_MS;
    var first = startTime + TRAVEL_MS;
    var i;
    for (i = 0; i < 64; i++) {
      spawnForBeat(first + i * beatDur);
    }
    beatIndex = 64;
    scoreEl.textContent = '0';
    comboEl.textContent = '×1';
  }

  function startPlay() {
    ensureAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    state = 'play';
    titleEl.classList.add('hidden');
    goEl.classList.add('hidden');
    resetGame();
    requestAnimationFrame(loop);
  }

  function endGame() {
    state = 'over';
    goStatsEl.textContent = 'Score ' + score + ' · best combo ' + maxCombo + ' · clean hits ' + hits + ' · ghosts caught ' + ghostsTriggered + ' · missed ' + misses;
    goEl.classList.remove('hidden');
    vibrate(28);
  }

  function judgmentWindow() {
    return Math.min(110, 70 + ghostChance * 40);
  }

  function attemptHit(tapTime) {
    if (state !== 'play') return;
    var win = judgmentWindow();
    var i;
    var best = null;
    var bestD = 1e9;
    for (i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.resolved) continue;
      var d = Math.abs(tapTime - n.hitAt);
      if (d < win && d < bestD) {
        bestD = d;
        best = n;
      }
    }

    if (best && best.kind === 'ghost') {
      ghostsTriggered++;
      combo = 0;
      mult = 1;
      comboEl.textContent = '×1';
      playBad();
      vibrate([15, 40, 15]);
      shakeUntil = tapTime + 140;
      shakeMag = 8;
      return;
    }

    if (best && best.kind === 'real') {
      best.resolved = true;
      best.hit = true;
      hits++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      mult = Math.min(5, 1 + Math.floor(combo / 5) * 0.5);
      var pts = Math.round(100 * mult * (1 - bestD / win));
      score += pts;
      scoreEl.textContent = String(score);
      comboEl.textContent = '×' + mult.toFixed(1);
      playKick(0.9);
      addBurst(W * 0.5, hitY, false);
      vibrate(12);
      return;
    }

    if (best && best.kind === 'stutter') {
      if (best.taps === 0) {
        if (tapTime >= best.hitAt - win && tapTime <= best.firstBy + win * 0.45) {
          best.taps = 1;
          playTick(true);
          addBurst(W * 0.5, hitY - 8, true);
          vibrate(8);
        }
        return;
      }
      if (best.taps === 1) {
        if (tapTime >= best.firstBy - win * 0.25 && tapTime <= best.hitAt + win) {
          best.resolved = true;
          best.hit = true;
          hits++;
          combo++;
          if (combo > maxCombo) maxCombo = combo;
          mult = Math.min(5, 1 + Math.floor(combo / 5) * 0.5);
          var pts2 = Math.round(160 * mult);
          score += pts2;
          scoreEl.textContent = String(score);
          comboEl.textContent = '×' + mult.toFixed(1);
          playKick(1);
          addBurst(W * 0.5, hitY, true);
          vibrate(14);
        }
        return;
      }
    }

    playTick(false);
  }

  function onPointer(ev) {
    ev.preventDefault();
    if (state === 'title' || state === 'over') return;
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    attemptHit(performance.now());
  }

  canvas.addEventListener('pointerdown', onPointer, { passive: false });

  var particles = [];
  function addBurst(x, y, gold) {
    var rgb = gold ? [251, 191, 36] : [45, 212, 191];
    var n = 10;
    var i;
    for (i = 0; i < n; i++) {
      var a = rnd() * Math.PI * 2;
      var sp = 40 + rnd() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.4 + rnd() * 0.2,
        t: 0,
        rgb: rgb
      });
    }
  }

  function pruneNotes(now) {
    var win = judgmentWindow() + 30;
    var i;
    for (i = notes.length - 1; i >= 0; i--) {
      var n = notes[i];
      if (!n.resolved && now > n.hitAt + win) {
        if (n.kind === 'ghost') {
          n.resolved = true;
        } else {
          n.resolved = true;
          misses++;
          combo = 0;
          mult = 1;
          comboEl.textContent = '×1';
          playBad();
          vibrate([20, 30]);
        }
      }
      if (n.resolved && now > n.hitAt + TRAVEL_MS + 400) {
        notes.splice(i, 1);
      }
    }
  }

  function drawBg(now) {
    var light = isLight();
    var g = ctx.createLinearGradient(0, 0, W, H);
    if (light) {
      g.addColorStop(0, '#dff5ef');
      g.addColorStop(0.45, '#f2f9f7');
      g.addColorStop(1, '#c8ebe4');
    } else {
      g.addColorStop(0, '#050a0d');
      g.addColorStop(0.4, '#0a1418');
      g.addColorStop(1, '#061016');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var scroll = (now * 0.12) % 200;
    var ly, alpha;
    ctx.save();
    for (ly = -scroll; ly < H + 100; ly += 28) {
      alpha = light ? 0.08 : 0.12;
      ctx.fillStyle = light ? 'rgba(13, 148, 136,' + alpha + ')' : 'rgba(45, 212, 191,' + alpha + ')';
      ctx.fillRect(W * 0.08, ly, W * 0.84, 2);
    }
    ctx.restore();

    var st = Math.sin(now * 0.003) * 3;
    ctx.strokeStyle = light ? 'rgba(245, 158, 11, 0.35)' : 'rgba(251, 191, 36, 0.25)';
    ctx.lineWidth = 2;
    var x;
    for (x = 0; x < 7; x++) {
      var px = (x / 7) * W + st * (x % 2 ? 1 : -1);
      ctx.beginPath();
      ctx.moveTo(px, 0);
      ctx.lineTo(px - 20, H);
      ctx.stroke();
    }
  }

  function inBlind(now) {
    return now < blindUntil;
  }

  function loop(now) {
    if (state !== 'play') return;
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    var metroGuard = 0;
    while (now >= metroNext) {
      playMetroQuiet();
      metroNext += beatDur;
      if (++metroGuard > 16) break;
    }

    var elapsed = now - startTime;
    if (elapsed > ROUND_MS) {
      state = 'over';
      endGame();
      return;
    }
    timerEl.textContent = ((ROUND_MS - elapsed) / 1000).toFixed(1);

    bpm = 88 + (elapsed / ROUND_MS) * 22;
    beatDur = 60000 / bpm;
    ghostChance = 0.2 + (elapsed / ROUND_MS) * 0.22;
    stutterChance = 0.12 + (elapsed / ROUND_MS) * 0.08;

    if (now > blindNextAt && now > blindUntil) {
      blindUntil = now + 900 + rnd() * 900;
      blindNextAt = now + 5200 + rnd() * 3800;
      shakeUntil = blindUntil;
      shakeMag = 12;
      vibrate(25);
    }

    while (nextBeatAt < now + TRAVEL_MS + beatDur * 8) {
      spawnForBeat(nextBeatAt);
      nextBeatAt += beatDur;
      beatIndex++;
    }

    pruneNotes(now);

    var sx = 0, sy = 0;
    var shDur = 320;
    if (now < shakeUntil + shDur) {
      var f = inBlind(now) ? 1 : Math.max(0, 1 - (now - shakeUntil) / shDur);
      if (f > 0) {
        sx = (rnd() - 0.5) * shakeMag * f;
        sy = (rnd() - 0.5) * shakeMag * f;
      }
    }

    ctx.save();
    ctx.translate(sx, sy);
    drawBg(now);

    var blind = inBlind(now);
    if (blind) {
      ctx.fillStyle = isLight() ? 'rgba(240, 250, 248, 0.55)' : 'rgba(5, 12, 14, 0.5)';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.strokeStyle = isLight() ? 'rgba(13, 148, 136, 0.45)' : 'rgba(45, 212, 191, 0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, hitY);
    ctx.lineTo(W, hitY);
    ctx.stroke();
    ctx.strokeStyle = isLight() ? 'rgba(245, 158, 11, 0.7)' : 'rgba(251, 191, 36, 0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W * 0.12, hitY);
    ctx.lineTo(W * 0.88, hitY);
    ctx.stroke();

    var travel = TRAVEL_MS - (beatDur * 0.15);
    var i;
    for (i = 0; i < notes.length; i++) {
      var n = notes[i];
      var u = (now - (n.hitAt - travel)) / travel;
      if (u < 0 || u > 1.15) continue;
      var ny = hitY * u * 0.95;
      var nx = W * 0.5 + Math.sin(n.hitAt * 0.01 + i) * (blind ? 22 : 12);
      var lw = W * (n.kind === 'ghost' ? 0.09 : n.kind === 'stutter' ? 0.14 : 0.1);
      var h = n.kind === 'stutter' ? 22 : 18;
      var rg = ctx.createRadialGradient(nx, ny, 2, nx, ny, lw);
      if (n.kind === 'ghost') {
        rg.addColorStop(0, isLight() ? 'rgba(100, 180, 160, 0.9)' : 'rgba(94, 234, 212, 0.35)');
        rg.addColorStop(1, isLight() ? 'rgba(100, 180, 160, 0)' : 'rgba(94, 234, 212, 0)');
      } else if (n.kind === 'stutter') {
        rg.addColorStop(0, isLight() ? 'rgba(217, 119, 6, 0.95)' : 'rgba(251, 191, 36, 0.95)');
        rg.addColorStop(1, isLight() ? 'rgba(217, 119, 6, 0.15)' : 'rgba(251, 191, 36, 0.2)');
      } else {
        rg.addColorStop(0, isLight() ? 'rgba(13, 148, 136, 1)' : 'rgba(45, 212, 191, 1)');
        rg.addColorStop(1, isLight() ? 'rgba(13, 148, 136, 0.2)' : 'rgba(45, 212, 191, 0.2)');
      }
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.roundRect(nx - lw, ny - h * 0.5, lw * 2, h, 8);
      ctx.fill();
      if (n.kind === 'stutter') {
        ctx.fillStyle = isLight() ? 'rgba(12, 24, 22, 0.75)' : 'rgba(232, 244, 242, 0.85)';
        ctx.font = '11px ui-monospace, menlo, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('×2', nx, ny + 4);
      }
    }

    var pi;
    for (pi = particles.length - 1; pi >= 0; pi--) {
      var p = particles[pi];
      p.t += dt;
      if (p.t > p.life) { particles.splice(pi, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      var al = 1 - p.t / p.life;
      ctx.fillStyle = 'rgba(' + p.rgb[0] + ',' + p.rgb[1] + ',' + p.rgb[2] + ',' + al + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
    requestAnimationFrame(loop);
  }

  if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      var rr = Math.min(r, w / 2, h / 2);
      this.beginPath();
      this.moveTo(x + rr, y);
      this.lineTo(x + w - rr, y);
      this.quadraticCurveTo(x + w, y, x + w, y + rr);
      this.lineTo(x + w, y + h - rr);
      this.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      this.lineTo(x + rr, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - rr);
      this.lineTo(x, y + rr);
      this.quadraticCurveTo(x, y, x + rr, y);
      this.closePath();
    };
  }

  document.getElementById('btn-play').addEventListener('click', function () {
    startPlay();
  });
  document.getElementById('btn-again').addEventListener('click', function () {
    startPlay();
  });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (state === 'title' || state === 'over') startPlay();
      else attemptHit(performance.now());
    }
  });

  window.addEventListener('resize', resize);
  resize();

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () {});
  }
})();
  </script>
</body>
</html>
