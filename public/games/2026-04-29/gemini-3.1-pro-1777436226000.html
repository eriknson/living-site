<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sponsor Block</title>
    <style>
        :root {
            --bg: #f5faf5;
            --fg: #004400;
            --fg-dim: #88bb88;
            --accent: #cc0000;
            --scanline: rgba(0, 68, 0, 0.15);
            --vignette: rgba(0, 68, 0, 0.2);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #051005;
                --fg: #33ff33;
                --fg-dim: #115511;
                --accent: #ff3333;
                --scanline: rgba(51, 255, 51, 0.1);
                --vignette: rgba(0, 0, 0, 0.8);
            }
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--fg);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0) 50%,
                var(--scanline) 50%
            );
            background-size: 100% 4px;
            box-shadow: inset 0 0 100px var(--vignette);
            animation: jitter 0.15s infinite;
        }

        @keyframes jitter {
            0% { transform: translateY(0); }
            50% { transform: translateY(1px); }
            100% { transform: translateY(0); }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            pointer-events: auto;
            z-index: 20;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-align: center;
            text-shadow: 0 0 10px var(--fg);
            padding: 0 1rem;
        }

        p {
            font-size: clamp(1rem, 4vw, 1.2rem);
            text-align: center;
            max-width: 80%;
            margin-bottom: 2.5rem;
            line-height: 1.5;
            text-shadow: 0 0 5px var(--fg);
        }

        button {
            background: transparent;
            color: var(--fg);
            border: 2px solid var(--fg);
            padding: 1rem 2.5rem;
            font-family: inherit;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 10px var(--fg), inset 0 0 5px var(--fg);
            text-shadow: 0 0 5px var(--fg);
            transition: all 0.1s;
        }

        button:active {
            background: var(--fg);
            color: var(--bg);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas-layer"></canvas>
        <div id="crt-overlay"></div>
        
        <div id="start-screen" class="screen">
            <h1>TERMINAL<br>DEFENDER</h1>
            <p>Intrusive sponsor glyphs are corrupting the output stream. Tap them away before data integrity reaches zero.</p>
            <p style="font-size: 0.9rem; opacity: 0.8; margin-top: -1.5rem;">Watch out for SYSTEM files.</p>
            <button id="start-btn">INITIALIZE</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1>CONNECTION LOST</h1>
            <p>System overwhelmed by ad payload.<br><br>Fragments saved: <span id="final-score" style="font-weight: bold; font-size: 1.5em;">0</span></p>
            <button id="restart-btn">REBOOT</button>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        let dpr = window.devicePixelRatio || 1;
        let width, height;

        // Theme sync
        let colors = {};
        function updateColors() {
            const rootStyles = getComputedStyle(document.documentElement);
            colors = {
                bg: rootStyles.getPropertyValue('--bg').trim(),
                fg: rootStyles.getPropertyValue('--fg').trim(),
                fgDim: rootStyles.getPropertyValue('--fg-dim').trim(),
                accent: rootStyles.getPropertyValue('--accent').trim()
            };
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
        updateColors();

        let pointerX = 0;
        let pointerY = 0;
        const keyMove = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        function syncKeyboardPointer() {
            pointerX = width / 2;
            pointerY = height / 2;
        }

        function handleKeyDown(e) {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                if (gameState === 'playing') {
                    e.preventDefault();
                    keyMove[e.key] = true;
                }
                return;
            }
            if (e.key === ' ' || e.key === 'Enter') {
                if (gameState === 'playing') {
                    e.preventDefault();
                    handleTap(pointerX, pointerY);
                } else if (gameState === 'start' || gameState === 'gameover') {
                    e.preventDefault();
                    startGame();
                }
            }
        }

        function handleKeyUp(e) {
            if (keyMove[e.key] !== undefined) {
                keyMove[e.key] = false;
            }
        }

        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            updateColors();
            syncKeyboardPointer();
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio setup
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                
                if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'decoy') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'gameover') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.8);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 0.8);
                }
            } catch (e) {}
        }

        // Game State
        let gameState = 'start'; 
        let integrity = 100;
        let score = 0;
        let timeElapsed = 0;
        let spawnTimer = 500;
        let spawnInterval = 1000;
        let glyphs = [];
        let particles = [];
        let textLines = [];
        let textSpawnTimer = 0;
        let lastTime = 0;
        let requestID;

        const fakeCopy = [
            "LOADING MEMORY BANKS...",
            "ESTABLISHING SECURE CONNECTION...",
            "VERIFYING NEURAL WEIGHTS...",
            "SYSTEM.OUT.PRINTLN('HELLO WORLD');",
            "0x00FF88AA: MEMORY FAULT",
            "RE-ROUTING POWER TO PRIMARY THRUSTERS",
            "DECRYPTING PAYLOAD...",
            "await Promise.all(nodes.map(n => n.sync()));",
            "// TODO: Refactor this before launch",
            "WARNING: BUFFER UNDERRUN DETECTED",
            "ANALYZING TELEMETRY DATA...",
            "COMPILING KERNEL MODULES...",
            "git commit -m 'fixed the thing'",
            "export default function App() {",
            "  return <Canvas />;",
            "}",
            "INITIALIZING RENDER LOOP...",
            "FETCHING LATEST DEPENDENCIES...",
            "[OK] SYSTEM BOOT COMPLETE.",
            "const inference = new Worker('infer.js');",
            "Checking permissions... ALLOWED",
            "Bypassing guardrails...",
            "Generative context primed.",
            "127.0.0.1 - - [29/Apr/2026:03:45:00] 'GET /' 200",
            "Connecting to proxy...",
            "Tracing route...",
            "Latency: 12ms",
            "Ping: OK",
            "Awaiting clear night over SF...",
            "Listening for stutter pulses...",
            "Imagine 2026",
            "Mellow house stacking in memory..."
        ];

        const ads = ["PROMO", "BUY", "WIN!", "FREE", "CLICK", "$$$", "SPONSORED", "AD", "HOT", "DEAL"];
        const decoys = ["SYSTEM", "CORE", "OK", "DATA", "SYNC", "MEM", "CPU", "ROOT"];

        function randomAd() { return ads[Math.floor(Math.random() * ads.length)]; }
        function randomDecoy() { return decoys[Math.floor(Math.random() * decoys.length)]; }

        let glyphIdCounter = 0;
        function spawnGlyph(difficultyRatio) {
            const isDecoy = Math.random() < (0.1 + difficultyRatio * 0.15); 
            const padding = 60;
            
            const baseSize = 90;
            const sizeShrink = 40 * difficultyRatio;
            const w = baseSize - sizeShrink + (Math.random() * 20);
            const h = (baseSize - sizeShrink) * 0.4 + (Math.random() * 15);
            
            glyphs.push({
                id: glyphIdCounter++,
                x: padding + Math.random() * (width - padding * 2),
                y: Math.max(80, padding + Math.random() * (height - padding * 2 - 80)), 
                w: w,
                h: h,
                text: isDecoy ? randomDecoy() : randomAd(),
                isDecoy: isDecoy,
                life: 0,
                scale: 0
            });
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 0.4 + 0.1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 300 + Math.random() * 200,
                    maxLife: 500,
                    size: Math.random() * 4 + 2,
                    color: color
                });
            }
        }

        // Interaction
        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'playing') return;
            e.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            handleTap(x, y);
        });

        function handleTap(x, y) {
            let hit = false;
            for (let i = glyphs.length - 1; i >= 0; i--) {
                const g = glyphs[i];
                const gw = g.w * g.scale;
                const gh = g.h * g.scale;
                
                const hitPad = 30; // forgiving touch target
                if (Math.abs(x - g.x) < gw/2 + hitPad && Math.abs(y - g.y) < gh/2 + hitPad) {
                    hit = true;
                    if (g.isDecoy) {
                        integrity = Math.max(0, integrity - 15);
                        spawnParticles(g.x, g.y, colors.fg, 15);
                        playSound('decoy');
                        try { if (navigator.vibrate) navigator.vibrate([50, 50, 50]); } catch(e){}
                    } else {
                        score += 1;
                        integrity = Math.min(100, integrity + 4);
                        spawnParticles(g.x, g.y, colors.accent, 20);
                        playSound('hit');
                        try { if (navigator.vibrate) navigator.vibrate(20); } catch(e){}
                    }
                    glyphs.splice(i, 1);
                    break; 
                }
            }
            
            if (!hit) {
                // small penalty for mashing empty space
                integrity = Math.max(0, integrity - 2);
            }
        }

        function update(dt) {
            timeElapsed += dt;
            
            let difficultyRatio = Math.min(timeElapsed / 60000, 1);
            spawnInterval = 1000 - (750 * difficultyRatio);
            let speedMult = 1 + difficultyRatio * 1.5;

            if (gameState === 'playing') {
                const step = 0.35 * speedMult;
                if (keyMove.ArrowLeft) pointerX -= step * dt;
                if (keyMove.ArrowRight) pointerX += step * dt;
                if (keyMove.ArrowUp) pointerY -= step * dt;
                if (keyMove.ArrowDown) pointerY += step * dt;
                pointerX = Math.max(0, Math.min(width, pointerX));
                pointerY = Math.max(80, Math.min(height, pointerY));
            }

            // Background text
            textSpawnTimer -= dt;
            if (textSpawnTimer <= 0) {
                textLines.push({
                    text: fakeCopy[Math.floor(Math.random() * fakeCopy.length)],
                    y: height + 30
                });
                textSpawnTimer = 200 + Math.random() * 300;
            }

            for (let i = textLines.length - 1; i >= 0; i--) {
                textLines[i].y -= (0.06 * speedMult) * dt;
                if (textLines[i].y < -30) {
                    textLines.splice(i, 1);
                }
            }

            // Glyphs
            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                spawnGlyph(difficultyRatio);
                spawnTimer = spawnInterval;
            }

            let activeAdCount = 0;
            for (let i = glyphs.length - 1; i >= 0; i--) {
                let g = glyphs[i];
                g.life += dt;
                
                if (g.life < 150) {
                    g.scale = Math.sin((g.life / 150) * (Math.PI / 2));
                } else {
                    g.scale = 1;
                }
                
                // Drift
                g.x += Math.sin(timeElapsed * 0.003 + g.id) * 0.4 * speedMult;
                g.y += Math.cos(timeElapsed * 0.002 + g.id) * 0.2 * speedMult;

                // Keep in bounds
                g.x = Math.max(g.w/2, Math.min(width - g.w/2, g.x));
                g.y = Math.max(80 + g.h/2, Math.min(height - g.h/2, g.y));

                if (!g.isDecoy) {
                    activeAdCount++;
                } else if (g.life > 2500 - (difficultyRatio * 1000)) {
                    // Decoys despawn automatically faster as difficulty increases
                    g.scale -= dt / 100;
                    if (g.scale <= 0) {
                        glyphs.splice(i, 1);
                        continue;
                    }
                }
            }

            // Drain integrity based on active ads
            if (activeAdCount > 0) {
                integrity -= (activeAdCount * 0.006) * dt;
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.life -= dt;
                p.vx *= 0.92;
                p.vy *= 0.92;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (integrity <= 0) {
                integrity = 0;
                gameOver();
            }
        }

        function drawHUD() {
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = 'bold 24px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.fillStyle = colors.fg;
            ctx.shadowBlur = 8;
            ctx.shadowColor = colors.fg;
            ctx.fillText(`FRAGMENTS: ${score}`, 20, 20);

            const barW = Math.min(180, width * 0.4);
            const barH = 16;
            const barX = width - barW - 20;
            const barY = 24;

            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 12px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.fillText('INTEGRITY', barX - 10, barY + barH/2);

            ctx.strokeStyle = colors.fg;
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barW, barH);
            
            const isDanger = integrity < 25;
            ctx.fillStyle = isDanger ? colors.accent : colors.fg;
            ctx.shadowColor = isDanger ? colors.accent : colors.fg;
            
            // Blink if danger
            if (!isDanger || Math.floor(timeElapsed / 100) % 2 === 0) {
                ctx.fillRect(barX + 3, barY + 3, Math.max(0, (barW - 6) * (integrity / 100)), barH - 6);
            }
        }

        function draw() {
            ctx.save();
            
            if (integrity < 25 && Math.random() < 0.1) {
                ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
            }
            
            // clear bg
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);

            // Draw bg text
            ctx.font = '16px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = colors.fgDim;
            ctx.shadowBlur = 4;
            ctx.shadowColor = colors.fgDim;
            
            const fadeStart = height * 0.4;
            for (const line of textLines) {
                let alpha = 1;
                if (line.y < fadeStart) {
                    alpha = Math.max(0.1, line.y / fadeStart);
                }
                ctx.globalAlpha = alpha;
                ctx.fillText(line.text, 20, line.y);
            }
            ctx.globalAlpha = 1;

            // Draw glyphs
            ctx.textAlign = 'center';
            for (const g of glyphs) {
                ctx.save();
                ctx.translate(g.x, g.y);
                ctx.scale(g.scale, g.scale);
                
                const isFlicker = !g.isDecoy && Math.random() < 0.08;
                const baseColor = g.isDecoy ? colors.fg : colors.accent;
                const altColor = colors.bg;

                ctx.shadowBlur = 10;
                ctx.shadowColor = baseColor;
                
                if (isFlicker) {
                    ctx.fillStyle = altColor;
                    ctx.fillRect(-g.w/2, -g.h/2, g.w, g.h);
                    ctx.strokeStyle = baseColor;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-g.w/2, -g.h/2, g.w, g.h);
                    ctx.fillStyle = baseColor;
                } else {
                    ctx.fillStyle = baseColor;
                    ctx.fillRect(-g.w/2, -g.h/2, g.w, g.h);
                    ctx.fillStyle = altColor;
                }
                
                const fontSize = Math.max(12, g.h * 0.65);
                ctx.font = `bold ${fontSize}px ui-monospace, SFMono-Regular, Menlo, monospace`;
                ctx.shadowBlur = 0;
                ctx.fillText(g.text, 0, 2); 
                
                ctx.restore();
            }

            // Draw particles
            for (const p of particles) {
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = p.color;
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            drawHUD();
            
            ctx.restore();
        }

        function loop(time) {
            if (gameState !== 'playing') return;
            const dt = Math.min(time - lastTime, 50);
            lastTime = time;
            
            update(dt);
            draw();
            
            if (gameState === 'playing') {
                requestID = requestAnimationFrame(loop);
            }
        }

        function startGame() {
            if (audioCtx.state === 'suspended') {
                try { audioCtx.resume(); } catch(e){}
            }
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            resize();
            
            integrity = 100;
            score = 0;
            timeElapsed = 0;
            spawnTimer = 800; 
            glyphs = [];
            particles = [];
            textLines = [];
            gameState = 'playing';
            
            for (let i=0; i<15; i++) {
                textLines.push({
                    text: fakeCopy[Math.floor(Math.random() * fakeCopy.length)],
                    y: height - (i * 35) - 100
                });
            }
            
            if (requestID) cancelAnimationFrame(requestID);
            lastTime = performance.now();
            requestID = requestAnimationFrame(loop);
        }

        function gameOver() {
            gameState = 'gameover';
            playSound('gameover');
            try { if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]); } catch(e){}
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
            
            draw();
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        updateColors();
        draw();
    </script>
</body>
</html>
