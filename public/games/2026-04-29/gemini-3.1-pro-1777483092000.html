<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proxy Gremlins</title>
<style>
  :root {
    --bg-color: #111;
    --text-color: #ffb000;
    --rack-color: #2a2a2a;
    --font: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #111;
      --text-color: #ffb000;
      --rack-color: #2a2a2a;
    }
    body::before {
      opacity: 0;
    }
    #ui {
      background: rgba(0, 0, 0, 0.65);
    }
    #hud, h1, p {
      color: var(--text-color);
      text-shadow: 0 0 6px rgba(255, 176, 0, 0.45);
    }
    button {
      box-shadow: 0 0 12px rgba(255, 176, 0, 0.35);
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-color: #e0e0e0;
      --text-color: #d97700;
      --rack-color: #999;
    }
  }
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: var(--font);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: -1;
    background-image: repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px,
      rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px
    );
    opacity: 0;
  }
  @media (prefers-color-scheme: light) {
    body::before { opacity: 1; }
  }

  canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.1) 50%,
      rgba(0,0,0,0.1)
    );
    background-size: 100% 4px;
  }

  #ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: rgba(0,0,0,0.6);
    z-index: 10;
  }
  @media (prefers-color-scheme: light) {
    #ui { background: rgba(255,255,255,0.7); }
  }

  .hidden { display: none !important; }
  h1 { 
    font-size: 2rem; 
    margin-bottom: 0.5rem; 
    text-shadow: 0 0 10px var(--text-color); 
  }
  p { 
    font-size: 0.9rem; 
    margin-bottom: 2rem; 
    max-width: 80%; 
    line-height: 1.5; 
  }
  button {
    pointer-events: auto;
    background: var(--bg-color);
    border: 2px solid var(--text-color);
    color: var(--text-color);
    font-family: inherit;
    font-size: 1.2rem;
    padding: 1rem 2rem;
    border-radius: 8px;
    text-transform: uppercase;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 176, 0, 0.3);
    transition: all 0.2s;
  }
  button:active {
    background: var(--text-color);
    color: var(--bg-color);
  }

  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 20px);
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 1.5rem;
    font-weight: bold;
    pointer-events: none;
    text-shadow: 0 0 5px var(--text-color);
    z-index: 5;
  }

  #shield-btn {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 20px) + 30px);
    right: 30px;
    width: 70px;
    height: 70px;
    border-radius: 35px;
    border: 2px solid var(--text-color);
    background: var(--bg-color);
    color: var(--text-color);
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    box-shadow: 0 0 15px rgba(255,176,0,0.2);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 5;
  }
  #shield-btn.ready { 
    background: rgba(255,176,0,0.1); 
  }
  #shield-btn.active { 
    background: var(--text-color); 
    color: var(--bg-color); 
    box-shadow: 0 0 20px var(--text-color); 
  }
  #shield-btn span { font-size: 1.2rem; margin-top: 2px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="score">0</div>
</div>

<div id="shield-btn" class="hidden ready">
  SHIELD
  <span id="shield-val">RDY</span>
</div>

<div id="ui">
  <div id="title-screen">
    <h1>PROXY GREMLINS</h1>
    <p>Swipe racks to align ports.<br>Tap screen for SSL Shield.<br>Don't let latency slime climb!</p>
    <button id="start-btn">INITIATE</button>
  </div>
  <div id="game-over-screen" class="hidden">
    <h1>SYSTEM HALTED</h1>
    <p id="final-score">Score: 0</p>
    <button id="restart-btn">REBOOT</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const ui = document.getElementById('ui');
const titleScreen = document.getElementById('title-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const hud = document.getElementById('hud');
const scoreEl = document.getElementById('score');
const shieldBtn = document.getElementById('shield-btn');
const shieldVal = document.getElementById('shield-val');

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type, duration, vol=0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playGameOverTone() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 1);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 1);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 1);
}

let width, height;
let isLightMode = false;
let colors = {};

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  isLightMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  
  if (isLightMode) {
    colors = {
      bg: '#e0e0e0',
      rack: '#aaaaaa',
      rackEdge: '#888888',
      amber: '#d97700',
      spike: '#cc0000',
      multiplex: '#0088cc',
      slime: '#00aa00',
      shield: '#00aacc'
    };
  } else {
    colors = {
      bg: '#111111',
      rack: '#2a2a2a',
      rackEdge: '#444444',
      amber: '#ffb000',
      spike: '#ff3333',
      multiplex: '#00ffff',
      slime: '#33ff33',
      shield: '#00ffcc'
    };
  }
}
window.addEventListener('resize', resize);
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', resize);
resize();

let state = 'TITLE';
let score = 0;
let slime = 0; 
let racks = [];
let packets = [];
let particles = [];
let shieldActive = false;
let shieldTimer = 0;
let shieldCooldown = 0;

let lastTime = 0;
let spawnTimer = 0;
let baseSpeed = 120;
let speedMult = 1;

let activeRackIndex = -1;
let touchStartX = 0;
let touchStartY = 0;
let initialRackOffset = 0;
let isDragging = false;
let selectedRackForKeyboard = 0;

class Rack {
  constructor(y) {
    this.y = y;
    this.offset = Math.random() * width;
    this.height = 30;
    this.ports = [];
    let numPorts = Math.random() > 0.4 ? 2 : 1;
    for (let i = 0; i < numPorts; i++) {
      this.ports.push({
        nx: Math.random() * 0.8,
        nw: 0.15 + Math.random() * 0.15,
        type: Math.random() > 0.75 ? 'multiplex' : 'normal'
      });
    }
  }
  
  draw(ctx, isSelected) {
    ctx.fillStyle = colors.rack;
    ctx.fillRect(0, this.y - this.height/2, width, this.height);
    
    ctx.strokeStyle = colors.rackEdge;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, this.y - this.height/2); ctx.lineTo(width, this.y - this.height/2);
    ctx.moveTo(0, this.y + this.height/2); ctx.lineTo(width, this.y + this.height/2);
    ctx.stroke();

    if (isSelected) {
      ctx.strokeStyle = colors.amber;
      ctx.lineWidth = 1;
      ctx.strokeRect(2, this.y - this.height/2 - 4, width - 4, this.height + 8);
    }

    for (let p of this.ports) {
      let startX = (p.nx * width + this.offset) % width;
      if (startX < 0) startX += width;
      let w = p.nw * width;
      
      let segments = [];
      if (startX + w > width) {
        segments.push({x: startX, w: width - startX});
        segments.push({x: 0, w: startX + w - width});
      } else {
        segments.push({x: startX, w: w});
      }
      
      for (let seg of segments) {
        ctx.fillStyle = colors.bg;
        ctx.fillRect(seg.x, this.y - this.height/2 - 2, seg.w, this.height + 4);
        
        ctx.fillStyle = p.type === 'multiplex' ? colors.multiplex : colors.amber;
        ctx.globalAlpha = 0.6;
        ctx.fillRect(seg.x, this.y - this.height/2, 4, this.height);
        ctx.fillRect(seg.x + seg.w - 4, this.y - this.height/2, 4, this.height);
        ctx.globalAlpha = 1.0;
      }
    }
  }
}

class Packet {
  constructor(x, y, type = 'normal') {
    this.x = x;
    this.y = y;
    this.type = type; 
    this.radius = type === 'spike' ? 10 : 8;
    this.passedRacks = new Set();
  }
  
  draw(ctx) {
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.type === 'spike' ? colors.spike : colors.amber;
    ctx.fillStyle = this.type === 'spike' ? colors.spike : colors.amber;
    
    ctx.beginPath();
    if (this.type === 'spike') {
      let spikes = 5;
      let rot = Math.PI / 2 * 3;
      let x = this.x; let y = this.y;
      let step = Math.PI / spikes;
      ctx.moveTo(x, y - this.radius);
      for(let i=0; i<spikes; i++) {
        x = this.x + Math.cos(rot) * this.radius;
        y = this.y + Math.sin(rot) * this.radius;
        ctx.lineTo(x, y);
        rot += step;
        x = this.x + Math.cos(rot) * (this.radius/2);
        y = this.y + Math.sin(rot) * (this.radius/2);
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(this.x, this.y - this.radius);
    } else {
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 300;
    this.vy = (Math.random() - 0.5) * 300;
    this.life = 1.0;
    this.color = color;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt * 3;
  }
  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

function initGame() {
  initAudio();
  playTone(440, 'square', 0.5, 0.1);
  score = 0;
  slime = 0;
  scoreEl.innerText = score;
  packets = [];
  particles = [];
  racks = [];
  speedMult = 1;
  shieldActive = false;
  shieldTimer = 0;
  shieldCooldown = 0;
  
  let numRacks = 4;
  let spacing = height / (numRacks + 1.5);
  for (let i = 1; i <= numRacks; i++) {
    racks.push(new Rack(i * spacing));
  }
  
  state = 'PLAYING';
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function triggerShield() {
  if (shieldCooldown <= 0 && !shieldActive) {
    shieldActive = true;
    shieldTimer = 1.5; 
    playTone(880, 'sine', 0.3, 0.1);
    if (navigator.vibrate) navigator.vibrate(50);
  }
}

function spawnPacket(overrideY = -20, overrideX = null) {
  let x = overrideX !== null ? overrideX : Math.random() * width;
  let isSpike = Math.random() > (0.95 - Math.min(0.2, speedMult * 0.05));
  packets.push(new Packet(x, overrideY, isSpike ? 'spike' : 'normal'));
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function gameOver() {
  state = 'GAMEOVER';
  playGameOverTone();
  hud.classList.add('hidden');
  shieldBtn.classList.add('hidden');
  gameOverScreen.classList.remove('hidden');
  ui.classList.remove('hidden');
  document.getElementById('final-score').innerText = `Score: ${score}`;
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function loop(time) {
  if (state !== 'PLAYING') return;
  let dt = (time - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = time;
  
  update(dt);
  draw();
  
  requestAnimationFrame(loop);
}

function update(dt) {
  speedMult += dt * 0.02; 
  
  if (shieldActive) {
    shieldTimer -= dt;
    if (shieldTimer <= 0) {
      shieldActive = false;
      shieldCooldown = 3.0;
    }
  } else if (shieldCooldown > 0) {
    shieldCooldown -= dt;
  }
  
  if (shieldActive) {
    shieldBtn.className = 'active';
    shieldVal.innerText = shieldTimer.toFixed(1);
  } else if (shieldCooldown > 0) {
    shieldBtn.className = '';
    shieldVal.innerText = shieldCooldown.toFixed(1);
  } else {
    shieldBtn.className = 'ready';
    shieldVal.innerText = 'RDY';
  }
  
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnPacket();
    spawnTimer = (1.2 / speedMult) * (0.8 + Math.random() * 0.4);
  }
  
  let currentSpeed = baseSpeed * speedMult;
  
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(dt);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  
  for (let i = packets.length - 1; i >= 0; i--) {
    let p = packets[i];
    p.y += currentSpeed * dt;
    
    let hitRack = null;
    for (let j = 0; j < racks.length; j++) {
      let r = racks[j];
      if (p.y + p.radius > r.y - r.height/2 && p.y - p.radius < r.y + r.height/2) {
         if (!p.passedRacks.has(j)) {
            let localX = (p.x - r.offset) % width;
            if (localX < 0) localX += width;
            
            let insidePort = null;
            for (let port of r.ports) {
               let pxStart = port.nx * width;
               let pxEnd = pxStart + port.nw * width;
               if (localX >= pxStart + p.radius && localX <= pxEnd - p.radius) {
                 insidePort = port; break;
               }
            }
            
            p.passedRacks.add(j);
            
            if (insidePort) {
              if (insidePort.type === 'multiplex' && !shieldActive) {
                let p2 = new Packet(p.x, p.y, p.type);
                p2.x = (p.x + 30) % width;
                p2.passedRacks = new Set(p.passedRacks);
                packets.push(p2);
                p.x = (p.x - 30 + width) % width;
                playTone(500, 'triangle', 0.1, 0.05);
              } else {
                playTone(600 + score*5, 'sine', 0.1, 0.05);
              }
            } else {
              hitRack = r;
              break;
            }
         }
      }
    }
    
    if (hitRack) {
      if (p.type === 'spike') {
        if (shieldActive) {
          shieldActive = false;
          shieldCooldown = 3.0;
          createExplosion(p.x, p.y, colors.shield);
          playTone(1200, 'square', 0.2, 0.2);
          if (navigator.vibrate) navigator.vibrate(50);
        } else {
          slime += 25;
          createExplosion(p.x, p.y, colors.spike);
          playTone(100, 'square', 0.4, 0.2);
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
      } else {
        slime += 15;
        createExplosion(p.x, p.y, colors.amber);
        playTone(150, 'sawtooth', 0.2, 0.1);
        if (navigator.vibrate) navigator.vibrate(50);
      }
      packets.splice(i, 1);
      continue;
    }
    
    if (p.y > height + 20) {
      score += 1;
      scoreEl.innerText = score;
      slime = Math.max(0, slime - 2); 
      packets.splice(i, 1);
    }
  }
  
  if (slime >= 100) {
    gameOver();
  }
}

function draw() {
  ctx.fillStyle = colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  for (let i = 0; i < racks.length; i++) {
    racks[i].draw(ctx, i === selectedRackForKeyboard);
  }
  
  for (let p of particles) p.draw(ctx);
  for (let p of packets) p.draw(ctx);
  
  if (slime > 0) {
    let slimeH = (slime / 100) * height * 0.3; 
    ctx.fillStyle = colors.slime;
    ctx.globalAlpha = 0.4;
    ctx.fillRect(0, height - slimeH, width, slimeH);
    
    ctx.globalAlpha = 0.8;
    for(let i=0; i<5; i++) {
       let y = height - slimeH + Math.random() * slimeH;
       let h = Math.random() * 4;
       ctx.fillRect(0, y, width, h);
    }
    ctx.globalAlpha = 1.0;
  }
  
  if (shieldActive) {
    ctx.strokeStyle = colors.shield;
    ctx.lineWidth = 6;
    ctx.globalAlpha = 0.5 + Math.sin(lastTime * 0.01) * 0.3;
    ctx.strokeRect(0, 0, width, height);
    ctx.globalAlpha = 1.0;
  }
}

function handleInputStart(x, y) {
  if (state !== 'PLAYING') return;
  let closest = -1;
  let minDist = Infinity;
  for (let i = 0; i < racks.length; i++) {
    let dist = Math.abs(racks[i].y - y);
    if (dist < minDist) {
      minDist = dist;
      closest = i;
    }
  }
  if (minDist < 80) { 
    activeRackIndex = closest;
    selectedRackForKeyboard = closest;
    touchStartX = x;
    touchStartY = y;
    initialRackOffset = racks[activeRackIndex].offset;
    isDragging = false;
  }
}

function handleInputMove(x, y) {
  if (state !== 'PLAYING' || activeRackIndex === -1) return;
  let dx = x - touchStartX;
  
  if (!isDragging && Math.abs(dx) > 5) {
    isDragging = true;
  }
  
  if (isDragging) {
    racks[activeRackIndex].offset = (initialRackOffset + dx) % width;
    if (racks[activeRackIndex].offset < 0) racks[activeRackIndex].offset += width;
  }
}

function handleInputEnd() {
  if (state !== 'PLAYING') return;
  if (!isDragging && activeRackIndex !== -1) {
    triggerShield();
  }
  activeRackIndex = -1;
  isDragging = false;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault(); 
  handleInputStart(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  handleInputMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  handleInputEnd();
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  handleInputStart(e.clientX, e.clientY);
});
window.addEventListener('mousemove', e => {
  if(e.buttons > 0) handleInputMove(e.clientX, e.clientY);
});
window.addEventListener('mouseup', e => {
  handleInputEnd();
});

window.addEventListener('keydown', e => {
  if (state !== 'PLAYING') return;
  if (e.code === 'Space') {
    e.preventDefault();
    triggerShield();
  } else if (e.code === 'ArrowUp') {
    e.preventDefault();
    selectedRackForKeyboard = Math.max(0, selectedRackForKeyboard - 1);
  } else if (e.code === 'ArrowDown') {
    e.preventDefault();
    selectedRackForKeyboard = Math.min(racks.length - 1, selectedRackForKeyboard + 1);
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    racks[selectedRackForKeyboard].offset = (racks[selectedRackForKeyboard].offset - 30 + width) % width;
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    racks[selectedRackForKeyboard].offset = (racks[selectedRackForKeyboard].offset + 30) % width;
  }
});

startBtn.addEventListener('click', () => {
  ui.classList.add('hidden');
  titleScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  shieldBtn.classList.remove('hidden');
  initGame();
});

restartBtn.addEventListener('click', () => {
  ui.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  shieldBtn.classList.remove('hidden');
  initGame();
});

shieldBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (state === 'PLAYING') {
    triggerShield();
  }
});

resize();
draw();
</script>
</body>
</html>
