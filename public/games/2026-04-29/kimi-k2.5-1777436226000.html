<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dew Loop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    
    :root {
      --bg-sage: #c4d4c4;
      --bg-sage-dark: #2a3a2a;
      --rose-blush: #e8b4b4;
      --rose-deep: #c97878;
      --ink-graphite: #4a4a4a;
      --ink-dark: #2d2d2d;
      --dew-glow: rgba(232, 244, 248, 0.9);
      --thorn-rust: #8b6f5c;
      --text-muted: #6b7b6b;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-sage: #2a3a2a;
        --rose-blush: #a87a7a;
        --rose-deep: #8a5a5a;
        --ink-graphite: #b4b4b4;
        --ink-dark: #e4e4e4;
        --dew-glow: rgba(200, 220, 230, 0.8);
        --thorn-rust: #a0806a;
        --text-muted: #8a9a8a;
      }
    }
    
    body {
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      background: var(--bg-sage);
      overflow: hidden;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    
    .ui-layer {
      position: absolute;
      pointer-events: none;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      z-index: 10;
    }
    
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 14px;
      color: var(--ink-graphite);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .score-section {
      text-align: left;
    }
    
    .loop-section {
      text-align: right;
    }
    
    .score-value, .loop-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--ink-dark);
    }
    
    .ink-bar-container {
      width: 120px;
      height: 4px;
      background: rgba(0,0,0,0.1);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    
    .ink-bar {
      height: 100%;
      background: var(--rose-deep);
      transition: width 0.1s linear;
      border-radius: 2px;
    }
    
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(196, 212, 196, 0.95);
      z-index: 20;
      transition: opacity 0.4s ease;
    }
    
    @media (prefers-color-scheme: dark) {
      .overlay {
        background: rgba(42, 58, 42, 0.95);
      }
    }
    
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .title {
      font-size: 42px;
      font-weight: 300;
      color: var(--ink-dark);
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    
    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 40px;
      text-align: center;
      line-height: 1.6;
      max-width: 280px;
    }
    
    .btn {
      pointer-events: auto;
      background: transparent;
      border: 1px solid var(--ink-graphite);
      color: var(--ink-dark);
      padding: 14px 32px;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 4px;
    }
    
    .btn:hover {
      background: var(--ink-graphite);
      color: var(--bg-sage);
    }
    
    .game-over-stats {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .final-score {
      font-size: 56px;
      font-weight: 300;
      color: var(--rose-deep);
      margin-bottom: 8px;
    }
    
    .best-loop {
      font-size: 14px;
      color: var(--text-muted);
    }
    
    .hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0.7;
      animation: pulse 2s ease infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    
    .combo-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 600;
      color: var(--rose-deep);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
    }
    
    .combo-indicator.show {
      opacity: 1;
      animation: comboPop 0.5s ease;
    }
    
    @keyframes comboPop {
      0% { transform: translate(-50%, -50%) scale(0.5); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div class="ui-layer">
    <div class="hud">
      <div class="score-section">
        <div>Dew</div>
        <div class="score-value" id="score">0</div>
        <div class="ink-bar-container">
          <div class="ink-bar" id="inkBar" style="width: 100%"></div>
        </div>
      </div>
      <div class="loop-section">
        <div>Loops</div>
        <div class="loop-value" id="loops">0</div>
      </div>
    </div>
    <div class="hint" id="hint">Hold to draw · Release to commit</div>
    <div class="combo-indicator" id="combo"></div>
  </div>
  
  <div class="overlay" id="startOverlay">
    <h1 class="title">DEW LOOP</h1>
    <p class="subtitle">
      Draw through the dew.<br>
      Avoid the thorns.<br>
      Close your loops.
    </p>
    <button class="btn" id="startBtn">Begin</button>
  </div>
  
  <div class="overlay hidden" id="gameOverOverlay">
    <div class="game-over-stats">
      <div class="final-score" id="finalScore">0</div>
      <div class="best-loop" id="bestLoop"></div>
    </div>
    <button class="btn" id="restartBtn">Again</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const scoreEl = document.getElementById('score');
    const loopsEl = document.getElementById('loops');
    const inkBar = document.getElementById('inkBar');
    const hint = document.getElementById('hint');
    const comboEl = document.getElementById('combo');
    const finalScoreEl = document.getElementById('finalScore');
    const bestLoopEl = document.getElementById('bestLoop');
    
    // Color scheme (adapts to light/dark)
    const colors = {
      bg: getComputedStyle(document.body).getPropertyValue('--bg-sage').trim(),
      roseBlush: getComputedStyle(document.body).getPropertyValue('--rose-blush').trim(),
      roseDeep: getComputedStyle(document.body).getPropertyValue('--rose-deep').trim(),
      inkGraphite: getComputedStyle(document.body).getPropertyValue('--ink-graphite').trim(),
      inkDark: getComputedStyle(document.body).getPropertyValue('--ink-dark').trim(),
      dewGlow: getComputedStyle(document.body).getPropertyValue('--dew-glow').trim(),
      thornRust: getComputedStyle(document.body).getPropertyValue('--thorn-rust').trim()
    };
    
    // Game state
    let gameState = 'menu'; // menu, playing, gameover
    let width, height;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    
    // Player state
    let score = 0;
    let loops = 0;
    let ink = 100;
    const maxInk = 100;
    let inkRegenRate = 0.3;
    let inkDepletionRate = 0.8;
    
    // Drawing state
    let isDrawing = false;
    let drawPath = [];
    let committedStrokes = [];
    let currentStroke = null;
    let lastPoint = null;
    
    // Difficulty escalation
    let level = 1;
    let timeElapsed = 0;
    let drawTimeLimit = 3000; // ms allowed for one continuous draw
    let drawStartTime = 0;
    
    // Entities
    let stems = [];
    let dews = [];
    let thorns = [];
    let particles = [];
    let collectedDew = new Set();
    
    // Loop detection
    let loopThreshold = 30; // pixels to consider loop closed
    
    // Input handling
    let touchId = null;
    
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    
    function createStem(x, y, angle, length, curvature) {
      const points = [];
      let cx = x;
      let cy = y;
      let ca = angle;
      
      for (let i = 0; i < length; i++) {
        points.push({ x: cx, y: cy });
        ca += curvature + Math.sin(i * 0.1) * 0.02;
        cx += Math.cos(ca) * 15;
        cy += Math.sin(ca) * 15;
      }
      
      return points;
    }
    
    function generateLevel() {
      stems = [];
      dews = [];
      thorns = [];
      collectedDew.clear();
      
      const centerX = width / 2;
      const centerY = height / 2;
      
      // Create looping rose stems radiating from center
      const numStems = 3 + Math.floor(level / 2);
      for (let i = 0; i < numStems; i++) {
        const angle = (i / numStems) * Math.PI * 2 + Math.random() * 0.5;
        const stemLength = 25 + Math.random() * 15;
        const curvature = 0.15 + Math.random() * 0.1;
        const stem = createStem(centerX, centerY, angle, stemLength, curvature);
        stems.push(stem);
        
        // Add dew along stem
        for (let j = 2; j < stem.length - 2; j += 2 + Math.floor(Math.random() * 2)) {
          if (Math.random() > 0.3) {
            dews.push({
              x: stem[j].x,
              y: stem[j].y,
              r: 6 + Math.random() * 4,
              id: `dew-${i}-${j}`,
              pulse: Math.random() * Math.PI * 2,
              collected: false
            });
          }
        }
        
        // Add thorns (more as level increases)
        const thornCount = Math.floor(level / 2) + 1;
        for (let t = 0; t < thornCount; t++) {
          const idx = 5 + Math.floor(Math.random() * (stem.length - 10));
          const perp = Math.atan2(stem[idx+1].y - stem[idx].y, stem[idx+1].x - stem[idx].x) + Math.PI/2;
          thorns.push({
            x: stem[idx].x + Math.cos(perp) * 8,
            y: stem[idx].y + Math.sin(perp) * 8,
            r: 5,
            angle: perp
          });
        }
      }
    }
    
    function startGame() {
      gameState = 'playing';
      score = 0;
      loops = 0;
      ink = maxInk;
      level = 1;
      timeElapsed = 0;
      committedStrokes = [];
      drawPath = [];
      isDrawing = false;
      currentStroke = null;
      
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      hint.style.opacity = '0.7';
      
      generateLevel();
      updateUI();
      
      setTimeout(() => {
        hint.style.opacity = '0';
      }, 4000);
    }
    
    function gameOver(reason) {
      gameState = 'gameover';
      finalScoreEl.textContent = score;
      bestLoopEl.textContent = loops > 0 ? `Best streak: ${loops} loops` : 'No loops completed';
      gameOverOverlay.classList.remove('hidden');
      
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }
    
    function getPointerPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }
    
    function onPointerDown(e) {
      if (gameState !== 'playing') return;
      e.preventDefault();
      
      const pos = getPointerPos(e);
      if (!pos) return;
      
      isDrawing = true;
      drawStartTime = Date.now();
      drawPath = [pos];
      lastPoint = pos;
      currentStroke = { points: [pos], collectedDew: new Set() };
      
      hint.style.opacity = '0';
    }
    
    function onPointerMove(e) {
      if (!isDrawing || gameState !== 'playing') return;
      e.preventDefault();
      
      const pos = getPointerPos(e);
      if (!pos) return;
      
      // Distance check for smooth lines
      const dist = Math.hypot(pos.x - lastPoint.x, pos.y - lastPoint.y);
      if (dist > 5) {
        drawPath.push(pos);
        currentStroke.points.push(pos);
        lastPoint = pos;
        
        // Check dew collection
        for (let dew of dews) {
          if (!dew.collected && !collectedDew.has(dew.id)) {
            const d = Math.hypot(pos.x - dew.x, pos.y - dew.y);
            if (d < dew.r + 10) {
              dew.collected = true;
              collectedDew.add(dew.id);
              currentStroke.collectedDew.add(dew.id);
              score += 10;
              createParticles(dew.x, dew.y, colors.dewGlow);
              if (navigator.vibrate) navigator.vibrate(10);
            }
          }
        }
        
        // Check thorn collision
        for (let thorn of thorns) {
          const d = Math.hypot(pos.x - thorn.x, pos.y - thorn.y);
          if (d < thorn.r + 8) {
            createParticles(pos.x, pos.y, colors.thornRust, 8);
            gameOver('thorn');
            return;
          }
        }
        
        // Check self-intersection (only if enough points)
        if (currentStroke.points.length > 20) {
          const head = currentStroke.points[currentStroke.points.length - 1];
          for (let i = 0; i < currentStroke.points.length - 30; i++) {
            const p = currentStroke.points[i];
            if (Math.hypot(head.x - p.x, head.y - p.y) < 15) {
              gameOver('snapped');
              return;
            }
          }
        }
      }
    }
    
    function onPointerUp(e) {
      if (!isDrawing || gameState !== 'playing') return;
      e.preventDefault();
      
      isDrawing = false;
      
      // Check for loop completion
      if (currentStroke.points.length > 30) {
        const first = currentStroke.points[0];
        const last = currentStroke.points[currentStroke.points.length - 1];
        const loopDist = Math.hypot(last.x - first.x, last.y - first.y);
        
        if (loopDist < loopThreshold) {
          loops++;
          score += 50 + (loops * 20);
          showCombo(loops);
          
          // Refill ink on loop
          ink = Math.min(maxInk, ink + 25);
          
          // Respawn dew for continued flow
          regenerateDew();
          
          // Escalation
          if (loops % 3 === 0) {
            level++;
            inkDepletionRate = Math.min(2, inkDepletionRate + 0.1);
          }
          
          createParticles((first.x + last.x) / 2, (first.y + last.y) / 2, colors.roseDeep, 15);
          if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
        }
      }
      
      // Commit stroke
      if (currentStroke && currentStroke.points.length > 5) {
        committedStrokes.push({
          points: [...currentStroke.points],
          opacity: 1
        });
      }
      
      currentStroke = null;
      drawPath = [];
    }
    
    function regenerateDew() {
      // Add new dew spots on existing stems
      for (let stem of stems) {
        for (let j = 2; j < stem.length - 2; j += 3) {
          if (Math.random() > 0.5 && !collectedDew.has(`regen-${j}`)) {
            const existing = dews.find(d => Math.hypot(d.x - stem[j].x, d.y - stem[j].y) < 20);
            if (!existing) {
              dews.push({
                x: stem[j].x,
                y: stem[j].y,
                r: 6 + Math.random() * 4,
                id: `regen-${j}-${Date.now()}`,
                pulse: Math.random() * Math.PI * 2,
                collected: false
              });
            }
          }
        }
      }
    }
    
    function showCombo(n) {
      comboEl.textContent = `LOOP ×${n}`;
      comboEl.classList.add('show');
      setTimeout(() => comboEl.classList.remove('show'), 600);
    }
    
    function createParticles(x, y, color, count = 5) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 1,
          color: color,
          size: 2 + Math.random() * 3
        });
      }
    }
    
    function updateUI() {
      scoreEl.textContent = score;
      loopsEl.textContent = loops;
      inkBar.style.width = (ink / maxInk * 100) + '%';
    }
    
    function update(dt) {
      if (gameState !== 'playing') return;
      
      timeElapsed += dt;
      
      // Ink management
      if (isDrawing) {
        ink -= inkDepletionRate;
        const drawTime = Date.now() - drawStartTime;
        // Hard time limit on continuous drawing
        if (drawTime > drawTimeLimit - (level * 100) || ink <= 0) {
          gameOver('exhausted');
          return;
        }
      } else {
        ink = Math.min(maxInk, ink + inkRegenRate);
      }
      
      // Update particles
      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        p.vx *= 0.95;
        p.vy *= 0.95;
        return p.life > 0;
      });
      
      // Fade committed strokes
      committedStrokes = committedStrokes.filter(s => {
        if (!isDrawing) s.opacity -= 0.005;
        return s.opacity > 0.1;
      });
      
      // Animate dew
      for (let dew of dews) {
        dew.pulse += 0.05;
      }
      
      updateUI();
    }
    
    function draw() {
      // Clear with background
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, width, height);
      
      // Draw subtle vignette
      const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(1, 'rgba(0,0,0,0.08)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      
      // Draw stems (graphite lines)
      ctx.strokeStyle = colors.inkGraphite;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.6;
      
      for (let stem of stems) {
        ctx.beginPath();
        ctx.moveTo(stem[0].x, stem[0].y);
        for (let i = 1; i < stem.length; i++) {
          ctx.lineTo(stem[i].x, stem[i].y);
        }
        ctx.stroke();
      }
      
      // Draw thorns
      ctx.fillStyle = colors.thornRust;
      for (let thorn of thorns) {
        ctx.save();
        ctx.translate(thorn.x, thorn.y);
        ctx.rotate(thorn.angle);
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.lineTo(8, 0);
        ctx.lineTo(0, 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      
      ctx.globalAlpha = 1;
      
      // Draw dew drops
      for (let dew of dews) {
        if (dew.collected) continue;
        
        const pulse = 1 + Math.sin(dew.pulse) * 0.15;
        const r = dew.r * pulse;
        
        // Glow
        const glow = ctx.createRadialGradient(dew.x, dew.y, 0, dew.x, dew.y, r * 2);
        glow.addColorStop(0, colors.dewGlow);
        glow.addColorStop(1, 'rgba(232, 244, 248, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(dew.x, dew.y, r * 2, 0, Math.PI * 2);
        ctx.fill();
        
        // Core
        ctx.fillStyle = colors.dewGlow;
        ctx.beginPath();
        ctx.arc(dew.x, dew.y, r, 0, Math.PI * 2);
        ctx.fill();
        
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(dew.x - r*0.3, dew.y - r*0.3, r*0.25, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // Draw committed strokes (fading ink trails)
      ctx.strokeStyle = colors.inkDark;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      for (let stroke of committedStrokes) {
        ctx.globalAlpha = stroke.opacity * 0.4;
        ctx.beginPath();
        ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }
        ctx.stroke();
      }
      
      ctx.globalAlpha = 1;
      
      // Draw current stroke
      if (isDrawing && drawPath.length > 1) {
        // Preview line (lighter while drawing)
        ctx.strokeStyle = colors.inkDark;
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.8;
        
        ctx.beginPath();
        ctx.moveTo(drawPath[0].x, drawPath[0].y);
        for (let i = 1; i < drawPath.length; i++) {
          ctx.lineTo(drawPath[i].x, drawPath[i].y);
        }
        ctx.stroke();
        
        ctx.globalAlpha = 1;
        
        // Draw loop proximity indicator
        if (drawPath.length > 20) {
          const first = drawPath[0];
          const last = drawPath[drawPath.length - 1];
          const dist = Math.hypot(last.x - first.x, last.y - first.y);
          
          if (dist < loopThreshold * 2) {
            ctx.strokeStyle = colors.roseDeep;
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.globalAlpha = 1 - (dist / (loopThreshold * 2));
            ctx.beginPath();
            ctx.arc(first.x, first.y, loopThreshold, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1;
          }
        }
      }
      
      // Draw particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    
    // Event listeners
    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    canvas.addEventListener('touchend', onPointerUp, { passive: false });
    canvas.addEventListener('touchcancel', onPointerUp, { passive: false });
    
    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', onPointerUp);
    
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    
    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (gameState === 'menu' || gameState === 'gameover') {
          startGame();
        } else if (gameState === 'playing' && !isDrawing) {
          // Simulate touch at center
          const event = {
            preventDefault: () => {},
            clientX: width / 2,
            clientY: height / 2
          };
          onPointerDown(event);
        }
      }
    });
    
    document.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && gameState === 'playing' && isDrawing) {
        onPointerUp({ preventDefault: () => {} });
      }
    });
    
    // Game loop
    let lastTime = 0;
    function loop(timestamp) {
      const dt = timestamp - lastTime;
      lastTime = timestamp;
      
      update(dt);
      draw();
      
      requestAnimationFrame(loop);
    }
    
    // Init
    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
