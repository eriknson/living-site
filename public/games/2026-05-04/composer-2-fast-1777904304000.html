<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bloom Route — Ops Daemon</title>
  <style>
    :root {
      --bg0: #081012;
      --bg1: #0e1c18;
      --fg: #c8f5e8;
      --muted: #5a8a7e;
      --lane: rgba(0, 255, 200, 0.06);
      --accent: #00e8b8;
      --hud: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg0: #081012;
        --bg1: #0e1c18;
        --fg: #c8f5e8;
        --muted: #5a8a7e;
        --lane: rgba(0, 255, 200, 0.06);
        --accent: #00e8b8;
      }
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg0: #e6f2ec;
        --bg1: #d8ebe3;
        --fg: #14302a;
        --muted: #4d7368;
        --lane: rgba(0, 120, 90, 0.08);
        --accent: #008866;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg0);
      color: var(--fg);
      font-family: var(--hud);
      touch-action: manipulation;
    }
    #wrap {
      width: 100dvw;
      height: 100dvh;
      position: relative;
      background: linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    #cv {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.92;
    }
    .mono { font-variant-numeric: tabular-nums; }
    #panel {
      pointer-events: auto;
      align-self: center;
      width: min(92dvw, 400px);
      text-align: center;
      padding: 22px 20px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--bg1) 85%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }
    #panel h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
      color: var(--accent);
    }
    #panel p {
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 160px;
      padding: 0 22px;
      font-family: var(--hud);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: var(--bg0);
      font-weight: 700;
    }
    @media (prefers-color-scheme: light) {
      .btn { color: #fff; }
    }
    .hint {
      margin-top: 12px;
      font-size: 10px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="cv" aria-label="Bloom Route game"></canvas>
    <div id="overlay">
      <div class="hud-row" id="hudTop">
        <span>DEPLOY <span class="mono" id="deploy">50.0</span>s</span>
        <span id="waveHint">WAVE 1</span>
        <span>SPILLS <span class="mono" id="spills">0</span>/6</span>
      </div>
      <div></div>
      <div id="panel">
        <h1 id="ptitle">BLOOM ROUTE</h1>
        <p id="ptext">Swipe ←→ to change lanes. Tap to bump priority (speeds packets in your lane). Catch fireflies only when your lane matches their blossom glyph.</p>
        <button type="button" class="btn" id="pbtn">DEPLOY</button>
        <div class="hint">Round ~50s · Terminal vines · Spring mesh</div>
      </div>
      <div class="hud-row" id="hudBot">
        <span>SCORE <span class="mono" id="score">0</span></span>
        <span>COMBO <span class="mono" id="combo">×1</span></span>
      </div>
    </div>
  </div>
  <script>
(function () {
  'use strict';

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d', { alpha: false });

  var panel = document.getElementById('panel');
  var ptitle = document.getElementById('ptitle');
  var ptext = document.getElementById('ptext');
  var pbtn = document.getElementById('pbtn');
  var elDeploy = document.getElementById('deploy');
  var elSpills = document.getElementById('spills');
  var elScore = document.getElementById('score');
  var elCombo = document.getElementById('combo');
  var elWave = document.getElementById('waveHint');

  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  var prefersLight = false;
  function syncTheme() {
    prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  syncTheme();
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', syncTheme);
  }

  var PAL = {
    dark: { bg: '#081012', lane: 'rgba(0,255,200,0.07)', vine: '#00c896', glow: ['#39ff14', '#00ffd0', '#ffb347'], glyph: '#ff7a9a' },
    light: { bg: '#e6f2ec', lane: 'rgba(0,90,70,0.09)', vine: '#008866', glow: ['#1a9d3a', '#00997a', '#cc7700'], glyph: '#cc4466' }
  };

  var STATE = 'title';
  var lane = 1;
  var deployT = 50;
  var spills = 0;
  var score = 0;
  var combo = 1;
  var wave = 1;
  var spawnAcc = 0;
  var jitterPhase = 0;
  var shake = 0;
  var bumpT = 0;
  var packets = [];
  var particles = [];
  var last = performance.now();
  var audioCtx = null;

  var spawnInterval = 1.15;
  var protocolChance = 0.08;
  var jitterAmp = 4;

  function ensureAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) {}
  }

  function beep(freq, dur, type, gain) {
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = gain || 0.08;
      o.connect(g);
      g.connect(audioCtx.destination);
      var t = audioCtx.currentTime;
      g.gain.setValueAtTime(gain || 0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t);
      o.stop(t + dur + 0.05);
    } catch (e) {}
  }

  function buzz(ms) {
    if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {}
  }

  function resize() {
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function laneX(i, jit) {
    var fw = W / 3;
    var j = jit || 0;
    return (i + 0.5) * fw + j;
  }

  function resetGame() {
    lane = 1;
    deployT = 50;
    spills = 0;
    score = 0;
    combo = 1;
    wave = 1;
    spawnAcc = 0;
    packets = [];
    particles = [];
    spawnInterval = 1.12;
    protocolChance = 0.07;
    jitterAmp = 3.5;
    bumpT = 0;
    shake = 0;
    STATE = 'play';
    panel.classList.add('hidden');
    ensureAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    hud();
  }

  function titleScreen() {
    STATE = 'title';
    panel.classList.remove('hidden');
    ptitle.textContent = 'BLOOM ROUTE';
    ptext.textContent = 'Swipe ←→ lanes · Tap priority bump · Match blossom glyphs · Survive deploy';
    pbtn.textContent = 'DEPLOY';
    hud();
  }

  function gameOver(win) {
    STATE = 'over';
    panel.classList.remove('hidden');
    ptitle.textContent = win ? 'GREEN DEPLOY' : 'ROLLBACK';
    ptext.textContent = win
      ? ('Packets routed: ' + score + ' · Wave ' + wave + ' · No spill overflow.')
      : ('Spills exceeded · Score ' + score + ' · Try tighter lane swaps.');
    pbtn.textContent = 'PLAY AGAIN';
    buzz(win ? [30, 50, 30] : [80, 40, 80]);
  }

  function hud() {
    elDeploy.textContent = deployT.toFixed(1);
    elSpills.textContent = spills;
    elScore.textContent = score;
    elCombo.textContent = '×' + combo;
    elWave.textContent = 'WAVE ' + wave;
  }

  function spawnPacket() {
    var target = (Math.random() * 3) | 0;
    var col = (Math.random() * 3) | 0;
    var protocol = Math.random() < protocolChance;
    packets.push({
      x: laneX(col, 0),
      y: -24 - Math.random() * 40,
      vx: 0,
      vy: 52 + wave * 7 + Math.random() * 22,
      laneSpawn: col,
      target: target,
      protocol: protocol,
      shifted: false,
      pulse: Math.random() * Math.PI * 2,
      r: 7 + Math.random() * 2
    });
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 120;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 0.35 + Math.random() * 0.25, col: col });
    }
  }

  function priorityBump() {
    bumpT = 0.55;
    var fw = W / 3;
    var lx0 = lane * fw;
    var lx1 = (lane + 1) * fw;
    for (var i = 0; i < packets.length; i++) {
      var p = packets[i];
      if (p.x >= lx0 && p.x <= lx1) p.vy *= 1.85;
    }
    beep(440, 0.06, 'square', 0.06);
    buzz(12);
  }

  function attemptSwipe(dx, dy) {
    if (STATE !== 'play') return;
    var ax = Math.abs(dx);
    var ay = Math.abs(dy);
    if (ax < 28 && ay < 28) return;
    if (ax >= ay) {
      if (dx < -18 && lane > 0) { lane--; buzz(8); beep(320, 0.04, 'triangle', 0.05); }
      else if (dx > 18 && lane < 2) { lane++; buzz(8); beep(380, 0.04, 'triangle', 0.05); }
    }
  }

  var tx0 = 0, ty0 = 0, tDown = 0;

  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    tx0 = e.clientX;
    ty0 = e.clientY;
    tDown = performance.now();
    try { e.preventDefault(); } catch (err) {}
  }

  function onPointerUp(e) {
    try { e.preventDefault(); } catch (err) {}
    var dt = performance.now() - tDown;
    var dx = e.clientX - tx0;
    var dy = e.clientY - ty0;
    if (STATE === 'title' || STATE === 'over') return;
    if (Math.abs(dx) < 14 && Math.abs(dy) < 14 && dt < 320) {
      priorityBump();
    } else {
      attemptSwipe(dx, dy);
    }
  }

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });

  window.addEventListener('keydown', function (e) {
    ensureAudio();
    if (STATE === 'title' || STATE === 'over') {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        resetGame();
      }
      return;
    }
    if (e.code === 'ArrowLeft') { if (lane > 0) lane--; e.preventDefault(); }
    if (e.code === 'ArrowRight') { if (lane < 2) lane++; e.preventDefault(); }
    if (e.code === 'Space') { e.preventDefault(); priorityBump(); }
  });

  pbtn.addEventListener('click', function () {
    ensureAudio();
    resetGame();
  });

  function drawGlyph(cx, cy, radius, targetIdx, active) {
    var pal = prefersLight ? PAL.light : PAL.dark;
    var cols = pal.glow;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = cols[targetIdx];
    ctx.fillStyle = prefersLight ? 'rgba(255,255,255,0.35)' : 'rgba(0,40,35,0.5)';
    ctx.lineWidth = active ? 3 : 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    for (var i = 0; i < 6; i++) {
      var a = (i / 6) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * radius * 0.35, Math.sin(a) * radius * 0.35);
      ctx.lineTo(Math.cos(a) * radius * 1.15, Math.sin(a) * radius * 1.15);
      ctx.strokeStyle = pal.glyph;
      ctx.globalAlpha = 0.35 + (targetIdx === (i % 3) ? 0.45 : 0);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawVines(jitArr) {
    var pal = prefersLight ? PAL.light : PAL.dark;
    ctx.strokeStyle = pal.vine;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var s = 0; s < 5; s++) {
      var bx = (s + 0.5) * (W / 5);
      ctx.moveTo(bx, H);
      for (var y = H; y > 0; y -= 40) {
        ctx.lineTo(bx + Math.sin(y * 0.02 + jitterPhase + s) * 16 * (jitterAmp / 10), y);
      }
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = pal.lane;
    ctx.lineWidth = 1;
    for (var i = 1; i < 3; i++) {
      var jx = (W / 3) * i + (jitArr[i - 1] || 0);
      ctx.beginPath();
      ctx.moveTo(jx, 0);
      ctx.lineTo(jx, H);
      ctx.stroke();
    }
  }

  function update(dt) {
    if (STATE !== 'play') return;

    deployT -= dt;
    if (deployT <= 0) {
      gameOver(true);
      return;
    }

    jitterPhase += dt * (2.4 + wave * 0.25);

    var prog = 1 - deployT / 50;
    wave = 1 + ((prog * 5) | 0);
    spawnInterval = Math.max(0.42, 1.15 - prog * 0.72);
    protocolChance = Math.min(0.38, 0.07 + prog * 0.34);
    jitterAmp = 3.5 + prog * 14;

    spawnAcc += dt;
    while (spawnAcc >= spawnInterval) {
      spawnAcc -= spawnInterval;
      spawnPacket();
    }

    if (bumpT > 0) bumpT -= dt;

    var collectY = H > 0 ? H * 0.78 : 0;
    var pal = prefersLight ? PAL.light : PAL.dark;

    for (var i = packets.length - 1; i >= 0; i--) {
      var p = packets[i];

      if (p.protocol && !p.shifted && p.y > H * 0.35 && p.y < H * 0.62) {
        if (Math.random() < 0.022 * dt * 60) {
          p.shifted = true;
          p.target = (p.target + 1 + ((Math.random() * 2) | 0)) % 3;
          burst(p.x, p.y, '#ffffff', 6);
        }
      }

      var tx = laneX(p.target, Math.sin(jitterPhase + p.target * 1.7) * jitterAmp * 0.35);
      p.vx += (tx - p.x) * 2.4 * dt;
      p.x += p.vx * dt;
      p.vx *= Math.pow(0.88, dt * 60);
      p.y += p.vy * dt;

      p.pulse += dt * 5;

      if (p.y >= collectY) {
        var ok = (lane === p.target);
        if (ok) {
          score += 10 + combo * 4;
          combo = Math.min(8, combo + 1);
          burst(p.x, p.y, pal.glow[p.target], 14);
          beep(520 + p.target * 60, 0.07, 'sine', 0.07);
          buzz(15);
        } else {
          spills++;
          combo = 1;
          shake = 0.45;
          burst(p.x, p.y, '#ff4444', 10);
          beep(140, 0.18, 'sawtooth', 0.06);
          buzz([40, 30, 60]);
          if (spills >= 6) {
            packets.splice(i, 1);
            gameOver(false);
            return;
          }
        }
        packets.splice(i, 1);
      }
    }

    for (var j = particles.length - 1; j >= 0; j--) {
      var q = particles[j];
      q.life -= dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.vy += 180 * dt;
      if (q.life <= 0) particles.splice(j, 1);
    }

    if (shake > 0) shake -= dt;
    hud();
  }

  function drawPacket(p) {
    var pal = prefersLight ? PAL.light : PAL.dark;
    var col = pal.glow[p.target];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var pr = 1 + Math.sin(p.pulse) * 0.12;
    var rad = p.r * pr;
    var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad * 3);
    g.addColorStop(0, col);
    g.addColorStop(0.4, col + '99');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rad * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = prefersLight ? '#fff' : '#e0fff8';
    ctx.beginPath();
    ctx.arc(p.x, p.y, rad * 0.55, 0, Math.PI * 2);
    ctx.fill();
    if (p.protocol) {
      ctx.strokeStyle = prefersLight ? '#004433' : '#88ffd0';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();

    var nodeY = H - 56;
    var gx = laneX(p.target, Math.sin(jitterPhase + p.target) * jitterAmp * 0.35);
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(gx, nodeY);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    var collectLine = H > 0 ? H * 0.78 : 0;

    syncTheme();
    var bg = prefersLight ? PAL.light.bg : PAL.dark.bg;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var j0 = Math.sin(jitterPhase * 1.3) * jitterAmp;
    var j1 = Math.cos(jitterPhase * 1.1) * jitterAmp * 0.9;
    var jitArr = [j0, j1];

    var sx = (Math.random() - 0.5) * shake * 18;
    var sy = (Math.random() - 0.5) * shake * 14;
    ctx.save();
    ctx.translate(sx, sy);

    drawVines(jitArr);

    var nodeY = H - 56;
    var nodeR = Math.min(W, H) * 0.045;
    for (var n = 0; n < 3; n++) {
      var nx = laneX(n, Math.sin(jitterPhase + n * 2.1) * jitterAmp * 0.35);
      drawGlyph(nx, nodeY, nodeR, n, lane === n);
    }

    ctx.globalAlpha = 0.25;
    ctx.fillStyle = prefersLight ? 'rgba(0,120,90,0.15)' : 'rgba(0,255,200,0.08)';
    ctx.fillRect(lane * (W / 3), collectLine - 8, W / 3, H - collectLine + 8);
    ctx.globalAlpha = 1;

    ctx.strokeStyle = prefersLight ? PAL.light.vine : PAL.dark.vine;
    ctx.lineWidth = bumpT > 0 ? 4 : 2;
    ctx.globalAlpha = bumpT > 0 ? 0.95 : 0.65;
    var lx = laneX(lane, 0);
    ctx.beginPath();
    ctx.moveTo(lx, collectLine - 22);
    ctx.lineTo(lx, H - 6);
    ctx.stroke();
    ctx.globalAlpha = 1;

    for (var i = 0; i < packets.length; i++) drawPacket(packets[i]);

    for (var j = 0; j < particles.length; j++) {
      var q = particles[j];
      ctx.globalAlpha = Math.max(0, q.life * 3);
      ctx.fillStyle = q.col;
      ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    ctx.fillStyle = prefersLight ? 'rgba(230,242,236,0.92)' : 'rgba(8,16,18,0.78)';
    ctx.fillRect(0, 0, W, 44);
    ctx.fillStyle = prefersLight ? '#14302a' : '#c8f5e8';
    ctx.font = '11px ' + (window.getComputedStyle(document.body).fontFamily || 'monospace');
    ctx.textAlign = 'center';
    ctx.fillText('DEPLOY WINDOW · ROUTE PACKETS TO MATCHING BLOSSOMS', W / 2, 28);

    update(dt);
    requestAnimationFrame(frame);
  }

  titleScreen();
  resize();

  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
