<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Fiber Ridge</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100dvw; height: 100dvh;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        }
        canvas {
            display: block; width: 100%; height: 100%;
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
let theme = {};

function updateTheme() {
    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    theme = {
        bg: isDark ? '#081418' : '#eaf8f9',
        spikeFill: isDark ? 'rgba(30, 60, 70, 0.5)' : 'rgba(255, 255, 255, 0.7)',
        spikeStroke: isDark ? '#26515c' : '#ffffff',
        trail: isDark ? '#00ffff' : '#00aacc',
        trailGlow: isDark ? '#00ffff' : '#0088aa',
        text: isDark ? '#b8e6d9' : '#1b4a3c',
        serpent: isDark ? '#ff4040' : '#e62e00' 
    };
}
updateTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let state = 'title'; // title, playing, gameover, won
let progress = 0;
let trail = [];
let spikes = [];
let serpents = [];
let particles = [];
let fingerPos = { x: -1, y: -1 };
let isDrawing = false;
let touchId = null;
let lastTime = performance.now();
let deathReason = "";
let winTime = 0;
let nextSpikeDist = 0;
let nextSerpentTimer = 5;

let stars = Array.from({length: 50}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    size: Math.random() * 2 + 1,
    speed: Math.random() * 0.5 + 0.1
}));

let audioCtx;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playDeathSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
}

function playWinSound() {
    if (!audioCtx) return;
    [261.63, 329.63, 392.00, 523.25].forEach((freq, i) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.5 + i*0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 4.0);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 4.0);
    });
}

function startGame(x, y) {
    state = 'playing';
    progress = 0;
    trail = [];
    spikes = [];
    serpents = [];
    particles = [];
    fingerPos = { x, y };
    isDrawing = true;
    lastTime = performance.now();
    deathReason = "";
    winTime = 0;
    nextSpikeDist = 0;
    nextSerpentTimer = 5;
}

function handlePointerDown(e) {
    if (e.target !== canvas) return;
    e.preventDefault();
    initAudio();
    
    if (!isDrawing && (state === 'title' || state === 'gameover' || (state === 'won' && winTime > 1.0))) {
        startGame(e.clientX, e.clientY);
        touchId = e.pointerId;
    }
}

function handlePointerMove(e) {
    if (!isDrawing || e.pointerId !== touchId) return;
    e.preventDefault();
    fingerPos = { x: e.clientX, y: e.clientY };
}

function handlePointerUp(e) {
    if (e.pointerId === touchId) {
        isDrawing = false;
        touchId = null;
        if (state === 'playing') {
            triggerGameOver("Connection Broken");
        }
    }
}

window.addEventListener('pointerdown', handlePointerDown);
window.addEventListener('pointermove', handlePointerMove, { passive: false });
window.addEventListener('pointerup', handlePointerUp);
window.addEventListener('pointercancel', handlePointerUp);
window.addEventListener('pointerout', handlePointerUp);

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 200 + 50;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: color
        });
    }
}

function updateParticles(dt, speed) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += (p.vx - speed) * dt;
        p.y += p.vy * dt;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function updateObstacles(dt, speed, prog) {
    nextSpikeDist -= speed * dt;
    if (nextSpikeDist <= 0 && state === 'playing') {
        let w = Math.random() * 50 + 30;
        let gap = Math.random() * 100 + 200 - (prog * 150); 
        gap = Math.max(gap, 80);
        
        let type = Math.random();
        let bottomH = 0;
        let topH = 0;
        
        let maxHeight = canvas.height * 0.8;
        
        if (type < 0.3) {
            bottomH = Math.random() * maxHeight * 0.8 + 20;
        } else if (type < 0.6) {
            topH = Math.random() * maxHeight * 0.8 + 20;
        } else {
            let center = Math.random() * (canvas.height * 0.6) + canvas.height * 0.2;
            let passHeight = Math.random() * 80 + 120 - (prog * 60); 
            passHeight = Math.max(passHeight, 60);
            bottomH = canvas.height - (center + passHeight/2);
            topH = center - passHeight/2;
        }
        
        if (bottomH > 0) {
            spikes.push({
                x: canvas.width, w: w, h: 0, targetH: bottomH, isTop: false,
                growRate: bottomH / (Math.random() * 1 + 0.5)
            });
        }
        if (topH > 0) {
            spikes.push({
                x: canvas.width, w: w, h: 0, targetH: topH, isTop: true,
                growRate: topH / (Math.random() * 1 + 0.5)
            });
        }
        
        nextSpikeDist = w + gap;
    }
    
    for (let i = spikes.length - 1; i >= 0; i--) {
        let s = spikes[i];
        s.x -= speed * dt;
        if (s.h < s.targetH) {
            s.h += s.growRate * dt;
            if (s.h > s.targetH) s.h = s.targetH;
        }
        if (s.x + s.w < 0) {
            spikes.splice(i, 1);
        }
    }
}

function updateSerpents(dt, speed, prog) {
    if (prog < 0.1 || state !== 'playing') return;
    nextSerpentTimer -= dt;
    if (nextSerpentTimer <= 0) {
        serpents.push({
            x: canvas.width + 50,
            y: Math.random() * canvas.height,
            vx: -speed * (Math.random() * 0.5 + 1.2),
            vy: 0,
            history: []
        });
        nextSerpentTimer = Math.random() * 3 + 4 - (prog * 3);
        nextSerpentTimer = Math.max(nextSerpentTimer, 0.8);
    }
    
    for (let i = serpents.length - 1; i >= 0; i--) {
        let s = serpents[i];
        
        let targetY = s.y;
        if (trail.length > 0) {
            let closest = trail[0];
            let minDist = Math.abs(trail[0].x - s.x);
            for(let p of trail) {
                let d = Math.abs(p.x - s.x);
                if (d < minDist) {
                    minDist = d;
                    closest = p;
                }
            }
            if (minDist < 200) { 
                targetY = closest.y;
            } else {
                targetY = fingerPos.y;
            }
        } else {
            targetY = fingerPos.y;
        }
        
        let dy = targetY - s.y;
        s.vy += Math.sign(dy) * 600 * dt; 
        s.vy *= 0.93; 
        
        if (s.vy > 350) s.vy = 350;
        if (s.vy < -350) s.vy = -350;
        
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        
        s.history.push({x: s.x, y: s.y});
        if (s.history.length > 20) s.history.shift();
        
        if (s.x < -100) {
            serpents.splice(i, 1);
        }
    }
}

function rectCircleCollide(circle, rect) {
    let testX = circle.x;
    let testY = circle.y;
    
    if (circle.x < rect.x) testX = rect.x;
    else if (circle.x > rect.x + rect.w) testX = rect.x + rect.w;
    
    if (circle.y < rect.y) testY = rect.y;
    else if (circle.y > rect.y + rect.h) testY = rect.y + rect.h;
    
    let distX = circle.x - testX;
    let distY = circle.y - testY;
    return (distX*distX + distY*distY) <= (circle.r * circle.r);
}

function distToSegmentSquared(p, v, w) {
    let l2 = (v.x - w.x)*(v.x - w.x) + (v.y - w.y)*(v.y - w.y);
    if (l2 == 0) return (p.x - v.x)*(p.x - v.x) + (p.y - v.y)*(p.y - v.y);
    let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
    t = Math.max(0, Math.min(1, t));
    let projX = v.x + t * (w.x - v.x);
    let projY = v.y + t * (w.y - v.y);
    return (p.x - projX)*(p.x - projX) + (p.y - projY)*(p.y - projY);
}

function checkCollisions() {
    let head = { x: fingerPos.x, y: fingerPos.y, r: 8 };
    
    for (let s of spikes) {
        let rect = s.isTop 
            ? { x: s.x, y: 0, w: s.w, h: s.h }
            : { x: s.x, y: canvas.height - s.h, w: s.w, h: s.h };
            
        if (rectCircleCollide(head, rect)) {
            spawnParticles(head.x, head.y, theme.spikeStroke, 30);
            return "Hit the ridge";
        }
    }
    
    for (let s of serpents) {
        let sCircle = { x: s.x, y: s.y, r: 10 };
        
        if (Math.hypot(s.x - head.x, s.y - head.y) < head.r + sCircle.r) {
            spawnParticles(head.x, head.y, theme.serpent, 30);
            return "Signal corrupted by noise";
        }
        
        for (let i = 0; i < trail.length - 1; i++) {
            let v = trail[i];
            let w = trail[i+1];
            if (distToSegmentSquared(sCircle, v, w) < sCircle.r * sCircle.r) {
                spawnParticles(s.x, s.y, theme.serpent, 30);
                return "Thread severed by noise";
            }
        }
    }
    
    return null;
}

function triggerGameOver(reason) {
    state = 'gameover';
    deathReason = reason;
    playDeathSound();
    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
    
    for (let i=0; i<trail.length; i+=4) {
        spawnParticles(trail[i].x, trail[i].y, theme.trail, 2);
    }
    trail = []; 
}

function drawBackground(dt, speed) {
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    for (let s of stars) {
        s.x -= s.speed * speed * dt;
        if (s.x < 0) {
            s.x = canvas.width;
            s.y = Math.random() * canvas.height;
        }
        ctx.fillStyle = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    }
    
    if (state === 'won') {
        let grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grd.addColorStop(0, '#7ce8ff'); 
        grd.addColorStop(1, '#ffcc66'); 
        ctx.globalAlpha = Math.min(1, winTime / 1.5);
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
    }
}

function drawObstacles() {
    ctx.fillStyle = theme.spikeFill;
    ctx.strokeStyle = theme.spikeStroke;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.shadowColor = theme.spikeStroke;
    
    ctx.beginPath();
    for (let s of spikes) {
        if (s.isTop) {
            ctx.rect(s.x, 0, s.w, s.h);
        } else {
            ctx.rect(s.x, canvas.height - s.h, s.w, s.h);
        }
    }
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawSerpents() {
    ctx.shadowBlur = 10;
    ctx.shadowColor = theme.serpent;
    ctx.strokeStyle = theme.serpent;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    for (let s of serpents) {
        ctx.beginPath();
        if (s.history.length > 0) {
            ctx.moveTo(s.history[0].x, s.history[0].y);
            for(let i=1; i<s.history.length; i++) {
                ctx.lineTo(s.history[i].x, s.history[i].y);
            }
            ctx.lineTo(s.x, s.y);
            ctx.stroke();
        }
        
        ctx.beginPath();
        ctx.arc(s.x, s.y, 5, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    }
    ctx.shadowBlur = 0;
}

function drawParticles() {
    for(let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawTrail() {
    if (trail.length === 0 && !isDrawing) return;
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = theme.trailGlow;
    ctx.strokeStyle = theme.trail;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    ctx.beginPath();
    if (trail.length > 0) {
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let i = 1; i < trail.length; i++) {
            ctx.lineTo(trail[i].x, trail[i].y);
        }
        if (isDrawing) ctx.lineTo(fingerPos.x, fingerPos.y);
        ctx.stroke();
    }
    
    if (isDrawing) {
        ctx.beginPath();
        ctx.arc(fingerPos.x, fingerPos.y, 7, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    }
    ctx.shadowBlur = 0;
}

function drawUI() {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    if (state === 'title') {
        ctx.fillStyle = theme.text;
        ctx.font = "bold 36px ui-monospace, 'SFMono-Regular', Menlo, monospace";
        ctx.fillText("FIBER RIDGE", canvas.width/2, canvas.height/3);
        
        ctx.font = "16px ui-monospace, 'SFMono-Regular', Menlo, monospace";
        ctx.fillText("Hold & drag to trace the path.", canvas.width/2, canvas.height/2);
        ctx.fillText("Lifting breaks the connection.", canvas.width/2, canvas.height/2 + 30);
        ctx.globalAlpha = 0.5 + Math.sin(performance.now()/300)*0.5;
        ctx.fillText("Tap anywhere to begin", canvas.width/2, canvas.height/2 + 90);
        ctx.globalAlpha = 1;
    } else if (state === 'playing') {
        let barW = canvas.width * 0.8;
        let barH = 4;
        let barX = (canvas.width - barW) / 2;
        let barY = 40;
        
        ctx.fillStyle = theme.spikeFill;
        ctx.fillRect(barX, barY, barW, barH);
        
        ctx.fillStyle = theme.trail;
        ctx.shadowBlur = 10;
        ctx.shadowColor = theme.trail;
        ctx.fillRect(barX, barY, barW * progress, barH);
        ctx.shadowBlur = 0;
    } else if (state === 'gameover') {
        ctx.fillStyle = isDark ? 'rgba(255, 0, 0, 0.15)' : 'rgba(255, 0, 0, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = theme.text;
        ctx.font = "bold 28px ui-monospace, 'SFMono-Regular', Menlo, monospace";
        ctx.fillText("CONNECTION LOST", canvas.width/2, canvas.height/3);
        
        ctx.font = "16px ui-monospace, 'SFMono-Regular', Menlo, monospace";
        ctx.fillText(deathReason, canvas.width/2, canvas.height/3 + 40);
        
        ctx.fillText(`${Math.floor(progress * 100)}% Complete`, canvas.width/2, canvas.height/2);
        
        drawButton("RESTART", canvas.width/2, canvas.height * 0.7);
    } else if (state === 'won' && !isDrawing) {
        ctx.fillStyle = '#113333'; 
        ctx.font = "bold 32px ui-monospace, 'SFMono-Regular', Menlo, monospace";
        ctx.fillText("THE BAY IS CLEAR", canvas.width/2, canvas.height/3);
        
        ctx.font = "16px ui-monospace, 'SFMono-Regular', Menlo, monospace";
        ctx.fillText("Sunrise restored.", canvas.width/2, canvas.height/3 + 40);
        
        drawButton("PLAY AGAIN", canvas.width/2, canvas.height * 0.7, '#113333', 'rgba(255,255,255,0.8)');
    }
}

function drawButton(text, x, y, fg = theme.bg, bg = theme.text) {
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(x - 90, y - 25, 180, 50, 8);
    ctx.fill();
    
    ctx.fillStyle = fg;
    ctx.font = "bold 16px ui-monospace, 'SFMono-Regular', Menlo, monospace";
    ctx.fillText(text, x, y);
}

function loop(now) {
    let dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = now;
    
    let currentSpeed = 0;
    
    if (state === 'playing') {
        currentSpeed = 150 + (progress * 250);
        progress += dt / 45; 
        
        updateObstacles(dt, currentSpeed, progress);
        updateSerpents(dt, currentSpeed, progress);
        
        for (let p of trail) p.x -= currentSpeed * dt;
        trail = trail.filter(p => p.x > -50);
        
        if (isDrawing) {
            let lastP = trail[trail.length - 1];
            if (!lastP || Math.hypot(fingerPos.x - lastP.x, fingerPos.y - lastP.y) > 5) {
                trail.push({x: fingerPos.x, y: fingerPos.y});
            }
        }
        
        let death = checkCollisions();
        if (death) {
            triggerGameOver(death);
        } else if (progress >= 1) {
            state = 'won';
            playWinSound();
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
        }
    } else if (state === 'won') {
        currentSpeed = Math.max(0, 150 - (winTime * 100));
        updateObstacles(dt, currentSpeed, 1);
        for(let s of spikes) { s.h = Math.max(0, s.h - 100*dt); }
        for(let s of serpents) { s.vx -= 500*dt; s.x += s.vx*dt; }
        for(let p of trail) p.x -= currentSpeed * dt;
        
        if (isDrawing) {
            let lastP = trail[trail.length - 1];
            if (!lastP || Math.hypot(fingerPos.x - lastP.x, fingerPos.y - lastP.y) > 5) {
                trail.push({x: fingerPos.x, y: fingerPos.y});
            }
        }
        winTime += dt;
    }
    
    updateParticles(dt, currentSpeed);
    
    drawBackground(dt, currentSpeed);
    drawObstacles();
    drawSerpents();
    drawParticles();
    drawTrail();
    drawUI();
    
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
