<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foggy Facade</title>
<style>
  :root {
    --bg: #d9dcd6;
    --bg-rgb: 217, 220, 214;
    --text: #222;
    --accent: #c28d75;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c23;
      --bg-rgb: 26, 28, 35;
      --text: #eee;
      --accent: #5a3d31;
    }
  }
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .screen {
    background: rgba(var(--bg-rgb), 0.85);
    padding: 2rem;
    border-radius: 12px;
    text-align: center;
    pointer-events: auto;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(128,128,128,0.2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    max-width: 80%;
  }
  h1, h2 {
    margin: 0 0 0.5rem 0;
    font-weight: normal;
    letter-spacing: -1px;
  }
  p {
    margin: 0 0 2rem 0;
    opacity: 0.8;
    font-size: 0.9rem;
    line-height: 1.4;
  }
  button {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 1rem 2rem;
    font-family: inherit;
    font-size: 1.1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s;
    outline: none;
  }
  button:active {
    transform: scale(0.95);
  }
  #hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 3rem 2rem 1rem 2rem;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    pointer-events: none;
  }
  #scoreDisplay {
    font-size: 1.5rem;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(var(--bg-rgb), 0.8);
  }
  #timerBarContainer {
    width: 100%;
    max-width: 200px;
    height: 4px;
    background: rgba(128,128,128,0.3);
    border-radius: 2px;
    overflow: hidden;
  }
  #timerBar {
    height: 100%;
    width: 100%;
    background: var(--text);
    transform-origin: left;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="titleScreen" class="screen">
    <h1>Foggy Facade</h1>
    <p>Repeat the pattern.<br>Beware of red decoys.</p>
    <button id="startBtn">Tap to Start</button>
  </div>
  <div id="gameOverScreen" class="screen" style="display: none;">
    <h2>Game Over</h2>
    <p>Score: <span id="scoreVal">0</span></p>
    <button id="restartBtn">Play Again</button>
  </div>
</div>
<div id="hud" style="display: none;">
  <div id="scoreDisplay">0</div>
  <div id="timerBarContainer"><div id="timerBar"></div></div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let w, h;

// Audio
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playTone(freq, type, duration, vol=0.1) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const freqs = [
  261.63, 293.66, 329.63,
  392.00, 440.00, 523.25,
  587.33, 659.25, 783.99
];

// Palette & Theme
const palettes = {
  light: {
    sky: '#d9dcd6',
    houses: ['#c28d75', '#9eb29a', '#7a8b99'],
    winOff: '#4a4e4d',
    winLit: '#f7e7ce',
    winBait: '#d96c6c',
    fog: '217, 220, 214'
  },
  dark: {
    sky: '#1a1c23',
    houses: ['#5a3d31', '#3a4a38', '#2c3540'],
    winOff: '#111217',
    winLit: '#ffea99',
    winBait: '#ff4d4d',
    fog: '26, 28, 35'
  }
};

let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
let p = isDark ? palettes.dark : palettes.light;

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  isDark = e.matches;
  p = isDark ? palettes.dark : palettes.light;
});

// Texture
const noiseCanvas = document.createElement('canvas');
const noiseCtx = noiseCanvas.getContext('2d');
function generateNoise() {
  noiseCanvas.width = 256;
  noiseCanvas.height = 256;
  let imgData = noiseCtx.createImageData(256, 256);
  let data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    let val = Math.random() > 0.5 ? 255 : 0;
    data[i] = val;
    data[i+1] = val;
    data[i+2] = val;
    data[i+3] = 12; 
  }
  noiseCtx.putImageData(imgData, 0, 0);
}
generateNoise();

// Game State
let phase = 'TITLE'; // TITLE, WATCH, RECALL, SUCCESS, GAMEOVER
let level = 1;
let score = 0;
let sequence = [];
let targetSequence = [];
let playerIndex = 0;

let breatheScale = 1.0;
let targetBreathe = 1.0;
let breatheVel = 0;

let recallTotalTime = 0;
let recallStartTime = 0;
let lastBeatTime = 0;
let fogPulse = 0;

const windows = [];
for (let c = 0; c < 3; c++) {
  for (let r = 0; r < 3; r++) {
    windows.push({ col: c, row: r, id: r * 3 + c, state: 'off', scale: 1 });
  }
}

const fogs = [];
function initFog() {
  fogs.length = 0;
  for(let i=0; i<25; i++) {
    fogs.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: 100 + Math.random() * 200,
      vx: (Math.random() - 0.5) * 0.5 + 0.5,
      vy: (Math.random() - 0.5) * 0.2,
      alpha: Math.random() * 0.4 + 0.1
    });
  }
}

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  initFog();
}
window.addEventListener('resize', resize);
resize();

// Layout Helpers
function getHouseWidth() { return Math.min(w * 0.28, 120); }
function getHouseHeight() { return Math.min(h * 0.6, 450); }
function getHouseX(col) { 
  let hw = getHouseWidth();
  let totalW = hw * 3;
  let startX = (w - totalW) / 2;
  return startX + col * hw;
}
function getHouseY() { return (h - getHouseHeight()) / 2; }
function getWindowWidth() { return getHouseWidth() * 0.5; }
function getWindowHeight(row) { return row === 2 ? getHouseHeight() * 0.25 : getHouseHeight() * 0.18; }
function getWindowX(col) { return getHouseX(col) + (getHouseWidth() - getWindowWidth()) / 2; }
function getWindowY(row) {
  let hy = getHouseY();
  let hh = getHouseHeight();
  let spacing = hh * 0.3;
  let topMargin = hh * 0.1;
  return hy + topMargin + row * spacing;
}

// Logic
function generateSequence(lvl) {
  let seq = [];
  let length = 2 + Math.floor(lvl / 2); 
  let numBait = lvl >= 3 ? Math.floor((lvl - 1) / 2) : 0; 
  
  for (let i = 0; i < length; i++) {
    let id = Math.floor(Math.random() * 9);
    if (i > 0 && seq[i-1].id === id) {
      id = (id + 1) % 9;
    }
    seq.push({ id, type: 'normal' });
  }
  
  for (let i = 0; i < numBait; i++) {
    let insertIdx = Math.floor(Math.random() * seq.length);
    let id = Math.floor(Math.random() * 9);
    seq.splice(insertIdx, 0, { id, type: 'bait' });
  }
  return seq;
}

function startWatchPhase() {
  phase = 'WATCH';
  sequence = generateSequence(level);
  targetSequence = sequence.filter(s => s.type === 'normal');
  playerIndex = 0;
  
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('timerBarContainer').style.opacity = '0';
  updateHUD();
  
  let flashDur = Math.max(200, 600 - level * 40);
  let gapDur = Math.max(100, 300 - level * 20);
  let t = 1000; 
  
  sequence.forEach((item, i) => {
    setTimeout(() => {
      if (phase !== 'WATCH') return; 
      let win = windows.find(w => w.id === item.id);
      win.state = item.type === 'bait' ? 'bait' : 'lit';
      
      if (item.type === 'bait') {
        playTone(100, 'triangle', flashDur/1000, 0.2);
        playTone(110, 'triangle', flashDur/1000, 0.2);
        if (navigator.vibrate) navigator.vibrate(40);
      } else {
        playTone(freqs[item.id], 'sine', flashDur/1000, 0.1);
      }
      win.scale = 1.05;
    }, t);
    
    t += flashDur;
    
    setTimeout(() => {
      if (phase !== 'WATCH') return;
      let win = windows.find(w => w.id === item.id);
      win.state = 'off';
      win.scale = 1.0;
    }, t);
    
    t += gapDur;
  });
  
  setTimeout(() => {
    if (phase !== 'WATCH') return;
    startRecallPhase();
  }, t + 200);
}

function startRecallPhase() {
  phase = 'RECALL';
  recallTotalTime = targetSequence.length * 1500 + 2000; 
  recallStartTime = Date.now();
  lastBeatTime = Date.now();
  document.getElementById('timerBarContainer').style.opacity = '1';
}

function gameOver() {
  phase = 'GAMEOVER';
  breatheScale = 0.9;
  targetBreathe = 0.9;
  playTone(150, 'sawtooth', 0.5, 0.2);
  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
  
  document.getElementById('gameOverScreen').style.display = 'block';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('scoreVal').innerText = score;
}

function updateHUD() {
  document.getElementById('scoreDisplay').innerText = score;
}

function resetGame() {
  level = 1;
  score = 0;
  updateHUD();
  breatheScale = 1.0;
  targetBreathe = 1.0;
  windows.forEach(w => { w.state = 'off'; w.scale = 1.0; });
}

// Input
function handlePointerDown(e) {
  if (phase !== 'RECALL') return;
  e.preventDefault();
  
  let x, y;
  if (e.touches && e.touches.length > 0) {
    x = e.touches[0].clientX;
    y = e.touches[0].clientY;
  } else {
    x = e.clientX;
    y = e.clientY;
  }
  
  let dx = x - w/2;
  let dy = y - h/2;
  let unscaledX = w/2 + dx / breatheScale;
  let unscaledY = h/2 + dy / breatheScale;
  
  let pad = 20;
  
  for (let win of windows) {
    let wx = getWindowX(win.col);
    let wy = getWindowY(win.row);
    let ww = getWindowWidth();
    let wh = getWindowHeight(win.row);
    
    if (unscaledX >= wx - pad && unscaledX <= wx + ww + pad &&
        unscaledY >= wy - pad && unscaledY <= wy + wh + pad) {
      
      let target = targetSequence[playerIndex];
      
      win.scale = 0.9;
      setTimeout(() => win.scale = 1.0, 100);
      
      if (win.id === target.id) {
        playTone(freqs[win.id], 'sine', 0.3, 0.1);
        win.state = 'lit';
        setTimeout(() => { if(phase === 'RECALL') win.state = 'off'; }, 300);
        
        playerIndex++;
        if (playerIndex >= targetSequence.length) {
          phase = 'SUCCESS';
          score += level * 10;
          updateHUD();
          breatheScale = 1.05;
          targetBreathe = 1.0;
          
          playTone(440, 'sine', 0.1, 0.1);
          setTimeout(() => playTone(554, 'sine', 0.1, 0.1), 100);
          setTimeout(() => playTone(659, 'sine', 0.2, 0.1), 200);
          
          if (navigator.vibrate) navigator.vibrate(50);
          
          setTimeout(() => {
            level++;
            startWatchPhase();
          }, 1000);
        } else {
          if (navigator.vibrate) navigator.vibrate(20);
        }
      } else {
        gameOver();
      }
      break;
    }
  }
}

canvas.addEventListener('mousedown', handlePointerDown);
canvas.addEventListener('touchstart', handlePointerDown, {passive: false});

document.getElementById('startBtn').addEventListener('click', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  document.getElementById('titleScreen').style.display = 'none';
  resetGame();
  startWatchPhase();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('gameOverScreen').style.display = 'none';
  resetGame();
  startWatchPhase();
});

// Loop
function update() {
  requestAnimationFrame(update);
  
  let force = (targetBreathe - breatheScale) * 0.1;
  breatheVel += force;
  breatheVel *= 0.8;
  breatheScale += breatheVel;
  
  if (phase === 'RECALL') {
    let elapsed = Date.now() - recallStartTime;
    let remaining = recallTotalTime - elapsed;
    if (remaining <= 0) {
      gameOver();
    } else {
      let ratio = remaining / recallTotalTime;
      document.getElementById('timerBar').style.width = (ratio * 100) + '%';
      
      let timeRatio = 1 - ratio; 
      let currentBeatInterval = 300 + (1 - timeRatio) * 700;
      if (Date.now() - lastBeatTime > currentBeatInterval) {
        playTone(60, 'sine', 0.1, 0.2);
        lastBeatTime = Date.now();
        fogPulse = 0.3;
      }
    }
  }
  
  if (fogPulse > 0) fogPulse -= 0.01;
  
  draw();
}

function draw() {
  ctx.fillStyle = p.sky;
  ctx.fillRect(0, 0, w, h);
  
  ctx.fillStyle = ctx.createPattern(noiseCanvas, 'repeat');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillRect(0, 0, w, h);
  
  ctx.save();
  ctx.translate(w/2, h/2);
  ctx.scale(breatheScale, breatheScale);
  ctx.translate(-w/2, -h/2);
  
  for (let c = 0; c < 3; c++) {
    let hx = getHouseX(c);
    let hy = getHouseY();
    let hw = getHouseWidth();
    let hh = getHouseHeight();
    
    ctx.fillStyle = p.houses[c];
    ctx.fillRect(hx, hy, hw, hh);
    
    ctx.fillStyle = isDark ? '#111' : '#fff';
    ctx.globalAlpha = 0.2;
    ctx.fillRect(hx - 5, hy, hw + 10, 15);
    ctx.fillRect(hx - 2, hy + 20, hw + 4, 8);
    ctx.globalAlpha = 1.0;
    
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.05;
    ctx.fillRect(hx + hw*0.1, hy + 40, hw*0.8, hh - 40);
    ctx.globalAlpha = 1.0;
  }
  
  windows.forEach(win => {
    if (win.state === 'off') drawWindow(win, p.winOff);
  });
  
  ctx.restore();
  
  drawFog();
  
  ctx.save();
  ctx.translate(w/2, h/2);
  ctx.scale(breatheScale, breatheScale);
  ctx.translate(-w/2, -h/2);
  
  let time = Date.now();
  windows.forEach(win => {
    if (win.state === 'lit') {
      ctx.shadowColor = p.winLit;
      ctx.shadowBlur = 15 + Math.sin(time / 100) * 5;
      drawWindow(win, p.winLit);
      ctx.shadowBlur = 0;
    } else if (win.state === 'bait') {
      ctx.shadowColor = p.winBait;
      ctx.shadowBlur = 15 + Math.sin(time / 50) * 5;
      drawWindow(win, p.winBait);
      ctx.shadowBlur = 0;
    }
  });
  
  ctx.restore();
}

function drawWindow(win, color) {
  let wx = getWindowX(win.col);
  let wy = getWindowY(win.row);
  let ww = getWindowWidth();
  let wh = getWindowHeight(win.row);
  
  let cx = wx + ww/2;
  let cy = wy + wh/2;
  
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(win.scale, win.scale);
  ctx.translate(-cx, -cy);
  
  ctx.fillStyle = color;
  
  if (win.row === 2) {
    ctx.beginPath();
    ctx.moveTo(wx, wy + wh);
    ctx.lineTo(wx, wy + 10);
    ctx.quadraticCurveTo(wx + ww/2, wy - 10, wx + ww, wy + 10);
    ctx.lineTo(wx + ww, wy + wh);
    ctx.fill();
  } else {
    ctx.fillRect(wx, wy, ww, wh);
    ctx.fillStyle = p.houses[win.col]; 
    ctx.globalAlpha = 0.5;
    ctx.fillRect(wx + ww/2 - 2, wy, 4, wh);
    ctx.fillRect(wx, wy + wh/2 - 2, ww, 4);
    ctx.globalAlpha = 1.0;
  }
  
  ctx.restore();
}

function drawFog() {
  fogs.forEach(f => {
    f.x += f.vx;
    f.y += f.vy;
    if (f.x - f.r > w) f.x = -f.r;
    if (f.x + f.r < 0) f.x = w + f.r;
    if (f.y - f.r > h) f.y = -f.r;
    if (f.y + f.r < 0) f.y = h + f.r;
    
    let currentAlpha = f.alpha + fogPulse;
    if (currentAlpha > 1) currentAlpha = 1;
    
    let grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    grad.addColorStop(0, `rgba(${p.fog}, ${currentAlpha})`);
    grad.addColorStop(1, `rgba(${p.fog}, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    ctx.fill();
  });
}

update();
</script>
</body>
</html>
