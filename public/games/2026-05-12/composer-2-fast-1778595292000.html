<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dewchain — steamed glass</title>
  <style>
    :root {
      --bg: #0c0e10;
      --fg: #e8eaed;
      --muted: #8a9199;
      --accent: #2dd4bf;
      --warn: #f59e0b;
      --glass: rgba(255,255,255,0.06);
      --heat: rgba(251, 146, 60, 0.22);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #e4e8ec;
        --fg: #161a1e;
        --muted: #5c6570;
        --accent: #0d9488;
        --warn: #b45309;
        --glass: rgba(0,0,0,0.04);
        --heat: rgba(234, 88, 12, 0.15);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #wrap {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      user-select: none;
    }
    canvas {
      display: block;
      width: min(100dvw - 24px, 100dvh - 120px);
      height: min(100dvw - 24px, 100dvh - 120px);
      max-width: 420px;
      max-height: 420px;
      touch-action: none;
      border-radius: 12px;
      background: var(--glass);
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    #hud {
      width: min(100dvw - 24px, 420px);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    #hud span { color: var(--muted); }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #overlay.on {
      opacity: 1;
      pointer-events: auto;
    }
    #overlay h1 {
      font-weight: 600;
      font-size: clamp(22px, 6vw, 28px);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    #overlay p {
      margin: 0 0 20px;
      max-width: 300px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    #overlay button {
      min-height: 48px;
      min-width: 160px;
      padding: 0 20px;
      font: inherit;
      font-size: 14px;
      border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
      border-radius: 10px;
      background: var(--fg);
      color: var(--bg);
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #overlay button:active { transform: scale(0.97); }
    #overlay .sub { margin-top: 14px; font-size: 11px; color: var(--muted); }
    #toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      transition: opacity 0.2s, transform 0.25s ease;
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <div>SCORE <strong id="score">0</strong></div>
      <div><span id="combo">×1</span> · <span id="timer">45</span>s</div>
    </div>
    <canvas id="c" width="360" height="360" tabindex="0" aria-label="Dew grid"></canvas>
  </div>
  <div id="overlay" class="on">
    <h1 id="title">Dewchain</h1>
    <p id="blurb">Tap a bead, tap a neighbor to fuse. Build mass before the heat sweeps the glass. Long-press your pick to brace. Desktop: arrows move focus, Space fuses, B braces.</p>
    <button type="button" id="start">Play</button>
    <p class="sub">Foggy spring glass · stray teal neon</p>
  </div>
  <div id="toast"></div>
  <script>
(function(){
  'use strict';

  var GRID = 6;
  var ROUND_SEC = 45;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var comboEl = document.getElementById('combo');
  var timerEl = document.getElementById('timer');
  var overlay = document.getElementById('overlay');
  var startBtn = document.getElementById('start');
  var titleEl = document.getElementById('title');
  var blurbEl = document.getElementById('blurb');
  var toastEl = document.getElementById('toast');

  var darkMq = window.matchMedia('(prefers-color-scheme: dark)');

  function palette() {
    if (darkMq.matches) {
      return {
        bg0: '#0c0e10', bg1: '#14181c', fg: '#e8eaed', muted: '#6b7280',
        dew: '#9fd9cf', dewHi: '#d4f4ee', neon: '#2dd4bf', heat: 'rgba(251,146,60,0.35)',
        sel: '#fbbf24', brace: '#38bdf8'
      };
    }
    return {
      bg0: '#dde2e8', bg1: '#e8ecf1', fg: '#161a1e', muted: '#64748b',
      dew: '#0f766e', dewHi: '#5eead4', neon: '#0d9488', heat: 'rgba(234,88,12,0.28)',
      sel: '#b45309', brace: '#0284c7'
    };
  }

  var state = 'title';
  var cells = [];
  var selected = -1;
  var score = 0;
  var combo = 1;
  var comboT = 0;
  var timeLeft = ROUND_SEC;
  var heatPos = 0;
  var heatSpeed = 0.085;
  var heatBase = 0.085;
  var windT = 0;
  var braceCD = 0;
  var braceActive = 0;
  var protectedSet = null;
  var lastPulse = 0;
  var particles = [];
  var raf = 0;
  var lastFrame = 0;
  var pressTimer = null;
  var pressCell = -1;
  var braceSuppress = false;
  var kbFocus = 0;
  var audioCtx = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) {}
  }

  function playPop(mass, isCombo) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      var t0 = audioCtx.currentTime;
      var f = 280 + Math.min(420, mass * 24) + (isCombo ? 80 : 0);
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t0);
      o.frequency.exponentialRampToValueAtTime(f * 0.65, t0 + 0.06);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t0);
      o.stop(t0 + 0.15);
    } catch (e) {}
  }

  function vibrate(pattern) {
    if (navigator.vibrate) try { navigator.vibrate(pattern); } catch (e) {}
  }

  function idx(x, y) { return y * GRID + x; }
  function inBounds(x, y) { return x >= 0 && x < GRID && y >= 0 && y < GRID; }

  function neighbors(i) {
    var x = i % GRID, y = (i / GRID) | 0;
    var out = [];
    if (x > 0) out.push(idx(x-1,y));
    if (x < GRID-1) out.push(idx(x+1,y));
    if (y > 0) out.push(idx(x,y-1));
    if (y < GRID-1) out.push(idx(x,y+1));
    return out;
  }

  function cellSize() { return Math.min(canvas.width, canvas.height) / GRID; }

  function resetGrid() {
    cells = [];
    var i, n = GRID * GRID;
    for (i = 0; i < n; i++) {
      cells.push({ m: 1 + ((Math.random() * 2.4) | 0), heat: 0 });
    }
  }

  function showTitle() {
    state = 'title';
    overlay.classList.add('on');
    titleEl.textContent = 'Dewchain';
    blurbEl.textContent = 'Tap a bead, tap a neighbor to fuse. Build mass before the heat sweeps the glass. Long-press your pick to brace. Desktop: arrows move focus, Space fuses, B braces.';
    startBtn.textContent = 'Play';
    heatPos = 0.22;
    resetGrid();
    selected = -1;
    kbFocus = 0;
    draw();
  }

  function showGameOver(won) {
    state = 'over';
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    overlay.classList.add('on');
    titleEl.textContent = won ? 'Pane cleared' : 'Evaporated';
    blurbEl.textContent = 'Score ' + score + (won ? ' · you outlasted the fog-heat.' : ' · merge faster next pass.');
    startBtn.textContent = 'Play again';
  }

  function beginRound() {
    initAudio();
    state = 'play';
    overlay.classList.remove('on');
    selected = -1;
    score = 0;
    combo = 1;
    comboT = 0;
    timeLeft = ROUND_SEC;
    heatPos = -0.15;
    heatSpeed = heatBase = 0.085;
    windT = 2.2;
    braceCD = 0;
    braceActive = 0;
    protectedSet = null;
    particles = [];
    resetGrid();
    var zi;
    kbFocus = 0;
    for (zi = 0; zi < cells.length; zi++) {
      if (cells[zi].m > 0) { kbFocus = zi; break; }
    }
    scoreEl.textContent = '0';
    comboEl.textContent = '×1';
    timerEl.textContent = String(ROUND_SEC);
    lastFrame = performance.now();
    if (raf) cancelAnimationFrame(raf);
    loop(lastFrame);
  }

  function tryMerge(a, b) {
    if (cells[b].m <= 0 || cells[a].m <= 0) return false;
    var neigh = neighbors(a);
    if (neigh.indexOf(b) < 0) return false;
    var sum = cells[a].m + cells[b].m;
    cells[a].m = sum;
    cells[b].m = 0;
    cells[a].heat = Math.max(0, cells[a].heat - 0.35);
    var cx = (a % GRID + 0.5) * cellSize();
    var cy = ((a / GRID | 0) + 0.5) * cellSize();
    burst(cx, cy, sum);
    var pts = sum * 8 + combo * 5;
    score += pts | 0;
    comboT = 0.85;
    combo = Math.min(8, combo + 0.35);
    scoreEl.textContent = String(score);
    comboEl.textContent = '×' + combo.toFixed(1);
    playPop(sum, combo > 1.5);
    vibrate(12);
    selected = a;
    kbFocus = a;
    return true;
  }

  function burst(x, y, mass) {
    var k, a;
    for (k = 0; k < 10 + mass; k++) {
      a = Math.random() * Math.PI * 2;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * (1.2 + Math.random() * 2.5),
        vy: Math.sin(a) * (1.2 + Math.random() * 2.5),
        life: 0.35 + Math.random() * 0.25,
        t: 0,
        s: 1.5 + Math.random() * 2
      });
    }
  }

  function windShear() {
    var swaps = 2 + (Math.random() * 2 | 0);
    var tries = 0;
    while (swaps > 0 && tries < 40) {
      tries++;
      var i = (Math.random() * (GRID * GRID)) | 0;
      var j = (Math.random() * (GRID * GRID)) | 0;
      if (i === j) continue;
      if (cells[i].m <= 0 && cells[j].m <= 0) continue;
      var ti = cells[i].m, th = cells[i].heat;
      cells[i].m = cells[j].m;
      cells[i].heat = cells[j].heat;
      cells[j].m = ti;
      cells[j].heat = th;
      swaps--;
    }
    toast('Wind shear');
    vibrate([8, 40, 8]);
    if (selected >= 0 && cells[selected].m <= 0) selected = -1;
  }

  function applyBrace(i) {
    if (braceCD > 0 || state !== 'play') return;
    if (cells[i].m <= 0) return;
    braceCD = 5.5;
    braceActive = 1.1;
    protectedSet = {};
    protectedSet[i] = 1;
    var list = neighbors(i);
    var k;
    for (k = 0; k < list.length; k++) protectedSet[list[k]] = 1;
    vibrate([15, 30, 15]);
    playPop(cells[i].m + 4, false);
    toast('Braced');
  }

  function clientToCell(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    var u = (clientX - r.left) / r.width;
    var v = (clientY - r.top) / r.height;
    if (u < 0 || u > 1 || v < 0 || v > 1) return -1;
    var x = (u * GRID) | 0;
    var y = (v * GRID) | 0;
    return idx(x, y);
  }

  function onTap(cell) {
    if (state !== 'play' || cell < 0) return;
    kbFocus = cell;
    if (cells[cell].m <= 0) {
      selected = -1;
      return;
    }
    if (selected < 0 || selected === cell) {
      selected = cell;
      return;
    }
    if (tryMerge(selected, cell)) return;
    if (tryMerge(cell, selected)) return;
    selected = cell;
  }

  function tick(dt) {
    if (state !== 'play') return;
    timeLeft -= dt;
    timerEl.textContent = String(Math.max(0, Math.ceil(timeLeft)));
    comboT -= dt;
    if (comboT <= 0 && combo > 1) {
      combo = Math.max(1, combo - dt * 0.8);
      comboEl.textContent = '×' + combo.toFixed(1);
    }
    heatPos += heatSpeed * dt * 60 * 0.35;
    if (heatPos > 1.12) heatPos = -0.2;
    heatSpeed = heatBase + (1 - timeLeft / ROUND_SEC) * 0.06;
    windT -= dt;
    if (windT <= 0) {
      windShear();
      windT = 4.5 - (1 - timeLeft / ROUND_SEC) * 1.2;
    }
    braceCD = Math.max(0, braceCD - dt);
    braceActive = Math.max(0, braceActive - dt);
    if (braceActive <= 0 && protectedSet) protectedSet = null;

    var gx = heatPos * (GRID + 1) - 0.5;
    var i, x, y, c, d, edge;
    for (i = 0; i < cells.length; i++) {
      if (cells[i].m <= 0) continue;
      x = i % GRID;
      y = (i / GRID) | 0;
      edge = Math.abs(x + 0.5 - gx);
      d = 1 / (0.65 + edge * 0.9);
      c = d * d * dt * 0.55;
      if (protectedSet && protectedSet[i]) c *= 0.15;
      cells[i].heat += c;
      if (cells[i].heat > 1) {
        cells[i].m = 0;
        cells[i].heat = 0;
        if (selected === i) selected = -1;
        burst((x + 0.5) * cellSize(), (y + 0.5) * cellSize(), 2);
      }
    }

    var alive = 0;
    for (i = 0; i < cells.length; i++) {
      if (cells[i].m > 0) alive++;
    }
    lastPulse += dt;
    if (lastPulse > 0.42) {
      lastPulse = 0;
      playKick();
    }

    if (timeLeft <= 0) {
      vibrate(25);
      showGameOver(true);
      return;
    }
    if (alive === 0) {
      vibrate([20, 50, 20]);
      showGameOver(false);
    }
  }

  function playKick() {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t0 = audioCtx.currentTime;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(52, t0);
      o.frequency.exponentialRampToValueAtTime(38, t0 + 0.18);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.045, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t0);
      o.stop(t0 + 0.24);
    } catch (e) {}
  }

  function draw() {
    var P = palette();
    var w = canvas.width, h = canvas.height;
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, P.bg0);
    g.addColorStop(1, P.bg1);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    var cs = cellSize();
    var fogBreath = 0.03 * Math.sin(performance.now() / 900);
    var i, x, y, cx, cy, m, r;

    ctx.save();
    ctx.globalAlpha = 0.5 + fogBreath;
    var fg = ctx.createRadialGradient(w*0.3, h*0.2, 0, w*0.5, h*0.5, w*0.75);
    fg.addColorStop(0, 'rgba(148,163,184,0.12)');
    fg.addColorStop(1, 'rgba(148,163,184,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();

    var hx = heatPos * w;
    var hg = ctx.createLinearGradient(hx - w*0.35, 0, hx + w*0.2, 0);
    hg.addColorStop(0, 'rgba(251,146,60,0)');
    hg.addColorStop(0.5, P.heat);
    hg.addColorStop(1, 'rgba(251,146,60,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, w, h);

    for (i = 0; i < cells.length; i++) {
      x = i % GRID;
      y = (i / GRID) | 0;
      cx = x * cs;
      cy = y * cs;
      ctx.strokeStyle = colorMix(P.muted, 0.2);
      ctx.lineWidth = 1;
      ctx.strokeRect(cx + 0.5, cy + 0.5, cs - 1, cs - 1);
      m = cells[i].m;
      if (m <= 0) continue;
      r = Math.min(cs * 0.38, 10 + m * 3.2);
      var grd = ctx.createRadialGradient(cx + cs*0.35, cy + cs*0.35, r*0.1, cx + cs*0.5, cy + cs*0.52, r);
      grd.addColorStop(0, P.dewHi);
      grd.addColorStop(0.45, P.dew);
      grd.addColorStop(1, colorMix(P.neon, 0.35));
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(cx + cs*0.5, cy + cs*0.48, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.ellipse(cx + cs*0.38, cy + cs*0.38, r*0.22, r*0.14, -0.6, 0, Math.PI*2);
      ctx.fill();
      if (cells[i].heat > 0.25) {
        ctx.strokeStyle = 'rgba(251,113,133,0.65)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx + cs*0.5, cy + cs*0.48, r + 2 + cells[i].heat * 6, 0, Math.PI*2);
        ctx.stroke();
      }
    }

    if (state === 'play' && kbFocus >= 0) {
      x = kbFocus % GRID;
      y = (kbFocus / GRID) | 0;
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = colorMix(P.neon, 0.75);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x * cs + 5, y * cs + 5, cs - 10, cs - 10);
      ctx.setLineDash([]);
    }
    if (selected >= 0 && cells[selected].m > 0) {
      x = selected % GRID;
      y = (selected / GRID) | 0;
      ctx.strokeStyle = P.sel;
      ctx.lineWidth = 3;
      ctx.strokeRect(x * cs + 3, y * cs + 3, cs - 6, cs - 6);
    }
    if (braceActive > 0) {
      ctx.strokeStyle = P.brace;
      ctx.globalAlpha = 0.35 + braceActive * 0.5;
      ctx.lineWidth = 2;
      ctx.strokeRect(4, 4, w - 8, h - 8);
      ctx.globalAlpha = 1;
    }

    var p, j;
    for (j = particles.length - 1; j >= 0; j--) {
      p = particles[j];
      p.t += 1/60;
      if (p.t > p.life) { particles.splice(j, 1); continue; }
      p.x += p.vx;
      p.y += p.vy;
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = P.neon;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.s * (1 - p.t/p.life), 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function colorMix(hex, a) {
    var h = hex.slice(1);
    var r = parseInt(h.slice(0,2),16);
    var g = parseInt(h.slice(2,4),16);
    var b = parseInt(h.slice(4,6),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  function loop(t) {
    var dt = Math.min(0.05, (t - lastFrame) / 1000);
    lastFrame = t;
    tick(dt);
    draw();
    if (state === 'play') raf = requestAnimationFrame(loop);
  }

  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var side = Math.min(canvas.getBoundingClientRect().width, canvas.getBoundingClientRect().height);
    var px = Math.max(280, Math.round(side * dpr));
    canvas.width = px;
    canvas.height = px;
  }

  window.addEventListener('resize', resize);
  darkMq.addEventListener('change', function(){ if (state === 'play') draw(); });

  function pointerDown(ev) {
    ev.preventDefault();
    if (state !== 'play') return;
    var cell = clientToCell(ev.clientX, ev.clientY);
    pressCell = cell;
    if (pressTimer) clearTimeout(pressTimer);
    if (cell >= 0 && selected === cell && cells[cell].m > 0) {
      pressTimer = setTimeout(function(){
        pressTimer = null;
        if (state === 'play' && selected === pressCell && pressCell >= 0) {
          applyBrace(pressCell);
          braceSuppress = true;
        }
      }, 480);
    }
  }

  function pointerUp(ev) {
    ev.preventDefault();
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    if (state !== 'play') return;
    if (braceSuppress) { braceSuppress = false; return; }
    var cell = clientToCell(ev.clientX, ev.clientY);
    if (cell >= 0 && cell === pressCell) onTap(cell);
  }

  canvas.addEventListener('touchstart', pointerDown, { passive: false });
  canvas.addEventListener('touchend', pointerUp, { passive: false });
  canvas.addEventListener('mousedown', function(e){
    pointerDown(e);
    function mm(ev) { ev.preventDefault(); }
    function mu(ev) {
      pointerUp(ev);
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
    }
    window.addEventListener('mousemove', mm, { passive: false });
    window.addEventListener('mouseup', mu);
  });

  function moveKbFocus(dx, dy) {
    var x = kbFocus % GRID, y = (kbFocus / GRID) | 0;
    x = Math.max(0, Math.min(GRID - 1, x + dx));
    y = Math.max(0, Math.min(GRID - 1, y + dy));
    kbFocus = idx(x, y);
  }

  window.addEventListener('keydown', function(e) {
    if (state === 'title' || state === 'over') {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        beginRound();
      }
      return;
    }
    if (state !== 'play') return;
    if (e.code === 'ArrowLeft') { e.preventDefault(); moveKbFocus(-1, 0); return; }
    if (e.code === 'ArrowRight') { e.preventDefault(); moveKbFocus(1, 0); return; }
    if (e.code === 'ArrowUp') { e.preventDefault(); moveKbFocus(0, -1); return; }
    if (e.code === 'ArrowDown') { e.preventDefault(); moveKbFocus(0, 1); return; }
    if (e.code === 'Space') { e.preventDefault(); onTap(kbFocus); return; }
    if (e.code === 'KeyB') {
      e.preventDefault();
      if (selected >= 0 && selected === kbFocus) applyBrace(selected);
      return;
    }
  });

  startBtn.addEventListener('click', function() {
    if (state === 'title' || state === 'over') beginRound();
  });

  resize();
  showTitle();
})();
  </script>
</body>
</html>
