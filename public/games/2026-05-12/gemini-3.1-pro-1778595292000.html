<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knot Commit</title>
<style>
  :root {
    --bg: #121212;
    --text: #f0f0f0;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f0f0;
      --text: #121212;
    }
  }
  body, html {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
    box-sizing: border-box;
  }
  .hidden { display: none !important; }
  #start-screen, #game-over-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(18, 18, 18, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    z-index: 10;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }
  @media (prefers-color-scheme: light) {
    #start-screen, #game-over-screen {
      background: rgba(240, 240, 240, 0.85);
    }
  }
  h1 { 
    margin: 0 0 10px 0; 
    font-size: 2.5rem; 
    letter-spacing: 2px; 
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--text);
  }
  p { 
    margin: 0 0 40px 0; 
    font-size: 1.1rem; 
    opacity: 0.8; 
    text-align: center; 
    max-width: 80%;
    line-height: 1.5;
  }
  button {
    background: transparent;
    color: var(--text);
    border: 2px solid var(--text);
    padding: 15px 40px;
    font-size: 1.2rem;
    font-family: inherit;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    font-weight: bold;
    letter-spacing: 1px;
  }
  button:active {
    background: var(--text);
    color: var(--bg);
    transform: scale(0.95);
  }
  #hud {
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: bold;
    text-shadow: 0 0 5px var(--bg);
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="hud" class="hidden">
      <span id="score">LVL 1</span>
      <span id="knots">KNOTS: 3</span>
    </div>
  </div>
  
  <div id="start-screen">
    <h1>Knot Commit</h1>
    <p>Drag to connect nodes.<br>Release to dash.<br>Tap to sidestep skim beams.</p>
    <button id="btn-start">Initialize</button>
  </div>

  <div id="game-over-screen" class="hidden">
    <h1>System Failure</h1>
    <p id="final-score">Levels Cleared: 0</p>
    <button id="btn-restart">Reboot</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const uiHud = document.getElementById('hud');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const btnStart = document.getElementById('btn-start');
const btnRestart = document.getElementById('btn-restart');
const scoreEl = document.getElementById('score');
const knotsEl = document.getElementById('knots');

let width, height;
let isDarkMode = true;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
window.addEventListener('resize', resize);
resize();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', resize);

let audioCtx;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, type, duration, vol = 0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playSweep(f1, f2, duration, vol = 0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f1, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(f2, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

let state = 'START';
let level = 1;
let nodes = [];
let edges = [];
let knots = [];
let player = { x: 0, y: 0, nodeIndex: 0, isDodging: false, dodgeTimer: 0, dodgeCooldown: 0 };
let path = [];
let isDragging = false;
let touchCurrentX = 0;
let touchCurrentY = 0;
let lasers = [];
let particles = [];
let time = 0;
let lastTime = 0;

let isCommitting = false;
let commitPathNodes = [];
let commitTimer = 0;
const COMMIT_SPEED = 60;

const colors = {
  dark: {
    bg: '#121212',
    grid: 'rgba(255,255,255,0.03)',
    node: '#444',
    edge: '#333',
    player: '#00ffcc',
    path: '#00aa88',
    knot: '#ffaa00',
    laserWarn: 'rgba(255, 51, 51, 0.2)',
    laser: '#ff3333',
    dodge: '#00ffcc'
  },
  light: {
    bg: '#f0f0f0',
    grid: 'rgba(0,0,0,0.03)',
    node: '#ccc',
    edge: '#ddd',
    player: '#0088aa',
    path: '#006688',
    knot: '#e65c00',
    laserWarn: 'rgba(204, 0, 0, 0.2)',
    laser: '#cc0000',
    dodge: '#0088aa'
  }
};

function getC() {
  return isDarkMode ? colors.dark : colors.light;
}

function generateLevel() {
  nodes = [];
  edges = [];
  knots = [];
  lasers = [];
  path = [];
  isDragging = false;
  isCommitting = false;
  
  const cols = 6;
  const rows = 8;
  const cellW = width / cols;
  const cellH = height / rows;
  
  for (let r = 1; r < rows; r++) {
    for (let c = 1; c < cols; c++) {
      if (Math.random() > 0.15) {
        nodes.push({
          x: c * cellW + (Math.random()-0.5)*15,
          y: r * cellH + (Math.random()-0.5)*15,
          id: nodes.length
        });
      }
    }
  }
  
  const maxDist = Math.max(cellW, cellH) * 1.6;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < maxDist) {
        edges.push({ a: i, b: j });
      }
    }
  }
  
  player.nodeIndex = Math.floor(Math.random() * nodes.length);
  player.x = nodes[player.nodeIndex].x;
  player.y = nodes[player.nodeIndex].y;
  player.isDodging = false;
  player.dodgeTimer = 0;
  player.dodgeCooldown = 0;
  
  let numKnots = Math.min(2 + Math.floor(level / 2), 10);
  let available = nodes.map((n, i) => i).filter(i => i !== player.nodeIndex);
  for (let i = 0; i < numKnots; i++) {
    if (available.length === 0) break;
    const idx = Math.floor(Math.random() * available.length);
    knots.push(available[idx]);
    available.splice(idx, 1);
  }
  
  updateHUD();
}

function spawnLaser() {
  const isHorizontal = Math.random() > 0.5;
  const speed = (Math.max(width, height) / 2000) * (1 + level * 0.15);
  const warningTime = Math.max(1200 - level * 80, 400);
  
  let x, y, vx, vy, w, h;
  const size = 12 + Math.min(level * 2, 25);
  
  if (isHorizontal) {
    w = width;
    h = size;
    x = 0;
    vx = 0;
    if (Math.random() > 0.5) {
      y = -h;
      vy = speed;
    } else {
      y = height;
      vy = -speed;
    }
  } else {
    w = size;
    h = height;
    y = 0;
    vy = 0;
    if (Math.random() > 0.5) {
      x = -w;
      vx = speed;
    } else {
      x = width;
      vx = -speed;
    }
  }
  
  lasers.push({
    x, y, vx, vy, w, h,
    isHorizontal,
    state: 'WARNING',
    timer: warningTime,
    activeTime: 6000
  });
}

function updateHUD() {
  scoreEl.textContent = `LVL ${level}`;
  knotsEl.textContent = `KNOTS: ${knots.length}`;
}

function handleInputStart(tx, ty) {
  if (state !== 'PLAYING' || isCommitting) return;
  initAudio();
  
  const dx = tx - player.x;
  const dy = ty - player.y;
  if (Math.sqrt(dx*dx + dy*dy) < 60 && !player.isDodging) {
    isDragging = true;
    path = [player.nodeIndex];
    touchCurrentX = tx;
    touchCurrentY = ty;
    if (navigator.vibrate) navigator.vibrate(10);
  } else {
    if (player.dodgeCooldown <= 0 && !isDragging) {
      player.isDodging = true;
      player.dodgeTimer = 400;
      player.dodgeCooldown = 800;
      playSweep(200, 100, 0.2);
      createParticles(player.x, player.y, getC().dodge, 12);
      if (navigator.vibrate) navigator.vibrate(20);
    }
  }
}

function handleInputMove(tx, ty) {
  if (state !== 'PLAYING' || !isDragging) return;
  touchCurrentX = tx;
  touchCurrentY = ty;
  
  const lastNodeIdx = path[path.length - 1];
  const connected = edges.reduce((acc, edge) => {
    if (edge.a === lastNodeIdx) acc.push(edge.b);
    if (edge.b === lastNodeIdx) acc.push(edge.a);
    return acc;
  }, []);
  
  for (let idx of connected) {
    const n = nodes[idx];
    const dx = tx - n.x;
    const dy = ty - n.y;
    if (Math.sqrt(dx*dx + dy*dy) < 55) {
      if (path.length > 1 && path[path.length - 2] === idx) {
        path.pop();
        playTone(600, 'sine', 0.05);
        if (navigator.vibrate) navigator.vibrate(5);
        break;
      }
      if (!path.includes(idx)) {
        path.push(idx);
        playTone(800 + path.length * 50, 'sine', 0.05);
        if (navigator.vibrate) navigator.vibrate(10);
        break;
      }
    }
  }
}

function handleInputEnd() {
  if (state !== 'PLAYING') return;
  if (isDragging) {
    isDragging = false;
    if (path.length > 1) {
      isCommitting = true;
      commitPathNodes = [...path];
      path = [];
      commitTimer = 0;
      playSweep(400, 1200, 0.3);
    } else {
      path = [];
    }
  }
}

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleInputMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); handleInputEnd(); });
canvas.addEventListener('mousedown', (e) => { handleInputStart(e.clientX, e.clientY); });
canvas.addEventListener('mousemove', (e) => { handleInputMove(e.clientX, e.clientY); });
canvas.addEventListener('mouseup', () => { handleInputEnd(); });

function checkLevelComplete() {
  if (knots.length === 0) {
    level++;
    playSweep(800, 1600, 0.5);
    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
    
    const flash = document.createElement('div');
    flash.style.position = 'absolute';
    flash.style.top = 0;
    flash.style.left = 0;
    flash.style.width = '100%';
    flash.style.height = '100%';
    flash.style.background = getC().player;
    flash.style.opacity = 0.8;
    flash.style.pointerEvents = 'none';
    flash.style.transition = 'opacity 0.5s';
    flash.style.zIndex = 5;
    document.body.appendChild(flash);
    
    setTimeout(() => { flash.style.opacity = 0; }, 50);
    setTimeout(() => { flash.remove(); }, 550);
    
    generateLevel();
  }
}

function createParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color,
      size: Math.random() * 3 + 2
    });
  }
}

function gameOver() {
  state = 'GAMEOVER';
  playSweep(150, 50, 0.8, 0.3);
  if (navigator.vibrate) navigator.vibrate([100, 50, 200]);
  document.getElementById('final-score').textContent = `Levels Cleared: ${level - 1}`;
  uiHud.classList.add('hidden');
  gameOverScreen.classList.remove('hidden');
}

btnStart.addEventListener('click', () => {
  initAudio();
  startScreen.classList.add('hidden');
  uiHud.classList.remove('hidden');
  level = 1;
  generateLevel();
  state = 'PLAYING';
  lastTime = performance.now();
  requestAnimationFrame(loop);
});

btnRestart.addEventListener('click', () => {
  gameOverScreen.classList.add('hidden');
  uiHud.classList.remove('hidden');
  level = 1;
  generateLevel();
  state = 'PLAYING';
  lastTime = performance.now();
});

function loop(timestamp) {
  if (state !== 'PLAYING') {
    requestAnimationFrame(loop);
    return;
  }
  const dt = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;
  time += dt;
  
  update(dt);
  draw();
  
  requestAnimationFrame(loop);
}

function update(dt) {
  const c = getC();
  
  if (player.dodgeTimer > 0) {
    player.dodgeTimer -= dt;
    if (player.dodgeTimer <= 0) player.isDodging = false;
  }
  if (player.dodgeCooldown > 0) player.dodgeCooldown -= dt;
  
  if (isCommitting) {
    commitTimer += dt;
    if (commitTimer >= COMMIT_SPEED) {
      commitTimer -= COMMIT_SPEED;
      const fromIdx = commitPathNodes.shift();
      if (commitPathNodes.length === 0) {
        isCommitting = false;
        checkLevelComplete();
      } else {
        const toIdx = commitPathNodes[0];
        const toNode = nodes[toIdx];
        player.x = toNode.x;
        player.y = toNode.y;
        player.nodeIndex = toIdx;
        createParticles(player.x, player.y, c.player, 5);
        
        const knotIdx = knots.indexOf(toIdx);
        if (knotIdx !== -1) {
          knots.splice(knotIdx, 1);
          playTone(1200, 'square', 0.1);
          createParticles(player.x, player.y, c.knot, 15);
          if (navigator.vibrate) navigator.vibrate(30);
          updateHUD();
        }
      }
    } else {
      if (commitPathNodes.length > 1) {
        const fromNode = nodes[commitPathNodes[0]];
        const toNode = nodes[commitPathNodes[1]];
        const t = commitTimer / COMMIT_SPEED;
        player.x = fromNode.x + (toNode.x - fromNode.x) * t;
        player.y = fromNode.y + (toNode.y - fromNode.y) * t;
        if (Math.random() > 0.5) createParticles(player.x, player.y, c.player, 1);
      }
    }
  }
  
  const spawnRate = Math.max(2500 - level * 150, 600);
  if (Math.random() < dt / spawnRate && lasers.length < 1 + Math.floor(level/2)) {
    spawnLaser();
  }
  
  for (let i = lasers.length - 1; i >= 0; i--) {
    let l = lasers[i];
    if (l.state === 'WARNING') {
      l.timer -= dt;
      if (l.timer <= 0) {
        l.state = 'ACTIVE';
        playTone(100, 'sawtooth', 0.3, 0.05);
      }
    } else if (l.state === 'ACTIVE') {
      l.activeTime -= dt;
      l.x += l.vx * dt;
      l.y += l.vy * dt;
      
      if (l.isHorizontal) {
        if (l.y < 0) { l.y = 0; l.vy *= -1; }
        if (l.y > height - l.h) { l.y = height - l.h; l.vy *= -1; }
      } else {
        if (l.x < 0) { l.x = 0; l.vx *= -1; }
        if (l.x > width - l.w) { l.x = width - l.w; l.vx *= -1; }
      }
      
      if (!player.isDodging && !isCommitting) {
        const px = player.x;
        const py = player.y;
        const pr = 8;
        let hit = false;
        if (l.isHorizontal) {
          if (py + pr > l.y && py - pr < l.y + l.h) hit = true;
        } else {
          if (px + pr > l.x && px - pr < l.x + l.w) hit = true;
        }
        if (hit) {
          createParticles(player.x, player.y, c.player, 30);
          gameOver();
        }
      }
      
      if (l.activeTime <= 0) lasers.splice(i, 1);
    }
  }
  
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt / 800;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  const c = getC();
  
  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, width, height);
  
  ctx.strokeStyle = c.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x=0; x<width; x+=30) { ctx.moveTo(x,0); ctx.lineTo(x,height); }
  for(let y=0; y<height; y+=30) { ctx.moveTo(0,y); ctx.lineTo(width,y); }
  ctx.stroke();
  
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 2; i++) {
    const fx = width/2 + Math.sin(time/3000 + i) * width/4;
    const fy = height/2 + Math.cos(time/4000 + i) * height/4;
    const grad = ctx.createRadialGradient(fx, fy, 0, fx, fy, width/1.2);
    grad.addColorStop(0, isDarkMode ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
  }
  ctx.globalCompositeOperation = 'source-over';
  
  ctx.strokeStyle = c.edge;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let edge of edges) {
    const n1 = nodes[edge.a];
    const n2 = nodes[edge.b];
    ctx.moveTo(n1.x, n1.y);
    ctx.lineTo(n2.x, n2.y);
  }
  ctx.stroke();
  
  ctx.fillStyle = c.node;
  for (let n of nodes) {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 3, 0, Math.PI*2);
    ctx.fill();
  }
  
  const bpm = 60 + level * 10;
  const beatDuration = 60000 / bpm;
  const beatPhase = (time % beatDuration) / beatDuration;
  const pulse = Math.pow(1 - beatPhase, 3);
  
  for (let kIdx of knots) {
    const n = nodes[kIdx];
    ctx.fillStyle = c.knot;
    ctx.beginPath();
    ctx.arc(n.x, n.y, 6 + pulse * 4, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowColor = c.knot;
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  if (path.length > 0) {
    ctx.strokeStyle = c.path;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = c.path;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(nodes[path[0]].x, nodes[path[0]].y);
    for (let i = 1; i < path.length; i++) {
      ctx.lineTo(nodes[path[i]].x, nodes[path[i]].y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    if (isDragging) {
      const last = nodes[path[path.length - 1]];
      ctx.strokeStyle = c.path;
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(touchCurrentX, touchCurrentY);
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }
  }
  
  for (let l of lasers) {
    if (l.state === 'WARNING') {
      ctx.fillStyle = c.laserWarn;
      ctx.fillRect(l.x, l.y, l.w, l.h);
      ctx.strokeStyle = c.laser;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 8]);
      ctx.beginPath();
      if (l.isHorizontal) {
        ctx.moveTo(0, l.y + l.h/2);
        ctx.lineTo(width, l.y + l.h/2);
      } else {
        ctx.moveTo(l.x + l.w/2, 0);
        ctx.lineTo(l.x + l.w/2, height);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = c.laser;
      ctx.shadowColor = c.laser;
      ctx.shadowBlur = 15;
      ctx.fillRect(l.x, l.y, l.w, l.h);
      ctx.fillStyle = isDarkMode ? '#000' : '#fff';
      ctx.shadowBlur = 0;
      
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (l.isHorizontal) {
        ctx.fillRect(l.x, l.y + l.h/2 - 1, l.w, 2);
        ctx.fillText("POINTER ASSIST", width/2, l.y + l.h/2);
      } else {
        ctx.fillRect(l.x + l.w/2 - 1, l.y, 2, l.h);
        ctx.save();
        ctx.translate(l.x + l.w/2, height/2);
        ctx.rotate(-Math.PI/2);
        ctx.fillText("POINTER ASSIST", 0, 0);
        ctx.restore();
      }
    }
  }
  
  if (player.dodgeCooldown > 0 && !player.isDodging) {
    ctx.strokeStyle = isDarkMode ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 16, -Math.PI/2, -Math.PI/2 + (1 - player.dodgeCooldown/800) * Math.PI * 2);
    ctx.stroke();
  }
  
  if (player.isDodging) {
    ctx.strokeStyle = c.dodge;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 14 + pulse * 4, 0, Math.PI*2);
    ctx.stroke();
  } else {
    ctx.fillStyle = c.player;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowColor = c.player;
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  for (let p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
</script>
