<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sticky Orbit</title>
<style>
  :root {
    --bg-light: #FDFBF7;
    --bg-dark: #1A1A1A;
  }
  body, html {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--bg-light);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    body {
      background-color: var(--bg-dark);
    }
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  
  let width, height, dpr;
  let isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    isDarkMode = e.matches;
  });

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // Audio Context
  let audioCtx;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, type, duration, vol=0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // Game State
  let state = 'TITLE'; // TITLE, PLAY, OVER, WIN
  let timer = 60;
  let notesLanded = 0;
  let rings = [];
  let activeNote = null;
  let flyingNotes = [];
  let particles = [];
  let windAngle = 0;
  let windStrength = 0;
  let windTime = 0;
  let shakeTime = 0;
  
  const WORDS = ["MVP", "ASAP", "SYNC", "PING", "WIP", "LGTM", "AGILE", "PIVOT"];

  function resetGame() {
    timer = 60;
    notesLanded = 0;
    const minDim = Math.min(width, height);
    rings = [
      { radius: minDim * 0.2, rotation: 0, speed: 1.2, notes: [] },
      { radius: minDim * 0.35, rotation: 0, speed: -0.8, notes: [] }
    ];
    flyingNotes = [];
    particles = [];
    spawnNote();
    state = 'PLAY';
  }

  function spawnNote() {
    activeNote = {
      x: width / 2,
      y: height - 75,
      vx: 0,
      vy: 0,
      word: WORDS[Math.floor(Math.random() * WORDS.length)],
      state: 'DOCK',
      spin: 0
    };
  }

  function createParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 150 + 50;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0.3 + Math.random() * 0.2,
        maxLife: 0.5,
        size: Math.random() * 4 + 2,
        color: color
      });
    }
  }

  function triggerCollapse() {
    state = 'OVER';
    playTone(150, 'sawtooth', 0.5);
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    shakeTime = 0.5;
    
    let cx = width / 2;
    let cy = height / 2 - 60;
    rings.forEach(r => {
      r.notes.forEach(n => {
        let angle = r.rotation + n.relAngle;
        let nx = cx + Math.cos(angle) * r.radius;
        let ny = cy + Math.sin(angle) * r.radius;
        flyingNotes.push({
          x: nx,
          y: ny,
          vx: (Math.random() - 0.5) * 1500,
          vy: (Math.random() - 0.5) * 1500,
          word: n.word,
          spin: (Math.random() - 0.5) * 20
        });
      });
      r.notes = [];
    });
    
    if (activeNote) {
      activeNote.vx = (Math.random() - 0.5) * 1500;
      activeNote.vy = (Math.random() - 0.5) * 1500;
      activeNote.spin = (Math.random() - 0.5) * 20;
      activeNote.state = 'FLYING';
      flyingNotes.push(activeNote);
      activeNote = null;
    }
  }

  // Input
  let touchStartX = 0;
  let touchStartY = 0;
  let touchCurrentX = 0;
  let touchCurrentY = 0;
  let isDragging = false;

  window.addEventListener('pointerdown', (e) => {
    initAudio();
    if (state === 'TITLE' || state === 'OVER' || state === 'WIN') {
      resetGame();
      return;
    }
    if (state === 'PLAY' && activeNote && activeNote.state === 'DOCK') {
      const dist = Math.hypot(e.clientX - activeNote.x, e.clientY - activeNote.y);
      if (dist < 80) {
        isDragging = true;
        activeNote.state = 'DRAG';
        touchStartX = e.clientX;
        touchStartY = e.clientY;
        touchCurrentX = e.clientX;
        touchCurrentY = e.clientY;
      }
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (isDragging) {
      let dx = e.clientX - touchStartX;
      let dy = e.clientY - touchStartY;
      const dist = Math.hypot(dx, dy);
      const maxDrag = 150;
      
      if (dist > maxDrag) {
        dx = (dx / dist) * maxDrag;
        dy = (dy / dist) * maxDrag;
      }
      
      touchCurrentX = touchStartX + dx;
      touchCurrentY = touchStartY + dy;
    }
  });

  window.addEventListener('pointerup', (e) => {
    if (isDragging) {
      isDragging = false;
      const dx = touchCurrentX - touchStartX;
      const dy = touchCurrentY - touchStartY;
      const dist = Math.hypot(dx, dy);
      
      if (dist > 20 && dy < 0) {
        const forceMultiplier = 18; 
        activeNote.vx = dx * forceMultiplier;
        activeNote.vy = dy * forceMultiplier;
        activeNote.state = 'FLYING';
        flyingNotes.push(activeNote);
        activeNote = null;
        playTone(400, 'sine', 0.1);
        
        setTimeout(() => {
          if (state === 'PLAY') spawnNote();
        }, 300);
      } else {
        if (activeNote) activeNote.state = 'DOCK';
      }
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      initAudio();
      if (state === 'TITLE' || state === 'OVER' || state === 'WIN') {
        resetGame();
      } else if (state === 'PLAY' && activeNote && activeNote.state === 'DOCK') {
        activeNote.vx = 0;
        activeNote.vy = -1800;
        activeNote.state = 'FLYING';
        flyingNotes.push(activeNote);
        activeNote = null;
        playTone(400, 'sine', 0.1);
        setTimeout(() => {
          if (state === 'PLAY') spawnNote();
        }, 300);
      }
    }
  });

  // Loop
  let lastTime = performance.now();
  function loop(time) {
    requestAnimationFrame(loop);
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;

    update(dt);
    draw();
  }

  function update(dt) {
    if (state === 'PLAY') {
      timer -= dt;
      if (timer <= 0) {
        timer = 0;
        triggerCollapse();
      }
      
      windTime += dt;
      windAngle = windTime * 0.5; 
      windStrength = (Math.sin(windTime * 1.5) * 0.5 + 0.5) * 800; 
      
      const speedMultiplier = 1 + (notesLanded * 0.25);
      rings.forEach(r => {
        r.rotation += r.speed * speedMultiplier * dt;
      });
      
      let cx = width / 2;
      let cy = height / 2 - 60;
      
      for (let i = flyingNotes.length - 1; i >= 0; i--) {
        let n = flyingNotes[i];
        
        n.vx += Math.cos(windAngle) * windStrength * dt;
        n.vy += Math.sin(windAngle) * windStrength * dt;
        
        let prevX = n.x;
        let prevY = n.y;
        n.x += n.vx * dt;
        n.y += n.vy * dt;
        
        if (n.spin) n.rotation = (n.rotation || 0) + n.spin * dt;
        
        let dist = Math.hypot(n.x - cx, n.y - cy);
        let prevDist = Math.hypot(prevX - cx, prevY - cy);
        
        let stuck = false;
        
        for (let r of rings) {
          if ((prevDist > r.radius && dist <= r.radius) || 
              (prevDist < r.radius && dist >= r.radius)) {
            
            stuck = true;
            
            let t = Math.abs((r.radius - prevDist) / (dist - prevDist));
            let crossX = prevX + (n.x - prevX) * t;
            let crossY = prevY + (n.y - prevY) * t;
            
            let angle = Math.atan2(crossY - cy, crossX - cx);
            let relAngle = angle - r.rotation;
            relAngle = (relAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
            
            let overlap = false;
            const noteAngularWidth = (44 / r.radius) * 1.1; 
            for (let existingNote of r.notes) {
              let diff = Math.abs(relAngle - existingNote.relAngle);
              diff = Math.min(diff, Math.PI * 2 - diff);
              if (diff < noteAngularWidth) {
                overlap = true;
                break;
              }
            }
            
            if (overlap) {
              triggerCollapse();
            } else {
              r.notes.push({ relAngle, word: n.word });
              notesLanded++;
              playTone(800 + notesLanded * 100, 'square', 0.1);
              if (navigator.vibrate) navigator.vibrate(50);
              createParticles(crossX, crossY, '#E6FF00');
              
              if (notesLanded >= 5) {
                state = 'WIN';
                playTone(600, 'sine', 0.1);
                setTimeout(() => playTone(800, 'sine', 0.1), 100);
                setTimeout(() => playTone(1000, 'sine', 0.3), 200);
                if (navigator.vibrate) navigator.vibrate([50, 50, 100]);
              }
            }
            
            flyingNotes.splice(i, 1);
            break; 
          }
        }
        
        if (!stuck) {
          if (n.x < -200 || n.x > width + 200 || n.y < -200 || n.y > height + 200) {
            flyingNotes.splice(i, 1);
          }
        }
      }
    } else if (state === 'OVER' || state === 'WIN') {
      for (let i = flyingNotes.length - 1; i >= 0; i--) {
        let n = flyingNotes[i];
        n.x += n.vx * dt;
        n.y += n.vy * dt;
        n.rotation = (n.rotation || 0) + n.spin * dt;
      }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    
    if (shakeTime > 0) shakeTime -= dt;
  }

  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = isDarkMode ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < width; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
    }
    for (let y = 0; y < height; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawWind() {
    ctx.save();
    ctx.strokeStyle = isDarkMode ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    
    const numGusts = 6;
    for (let i = 0; i < numGusts; i++) {
      let t = (windTime * 0.4 + i / numGusts) % 1.0;
      let cx = width/2 - Math.cos(windAngle) * width * 0.8 + Math.cos(windAngle) * width * 1.6 * t;
      let cy = height/2 - Math.sin(windAngle) * height * 0.8 + Math.sin(windAngle) * height * 1.6 * t;
      
      let perpX = -Math.sin(windAngle);
      let perpY = Math.cos(windAngle);
      let offset = (i - numGusts/2) * 80;
      
      cx += perpX * offset;
      cy += perpY * offset;
      
      ctx.beginPath();
      for (let j = 0; j <= 20; j++) {
        let jt = j / 20;
        let px = cx + Math.cos(windAngle) * jt * 120 + perpX * Math.sin(jt * Math.PI) * 30;
        let py = cy + Math.sin(windAngle) * jt * 120 + perpY * Math.sin(jt * Math.PI) * 30;
        if (j === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.globalAlpha = Math.sin(t * Math.PI) * (windStrength / 800);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawNote(x, y, rotation, word, scale = 1.0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.scale(scale, scale);
    
    const size = 44;
    
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(-size/2 + 4, -size/2 + 4, size, size);
    
    ctx.fillStyle = '#E6FF00';
    ctx.fillRect(-size/2, -size/2, size, size);
    
    ctx.fillStyle = '#C2D600';
    ctx.beginPath();
    ctx.moveTo(size/2 - 12, -size/2);
    ctx.lineTo(size/2, -size/2 + 12);
    ctx.lineTo(size/2 - 12, -size/2 + 12);
    ctx.fill();
    
    ctx.fillStyle = '#1A1A1A';
    ctx.font = 'bold 12px ui-monospace, "SFMono-Regular", Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(word, 0, 2);
    
    ctx.restore();
  }

  function draw() {
    ctx.save();
    ctx.fillStyle = isDarkMode ? '#1A1A1A' : '#FDFBF7';
    ctx.fillRect(0, 0, width, height);
    
    if (shakeTime > 0) {
      ctx.translate((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15);
    }
    
    drawGrid();
    drawWind();
    
    let cx = width / 2;
    let cy = height / 2 - 60;
    
    ctx.lineWidth = 2;
    ctx.strokeStyle = isDarkMode ? '#555555' : '#CCCCCC';
    
    rings.forEach(r => {
      ctx.beginPath();
      ctx.arc(cx, cy, r.radius, 0, Math.PI * 2);
      ctx.fillStyle = isDarkMode ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.02)';
      ctx.fill();
      ctx.setLineDash([8, 8]);
      ctx.stroke();
      ctx.setLineDash([]);
      
      r.notes.forEach(n => {
        let angle = r.rotation + n.relAngle;
        let nx = cx + Math.cos(angle) * r.radius;
        let ny = cy + Math.sin(angle) * r.radius;
        drawNote(nx, ny, angle + Math.PI/2, n.word);
      });
    });
    
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI * 2);
    ctx.fillStyle = isDarkMode ? '#333333' : '#E0E0E0';
    ctx.fill();
    
    if (state === 'PLAY') {
      ctx.fillStyle = isDarkMode ? '#222222' : '#F0EFEA';
      ctx.fillRect(0, height - 150, width, 150);
      
      ctx.strokeStyle = isDarkMode ? '#333333' : '#E0DFDA';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, height - 150);
      ctx.lineTo(width, height - 150);
      ctx.stroke();
      
      ctx.fillStyle = isDarkMode ? '#555555' : '#AAAAAA';
      ctx.font = '12px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('FLICK UP TO LAUNCH', width/2, height - 20);
    }
    
    flyingNotes.forEach(n => {
      let angle = n.rotation !== undefined ? n.rotation : Math.atan2(n.vy, n.vx) + Math.PI/2;
      drawNote(n.x, n.y, angle, n.word);
    });
    
    if (activeNote) {
      let nx = activeNote.x;
      let ny = activeNote.y;
      if (activeNote.state === 'DRAG') {
        nx = touchCurrentX;
        ny = touchCurrentY;
        
        let dx = touchCurrentX - touchStartX;
        let dy = touchCurrentY - touchStartY;
        
        ctx.beginPath();
        ctx.moveTo(touchCurrentX, touchCurrentY);
        let simX = touchCurrentX;
        let simY = touchCurrentY;
        let vx = dx * 18;
        let vy = dy * 18;
        
        ctx.setLineDash([4, 8]);
        ctx.strokeStyle = isDarkMode ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 2;
        
        for (let i = 0; i < 15; i++) {
          vx += Math.cos(windAngle) * windStrength * 0.05;
          vy += Math.sin(windAngle) * windStrength * 0.05;
          simX += vx * 0.05;
          simY += vy * 0.05;
          ctx.lineTo(simX, simY);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }
      drawNote(nx, ny, 0, activeNote.word, activeNote.state === 'DRAG' ? 1.1 : 1.0);
    }
    
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1.0;
    
    ctx.fillStyle = isDarkMode ? '#FDFBF7' : '#1A1A1A';
    ctx.font = '20px ui-monospace, "SFMono-Regular", Menlo, monospace';
    ctx.textBaseline = 'top';
    
    if (state === 'PLAY' || state === 'OVER' || state === 'WIN') {
      let t = Math.ceil(timer);
      ctx.textAlign = 'left';
      ctx.fillText(`00:${t.toString().padStart(2, '0')}`, 20, 20);
      
      ctx.textAlign = 'right';
      ctx.fillText(`${notesLanded}/5`, width - 20, 20);
    }
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    if (state === 'TITLE') {
      ctx.font = 'bold 36px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.fillText('STICKY ORBIT', width/2, height/2 - 60);
      ctx.font = '16px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.fillText('Flick notes to rings.', width/2, height/2);
      ctx.fillText('Don\'t overlap.', width/2, height/2 + 25);
      
      ctx.globalAlpha = Math.sin(performance.now() / 200) * 0.5 + 0.5;
      ctx.fillText('TAP TO START', width/2, height/2 + 100);
      ctx.globalAlpha = 1.0;
    } else if (state === 'OVER') {
      ctx.font = 'bold 40px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.fillStyle = '#FF3333';
      ctx.fillText('COLLAPSE', width/2, height/2 - 20);
      ctx.font = '16px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.fillStyle = isDarkMode ? '#FDFBF7' : '#1A1A1A';
      ctx.fillText('TAP TO RESTART', width/2, height/2 + 30);
    } else if (state === 'WIN') {
      ctx.save();
      ctx.translate(width/2, height/2 - 30);
      
      ctx.rotate(performance.now() / 1000);
      ctx.fillStyle = '#E6FF00';
      for (let i = 0; i < 12; i++) {
        ctx.rotate((Math.PI * 2) / 12);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(25, -120);
        ctx.lineTo(-25, -120);
        ctx.fill();
      }
      ctx.restore();
      
      ctx.beginPath();
      ctx.arc(width/2, height/2 - 30, 70, 0, Math.PI * 2);
      ctx.fillStyle = isDarkMode ? '#1A1A1A' : '#FDFBF7';
      ctx.fill();
      
      ctx.fillStyle = isDarkMode ? '#FDFBF7' : '#1A1A1A';
      ctx.font = 'bold 28px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.fillText('CLEAN', width/2, height/2 - 45);
      ctx.fillText('SCRUM', width/2, height/2 - 15);
      
      ctx.font = '16px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.fillStyle = isDarkMode ? '#FDFBF7' : '#1A1A1A';
      ctx.fillText('TAP TO REPLAY', width/2, height/2 + 80);
    }
    
    ctx.restore();
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
