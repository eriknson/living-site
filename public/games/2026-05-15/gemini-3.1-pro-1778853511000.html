<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminal Sort</title>
<style>
  :root {
    --bg: #f4f4f6;
    --text: #1a1a1a;
    --glass: rgba(255,255,255,0.8);
    --border: rgba(0,0,0,0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --text: #e2e8f0;
      --glass: rgba(15,17,21,0.8);
      --border: rgba(255,255,255,0.1);
    }
  }
  body, html {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 20;
  }
  .hidden { display: none !important; }
  .screen {
    background: var(--glass);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border); padding: 2rem; border-radius: 1rem;
    text-align: center; pointer-events: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 80%;
  }
  h1 { margin: 0 0 1rem 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
  p { margin: 0 0 1.5rem 0; font-size: 0.9rem; opacity: 0.8; line-height: 1.4; }
  button {
    background: var(--text); color: var(--bg); border: none;
    padding: 0.8rem 1.5rem; font-family: inherit; font-size: 1rem;
    border-radius: 0.5rem; font-weight: bold; cursor: pointer;
    text-transform: uppercase; transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }
  #hud {
    position: absolute; top: env(safe-area-inset-top, 20px);
    left: 20px; right: 20px; display: flex; justify-content: space-between;
    font-size: 1.1rem; font-weight: bold; pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div id="scoreDisplay">SCORE: 0</div>
  <div id="backlogDisplay">BACKLOG: 0%</div>
</div>
<div id="ui">
  <div id="startScreen" class="screen">
    <h1>Terminal Sort</h1>
    <p>Flick agent tasks into the correct wells.<br><br><span style="color:#3b82f6">Plan</span> · <span style="color:#10b981">Ship</span> · <span style="color:#f59e0b">Sleep</span><br><br>Don't let the backlog hydra overflow.</p>
    <button id="startBtn">Initialize</button>
  </div>
  <div id="gameOverScreen" class="screen hidden">
    <h1>Overflow</h1>
    <p id="finalScore">Score: 0</p>
    <button id="restartBtn">Reboot</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.addEventListener('touchstart', e => { e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

let isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { isDarkMode = e.matches; });

function getWellColor(type) {
    if (type === 'plan') return isDarkMode ? '#60a5fa' : '#3b82f6';
    if (type === 'ship') return isDarkMode ? '#34d399' : '#10b981';
    if (type === 'sleep') return isDarkMode ? '#fbbf24' : '#f59e0b';
    return '#fff';
}

const wells = [
    { type: 'plan', label: 'PLAN', accepts: t => t.includes('plan') },
    { type: 'ship', label: 'SHIP', accepts: t => t.includes('ship') },
    { type: 'sleep', label: 'SLEEP', accepts: t => t.includes('sleep') },
];

let gameState = 'start';
let score = 0;
let backlog = 0;
let badges = [];
let particles = [];
let hydraHeight = 20;
let spawnTimer = 0;
let lastTime = performance.now();
let shakeAmount = 0;
const badgeSize = 50;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let wY = Math.max(100, canvas.height * 0.15);
    let padding = canvas.width * 0.15;
    let availWidth = canvas.width - padding * 2;
    wells[0].x = padding;
    wells[1].x = padding + availWidth * 0.5;
    wells[2].x = padding + availWidth;
    for (let w of wells) {
        w.y = wY;
        w.radius = Math.min(45, canvas.width * 0.12);
    }
}
window.addEventListener('resize', resize);
resize();

let pointer = { active: false, id: null, x: 0, y: 0, badge: null, histTimes: [], histXs: [], histYs: [] };

function handleDown(e) {
    if (gameState !== 'playing' || pointer.active) return;
    pointer.active = true;
    pointer.id = e.pointerId;
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.histTimes = [performance.now()];
    pointer.histXs = [e.clientX]; pointer.histYs = [e.clientY];
    
    let nearest = null; let minDist = badgeSize * 1.5;
    for (let b of badges) {
        if (b.state !== 'active') continue;
        let dist = Math.hypot(b.x - pointer.x, b.y - pointer.y);
        if (dist < minDist) { minDist = dist; nearest = b; }
    }
    if (nearest) {
        pointer.badge = nearest; nearest.state = 'dragged';
        nearest.vx = 0; nearest.vy = 0;
        if (navigator.vibrate) navigator.vibrate(15);
    }
}
function handleMove(e) {
    if (!pointer.active || e.pointerId !== pointer.id) return;
    pointer.x = e.clientX; pointer.y = e.clientY;
    let now = performance.now();
    pointer.histTimes.push(now); pointer.histXs.push(pointer.x); pointer.histYs.push(pointer.y);
    if (pointer.histTimes.length > 5) {
        pointer.histTimes.shift(); pointer.histXs.shift(); pointer.histYs.shift();
    }
    if (pointer.badge) {
        pointer.badge.x = pointer.x; pointer.badge.y = pointer.y;
    }
}
function handleUp(e) {
    if (!pointer.active || e.pointerId !== pointer.id) return;
    pointer.active = false;
    if (pointer.badge) {
        let b = pointer.badge; b.state = 'active'; pointer.badge = null;
        if (pointer.histTimes.length > 1) {
            let dt = pointer.histTimes[pointer.histTimes.length - 1] - pointer.histTimes[0];
            let dx = pointer.histXs[pointer.histXs.length - 1] - pointer.histXs[0];
            let dy = pointer.histYs[pointer.histYs.length - 1] - pointer.histYs[0];
            if (dt > 0) { b.vx = (dx / dt) * 16; b.vy = (dy / dt) * 16; }
        }
        let speed = Math.hypot(b.vx, b.vy);
        if (speed > 30) { b.vx = (b.vx / speed) * 30; b.vy = (b.vy / speed) * 30; }
    }
}
canvas.addEventListener('pointerdown', handleDown);
canvas.addEventListener('pointermove', handleMove);
window.addEventListener('pointerup', handleUp);
window.addEventListener('pointercancel', handleUp);

function createParticles(x, y, color) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            life: 1, color: color
        });
    }
}

function spawnBadge() {
    let types = ['plan', 'ship', 'sleep'];
    let type = types[Math.floor(Math.random() * types.length)];
    if (score > 10 && Math.random() < Math.min(0.4, score * 0.015)) {
        let t2 = types[Math.floor(Math.random() * types.length)];
        while(t2 === type) t2 = types[Math.floor(Math.random() * types.length)];
        type = type + '-' + t2;
    }
    badges.push({
        x: canvas.width / 2 + (Math.random() - 0.5) * (canvas.width * 0.6),
        y: canvas.height - hydraHeight - badgeSize,
        vx: (Math.random() - 0.5) * 4,
        vy: -11 - Math.random() * 4,
        type: type, state: 'active', scale: 1, dead: false,
        rot: 0, vrot: (Math.random() - 0.5) * 0.2
    });
}

function checkGameOver() {
    if (backlog >= 100 && gameState === 'playing') {
        gameState = 'gameover';
        document.getElementById('ui').classList.remove('hidden');
        document.getElementById('gameOverScreen').classList.remove('hidden');
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('finalScore').innerText = 'Score: ' + score;
        if (pointer.badge) pointer.badge = null;
        pointer.active = false;
    }
}

function updateHUD() {
    document.getElementById('scoreDisplay').innerText = `SCORE: ${score}`;
    document.getElementById('backlogDisplay').innerText = `BACKLOG: ${Math.floor(backlog)}%`;
}

let audioCtx;
try {
    window.AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
} catch (e) { console.warn('Web Audio not supported'); }

function playSound(type) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let now = audioCtx.currentTime;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    
    if (type === 'sort') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    }
}

function vibratePulse(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
}

function update(dt) {
    if (gameState !== 'playing') return;
    spawnTimer += dt;
    let currentSpawnInterval = Math.max(700, 2000 - score * 30);
    if (spawnTimer > currentSpawnInterval) {
        spawnTimer = 0; spawnBadge();
    }
    
    let targetH = Math.max(30, (backlog / 100) * (canvas.height * 0.4));
    hydraHeight += (targetH - hydraHeight) * 0.05;
    let hydraHitY = canvas.height - hydraHeight;
    
    for (let i = badges.length - 1; i >= 0; i--) {
        let b = badges[i];
        if (b.dead) { badges.splice(i, 1); continue; }
        
        if (b.state === 'sucked') {
            b.x += (b.targetWell.x - b.x) * 0.25;
            b.y += (b.targetWell.y - b.y) * 0.25;
            b.scale *= 0.8; b.rot += b.vrot * 2;
            if (b.scale < 0.05) {
                b.dead = true;
                if (b.targetWell.accepts(b.type)) {
                    score++; backlog = Math.max(0, backlog - 4);
                    createParticles(b.x, b.y, getWellColor(b.targetWell.type));
                    vibratePulse(30); playSound('sort');
                } else {
                    backlog = Math.min(100, backlog + 15);
                    shakeAmount = 15; vibratePulse([50, 50]); playSound('error');
                    createParticles(b.x, b.y, isDarkMode ? '#f87171' : '#ef4444');
                }
                updateHUD(); checkGameOver();
            }
            continue;
        }
        
        if (b.state === 'active') {
            b.vy += 0.2; // Gravity
            b.x += b.vx; b.y += b.vy;
            b.vx *= 0.99; b.vy *= 0.99;
            b.rot += (b.vx * 0.01) + b.vrot;
            
            if (b.x < badgeSize/2) { b.x = badgeSize/2; b.vx *= -0.7; }
            if (b.x > canvas.width - badgeSize/2) { b.x = canvas.width - badgeSize/2; b.vx *= -0.7; }
            if (b.y < badgeSize/2) { b.y = badgeSize/2; b.vy *= -0.7; }
            
            if (b.y > hydraHitY && b.vy > 0) {
                b.dead = true;
                backlog = Math.min(100, backlog + 10);
                createParticles(b.x, b.y, isDarkMode ? '#f87171' : '#ef4444');
                shakeAmount = 10; vibratePulse(40); playSound('error');
                updateHUD(); checkGameOver();
                continue;
            }
            
            for (let w of wells) {
                let dist = Math.hypot(w.x - b.x, w.y - b.y);
                if (dist < w.radius * 2.5) {
                    let force = (w.radius * 2.5 - dist) * 0.0008;
                    b.vx += (w.x - b.x) * force; b.vy += (w.y - b.y) * force;
                }
                if (dist < w.radius * 0.8) {
                    b.state = 'sucked'; b.targetWell = w; break;
                }
            }
        } else if (b.state === 'dragged') {
            b.rot = 0;
        }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.95; p.vy *= 0.95;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    if (shakeAmount > 0) {
        ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
        shakeAmount *= 0.85; if (shakeAmount < 0.5) shakeAmount = 0;
    }
    
    let t = time / 1000;
    for (let w of wells) {
        let pulse = Math.sin(t * 3 + w.x) * 3;
        let r = w.radius + pulse;
        let c = getWellColor(w.type);
        ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, Math.PI * 2);
        ctx.fillStyle = isDarkMode ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.4)'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = c; ctx.stroke();
        ctx.fillStyle = c; ctx.font = 'bold 12px ui-monospace, monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(w.label, w.x, w.y - w.radius - 15);
    }
    
    for (let b of badges) {
        ctx.save();
        ctx.translate(b.x, b.y); ctx.scale(b.scale, b.scale); ctx.rotate(b.rot);
        let types = b.type.split('-');
        let mainC = getWellColor(types[0]);
        let secC = types.length > 1 ? getWellColor(types[1]) : mainC;
        ctx.beginPath(); ctx.roundRect(-badgeSize/2, -badgeSize/2, badgeSize, badgeSize, 10);
        if (types.length > 1) {
            let grad = ctx.createLinearGradient(-badgeSize/2, -badgeSize/2, badgeSize/2, badgeSize/2);
            grad.addColorStop(0, mainC); grad.addColorStop(1, secC);
            ctx.fillStyle = isDarkMode ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.04)'; ctx.fill();
            ctx.strokeStyle = grad;
        } else {
            ctx.fillStyle = isDarkMode ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.04)'; ctx.fill();
            ctx.strokeStyle = mainC;
        }
        ctx.lineWidth = 2;
        if (b.state === 'dragged') {
            ctx.shadowColor = mainC; ctx.shadowBlur = 12; ctx.scale(1.15, 1.15);
            ctx.lineWidth = 3; ctx.fillStyle = isDarkMode ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.08)'; ctx.fill();
        }
        ctx.stroke(); ctx.shadowBlur = 0;
        ctx.fillStyle = isDarkMode ? '#fff' : '#000';
        ctx.font = 'bold 12px ui-monospace, monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        let lbl = types.map(t => t.substring(0,2).toUpperCase()).join('/');
        ctx.fillText(lbl, 0, 0);
        ctx.restore();
    }
    
    let base = canvas.height - hydraHeight;
    let ht = time / 600;
    ctx.beginPath(); ctx.moveTo(0, canvas.height); ctx.lineTo(0, base);
    for (let x = 0; x <= canvas.width; x += 20) {
        let y = base + Math.sin(x * 0.05 + ht) * 12 + Math.sin(x * 0.02 - ht * 0.7) * 8;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width, canvas.height); ctx.closePath();
    ctx.fillStyle = isDarkMode ? '#450a0a' : '#fee2e2'; ctx.fill();
    ctx.strokeStyle = isDarkMode ? '#f87171' : '#ef4444'; ctx.lineWidth = 2; ctx.stroke();
    
    let numHeads = Math.min(20, Math.floor(backlog / 5));
    for (let i = 0; i < numHeads; i++) {
        let hx = (canvas.width / (numHeads + 1)) * (i + 1) + Math.sin(ht + i*2) * 15;
        let hy = base + 20 + Math.cos(ht * 1.3 + i*3) * 10;
        if (hy < canvas.height - 5) {
            ctx.beginPath(); ctx.arc(hx, hy, 3, 0, Math.PI * 2);
            ctx.fillStyle = isDarkMode ? '#f87171' : '#ef4444'; ctx.fill();
        }
    }
    
    for (let p of particles) {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.life * 4, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

function loop(time) {
    let dt = time - lastTime;
    lastTime = time;
    if (dt > 100) dt = 16;
    update(dt);
    draw(time);
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGame() {
    gameState = 'playing'; score = 0; backlog = 0; badges = []; particles = [];
    hydraHeight = 30; spawnTimer = 0; pointer.active = false; pointer.badge = null;
    document.getElementById('ui').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    updateHUD();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
</script>
</body>
</html>
