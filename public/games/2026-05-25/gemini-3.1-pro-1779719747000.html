<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide Sort</title>
<style>
    body, html {
        margin: 0; padding: 0; width: 100dvw; height: 100dvh;
        overflow: hidden; background-color: #f4f2ec; color: #333;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        touch-action: none; user-select: none; -webkit-user-select: none;
    }
    @media (prefers-color-scheme: dark) {
        body, html { background-color: #1c1e21; color: #ececec; }
    }
    canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let w, h;
let gameState = 'TITLE';
let score = 0;
let gameTime = 60;
let pieces = [];
let particles = [];
let pools = [];
let wind = 0;
let waveY = 9999;
let waveState = 'idle';
let waveTimer = 0;
let waveCycle = 0;
let lastTime = performance.now();

const PALETTE = {
    teal: { light: '#70b3b8', dark: '#356d73' },
    yellow: { light: '#d9c76c', dark: '#918440' },
    coral: { light: '#d68383', dark: '#8f4f4f' },
    decoy: { light: '#b0b5b5', dark: '#5d6363' }
};

let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playClink(freq = 800) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}

function playSplash() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

function playError() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}

function resize() {
    w = window.innerWidth;
    h = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    const poolR = Math.min(w * 0.18, 70);
    if(pools.length === 0) {
        pools.push({ x: w * 0.25, y: poolR + 40, radius: poolR, type: 'teal' });
        pools.push({ x: w * 0.75, y: poolR + 40, radius: poolR, type: 'yellow' });
        pools.push({ x: w * 0.5,  y: poolR * 2 + 60, radius: poolR, type: 'coral' });
    } else {
        pools[0].x = w * 0.25; pools[0].y = poolR + 40; pools[0].radius = poolR;
        pools[1].x = w * 0.75; pools[1].y = poolR + 40; pools[1].radius = poolR;
        pools[2].x = w * 0.5;  pools[2].y = poolR * 2 + 60; pools[2].radius = poolR;
    }
    if (waveState === 'idle') waveY = h + 100;
}
window.addEventListener('resize', resize);
resize();

function createPiece(x, y, type, type2 = null) {
    const pts = [];
    const numSides = type === 'decoy' ? 6 : 4 + Math.floor(Math.random() * 2); 
    const radius = (22 + Math.random() * 8) * (Math.min(w, 400) / 400);
    for(let i=0; i<numSides; i++) {
        const ang = (i / numSides) * Math.PI * 2 + (Math.random() * 0.4 - 0.2);
        let r = radius * (0.8 + Math.random() * 0.4);
        if (type === 'decoy' && i % 2 === 0) r *= 0.7; 
        pts.push({x: Math.cos(ang)*r, y: Math.sin(ang)*r});
    }
    return { x, y, vx: 0, vy: 0, angle: Math.random()*Math.PI*2, angularVel: 0, type, type2, points: pts, radius, dragging: false };
}

function spawnPieces(count) {
    const types = ['teal', 'yellow', 'coral', 'decoy'];
    for (let i = 0; i < count; i++) {
        let type = types[Math.floor(Math.random() * 3)];
        let type2 = null;
        if (Math.random() < 0.1 * waveCycle) {
            type = 'decoy';
        } else if (Math.random() < 0.08 * waveCycle) {
            let otherType = types[Math.floor(Math.random() * 3)];
            if (otherType !== type) type2 = otherType;
        }
        pieces.push(createPiece(w/2 + (Math.random()-0.5)*150, h - 80 + (Math.random()-0.5)*40, type, type2));
    }
}

function startRound() {
    gameState = 'PLAYING';
    score = 0;
    gameTime = 60;
    pieces = [];
    particles = [];
    waveY = h + 100;
    waveState = 'idle';
    waveTimer = 5000;
    waveCycle = 0;
    spawnPieces(5);
}

function createFloatingText(x, y, text, color) {
    particles.push({ x, y, life: 1, text, type: 'text', color, vy: -30 });
}

function createRipples(x, y, type) {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const color = PALETTE[type][isDark ? 'dark' : 'light'];
    particles.push({ x, y, r: 10, maxR: 60, life: 1, type: 'ripple', color });
    for(let i=0; i<5; i++) {
        particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, type: 'splash', color });
    }
}

let draggedPiece = null;
let touchHistory = [];

function getPointerPos(e) {
    if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    else if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
}

function handleStart(e) {
    e.preventDefault();
    initAudio();
    const pos = getPointerPos(e);
    
    if (gameState === 'TITLE' || gameState === 'GAMEOVER') {
        const btnY = gameState === 'TITLE' ? h/2 + 80 : h/2 + 60;
        if (pos.y > btnY && pos.y < btnY + 50) startRound();
        return;
    }
    
    for (let i = pieces.length - 1; i >= 0; i--) {
        const p = pieces[i];
        const dx = pos.x - p.x;
        const dy = pos.y - p.y;
        if (Math.sqrt(dx*dx + dy*dy) < p.radius + 15) {
            draggedPiece = p;
            p.dragging = true;
            p.vx = 0; p.vy = 0; p.angularVel = 0;
            touchHistory = [{ x: pos.x, y: pos.y, t: performance.now() }];
            break;
        }
    }
}

function handleMove(e) {
    e.preventDefault();
    if (draggedPiece) {
        const pos = getPointerPos(e);
        draggedPiece.x = pos.x;
        draggedPiece.y = pos.y;
        touchHistory.push({ x: pos.x, y: pos.y, t: performance.now() });
        if (touchHistory.length > 5) touchHistory.shift();
    }
}

function handleEnd(e) {
    e.preventDefault();
    if (draggedPiece) {
        if (touchHistory.length > 1) {
            const first = touchHistory[0];
            const last = { x: draggedPiece.x, y: draggedPiece.y, t: performance.now() };
            const dt = last.t - first.t;
            if (dt > 0) {
                const vx = ((last.x - first.x) / dt) * 15;
                const vy = ((last.y - first.y) / dt) * 15;
                const speed = Math.sqrt(vx*vx + vy*vy);
                const maxSpeed = 35;
                if (speed > maxSpeed) {
                    draggedPiece.vx = (vx / speed) * maxSpeed;
                    draggedPiece.vy = (vy / speed) * maxSpeed;
                } else {
                    draggedPiece.vx = vx;
                    draggedPiece.vy = vy;
                }
                draggedPiece.angularVel = (Math.random() - 0.5) * 0.5;
            }
        }
        draggedPiece.dragging = false;
        draggedPiece = null;
    }
}

const opts = { passive: false };
window.addEventListener('mousedown', handleStart, opts);
window.addEventListener('mousemove', handleMove, opts);
window.addEventListener('mouseup', handleEnd, opts);
window.addEventListener('touchstart', handleStart, opts);
window.addEventListener('touchmove', handleMove, opts);
window.addEventListener('touchend', handleEnd, opts);

function resolveCollisions() {
    for (let i = 0; i < pieces.length; i++) {
        for (let j = i + 1; j < pieces.length; j++) {
            const p1 = pieces[i];
            const p2 = pieces[j];
            if (p1.dragging || p2.dragging) continue;
            
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const minDist = p1.radius + p2.radius;
            
            if (dist < minDist && dist > 0) {
                const overlap = minDist - dist;
                const nx = dx / dist;
                const ny = dy / dist;
                
                p1.x -= nx * overlap * 0.5;
                p1.y -= ny * overlap * 0.5;
                p2.x += nx * overlap * 0.5;
                p2.y += ny * overlap * 0.5;
                
                const relVelX = p2.vx - p1.vx;
                const relVelY = p2.vy - p1.vy;
                const velAlongNormal = relVelX * nx + relVelY * ny;
                
                if (velAlongNormal < 0) {
                    const restitution = 0.5;
                    const jForce = -(1 + restitution) * velAlongNormal;
                    const mass = 1;
                    const impulse = jForce / (2 * mass);
                    
                    p1.vx -= impulse * nx;
                    p1.vy -= impulse * ny;
                    p2.vx += impulse * nx;
                    p2.vy += impulse * ny;

                    p1.angularVel += (Math.random() - 0.5) * 0.1;
                    p2.angularVel += (Math.random() - 0.5) * 0.1;
                }
            }
        }
        
        const p = pieces[i];
        if (p.x < p.radius) { p.x = p.radius; p.vx *= -0.8; }
        if (p.x > w - p.radius) { p.x = w - p.radius; p.vx *= -0.8; }
        if (p.y > h - p.radius && !p.dragging) { p.y = h - p.radius; p.vy *= -0.8; }
        if (p.y < p.radius) { p.y = p.radius; p.vy *= -0.8; }
    }
}

function checkPools() {
    for (let i = pieces.length - 1; i >= 0; i--) {
        const p = pieces[i];
        if (p.dragging) continue;
        
        for (let pool of pools) {
            const dx = pool.x - p.x;
            const dy = pool.y - p.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < pool.radius + p.radius) {
                p.vx += dx * 0.003;
                p.vy += dy * 0.003;
                
                if (dist < pool.radius * 0.5) {
                    if (p.type === pool.type || p.type2 === pool.type) {
                        score += 100;
                        playClink(800 + Math.random()*400);
                        createRipples(pool.x, pool.y, pool.type);
                        createFloatingText(pool.x, pool.y - 20, '+100', '#55ff55');
                        if (navigator.vibrate) navigator.vibrate(15);
                    } else {
                        score -= 50;
                        playError();
                        createRipples(pool.x, pool.y, 'decoy');
                        createFloatingText(pool.x, pool.y - 20, '-50', '#ff5555');
                        if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                    }
                    pieces.splice(i, 1);
                    break;
                }
            }
        }
    }
}

function updateWave(dt) {
    waveTimer -= dt;
    if (waveTimer <= 0 && waveState === 'idle') {
        waveState = 'rising';
        playSplash();
        if (navigator.vibrate) navigator.vibrate(40);
    }
    
    if (waveState === 'rising') {
        waveY -= 400 * (dt / 1000);
        if (waveY < h * 0.25) { 
            waveState = 'receding';
            waveCycle++;
            let swept = 0;
            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                if (p.y > waveY) {
                    if (p.dragging) draggedPiece = null;
                    if (p.type !== 'decoy') {
                        score -= 20;
                        createFloatingText(p.x, p.y, '-20', '#ff5555');
                    } else {
                        score += 50;
                        createFloatingText(p.x, p.y, '+50', '#55ff55');
                    }
                    pieces.splice(i, 1);
                    swept++;
                }
            }
            if(swept > 0 && navigator.vibrate) navigator.vibrate(30);
            spawnPieces(6 + waveCycle);
        }
    } else if (waveState === 'receding') {
        waveY += 300 * (dt / 1000);
        if (waveY > h + 100) {
            waveY = h + 100;
            waveState = 'idle';
            waveTimer = Math.max(10000 - waveCycle * 1000, 6000);
        }
    }
}

function updateEscalation(dt) {
    let progress = 1 - (gameTime / 60);
    if (progress > 0.3) {
        wind = Math.sin(progress * Math.PI) * 1.5;
        if (Math.random() < 0.05) {
            particles.push({
                x: wind > 0 ? -10 : w + 10,
                y: Math.random() * h,
                vx: wind * 300,
                vy: 0,
                life: 1,
                type: 'wind',
                color: 'rgba(255,255,255,0.2)'
            });
        }
    } else {
        wind = 0;
    }
    
    for (let p of pieces) {
        if (!p.dragging) p.vx += wind * 0.05;
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= (dt / 1000) * (p.type === 'text' ? 0.8 : 1.5);
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }
        if (p.type === 'text') p.y += p.vy * (dt / 1000);
        else if (p.type === 'splash') { p.x += p.vx; p.y += p.vy; }
        else if (p.type === 'wind') { p.x += p.vx * (dt / 1000); }
        else if (p.type === 'ripple') { p.r += (dt / 1000) * 100; }
    }
}

function drawPool(ctx, pool) {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const color = PALETTE[pool.type][isDark ? 'dark' : 'light'];
    
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.15;
    ctx.beginPath(); ctx.arc(pool.x, pool.y, pool.radius * 1.1, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.arc(pool.x + 5, pool.y - 5, pool.radius, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.arc(pool.x, pool.y, pool.radius * 0.9, 0, Math.PI*2); ctx.fill();
    
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(pool.x, pool.y, pool.radius, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1.0;
}

function drawPiece(ctx, p) {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    
    ctx.beginPath();
    ctx.moveTo(p.points[0].x, p.points[0].y);
    for (let i = 1; i < p.points.length; i++) ctx.lineTo(p.points[i].x, p.points[i].y);
    ctx.closePath();
    
    ctx.fillStyle = PALETTE[p.type][isDark ? 'dark' : 'light'];
    ctx.globalAlpha = 0.8;
    ctx.fill();
    
    if (p.type2) {
        ctx.fillStyle = PALETTE[p.type2][isDark ? 'dark' : 'light'];
        ctx.beginPath();
        ctx.moveTo(p.points[0].x * 0.5, p.points[0].y * 0.5);
        for (let i = 1; i < p.points.length; i++) ctx.lineTo(p.points[i].x * 0.5, p.points[i].y * 0.5);
        ctx.closePath();
        ctx.fill();
    }
    
    ctx.lineWidth = 2;
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.6)';
    ctx.stroke();
    
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.moveTo(p.points[0].x * 0.8, p.points[0].y * 0.8);
    for (let i = 1; i < p.points.length; i++) ctx.lineTo(p.points[i].x * 0.8, p.points[i].y * 0.8);
    ctx.closePath();
    ctx.stroke();
    
    ctx.restore();
}

function drawParticles(ctx, drawTextLayer) {
    for (let p of particles) {
        if ((p.type === 'text') !== drawTextLayer) continue;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = p.color;
        
        if (p.type === 'text') {
            ctx.font = 'bold 20px ui-monospace, "SFMono-Regular", Menlo, monospace';
            ctx.textAlign = 'center';
            ctx.fillText(p.text, p.x, p.y);
        } else if (p.type === 'ripple') {
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.stroke();
        } else if (p.type === 'splash') {
            ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
        } else if (p.type === 'wind') {
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx*0.05, p.y); ctx.stroke();
        }
        ctx.restore();
    }
}

function drawWave(ctx) {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const grad = ctx.createLinearGradient(0, waveY, 0, h);
    if (isDark) {
        grad.addColorStop(0, 'rgba(62, 132, 140, 0.8)');
        grad.addColorStop(1, 'rgba(62, 132, 140, 1)');
    } else {
        grad.addColorStop(0, 'rgba(107, 171, 178, 0.6)');
        grad.addColorStop(1, 'rgba(107, 171, 178, 0.9)');
    }
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, waveY);
    for (let x = 0; x <= w; x += 20) {
        let yOffset = Math.sin(x * 0.03 + performance.now() * 0.005) * 10;
        ctx.lineTo(x, waveY + yOffset);
    }
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fill();
    
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, waveY);
    for (let x = 0; x <= w; x += 20) {
        let yOffset = Math.sin(x * 0.03 + performance.now() * 0.005) * 10;
        ctx.lineTo(x, waveY + yOffset);
    }
    ctx.stroke();
}

function drawUI(ctx) {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    ctx.fillStyle = isDark ? '#ececec' : '#333333';
    ctx.font = 'bold 24px ui-monospace, "SFMono-Regular", Menlo, monospace';
    
    if (gameState === 'TITLE') {
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px ui-monospace, "SFMono-Regular", Menlo, monospace';
        ctx.fillText('Tide Sort', w/2, h/2 - 40);
        ctx.font = '16px ui-monospace, "SFMono-Regular", Menlo, monospace';
        ctx.fillText('Flick glass into matching pools.', w/2, h/2 + 10);
        ctx.fillText('Let the wave wash away decoys.', w/2, h/2 + 35);
        ctx.fillStyle = isDark ? '#3e848c' : '#6babb2';
        ctx.beginPath(); ctx.roundRect(w/2 - 80, h/2 + 80, 160, 50, 25); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px ui-monospace, "SFMono-Regular", Menlo, monospace';
        ctx.fillText('PLAY', w/2, h/2 + 112);
        return;
    }
    
    if (gameState === 'GAMEOVER') {
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px ui-monospace, "SFMono-Regular", Menlo, monospace';
        ctx.fillText('Wave Receded', w/2, h/2 - 40);
        ctx.font = '20px ui-monospace, "SFMono-Regular", Menlo, monospace';
        ctx.fillText(`Score: ${score}`, w/2, h/2 + 10);
        ctx.fillStyle = isDark ? '#3e848c' : '#6babb2';
        ctx.beginPath(); ctx.roundRect(w/2 - 90, h/2 + 60, 180, 50, 25); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px ui-monospace, "SFMono-Regular", Menlo, monospace';
        ctx.fillText('PLAY AGAIN', w/2, h/2 + 92);
        return;
    }
    
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 20, 40);
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.ceil(gameTime)}s`, w - 20, 40);
}

function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(now - lastTime, 50);
    lastTime = now;
    
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    ctx.fillStyle = isDark ? '#1c1e21' : '#f4f2ec';
    ctx.fillRect(0, 0, w, h);
    
    if (gameState === 'PLAYING') {
        gameTime -= dt / 1000;
        if (gameTime <= 0) {
            gameState = 'GAMEOVER';
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]);
        }
        updateWave(dt);
        updateEscalation(dt);
        
        for (let p of pieces) {
            if (!p.dragging) {
                p.x += p.vx;
                p.y += p.vy;
                p.angle += p.angularVel;
                p.vx *= 0.98;
                p.vy *= 0.98;
                p.angularVel *= 0.98;
            }
        }
        resolveCollisions();
        checkPools();
    }
    
    updateParticles(dt);
    
    for (let pool of pools) drawPool(ctx, pool);
    for (let p of pieces) if (!p.dragging) drawPiece(ctx, p);
    drawParticles(ctx, false);
    if (gameState === 'PLAYING') drawWave(ctx);
    for (let p of pieces) if (p.dragging) drawPiece(ctx, p);
    drawParticles(ctx, true);
    drawUI(ctx);
}
requestAnimationFrame(loop);
</script>
