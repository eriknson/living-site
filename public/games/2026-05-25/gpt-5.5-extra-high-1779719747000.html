<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Bloom</title>
<style>
:root{
  color-scheme:light dark;
  --bg0:#eef3ef;
  --bg1:#cad8d1;
  --ink:#17211e;
  --muted:#5e6e68;
  --panel:rgba(246,250,247,.76);
  --line:rgba(23,33,30,.18);
  --hot:#ff6b4a;
  --sun:#ffc857;
  --mint:#38d99a;
  --cyan:#48c7e8;
  --bad:#e5443f;
  --shadow:0 20px 70px rgba(20,35,30,.20);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg0:#07100f;
    --bg1:#15231f;
    --ink:#eef7ed;
    --muted:#91a59d;
    --panel:rgba(8,16,15,.70);
    --line:rgba(238,247,237,.16);
    --hot:#ff7a52;
    --sun:#ffd166;
    --mint:#49e0a5;
    --cyan:#54d4f2;
    --bad:#ff5a52;
    --shadow:0 24px 80px rgba(0,0,0,.42);
  }
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg0);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{position:fixed;inset:0}
#game{position:fixed;inset:0;width:100dvw;height:100dvh;touch-action:none;user-select:none;background:linear-gradient(180deg,var(--bg0),var(--bg1));display:block}
.ui{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 18px);display:flex;flex-direction:column;justify-content:space-between}
.hud{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.pill{min-width:86px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(14px);border-radius:999px;padding:10px 12px;text-align:center}
.value{display:block;font-size:22px;line-height:1.05;letter-spacing:0;color:var(--ink);margin-top:3px}
.hint{align-self:center;max-width:min(520px,calc(100dvw - 36px));border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(18px);border-radius:24px;padding:18px 18px 16px;text-align:center;transition:opacity .25s ease,transform .25s ease}
.hint.hidden{opacity:0;transform:translateY(12px);pointer-events:none}
.kicker{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{margin:0;font-size:clamp(38px,12vw,76px);line-height:.88;letter-spacing:-.07em}
p{margin:12px auto 0;max-width:34em;color:var(--muted);font-size:15px;line-height:1.45}
button{pointer-events:auto;margin-top:18px;border:0;border-radius:999px;min-height:48px;padding:0 22px;background:var(--ink);color:var(--bg0);font-weight:800;font-size:15px;letter-spacing:.02em;cursor:pointer;box-shadow:var(--shadow)}
button:active{transform:translateY(1px)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:clamp(34px,13vw,88px);font-weight:900;letter-spacing:-.08em;color:var(--ink);text-shadow:0 10px 40px rgba(0,0,0,.18);opacity:0;pointer-events:none}
.toast.show{animation:pop .34s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.78)}38%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}}
@media (max-width:520px){.ui{padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}.hud{font-size:10px}.pill{min-width:74px;padding:9px 10px}.value{font-size:19px}.hint{padding:16px 15px}p{font-size:14px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Stutter Bloom game"></canvas>
<div class="ui">
  <div class="hud" aria-live="polite">
    <div class="pill">Score<span id="score" class="value">0</span></div>
    <div class="pill">Combo<span id="combo" class="value">0</span></div>
    <div class="pill">Lives<span id="lives" class="value">3</span></div>
  </div>
  <section id="panel" class="hint">
    <div class="kicker">overcast spring / off-grid taps</div>
    <h1>Stutter Bloom</h1>
    <p>Tap when the real bloom snaps solid on the tiny hitch after the pulse. Skip the big ghost flashes.</p>
    <button id="start">Catch the Hitches</button>
  </section>
</div>
<div id="toast" class="toast">Perfect</div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false});
const $=id=>document.getElementById(id);
const scoreEl=$("score"),comboEl=$("combo"),livesEl=$("lives"),panel=$("panel"),startBtn=$("start"),toast=$("toast");
let W=1,H=1,DPR=1,last=0,state="title",audio=null;
let score=0,combo=0,lives=3,started=0,elapsed=0,round=52,nextCue=0,nextMissFlash=0,beat=0,bpm=94;
let cues=[],bursts=[],ripples=[],stems=[],shake=0,messageUntil=0,failLock=0,frame=0;
const colors=["#ff6b4a","#ffc857","#38d99a","#48c7e8","#ff9f1c"];
function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function resize(){
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  makeStems();
}
function makeStems(){
  stems=[];
  const n=Math.ceil(W/22);
  for(let i=0;i<n;i++)stems.push({x:i*22+Math.random()*18,y:H*.58+Math.random()*H*.34,h:70+Math.random()*180,s:Math.random()*6});
}
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function initAudio(){
  if(audio)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audio=new AC();
}
function beep(kind,pan=0){
  if(!audio)return;
  const t=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter(),stereo=audio.createStereoPanner?audio.createStereoPanner():null;
  osc.type=kind==="bad"?"sawtooth":"triangle";
  osc.frequency.setValueAtTime(kind==="good"?440+combo*9:kind==="miss"?155:92,t);
  osc.frequency.exponentialRampToValueAtTime(kind==="good"?760+combo*10:kind==="miss"?72:58,t+.12);
  filter.type="lowpass";filter.frequency.value=kind==="good"?2600:900;
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(kind==="good"?.055:.075,t+.01);
  gain.gain.exponentialRampToValueAtTime(.0001,t+(kind==="good"?.16:.22));
  osc.connect(filter);filter.connect(gain);
  if(stereo){stereo.pan.value=pan;gain.connect(stereo);stereo.connect(audio.destination)}else gain.connect(audio.destination);
  osc.start(t);osc.stop(t+.24);
}
function startGame(){
  initAudio();
  if(audio&&audio.state==="suspended")audio.resume();
  state="play";score=0;combo=0;lives=3;elapsed=0;started=performance.now()/1000;
  cues=[];bursts=[];ripples=[];beat=0;nextCue=.85;shake=0;failLock=0;messageUntil=0;
  updateHud();
  panel.classList.add("hidden");
}
function endGame(won){
  state="over";
  panel.classList.remove("hidden");
  const grade=score>3800?"radiant":score>2200?"warm":score>900?"alive":"fog-soft";
  panel.innerHTML='<div class="kicker">'+(won?"garden warmed":"rhythm frayed")+'</div><h1>'+score+'</h1><p>'+grade+' run. You caught '+Math.max(0,score/100|0)+' off-beat blossoms before the fog folded in.</p><button id="again">Play Again</button>';
  document.getElementById("again").addEventListener("click",startGame,{passive:true});
}
function updateHud(){
  scoreEl.textContent=score;
  comboEl.textContent=combo;
  livesEl.textContent=lives;
}
function showWord(txt){
  toast.textContent=txt;
  toast.classList.remove("show");
  void toast.offsetWidth;
  toast.classList.add("show");
}
function spawnCue(t){
  const p=elapsed/round,lead=rnd(.92,.72)-p*.22;
  const lane=Math.floor(rnd(0,3));
  const x=W*(.24+lane*.26)+rnd(-22,22);
  const y=rnd(H*.30,H*.64);
  const target=t+lead;
  cues.push({x,y,target,born:t,lead,hit:false,c:colors[Math.floor(rnd(0,colors.length))],seed:Math.random()*9,ghosts:p>.35?1+(p>.68?1:0):0});
  nextCue=t+rnd(.92,.68)-p*.32;
  if(p>.72&&Math.random()<.35)nextCue-=.28;
}
function hitInput(){
  if(state==="title"){startGame();return}
  if(state!=="play")return;
  const now=elapsed,progress=elapsed/round,win=.17-progress*.065;
  let best=null,bd=99;
  for(const c of cues){
    const d=Math.abs(now-c.target);
    if(!c.hit&&d<bd){bd=d;best=c}
  }
  if(best&&bd<win){
    best.hit=true;
    const acc=1-bd/win;
    combo++;
    score+=Math.round(70+combo*8+acc*80);
    burst(best.x,best.y,best.c,18+Math.min(combo,18));
    ripples.push({x:best.x,y:best.y,t:0,c:best.c,good:true});
    beep("good",(best.x/W)*2-1);
    navigator.vibrate?.(combo%8===0?[18,24,18]:12);
    showWord(acc>.78?"Perfect":acc>.48?"Clean":"Late");
    cues=cues.filter(c=>c!==best);
    updateHud();
  }else if(now>failLock){
    failLock=now+.22;
    punish("False");
  }
}
function punish(word){
  combo=0;lives--;shake=.28;messageUntil=elapsed+.45;
  beep("bad");navigator.vibrate?.([30,24,30]);showWord(word);
  ripples.push({x:W*.5+rnd(-40,40),y:H*.5+rnd(-30,30),t:0,c:css("--bad"),good:false});
  updateHud();
  if(lives<=0)endGame(false);
}
function burst(x,y,c,n){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2),v=rnd(70,210);
    bursts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-rnd(20,80),r:rnd(2,5),life:rnd(.45,.9),t:0,c});
  }
}
function update(dt){
  frame++;
  if(state==="play"){
    elapsed=(performance.now()/1000)-started;
    const p=elapsed/round;
    bpm=94+p*42+Math.sin(elapsed*.9)*3;
    const old=beat;
    beat=(beat+dt*bpm/60)%1;
    if(beat<old){
      ripples.push({x:W*.5,y:H*.80,t:0,c:css("--line"),good:false,pulse:true});
      if(p>.45&&Math.random()<.5)fakeBurst();
    }
    if(elapsed>nextCue)spawnCue(elapsed);
    for(let i=cues.length-1;i>=0;i--){
      const c=cues[i];
      if(elapsed>c.target+(.25-p*.07)){
        cues.splice(i,1);
        if(elapsed>nextMissFlash){nextMissFlash=elapsed+.25;punish("Miss")}
      }
    }
    if(elapsed>=round)endGame(true);
  }else{
    beat=(beat+dt*.65)%1;
  }
  shake=Math.max(0,shake-dt);
  bursts=bursts.filter(b=>(b.t+=dt)<b.life);
  for(const b of bursts){b.vy+=340*dt;b.x+=b.vx*dt;b.y+=b.vy*dt}
  ripples=ripples.filter(r=>(r.t+=dt)<1);
}
function fakeBurst(){
  const x=rnd(W*.16,W*.84),y=rnd(H*.24,H*.68);
  ripples.push({x,y,t:0,c:"rgba(255,255,255,.6)",good:false,decoy:true});
}
function draw(){
  const bg0=css("--bg0"),bg1=css("--bg1"),ink=css("--ink"),muted=css("--muted");
  const ox=shake?rnd(-8,8)*shake*5:0,oy=shake?rnd(-6,6)*shake*5:0;
  ctx.save();ctx.translate(ox,oy);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,bg0);g.addColorStop(.62,bg1);g.addColorStop(1,bg0);
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  drawWash();
  drawBeatBar();
  for(const s of stems)drawStem(s);
  drawGhosts();
  for(const c of cues)drawCue(c);
  drawRipples();
  drawBursts();
  if(state==="play")drawTimer();
  if(state!=="play")drawIdlePetals(ink,muted);
  ctx.restore();
}
function drawWash(){
  ctx.save();ctx.globalAlpha=.10;
  for(let i=0;i<9;i++){
    const x=(i*97+frame*.13)%(W+220)-110,y=H*(.16+i*.085),r=W*.34;
    const grd=ctx.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,i%2?css("--cyan"):css("--mint"));
    grd.addColorStop(1,"transparent");
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawStem(s){
  const wind=Math.sin(elapsed*1.2+s.s)*8;
  ctx.save();
  ctx.strokeStyle=css("--muted");ctx.globalAlpha=.22;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(s.x,s.y);
  ctx.bezierCurveTo(s.x+wind,s.y-s.h*.32,s.x-wind*.7,s.y-s.h*.72,s.x+wind*.35,s.y-s.h);
  ctx.stroke();
  ctx.restore();
}
function petal(x,y,r,a,c,alpha){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.globalAlpha=alpha;ctx.fillStyle=c;
  ctx.beginPath();ctx.ellipse(0,-r*.72,r*.32,r*.88,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function bloom(x,y,r,c,solid,spin=0){
  const alpha=solid?1:.30;
  ctx.save();
  ctx.shadowColor=c;ctx.shadowBlur=solid?28:8;
  for(let i=0;i<7;i++)petal(x,y,r,spin+i*Math.PI*2/7,c,alpha);
  ctx.shadowBlur=0;ctx.fillStyle=solid?css("--sun"):c;ctx.globalAlpha=solid?1:.45;
  ctx.beginPath();ctx.arc(x,y,r*.28,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawCue(c){
  const now=elapsed,age=clamp((now-c.born)/c.lead,0,1),d=now-c.target,solid=Math.abs(d)<(.12-elapsed/round*.035);
  const r=22+Math.sin((now+c.seed)*7)*2,ring=90*(1-age)+24;
  ctx.save();
  ctx.globalAlpha=.26;ctx.strokeStyle=css("--muted");ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(c.x,c.y+r*2);ctx.bezierCurveTo(c.x-18,c.y+80,c.x+10,c.y+130,c.x,c.y+220);ctx.stroke();
  for(let i=0;i<c.ghosts;i++){
    bloom(c.x+rnd(-42,42),c.y+rnd(-26,30),r*.86,css("--muted"),false,c.seed+i);
  }
  ctx.globalAlpha=.9;ctx.strokeStyle=c;ctx.lineWidth=solid?5:2;
  ctx.setLineDash(solid?[]:[5,10]);
  ctx.beginPath();ctx.arc(c.x,c.y,ring,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  bloom(c.x,c.y,r,c,solid,c.seed+now*(solid?2:.45));
  if(solid){
    ctx.globalAlpha=.92;ctx.fillStyle=css("--ink");ctx.font="700 12px ui-monospace, Menlo, monospace";ctx.textAlign="center";
    ctx.fillText("TAP",c.x,c.y-r-36);
  }
  ctx.restore();
}
function drawGhosts(){
  const flash=Math.max(0,1-beat*8);
  if(flash<=0)return;
  ctx.save();ctx.globalAlpha=flash*.42;
  const n=state==="play"?3:5;
  for(let i=0;i<n;i++){
    const x=W*(.18+i/(Math.max(1,n-1))*.64),y=H*(.30+.10*Math.sin(i+elapsed));
    bloom(x,y,18+flash*7,css("--muted"),true,elapsed+i);
    ctx.strokeStyle=css("--bad");ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,34+flash*20,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}
function drawBeatBar(){
  const x=W*.14,y=H*.82,w=W*.72;
  ctx.save();
  ctx.globalAlpha=.82;ctx.strokeStyle=css("--line");ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();
  for(let i=0;i<5;i++){
    const bx=x+w*i/4;
    ctx.fillStyle=i===0?css("--bad"):css("--muted");ctx.globalAlpha=i===0?.55:.32;
    ctx.beginPath();ctx.arc(bx,y,5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.fillStyle=css("--hot");
  ctx.beginPath();ctx.arc(x+w*beat,y,8+Math.sin(elapsed*18)*1.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawRipples(){
  for(const r of ripples){
    const e=ease(r.t),rad=(r.pulse?W*.34:120)*e+8;
    ctx.save();ctx.globalAlpha=(1-r.t)*(r.good?.62:.38);ctx.strokeStyle=r.c;ctx.lineWidth=r.good?4:2;
    ctx.beginPath();ctx.arc(r.x,r.y,rad,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
}
function drawBursts(){
  for(const b of bursts){
    ctx.save();ctx.globalAlpha=1-b.t/b.life;ctx.fillStyle=b.c;ctx.translate(b.x,b.y);ctx.rotate(b.t*7);
    ctx.beginPath();ctx.ellipse(0,0,b.r,b.r*2.4,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}
function drawTimer(){
  const p=clamp(elapsed/round,0,1),x=18,y=H-18,w=W-36;
  ctx.save();ctx.globalAlpha=.86;ctx.fillStyle=css("--line");ctx.fillRect(x,y,w,3);
  ctx.fillStyle=css("--sun");ctx.fillRect(x,y,w*(1-p),3);ctx.restore();
}
function drawIdlePetals(ink,muted){
  ctx.save();ctx.globalAlpha=.12;
  for(let i=0;i<26;i++){
    const x=(i*83+Math.sin(frame*.01+i)*42)%W,y=(i*131+frame*.18)%(H+90)-45;
    petal(x,y,12+Math.sin(i)*4,i+frame*.006,i%3?muted:ink,.8);
  }
  ctx.restore();
}
function loop(t){
  t/=1000;const dt=Math.min(.033,t-last||.016);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();hitInput()},{passive:false});
startBtn.addEventListener("click",startGame,{passive:true});
window.addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="Enter"){e.preventDefault();hitInput()}
  if(e.code==="KeyR"&&state==="over")startGame();
});
window.addEventListener("resize",resize,{passive:true});
resize();updateHud();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
