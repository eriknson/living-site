<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1018" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f1ece1" media="(prefers-color-scheme: light)">
<title>Fog Courier</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f1ece1;
    --bg-2: #e7dfc9;
    --bg-3: #d8cfb5;
    --ink: #14181d;
    --ink-2: #5e6266;
    --ink-3: #a8a395;
    --ink-4: #c9c2af;
    --accent: #b34c0a;
    --accent-2: #d97706;
    --accent-3: #f59e0b;
    --danger: #b91c1c;
    --danger-2: #dc2626;
    --grid: rgba(20, 24, 29, 0.05);
    --courier: #14181d;
    --trail-r: 179; --trail-g: 76; --trail-b: 10;
    --shadow: rgba(20, 24, 29, 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1018;
      --bg-2: #0f1724;
      --bg-3: #14202f;
      --ink: #ebeff5;
      --ink-2: #8a93a3;
      --ink-3: #485263;
      --ink-4: #2a3343;
      --accent: #f59e0b;
      --accent-2: #fbbf24;
      --accent-3: #fde68a;
      --danger: #ef4444;
      --danger-2: #f87171;
      --grid: rgba(235, 239, 245, 0.06);
      --courier: #ebeff5;
      --trail-r: 251; --trail-g: 191; --trail-b: 36;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: none;
    text-rendering: geometricPrecision;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    position: fixed;
    inset: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    padding:
      max(env(safe-area-inset-top), 14px)
      max(env(safe-area-inset-right), 14px)
      max(env(safe-area-inset-bottom), 18px)
      max(env(safe-area-inset-left), 14px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 10;
    gap: 12px;
  }
  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .pill {
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
    color: var(--ink-2);
    font-size: 10px;
    letter-spacing: 0.2em;
    padding: 9px 14px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    font-weight: 500;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .pill .value {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }
  .pill.warn .value {
    color: var(--danger);
    animation: tick 0.6s ease-in-out infinite;
  }
  .pill.combo {
    background: color-mix(in srgb, var(--accent-2) 22%, var(--bg));
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--accent);
    animation: pop 0.25s cubic-bezier(.2,1.6,.4,1);
  }
  .pill.combo .value { color: var(--accent); }
  @keyframes tick {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: blur(22px);
    backdrop-filter: blur(22px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px;
    z-index: 20;
    pointer-events: auto;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .overlay.hidden {
    opacity: 0;
    transform: scale(0.99);
    pointer-events: none;
  }
  .overlay .eyebrow {
    font-size: 10px;
    letter-spacing: 0.36em;
    color: var(--ink-2);
    text-transform: uppercase;
    font-weight: 500;
    text-align: center;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .overlay .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.5; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  .overlay h1 {
    font-size: clamp(54px, 16vw, 96px);
    font-weight: 700;
    line-height: 0.88;
    letter-spacing: -0.05em;
    text-align: center;
  }
  .overlay h1 .accent { color: var(--accent); }
  .overlay h2 {
    font-size: clamp(72px, 22vw, 132px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .overlay p {
    font-size: 13px;
    color: var(--ink-2);
    text-align: center;
    line-height: 1.65;
    max-width: 300px;
    font-weight: 400;
  }
  .btn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    padding: 18px 36px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    border-radius: 999px;
    min-height: 56px;
    min-width: 220px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    margin-top: 6px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .btn:active { transform: scale(0.96); }
  .btn:hover { box-shadow: 0 6px 22px var(--shadow); }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 320px;
  }
  .cell {
    background: color-mix(in srgb, var(--ink) 4%, var(--bg));
    border: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
    padding: 16px 12px;
    border-radius: 14px;
    text-align: center;
  }
  .cell .label {
    font-size: 9px;
    color: var(--ink-2);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .cell .num {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .hint {
    display: flex;
    gap: 22px;
    margin-top: 4px;
  }
  .hint .kbd {
    font-size: 9px;
    letter-spacing: 0.24em;
    color: var(--ink-3);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hint .kbd::before {
    content: '';
    width: 18px;
    height: 1px;
    background: var(--ink-3);
  }
  .corner {
    position: absolute;
    bottom: max(env(safe-area-inset-bottom), 18px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    font-size: 9px;
    letter-spacing: 0.34em;
    color: var(--ink-3);
    text-transform: uppercase;
    pointer-events: none;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud-row">
      <div class="pill" id="hudTimePill"><span>Time</span><span class="value" id="hudTime">45</span></div>
      <div class="pill"><span>Score</span><span class="value" id="hudScore">0</span></div>
    </div>
    <div class="hud-row" style="justify-content: center;">
      <div class="pill combo" id="hudCombo" hidden><span>Combo</span><span class="value" id="hudComboVal">x2</span></div>
    </div>
  </div>

  <div class="overlay" id="titleScreen">
    <div class="eyebrow"><span class="dot"></span>San Francisco · Summer Fog</div>
    <h1>Fog<br><span class="accent">Courier</span></h1>
    <p>Drag your finger to guide the courier through the mist. Gather lanterns. Avoid the drifting phantoms before the fog rolls in.</p>
    <button class="btn" id="startBtn">Begin Route</button>
    <div class="hint">
      <span class="kbd">Touch · Drag</span>
      <span class="kbd">Keys · WASD</span>
    </div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="eyebrow"><span class="dot"></span>Route Complete</div>
    <h2 id="finalScore">0</h2>
    <div class="score-grid">
      <div class="cell"><div class="label">Lanterns</div><div class="num" id="finalLanterns">0</div></div>
      <div class="cell"><div class="label">Best Combo</div><div class="num" id="finalCombo">x1</div></div>
    </div>
    <button class="btn" id="restartBtn">Run Again</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ============================================================
  // CANVAS
  // ============================================================
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgDirty = true;
    if (state === STATE_TITLE) placeCourierIdle();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  // ============================================================
  // THEME
  // ============================================================
  function getTheme() {
    const cs = getComputedStyle(document.documentElement);
    const g = (n) => cs.getPropertyValue(n).trim();
    return {
      bg: g('--bg'),
      bg2: g('--bg-2'),
      bg3: g('--bg-3'),
      ink: g('--ink'),
      ink2: g('--ink-2'),
      ink3: g('--ink-3'),
      ink4: g('--ink-4'),
      accent: g('--accent'),
      accent2: g('--accent-2'),
      accent3: g('--accent-3'),
      danger: g('--danger'),
      danger2: g('--danger-2'),
      courier: g('--courier'),
      trail: { r: +g('--trail-r'), g: +g('--trail-g'), b: +g('--trail-b') },
      isDark: window.matchMedia('(prefers-color-scheme: dark)').matches
    };
  }
  let theme = getTheme();
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener?.('change', () => { theme = getTheme(); bgDirty = true; });

  // ============================================================
  // BACKGROUND CACHE (topographic map)
  // ============================================================
  let bgCanvas = null, bgCtx = null, bgDirty = true;
  let bgSeed = Math.random() * 1000;

  function rebuildBg() {
    if (!bgCanvas) bgCanvas = document.createElement('canvas');
    bgCanvas.width = Math.max(1, Math.floor(W * DPR));
    bgCanvas.height = Math.max(1, Math.floor(H * DPR));
    bgCtx = bgCanvas.getContext('2d');
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const c = bgCtx;

    // base flat
    c.fillStyle = theme.bg;
    c.fillRect(0, 0, W, H);

    // subtle radial wash
    const wg = c.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.85);
    wg.addColorStop(0, theme.bg2);
    wg.addColorStop(1, theme.bg);
    c.fillStyle = wg;
    c.fillRect(0, 0, W, H);

    // grid (very faint, swiss)
    c.strokeStyle = theme.isDark ? 'rgba(235,239,245,0.04)' : 'rgba(20,24,29,0.05)';
    c.lineWidth = 1;
    const gridSize = 48;
    c.beginPath();
    for (let x = gridSize; x < W; x += gridSize) {
      c.moveTo(x + 0.5, 0); c.lineTo(x + 0.5, H);
    }
    for (let y = gridSize; y < H; y += gridSize) {
      c.moveTo(0, y + 0.5); c.lineTo(W, y + 0.5);
    }
    c.stroke();

    // topographic contour lines
    const nLines = 14;
    const cx1 = W * (0.32 + (Math.sin(bgSeed) + 1) * 0.08);
    const cy1 = H * (0.36 + (Math.cos(bgSeed * 1.3) + 1) * 0.10);
    const cx2 = W * (0.70 + (Math.sin(bgSeed * 0.7) + 1) * 0.05);
    const cy2 = H * (0.66 + (Math.cos(bgSeed * 0.9) + 1) * 0.06);

    for (let pass = 0; pass < 2; pass++) {
      const px = pass === 0 ? cx1 : cx2;
      const py = pass === 0 ? cy1 : cy2;
      const dir = pass === 0 ? 1 : -1;
      for (let i = 0; i < nLines; i++) {
        const t = i / nLines;
        c.globalAlpha = (0.08 + (1 - t) * 0.16);
        c.strokeStyle = theme.ink3;
        c.lineWidth = 1;
        c.beginPath();
        const baseR = 40 + i * 42;
        const wob = 14 + i * 3;
        for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.05) {
          const w = wob * (0.6 + 0.4 * Math.sin(a * 3 + i * 0.7 + bgSeed * dir));
          const r = baseR + Math.sin(a * 3 + i * 0.6 + bgSeed * dir) * w
                          + Math.cos(a * 5 + i * 1.4 + bgSeed * dir * 0.7) * w * 0.45;
          const x = px + Math.cos(a) * r;
          const y = py + Math.sin(a) * r * (0.78 + pass * 0.06);
          if (a === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.closePath();
        c.stroke();
      }
    }
    c.globalAlpha = 1;

    // sprinkled landmarks (dots)
    c.fillStyle = theme.ink3;
    for (let i = 0; i < 22; i++) {
      const x = (Math.sin(bgSeed * (i + 1) * 1.7) + 1) * 0.5 * W;
      const y = (Math.cos(bgSeed * (i + 1) * 2.1) + 1) * 0.5 * H;
      c.globalAlpha = 0.18 + Math.random() * 0.18;
      c.beginPath();
      c.arc(x, y, 1.4, 0, Math.PI * 2);
      c.fill();
    }
    c.globalAlpha = 1;

    // compass rose (top-right area)
    const crx = W - 50;
    const cry = 80;
    c.strokeStyle = theme.ink3;
    c.lineWidth = 1;
    c.globalAlpha = 0.5;
    c.beginPath();
    c.arc(crx, cry, 18, 0, Math.PI * 2);
    c.stroke();
    c.beginPath();
    c.moveTo(crx - 22, cry); c.lineTo(crx + 22, cry);
    c.moveTo(crx, cry - 22); c.lineTo(crx, cry + 22);
    c.stroke();
    c.fillStyle = theme.ink2;
    c.font = '8px ui-monospace, monospace';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('N', crx, cry - 28);
    c.globalAlpha = 1;

    // map title (subtle)
    c.fillStyle = theme.ink3;
    c.globalAlpha = 0.45;
    c.font = '9px ui-monospace, monospace';
    c.textAlign = 'left';
    c.textBaseline = 'top';
    c.fillText('SHEET 37.77 N · 122.41 W', 16, H - 30);
    c.fillText('FOG ATLAS · JUN 2026', 16, H - 18);
    c.globalAlpha = 1;

    bgDirty = false;
  }

  // ============================================================
  // GAME STATE
  // ============================================================
  const STATE_TITLE = 0, STATE_PLAYING = 1, STATE_GAMEOVER = 2;
  let state = STATE_TITLE;

  const COURIER_R = 9;
  const COURIER_MAX_SPEED = 540;
  const ROUND_TIME = 45;

  const courier = { x: 0, y: 0, vx: 0, vy: 0, ang: 0 };
  const finger = { x: 0, y: 0, down: false, has: false };
  let trail = [];
  let lanterns = [];
  let hazards = [];
  let particles = [];
  let mistDust = [];
  let floats = [];
  let warnings = []; // hazard spawn warnings
  let ripples = [];

  let timeLeft = ROUND_TIME;
  let score = 0;
  let combo = 1;
  let comboTimer = 0;
  let bestCombo = 1;
  let lanternsCollected = 0;
  let hazardSpawnTimer = 0;
  let elapsedTime = 0;
  let hitImmune = 0;
  let shake = 0;
  let flash = 0;
  let hitPause = 0;
  let lastTime = 0;
  let lastTickTime = 999;
  let idleAngle = 0;

  let touchDown = false;
  let kbActive = false;
  const keys = Object.create(null);

  // ============================================================
  // UTILS
  // ============================================================
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const choose = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const dist2 = (x1, y1, x2, y2) => {
    const dx = x1 - x2, dy = y1 - y2;
    return dx * dx + dy * dy;
  };
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

  function trailColor(alpha) {
    return `rgba(${theme.trail.r}, ${theme.trail.g}, ${theme.trail.b}, ${alpha})`;
  }
  function dangerRGBA(alpha) {
    // pull from theme.danger which is hex
    const h = theme.danger.replace('#', '');
    const r = parseInt(h.substring(0,2), 16);
    const g = parseInt(h.substring(2,4), 16);
    const b = parseInt(h.substring(4,6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  function accentRGBA(alpha) {
    const h = theme.accent2.replace('#', '');
    const r = parseInt(h.substring(0,2), 16);
    const g = parseInt(h.substring(2,4), 16);
    const b = parseInt(h.substring(4,6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ============================================================
  // AUDIO (Web Audio)
  // ============================================================
  let audioCtx = null;
  let masterGain = null;
  let ambientGain = null;
  let ambientStarted = false;

  function initAudio() {
    if (audioCtx) return;
    try {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return;
      audioCtx = new A();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.25;
      masterGain.connect(audioCtx.destination);
    } catch (e) {}
  }

  function startAmbient() {
    if (!audioCtx || ambientStarted) return;
    ambientStarted = true;
    try {
      const o1 = audioCtx.createOscillator();
      const o2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 600;
      o1.type = 'sine'; o1.frequency.value = 110;
      o2.type = 'sine'; o2.frequency.value = 165;
      g.gain.value = 0.06;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(masterGain);
      o1.start(); o2.start();
      ambientGain = g;
    } catch (e) {}
  }

  function beep(freq, dur, type = 'sine', vol = 0.4) {
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }

  function chord(freqs, dur, type = 'triangle', vol = 0.3) {
    freqs.forEach((f, i) => beep(f, dur, type, vol * (1 - i * 0.18)));
  }

  function noiseHit(dur = 0.3, vol = 0.4) {
    if (!audioCtx) return;
    try {
      const sr = audioCtx.sampleRate;
      const len = Math.floor(sr * dur);
      const buf = audioCtx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      }
      const src = audioCtx.createBufferSource();
      const f = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      f.type = 'lowpass'; f.frequency.value = 700;
      g.gain.value = vol;
      src.buffer = buf;
      src.connect(f); f.connect(g); g.connect(masterGain);
      src.start();
    } catch (e) {}
  }

  function tick() {
    beep(800, 0.05, 'square', 0.2);
  }

  function vibrate(p) {
    try { navigator.vibrate?.(p); } catch (e) {}
  }

  // ============================================================
  // ENTITY SPAWNING
  // ============================================================
  function safePos(minDistCourier, minDistHazard = 50) {
    for (let tries = 0; tries < 40; tries++) {
      const x = rand(60, W - 60);
      const y = rand(80, H - 90);
      if (dist2(x, y, courier.x, courier.y) < minDistCourier * minDistCourier) continue;
      let ok = true;
      for (const h of hazards) {
        const d = (h.r || 30) + minDistHazard;
        if (dist2(x, y, h.x, h.y) < d * d) { ok = false; break; }
      }
      if (!ok) continue;
      for (const l of lanterns) {
        if (dist2(x, y, l.x, l.y) < 60 * 60) { ok = false; break; }
      }
      if (ok) return { x, y };
    }
    return { x: rand(60, W - 60), y: rand(80, H - 90) };
  }

  function spawnLantern() {
    const p = safePos(140, 40);
    lanterns.push({
      x: p.x, y: p.y, r: 11,
      pulse: Math.random() * TAU,
      born: 0
    });
  }

  function spawnHazard(type) {
    const side = Math.floor(rand(0, 4));
    let x, y;
    if (side === 0) { x = -40; y = rand(40, H - 40); }
    else if (side === 1) { x = W + 40; y = rand(40, H - 40); }
    else if (side === 2) { x = rand(40, W - 40); y = -40; }
    else { x = rand(40, W - 40); y = H + 40; }

    const tx = rand(W * 0.25, W * 0.75);
    const ty = rand(H * 0.25, H * 0.75);
    const ang = Math.atan2(ty - y, tx - x) + rand(-0.4, 0.4);
    const speed = type === 'stalker' ? rand(45, 75) : rand(40, 85);
    const r = type === 'pulser' ? rand(26, 34) : rand(28, 44);

    hazards.push({
      x, y, r, pulseR: r,
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed,
      type: type || 'drift',
      phase: Math.random() * TAU,
      born: 0,
      warn: 0.3
    });
    // warning marker
    warnings.push({ x: clamp(x, 30, W - 30), y: clamp(y, 30, H - 30), t: 0, maxT: 0.6 });
  }

  function spawnParticle(x, y, color, count, sMin = 80, sMax = 260) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      const s = rand(sMin, sMax);
      particles.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rand(0.45, 0.95), maxLife: 0.95,
        r: rand(1.5, 3.5),
        color
      });
    }
  }

  function spawnFloat(x, y, text, color) {
    floats.push({ x, y, text, color, life: 1.1, maxLife: 1.1, vy: -42 });
  }

  function spawnRipple(x, y, color, maxR) {
    ripples.push({ x, y, r: 0, maxR, life: 0.6, maxLife: 0.6, color });
  }

  function initMist() {
    mistDust = [];
    const count = Math.min(40, Math.floor(W * H / 22000));
    for (let i = 0; i < count; i++) {
      mistDust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: rand(-12, 12),
        vy: rand(-6, 6),
        r: rand(0.8, 2.4),
        a: rand(0.06, 0.2),
        phase: Math.random() * TAU
      });
    }
  }

  // ============================================================
  // GAME FLOW
  // ============================================================
  function placeCourierIdle() {
    courier.x = W * 0.5;
    courier.y = H * 0.5;
    courier.vx = 0; courier.vy = 0;
  }

  function resetGame() {
    courier.x = W * 0.5;
    courier.y = H * 0.5;
    courier.vx = 0; courier.vy = 0; courier.ang = 0;
    trail = [];
    lanterns = [];
    hazards = [];
    particles = [];
    floats = [];
    warnings = [];
    ripples = [];
    timeLeft = ROUND_TIME;
    score = 0;
    combo = 1;
    comboTimer = 0;
    bestCombo = 1;
    lanternsCollected = 0;
    hazardSpawnTimer = 3.5;
    elapsedTime = 0;
    hitImmune = 0.6; // grace at start
    shake = 0; flash = 0; hitPause = 0;
    lastTickTime = 999;
    bgSeed = Math.random() * 1000;
    bgDirty = true;

    for (let i = 0; i < 3; i++) spawnLantern();
    spawnHazard('drift');
  }

  function startGame() {
    initAudio();
    if (audioCtx?.state === 'suspended') audioCtx.resume();
    startAmbient();
    resetGame();
    state = STATE_PLAYING;
    document.getElementById('titleScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
    document.getElementById('hud').hidden = false;
    document.getElementById('hudCombo').hidden = true;
    chord([440, 660, 880], 0.18, 'triangle', 0.3);
    vibrate(15);
  }

  function endGame() {
    state = STATE_GAMEOVER;
    document.getElementById('finalScore').textContent = score.toLocaleString();
    document.getElementById('finalLanterns').textContent = lanternsCollected;
    document.getElementById('finalCombo').textContent = 'x' + bestCombo;
    document.getElementById('overScreen').classList.remove('hidden');
    document.getElementById('hud').hidden = true;
    chord([523, 392, 261], 0.5, 'sine', 0.25);
    vibrate([20, 40, 20, 40]);
  }

  // ============================================================
  // INPUT
  // ============================================================
  function getPos(e) {
    if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function onDown(e) {
    e.preventDefault();
    const p = getPos(e);
    finger.x = p.x; finger.y = p.y;
    finger.down = true; finger.has = true;
    touchDown = true;
    if (state === STATE_PLAYING) {
      spawnRipple(p.x, p.y, trailColor(0.4), 32);
    }
  }
  function onMove(e) {
    if (!touchDown) return;
    e.preventDefault();
    const p = getPos(e);
    finger.x = p.x; finger.y = p.y;
  }
  function onUp(e) {
    if (e) e.preventDefault();
    touchDown = false;
    finger.down = kbActive;
  }

  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });
  canvas.addEventListener('touchcancel', onUp, { passive: false });
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', (e) => { if (touchDown) onMove(e); });
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === STATE_TITLE) { startGame(); return; }
      if (state === STATE_GAMEOVER) { startGame(); return; }
    }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
  });
  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  // ============================================================
  // UPDATE
  // ============================================================
  function updateInput() {
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA) kx -= 1;
    if (keys.ArrowRight || keys.KeyD) kx += 1;
    if (keys.ArrowUp || keys.KeyW) ky -= 1;
    if (keys.ArrowDown || keys.KeyS) ky += 1;
    kbActive = (kx !== 0 || ky !== 0);
    if (kbActive && !touchDown) {
      const len = Math.hypot(kx, ky);
      finger.x = courier.x + (kx / len) * 220;
      finger.y = courier.y + (ky / len) * 220;
      finger.has = true;
      finger.down = true;
    } else if (!touchDown && !kbActive) {
      finger.down = false;
    }
  }

  function update(dt) {
    elapsedTime += dt;

    // Hit pause
    if (hitPause > 0) {
      hitPause -= dt;
      return;
    }

    // Mist drift always
    for (const m of mistDust) {
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.phase += dt * 0.5;
      if (m.x < -20) m.x = W + 20;
      else if (m.x > W + 20) m.x = -20;
      if (m.y < -20) m.y = H + 20;
      else if (m.y > H + 20) m.y = -20;
    }

    if (state !== STATE_PLAYING) return;

    // Time
    timeLeft -= dt;
    if (timeLeft <= 10 && lastTickTime - timeLeft >= 1.0) {
      tick();
      lastTickTime = timeLeft;
    }
    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame();
      return;
    }

    // Courier toward finger
    if (finger.down && finger.has) {
      const dx = finger.x - courier.x;
      const dy = finger.y - courier.y;
      const tx = dx * 9;
      const ty = dy * 9;
      const blend = 1 - Math.exp(-12 * dt);
      courier.vx += (tx - courier.vx) * blend;
      courier.vy += (ty - courier.vy) * blend;
      const sp = Math.hypot(courier.vx, courier.vy);
      if (sp > COURIER_MAX_SPEED) {
        courier.vx = (courier.vx / sp) * COURIER_MAX_SPEED;
        courier.vy = (courier.vy / sp) * COURIER_MAX_SPEED;
      }
    } else {
      const k = Math.exp(-3.5 * dt);
      courier.vx *= k; courier.vy *= k;
    }

    courier.x += courier.vx * dt;
    courier.y += courier.vy * dt;

    // bounds with soft bounce
    if (courier.x < 18) { courier.x = 18; courier.vx = Math.max(0, courier.vx) * 0.3; }
    if (courier.x > W - 18) { courier.x = W - 18; courier.vx = Math.min(0, courier.vx) * 0.3; }
    if (courier.y < 18) { courier.y = 18; courier.vy = Math.max(0, courier.vy) * 0.3; }
    if (courier.y > H - 18) { courier.y = H - 18; courier.vy = Math.min(0, courier.vy) * 0.3; }

    // facing
    const spNow = Math.hypot(courier.vx, courier.vy);
    if (spNow > 30) {
      const ta = Math.atan2(courier.vy, courier.vx);
      const da = Math.atan2(Math.sin(ta - courier.ang), Math.cos(ta - courier.ang));
      courier.ang += da * Math.min(1, dt * 12);
    }

    // Trail
    const last = trail[trail.length - 1];
    const ddx = courier.x - (last ? last.x : courier.x);
    const ddy = courier.y - (last ? last.y : courier.y);
    if (!last || (ddx * ddx + ddy * ddy) > 9) {
      trail.push({ x: courier.x, y: courier.y, t: 0 });
    }
    for (let i = 0; i < trail.length; i++) trail[i].t += dt;
    while (trail.length > 0 && trail[0].t > 1.0) trail.shift();
    if (trail.length > 90) trail.splice(0, trail.length - 90);

    // Combo timer
    comboTimer -= dt;
    if (comboTimer <= 0 && combo > 1) {
      combo = 1;
      document.getElementById('hudCombo').hidden = true;
    }

    // Immunity & polish
    if (hitImmune > 0) hitImmune -= dt;
    shake = Math.max(0, shake - dt * 90);
    flash = Math.max(0, flash - dt * 2.5);

    // Warnings tick
    for (let i = warnings.length - 1; i >= 0; i--) {
      const w = warnings[i];
      w.t += dt;
      if (w.t > w.maxT) warnings.splice(i, 1);
    }

    // Ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= dt;
      r.r = (1 - r.life / r.maxLife) * r.maxR;
      if (r.life <= 0) ripples.splice(i, 1);
    }

    // Lanterns: pulse, collect
    for (let i = lanterns.length - 1; i >= 0; i--) {
      const l = lanterns[i];
      l.pulse += dt * 3;
      l.born += dt;
      const cr = l.r + COURIER_R + 4;
      if (dist2(courier.x, courier.y, l.x, l.y) < cr * cr) {
        lanternsCollected += 1;
        if (comboTimer > 0) combo = Math.min(combo + 1, 9);
        else combo = 1;
        comboTimer = 2.8;
        bestCombo = Math.max(bestCombo, combo);
        const val = 100 * combo;
        score += val;
        spawnFloat(l.x, l.y - 18, (combo > 1 ? 'x' + combo + ' ' : '') + '+' + val, theme.accent);
        spawnParticle(l.x, l.y, accentRGBA(0.95), 16, 100, 320);
        spawnRipple(l.x, l.y, accentRGBA(0.5), 60);
        beep(420 + combo * 90, 0.16, 'sine', 0.4);
        beep(880 + combo * 110, 0.1, 'triangle', 0.22);
        if (combo > 1) {
          beep(1200 + combo * 80, 0.08, 'sine', 0.18);
        }
        vibrate(combo > 1 ? [8, 20, 8] : 8);
        lanterns.splice(i, 1);
        spawnLantern();
        if (combo >= 2) {
          const el = document.getElementById('hudCombo');
          el.hidden = false;
          document.getElementById('hudComboVal').textContent = 'x' + combo;
          // restart pop animation
          el.style.animation = 'none';
          void el.offsetWidth;
          el.style.animation = '';
        }
      }
    }

    // Hazard spawn
    hazardSpawnTimer -= dt;
    if (hazardSpawnTimer <= 0 && hazards.length < 14) {
      const types = ['drift'];
      if (elapsedTime > 8) types.push('pulser');
      if (elapsedTime > 18) types.push('wander');
      if (elapsedTime > 28) types.push('stalker');
      spawnHazard(choose(types));
      const interval = Math.max(2.5, 6.5 - elapsedTime * 0.05);
      hazardSpawnTimer = interval;
    }

    // Hazards
    for (let i = hazards.length - 1; i >= 0; i--) {
      const h = hazards[i];
      h.born += dt;
      h.phase += dt;

      if (h.type === 'wander') {
        if (Math.random() < dt * 1.4) {
          const ang = Math.atan2(h.vy, h.vx) + rand(-1.3, 1.3);
          const sp = Math.max(40, Math.hypot(h.vx, h.vy));
          h.vx = Math.cos(ang) * sp;
          h.vy = Math.sin(ang) * sp;
        }
      } else if (h.type === 'stalker') {
        const dx = courier.x - h.x;
        const dy = courier.y - h.y;
        const d = Math.hypot(dx, dy) + 0.001;
        const accel = 110;
        h.vx += (dx / d) * accel * dt;
        h.vy += (dy / d) * accel * dt;
        const sp = Math.hypot(h.vx, h.vy);
        const cap = 130;
        if (sp > cap) { h.vx = h.vx / sp * cap; h.vy = h.vy / sp * cap; }
      } else if (h.type === 'pulser') {
        h.pulseR = h.r + Math.sin(h.phase * 1.6) * 14;
      }

      h.x += h.vx * dt;
      h.y += h.vy * dt;

      // remove if very far out
      if (h.x < -h.r - 80 || h.x > W + h.r + 80 || h.y < -h.r - 80 || h.y > H + h.r + 80) {
        hazards.splice(i, 1);
        continue;
      }

      // bounce in-bounds
      if (h.x < h.r && h.vx < 0) h.vx = -h.vx;
      if (h.x > W - h.r && h.vx > 0) h.vx = -h.vx;
      if (h.y < h.r && h.vy < 0) h.vy = -h.vy;
      if (h.y > H - h.r && h.vy > 0) h.vy = -h.vy;

      // collide with courier
      if (hitImmune <= 0 && h.born > 0.25) {
        const rr = (h.pulseR || h.r) + COURIER_R - 4;
        if (dist2(courier.x, courier.y, h.x, h.y) < rr * rr) {
          hitImmune = 1.6;
          timeLeft = Math.max(0, timeLeft - 3);
          combo = 1;
          comboTimer = 0;
          shake = 22;
          flash = 0.7;
          hitPause = 0.07;
          document.getElementById('hudCombo').hidden = true;
          spawnParticle(courier.x, courier.y, dangerRGBA(0.95), 22, 120, 380);
          spawnFloat(courier.x, courier.y - 18, '-3s', theme.danger);
          spawnRipple(courier.x, courier.y, dangerRGBA(0.6), 80);
          noiseHit(0.32, 0.4);
          beep(120, 0.25, 'sawtooth', 0.3);
          vibrate([30, 30, 60]);
          // push courier away from hazard a bit
          const px = courier.x - h.x;
          const py = courier.y - h.y;
          const pd = Math.hypot(px, py) + 0.001;
          courier.vx = (px / pd) * 280;
          courier.vy = (py / pd) * 280;
          // also warn pill
          const pill = document.getElementById('hudTimePill');
          pill.classList.add('warn');
          setTimeout(() => pill.classList.remove('warn'), 800);
        }
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      const k = Math.exp(-2.2 * dt);
      p.vx *= k; p.vy *= k;
    }

    // Floats
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      f.y += f.vy * dt;
      f.vy *= 0.93;
    }

    // HUD updates
    document.getElementById('hudTime').textContent = Math.ceil(timeLeft);
    document.getElementById('hudScore').textContent = score.toLocaleString();
    const tp = document.getElementById('hudTimePill');
    if (timeLeft <= 10) tp.classList.add('warn');
    else tp.classList.remove('warn');
  }

  // ============================================================
  // RENDER
  // ============================================================
  function render() {
    if (bgDirty) rebuildBg();

    let sx = 0, sy = 0;
    if (shake > 0) {
      sx = (Math.random() - 0.5) * shake;
      sy = (Math.random() - 0.5) * shake;
    }

    ctx.save();
    ctx.translate(sx, sy);

    // Background
    ctx.drawImage(bgCanvas, 0, 0, W, H);

    // Drifting mist dust
    ctx.save();
    for (const m of mistDust) {
      const a = m.a * (0.6 + 0.4 * Math.sin(m.phase));
      ctx.globalAlpha = a;
      ctx.fillStyle = theme.ink2;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // Warnings (incoming hazards)
    for (const w of warnings) {
      const k = w.t / w.maxT;
      const pulse = 1 - k;
      ctx.save();
      ctx.globalAlpha = pulse * 0.7;
      ctx.strokeStyle = theme.danger;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(w.x, w.y, 18 + k * 22, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    if (state === STATE_PLAYING || state === STATE_GAMEOVER) {
      // Trail
      if (trail.length > 1) {
        for (let i = 1; i < trail.length; i++) {
          const t0 = trail[i - 1];
          const t1 = trail[i];
          const ageNorm = i / trail.length;
          const fade = ageNorm; // newer = larger index = higher fade
          const ageFactor = clamp(1 - t1.t / 0.9, 0, 1);
          const a = 0.85 * fade * ageFactor;
          if (a <= 0.02) continue;
          ctx.strokeStyle = trailColor(a);
          ctx.lineWidth = 2 + 4 * fade;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(t0.x, t0.y);
          ctx.lineTo(t1.x, t1.y);
          ctx.stroke();
        }
      }

      // Ripples
      for (const r of ripples) {
        const k = r.life / r.maxLife;
        ctx.save();
        ctx.globalAlpha = k * 0.7;
        ctx.strokeStyle = r.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      // Finger leash
      if (finger.down && finger.has && state === STATE_PLAYING) {
        const dd = Math.hypot(finger.x - courier.x, finger.y - courier.y);
        if (dd > 30) {
          ctx.save();
          ctx.globalAlpha = 0.4;
          ctx.strokeStyle = theme.ink2;
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 6]);
          ctx.beginPath();
          ctx.moveTo(courier.x, courier.y);
          ctx.lineTo(finger.x, finger.y);
          ctx.stroke();
          ctx.restore();
        }
        // finger ring
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.strokeStyle = theme.ink2;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(finger.x, finger.y, 22, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = trailColor(0.7);
        ctx.beginPath();
        ctx.arc(finger.x, finger.y, 10, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      // Lanterns
      for (const l of lanterns) {
        const pulse = 1 + Math.sin(l.pulse) * 0.15;
        const r = l.r;
        const intro = clamp(l.born * 4, 0, 1);
        ctx.save();
        ctx.globalAlpha = intro;
        // glow
        const gR = 56 * pulse;
        const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, gR);
        g.addColorStop(0, accentRGBA(0.55));
        g.addColorStop(0.35, accentRGBA(0.18));
        g.addColorStop(1, accentRGBA(0));
        ctx.fillStyle = g;
        ctx.fillRect(l.x - gR, l.y - gR, gR * 2, gR * 2);
        // ring
        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(l.x, l.y, r * pulse, 0, TAU);
        ctx.stroke();
        // core
        ctx.fillStyle = theme.accent3;
        ctx.beginPath();
        ctx.arc(l.x, l.y, r * 0.45, 0, TAU);
        ctx.fill();
        // central dot
        ctx.fillStyle = theme.bg;
        ctx.beginPath();
        ctx.arc(l.x, l.y, r * 0.18, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      // Hazards
      for (const h of hazards) {
        const rad = h.pulseR || h.r;
        const intro = clamp(h.born * 3, 0, 1);
        ctx.save();
        ctx.globalAlpha = intro;
        // wisp
        const gR = rad * 1.7;
        const g = ctx.createRadialGradient(h.x, h.y, rad * 0.25, h.x, h.y, gR);
        g.addColorStop(0, dangerRGBA(0.55));
        g.addColorStop(0.5, dangerRGBA(0.18));
        g.addColorStop(1, dangerRGBA(0));
        ctx.fillStyle = g;
        ctx.fillRect(h.x - gR, h.y - gR, gR * 2, gR * 2);
        // hard ring
        ctx.globalAlpha = intro * 0.75;
        ctx.strokeStyle = theme.danger;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(h.x, h.y, rad, 0, TAU);
        ctx.stroke();
        // type marker
        ctx.globalAlpha = intro * 0.55;
        if (h.type === 'stalker') {
          // crosshair
          ctx.beginPath();
          ctx.moveTo(h.x - rad * 0.45, h.y); ctx.lineTo(h.x + rad * 0.45, h.y);
          ctx.moveTo(h.x, h.y - rad * 0.45); ctx.lineTo(h.x, h.y + rad * 0.45);
          ctx.stroke();
        } else if (h.type === 'pulser') {
          // tick marks
          ctx.lineWidth = 1.5;
          for (let k = 0; k < 4; k++) {
            const ang = h.phase * 0.4 + k * (TAU / 4);
            ctx.beginPath();
            ctx.moveTo(h.x + Math.cos(ang) * rad * 0.85, h.y + Math.sin(ang) * rad * 0.85);
            ctx.lineTo(h.x + Math.cos(ang) * rad * 1.05, h.y + Math.sin(ang) * rad * 1.05);
            ctx.stroke();
          }
        } else if (h.type === 'wander') {
          // arrow
          const ang = Math.atan2(h.vy, h.vx);
          ctx.save();
          ctx.translate(h.x, h.y);
          ctx.rotate(ang);
          ctx.beginPath();
          ctx.moveTo(rad * 0.45, 0);
          ctx.lineTo(-rad * 0.2, rad * 0.25);
          ctx.lineTo(-rad * 0.2, -rad * 0.25);
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }

      // Courier
      if (state === STATE_PLAYING || state === STATE_GAMEOVER) {
        const flicker = hitImmune > 0 ? (Math.floor(elapsedTime * 18) % 2 === 0 ? 0.45 : 1) : 1;
        ctx.save();
        ctx.globalAlpha = flicker;
        // soft glow
        const gR = 30;
        const g = ctx.createRadialGradient(courier.x, courier.y, 0, courier.x, courier.y, gR);
        g.addColorStop(0, trailColor(0.55));
        g.addColorStop(1, trailColor(0));
        ctx.fillStyle = g;
        ctx.fillRect(courier.x - gR, courier.y - gR, gR * 2, gR * 2);
        // ring
        ctx.strokeStyle = theme.courier;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(courier.x, courier.y, COURIER_R + 2, 0, TAU);
        ctx.stroke();
        // direction wedge
        ctx.translate(courier.x, courier.y);
        ctx.rotate(courier.ang);
        ctx.fillStyle = theme.courier;
        ctx.beginPath();
        ctx.moveTo(COURIER_R - 1, 0);
        ctx.lineTo(-COURIER_R * 0.55, COURIER_R * 0.55);
        ctx.lineTo(-COURIER_R * 0.55, -COURIER_R * 0.55);
        ctx.closePath();
        ctx.fill();
        // tiny center dot in trail color
        ctx.fillStyle = trailColor(1);
        ctx.beginPath();
        ctx.arc(0, 0, 1.5, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      // Particles
      for (const p of particles) {
        const a = clamp(p.life / p.maxLife, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      // Floats
      for (const f of floats) {
        const a = clamp(f.life / f.maxLife, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = f.color;
        ctx.font = 'bold 13px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.text, f.x, f.y);
        ctx.restore();
      }
    } else if (state === STATE_TITLE) {
      // Idle preview: a couple of lanterns and one drifting phantom
      idleAngle += 0.01;
      const px1 = W * 0.3 + Math.cos(idleAngle) * 12;
      const py1 = H * 0.7 + Math.sin(idleAngle * 1.4) * 8;
      const px2 = W * 0.7 + Math.cos(idleAngle + 2) * 10;
      const py2 = H * 0.3 + Math.sin(idleAngle * 1.2 + 2) * 8;
      for (const p of [{x:px1,y:py1}, {x:px2,y:py2}]) {
        ctx.save();
        const gR = 60;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gR);
        g.addColorStop(0, accentRGBA(0.45));
        g.addColorStop(1, accentRGBA(0));
        ctx.fillStyle = g;
        ctx.fillRect(p.x - gR, p.y - gR, gR * 2, gR * 2);
        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 11, 0, TAU);
        ctx.stroke();
        ctx.fillStyle = theme.accent3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }

    // Soft mist overlay (atmospheric)
    ctx.save();
    const mg = ctx.createLinearGradient(0, 0, 0, H);
    mg.addColorStop(0, theme.bg + 'aa');
    mg.addColorStop(0.18, theme.bg + '20');
    mg.addColorStop(0.82, theme.bg + '20');
    mg.addColorStop(1, theme.bg + 'aa');
    ctx.fillStyle = mg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Vignette
    ctx.save();
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, theme.isDark ? 'rgba(0,0,0,0.55)' : 'rgba(20,18,12,0.22)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Hit flash
    if (flash > 0) {
      ctx.save();
      ctx.globalAlpha = flash * 0.35;
      ctx.fillStyle = theme.danger;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    ctx.restore();
  }

  // ============================================================
  // LOOP
  // ============================================================
  function loop(now) {
    let dt = (now - lastTime) / 1000;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.1) dt = 0.1;
    lastTime = now;

    updateInput();
    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  // ============================================================
  // INIT
  // ============================================================
  resize();
  rebuildBg();
  initMist();
  placeCourierIdle();
  lastTime = performance.now();
  requestAnimationFrame(loop);

  // Pause audio when tab hidden
  document.addEventListener('visibilitychange', () => {
    if (!audioCtx) return;
    if (document.hidden) audioCtx.suspend?.();
    else audioCtx.resume?.();
  });
})();
</script>
</body>
</html>
