<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SORT</title>
    <style>
        :root {
            --bg-top: #f1f5f9;
            --bg-bottom: #cbd5e1;
            --text-color: #334155;
            --overlay-bg: rgba(241, 245, 249, 0.85);
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-top: #1e293b;
                --bg-bottom: #0f172a;
                --text-color: #f8fafc;
                --overlay-bg: rgba(15, 23, 42, 0.85);
            }
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            color: var(--text-color);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
            touch-action: none;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        #scoreHUD {
            position: absolute;
            top: max(env(safe-area-inset-top, 20px), 2rem);
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 4rem;
            font-weight: 800;
            opacity: 0.1;
            pointer-events: none;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--overlay-bg);
            pointer-events: auto;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 1rem 0;
            letter-spacing: 0.2em;
            font-weight: 800;
        }

        h2 {
            font-size: 2.5rem;
            margin: 0 0 1rem 0;
            letter-spacing: 0.1em;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin: 0.4rem 0;
        }

        button {
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 1rem 3rem;
            margin-top: 2.5rem;
            border: 2px solid currentColor;
            background: transparent;
            color: inherit;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.1s;
        }

        button:active {
            background: currentColor;
            color: var(--bg-bottom);
            transform: scale(0.95);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="scoreHUD">0</div>
        
        <div id="titleScreen" class="screen">
            <h1>SORT</h1>
            <p>Swipe Left/Right to sort notes.</p>
            <p>Swipe Down to drop instantly.</p>
            <button id="startBtn">PLAY</button>
        </div>
        
        <div id="gameOverScreen" class="screen" style="display: none;">
            <h2>GAME OVER</h2>
            <p id="finalScore">Score: 0</p>
            <button id="restartBtn">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const titleScreen = document.getElementById('titleScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreHUD = document.getElementById('scoreHUD');
        const finalScore = document.getElementById('finalScore');

        const C = {
            light: {
                lineRgb: '148, 163, 184', // slate-400
                colors: ['#ef4444', '#f59e0b', '#10b981', '#0ea5e9']
            },
            dark: {
                lineRgb: '51, 65, 85', // slate-700
                colors: ['#f87171', '#fbbf24', '#34d399', '#38bdf8']
            }
        };

        let width, height;
        let staffLeft, staffWidth, laneWidth, targetY;
        let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            isDark = e.matches;
        });

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            staffWidth = Math.min(width * 0.9, 500);
            laneWidth = staffWidth / 4;
            staffLeft = (width - staffWidth) / 2;
            targetY = height - Math.max(120, height * 0.15);
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio System
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSynth(lane, type = 'triangle', duration = 0.5) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            if (type === 'sawtooth') {
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + duration);
            } else {
                // C major pentatonic
                osc.frequency.value = [261.63, 329.63, 392.00, 523.25][lane];
            }
            
            osc.type = type;
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = type === 'sawtooth' ? 1000 : 2000;
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            if (type === 'sawtooth') {
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            } else {
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            }
            osc.stop(audioCtx.currentTime + duration);
        }

        function playTick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = 600;
            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // Game State
        let state = 'TITLE'; // TITLE, PLAYING, GAMEOVER
        let notes = [];
        let particles = [];
        let score = 0;
        let speed = 200;
        let spawnTimer = 0;
        let spawnInterval = 1.2;
        let lastTime = 0;
        let hitPause = 0;
        let shakeTime = 0;
        let loopId = null;

        function getActiveNote() {
            return notes.find(n => !n.dropped && !n.dead);
        }

        function spawnNote() {
            let lane = Math.floor(Math.random() * 4);
            let targetLane = Math.floor(Math.random() * 4);
            // Bias towards needing a move
            if (Math.random() > 0.3) {
                targetLane = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
            }
            notes.push({
                lane,
                targetLane,
                visualX: staffLeft + lane * laneWidth + laneWidth / 2,
                y: -100,
                dropped: false,
                dead: false
            });
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI - Math.PI;
                const spd = Math.random() * 150 + 50;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: 1,
                    color
                });
            }
        }

        function startGame() {
            initAudio();
            state = 'PLAYING';
            titleScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            setTimeout(() => {
                titleScreen.style.display = 'none';
                gameOverScreen.style.display = 'none';
            }, 300);

            notes = [];
            particles = [];
            score = 0;
            scoreHUD.innerText = score;
            speed = height * 0.25;
            spawnInterval = 1.2;
            spawnTimer = 0.5;
            hitPause = 0;
            shakeTime = 0;
            
            if (!loopId) {
                lastTime = performance.now();
                loopId = requestAnimationFrame(gameLoop);
            }
        }

        function triggerGameOver() {
            state = 'GAMEOVER';
            navigator.vibrate?.([50, 50, 50]);
            shakeTime = 0.4;
            finalScore.innerText = `Score: ${score}`;
            playSynth(0, 'sawtooth', 0.8);
            
            gameOverScreen.style.display = 'flex';
            // Force reflow
            void gameOverScreen.offsetWidth;
            gameOverScreen.classList.remove('hidden');
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Input Handling
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', e => {
            if (state !== 'PLAYING') return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            e.preventDefault(); // Prevent scroll/pull-to-refresh
            if (state !== 'PLAYING') return;
            
            const x = e.touches[0].clientX;
            const y = e.touches[0].clientY;
            const dx = x - touchStartX;
            const dy = y - touchStartY;
            
            const swipeThreshold = Math.max(30, laneWidth * 0.5);
            const dropThreshold = 50;

            let active = getActiveNote();
            if (!active) return;

            if (dy > dropThreshold && Math.abs(dy) > Math.abs(dx)) {
                active.dropped = true;
                active.visualX = staffLeft + active.lane * laneWidth + laneWidth / 2; // snap
                touchStartX = x;
                touchStartY = y;
                playTick();
            } else if (dx > swipeThreshold) {
                if (active.lane < 3) {
                    active.lane++;
                    playTick();
                    navigator.vibrate?.(5);
                }
                touchStartX = x;
                touchStartY = y;
            } else if (dx < -swipeThreshold) {
                if (active.lane > 0) {
                    active.lane--;
                    playTick();
                    navigator.vibrate?.(5);
                }
                touchStartX = x;
                touchStartY = y;
            }
        }, { passive: false });

        window.addEventListener('keydown', e => {
            if (state !== 'PLAYING') return;
            let active = getActiveNote();
            if (!active) return;
            
            if (e.key === 'ArrowLeft' && active.lane > 0) {
                active.lane--;
                playTick();
            } else if (e.key === 'ArrowRight' && active.lane < 3) {
                active.lane++;
                playTick();
            } else if (e.key === 'ArrowDown') {
                active.dropped = true;
                active.visualX = staffLeft + active.lane * laneWidth + laneWidth / 2;
                playTick();
            }
        });

        // Main Loop
        function gameLoop(now) {
            loopId = requestAnimationFrame(gameLoop);
            
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            
            if (state !== 'PLAYING' && state !== 'GAMEOVER') {
                draw(0);
                return;
            }
            
            if (hitPause > 0) {
                hitPause -= dt;
                draw(dt); // draw static, don't update logic
                return;
            }
            
            if (shakeTime > 0) shakeTime -= dt;
            
            if (state === 'PLAYING') {
                spawnTimer -= dt;
                if (spawnTimer <= 0) {
                    spawnNote();
                    spawnTimer = spawnInterval;
                }
                
                const theme = isDark ? C.dark : C.light;
                
                for (let note of notes) {
                    // Update visual position
                    const targetX = staffLeft + note.lane * laneWidth + laneWidth / 2;
                    note.visualX += (targetX - note.visualX) * (dt * 25);
                    
                    if (note.dropped) {
                        note.y += height * 4 * dt;
                    } else {
                        note.y += speed * dt;
                    }
                    
                    if (note.y >= targetY) {
                        if (note.lane === note.targetLane) {
                            score++;
                            scoreHUD.innerText = score;
                            playSynth(note.lane);
                            spawnParticles(targetX, targetY, theme.colors[note.targetLane]);
                            note.dead = true;
                            hitPause = 0.03;
                            navigator.vibrate?.(15);
                            
                            // Escalate
                            speed += height * 0.005;
                            spawnInterval = Math.max(0.35, spawnInterval - 0.015);
                        } else {
                            note.dead = true;
                            triggerGameOver();
                        }
                    }
                }
            }
            
            notes = notes.filter(n => !n.dead);
            
            for (let p of particles) {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 600 * dt; // gravity
                p.life -= dt * 2;
            }
            particles = particles.filter(p => p.life > 0);
            
            draw(dt);
        }

        function draw(dt) {
            ctx.clearRect(0, 0, width, height);
            const theme = isDark ? C.dark : C.light;
            
            ctx.save();
            if (shakeTime > 0) {
                const intensity = shakeTime * 30;
                ctx.translate((Math.random() - 0.5) * intensity, (Math.random() - 0.5) * intensity);
            }
            
            // Draw staff lines
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, `rgba(${theme.lineRgb}, 0)`);
            grad.addColorStop(0.2, `rgba(${theme.lineRgb}, 1)`);
            grad.addColorStop(1, `rgba(${theme.lineRgb}, 1)`);
            
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            for (let i = 0; i <= 4; i++) {
                const lx = staffLeft + i * laneWidth;
                ctx.beginPath();
                ctx.moveTo(lx, 0);
                ctx.lineTo(lx, height);
                ctx.stroke();
            }
            
            // Draw target zones
            const targetHeight = height - targetY;
            for (let i = 0; i < 4; i++) {
                const lx = staffLeft + i * laneWidth;
                const color = theme.colors[i];
                
                const zoneGrad = ctx.createLinearGradient(0, targetY, 0, height);
                zoneGrad.addColorStop(0, color + '33');
                zoneGrad.addColorStop(1, color + '00');
                
                ctx.fillStyle = zoneGrad;
                ctx.fillRect(lx, targetY, laneWidth, targetHeight);
                
                ctx.fillStyle = color;
                ctx.fillRect(lx, targetY, laneWidth, 4);
            }
            
            // Draw notes
            const active = getActiveNote();
            
            for (let note of notes) {
                ctx.save();
                const alpha = Math.max(0, Math.min(1, (note.y + 100) / 100));
                ctx.globalAlpha = alpha;
                
                const targetX = staffLeft + note.lane * laneWidth + laneWidth / 2;
                const dx = note.visualX - targetX;
                const tilt = dx * 0.02; // subtle lean based on movement momentum
                
                ctx.translate(note.visualX, note.y);
                ctx.rotate(tilt);
                
                const color = theme.colors[note.targetLane];
                
                // Trail for dropped notes
                if (note.dropped) {
                    ctx.beginPath();
                    ctx.moveTo(0, -20);
                    ctx.lineTo(0, -150);
                    ctx.strokeStyle = color + '66';
                    ctx.lineWidth = 6;
                    ctx.stroke();
                }
                
                // Note head
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fill();
                
                // Note stem
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(12, 0);
                ctx.lineTo(12, -40);
                ctx.stroke();
                
                // Active aura
                if (note === active) {
                    const pulse = 1 + 0.15 * Math.sin(performance.now() / 150);
                    ctx.beginPath();
                    ctx.arc(0, 0, 14 * 1.6 * pulse, 0, Math.PI * 2);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = color + 'aa';
                    ctx.stroke();
                }
                
                ctx.restore();
            }
            
            // Draw particles
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore(); // restore shake transform
            
            if (state === 'GAMEOVER' && shakeTime > 0.1) {
                ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
                ctx.fillRect(0, 0, width, height);
            }
        }
        
        // Initial draw
        requestAnimationFrame(() => draw(0));
    </script>
</body>
</html>
