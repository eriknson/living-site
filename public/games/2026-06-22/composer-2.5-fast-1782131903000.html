<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Drop</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  background:var(--bg);
  color:var(--text);
  transition:background .4s,color .4s;
}
:root{
  --bg:#0a0c10;
  --text:#e8ecf0;
  --muted:#7a8494;
  --accent:#f0a830;
  --accent-dim:#c48420;
  --neon:#3de8c4;
  --panel:rgba(12,16,22,.88);
  --border:rgba(255,255,255,.08);
  --fog:rgba(180,190,200,.55);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0c10;
    --text:#e8ecf0;
    --muted:#7a8494;
    --accent:#f0a830;
    --accent-dim:#c48420;
    --neon:#3de8c4;
    --panel:rgba(12,16,22,.88);
    --border:rgba(255,255,255,.08);
    --fog:rgba(180,190,200,.55);
  }
  .overlay{background:rgba(0,0,0,.45)}
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8eaee;
    --text:#1a1e26;
    --muted:#5a6474;
    --accent:#c07010;
    --accent-dim:#9a5808;
    --neon:#0a9a7a;
    --panel:rgba(240,242,246,.92);
    --border:rgba(0,0,0,.08);
    --fog:rgba(160,170,185,.45);
  }
}
#game{
  position:fixed;inset:0;width:100dvw;height:100dvh;
  display:block;touch-action:none;
}
#ui{
  position:fixed;inset:0;pointer-events:none;
  display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
.hud-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  font-size:clamp(11px,2.8vw,13px);letter-spacing:.12em;text-transform:uppercase;
}
.hud-score{font-size:clamp(28px,8vw,42px);letter-spacing:-.02em;font-weight:400;line-height:1}
.hud-combo{color:var(--accent);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.hud-combo.active{opacity:1;transform:translateY(0)}
.hud-center{flex:1;display:flex;align-items:center;justify-content:center}
.feedback{
  font-size:clamp(14px,4vw,18px);letter-spacing:.2em;text-transform:uppercase;
  opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s;
  text-shadow:0 0 20px var(--accent);
}
.feedback.show{opacity:1;transform:scale(1)}
.overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .35s;
  padding:24px;
}
@media(prefers-color-scheme:light){.overlay{background:rgba(232,234,238,.6)}}
.overlay.visible{opacity:1;pointer-events:auto}
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:2px;padding:clamp(28px,6vw,44px) clamp(24px,5vw,36px);
  text-align:center;max-width:340px;width:100%;
  transform:translateY(12px);transition:transform .35s;
}
.overlay.visible .card{transform:translateY(0)}
.card h1{
  font-size:clamp(22px,6vw,32px);font-weight:400;letter-spacing:.25em;
  text-transform:uppercase;margin-bottom:8px;
}
.card .sub{
  color:var(--muted);font-size:clamp(11px,2.8vw,13px);
  letter-spacing:.08em;line-height:1.6;margin-bottom:28px;
}
.card .stat-row{
  display:flex;justify-content:center;gap:32px;margin-bottom:28px;
  font-size:clamp(11px,2.8vw,12px);letter-spacing:.1em;text-transform:uppercase;
}
.card .stat-val{font-size:clamp(20px,5vw,28px);color:var(--accent);display:block;margin-top:4px;letter-spacing:0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:48px;min-width:160px;padding:12px 32px;
  background:transparent;border:1px solid var(--accent);color:var(--accent);
  font-family:inherit;font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  cursor:pointer;border-radius:2px;pointer-events:auto;
  transition:background .2s,color .2s,transform .1s;
}
.btn:active{transform:scale(.96)}
.btn:hover,.btn:focus-visible{background:var(--accent);color:var(--bg);outline:none}
.timer-bar{
  position:fixed;bottom:0;left:0;height:3px;background:var(--accent);
  transform-origin:left;transition:none;z-index:10;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="hud-top">
    <div>
      <div style="color:var(--muted);margin-bottom:4px">Score</div>
      <div class="hud-score" id="scoreEl">0</div>
    </div>
    <div style="text-align:right">
      <div style="color:var(--muted);margin-bottom:4px">Time</div>
      <div class="hud-score" id="timeEl">30</div>
    </div>
  </div>
  <div class="hud-center"><div class="feedback" id="feedbackEl"></div></div>
  <div style="text-align:center;padding-bottom:8px">
    <div class="hud-combo" id="comboEl">×1</div>
  </div>
</div>
<div class="timer-bar" id="timerBar"></div>
<div class="overlay visible" id="titleOverlay">
  <div class="card">
    <h1>Fog Drop</h1>
    <p class="sub">Tap the beat. Punch holes through the fog.<br>Reveal the golden hills before the drop ends.</p>
    <button class="btn" id="startBtn">Drop In</button>
  </div>
</div>
<div class="overlay" id="endOverlay">
  <div class="card">
    <h1>Drop Out</h1>
    <div class="stat-row">
      <div>Score<span class="stat-val" id="finalScore">0</span></div>
      <div>Best Combo<span class="stat-val" id="finalCombo">0</span></div>
      <div>Perfect<span class="stat-val" id="finalPerfect">0</span></div>
    </div>
    <button class="btn" id="replayBtn">Play Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

const ROUND_SEC = 30;
const START_BPM = 122;
const END_BPM = 152;
const PERFECT_MS = 90;
const GOOD_MS = 180;
const MAX_FOG = 0.92;
const MIN_FOG = 0.25;
const START_FOG = 0.42;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreEl');
const timeEl = document.getElementById('timeEl');
const comboEl = document.getElementById('comboEl');
const feedbackEl = document.getElementById('feedbackEl');
const titleOverlay = document.getElementById('titleOverlay');
const endOverlay = document.getElementById('endOverlay');
const timerBar = document.getElementById('timerBar');
const startBtn = document.getElementById('startBtn');
const replayBtn = document.getElementById('replayBtn');

let W, H, dpr, isLight;
let state = 'title';
let score = 0, combo = 0, maxCombo = 0, perfects = 0;
let fogDensity = START_FOG;
let roundStart = 0, roundElapsed = 0;
let beats = [], activeBeats = [], holes = [], particles = [];
let shake = 0, hitPause = 0, feedbackTimer = 0, feedbackText = '';
let streetlights = [], hills = [];
let audioCtx = null, masterGain = null, nextBeatId = 0;
let lastFrame = 0, beatScheduleIdx = 0, audioScheduleIdx = 0;
const APPROACH_TIME = 0.65;
let pointerDown = false;

function isLightMode(){
  return window.matchMedia('(prefers-color-scheme:light)').matches;
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildScene();
  timerBar.style.width = W + 'px';
}
window.addEventListener('resize', resize);

function buildScene(){
  isLight = isLightMode();
  hills = [];
  streetlights = [];
  const baseY = H * 0.72;
  for(let i = 0; i < 4; i++){
    const pts = [];
    const yOff = i * H * 0.06;
    const amp = H * (0.08 + i * 0.03);
    for(let x = 0; x <= W + 40; x += 30){
      const t = x / W;
      pts.push({
        x,
        y: baseY - yOff + Math.sin(t * Math.PI * (1.2 + i * 0.3) + i * 1.1) * amp
          + Math.sin(t * 7 + i) * amp * 0.2
      });
    }
    hills.push({pts, depth: i});
  }
  const lampCount = Math.floor(W / 55);
  for(let i = 0; i < lampCount; i++){
    const t = (i + 0.5) / lampCount;
    const hillIdx = Math.floor(t * 3) % 3;
    const hill = hills[hillIdx];
    const xi = Math.floor(t * (hill.pts.length - 1));
    const p = hill.pts[Math.min(xi, hill.pts.length - 1)];
    const x = p.x + (Math.random() - 0.5) * 30;
    const y = p.y - 8 - Math.random() * 25;
    streetlights.push({
      x, y, phase: Math.random() * Math.PI * 2,
      brightness: 0, targetBright: 0.3 + Math.random() * 0.5,
      wireH: 18 + Math.random() * 14
    });
  }
}

function initAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.55;
  masterGain.connect(audioCtx.destination);
}

function playKick(time, velocity){
  if(!audioCtx) return;
  const t = time || audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.exponentialRampToValueAtTime(42, t + 0.1);
  filter.type = 'lowpass';
  filter.frequency.value = 500;
  gain.gain.setValueAtTime(velocity * 0.95, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.45);
  const sub = audioCtx.createOscillator();
  const subG = audioCtx.createGain();
  sub.type = 'sine';
  sub.frequency.value = 55;
  subG.gain.setValueAtTime(velocity * 0.35, t);
  subG.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  sub.connect(subG);
  subG.connect(masterGain);
  sub.start(t);
  sub.stop(t + 0.3);
}

function playHiHat(time, vel){
  if(!audioCtx) return;
  const t = time || audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * 0.04);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'highpass';
  f.frequency.value = 7000;
  g.gain.setValueAtTime(vel * 0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  src.connect(f);
  f.connect(g);
  g.connect(masterGain);
  src.start(t);
}

function generateBeatMap(){
  beats = [];
  let t = 1.2;
  let beatNum = 0;
  while(t < ROUND_SEC + 1){
    const progress = t / ROUND_SEC;
    const bpm = START_BPM + (END_BPM - START_BPM) * progress;
    const interval = 60 / bpm;
    const isStutter = beatNum % 8 === 7 || (progress > 0.6 && beatNum % 4 === 3);
    if(isStutter){
      beats.push({time: t, type: 'stutter', id: nextBeatId++});
      beats.push({time: t + interval * 0.35, type: 'stutter2', id: nextBeatId++});
      beats.push({time: t + interval * 0.65, type: 'stutter3', id: nextBeatId++});
    } else {
      beats.push({time: t, type: 'kick', id: nextBeatId++});
    }
    if(beatNum % 2 === 1) beats.push({time: t + interval * 0.5, type: 'hat', id: nextBeatId++, silent: true});
    t += interval;
    beatNum++;
  }
}

function spawnBeat(beat){
  const cx = W * 0.5;
  const cy = H * 0.52;
  const maxR = Math.min(W, H) * 0.38;
  activeBeats.push({
    id: beat.id,
    spawnTime: roundElapsed,
    hitTime: beat.time,
    cx, cy,
    maxR,
    hit: false,
    judged: false,
    type: beat.type
  });
}

function scheduleAudioBeat(beat){
  if(!audioCtx || beat.silent || beat.audioPlayed) return;
  beat.audioPlayed = true;
  const when = audioCtx.currentTime + 0.01;
  const vel = {kick:0.75,stutter:0.82,stutter2:0.55,stutter3:0.95,hat:0.4};
  if(beat.type === 'hat') playHiHat(when, vel.hat);
  else playKick(when, vel[beat.type] || 0.7);
}

function startGame(){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  state = 'playing';
  score = 0; combo = 0; maxCombo = 0; perfects = 0;
  fogDensity = START_FOG;
  roundStart = performance.now();
  roundElapsed = 0;
  beatScheduleIdx = 0;
  audioScheduleIdx = 0;
  activeBeats = [];
  holes = [];
  particles = [];
  generateBeatMap();
  titleOverlay.classList.remove('visible');
  endOverlay.classList.remove('visible');
  updateHUD();
}

function endGame(){
  state = 'over';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalCombo').textContent = maxCombo;
  document.getElementById('finalPerfect').textContent = perfects;
  endOverlay.classList.add('visible');
}

function updateHUD(){
  scoreEl.textContent = score;
  const remaining = Math.max(0, Math.ceil(ROUND_SEC - roundElapsed));
  timeEl.textContent = remaining;
  timerBar.style.transform = 'scaleX(' + Math.max(0, 1 - roundElapsed / ROUND_SEC) + ')';
  if(combo > 1){
    comboEl.textContent = '×' + combo;
    comboEl.classList.add('active');
  } else {
    comboEl.classList.remove('active');
  }
}

function showFeedback(text){
  feedbackText = text;
  feedbackEl.textContent = text;
  feedbackEl.classList.add('show');
  feedbackTimer = 0.4;
}

function vibrate(ms){
  try{ navigator.vibrate?.(ms); }catch(e){}
}

function judgeHit(){
  if(state !== 'playing') return;
  const tapTime = roundElapsed;
  let best = null, bestDiff = Infinity;
  for(const b of activeBeats){
    if(b.judged || b.hit) continue;
    const diff = Math.abs(tapTime - b.hitTime);
    if(diff < GOOD_MS / 1000 + 0.15 && diff < bestDiff){
      bestDiff = diff;
      best = b;
    }
  }
  if(!best){
    combo = 0;
    fogDensity = Math.min(MAX_FOG, fogDensity + 0.06);
    showFeedback('—');
    spawnMissParticles(W * 0.5, H * 0.52);
    vibrate(20);
    return;
  }
  best.hit = true;
  best.judged = true;
  const ms = bestDiff * 1000;
  let points, label;
  if(ms <= PERFECT_MS){
    label = 'PERFECT';
    points = 100;
    perfects++;
    shake = 6;
    hitPause = 3;
    vibrate([15, 30, 15]);
  } else {
    label = 'GOOD';
    points = 50;
    shake = 3;
    vibrate(30);
  }
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  const mult = Math.min(combo, 20);
  score += points * mult;
  fogDensity = Math.max(MIN_FOG, fogDensity - 0.04);
  showFeedback(label);
  const angle = Math.random() * Math.PI * 2;
  const dist = 40 + Math.random() * 80;
  punchHole(best.cx + Math.cos(angle) * dist, best.cy + Math.sin(angle) * dist, 50 + combo * 3);
  revealNearbyLights(best.cx, best.cy);
  spawnHitParticles(best.cx, best.cy, label === 'PERFECT');
  updateHUD();
}

function punchHole(x, y, r){
  holes.push({x, y, r, life: 1, maxLife: 2.5 + Math.random()});
  if(holes.length > 40) holes.shift();
}

function revealNearbyLights(cx, cy){
  for(const lamp of streetlights){
    const dx = lamp.x - cx, dy = lamp.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if(dist < 120){
      lamp.brightness = Math.min(1, lamp.brightness + 0.35);
    }
  }
}

function spawnHitParticles(x, y, perfect){
  const n = perfect ? 18 : 10;
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * (perfect ? 8 : 5);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, decay: 0.02 + Math.random() * 0.03,
      size: perfect ? 3 + Math.random() * 3 : 2 + Math.random() * 2,
      color: perfect ? 'gold' : 'neon'
    });
  }
}

function spawnMissParticles(x, y){
  for(let i = 0; i < 6; i++){
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
      life: 0.6, decay: 0.04, size: 2, color: 'miss'
    });
  }
}

function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if(isLight){
    g.addColorStop(0, '#b8c8d8');
    g.addColorStop(0.35, '#d8c8a0');
    g.addColorStop(0.65, '#c8b888');
    g.addColorStop(1, '#8898a8');
  } else {
    g.addColorStop(0, '#0a1020');
    g.addColorStop(0.3, '#141c2a');
    g.addColorStop(0.55, '#2a2018');
    g.addColorStop(0.75, '#3a2a18');
    g.addColorStop(1, '#1a1e28');
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const hg = ctx.createRadialGradient(W * 0.7, H * 0.55, 0, W * 0.7, H * 0.55, W * 0.6);
  hg.addColorStop(0, isLight ? 'rgba(240,180,60,0.15)' : 'rgba(240,140,40,0.12)');
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, W, H);
}

function drawHills(){
  for(let i = hills.length - 1; i >= 0; i--){
    const hill = hills[i];
    const alpha = isLight ? 0.15 + i * 0.08 : 0.2 + i * 0.1;
    ctx.beginPath();
    ctx.moveTo(hill.pts[0].x, H);
    for(const p of hill.pts) ctx.lineTo(p.x, p.y);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = isLight ? 'rgba(60,70,85,' + alpha + ')' : 'rgba(30,38,52,' + alpha + ')';
    ctx.fill();
    ctx.strokeStyle = isLight ? 'rgba(80,90,105,0.3)' : 'rgba(60,75,95,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(hill.pts[0].x, hill.pts[0].y);
    for(let j = 1; j < hill.pts.length; j++) ctx.lineTo(hill.pts[j].x, hill.pts[j].y);
    ctx.stroke();
  }
  if(hills[1]){
    const h = hills[1];
    const accent = isLight ? 'rgba(192,112,16,0.35)' : 'rgba(240,168,48,0.4)';
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    const step = Math.max(2, Math.floor(h.pts.length / 8));
    for(let j = 0; j < h.pts.length; j += step){
      const p = h.pts[j];
      const y = p.y - 30 - Math.sin(j * 0.4 + roundElapsed * 0.5) * 4;
      if(j === 0) ctx.moveTo(p.x, y);
      else ctx.lineTo(p.x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawStreetlights(dt){
  for(const lamp of streetlights){
    lamp.brightness += (lamp.targetBright - lamp.brightness) * dt * 0.5;
    lamp.phase += dt * 2;
    const flicker = 0.85 + Math.sin(lamp.phase) * 0.1;
    const b = lamp.brightness * flicker;
    if(b < 0.05) continue;
    const gold = isLight ? [220, 140, 30] : [240, 168, 48];
    const neon = isLight ? [10, 154, 122] : [61, 232, 196];
    const mix = b;
    const r = gold[0] * mix + neon[0] * (1 - mix) * 0.3;
    const g = gold[1] * mix + neon[1] * (1 - mix) * 0.3;
    const bl = gold[2] * mix + neon[2] * (1 - mix) * 0.3;
    ctx.strokeStyle = 'rgba(' + Math.floor(r) + ',' + Math.floor(g) + ',' + Math.floor(bl) + ',' + (b * 0.7) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(lamp.x, lamp.y + lamp.wireH);
    ctx.lineTo(lamp.x, lamp.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(lamp.x - 6, lamp.y);
    ctx.lineTo(lamp.x + 6, lamp.y);
    ctx.stroke();
    const grd = ctx.createRadialGradient(lamp.x, lamp.y, 0, lamp.x, lamp.y, 20 + b * 30);
    grd.addColorStop(0, 'rgba(' + Math.floor(r) + ',' + Math.floor(g) + ',' + Math.floor(bl) + ',' + b + ')');
    grd.addColorStop(1, 'rgba(' + Math.floor(r) + ',' + Math.floor(g) + ',' + Math.floor(bl) + ',0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(lamp.x, lamp.y, 20 + b * 30, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBeatRings(){
  for(const b of activeBeats){
    if(b.judged) continue;
    const elapsed = roundElapsed - b.spawnTime;
    const approach = roundElapsed - (b.hitTime - APPROACH_TIME);
    if(approach < 0) continue;
    const t = Math.min(1, approach / APPROACH_TIME);
    const r = b.maxR * (1 - t) + 20;
    const alpha = 0.15 + t * 0.55;
    const pulse = 1 + Math.sin(t * Math.PI * 4) * 0.05;
    const accent = isLight ? '10,154,122' : '61,232,196';
    ctx.strokeStyle = 'rgba(' + accent + ',' + alpha + ')';
    ctx.lineWidth = 2 * pulse;
    ctx.beginPath();
    ctx.arc(b.cx, b.cy, r, 0, Math.PI * 2);
    ctx.stroke();
    if(t > 0.85){
      ctx.strokeStyle = 'rgba(240,168,48,' + ((t - 0.85) / 0.15) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(b.cx, b.cy, 28, 0, Math.PI * 2);
      ctx.stroke();
    }
    if(roundElapsed - b.hitTime > GOOD_MS / 1000 + 0.1 && !b.hit){
      b.judged = true;
      combo = 0;
      fogDensity = Math.min(MAX_FOG, fogDensity + 0.07);
      showFeedback('MISS');
      vibrate(40);
    }
  }
  activeBeats = activeBeats.filter(b => roundElapsed - b.hitTime < 1.2);
}

function drawTarget(){
  const cx = W * 0.5, cy = H * 0.52;
  let pulse = 1;
  for(const b of activeBeats){
    if(b.judged || b.hit) continue;
    const approach = roundElapsed - (b.hitTime - APPROACH_TIME);
    if(approach >= 0){
      const t = Math.min(1, approach / APPROACH_TIME);
      pulse = 1 + t * 0.25;
      break;
    }
  }
  const accent = isLight ? '#0a9a7a' : '#3de8c4';
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.35 + (pulse - 1) * 1.2;
  ctx.beginPath();
  ctx.arc(cx, cy, 28 * pulse, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawFog(){
  const fogR = isLight ? 200 : 180;
  const fogG = isLight ? 210 : 190;
  const fogB = isLight ? 220 : 200;
  ctx.fillStyle = 'rgba(' + fogR + ',' + fogG + ',' + fogB + ',' + fogDensity * 0.55 + ')';
  ctx.fillRect(0, 0, W, H);
  for(let i = 0; i < 12; i++){
    const fx = (Math.sin(roundElapsed * 0.3 + i * 1.7) * 0.5 + 0.5) * W;
    const fy = (Math.cos(roundElapsed * 0.2 + i * 2.3) * 0.5 + 0.5) * H * 0.7;
    const fr = W * 0.25 + Math.sin(roundElapsed + i) * 40;
    const grd = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr);
    grd.addColorStop(0, 'rgba(' + fogR + ',' + fogG + ',' + fogB + ',' + fogDensity * 0.2 + ')');
    grd.addColorStop(1, 'rgba(' + fogR + ',' + fogG + ',' + fogB + ',0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(fx, fy, fr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'destination-out';
  for(const h of holes){
    const grd = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
    grd.addColorStop(0, 'rgba(0,0,0,1)');
    grd.addColorStop(0.6, 'rgba(0,0,0,0.6)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawParticles(){
  for(const p of particles){
    let col;
    if(p.color === 'gold') col = isLight ? 'rgba(192,112,16,' + p.life + ')' : 'rgba(240,168,48,' + p.life + ')';
    else if(p.color === 'neon') col = isLight ? 'rgba(10,154,122,' + p.life + ')' : 'rgba(61,232,196,' + p.life + ')';
    else col = 'rgba(120,120,120,' + p.life * 0.5 + ')';
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawWireframeOverlay(){
  ctx.strokeStyle = isLight ? 'rgba(10,154,122,0.12)' : 'rgba(61,232,196,0.1)';
  ctx.lineWidth = 0.5;
  const grid = 50;
  for(let x = 0; x < W; x += grid){
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for(let y = 0; y < H; y += grid){
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function update(dt){
  if(state !== 'playing') return;
  roundElapsed = (performance.now() - roundStart) / 1000;
  if(roundElapsed >= ROUND_SEC){
    endGame();
    return;
  }
  while(beatScheduleIdx < beats.length && beats[beatScheduleIdx].time - APPROACH_TIME <= roundElapsed){
    const beat = beats[beatScheduleIdx];
    if(!beat.silent && !beat.visualSpawned){
      beat.visualSpawned = true;
      spawnBeat(beat);
    }
    beatScheduleIdx++;
  }
  while(audioScheduleIdx < beats.length && beats[audioScheduleIdx].time <= roundElapsed){
    scheduleAudioBeat(beats[audioScheduleIdx]);
    audioScheduleIdx++;
  }
  for(const h of holes){
    h.life -= dt / h.maxLife;
    h.r *= 1 + dt * 0.15;
  }
  holes = holes.filter(h => h.life > 0);
  for(const p of particles){
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
  if(feedbackTimer > 0){
    feedbackTimer -= dt;
    if(feedbackTimer <= 0) feedbackEl.classList.remove('show');
  }
  if(shake > 0) shake *= 0.85;
  updateHUD();
}

function render(){
  ctx.save();
  if(shake > 0.5){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawBackground();
  drawWireframeOverlay();
  drawHills();
  drawStreetlights(1/60);
  drawTarget();
  drawBeatRings();
  drawFog();
  drawParticles();
  ctx.restore();
}

function loop(now){
  const dt = Math.min(0.05, (now - lastFrame) / 1000 || 1/60);
  lastFrame = now;
  if(hitPause > 0){
    hitPause--;
  } else {
    update(dt);
    render();
  }
  requestAnimationFrame(loop);
}

function onTap(e){
  if(e.type.startsWith('touch')) e.preventDefault();
  if(state === 'playing') judgeHit();
}

canvas.addEventListener('touchstart', onTap, {passive: false});
canvas.addEventListener('mousedown', onTap);
document.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    if(state === 'playing') judgeHit();
    else if(state === 'title' && titleOverlay.classList.contains('visible')) startGame();
    else if(state === 'over' && endOverlay.classList.contains('visible')) startGame();
  }
});

startBtn.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});
replayBtn.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

window.matchMedia('(prefers-color-scheme:light)').addEventListener('change', function(){
  isLight = isLightMode();
  buildScene();
});

resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
