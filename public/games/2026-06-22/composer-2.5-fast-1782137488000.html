<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Loop</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  background:var(--bg);color:var(--text);
  transition:background .4s,color .4s;
}
:root{
  --bg:#0c1018;--text:#e6eaf0;--muted:#6e7a8c;
  --accent:#00e5c0;--accent2:#ff4d6a;--gold:#f0b040;
  --panel:rgba(10,14,22,.9);--border:rgba(255,255,255,.08);
  --hit:rgba(0,229,192,.35);--sky1:#1a2230;--sky2:#2a3548;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0c1018;--text:#e6eaf0;--muted:#6e7a8c;
    --accent:#00e5c0;--accent2:#ff4d6a;--gold:#f0b040;
    --panel:rgba(10,14,22,.9);--border:rgba(255,255,255,.08);
    --hit:rgba(0,229,192,.35);--sky1:#1a2230;--sky2:#2a3548;
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#d8dde6;--text:#141820;--muted:#5a6478;
    --accent:#008f78;--accent2:#d63050;--gold:#b07818;
    --panel:rgba(240,243,248,.94);--border:rgba(0,0,0,.08);
    --hit:rgba(0,143,120,.25);--sky1:#b8c2d0;--sky2:#9aa8bc;
  }
}
#game{
  position:fixed;inset:0;width:100dvw;height:100dvh;
  display:block;touch-action:none;
}
#ui{
  position:fixed;inset:0;pointer-events:none;
  display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right))
           max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;font-size:clamp(10px,2.6vw,12px);letter-spacing:.14em;text-transform:uppercase}
.hud-big{font-size:clamp(26px,7.5vw,40px);letter-spacing:-.02em;line-height:1}
.hud-right{text-align:right}
.hud-combo{color:var(--accent);opacity:0;transform:translateY(3px);transition:opacity .18s,transform .18s;text-align:right;margin-top:4px}
.hud-combo.on{opacity:1;transform:none}
.hud-mid{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.judge{font-size:clamp(13px,3.8vw,17px);letter-spacing:.22em;text-transform:uppercase;opacity:0;transform:scale(.85);transition:opacity .12s,transform .12s}
.judge.show{opacity:1;transform:scale(1)}
.bar-track{width:min(88vw,320px);height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .25s}
.glitch-meter{display:flex;gap:5px;margin-top:6px}
.glitch-pip{width:clamp(18px,5vw,24px);height:4px;background:var(--border);border-radius:1px;transition:background .2s,box-shadow .2s}
.glitch-pip.hot{background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
.overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .35s;padding:20px;
}
@media(prefers-color-scheme:light){.overlay{background:rgba(216,221,230,.72)}}
.overlay.on{opacity:1;pointer-events:auto}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:2px;
  padding:clamp(26px,6vw,42px) clamp(22px,5vw,34px);text-align:center;
  max-width:340px;width:100%;transform:translateY(14px);transition:transform .35s;
}
.overlay.on .card{transform:none}
.card h1{font-size:clamp(20px,5.5vw,30px);font-weight:400;letter-spacing:.28em;text-transform:uppercase;margin-bottom:6px}
.card .sub{color:var(--muted);font-size:clamp(10px,2.6vw,12px);letter-spacing:.06em;line-height:1.65;margin-bottom:24px}
.card .stats{display:flex;justify-content:center;gap:28px;margin-bottom:24px;font-size:clamp(11px,2.8vw,13px)}
.card .stats div{text-align:center}
.card .stats span{display:block;font-size:clamp(18px,5vw,26px);color:var(--accent);margin-bottom:2px}
.btn{
  pointer-events:auto;display:inline-block;min-height:48px;min-width:160px;
  padding:14px 28px;border:1px solid var(--border);background:transparent;
  color:var(--text);font:inherit;font-size:clamp(11px,2.8vw,13px);
  letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  border-radius:2px;transition:background .2s,border-color .2s,transform .15s;
}
.btn:active{transform:scale(.97)}
.btn:hover,.btn:focus-visible{background:rgba(0,229,192,.08);border-color:var(--accent);outline:none}
.tap-hint{
  position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-size:clamp(9px,2.4vw,11px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);opacity:.7;pointer-events:none;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="hud-top">
    <div>
      <div class="hud-big" id="score">0</div>
      <div id="bpm-label">124 BPM</div>
    </div>
    <div class="hud-right">
      <div class="hud-big" id="bar-label">1/16</div>
      <div id="acc-label">—</div>
      <div class="hud-combo" id="combo"></div>
    </div>
  </div>
  <div class="hud-mid">
    <div class="judge" id="judge"></div>
    <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
    <div class="glitch-meter" id="glitch-meter"></div>
  </div>
</div>
<div class="tap-hint" id="tap-hint">tap on the pulse</div>
<div class="overlay on" id="overlay">
  <div class="card">
    <h1 id="card-title">Stutter Loop</h1>
    <p class="sub" id="card-sub">Tap the neon pulses as they cross the line.<br>Lock a perfect 16-bar loop before the track breaks.</p>
    <div class="stats" id="card-stats" style="display:none">
      <div><span id="final-score">0</span>score</div>
      <div><span id="final-acc">0%</span>accuracy</div>
      <div><span id="final-max">0</span>max combo</div>
    </div>
    <button class="btn" id="action-btn">Start</button>
  </div>
</div>
<script>
(function(){
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);

const STATE={TITLE:0,PLAY:1,WIN:2,LOSE:3};
let state=STATE.TITLE;
let W,H,cx,cy,beatY;

const BEATS_PER_BAR=4;
const TOTAL_BARS=16;
const TOTAL_BEATS=TOTAL_BARS*BEATS_PER_BAR;
const MAX_GLITCH=5;
const BPM_START=124;
const BPM_END=152;

let bpm=BPM_START;
let beatIdx=0;
let barIdx=0;
let nextBeatTime=0;
let startTime=0;
let score=0;
let combo=0;
let maxCombo=0;
let hits=0;
let misses=0;
let glitch=0;
let loopLock=0;
let audioReady=false;

let notes=[];
let mainBeatTimes=[];
let fracture=0;
let particles=[];
let wavePhase=0;
let glitchAmt=0;
let hitFlash=0;
let hitPause=0;
let shakeX=0;
let shakeY=0;
let audioCtx=null;
let masterGain=null;
let glitchGain=null;
let nextNoteId=0;

function nowSeconds(){
  return audioCtx?audioCtx.currentTime:performance.now()/1000;
}

const judgeEl=$('judge');
const scoreEl=$('score');
const barEl=$('bar-label');
const bpmEl=$('bpm-label');
const accEl=$('acc-label');
const barFill=$('bar-fill');
const comboEl=$('combo');

const glitchMeter=$('glitch-meter');
for(let i=0;i<MAX_GLITCH;i++){
  const p=document.createElement('div');
  p.className='glitch-pip';
  glitchMeter.appendChild(p);
}

function resize(){
  W=canvas.width=Math.floor(window.innerWidth*devicePixelRatio);
  H=canvas.height=Math.floor(window.innerHeight*devicePixelRatio);
  canvas.style.width=window.innerWidth+'px';
  canvas.style.height=window.innerHeight+'px';
  cx=W*0.5;cy=H*0.52;
  beatY=cy;
}
window.addEventListener('resize',resize);
resize();

function initAudio(){
  if(audioCtx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audioCtx=new AC();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=0.55;
  glitchGain=audioCtx.createGain();
  glitchGain.gain.value=1;
  glitchGain.connect(masterGain);
  masterGain.connect(audioCtx.destination);
  audioReady=true;
}

function playKick(t){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.08);
  g.gain.setValueAtTime(0.9,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  o.connect(g);g.connect(glitchGain);
  o.start(t);o.stop(t+0.15);
}

function playHat(t,vol){
  if(!audioCtx)return;
  const len=Math.floor(audioCtx.sampleRate*0.04);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const src=audioCtx.createBufferSource();
  src.buffer=buf;
  const g=audioCtx.createGain();
  const f=audioCtx.createBiquadFilter();
  f.type='highpass';f.frequency.value=6000;
  g.gain.value=vol||0.22;
  src.connect(f);f.connect(g);g.connect(glitchGain);
  src.start(t);src.stop(t+0.04);
}

function playStab(t){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='triangle';
  o.frequency.value=220;
  g.gain.setValueAtTime(0.35,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
  o.connect(g);g.connect(glitchGain);
  o.start(t);o.stop(t+0.07);
}

function playGlitchNoise(t){
  if(!audioCtx)return;
  const len=Math.floor(audioCtx.sampleRate*0.12);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);
  const src=audioCtx.createBufferSource();
  src.buffer=buf;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0.4,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  src.connect(g);g.connect(glitchGain);
  src.start(t);src.stop(t+0.13);
}

function playLockChord(t){
  if(!audioCtx)return;
  [261.6,329.6,392,523.3].forEach((f,i)=>{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.12,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.001,t+1.2);
    o.connect(g);g.connect(masterGain);
    o.start(t+i*0.02);o.stop(t+1.3);
  });
}

function beatInterval(){
  return 60/bpm;
}

function getBpmForBeat(i){
  const t=i/(TOTAL_BEATS-1);
  return BPM_START+(BPM_END-BPM_START)*t*t;
}

function shouldStutter(bar,beatInBar){
  if(bar<4)return false;
  if(bar>=12)return beatInBar%2===1;
  if(bar>=7)return beatInBar===2||beatInBar===3;
  return beatInBar===3;
}

function addNote(hitTime,travel,stutter){
  notes.push({
    id:nextNoteId++,
    hitTime:hitTime,
    spawnTime:hitTime-travel,
    x:W*1.15,
    targetX:cx,
    judged:false,
    stutter:!!stutter,
    color:stutter?'#ff4d6a':'#00e5c0'
  });
}

function scheduleBeats(){
  notes=[];
  mainBeatTimes=[];
  beatIdx=0;
  barIdx=0;
  bpm=BPM_START;
  startTime=(audioCtx?audioCtx.currentTime:performance.now()/1000)+0.55;
  let acc=0;
  for(let i=0;i<TOTAL_BEATS;i++){
    const bar=Math.floor(i/BEATS_PER_BAR);
    const bib=i%BEATS_PER_BAR;
    const beatBpm=getBpmForBeat(i);
    const iv=60/beatBpm;
    const bt=startTime+acc;
    mainBeatTimes.push(bt);
    const travel=iv*0.82;
    addNote(bt,travel,false);
    if(shouldStutter(bar,bib)){
      addNote(bt+iv*0.28,travel*0.55,true);
    }
    acc+=iv;
  }
}

function resetGame(){
  score=0;combo=0;maxCombo=0;hits=0;misses=0;glitch=0;
  loopLock=0;glitchAmt=0;hitFlash=0;fracture=0;particles=[];
  beatIdx=0;barIdx=0;bpm=BPM_START;
  updateHud();
  updateGlitchMeter();
  scheduleBeats();
}

function startGame(){
  initAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  resetGame();
  state=STATE.PLAY;
  $('overlay').classList.remove('on');
  $('tap-hint').style.opacity='0.35';
  $('card-stats').style.display='none';
}

function endGame(won){
  state=won?STATE.WIN:STATE.LOSE;
  const total=hits+misses;
  const acc=total?Math.round(hits/total*100):0;
  $('card-title').textContent=won?'Loop Locked':'Track Broke';
  $('card-sub').textContent=won
    ? 'You dropped a clean 16-bar edit. The waveform holds.'
    : 'Too many glitches. The loop fractured beyond repair.';
  $('final-score').textContent=score;
  $('final-acc').textContent=acc+'%';
  $('final-max').textContent=maxCombo;
  $('card-stats').style.display='flex';
  $('action-btn').textContent='Play Again';
  $('overlay').classList.add('on');
  $('tap-hint').style.opacity='0';
  if(won)playLockChord(audioCtx?audioCtx.currentTime:0);
  if(won&&navigator.vibrate)navigator.vibrate([30,20,50]);
}

function updateHud(){
  scoreEl.textContent=score;
  barEl.textContent=(barIdx+1)+'/16';
  bpmEl.textContent=Math.round(bpm)+' BPM';
  const total=hits+misses;
  accEl.textContent=total?Math.round(hits/total*100)+'%':'—';
  barFill.style.width=((barIdx+(beatIdx%4)/4)/TOTAL_BARS*100)+'%';
  if(combo>=3){
    comboEl.textContent='×'+combo;
    comboEl.classList.add('on');
  }else comboEl.classList.remove('on');
}

function updateGlitchMeter(){
  const pips=glitchMeter.children;
  for(let i=0;i<MAX_GLITCH;i++){
    pips[i].classList.toggle('hot',i<glitch);
  }
}

function showJudge(text,color){
  judgeEl.textContent=text;
  judgeEl.style.color=color||'var(--accent)';
  judgeEl.classList.add('show');
  clearTimeout(showJudge._t);
  showJudge._t=setTimeout(()=>judgeEl.classList.remove('show'),420);
}

function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=2+Math.random()*6;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:0.025+Math.random()*0.03,col});
  }
}

function addGlitch(){
  glitch++;
  glitchAmt=Math.min(1,glitch/MAX_GLITCH);
  if(glitchGain&&audioCtx){
    glitchGain.gain.cancelScheduledValues(audioCtx.currentTime);
    glitchGain.gain.setValueAtTime(1+glitch*0.15,audioCtx.currentTime);
  }
  updateGlitchMeter();
  shakeX=(Math.random()-0.5)*12;
  shakeY=(Math.random()-0.5)*8;
  if(glitch>=MAX_GLITCH){
    setTimeout(()=>{if(state===STATE.PLAY)endGame(false);},300);
  }
}

function judgeTap(){
  if(state!==STATE.PLAY)return;
  const now=nowSeconds();
  let best=null;
  let bestDiff=Infinity;
  for(const n of notes){
    if(n.judged)continue;
    const d=Math.abs(now-n.hitTime);
    if(d<bestDiff&&d<0.22){bestDiff=d;best=n;}
  }
  if(!best){
    showJudge('early','var(--muted)');
    addGlitch();
    misses++;
    combo=0;
    playGlitchNoise(now);
    updateHud();
    return;
  }
  best.judged=true;
  let label,pts,mult=1;
  if(bestDiff<0.045){label='PERFECT';pts=100;mult=1.5;hitFlash=1;hitPause=3;}
  else if(bestDiff<0.085){label='GREAT';pts=70;mult=1.2;hitFlash=0.7;}
  else if(bestDiff<0.13){label='GOOD';pts=40;mult=1;hitFlash=0.4;}
  else{label='MISS';pts=0;mult=0;}
  if(pts>0){
    combo++;
    if(combo>maxCombo)maxCombo=combo;
    const bonus=Math.floor(pts*mult*(1+combo*0.05));
    score+=bonus;
    hits++;
    loopLock=Math.min(1,loopLock+0.02);
    glitchAmt=Math.max(0,glitchAmt-0.04);
    fracture=label==='PERFECT'?1:0.55;
    spawnParticles(best.targetX,beatY,best.color,label==='PERFECT'?18:10);
    showJudge(label,'var(--accent)');
    if(label==='PERFECT'&&navigator.vibrate)navigator.vibrate(12);
    if(glitchGain&&audioCtx){
      glitchGain.gain.cancelScheduledValues(now);
      glitchGain.gain.setValueAtTime(1,now);
    }
  }else{
    misses++;
    combo=0;
    addGlitch();
    showJudge('MISS','var(--accent2)');
    playGlitchNoise(now);
  }
  updateHud();
}

function onTap(e){
  if(e.cancelable)e.preventDefault();
  if(state===STATE.TITLE||state===STATE.WIN||state===STATE.LOSE)return;
  judgeTap();
}

canvas.addEventListener('touchstart',onTap,{passive:false});
canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  onTap(e);
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(state===STATE.PLAY)judgeTap();
    else if($('overlay').classList.contains('on'))startGame();
  }
});
$('action-btn').addEventListener('click',()=>{
  if(state!==STATE.PLAY)startGame();
});
$('action-btn').addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H*0.55);
  const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(dark){
    g.addColorStop(0,'#141a24');
    g.addColorStop(0.5,'#1c2432');
    g.addColorStop(1,'#243040');
  }else{
    g.addColorStop(0,'#c8d0dc');
    g.addColorStop(0.5,'#aab6c8');
    g.addColorStop(1,'#8e9cb0');
  }
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H*0.55);
  // fog layers
  for(let i=0;i<4;i++){
    const fy=H*(0.08+i*0.1);
    const fg=ctx.createLinearGradient(0,fy-H*0.06,0,fy+H*0.06);
    const a=dark?0.12:0.18;
    fg.addColorStop(0,'rgba(255,255,255,0)');
    fg.addColorStop(0.5,'rgba(200,210,225,'+a+')');
    fg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=fg;
    ctx.fillRect(0,fy-H*0.08,W,H*0.16);
  }
  // SF hills silhouette
  ctx.fillStyle=dark?'rgba(8,12,18,0.72)':'rgba(60,70,85,0.42)';
  const base=H*0.44;
  const pts=[];
  for(let i=0;i<=24;i++){
    const t=i/24;
    const x=t*W;
    const h=0.08+0.14*Math.sin(t*5.2+0.4)+0.1*Math.sin(t*11.7+1.2)+0.06*Math.sin(t*22);
    pts.push([x,base-H*h*0.55]);
  }
  ctx.beginPath();
  ctx.moveTo(0,base);
  pts.forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.lineTo(W,base);
  ctx.lineTo(W,H*0.55);
  ctx.lineTo(0,H*0.55);
  ctx.closePath();
  ctx.fill();
}

function drawWaveform(t){
  const amp=H*0.07*(1-glitchAmt*0.3);
  const segments=Math.floor(W/4);
  ctx.lineWidth=2.5*devicePixelRatio;
  ctx.beginPath();
  for(let i=0;i<=segments;i++){
    const x=i/segments*W;
    const norm=(x-cx)/W;
    const w1=Math.sin(norm*8+wavePhase)*0.5;
    const w2=Math.sin(norm*22-wavePhase*1.7)*0.25;
    const w3=Math.sin(norm*3+wavePhase*0.4)*0.35;
    let y=beatY+(w1+w2+w3)*amp;
    if(fracture>0&&Math.abs(norm)<0.18)y+=(norm*fracture*amp*2.5);
    if(glitchAmt>0.1&&Math.random()<glitchAmt*0.08)y+=(Math.random()-0.5)*amp*2;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const grad=ctx.createLinearGradient(0,beatY-amp,0,beatY+amp);
  grad.addColorStop(0,dark?'#00e5c0':'#008f78');
  grad.addColorStop(0.5,dark?'#ff4d6a':'#d63050');
  grad.addColorStop(1,dark?'#f0b040':'#b07818');
  ctx.strokeStyle=grad;
  ctx.shadowColor=dark?'#00e5c0':'#008f78';
  ctx.shadowBlur=14*devicePixelRatio*(1+hitFlash);
  ctx.stroke();
  ctx.shadowBlur=0;
  fracture*=0.9;
  if(glitchAmt>0.2){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='rgba(255,77,106,'+(glitchAmt*0.5)+')';
    ctx.translate((Math.random()-0.5)*glitchAmt*8,0);
    ctx.stroke();
    ctx.restore();
  }
}

function drawHitZone(){
  const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gw=60*devicePixelRatio;
  const grd=ctx.createLinearGradient(cx-gw,0,cx+gw,0);
  grd.addColorStop(0,'rgba(0,229,192,0)');
  grd.addColorStop(0.5,dark?'rgba(0,229,192,0.25)':'rgba(0,143,120,0.2)');
  grd.addColorStop(1,'rgba(0,229,192,0)');
  ctx.fillStyle=grd;
  ctx.fillRect(cx-gw,beatY-H*0.14,gw*2,H*0.28);
  ctx.strokeStyle=dark?'rgba(0,229,192,0.8)':'rgba(0,143,120,0.7)';
  ctx.lineWidth=2*devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(cx,beatY-H*0.16);
  ctx.lineTo(cx,beatY+H*0.16);
  ctx.stroke();
  if(hitFlash>0){
    ctx.strokeStyle='rgba(240,176,64,'+hitFlash+')';
    ctx.lineWidth=4*devicePixelRatio;
    ctx.beginPath();
    ctx.arc(cx,beatY,30*devicePixelRatio*(2-hitFlash),0,Math.PI*2);
    ctx.stroke();
    hitFlash*=0.88;
  }
}

function drawNotes(now){
  const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  for(const n of notes){
    if(n.judged)continue;
    const travel=n.hitTime-n.spawnTime;
    const prog=travel>0?Math.max(0,Math.min(1.15,(now-n.spawnTime)/travel)):0;
    n.x=W*1.15-(W*1.15-cx)*prog;
    const pulse=0.7+0.3*Math.sin(now*12+n.id);
    const r=(14+pulse*6)*devicePixelRatio;
    ctx.beginPath();
    ctx.arc(n.x,beatY,r,0,Math.PI*2);
    ctx.fillStyle=n.color;
    ctx.shadowColor=n.color;
    ctx.shadowBlur=18*devicePixelRatio;
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=1.5*devicePixelRatio;
    ctx.stroke();
    if(n.stutter){
      ctx.beginPath();
      ctx.arc(n.x,beatY,r*1.6,0,Math.PI*2);
      ctx.strokeStyle=dark?'rgba(255,77,106,0.4)':'rgba(214,48,80,0.35)';
      ctx.lineWidth=1*devicePixelRatio;
      ctx.stroke();
    }
    if(prog>1&&!n.judged){
      n.judged=true;
      misses++;
      combo=0;
      addGlitch();
      showJudge('MISS','var(--accent2)');
      playGlitchNoise(now);
      updateHud();
    }
  }
}

function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.beginPath();
    ctx.arc(p.x,p.y,3*devicePixelRatio*p.life,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawClubFloor(){
  const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const g=ctx.createLinearGradient(0,H*0.55,0,H);
  g.addColorStop(0,dark?'#0a0e14':'#b0b8c4');
  g.addColorStop(1,dark?'#060810':'#909aa8');
  ctx.fillStyle=g;
  ctx.fillRect(0,H*0.55,W,H*0.45);
  ctx.strokeStyle=dark?'rgba(0,229,192,0.06)':'rgba(0,100,80,0.08)';
  ctx.lineWidth=1;
  const gridY=H*0.58;
  for(let i=0;i<12;i++){
    const y=gridY+i*H*0.035;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
}

function tickAudio(now){
  if(state!==STATE.PLAY||!audioCtx)return;
  while(beatIdx<TOTAL_BEATS){
    const bt=mainBeatTimes[beatIdx];
    if(now<bt-0.02)break;
    bpm=getBpmForBeat(beatIdx);
    const bib=beatIdx%BEATS_PER_BAR;
    barIdx=Math.floor(beatIdx/BEATS_PER_BAR);
    playKick(bt);
    if(bib%2===1)playHat(bt,0.18);
    if(shouldStutter(barIdx,bib))playStab(bt+0.02);
    if(bib===0&&barIdx>0)playHat(bt,0.28);
    beatIdx++;
    updateHud();
    if(beatIdx>=TOTAL_BEATS){
      const endDelay=(60/getBpmForBeat(TOTAL_BEATS-1))*1.8;
      setTimeout(()=>{
        if(state===STATE.PLAY&&glitch<MAX_GLITCH)endGame(true);
      },endDelay*1000);
      break;
    }
  }
}

let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(hitPause>0){hitPause--;return;}
  const now=nowSeconds();
  const dt=Math.min(0.05,(ts-last)/1000||0.016);
  last=ts;
  wavePhase+=dt*3.5;
  shakeX*=0.85;shakeY*=0.85;

  ctx.save();
  ctx.setTransform(1,0,0,1,shakeX*devicePixelRatio,shakeY*devicePixelRatio);
  ctx.clearRect(-20,-20,W+40,H+40);
  drawSky();
  drawClubFloor();
  drawWaveform(now);
  drawHitZone();
  if(state===STATE.PLAY){
    tickAudio(now);
    drawNotes(now);
  }
  drawParticles();
  if(glitchAmt>0.5&&Math.random()<glitchAmt*0.15){
    ctx.fillStyle='rgba(255,77,106,0.08)';
    ctx.fillRect(0,(Math.random()*H)|0,W,4*devicePixelRatio);
  }
  ctx.restore();
}
requestAnimationFrame(frame);

})();
</script>
</body>
