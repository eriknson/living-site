<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Loop</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --fog:#c8d0d8;--fog-deep:#a8b4c0;--ink:#1a2228;--ink-soft:#4a5560;
  --neon-c:#00e8c8;--neon-m:#ff2d6a;--neon-a:#ffb347;--neon-g:#5ee06a;
  --glass:rgba(255,255,255,.55);--glass-border:rgba(255,255,255,.35);
  --overlay:rgba(200,208,216,.88);--btn-bg:#1a2228;--btn-fg:#f0f4f8;
}
@media(prefers-color-scheme:dark){
  :root{
    --fog:#1a2228;--fog-deep:#0e1418;--ink:#e8eef4;--ink-soft:#8a9aa8;
    --glass:rgba(26,34,40,.72);--glass-border:rgba(255,255,255,.08);
    --overlay:rgba(14,20,24,.92);--btn-bg:#00e8c8;--btn-fg:#0e1418;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--fog);font-family:system-ui,-apple-system,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
canvas#game{flex:1;width:100%;height:100%;display:block;touch-action:none}
.ui-layer{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.panel{pointer-events:auto;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-border);border-radius:20px;padding:28px 24px;max-width:min(92vw,380px);text-align:center;opacity:0;transform:translateY(12px) scale(.97);transition:opacity .45s ease,transform .45s cubic-bezier(.22,1,.36,1)}
.panel.show{opacity:1;transform:translateY(0) scale(1)}
.panel h1{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:6px}
.panel .sub{font-size:clamp(.78rem,3.2vw,.92rem);color:var(--ink-soft);line-height:1.45;margin-bottom:20px}
.panel .tag{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--neon-c);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:160px;padding:12px 28px;border:none;border-radius:12px;background:var(--btn-bg);color:var(--btn-fg);font-size:1rem;font-weight:600;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
.btn:active{transform:scale(.96)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.secondary{background:transparent;border:1.5px solid var(--ink-soft);color:var(--ink)}
.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity .3s}
.hud.show{opacity:1}
.hud-block{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:clamp(.65rem,2.8vw,.78rem);line-height:1.5;color:var(--ink-soft)}
.hud-block strong{display:block;font-size:clamp(1.1rem,4.5vw,1.5rem);color:var(--ink);font-weight:600}
.hud-right{text-align:right}
.feedback{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:clamp(.9rem,4vw,1.2rem);font-weight:700;opacity:0;pointer-events:none;transition:opacity .12s}
.feedback.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud" id="hud">
    <div class="hud-block"><span>SCORE</span><strong id="scoreEl">0</strong></div>
    <div class="hud-block hud-right"><span id="timerEl">30.0 · 112 BPM</span><strong id="comboEl">×0</strong></div>
  </div>
  <div class="feedback" id="feedback"></div>
  <div class="ui-layer" id="titleLayer">
    <div class="panel show" id="titlePanel">
      <div class="tag">Summer · Overcast · 112 BPM</div>
      <h1>Fog Loop</h1>
      <p class="sub">Tap the downbeat before the waveform collapses. Stitch 4 bars in 30 seconds — then replay your mix.</p>
      <button class="btn" id="startBtn">Drop In</button>
    </div>
  </div>
  <div class="ui-layer hidden" id="overLayer">
    <div class="panel" id="overPanel">
      <div class="tag" id="overTag">Loop Exported</div>
      <h1 id="overTitle">Set Complete</h1>
      <p class="sub" id="overSub"></p>
      <div class="btn-row">
        <button class="btn secondary" id="replayLoopBtn">Replay Loop</button>
        <button class="btn" id="againBtn">Play Again</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const scoreEl = document.getElementById('scoreEl');
const comboEl = document.getElementById('comboEl');
const timerEl = document.getElementById('timerEl');
const feedbackEl = document.getElementById('feedback');
const titleLayer = document.getElementById('titleLayer');
const overLayer = document.getElementById('overLayer');
const titlePanel = document.getElementById('titlePanel');
const overPanel = document.getElementById('overPanel');
const overSub = document.getElementById('overSub');
const startBtn = document.getElementById('startBtn');
const againBtn = document.getElementById('againBtn');
const replayLoopBtn = document.getElementById('replayLoopBtn');

const ROUND_SEC = 30;
const LOOP_BEATS = 16;
const START_BPM = 112;
const END_BPM = 148;
const PERFECT_MS = 42;
const GOOD_MS = 88;
const MAX_GLITCHES = 7;
const MAX_MISSES_END = 8;

let W, H, dpr;
let state = 'title';
let audioCtx = null;
let masterGain = null;
let dark = false;

let score = 0, combo = 0, maxCombo = 0, misses = 0;
let timeLeft = ROUND_SEC;
let bpm = START_BPM;
let spawnBeatCount = 0;
let stitchCount = 0;
let nextBeatTime = 0;
let sessionStart = 0;
let lastFrame = 0;
let countInLeft = 0;
let countInNum = 0;

let waveAmp = 0;
let waveTarget = 1;
let waveCollapse = 0;
let hitFlash = 0;
let lanePulse = 0;
let shake = 0;

let loopSlots = [];
let glitches = [];
let particles = [];
let beatMarkers = [];
let feedbackTimer = 0;
let feedbackText = '';
let feedbackColor = '#00e8c8';

let replaying = false;
let replayBeat = 0;
let replayTimeout = null;

const colors = { c:'#00e8c8', m:'#ff2d6a', a:'#ffb347', g:'#5ee06a' };
const slotColors = [colors.c, colors.m, colors.a, colors.g];

function isDark(){ return window.matchMedia('(prefers-color-scheme:dark)').matches; }

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dark = isDark();
}
window.addEventListener('resize', resize);
resize();

function initAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.55;
  masterGain.connect(audioCtx.destination);
}

function playKick(t, vel){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(160, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.08);
  g.gain.setValueAtTime(vel * 0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.4);
}

function playSnare(t, vel){
  if(!audioCtx) return;
  const len = Math.floor(audioCtx.sampleRate * 0.12);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(vel * 0.45, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 0.15);
}

function playHat(t, vel){
  if(!audioCtx) return;
  const len = Math.floor(audioCtx.sampleRate * 0.04);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 7000;
  g.gain.setValueAtTime(vel * 0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 0.05);
}

function playStab(t, note, vel){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  o.type = 'triangle';
  o.frequency.value = note;
  f.type = 'lowpass'; f.frequency.setValueAtTime(2200, t);
  f.frequency.exponentialRampToValueAtTime(400, t + 0.15);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vel * 0.35, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.25);
}

function playGlitch(t){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(80 + Math.random()*400, t);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.1);
}

function playStutterChop(t, note){
  if(!audioCtx) return;
  [0, 0.04, 0.07, 0.11].forEach((off, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = note * (i % 2 ? 1.5 : 1);
    g.gain.setValueAtTime(i === 0 ? 0.12 : 0.07, t + off);
    g.gain.exponentialRampToValueAtTime(0.001, t + off + 0.03);
    o.connect(g); g.connect(masterGain);
    o.start(t + off); o.stop(t + off + 0.04);
  });
}

function playCountClick(t, accent){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.value = accent ? 880 : 440;
  g.gain.setValueAtTime(accent ? 0.35 : 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.07);
}

const STAB_NOTES = [110, 130.81, 146.83, 164.81, 196, 220];

function scheduleBeatPattern(t, slotIdx, quality){
  const bi = slotIdx % 4;
  const bar = Math.floor(slotIdx / 4);
  const vel = quality === 'perfect' ? 1 : 0.75;
  playKick(t, vel);
  if(bi === 1 || bi === 3) playSnare(t, vel * 0.85);
  playHat(t + 0.06, vel * 0.6);
  playHat(t + (bi % 2 ? 0.18 : 0.12), vel * 0.4);
  const note = STAB_NOTES[(bar + bi) % STAB_NOTES.length];
  if(quality === 'perfect'){
    playStab(t + 0.02, note, vel);
    playStutterChop(t + 0.05, note * 2);
  } else if(quality === 'good'){
    playStab(t + 0.02, note, vel * 0.6);
  }
}

function currentBpm(){
  const prog = 1 - timeLeft / ROUND_SEC;
  return START_BPM + (END_BPM - START_BPM) * Math.pow(prog, 0.85);
}

function beatInterval(){ return 60 / bpm; }

function spawnParticles(x, y, col, n){
  for(let i=0;i<n;i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.4+Math.random()*0.35, max: 0.75, col, sz: 2+Math.random()*3 });
  }
}

function addGlitch(){
  if(glitches.length >= MAX_GLITCHES) return;
  glitches.push({
    x: 0.08 + Math.random() * 0.84,
    y: 0.52 + Math.random() * 0.28,
    w: 0.06 + Math.random() * 0.14,
    h: 0.04 + Math.random() * 0.1,
    phase: Math.random() * 6.28,
    speed: 2 + Math.random() * 4
  });
}

function showFeedback(text, col){
  feedbackText = text;
  feedbackColor = col;
  feedbackEl.textContent = text;
  feedbackEl.style.color = col;
  feedbackEl.classList.add('show');
  feedbackTimer = 0.35;
}

function resetGame(){
  score = 0; combo = 0; maxCombo = 0; misses = 0;
  timeLeft = ROUND_SEC;
  bpm = START_BPM;
  spawnBeatCount = 0; stitchCount = 0;
  countInLeft = 3; countInNum = 3;
  waveAmp = 0; waveTarget = 1; waveCollapse = 0;
  hitFlash = 0; lanePulse = 0; shake = 0;
  loopSlots = new Array(LOOP_BEATS).fill(null);
  glitches = [];
  particles = [];
  beatMarkers = [];
  replaying = false;
  if(replayTimeout){ clearTimeout(replayTimeout); replayTimeout = null; }
  scoreEl.textContent = '0';
  comboEl.textContent = '×0';
  timerEl.textContent = '30.0 · ' + START_BPM + ' BPM';
}

function startGame(){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  resetGame();
  state = 'countin';
  sessionStart = performance.now();
  lastFrame = sessionStart;
  nextBeatTime = sessionStart + beatInterval() * 1000 * 4;
  titleLayer.classList.add('hidden');
  overLayer.classList.add('hidden');
  titlePanel.classList.remove('show');
  overPanel.classList.remove('show');
  hud.classList.add('show');
  if(audioCtx) playCountClick(audioCtx.currentTime + 0.05, false);
}

function endGame(){
  state = 'over';
  hud.classList.remove('show');
  overLayer.classList.remove('hidden');
  requestAnimationFrame(() => overPanel.classList.add('show'));
  const stitched = loopSlots.filter(s => s).length;
  const acc = stitched ? Math.round(loopSlots.filter(s => s && s.q === 'perfect').length / stitched * 100) : 0;
  overSub.textContent = `Score ${score} · ${stitched}/16 beats stitched · ${acc}% perfect · Best ×${maxCombo}`;
}

function getNearestBeat(now){
  let best = null, bestDist = Infinity;
  for(const m of beatMarkers){
    if(m.hit) continue;
    const dist = Math.abs(now - m.spawn);
    if(dist < bestDist){ bestDist = dist; best = m; }
  }
  return best ? { marker: best, dist: bestDist } : null;
}

function handleTap(){
  if(state !== 'playing' || replaying) return;
  const now = performance.now();
  const near = getNearestBeat(now);
  if(!near){ showFeedback('OFF', '#8a9aa8'); return; }

  const { marker, dist } = near;
  let quality = 'miss';
  if(dist <= PERFECT_MS) quality = 'perfect';
  else if(dist <= GOOD_MS) quality = 'good';
  else {
    showFeedback('LATE', colors.m); misses++; combo = 0; waveCollapse = 1; shake = 8;
    addGlitch(); marker.hit = true;
    if(audioCtx) playGlitch(audioCtx.currentTime);
    navigator.vibrate?.(30);
    if(misses >= MAX_MISSES_END) endGame();
    return;
  }

  marker.hit = true;
  const slotIdx = stitchCount % LOOP_BEATS;
  loopSlots[slotIdx] = { q: quality, color: slotColors[slotIdx % 4], note: STAB_NOTES[slotIdx % STAB_NOTES.length] };

  if(quality === 'perfect'){
    score += 100 + combo * 15;
    combo++;
    if(combo > maxCombo) maxCombo = combo;
    waveAmp = 1.2;
    hitFlash = 1;
    lanePulse = 1;
    spawnParticles(W * 0.22, H * 0.62, colors.c, 14);
    showFeedback(combo >= 5 ? 'STITCH ×' + combo : 'PERFECT', colors.c);
    navigator.vibrate?.(12);
  } else {
    score += 40 + combo * 5;
    combo = Math.max(0, combo - 1);
    waveAmp = 0.85;
    hitFlash = 0.6;
    spawnParticles(W * 0.22, H * 0.62, colors.a, 8);
    showFeedback('GOOD', colors.a);
    navigator.vibrate?.(6);
  }

  if(audioCtx){
    const t = audioCtx.currentTime;
    scheduleBeatPattern(t, slotIdx, quality);
  }

  stitchCount++;
  scoreEl.textContent = score;
  comboEl.textContent = '×' + combo;
}

function replayLoop(){
  if(!audioCtx) initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  replaying = true;
  hitFlash = 1;
  const filled = loopSlots.map((s,i) => s ? i : -1).filter(i => i >= 0);
  if(!filled.length){ replaying = false; return; }
  const iv = 60 / START_BPM;
  const t0 = audioCtx.currentTime + 0.1;
  filled.forEach((si, i) => {
    const slot = loopSlots[si];
    scheduleBeatPattern(t0 + i * iv, si, slot.q);
  });
  replayTimeout = setTimeout(() => { replaying = false; }, filled.length * iv * 1000 + 300);
}

function drawFog(t){
  const g1 = dark ? '#0e1418' : '#b8c4d0';
  const g2 = dark ? '#1a2228' : '#d0d8e0';
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, g2);
  grd.addColorStop(0.45, g1);
  grd.addColorStop(1, dark ? '#141c22' : '#c0cad4');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  for(let i=0;i<5;i++){
    const y = H * (0.15 + i * 0.14) + Math.sin(t * 0.0003 + i) * 12;
    const a = 0.04 + i * 0.015;
    ctx.fillStyle = dark ? `rgba(200,220,230,${a})` : `rgba(255,255,255,${a + 0.05})`;
    ctx.beginPath();
    ctx.ellipse(W * 0.5, y, W * (0.55 + i * 0.08), 30 + i * 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawWaveform(t){
  const cx = W * 0.5, cy = H * 0.36;
  const baseR = Math.min(W, H) * 0.22;
  const now = performance.now();
  const prog = state === 'countin'
    ? (now % (beatInterval() * 1000)) / (beatInterval() * 1000)
    : Math.min(1, (now - (nextBeatTime - beatInterval() * 1000)) / (beatInterval() * 1000));
  const pulse = (state === 'countin' ? 0.65 : waveAmp) * (0.4 + 0.6 * Math.sin(prog * Math.PI));
  const collapse = waveCollapse;

  if(collapse > 0.01){
    waveCollapse *= 0.92;
    waveAmp *= 0.88;
  } else {
    waveAmp += (waveTarget - waveAmp) * 0.08;
    waveTarget = 0.35 + prog * 0.75;
  }

  const rings = 4;
  for(let r=0;r<rings;r++){
    const rr = baseR * (0.5 + r * 0.22) * (0.7 + pulse * 0.5) * (1 - collapse * 0.4);
    const col = [colors.c, colors.m, colors.a, colors.g][r];
    ctx.beginPath();
    const segs = 64;
    for(let i=0;i<=segs;i++){
      const a = (i/segs) * Math.PI * 2;
      const wobble = Math.sin(a * 6 + t * 0.004 + r) * 8 * pulse;
      const stutter = (i % 8 < 2 && collapse > 0.2) ? Math.random() * 20 - 10 : 0;
      const px = cx + Math.cos(a) * (rr + wobble + stutter);
      const py = cy + Math.sin(a) * (rr + wobble + stutter) * 0.55;
      if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = col;
    ctx.globalAlpha = (0.25 + pulse * 0.35) * (1 - collapse * 0.5);
    ctx.lineWidth = 1.5 + r * 0.5;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  if(hitFlash > 0.01){
    hitFlash *= 0.9;
    ctx.beginPath();
    ctx.arc(cx, cy, baseR * 1.1 * hitFlash, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,232,200,${hitFlash * 0.2})`;
    ctx.fill();
  }
}

function drawLane(t){
  const laneY = H * 0.62;
  const laneH = H * 0.1;
  const hitX = W * 0.22;

  ctx.fillStyle = dark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
  ctx.fillRect(W * 0.04, laneY - laneH * 0.5, W * 0.92, laneH);

  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W * 0.04, laneY);
  ctx.lineTo(W * 0.96, laneY);
  ctx.stroke();

  const pulseA = lanePulse > 0.01 ? lanePulse : 0;
  if(pulseA > 0.01) lanePulse *= 0.88;
  ctx.fillStyle = `rgba(0,232,200,${0.15 + pulseA * 0.35})`;
  ctx.fillRect(hitX - 3, laneY - laneH * 0.55, 6, laneH * 1.1);

  ctx.strokeStyle = colors.c;
  ctx.globalAlpha = 0.5 + pulseA * 0.5;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(hitX, laneY - laneH * 0.6);
  ctx.lineTo(hitX, laneY + laneH * 0.6);
  ctx.stroke();
  ctx.globalAlpha = 1;

  const now = performance.now();
  for(const m of beatMarkers){
    if(m.hit) continue;
    const elapsed = now - m.spawn;
    const total = beatInterval() * 1000 * 1.8;
    const p = elapsed / total;
    if(p > 1) continue;
    const x = W * 0.92 - p * (W * 0.7);
    const sz = 10 + Math.sin(p * Math.PI) * 6;
    const dist = Math.abs(now - m.spawn);
    const urg = Math.max(0, 1 - dist / (GOOD_MS * 2.5));
    ctx.beginPath();
    ctx.arc(x, laneY, sz, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,232,200,${0.35 + urg * 0.5})`;
    ctx.fill();
    ctx.strokeStyle = colors.c;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  for(const g of glitches){
    g.phase += 0.05 * g.speed;
    const gx = g.x * W + Math.sin(g.phase) * 8;
    const gy = g.y * H;
    const gw = g.w * W, gh = g.h * H;
    ctx.fillStyle = dark ? 'rgba(255,45,106,0.35)' : 'rgba(255,45,106,0.25)';
    ctx.fillRect(gx, gy, gw, gh);
    ctx.fillStyle = dark ? 'rgba(0,232,200,0.2)' : 'rgba(0,232,200,0.15)';
    for(let i=0;i<3;i++){
      ctx.fillRect(gx + Math.sin(g.phase+i)*4, gy + i*4, gw*0.6, 2);
    }
  }
}

function drawLoopStrip(){
  const y = H * 0.78;
  const h = H * 0.06;
  const pad = W * 0.04;
  const totalW = W - pad * 2;
  const segW = totalW / LOOP_BEATS;

  ctx.fillStyle = dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
  ctx.fillRect(pad, y, totalW, h);

  for(let i=0;i<LOOP_BEATS;i++){
    const x = pad + i * segW + 1;
    const slot = loopSlots[i];
    if(slot){
      ctx.fillStyle = slot.color;
      ctx.globalAlpha = slot.q === 'perfect' ? 0.9 : 0.55;
      ctx.fillRect(x, y + 2, segW - 2, h - 4);
      ctx.globalAlpha = 1;
    } else if(i === stitchCount % LOOP_BEATS && state === 'playing'){
      ctx.strokeStyle = colors.c;
      ctx.globalAlpha = 0.4 + Math.sin(performance.now() * 0.008) * 0.2;
      ctx.strokeRect(x, y + 2, segW - 2, h - 4);
      ctx.globalAlpha = 1;
    }
  }

  ctx.font = `${Math.max(9, W * 0.028)}px ui-monospace, Menlo, monospace`;
  ctx.fillStyle = dark ? '#8a9aa8' : '#4a5560';
  ctx.textAlign = 'left';
  ctx.fillText('LOOP', pad, y - 6);
  const filled = loopSlots.filter(s=>s).length;
  ctx.textAlign = 'right';
  ctx.fillText(filled + '/16', pad + totalW, y - 6);
}

function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt;
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x, p.y, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
}

function update(dt){
  const now = performance.now();

  if(state === 'countin'){
    const elapsed = (now - sessionStart) / 1000;
    if(elapsed >= 3.35){
      state = 'playing';
      sessionStart = now;
      nextBeatTime = now + beatInterval() * 1000 * 0.65;
      timerEl.textContent = ROUND_SEC.toFixed(1) + ' · ' + START_BPM + ' BPM';
      return;
    }
    const ci = elapsed < 1 ? 3 : elapsed < 2 ? 2 : elapsed < 3 ? 1 : 0;
    if(ci !== countInNum){
      countInNum = ci;
      if(ci > 0 && audioCtx) playCountClick(audioCtx.currentTime, false);
      if(ci === 0 && audioCtx) playCountClick(audioCtx.currentTime, true);
    }
    timerEl.textContent = 'READY';
    return;
  }

  if(state !== 'playing') return;

  bpm = currentBpm();
  timeLeft = Math.max(0, ROUND_SEC - (now - sessionStart) / 1000);
  timerEl.textContent = timeLeft.toFixed(1) + ' · ' + Math.round(bpm) + ' BPM';
  comboEl.textContent = '×' + combo;

  if(shake > 0.1) shake *= 0.85; else shake = 0;

  if(timeLeft <= 0){ endGame(); return; }

  while(nextBeatTime <= now + 200){
    beatMarkers.push({ spawn: nextBeatTime, hit: false });
    if(audioCtx){
      const t = audioCtx.currentTime + (nextBeatTime - now) / 1000;
      playHat(t, 0.5);
      if(spawnBeatCount % 2 === 0) playKick(t, 0.35);
      if(spawnBeatCount % 4 === 2) playSnare(t, 0.3);
    }
    spawnBeatCount++;
    nextBeatTime += beatInterval() * 1000;
  }

  beatMarkers = beatMarkers.filter(m => now - m.spawn < beatInterval() * 2000);

  for(const m of beatMarkers){
    if(!m.hit && now - m.spawn > GOOD_MS * 1.8){
      m.hit = true;
      misses++;
      combo = 0;
      waveCollapse = 1;
      shake = 10;
      addGlitch();
      if(audioCtx) playGlitch(audioCtx.currentTime);
      showFeedback('MISS', colors.m);
      navigator.vibrate?.(40);
      if(misses >= MAX_MISSES_END) endGame();
    }
  }

  if(feedbackTimer > 0){
    feedbackTimer -= dt;
    if(feedbackTimer <= 0) feedbackEl.classList.remove('show');
  }
}

function draw(t){
  ctx.save();
  if(shake > 0.1){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  drawFog(t);
  if(state === 'countin'){
    drawWaveform(t);
    drawLane(t);
    ctx.font = `bold ${Math.max(48, W*0.18)}px ui-monospace, Menlo, monospace`;
    ctx.fillStyle = countInNum <= 1 ? colors.c : (dark ? '#e8eef4' : '#1a2228');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const label = countInNum === 0 ? 'GO' : String(countInNum);
    ctx.globalAlpha = 0.85 + Math.sin(t * 0.02) * 0.1;
    ctx.fillText(label, W/2, H * 0.36);
    ctx.globalAlpha = 1;
    ctx.font = `${Math.max(10, W*0.03)}px ui-monospace, Menlo, monospace`;
    ctx.fillStyle = dark ? '#8a9aa8' : '#4a5560';
    ctx.fillText('TAP THE PULSE WHEN IT HITS THE LINE', W/2, H * 0.88);
  } else if(state === 'playing' || state === 'over'){
    drawWaveform(t);
    drawLane(t);
    drawLoopStrip();
    drawParticles(1/60);
    if(replaying){
      ctx.fillStyle = 'rgba(0,232,200,0.08)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  if(state === 'title'){
    ctx.font = `${Math.max(11, W*0.032)}px ui-monospace, Menlo, monospace`;
    ctx.fillStyle = dark ? '#8a9aa8' : '#4a5560';
    ctx.textAlign = 'center';
    ctx.fillText('TAP ON DOWNBEAT  ·  SPACE OK', W/2, H * 0.92);
  }
  ctx.restore();
}

function loop(now){
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  update(dt);
  ctx.clearRect(0, 0, W, H);
  draw(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function onPointer(e){
  e.preventDefault();
  if(state === 'playing') handleTap();
}
canvas.addEventListener('pointerdown', onPointer, { passive: false });
canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

document.addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    if(state === 'title') startGame();
    else if(state === 'playing') handleTap();
    else if(state === 'over') startGame();
  }
});

startBtn.addEventListener('click', startGame);
againBtn.addEventListener('click', startGame);
replayLoopBtn.addEventListener('click', replayLoop);

window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => { dark = isDark(); });

})();
</script>
</body>
