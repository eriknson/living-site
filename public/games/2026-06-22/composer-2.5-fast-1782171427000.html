<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Pocket</title>
<style>
:root {
  --bg: #e8ecf0;
  --fog: rgba(180,190,200,0.55);
  --ui: #1a1f24;
  --ui-dim: #5a6570;
  --neon-cyan: #00e5cc;
  --neon-amber: #ffb020;
  --neon-coral: #ff5a4a;
  --neon-lime: #7dff4a;
  --panel: rgba(255,255,255,0.82);
  --shadow: rgba(0,0,0,0.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1014;
    --fog: rgba(40,50,60,0.65);
    --ui: #e8edf2;
    --ui-dim: #8a95a0;
    --panel: rgba(12,16,20,0.88);
    --shadow: rgba(0,0,0,0.45);
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100dvw; height: 100dvh; overflow: hidden;
  background: var(--bg); color: var(--ui);
  font-family: system-ui, -apple-system, sans-serif;
  touch-action: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game {
  position: fixed; inset: 0; width: 100%; height: 100%;
  touch-action: none; display: block;
}
#ui {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; z-index: 2;
}
.hud {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: max(12px, env(safe-area-inset-top)) 16px 8px;
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  font-size: clamp(11px, 2.8vw, 14px);
  letter-spacing: 0.04em;
}
.hud span { opacity: 0.85; }
.hud .score { font-size: clamp(18px, 5vw, 28px); font-weight: 600; }
.hud .combo { color: var(--neon-amber); }
.hud .bpm { color: var(--neon-cyan); }
.overlay {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px; text-align: center; gap: 16px;
}
.overlay h1 {
  font-size: clamp(28px, 8vw, 48px); font-weight: 700;
  letter-spacing: -0.02em; line-height: 1.05;
}
.overlay .sub {
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  font-size: clamp(11px, 3vw, 14px); color: var(--ui-dim);
  max-width: 320px; line-height: 1.5;
}
.overlay .loop-bar {
  display: flex; gap: 4px; margin-top: 8px;
}
.loop-cell {
  width: 10px; height: 28px; border-radius: 2px;
  background: var(--ui-dim); opacity: 0.25;
  transition: opacity 0.15s, transform 0.15s;
}
.loop-cell.filled { opacity: 1; transform: scaleY(1.15); }
.loop-cell.l0.filled { background: var(--neon-cyan); }
.loop-cell.l1.filled { background: var(--neon-amber); }
.loop-cell.l2.filled { background: var(--neon-lime); }
.loop-cell.l3.filled { background: var(--neon-coral); }
.btn {
  pointer-events: auto; cursor: pointer;
  min-width: 180px; min-height: 48px; padding: 14px 32px;
  border: none; border-radius: 999px;
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  font-size: 15px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--ui); color: var(--bg);
  box-shadow: 0 4px 24px var(--shadow);
  transition: transform 0.12s, opacity 0.12s;
}
@media (prefers-color-scheme: dark) {
  .btn { background: var(--neon-cyan); color: #0a1014; }
}
.btn:active { transform: scale(0.96); }
.btn[hidden] { display: none !important; }
#restartBtn { margin-top: 8px; }
.miss-flash {
  position: fixed; inset: 0; pointer-events: none;
  background: var(--neon-coral); opacity: 0;
  transition: opacity 0.08s; z-index: 1;
}
.miss-flash.on { opacity: 0.12; }
.hit-flash {
  position: fixed; inset: 0; pointer-events: none;
  background: var(--neon-cyan); opacity: 0;
  transition: opacity 0.06s; z-index: 1;
}
.hit-flash.on { opacity: 0.08; }
.lane-hints {
  position: fixed; bottom: max(80px, 18dvh);
  left: 0; right: 0; display: flex; justify-content: space-around;
  pointer-events: none; padding: 0 8px; z-index: 2;
}
.lane-hint {
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  font-size: 10px; color: var(--ui-dim); opacity: 0.5;
  text-align: center; width: 25%;
}
.lane-hint span { display: block; font-size: 18px; margin-bottom: 2px; }
#playingHud { display: none; }
#playingHud.show { display: flex; }
#titleScreen.hide { display: none; }
#gameOverScreen { display: none; }
#gameOverScreen.show { display: flex; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="miss-flash" id="missFlash"></div>
<div class="hit-flash" id="hitFlash"></div>
<div id="ui">
  <div class="hud" id="playingHud">
    <div>
      <div class="score" id="scoreEl">0</div>
      <div id="loopCount">0/16</div>
    </div>
    <div style="text-align:center">
      <div class="combo" id="comboEl">×1</div>
      <div class="bpm" id="bpmEl">110 BPM</div>
    </div>
    <div style="text-align:right">
      <div id="timeEl">0:55</div>
      <div id="missEl">miss 0/5</div>
    </div>
  </div>
  <div class="overlay" id="titleScreen">
    <h1>Fog Pocket</h1>
    <p class="sub">Catch stuttering beat shards through summer fog. Tap when they cross the neon line — each hit snaps into your live loop.</p>
    <div class="loop-bar" id="titleLoop"></div>
    <button class="btn" data-smoke="start" id="startBtn">Drop the beat</button>
  </div>
  <div class="overlay" id="gameOverScreen">
    <h1 id="endTitle">Loop sealed</h1>
    <p class="sub" id="endSub">Your pocket mix is ready.</p>
    <div class="loop-bar" id="endLoop"></div>
    <p class="sub" id="endStats"></p>
    <button class="btn" data-smoke="restart" id="restartBtn" hidden>Spin again</button>
  </div>
</div>
<div class="lane-hints" id="laneHints" style="display:none">
  <div class="lane-hint"><span>◆</span>KICK</div>
  <div class="lane-hint"><span>◇</span>SNARE</div>
  <div class="lane-hint"><span>○</span>HAT</div>
  <div class="lane-hint"><span>△</span>BASS</div>
</div>
<script>
(function() {
  'use strict';

  const LANES = 4;
  const LANE_COLORS = ['#00e5cc', '#ffb020', '#7dff4a', '#ff5a4a'];
  const LANE_NAMES = ['kick', 'snare', 'hat', 'bass'];
  const MAX_MISSES = 5;
  const ROUND_SEC = 55;
  const LOOP_STEPS = 16;
  const HIT_Y_RATIO = 0.78;
  const SPAWN_Y_RATIO = 0.08;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const titleScreen = document.getElementById('titleScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const playingHud = document.getElementById('playingHud');
  const laneHints = document.getElementById('laneHints');
  const missFlash = document.getElementById('missFlash');
  const hitFlash = document.getElementById('hitFlash');
  const scoreEl = document.getElementById('scoreEl');
  const comboEl = document.getElementById('comboEl');
  const bpmEl = document.getElementById('bpmEl');
  const timeEl = document.getElementById('timeEl');
  const missEl = document.getElementById('missEl');
  const loopCountEl = document.getElementById('loopCount');
  const endTitle = document.getElementById('endTitle');
  const endSub = document.getElementById('endSub');
  const endStats = document.getElementById('endStats');

  let W = 0, H = 0, hitY = 0, laneW = 0;
  let state = 'title';
  let audioCtx = null;
  let masterGain = null;
  let loopGain = null;
  let bpm = 110;
  let elapsed = 0;
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let misses = 0;
  let loopStep = 0;
  let loopPattern = [];
  let shards = [];
  let particles = [];
  let fogParticles = [];
  let beatTimer = 0;
  let nextBeatLane = 0;
  let loopTimeout = null;
  let floatTexts = [];
  let lastFrame = 0;
  let pulsePhase = 0;
  let fogDensity = 0.3;
  let screenShake = 0;
  let perfectCount = 0;
  let goodCount = 0;

  function initLoopPattern() {
    loopPattern = [];
    for (let i = 0; i < LOOP_STEPS; i++) {
      loopPattern.push([false, false, false, false]);
    }
  }

  function buildLoopBar(containerId) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = '';
    for (let i = 0; i < LOOP_STEPS; i++) {
      for (let l = 0; l < LANES; l++) {
        const c = document.createElement('div');
        c.className = 'loop-cell l' + l;
        c.dataset.step = i;
        c.dataset.lane = l;
        el.appendChild(c);
      }
    }
  }

  buildLoopBar('titleLoop');
  buildLoopBar('endLoop');

  function resize() {
    W = canvas.width = Math.floor(window.innerWidth * (window.devicePixelRatio || 1));
    H = canvas.height = Math.floor(window.innerHeight * (window.devicePixelRatio || 1));
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    hitY = H * HIT_Y_RATIO;
    laneW = W / LANES;
    initFog();
  }

  function initFog() {
    fogParticles = [];
    const count = Math.floor((W * H) / 18000);
    for (let i = 0; i < count; i++) {
      fogParticles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 20 + Math.random() * 60,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.15,
        a: 0.03 + Math.random() * 0.06
      });
    }
  }

  function initAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.55;
      masterGain.connect(audioCtx.destination);
      loopGain = audioCtx.createGain();
      loopGain.gain.value = 0.35;
      loopGain.connect(masterGain);
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, type, vol, time) {
    if (!audioCtx || !masterGain) return;
    try {
      const t = time || audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type === 'kick' ? 'sine' : (type || 'sine');
      osc.frequency.setValueAtTime(freq, t);
      if (type === 'kick') {
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
      }
      g.gain.setValueAtTime(vol || 0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    } catch (e) {}
  }

  function playNoise(dur, vol, freq, time) {
    if (!audioCtx || !masterGain) return;
    try {
      const t = time || audioCtx.currentTime;
      const len = Math.floor(audioCtx.sampleRate * dur);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const filt = audioCtx.createBiquadFilter();
      filt.type = 'highpass';
      filt.frequency.value = freq || 8000;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(vol || 0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(filt);
      filt.connect(g);
      g.connect(masterGain);
      src.start(t);
      src.stop(t + dur + 0.05);
    } catch (e) {}
  }

  function playLaneSound(lane, time) {
    if (!audioCtx) return;
    const t = time || audioCtx.currentTime;
    switch (lane) {
      case 0: playTone(120, 0.15, 'kick', 0.5, t); break;
      case 1: playNoise(0.12, 0.35, 2000, t); playTone(200, 0.05, 'triangle', 0.2, t); break;
      case 2: playNoise(0.04, 0.2, 7000, t); break;
      case 3: playTone(55, 0.2, 'sawtooth', 0.25, t); break;
    }
  }

  let loopStepIdx = 0;

  function scheduleLoopStep() {
    if (loopTimeout) { clearTimeout(loopTimeout); loopTimeout = null; }
    if (state !== 'playing' || !audioCtx) return;
    const beatDur = 60 / bpm;
    loopTimeout = setTimeout(function() {
      if (state !== 'playing') return;
      for (let l = 0; l < LANES; l++) {
        if (loopPattern[loopStepIdx] && loopPattern[loopStepIdx][l]) {
          playLaneSound(l);
        }
      }
      loopStepIdx = (loopStepIdx + 1) % LOOP_STEPS;
      scheduleLoopStep();
    }, beatDur * 1000 / 4);
  }

  function startLoopPlayback() {
    stopLoopPlayback();
    loopStepIdx = 0;
    scheduleLoopStep();
  }

  function stopLoopPlayback() {
    if (loopTimeout) { clearTimeout(loopTimeout); loopTimeout = null; }
  }

  function updateLoopBar(containerId) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const cells = el.querySelectorAll('.loop-cell');
    cells.forEach(function(c) {
      const s = parseInt(c.dataset.step, 10);
      const l = parseInt(c.dataset.lane, 10);
      if (loopPattern[s] && loopPattern[s][l]) c.classList.add('filled');
      else c.classList.remove('filled');
    });
  }

  function spawnShard(lane) {
    const beatDur = 60 / bpm;
    const dist = hitY - H * SPAWN_Y_RATIO;
    const speed = dist / beatDur;
    shards.push({
      lane: lane,
      y: H * SPAWN_Y_RATIO,
      speed: speed,
      collected: false,
      missed: false,
      rot: Math.random() * Math.PI * 2,
      rotSpd: (Math.random() - 0.5) * 4,
      pulse: 0,
      id: Math.random()
    });
  }

  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 6;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 2,
        life: 1,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function flash(el) {
    el.classList.add('on');
    setTimeout(function() { el.classList.remove('on'); }, 80);
  }

  function tryHit(lane) {
    if (state !== 'playing') return;
    const windowPx = laneW * 0.35;
    let best = null;
    let bestDist = Infinity;
    for (let i = 0; i < shards.length; i++) {
      const s = shards[i];
      if (s.lane !== lane || s.collected || s.missed) continue;
      const dist = Math.abs(s.y - hitY);
      if (dist < windowPx && dist < bestDist) {
        bestDist = dist;
        best = s;
      }
    }
    if (best) {
      const quality = bestDist < laneW * 0.12 ? 'perfect' : 'good';
      best.collected = true;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      const pts = quality === 'perfect' ? 150 : 80;
      score += pts * Math.min(combo, 8);
      if (quality === 'perfect') perfectCount++;
      else goodCount++;
      const stepIdx = loopStep % LOOP_STEPS;
      loopPattern[stepIdx][lane] = true;
      loopStep++;
      const cx = lane * laneW + laneW / 2;
      spawnParticles(cx, hitY, LANE_COLORS[lane], quality === 'perfect' ? 16 : 8);
      floatTexts.push({
        x: cx, y: hitY - 20, text: quality === 'perfect' ? 'PERFECT' : 'GOOD',
        life: 1, color: LANE_COLORS[lane], scale: quality === 'perfect' ? 1.2 : 1
      });
      if (combo >= 5 && combo % 5 === 0) {
        floatTexts.push({ x: W / 2, y: hitY - 60, text: '×' + combo + ' STREAK', life: 1.2, color: '#ffb020', scale: 1.4 });
      }
      playLaneSound(lane);
      flash(hitFlash);
      screenShake = quality === 'perfect' ? 6 : 3;
      try { navigator.vibrate?.(quality === 'perfect' ? 12 : 6); } catch (e) {}
      updateHud();
      updateLoopBar('titleLoop');
    } else {
      combo = 0;
      updateHud();
    }
  }

  function onTap(clientX) {
    if (state !== 'playing') return;
    const ratio = clientX / window.innerWidth;
    const lane = Math.min(LANES - 1, Math.max(0, Math.floor(ratio * LANES)));
    tryHit(lane);
  }

  function missShard(s) {
    if (s.collected || s.missed) return;
    s.missed = true;
    misses++;
    combo = 0;
    flash(missFlash);
    screenShake = 4;
    try { navigator.vibrate?.(30); } catch (e) {}
    updateHud();
    if (misses >= MAX_MISSES) endGame(false);
  }

  function updateHud() {
    scoreEl.textContent = score;
    comboEl.textContent = '×' + Math.max(1, combo);
    bpmEl.textContent = Math.round(bpm) + ' BPM';
    const left = Math.max(0, ROUND_SEC - elapsed);
    timeEl.textContent = '0:' + String(Math.ceil(left)).padStart(2, '0');
    missEl.textContent = 'miss ' + misses + '/' + MAX_MISSES;
    let filled = 0;
    for (let i = 0; i < LOOP_STEPS; i++) {
      for (let l = 0; l < LANES; l++) if (loopPattern[i][l]) filled++;
    }
    loopCountEl.textContent = filled + '/' + (LOOP_STEPS * LANES);
  }

  function startGame() {
    initLoopPattern();
    shards = [];
    particles = [];
    floatTexts = [];
    bpm = 110;
    elapsed = 0;
    score = 0;
    combo = 0;
    maxCombo = 0;
    misses = 0;
    loopStep = 0;
    beatTimer = 0;
    nextBeatLane = 0;
    fogDensity = 0.3;
    perfectCount = 0;
    goodCount = 0;
    pulsePhase = 0;
    screenShake = 0;
    state = 'playing';
    titleScreen.classList.add('hide');
    gameOverScreen.classList.remove('show');
    playingHud.classList.add('show');
    laneHints.style.display = 'flex';
    restartBtn.hidden = true;
    updateHud();
    updateLoopBar('titleLoop');
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function() {});
    }
    startLoopPlayback();
    lastFrame = performance.now();
    requestAnimationFrame(tick);
  }

  function endGame(survived) {
    state = 'over';
    stopLoopPlayback();
    playingHud.classList.remove('show');
    laneHints.style.display = 'none';
    titleScreen.classList.add('hide');
    gameOverScreen.classList.add('show');
    restartBtn.hidden = false;
    updateLoopBar('endLoop');
    let filled = 0;
    for (let i = 0; i < LOOP_STEPS; i++) {
      for (let l = 0; l < LANES; l++) if (loopPattern[i][l]) filled++;
    }
    if (survived) {
      endTitle.textContent = 'Pocket sealed';
      endSub.textContent = 'Your stutter-house loop assembled through the fog.';
    } else {
      endTitle.textContent = 'Dropped to silence';
      endSub.textContent = 'Too many shards slipped past the hit zone.';
    }
    endStats.textContent = score + ' pts · ' + filled + ' fragments · ×' + maxCombo + ' best · ' + perfectCount + ' perfect';
    try { navigator.vibrate?.(survived ? [20, 40, 20] : [50]); } catch (e) {}
  }

  function tick(now) {
    if (state !== 'playing') return;
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    elapsed += dt;
    beatTimer += dt;

    const progress = elapsed / ROUND_SEC;
    bpm = 110 + progress * 45;
    fogDensity = 0.3 + progress * 0.45;

    const beatDur = 60 / bpm;
    while (beatTimer >= beatDur) {
      beatTimer -= beatDur;
      const lane = nextBeatLane % LANES;
      if (Math.random() < 0.85) spawnShard(lane);
      nextBeatLane++;
      pulsePhase = 1;
      playTone(800 + lane * 100, 0.03, 'sine', 0.04);
    }
    pulsePhase *= 0.92;

    if (elapsed >= ROUND_SEC) {
      endGame(true);
      draw(now);
      return;
    }

    for (let i = shards.length - 1; i >= 0; i--) {
      const s = shards[i];
      s.y += s.speed * dt;
      s.rot += s.rotSpd * dt;
      if (!s.collected && !s.missed && s.y > hitY + laneW * 0.4) {
        missShard(s);
      }
      if (s.collected) s.pulse += dt * 8;
      if ((s.collected && s.pulse > 3) || (s.missed && s.y > H + 50)) {
        shards.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life -= dt * 2.5;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = 0; i < fogParticles.length; i++) {
      const f = fogParticles[i];
      f.x += f.vx;
      f.y += f.vy;
      if (f.x < -f.r) f.x = W + f.r;
      if (f.x > W + f.r) f.x = -f.r;
      if (f.y < -f.r) f.y = H + f.r;
      if (f.y > H + f.r) f.y = -f.r;
    }

    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const ft = floatTexts[i];
      ft.y -= 40 * dt;
      ft.life -= dt * 1.5;
      if (ft.life <= 0) floatTexts.splice(i, 1);
    }

    screenShake *= 0.85;
    updateHud();
    draw(now);
    requestAnimationFrame(tick);
  }

  function isDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function draw(now) {
    const dark = isDark();
    const dpr = window.devicePixelRatio || 1;
    let ox = 0, oy = 0;
    if (screenShake > 0.5) {
      ox = (Math.random() - 0.5) * screenShake * dpr;
      oy = (Math.random() - 0.5) * screenShake * dpr;
    }

    ctx.save();
    ctx.translate(ox, oy);

    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    if (dark) {
      bgGrad.addColorStop(0, '#0e1418');
      bgGrad.addColorStop(0.5, '#121820');
      bgGrad.addColorStop(1, '#0a0e12');
    } else {
      bgGrad.addColorStop(0, '#d8dfe6');
      bgGrad.addColorStop(0.5, '#c5cdd6');
      bgGrad.addColorStop(1, '#b0bac4');
    }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < fogParticles.length; i++) {
      const f = fogParticles[i];
      const fa = f.a * (0.5 + fogDensity);
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (1 + fogDensity * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = dark
        ? 'rgba(50,65,80,' + fa + ')'
        : 'rgba(200,210,220,' + fa + ')';
      ctx.fill();
    }

    for (let l = 0; l < LANES; l++) {
      const x = l * laneW;
      const obscured = fogDensity > 0.5 && ((l + Math.floor(elapsed * 2)) % 3 === 0);
      ctx.strokeStyle = dark ? 'rgba(0,229,204,0.08)' : 'rgba(0,100,90,0.1)';
      ctx.lineWidth = 1 * dpr;
      ctx.setLineDash([4 * dpr, 8 * dpr]);
      ctx.beginPath();
      ctx.moveTo(x + laneW / 2, 0);
      ctx.lineTo(x + laneW / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);

      if (obscured && state === 'playing') {
        ctx.fillStyle = dark ? 'rgba(8,12,16,0.55)' : 'rgba(220,225,230,0.55)';
        ctx.fillRect(x + 2, 0, laneW - 4, H);
      }
    }

    const pulse = 0.4 + pulsePhase * 0.6;
    const hitGrad = ctx.createLinearGradient(0, hitY - 20, 0, hitY + 20);
    hitGrad.addColorStop(0, 'rgba(0,229,204,0)');
    hitGrad.addColorStop(0.5, 'rgba(0,229,204,' + (0.25 * pulse) + ')');
    hitGrad.addColorStop(1, 'rgba(0,229,204,0)');
    ctx.fillStyle = hitGrad;
    ctx.fillRect(0, hitY - 30, W, 60);

    ctx.strokeStyle = 'rgba(0,229,204,' + (0.5 + pulsePhase * 0.5) + ')';
    ctx.lineWidth = 2 * dpr;
    ctx.shadowColor = '#00e5cc';
    ctx.shadowBlur = 12 * dpr * pulse;
    ctx.beginPath();
    ctx.moveTo(0, hitY);
    ctx.lineTo(W, hitY);
    ctx.stroke();
    ctx.shadowBlur = 0;

    for (let i = 0; i < shards.length; i++) {
      const s = shards[i];
      const cx = s.lane * laneW + laneW / 2;
      const col = LANE_COLORS[s.lane];
      const alpha = s.missed ? Math.max(0, 1 - (s.y - hitY) / 200) * 0.3 : 1;
      if (alpha <= 0) continue;

      ctx.save();
      ctx.translate(cx, s.y);
      ctx.rotate(s.rot);
      const stutter = Math.sin(s.y * 0.02 + elapsed * 12) > 0.7 ? 1 : 0.35;
      ctx.globalAlpha = alpha * (s.collected ? 1 : stutter);

      if (s.collected) {
        const sc = 1 + Math.sin(s.pulse) * 0.3;
        ctx.scale(sc, sc);
        ctx.strokeStyle = col;
        ctx.lineWidth = 2 * dpr;
        ctx.shadowColor = col;
        ctx.shadowBlur = 20 * dpr;
      } else if (s.missed) {
        ctx.strokeStyle = 'rgba(120,120,120,0.4)';
        ctx.lineWidth = 1 * dpr;
      } else {
        ctx.strokeStyle = col;
        ctx.lineWidth = 2 * dpr;
        ctx.shadowColor = col;
        ctx.shadowBlur = 10 * dpr;
      }

      const sz = laneW * 0.18;
      ctx.beginPath();
      if (s.lane === 0) {
        ctx.rect(-sz, -sz, sz * 2, sz * 2);
      } else if (s.lane === 1) {
        ctx.moveTo(0, -sz * 1.2);
        ctx.lineTo(sz * 1.1, 0);
        ctx.lineTo(0, sz * 1.2);
        ctx.lineTo(-sz * 1.1, 0);
        ctx.closePath();
      } else if (s.lane === 2) {
        ctx.arc(0, 0, sz, 0, Math.PI * 2);
      } else {
        ctx.moveTo(0, -sz * 1.3);
        ctx.lineTo(sz * 1.2, sz);
        ctx.lineTo(-sz * 1.2, sz);
        ctx.closePath();
      }
      ctx.stroke();

      ctx.globalAlpha = alpha * 0.4;
      ctx.fillStyle = col;
      ctx.fill();

      ctx.restore();
    }

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * dpr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state === 'playing') {
      const miniH = 6 * dpr;
      const miniY = H - 24 * dpr;
      const stepW = W / LOOP_STEPS;
      for (let i = 0; i < LOOP_STEPS; i++) {
        let any = false;
        for (let l = 0; l < LANES; l++) {
          if (loopPattern[i][l]) {
            ctx.fillStyle = LANE_COLORS[l];
            ctx.globalAlpha = 0.7;
            ctx.fillRect(i * stepW + 1, miniY - l * (miniH + 1), stepW - 2, miniH);
            any = true;
          }
        }
        if (!any) {
          ctx.fillStyle = dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
          ctx.fillRect(i * stepW + 1, miniY, stepW - 2, miniH);
        }
      }
      ctx.globalAlpha = 1;

      const playhead = ((elapsed * bpm / 60) * 4) % LOOP_STEPS;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(playhead * stepW, miniY - 20, 2 * dpr, 28);
    }

    for (let i = 0; i < floatTexts.length; i++) {
      const ft = floatTexts[i];
      ctx.save();
      ctx.globalAlpha = Math.min(1, ft.life);
      ctx.font = (14 * ft.scale * dpr) + 'px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = ft.color;
      ctx.shadowColor = ft.color;
      ctx.shadowBlur = 8 * dpr;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }

    ctx.restore();
  }

  function drawIdle() {
    resize();
    elapsed = 0;
    fogDensity = 0.25;
    draw(0);
  }

  startBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    initAudio();
    startGame();
  });

  restartBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    startGame();
  });

  canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    if (state === 'playing') onTap(e.clientX);
  });

  document.addEventListener('keydown', function(e) {
    if (state !== 'playing') return;
    const map = { '1': 0, '2': 1, '3': 2, '4': 3, ' ': null };
    if (e.key in map) {
      e.preventDefault();
      if (e.key === ' ') {
        const lane = Math.floor(Math.random() * LANES);
        tryHit(lane);
      } else {
        tryHit(map[e.key]);
      }
    }
    if (e.key === 'ArrowLeft') tryHit(0);
    if (e.key === 'ArrowDown') tryHit(1);
    if (e.key === 'ArrowRight') tryHit(2);
    if (e.key === 'ArrowUp') tryHit(3);
  });

  window.addEventListener('resize', function() {
    resize();
    if (state !== 'playing') drawIdle();
  });

  resize();
  drawIdle();
  requestAnimationFrame(function idleLoop() {
    if (state === 'title' || state === 'over') {
      fogParticles.forEach(function(f) {
        f.x += f.vx; f.y += f.vy;
        if (f.x < -f.r) f.x = W + f.r;
        if (f.x > W + f.r) f.x = -f.r;
      });
      pulsePhase = 0.3 + Math.sin(Date.now() / 600) * 0.2;
      draw(Date.now());
    }
    requestAnimationFrame(idleLoop);
  });
})();
</script>
</body>
</html>
