<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halos</title>
<style>
  :root {
    --bg: #f0f0f0;
    --fg: #0a0a0c;
    --accent: #0088ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0c;
      --fg: #f0f0f0;
      --accent: #00ffcc;
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f0f0;
      --fg: #0a0a0c;
      --accent: #0088ff;
    }
  }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
  }
  .screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(240, 240, 240, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    pointer-events: auto;
    transition: opacity 0.3s;
  }
  @media (prefers-color-scheme: dark) {
    .screen { background: rgba(10, 10, 12, 0.85); }
  }
  @media (prefers-color-scheme: light) {
    .screen { background: rgba(240, 240, 240, 0.85); }
  }
  h1 {
    font-weight: normal;
    letter-spacing: 8px;
    margin-bottom: 20px;
    font-size: 32px;
  }
  p {
    color: #666;
    margin-bottom: 50px;
    text-align: center;
    max-width: 280px;
    line-height: 1.6;
    font-size: 14px;
  }
  @media (prefers-color-scheme: dark) {
    p { color: #888; }
  }
  @media (prefers-color-scheme: light) {
    p { color: #666; }
  }
  button {
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 16px 48px;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 3px;
    cursor: pointer;
    border-radius: 2px;
    transition: transform 0.1s;
  }
  button:active {
    transform: scale(0.95);
  }
  .hidden { 
    opacity: 0; 
    pointer-events: none; 
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">
  <div class="screen" id="startScreen">
    <h1>HALOS</h1>
    <p>Swipe to peel iridescent identity halos.<br><br>Keep your privacy shield powered.<br><br>Do NOT expose the face beneath.</p>
    <button id="startBtn">INITIALIZE</button>
  </div>

  <div class="screen hidden" id="gameOverScreen">
    <h1 id="gameOverTitle">COMPROMISED</h1>
    <p id="finalScore" style="font-size: 18px; color: var(--fg);">Score: 0</p>
    <p id="gameOverReason" style="margin-top: -30px; margin-bottom: 50px;"></p>
    <button id="restartBtn">REBOOT</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const finalScoreEl = document.getElementById('finalScore');
const gameOverReasonEl = document.getElementById('gameOverReason');

let width, height;
let theme = {};
let bgCanvas = document.createElement('canvas');

function updateTheme() {
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  theme = {
    isLight: !isDark,
    bg: isDark ? '#0a0a0c' : '#f0f0f0',
    fg: isDark ? '#f0f0f0' : '#0a0a0c',
    fgRGB: isDark ? '240, 240, 240' : '10, 10, 12',
    shieldBg: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)',
    beamFill: isDark ? 'rgba(0, 255, 200, 0.1)' : 'rgba(0, 150, 255, 0.1)',
    beamLine: isDark ? 'rgba(0, 255, 200, 0.8)' : 'rgba(0, 150, 255, 0.8)',
    exposedFace: isDark ? '#ff3333' : '#cc0000',
    decoyRing: isDark ? '#ff5555' : '#aa0000',
    accent: isDark ? '#00ffcc' : '#0088ff'
  };
  drawBgPattern();
}

function drawBgPattern() {
  bgCanvas.width = 40;
  bgCanvas.height = 40;
  let bctx = bgCanvas.getContext('2d');
  bctx.fillStyle = theme.bg;
  bctx.fillRect(0, 0, 40, 40);
  bctx.fillStyle = theme.isLight ? 'rgba(0,0,0,0.03)' : 'rgba(255,255,255,0.03)';
  bctx.fillRect(0, 39, 40, 1);
  bctx.fillRect(39, 0, 1, 40);
}

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  drawBgPattern();
}

window.addEventListener('resize', resize);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
updateTheme();
resize();

// Audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  let t = audioCtx.currentTime;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'peel') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, t);
    osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
    gain.gain.setValueAtTime(0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
    osc.start(t);
    osc.stop(t + 0.1);
  } else if (type === 'expose') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(50, t + 0.3);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
    osc.start(t);
    osc.stop(t + 0.3);
  } else if (type === 'shatter') {
    let bufferSize = audioCtx.sampleRate * 0.2;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    let noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    let noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 1000;
    noise.connect(noiseFilter);
    noiseFilter.connect(gain);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
    noise.start(t);
  } else if (type === 'beam') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(50, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + 0.5);
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.5);
    osc.start(t);
    osc.stop(t + 0.5);
  } else if (type === 'clean') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1000, t);
    osc.frequency.exponentialRampToValueAtTime(2000, t + 0.2);
    gain.gain.setValueAtTime(0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
    osc.start(t);
    osc.stop(t + 0.2);
  } else if (type === 'error') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, t);
    osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
    gain.gain.setValueAtTime(0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
    osc.start(t);
    osc.stop(t + 0.1);
  }
}

// Game State
let state = 'MENU'; // MENU, PLAYING, GAMEOVER
let score = 0;
let shield = 50;
let gameTime = 0;
let difficulty = 1;
let hitPause = 0;
let shake = 0;

let walkers = [];
let beams = [];
let particles = [];
let shatterParticles = [];
let floatingTexts = [];
let flashes = [];

let nextWalkerId = 1;
let walkerSpawnTimer = 0;
let beamSpawnTimer = 5;

// Input State
let pointers = new Map();
let swipeSegments = [];
let activeStrokes = new Map();
let fadingStrokes = [];

function getIridescentColor(t, offset) {
  let h = 120 + Math.sin(t * 2 + offset) * 120;
  let l = theme.isLight ? '40%' : '60%';
  return `hsl(${h}, 80%, ${l})`;
}

function startGame() {
  initAudio();
  state = 'PLAYING';
  score = 0;
  shield = 50;
  gameTime = 0;
  difficulty = 1;
  walkers = [];
  beams = [];
  particles = [];
  shatterParticles = [];
  floatingTexts = [];
  flashes = [];
  walkerSpawnTimer = 1;
  beamSpawnTimer = 8;
  
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

// Input Handling
canvas.addEventListener('pointerdown', e => {
  if (state !== 'PLAYING') return;
  e.preventDefault();
  let pts = [{ x: e.clientX, y: e.clientY, age: 0 }];
  activeStrokes.set(e.pointerId, pts);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
});

canvas.addEventListener('pointermove', e => {
  if (state !== 'PLAYING') return;
  e.preventDefault();
  if (pointers.has(e.pointerId)) {
    let p = pointers.get(e.pointerId);
    swipeSegments.push({ x1: p.x, y1: p.y, x2: e.clientX, y2: e.clientY });
    p.x = e.clientX;
    p.y = e.clientY;
    
    let pts = activeStrokes.get(e.pointerId);
    if (pts) pts.push({ x: e.clientX, y: e.clientY, age: 0 });
  }
});

function endPointer(e) {
  if (state !== 'PLAYING') return;
  e.preventDefault();
  pointers.delete(e.pointerId);
  if (activeStrokes.has(e.pointerId)) {
    fadingStrokes.push(activeStrokes.get(e.pointerId));
    activeStrokes.delete(e.pointerId);
  }
}

canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function handleKeyDown(e) {
  if (state === 'MENU' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    startGame();
    return;
  }
  if (state === 'GAMEOVER' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    startGame();
    return;
  }
  if (state !== 'PLAYING') return;

  const cx = width / 2;
  const cy = height / 2;
  const len = 120;
  let x1 = cx, y1 = cy, x2 = cx, y2 = cy;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { x1 = cx + len; x2 = cx - len; }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { x1 = cx - len; x2 = cx + len; }
  else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { y1 = cy + len; y2 = cy - len; }
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { y1 = cy - len; y2 = cy + len; }
  else return;

  e.preventDefault();
  swipeSegments.push({ x1, y1, x2, y2 });
  fadingStrokes.push([{ x: x1, y: y1, age: 0 }, { x: x2, y: y2, age: 0 }]);
}

function handleKeyUp(e) {
  // reserved for future held-key controls
}

document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

function distSq(x1, y1, x2, y2) {
  return (x1 - x2) ** 2 + (y1 - y2) ** 2;
}

function distToSegmentSq(px, py, x1, y1, x2, y2) {
  let l2 = distSq(x1, y1, x2, y2);
  if (l2 === 0) return distSq(px, py, x1, y1);
  let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
  t = Math.max(0, Math.min(1, t));
  return distSq(px, py, x1 + t * (x2 - x1), y1 + t * (y2 - y1));
}

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, age: 0, maxAge: 1 });
}

function shatterDecoy(w) {
  for (let i = 0; i < 12; i++) {
    shatterParticles.push({
      x: w.x, y: w.y,
      vx: (Math.random() - 0.5) * 500,
      vy: (Math.random() - 0.5) * 500,
      age: 0, maxAge: 0.4 + Math.random() * 0.4,
      color: theme.decoyRing
    });
  }
}

function hitDecoy(w) {
  shatterDecoy(w);
  w.dead = true;
  shield -= 15;
  shake = 8;
  playSound('shatter');
  if (navigator.vibrate) navigator.vibrate([50, 50]);
  addFloatingText(w.x, w.y - 20, "DECOY", theme.decoyRing);
}

function exposeWalker(w) {
  w.exposed = true;
  shield -= 20;
  shake = 12;
  playSound('expose');
  if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
  addFloatingText(w.x, w.y - 20, "EXPOSED", theme.exposedFace);
}

function peelRing(w, r) {
  particles.push({
    x: w.x, y: w.y, r: r,
    targetX: 0, targetY: 63, // targetX updated in loop
    age: 0, maxAge: 0.35,
    color: getIridescentColor(gameTime, w.id)
  });
  playSound('peel');
  if (navigator.vibrate) navigator.vibrate(10);
  hitPause = 0.04;
}

function checkSwipes(x1, y1, x2, y2) {
  for (let w of walkers) {
    if (w.dead || w.cooldown > 0) continue;
    let r = 12 + w.rings * 10;
    if (w.rings === 0) r = 12;
    
    if (distToSegmentSq(w.x, w.y, x1, y1, x2, y2) <= r * r) {
      w.cooldown = 0.12;
      if (w.isDecoy) {
        hitDecoy(w);
      } else {
        if (w.rings > 0) {
          w.rings--;
          peelRing(w, r);
          if (w.rings === 0) {
            exposeWalker(w);
          }
        } else {
          shield -= 10;
          shake = 5;
          playSound('error');
          if (navigator.vibrate) navigator.vibrate(20);
        }
      }
    }
  }
}

function gameOver(reason) {
  state = 'GAMEOVER';
  playSound('beam');
  if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
  
  gameOverScreen.classList.remove('hidden');
  finalScoreEl.innerText = `SCORE: ${Math.floor(score)}`;
  gameOverReasonEl.innerText = reason;
}

let lastTime = 0;

function update(dt) {
  gameTime += dt;
  difficulty = 1 + gameTime / 30;
  
  // Shield drain
  shield -= 5 * difficulty * dt;
  if (shield <= 0) {
    gameOver("SHIELD DEPLETED");
    return;
  }
  
  // Spawns
  walkerSpawnTimer -= dt;
  if (walkerSpawnTimer <= 0) {
    walkerSpawnTimer = 1.5 / difficulty;
    let isDecoy = Math.random() < 0.15 + (difficulty * 0.02);
    let rings = Math.floor(Math.random() * 3) + 2;
    walkers.push({
      id: nextWalkerId++,
      x: Math.random() * (width - 80) + 40,
      y: -50,
      vy: height * 0.15 * difficulty,
      rings: rings,
      maxRings: rings,
      isDecoy: isDecoy,
      cooldown: 0,
      exposed: false,
      dead: false
    });
  }
  
  beamSpawnTimer -= dt;
  if (beamSpawnTimer <= 0) {
    beamSpawnTimer = 10 / Math.sqrt(difficulty);
    beams.push({
      y: -100,
      prevY: -100,
      vy: height * 0.4 * difficulty
    });
  }
  
  // Process Swipes
  for (let seg of swipeSegments) {
    checkSwipes(seg.x1, seg.y1, seg.x2, seg.y2);
  }
  swipeSegments = [];
  
  // Update Walkers
  for (let i = walkers.length - 1; i >= 0; i--) {
    let w = walkers[i];
    w.y += w.vy * dt;
    if (w.cooldown > 0) w.cooldown -= dt;
    
    if (w.y > height + 60) {
      w.dead = true;
      if (!w.isDecoy && w.rings === 1) {
        score += 50;
        shield = Math.min(100, shield + 10);
        addFloatingText(w.x, height - 30, "CLEAN", theme.accent);
        playSound('clean');
      }
    }
    if (w.dead) walkers.splice(i, 1);
  }
  
  // Update Beams
  for (let i = beams.length - 1; i >= 0; i--) {
    let b = beams[i];
    b.prevY = b.y;
    b.y += b.vy * dt;
    
    for (let w of walkers) {
      if (w.rings === 0 && w.y > b.prevY && w.y <= b.y) {
        gameOver("CAUGHT BY SCANNER");
        return;
      }
    }
    
    if (b.y > height + 200) beams.splice(i, 1);
  }
  
  // Update Particles
  let barWidth = width - 40;
  let currentBarX = 20 + barWidth * (Math.max(0, shield) / 100);
  
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.age += dt;
    p.targetX = currentBarX;
    if (p.age >= p.maxAge) {
      shield = Math.min(100, shield + 5);
      score += 10;
      flashes.push({ x: p.targetX, y: p.targetY, age: 0, maxAge: 0.2 });
      particles.splice(i, 1);
    }
  }
  
  for (let i = shatterParticles.length - 1; i >= 0; i--) {
    let p = shatterParticles[i];
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
    if (p.age >= p.maxAge) shatterParticles.splice(i, 1);
  }
  
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    ft.age += dt;
    ft.y -= 40 * dt;
    if (ft.age >= ft.maxAge) floatingTexts.splice(i, 1);
  }
  
  for (let i = flashes.length - 1; i >= 0; i--) {
    let f = flashes[i];
    f.age += dt;
    if (f.age >= f.maxAge) flashes.splice(i, 1);
  }
  
  // Update Strokes
  for (let pts of activeStrokes.values()) {
    for (let pt of pts) pt.age += dt;
    while (pts.length > 0 && pts[0].age > 0.3) pts.shift();
  }
  for (let i = fadingStrokes.length - 1; i >= 0; i--) {
    let pts = fadingStrokes[i];
    for (let pt of pts) pt.age += dt;
    while (pts.length > 0 && pts[0].age > 0.3) pts.shift();
    if (pts.length === 0) fadingStrokes.splice(i, 1);
  }
}

function draw() {
  ctx.fillStyle = ctx.createPattern(bgCanvas, 'repeat');
  ctx.fillRect(0, 0, width, height);
  
  if (shake > 0) {
    ctx.save();
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.9;
    if (shake < 0.5) shake = 0;
  }
  
  // Draw Beams
  for (let b of beams) {
    let grad = ctx.createLinearGradient(0, b.y - 150, 0, b.y);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, theme.beamFill);
    ctx.fillStyle = grad;
    ctx.fillRect(0, b.y - 150, width, 150);
    
    ctx.fillStyle = theme.beamLine;
    ctx.fillRect(0, b.y, width, 3);
  }
  
  // Draw Walkers
  for (let w of walkers) {
    ctx.save();
    ctx.translate(w.x, w.y);
    
    if (w.isDecoy) {
      for (let i = 1; i <= w.rings; i++) {
        let r = 12 + i * 10;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.strokeStyle = getIridescentColor(gameTime, i * 0.5 + w.id);
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    } else {
      if (w.rings > 0) {
        for (let i = 1; i <= w.rings; i++) {
          let r = 12 + i * 10;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.strokeStyle = getIridescentColor(gameTime, i * 0.5 + w.id);
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      } else {
        let pulse = Math.sin(gameTime * 15) * 2;
        ctx.beginPath();
        ctx.arc(0, 0, 12 + pulse, 0, Math.PI * 2);
        ctx.fillStyle = theme.exposedFace;
        ctx.fill();
        
        ctx.fillStyle = theme.bg;
        ctx.fillRect(-6, -2, 12, 4);
      }
    }
    ctx.restore();
  }
  
  // Draw Particles
  for (let p of shatterParticles) {
    let alpha = 1 - (p.age / p.maxAge);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  
  for (let p of particles) {
    let t = p.age / p.maxAge;
    let ease = t * t;
    let x = p.x + (p.targetX - p.x) * ease;
    let y = p.y + (p.targetY - p.y) * ease;
    let r = p.r * (1 - ease);
    
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  
  // Draw Strokes
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  function drawStroke(pts) {
    if (pts.length < 2) return;
    for (let i = 1; i < pts.length; i++) {
      let p1 = pts[i-1];
      let p2 = pts[i];
      let alpha = 1 - (p2.age / 0.3);
      if (alpha <= 0) continue;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = `rgba(${theme.fgRGB}, ${alpha})`;
      ctx.lineWidth = 4 * alpha;
      ctx.stroke();
    }
  }
  for (let pts of activeStrokes.values()) drawStroke(pts);
  for (let pts of fadingStrokes) drawStroke(pts);
  
  // Draw Flashes
  for (let f of flashes) {
    let alpha = 1 - (f.age / f.maxAge);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(f.x, f.y, 10 + f.age * 50, 0, Math.PI * 2);
    ctx.fillStyle = theme.fg;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // Draw HUD
  ctx.fillStyle = theme.fg;
  ctx.font = '24px ui-monospace, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(Math.floor(score).toString(), 20, 20);
  
  let barWidth = width - 40;
  ctx.fillStyle = theme.shieldBg;
  ctx.fillRect(20, 60, barWidth, 4);
  ctx.fillStyle = theme.fg;
  let currentBarWidth = barWidth * (Math.max(0, shield) / 100);
  ctx.fillRect(20, 60, currentBarWidth, 4);
  
  // Draw Floating Texts
  ctx.textAlign = 'center';
  ctx.font = 'bold 16px ui-monospace, monospace';
  for (let ft of floatingTexts) {
    let alpha = 1 - (ft.age / ft.maxAge);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
  
  if (shake > 0) {
    ctx.restore();
  }
}

function loop(time) {
  if (state !== 'PLAYING') return;
  requestAnimationFrame(loop);
  
  let dt = (time - lastTime) / 1000;
  lastTime = time;
  if (dt > 0.1) dt = 0.1;
  
  if (hitPause > 0) {
    hitPause -= dt;
    draw();
    return;
  }
  
  update(dt);
  if (state === 'PLAYING') {
    draw();
  }
}

</script>
