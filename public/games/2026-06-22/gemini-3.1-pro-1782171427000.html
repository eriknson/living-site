<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Cut</title>
<style>
:root {
  --bg-color: #E8DCC4;
  --text-color: #2A241D;
  --paper: #FDF6E3;
  --red: #D9382E;
  --green: #4A9144;
  --shadow: rgba(0,0,0,0.1);
  --overlay: rgba(232, 220, 196, 0.9);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #2C2621;
    --text-color: #E5D6B6;
    --paper: #D0C3A5;
    --shadow: rgba(0,0,0,0.4);
    --overlay: rgba(44, 38, 33, 0.9);
  }
}

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  width: 100dvw;
  height: 100dvh;
  overflow: hidden;
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  touch-action: none;
  user-select: none;
}

#game {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

#ui-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  display: flex;
  flex-direction: column;
}

.screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--overlay);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  pointer-events: auto;
  z-index: 10;
}

.card {
  background: var(--paper);
  padding: 2rem;
  border-radius: 8px;
  box-shadow: 8px 8px 0 var(--shadow);
  text-align: center;
  border: 2px solid rgba(0,0,0,0.1);
  max-width: 90%;
  box-sizing: border-box;
}

.instructions {
  text-align: left;
  margin: 1.5rem 0;
  font-size: 1.1rem;
  line-height: 1.8;
}

.swipe {
  font-weight: bold;
  background: var(--text-color);
  color: var(--bg-color);
  padding: 2px 6px;
  border-radius: 4px;
  display: inline-block;
  min-width: 50px;
  text-align: center;
}

h1 {
  font-size: 2.5rem;
  margin: 0 0 1rem 0;
  text-transform: uppercase;
  letter-spacing: 2px;
}

p { margin: 0; }

#hud {
  position: absolute;
  top: 70px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  font-weight: bold;
  z-index: 5;
  pointer-events: none;
  text-shadow: 2px 2px 0 var(--bg-color), -2px -2px 0 var(--bg-color), 2px -2px 0 var(--bg-color), -2px 2px 0 var(--bg-color);
}

button {
  pointer-events: auto;
  font-family: inherit;
  font-size: 1.5rem;
  padding: 1rem 2rem;
  background: var(--text-color);
  color: var(--bg-color);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--shadow);
  transition: transform 0.1s, box-shadow 0.1s;
  text-transform: uppercase;
  font-weight: bold;
  margin-top: 1rem;
  touch-action: manipulation;
}

button:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 var(--shadow);
}
</style>
</head>
<body>

<div id="ui-layer">
  <div id="start-screen" class="screen">
    <div class="card">
      <h1>PAPER CUT</h1>
      <p>Sort the job applications!</p>
      <div class="instructions">
        <div><span class="swipe">LEFT</span> = REJECT 🚩</div>
        <div><span class="swipe">RIGHT</span> = HIRE 🌟</div>
        <div><span class="swipe">UP</span> = SHRED 🗑️ (Trivia)</div>
      </div>
      <button data-smoke="start">Start Shift</button>
    </div>
  </div>
  <div id="game-over-screen" class="screen" style="display: none;">
    <div class="card">
      <h1>FIRED!</h1>
      <p>Inbox Overflowed or Misfiled!</p>
      <p style="margin-top: 1rem; font-size: 1.2rem;">Score: <strong id="final-score">0</strong></p>
      <button data-smoke="restart">Play Again</button>
    </div>
  </div>
  <div id="hud" style="display: none;">
    <div id="score">SCORE: 0</div>
    <div id="strikes">⭐⭐⭐</div>
  </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

const HIRE_TEXTS = ["YC Alum", "10x Engineer", "Reads Docs", "Vim User", "Writes Tests", "Rust Developer", "Typescript Pro", "Shipped a Game", "Mentors Juniors", "Fixes Bugs", "Optimizes DB", "Knows WebGL", "Perfect SAT Score"];
const REJECT_TEXTS = ["Ideas Guy", "Crypto Bro", "Spaghetti Coder", "Misses Deadlines", "Hates CSS", "Copy/Paster", "Doesn't Test", "Ghosted Last Job", "Toxic Teammate", "Buzzword Salad", "Never Ships", "HTML Programmer"];
const SHRED_TEXTS = ["Loves Pizza", "Capricorn", "Owns 3 Cats", "Plays Guitar", "Can Backflip", "Fav Color Blue", "Long Walks", "Likes Summer", "Fred again.. fan", "Drinks Coffee", "Has a Podcast"];

let gameState = 'start';
let score = 0;
let strikes = 0;
let papers = [];
let particles = [];
let paperId = 0;

let spawnTimer = 0;
let currentSpawnInterval = 2.0;
let baseFallSpeed = 50;

let draggedPaper = null;
let dragOffset = { x: 0, y: 0 };
let history = [];

let screenShake = 0;
let lastTime = performance.now();

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new AudioContext();
    } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(()=>{});
  }
}

function playSound(type) {
  if (!audioCtx || audioCtx.state === 'suspended') return;
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.start(t);
      osc.stop(t + 0.1);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(50, t + 0.2);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
      osc.start(t);
      osc.stop(t + 0.2);
    } else if (type === 'gameover') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, t);
      osc.frequency.exponentialRampToValueAtTime(50, t + 1.0);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 1.0);
      osc.start(t);
      osc.stop(t + 1.0);
    }
  } catch(e) {}
}

function getCssVars() {
  const styles = getComputedStyle(document.documentElement);
  return {
    bgColor: styles.getPropertyValue('--bg-color').trim() || '#E8DCC4',
    textColor: styles.getPropertyValue('--text-color').trim() || '#2A241D',
    paper: styles.getPropertyValue('--paper').trim() || '#FDF6E3',
    red: styles.getPropertyValue('--red').trim() || '#D9382E',
    green: styles.getPropertyValue('--green').trim() || '#4A9144'
  };
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);

function startGame() {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  gameState = 'playing';
  score = 0;
  strikes = 0;
  papers = [];
  particles = [];
  spawnTimer = 0;
  draggedPaper = null;
  history = [];
  updateDifficulty();
  updateHUD();
  lastTime = performance.now();
}

function updateDifficulty() {
  let level = Math.floor(score / 50);
  currentSpawnInterval = Math.max(0.6, 2.0 - (level * 0.2));
  baseFallSpeed = Math.min(300, 50 + (level * 20));
}

function spawnPaper() {
  let r = Math.random();
  let type, text;
  if (r < 0.33) {
    type = 1; text = HIRE_TEXTS[Math.floor(Math.random() * HIRE_TEXTS.length)];
  } else if (r < 0.66) {
    type = 2; text = REJECT_TEXTS[Math.floor(Math.random() * REJECT_TEXTS.length)];
  } else {
    type = 3; text = SHRED_TEXTS[Math.floor(Math.random() * SHRED_TEXTS.length)];
  }

  papers.push({
    id: ++paperId,
    type,
    text,
    x: canvas.width / 2 + (Math.random() * 60 - 30),
    y: 80,
    w: Math.min(260, canvas.width * 0.7),
    h: 60,
    vx: 0,
    vy: baseFallSpeed,
    rotation: (Math.random() - 0.5) * 0.2,
    vr: 0,
    thrown: false,
    swayOffset: Math.random() * Math.PI * 2
  });
}

function spawnStamp(text, x, y, color) {
  particles.push({
    type: 'stamp', text, x, y, color,
    life: 0.8, maxLife: 0.8,
    rotation: (Math.random() - 0.5) * 0.4,
    scale: 1.2
  });
}

function spawnX(x, y) {
  particles.push({
    type: 'text', text: '❌', x, y, color: '#f00',
    life: 1.0, maxLife: 1.0,
    vy: -50, vx: 0,
    scale: 1
  });
}

function spawnShreds(x, y) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      type: 'shred',
      x: x + (Math.random() - 0.5) * 80,
      y: y,
      vx: (Math.random() - 0.5) * 200,
      vy: Math.random() * 200 + 100,
      vr: (Math.random() - 0.5) * 10,
      life: 1.0, maxLife: 1.0,
      w: 10 + Math.random() * 15,
      h: 20 + Math.random() * 20
    });
  }
}

function strike() {
  strikes++;
  screenShake = 15;
  if (typeof navigator !== 'undefined' && navigator.vibrate) {
    try { navigator.vibrate(200); } catch(e){}
  }
  updateHUD();
  if (strikes >= 3) {
    gameOver();
  }
}

function gameOver() {
  gameState = 'gameover';
  document.getElementById('game-over-screen').style.display = 'flex';
  document.getElementById('final-score').innerText = score;
  playSound('gameover');
}

function updateHUD() {
  document.getElementById('score').innerText = `SCORE: ${score}`;
  let stars = '';
  for(let i=0; i<3-strikes; i++) stars += '⭐';
  for(let i=0; i<strikes; i++) stars += '❌';
  document.getElementById('strikes').innerText = stars;
}

// Input Handling
function handlePointerDown(px, py) {
  if (gameState !== 'playing') return;
  let hit = null;
  // Hit exact paper
  for (let i = papers.length - 1; i >= 0; i--) {
    let p = papers[i];
    if (px > p.x - p.w/2 - 30 && px < p.x + p.w/2 + 30 &&
        py > p.y - p.h/2 - 30 && py < p.y + p.h/2 + 30) {
      hit = p;
      break;
    }
  }
  // Fallback to lowest non-thrown paper
  if (!hit && papers.length > 0) {
    let lowest = null;
    for (let p of papers) {
      if (!p.thrown && (!lowest || p.y > lowest.y)) lowest = p;
    }
    hit = lowest;
  }

  if (hit) {
    draggedPaper = hit;
    dragOffset.x = hit.x - px;
    dragOffset.y = hit.y - py;
    hit.thrown = false;
    hit.vx = 0; hit.vy = 0; hit.vr = 0;
    history = [{x: px, y: py, t: performance.now()}];
  }
}

function handlePointerMove(px, py) {
  if (draggedPaper) {
    draggedPaper.x = px + dragOffset.x;
    draggedPaper.y = py + dragOffset.y;
    history.push({x: px, y: py, t: performance.now()});
    if (history.length > 5) history.shift();
  }
}

function handlePointerUp(px, py) {
  if (draggedPaper) {
    let now = performance.now();
    if (history.length > 1) {
      let oldest = history[0];
      let dt = (now - oldest.t) / 1000;
      if (dt > 0.01) {
        draggedPaper.vx = (px - oldest.x) / dt;
        draggedPaper.vy = (py - oldest.y) / dt;
      } else {
        draggedPaper.vx = 0;
        draggedPaper.vy = baseFallSpeed;
      }
    } else {
      draggedPaper.vx = 0;
      draggedPaper.vy = baseFallSpeed;
    }

    let speed = Math.hypot(draggedPaper.vx, draggedPaper.vy);
    if (speed < 150) {
      draggedPaper.vx = 0;
      draggedPaper.vy = baseFallSpeed;
      draggedPaper.thrown = false;
    } else {
      draggedPaper.vr = draggedPaper.vx * 0.002;
      draggedPaper.thrown = true;
    }
    draggedPaper = null;
  }
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  let rect = canvas.getBoundingClientRect();
  handlePointerDown(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  let rect = canvas.getBoundingClientRect();
  handlePointerMove(e.clientX - rect.left, e.clientY - rect.top);
});
const releasePointer = e => {
  e.preventDefault();
  let rect = canvas.getBoundingClientRect();
  handlePointerUp(e.clientX - rect.left, e.clientY - rect.top);
};
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('pointerout', releasePointer);

// Prevent scroll hijacking on mobile
canvas.addEventListener('touchstart', e => e.preventDefault(), {passive: false});
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

document.querySelector('[data-smoke="start"]').addEventListener('click', e => {
  e.stopPropagation();
  if (gameState !== 'playing') startGame();
});
document.querySelector('[data-smoke="restart"]').addEventListener('click', e => {
  e.stopPropagation();
  if (gameState !== 'playing') startGame();
});

function update(dt) {
  if (gameState === 'playing') {
    spawnTimer += dt;
    if (spawnTimer >= currentSpawnInterval) {
      spawnPaper();
      spawnTimer = 0;
    }

    let trayWidth = Math.max(40, canvas.width * 0.15);

    for (let i = papers.length - 1; i >= 0; i--) {
      let p = papers[i];

      if (!p.thrown && p !== draggedPaper) {
        p.vy = baseFallSpeed;
        p.y += p.vy * dt;
        p.x += Math.sin(performance.now()/1000 * 2 + p.swayOffset) * 15 * dt;
      } else if (p.thrown) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rotation += p.vr * dt;
      }

      let processed = false;
      let correct = false;

      if (p.x < trayWidth) {
        processed = true;
        correct = (p.type === 2);
        if (correct) spawnStamp('REJECT', p.x, p.y, getCssVars().red);
      } else if (p.x > canvas.width - trayWidth) {
        processed = true;
        correct = (p.type === 1);
        if (correct) spawnStamp('HIRE', p.x, p.y, getCssVars().green);
      } else if (p.y < 40 && (p.vy < -50 || p === draggedPaper)) {
        processed = true;
        correct = (p.type === 3);
        if (correct) spawnShreds(p.x, p.y);
      } else if (p.y > canvas.height - 30) {
        processed = true;
        correct = false; // Always a strike
      }

      if (processed) {
        if (p === draggedPaper) draggedPaper = null;
        if (correct) {
          score += 10;
          updateDifficulty();
          updateHUD();
          playSound('correct');
        } else {
          strike();
          spawnX(p.x, p.y);
          playSound('wrong');
        }
        papers.splice(i, 1);
      }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    if (p.type === 'text') p.y += p.vy * dt;
    if (p.type === 'shred') {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rotation = (p.rotation || 0) + p.vr * dt;
    }
  }
}

function drawPaper(ctx, p, cssVars) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(-p.w/2 + 4, -p.h/2 + 4, p.w, p.h);

  // Paper
  ctx.fillStyle = cssVars.paper;
  ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);

  // Border
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 1;
  ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);

  // Text
  ctx.fillStyle = cssVars.textColor;
  ctx.font = 'bold 16px ui-monospace, SFMono-Regular, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  let metrics = ctx.measureText(p.text);
  if (metrics.width > p.w - 20) {
    let scale = (p.w - 20) / metrics.width;
    ctx.scale(scale, scale);
  }
  ctx.fillText(p.text, 0, 0);

  ctx.restore();
}

function drawDesk(ctx, w, h, cssVars) {
  ctx.fillStyle = cssVars.bgColor;
  ctx.fillRect(0, 0, w, h);

  let trayWidth = Math.max(40, w * 0.15);
  let dragL = draggedPaper && draggedPaper.x < trayWidth * 2;
  let dragR = draggedPaper && draggedPaper.x > w - trayWidth * 2;
  let dragT = draggedPaper && draggedPaper.y < 100;

  // Left Tray
  ctx.fillStyle = cssVars.red;
  ctx.globalAlpha = dragL ? 0.25 : 0.1;
  ctx.fillRect(0, 0, trayWidth, h);
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.translate(trayWidth/2, h/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillStyle = cssVars.red;
  ctx.font = 'bold 24px monospace';
  ctx.textAlign = 'center';
  ctx.globalAlpha = dragL ? 0.6 : 0.3;
  ctx.fillText("REJECT", 0, 0);
  ctx.restore();

  // Right Tray
  ctx.fillStyle = cssVars.green;
  ctx.globalAlpha = dragR ? 0.25 : 0.1;
  ctx.fillRect(w - trayWidth, 0, trayWidth, h);
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.translate(w - trayWidth/2, h/2);
  ctx.rotate(Math.PI/2);
  ctx.fillStyle = cssVars.green;
  ctx.font = 'bold 24px monospace';
  ctx.textAlign = 'center';
  ctx.globalAlpha = dragR ? 0.6 : 0.3;
  ctx.fillText("HIRE", 0, 0);
  ctx.restore();

  // Top Shredder
  ctx.fillStyle = dragT ? 'rgba(0,0,0,0.3)' : 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, 0, w, 60);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(w/2 - 100, 25, 200, 10);
  ctx.fillStyle = cssVars.textColor;
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.globalAlpha = dragT ? 0.8 : 0.4;
  ctx.fillText("SHREDDER", w/2, 50);
  ctx.globalAlpha = 1;

  // Bottom Inbox
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, h - 40, w, 40);
  ctx.fillStyle = cssVars.textColor;
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.5;
  ctx.fillText("INBOX", w/2, h - 15);
  ctx.globalAlpha = 1;
}

function draw() {
  const cssVars = getCssVars();
  ctx.fillStyle = cssVars.bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    screenShake -= 0.5;
    if (screenShake < 0) screenShake = 0;
  }

  drawDesk(ctx, canvas.width, canvas.height, cssVars);

  let drawnPapers = papers.slice().sort((a,b) => {
    if (a === draggedPaper) return 1;
    if (b === draggedPaper) return -1;
    return a.id - b.id;
  });

  for (let p of drawnPapers) {
    drawPaper(ctx, p, cssVars);
  }

  for (let p of particles) {
    let alpha = p.life / p.maxLife;
    if (p.type === 'stamp') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      let s = p.scale - (1 - alpha) * 0.3;
      ctx.scale(s, s);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.font = 'bold 28px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, 0, 0);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 4;
      let metrics = ctx.measureText(p.text);
      ctx.strokeRect(-metrics.width/2 - 10, -20, metrics.width + 20, 40);
      ctx.restore();
    } else if (p.type === 'text') {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = '48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    } else if (p.type === 'shred') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = cssVars.paper;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.1)';
      ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
  }

  ctx.restore();
}

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  let dt = (time - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = time;

  update(dt);
  draw();
}

resize();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
