<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Dawn</title>
<style>
:root {
  --ui-bg: rgba(255,255,255,0.92);
  --ui-text: #1a1a1a;
  --ui-muted: #5a5a5a;
  --ui-accent: #00c9a7;
  --ui-btn-bg: #1a1a1a;
  --ui-btn-text: #f5f5f5;
  --hud-text: #1a1a1a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ui-bg: rgba(18,18,20,0.94);
    --ui-text: #f0f0f0;
    --ui-muted: #9a9a9a;
    --ui-accent: #00e8c0;
    --ui-btn-bg: #f0f0f0;
    --ui-btn-text: #121214;
    --hud-text: #e8e8e8;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100dvw;
  height: 100dvh;
  overflow: hidden;
  background: #8a9098;
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#game {
  display: block;
  width: 100dvw;
  height: 100dvh;
  touch-action: none;
}
#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: max(12px, env(safe-area-inset-top)) 16px 8px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 10;
  color: var(--hud-text);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-shadow: 0 1px 3px rgba(0,0,0,0.25);
}
.hud-block { display: flex; flex-direction: column; gap: 2px; }
.hud-label { opacity: 0.65; font-size: 9px; text-transform: uppercase; }
.hud-value { font-size: 15px; font-weight: 600; }
#progress-bar {
  position: fixed;
  top: max(52px, calc(env(safe-area-inset-top) + 40px));
  left: 16px; right: 16px;
  height: 3px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  pointer-events: none;
  z-index: 10;
  overflow: hidden;
}
#progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff6b35, #ffd166);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 24px;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 20;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.overlay.hidden { opacity: 0; visibility: hidden; }
.overlay-title {
  font-size: clamp(22px, 6vw, 32px);
  font-weight: 700;
  letter-spacing: 0.12em;
  color: #fff;
  text-align: center;
  text-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
.overlay-sub {
  font-size: clamp(11px, 3vw, 13px);
  color: rgba(255,255,255,0.75);
  text-align: center;
  max-width: 280px;
  line-height: 1.5;
  letter-spacing: 0.04em;
}
.overlay-card {
  background: var(--ui-bg);
  color: var(--ui-text);
  border-radius: 12px;
  padding: 20px 24px;
  max-width: 300px;
  width: 100%;
  text-align: center;
  pointer-events: auto;
}
.overlay-card p { font-size: 12px; color: var(--ui-muted); line-height: 1.6; margin-bottom: 16px; }
.overlay-card .score-big {
  font-size: 28px;
  font-weight: 700;
  color: var(--ui-accent);
  margin-bottom: 4px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  min-width: 160px;
  padding: 12px 28px;
  border: none;
  border-radius: 8px;
  background: var(--ui-btn-bg);
  color: var(--ui-btn-text);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  pointer-events: auto;
  transition: transform 0.12s ease, opacity 0.12s ease;
}
.btn:active { transform: scale(0.96); opacity: 0.85; }
#combo-flash {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(18px, 5vw, 28px);
  font-weight: 700;
  color: #00e8c0;
  text-shadow: 0 0 20px rgba(0,232,192,0.6);
  pointer-events: none;
  z-index: 15;
  opacity: 0;
  letter-spacing: 0.08em;
}
#combo-flash.show { animation: comboPop 0.5s ease forwards; }
#judge-flash {
  position: fixed;
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(14px, 4vw, 20px);
  font-weight: 700;
  letter-spacing: 0.14em;
  pointer-events: none;
  z-index: 15;
  opacity: 0;
}
#judge-flash.show { animation: judgePop 0.45s ease forwards; }
@keyframes comboPop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
}
@keyframes judgePop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
}
.loop-bar {
  display: flex;
  gap: 5px;
  margin-top: 4px;
  pointer-events: none;
}
.loop-cell {
  width: 8px;
  height: 22px;
  border-radius: 2px;
  background: rgba(255,255,255,0.2);
  transition: background 0.3s, transform 0.2s;
}
.loop-cell.on {
  background: linear-gradient(180deg, #ffd166, #ff6b35);
  transform: scaleY(1.12);
}
#tap-zone-hint {
  position: fixed;
  bottom: max(80px, calc(env(safe-area-inset-bottom) + 60px));
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  pointer-events: none;
  z-index: 10;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hud-block">
    <span class="hud-label">Loop</span>
    <span class="hud-value" id="hud-loop">0 / 8</span>
  </div>
  <div class="hud-block" style="align-items:center">
    <span class="hud-label">Combo</span>
    <span class="hud-value" id="hud-combo">0</span>
  </div>
  <div class="hud-block" style="align-items:flex-end">
    <span class="hud-label">BPM · Time</span>
    <span class="hud-value"><span id="hud-bpm">86</span> · <span id="hud-time">60</span></span>
  </div>
</div>
<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="combo-flash"></div>
<div id="judge-flash"></div>
<div id="tap-zone-hint">Tap on the beat</div>

<div class="overlay" id="title-overlay">
  <div class="overlay-title">STUTTER DAWN</div>
  <div class="overlay-sub">Tap neon beats on the foggy boardwalk.<br>Lock 8 loops before the fog wins.</div>
  <div class="loop-bar" id="loop-bar"></div>
  <button class="btn" data-smoke="start" id="btn-start">Begin Loop</button>
</div>

<div class="overlay hidden" id="end-overlay">
  <div class="overlay-card">
    <div class="score-big" id="end-title">Sunrise</div>
    <p id="end-msg">You caught the dawn.</p>
    <button class="btn" data-smoke="restart" id="btn-restart">Play Again</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var hudLoop = document.getElementById('hud-loop');
  var hudCombo = document.getElementById('hud-combo');
  var hudTime = document.getElementById('hud-time');
  var hudBpm = document.getElementById('hud-bpm');
  var progressFill = document.getElementById('progress-fill');
  var titleOverlay = document.getElementById('title-overlay');
  var endOverlay = document.getElementById('end-overlay');
  var endTitle = document.getElementById('end-title');
  var endMsg = document.getElementById('end-msg');
  var comboFlash = document.getElementById('combo-flash');
  var judgeFlash = document.getElementById('judge-flash');
  var loopBar = document.getElementById('loop-bar');
  var tapHint = document.getElementById('tap-zone-hint');
  var btnStart = document.getElementById('btn-start');
  var btnRestart = document.getElementById('btn-restart');

  var W = 360, H = 640;
  var state = 'title';
  var dpr = 1;
  var lastFrame = 0;
  var animId = 0;

  var LOOPS_TO_WIN = 8;
  var BEATS_PER_LOOP = 8;
  var ROUND_TIME = 60;
  var START_BPM = 86;
  var MAX_BPM = 132;
  var MAX_MISSES = 8;
  var PERFECT_MS = 55;
  var GOOD_MS = 110;

  var audioCtx = null;
  var masterGain = null;

  var skyLevel = 0;
  var loopsDone = 0;
  var beatsInLoop = 0;
  var combo = 0;
  var maxCombo = 0;
  var misses = 0;
  var score = 0;
  var timeLeft = ROUND_TIME;
  var bpm = START_BPM;
  var ghostChance = 0;
  var driftAmount = 0;

  var notes = [];
  var particles = [];
  var waveforms = [];
  var nextBeatIdx = 0;
  var songStart = 0;
  var beatInterval = 0.6;
  var spawnAhead = 2.5;
  var hitLineX = 0;
  var laneY = 0;
  var shakeT = 0;
  var hitPause = 0;
  var loopFlash = 0;
  var stutterPhase = 0;

  var SKY_PALETTES = [
    { top: '#6b7280', mid: '#8a9098', bot: '#9ca3af', fog: 0.85, sun: 0 },
    { top: '#7a8490', mid: '#949aa4', bot: '#a8aeb6', fog: 0.72, sun: 0.08 },
    { top: '#8a96a4', mid: '#a8b0bc', bot: '#c0c8d0', fog: 0.58, sun: 0.18 },
    { top: '#a0a8b8', mid: '#c0b8b0', bot: '#d8c8b8', fog: 0.42, sun: 0.32 },
    { top: '#c0a898', mid: '#e0b888', bot: '#f0c878', fog: 0.28, sun: 0.5 },
    { top: '#e0a070', mid: '#f0b060', bot: '#ffd080', fog: 0.15, sun: 0.72 },
    { top: '#f08050', mid: '#ffa060', bot: '#ffc880', fog: 0.06, sun: 0.88 },
    { top: '#ff6030', mid: '#ff9040', bot: '#ffd060', fog: 0, sun: 1 },
    { top: '#ff5020', mid: '#ff8040', bot: '#ffe080', fog: 0, sun: 1 }
  ];

  function bpmAtLoop(loop) {
    return START_BPM + ((MAX_BPM - START_BPM) * Math.min(loop, LOOPS_TO_WIN)) / LOOPS_TO_WIN;
  }

  function beatTimeForIdx(idx) {
    var t = 0;
    for (var i = 0; i < idx; i++) {
      t += 60 / bpmAtLoop(Math.floor(i / BEATS_PER_LOOP));
    }
    return t;
  }

  function beatIntervalAt(idx) {
    return 60 / bpmAtLoop(Math.floor(idx / BEATS_PER_LOOP));
  }

  function buildLoopBar() {
    if (!loopBar) return;
    loopBar.innerHTML = '';
    for (var i = 0; i < LOOPS_TO_WIN; i++) {
      var c = document.createElement('div');
      c.className = 'loop-cell';
      c.dataset.idx = String(i);
      loopBar.appendChild(c);
    }
  }

  function updateLoopBar() {
    if (!loopBar) return;
    var cells = loopBar.querySelectorAll('.loop-cell');
    for (var i = 0; i < cells.length; i++) {
      cells[i].classList.toggle('on', i < loopsDone);
    }
  }

  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, type, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || 0.3, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    } catch (e) {}
  }

  function playKick() { playTone(80, 0.12, 'sine', 0.5); playTone(40, 0.08, 'triangle', 0.2); }
  function playSnare() { playTone(200, 0.06, 'square', 0.15); playTone(400, 0.04, 'sine', 0.1); }
  function playHiHat() { playTone(8000, 0.03, 'square', 0.06); }
  function playPerfect() { playTone(880, 0.1, 'sine', 0.2); playTone(1320, 0.08, 'sine', 0.12); }
  function playGood() { playTone(660, 0.08, 'sine', 0.15); }
  function playMiss() { playTone(150, 0.15, 'sawtooth', 0.12); }
  function playLoopLock() {
    playTone(440, 0.15, 'sine', 0.25);
    playTone(554, 0.15, 'sine', 0.2);
    playTone(659, 0.2, 'sine', 0.18);
  }
  function playWin() {
    [440, 554, 659, 880].forEach(function (f, i) {
      setTimeout(function () { playTone(f, 0.25, 'sine', 0.2); }, i * 120);
    });
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    if (canvas) {
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
    }
    hitLineX = W * 0.38;
    laneY = H * 0.58;
    initWaveforms();
  }

  function initWaveforms() {
    waveforms = [];
    for (var i = 0; i < 40; i++) {
      waveforms.push({
        x: (i / 40) * W * 1.4 - W * 0.1,
        amp: 8 + Math.random() * 18,
        freq: 0.02 + Math.random() * 0.03,
        phase: Math.random() * Math.PI * 2,
        neon: Math.random() > 0.6
      });
    }
  }

  function resetGame() {
    skyLevel = 0;
    loopsDone = 0;
    beatsInLoop = 0;
    combo = 0;
    maxCombo = 0;
    misses = 0;
    score = 0;
    timeLeft = ROUND_TIME;
    bpm = START_BPM;
    ghostChance = 0;
    driftAmount = 0;
    notes = [];
    particles = [];
    nextBeatIdx = 0;
    beatInterval = 60 / bpm;
    songStart = audioCtx ? audioCtx.currentTime + 0.3 : performance.now() / 1000 + 0.3;
    shakeT = 0;
    hitPause = 0;
    loopFlash = 0;
    stutterPhase = 0;
    updateHUD();
    updateLoopBar();
    progressFill.style.width = '0%';
  }

  function updateHUD() {
    if (hudLoop) hudLoop.textContent = loopsDone + ' / ' + LOOPS_TO_WIN;
    if (hudCombo) hudCombo.textContent = String(combo);
    if (hudTime) hudTime.textContent = String(Math.ceil(timeLeft));
    if (hudBpm) hudBpm.textContent = String(Math.round(bpm));
    progressFill.style.width = ((loopsDone / LOOPS_TO_WIN) * 100) + '%';
  }

  function getSongTime() {
    if (audioCtx) return audioCtx.currentTime - songStart;
    return performance.now() / 1000 - songStart;
  }

  function isStutterBeat(idx) {
    return idx % 7 === 3 || idx % 11 === 8;
  }

  function spawnNote(beatIdx) {
    var beatTime = beatTimeForIdx(beatIdx);
    var isGhost = loopsDone >= 2 && Math.random() < ghostChance;
    var isStutter = !isGhost && isStutterBeat(beatIdx);
    var drift = loopsDone >= 1 ? (Math.random() - 0.5) * driftAmount : 0;
    notes.push({
      beatIdx: beatIdx,
      hitTime: beatTime + drift,
      isGhost: isGhost,
      isStutter: isStutter,
      hit: false,
      judged: false,
      pulse: 0,
      snapY: laneY + (Math.random() - 0.5) * 30
    });
  }

  function ensureNotes() {
    var st = getSongTime();
    while (nextBeatIdx < 200 && beatTimeForIdx(nextBeatIdx) < st + spawnAhead) {
      spawnNote(nextBeatIdx);
      nextBeatIdx++;
    }
  }

  function noteXAt(note, t) {
    var dt = note.hitTime - t;
    var iv = beatIntervalAt(note.beatIdx);
    var pxPerSec = (hitLineX + 60) / Math.max(iv * 3.5, 0.4);
    return hitLineX + dt * pxPerSec;
  }

  function spawnParticles(x, y, color, n) {
    for (var i = 0; i < (n || 8); i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 30,
        life: 0.4 + Math.random() * 0.3,
        maxLife: 0.7,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function showJudge(text, color) {
    if (!judgeFlash) return;
    judgeFlash.textContent = text;
    judgeFlash.style.color = color || '#00e8c0';
    judgeFlash.classList.remove('show');
    void judgeFlash.offsetWidth;
    judgeFlash.classList.add('show');
  }

  function flashCombo(text) {
    if (!comboFlash) return;
    comboFlash.textContent = text;
    comboFlash.classList.remove('show');
    void comboFlash.offsetWidth;
    comboFlash.classList.add('show');
  }

  function registerHit(quality, note) {
    note.hit = true;
    note.judged = true;
    note.pulse = 1;

    if (quality === 'perfect') {
      combo++;
      score += 100 + combo * 10;
      playPerfect();
      vibrate(12);
      spawnParticles(hitLineX, note.snapY, '#00e8c0', 12);
      showJudge('PERFECT', '#00e8c0');
      if (combo % 8 === 0) flashCombo(combo + 'x STREAK');
    } else {
      combo = Math.max(0, combo - 1);
      score += 40;
      playGood();
      vibrate(6);
      spawnParticles(hitLineX, note.snapY, '#ffd166', 6);
      showJudge('GOOD', '#ffd166');
    }

    if (combo > maxCombo) maxCombo = combo;
    beatsInLoop++;

  if (beatsInLoop >= BEATS_PER_LOOP) {
      beatsInLoop = 0;
      loopsDone++;
      skyLevel = Math.min(loopsDone, SKY_PALETTES.length - 1);
      loopFlash = 1;
      playLoopLock();
      vibrate(30);
      bpm = bpmAtLoop(loopsDone);
      beatInterval = 60 / bpm;
      ghostChance = Math.min(0.35, loopsDone * 0.045);
      driftAmount = Math.min(0.1, loopsDone * 0.012);
      flashCombo('LOOP LOCKED');
      updateLoopBar();

      if (loopsDone >= LOOPS_TO_WIN) {
        endGame(true);
        return;
      }
    }

    hitPause = 0.04;
    updateHUD();
  }

  function registerMiss(note) {
    if (note && note.judged) return;
    if (note) { note.judged = true; note.hit = false; }
    combo = 0;
    misses++;
    playMiss();
    vibrate(40);
    shakeT = 0.2;
    showJudge(note && note.isGhost ? 'GHOST!' : 'MISS', '#ff5555');
    spawnParticles(hitLineX, laneY, '#ff4444', 5);
    updateHUD();
    if (misses >= MAX_MISSES) endGame(false);
  }

  function tryHit() {
    if (state !== 'playing') return;
    var st = getSongTime();
    var best = null;
    var bestDiff = Infinity;

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged || n.hit) continue;
      var diff = Math.abs(st - n.hitTime);
      if (diff < GOOD_MS / 1000 + 0.05 && diff < bestDiff) {
        bestDiff = diff;
        best = n;
      }
    }

    if (!best) {
      registerMiss(null);
      return;
    }

    if (best.isGhost) {
      registerMiss(best);
      return;
    }

    if (bestDiff <= PERFECT_MS / 1000) {
      registerHit('perfect', best);
    } else if (bestDiff <= GOOD_MS / 1000) {
      registerHit('good', best);
    } else {
      registerMiss(best);
    }
  }

  function autoMissCheck() {
    var st = getSongTime();
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged) continue;
      if (st - n.hitTime > GOOD_MS / 1000 + 0.08) {
        if (!n.isGhost) registerMiss(n);
        else n.judged = true;
      }
    }
    notes = notes.filter(function (n) { return st - n.hitTime < 3; });
  }

  function playBeatSound(beatIdx) {
    if (beatIdx % 4 === 0) playKick();
    else if (beatIdx % 4 === 2) playSnare();
    else playHiHat();
  }

  var lastBeatPlayed = -1;
  function checkBeatSounds() {
    var st = getSongTime();
    var curBeat = -1;
    for (var b = lastBeatPlayed + 1; b < nextBeatIdx; b++) {
      if (beatTimeForIdx(b) <= st) curBeat = b;
      else break;
    }
    if (curBeat > lastBeatPlayed) {
      for (var j = lastBeatPlayed + 1; j <= curBeat; j++) {
        if (j >= 0) playBeatSound(j);
      }
      lastBeatPlayed = curBeat;
    }
  }

  function endGame(won) {
    state = 'ended';
    if (won) {
      playWin();
      endTitle.textContent = 'Sunrise';
      endMsg.textContent = 'Score ' + score + ' · Max combo ' + maxCombo + '. The fog lifted.';
    } else {
      endTitle.textContent = 'Fog Holds';
      endMsg.textContent = 'Score ' + score + ' · ' + loopsDone + ' loops locked. Try again.';
    }
    endOverlay.classList.remove('hidden');
    if (tapHint) tapHint.style.opacity = '0';
  }

  function startGame() {
    if (audioCtx && audioCtx.state === 'suspended') {
      try { audioCtx.resume(); } catch (e) {}
    }
    resetGame();
    state = 'playing';
    titleOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    if (tapHint) tapHint.style.opacity = '1';
    lastBeatPlayed = -1;
  }

  function drawSky(t) {
    if (!ctx) return;
    var pal = SKY_PALETTES[Math.min(skyLevel, SKY_PALETTES.length - 1)];
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, pal.top);
    grad.addColorStop(0.45, pal.mid);
    grad.addColorStop(1, pal.bot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    if (pal.sun > 0) {
      var sunY = H * 0.22;
      var sunX = W * 0.72;
      var sunR = 30 + pal.sun * 40;
      var sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.5);
      sg.addColorStop(0, 'rgba(255,220,100,' + (pal.sun * 0.9) + ')');
      sg.addColorStop(0.4, 'rgba(255,160,60,' + (pal.sun * 0.4) + ')');
      sg.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, W, H * 0.5);
    }

    if (pal.fog > 0) {
      ctx.fillStyle = 'rgba(200,210,220,' + (pal.fog * 0.35) + ')';
      for (var f = 0; f < 5; f++) {
        var fx = ((t * 8 + f * 200) % (W + 200)) - 100;
        var fy = H * (0.15 + f * 0.08);
        ctx.beginPath();
        ctx.ellipse(fx, fy, 120 + f * 30, 20 + f * 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawBoardwalk(t) {
    if (!ctx) return;
    var bwTop = H * 0.68;
    var bwH = H * 0.32;

    ctx.fillStyle = 'rgba(50,45,40,0.5)';
    ctx.fillRect(0, bwTop, W, bwH);

    ctx.strokeStyle = 'rgba(80,70,60,0.6)';
    ctx.lineWidth = 1;
    var plankW = 36;
    var offset = (t * 60) % plankW;
    for (var px = -offset; px < W + plankW; px += plankW) {
      ctx.beginPath();
      ctx.moveTo(px, bwTop);
      ctx.lineTo(px, H);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(100,90,80,0.3)';
    for (var py = bwTop; py < H; py += 18) {
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(W, py);
      ctx.stroke();
    }

    var railY = bwTop - 8;
    ctx.strokeStyle = 'rgba(120,110,100,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, railY);
    ctx.lineTo(W, railY);
    ctx.stroke();
  }

  function drawWaveforms(t) {
    if (!ctx) return;
    stutterPhase += 0.016;
    var baseY = laneY - 20;

    for (var i = 0; i < waveforms.length; i++) {
      var wf = waveforms[i];
      wf.x -= 0.8;
      if (wf.x < -60) {
        wf.x = W + 40;
        wf.amp = 8 + Math.random() * 18;
        wf.neon = Math.random() > 0.55;
      }

      var y = baseY + Math.sin(t * 3 + wf.phase) * wf.amp;
      if (wf.neon) {
        ctx.strokeStyle = 'rgba(0,232,192,' + (0.15 + Math.sin(stutterPhase + i) * 0.08) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(wf.x, y);
        ctx.lineTo(wf.x + 30, y + Math.sin(wf.phase) * 12);
        ctx.stroke();
      }
    }

    ctx.strokeStyle = 'rgba(0,200,170,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var x = 0; x <= W; x += 4) {
      var wy = baseY + Math.sin(x * 0.04 + t * 4) * 10 + Math.sin(x * 0.08 - t * 6) * 5;
      if (x === 0) ctx.moveTo(x, wy);
      else ctx.lineTo(x, wy);
    }
    ctx.stroke();
  }

  function drawHitZone(t) {
    if (!ctx) return;
    var pulse = 0.5 + Math.sin(t * 6) * 0.15;

    ctx.strokeStyle = 'rgba(0,232,192,' + (0.3 * pulse) + ')';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(hitLineX, laneY - 50);
    ctx.lineTo(hitLineX, laneY + 50);
    ctx.stroke();
    ctx.setLineDash([]);

    var rg = ctx.createRadialGradient(hitLineX, laneY, 0, hitLineX, laneY, 50);
    rg.addColorStop(0, 'rgba(0,232,192,0.08)');
    rg.addColorStop(1, 'rgba(0,232,192,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(hitLineX - 50, laneY - 50, 100, 100);
  }

  function drawNotes(t) {
    if (!ctx) return;
    var st = getSongTime();

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      var x = noteXAt(n, st);
      if (x < -30 || x > W + 30) continue;

      var ny = n.snapY;
      var size = n.isStutter ? 14 : 18;

      if (n.isGhost) {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.arc(x, ny, size * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        continue;
      }

      if (n.pulse > 0) {
        n.pulse -= 0.05;
        var ps = 1 + n.pulse * 0.8;
        ctx.strokeStyle = 'rgba(0,232,192,' + n.pulse + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, ny, size * ps, 0, Math.PI * 2);
        ctx.stroke();
      }

      var glow = ctx.createRadialGradient(x, ny, 0, x, ny, size * 1.8);
      if (n.isStutter) {
        glow.addColorStop(0, '#ff6b35');
        glow.addColorStop(0.5, 'rgba(255,107,53,0.4)');
        glow.addColorStop(1, 'rgba(255,107,53,0)');
      } else {
        glow.addColorStop(0, '#00e8c0');
        glow.addColorStop(0.5, 'rgba(0,232,192,0.4)');
        glow.addColorStop(1, 'rgba(0,232,192,0)');
      }
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, ny, size * 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = n.isStutter ? '#ff6b35' : '#00e8c0';
      ctx.beginPath();
      ctx.arc(x, ny, size * 0.55, 0, Math.PI * 2);
      ctx.fill();

      if (n.isStutter) {
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x - 6, ny);
        ctx.lineTo(x - 2, ny);
        ctx.moveTo(x + 2, ny);
        ctx.lineTo(x + 6, ny);
        ctx.stroke();
      }
    }
  }

  function drawParticles(dt) {
    if (!ctx) return;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 80 * dt;
      var a = p.life / p.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawLoopFlash() {
    if (!ctx || loopFlash <= 0) return;
    loopFlash -= 0.02;
    ctx.fillStyle = 'rgba(255,220,150,' + (loopFlash * 0.25) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  function draw(dt, t) {
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var sx = 0, sy = 0;
    if (shakeT > 0) {
      shakeT -= dt;
      sx = (Math.random() - 0.5) * 6 * (shakeT / 0.2);
      sy = (Math.random() - 0.5) * 6 * (shakeT / 0.2);
    }
    ctx.save();
    ctx.translate(sx, sy);

    drawSky(t);
    drawBoardwalk(t);
    drawWaveforms(t);
    drawHitZone(t);
    if (state === 'playing') drawNotes(t);
    drawParticles(dt);
    drawLoopFlash();

    ctx.restore();
  }

  function update(dt) {
    if (state !== 'playing') return;
    if (hitPause > 0) { hitPause -= dt; return; }

    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame(loopsDone >= LOOPS_TO_WIN);
      return;
    }

    ensureNotes();
    autoMissCheck();
    checkBeatSounds();
    updateHUD();
  }

  function loop(now) {
    var dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;
    var t = now / 1000;

    if (state === 'playing') update(dt);
    draw(dt, t);
    animId = requestAnimationFrame(loop);
  }

  function onTap(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (state === 'playing') tryHit();
  }

  function onKey(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'title') return;
      if (state === 'playing') tryHit();
    }
  }

  if (btnStart) {
    btnStart.addEventListener('click', function (e) {
      e.stopPropagation();
      initAudio();
      startGame();
    });
  }

  if (btnRestart) {
    btnRestart.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
  }

  if (canvas) {
    canvas.addEventListener('touchstart', onTap, { passive: false });
    canvas.addEventListener('mousedown', onTap);
  }
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);

  resize();
  buildLoopBar();
  initAudio();
  lastFrame = performance.now();
  animId = requestAnimationFrame(loop);

  draw(0, 0);
})();
</script>
</body>
</html>
