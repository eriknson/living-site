<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System Spiral</title>
<style>
:root {
  --bg-color: #0A1128;
  --text-color: #E0E8F5;
  --c-circle: #00F0FF;
  --c-square: #FF3366;
  --c-triangle: #FFCC00;
  --c-hex: #33FF99;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #0A1128;
    --text-color: #E0E8F5;
    --c-circle: #00F0FF;
    --c-square: #FF3366;
    --c-triangle: #FFCC00;
    --c-hex: #33FF99;
  }

  .screen {
    background: rgba(10, 17, 40, 0.85);
  }

  #message-display {
    color: #FFF;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }

  h1, h2 {
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
  }

  button {
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
  }

  button:hover {
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
  }
}

@media (prefers-color-scheme: light) {
  :root {
    --bg-color: #F0F4F8;
    --text-color: #0A1128;
    --c-circle: #0077FF;
    --c-square: #E60033;
    --c-triangle: #D9A400;
    --c-hex: #00B366;
  }
}

body, html {
  margin: 0;
  padding: 0;
  width: 100dvw;
  height: 100dvh;
  overflow: hidden;
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#game-container {
  position: relative;
  width: 100%;
  height: 100%;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#ui-layer {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; 
}

#hud {
  position: absolute;
  top: env(safe-area-inset-top, 20px);
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  font-size: 1.5rem;
  font-weight: bold;
}

#combo-display {
  color: var(--c-circle);
  transition: transform 0.1s;
}

#message-display {
  position: absolute;
  top: 30%;
  width: 100%;
  text-align: center;
  font-size: 1.8rem;
  font-weight: bold;
  color: #FFF;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.3s, transform 0.3s;
  text-shadow: 0 0 10px rgba(255,255,255,0.5);
}

.screen {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(10, 17, 40, 0.85);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  pointer-events: none; 
}

@media (prefers-color-scheme: light) {
  .screen {
    background: rgba(240, 244, 248, 0.85);
  }
}

.screen * {
  pointer-events: none;
}

.screen button {
  pointer-events: auto;
}

h1, h2 {
  font-size: 2.5rem;
  letter-spacing: 4px;
  margin-bottom: 10px;
  text-align: center;
  color: var(--c-circle);
  text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
}

p {
  font-size: 1rem;
  opacity: 0.8;
  margin-bottom: 30px;
  text-align: center;
  max-width: 80%;
  line-height: 1.5;
}

@media (prefers-color-scheme: light) {
  h1, h2 {
    text-shadow: none;
  }
}

button {
  padding: 15px 40px;
  font-size: 1.2rem;
  font-family: inherit;
  font-weight: bold;
  background: transparent;
  color: var(--c-circle);
  border: 2px solid var(--c-circle);
  border-radius: 8px;
  cursor: pointer;
  margin-top: 30px;
  text-transform: uppercase;
  letter-spacing: 3px;
  transition: all 0.2s;
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
}

button:hover {
  background: var(--c-circle);
  color: var(--bg-color);
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
}

button:active {
  transform: scale(0.95);
}

@media (prefers-color-scheme: light) {
  button {
    box-shadow: none;
  }
  button:hover {
    box-shadow: 0 5px 15px rgba(0, 119, 255, 0.2);
  }
}
</style>
</head>
<body>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="ui-layer">
    <div id="hud">
      <div id="score-display">000</div>
      <div id="combo-display"></div>
    </div>
    
    <div id="message-display"></div>
    
    <div id="title-screen" class="screen">
      <h1>SYSTEM SPIRAL</h1>
      <p>Swipe or tap the lanes to route outputs to matching loops. Echoes arrive out of order.</p>
      <button data-smoke="start">Start Game</button>
    </div>
    
    <div id="game-over-screen" class="screen" style="display: none;">
      <h2>CONNECTION LOST</h2>
      <p>Loops Closed: <span id="final-score">0</span></p>
      <button data-smoke="restart">Reboot</button>
    </div>
  </div>
</div>

<script>
const STATE_MENU = 0;
const STATE_PLAYING = 1;
const STATE_GAMEOVER = 2;

let state = STATE_MENU;
let width, height;
let ctx;

let lanesCount = 2;
let score = 0;
let combo = 0;
let baseSpeed = 0;
let spawnTimer = 0;
let spawnInterval = 2.0;
let objects = [];
let receptors = [];
let particles = [];
let laneFlashes = [0, 0, 0, 0];
let time = 0;
let lastTime = 0;

let nextLaneExpansion = 10;
let nextShuffleScore = 15;

let touchStartX = 0;
let touchStartY = 0;
let swiped = false;

let audioCtx = null;

function init() {
  const canvas = document.getElementById('game-canvas');
  ctx = canvas.getContext('2d', { alpha: false });
  resize();
  window.addEventListener('resize', resize);

  document.querySelector('[data-smoke="start"]').addEventListener('click', handleStartBtn);
  document.querySelector('[data-smoke="restart"]').addEventListener('click', handleStartBtn);
  
  window.addEventListener('touchstart', handleTouchStart, {passive: false});
  window.addEventListener('touchmove', handleTouchMove, {passive: false});
  window.addEventListener('touchend', handleTouchEnd);
  window.addEventListener('keydown', handleKeyDown);
  
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  } catch (e) {}

  requestAnimationFrame(loop);
}

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  const canvas = document.getElementById('game-canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}

function handleStartBtn(e) {
  if (e) {
    e.preventDefault();
    if (navigator.vibrate) {
      try { navigator.vibrate(50); } catch(err){}
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(()=>{});
  }
  startGame();
}

function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-over-screen').style.display = 'none';
  
  state = STATE_PLAYING;
  score = 0;
  combo = 0;
  lanesCount = 2;
  updateHUD();
  
  objects = [];
  particles = [];
  laneFlashes = [0, 0, 0, 0];
  
  initReceptors();
  
  baseSpeed = height * 0.25;
  spawnInterval = 2.0;
  spawnTimer = spawnInterval;
  nextLaneExpansion = 10;
  nextShuffleScore = 15;
  time = 0;
  lastTime = performance.now();
}

function initReceptors() {
  receptors = [];
  let available = [0, 1, 2, 3];
  for (let i = available.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    let t = available[i];
    available[i] = available[j];
    available[j] = t;
  }
  for (let i = 0; i < lanesCount; i++) {
    receptors.push({ lane: i, type: available[i] });
  }
}

function shuffleReceptors() {
  for (let i = receptors.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    let temp = receptors[i].type;
    receptors[i].type = receptors[j].type;
    receptors[j].type = temp;
  }
  for (let i = 0; i < lanesCount; i++) {
    spawnBloom(getLaneX(i), height - 100, 30, '#FFFFFF');
  }
  playTone(400, 'square', 0.3, 0.1);
  playTone(300, 'square', 0.3, 0.1);
  showMessage("LOOPS SHUFFLED!", getTypeColor(1, 1));
}

function loop(now) {
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = now;
  time += dt;
  
  update(dt);
  draw(dt);
}

function update(dt) {
  if (state !== STATE_PLAYING) return;
  
  if (score >= nextLaneExpansion) {
    if (lanesCount === 2) {
      lanesCount = 3;
      nextLaneExpansion = 30;
      initReceptors();
      spawnBloom(width/2, height/2, 100, '#FFFFFF');
      playTone(600, 'sine', 0.5, 0.2);
      showMessage("LANES EXPANDED!", getTypeColor(2, 1));
    } else if (lanesCount === 3) {
      lanesCount = 4;
      nextLaneExpansion = 9999;
      initReceptors();
      spawnBloom(width/2, height/2, 100, '#FFFFFF');
      playTone(800, 'sine', 0.5, 0.2);
      showMessage("MAXIMUM SPIRAL!", getTypeColor(0, 1));
    }
  }
  
  let canShuffle = !objects.some(o => o.y > height * 0.6);
  if (score >= nextShuffleScore && canShuffle) {
    nextShuffleScore += 15;
    shuffleReceptors();
  }
  
  baseSpeed += dt * (height * 0.005);
  spawnInterval = Math.max(0.6, 2.0 - (score * 0.04));

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObject();
    spawnTimer = spawnInterval;
  }
  
  let receptorY = height - 100;

  for (let i = objects.length - 1; i >= 0; i--) {
    let obj = objects[i];
    let sm = obj.speedMultiplier || 1;
    obj.y += baseSpeed * sm * dt;
    
    let targetX = getLaneX(obj.lane);
    obj.x += (targetX - obj.x) * 15 * dt;
    
    if (obj.y >= receptorY - 20) {
      let receptor = receptors[obj.lane];
      if (receptor.type === obj.type) {
        score += 1 + Math.floor(combo / 3);
        combo++;
        updateHUD();
        
        let baseFreq = 220 + (receptor.type * 110);
        if (combo % 3 === 0 && combo > 0) {
          playTone(baseFreq * 2, 'sine', 0.5, 0.2);
          playTone(baseFreq * 2.5, 'triangle', 0.5, 0.1);
          spawnBloom(obj.x, receptorY, 50, getTypeColor(obj.type, 1));
          showMessage("COMBO BURST!", getTypeColor(obj.type, 1));
        } else {
          playTone(baseFreq, 'sine', 0.2, 0.1);
          spawnBloom(obj.x, receptorY, 20, getTypeColor(obj.type, 1));
        }
        
        objects.splice(i, 1);
        if (navigator.vibrate) {
            try { navigator.vibrate(20); } catch(err){}
        }
      } else {
        spawnBloom(obj.x, receptorY, 100, '#FF0000');
        objects.splice(i, 1);
        gameOver();
      }
    }
  }
  
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function draw(dt) {
  let isLight = false;
  if (window.matchMedia) {
    isLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  
  ctx.fillStyle = isLight ? '#F0F4F8' : '#0A1128';
  ctx.fillRect(0, 0, width, height);
  
  ctx.strokeStyle = isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 2;
  let laneWidth = width / lanesCount;
  for (let i = 1; i < lanesCount; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, height);
    ctx.stroke();
  }
  
  for (let i = 0; i < lanesCount; i++) {
    if (laneFlashes[i] > 0) {
      ctx.fillStyle = isLight ? `rgba(0,0,0,${laneFlashes[i] * 0.15})` : `rgba(255,255,255,${laneFlashes[i] * 0.15})`;
      ctx.fillRect(i * laneWidth, 0, laneWidth, height);
      laneFlashes[i] -= dt * 2;
    }
  }
  
  if (state === STATE_PLAYING || state === STATE_GAMEOVER) {
    let receptorY = height - 100;
    
    for (let i = 0; i < lanesCount; i++) {
      let x = getLaneX(i);
      drawShape(x, receptorY, receptors[i].type, 40, time, isLight);
      
      ctx.fillStyle = getTypeColor(receptors[i].type, 0.1);
      ctx.beginPath();
      ctx.ellipse(x, receptorY + 20, 50, 15, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    
    let active = getActiveObject();
    for (let o of objects) {
      let isActive = (o === active);
      drawShape(o.x, o.y, o.type, 25, -time * 2, isLight);
      
      let sm = o.speedMultiplier || 1;
      ctx.strokeStyle = getTypeColor(o.type, isActive ? 0.8 : 0.3);
      ctx.lineWidth = isActive ? 4 : 2;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y - 25);
      ctx.lineTo(o.x, o.y - 60 - (sm * 30));
      ctx.stroke();
      
      if (isActive && state === STATE_PLAYING) {
        ctx.beginPath();
        ctx.arc(o.x, o.y, 45, 0, Math.PI * 2);
        ctx.strokeStyle = isLight ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
    
    for (let p of particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function spawnObject() {
  let availableTypes = receptors.map(r => r.type);
  let type = availableTypes[Math.floor(Math.random() * availableTypes.length)];
  let lane = Math.floor(Math.random() * lanesCount);
  
  let isFast = (Math.random() < 0.15 && score > 20);
  
  objects.push({
    x: getLaneX(lane),
    y: -50,
    lane: lane,
    type: type,
    speedMultiplier: isFast ? 1.5 : 1.0
  });
}

function getLowestObject() {
  let lowest = null;
  let maxY = -1000;
  for (let o of objects) {
    if (o.y > maxY) {
      maxY = o.y;
      lowest = o;
    }
  }
  return lowest;
}

function getActiveObject() {
  let active = null;
  let maxY = -1000;
  let receptorY = height - 100;
  for (let o of objects) {
    if (o.y < receptorY - 30 && o.y > maxY) {
      maxY = o.y;
      active = o;
    }
  }
  return active;
}

function moveActiveObject(dir) {
  let active = getActiveObject();
  if (active) {
    active.lane += dir;
    if (active.lane < 0) active.lane = 0;
    if (active.lane >= lanesCount) active.lane = lanesCount - 1;
    laneFlashes[active.lane] = 0.5;
  }
}

function getLaneX(lane) {
  let laneWidth = width / lanesCount;
  return lane * laneWidth + laneWidth / 2;
}

function getTypeColor(type, alpha = 1) {
  let isLight = false;
  if (window.matchMedia) {
    isLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  let colors;
  if (isLight) {
    colors = [
      `rgba(0, 119, 255, ${alpha})`,
      `rgba(230, 0, 51, ${alpha})`,
      `rgba(217, 164, 0, ${alpha})`,
      `rgba(0, 179, 102, ${alpha})`
    ];
  } else {
    colors = [
      `rgba(0, 240, 255, ${alpha})`,
      `rgba(255, 51, 102, ${alpha})`,
      `rgba(255, 204, 0, ${alpha})`,
      `rgba(51, 255, 153, ${alpha})`
    ];
  }
  return colors[type % 4];
}

function drawShape(x, y, type, radius, rot, isLight) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  
  ctx.strokeStyle = getTypeColor(type, 1);
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  ctx.shadowColor = getTypeColor(type, 1);
  ctx.shadowBlur = isLight ? 0 : 10;

  if (type === 0) {
    ctx.beginPath();
    for (let i = 0; i < 40; i++) {
      let angle = 0.15 * i;
      let r = Math.max((radius / 40) * i, 1);
      let px = Math.cos(angle) * r;
      let py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < 40; i++) {
      let angle = 0.15 * i + Math.PI;
      let r = Math.max((radius / 40) * i, 1);
      let px = Math.cos(angle) * r;
      let py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  } else if (type === 1) {
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      let r = Math.max(radius - i * (radius/3), 1);
      ctx.rect(-r, -r, r*2, r*2);
    }
    ctx.stroke();
  } else if (type === 2) {
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      let r = Math.max(radius - i * (radius/3), 1);
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.866, r * 0.5);
      ctx.lineTo(-r * 0.866, r * 0.5);
      ctx.closePath();
    }
    ctx.stroke();
  } else if (type === 3) {
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      let r = Math.max(radius - i * (radius/3), 1);
      for (let j = 0; j < 6; j++) {
        let angle = j * Math.PI / 3;
        let px = Math.cos(angle) * r;
        let py = Math.sin(angle) * r;
        if (j === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }
    ctx.stroke();
  }
  ctx.restore();
}

function spawnBloom(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = Math.random() * 300 + 50;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 4 + 2,
      color: color,
      life: 0.5 + Math.random() * 0.5,
      maxLife: 1.0
    });
  }
}

function gameOver() {
  state = STATE_GAMEOVER;
  if (navigator.vibrate) {
    try { navigator.vibrate([100, 50, 100]); } catch(err){}
  }
  playTone(100, 'sawtooth', 0.5, 0.3);
  playTone(50, 'square', 0.8, 0.3);
  
  document.getElementById('game-over-screen').style.display = 'flex';
  document.getElementById('final-score').innerText = score;
}

function updateHUD() {
  document.getElementById('score-display').innerText = score.toString().padStart(3, '0');
  let comboEl = document.getElementById('combo-display');
  if (combo > 2) {
    comboEl.innerText = `x${combo}`;
    comboEl.style.transform = 'scale(1.2)';
    setTimeout(() => {
      if(comboEl) comboEl.style.transform = 'scale(1)';
    }, 100);
  } else {
    comboEl.innerText = '';
  }
}

function showMessage(msg, color='#FFFFFF') {
  let el = document.getElementById('message-display');
  el.innerText = msg;
  el.style.color = color;
  el.style.opacity = '1';
  el.style.transform = 'translateY(0)';
  setTimeout(() => {
    if(el) {
      el.style.opacity = '0';
      el.style.transform = 'translateY(-20px)';
    }
  }, 1500);
}

function playTone(freq, type, duration, vol=0.1) {
  try {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function handleTouchStart(e) {
  if (e.target.closest('button')) return;
  e.preventDefault();
  if (e.touches.length > 0) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
  swiped = false;
}

function handleTouchMove(e) {
  if (e.target.closest('button')) return;
  e.preventDefault();
  if (swiped || state !== STATE_PLAYING || e.touches.length === 0) return;
  
  let dx = e.touches[0].clientX - touchStartX;
  if (Math.abs(dx) > 35) {
    if (dx > 0) moveActiveObject(1);
    else moveActiveObject(-1);
    swiped = true;
  }
}

function handleTouchEnd(e) {
  if (e.target.closest('button')) return;
  if (!swiped && state === STATE_PLAYING && e.changedTouches.length > 0) {
    let x = e.changedTouches[0].clientX;
    let targetLane = Math.floor(x / (width / lanesCount));
    if (targetLane < 0) targetLane = 0;
    if (targetLane >= lanesCount) targetLane = lanesCount - 1;
    let active = getActiveObject();
    if (active && active.lane !== targetLane) {
      active.lane = targetLane;
      laneFlashes[targetLane] = 0.5;
    }
  }
}

function handleKeyDown(e) {
  if (state !== STATE_PLAYING) return;
  if (e.key === 'ArrowLeft') {
    moveActiveObject(-1);
  } else if (e.key === 'ArrowRight') {
    moveActiveObject(1);
  } else if (e.key >= '1' && e.key <= '4') {
    let lane = parseInt(e.key) - 1;
    if (lane < lanesCount) {
      let active = getActiveObject();
      if (active && active.lane !== lane) {
        active.lane = lane;
        laneFlashes[lane] = 0.5;
      }
    }
  }
}

window.onload = init;
</script>
