<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Drop</title>
<style>
:root {
  --ui-bg: rgba(255,255,255,0.94);
  --ui-text: #141820;
  --ui-muted: #5a6470;
  --ui-accent: #00b8a0;
  --ui-btn-bg: #141820;
  --ui-btn-text: #f4f6f8;
  --hud-text: #141820;
  --pad-border: rgba(20,24,32,0.15);
  --pad-glow: rgba(0,184,160,0.35);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ui-bg: rgba(14,16,22,0.96);
    --ui-text: #eef2f6;
    --ui-muted: #8a96a4;
    --ui-accent: #00e8c8;
    --ui-btn-bg: #eef2f6;
    --ui-btn-text: #0e1016;
    --hud-text: #eef2f6;
    --pad-border: rgba(238,242,246,0.12);
    --pad-glow: rgba(0,232,200,0.45);
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100dvw;
  height: 100dvh;
  overflow: hidden;
  background: #1a2030;
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#game {
  display: block;
  width: 100dvw;
  height: 100dvh;
  touch-action: none;
}
#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: max(12px, env(safe-area-inset-top)) 16px 8px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 10;
  color: var(--hud-text);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-shadow: 0 1px 4px rgba(0,0,0,0.35);
}
.hud-block { display: flex; flex-direction: column; gap: 2px; }
.hud-label { opacity: 0.6; font-size: 9px; text-transform: uppercase; }
.hud-value { font-size: 15px; font-weight: 600; }
#stutter-meter {
  position: fixed;
  top: max(48px, calc(env(safe-area-inset-top) + 36px));
  left: 16px; right: 16px;
  height: 4px;
  display: flex;
  gap: 4px;
  pointer-events: none;
  z-index: 10;
}
.stutter-seg {
  flex: 1;
  height: 100%;
  border-radius: 2px;
  background: rgba(255,255,255,0.12);
  transition: background 0.25s ease, transform 0.2s ease;
}
.stutter-seg.on {
  background: linear-gradient(90deg, #ff6b35, #ffd166);
  transform: scaleY(1.3);
}
#progress-bar {
  position: fixed;
  top: max(58px, calc(env(safe-area-inset-top) + 46px));
  left: 16px; right: 16px;
  height: 2px;
  background: rgba(255,255,255,0.15);
  border-radius: 1px;
  pointer-events: none;
  z-index: 10;
  overflow: hidden;
}
#progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00c9a7, #ffd166);
  border-radius: 1px;
}
#pads {
  position: fixed;
  bottom: max(16px, env(safe-area-inset-bottom));
  left: 12px; right: 12px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  z-index: 12;
  pointer-events: none;
  opacity: 0.35;
  transition: opacity 0.35s ease;
}
#pads.live {
  opacity: 1;
  pointer-events: none;
}
.pad {
  aspect-ratio: 1;
  max-height: 22dvh;
  border-radius: 14px;
  border: 2px solid var(--pad-border);
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  pointer-events: auto;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  touch-action: none;
  min-height: 44px;
}
.pad-label {
  font-size: clamp(8px, 2.2vw, 10px);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}
.pad-icon {
  width: clamp(18px, 5vw, 28px);
  height: clamp(18px, 5vw, 28px);
  border-radius: 50%;
}
.pad[data-pad="0"] .pad-icon { background: linear-gradient(135deg, #ff6b35, #ff9060); }
.pad[data-pad="1"] .pad-icon { background: linear-gradient(135deg, #00c9a7, #00e8c8); }
.pad[data-pad="2"] .pad-icon { background: linear-gradient(135deg, #ffd166, #ffe090); }
.pad[data-pad="3"] .pad-icon { background: linear-gradient(135deg, #4ecdc4, #7ee8e0); }
.pad.active {
  transform: scale(0.94);
  box-shadow: 0 0 24px var(--pad-glow);
  border-color: var(--ui-accent);
}
.pad.ghost-flash {
  animation: ghostPulse 0.35s ease;
}
@keyframes ghostPulse {
  0%, 100% { border-color: var(--pad-border); }
  50% { border-color: #ff4444; box-shadow: 0 0 16px rgba(255,68,68,0.5); }
}
.pad.shuffling {
  transition: transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
}
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 24px;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.42);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 30;
  pointer-events: none;
  transition: opacity 0.35s ease, visibility 0.35s ease;
}
.overlay.hidden { opacity: 0; visibility: hidden; }
.overlay-title {
  font-size: clamp(24px, 7vw, 36px);
  font-weight: 700;
  letter-spacing: 0.14em;
  color: #fff;
  text-align: center;
  text-shadow: 0 2px 16px rgba(0,0,0,0.5);
}
.overlay-sub {
  font-size: clamp(11px, 3vw, 13px);
  color: rgba(255,255,255,0.78);
  text-align: center;
  max-width: 300px;
  line-height: 1.55;
  letter-spacing: 0.04em;
}
.overlay-card {
  background: var(--ui-bg);
  color: var(--ui-text);
  border-radius: 14px;
  padding: 22px 26px;
  max-width: 320px;
  width: 100%;
  text-align: center;
  pointer-events: auto;
}
.overlay-card p { font-size: 12px; color: var(--ui-muted); line-height: 1.6; margin-bottom: 14px; }
.overlay-card .score-big {
  font-size: 32px;
  font-weight: 700;
  color: var(--ui-accent);
  margin-bottom: 4px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  min-width: 168px;
  padding: 12px 28px;
  border: none;
  border-radius: 10px;
  background: var(--ui-btn-bg);
  color: var(--ui-btn-text);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  pointer-events: auto;
  transition: transform 0.12s ease, opacity 0.12s ease;
}
.btn:active { transform: scale(0.96); opacity: 0.85; }
#judge-flash {
  position: fixed;
  top: 38%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(14px, 4vw, 22px);
  font-weight: 700;
  letter-spacing: 0.14em;
  pointer-events: none;
  z-index: 15;
  opacity: 0;
}
#judge-flash.show { animation: judgePop 0.45s ease forwards; }
@keyframes judgePop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
  25% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  100% { opacity: 0; transform: translate(-50%, -65%) scale(1); }
}
#drop-badge {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(16px, 5vw, 24px);
  font-weight: 700;
  letter-spacing: 0.18em;
  color: #00e8c8;
  text-shadow: 0 0 24px rgba(0,232,200,0.7);
  pointer-events: none;
  z-index: 16;
  opacity: 0;
}
#drop-badge.show { animation: dropPop 0.7s ease forwards; }
@keyframes dropPop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
}
.pad-preview {
  display: flex;
  gap: 6px;
  pointer-events: none;
}
.pad-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}
.pad-dot:nth-child(1) { background: #ff6b35; }
.pad-dot:nth-child(2) { background: #00c9a7; }
.pad-dot:nth-child(3) { background: #ffd166; }
.pad-dot:nth-child(4) { background: #4ecdc4; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hud-block">
    <span class="hud-label">Score</span>
    <span class="hud-value" id="hud-score">0</span>
  </div>
  <div class="hud-block" style="align-items:center">
    <span class="hud-label">Combo</span>
    <span class="hud-value" id="hud-combo">0</span>
  </div>
  <div class="hud-block" style="align-items:flex-end">
    <span class="hud-label">BPM · Drop</span>
    <span class="hud-value"><span id="hud-bpm">124</span> · <span id="hud-time">45</span>s</span>
  </div>
</div>
<div id="stutter-meter">
  <div class="stutter-seg" data-seg="0"></div>
  <div class="stutter-seg" data-seg="1"></div>
  <div class="stutter-seg" data-seg="2"></div>
  <div class="stutter-seg" data-seg="3"></div>
  <div class="stutter-seg" data-seg="4"></div>
</div>
<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="pads">
  <button class="pad" data-pad="0" type="button" aria-label="Kick pad"><span class="pad-icon"></span><span class="pad-label">Kick</span></button>
  <button class="pad" data-pad="1" type="button" aria-label="Snare pad"><span class="pad-icon"></span><span class="pad-label">Snare</span></button>
  <button class="pad" data-pad="2" type="button" aria-label="Chop pad"><span class="pad-icon"></span><span class="pad-label">Chop</span></button>
  <button class="pad" data-pad="3" type="button" aria-label="Synth pad"><span class="pad-icon"></span><span class="pad-label">Synth</span></button>
</div>
<div id="judge-flash"></div>
<div id="drop-badge">DROP RESTORED</div>

<div class="overlay" id="title-overlay">
  <div class="overlay-title">STUTTER DROP</div>
  <div class="overlay-sub">Tap the glowing pads on beat.<br>Miss a hit and the track glitches — tap clean to restore the drop.</div>
  <div class="pad-preview">
    <div class="pad-dot"></div><div class="pad-dot"></div><div class="pad-dot"></div><div class="pad-dot"></div>
  </div>
  <button class="btn" data-smoke="start" id="btn-start" type="button">Enter the Drop</button>
</div>

<div class="overlay hidden" id="end-overlay">
  <div class="overlay-card">
    <div class="score-big" id="end-score">0</div>
    <p id="end-msg">The loop closes clean.</p>
    <button class="btn" data-smoke="restart" id="btn-restart" type="button">Play Again</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var hudScore = document.getElementById('hud-score');
  var hudCombo = document.getElementById('hud-combo');
  var hudBpm = document.getElementById('hud-bpm');
  var hudTime = document.getElementById('hud-time');
  var progressFill = document.getElementById('progress-fill');
  var titleOverlay = document.getElementById('title-overlay');
  var endOverlay = document.getElementById('end-overlay');
  var endScore = document.getElementById('end-score');
  var endMsg = document.getElementById('end-msg');
  var judgeFlash = document.getElementById('judge-flash');
  var dropBadge = document.getElementById('drop-badge');
  var btnStart = document.getElementById('btn-start');
  var btnRestart = document.getElementById('btn-restart');
  var padEls = document.querySelectorAll('.pad');
  var stutterSegs = document.querySelectorAll('.stutter-seg');

  var W = 360, H = 640, dpr = 1;
  var state = 'title';
  var animId = 0;
  var lastFrame = 0;

  var ROUND_TIME = 45;
  var START_BPM = 124;
  var END_BPM = 148;
  var MAX_STUTTER = 5;
  var PERFECT_MS = 70;
  var GOOD_MS = 130;
  var LOOKAHEAD = 2.8;

  var PAD_NAMES = ['Kick', 'Snare', 'Chop', 'Synth'];
  var PAD_COLORS = ['#ff6b35', '#00c9a7', '#ffd166', '#4ecdc4'];

  var audioCtx = null;
  var masterGain = null;
  var stutterGain = null;
  var delayNode = null;
  var filterNode = null;

  var score = 0, combo = 0, maxCombo = 0;
  var stutterLayers = 0;
  var timeLeft = ROUND_TIME;
  var bpm = START_BPM;
  var roundStart = 0;
  var roundElapsed = 0;
  var ghostChance = 0.08;
  var shuffleCounter = 0;

  var chart = [];
  var activeNotes = [];
  var pulses = [];
  var particles = [];
  var wavePoints = [];
  var padOrder = [0, 1, 2, 3];
  var padRects = [{}, {}, {}, {}];
  var centerX = 180, centerY = 280;
  var shakeT = 0, hitPause = 0, stutterPhase = 0;
  var stutterFreeze = 0;
  var bgPhase = 0;
  var isDark = false;

  function checkDark() {
    try {
      isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { isDark = true; }
  }
  checkDark();
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', checkDark);
    } catch (e) {}
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    if (canvas) {
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
    }
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    centerX = W * 0.5;
    centerY = H * 0.38;
    updatePadRects();
    for (var i = 0; i < 64; i++) wavePoints.push(Math.random() * 2 - 1);
  }

  function updatePadRects() {
    for (var i = 0; i < padEls.length; i++) {
      var el = padEls[i];
      if (!el) continue;
      var r = el.getBoundingClientRect();
      padRects[i] = { x: r.left + r.width * 0.5, y: r.top + r.height * 0.5, w: r.width, h: r.height };
    }
  }

  function bpmAtTime(t) {
    var p = Math.min(t / ROUND_TIME, 1);
    return START_BPM + (END_BPM - START_BPM) * p;
  }

  function generateChart() {
    chart = [];
    var t = 1.0;
    var beatIdx = 0;
    var patterns = [
      [0, 2, 1, 2],
      [0, 1, 2, 3],
      [0, 2, 1, 3],
      [1, 0, 3, 2]
    ];
    while (t < ROUND_TIME + 1) {
      var b = bpmAtTime(t);
      var interval = 60 / b;
      var bar = Math.floor(beatIdx / 4);
      var beatInBar = beatIdx % 4;
      var pat = patterns[bar % patterns.length];
      var pad = pat[beatInBar];
      chart.push({ time: t, pad: pad, ghost: false, id: beatIdx });
      var gc = ghostChance + Math.min(beatIdx * 0.003, 0.12);
      if (Math.random() < gc && beatIdx > 4) {
        var gp = (pad + 1 + Math.floor(Math.random() * 3)) % 4;
        chart.push({ time: t + interval * 0.48, pad: gp, ghost: true, id: beatIdx + 10000 });
      }
      if (beatIdx > 0 && beatIdx % 16 === 0) {
        chart.push({ time: t, pad: -1, ghost: false, shuffle: true, id: -beatIdx });
      }
      t += interval;
      beatIdx++;
    }
  }

  function initAudio() {
    if (audioCtx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.55;
      filterNode = audioCtx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.value = 8000;
      filterNode.Q.value = 0.7;
      delayNode = audioCtx.createDelay(0.5);
      delayNode.delayTime.value = 0.08;
      var fb = audioCtx.createGain();
      fb.gain.value = 0.35;
      stutterGain = audioCtx.createGain();
      stutterGain.gain.value = 0;
      filterNode.connect(masterGain);
      masterGain.connect(audioCtx.destination);
      delayNode.connect(fb);
      fb.connect(delayNode);
      fb.connect(filterNode);
      stutterGain.connect(delayNode);
      return true;
    } catch (e) { return false; }
  }

  function resumeAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }

  function playTone(freq, dur, type, vol, detune) {
    if (!audioCtx || !filterNode) return;
    try {
      var t0 = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      if (detune) osc.detune.value = detune;
      g.gain.setValueAtTime(0.001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g);
      g.connect(filterNode);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch (e) {}
  }

  function playNoise(dur, vol) {
    if (!audioCtx || !filterNode) return;
    try {
      var t0 = audioCtx.currentTime;
      var len = Math.floor(audioCtx.sampleRate * dur);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var g = audioCtx.createGain();
      var f = audioCtx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 6000;
      g.gain.value = vol || 0.15;
      src.connect(f);
      f.connect(g);
      g.connect(filterNode);
      src.start(t0);
    } catch (e) {}
  }

  function playPadSound(pad) {
    if (pad === 0) playTone(55, 0.18, 'sine', 0.45);
    else if (pad === 1) { playNoise(0.06, 0.35); playTone(180, 0.08, 'triangle', 0.2); }
    else if (pad === 2) { playTone(440, 0.05, 'square', 0.12, -100); playTone(880, 0.04, 'square', 0.08, 100); }
    else playTone(330, 0.25, 'sawtooth', 0.18, 50);
  }

  function playMissGlitch() {
    if (!audioCtx || !stutterGain) return;
    try {
      var t0 = audioCtx.currentTime;
      stutterGain.gain.cancelScheduledValues(t0);
      stutterGain.gain.setValueAtTime(0.5, t0);
      stutterGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
      playTone(80, 0.12, 'sawtooth', 0.25);
    } catch (e) {}
  }

  function playDropRestore() {
    playTone(220, 0.15, 'sine', 0.2);
    playTone(440, 0.2, 'sine', 0.15);
    playTone(660, 0.3, 'triangle', 0.12);
  }

  function updateStutterAudio() {
    if (!filterNode) return;
    var freq = Math.max(800, 8000 - stutterLayers * 1400);
    try { filterNode.frequency.setTargetAtTime(freq, audioCtx ? audioCtx.currentTime : 0, 0.08); } catch (e) {}
  }

  function addStutter() {
    if (stutterLayers < MAX_STUTTER) stutterLayers++;
    updateStutterAudio();
    playMissGlitch();
    shakeT = 0.35;
    stutterFreeze = 0.12;
    if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) {}
  }

  function removeStutter() {
    if (stutterLayers > 0) {
      stutterLayers--;
      updateStutterAudio();
      if (stutterLayers === 0) {
        showDropBadge();
        playDropRestore();
        if (navigator.vibrate) try { navigator.vibrate([20, 30, 20]); } catch (e) {}
      }
    }
  }

  function showJudge(text, color) {
    if (!judgeFlash) return;
    judgeFlash.textContent = text;
    judgeFlash.style.color = color || '#00e8c8';
    judgeFlash.classList.remove('show');
    void judgeFlash.offsetWidth;
    judgeFlash.classList.add('show');
  }

  function showDropBadge() {
    if (!dropBadge) return;
    dropBadge.classList.remove('show');
    void dropBadge.offsetWidth;
    dropBadge.classList.add('show');
  }

  function spawnParticles(x, y, color) {
    for (var i = 0; i < 10; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.4 + Math.random() * 0.3,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function shufflePads() {
    var a = Math.floor(Math.random() * 4);
    var b = (a + 1 + Math.floor(Math.random() * 3)) % 4;
    var tmp = padOrder[a];
    padOrder[a] = padOrder[b];
    padOrder[b] = tmp;
    var padsContainer = document.getElementById('pads');
    if (!padsContainer) return;
    var children = padsContainer.children;
    var orderStr = padOrder.map(function (p) { return '[data-pad="' + p + '"]'; }).join(',');
    try {
      var sorted = Array.prototype.slice.call(children).sort(function (x, y) {
        return padOrder.indexOf(parseInt(x.getAttribute('data-pad'), 10)) -
               padOrder.indexOf(parseInt(y.getAttribute('data-pad'), 10));
      });
      for (var i = 0; i < sorted.length; i++) padsContainer.appendChild(sorted[i]);
    } catch (e) {}
    padEls.forEach(function (el) { el.classList.add('shuffling'); });
    setTimeout(function () {
      padEls.forEach(function (el) { el.classList.remove('shuffling'); });
      updatePadRects();
    }, 460);
    showJudge('SHUFFLE', '#ffd166');
  }

  function resetGame() {
    score = 0; combo = 0; maxCombo = 0;
    stutterLayers = 0;
    timeLeft = ROUND_TIME;
    roundElapsed = 0;
    ghostChance = 0.08;
    shuffleCounter = 0;
    padOrder = [0, 1, 2, 3];
    activeNotes = [];
    pulses = [];
    particles = [];
    chart = [];
    generateChart();
    updateStutterAudio();
    updateHUD();
    updateStutterMeter();
    if (titleOverlay) titleOverlay.classList.add('hidden');
    if (endOverlay) endOverlay.classList.add('hidden');
    var padsEl0 = document.getElementById('pads');
    if (padsEl0) padsEl0.classList.remove('live');
    padEls.forEach(function (el, i) {
      el.classList.remove('active', 'ghost-flash');
    });
    var padsContainer = document.getElementById('pads');
    if (padsContainer) {
      var sorted = Array.prototype.slice.call(padEls).sort(function (a, b) {
        return parseInt(a.getAttribute('data-pad'), 10) - parseInt(b.getAttribute('data-pad'), 10);
      });
      sorted.forEach(function (el) { padsContainer.appendChild(el); });
    }
    roundStart = performance.now();
    state = 'playing';
    var padsEl = document.getElementById('pads');
    if (padsEl) padsEl.classList.add('live');
    updatePadRects();
  }

  function startGame() {
    initAudio();
    resumeAudio();
    resetGame();
  }

  function endGame() {
    state = 'over';
    var padsEl = document.getElementById('pads');
    if (padsEl) padsEl.classList.remove('live');
    if (endScore) endScore.textContent = String(score);
    if (endMsg) {
      var pct = Math.round((score / 8000) * 100);
      if (stutterLayers === 0 && combo > 20) endMsg.textContent = 'Perfect drop — Fred again.. would nod.';
      else if (pct > 70) endMsg.textContent = 'Clean loop. Max combo ' + maxCombo + '.';
      else if (pct > 40) endMsg.textContent = 'Solid set. Keep tapping through the stutter.';
      else endMsg.textContent = 'The glitch won this round. Try again.';
    }
    if (endOverlay) endOverlay.classList.remove('hidden');
  }

  function updateHUD() {
    if (hudScore) hudScore.textContent = String(score);
    if (hudCombo) hudCombo.textContent = String(combo);
    if (hudBpm) hudBpm.textContent = String(Math.round(bpm));
    if (hudTime) hudTime.textContent = String(Math.ceil(Math.max(0, timeLeft)));
    if (progressFill) progressFill.style.width = ((ROUND_TIME - timeLeft) / ROUND_TIME * 100) + '%';
  }

  function updateStutterMeter() {
    stutterSegs.forEach(function (seg, i) {
      if (seg) seg.classList.toggle('on', i < stutterLayers);
    });
  }

  function spawnNote(evt) {
    if (evt.shuffle) {
      shufflePads();
      return;
    }
    var pr = padRects[evt.pad];
    if (!pr || !pr.x) updatePadRects();
    pr = padRects[evt.pad] || { x: W * 0.5, y: H * 0.85 };
    activeNotes.push({
      pad: evt.pad,
      ghost: evt.ghost,
      hitTime: evt.time,
      judged: false,
      tx: pr.x,
      ty: pr.y,
      pulseT: 0
    });
    var travel = Math.max(0.45, evt.time - roundElapsed);
    pulses.push({
      pad: evt.pad,
      start: roundElapsed,
      duration: travel,
      ghost: evt.ghost,
      tx: pr.x,
      ty: pr.y
    });
    if (evt.ghost) {
      var gel = document.querySelector('.pad[data-pad="' + evt.pad + '"]');
      if (gel) {
        gel.classList.add('ghost-flash');
        setTimeout(function () { gel.classList.remove('ghost-flash'); }, 350);
      }
    }
  }

  function judgePad(padIdx) {
    if (state !== 'playing') return;
    resumeAudio();
    var now = roundElapsed;
    var best = null;
    var bestDiff = Infinity;
    for (var i = 0; i < activeNotes.length; i++) {
      var n = activeNotes[i];
      if (n.judged || n.ghost) continue;
      if (n.pad !== padIdx) continue;
      var diff = Math.abs(now - n.hitTime);
      if (diff < bestDiff && diff < GOOD_MS / 1000 + 0.15) {
        bestDiff = diff;
        best = n;
      }
    }

    var el = document.querySelector('.pad[data-pad="' + padIdx + '"]');
    if (el) {
      el.classList.add('active');
      setTimeout(function () { el.classList.remove('active'); }, 100);
    }
    playPadSound(padIdx);

    if (best) {
      best.judged = true;
      var ms = bestDiff * 1000;
      var pr = padRects[padIdx] || { x: W * 0.5, y: H * 0.85 };
      if (ms <= PERFECT_MS) {
        score += 150 + combo * 5;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        showJudge('PERFECT', '#00e8c8');
        spawnParticles(pr.x, pr.y, PAD_COLORS[padIdx]);
        hitPause = 0.03;
        if (stutterLayers > 0) removeStutter();
        if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
      } else {
        score += 80 + combo * 2;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        showJudge('GOOD', '#ffd166');
        spawnParticles(pr.x, pr.y, PAD_COLORS[padIdx]);
        if (stutterLayers > 0 && Math.random() < 0.5) removeStutter();
      }
    } else {
      var ghostHit = false;
      for (var j = 0; j < activeNotes.length; j++) {
        var gn = activeNotes[j];
        if (!gn.judged && gn.ghost && gn.pad === padIdx) {
          var gdiff = Math.abs(now - gn.hitTime);
          if (gdiff < GOOD_MS / 1000 + 0.1) {
            ghostHit = true;
            gn.judged = true;
            break;
          }
        }
      }
      if (ghostHit) {
        combo = 0;
        addStutter();
        showJudge('GHOST!', '#ff6b35');
      }
    }
    updateHUD();
    updateStutterMeter();
  }

  function tickNotes(dt) {
    var ci = 0;
    while (ci < chart.length && chart[ci].time <= roundElapsed + LOOKAHEAD) {
      if (!chart[ci].spawned) {
        chart[ci].spawned = true;
        spawnNote(chart[ci]);
      }
      ci++;
    }
    for (var i = activeNotes.length - 1; i >= 0; i--) {
      var n = activeNotes[i];
      if (!n.judged && !n.ghost && roundElapsed - n.hitTime > GOOD_MS / 1000 + 0.12) {
        n.judged = true;
        combo = 0;
        addStutter();
        showJudge('MISS', '#ff4444');
        updateHUD();
        updateStutterMeter();
      }
      if (roundElapsed - n.hitTime > 2) activeNotes.splice(i, 1);
    }
    for (var p = pulses.length - 1; p >= 0; p--) {
      if (roundElapsed - pulses[p].start > pulses[p].duration + 0.3) pulses.splice(p, 1);
    }
  }

  function drawBackground(t) {
    if (!ctx) return;
    var top = isDark ? '#0a0e18' : '#8898a8';
    var mid = isDark ? '#121828' : '#9aa8b8';
    var bot = isDark ? '#1a2030' : '#b0bcc8';
    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, top);
    grd.addColorStop(0.5, mid);
    grd.addColorStop(1, bot);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = isDark ? 'rgba(0,232,200,0.06)' : 'rgba(0,100,90,0.08)';
    ctx.lineWidth = 1;
    for (var gy = 0; gy < H; gy += 32) {
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(W, gy);
      ctx.stroke();
    }

    var wob = Math.sin(t * 3 + bgPhase) * 0.3;
    ctx.beginPath();
    ctx.strokeStyle = isDark ? 'rgba(0,200,180,0.35)' : 'rgba(0,140,120,0.4)';
    ctx.lineWidth = 2;
    for (var wi = 0; wi < wavePoints.length; wi++) {
      var wx = (wi / wavePoints.length) * W;
      var wy = centerY + wavePoints[wi] * 30 * (1 + stutterLayers * 0.15) + wob * 20;
      if (wi === 0) ctx.moveTo(wx, wy);
      else ctx.lineTo(wx, wy);
    }
    ctx.stroke();

    ctx.beginPath();
    ctx.strokeStyle = isDark ? 'rgba(255,107,53,0.25)' : 'rgba(255,107,53,0.35)';
    ctx.lineWidth = 1.5;
    for (var wj = 0; wj < wavePoints.length; wj++) {
      var wx2 = (wj / wavePoints.length) * W;
      var wy2 = centerY + 40 + Math.sin(wj * 0.3 + t * 5) * 18;
      if (wj === 0) ctx.moveTo(wx2, wy2);
      else ctx.lineTo(wx2, wy2);
    }
    ctx.stroke();
  }

  function drawPulses(t) {
    if (!ctx) return;
    for (var i = 0; i < pulses.length; i++) {
      var p = pulses[i];
      var prog = (roundElapsed - p.start) / p.duration;
      if (prog < 0 || prog > 1.1) continue;
      var pr = padRects[p.pad] || { x: p.tx, y: p.ty };
      var sx = centerX, sy = centerY;
      var ex = pr.x, ey = pr.y;
      var px = sx + (ex - sx) * prog;
      var py = sy + (ey - sy) * prog;
      var r = 8 + prog * 22;
      var alpha = p.ghost ? 0.25 : 0.7 - prog * 0.4;
      var col = p.ghost ? '#ff4444' : PAD_COLORS[p.pad];
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.strokeStyle = col.replace(')', ',' + alpha + ')').replace('rgb', 'rgba').replace('#', '');
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = col;
      ctx.lineWidth = p.ghost ? 1.5 : 2.5;
      ctx.stroke();
      ctx.globalAlpha = 1;

      if (!p.ghost && prog > 0.85 && prog < 1.05) {
        ctx.beginPath();
        ctx.arc(ex, ey, pr.w ? pr.w * 0.35 : 30, 0, Math.PI * 2);
        ctx.strokeStyle = PAD_COLORS[p.pad];
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.5 + Math.sin(t * 20) * 0.3;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawParticles(dt) {
    if (!ctx) return;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 120 * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawStutterOverlay(t) {
    if (!ctx || stutterLayers === 0) return;
    var intensity = stutterLayers / MAX_STUTTER;
    stutterPhase += dt * (1 + stutterLayers * 0.5);
    for (var layer = 0; layer < stutterLayers; layer++) {
      var offset = Math.sin(stutterPhase * (3 + layer) + layer) * (4 + layer * 3) * intensity;
      ctx.save();
      ctx.globalAlpha = 0.08 + layer * 0.04;
      ctx.fillStyle = layer % 2 === 0 ? '#00e8c8' : '#ff6b35';
      for (var sy = 0; sy < H; sy += 6 + layer * 2) {
        if ((sy + layer) % 3 === 0) {
          ctx.fillRect(offset * (layer + 1), sy, W, 3);
        }
      }
      ctx.restore();
    }
    if (stutterFreeze > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.04 * intensity) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  var dt = 0.016;
  function frame(now) {
    if (!lastFrame) lastFrame = now;
    dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;

    if (state === 'playing') {
      if (hitPause > 0) hitPause -= dt;
      else roundElapsed += dt;

      timeLeft = ROUND_TIME - roundElapsed;
      bpm = bpmAtTime(roundElapsed);
      ghostChance = 0.08 + roundElapsed * 0.004;

      tickNotes(dt);
      updateHUD();

      if (timeLeft <= 0) endGame();
    }

    if (shakeT > 0) shakeT -= dt;
    if (stutterFreeze > 0) stutterFreeze -= dt;

    var sx = shakeT > 0 ? (Math.random() - 0.5) * 8 * shakeT : 0;
    var sy = shakeT > 0 ? (Math.random() - 0.5) * 6 * shakeT : 0;

    if (ctx) {
      ctx.save();
      ctx.translate(sx, sy);
      drawBackground(now * 0.001);
      if (state === 'playing' && hitPause <= 0) {
        drawPulses(now * 0.001);
        drawParticles(dt);
        drawStutterOverlay(now * 0.001);
      }
      ctx.restore();
    }

    for (var w = 0; w < wavePoints.length; w++) {
      wavePoints[w] += (Math.random() - 0.5) * 0.15 * (1 + stutterLayers * 0.2);
      wavePoints[w] *= 0.92;
    }

    animId = requestAnimationFrame(frame);
  }

  function onPadTap(padIdx, e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    judgePad(padIdx);
  }

  padEls.forEach(function (el) {
    var idx = parseInt(el.getAttribute('data-pad'), 10);
    el.addEventListener('touchstart', function (e) { onPadTap(idx, e); }, { passive: false });
    el.addEventListener('mousedown', function (e) { onPadTap(idx, e); });
  });

  var KEY_MAP = { '1': 0, '2': 1, '3': 2, '4': 3, d: 0, f: 1, j: 2, k: 3 };
  document.addEventListener('keydown', function (e) {
    if (!e || !e.key) return;
    var k = e.key.toLowerCase();
    if (KEY_MAP[k] !== undefined) {
      e.preventDefault();
      onPadTap(KEY_MAP[k], null);
    }
  });

  if (btnStart) btnStart.addEventListener('click', function (e) { e.preventDefault(); startGame(); });
  if (btnRestart) btnRestart.addEventListener('click', function (e) { e.preventDefault(); startGame(); });

  canvas.addEventListener('touchstart', function (e) {
    if (e) e.preventDefault();
    resumeAudio();
  }, { passive: false });

  canvas.addEventListener('click', function () { resumeAudio(); });

  window.addEventListener('resize', function () { resize(); updatePadRects(); });

  resize();
  updateHUD();
  updateStutterMeter();
  animId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
