<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Breaker — SF Pulse</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #e8ecef;
    --fg: #1a2332;
    --muted: #5a6578;
    --accent: #00b8a9;
    --accent2: #e85d04;
    --panel: rgba(255,255,255,0.88);
    --panel-border: rgba(0,0,0,0.08);
    --shadow: rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #2dd4bf;
      --accent2: #fb923c;
      --panel: rgba(13,17,23,0.92);
      --panel-border: rgba(255,255,255,0.08);
      --shadow: rgba(0,0,0,0.5);
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    min-height: 100dvh;
  }
  canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
    padding: 24px;
    text-align: center;
    transition: opacity 0.4s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 8px 32px var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .sub {
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .btn {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    min-width: 160px;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  @media (prefers-color-scheme: light) {
    .btn { color: #0d1117; }
  }
  .btn:active { transform: scale(0.96); filter: brightness(0.92); }
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: max(12px, env(safe-area-inset-top)) 16px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
  }
  #hud.hidden { opacity: 0; }
  .hud-block { display: flex; flex-direction: column; gap: 2px; }
  .hud-label { color: var(--muted); font-size: 0.62rem; text-transform: uppercase; }
  .hud-val { font-size: 1rem; font-weight: 600; }
  #combo-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    text-shadow: 0 0 20px var(--accent);
    transition: opacity 0.15s;
  }
  #combo-display.show { opacity: 1; }
  #feedback {
    position: absolute;
    bottom: 28%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    pointer-events: none;
    z-index: 6;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #feedback.show { opacity: 1; }
  .score-big {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--accent);
    margin: 8px 0 4px;
  }
  .stat-row {
    display: flex;
    justify-content: space-around;
    margin: 16px 0;
    font-size: 0.75rem;
  }
  .stat-row span { color: var(--muted); display: block; font-size: 0.6rem; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div class="hud-block"><span class="hud-label">Score</span><span class="hud-val" id="scoreEl">0</span></div>
    <div class="hud-block" style="align-items:center"><span class="hud-label">Time</span><span class="hud-val" id="timeEl">30</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Fog</span><span class="hud-val" id="fogEl">100%</span></div>
  </div>
  <div id="combo-display"></div>
  <div id="feedback"></div>
  <div id="titleOverlay" class="overlay">
    <div class="panel">
      <h1>FOG BREAKER</h1>
      <p class="sub">Tap the glowing nodes as they hit the pulse line. Ride the house beat — each perfect streak thins the summer fog over the bay.</p>
      <button class="btn" data-smoke="start" id="startBtn">START PULSE</button>
    </div>
  </div>
  <div id="gameOverOverlay" class="overlay hidden">
    <div class="panel">
      <h1>BEAT BREAKS THROUGH</h1>
      <p class="sub" id="goMsg">The skyline emerges from the mist.</p>
      <div class="score-big" id="finalScore">0</div>
      <div class="stat-row">
        <div><span>Perfect</span><strong id="statPerfect">0</strong></div>
        <div><span>Max Combo</span><strong id="statCombo">0</strong></div>
        <div><span>Skyline</span><strong id="statSky">0%</strong></div>
      </div>
      <button class="btn" data-smoke="restart" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var titleOverlay = document.getElementById('titleOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var hud = document.getElementById('hud');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var scoreEl = document.getElementById('scoreEl');
  var timeEl = document.getElementById('timeEl');
  var fogEl = document.getElementById('fogEl');
  var comboDisplay = document.getElementById('combo-display');
  var feedbackEl = document.getElementById('feedback');
  var finalScore = document.getElementById('finalScore');
  var statPerfect = document.getElementById('statPerfect');
  var statCombo = document.getElementById('statCombo');
  var statSky = document.getElementById('statSky');
  var goMsg = document.getElementById('goMsg');

  var W = 390, H = 844;
  var state = 'title';
  var notes = [];
  var particles = [];
  var lastFrame = 0;
  var gameStart = 0;
  var wallStart = 0;
  var useWallClock = false;
  var ROUND_SEC = 30;
  var score = 0;
  var combo = 0;
  var maxCombo = 0;
  var perfects = 0;
  var fog = 1;
  var targetFog = 1;
  var missStreak = 0;
  var decoyChance = 0;
  var ghostChance = 0;
  var nextBeatIdx = 0;
  var beatTimes = [];
  var audioCtx = null;
  var masterGain = null;
  var schedulerId = null;
  var nextNoteTime = 0;
  var scheduleAhead = 0.15;
  var lookahead = 25;
  var bpm = 105;
  var beatDur = 60 / bpm;
  var hitY = 0;
  var pulsePhase = 0;
  var feedbackTimer = 0;
  var comboTimer = 0;
  var shake = 0;
  var darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

  var PERFECT_MS = 55;
  var GOOD_MS = 110;
  var LANES = 4;
  var TRAVEL_TIME = 0.85;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 390;
    H = window.innerHeight || 844;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    hitY = H * 0.72;
  }

  function initAudio() {
    if (audioCtx) return true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(audioCtx.destination);
      return true;
    } catch (e) {
      return false;
    }
  }

  function playKick(t) {
    if (!audioCtx || !masterGain) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.08);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g);
    g.connect(masterGain);
    o.start(t);
    o.stop(t + 0.15);
  }

  function playHat(t, vol) {
    if (!audioCtx || !masterGain) return;
    vol = vol || 0.25;
    var len = Math.floor(audioCtx.sampleRate * 0.04);
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    var g = audioCtx.createGain();
    g.gain.value = vol;
    var hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 7000;
    src.connect(hp);
    hp.connect(g);
    g.connect(masterGain);
    src.start(t);
    src.stop(t + 0.04);
  }

  function playSnare(t) {
    if (!audioCtx || !masterGain) return;
    playHat(t, 0.35);
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(80, t + 0.06);
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(g);
    g.connect(masterGain);
    o.start(t);
    o.stop(t + 0.12);
  }

  function playSynth(t, freq) {
    if (!audioCtx || !masterGain) return;
    freq = freq || 440;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g);
    g.connect(masterGain);
    o.start(t);
    o.stop(t + 0.3);
  }

  function playMissTone() {
    if (!audioCtx || !masterGain) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(120, t);
    o.frequency.linearRampToValueAtTime(80, t + 0.15);
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g);
    g.connect(masterGain);
    o.start(t);
    o.stop(t + 0.25);
  }

  function getBpm(elapsed) {
    return 105 + (elapsed / ROUND_SEC) * 28;
  }

  function buildBeatTimes() {
    beatTimes = [];
    var t = 0;
    var idx = 0;
    while (t < ROUND_SEC + 2) {
      var bpmNow = getBpm(t);
      var bd = 60 / bpmNow;
      beatTimes.push({ time: t, idx: idx, bpm: bpmNow });
      t += bd;
      idx++;
    }
  }

  function spawnNote(beatInfo, type, laneOverride) {
    type = type || 'real';
    var lane = laneOverride != null ? laneOverride : (beatInfo.idx % LANES);
    var laneW = W / LANES;
    var x = laneW * lane + laneW * 0.5;
    notes.push({
      x: x,
      y: -20,
      lane: lane,
      spawnTime: beatInfo.time - TRAVEL_TIME,
      hitTime: beatInfo.time,
      type: type,
      hit: false,
      missed: false,
      alpha: type === 'ghost' ? 0.35 : 1,
      size: type === 'decoy' ? 14 : 18
    });
  }

  function spawnBeatNotes() {
    for (var i = 0; i < beatTimes.length; i++) {
      var bt = beatTimes[i];
      if (bt.time > ROUND_SEC) break;
      spawnNote(bt, 'real');
    }
  }

  function maybeSpawnTrap(elapsed) {
    if (decoyChance > 0 && Math.random() < decoyChance * 0.15) {
      spawnNote({ time: elapsed + TRAVEL_TIME + 0.4, idx: nextBeatIdx }, 'decoy', Math.floor(Math.random() * LANES));
    }
    if (ghostChance > 0 && Math.random() < ghostChance * 0.12) {
      spawnNote({ time: elapsed + TRAVEL_TIME + 0.55, idx: nextBeatIdx }, 'ghost', Math.floor(Math.random() * LANES));
    }
  }

  function scheduleBeatsFromAudio() {
    if (!audioCtx || state !== 'playing') return;
    while (nextNoteTime < audioCtx.currentTime + scheduleAhead) {
      var elapsed = audioCtx.currentTime - gameStart;
      if (elapsed >= ROUND_SEC) break;
      bpm = getBpm(elapsed);
      beatDur = 60 / bpm;
      var beatInBar = nextBeatIdx % 4;
      if (beatInBar === 0) playKick(nextNoteTime);
      else if (beatInBar === 2) playSnare(nextNoteTime);
      playHat(nextNoteTime, beatInBar % 2 === 0 ? 0.18 : 0.12);

      nextBeatIdx++;
      nextNoteTime += beatDur;
    }
  }

  function startScheduler() {
    useWallClock = !initAudio();
    if (useWallClock) {
      wallStart = performance.now() + 500;
      if (schedulerId) clearInterval(schedulerId);
      schedulerId = setInterval(function () {
        try {
          var elapsed = getElapsed();
          if (elapsed >= ROUND_SEC) return;
          bpm = getBpm(elapsed);
          beatDur = 60 / bpm;
          while (nextBeatIdx < beatTimes.length && beatTimes[nextBeatIdx].time <= elapsed + scheduleAhead) {
            var beatInBar = nextBeatIdx % 4;
            if (beatInBar === 0 || beatInBar === 2) { /* silent fallback */ }
            nextBeatIdx++;
          }
        } catch (e) {}
      }, lookahead);
      return;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(function () {});
    nextNoteTime = audioCtx.currentTime + 0.5;
    gameStart = audioCtx.currentTime + 0.5;
    wallStart = performance.now() + 500;
    nextBeatIdx = 0;
    if (schedulerId) clearInterval(schedulerId);
    schedulerId = setInterval(function () {
      try { scheduleBeatsFromAudio(); } catch (e) {}
    }, lookahead);
  }

  function stopScheduler() {
    if (schedulerId) { clearInterval(schedulerId); schedulerId = null; }
  }

  function showFeedback(text, color) {
    feedbackEl.textContent = text;
    feedbackEl.style.color = color || 'var(--accent)';
    feedbackEl.classList.add('show');
    feedbackTimer = 0.5;
  }

  function spawnParticles(x, y, col, n) {
    n = n || 8;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 80;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.4 + Math.random() * 0.3,
        maxLife: 0.7,
        color: col,
        size: 2 + Math.random() * 3
      });
    }
  }

  function findHittableNote() {
    if (state !== 'playing') return null;
    var elapsed = getElapsed();
    var best = null;
    var bestDiff = Infinity;
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.hit || n.missed) continue;
      var diff = Math.abs(elapsed - n.hitTime) * 1000;
      if (diff < bestDiff && diff <= GOOD_MS + 30) {
        bestDiff = diff;
        best = n;
      }
    }
    return best ? { note: best, diff: bestDiff } : null;
  }

  function getElapsed() {
    if (useWallClock) return Math.max(0, (performance.now() - wallStart) / 1000);
    if (!audioCtx || !gameStart) return 0;
    return Math.max(0, audioCtx.currentTime - gameStart);
  }

  function onTap(clientX, clientY) {
    if (state !== 'playing') return;
    var elapsed = getElapsed();
    if (elapsed >= ROUND_SEC) return;

    var hit = findHittableNote();
    if (!hit) {
      combo = 0;
      missStreak++;
      fog = Math.min(1, fog + 0.04);
      targetFog = fog;
      decoyChance = Math.min(0.5, decoyChance + 0.06);
      ghostChance = Math.min(0.4, ghostChance + 0.05);
      showFeedback('MISS', '#ef4444');
      playMissTone();
      shake = 4;
      maybeSpawnTrap(elapsed);
      try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
      return;
    }

    var n = hit.note;
    var diff = hit.diff;

    if (n.type === 'ghost') {
      combo = 0;
      missStreak++;
      fog = Math.min(1, fog + 0.06);
      targetFog = fog;
      n.hit = true;
      showFeedback('GHOST!', '#94a3b8');
      playMissTone();
      shake = 5;
      try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
      return;
    }

    if (n.type === 'decoy') {
      combo = 0;
      missStreak++;
      fog = Math.min(1, fog + 0.05);
      targetFog = fog;
      n.hit = true;
      showFeedback('DECOY', '#f97316');
      playMissTone();
      shake = 4;
      return;
    }

    n.hit = true;
    var pts = 0;
    var label = '';
    var col = '#2dd4bf';

    if (diff <= PERFECT_MS) {
      pts = 100 + combo * 10;
      perfects++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      label = 'PERFECT';
      col = '#2dd4bf';
      fog = Math.max(0, fog - 0.035);
      targetFog = fog;
      missStreak = 0;
      decoyChance = Math.max(0, decoyChance - 0.02);
      ghostChance = Math.max(0, ghostChance - 0.02);
      if (audioCtx) playSynth(audioCtx.currentTime, 440 + combo * 20);
      spawnParticles(n.x, hitY, col, 12);
      try { navigator.vibrate && navigator.vibrate(15); } catch (e) {}
    } else if (diff <= GOOD_MS) {
      pts = 50;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      label = 'GOOD';
      col = '#38bdf8';
      fog = Math.max(0, fog - 0.015);
      targetFog = fog;
      missStreak = 0;
      spawnParticles(n.x, hitY, col, 6);
    } else {
      combo = 0;
      missStreak++;
      label = 'LATE';
      col = '#fbbf24';
      fog = Math.min(1, fog + 0.02);
      targetFog = fog;
    }

    score += pts;
    showFeedback(label, col);
    if (combo >= 3) {
      comboDisplay.textContent = combo + 'x';
      comboDisplay.classList.add('show');
      comboTimer = 0.8;
    }
    scoreEl.textContent = score;
  }

  function endGame() {
    state = 'gameover';
    stopScheduler();
    hud.classList.add('hidden');
    comboDisplay.classList.remove('show');
    var skyPct = Math.round((1 - fog) * 100);
    finalScore.textContent = score;
    statPerfect.textContent = perfects;
    statCombo.textContent = maxCombo;
    statSky.textContent = skyPct + '%';
    if (skyPct >= 70) goMsg.textContent = 'The beat cuts through — skyline fully revealed.';
    else if (skyPct >= 40) goMsg.textContent = 'The fog lifts. Towers glimmer through the haze.';
    else goMsg.textContent = 'The mist holds. Keep riding the pulse.';
    gameOverOverlay.classList.remove('hidden');
  }

  function resetGame() {
    notes = [];
    particles = [];
    score = 0;
    combo = 0;
    maxCombo = 0;
    perfects = 0;
    fog = 1;
    targetFog = 1;
    missStreak = 0;
    decoyChance = 0;
    ghostChance = 0;
    nextBeatIdx = 0;
    feedbackTimer = 0;
    comboTimer = 0;
    shake = 0;
    scoreEl.textContent = '0';
    timeEl.textContent = String(ROUND_SEC);
    fogEl.textContent = '100%';
    buildBeatTimes();
    spawnBeatNotes();
  }

  function startGame() {
    resetGame();
    titleOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    hud.classList.remove('hidden');
    state = 'playing';
    startScheduler();
  }

  function drawSkyline(reveal) {
    var baseY = H * 0.55;
    var alpha = reveal * 0.85 + 0.05;
    var neon1 = darkMode ? '#2dd4bf' : '#00a896';
    var neon2 = darkMode ? '#fb923c' : '#e85d04';
    var neon3 = darkMode ? '#67e8f9' : '#0891b2';

    ctx.save();
    ctx.globalAlpha = alpha;

    ctx.strokeStyle = neon1;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, baseY + 40);
    for (var i = 0; i <= 20; i++) {
      var px = (W / 20) * i;
      var py = baseY + 30 + Math.sin(i * 0.8) * 12 + Math.cos(i * 1.3) * 8;
      ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.strokeStyle = neon2;
    ctx.lineWidth = 2;
    ctx.beginPath();
    var gx = W * 0.15;
    ctx.moveTo(gx - 30, baseY + 20);
    ctx.lineTo(gx - 30, baseY - 60);
    ctx.lineTo(gx - 10, baseY - 80);
    ctx.lineTo(gx + 10, baseY - 60);
    ctx.lineTo(gx + 10, baseY + 20);
    ctx.moveTo(gx + 50, baseY + 20);
    ctx.lineTo(gx + 50, baseY - 50);
    ctx.lineTo(gx + 70, baseY - 70);
    ctx.lineTo(gx + 90, baseY - 50);
    ctx.lineTo(gx + 90, baseY + 20);
    ctx.stroke();

    ctx.strokeStyle = neon3;
    var buildings = [
      { x: W * 0.35, w: 18, h: 90 },
      { x: W * 0.42, w: 28, h: 130 },
      { x: W * 0.52, w: 14, h: 70 },
      { x: W * 0.58, w: 22, h: 110 },
      { x: W * 0.65, w: 16, h: 85 },
      { x: W * 0.72, w: 30, h: 150 },
      { x: W * 0.80, w: 20, h: 95 },
      { x: W * 0.87, w: 24, h: 120 }
    ];
    buildings.forEach(function (b) {
      ctx.strokeRect(b.x, baseY + 20 - b.h, b.w, b.h);
      var floors = Math.floor(b.h / 12);
      for (var f = 1; f < floors; f++) {
        ctx.beginPath();
        ctx.moveTo(b.x, baseY + 20 - f * 12);
        ctx.lineTo(b.x + b.w, baseY + 20 - f * 12);
        ctx.stroke();
      }
    });

    ctx.strokeStyle = neon1;
    ctx.beginPath();
    ctx.moveTo(W * 0.48, baseY - 130);
    ctx.lineTo(W * 0.48, baseY - 170);
    ctx.lineTo(W * 0.50, baseY - 185);
    ctx.lineTo(W * 0.52, baseY - 170);
    ctx.lineTo(W * 0.52, baseY - 130);
    ctx.stroke();

    ctx.restore();
  }

  function drawFog(t, fogAmt) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    if (darkMode) {
      g.addColorStop(0, 'rgba(13,17,23,' + (0.3 + fogAmt * 0.5) + ')');
      g.addColorStop(0.5, 'rgba(30,40,55,' + (0.4 + fogAmt * 0.45) + ')');
      g.addColorStop(1, 'rgba(45,55,70,' + (0.5 + fogAmt * 0.4) + ')');
    } else {
      g.addColorStop(0, 'rgba(200,210,220,' + (0.35 + fogAmt * 0.5) + ')');
      g.addColorStop(0.5, 'rgba(180,190,200,' + (0.45 + fogAmt * 0.45) + ')');
      g.addColorStop(1, 'rgba(160,175,190,' + (0.55 + fogAmt * 0.35) + ')');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    for (var i = 0; i < 6; i++) {
      var fx = (Math.sin(t * 0.0003 + i * 1.7) * 0.5 + 0.5) * W;
      var fy = H * (0.3 + i * 0.12) + Math.sin(t * 0.0004 + i) * 20;
      var fr = W * (0.25 + fogAmt * 0.2);
      var fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr);
      fg.addColorStop(0, darkMode ? 'rgba(140,160,180,' + (fogAmt * 0.15) + ')' : 'rgba(255,255,255,' + (fogAmt * 0.2) + ')');
      fg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(fx - fr, fy - fr, fr * 2, fr * 2);
    }
    ctx.restore();
  }

  function drawHitLine(t) {
    pulsePhase = (Math.sin(t * 0.008) + 1) * 0.5;
    var glow = 0.4 + pulsePhase * 0.3;

    ctx.save();
    ctx.strokeStyle = darkMode ? 'rgba(80,90,110,0.25)' : 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 1;
    var laneW = W / LANES;
    for (var li = 1; li < LANES; li++) {
      ctx.beginPath();
      ctx.moveTo(laneW * li, H * 0.12);
      ctx.lineTo(laneW * li, hitY + 40);
      ctx.stroke();
    }

    ctx.strokeStyle = darkMode ? 'rgba(45,212,191,' + glow + ')' : 'rgba(0,168,150,' + glow + ')';
    ctx.lineWidth = 2;
    ctx.shadowColor = darkMode ? '#2dd4bf' : '#00a896';
    ctx.shadowBlur = 12 + pulsePhase * 8;
    ctx.beginPath();
    ctx.moveTo(W * 0.08, hitY);
    ctx.lineTo(W * 0.92, hitY);
    ctx.stroke();

    ctx.fillStyle = darkMode ? 'rgba(45,212,191,0.15)' : 'rgba(0,168,150,0.12)';
    ctx.fillRect(W * 0.08, hitY - 28, W * 0.84, 56);
    ctx.restore();
  }

  function drawNotes(elapsed) {
    notes.forEach(function (n) {
      if (n.hit && n.type !== 'real') return;
      if (elapsed < n.spawnTime) return;
      var progress = (elapsed - n.spawnTime) / TRAVEL_TIME;
      if (progress > 1) progress = 1;
      n.y = -20 + (hitY + 20) * progress;

      if (!n.hit && !n.missed && elapsed - n.hitTime > GOOD_MS / 1000 + 0.15) {
        n.missed = true;
        if (n.type === 'real') {
          combo = 0;
          missStreak++;
          fog = Math.min(1, fog + 0.03);
          targetFog = fog;
          decoyChance = Math.min(0.5, decoyChance + 0.04);
          ghostChance = Math.min(0.4, ghostChance + 0.03);
          maybeSpawnTrap(elapsed);
        }
      }

      if (n.missed && elapsed - n.hitTime > 0.6) return;
      if (n.hit && elapsed - n.hitTime > 0.2) return;

      var col = darkMode ? '#2dd4bf' : '#00a896';
      if (n.type === 'ghost') col = darkMode ? '#64748b' : '#94a3b8';
      if (n.type === 'decoy') col = darkMode ? '#fb923c' : '#e85d04';

      var dist = Math.abs(elapsed - n.hitTime);
      var pulse = 1 + (dist < 0.1 ? (1 - dist / 0.1) * 0.3 : 0);

      ctx.save();
      ctx.globalAlpha = n.alpha * (n.missed ? 0.3 : 1);
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = n.type === 'real' ? 16 : 8;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.size * pulse, 0, Math.PI * 2);
      ctx.fill();

      if (n.type === 'real') {
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.4;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.size * pulse + 8, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    });
  }

  function drawParticles(dt) {
    particles = particles.filter(function (p) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 120 * dt;
      if (p.life <= 0) return false;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      return true;
    });
    ctx.globalAlpha = 1;
  }

  function drawBg() {
    if (darkMode) {
      ctx.fillStyle = '#0d1117';
    } else {
      ctx.fillStyle = '#dce3ea';
    }
    ctx.fillRect(0, 0, W, H);
  }

  function update(dt) {
    fog += (targetFog - fog) * dt * 3;
    if (feedbackTimer > 0) {
      feedbackTimer -= dt;
      if (feedbackTimer <= 0) feedbackEl.classList.remove('show');
    }
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) comboDisplay.classList.remove('show');
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 20);

    if (state === 'playing') {
      var elapsed = getElapsed();
      var remaining = Math.ceil(ROUND_SEC - elapsed);
      if (remaining < 0) remaining = 0;
      timeEl.textContent = String(remaining);
      fogEl.textContent = Math.round(fog * 100) + '%';

      notes = notes.filter(function (n) {
        return !(n.missed && elapsed - n.hitTime > 0.8) && !(n.hit && elapsed - n.hitTime > 0.3);
      });

      if (elapsed >= ROUND_SEC) endGame();
    }
  }

  function render(t) {
    var dt = Math.min(0.05, (t - lastFrame) / 1000 || 0.016);
    lastFrame = t;
    update(dt);

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawBg();
    var reveal = 1 - fog;
    drawSkyline(reveal);

    if (state === 'playing') {
      var elapsed = getElapsed();
      drawHitLine(t);
      drawNotes(elapsed);
      drawParticles(dt);
    } else if (state === 'title') {
      drawSkyline(0.15);
      drawHitLine(t);
    }

    var fogAmt = state === 'playing' ? fog : (state === 'title' ? 0.85 : fog);
    drawFog(t, fogAmt);

    ctx.restore();
    requestAnimationFrame(render);
  }

  function handlePointer(e) {
    if (e.target && (e.target.closest && e.target.closest('.btn'))) return;
    e.preventDefault();
    var x = e.clientX;
    var y = e.clientY;
    if (e.changedTouches && e.changedTouches[0]) {
      x = e.changedTouches[0].clientX;
      y = e.changedTouches[0].clientY;
    }
    onTap(x, y);
  }

  canvas.addEventListener('touchstart', handlePointer, { passive: false });
  canvas.addEventListener('mousedown', handlePointer);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      onTap(W / 2, hitY);
    }
  });

  startBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    startGame();
  });
  restartBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    startGame();
  });

  window.addEventListener('resize', resize);
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      darkMode = e.matches;
    });
  }

  resize();
  buildBeatTimes();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
