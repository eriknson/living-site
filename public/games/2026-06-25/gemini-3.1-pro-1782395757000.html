<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbital Scoop</title>
<style>
  :root {
    --bg: #050505;
    --fg: #00ffcc;
    --danger: #ff3333;
    --core: #111111;
    --scanline: rgba(0, 255, 204, 0.05);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f0f0;
      --fg: #005544;
      --danger: #cc0000;
      --core: #dddddd;
      --scanline: rgba(0, 85, 68, 0.05);
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .scanlines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, transparent 50%, var(--scanline) 51%);
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 5;
  }
  .ui-layer {
    position: absolute;
    top: 20px; left: 20px; right: 20px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 20;
    font-size: 1.2rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  button {
    pointer-events: auto;
    background: var(--bg);
    color: var(--fg);
    border: 2px solid var(--fg);
    padding: 15px 30px;
    font-family: inherit;
    font-size: 1.5rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    touch-action: auto;
  }
  button:active {
    background: var(--fg);
    color: var(--bg);
  }
  #startScreen, #gameOverScreen {
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  @media (prefers-color-scheme: light) {
    #startScreen, #gameOverScreen {
      background: rgba(255,255,255,0.8);
    }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #050505;
      --fg: #00ffcc;
      --danger: #ff3333;
      --core: #111111;
      --scanline: rgba(0, 255, 204, 0.05);
    }
    #startScreen, #gameOverScreen {
      background: rgba(0,0,0,0.8);
    }
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    text-align: center;
    text-shadow: 0 0 10px var(--scanline);
  }
  p {
    margin-bottom: 30px;
    text-align: center;
    max-width: 80%;
    line-height: 1.6;
    font-size: 1.1rem;
  }
  .hidden {
    display: none !important;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div class="scanlines"></div>

<div class="ui-layer">
  <div id="scoreDisplay">DATA: 0</div>
  <div id="warnContainer" style="text-align: right;">
    <div id="warnDisplay" style="color: var(--danger); opacity: 0; transition: opacity 0.2s;">SCANNING</div>
    <div id="exposureBarBg" style="width: 100px; height: 4px; background: rgba(255,51,51,0.2); margin-top: 5px; float: right; opacity: 0; transition: opacity 0.2s;">
      <div id="exposureBar" style="width: 0%; height: 100%; background: var(--danger); transition: width 0.1s linear;"></div>
    </div>
  </div>
</div>

<div id="startScreen" class="overlay">
  <h1>ORBITAL SCOOP</h1>
  <p>Flick to launch orbit.<br>Hold to brake.<br>Collect data fragments.<br>Evade surveillance sweeps.</p>
  <button data-smoke="start" id="startBtn">INITIALIZE</button>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <h1>SIGNAL LOST</h1>
  <p id="finalScore">DATA RECOVERED: 0</p>
  <button data-smoke="restart" id="restartBtn">REBOOT</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const scoreDisplay = document.getElementById('scoreDisplay');
const warnDisplay = document.getElementById('warnDisplay');
const exposureBarBg = document.getElementById('exposureBarBg');
const exposureBar = document.getElementById('exposureBar');
const finalScore = document.getElementById('finalScore');

let width, height, cx, cy;
let R_core;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  cx = width / 2;
  cy = height / 2;
  R_core = Math.min(width, height) * 0.08;
}
window.addEventListener('resize', resize);
resize();

function getColors() {
  const rs = getComputedStyle(document.documentElement);
  return {
    bg: rs.getPropertyValue('--bg').trim(),
    fg: rs.getPropertyValue('--fg').trim(),
    danger: rs.getPropertyValue('--danger').trim(),
    core: rs.getPropertyValue('--core').trim()
  };
}

let audioCtx;
function playSound(type) {
  try {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    if (type === 'flick') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'collect') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.setValueAtTime(1200, now + 0.05);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'over') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.start(now);
      osc.stop(now + 0.5);
    }
  } catch (e) {
    // Ignore audio errors
  }
}

function vibrate(ms) {
  try {
    if (navigator && navigator.vibrate) {
      navigator.vibrate(ms);
    }
  } catch(e) {}
}

let state = 'start';
let score = 0;
let time = 0;
let exposure = 0;

let probe = { x: 0, y: 0, vx: 0, vy: 0, radius: 8 };
let sweeps = [];
let dataFrags = [];
let particles = [];
let trail = [];
let stars = [];

for (let i=0; i<100; i++) {
  stars.push({
    x: (Math.random() - 0.5) * 2000,
    y: (Math.random() - 0.5) * 2000,
    size: Math.random() * 1.5,
    alpha: Math.random()
  });
}

let input = {
  active: false,
  startX: 0, startY: 0,
  currX: 0, currY: 0,
  isDragging: false
};

const G = 300;

function initGame() {
  score = 0;
  time = 0;
  exposure = 0;
  scoreDisplay.innerText = `DATA: ${score}`;
  warnDisplay.style.opacity = 0;
  exposureBarBg.style.opacity = 0;
  
  const initR = Math.min(width, height) * 0.3;
  probe.x = 0;
  probe.y = -initR;
  probe.vx = Math.sqrt(G * initR);
  probe.vy = 0;
  
  sweeps = [
    { angle: Math.PI / 2, width: 0.5, speed: 1.2 }
  ];
  
  dataFrags = [];
  spawnData();
  
  particles = [];
  trail = [];
  state = 'playing';
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function spawnData() {
  const minR = R_core * 1.5;
  const maxR = Math.min(width, height) / 2 * 0.8;
  const r = minR + Math.random() * (maxR - minR);
  const a = Math.random() * Math.PI * 2;
  dataFrags.push({
    x: Math.cos(a) * r,
    y: Math.sin(a) * r,
    radius: 8,
    pulse: 0
  });
}

function spawnParticles(x, y, color, count, speed) {
  for (let i=0; i<count; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = Math.random() * speed;
    particles.push({
      x, y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v,
      life: 1.0,
      decay: 0.02 + Math.random() * 0.03,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

function handleStart(x, y) {
  if (state !== 'playing') return;
  input.active = true;
  input.startX = x;
  input.startY = y;
  input.currX = x;
  input.currY = y;
  input.isDragging = false;
}

function handleMove(x, y) {
  if (!input.active) return;
  input.currX = x;
  input.currY = y;
  const dx = input.currX - input.startX;
  const dy = input.currY - input.startY;
  if (Math.hypot(dx, dy) > 10) {
    input.isDragging = true;
  }
}

function handleEnd() {
  if (!input.active) return;
  input.active = false;
  if (input.isDragging) {
    const dx = input.currX - input.startX;
    const dy = input.currY - input.startY;
    const dist = Math.hypot(dx, dy);
    const maxFlick = 150;
    const scale = dist > maxFlick ? maxFlick / dist : 1;
    
    probe.vx += dx * scale * 4;
    probe.vy += dy * scale * 4;
    
    playSound('flick');
    spawnParticles(probe.x + cx, probe.y + cy, getColors().fg, 10, 100);
  }
  input.isDragging = false;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  handleStart(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  handleMove(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  handleEnd();
}, {passive: false});
canvas.addEventListener('mousedown', e => {
  handleStart(e.clientX, e.clientY);
});
window.addEventListener('mousemove', e => {
  if (input.active) handleMove(e.clientX, e.clientY);
});
window.addEventListener('mouseup', e => {
  handleEnd();
});

function handleKeyDown(e) {
  if (state === 'start' && (e.key === 'Enter' || e.key === ' ')) {
    startScreen.classList.add('hidden');
    initGame();
    e.preventDefault();
    return;
  }
  if (state === 'over' && (e.key === 'Enter' || e.key === ' ')) {
    gameOverScreen.classList.add('hidden');
    initGame();
    e.preventDefault();
    return;
  }
  if (state !== 'playing') return;
  if (e.key === ' ' || e.key === 'Shift') {
    input.active = true;
    input.isDragging = false;
    e.preventDefault();
  }
}

function handleKeyUp(e) {
  if (state !== 'playing') return;
  const dirs = {
    ArrowUp: [0, -100],
    ArrowDown: [0, 100],
    ArrowLeft: [-100, 0],
    ArrowRight: [100, 0]
  };
  if (dirs[e.key]) {
    const [dx, dy] = dirs[e.key];
    probe.vx += dx * 4;
    probe.vy += dy * 4;
    playSound('flick');
    spawnParticles(probe.x + cx, probe.y + cy, getColors().fg, 10, 100);
    e.preventDefault();
  }
  if (e.key === ' ' || e.key === 'Shift') {
    input.active = false;
    e.preventDefault();
  }
}

document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

let lastTime = 0;
function loop(now) {
  if (state !== 'playing') return;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  
  update(dt);
  draw();
  
  requestAnimationFrame(loop);
}

function update(dt) {
  time += dt;
  const colors = getColors();
  
  if (input.active && !input.isDragging) {
    probe.vx *= Math.pow(0.05, dt);
    probe.vy *= Math.pow(0.05, dt);
    if (Math.random() < 0.4) {
      particles.push({
        x: probe.x + cx, y: probe.y + cy,
        vx: -probe.vx * 0.2 + (Math.random()-0.5)*30,
        vy: -probe.vy * 0.2 + (Math.random()-0.5)*30,
        life: 1.0, decay: 0.05, color: colors.fg, size: 2
      });
    }
  }
  
  probe.vx *= Math.pow(0.98, dt);
  probe.vy *= Math.pow(0.98, dt);
  
  const distSq = probe.x*probe.x + probe.y*probe.y;
  const dist = Math.sqrt(distSq);
  if (dist > 0) {
    probe.vx -= (probe.x / dist) * G * dt;
    probe.vy -= (probe.y / dist) * G * dt;
  }
  
  probe.x += probe.vx * dt;
  probe.y += probe.vy * dt;
  
  trail.push({ x: probe.x, y: probe.y });
  if (trail.length > 25) trail.shift();
  
  const maxR = Math.max(width, height) * 0.55;
  if (dist > maxR) {
    const pull = (dist - maxR) * 10;
    probe.vx -= (probe.x / dist) * pull * dt;
    probe.vy -= (probe.y / dist) * pull * dt;
  }
  
  if (dist < R_core + probe.radius) {
    gameOver();
    return;
  }
  
  let inSweep = false;
  const probeAngle = Math.atan2(probe.y, probe.x);
  
  for (let s of sweeps) {
    s.angle = (s.angle + s.speed * dt) % (Math.PI * 2);
    let diff = probeAngle - s.angle;
    while (diff < -Math.PI) diff += Math.PI * 2;
    while (diff > Math.PI) diff -= Math.PI * 2;
    
    if (Math.abs(diff) < s.width / 2) {
      inSweep = true;
    }
  }
  
  if (inSweep) {
    exposure += dt * 1.5;
    warnDisplay.style.opacity = 1;
    exposureBarBg.style.opacity = 1;
    exposureBar.style.width = `${Math.min(100, exposure * 100)}%`;
    if (Math.random() < 0.2) vibrate(10);
    
    if (exposure >= 1) {
      gameOver();
      return;
    }
  } else {
    exposure = Math.max(0, exposure - dt * 0.5);
    if (exposure > 0) {
      warnDisplay.style.opacity = 0.5;
      exposureBarBg.style.opacity = 0.5;
      exposureBar.style.width = `${exposure * 100}%`;
    } else {
      warnDisplay.style.opacity = 0;
      exposureBarBg.style.opacity = 0;
    }
  }
  
  for (let i = dataFrags.length - 1; i >= 0; i--) {
    let d = dataFrags[i];
    d.pulse = (d.pulse + dt * 5) % (Math.PI * 2);
    const dDist = Math.hypot(probe.x - d.x, probe.y - d.y);
    if (dDist < probe.radius + d.radius + 10) {
      score++;
      scoreDisplay.innerText = `DATA: ${score}`;
      playSound('collect');
      vibrate(30);
      spawnParticles(d.x + cx, d.y + cy, colors.fg, 20, 150);
      dataFrags.splice(i, 1);
      spawnData();
      
      if (score % 5 === 0) {
        if (sweeps.length < 4) {
          sweeps.push({
            angle: Math.random() * Math.PI * 2,
            width: 0.4,
            speed: (1.0 + Math.random() * 0.8) * (Math.random() > 0.5 ? 1 : -1)
          });
        } else {
          for (let s of sweeps) {
            s.speed *= 1.15;
            s.width = Math.min(s.width * 1.1, 1.2);
          }
        }
      }
    }
  }
  
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= p.decay;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function draw() {
  const colors = getColors();
  ctx.clearRect(0, 0, width, height);
  
  ctx.fillStyle = colors.fg;
  for (let s of stars) {
    ctx.globalAlpha = s.alpha * 0.3;
    ctx.beginPath();
    ctx.arc(cx + s.x, cy + s.y, s.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1.0;
  
  const corePulse = 1.0 + 0.05 * Math.sin(time * 5);
  ctx.beginPath();
  ctx.arc(cx, cy, R_core * corePulse, 0, Math.PI * 2);
  ctx.fillStyle = colors.core;
  ctx.fill();
  ctx.strokeStyle = colors.fg;
  ctx.lineWidth = 2;
  ctx.stroke();
  
  ctx.beginPath();
  ctx.arc(cx, cy, R_core * 0.5 * corePulse, 0, Math.PI * 2);
  ctx.strokeStyle = colors.danger;
  ctx.lineWidth = 1;
  ctx.stroke();
  
  for (let s of sweeps) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, Math.max(width, height), s.angle - s.width/2, s.angle + s.width/2);
    ctx.closePath();
    
    const grad = ctx.createRadialGradient(cx, cy, R_core, cx, cy, Math.max(width, height) * 0.8);
    grad.addColorStop(0, colors.danger);
    grad.addColorStop(1, 'transparent');
    
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.3 + 0.1 * Math.sin(time * 10);
    ctx.fill();
    ctx.globalAlpha = 1.0;
    
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(s.angle - s.width/2) * R_core, cy + Math.sin(s.angle - s.width/2) * R_core);
    ctx.lineTo(cx + Math.cos(s.angle - s.width/2) * Math.max(width, height), cy + Math.sin(s.angle - s.width/2) * Math.max(width, height));
    ctx.moveTo(cx + Math.cos(s.angle + s.width/2) * R_core, cy + Math.sin(s.angle + s.width/2) * R_core);
    ctx.lineTo(cx + Math.cos(s.angle + s.width/2) * Math.max(width, height), cy + Math.sin(s.angle + s.width/2) * Math.max(width, height));
    ctx.strokeStyle = colors.danger;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  
  for (let d of dataFrags) {
    ctx.beginPath();
    ctx.arc(cx + d.x, cy + d.y, d.radius + Math.sin(d.pulse) * 2, 0, Math.PI * 2);
    ctx.fillStyle = colors.fg;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + d.x, cy + d.y, d.radius * 2 + Math.sin(d.pulse) * 4, 0, Math.PI * 2);
    ctx.fillStyle = colors.fg;
    ctx.globalAlpha = 0.2;
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
  
  if (trail.length > 1) {
    ctx.beginPath();
    ctx.moveTo(cx + trail[0].x, cy + trail[0].y);
    for (let i = 1; i < trail.length; i++) {
      ctx.lineTo(cx + trail[i].x, cy + trail[i].y);
    }
    ctx.strokeStyle = colors.fg;
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1.0;
  }
  
  ctx.save();
  ctx.translate(cx + probe.x, cy + probe.y);
  ctx.rotate(Math.atan2(probe.vy, probe.vx));
  
  ctx.beginPath();
  ctx.moveTo(probe.radius * 1.5, 0);
  ctx.lineTo(-probe.radius, probe.radius * 0.8);
  ctx.lineTo(-probe.radius, -probe.radius * 0.8);
  ctx.closePath();
  ctx.fillStyle = colors.bg;
  ctx.fill();
  ctx.strokeStyle = colors.fg;
  ctx.lineWidth = 2;
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(-probe.radius * 0.5, probe.radius * 0.5);
  ctx.lineTo(-probe.radius * 1.5, probe.radius * 2);
  ctx.lineTo(-probe.radius * 0.5, probe.radius * 2);
  ctx.lineTo(0, probe.radius * 0.5);
  ctx.moveTo(-probe.radius * 0.5, -probe.radius * 0.5);
  ctx.lineTo(-probe.radius * 1.5, -probe.radius * 2);
  ctx.lineTo(-probe.radius * 0.5, -probe.radius * 2);
  ctx.lineTo(0, -probe.radius * 0.5);
  ctx.stroke();
  
  ctx.restore();
  
  if (input.active && input.isDragging) {
    ctx.beginPath();
    ctx.moveTo(cx + probe.x, cy + probe.y);
    const dx = input.currX - input.startX;
    const dy = input.currY - input.startY;
    
    const dist = Math.hypot(dx, dy);
    const maxFlick = 150;
    const scale = dist > maxFlick ? maxFlick / dist : 1;
    const endX = cx + probe.x + dx * scale;
    const endY = cy + probe.y + dy * scale;
    
    ctx.lineTo(endX, endY);
    ctx.strokeStyle = colors.fg;
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    
    const angle = Math.atan2(dy, dx);
    ctx.beginPath();
    ctx.moveTo(endX, endY);
    ctx.lineTo(endX - 10 * Math.cos(angle - Math.PI/6), endY - 10 * Math.sin(angle - Math.PI/6));
    ctx.lineTo(endX - 10 * Math.cos(angle + Math.PI/6), endY - 10 * Math.sin(angle + Math.PI/6));
    ctx.closePath();
    ctx.fillStyle = colors.fg;
    ctx.fill();
  }
  
  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fill();
  }
  ctx.globalAlpha = 1.0;
}

function gameOver() {
  state = 'over';
  playSound('over');
  vibrate(200);
  spawnParticles(cx + probe.x, cy + probe.y, getColors().danger, 50, 200);
  draw();
  
  setTimeout(() => {
    gameOverScreen.classList.remove('hidden');
    finalScore.innerText = `DATA RECOVERED: ${score}`;
  }, 500);
}

startBtn.addEventListener('click', () => {
  startScreen.classList.add('hidden');
  initGame();
});

restartBtn.addEventListener('click', () => {
  gameOverScreen.classList.add('hidden');
  initGame();
});

draw();
</script>
</body>
</html>
