<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Drop</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #e8eef2;
    --fg: #1a2332;
    --muted: #5a6b7d;
    --accent: #00e5c0;
    --accent2: #ff6b4a;
    --panel: rgba(255,255,255,0.82);
    --wire: #00e5c0;
    --fog: rgba(200,215,230,0.55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1218;
      --fg: #e8f0f8;
      --muted: #8aa0b8;
      --accent: #00ffd0;
      --accent2: #ff8060;
      --panel: rgba(12,18,28,0.88);
      --wire: #00ffd0;
      --fog: rgba(30,45,65,0.65);
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: max(12px, env(safe-area-inset-top)) 16px 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    z-index: 2;
    pointer-events: none;
  }
  #hud span { color: var(--fg); font-size: 15px; }
  #canvas-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    pointer-events: none;
    z-index: 3;
    transition: opacity 0.35s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .overlay h1 {
    font-size: clamp(22px, 6vw, 34px);
    font-weight: 600;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    color: var(--fg);
  }
  .overlay p {
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 280px;
    margin-bottom: 28px;
  }
  .overlay .score-big {
    font-size: 42px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .overlay .score-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    margin-bottom: 24px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 180px;
    padding: 14px 28px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  button[data-smoke]:active { transform: scale(0.97); }
  @media (hover: hover) {
    button[data-smoke]:hover {
      background: var(--accent);
      color: var(--bg);
    }
  }
  #lane-hint {
    position: absolute;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    pointer-events: none;
    z-index: 2;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>score <span id="score">0</span></div>
    <div>combo <span id="combo">×1</span></div>
    <div>time <span id="time">45</span></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game"></canvas>
    <div id="title-overlay" class="overlay">
      <h1>FOG DROP</h1>
      <p>Swipe left or right through three fog lanes. Catch beat fragments before they dissolve — each one layers into your drop.</p>
      <button type="button" data-smoke="start">Enter the fog</button>
    </div>
    <div id="gameover-overlay" class="overlay hidden">
      <div class="score-big" id="final-score">0</div>
      <div class="score-label">FRAGMENTS CAUGHT</div>
      <p id="drop-msg">Your drop is building…</p>
      <button type="button" data-smoke="restart">Ride again</button>
    </div>
    <div id="lane-hint">← SWIPE LANES →</div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('score');
  var comboEl = document.getElementById('combo');
  var timeEl = document.getElementById('time');
  var finalScoreEl = document.getElementById('final-score');
  var dropMsgEl = document.getElementById('drop-msg');
  var titleOverlay = document.getElementById('title-overlay');
  var gameoverOverlay = document.getElementById('gameover-overlay');
  var laneHint = document.getElementById('lane-hint');
  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');

  if (!canvas || !ctx) return;

  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var audioCtx = null;
  var masterGain = null;

  function initAudio() {
    if (audioCtx) return true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(audioCtx.destination);
      return true;
    } catch (e) {
      return false;
    }
  }

  function resumeAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }

  var FRAG_TYPES = [
    { id: 'kick', color: '#ff6b4a', label: 'K' },
    { id: 'hat', color: '#00e5c0', label: 'H' },
    { id: 'bass', color: '#ffd060', label: 'B' },
    { id: 'stab', color: '#4ec8ff', label: 'S' }
  ];

  function playKick(t) {
    if (!audioCtx || !masterGain) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(g);
    g.connect(masterGain);
    o.start(t);
    o.stop(t + 0.4);
  }

  function playHat(t, stutter) {
    if (!audioCtx || !masterGain) return;
    var len = Math.floor(audioCtx.sampleRate * 0.04);
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    var g = audioCtx.createGain();
    var f = audioCtx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 7000;
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    src.connect(f);
    f.connect(g);
    g.connect(masterGain);
    src.start(t);
    src.stop(t + 0.06);
    if (stutter) playHat(t + 0.08, false);
  }

  function playBass(t) {
    if (!audioCtx || !masterGain) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    var f = audioCtx.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.value = 55;
    f.type = 'lowpass';
    f.frequency.value = 400;
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(f);
    f.connect(g);
    g.connect(masterGain);
    o.start(t);
    o.stop(t + 0.55);
  }

  function playStab(t) {
    if (!audioCtx || !masterGain) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(440, t + 0.08);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g);
    g.connect(masterGain);
    o.start(t);
    o.stop(t + 0.2);
  }

  function playFragmentSound(typeId) {
    if (!initAudio()) return;
    resumeAudio();
    var t = audioCtx.currentTime;
    if (typeId === 'kick') playKick(t);
    else if (typeId === 'hat') playHat(t, true);
    else if (typeId === 'bass') playBass(t);
    else playStab(t);
  }

  function playDrop(collected) {
    if (!initAudio() || !collected.length) return;
    resumeAudio();
    var t0 = audioCtx.currentTime + 0.15;
    var step = 0.18;
    for (var i = 0; i < collected.length; i++) {
      var typeId = collected[i];
      var t = t0 + i * step;
      if (typeId === 'kick') playKick(t);
      else if (typeId === 'hat') playHat(t, false);
      else if (typeId === 'bass') playBass(t);
      else playStab(t);
    }
  }

  var state = 'title';
  var W = 0, H = 0, dpr = 1;
  var lane = 1;
  var laneTarget = 1;
  var laneAnim = 1;
  var playerY = 0;
  var score = 0;
  var combo = 0;
  var maxCombo = 0;
  var timeLeft = 45;
  var roundDuration = 45;
  var elapsed = 0;
  var fogLevel = 0;
  var laneWidth = 1;
  var baseSpeed = 180;
  var spawnTimer = 0;
  var fragments = [];
  var particles = [];
  var collectedSounds = [];
  var shake = 0;
  var pulse = 0;
  var missFlash = 0;
  var lastTs = 0;
  var swipeStartX = 0;
  var swipeStartY = 0;
  var swipeActive = false;

  function resize() {
    var wrap = document.getElementById('canvas-wrap');
    if (!wrap) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = Math.max(1, Math.floor(W * dpr));
    canvas.height = Math.max(1, Math.floor(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    playerY = H * 0.82;
  }

  function laneX(l) {
    var margin = W * 0.08 * (1 + fogLevel * 0.4);
    var usable = W - margin * 2;
    var gap = usable * 0.04;
    var lw = (usable - gap * 2) * laneWidth;
    var total = lw * 3 + gap * 2;
    var start = (W - total) / 2;
    return start + l * (lw + gap) + lw / 2;
  }

  function laneBounds(l) {
    var margin = W * 0.08 * (1 + fogLevel * 0.4);
    var usable = W - margin * 2;
    var gap = usable * 0.04;
    var lw = (usable - gap * 2) * laneWidth;
    var total = lw * 3 + gap * 2;
    var start = (W - total) / 2;
    return { left: start + l * (lw + gap), width: lw };
  }

  function spawnFragment() {
    var type = FRAG_TYPES[Math.floor(Math.random() * FRAG_TYPES.length)];
    var l = Math.floor(Math.random() * 3);
    var speed = baseSpeed * (1 + elapsed / roundDuration * 1.2) * (0.85 + Math.random() * 0.3);
    fragments.push({
      lane: l,
      y: -30,
      speed: speed,
      type: type,
      life: 1,
      rot: Math.random() * Math.PI * 2,
      rotSpd: (Math.random() - 0.5) * 3,
      size: 18 + Math.random() * 8,
      pulse: Math.random() * Math.PI * 2
    });
  }

  function addParticles(x, y, color) {
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 60 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.5 + Math.random() * 0.4,
        color: color
      });
    }
  }

  function collectFragment(f, idx) {
    fragments.splice(idx, 1);
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    var pts = 10 + Math.min(combo, 20) * 2;
    score += pts;
    collectedSounds.push(f.type.id);
    playFragmentSound(f.type.id);
    addParticles(laneX(f.lane), f.y, f.type.color);
    shake = 0.12;
    pulse = 1;
    if (navigator.vibrate) navigator.vibrate(12);
    updateHud();
  }

  function missFragment(f) {
    combo = 0;
    missFlash = 0.35;
    if (f) addParticles(laneX(f.lane), f.y, dark ? '#ff8060' : '#ff6b4a');
    updateHud();
  }

  function updateHud() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) comboEl.textContent = '×' + Math.max(1, combo);
    if (timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
  }

  function resetGame() {
    lane = 1;
    laneTarget = 1;
    laneAnim = 1;
    score = 0;
    combo = 0;
    maxCombo = 0;
    timeLeft = roundDuration;
    elapsed = 0;
    fogLevel = 0;
    laneWidth = 1;
    spawnTimer = 0;
    fragments = [];
    particles = [];
    collectedSounds = [];
    shake = 0;
    pulse = 0;
    missFlash = 0;
    updateHud();
  }

  function startGame() {
    resetGame();
    state = 'playing';
    if (titleOverlay) titleOverlay.classList.add('hidden');
    if (gameoverOverlay) gameoverOverlay.classList.add('hidden');
    if (laneHint) laneHint.style.opacity = '0.5';
    initAudio();
    resumeAudio();
  }

  function endGame() {
    state = 'gameover';
    if (gameoverOverlay) gameoverOverlay.classList.remove('hidden');
    if (laneHint) laneHint.style.opacity = '0';
    if (finalScoreEl) finalScoreEl.textContent = String(score);
    if (dropMsgEl) {
      if (collectedSounds.length >= 8) {
        dropMsgEl.textContent = 'Full mini-drop unlocked — listen.';
      } else if (collectedSounds.length >= 3) {
        dropMsgEl.textContent = 'Partial drop stitched from the fog.';
      } else {
        dropMsgEl.textContent = 'Too sparse — the fog ate your groove.';
      }
    }
    playDrop(collectedSounds.slice(-16));
    if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
  }

  function changeLane(dir) {
    if (state !== 'playing') return;
    var next = laneTarget + dir;
    if (next < 0 || next > 2) return;
    laneTarget = next;
    if (navigator.vibrate) navigator.vibrate(4);
  }

  function handleSwipe(dx, dy) {
    if (Math.abs(dx) < 30 || Math.abs(dx) < Math.abs(dy)) return;
    changeLane(dx > 0 ? 1 : -1);
  }

  function onPointerDown(e) {
    if (state !== 'playing') return;
    swipeActive = true;
    swipeStartX = e.clientX;
    swipeStartY = e.clientY;
    if (e.preventDefault) e.preventDefault();
  }

  function onPointerUp(e) {
    if (!swipeActive) return;
    swipeActive = false;
    var dx = e.clientX - swipeStartX;
    var dy = e.clientY - swipeStartY;
    handleSwipe(dx, dy);
    if (e.preventDefault) e.preventDefault();
  }

  function onKeyDown(e) {
    if (!e || !e.key) return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeLane(-1);
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeLane(1);
  }

  function update(dt) {
    if (state !== 'playing') return;

    elapsed += dt;
    timeLeft = Math.max(0, roundDuration - elapsed);
    fogLevel = Math.min(1, elapsed / roundDuration * 1.1);
    laneWidth = 1 - fogLevel * 0.22;

    laneAnim += (laneTarget - laneAnim) * Math.min(1, dt * 14);
    if (Math.abs(laneAnim - laneTarget) < 0.01) {
      lane = laneTarget;
      laneAnim = laneTarget;
    }

    var spawnRate = 0.55 - fogLevel * 0.2;
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnFragment();
      spawnTimer = spawnRate + Math.random() * 0.35;
    }

    for (var i = fragments.length - 1; i >= 0; i--) {
      var f = fragments[i];
      f.y += f.speed * dt;
      f.rot += f.rotSpd * dt;
      f.pulse += dt * 5;
      f.life -= dt * (0.15 + fogLevel * 0.25);

      var dist = Math.abs(f.y - playerY);
      var laneMatch = f.lane === Math.round(laneAnim);

      if (laneMatch && dist < 36) {
        collectFragment(f, i);
        continue;
      }

      if (f.y > H + 40 || f.life <= 0) {
        if (f.y > H + 20 && f.life > 0) missFragment(f);
        else if (f.life <= 0 && f.y < H) missFragment(f);
        fragments.splice(i, 1);
      }
    }

    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(j, 1);
    }

    if (shake > 0) shake -= dt;
    if (pulse > 0) pulse -= dt * 2;
    if (missFlash > 0) missFlash -= dt;

    updateHud();

    if (timeLeft <= 0) endGame();
  }

  function getCss(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function drawFogLayer(yOff, alpha, speed) {
    ctx.save();
    ctx.globalAlpha = alpha;
    var t = elapsed * speed;
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, dark ? 'rgba(40,60,80,0.4)' : 'rgba(200,220,235,0.5)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, yOff + Math.sin(t) * 20, W, H * 0.6);

    ctx.strokeStyle = dark ? 'rgba(0,255,208,0.08)' : 'rgba(0,180,160,0.1)';
    ctx.lineWidth = 1;
    for (var i = 0; i < 5; i++) {
      ctx.beginPath();
      var baseY = ((yOff + i * 80 + t * 30) % (H + 100)) - 50;
      for (var x = 0; x <= W; x += 12) {
        var y = baseY + Math.sin(x * 0.02 + t + i) * 18;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    if (!ctx) return;

    var bg = getCss('--bg') || '#0d1218';
    var wire = getCss('--wire') || '#00ffd0';
    var accent2 = getCss('--accent2') || '#ff6b4a';

    var sx = shake > 0 ? (Math.random() - 0.5) * shake * 12 : 0;
    var sy = shake > 0 ? (Math.random() - 0.5) * shake * 8 : 0;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.fillStyle = bg;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    if (missFlash > 0) {
      ctx.fillStyle = dark ? 'rgba(255,80,60,' + (missFlash * 0.12) + ')' : 'rgba(255,100,80,' + (missFlash * 0.15) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    var beatScroll = (elapsed * (120 + fogLevel * 40)) % 48;
    ctx.strokeStyle = dark ? 'rgba(0,255,208,0.06)' : 'rgba(0,160,140,0.08)';
    ctx.lineWidth = 1;
    for (var by = beatScroll - 48; by < H; by += 48) {
      ctx.beginPath();
      ctx.moveTo(W * 0.06, by);
      ctx.lineTo(W * 0.94, by);
      ctx.stroke();
    }

    drawFogLayer(0, 0.35 + fogLevel * 0.25, 0.3);
    drawFogLayer(H * 0.3, 0.25 + fogLevel * 0.2, 0.5);

    for (var l = 0; l < 3; l++) {
      var b = laneBounds(l);
      ctx.strokeStyle = dark ? 'rgba(0,255,208,0.15)' : 'rgba(0,180,160,0.2)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 8]);
      ctx.strokeRect(b.left, H * 0.08, b.width, H * 0.78);
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.moveTo(b.left, H * 0.08);
      ctx.lineTo(b.left + b.width, H * 0.08);
      ctx.strokeStyle = wire;
      ctx.globalAlpha = 0.35 + Math.sin(elapsed * 3 + l) * 0.1;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (var i = 0; i < fragments.length; i++) {
      var f = fragments[i];
      var fx = laneX(f.lane);
      var alpha = Math.min(1, f.life);
      var sz = f.size * (1 + Math.sin(f.pulse) * 0.08);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(fx, f.y);
      ctx.rotate(f.rot);

      ctx.strokeStyle = f.type.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -sz);
      ctx.lineTo(sz * 0.866, sz * 0.5);
      ctx.lineTo(-sz * 0.866, sz * 0.5);
      ctx.closePath();
      ctx.stroke();

      ctx.fillStyle = f.type.color;
      ctx.globalAlpha = alpha * 0.25;
      ctx.fill();

      ctx.globalAlpha = alpha;
      ctx.font = '10px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = f.type.color;
      ctx.fillText(f.type.label, 0, 0);
      ctx.restore();
    }

    var px = laneX(laneAnim);
    var pPulse = 1 + pulse * 0.25 + Math.sin(elapsed * 8) * 0.05;
    var pr = 22 * pPulse;

    if (Math.abs(laneAnim - laneTarget) > 0.05) {
      ctx.save();
      ctx.strokeStyle = wire;
      ctx.globalAlpha = 0.2;
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 10]);
      ctx.beginPath();
      ctx.moveTo(laneX(lane), playerY);
      ctx.lineTo(px, playerY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    ctx.save();
    ctx.translate(px, playerY);
    ctx.strokeStyle = wire;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = wire;
    ctx.shadowBlur = 12 + pulse * 20;
    ctx.beginPath();
    ctx.arc(0, 0, pr, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = dark ? 'rgba(0,255,208,0.15)' : 'rgba(0,200,180,0.2)';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = wire;
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    if (state === 'playing' && fogLevel > 0.5) {
      ctx.fillStyle = dark ? 'rgba(10,15,22,0)' : 'rgba(230,240,248,0)';
      var fogGrad = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.7);
      fogGrad.addColorStop(0, 'rgba(0,0,0,0)');
      fogGrad.addColorStop(1, dark ? 'rgba(5,10,18,' + (fogLevel * 0.45) + ')' : 'rgba(200,215,230,' + (fogLevel * 0.35) + ')');
      ctx.fillStyle = fogGrad;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  if (startBtn) {
    startBtn.addEventListener('click', function () {
      startGame();
    });
  }
  if (restartBtn) {
    restartBtn.addEventListener('click', function () {
      startGame();
    });
  }

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
  canvas.addEventListener('touchstart', function (e) {
    if (state !== 'playing') return;
    if (e.touches && e.touches[0]) {
      swipeActive = true;
      swipeStartX = e.touches[0].clientX;
      swipeStartY = e.touches[0].clientY;
    }
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', function (e) {
    if (!swipeActive) return;
    swipeActive = false;
    if (e.changedTouches && e.changedTouches[0]) {
      var t = e.changedTouches[0];
      handleSwipe(t.clientX - swipeStartX, t.clientY - swipeStartY);
    }
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', resize);

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      dark = e.matches;
    });
  }

  resize();
  updateHud();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
