<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inverse Captcha</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #4af626;
    --fg-dim: #1a5a1a;
    --alert: #ff3366;
    --font: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --fg: #4af626;
      --fg-dim: #1a5a1a;
      --alert: #ff3366;
    }
    .gates { background: rgba(0, 0, 0, 0.4); }
    #game-container::after {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
      background-size: 100% 4px;
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4f0;
      --fg: #0a5a1a;
      --fg-dim: #a0c0a0;
      --alert: #cc0033;
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game-container {
    position: relative; width: 100dvw; height: 100dvh;
    touch-action: none;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    background: var(--bg);
    z-index: 10;
    transition: opacity 0.3s;
  }
  .overlay.hidden {
    opacity: 0;
    display: none;
  }
  h1 { font-size: 2rem; margin-bottom: 0.5rem; text-align: center; letter-spacing: 2px; }
  p { font-size: 1rem; text-align: center; max-width: 80%; line-height: 1.5; margin-bottom: 2rem; }
  button {
    pointer-events: auto;
    background: var(--bg);
    color: var(--fg);
    border: 2px solid var(--fg);
    padding: 1rem 2rem;
    font-size: 1.2rem;
    font-family: var(--font);
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 10px var(--fg-dim);
    transition: all 0.1s;
  }
  button:active {
    background: var(--fg);
    color: var(--bg);
  }
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  #rule-timer-bar {
    position: absolute; top: 0; left: 0; height: 4px; background: var(--fg); width: 100%;
    transition: width 0.1s linear, background-color 0.3s;
  }
  .hud-top {
    position: absolute; top: env(safe-area-inset-top, 15px); left: 15px; right: 15px;
    display: flex; justify-content: space-between;
    font-size: 1.2rem; font-weight: bold;
    text-shadow: 0 0 5px var(--bg);
  }
  .rule-banner {
    position: absolute; top: calc(env(safe-area-inset-top, 15px) + 40px); left: 50%; transform: translateX(-50%);
    background: var(--bg); border: 2px solid var(--fg); padding: 8px 16px;
    font-size: 1rem; white-space: nowrap;
    box-shadow: 0 0 10px var(--fg-dim);
    text-align: center;
    font-weight: bold;
  }
  .rule-banner.alert {
    border-color: var(--alert); color: var(--alert);
    box-shadow: 0 0 15px var(--alert);
    animation: alert-pulse 0.25s infinite alternate;
  }
  @keyframes alert-pulse { 
    from { opacity: 1; transform: translateX(-50%) scale(1); } 
    to { opacity: 0.8; transform: translateX(-50%) scale(1.05); } 
  }
  .gates {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 15%;
    display: flex;
    border-top: 2px dashed var(--fg-dim);
    background: rgba(0, 0, 0, 0.4);
  }
  @media (prefers-color-scheme: light) {
    .gates { background: rgba(255, 255, 255, 0.5); }
  }
  .gate {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.2rem; font-weight: bold; opacity: 0.9;
    letter-spacing: 1px; text-align: center;
    transition: background-color 0.1s, color 0.1s;
  }
  .gate-left { border-right: 2px dashed var(--fg-dim); }
  
  #game-container::after {
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
    background-size: 100% 4px;
    pointer-events: none; z-index: 20;
    animation: scan 0.5s linear infinite;
  }
  @media (prefers-color-scheme: light) {
    #game-container::after {
      background: linear-gradient(rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
      background-size: 100% 4px;
    }
  }
  @keyframes scan {
    0% { background-position: 0 0; }
    100% { background-position: 0 4px; }
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>
  
  <div id="ui-layer" style="display: none;">
    <div id="rule-timer-bar"></div>
    <div class="hud-top">
      <div id="score-display">SCORE: 0</div>
      <div id="lives-display">LIVES: 3</div>
    </div>
    <div id="rule-banner" class="rule-banner">> SYS_UPDATE: HUMAN REQUIRES ◯</div>
    <div class="gates">
      <div class="gate gate-left" id="gate-human">HUMAN</div>
      <div class="gate gate-right" id="gate-bot">BOT</div>
    </div>
  </div>

  <div id="start-screen" class="overlay">
    <h1 style="margin-bottom: 0.5rem;">ROUTING_SYS_v3.1</h1>
    <p style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 2rem;">[ INVERSE CAPTCHA PROTOCOL ]</p>
    <p style="text-align: left; max-width: 300px; font-size: 0.9rem;">
      > Entities incoming.<br>
      > Sort them into the correct gates.<br>
      > Drag to draw routing paths.<br>
      > Prevent collisions.<br>
      > Rules change dynamically.
    </p>
    <button data-smoke="start" id="start-btn">INITIALIZE</button>
  </div>

  <div id="game-over-screen" class="overlay hidden">
    <h1>SYSTEM FAILURE</h1>
    <p id="final-score" style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--alert);">SCORE: 0</p>
    <p id="final-wave" style="font-size: 1rem; opacity: 0.7; margin-bottom: 2rem;">WAVE REACHED: 1</p>
    <button data-smoke="restart" id="restart-btn">REBOOT</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d', { alpha: false });

let logicalWidth = window.innerWidth;
let logicalHeight = window.innerHeight;

let colors = { bg: '#0a0a0a', fg: '#4af626', fgDim: '#1a5a1a', alert: '#ff3366', font: 'monospace' };

function updateColors() {
  const style = getComputedStyle(document.body);
  colors.bg = style.getPropertyValue('--bg').trim() || colors.bg;
  colors.fg = style.getPropertyValue('--fg').trim() || colors.fg;
  colors.fgDim = style.getPropertyValue('--fg-dim').trim() || colors.fgDim;
  colors.alert = style.getPropertyValue('--alert').trim() || colors.alert;
  colors.font = style.getPropertyValue('--font').trim() || colors.font;
}
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateColors);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
updateColors();

function resize() {
  logicalWidth = window.innerWidth;
  logicalHeight = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = logicalWidth * dpr;
  canvas.height = logicalHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      try { audioCtx = new AudioContext(); } catch (e) {}
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(e => {});
  }
}

function playTone(freq, type, duration, vol=0.1) {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playSuccess() {
  playTone(440, 'sine', 0.1, 0.1);
  setTimeout(() => playTone(880, 'sine', 0.2, 0.1), 100);
}
function playError() { playTone(150, 'sawtooth', 0.3, 0.2); }
function playStart() {
  playTone(220, 'square', 0.1, 0.1);
  setTimeout(() => playTone(440, 'square', 0.1, 0.1), 100);
  setTimeout(() => playTone(880, 'square', 0.2, 0.1), 200);
}

const SHAPE_SYMBOLS = ['◯', '□', '△', '✕'];

let state = {
  running: false,
  score: 0,
  lives: 3,
  combo: 0,
  shapes: [],
  particles: [],
  floatingTexts: [],
  rule: { targetGate: 'HUMAN', targetShape: 0 },
  wave: 1,
  lastTime: 0,
  spawnTimer: 0,
  ruleTimer: 0,
  draggedShape: null,
  shakeTime: 0,
  glitchTime: 0
};

function updateGateUI() {
  const humanGate = document.getElementById('gate-human');
  const botGate = document.getElementById('gate-bot');
  const targetSymbol = SHAPE_SYMBOLS[state.rule.targetShape];
  
  if (state.rule.targetGate === 'HUMAN') {
    humanGate.innerHTML = `HUMAN<br><span style="font-size:0.8em; color:var(--fg)">WANTS ${targetSymbol}</span>`;
    botGate.innerHTML = `BOT<br><span style="font-size:0.8em; color:var(--alert)">NO ${targetSymbol}</span>`;
  } else {
    botGate.innerHTML = `BOT<br><span style="font-size:0.8em; color:var(--fg)">WANTS ${targetSymbol}</span>`;
    humanGate.innerHTML = `HUMAN<br><span style="font-size:0.8em; color:var(--alert)">NO ${targetSymbol}</span>`;
  }
}

function generateRule() {
  const targetGate = Math.random() < 0.5 ? 'HUMAN' : 'BOT';
  const targetShape = Math.floor(Math.random() * 4);
  state.rule = { targetGate, targetShape };
  
  const banner = document.getElementById('rule-banner');
  banner.textContent = `> SYS_UPDATE: ${targetGate} REQUIRES ${SHAPE_SYMBOLS[targetShape]}`;
  banner.classList.remove('alert');
  
  updateGateUI();
  state.glitchTime = 0.5;
  playTone(100, 'sawtooth', 0.2, 0.2);
}

function spawnShape() {
  const size = 20;
  let x = size + Math.random() * (logicalWidth - size * 2);
  
  for (let i=0; i<5; i++) {
    let overlap = false;
    for(let s of state.shapes) {
      if (s.y < size * 3 && Math.abs(s.x - x) < size * 3) {
        overlap = true; break;
      }
    }
    if (!overlap) break;
    x = size + Math.random() * (logicalWidth - size * 2);
  }
  
  state.shapes.push({
    id: Math.random().toString(36).substr(2, 9),
    x, y: -size, size, 
    type: Math.floor(Math.random() * 4),
    scale: 0,
    path: [],
    speed: 40 + state.wave * 10
  });
}

let isPointerDown = false;

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!state.running) return;
  isPointerDown = true;
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  
  for (let i = state.shapes.length - 1; i >= 0; i--) {
    const s = state.shapes[i];
    if (Math.hypot(s.x - px, s.y - py) < s.size * 2.5) {
      state.draggedShape = s;
      s.path = [{x: px, y: py}];
      if (navigator.vibrate) try { navigator.vibrate(10); } catch(e){}
      break;
    }
  }
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!state.running || !isPointerDown) return;
  const rect = canvas.getBoundingClientRect();
  let px = e.clientX - rect.left;
  let py = e.clientY - rect.top;
  
  px = Math.max(0, Math.min(logicalWidth, px));
  py = Math.max(0, Math.min(logicalHeight, py));
  
  if (state.draggedShape) {
    const p = state.draggedShape.path;
    if (p.length === 0 || Math.hypot(p[p.length - 1].x - px, p[p.length - 1].y - py) > 10) {
      p.push({x: px, y: py});
    }
  }
}, { passive: false });

const endPointer = (e) => {
  if (e) e.preventDefault();
  isPointerDown = false;
  state.draggedShape = null;
};
canvas.addEventListener('pointerup', endPointer, { passive: false });
canvas.addEventListener('pointercancel', endPointer, { passive: false });

const keys = {};
const KEY_STEP = 12;

function handleKeyDown(e) {
  keys[e.code] = true;
  if (e.code === 'Enter' || e.code === 'Space') {
    const startVisible = !document.getElementById('start-screen').classList.contains('hidden');
    const overVisible = !document.getElementById('game-over-screen').classList.contains('hidden');
    if (startVisible || overVisible) {
      e.preventDefault();
      startGame();
    }
    return;
  }
  if (!state.running) return;
  const arrowKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
  if (!arrowKeys.includes(e.code)) return;
  e.preventDefault();
  if (!state.draggedShape) {
    for (let i = state.shapes.length - 1; i >= 0; i--) {
      const s = state.shapes[i];
      if (s.y < logicalHeight * 0.85) {
        state.draggedShape = s;
        s.path = [{ x: s.x, y: s.y }];
        break;
      }
    }
  }
  if (state.draggedShape) {
    const p = state.draggedShape.path;
    const last = p.length ? p[p.length - 1] : { x: state.draggedShape.x, y: state.draggedShape.y };
    let nx = last.x, ny = last.y;
    if (e.code === 'ArrowUp') ny -= KEY_STEP;
    if (e.code === 'ArrowDown') ny += KEY_STEP;
    if (e.code === 'ArrowLeft') nx -= KEY_STEP;
    if (e.code === 'ArrowRight') nx += KEY_STEP;
    nx = Math.max(0, Math.min(logicalWidth, nx));
    ny = Math.max(0, Math.min(logicalHeight, ny));
    if (!p.length || Math.hypot(last.x - nx, last.y - ny) > 5) p.push({ x: nx, y: ny });
  }
}

function handleKeyUp(e) {
  keys[e.code] = false;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
    state.draggedShape = null;
  }
}

document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 100 + 50;
    state.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 3 + 1,
      life: 0.5 + Math.random() * 0.5,
      maxLife: 1.0,
      color
    });
  }
}

function addFloatingText(text, x, y, color) {
  state.floatingTexts.push({ text, x, y, color, life: 1.0 });
}

function flashGate(gateId, isCorrect) {
  const el = document.getElementById(gateId);
  if (!el) return;
  el.style.backgroundColor = isCorrect ? colors.fg : colors.alert;
  el.style.color = colors.bg;
  setTimeout(() => {
    el.style.backgroundColor = 'transparent';
    el.style.color = colors.fg;
  }, 200);
}

function loseLife() {
  state.lives--;
  state.combo = 0;
  document.getElementById('lives-display').textContent = `LIVES: ${state.lives}`;
  state.shakeTime = 0.3;
  playError();
  if (navigator.vibrate) try { navigator.vibrate([50, 50, 50]); } catch(e){}
  
  if (state.lives <= 0) {
    state.running = false;
    document.getElementById('ui-layer').style.display = 'none';
    const goScreen = document.getElementById('game-over-screen');
    goScreen.style.display = 'flex';
    setTimeout(() => goScreen.classList.remove('hidden'), 10);
    document.getElementById('final-score').textContent = `SCORE: ${state.score}`;
    document.getElementById('final-wave').textContent = `WAVE REACHED: ${state.wave}`;
  }
}

function checkGate(shape, enteredGate) {
  const isTargetShape = shape.type === state.rule.targetShape;
  const isTargetGate = enteredGate === state.rule.targetGate;
  
  let correct = (isTargetShape && isTargetGate) || (!isTargetShape && !isTargetGate);
  const gateId = enteredGate === 'HUMAN' ? 'gate-human' : 'gate-bot';
  flashGate(gateId, correct);
  
  if (correct) {
    state.combo++;
    const points = 10 * Math.min(5, state.combo);
    state.score += points;
    document.getElementById('score-display').textContent = `SCORE: ${state.score}`;
    createExplosion(shape.x, shape.y, colors.fg);
    addFloatingText(`+${points}`, shape.x, shape.y, colors.fg);
    if (state.combo > 1) addFloatingText(`${state.combo}x`, shape.x, shape.y - 20, colors.fg);
    playSuccess();
    if (navigator.vibrate) try { navigator.vibrate(20); } catch(e){}
  } else {
    createExplosion(shape.x, shape.y, colors.alert);
    addFloatingText('ERROR', shape.x, shape.y, colors.alert);
    loseLife();
  }
}

function update(dt) {
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnShape();
    state.spawnTimer = Math.max(0.6, 2.5 - state.wave * 0.15);
  }
  
  state.ruleTimer -= dt;
  const timerBar = document.getElementById('rule-timer-bar');
  if (timerBar) {
    const pct = Math.max(0, state.ruleTimer / 15) * 100;
    timerBar.style.width = `${pct}%`;
    timerBar.style.backgroundColor = state.ruleTimer <= 3 ? colors.alert : colors.fg;
  }
  
  if (state.ruleTimer <= 3) {
    document.getElementById('rule-banner').classList.add('alert');
  }
  if (state.ruleTimer <= 0) {
    generateRule();
    state.ruleTimer = 15;
    state.wave++;
  }
  
  if (state.shakeTime > 0) state.shakeTime -= dt;
  if (state.glitchTime > 0) state.glitchTime -= dt;
  
  const gateY = logicalHeight * 0.85;
  
  for (let i = state.shapes.length - 1; i >= 0; i--) {
    const s = state.shapes[i];
    if (s.scale < 1) s.scale = Math.min(1, s.scale + dt * 5);
    
    if (s.path.length > 0) {
      const target = s.path[0];
      const dx = target.x - s.x;
      const dy = target.y - s.y;
      const dist = Math.hypot(dx, dy);
      
      if (dist < 5) {
        s.path.shift();
      } else {
        const moveSpeed = (s.speed * 3) * dt;
        s.x += (dx / dist) * moveSpeed;
        s.y += (dy / dist) * moveSpeed;
      }
    } else {
      s.y += s.speed * dt;
    }
    
    if (s.y > gateY) {
      const enteredGate = s.x < logicalWidth / 2 ? 'HUMAN' : 'BOT';
      checkGate(s, enteredGate);
      state.shapes.splice(i, 1);
    }
  }
  
  for (let i = 0; i < state.shapes.length; i++) {
    for (let j = i + 1; j < state.shapes.length; j++) {
      const s1 = state.shapes[i];
      const s2 = state.shapes[j];
      if (Math.hypot(s1.x - s2.x, s1.y - s2.y) < (s1.size + s2.size) * 0.8) {
        createExplosion(s1.x, s1.y, colors.alert);
        createExplosion(s2.x, s2.y, colors.alert);
        state.shapes.splice(j, 1);
        state.shapes.splice(i, 1);
        loseLife();
        i--;
        break;
      }
    }
  }
  
  state.particles.forEach(p => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  });
  state.particles = state.particles.filter(p => p.life > 0);
  
  state.floatingTexts.forEach(t => {
    t.y -= 50 * dt; t.life -= dt;
  });
  state.floatingTexts = state.floatingTexts.filter(t => t.life > 0);
}

function drawShape(ctx, type, x, y, size, color, isDragged) {
  ctx.strokeStyle = color;
  ctx.lineWidth = isDragged ? 4 : 3;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (isDragged) {
    ctx.shadowBlur = 10;
    ctx.shadowColor = color;
  } else {
    ctx.shadowBlur = 0;
  }
  
  ctx.beginPath();
  switch(type) {
    case 0: ctx.arc(x, y, size, 0, Math.PI * 2); break;
    case 1: ctx.rect(x - size, y - size, size * 2, size * 2); break;
    case 2:
      ctx.moveTo(x, y - size);
      ctx.lineTo(x + size, y + size);
      ctx.lineTo(x - size, y + size);
      ctx.closePath();
      break;
    case 3:
      const off = size * 0.7;
      ctx.moveTo(x - off, y - off); ctx.lineTo(x + off, y + off);
      ctx.moveTo(x + off, y - off); ctx.lineTo(x - off, y + off);
      break;
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function draw() {
  ctx.fillStyle = colors.bg;
  ctx.fillRect(0, 0, logicalWidth, logicalHeight);
  
  let dx = 0, dy = 0;
  if (state.shakeTime > 0) {
    dx += (Math.random() - 0.5) * 10;
    dy += (Math.random() - 0.5) * 10;
  }
  if (state.glitchTime > 0) {
    dx += (Math.random() - 0.5) * 15;
    dy += (Math.random() - 0.5) * 15;
    ctx.fillStyle = colors.fg;
    ctx.globalAlpha = Math.random() * 0.1;
    ctx.fillRect(0, 0, logicalWidth, logicalHeight);
    ctx.globalAlpha = 1.0;
  }
  
  if (dx !== 0 || dy !== 0) {
    ctx.save();
    ctx.translate(dx, dy);
  }
  
  state.shapes.forEach(s => {
    if (s.path.length > 0) {
      ctx.strokeStyle = colors.fg;
      ctx.lineWidth = 4;
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      s.path.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.stroke();
      
      const last = s.path[s.path.length - 1];
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = colors.fg;
      ctx.beginPath();
      ctx.arc(last.x, last.y, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  });
  
  state.shapes.forEach(s => {
    drawShape(ctx, s.type, s.x, s.y, s.size * s.scale, colors.fg, state.draggedShape === s);
  });
  
  state.particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;
  
  ctx.font = `bold 20px ${colors.font}`;
  ctx.textAlign = 'center';
  state.floatingTexts.forEach(t => {
    ctx.fillStyle = t.color;
    ctx.globalAlpha = t.life / 1.0;
    ctx.fillText(t.text, t.x, t.y);
  });
  ctx.globalAlpha = 1.0;
  
  if (dx !== 0 || dy !== 0) ctx.restore();
}

let animationFrameId;
function loop(time) {
  if (!state.running) return;
  const dt = (time - state.lastTime) / 1000;
  state.lastTime = time;
  
  if (dt < 0.1) {
    update(dt);
    draw();
  }
  animationFrameId = requestAnimationFrame(loop);
}

function startGame() {
  initAudio();
  playStart();
  
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  
  setTimeout(() => {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
    document.getElementById('ui-layer').style.display = 'block';
    
    state = {
      running: true, score: 0, lives: 3, combo: 0,
      shapes: [], particles: [], floatingTexts: [],
      wave: 1, lastTime: performance.now(),
      spawnTimer: 2.0, ruleTimer: 15,
      draggedShape: null, shakeTime: 0, glitchTime: 0,
      rule: { targetGate: 'HUMAN', targetShape: 0 }
    };
    
    document.getElementById('score-display').textContent = `SCORE: 0`;
    document.getElementById('lives-display').textContent = `LIVES: 3`;
    generateRule();
    
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    animationFrameId = requestAnimationFrame(loop);
  }, 300);
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// Initial draw
ctx.fillStyle = colors.bg;
ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
