<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Drop</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f0e8;--fg:#1c1c1c;--muted:#6b6560;--accent:#00c8d4;--hot:#ff5a1f;
  --vinyl:#141414;--groove:rgba(255,255,255,.04);--panel:rgba(244,240,232,.92);
  --shadow:rgba(0,0,0,.12);--glow:rgba(0,200,212,.35);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a0a0a;--fg:#ece8e0;--muted:#8a8580;--accent:#00f0ff;--hot:#ff6b2c;
    --vinyl:#080808;--groove:rgba(255,255,255,.06);--panel:rgba(10,10,10,.88);
    --shadow:rgba(0,0,0,.45);--glow:rgba(0,240,255,.4);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none;
  -webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.stat{display:flex;flex-direction:column;gap:2px}
.stat label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat span{font-size:18px;font-weight:600;line-height:1}
#meter{position:absolute;left:16px;right:16px;top:72px;pointer-events:none;z-index:2}
#meter-bar{height:3px;background:var(--shadow);border-radius:2px;overflow:hidden}
#meter-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--hot));transition:width .15s}
#meter-label{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.08em}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;pointer-events:none;z-index:10;padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(28px,8vw,42px);font-weight:700;letter-spacing:-.02em;line-height:1.05;
  background:linear-gradient(135deg,var(--fg) 40%,var(--accent));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.overlay p{font-size:13px;color:var(--muted);max-width:280px;line-height:1.5}
.overlay .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  border:1px solid var(--glow);padding:6px 14px;border-radius:999px}
.overlay button{pointer-events:auto;min-width:180px;min-height:48px;padding:14px 32px;
  border:none;border-radius:999px;font:inherit;font-size:14px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;background:var(--fg);color:var(--bg);
  box-shadow:0 8px 32px var(--shadow);transition:transform .12s,box-shadow .12s}
.overlay button:active{transform:scale(.96)}
#gameover .score-big{font-size:48px;font-weight:700;color:var(--accent);line-height:1}
#gameover .grade{font-size:14px;color:var(--hot);letter-spacing:.1em;text-transform:uppercase}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5;
  background:radial-gradient(circle at 50% 60%,var(--glow),transparent 70%)}
#flash.hit{animation:flashHit .25s ease-out}
#flash.miss{animation:flashMiss .3s ease-out;background:radial-gradient(circle at 50% 60%,rgba(255,90,31,.35),transparent 70%)}
@keyframes flashHit{0%{opacity:.7}100%{opacity:0}}
@keyframes flashMiss{0%{opacity:.8}100%{opacity:0}}
#tap-zone{position:absolute;inset:0;z-index:1;touch-action:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="stat"><label>Score</label><span id="score">0</span></div>
    <div class="stat" style="align-items:center"><label>Drop</label><span id="drop">0%</span></div>
    <div class="stat" style="align-items:flex-end"><label>Combo</label><span id="combo">×0</span></div>
  </div>
  <div id="meter"><div id="meter-bar"><div id="meter-fill"></div></div><div id="meter-label">45s drop</div></div>
  <div id="flash"></div>
  <div id="tap-zone"></div>
  <div id="title" class="overlay">
    <span class="tag">Stutter House · Summer 14°</span>
    <h1>Stutter Drop</h1>
    <p>Tap the neon gaps between stutter kicks. Brighten the drop — or glitch the bass.</p>
    <button type="button" data-smoke="start">Drop In</button>
  </div>
  <div id="gameover" class="overlay hidden">
    <span class="tag">Drop Complete</span>
    <div class="score-big" id="final-score">0</div>
    <div class="grade" id="final-grade">WARM UP</div>
    <p id="final-msg">Keep the gaps clean.</p>
    <button type="button" data-smoke="restart">Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas && canvas.getContext('2d');
var tapZone = document.getElementById('tap-zone');
var titleEl = document.getElementById('title');
var gameoverEl = document.getElementById('gameover');
var flashEl = document.getElementById('flash');
var scoreEl = document.getElementById('score');
var comboEl = document.getElementById('combo');
var dropEl = document.getElementById('drop');
var meterFill = document.getElementById('meter-fill');
var finalScoreEl = document.getElementById('final-score');
var finalGradeEl = document.getElementById('final-grade');
var finalMsgEl = document.getElementById('final-msg');
var startBtn = document.querySelector('[data-smoke="start"]');
var restartBtn = document.querySelector('[data-smoke="restart"]');

var ROUND_MS = 45000;
var BASE_BPM = 108;
var W = 0, H = 0, dpr = 1;
var phase = 'title';
var rafId = 0;
var lastFrame = 0;
var vinylAngle = 0;

var score = 0, combo = 0, maxCombo = 0, hits = 0, misses = 0, ghostsHit = 0;
var dropLevel = 0, bassGlitch = 0;
var sessionStart = 0, gameTime = 0;
var bpm = BASE_BPM, beatDur = 60000 / BASE_BPM;
var windows = [], ghostWindows = [], particles = [], popups = [];
var audioCtx = null, masterGain = null, bassGain = null, dropGain = null;
var nextKickTime = 0, kickIndex = 0;
var shake = 0, hitPause = 0;
var darkMode = false;
var bpmTier = 0, bpmFlash = 0;

var PATTERN = [
  {t:0,k:1},{t:0.125,k:1},{t:0.312,g:1},
  {t:0.5,k:1},{t:0.625,k:1},{t:0.812,g:1},
  {t:1,k:1},{t:1.187,g:1},{t:1.375,k:1},{t:1.562,g:1}
];

function prefersDark(){
  try{return window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;}catch(e){return false;}
}

function css(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function resize(){
  if(!canvas)return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx)ctx.setTransform(dpr,0,0,dpr,0,0);
}

function initAudio(){
  if(audioCtx)return true;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC)return false;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(audioCtx.destination);
    bassGain = audioCtx.createGain();
    bassGain.gain.value = 0.35;
    bassGain.connect(masterGain);
    dropGain = audioCtx.createGain();
    dropGain.gain.value = 0;
    dropGain.connect(masterGain);
    return true;
  }catch(e){return false;}
}

function playKick(time, loud){
  if(!audioCtx || !masterGain)return;
  var t = time || audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(loud ? 68 : 58, t);
  osc.frequency.exponentialRampToValueAtTime(32, t + 0.08);
  g.gain.setValueAtTime(loud ? 0.9 : 0.65, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
  osc.connect(g);
  g.connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.16);
}

function playHitSound(time){
  if(!audioCtx || !masterGain)return;
  var t = time || audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(880 + dropLevel * 440, t);
  osc.frequency.exponentialRampToValueAtTime(2200 + dropLevel * 600, t + 0.06);
  g.gain.setValueAtTime(0.12 + dropLevel * 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc.connect(g);
  g.connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.12);
}

function playMissSound(time){
  if(!audioCtx || !masterGain)return;
  var t = time || audioCtx.currentTime;
  var bufSize = Math.floor(audioCtx.sampleRate * 0.08);
  var buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  var data = buf.getChannelData(0);
  for(var i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
  var src = audioCtx.createBufferSource();
  src.buffer = buf;
  var g = audioCtx.createGain();
  var filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = 120 + bassGlitch * 400;
  g.gain.setValueAtTime(0.25 + bassGlitch * 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  src.connect(filt);
  filt.connect(g);
  g.connect(masterGain);
  src.start(t);
}

function updateBpm(elapsed){
  var seg = Math.floor(elapsed / 15000);
  var newBpm = BASE_BPM * Math.pow(2, seg);
  if(newBpm !== bpm){
    bpm = newBpm;
    beatDur = 60000 / bpm;
    bpmTier = seg;
    bpmFlash = 1;
    rebuildWindows(elapsed);
    var ml = document.getElementById('meter-label');
    if(ml) ml.textContent = Math.round(bpm) + ' BPM · tier ' + (seg + 1);
  }
}

function rebuildWindows(fromMs){
  windows = [];
  ghostWindows = [];
  var barMs = beatDur * 4;
  var startBar = Math.floor(fromMs / barMs);
  var endBar = startBar + Math.ceil(ROUND_MS / barMs) + 2;
  var ghostChance = Math.min(0.65, 0.15 + (gameTime / ROUND_MS) * 0.5);
  for(var bar = startBar; bar <= endBar; bar++){
    var barStart = bar * barMs;
    for(var i = 0; i < PATTERN.length; i++){
      var p = PATTERN[i];
      var ms = barStart + p.t * barMs;
      if(p.g){
        var tol = Math.max(55, beatDur * 0.18);
        windows.push({ms: ms, tol: tol, hit: false, id: bar + '-' + i});
        if(Math.random() < ghostChance){
          var offset = (Math.random() > 0.5 ? 1 : -1) * beatDur * (0.08 + Math.random() * 0.12);
          ghostWindows.push({ms: ms + offset, tol: tol * 0.7, id: 'g' + bar + '-' + i});
        }
      }
    }
  }
}

function spawnParticles(x, y, col){
  for(var i = 0; i < 12; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 2 + Math.random() * 6;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col:col});
  }
}

function flash(type){
  if(!flashEl)return;
  flashEl.className = type;
  setTimeout(function(){ flashEl.className = ''; }, 300);
}

function vibrate(ms){
  try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}
}

function nearestWindow(t){
  var best = null, bestD = Infinity;
  for(var i = 0; i < windows.length; i++){
    var w = windows[i];
    if(w.hit)continue;
    var d = Math.abs(t - w.ms);
    if(d < w.tol && d < bestD){ best = w; bestD = d; }
  }
  return best;
}

function nearestGhost(t){
  var best = null, bestD = Infinity;
  for(var i = 0; i < ghostWindows.length; i++){
    var g = ghostWindows[i];
    var d = Math.abs(t - g.ms);
    if(d < g.tol && d < bestD){ best = g; bestD = d; }
  }
  return best;
}

function registerHit(w){
  w.hit = true;
  hits++;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  dropLevel = Math.min(1, dropLevel + 0.045 + combo * 0.004);
  bassGlitch = Math.max(0, bassGlitch - 0.06);
  score += Math.round(100 + combo * 25 + dropLevel * 50);
  hitPause = 0.04;
  shake = 0;
  flash('hit');
  vibrate(12);
  playHitSound();
  if(dropGain) dropGain.gain.value = 0.08 + dropLevel * 0.25;
  spawnParticles(W * 0.5, H * 0.58, css('--accent'));
  popups.push({text:'+' + Math.round(100 + combo * 25), x:W*0.5, y:H*0.48, life:1, col:css('--accent')});
  if(combo >= 5 && combo % 5 === 0){
    popups.push({text:'×' + combo + ' STREAK', x:W*0.5, y:H*0.38, life:1.2, col:css('--hot'), big:true});
  }
  updateHud();
}

function registerMiss(reason){
  misses++;
  combo = 0;
  bassGlitch = Math.min(1, bassGlitch + (reason === 'ghost' ? 0.18 : 0.12));
  dropLevel = Math.max(0, dropLevel - 0.03);
  shake = 8;
  flash('miss');
  vibrate([20, 30, 20]);
  playMissSound();
  if(bassGain) bassGain.gain.value = 0.35 + bassGlitch * 0.45;
  if(reason === 'ghost') ghostsHit++;
  updateHud();
}

function onTap(e){
  if(e && e.preventDefault) e.preventDefault();
  if(phase !== 'playing')return;
  var t = gameTime;
  var w = nearestWindow(t);
  var ghost = nearestGhost(t);
  if(ghost && (!w || Math.abs(t - ghost.ms) < Math.abs(t - w.ms))){
    registerMiss('ghost');
    return;
  }
  if(w) registerHit(w);
  else registerMiss('timing');
}

function scheduleKicks(){
  if(!audioCtx || phase !== 'playing')return;
  var now = audioCtx.currentTime;
  var barMs = beatDur * 4;
  while(nextKickTime < now + 0.3){
    var ms = gameTime + (nextKickTime - now) * 1000;
    var posInBar = ((ms % barMs) + barMs) % barMs;
    var isKick = false;
    for(var i = 0; i < PATTERN.length; i++){
      if(!PATTERN[i].k)continue;
      var target = PATTERN[i].t * barMs;
      if(Math.abs(posInBar - target) < beatDur * 0.07){ isKick = true; break; }
    }
    if(isKick) playKick(nextKickTime, bassGlitch > 0.5);
    nextKickTime += beatDur / 8;
  }
}

function updateHud(){
  if(scoreEl) scoreEl.textContent = String(score);
  if(comboEl) comboEl.textContent = '×' + combo;
  if(dropEl) dropEl.textContent = Math.round(dropLevel * 100) + '%';
  if(meterFill) meterFill.style.width = Math.min(100, (gameTime / ROUND_MS) * 100) + '%';
}

function endGame(){
  phase = 'gameover';
  if(titleEl) titleEl.classList.add('hidden');
  if(gameoverEl) gameoverEl.classList.remove('hidden');
  if(finalScoreEl) finalScoreEl.textContent = String(score);
  var acc = hits + misses > 0 ? hits / (hits + misses) : 0;
  var grade, msg;
  if(acc >= 0.85 && dropLevel >= 0.7){ grade = 'LIVE BREAKDOWN'; msg = 'Fred again.. would nod.'; }
  else if(acc >= 0.65){ grade = 'MAIN FLOOR'; msg = 'The drop is building.'; }
  else if(acc >= 0.4){ grade = 'WARM UP'; msg = 'Find the micro-gaps.'; }
  else { grade = 'GLITCHED OUT'; msg = 'Bass swallowed the melody.'; }
  if(finalGradeEl) finalGradeEl.textContent = grade;
  if(finalMsgEl) finalMsgEl.textContent = msg + ' · ' + hits + ' hits · ×' + maxCombo + ' max';
}

function resetGame(){
  score = 0; combo = 0; maxCombo = 0; hits = 0; misses = 0; ghostsHit = 0;
  dropLevel = 0; bassGlitch = 0; gameTime = 0; bpm = BASE_BPM; beatDur = 60000 / BASE_BPM;
  kickIndex = 0; shake = 0; hitPause = 0; particles = []; popups = [];
  bpmTier = 0; bpmFlash = 0;
  updateBpm(0);
  rebuildWindows(0);
  var ml = document.getElementById('meter-label');
  if(ml) ml.textContent = '45s drop';
  updateHud();
  if(bassGain) bassGain.gain.value = 0.35;
  if(dropGain) dropGain.gain.value = 0;
}

function startGame(){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume().catch(function(){});
  }
  resetGame();
  phase = 'playing';
  sessionStart = performance.now();
  gameTime = 0;
  if(titleEl) titleEl.classList.add('hidden');
  if(gameoverEl) gameoverEl.classList.add('hidden');
  nextKickTime = audioCtx ? audioCtx.currentTime + 0.05 : 0;
  updateHud();
}

function drawVinyl(t){
  if(!ctx)return;
  var cx = W * 0.5, cy = H * 0.42;
  var r = Math.min(W, H) * 0.36;
  vinylAngle += 0.012 + (bpm / BASE_BPM) * 0.004;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(vinylAngle);
  var vinylCol = css('--vinyl');
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = vinylCol;
  ctx.fill();
  for(var g = 0; g < 28; g++){
    ctx.beginPath();
    ctx.arc(0, 0, r * (0.35 + g * 0.022), 0, Math.PI * 2);
    ctx.strokeStyle = css('--groove');
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  var labelR = r * 0.28;
  var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, labelR);
  grad.addColorStop(0, darkMode ? '#2a2018' : '#d4cbb8');
  grad.addColorStop(1, darkMode ? '#1a1410' : '#b8aa92');
  ctx.beginPath();
  ctx.arc(0, 0, labelR, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.04, 0, Math.PI * 2);
  ctx.fillStyle = darkMode ? '#333' : '#888';
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-vinylAngle * 0.15);
  ctx.fillStyle = darkMode ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.05)';
  ctx.font = '600 11px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('STUTTER DROP', 0, 4);
  ctx.restore();
}

function drawWaveform(t){
  if(!ctx)return;
  var yBase = H * 0.58;
  var amp = H * 0.09 * (1 + dropLevel * 0.35);
  var scroll = (gameTime * 0.002 * (bpm / BASE_BPM)) % 1;
  var accent = css('--accent');
  var hot = css('--hot');
  var fg = css('--fg');
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, yBase - amp - 30, W, amp * 2 + 60);
  ctx.clip();
  ctx.strokeStyle = darkMode ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
  ctx.lineWidth = 1;
  for(var gx = 0; gx < W; gx += 40){
    ctx.beginPath();
    ctx.moveTo(gx, yBase - amp - 20);
    ctx.lineTo(gx, yBase + amp + 20);
    ctx.stroke();
  }
  var playX = W * 0.5;
  ctx.beginPath();
  for(var x = 0; x <= W; x += 2){
    var phase1 = (x / W * 8 + scroll * 10 + t * 0.003) * Math.PI;
    var phase2 = (x / W * 3 + scroll * 4) * Math.PI;
    var glitch = bassGlitch * Math.sin(x * 0.3 + t * 0.02) * 8;
    var y = yBase + Math.sin(phase1) * amp * 0.6 + Math.sin(phase2) * amp * 0.35 + glitch;
    if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  var waveGrad = ctx.createLinearGradient(0, yBase - amp, W, yBase + amp);
  waveGrad.addColorStop(0, accent);
  waveGrad.addColorStop(0.5, hot);
  waveGrad.addColorStop(1, accent);
  ctx.strokeStyle = waveGrad;
  ctx.lineWidth = 2.5 + dropLevel * 2;
  ctx.shadowColor = css('--glow');
  ctx.shadowBlur = 8 + dropLevel * 20;
  ctx.stroke();
  ctx.shadowBlur = 0;
  for(var wi = 0; wi < windows.length; wi++){
    var w = windows[wi];
    if(w.hit)continue;
    var dx = playX + (w.ms - gameTime) * 0.18;
    if(dx < -40 || dx > W + 40)continue;
    var pulse = 0.5 + 0.5 * Math.sin(t * 0.012 + wi);
    var near = Math.abs(w.ms - gameTime) < w.tol;
    ctx.beginPath();
    ctx.arc(dx, yBase, near ? 16 + pulse * 6 : 10 + pulse * 3, 0, Math.PI * 2);
    ctx.fillStyle = near ? 'rgba(0,240,255,' + (0.25 + pulse * 0.35) + ')' : 'rgba(0,200,212,0.12)';
    ctx.fill();
    if(near){
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
  for(var gi = 0; gi < ghostWindows.length; gi++){
    var gw = ghostWindows[gi];
    var gx = playX + (gw.ms - gameTime) * 0.18;
    if(gx < -20 || gx > W + 20)continue;
    ctx.beginPath();
    ctx.arc(gx, yBase, 7, 0, Math.PI * 2);
    ctx.fillStyle = darkMode ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
    ctx.fill();
  }
  ctx.strokeStyle = hot;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(playX, yBase - amp - 24);
  ctx.lineTo(playX, yBase + amp + 24);
  ctx.stroke();
  ctx.fillStyle = fg;
  ctx.font = '600 10px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('TAP GAPS', playX, yBase + amp + 42);
  ctx.restore();
}

function drawPopups(dt){
  if(!ctx)return;
  for(var i = popups.length - 1; i >= 0; i--){
    var p = popups[i];
    p.y -= dt * (p.big ? 40 : 60);
    p.life -= dt * 1.4;
    if(p.life <= 0){ popups.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.font = (p.big ? '700 16px' : '600 13px') + ' ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawParticles(dt){
  if(!ctx)return;
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt * 2.5;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2 + p.life * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function draw(now){
  if(!ctx){
    requestAnimationFrame(draw);
    return;
  }
  var dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016);
  lastFrame = now;
  darkMode = prefersDark();
  if(phase === 'playing'){
    if(hitPause > 0) hitPause -= dt;
    else gameTime = performance.now() - sessionStart;
    updateBpm(gameTime);
    if(bpmFlash > 0) bpmFlash -= dt * 0.8;
    if(Math.floor(gameTime / 5000) !== Math.floor((gameTime - dt * 1000) / 5000)) rebuildWindows(gameTime);
    scheduleKicks();
    if(gameTime >= ROUND_MS) endGame();
    updateHud();
  }
  var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  var sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  if(shake > 0) shake *= 0.85;
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.translate(sx, sy);
  var bg = css('--bg');
  ctx.fillStyle = bg;
  ctx.fillRect(-10, -10, W + 20, H + 20);
  if(darkMode){
    var vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.8);
    vig.addColorStop(0, 'rgba(0,240,255,0.03)');
    vig.addColorStop(1, 'transparent');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }
  drawVinyl(now);
  if(bpmFlash > 0 && phase === 'playing'){
    ctx.save();
    ctx.globalAlpha = bpmFlash * 0.35;
    ctx.fillStyle = css('--hot');
    ctx.font = '700 22px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BPM ×2', W * 0.5, H * 0.18);
    ctx.restore();
  }
  if(phase === 'playing') drawWaveform(now);
  drawPopups(dt);
  drawParticles(dt);
  ctx.restore();
  rafId = requestAnimationFrame(draw);
}

function bindTap(el){
  if(!el)return;
  el.addEventListener('pointerdown', function(e){
    if(e && e.preventDefault) e.preventDefault();
    onTap(e);
  }, {passive:false});
}

if(startBtn) startBtn.addEventListener('click', function(e){
  if(e && e.preventDefault) e.preventDefault();
  startGame();
});
if(restartBtn) restartBtn.addEventListener('click', function(e){
  if(e && e.preventDefault) e.preventDefault();
  startGame();
});

bindTap(tapZone);
bindTap(canvas);

window.addEventListener('keydown', function(e){
  if(!e) return;
  if(e.code === 'Space' || e.code === 'Enter'){
    if(e.preventDefault) e.preventDefault();
    if(phase === 'title' || phase === 'gameover') startGame();
    else onTap(e);
  }
});

window.addEventListener('resize', resize);
try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(){ darkMode = prefersDark(); });
  }
}catch(e){}

resize();
phase = 'title';
rafId = requestAnimationFrame(draw);

})();
</script>
</body>
</html>
