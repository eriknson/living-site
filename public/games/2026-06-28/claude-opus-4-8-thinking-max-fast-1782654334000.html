<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>LIFELINES — seismic rescue</title>
<style>
  :root{
    --bg:#151a1f; --panel:rgba(18,24,29,0.72); --text:#e9efe9; --muted:#93a09a;
    --accent:#56d98c; --line:rgba(232,240,236,0.16); --danger:#ff5d52; --chalk:#eef2ee;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#dfe4e6; --panel:rgba(247,249,247,0.80); --text:#1d2c34; --muted:#5b6a6e;
      --accent:#2c9a60; --line:rgba(29,44,52,0.18); --danger:#d6362a; --chalk:#22323c;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);}
  body{
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
    color:var(--text);-webkit-font-smoothing:antialiased;position:fixed;inset:0;
  }
  #c{position:fixed;inset:0;width:100dvw;height:100dvh;display:block;z-index:0;
    touch-action:none;user-select:none;-webkit-user-select:none;}

  /* HUD */
  #hud{position:fixed;inset:0;z-index:5;pointer-events:none;}
  .bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
    align-items:flex-start;gap:12px;
    padding:calc(env(safe-area-inset-top) + 13px) 16px 0 16px;
    font-size:12px;letter-spacing:2px;text-transform:uppercase;}
  #rescued{color:var(--text);opacity:.9;font-weight:600;text-shadow:0 1px 10px rgba(0,0,0,.25);}
  #cas{display:flex;gap:5px;align-items:center;padding-top:1px;}
  .mark{width:9px;height:9px;border:1px solid var(--line);border-radius:2px;opacity:.5;transition:all .15s;}
  .mark.on{background:var(--danger);border-color:transparent;opacity:1;box-shadow:0 0 9px color-mix(in srgb,var(--danger) 70%,transparent);}
  #combo{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 11px);transform:translateX(-50%);
    font-size:11px;letter-spacing:3px;color:var(--accent);opacity:0;transition:opacity .18s;
    text-shadow:0 0 14px color-mix(in srgb,var(--accent) 60%,transparent);white-space:nowrap;}

  /* sound */
  #sound{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:12;
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--text);font-size:16px;cursor:pointer;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;opacity:.85;}
  #sound:active{transform:scale(.92);}

  /* overlays */
  .overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:24px;pointer-events:none;text-align:center;}
  .overlay.hidden{display:none;}
  .panel{pointer-events:none;width:100%;max-width:430px;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:20px;padding:30px 26px 26px;
    box-shadow:0 24px 70px rgba(0,0,0,.34);animation:rise .45s cubic-bezier(.2,.8,.25,1);}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
  .kicker{font-size:10px;letter-spacing:5px;color:var(--accent);text-transform:uppercase;margin-bottom:12px;opacity:.95;}
  h1{margin:0;font-size:clamp(36px,12vw,52px);letter-spacing:9px;font-weight:700;line-height:1;}
  .sub{margin-top:8px;font-size:13px;letter-spacing:3px;color:var(--muted);text-transform:lowercase;}
  .how{margin:20px auto 22px;font-size:13px;line-height:1.65;color:var(--text);opacity:.86;max-width:330px;}
  .how b{color:var(--accent);font-weight:600;}
  .cta{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;
    min-height:54px;padding:0 38px;font-family:inherit;font-size:15px;letter-spacing:3px;font-weight:600;
    text-transform:uppercase;cursor:pointer;color:var(--bg);background:var(--accent);
    border:none;border-radius:13px;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 38%,transparent);
    transition:transform .12s ease, filter .12s ease;}
  .cta:hover{filter:brightness(1.07);}
  .cta:active{transform:translateY(2px) scale(.985);}
  .hint{margin-top:16px;font-size:10px;letter-spacing:1.5px;color:var(--muted);opacity:.8;text-transform:uppercase;}
  .best{margin-top:10px;font-size:11px;letter-spacing:3px;color:var(--accent);min-height:14px;opacity:.9;}
  .grade{font-size:clamp(54px,18vw,80px);line-height:1;font-weight:700;color:var(--accent);
    text-shadow:0 0 28px color-mix(in srgb,var(--accent) 45%,transparent);}
  .ostat{margin-top:8px;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--text);}
  .ostat b{font-size:20px;color:var(--accent);}
  .osub{margin-top:8px;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .flavor{margin:16px auto 22px;font-size:12.5px;line-height:1.6;color:var(--text);opacity:.8;max-width:300px;}
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="bar">
      <div id="rescued">RESCUED 000</div>
      <div id="cas"></div>
    </div>
    <div id="combo"></div>
  </div>

  <button id="sound" aria-label="Mute sound">♪</button>

  <div id="title" class="overlay">
    <div class="panel">
      <div class="kicker">Seismic Rescue</div>
      <h1>LIFELINES</h1>
      <div class="sub">draw the way out</div>
      <p class="how">Drag to chalk an escape route. Survivors follow your line to the <b>safe</b> shelters. Aftershocks split the ground — reroute before a fissure cuts them off.</p>
      <button class="cta" data-smoke="start">BEGIN RESCUE</button>
      <div class="hint">drag anywhere · routes fade · keys: arrows + space</div>
      <div class="best" id="titleBest"></div>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="panel">
      <div class="grade" id="gGrade">A</div>
      <div class="ostat">RESCUED <b id="gRescued">0</b></div>
      <div class="osub" id="gSub"></div>
      <p class="flavor" id="gFlavor"></p>
      <button class="cta" data-smoke="restart">RUN IT BACK</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // ---------- DOM ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  if(!ctx){ return; }
  var titleEl = document.getElementById('title');
  var overEl  = document.getElementById('over');
  var rescuedEl = document.getElementById('rescued');
  var comboEl   = document.getElementById('combo');
  var casEl     = document.getElementById('cas');
  var soundBtn  = document.getElementById('sound');
  var startBtn  = document.querySelector('[data-smoke="start"]');
  var restartBtn= document.querySelector('[data-smoke="restart"]');

  // ---------- constants ----------
  var CAP=7, CAPTURE=34, KILL=15, SEG=8, GAP=6, MINLEN=16,
      MAXSTROKES=7, MAXC=16, MAXS=34, COMBO_WIN=2.6, SPEED=90, HOME=2.0;

  // ---------- state ----------
  var W=0,H=0,DPR=1;
  var state='title';
  var survivors=[],strokes=[],cracks=[],particles=[],ripples=[],floaters=[];
  var rescued=0,casualties=0,best=0,elapsed=0;
  var comboCount=0,comboTimer=0;
  var shake=0,shakeX=0,shakeY=0;
  var spawnTimer=0,crackTimer=0,afterTimer=0;
  var draw={active:false,cur:[],kbd:false};
  var pen={x:0,y:0}, keys={}, kbdActive=false;
  var zones=[];
  var ZONE_DEFS=[{fx:.21,fy:.17},{fx:.79,fy:.83}];
  var vignette=null, grainPattern=null, haloSurv=null, haloFollow=null;
  var last=0, raf=0, freeze=0;

  // ---------- palette ----------
  function makePalette(dark){
    return dark ? {
      bg:'#151a1f', grid:'rgba(222,232,236,0.06)', avenue:'rgba(222,232,236,0.10)',
      chalk:'#e9efe9', chalkHi:'#ffffff',
      crack:'#04070a', crackRim:'#ff7a3a', crackGlow:'rgba(255,120,52,0.5)',
      surv:'#ffce5c', follow:'#67e0c6', danger:'#ff5d52',
      zone:'#56d98c', zoneGlow:'rgba(86,217,140,0.45)',
      spark:'#9af0cf', dust:'rgba(186,176,156,0.7)',
      vignette:'rgba(0,0,0,0.42)'
    } : {
      bg:'#dfe4e6', grid:'rgba(30,46,55,0.08)', avenue:'rgba(30,46,55,0.14)',
      chalk:'#22323c', chalkHi:'#0d1a22',
      crack:'#5e1810', crackRim:'#d23a17', crackGlow:'rgba(210,58,23,0.4)',
      surv:'#cf8418', follow:'#11947d', danger:'#d6362a',
      zone:'#2c9a60', zoneGlow:'rgba(44,154,96,0.4)',
      spark:'#1f9c84', dust:'rgba(92,82,66,0.5)',
      vignette:'rgba(40,52,58,0.20)'
    };
  }
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var PAL = makePalette(mq ? mq.matches : true);
  if(mq){
    var onScheme=function(){ PAL=makePalette(mq.matches); makeVignette(); makeHalos(); };
    if(mq.addEventListener) mq.addEventListener('change',onScheme);
    else if(mq.addListener) mq.addListener(onScheme);
  }

  // ---------- math ----------
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function randR(a,b){ return a+Math.random()*(b-a); }
  function hexA(h,a){
    if(typeof h!=='string'||h[0]!=='#') return h;
    var n=parseInt(h.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }
  function closest(p,a,b){
    var abx=b.x-a.x, aby=b.y-a.y, L=abx*abx+aby*aby;
    var t = L>1e-6 ? ((p.x-a.x)*abx+(p.y-a.y)*aby)/L : 0;
    t=clamp(t,0,1);
    return {x:a.x+abx*t, y:a.y+aby*t, t:t};
  }
  function segInt(p1,p2,p3,p4){
    var d1x=p2.x-p1.x,d1y=p2.y-p1.y,d2x=p4.x-p3.x,d2y=p4.y-p3.y;
    var den=d1x*d2y-d1y*d2x; if(Math.abs(den)<1e-9) return null;
    var t=((p3.x-p1.x)*d2y-(p3.y-p1.y)*d2x)/den;
    var u=((p3.x-p1.x)*d1y-(p3.y-p1.y)*d1x)/den;
    if(t>=0&&t<=1&&u>=0&&u<=1) return {x:p1.x+d1x*t, y:p1.y+d1y*t};
    return null;
  }
  function nearestZone(p){ var bz=zones[0],bd=Infinity; for(var i=0;i<zones.length;i++){ var z=zones[i],d=Math.hypot(p.x-z.x,p.y-z.y); if(d<bd){bd=d;bz=z;} } return bz; }
  function nearestZoneDist(p){ var bd=Infinity; for(var i=0;i<zones.length;i++){ var z=zones[i],d=Math.hypot(p.x-z.x,p.y-z.y); if(d<bd)bd=d; } return bd; }

  // ---------- difficulty ----------
  function diff(t){
    return {
      spawnInt: Math.max(0.9, 2.6 - t*0.016),
      crackInt: Math.max(2.2, 6.0 - t*0.045),
      growSpeed: Math.min(105, 34 + t*0.95),
      crackMax: Math.min(260, 130 + t*1.8),
      afterInt: Math.max(5.0, 10 - t*0.05),
      strokeLife: Math.max(6.5, 11 - t*0.045),
      branch: Math.min(0.10, 0.03 + t*0.0008)
    };
  }

  // ---------- strokes ----------
  function buildStroke(srcPts, lifeOverride){
    var pts=[]; for(var i=0;i<srcPts.length;i++) pts.push({x:srcPts[i].x,y:srcPts[i].y});
    var cum=[0], total=0;
    for(i=1;i<pts.length;i++){ total+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); cum.push(total); }
    var d0=nearestZoneDist(pts[0]), d1=nearestZoneDist(pts[pts.length-1]);
    var life = (lifeOverride!=null) ? lifeOverride : diff(elapsed).strokeLife;
    return {pts:pts, cum:cum, total:total, safeAtEnd:(d1<=d0), life:life, maxLife:life};
  }
  function pointAtArc(st,L){
    var pts=st.pts, cum=st.cum, n=pts.length-1;
    if(L<=0) return {x:pts[0].x,y:pts[0].y};
    if(L>=st.total) return {x:pts[n].x,y:pts[n].y};
    for(var i=0;i<cum.length-1;i++){
      if(L>=cum[i] && L<=cum[i+1]){
        var seg=cum[i+1]-cum[i]||1, t=(L-cum[i])/seg;
        return {x:pts[i].x+(pts[i+1].x-pts[i].x)*t, y:pts[i].y+(pts[i+1].y-pts[i].y)*t};
      }
    }
    return {x:pts[n].x,y:pts[n].y};
  }
  function nearestOnStroke(p,list){
    var best=null, bd=CAPTURE;
    for(var s=0;s<list.length;s++){
      var st=list[s], pts=st.pts;
      for(var i=0;i<pts.length-1;i++){
        var r=closest(p,pts[i],pts[i+1]);
        var d=Math.hypot(p.x-r.x,p.y-r.y);
        if(d<bd){ bd=d; best={stroke:st,dist:d,arcLen:st.cum[i]+r.t*(st.cum[i+1]-st.cum[i])}; }
      }
    }
    return best;
  }
  function pull(arr,fromEnd,gap){
    if(arr.length<2) return;
    var a,b;
    if(fromEnd){ var n=arr.length-1; a=arr[n]; b=arr[n-1]; var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,g=Math.min(gap,d*0.8); arr[n]={x:a.x+dx/d*g,y:a.y+dy/d*g}; }
    else { a=arr[0]; b=arr[1]; var ex=b.x-a.x,ey=b.y-a.y,e=Math.hypot(ex,ey)||1,g2=Math.min(gap,e*0.8); arr[0]={x:a.x+ex/e*g2,y:a.y+ey/e*g2}; }
  }
  function splitStrokes(a,b){
    for(var si=0; si<strokes.length; si++){
      var st=strokes[si], pts=st.pts, found=false;
      for(var i=0;i<pts.length-1;i++){
        var X=segInt(a,b,pts[i],pts[i+1]);
        if(X){
          var A=[],B=[],k;
          for(k=0;k<=i;k++) A.push({x:pts[k].x,y:pts[k].y});
          A.push({x:X.x,y:X.y});
          B.push({x:X.x,y:X.y});
          for(k=i+1;k<pts.length;k++) B.push({x:pts[k].x,y:pts[k].y});
          pull(A,true,GAP); pull(B,false,GAP);
          var life=st.life;
          strokes.splice(si,1);
          var ins=[];
          if(A.length>=2) ins.push(buildStroke(A,life));
          if(B.length>=2) ins.push(buildStroke(B,life));
          for(k=0;k<ins.length;k++) strokes.splice(si+k,0,ins[k]);
          for(k=0;k<5;k++) addParticle(X.x,X.y,PAL.dust,'dust');
          addRipple(X.x,X.y,34,PAL.crackRim);
          found=true; break;
        }
      }
      if(found) return;
    }
  }

  // ---------- cracks ----------
  function updBBox(c,p){ if(p.x<c.minx)c.minx=p.x; if(p.x>c.maxx)c.maxx=p.x; if(p.y<c.miny)c.miny=p.y; if(p.y>c.maxy)c.maxy=p.y; }
  function newCrack(x,y,dir,maxLen){ return {pts:[{x:x,y:y}],dir:dir,len:0,maxLen:maxLen,alive:true,growAcc:0,minx:x,maxx:x,miny:y,maxy:y}; }
  function spawnCrack(origin){
    if(cracks.length>=MAXC) cracks.shift();
    var x,y;
    if(origin){ x=origin.x; y=origin.y; }
    else if(Math.random()<0.45 && survivors.length){
      var s=survivors[(Math.random()*survivors.length)|0];
      var a=Math.random()*Math.PI*2, dd=randR(70,140);
      x=s.x+Math.cos(a)*dd; y=s.y+Math.sin(a)*dd;
    } else {
      var e=Math.random();
      if(e<.25){x=randR(0,W);y=0;} else if(e<.5){x=randR(0,W);y=H;}
      else if(e<.75){x=0;y=randR(0,H);} else {x=W;y=randR(0,H);}
    }
    x=clamp(x,4,W-4); y=clamp(y,4,H-4);
    for(var i=0;i<zones.length;i++){ if(Math.hypot(x-zones[i].x,y-zones[i].y)<zones[i].r){ return; } }
    cracks.push(newCrack(x,y,Math.random()*Math.PI*2, diff(elapsed).crackMax*randR(0.7,1.1)));
  }
  function growCracks(dt,d){
    for(var ci=0;ci<cracks.length;ci++){
      var c=cracks[ci]; if(!c.alive) continue;
      c.growAcc += d.growSpeed*dt; var guard=0;
      while(c.growAcc>=SEG && guard++<6){
        c.growAcc-=SEG;
        c.dir += (Math.random()-0.5)*0.75;
        var tip=c.pts[c.pts.length-1];
        var np={x:tip.x+Math.cos(c.dir)*SEG, y:tip.y+Math.sin(c.dir)*SEG};
        c.pts.push(np); updBBox(c,np); c.len+=SEG;
        splitStrokes(tip,np);
        if(Math.random()<d.branch && cracks.length<MAXC){
          cracks.push(newCrack(np.x,np.y, c.dir+(Math.random()<.5?1:-1)*randR(0.6,1.1), c.maxLen*0.6));
        }
        if(c.len>=c.maxLen || np.x<-30||np.x>W+30||np.y<-30||np.y>H+30){ c.alive=false; break; }
      }
    }
  }
  function crackDistXY(x,y){
    var md=Infinity;
    for(var c=0;c<cracks.length;c++){
      var k=cracks[c];
      if(x<k.minx-28||x>k.maxx+28||y<k.miny-28||y>k.maxy+28) continue;
      var pts=k.pts;
      for(var i=0;i<pts.length;i++){
        var q=pts[i], d=Math.hypot(x-q.x,y-q.y);
        if(d<md){ md=d; if(md<3) return md; }
      }
    }
    return md;
  }

  // ---------- survivors ----------
  function spawnSurvivor(pos){
    var x,y,ok=false,tries=0;
    if(pos){ x=pos.x; y=pos.y; ok=true; }
    while(!ok && tries++<14){
      x=randR(26,W-26); y=randR(64,H-44); ok=true;
      for(var i=0;i<zones.length;i++){ if(Math.hypot(x-zones[i].x,y-zones[i].y)<zones[i].r*2.3){ ok=false; break; } }
      if(ok && crackDistXY(x,y)<KILL*2.5) ok=false;
    }
    if(!ok) return;
    survivors.push({x:x,y:y,px:x,py:y,t:Math.random()*6,seed:Math.random()*6,scale:0,
      following:false,danger:false,dead:false,wx:(Math.random()-.5)*10,wy:(Math.random()-.5)*10});
    addParticle(x,y,PAL.dust,'dust');
  }
  function moveToward(s,t,maxStep){
    var dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy);
    if(d<1e-4) return 0;
    var step=Math.min(d,maxStep);
    s.x+=dx/d*step; s.y+=dy/d*step;
    return step;
  }
  function rescue(s){
    s.dead=true; rescued++; comboCount++; comboTimer=COMBO_WIN;
    var m=comboMult();
    for(var i=0;i<10;i++) addParticle(s.x,s.y,PAL.spark,'spark');
    addFloater(s.x,s.y, m>1?('x'+m):'+1');
    addRipple(s.x,s.y,40,PAL.zone);
    ping(520+m*70); vibe(10);
  }
  function killS(s){
    s.dead=true; casualties++;
    for(var i=0;i<12;i++) addParticle(s.x,s.y,PAL.dust,'dust');
    addRipple(s.x,s.y,58,PAL.danger);
    thud(); vibe(28); shake=Math.min(28,shake+7); freeze=Math.max(freeze,0.055);
    if(casualties>=CAP) gameOver();
  }
  function comboMult(){ return clamp(1+Math.floor(comboCount/4),1,5); }
  function updateSurvivor(s,dt,flowList){
    if(state!=='playing') return;
    s.t+=dt; s.scale=Math.min(1,s.scale+dt*4);
    var z=nearestZone(s), dz=Math.hypot(s.x-z.x,s.y-z.y);
    if(dz<z.r){ rescue(s); return; }
    var cd=crackDistXY(s.x,s.y); s.danger=cd<KILL*2.6;
    if(cd<KILL){ killS(s); return; }
    var tgt=null;
    if(dz<z.r*HOME){ tgt={x:z.x,y:z.y}; }
    else {
      var best=nearestOnStroke(s,flowList);
      if(best){ var st=best.stroke, dir=st.safeAtEnd?1:-1; var L=clamp(best.arcLen+dir*(SPEED*dt+9),0,st.total); tgt=pointAtArc(st,L); }
    }
    if(tgt){
      var dx=tgt.x-s.x, dy=tgt.y-s.y, dd=Math.hypot(dx,dy)||1, step=Math.min(dd,SPEED*dt);
      var nx=s.x+dx/dd*step, ny=s.y+dy/dd*step;
      if(crackDistXY(nx,ny) < KILL*1.25){ s.following=false; }  // refuse to walk into a fissure; wait for a reroute

  // ---------- audio ----------
  var actx=null,master=null,noiseBuf=null,audioOn=true;

    }catch(e){ actx=null; }
  }
  function startPad(){

      var pad=actx.createGain(); pad.gain.value=0.08; pad.connect(master);
      var lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=620; lp.connect(pad);
      var o1=actx.createOscillator(); o1.type='sine'; o1.frequency.value=110;
      var o2=actx.createOscillator(); o2.type='triangle'; o2.frequency.value=165; o2.detune.value=5;
      var og=actx.createGain(); og.gain.value=0.5; o1.connect(og); o2.connect(og); og.connect(lp);

    g.gain.exponentialRampToValueAtTime(0.0001,t+0.28); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.3);}catch(e){} }

  // ---------- update ----------
  function updatePlay(dt){
    elapsed+=dt;
    var d=diff(elapsed);
    spawnTimer-=dt; if(spawnTimer<=0 && survivors.length<MAXS){ spawnSurvivor(); spawnTimer=d.spawnInt; }
    crackTimer-=dt; if(elapsed>2.5 && crackTimer<=0){ spawnCrack(); crackTimer=d.crackInt; }
    afterTimer-=dt; if(elapsed>7 && afterTimer<=0){ aftershock(d); afterTimer=d.afterInt+Math.random()*1.5; }
    if(kbdActive) updatePen(dt);
    growCracks(dt,d);
    for(var i=strokes.length-1;i>=0;i--){ strokes[i].life-=dt; if(strokes[i].life<=0) strokes.splice(i,1); }
    var temp=null;
    if(draw.active && draw.cur.length>=2) temp=buildStroke(draw.cur,99);
    var flowList = temp ? strokes.concat([temp]) : strokes;
    for(i=survivors.length-1;i>=0;i--){ var s=survivors[i]; updateSurvivor(s,dt,flowList); if(s.dead) survivors.splice(i,1); }
    if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) comboCount=0; }
    updateParticles(dt); updateRipples(dt); updateFloaters(dt); decayShake(dt);
  }
  function updateTitle(dt){
    for(var i=0;i<survivors.length;i++){
      var s=survivors[i]; s.t+=dt;
      s.px=s.x; s.py=s.y;
      s.x+=s.wx*dt; s.y+=s.wy*dt;
      if(s.x<30||s.x>W-30) s.wx*=-1;
      if(s.y<70||s.y>H-70) s.wy*=-1;
      s.x=clamp(s.x,30,W-30); s.y=clamp(s.y,70,H-70);
      s.following=false;
    }
    var c=cracks[0];
    if(c){
      c.growAcc+=26*dt; var guard=0;
      while(c.growAcc>=SEG && guard++<4){
        c.growAcc-=SEG; c.dir+=(Math.random()-0.5)*0.6;
        var tip=c.pts[c.pts.length-1];
        var np={x:tip.x+Math.cos(c.dir)*SEG,y:tip.y+Math.sin(c.dir)*SEG};
        c.pts.push(np); updBBox(c,np); c.len+=SEG;
        if(c.len>180||np.x<-20||np.x>W+20||np.y<-20||np.y>H+20){ cracks[0]=makeDeco(); break; }
      }
    }
    updateParticles(dt); updateRipples(dt); decayShake(dt);
  }

  // ---------- render ----------

  function drawGrid(){

    ctx.lineWidth=1;

    idx=0; for(x=cell/2;x<W;x+=cell){ if(idx%4!==0){ ctx.moveTo(x,-20); ctx.lineTo(x,H+20);} idx++; }
    idx=0; for(y=cell/2;y<H;y+=cell){ if(idx%4!==0){ ctx.moveTo(-20,y); ctx.lineTo(W+20,y);} idx++; }
    ctx.stroke();
    ctx.strokeStyle=PAL.avenue; ctx.beginPath();
    idx=0; for(x=cell/2;x<W;x+=cell){ if(idx%4===0){ ctx.moveTo(x,-20); ctx.lineTo(x,H+20);} idx++; }
    idx=0; for(y=cell/2;y<H;y+=cell){ if(idx%4===0){ ctx.moveTo(-20,y); ctx.lineTo(W+20,y);} idx++; }

      ctx.strokeStyle=PAL.zone; ctx.lineWidth=2.5;

      ctx.globalAlpha=0.5; ctx.beginPath(); ctx.arc(z.x,z.y,z.r*0.92,0,7); ctx.stroke(); ctx.globalAlpha=1;
      ctx.fillStyle=PAL.zone; ctx.beginPath(); ctx.arc(z.x,z.y,3.2,0,7); ctx.fill();

  function drawChalk(pts,alpha){

  function drawFlowArrows(st,alpha){

    ctx.strokeStyle=PAL.chalk; ctx.globalAlpha=alpha*0.5; ctx.lineWidth=2; ctx.lineCap='round';

      ctx.beginPath(); ctx.moveTo(b.x-p1x,b.y-p1y); ctx.lineTo(b.x,b.y); ctx.lineTo(b.x-p2x,b.y-p2y); ctx.stroke();
    }

  function drawSurvivors(){
    var tt=performance.now()/1000;
    for(var i=0;i<survivors.length;i++){
      var s=survivors[i], col=s.following?PAL.follow:PAL.surv, sc=s.scale, pr=1+Math.sin(s.t*4)*0.12;
      ctx.strokeStyle=col; ctx.globalAlpha=0.22; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(s.px,s.py); ctx.lineTo(s.x,s.y); ctx.stroke(); ctx.globalAlpha=1;
      var sprite=s.following?haloFollow:haloSurv, d=13*sc;
      if(sprite) ctx.drawImage(sprite, s.x-d, s.y-d, d*2, d*2);
      else { ctx.globalAlpha=0.3; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(s.x,s.y,11*sc,0,7); ctx.fill(); ctx.globalAlpha=1; }
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(s.x,s.y,5*sc*pr,0,7); ctx.fill();
      if(s.danger){
        ctx.strokeStyle=PAL.danger; ctx.globalAlpha=0.55+0.45*Math.sin(tt*12); ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(s.x,s.y,10*sc,0,7); ctx.stroke(); ctx.globalAlpha=1;
      }
      s.px=s.x; s.py=s.y;
    }
  }
  function drawParticles(){ for(var i=0;i<particles.length;i++){ var p=particles[i]; ctx.globalAlpha=clamp(p.life/p.max,0,1); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); } ctx.globalAlpha=1; }
  function drawRipples(){ for(var i=0;i<ripples.length;i++){ var r=ripples[i]; ctx.globalAlpha=clamp(r.life,0,1)*0.5; ctx.strokeStyle=r.color; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.stroke(); } ctx.globalAlpha=1; }
  function drawFloaters(){ ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 14px ui-monospace,monospace';
    for(var i=0;i<floaters.length;i++){ var f=floaters[i]; ctx.globalAlpha=clamp(f.life,0,1); ctx.fillStyle=PAL.spark; ctx.fillText(f.text,f.x,f.y); } ctx.globalAlpha=1; }

  function render(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle=PAL.bg; ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.translate(shakeX,shakeY);
    drawGrid();
    if(grainPattern){ ctx.globalAlpha=1; ctx.fillStyle=grainPattern; ctx.fillRect(-24,-24,W+48,H+48); }
    drawZones();
    drawCracks();
    for(var i=0;i<strokes.length;i++){ var st=strokes[i], a=Math.min(1,st.life/1.5)*0.96; drawChalk(st.pts,a); drawFlowArrows(st,a); }
    if(draw.active && draw.cur.length>=2) drawChalk(draw.cur,0.95);
    drawSurvivors();
    drawParticles(); drawRipples(); drawFloaters();
    ctx.restore();
    if(vignette){ ctx.globalAlpha=1; ctx.fillStyle=vignette; ctx.fillRect(0,0,W,H); }
    updateHUD();
  }
  function updateHUD(){
    rescuedEl.textContent='RESCUED '+String(rescued).padStart(3,'0');
    if(state==='playing' && comboCount>=4){ comboEl.textContent='STREAK '+comboCount+'  x'+comboMult(); comboEl.style.opacity='1'; }
    else comboEl.style.opacity='0';
    for(var i=0;i<casMarks.length;i++){ if(i<casualties) casMarks[i].classList.add('on'); else casMarks[i].classList.remove('on'); }
  }

  // ---------- loop ----------
  function frame(t){
    raf=requestAnimationFrame(frame);
    var dt=(t-last)/1000; last=t;
    if(dt>0.05) dt=0.05; if(dt<0) dt=0;
    try{
      if(state==='playing'){
        if(freeze>0){ freeze-=dt; render(); return; }
        updatePlay(dt);
      }
      else if(state==='title') updateTitle(dt);
      else updateOver(dt);
      render();
    }catch(err){ /* safety net: never surface an uncaught exception */ }
  }

  // ---------- boot ----------
  resize(); makeGrain(); makeHalos(); buildCas(); setupTitle();
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',function(){ setTimeout(resize,200); });
  last=performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
