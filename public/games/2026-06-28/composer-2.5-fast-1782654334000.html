<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silence Stack</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef2f0;--fg:#101412;--muted:#5a6460;--panel:rgba(238,242,240,.94);
  --kick:#00d4aa;--hat:#ffd166;--bass:#ff6b35;--stab:#2ec4b6;--air:#f0f4f8;
  --accent:#00c8b4;--hot:#ff5a1f;--line:#101412;--glow:rgba(0,200,180,.35);
  --scan:rgba(0,0,0,.03);--booth:#d8e0dc;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#050608;--fg:#e8ecea;--muted:#7a8480;--panel:rgba(5,6,8,.92);
    --kick:#00ffcc;--hat:#ffe066;--bass:#ff7847;--stab:#40e0d0;--air:#c8d8e8;
    --accent:#00f0d0;--hot:#ff6b2c;--line:#00f0d0;--glow:rgba(0,240,208,.45);
    --scan:rgba(0,255,220,.025);--booth:#0a0c10;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none;
  -webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
#canvas{flex:1;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 6px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
.stat{display:flex;flex-direction:column;gap:1px}
.stat label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat span{font-size:17px;font-weight:600;line-height:1.1}
#progress{position:absolute;left:14px;right:14px;top:58px;pointer-events:none;z-index:3}
#progress-bar{height:2px;background:rgba(127,127,127,.2);border-radius:1px;overflow:hidden}
#progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--hot));transition:width .12s linear}
#progress-label{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.1em;text-transform:uppercase}
#status{position:absolute;left:0;right:0;top:78px;text-align:center;pointer-events:none;z-index:3;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:0;transition:opacity .2s}
#status.show{opacity:1}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;pointer-events:none;z-index:10;padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(26px,7.5vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05;color:var(--fg)}
.overlay p{font-size:12px;color:var(--muted);max-width:290px;line-height:1.55}
.overlay .tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  border:1px solid var(--glow);padding:5px 12px;border-radius:999px}
.overlay button{pointer-events:auto;min-width:190px;min-height:48px;padding:14px 28px;
  border:none;border-radius:999px;font:inherit;font-size:13px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;background:var(--fg);color:var(--bg);
  box-shadow:0 8px 28px rgba(0,0,0,.18);transition:transform .1s}
.overlay button:active{transform:scale(.96)}
#gameover .score-big{font-size:46px;font-weight:700;color:var(--accent);line-height:1}
#gameover .grade{font-size:13px;color:var(--hot);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4}
#flash.hit{background:radial-gradient(circle at 50% 55%,var(--glow),transparent 65%)}
#flash.miss{background:radial-gradient(circle at 50% 55%,rgba(255,90,31,.3),transparent 65%)}
#flash.collapse{background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.55),transparent 70%)}
#flash.on{animation:flashOut .35s ease-out forwards}
@keyframes flashOut{0%{opacity:.85}100%{opacity:0}}
#tap-zone{position:absolute;inset:0;z-index:2;touch-action:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="stat"><label>Score</label><span id="score">0</span></div>
    <div class="stat" style="align-items:center"><label>Layers</label><span id="layers">1/5</span></div>
    <div class="stat" style="align-items:flex-end"><label>Combo</label><span id="combo">×0</span></div>
  </div>
  <div id="progress"><div id="progress-bar"><div id="progress-fill"></div></div><div id="progress-label">45s loop</div></div>
  <div id="status"></div>
  <div id="flash"></div>
  <div id="tap-zone"></div>
  <div id="title" class="overlay">
    <span class="tag">Stutter House · June Light</span>
    <h1>Silence Stack</h1>
    <p>Tap the neon kicks bar by bar. Stack five stems into one drop — miss a beat and the booth collapses to silence until you rebuild.</p>
    <button type="button" data-smoke="start">Drop In</button>
  </div>
  <div id="gameover" class="overlay hidden">
    <span class="tag">Loop Exported</span>
    <div class="score-big" id="final-score">0</div>
    <div class="grade" id="final-grade">WARM UP</div>
    <p id="final-msg">Keep the groove alive.</p>
    <button type="button" data-smoke="restart">Stack Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas ? canvas.getContext('2d') : null;
var tapZone = document.getElementById('tap-zone');
var titleEl = document.getElementById('title');
var gameoverEl = document.getElementById('gameover');
var flashEl = document.getElementById('flash');
var statusEl = document.getElementById('status');
var scoreEl = document.getElementById('score');
var layersEl = document.getElementById('layers');
var comboEl = document.getElementById('combo');
var progressFill = document.getElementById('progress-fill');
var progressLabel = document.getElementById('progress-label');
var finalScoreEl = document.getElementById('final-score');
var finalGradeEl = document.getElementById('final-grade');
var finalMsgEl = document.getElementById('final-msg');
var startBtn = document.querySelector('[data-smoke="start"]');
var restartBtn = document.querySelector('[data-smoke="restart"]');

var ROUND_MS = 45000;
var BASE_BPM = 124;
var REBUILD_HITS = 4;
var W = 0, H = 0, dpr = 1;
var phase = 'title';
var playMode = 'groove';
var lastFrame = 0;
var sessionStart = 0;
var gameTime = 0;
var bpm = BASE_BPM;
var beatMs = 60000 / BASE_BPM;
var barMs = beatMs * 4;

var score = 0, combo = 0, maxCombo = 0, hits = 0, misses = 0, collapses = 0, rebuilds = 0;
var activeLayers = 1;
var layerEnergy = [0, 0, 0, 0, 0];
var stemMuted = [false, false, false, false, false];
var muteTimers = [0, 0, 0, 0, 0];
var notes = [];
var rebuildNotes = [];
var rebuildProgress = 0;
var collapseTimer = 0;
var masterVol = 1;
var targetMaster = 1;
var shake = 0;
var hitPause = 0;
var particles = [];
var popups = [];
var scanY = 0;
var darkMode = false;
var barsCompleted = 0;

var STEM_NAMES = ['KICK', 'HAT', 'BASS', 'STAB', 'AIR'];
var STEM_COLORS = ['--kick', '--hat', '--bass', '--stab', '--air'];

var STUTTER = [
  {beat:0, stem:0}, {beat:0.375, stem:0}, {beat:0.75, stem:0},
  {beat:1.5, stem:1}, {beat:2, stem:0}, {beat:2.625, stem:1},
  {beat:3, stem:0}, {beat:3.375, stem:2}
];

var audioCtx = null;
var masterGain = null;
var stemGains = [];

function prefersDark(){
  try{return window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;}catch(e){return false;}
}

function css(name){
  try{return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}catch(e){return '#00f0d0';}
}

function resize(){
  if(!canvas)return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 320;
  H = window.innerHeight || 480;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx)ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initAudio(){
  if(audioCtx)return true;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC)return false;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(audioCtx.destination);
    for(var i = 0; i < 5; i++){
      var g = audioCtx.createGain();
      g.gain.value = 0;
      g.connect(masterGain);
      stemGains.push(g);
    }
    return true;
  }catch(e){return false;}
}

function resumeAudio(){
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume().catch(function(){});
  }
}

function safeTime(time){
  if(!audioCtx)return 0;
  var now = audioCtx.currentTime;
  var t = time != null && isFinite(time) ? time : now;
  if(!isFinite(t) || t < 0) t = now;
  return Math.max(now, t);
}

function playStem(stem, time, accent){
  if(!audioCtx || !masterGain || stem < 0 || stem >= stemGains.length)return;
  if(stemMuted[stem] || playMode === 'collapsed')return;
  var t = safeTime(time);
  var g = stemGains[stem];
  if(!g)return;
  if(stem === 0){
    var o = audioCtx.createOscillator();
    var gn = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(accent ? 62 : 54, t);
    o.frequency.exponentialRampToValueAtTime(28, t + 0.09);
    gn.gain.setValueAtTime(accent ? 0.85 : 0.6, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(gn); gn.connect(g);
    o.start(t); o.stop(t + 0.17);
  } else if(stem === 1){
    var len = Math.floor(audioCtx.sampleRate * 0.04);
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    var hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 6000;
    var gn2 = audioCtx.createGain();
    gn2.gain.setValueAtTime(0.22, t);
    gn2.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
    src.connect(hp); hp.connect(gn2); gn2.connect(g);
    src.start(t);
  } else if(stem === 2){
    var o2 = audioCtx.createOscillator();
    var gn3 = audioCtx.createGain();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(48, t);
    gn3.gain.setValueAtTime(0.45, t);
    gn3.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o2.connect(gn3); gn3.connect(g);
    o2.start(t); o2.stop(t + 0.22);
  } else if(stem === 3){
    var freqs = [220, 277.18, 329.63];
    for(var f = 0; f < freqs.length; f++){
      var o3 = audioCtx.createOscillator();
      var gn4 = audioCtx.createGain();
      o3.type = 'sawtooth';
      o3.frequency.value = freqs[f];
      gn4.gain.setValueAtTime(0.08, t);
      gn4.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o3.connect(gn4); gn4.connect(g);
      o3.start(t); o3.stop(t + 0.14);
    }
  } else {
    var len2 = Math.floor(audioCtx.sampleRate * 0.08);
    var buf2 = audioCtx.createBuffer(1, len2, audioCtx.sampleRate);
    var d2 = buf2.getChannelData(0);
    for(var j = 0; j < len2; j++) d2[j] = (Math.random() * 2 - 1) * 0.3 * (1 - j / len2);
    var src2 = audioCtx.createBufferSource();
    src2.buffer = buf2;
    var lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1200;
    var gn5 = audioCtx.createGain();
    gn5.gain.setValueAtTime(0.12, t);
    gn5.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    src2.connect(lp); lp.connect(gn5); gn5.connect(g);
    src2.start(t);
  }
}

function playCollapseSound(){
  if(!audioCtx || !masterGain)return;
  var t = safeTime();
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.4);
  g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.5);
}

function playRebuildPing(){
  if(!audioCtx || !masterGain)return;
  var t = safeTime();
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(440 + rebuildProgress * 110, t);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.1);
}

function playRestoreSound(){
  if(!audioCtx || !masterGain)return;
  var t = safeTime();
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(880, t + 0.25);
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.32);
}

function updateStemVolumes(){
  for(var i = 0; i < 5; i++){
    if(!stemGains[i])continue;
    var target = 0;
    if(i < activeLayers && playMode !== 'collapsed'){
      target = stemMuted[i] ? 0.04 : (0.14 + layerEnergy[i] * 0.22);
    }
    stemGains[i].gain.value = target * masterVol;
  }
}

function setStatus(text){
  if(!statusEl)return;
  statusEl.textContent = text || '';
  statusEl.classList.toggle('show', !!text);
}

function flash(type){
  if(!flashEl)return;
  flashEl.className = type + ' on';
  setTimeout(function(){ flashEl.className = ''; }, 380);
}

function vibrate(v){
  try{if(navigator.vibrate)navigator.vibrate(v);}catch(e){}
}

function spawnParticles(x, y, col, n){
  n = n || 10;
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 2 + Math.random() * 5;
    particles.push({x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, col:col});
  }
}

function getTolerance(){
  return Math.max(55, beatMs * 0.16 - barsCompleted * 0.4);
}

function spawnBarNotes(fromBar){
  var tol = getTolerance();
  for(var b = fromBar; b <= fromBar + 6; b++){
    var barStart = b * barMs;
    for(var i = 0; i < STUTTER.length; i++){
      var s = STUTTER[i];
      if(s.stem >= activeLayers)continue;
      var ms = barStart + s.beat * beatMs;
      notes.push({
        ms: ms,
        tol: tol,
        stem: s.stem,
        hit: false,
        id: b + '-' + i + '-' + s.stem
      });
    }
  }
}

function spawnRebuildNotes(fromMs){
  rebuildNotes = [];
  var start = Math.ceil(fromMs / beatMs) * beatMs;
  for(var i = 0; i < REBUILD_HITS + 2; i++){
    rebuildNotes.push({ms: start + i * beatMs, tol: beatMs * 0.22, hit: false});
  }
}

function pruneNotes(){
  var cutoff = gameTime - 500;
  notes = notes.filter(function(n){ return !n.hit && n.ms > cutoff; });
  if(notes.length > 120) notes = notes.slice(-120);
}

function nearestNote(t, list){
  var best = null, bestD = Infinity;
  for(var i = 0; i < list.length; i++){
    var n = list[i];
    if(n.hit)continue;
    var d = Math.abs(t - n.ms);
    if(d <= n.tol && d < bestD){ best = n; bestD = d; }
  }
  return best;
}

function nearestOffbeat(t){
  var bestD = Infinity;
  for(var i = 0; i < notes.length; i++){
    var n = notes[i];
    if(n.hit)continue;
    var d = Math.abs(t - n.ms);
    if(d < bestD) bestD = d;
  }
  return bestD;
}

function muteRandomStem(){
  var candidates = [];
  for(var i = 0; i < activeLayers; i++){
    if(!stemMuted[i]) candidates.push(i);
  }
  if(!candidates.length)return;
  var pick = candidates[Math.floor(Math.random() * candidates.length)];
  stemMuted[pick] = true;
  muteTimers[pick] = barMs * 1.2;
  setStatus(STEM_NAMES[pick] + ' MUTED');
  spawnParticles(W * 0.5, H * 0.35 + pick * (H * 0.09), css(STEM_COLORS[pick]), 6);
  updateStemVolumes();
}

function triggerCollapse(){
  playMode = 'collapsed';
  collapses++;
  combo = 0;
  rebuildProgress = 0;
  targetMaster = 0.02;
  collapseTimer = 0;
  spawnRebuildNotes(gameTime);
  setStatus('REBUILD — TAP ' + REBUILD_HITS + ' PULSES');
  flash('collapse');
  vibrate([30, 40, 30]);
  playCollapseSound();
  updateHud();
  updateStemVolumes();
}

function restoreGroove(){
  playMode = 'groove';
  rebuilds++;
  rebuildProgress = 0;
  rebuildNotes = [];
  targetMaster = 1;
  combo = 0;
  setStatus('GROOVE RESTORED');
  flash('hit');
  vibrate(20);
  playRestoreSound();
  setTimeout(function(){ setStatus(''); }, 900);
  spawnBarNotes(Math.floor(gameTime / barMs));
  updateStemVolumes();
}

function registerHit(note){
  note.hit = true;
  hits++;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  layerEnergy[note.stem] = Math.min(1, layerEnergy[note.stem] + 0.08);
  score += Math.round(80 + combo * 18 + activeLayers * 12);
  hitPause = 0.035;
  shake = 2;
  flash('hit');
  vibrate(10);
  playStem(note.stem, null, combo > 4);
  spawnParticles(W * 0.5, stripY(note.stem), css(STEM_COLORS[note.stem]), 8);
  popups.push({text:'+' + Math.round(80 + combo * 18), x:W*0.5, y:stripY(note.stem) - 10, life:0.9, col:css(STEM_COLORS[note.stem])});
  updateHud();
  updateStemVolumes();
}

function registerMiss(reason){
  misses++;
  combo = 0;
  shake = reason === 'collapse' ? 10 : 6;
  flash('miss');
  vibrate([15, 20]);
  if(reason === 'offbeat'){
    muteRandomStem();
  } else if(playMode === 'groove' && reason !== 'rebuild'){
    triggerCollapse();
  } else if(playMode === 'collapsed'){
    rebuildProgress = 0;
    spawnRebuildNotes(gameTime);
    setStatus('REBUILD RESET');
  }
  updateHud();
}

function registerRebuildHit(note){
  note.hit = true;
  rebuildProgress++;
  hits++;
  score += 120;
  flash('hit');
  vibrate(8);
  playRebuildPing();
  spawnParticles(W * 0.5, H * 0.5, css('--accent'), 6);
  if(rebuildProgress >= REBUILD_HITS) restoreGroove();
  else setStatus('REBUILD ' + rebuildProgress + '/' + REBUILD_HITS);
  updateHud();
}

function onTap(e){
  if(e && e.preventDefault) e.preventDefault();
  if(phase !== 'playing')return;
  var t = gameTime;
  if(playMode === 'collapsed'){
    var rn = nearestNote(t, rebuildNotes);
    if(rn) registerRebuildHit(rn);
    else registerMiss('rebuild');
    return;
  }
  var note = nearestNote(t, notes);
  if(note){
    registerHit(note);
    return;
  }
  var offDist = nearestOffbeat(t);
  if(offDist < beatMs * 0.35 && offDist > getTolerance()){
    registerMiss('offbeat');
  } else {
    registerMiss('timing');
  }
}

function stripY(stem){
  var top = H * 0.22;
  var h = H * 0.58;
  var gap = h / 5;
  return top + stem * gap + gap * 0.5;
}

function stripHeight(){
  return Math.max(36, H * 0.09);
}

function updateBpm(){
  var newBpm = BASE_BPM + Math.floor(gameTime / 12000) * 3 + Math.floor(barsCompleted / 3);
  newBpm = Math.min(142, newBpm);
  if(newBpm !== bpm){
    bpm = newBpm;
    beatMs = 60000 / bpm;
    barMs = beatMs * 4;
    if(progressLabel) progressLabel.textContent = bpm + ' BPM · bar ' + (barsCompleted + 1);
  }
}

function updateLayers(){
  var target = Math.min(5, 1 + Math.floor(barsCompleted / 2));
  if(target > activeLayers){
    activeLayers = target;
    layerEnergy[activeLayers - 1] = 0.2;
    setStatus('+' + STEM_NAMES[activeLayers - 1] + ' LAYER');
    spawnBarNotes(Math.floor(gameTime / barMs));
    setTimeout(function(){ if(playMode === 'groove') setStatus(''); }, 800);
    vibrate([8, 12, 8]);
  }
}

function tickAudio(){
  if(!audioCtx || phase !== 'playing' || playMode === 'collapsed')return;
  var now = audioCtx.currentTime;
  if(!tickAudio.last) tickAudio.last = now;
  var ahead = gameTime + 120;
  for(var i = 0; i < notes.length; i++){
    var n = notes[i];
    if(n.hit || n._scheduled)continue;
    if(n.ms <= ahead && n.ms >= gameTime - 50){
      n._scheduled = true;
      var when = now + Math.max(0, (n.ms - gameTime) / 1000);
      playStem(n.stem, when, false);
    }
  }
}

function updateHud(){
  if(scoreEl) scoreEl.textContent = String(score);
  if(comboEl) comboEl.textContent = '×' + combo;
  if(layersEl) layersEl.textContent = activeLayers + '/5';
  if(progressFill) progressFill.style.width = Math.min(100, (gameTime / ROUND_MS) * 100) + '%';
}

function endGame(){
  phase = 'gameover';
  playMode = 'groove';
  if(titleEl) titleEl.classList.add('hidden');
  if(gameoverEl) gameoverEl.classList.remove('hidden');
  if(finalScoreEl) finalScoreEl.textContent = String(score);
  var acc = hits + misses > 0 ? hits / (hits + misses) : 0;
  var grade, msg;
  if(activeLayers >= 5 && acc >= 0.75 && rebuilds >= collapses){
    grade = 'SUNRISE DROP';
    msg = 'Fog burned off — full stack locked.';
  } else if(acc >= 0.65 && activeLayers >= 4){
    grade = 'BOOTH READY';
    msg = 'Fred again.. would stack this.';
  } else if(acc >= 0.45){
    grade = 'BUILDING';
    msg = 'Keep the stems breathing.';
  } else {
    grade = 'SILENCE';
    msg = 'The groove collapsed too often.';
  }
  if(finalGradeEl) finalGradeEl.textContent = grade;
  if(finalMsgEl) finalMsgEl.textContent = msg + ' · ' + hits + ' hits · ' + rebuilds + ' rebuilds · ×' + maxCombo;
}

function resetGame(){
  score = 0; combo = 0; maxCombo = 0; hits = 0; misses = 0;
  collapses = 0; rebuilds = 0; activeLayers = 1; barsCompleted = 0;
  layerEnergy = [0.15, 0, 0, 0, 0];
  stemMuted = [false, false, false, false, false];
  muteTimers = [0, 0, 0, 0, 0];
  notes = []; rebuildNotes = []; rebuildProgress = 0;
  particles = []; popups = [];
  bpm = BASE_BPM; beatMs = 60000 / BASE_BPM; barMs = beatMs * 4;
  playMode = 'groove'; masterVol = 1; targetMaster = 1;
  shake = 0; hitPause = 0; tickAudio.last = 0;
  spawnBarNotes(0);
  setStatus('');
  if(progressLabel) progressLabel.textContent = '45s loop';
  updateHud();
  updateStemVolumes();
}

function startGame(){
  initAudio();
  resumeAudio();
  resetGame();
  phase = 'playing';
  sessionStart = performance.now();
  gameTime = 0;
  if(titleEl) titleEl.classList.add('hidden');
  if(gameoverEl) gameoverEl.classList.add('hidden');
  updateHud();
}

function drawBooth(t){
  if(!ctx)return;
  var booth = css('--booth');
  ctx.fillStyle = booth;
  ctx.fillRect(12, H * 0.16, W - 24, H * 0.64);
  ctx.strokeStyle = darkMode ? 'rgba(0,240,208,.15)' : 'rgba(0,0,0,.08)';
  ctx.lineWidth = 1;
  ctx.strokeRect(12, H * 0.16, W - 24, H * 0.64);
  scanY = (scanY + 1.2) % (H * 0.64);
  ctx.fillStyle = css('--scan');
  for(var sy = H * 0.16; sy < H * 0.8; sy += 3){
    ctx.fillRect(12, sy, W - 24, 1);
  }
  ctx.fillStyle = darkMode ? 'rgba(0,240,208,.08)' : 'rgba(0,0,0,.04)';
  ctx.fillRect(12, H * 0.16 + scanY, W - 24, 2);
}

function drawStrip(stem, t){
  if(!ctx)return;
  var y = stripY(stem);
  var sh = stripHeight();
  var col = css(STEM_COLORS[stem]);
  var active = stem < activeLayers;
  var energy = layerEnergy[stem];
  var muted = stemMuted[stem];
  var x0 = 16, x1 = W - 16;
  var w = x1 - x0;

  ctx.fillStyle = darkMode ? 'rgba(255,255,255,.03)' : 'rgba(0,0,0,.04)';
  ctx.fillRect(x0, y - sh * 0.5, w, sh);

  if(!active){
    ctx.fillStyle = darkMode ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.06)';
    ctx.fillRect(x0, y - sh * 0.5, w, sh);
    ctx.fillStyle = css('--muted');
    ctx.font = '600 9px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(STEM_NAMES[stem], x0 + 6, y + 3);
    return;
  }

  var scroll = (gameTime * 0.004 * (bpm / BASE_BPM) + stem * 0.7) % 1;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y - sh * 0.5, w, sh);
  ctx.clip();
  ctx.strokeStyle = muted ? 'rgba(127,127,127,.25)' : col;
  ctx.lineWidth = 1.5 + energy * 2;
  ctx.shadowColor = muted ? 'transparent' : col;
  ctx.shadowBlur = muted ? 0 : 6 + energy * 14;
  ctx.beginPath();
  for(var x = x0; x <= x1; x += 2){
    var ph = (x / w * 10 + scroll * 8 + t * 0.002 * (1 + stem * 0.2)) * Math.PI;
    var stutter = Math.sin(ph * 3.7) * 0.35 + Math.sin(ph) * 0.65;
    if(playMode === 'collapsed') stutter *= 0.15;
    var amp = (sh * 0.28) * (0.35 + energy * 0.65) * stutter;
    var yy = y + amp;
    if(x === x0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  var playX = W * 0.5;
  ctx.strokeStyle = css('--line');
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(playX, y - sh * 0.45);
  ctx.lineTo(playX, y + sh * 0.45);
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.fillStyle = muted ? css('--muted') : col;
  ctx.font = '600 9px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(STEM_NAMES[stem] + (muted ? ' · MUTE' : ''), x0 + 6, y - sh * 0.32);

  var list = playMode === 'collapsed' && stem === 0 ? rebuildNotes : notes;
  for(var i = 0; i < list.length; i++){
    var n = list[i];
    if(n.hit)continue;
    if(playMode !== 'collapsed' && n.stem !== stem)continue;
    var dx = playX + (n.ms - gameTime) * 0.15;
    if(dx < x0 - 20 || dx > x1 + 20)continue;
    var near = Math.abs(n.ms - gameTime) < n.tol;
    var r = near ? 11 : 7;
    ctx.beginPath();
    ctx.arc(dx, y, r, 0, Math.PI * 2);
    ctx.fillStyle = near ? col : (darkMode ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.08)');
    ctx.fill();
    if(near){
      ctx.strokeStyle = css('--hot');
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

function drawCollapsedOverlay(t){
  if(!ctx || playMode !== 'collapsed')return;
  ctx.fillStyle = darkMode ? 'rgba(0,0,0,.55)' : 'rgba(238,242,240,.72)';
  ctx.fillRect(0, H * 0.16, W, H * 0.64);
  ctx.fillStyle = css('--accent');
  ctx.font = '700 14px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SILENCE', W * 0.5, H * 0.42);
  ctx.font = '600 10px ui-monospace, Menlo, monospace';
  ctx.fillStyle = css('--muted');
  ctx.fillText('TAP ' + REBUILD_HITS + ' CENTER PULSES', W * 0.5, H * 0.46);
  for(var i = 0; i < REBUILD_HITS; i++){
    var px = W * 0.5 + (i - (REBUILD_HITS - 1) / 2) * 28;
    ctx.beginPath();
    ctx.arc(px, H * 0.52, 6, 0, Math.PI * 2);
    ctx.fillStyle = i < rebuildProgress ? css('--accent') : (darkMode ? 'rgba(255,255,255,.15)' : 'rgba(0,0,0,.1)');
    ctx.fill();
  }
}

function drawPopups(dt){
  if(!ctx)return;
  for(var i = popups.length - 1; i >= 0; i--){
    var p = popups[i];
    p.y -= dt * 55;
    p.life -= dt * 1.5;
    if(p.life <= 0){ popups.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.font = '600 12px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawParticles(dt){
  if(!ctx)return;
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= dt * 2.2;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2 + p.life * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTitleBg(t){
  if(!ctx)return;
  ctx.fillStyle = css('--bg');
  ctx.fillRect(0, 0, W, H);
  drawBooth(t);
  for(var s = 0; s < 5; s++) drawStrip(s, t);
  ctx.fillStyle = css('--muted');
  ctx.font = '600 10px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('NEON WAVEFORM MONITOR', W * 0.5, H * 0.12);
}

function draw(now){
  if(!ctx){
    requestAnimationFrame(draw);
    return;
  }
  var dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016);
  lastFrame = now;
  darkMode = prefersDark();

  if(phase === 'playing'){
    if(hitPause > 0) hitPause -= dt;
    else gameTime = performance.now() - sessionStart;

    masterVol += (targetMaster - masterVol) * Math.min(1, dt * 8);
    updateBpm();

    for(var m = 0; m < 5; m++){
      if(muteTimers[m] > 0){
        muteTimers[m] -= dt * 1000;
        if(muteTimers[m] <= 0){ stemMuted[m] = false; updateStemVolumes(); }
      }
    }

    var barNow = Math.floor(gameTime / barMs);
    if(barNow > barsCompleted){
      barsCompleted = barNow;
      updateLayers();
      spawnBarNotes(barNow + 1);
    }
    if(Math.floor(gameTime / 4000) !== Math.floor((gameTime - dt * 1000) / 4000)) pruneNotes();

    tickAudio();
    updateStemVolumes();
    if(gameTime >= ROUND_MS) endGame();
    updateHud();
  }

  var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  var sy = shake > 0 ? (Math.random() - 0.5) * shake * 0.6 : 0;
  if(shake > 0) shake *= 0.86;

  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.translate(sx, sy);
  ctx.fillStyle = css('--bg');
  ctx.fillRect(-5, -5, W + 10, H + 10);

  if(phase === 'title'){
    drawTitleBg(now);
  } else {
    drawBooth(now);
    for(var s2 = 0; s2 < 5; s2++) drawStrip(s2, now);
    drawCollapsedOverlay(now);
    if(phase === 'playing' && playMode === 'groove'){
      ctx.fillStyle = css('--muted');
      ctx.font = '600 9px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('TAP ON BEAT · OFF-BEAT MUTES A STEM', W * 0.5, H * 0.885);
    }
  }

  drawPopups(dt);
  drawParticles(dt);
  ctx.restore();
  requestAnimationFrame(draw);
}

function bindTap(el){
  if(!el)return;
  el.addEventListener('pointerdown', function(e){
    if(e && e.preventDefault) e.preventDefault();
    onTap(e);
  }, {passive:false});
}

if(startBtn) startBtn.addEventListener('click', function(e){
  if(e && e.preventDefault) e.preventDefault();
  startGame();
});
if(restartBtn) restartBtn.addEventListener('click', function(e){
  if(e && e.preventDefault) e.preventDefault();
  startGame();
});

bindTap(tapZone);
bindTap(canvas);

window.addEventListener('keydown', function(e){
  if(!e)return;
  if(e.code === 'Space' || e.code === 'Enter'){
    if(e.preventDefault) e.preventDefault();
    if(phase === 'playing') onTap(e);
  }
});

window.addEventListener('resize', resize);
try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(){ darkMode = prefersDark(); });
  }
}catch(e){}

resize();
phase = 'title';
requestAnimationFrame(draw);

})();
</script>
</body>
</html>
