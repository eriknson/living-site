<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Surfer</title>
<style>
:root {
  --bg-panel: rgba(255, 255, 255, 0.85);
  --text: #1a2a3a;
  --bg-btn: #1a2a3a;
  --text-btn: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-panel: rgba(10, 20, 30, 0.85);
    --text: #e0e8f0;
    --bg-btn: #e0e8f0;
    --text-btn: #0a141e;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 100dvw; height: 100dvh;
  overflow: hidden;
  background: #000;
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Courier, monospace;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas {
  display: block; width: 100%; height: 100%;
}
#ui {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
.screen {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-panel);
  color: var(--text);
  padding: 2.5rem 2rem;
  border-radius: 20px;
  text-align: center;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(128,128,128,0.2);
  pointer-events: none;
  min-width: 300px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  transition: opacity 0.3s;
}
h1 {
  font-weight: 800; letter-spacing: -1px; margin-bottom: 1rem;
  font-size: 2rem; text-transform: uppercase;
}
p {
  font-size: 0.9rem; margin-bottom: 0.5rem; opacity: 0.8;
}
button {
  pointer-events: auto;
  background: var(--bg-btn); color: var(--text-btn);
  border: none; padding: 1.2rem 2.5rem;
  font-size: 1.1rem; font-family: inherit; font-weight: 700;
  border-radius: 30px; margin-top: 1.5rem;
  cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
  transition: transform 0.1s;
}
button:active {
  transform: scale(0.95);
}
.hidden {
  display: none !important;
}

#hud {
  position: absolute; top: 0; left: 0; width: 100%;
  padding: 20px;
  display: flex; justify-content: space-between;
  pointer-events: none;
}
.hud-box {
  display: flex; flex-direction: column;
}
.hud-label {
  font-size: 0.75rem; font-weight: 700; opacity: 0.9; letter-spacing: 1px;
  margin-bottom: 6px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
.hud-val {
  font-size: 1.5rem; font-weight: 800; color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  font-feature-settings: "tnum"; font-variant-numeric: tabular-nums;
}
.bar-bg {
  width: 120px; height: 10px; background: rgba(0,0,0,0.5);
  border-radius: 5px; overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
}
.bar-fill {
  height: 100%; background: #ffaa00; width: 50%;
  transition: width 0.1s linear, background 0.1s;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="screen-start" class="screen active">
    <h1>Fog Surfer</h1>
    <p>Swipe left/right to dodge the marine rolls.</p>
    <p>Collect golden warmth to survive until sunrise.</p>
    <button data-smoke="start" onclick="setMode('PLAYING')">Survive the Dawn</button>
  </div>
  <div id="screen-over" class="screen hidden">
    <h1 id="over-title">Game Over</h1>
    <p id="over-score">Score: 0</p>
    <button data-smoke="restart" onclick="setMode('PLAYING')">Ride Again</button>
  </div>
  <div id="hud" class="hidden">
    <div class="hud-box">
      <div class="hud-label">WARMTH</div>
      <div class="bar-bg"><div id="warmth-bar" class="bar-fill"></div></div>
    </div>
    <div class="hud-box" style="align-items: center; position: absolute; left: 50%; transform: translateX(-50%);">
      <div class="hud-label">SCORE</div>
      <div id="score-text" class="hud-val">0</div>
    </div>
    <div class="hud-box" style="align-items: flex-end;">
      <div class="hud-label">TIME</div>
      <div id="time-text" class="hud-val">60s</div>
    </div>
  </div>
</div>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) return; // Fallback gracefully if 2d context fails

  let W, H;
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    if (state.mode !== 'PLAYING') {
      currentLaneX = (state.lane + 0.5) * (W / 3);
    }
  }
  window.addEventListener('resize', resize);

  const THEMES = {
    dark: {
      prog0: { top: [10, 20, 35], bot: [20, 35, 50], fog: [30, 45, 65], hill: [15, 25, 35] },
      prog1: { top: [30, 60, 90], bot: [255, 170, 50], fog: [200, 210, 220], hill: [120, 80, 40] }
    },
    light: {
      prog0: { top: [180, 200, 220], bot: [210, 230, 245], fog: [160, 180, 200], hill: [150, 170, 180] },
      prog1: { top: [130, 190, 240], bot: [255, 220, 120], fog: [240, 245, 250], hill: [180, 160, 100] }
    }
  };

  const state = {
    mode: 'START',
    score: 0,
    time: 0,
    warmth: 50,
    lane: 1,
    entities: []
  };

  let currentLaneX = 0;
  let globalTime = 0;
  let spawnTimer = 0;
  let roadCurve = 0;
  let shakeTime = 0;
  let particles = [];
  
  let touchStartX = 0;
  let touchStartY = 0;
  let isDragging = false;

  let audioCtx = null;
  function initAudio() {
    if (audioCtx) return;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    } catch (e) {}
  }
  function playTone(freq, type, duration, vol=0.1) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }
  function playHitSound() {
    playTone(150, 'sawtooth', 0.3, 0.2);
    setTimeout(() => playTone(100, 'square', 0.4, 0.2), 50);
  }
  function playCollectSound() {
    playTone(600, 'sine', 0.1, 0.1);
    setTimeout(() => playTone(800, 'sine', 0.2, 0.1), 100);
  }

  const UI_START = document.getElementById('screen-start');
  const UI_OVER = document.getElementById('screen-over');
  const UI_HUD = document.getElementById('hud');
  const warmthBar = document.getElementById('warmth-bar');
  const timeText = document.getElementById('time-text');
  const scoreText = document.getElementById('score-text');

  window.setMode = function(mode) {
    state.mode = mode;
    UI_START.classList.add('hidden');
    UI_OVER.classList.add('hidden');
    UI_HUD.classList.add('hidden');

    if (mode === 'START') {
      UI_START.classList.remove('hidden');
    } else if (mode === 'PLAYING') {
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
      UI_HUD.classList.remove('hidden');
      resetGame();
    } else if (mode === 'GAMEOVER' || mode === 'WIN') {
      UI_OVER.classList.remove('hidden');
      document.getElementById('over-title').innerText = mode === 'WIN' ? 'Golden Hour' : 'Frozen in Fog';
      document.getElementById('over-score').innerText = `Score: ${state.score}`;
    }
  };

  function resetGame() {
    state.score = 0;
    state.time = 0;
    state.warmth = 50;
    state.lane = 1;
    state.entities = [];
    particles = [];
    currentLaneX = (state.lane + 0.5) * (W / 3);
    spawnTimer = 0;
    roadCurve = 0;
    shakeTime = 0;
  }

  class Entity {
    constructor(type, lane) {
      this.type = type;
      this.lane = lane;
      this.y = H * 0.3; // Spawn at horizon
      this.width = W / 3;
      this.height = type === 'fog' ? 80 : 40;
      this.active = true;
    }
  }

  function handleInput(dx) {
    if (Math.abs(dx) > 30) {
      if (dx > 0 && state.lane < 2) state.lane++;
      else if (dx < 0 && state.lane > 0) state.lane--;
    }
  }

  window.addEventListener('touchstart', e => {
    if (e.target.tagName === 'BUTTON') return;
    if (state.mode !== 'PLAYING') return;
    e.preventDefault();
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, {passive: false});
  window.addEventListener('touchmove', e => {
    if (e.target.tagName === 'BUTTON') return;
    if (state.mode !== 'PLAYING') return;
    e.preventDefault();
  }, {passive: false});
  window.addEventListener('touchend', e => {
    if (e.target.tagName === 'BUTTON') return;
    if (state.mode !== 'PLAYING') return;
    e.preventDefault();
    let dx = e.changedTouches[0].clientX - touchStartX;
    handleInput(dx);
  }, {passive: false});

  window.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    if (state.mode !== 'PLAYING') return;
    isDragging = true;
    touchStartX = e.clientX;
  });
  window.addEventListener('mouseup', e => {
    if (e.target.tagName === 'BUTTON') return;
    if (state.mode !== 'PLAYING') return;
    if (!isDragging) return;
    isDragging = false;
    handleInput(e.clientX - touchStartX);
  });

  window.addEventListener('keydown', e => {
    if (state.mode !== 'PLAYING') return;
    if (e.key === 'ArrowLeft' || e.key === 'a') {
      if (state.lane > 0) state.lane--;
    }
    if (e.key === 'ArrowRight' || e.key === 'd') {
      if (state.lane < 2) state.lane++;
    }
  });

  function spawnParticles(x, y, color) {
    for(let i=0; i<15; i++) {
      particles.push({
        x, y,
        vx: (Math.random()-0.5)*200,
        vy: (Math.random()-0.5)*200,
        life: 1,
        color
      });
    }
  }

  function hitFog() {
    state.warmth -= 30;
    shakeTime = 0.3;
    playHitSound();
    try { if (navigator.vibrate) navigator.vibrate([50, 50, 50]); } catch(e){}
    spawnParticles(currentLaneX, H * 0.8, '#ffffff');
  }

  function collectWarmth() {
    state.warmth += 15;
    if (state.warmth > 100) state.warmth = 100;
    state.score += 10;
    playCollectSound();
    try { if (navigator.vibrate) navigator.vibrate([20]); } catch(e){}
    spawnParticles(currentLaneX, H * 0.8, '#ffaa00');
  }

  function getBaseX(virtualLane, y) {
    let playerY = H * 0.8;
    let dy = Math.max(0, playerY - y);
    let normDy = dy / (H * 0.5); 
    let shift = normDy * normDy * W * 0.2 * roadCurve;
    return virtualLane * (W / 3) + shift;
  }
  function getLaneX(lane, y) {
    return getBaseX(lane + 0.5, y);
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpColor(c1, c2, t) {
    return [lerp(c1[0], c2[0], t)|0, lerp(c1[1], c2[1], t)|0, lerp(c1[2], c2[2], t)|0];
  }
  function toRGB(c) { return `rgb(${c[0]}, ${c[1]}, ${c[2]})`; }

  function getCurrentPalette(theme, progress) {
    return {
      top: lerpColor(theme.prog0.top, theme.prog1.top, progress),
      bot: lerpColor(theme.prog0.bot, theme.prog1.bot, progress),
      fog: lerpColor(theme.prog0.fog, theme.prog1.fog, progress),
      hill: lerpColor(theme.prog0.hill, theme.prog1.hill, progress)
    };
  }

  function update(dt) {
    globalTime += dt;
    if (shakeTime > 0) shakeTime -= dt;

    if (state.mode === 'PLAYING') {
      state.time += dt;
      state.warmth -= 2 * dt;

      let progress = Math.min(1, state.time / 60);
      let curveAmp = 1 + progress * 2;
      roadCurve = (Math.sin(state.time * 0.8) + Math.sin(state.time * 1.3)) * curveAmp;

      let targetLaneBaseX = (state.lane + 0.5) * (W / 3);
      let factor = 1 - Math.exp(-15 * dt);
      currentLaneX += (targetLaneBaseX - currentLaneX) * factor;

      let speed = H * 0.5 * (1 + progress * 0.8);
      let spawnInterval = (H * 0.4) / speed; 
      
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTimer += spawnInterval;
        let r = Math.random();
        let lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
        if (r < 0.3) {
          state.entities.push(new Entity('fog', lanes[0]));
        } else if (r < 0.6) {
          state.entities.push(new Entity('fog', lanes[0]));
          state.entities.push(new Entity('warmth', lanes[1]));
        } else if (r < 0.85) {
          state.entities.push(new Entity('fog', lanes[0]));
          state.entities.push(new Entity('fog', lanes[1]));
        } else {
          state.entities.push(new Entity('fog', lanes[0]));
          state.entities.push(new Entity('fog', lanes[1]));
          state.entities.push(new Entity('warmth', lanes[2]));
        }
      }

      let playerY = H * 0.8;
      for(let i=state.entities.length-1; i>=0; i--) {
        let e = state.entities[i];
        e.y += speed * dt;
        
        if (e.active && Math.abs(e.y - playerY) < e.height * 0.5 + 20) {
          let ex = getLaneX(e.lane, e.y);
          if (Math.abs(ex - currentLaneX) < e.width * 0.4 + 20) {
            if (e.type === 'fog') hitFog();
            else collectWarmth();
            e.active = false;
          }
        }
        if (e.y > H + 100) {
          state.entities.splice(i, 1);
        }
      }

      for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.y += speed * 0.5 * dt; 
        p.life -= dt * 1.5;
        if(p.life <= 0) particles.splice(i, 1);
      }

      warmthBar.style.width = `${Math.max(0, Math.min(100, state.warmth))}%`;
      if (state.warmth < 20 && Math.floor(globalTime * 10) % 2 === 0) {
        warmthBar.style.background = '#ff4444';
      } else {
        warmthBar.style.background = '#ffaa00';
      }
      timeText.innerText = `${Math.ceil(Math.max(0, 60 - state.time))}s`;
      scoreText.innerText = state.score;

      if (state.warmth <= 0) setMode('GAMEOVER');
      else if (state.time >= 60) setMode('WIN');
    }
  }

  function draw() {
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const themeParams = isDark ? THEMES.dark : THEMES.light;
    
    let progress = 0;
    if (state.mode === 'PLAYING') progress = Math.min(1, state.time / 60);
    else if (state.mode === 'WIN') progress = 1;

    const pal = getCurrentPalette(themeParams, progress);

    let grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, toRGB(pal.top));
    grad.addColorStop(1, toRGB(pal.bot));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shakeTime > 0) {
      ctx.translate((Math.random()-0.5)*15*shakeTime, (Math.random()-0.5)*15*shakeTime);
    }

    ctx.globalAlpha = progress * 0.8 + 0.1;
    let sunY = H * 0.45 - progress * H * 0.15;
    ctx.beginPath();
    ctx.arc(W/2, sunY, W*0.3, 0, Math.PI*2);
    let sunGrad = ctx.createRadialGradient(W/2, sunY, W*0.05, W/2, sunY, W*0.3);
    sunGrad.addColorStop(0, 'rgba(255, 230, 150, 1)');
    sunGrad.addColorStop(1, 'rgba(255, 230, 150, 0)');
    ctx.fillStyle = sunGrad;
    ctx.fill();

    for(let i=0; i<3; i++) {
      ctx.beginPath();
      let baseY = H * 0.35 + i * (H * 0.04);
      ctx.moveTo(0, H);
      ctx.lineTo(0, baseY);
      for(let x=0; x<=W; x+=40) {
        let y = baseY + Math.sin(x * 0.01 + globalTime * 0.5 + i) * (15 + i*5);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      let factor = 1 - (i * 0.2);
      ctx.fillStyle = toRGB([pal.hill[0]*factor, pal.hill[1]*factor, pal.hill[2]*factor]);
      ctx.fill();
    }

    ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 + progress*0.15})`;
    ctx.lineWidth = 1.5;
    for(let i=0; i<=3; i++) {
      ctx.beginPath();
      for(let y=H*0.35; y<=H; y+=H*0.05) {
        let x = getBaseX(i, y);
        if (y === H*0.35) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    let sortedEntities = state.entities.slice().sort((a,b) => a.y - b.y);
    sortedEntities.forEach(e => {
      if (!e.active) return;
      let cx = getLaneX(e.lane, e.y);
      let cy = e.y;
      
      let normY = (cy - H * 0.35) / (H * 0.45);
      if (normY < 0) normY = 0;
      let scale = 0.4 + 0.6 * normY;
      let alpha = Math.min(1, normY * 5);
      
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;

      if (e.type === 'fog') {
        let w = e.width * 0.85;
        let h = e.height;
        let fgrad = ctx.createLinearGradient(0, -h*0.5, 0, h*0.5);
        fgrad.addColorStop(0, `rgba(${pal.fog[0]}, ${pal.fog[1]}, ${pal.fog[2]}, 0.95)`);
        fgrad.addColorStop(1, `rgba(${pal.fog[0]*0.8|0}, ${pal.fog[1]*0.8|0}, ${pal.fog[2]*0.8|0}, 0.9)`);
        ctx.fillStyle = fgrad;
        
        const bubbles = [
          {x: -w*0.25, y: h*0.1, r: h*0.4},
          {x: 0, y: -h*0.15, r: h*0.5},
          {x: w*0.25, y: h*0.05, r: h*0.45},
          {x: w*0.4, y: h*0.2, r: h*0.3},
          {x: -w*0.4, y: h*0.25, r: h*0.25}
        ];
        ctx.beginPath();
        bubbles.forEach(b => {
          ctx.moveTo(b.x + b.r, b.y);
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        });
        ctx.fill();

      } else if (e.type === 'warmth') {
        let r = 15 * (1 + Math.sin(globalTime * 8) * 0.1);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI*2);
        let wgrad = ctx.createRadialGradient(0,0,r*0.2,0,0,r);
        wgrad.addColorStop(0, '#fff');
        wgrad.addColorStop(0.5, 'rgba(255, 180, 40, 0.9)');
        wgrad.addColorStop(1, 'rgba(255, 180, 40, 0)');
        ctx.fillStyle = wgrad;
        ctx.fill();
      }
      ctx.restore();
    });

    if (state.mode === 'PLAYING' || state.mode === 'WIN') {
      let px = currentLaneX;
      let py = H * 0.8;
      let radius = 12 + (state.warmth / 100) * 8;
      
      ctx.beginPath();
      ctx.arc(px, py, radius*2.5, 0, Math.PI * 2);
      let pgrad = ctx.createRadialGradient(px, py, radius*0.5, px, py, radius*2.5);
      pgrad.addColorStop(0, 'rgba(255, 200, 50, 0.6)');
      pgrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
      ctx.fillStyle = pgrad;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }

    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
      ctx.fill();
    });

    ctx.restore(); // restore shake
  }

  let lastTime = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) { lastTime = now; return; }
    let dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = now;
    try {
      update(dt);
      draw();
    } catch(e) {
      console.error(e);
    }
  }

  resize();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
