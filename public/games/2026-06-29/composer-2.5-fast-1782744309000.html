<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Surfer — Karl's Lanes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #e8eaed;
    --text: #1a1f24;
    --muted: #5a6570;
    --panel: rgba(255,255,255,0.82);
    --panel-border: rgba(0,0,0,0.08);
    --accent: #d4882a;
    --accent-glow: rgba(212,136,42,0.45);
    --danger: #4a6278;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161a;
      --text: #e8ecf0;
      --muted: #8a96a3;
      --panel: rgba(22,28,34,0.88);
      --panel-border: rgba(255,255,255,0.08);
      --accent: #f0a030;
      --accent-glow: rgba(240,160,48,0.35);
      --danger: #6a8498;
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100dvw;
    height: 100dvh;
  }
  canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 16px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 2;
  }
  .hud-block { line-height: 1.35; }
  .hud-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .hud-value { font-size: 22px; font-weight: 600; }
  #combo-bar {
    position: absolute;
    top: max(72px, calc(env(safe-area-inset-top) + 56px));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    pointer-events: none;
    z-index: 2;
  }
  .combo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    opacity: 0.35;
    transition: opacity 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .combo-dot.on {
    opacity: 1;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    pointer-events: none;
    z-index: 3;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px 24px 22px;
    max-width: 340px;
    width: 100%;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  h1 {
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    line-height: 1.15;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .hint {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .score-final {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    margin: 8px 0 4px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 160px;
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #12161a;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  @media (prefers-color-scheme: dark) {
    button[data-smoke] { color: #12161a; }
  }
  #lane-hint {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
    z-index: 2;
    opacity: 0.7;
  }
  #cold-meter-wrap {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: max(44px, calc(env(safe-area-inset-bottom) + 24px));
    pointer-events: none;
    z-index: 2;
  }
  #cold-label {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  #cold-meter {
    height: 4px;
    background: rgba(128,144,160,0.25);
    border-radius: 2px;
    overflow: hidden;
  }
  #cold-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7a9ab0, #c44a3a);
    border-radius: 2px;
    transition: width 0.15s linear;
  }
  .golden-flash {
    animation: goldenPulse 0.6s ease-out;
  }
  @keyframes goldenPulse {
    0% { filter: brightness(1); }
    40% { filter: brightness(1.25) saturate(1.3); }
    100% { filter: brightness(1); }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hud-block">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="scoreEl">0</div>
    </div>
    <div class="hud-block" style="text-align:right">
      <div class="hud-label">Time</div>
      <div class="hud-value" id="timeEl">0s</div>
    </div>
  </div>
  <div id="combo-bar">
    <div class="combo-dot" id="cd0"></div>
    <div class="combo-dot" id="cd1"></div>
    <div class="combo-dot" id="cd2"></div>
  </div>
  <div id="cold-meter-wrap">
    <div id="cold-label">Cold layer</div>
    <div id="cold-meter"><div id="cold-fill"></div></div>
  </div>
  <div id="lane-hint">← swipe lanes →</div>
  <div id="overlay">
    <div class="panel" id="titlePanel">
      <h1>Fog Surfer</h1>
      <p class="subtitle">Ride Karl's currents above the bay.<br>Three lanes. One amber sun.</p>
      <p class="hint">Swipe or tap sides to switch lanes.<br>Catch warm updrafts. Chain three for golden hour.<br>Don't let the cold layer collapse.</p>
      <button type="button" data-smoke="start" id="btnStart">Ride the fog</button>
    </div>
    <div class="panel hidden" id="overPanel">
      <h1>Layer collapsed</h1>
      <p class="subtitle">The fog swallowed your line.</p>
      <div class="score-final" id="finalScore">0</div>
      <p class="hint" id="finalStats"></p>
      <button type="button" data-smoke="restart" id="btnRestart">Surf again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  if (!ctx) return;
  var wrap = document.getElementById('wrap');
  var overlay = document.getElementById('overlay');
  var titlePanel = document.getElementById('titlePanel');
  var overPanel = document.getElementById('overPanel');
  var scoreEl = document.getElementById('scoreEl');
  var timeEl = document.getElementById('timeEl');
  var finalScore = document.getElementById('finalScore');
  var finalStats = document.getElementById('finalStats');
  var coldFill = document.getElementById('cold-fill');
  var comboDots = [
    document.getElementById('cd0'),
    document.getElementById('cd1'),
    document.getElementById('cd2')
  ];
  var btnStart = document.getElementById('btnStart');
  var btnRestart = document.getElementById('btnRestart');

  var W = 360, H = 640;
  var dpr = 1;
  var dark = false;

  var state = 'title';
  var lane = 1;
  var score = 0;
  var timeAlive = 0;
  var cold = 0;
  var combo = 0;
  var goldenTimer = 0;
  var goldenMult = 1;
  var updraftsCaught = 0;
  var bestCombo = 0;
  var fogLevel = 0;
  var laneWidth = 1;
  var updraftWindow = 1;
  var lastSpawn = 0;
  var spawnInterval = 1.8;
  var touchStartX = 0;
  var touchStartY = 0;
  var laneSwitchAnim = 0;
  var shake = 0;
  var particles = [];
  var updrafts = [];
  var coldPatches = [];
  var fogParticles = [];
  var bridgeSilhouette = [];
  var audioCtx = null;

  var LANE_SPEEDS = [0.85, 1.0, 1.15];
  var LANE_NAMES = ['slow', 'steady', 'fast'];

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildBridge();
    initFogParticles();
  }

  function buildBridge() {
    bridgeSilhouette = [];
    var baseY = H * 0.72;
    for (var i = 0; i <= 20; i++) {
      bridgeSilhouette.push({
        x: (i / 20) * W,
        y: baseY + Math.sin(i * 0.7) * 8 - (i > 8 && i < 12 ? 40 : 0)
      });
    }
  }

  function initFogParticles() {
    fogParticles = [];
    for (var i = 0; i < 80; i++) {
      fogParticles.push(makeFogParticle(true));
    }
  }

  function makeFogParticle(randomY) {
    return {
      x: Math.random() * W,
      y: randomY ? Math.random() * H : -20,
      r: 20 + Math.random() * 60,
      vx: (Math.random() - 0.5) * 0.3,
      vy: 0.4 + Math.random() * 0.8,
      a: 0.04 + Math.random() * 0.08
    };
  }

  function laneX(l) {
    var margin = W * 0.08 * (1 + fogLevel * 0.08);
    var usable = W - margin * 2;
    var w = usable / 3 * laneWidth;
    var gap = (usable - w * 3) / 2;
    var totalW = w * 3 + gap * 2;
    var start = (W - totalW) / 2;
    return start + l * (w + gap) + w * 0.5;
  }

  function laneBounds(l) {
    var margin = W * 0.08 * (1 + fogLevel * 0.08);
    var usable = W - margin * 2;
    var w = usable / 3 * laneWidth;
    var gap = (usable - w * 3) / 2;
    var totalW = w * 3 + gap * 2;
    var start = (W - totalW) / 2;
    return { left: start + l * (w + gap), right: start + l * (w + gap) + w, cx: start + l * (w + gap) + w * 0.5 };
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, vol, type) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(vol || 0.08, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur + 0.05);
    } catch (e) {}
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  function spawnUpdraft() {
    var l = Math.floor(Math.random() * 3);
    updrafts.push({
      lane: l,
      y: -40,
      r: 28 * updraftWindow,
      life: 1,
      maxLife: (2.2 + Math.random() * 1.2) * updraftWindow,
      caught: false,
      pulse: Math.random() * Math.PI * 2
    });
  }

  function spawnColdPatch() {
    if (Math.random() > 0.55 + fogLevel * 0.1) return;
    var l = Math.floor(Math.random() * 3);
    coldPatches.push({
      lane: l,
      y: -30,
      h: 50 + Math.random() * 40,
      life: 1,
      maxLife: 3 + Math.random() * 2
    });
  }

  function burstParticles(x, y, color, n) {
    for (var i = 0; i < (n || 12); i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 1 + Math.random() * 4;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1,
        life: 1,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function switchLane(dir) {
    if (state !== 'play') return;
    var next = lane + dir;
    if (next < 0 || next > 2) return;
    lane = next;
    laneSwitchAnim = 1;
    playTone(180 + lane * 60, 0.08, 0.05, 'triangle');
    vibrate(8);
  }

  function catchUpdraft(u) {
    if (u.caught) return;
    u.caught = true;
    combo++;
    if (combo > bestCombo) bestCombo = combo;
    updraftsCaught++;
    var pts = Math.floor(50 * goldenMult * (1 + combo * 0.15));
    score += pts;
    cold = Math.max(0, cold - 6 - fogLevel);
    burstParticles(laneX(u.lane), H * 0.62, '#f0a030', 16);
    playTone(440 + combo * 80, 0.15, 0.1, 'sine');
    vibrate(15);
    updateComboUI();
    if (combo >= 3) {
      goldenTimer = 5;
      goldenMult = 2.5;
      combo = 0;
      updateComboUI();
      wrap.classList.add('golden-flash');
      setTimeout(function () { wrap.classList.remove('golden-flash'); }, 600);
      playTone(660, 0.3, 0.12, 'sine');
      playTone(880, 0.4, 0.08, 'sine');
      vibrate([20, 30, 20]);
      cold = Math.max(0, cold - 25);
    }
  }

  function updateComboUI() {
    for (var i = 0; i < 3; i++) {
      comboDots[i].classList.toggle('on', i < combo);
    }
  }

  function updateHUD() {
    scoreEl.textContent = String(Math.floor(score));
    timeEl.textContent = Math.floor(timeAlive) + 's';
    coldFill.style.width = Math.min(100, cold) + '%';
  }

  function resetGame() {
    lane = 1;
    score = 0;
    timeAlive = 0;
    cold = 0;
    combo = 0;
    goldenTimer = 0;
    goldenMult = 1;
    updraftsCaught = 0;
    bestCombo = 0;
    fogLevel = 0;
    laneWidth = 1;
    updraftWindow = 1;
    lastSpawn = 0;
    spawnInterval = 1.8;
    laneSwitchAnim = 0;
    shake = 0;
    particles = [];
    updrafts = [];
    coldPatches = [];
    updateComboUI();
    updateHUD();
  }

  function startGame() {
    initAudio();
    resetGame();
    state = 'play';
    titlePanel.classList.add('hidden');
    overPanel.classList.add('hidden');
    overlay.classList.add('hidden');
    playTone(220, 0.2, 0.06, 'sine');
  }

  function endGame() {
    state = 'over';
    overlay.classList.remove('hidden');
    titlePanel.classList.add('hidden');
    overPanel.classList.remove('hidden');
    finalScore.textContent = String(Math.floor(score));
    finalStats.textContent = Math.floor(timeAlive) + 's aloft · ' + updraftsCaught + ' updrafts · best chain ' + bestCombo;
    playTone(110, 0.5, 0.08, 'sawtooth');
    vibrate(40);
  }

  function update(dt) {
    if (state !== 'play') return;

    timeAlive += dt;
    var elapsed = timeAlive;

    if (elapsed > 0 && Math.floor(elapsed) % 10 === 0) {
      var tier = Math.floor(elapsed / 10);
      if (tier > fogLevel) {
        fogLevel = tier;
        laneWidth = Math.max(0.65, 1 - fogLevel * 0.06);
        updraftWindow = Math.max(0.45, 1 - fogLevel * 0.08);
        spawnInterval = Math.max(0.9, 1.8 - fogLevel * 0.12);
        shake = 0.3;
        playTone(90, 0.25, 0.06, 'sawtooth');
      }
    }

    if (goldenTimer > 0) {
      goldenTimer -= dt;
      if (goldenTimer <= 0) goldenMult = 1;
    }

    var scrollBase = 120 + elapsed * 8;
    var scroll = scrollBase * LANE_SPEEDS[lane];

    lastSpawn += dt;
    if (lastSpawn >= spawnInterval) {
      lastSpawn = 0;
      spawnUpdraft();
      if (Math.random() < 0.35 + fogLevel * 0.05) spawnColdPatch();
    }

    var catchY = H * 0.62;
    var catchR = 36;

    for (var i = updrafts.length - 1; i >= 0; i--) {
      var u = updrafts[i];
      u.y += scroll * dt * 0.55;
      u.life -= dt / u.maxLife;
      u.pulse += dt * 4;
      if (!u.caught && u.lane === lane) {
        var dx = laneX(u.lane) - laneX(lane);
        var dy = u.y - catchY;
        if (Math.abs(dx) < 20 && Math.abs(dy) < catchR && u.life > 0.2) {
          catchUpdraft(u);
        }
      }
      if (u.life <= 0 || u.y > H + 60) {
        if (!u.caught && u.life <= 0) {
          cold += 8 + fogLevel * 2;
          combo = 0;
          updateComboUI();
        }
        updrafts.splice(i, 1);
      }
    }

    for (var j = coldPatches.length - 1; j >= 0; j--) {
      var cp = coldPatches[j];
      cp.y += scroll * dt * 0.5;
      cp.life -= dt / cp.maxLife;
      if (cp.lane === lane && cp.y > catchY - 30 && cp.y < catchY + 30) {
        cold += 18 * dt;
        combo = 0;
        updateComboUI();
      }
      if (cp.life <= 0 || cp.y > H + 60) coldPatches.splice(j, 1);
    }

    cold += (1.1 + fogLevel * 0.45) * dt;
    cold = Math.min(100, Math.max(0, cold));

    if (cold >= 100) endGame();

    for (var k = fogParticles.length - 1; k >= 0; k--) {
      var fp = fogParticles[k];
      fp.x += fp.vx + Math.sin(timeAlive + k) * 0.1;
      fp.y += fp.vy * (1 + fogLevel * 0.15);
      if (fp.y > H + fp.r) fogParticles[k] = makeFogParticle(false);
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.08;
      pt.life -= dt * 1.5;
      if (pt.life <= 0) particles.splice(p, 1);
    }

    if (laneSwitchAnim > 0) laneSwitchAnim = Math.max(0, laneSwitchAnim - dt * 4);
    if (shake > 0) shake = Math.max(0, shake - dt * 2);

    score += dt * 12 * goldenMult;
    updateHUD();
  }

  function drawBackground() {
    dark = prefersDark();
    var skyTop = dark ? '#0e1218' : '#c8cdd4';
    var skyBot = dark ? '#1a222c' : '#dfe4ea';
    if (goldenTimer > 0) {
      skyTop = dark ? '#1a1408' : '#d4c4a8';
      skyBot = dark ? '#2a2010' : '#e8d4b0';
    }

    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, skyTop);
    grd.addColorStop(1, skyBot);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    var sunX = W * 0.78;
    var sunY = H * 0.18;
    var sunR = 42 + (goldenTimer > 0 ? 8 : 0);
    var sunGrd = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 3);
    var sunCore = goldenTimer > 0 ? 'rgba(255,190,60,0.95)' : 'rgba(240,160,48,0.75)';
    sunGrd.addColorStop(0, sunCore);
    sunGrd.addColorStop(0.25, 'rgba(240,160,48,0.35)');
    sunGrd.addColorStop(0.6, 'rgba(200,170,120,0.08)');
    sunGrd.addColorStop(1, 'rgba(200,170,120,0)');
    ctx.fillStyle = sunGrd;
    ctx.fillRect(0, 0, W, H * 0.5);

    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    ctx.fillStyle = goldenTimer > 0 ? '#ffc040' : '#f0a030';
    ctx.fill();

    ctx.fillStyle = dark ? 'rgba(30,40,50,0.5)' : 'rgba(80,90,100,0.25)';
    ctx.beginPath();
    if (bridgeSilhouette.length) {
      ctx.moveTo(0, H);
      for (var i = 0; i < bridgeSilhouette.length; i++) {
        ctx.lineTo(bridgeSilhouette[i].x, bridgeSilhouette[i].y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawLanes() {
    for (var l = 0; l < 3; l++) {
      var b = laneBounds(l);
      var isActive = l === lane;
      ctx.fillStyle = isActive
        ? (goldenTimer > 0 ? 'rgba(240,160,48,0.12)' : (dark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.03)'))
        : 'rgba(128,144,160,0.03)';
      ctx.fillRect(b.left, H * 0.35, b.right - b.left, H * 0.55);

      if (isActive) {
        ctx.strokeStyle = goldenTimer > 0 ? 'rgba(240,160,48,0.5)' : (dark ? 'rgba(200,210,220,0.2)' : 'rgba(80,90,100,0.15)');
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.left, H * 0.35, b.right - b.left, H * 0.55);
      }

      ctx.fillStyle = dark ? 'rgba(140,155,170,0.5)' : 'rgba(90,100,110,0.45)';
      ctx.font = '9px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(LANE_NAMES[l], b.cx, H * 0.38);
    }
  }

  function drawUpdrafts() {
    for (var i = 0; i < updrafts.length; i++) {
      var u = updrafts[i];
      if (u.caught) continue;
      var x = laneX(u.lane);
      var pulse = 1 + Math.sin(u.pulse) * 0.12;
      var r = u.r * pulse * (0.5 + u.life * 0.5);
      var alpha = u.life * 0.85;
      var grd = ctx.createRadialGradient(x, u.y, 0, x, u.y, r);
      grd.addColorStop(0, 'rgba(255,200,80,' + (alpha * 0.9) + ')');
      grd.addColorStop(0.5, 'rgba(240,160,48,' + (alpha * 0.4) + ')');
      grd.addColorStop(1, 'rgba(240,160,48,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(x, u.y, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,220,120,' + (alpha * 0.6) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, u.y + r * 0.3);
      ctx.lineTo(x, u.y - r * 0.8);
      ctx.stroke();
    }
  }

  function drawColdPatches() {
    for (var i = 0; i < coldPatches.length; i++) {
      var cp = coldPatches[i];
      var b = laneBounds(cp.lane);
      var alpha = cp.life * 0.35;
      ctx.fillStyle = 'rgba(100,140,170,' + alpha + ')';
      ctx.fillRect(b.left + 4, cp.y, b.right - b.left - 8, cp.h);
    }
  }

  function drawFog() {
    var fogAlpha = 0.06 + fogLevel * 0.025;
    if (goldenTimer > 0) fogAlpha *= 0.5;
    for (var i = 0; i < fogParticles.length; i++) {
      var fp = fogParticles[i];
      ctx.fillStyle = dark
        ? 'rgba(180,195,210,' + (fp.a * fogAlpha * 8) + ')'
        : 'rgba(255,255,255,' + (fp.a * fogAlpha * 10) + ')';
      ctx.beginPath();
      ctx.arc(fp.x, fp.y, fp.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlayer() {
    var px = laneX(lane);
    var py = H * 0.62;
    var bob = Math.sin(timeAlive * 5) * 3;
    if (laneSwitchAnim > 0) bob += laneSwitchAnim * 8;

    ctx.save();
    ctx.translate(px + (shake > 0 ? (Math.random() - 0.5) * shake * 8 : 0), py + bob);

    if (goldenTimer > 0) {
      ctx.shadowColor = 'rgba(240,160,48,0.8)';
      ctx.shadowBlur = 20;
    }

    ctx.fillStyle = dark ? '#e8ecf0' : '#1a1f24';
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = goldenTimer > 0 ? '#ffc040' : (dark ? '#f0a030' : '#d4882a');
    ctx.beginPath();
    ctx.moveTo(-14, -2);
    ctx.lineTo(0, -16);
    ctx.lineTo(14, -2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = dark ? '#e8ecf0' : '#1a1f24';
    ctx.beginPath();
    ctx.arc(0, -8, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGoldenBanner() {
    if (goldenTimer <= 0) return;
    ctx.fillStyle = 'rgba(240,160,48,0.85)';
    ctx.font = 'bold 11px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GOLDEN HOUR ×' + goldenMult.toFixed(1), W / 2, H * 0.32);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawLanes();
    drawColdPatches();
    drawUpdrafts();
    drawFog();
    drawPlayer();
    drawParticles();
    drawGoldenBanner();

    if (state === 'title') {
      ctx.fillStyle = dark ? 'rgba(14,18,24,0.3)' : 'rgba(255,255,255,0.2)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  var lastT = 0;
  function loop(t) {
    if (!lastT) lastT = t;
    var dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function onTouchStart(e) {
    if (e.touches && e.touches[0]) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
    e.preventDefault();
  }

  function onTouchEnd(e) {
    if (state !== 'play') { e.preventDefault(); return; }
    var dx = 0, dy = 0;
    if (e.changedTouches && e.changedTouches[0]) {
      dx = e.changedTouches[0].clientX - touchStartX;
      dy = e.changedTouches[0].clientY - touchStartY;
    }
    if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy)) {
      switchLane(dx > 0 ? 1 : -1);
    } else if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
      var tx = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : W / 2;
      switchLane(tx > W / 2 ? 1 : -1);
    }
    e.preventDefault();
  }

  function onKey(e) {
    if (state !== 'play') return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') switchLane(-1);
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') switchLane(1);
  }

  btnStart.addEventListener('click', function (e) {
    e.stopPropagation();
    startGame();
  });

  btnRestart.addEventListener('click', function (e) {
    e.stopPropagation();
    startGame();
  });

  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('mousedown', function (e) {
    touchStartX = e.clientX;
    touchStartY = e.clientY;
  });
  canvas.addEventListener('mouseup', function (e) {
    if (state !== 'play') return;
    var dx = e.clientX - touchStartX;
    var dy = e.clientY - touchStartY;
    if (Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy)) {
      switchLane(dx > 0 ? 1 : -1);
    } else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      switchLane(e.clientX > W / 2 ? 1 : -1);
    }
  });

  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);

  try {
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        dark = prefersDark();
      });
    }
  } catch (e) {}

  resize();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
