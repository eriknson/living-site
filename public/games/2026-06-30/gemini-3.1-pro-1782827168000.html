<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yacht Rock Sunset</title>
  <style>
    :root {
      --bg-color: #f4e8d8;
      --text-color: #2c241b;
      --accent: #d96c4a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1614;
        --text-color: #e8dcc8;
        --accent: #c45533;
      }
    }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: var(--bg-color); color: var(--text-color);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      touch-action: none; user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block; width: 100dvw; height: 100dvh;
    }
    #uiLayer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    .screen h1 {
      font-size: 3rem; margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      color: #f4e8d8; pointer-events: none; text-align: center;
    }
    .screen p {
      font-size: 1.2rem; margin-bottom: 2rem;
      color: #e8dcc8; opacity: 0.9; pointer-events: none; text-align: center;
      max-width: 80%;
    }
    button {
      pointer-events: auto;
      font-family: inherit; font-size: 1.5rem; padding: 1rem 2.5rem;
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px; cursor: pointer;
      text-transform: uppercase; font-weight: bold;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:active {
      transform: translateY(4px); box-shadow: none;
    }
    #hud {
      position: absolute; top: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between;
      font-size: 1.5rem; font-weight: bold;
      pointer-events: none; color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    #strikesDisplay { color: #e74c3c; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="uiLayer">
    <div id="startScreen" class="screen">
      <h1>YACHT ROCK</h1>
      <p>Flick records to their matching silhouettes before they slide off the deck.</p>
      <button data-smoke="start" id="startBtn">PLAY</button>
    </div>
    <div id="gameOverScreen" class="screen" style="display: none;">
      <h1>GAME OVER</h1>
      <p>Score: <span id="finalScore">0</span></p>
      <button data-smoke="restart" id="restartBtn">REPLAY</button>
    </div>
    <div id="hud" style="display: none;">
      <div id="scoreDisplay">0</div>
      <div id="strikesDisplay">♥♥♥</div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let isDark = false;
    let state = 'START';
    let score = 0;
    let strikes = 0;
    let records = [];
    let targets = [
      {x: 0, y: 0, type: 0, radius: 0},
      {x: 0, y: 0, type: 1, radius: 0},
      {x: 0, y: 0, type: 2, radius: 0}
    ];
    let particles = [];
    let gameTime = 0;
    let spawnTimer = 0;
    let spawnInterval = 2500;
    let wind = 0;
    let gravity = 0;
    let slowMoTimer = 0;
    let nextSwapTime = 0;
    let lastTime = 0;
    
    const TYPE_COLORS = ['#d96c4a', '#4a90e2', '#c0392b'];
    
    let audioCtx = null;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    
    function playSound(type) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        
        if (type === 'flick') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'match') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.setValueAtTime(600, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'perfect') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554, now + 0.1);
          osc.frequency.setValueAtTime(659, now + 0.2);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.linearRampToValueAtTime(0, now + 1.0);
          osc.start(now); osc.stop(now + 1.0);
        } else if (type === 'strike') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        }
      } catch (e) {}
    }
    
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      
      targets[0].x = width * 0.2;
      targets[1].x = width * 0.5;
      targets[2].x = width * 0.8;
      for (let t of targets) {
        t.y = height * 0.35;
        t.radius = Math.min(width * 0.12, 60);
      }
      draw(slowMoTimer > 0);
    }
    window.addEventListener('resize', resize);
    
    function initGame() {
      score = 0; strikes = 0; records = []; particles = [];
      gameTime = 0; spawnTimer = 1000; spawnInterval = 2500;
      slowMoTimer = 0; nextSwapTime = 10000;
      updateHUD();
      state = 'PLAYING';
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }
    
    function spawnRecord() {
      records.push({
        x: width * 0.5, y: height * 0.85,
        vx: 0, vy: 0,
        radius: Math.min(width * 0.1, 50),
        type: Math.floor(Math.random() * 3),
        angle: 0, scale: 0,
        isDragging: false, path: [], settled: false,
        state: 'spawning', stateTimer: 0
      });
    }
    
    function strike() {
      strikes++;
      updateHUD();
      if (strikes >= 3) gameOver();
    }
    
    function gameOver() {
      state = 'GAMEOVER';
      document.getElementById('gameOverScreen').style.display = 'flex';
      document.getElementById('finalScore').innerText = score;
      document.getElementById('hud').style.display = 'none';
    }
    
    function updateHUD() {
      document.getElementById('scoreDisplay').innerText = score;
      let hearts = '';
      for (let i = 0; i < 3; i++) hearts += i < (3 - strikes) ? '♥' : '♡';
      document.getElementById('strikesDisplay').innerText = hearts;
    }
    
    function checkLanding(r) {
      let landedTarget = null;
      let minDistance = Infinity;
      for (let t of targets) {
        let d = Math.hypot(r.x - t.x, r.y - t.y);
        if (d < t.radius + r.radius) {
          if (d < minDistance) {
            minDistance = d;
            landedTarget = t;
          }
        }
      }
      
      if (landedTarget) {
        if (landedTarget.type === r.type) {
          score++; updateHUD();
          if (minDistance < landedTarget.radius * 0.5) {
            slowMoTimer = 2000;
            createParticles(r.x, r.y, '#f1c40f', 30);
            playSound('perfect');
            try { if (navigator.vibrate) navigator.vibrate([50, 50, 50]); } catch(e){}
          } else {
            createParticles(r.x, r.y, '#ffffff', 15);
            playSound('match');
            try { if (navigator.vibrate) navigator.vibrate(50); } catch(e){}
          }
          r.state = 'success';
        } else {
          strike();
          createParticles(r.x, r.y, '#e74c3c', 20);
          playSound('strike');
          try { if (navigator.vibrate) navigator.vibrate([100]); } catch(e){}
          r.state = 'fail';
        }
      } else {
        strike();
        createParticles(r.x, r.y, '#e74c3c', 20);
        playSound('strike');
        try { if (navigator.vibrate) navigator.vibrate([100]); } catch(e){}
        r.state = 'fail';
      }
    }
    
    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 5 + 2;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          color: color, life: 500 + Math.random() * 500, maxLife: 1000
        });
      }
    }
    
    let activeTouchId = null;
    let activeRecord = null;
    
    function handleTouchStart(touches) {
      if (state !== 'PLAYING') return;
      for (let i = 0; i < touches.length; i++) {
        let t = touches[i];
        if (activeTouchId === null) {
          for (let r of records) {
            if (r.state === 'active' || r.state === 'spawning') {
              let d = Math.hypot(t.clientX - r.x, t.clientY - r.y);
              if (d < r.radius * 2) {
                activeTouchId = t.identifier;
                activeRecord = r;
                r.isDragging = true; r.state = 'active';
                r.path = [{x: t.clientX, y: t.clientY, t: performance.now()}];
                break;
              }
            }
          }
        }
      }
    }
    
    function handleTouchMove(touches) {
      if (state !== 'PLAYING' || !activeRecord) return;
      for (let i = 0; i < touches.length; i++) {
        let t = touches[i];
        if (t.identifier === activeTouchId) {
          activeRecord.x = t.clientX;
          activeRecord.y = t.clientY;
          activeRecord.path.push({x: t.clientX, y: t.clientY, t: performance.now()});
          if (activeRecord.path.length > 10) activeRecord.path.shift();
          if (activeRecord.y < height * 0.7) releaseRecord();
        }
      }
    }
    
    function handleTouchEnd(touches) {
      if (state !== 'PLAYING' || !activeRecord) return;
      for (let i = 0; i < touches.length; i++) {
        if (touches[i].identifier === activeTouchId) releaseRecord();
      }
    }
    
    function releaseRecord() {
      if (!activeRecord) return;
      let path = activeRecord.path;
      if (path.length >= 2) {
        let last = path[path.length - 1];
        let first = path[0];
        let dt = last.t - first.t;
        if (dt > 0) {
          activeRecord.vx = ((last.x - first.x) / dt) * 16;
          activeRecord.vy = ((last.y - first.y) / dt) * 16;
        }
      }
      let speed = Math.hypot(activeRecord.vx, activeRecord.vy);
      if (speed > 40) {
        activeRecord.vx = (activeRecord.vx / speed) * 40;
        activeRecord.vy = (activeRecord.vy / speed) * 40;
      }
      if (speed > 5) playSound('flick');
      
      activeRecord.isDragging = false;
      activeTouchId = null;
      activeRecord = null;
    }
    
    let isMouseDown = false;
    canvas.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      handleTouchStart([{identifier: 'mouse', clientX: e.clientX, clientY: e.clientY}]);
    });
    canvas.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      handleTouchMove([{identifier: 'mouse', clientX: e.clientX, clientY: e.clientY}]);
    });
    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;
      handleTouchEnd([{identifier: 'mouse'}]);
    });
    
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouchStart(e.changedTouches); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouchMove(e.changedTouches); }, {passive: false});
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); handleTouchEnd(e.changedTouches); }, {passive: false});
    canvas.addEventListener('touchcancel', (e) => { e.preventDefault(); handleTouchEnd(e.changedTouches); }, {passive: false});
    
    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      if (audioCtx && audioCtx.state === 'suspended') {
        try { audioCtx.resume(); } catch(e){}
      }
      initGame();
    });
    
    document.getElementById('restartBtn').addEventListener('click', () => {
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      initGame();
    });
    
    function loop(now) {
      if (state !== 'PLAYING') return;
      requestAnimationFrame(loop);
      
      let dt = now - lastTime;
      lastTime = now;
      if (dt > 100) dt = 16;
      
      let timeScale = dt / 16.66;
      let isSlowMo = slowMoTimer > 0;
      if (isSlowMo) {
        timeScale *= 0.3;
        slowMoTimer -= dt;
      }
      
      gameTime += dt;
      spawnInterval = Math.max(600, 2500 - gameTime * 0.03);
      gravity = 0.02 + gameTime * 0.000002;
      wind = Math.sin(gameTime * 0.001) * (gameTime * 0.00002);
      
      if (gameTime > nextSwapTime) {
        let i = Math.floor(Math.random() * 3);
        let j = (i + 1 + Math.floor(Math.random() * 2)) % 3;
        let temp = targets[i].type;
        targets[i].type = targets[j].type;
        targets[j].type = temp;
        createParticles(targets[i].x, targets[i].y, '#ffffff', 20);
        createParticles(targets[j].x, targets[j].y, '#ffffff', 20);
        nextSwapTime = gameTime + Math.max(5000, 15000 - gameTime * 0.1);
      }
      
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnRecord();
        spawnTimer = spawnInterval;
      }
      
      for (let i = records.length - 1; i >= 0; i--) {
        let r = records[i];
        
        if (r.state === 'spawning') {
          r.scale += 0.05 * timeScale;
          if (r.scale >= 1) { r.scale = 1; r.state = 'active'; }
        }
        
        if (r.isDragging) {
          // Handled by input events
        } else if (r.state === 'active') {
          r.vx += wind * timeScale;
          r.vy += gravity * timeScale;
          r.x += r.vx * timeScale;
          r.y += r.vy * timeScale;
          
          r.vx *= Math.pow(0.95, timeScale);
          r.vy *= Math.pow(0.95, timeScale);
          
          let speed = Math.hypot(r.vx, r.vy);
          r.angle += speed * (0.02 + gameTime * 0.0000005) * timeScale;
          
          if (r.y < height * 0.25 - r.radius) {
            if (r.state !== 'fail') {
              strike();
              createParticles(r.x, r.y, '#3a5a6b', 20);
              playSound('strike');
              r.state = 'fail';
            }
          } else if (r.y > height + r.radius || r.x < -r.radius || r.x > width + r.radius) {
            if (r.state !== 'fail') {
              strike();
              playSound('strike');
              r.state = 'fail';
            }
          } else if (speed < 0.5 && r.y < height * 0.8 && !r.settled) {
            r.settled = true;
            checkLanding(r);
          }
        } else if (r.state === 'success' || r.state === 'fail') {
          r.stateTimer += dt;
          r.scale -= 0.05 * timeScale;
          if (r.scale <= 0) records.splice(i, 1);
        }
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * timeScale;
        p.y += p.vy * timeScale;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      
      draw(isSlowMo);
    }
    
    function draw(isSlowMo) {
      isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      let skyTop = isDark ? '#1a2530' : '#8c9fb1';
      let skyBot = isDark ? (isSlowMo ? '#b36b22' : '#6b3e23') : (isSlowMo ? '#ffcf70' : '#d9a05b');
      let ocean = isDark ? '#111a22' : '#3a5a6b';
      let deckTop = isDark ? '#3d2616' : '#c28b5e';
      let deckBot = isDark ? '#1a1009' : '#5e3a23';
      
      let sky = ctx.createLinearGradient(0, 0, 0, height * 0.25);
      sky.addColorStop(0, skyTop);
      sky.addColorStop(1, skyBot);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height * 0.25);
      
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.beginPath();
      ctx.arc(width * 0.5, height * 0.25, isSlowMo ? 200 : 120, 0, Math.PI * 2);
      let sunGrad = ctx.createRadialGradient(width * 0.5, height * 0.25, 0, width * 0.5, height * 0.25, isSlowMo ? 200 : 120);
      sunGrad.addColorStop(0, isSlowMo ? 'rgba(255, 230, 150, 0.8)' : 'rgba(255, 200, 100, 0.4)');
      sunGrad.addColorStop(1, 'rgba(255, 200, 100, 0)');
      ctx.fillStyle = sunGrad;
      ctx.fill();
      ctx.restore();
      
      ctx.fillStyle = ocean;
      ctx.fillRect(0, height * 0.25, width, height * 0.05);
      
      let deck = ctx.createLinearGradient(0, height * 0.3, 0, height);
      deck.addColorStop(0, deckTop);
      deck.addColorStop(1, deckBot);
      ctx.fillStyle = deck;
      ctx.fillRect(0, height * 0.3, width, height * 0.7);
      
      ctx.strokeStyle = isDark ? 'rgba(0,0,0,0.4)' : 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 2;
      for (let i = -10; i <= 10; i++) {
        ctx.beginPath();
        ctx.moveTo(width * 0.5 + i * 30, height * 0.3);
        ctx.lineTo(width * 0.5 + i * 250, height);
        ctx.stroke();
      }
      
      for (let t of targets) drawTarget(t);
      
      let sortedRecords = [...records].sort((a, b) => a.y - b.y);
      for (let r of sortedRecords) drawRecord(r);
      
      for (let p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      
      if (Math.abs(wind) > 0.02) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '14px monospace';
        ctx.textAlign = 'center';
        let arrows = wind > 0 ? '>>>' : '<<<';
        ctx.fillText(`WIND ${arrows}`, width * 0.5, height * 0.45);
      }
      
      if (isSlowMo) {
        ctx.fillStyle = 'rgba(217, 160, 91, 0.15)';
        ctx.fillRect(0, 0, width, height);
        let grad = ctx.createRadialGradient(width*0.5, height*0.5, height*0.3, width*0.5, height*0.5, height*0.9);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.4)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
      }
    }
    
    function drawTarget(t) {
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.beginPath();
      ctx.arc(0, 0, t.radius, 0, Math.PI * 2);
      ctx.fillStyle = isDark ? 'rgba(0,0,0,0.4)' : 'rgba(0,0,0,0.15)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = TYPE_COLORS[t.type];
      drawShape(t.type, 0, 0, t.radius * 0.4);
      ctx.restore();
    }
    
    function drawShape(type, x, y, size) {
      ctx.beginPath();
      if (type === 0) {
        ctx.arc(x, y, size, 0, Math.PI * 2);
      } else if (type === 1) {
        ctx.rect(x - size, y - size, size * 2, size * 2);
      } else if (type === 2) {
        ctx.moveTo(x, y - size);
        ctx.lineTo(x + size, y + size);
        ctx.lineTo(x - size, y + size);
        ctx.closePath();
      }
      ctx.fill();
    }
    
    function drawRecord(r) {
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.scale(r.scale, r.scale);
      ctx.rotate(r.angle);
      
      ctx.beginPath();
      ctx.arc(5, 5, r.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fill();
      
      ctx.beginPath();
      ctx.arc(0, 0, r.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#1a1a1a';
      ctx.fill();
      
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 1;
      for (let i = 1; i <= 3; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, r.radius * (0.3 + i * 0.2), 0, Math.PI * 2);
        ctx.stroke();
      }
      
      ctx.beginPath();
      ctx.arc(0, 0, r.radius * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = TYPE_COLORS[r.type];
      ctx.fill();
      
      ctx.beginPath();
      ctx.arc(0, 0, r.radius * 0.05, 0, Math.PI * 2);
      ctx.fillStyle = isDark ? '#1a1009' : '#c28b5e';
      ctx.fill();
      
      ctx.beginPath();
      ctx.arc(0, 0, r.radius, Math.PI * 1.25, Math.PI * 1.75);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 4;
      ctx.stroke();
      
      ctx.restore();
    }
    
    resize();
  </script>
</body>
</html>
