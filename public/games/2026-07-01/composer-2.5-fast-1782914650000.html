<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Loop — Bay Sunrise</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#c8d8e8;--bg1:#8aa8c4;--bg2:#5a7a9a;
  --fog:rgba(255,255,255,.45);--text:#1a2a3a;--muted:#4a6070;
  --neon:#00e5cc;--neon2:#ff6b4a;--ghost:#8899aa;
  --panel:rgba(255,255,255,.72);--panel-border:rgba(255,255,255,.5);
  --btn-bg:#1a3048;--btn-text:#e8f4ff;
  --hit:#ffe066;--miss:#ff4466;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg0:#0a1420;--bg1:#122840;--bg2:#1a3860;
    --fog:rgba(180,210,240,.08);--text:#d8e8f8;--muted:#7a9ab8;
    --neon:#00ffcc;--neon2:#ff7755;--ghost:#4a6078;
    --panel:rgba(10,20,35,.85);--panel-border:rgba(0,229,204,.25);
    --btn-bg:#00c4aa;--btn-text:#041018;
  }
}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  background:var(--bg0);color:var(--text);touch-action:manipulation}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{flex:1;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hud-val{font-size:18px;font-weight:600;color:var(--neon);text-shadow:0 0 12px rgba(0,229,204,.4)}
#barDots{display:flex;gap:5px;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--neon);opacity:.3;transition:all .25s}
.dot.done{background:var(--neon);opacity:1;box-shadow:0 0 8px var(--neon)}
.dot.current{opacity:1;transform:scale(1.3)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:10;pointer-events:none;transition:opacity .35s}
#overlay.hidden{opacity:0;visibility:hidden}
.panel{text-align:center;padding:28px 24px;max-width:340px;width:calc(100% - 48px);
  background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 32px rgba(0,0,0,.15)}
.panel h1{font-size:22px;letter-spacing:.06em;margin-bottom:6px;line-height:1.2}
.panel .sub{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:18px;line-height:1.5}
.panel p{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.btn{display:inline-block;min-width:160px;min-height:48px;padding:12px 28px;
  font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  border:none;border-radius:10px;cursor:pointer;background:var(--btn-bg);color:var(--btn-text);
  pointer-events:auto;transition:transform .12s,box-shadow .12s;
  box-shadow:0 4px 16px rgba(0,0,0,.2)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
#scoreFlash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:28px;font-weight:700;color:var(--hit);opacity:0;pointer-events:none;z-index:5;
  text-shadow:0 0 20px var(--hit);transition:opacity .15s}
#scoreFlash.show{opacity:1}
#tapZone{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);pointer-events:none;opacity:.6;z-index:2}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span class="hud-val" id="scoreVal">0</span>
    </div>
    <div class="hud-block" style="align-items:center">
      <span class="hud-label">Loop</span>
      <div id="barDots"></div>
    </div>
    <div class="hud-block" style="align-items:flex-end">
      <span class="hud-label">BPM</span>
      <span class="hud-val" id="bpmVal">76</span>
    </div>
  </div>
  <div id="scoreFlash"></div>
  <div id="tapZone">Tap anywhere · Space key</div>
  <div id="overlay">
    <div class="panel" id="titlePanel">
      <h1>STUTTER LOOP</h1>
      <div class="sub">Fog bay · sunrise mix</div>
      <p>Tap beat slices as they hit the top marker. Build an 8-bar loop before the track skips. Ghost notes appear as BPM climbs — ignore them.</p>
      <button class="btn" data-smoke="start" id="startBtn">Start Mix</button>
    </div>
    <div class="panel" id="endPanel" style="display:none">
      <h1 id="endTitle">TRACK SKIPPED</h1>
      <div class="sub" id="endSub">Loop incomplete</div>
      <p id="endMsg">You missed the beat.</p>
      <div style="margin-bottom:16px"><span class="hud-label">Final Score</span><br><span class="hud-val" id="finalScore">0</span></div>
      <button class="btn" data-smoke="restart" id="restartBtn">Drop Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var overlay = document.getElementById('overlay');
var titlePanel = document.getElementById('titlePanel');
var endPanel = document.getElementById('endPanel');
var scoreVal = document.getElementById('scoreVal');
var bpmVal = document.getElementById('bpmVal');
var barDots = document.getElementById('barDots');
var scoreFlash = document.getElementById('scoreFlash');
var finalScore = document.getElementById('finalScore');
var endTitle = document.getElementById('endTitle');
var endSub = document.getElementById('endSub');
var endMsg = document.getElementById('endMsg');

var W = 0, H = 0, cx = 0, cy = 0, ringR = 120;
var state = 'title';
var score = 0, currentBar = 0, bpm = 76;
var barStartTime = 0, lastFrame = 0, sunrise = 0;
var notes = [];
var particles = [];
var wavePhase = 0;
var hitFlash = 0, missFlash = 0, shakeT = 0;
var loopLayers = [];
var audioCtx = null;
var masterGain = null;
var loopTimer = null;
var darkMode = false;

var TOTAL_BARS = 8;
var BEATS_PER_BAR = 4;
var PERFECT_MS = 70;
var GOOD_MS = 140;
var LOOKAHEAD = 1.1;

var STEMS = ['kick','hat','snare','bass','clap','synth','perc','drop'];

function initDots(){
  barDots.innerHTML = '';
  for(var i=0;i<TOTAL_BARS;i++){
    var d = document.createElement('span');
    d.className = 'dot' + (i===0?' current':'');
    barDots.appendChild(d);
  }
}
initDots();

function resize(){
  W = canvas.width = Math.floor(window.innerWidth * (window.devicePixelRatio||1));
  H = canvas.height = Math.floor(window.innerHeight * (window.devicePixelRatio||1));
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  cx = W/2; cy = H/2 - H*0.04;
  ringR = Math.min(W,H) * 0.28;
}
resize();
window.addEventListener('resize', resize);

darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
    darkMode = e.matches;
  });
}

function initAudio(){
  if(audioCtx) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(audioCtx.destination);
  }catch(e){}
}

function playKick(t){
  if(!audioCtx||!masterGain) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(40, t+0.08);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+0.3);
}

function playHat(t){
  if(!audioCtx||!masterGain) return;
  var buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*0.04), audioCtx.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,2);
  var src = audioCtx.createBufferSource();
  src.buffer = buf;
  var g = audioCtx.createGain();
  var f = audioCtx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 7000;
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.04);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t+0.05);
}

function playSnare(t){
  if(!audioCtx||!masterGain) return;
  var buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*0.12), audioCtx.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
  var src = audioCtx.createBufferSource();
  src.buffer = buf;
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.12);
  var o = audioCtx.createOscillator();
  var og = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.value = 180;
  og.gain.setValueAtTime(0.3, t);
  og.gain.exponentialRampToValueAtTime(0.001, t+0.06);
  src.connect(g); g.connect(masterGain);
  o.connect(og); og.connect(masterGain);
  src.start(t); src.stop(t+0.13);
  o.start(t); o.stop(t+0.07);
}

function playBass(t, freq){
  if(!audioCtx||!masterGain) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.value = freq||55;
  var f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 400;
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.2);
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+0.25);
}

function playClap(t){
  if(!audioCtx||!masterGain) return;
  for(var k=0;k<3;k++){
    var tt = t + k*0.012;
    var buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*0.06), audioCtx.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,2);
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.25, tt);
    g.gain.exponentialRampToValueAtTime(0.001, tt+0.06);
    src.connect(g); g.connect(masterGain);
    src.start(tt); src.stop(tt+0.07);
  }
}

function playSynth(t){
  if(!audioCtx||!masterGain) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(440, t);
  o.frequency.exponentialRampToValueAtTime(220, t+0.08);
  var f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 2000;
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+0.12);
}

function playPerc(t){
  if(!audioCtx||!masterGain) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(800, t);
  o.frequency.exponentialRampToValueAtTime(200, t+0.05);
  g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.08);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+0.1);
}

function playDrop(t){
  if(!audioCtx||!masterGain) return;
  playKick(t);
  playBass(t, 41.2);
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(880, t);
  o.frequency.exponentialRampToValueAtTime(110, t+0.3);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.35);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+0.4);
}

var STEM_FNS = {kick:playKick, hat:playHat, snare:playSnare, bass:function(t){playBass(t,55);},
  clap:playClap, synth:playSynth, perc:playPerc, drop:playDrop};

function startLoopPlayback(){
  stopLoopPlayback();
  if(!audioCtx || loopLayers.length === 0) return;
  var beatDur = 60/bpm;
  var barDur = beatDur * BEATS_PER_BAR;
  function tick(){
    if(state !== 'playing') return;
    var t = audioCtx.currentTime + 0.02;
    for(var li=0; li<loopLayers.length; li++){
      var layer = loopLayers[li];
      var fn = STEM_FNS[layer.stem];
      if(!fn) continue;
      for(var b=0; b<BEATS_PER_BAR; b++){
        if(layer.pattern[b]) fn(t + b*beatDur);
      }
    }
    loopTimer = setTimeout(tick, barDur * 1000);
  }
  tick();
}

function stopLoopPlayback(){
  if(loopTimer){ clearTimeout(loopTimer); loopTimer = null; }
}

function beatDur(){ return 60/bpm; }

function barPattern(barIdx){
  var pat = [true,true,true,true];
  if(barIdx >= 3){
    if(Math.random() < 0.5) pat[1] = false;
  }
  return pat;
}

function spawnNotesForBar(barIdx){
  notes = [];
  var bd = beatDur();
  var ghosts = barIdx >= 2;
  var ghostChance = Math.min(0.15 + barIdx * 0.08, 0.55);
  var pat = barPattern(barIdx);

  for(var b=0; b<BEATS_PER_BAR; b++){
    if(!pat[b]) continue;
    notes.push({
      beat: b,
      hitTime: barStartTime + b * bd,
      hit: false,
      missed: false,
      ghost: false,
      angle: -Math.PI/2
    });
    if(ghosts && b < BEATS_PER_BAR - 1){
      if(Math.random() < ghostChance){
        notes.push({
          beat: b + 0.5,
          hitTime: barStartTime + (b + 0.5) * bd,
          hit: false,
          missed: false,
          ghost: true,
          angle: -Math.PI/2
        });
      }
    }
  }
  notes.sort(function(a,b){ return a.hitTime - b.hitTime; });
}

function getBpmForBar(bar){
  return Math.round(76 + bar * 5);
}

function updateDots(){
  var dots = barDots.children;
  for(var i=0;i<dots.length;i++){
    dots[i].className = 'dot';
    if(i < currentBar) dots[i].className += ' done';
    if(i === currentBar && state === 'playing') dots[i].className += ' current';
  }
}

function flashScore(text, color){
  scoreFlash.textContent = text;
  scoreFlash.style.color = color || 'var(--hit)';
  scoreFlash.classList.add('show');
  setTimeout(function(){ scoreFlash.classList.remove('show'); }, 350);
}

function spawnParticles(x,y,col){
  for(var i=0;i<10;i++){
    var a = Math.random()*Math.PI*2;
    var sp = 2 + Math.random()*5;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col:col});
  }
}

function tryHit(){
  if(state !== 'playing') return;
  var now = performance.now();
  var best = null, bestDiff = Infinity;
  for(var i=0;i<notes.length;i++){
    var n = notes[i];
    if(n.hit || n.missed) continue;
    var diff = Math.abs(now - n.hitTime);
    if(diff < GOOD_MS && diff < bestDiff){
      bestDiff = diff;
      best = n;
    }
  }
  if(!best) return;

  if(best.ghost){
    best.hit = true;
    missFlash = 1;
    shakeT = 8;
    flashScore('GHOST!', 'var(--miss)');
    navigator.vibrate && navigator.vibrate(80);
    failBar('Ghost note tapped');
    return;
  }

  best.hit = true;
  hitFlash = 1;
  var pts = bestDiff <= PERFECT_MS ? 150 : 80;
  score += pts;
  scoreVal.textContent = score;
  flashScore(bestDiff <= PERFECT_MS ? 'PERFECT' : 'GOOD');
  navigator.vibrate && navigator.vibrate(15);

  var hx = cx + Math.cos(-Math.PI/2)*ringR;
  var hy = cy + Math.sin(-Math.PI/2)*ringR;
  spawnParticles(hx, hy, darkMode ? '#00ffcc' : '#00b8a0');

  if(audioCtx){
    var t = audioCtx.currentTime;
    var stem = STEMS[Math.min(currentBar, STEMS.length-1)];
    var fn = STEM_FNS[stem];
    if(fn) fn(t);
  }
}

function checkMisses(){
  var now = performance.now();
  var allDone = true;
  for(var i=0;i<notes.length;i++){
    var n = notes[i];
    if(n.hit) continue;
    if(now - n.hitTime > GOOD_MS){
      if(!n.ghost){
        n.missed = true;
        missFlash = 1;
        shakeT = 12;
        navigator.vibrate && navigator.vibrate(100);
        failBar('Missed the beat');
        return;
      } else {
        n.missed = true;
      }
    } else {
      allDone = false;
    }
  }
  if(allDone && notes.length > 0){
    completeBar();
  }
}

function completeBar(){
  var pat = [];
  for(var b=0;b<BEATS_PER_BAR;b++){
    var found = false;
    for(var i=0;i<notes.length;i++){
      if(!notes[i].ghost && Math.floor(notes[i].beat)===b && notes[i].hit){ found=true; break; }
    }
    pat.push(found);
  }
  loopLayers.push({stem: STEMS[Math.min(currentBar, STEMS.length-1)], pattern: pat});
  startLoopPlayback();

  currentBar++;
  sunrise = currentBar / TOTAL_BARS;
  updateDots();

  if(currentBar >= TOTAL_BARS){
    winGame();
    return;
  }

  bpm = getBpmForBar(currentBar);
  bpmVal.textContent = bpm;
  barStartTime = performance.now() + 650;
  spawnNotesForBar(currentBar);
  flashScore('BAR ' + (currentBar + 1), 'var(--neon)');
}

function failBar(reason){
  state = 'gameover';
  stopLoopPlayback();
  endTitle.textContent = 'TRACK SKIPPED';
  endSub.textContent = 'Loop incomplete · bar ' + (currentBar+1);
  endMsg.textContent = reason + '. Build all 8 bars before the mix moves on.';
  finalScore.textContent = score;
  titlePanel.style.display = 'none';
  endPanel.style.display = 'block';
  overlay.classList.remove('hidden');
}

function winGame(){
  state = 'gameover';
  stopLoopPlayback();
  score += 500;
  scoreVal.textContent = score;
  endTitle.textContent = 'SUNRISE DROP';
  endSub.textContent = '8-bar loop locked';
  endMsg.textContent = 'The fog lifts. Your mix plays on the bay.';
  finalScore.textContent = score;
  titlePanel.style.display = 'none';
  endPanel.style.display = 'block';
  overlay.classList.remove('hidden');
  navigator.vibrate && navigator.vibrate([30,50,30,50,80]);
}

function startGame(){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume().catch(function(){});
  }
  state = 'playing';
  score = 0; currentBar = 0;
  bpm = getBpmForBar(0);
  scoreVal.textContent = '0';
  bpmVal.textContent = bpm;
  notes = []; particles = []; loopLayers = [];
  hitFlash = 0; missFlash = 0; shakeT = 0; sunrise = 0;
  initDots();
  updateDots();
  titlePanel.style.display = 'block';
  endPanel.style.display = 'none';
  overlay.classList.add('hidden');
  barStartTime = performance.now() + 1200;
  spawnNotesForBar(0);
  lastFrame = performance.now();
}

function lerp(a,b,t){ return a + (b-a)*t; }
function mixHex(c1,c2,t){
  var p=function(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];};
  var a=p(c1),b=p(c2);
  return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';
}

function drawBg(){
  var s = state === 'playing' ? sunrise : 0;
  var g = ctx.createLinearGradient(0, 0, 0, H);
  if(darkMode){
    g.addColorStop(0, mixHex('#0a1420','#1a2840',s));
    g.addColorStop(0.45, mixHex('#122840','#284868',s));
    g.addColorStop(1, mixHex('#1a3860','#3a5880',s));
  } else {
    g.addColorStop(0, mixHex('#d8e8f4','#f8d8b0',s));
    g.addColorStop(0.45, mixHex('#a8c0d8','#e8b888',s));
    g.addColorStop(1, mixHex('#6890b0','#c87858',s));
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if(s > 0.3){
    ctx.save();
    ctx.globalAlpha = s * 0.25;
    var sg = ctx.createRadialGradient(cx, H*0.85, 0, cx, H*0.85, H*0.5);
    sg.addColorStop(0, darkMode ? '#ff8844' : '#ffb866');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, H*0.45, W, H*0.55);
    ctx.restore();
  }

  ctx.save();
  var fogAlpha = darkMode ? 0.06 - s*0.03 : 0.18 - s*0.12;
  for(var i=0;i<5;i++){
    var fy = H*0.15 + i*H*0.12 + Math.sin(wavePhase*0.3+i)*20 - s*H*0.08;
    ctx.globalAlpha = Math.max(fogAlpha, 0.02);
    ctx.fillStyle = darkMode ? '#7a9ab8' : '#ffffff';
    ctx.beginPath();
    ctx.ellipse(cx, fy, W*0.6, H*0.06, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawWaveform(){
  wavePhase += 0.02;
  var neon = darkMode ? '#00ffcc' : '#00c4aa';
  ctx.save();
  ctx.strokeStyle = neon;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.35 + loopLayers.length * 0.07;
  ctx.beginPath();
  var pts = 80;
  for(var i=0;i<=pts;i++){
    var t = i/pts;
    var x = cx - ringR*1.5 + t*ringR*3;
    var y = cy + Math.sin(t*Math.PI*6 + wavePhase)*12
      + Math.sin(t*Math.PI*13 + wavePhase*2.3)*6
      + Math.sin(t*Math.PI*3 + wavePhase*0.7)*18*(loopLayers.length/8);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();

  ctx.globalAlpha = 0.15;
  ctx.setLineDash([4,8]);
  ctx.beginPath();
  for(var j=0;j<=pts;j++){
    var t2 = j/pts;
    var x2 = cx - ringR*1.5 + t2*ringR*3;
    var y2 = cy + 30 + Math.sin(t2*Math.PI*4 + wavePhase*1.5)*8;
    if(j===0) ctx.moveTo(x2,y2); else ctx.lineTo(x2,y2);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawRing(){
  var neon = darkMode ? '#00ffcc' : '#00a890';
  var now = performance.now();
  var bd = beatDur();

  ctx.save();
  if(shakeT > 0){
    ctx.translate((Math.random()-0.5)*shakeT, (Math.random()-0.5)*shakeT);
    shakeT *= 0.85;
    if(shakeT < 0.5) shakeT = 0;
  }

  ctx.strokeStyle = neon;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, 0, Math.PI*2);
  ctx.stroke();

  for(var seg=0; seg<BEATS_PER_BAR; seg++){
    var a = -Math.PI/2 + (seg/BEATS_PER_BAR)*Math.PI*2;
    ctx.globalAlpha = 0.25;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*ringR*0.92, cy + Math.sin(a)*ringR*0.92);
    ctx.lineTo(cx + Math.cos(a)*ringR*1.08, cy + Math.sin(a)*ringR*1.08);
    ctx.stroke();
  }

  var hitA = -Math.PI/2;
  ctx.globalAlpha = 0.9 + hitFlash*0.5;
  ctx.fillStyle = hitFlash > 0 ? (darkMode?'#ffe066':'#ffb800') : neon;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(hitA)*ringR*1.12, cy + Math.sin(hitA)*ringR*1.12);
  ctx.lineTo(cx + Math.cos(hitA+0.08)*ringR*1.02, cy + Math.sin(hitA+0.08)*ringR*1.02);
  ctx.lineTo(cx + Math.cos(hitA-0.08)*ringR*1.02, cy + Math.sin(hitA-0.08)*ringR*1.02);
  ctx.closePath();
  ctx.fill();
  hitFlash *= 0.88;
  if(hitFlash < 0.02) hitFlash = 0;

  for(var i=0;i<notes.length;i++){
    var n = notes[i];
    if(n.hit || n.missed) continue;
    var progress = (n.hitTime - now) / (LOOKAHEAD * bd * BEATS_PER_BAR);
    if(progress > 1.2 || progress < -0.3) continue;
    var angle = -Math.PI/2 + progress * Math.PI * 2;
    n.angle = angle;
    var nr = ringR;
    var nx = cx + Math.cos(angle)*nr;
    var ny = cy + Math.sin(angle)*nr;
    var dist = Math.abs(now - n.hitTime);
    var stutter = !n.ghost && dist < 280 ? 1 + Math.sin(now*0.045)*0.18 : 1;
    var sz = (n.ghost ? 7 : 11) * stutter;
    ctx.globalAlpha = n.ghost ? 0.35 : 0.85;
    ctx.fillStyle = n.ghost ? (darkMode?'#4a6078':'#8899aa') : (darkMode?'#00ffcc':'#008870');
    if(!n.ghost){
      ctx.shadowColor = neon;
      ctx.shadowBlur = 12 + stutter * 6;
    }
    ctx.beginPath();
    ctx.arc(nx, ny, sz * (window.devicePixelRatio||1) * 0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    if(!n.ghost){
      ctx.strokeStyle = neon;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(nx, ny, sz * (window.devicePixelRatio||1) * 0.8, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  if(missFlash > 0){
    ctx.globalAlpha = missFlash * 0.3;
    ctx.fillStyle = '#ff4466';
    ctx.fillRect(0,0,W,H);
    missFlash *= 0.9;
    if(missFlash < 0.02) missFlash = 0;
  }

  ctx.restore();
}

function drawParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= 0.04;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3*(window.devicePixelRatio||1), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBarProgress(){
  if(state !== 'playing') return;
  var now = performance.now();
  var elapsed = now - barStartTime;
  var total = beatDur() * BEATS_PER_BAR;
  if(total <= 0) return;
  var prog = Math.min(Math.max(elapsed/total, 0), 1);
  var neon = darkMode ? '#00ffcc' : '#00a890';
  ctx.save();
  ctx.strokeStyle = neon;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR*0.75, -Math.PI/2, -Math.PI/2 + prog*Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function draw(){
  drawBg();
  drawWaveform();
  drawRing();
  drawBarProgress();
  drawParticles();
}

function loop(now){
  if(state === 'playing'){
    checkMisses();
    for(var i=0;i<notes.length;i++){
      var n = notes[i];
      if(!n.ghost && !n.hit && !n.missed){
        n.angle = -Math.PI/2 + ((n.hitTime - now)/(beatDur()*BEATS_PER_BAR))*Math.PI*2;
      }
    }
  }
  draw();
  lastFrame = now;
  requestAnimationFrame(loop);
}

function onTap(e){
  if(e && e.preventDefault) e.preventDefault();
  tryHit();
}

canvas.addEventListener('touchstart', onTap, {passive:false});
canvas.addEventListener('mousedown', function(e){
  if(state==='playing'){ e.preventDefault(); tryHit(); }
});
document.addEventListener('keydown', function(e){
  if(e.code==='Space'||e.code==='Enter'){
    if(state==='playing'){ e.preventDefault(); tryHit(); }
  }
});

document.getElementById('startBtn').addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});
document.getElementById('restartBtn').addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

requestAnimationFrame(loop);
draw();
})();
</script>
</body>
</html>
