<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marine Layer</title>
<style>
:root {
  --bg: #f8f9fa;
  --text: #1c232e;
  --btn-bg: #1c232e;
  --btn-text: #f8f9fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c232e;
    --text: #f8f9fa;
    --btn-bg: #f8f9fa;
    --btn-text: #1c232e;
  }
}
body {
  margin: 0;
  overflow: hidden;
  background-color: var(--bg);
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  width: 100dvw;
  height: 100dvh;
}
canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100dvw; height: 100dvh;
  z-index: 1;
}
#ui-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100dvw; height: 100dvh;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}
.screen {
  background: var(--bg);
  color: var(--text);
  padding: 2.5rem;
  border-radius: 1rem;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  max-width: 90vw;
  box-sizing: border-box;
  pointer-events: none;
}
.screen * {
  pointer-events: none;
}
h1 { 
  margin: 0; 
  font-weight: 800; 
  font-size: 2.5rem; 
  letter-spacing: -0.05em;
  text-transform: uppercase;
}
p { 
  margin: 0; 
  line-height: 1.5; 
  opacity: 0.8; 
  font-size: 1.1rem;
}
button {
  pointer-events: auto !important;
  background: var(--btn-bg);
  color: var(--btn-text);
  border: none;
  padding: 1.2rem 2.5rem;
  font-size: 1.2rem;
  font-family: inherit;
  border-radius: 0.5rem;
  cursor: pointer;
  text-transform: uppercase;
  font-weight: bold;
  transition: transform 0.1s;
}
button:active {
  transform: scale(0.95);
}
#hud {
  position: absolute;
  top: 2rem;
  left: 2rem;
  right: 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  color: white;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  z-index: 10;
}
#health-bar-container {
  width: 120px;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  overflow: hidden;
}
#health-bar {
  height: 100%;
  background: white;
  width: 100%;
  transition: width 0.1s linear;
}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="ui-layer">
  <div id="title-screen" class="screen">
    <h1>Marine Layer</h1>
    <p>Draw one continuous fog line to the Marina before 8:35.</p>
    <p>Dodge seagulls. Outrun the wind.</p>
    <button data-smoke="start" id="start-btn">START</button>
  </div>
  
  <div id="game-over-screen" class="screen" style="display: none;">
    <h1 id="go-title">DISSIPATED</h1>
    <p id="go-desc">The fog lifted before reaching the bay.</p>
    <button data-smoke="restart" id="restart-btn">PLAY AGAIN</button>
  </div>
</div>

<div id="hud" style="display: none;">
  <div id="clock">8:34:15</div>
  <div id="health-bar-container">
    <div id="health-bar"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

const GAME_DURATION = 45;
const DISTANCE_TOTAL = 10000;
const SPEED = DISTANCE_TOTAL / GAME_DURATION;

let state = 'TITLE';
let distanceRemaining = DISTANCE_TOTAL;
let playerHealth = 100;
let maxHealth = 150;
let trail = [];
let fogBanks = [];
let seagulls = [];
let windShears = [];
let floatTexts = [];
let lastTime = performance.now();
let timeElapsed = 0;

let pointer = { x: width/2, y: height/2, isDown: false, isKeyboard: false };
let player = { x: width/2, y: height*0.2, vx: 0, vy: 0 };
let screenShake = 0;
let hitPauseTimer = 0;

let keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; pointer.isKeyboard = true; });
window.addEventListener('keyup', e => keys[e.code] = false);

canvas.addEventListener('pointerdown', e => {
    pointer.isKeyboard = false;
    pointer.isDown = true;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    if (e.cancelable) e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
    if (pointer.isDown && !pointer.isKeyboard) {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
    }
    if (e.cancelable) e.preventDefault();
});
window.addEventListener('pointerup', e => {
    if (!pointer.isKeyboard) pointer.isDown = false;
});
window.addEventListener('pointercancel', e => {
    if (!pointer.isKeyboard) pointer.isDown = false;
});

function initGame() {
    distanceRemaining = DISTANCE_TOTAL;
    playerHealth = 100;
    trail = [];
    fogBanks = [];
    seagulls = [];
    windShears = [];
    floatTexts = [];
    player = { x: width/2, y: height*0.2, vx: 0, vy: 0 };
    pointer.x = player.x;
    pointer.y = player.y;
    pointer.isDown = false;
    screenShake = 0;
    hitPauseTimer = 0;
    timeElapsed = 0;
    
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    
    state = 'PLAYING';
    lastTime = performance.now();
}

document.getElementById('start-btn').addEventListener('click', initGame);
document.getElementById('restart-btn').addEventListener('click', initGame);

function lerpColor(c1, c2, t) {
    return [
        c1[0] + (c2[0] - c1[0]) * t,
        c1[1] + (c2[1] - c1[1]) * t,
        c1[2] + (c2[2] - c1[2]) * t
    ];
}

function update(dt) {
    if (pointer.isKeyboard) {
        let kx = 0, ky = 0;
        if (keys.ArrowUp || keys.KeyW) ky -= 1;
        if (keys.ArrowDown || keys.KeyS) ky += 1;
        if (keys.ArrowLeft || keys.KeyA) kx -= 1;
        if (keys.ArrowRight || keys.KeyD) kx += 1;
        if (kx !== 0 || ky !== 0) {
            pointer.isDown = true;
            pointer.x += kx * 800 * dt;
            pointer.y += ky * 800 * dt;
            pointer.x = Math.max(0, Math.min(width, pointer.x));
            pointer.y = Math.max(0, Math.min(height, pointer.y));
        } else {
            pointer.isDown = false;
            pointer.x = player.x;
            pointer.y = player.y;
        }
    }

    if (hitPauseTimer > 0) {
        hitPauseTimer -= dt;
    } else if (state === 'PLAYING') {
        player.x += player.vx * dt;
        player.y += player.vy * dt;
        player.vx *= 0.8;
        player.vy *= 0.8;

        if (pointer.isDown) {
            let dx = pointer.x - player.x;
            let dy = pointer.y - player.y;
            player.x += dx * 10 * dt;
            player.y += dy * 10 * dt;
        }

        player.x = Math.max(10, Math.min(width - 10, player.x));
        player.y = Math.max(10, Math.min(height - 10, player.y));
        
        trail.push({ x: player.x, y: player.y, time: performance.now() });
        
        distanceRemaining -= SPEED * dt;
        if (distanceRemaining <= 0 || player.y >= distanceRemaining + 50) {
            state = 'WIN';
            document.getElementById('go-title').innerText = "ARRIVED";
            document.getElementById('go-desc').innerText = "You reached the Marina.";
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('hud').style.display = 'none';
        }

        playerHealth -= 4 * dt; 
        if (playerHealth <= 0) {
            state = 'GAMEOVER';
            document.getElementById('go-title').innerText = "DISSIPATED";
            document.getElementById('go-desc').innerText = "The fog lifted before reaching the bay.";
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('hud').style.display = 'none';
        }

        let difficulty = Math.min(1, timeElapsed / GAME_DURATION);

        if (Math.random() < 1.5 * dt) {
            fogBanks.push({ x: 50 + Math.random() * (width - 100), y: -50, radius: 25 });
        }
        for (let i = fogBanks.length - 1; i >= 0; i--) {
            let b = fogBanks[i];
            b.y += SPEED * dt;
            let dist = Math.hypot(player.x - b.x, player.y - b.y);
            if (dist < b.radius + 15) {
                playerHealth = Math.min(maxHealth, playerHealth + 25);
                floatTexts.push({ x: b.x, y: b.y, text: "+FOG", age: 0 });
                fogBanks.splice(i, 1);
                navigator.vibrate?.(20);
            } else if (b.y > height + 50) {
                fogBanks.splice(i, 1);
            }
        }

        let shearRate = difficulty * 0.8;
        if (Math.random() < shearRate * dt) {
            windShears.push({
                y: -200, height: 100 + Math.random() * 150,
                vx: Math.random() < 0.5 ? 500 : -500,
                opacity: 0
            });
        }
        for (let i = windShears.length - 1; i >= 0; i--) {
            let s = windShears[i];
            s.y += SPEED * dt;
            if (s.opacity < 1) s.opacity += dt * 2;
            
            if (player.y > s.y && player.y < s.y + s.height) {
                playerHealth -= 25 * dt;
                if (Math.random() < 0.2) screenShake = 1;
            }
            
            for (let j = trail.length - 1; j >= 0; j--) {
                let p = trail[j];
                if (p.y > s.y && p.y < s.y + s.height) {
                    if (Math.random() < 6 * dt) {
                        trail.splice(j, 1);
                        playerHealth -= 0.5 * dt; 
                    }
                }
            }
            
            if (s.y > height + 200) windShears.splice(i, 1);
        }

        let gullRate = 0.5 + difficulty * 2.5;
        if (Math.random() < gullRate * dt) {
            let side = Math.random() < 0.5 ? -50 : width + 50;
            seagulls.push({
                x: side, y: Math.random() * (height * 0.8),
                vx: (side < 0 ? 1 : -1) * (200 + Math.random() * 200),
                vy: (Math.random() - 0.5) * 50,
                frame: 0,
                hit: false
            });
        }
    }

    // Always update seagulls so they fly on menu screens
    for (let i = seagulls.length - 1; i >= 0; i--) {
        let g = seagulls[i];
        g.x += g.vx * dt;
        g.y += g.vy * dt;
        if (state === 'PLAYING') g.y += SPEED * dt * 0.5;
        g.frame += dt;
        
        if (state === 'PLAYING') {
            let dist = Math.hypot(player.x - g.x, player.y - g.y);
            if (dist < 35 && !g.hit) {
                g.hit = true;
                playerHealth -= 30;
                screenShake = 5;
                hitPauseTimer = 0.1;
                player.vx = ((player.x - g.x) / dist) * 1500;
                player.vy = ((player.y - g.y) / dist) * 1500;
                navigator.vibrate?.(50);
            }
        }
        if (g.x < -100 || g.x > width + 100 || g.y > height + 100) {
            seagulls.splice(i, 1);
        }
    }

    if (screenShake > 0) {
        screenShake -= dt * 10;
        if (screenShake < 0) screenShake = 0;
    }
    
    // Tail pruning
    let maxAge = playerHealth * 30; 
    let currentTime = performance.now();
    while(trail.length > 0 && currentTime - trail[0].time > maxAge) {
        trail.shift();
    }
    if (trail.length > 500) trail.splice(0, trail.length - 500);

    // Menu ambient seagulls
    if (state !== 'PLAYING' && Math.random() < 0.5 * dt) {
        let side = Math.random() < 0.5 ? -50 : width + 50;
        seagulls.push({
            x: side, y: Math.random() * height,
            vx: (side < 0 ? 1 : -1) * (150 + Math.random() * 100),
            vy: (Math.random() - 0.5) * 20,
            frame: 0,
            hit: false
        });
    }

    if (state === 'PLAYING') {
        let clockSeconds = Math.max(0, 15 + (45 - (distanceRemaining / SPEED)));
        let m = Math.floor(clockSeconds / 60);
        let s = Math.floor(clockSeconds % 60);
        document.getElementById('clock').innerText = m > 0 ? '8:35:00' : `8:34:${s.toString().padStart(2, '0')}`;
        
        let hpPercent = Math.max(0, (playerHealth / maxHealth) * 100);
        document.getElementById('health-bar').style.width = hpPercent + '%';
    }
}

function draw() {
    if (!ctx) return;
    
    let progress = Math.max(0, Math.min(1, 1 - (distanceRemaining / DISTANCE_TOTAL)));
    if (state !== 'PLAYING' && state !== 'WIN') progress = 0;

    let skyTop = lerpColor([255, 140, 0], [40, 45, 50], progress);
    let skyBot = lerpColor([200, 210, 220], [60, 70, 80], progress);

    let grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, `rgb(${skyTop[0]}, ${skyTop[1]}, ${skyTop[2]})`);
    grad.addColorStop(1, `rgb(${skyBot[0]}, ${skyBot[1]}, ${skyBot[2]})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    if (screenShake > 0) {
        let amt = screenShake * 4;
        ctx.translate((Math.random() - 0.5) * amt, (Math.random() - 0.5) * amt);
    }

    let sunY = height * 0.2 + progress * height * 0.6;
    let sunColor = lerpColor([255, 200, 100], [100, 100, 100], Math.min(1, progress * 1.5));
    
    const sunOuterRadius = 100 * 2;
    let sunGrad = ctx.createRadialGradient(width/2, sunY, 10, width/2, sunY, sunOuterRadius);
    sunGrad.addColorStop(0, `rgba(${sunColor[0]}, ${sunColor[1]}, ${sunColor[2]}, 1)`);
    sunGrad.addColorStop(1, `rgba(${sunColor[0]}, ${sunColor[1]}, ${sunColor[2]}, 0)`);
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(width/2, sunY, sunOuterRadius, 0, Math.PI*2);
    ctx.fill();

    for (let s of windShears) {
        ctx.fillStyle = `rgba(200, 230, 255, ${0.15 * s.opacity})`;
        ctx.fillRect(0, s.y, width, s.height);
        ctx.fillStyle = `rgba(255, 255, 255, ${0.3 * s.opacity})`;
        for(let k=0; k<4; k++) {
            let streakX = ((performance.now() * s.vx / 1000) + k * 250) % width;
            if (streakX < 0) streakX += width;
            ctx.fillRect(streakX, s.y + s.height * ((k+1)/5), 150, 2);
        }
    }

    if (distanceRemaining < height) {
        ctx.fillStyle = '#1c232e'; 
        ctx.beginPath();
        ctx.moveTo(0, distanceRemaining + 50);
        for (let x = 0; x <= width; x += 30) {
            let bump = Math.sin(x * 0.1) * 10 + Math.sin(x * 0.05) * 15;
            ctx.lineTo(x, distanceRemaining + 50 - Math.abs(bump));
        }
        ctx.lineTo(width, height + 100);
        ctx.lineTo(0, height + 100);
        ctx.fill();
    }

    for (let b of fogBanks) {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + 0.3 * Math.sin(timeElapsed * 5)})`;
        ctx.shadowBlur = 25;
        ctx.shadowColor = 'white';
        for(let w=0; w<3; w++) {
            ctx.beginPath();
            let ox = Math.sin(w * 2.1 + timeElapsed * 3) * 6;
            let oy = Math.cos(w * 2.1 + timeElapsed * 3) * 6;
            ctx.arc(b.x + ox, b.y + oy, b.radius * 0.7, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }

    ctx.strokeStyle = '#222';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let g of seagulls) {
        ctx.save();
        ctx.translate(g.x, g.y);
        if (g.vx < 0) ctx.scale(-1, 1);
        let flap = Math.sin(g.frame * 12) * 15;
        ctx.beginPath();
        ctx.moveTo(-15, flap);
        ctx.lineTo(0, 0);
        ctx.lineTo(15, flap);
        ctx.stroke();
        ctx.restore();
    }

    if (state === 'PLAYING' && trail.length > 0) {
        ctx.beginPath();
        let isFirst = true;
        for (let i = 0; i < trail.length; i++) {
            let p = trail[i];
            if (isFirst) {
                ctx.moveTo(p.x, p.y);
                isFirst = false;
            } else {
                let prev = trail[i-1];
                if (p.time - prev.time > 150) {
                    ctx.moveTo(p.x, p.y);
                } else {
                    ctx.lineTo(p.x, p.y);
                }
            }
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 30;
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 10;
        ctx.shadowBlur = 0;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(player.x, player.y, 8, 0, Math.PI*2);
        ctx.fillStyle = 'white';
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'white';
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    for (let i = floatTexts.length - 1; i >= 0; i--) {
        let ft = floatTexts[i];
        ft.age += 1/60; 
        ft.y -= 0.5;
        ctx.fillStyle = `rgba(255, 255, 255, ${1 - ft.age})`;
        ctx.font = 'bold 20px ui-monospace, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        if (ft.age > 1) floatTexts.splice(i, 1);
    }

    ctx.restore();
}

function loop(time) {
    requestAnimationFrame(loop);
    let dt = (time - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = time;
    
    if (state === 'PLAYING') {
        timeElapsed += dt;
    }
    update(dt);
    draw();
}

requestAnimationFrame(t => { lastTime = t; loop(t); });
</script>

</body>
</html>
