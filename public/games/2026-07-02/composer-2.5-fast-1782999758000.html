<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunrise Ship</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a1628;
    --bg2: #0f1f38;
    --term: #3dff7a;
    --term-dim: #1a9e4a;
    --warn: #ff6b4a;
    --text: #c8e6d4;
    --muted: #6b8f7a;
    --panel: rgba(10, 22, 40, 0.92);
    --border: rgba(61, 255, 122, 0.25);
    --sun: #ffd166;
    --sun-glow: rgba(255, 209, 102, 0.35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e8f0f8;
      --bg2: #d4e4f0;
      --term: #007a3d;
      --term-dim: #005c2e;
      --warn: #d84315;
      --text: #1a2e3a;
      --muted: #5a7280;
      --panel: rgba(232, 240, 248, 0.94);
      --border: rgba(0, 122, 61, 0.3);
      --sun: #f4a020;
      --sun-glow: rgba(244, 160, 32, 0.4);
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    width: 100dvw;
    height: 100dvh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: max(12px, env(safe-area-inset-top)) 16px 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 2;
    gap: 8px;
  }
  .hud-block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.4;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .hud-block .val { color: var(--term); font-size: 18px; font-weight: 700; }
  .hud-block .lbl { color: var(--muted); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
  #sun-bar-wrap {
    position: fixed;
    top: max(52px, calc(env(safe-area-inset-top) + 44px));
    left: 16px;
    right: 16px;
    height: 6px;
    background: var(--bg2);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--border);
    pointer-events: none;
    z-index: 2;
  }
  #sun-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--term-dim), var(--sun));
    border-radius: 3px;
    transition: width 0.15s linear;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .overlay-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .overlay h1 {
    font-size: 22px;
    color: var(--term);
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }
  .overlay .sub {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .overlay .score-final {
    font-size: 36px;
    color: var(--term);
    margin: 12px 0 4px;
  }
  .overlay .score-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 20px; }
  .btn {
    pointer-events: auto;
    min-height: 48px;
    min-width: 160px;
    padding: 14px 28px;
    border: 2px solid var(--term);
    border-radius: 14px;
    background: transparent;
    color: var(--term);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.96); background: rgba(61,255,122,0.12); }
  @media (prefers-color-scheme: light) {
    .btn:active { background: rgba(0,122,61,0.1); }
  }
  #ship-banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    font-size: clamp(28px, 8vw, 48px);
    color: var(--term);
    font-weight: 900;
    letter-spacing: 0.15em;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    text-shadow: 0 0 30px var(--term);
    transition: none;
  }
  #ship-banner.show {
    animation: shipPop 1.2s ease forwards;
  }
  @keyframes shipPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    30% { transform: translate(-50%, -50%) scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
  }
  #hint {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
    z-index: 2;
    letter-spacing: 0.05em;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hud-block"><div class="lbl">Patched</div><div class="val" id="score">0</div></div>
    <div class="hud-block"><div class="lbl">Ship Stack</div><div class="val" id="stack">0/5</div></div>
    <div class="hud-block"><div class="lbl">Agents</div><div class="val" id="agents">0</div></div>
  </div>
  <div id="sun-bar-wrap"><div id="sun-bar"></div></div>
  <div id="ship-banner">SHIPPED ✓</div>
  <div id="hint">TAP to deploy · TAP agent to reroute</div>

  <div id="title-overlay" class="overlay">
    <div class="overlay-card">
      <h1>⬡ Sunrise Ship</h1>
      <p class="sub">Deploy micro-agents from your thumb. Patch broken code before the bay catches sunrise. Stack 5 fixes to ship.</p>
      <button class="btn" data-smoke="start" id="btn-start">Deploy Agents</button>
    </div>
  </div>

  <div id="gameover-overlay" class="overlay hidden">
    <div class="overlay-card">
      <h1 id="go-title">Sunrise</h1>
      <p class="sub" id="go-msg">The morning arrived.</p>
      <div class="score-final" id="final-score">0</div>
      <div class="score-lbl">bugs patched</div>
      <button class="btn" data-smoke="restart" id="btn-restart">Ship Again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('score');
  var stackEl = document.getElementById('stack');
  var agentsEl = document.getElementById('agents');
  var sunBar = document.getElementById('sun-bar');
  var titleOverlay = document.getElementById('title-overlay');
  var gameoverOverlay = document.getElementById('gameover-overlay');
  var shipBanner = document.getElementById('ship-banner');
  var btnStart = document.getElementById('btn-start');
  var btnRestart = document.getElementById('btn-restart');
  var goTitle = document.getElementById('go-title');
  var goMsg = document.getElementById('go-msg');
  var finalScore = document.getElementById('final-score');
  var hint = document.getElementById('hint');

  var W = 360, H = 640;
  var state = 'title';
  var score = 0;
  var stackCount = 0;
  var sunrise = 0;
  var elapsed = 0;
  var spawnTimer = 0;
  var nextId = 1;
  var bugs = [];
  var agents = [];
  var particles = [];
  var stitches = [];
  var shake = 0;
  var audioCtx = null;
  var darkMode = true;

  var BUG_SNIPPETS = [
    'null.ref()', 'ERR_LOOP', 'undefined', 'TODO: ship',
    'dialect??', 'agent.fail', '{ }', 'contract.exp',
    'fake.news++', 'spawn err', '// fix me', 'NaN === true'
  ];

  var ROUND_SEC = 55;
  var MAX_BUGS = 9;
  var AGENT_R = 10;
  var BUG_W = 88;
  var BUG_H = 36;
  var DOCK_Y = 0;

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return true; }
  }

  function cssVar(name) {
    try {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    } catch (e) { return '#3dff7a'; }
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) {}
  }

  function beep(freq, dur, vol) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  function resize() {
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    DOCK_Y = H - Math.max(80, H * 0.12);
    darkMode = prefersDark();
  }

  function resetGame() {
    score = 0;
    stackCount = 0;
    sunrise = 0;
    elapsed = 0;
    spawnTimer = 0;
    bugs = [];
    agents = [];
    particles = [];
    stitches = [];
    shake = 0;
    updateHUD();
    if (sunBar) sunBar.style.width = '0%';
  }

  function spawnBug() {
    if (bugs.length >= MAX_BUGS) return;
    var margin = 50;
    var top = 90;
    var x, y, tries = 0;
    do {
      x = margin + Math.random() * (W - margin * 2 - BUG_W);
      y = top + Math.random() * (DOCK_Y - top - BUG_H - 20);
      tries++;
    } while (tries < 20 && overlapsBug(x, y) );
    bugs.push({
      id: nextId++,
      x: x, y: y,
      text: BUG_SNIPPETS[Math.floor(Math.random() * BUG_SNIPPETS.length)],
      patched: false,
      pulse: Math.random() * Math.PI * 2,
      assignee: null
    });
  }

  function overlapsBug(x, y) {
    for (var i = 0; i < bugs.length; i++) {
      var b = bugs[i];
      if (b.patched) continue;
      if (Math.abs(b.x - x) < BUG_W + 10 && Math.abs(b.y - y) < BUG_H + 10) return true;
    }
    return false;
  }

  function nearestFreeBug(fromX, fromY, excludeId) {
    var best = null, bestD = Infinity;
    for (var i = 0; i < bugs.length; i++) {
      var b = bugs[i];
      if (b.patched || b.assignee) continue;
      var dx = (b.x + BUG_W * 0.5) - fromX;
      var dy = (b.y + BUG_H * 0.5) - fromY;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = b; }
    }
    return best;
  }

  function deployAgent(x, y) {
    var sx = W * 0.5;
    var sy = DOCK_Y + 20;
    var target = nearestFreeBug(sx, sy, null);
    if (!target) {
      for (var i = 0; i < bugs.length; i++) {
        if (!bugs[i].patched && !bugs[i].assignee) { target = bugs[i]; break; }
      }
    }
    if (!target) return;
    target.assignee = nextId;
    agents.push({
      id: nextId++,
      x: sx, y: sy,
      tx: target.x + BUG_W * 0.5,
      ty: target.y + BUG_H * 0.5,
      targetId: target.id,
      speed: 140 + Math.random() * 30,
      slow: 1,
      flash: 0,
      trail: []
    });
    beep(440 + Math.random() * 80, 0.08, 0.04);
    vibrate(8);
    updateHUD();
  }

  function rerouteAgent(agent) {
    var others = [];
    for (var i = 0; i < bugs.length; i++) {
      var b = bugs[i];
      if (!b.patched && b.id !== agent.targetId) others.push(b);
    }
    if (!others.length) return;
    for (var j = 0; j < bugs.length; j++) {
      if (bugs[j].id === agent.targetId) bugs[j].assignee = null;
    }
    var pick = others[Math.floor(Math.random() * others.length)];
    if (!pick.assignee) {
      pick.assignee = agent.id;
      agent.targetId = pick.id;
      agent.tx = pick.x + BUG_W * 0.5;
      agent.ty = pick.y + BUG_H * 0.5;
      agent.flash = 0.4;
      agent.speed = Math.min(agent.speed + 20, 220);
      beep(660, 0.06, 0.05);
      vibrate(12);
    }
  }

  function findAgentAt(x, y) {
    for (var i = agents.length - 1; i >= 0; i--) {
      var a = agents[i];
      var dx = a.x - x, dy = a.y - y;
      if (dx * dx + dy * dy < (AGENT_R + 16) * (AGENT_R + 16)) return a;
    }
    return null;
  }

  function patchBug(bug, agent) {
    bug.patched = true;
    bug.fadeLife = 0.6;
    bug.assignee = null;
    stitches.push({ x1: agent.x, y1: agent.y, x2: bug.x + BUG_W * 0.5, y2: bug.y + BUG_H * 0.5, life: 1 });
    for (var i = 0; i < 12; i++) {
      particles.push({
        x: bug.x + BUG_W * 0.5,
        y: bug.y + BUG_H * 0.5,
        vx: (Math.random() - 0.5) * 120,
        vy: (Math.random() - 0.5) * 120,
        life: 0.6 + Math.random() * 0.4,
        color: cssVar('--term')
      });
    }
    score++;
    stackCount++;
    shake = 4;
    beep(880, 0.1, 0.07);
    vibrate(20);

    if (stackCount >= 5) {
      stackCount = 0;
      triggerShip();
    }
    updateHUD();
  }

  function triggerShip() {
    if (shipBanner) {
      shipBanner.classList.remove('show');
      void shipBanner.offsetWidth;
      shipBanner.classList.add('show');
    }
    shake = 10;
    beep(523, 0.15, 0.08);
    setTimeout(function () { beep(659, 0.15, 0.08); }, 100);
    setTimeout(function () { beep(784, 0.25, 0.1); }, 200);
    vibrate([30, 20, 40]);
    for (var i = 0; i < 40; i++) {
      particles.push({
        x: W * 0.5,
        y: H * 0.45,
        vx: (Math.random() - 0.5) * 280,
        vy: (Math.random() - 0.5) * 280,
        life: 1 + Math.random(),
        color: cssVar('--term')
      });
    }
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (stackEl) stackEl.textContent = stackCount + '/5';
    if (agentsEl) agentsEl.textContent = String(agents.length);
    if (sunBar) sunBar.style.width = (sunrise * 100).toFixed(1) + '%';
  }

  function gameOver(reason) {
    state = 'gameover';
    if (goTitle) goTitle.textContent = reason === 'overflow' ? 'Stack Overflow' : 'Sunrise';
    if (goMsg) {
      goMsg.textContent = reason === 'overflow'
        ? 'Too many unpatched bugs. The loop won.'
        : 'Morning light over the bay. How many did you ship?';
    }
    if (finalScore) finalScore.textContent = String(score);
    if (gameoverOverlay) gameoverOverlay.classList.remove('hidden');
    if (hint) hint.style.opacity = '0';
    beep(220, 0.3, 0.06);
  }

  function startGame() {
    initAudio();
    resetGame();
    state = 'playing';
    if (titleOverlay) titleOverlay.classList.add('hidden');
    if (gameoverOverlay) gameoverOverlay.classList.add('hidden');
    if (hint) hint.style.opacity = '0.7';
    for (var i = 0; i < 3; i++) spawnBug();
    spawnTimer = 1.5;
  }

  function getSpawnInterval() {
    return Math.max(1.2, 3.2 - elapsed * 0.04);
  }

  function getMaxActiveBugs() {
    return Math.min(MAX_BUGS, 3 + Math.floor(elapsed / 8));
  }

  function update(dt) {
    if (state !== 'playing') return;

    elapsed += dt;
    sunrise = Math.min(1, elapsed / ROUND_SEC);
    updateHUD();

    spawnTimer -= dt;
    var activeBugs = 0;
    for (var bi = 0; bi < bugs.length; bi++) if (!bugs[bi].patched) activeBugs++;
    if (spawnTimer <= 0 && activeBugs < getMaxActiveBugs()) {
      spawnBug();
      spawnTimer = getSpawnInterval();
    }

    if (sunrise >= 1) { gameOver('sunrise'); return; }

    var unpatched = 0;
    for (var ub = 0; ub < bugs.length; ub++) if (!bugs[ub].patched) unpatched++;
    if (unpatched >= MAX_BUGS) { gameOver('overflow'); return; }

    for (var ai = 0; ai < agents.length; ai++) {
      var ag = agents[ai];
      ag.slow = 1;
      ag.flash = Math.max(0, ag.flash - dt);
    }

    for (var c1 = 0; c1 < agents.length; c1++) {
      for (var c2 = c1 + 1; c2 < agents.length; c2++) {
        var a1 = agents[c1], a2 = agents[c2];
        var cdx = a2.x - a1.x, cdy = a2.y - a1.y;
        var cd = Math.sqrt(cdx * cdx + cdy * cdy);
        if (cd < AGENT_R * 2.5 && cd > 0.1) {
          a1.slow = 0.35;
          a2.slow = 0.35;
        }
      }
    }

    for (var mi = agents.length - 1; mi >= 0; mi--) {
      var ag2 = agents[mi];
      var target = null;
      for (var ti = 0; ti < bugs.length; ti++) {
        if (bugs[ti].id === ag2.targetId) { target = bugs[ti]; break; }
      }
      if (!target || target.patched) {
        agents.splice(mi, 1);
        continue;
      }
      ag2.tx = target.x + BUG_W * 0.5;
      ag2.ty = target.y + BUG_H * 0.5;
      var dx = ag2.tx - ag2.x, dy = ag2.ty - ag2.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 8) {
        patchBug(target, ag2);
        agents.splice(mi, 1);
        continue;
      }
      var spd = ag2.speed * ag2.slow * dt;
      ag2.x += (dx / dist) * spd;
      ag2.y += (dy / dist) * spd;
      ag2.trail.push({ x: ag2.x, y: ag2.y });
      if (ag2.trail.length > 8) ag2.trail.shift();
    }

    for (var pi = 0; pi < bugs.length; pi++) {
      bugs[pi].pulse += dt * 4;
      if (bugs[pi].patched) bugs[pi].fadeLife -= dt;
    }
    bugs = bugs.filter(function (b) { return !b.patched || (b.fadeLife && b.fadeLife > 0); });

    for (var pj = particles.length - 1; pj >= 0; pj--) {
      var p = particles[pj];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 80 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(pj, 1);
    }

    for (var si = stitches.length - 1; si >= 0; si--) {
      stitches[si].life -= dt * 2;
      if (stitches[si].life <= 0) stitches.splice(si, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 20);
  }

  function roundRect(x, y, w, h, r) {
    if (!ctx) return;
    r = Math.min(r, w * 0.5, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function draw() {
    if (!ctx) return;
    darkMode = prefersDark();
    var bg = cssVar('--bg');
    var bg2 = cssVar('--bg2');
    var term = cssVar('--term');
    var termDim = cssVar('--term-dim');
    var warn = cssVar('--warn');
    var muted = cssVar('--muted');
    var sun = cssVar('--sun');
    var sunGlow = cssVar('--sun-glow');

    var sx = (Math.random() - 0.5) * shake;
    var sy = (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.translate(sx, sy);

    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, bg);
    grad.addColorStop(1, bg2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var sunH = H * 0.35 * sunrise;
    if (sunH > 0) {
      var sg = ctx.createLinearGradient(0, 0, 0, sunH);
      sg.addColorStop(0, sunGlow);
      sg.addColorStop(1, 'transparent');
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, W, sunH);
    }

    ctx.strokeStyle = darkMode ? 'rgba(61,255,122,0.04)' : 'rgba(0,122,61,0.06)';
    ctx.lineWidth = 1;
    var grid = 32;
    for (var gx = 0; gx < W; gx += grid) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    for (var gy = 0; gy < H; gy += grid) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }

    for (var si = 0; si < stitches.length; si++) {
      var st = stitches[si];
      ctx.strokeStyle = term;
      ctx.globalAlpha = st.life * 0.8;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(st.x1, st.y1);
      ctx.lineTo(st.x2, st.y2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    for (var bi = 0; bi < bugs.length; bi++) {
      var bug = bugs[bi];
      if (bug.patched) {
        ctx.globalAlpha = Math.max(0, (bug.fadeLife || 0) / 0.6);
        ctx.fillStyle = term;
        ctx.font = 'bold 12px ui-monospace, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('✓', bug.x + BUG_W * 0.5, bug.y + BUG_H * 0.5 + 4);
        ctx.globalAlpha = 1;
        continue;
      }
      var pulse = 0.7 + Math.sin(bug.pulse) * 0.15;
      ctx.fillStyle = darkMode ? 'rgba(20,35,55,0.95)' : 'rgba(255,255,255,0.95)';
      roundRect(bug.x, bug.y, BUG_W, BUG_H, 10);
      ctx.fill();
      ctx.strokeStyle = warn;
      ctx.globalAlpha = pulse;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.fillStyle = warn;
      ctx.font = 'bold 11px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'left';
      ctx.fillText('✕', bug.x + 8, bug.y + 22);

      ctx.fillStyle = muted;
      ctx.font = '10px ui-monospace, Menlo, monospace';
      var txt = bug.text.length > 11 ? bug.text.slice(0, 10) + '…' : bug.text;
      ctx.fillText(txt, bug.x + 22, bug.y + 22);

      if (bug.assignee) {
        ctx.fillStyle = termDim;
        ctx.font = '8px ui-monospace, Menlo, monospace';
        ctx.fillText('→ agent', bug.x + 8, bug.y + BUG_H - 6);
      }
    }

    for (var ai = 0; ai < agents.length; ai++) {
      var ag = agents[ai];
      for (var ti = 0; ti < ag.trail.length; ti++) {
        var t = ag.trail[ti];
        ctx.fillStyle = term;
        ctx.globalAlpha = (ti / ag.trail.length) * 0.3;
        ctx.beginPath();
        ctx.arc(t.x, t.y, AGENT_R * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      var glow = ag.flash > 0 ? 1.3 : 1;
      ctx.fillStyle = ag.slow < 1 ? warn : term;
      ctx.shadowColor = term;
      ctx.shadowBlur = ag.flash > 0 ? 16 : 8;
      ctx.beginPath();
      ctx.arc(ag.x, ag.y, AGENT_R * glow, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = darkMode ? bg : '#fff';
      ctx.font = '9px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('⬡', ag.x, ag.y + 3);
    }

    if (state === 'playing' || state === 'title') {
      var dockW = Math.min(280, W - 40);
      var dockX = (W - dockW) * 0.5;
      ctx.fillStyle = darkMode ? 'rgba(15,31,56,0.9)' : 'rgba(255,255,255,0.9)';
      roundRect(dockX, DOCK_Y, dockW, 56, 16);
      ctx.fill();
      ctx.strokeStyle = termDim;
      ctx.lineWidth = 1;
      ctx.stroke();

      var slots = 4;
      for (var sl = 0; sl < slots; sl++) {
        var slotX = dockX + 16 + sl * ((dockW - 32) / slots);
        ctx.fillStyle = darkMode ? 'rgba(61,255,122,0.08)' : 'rgba(0,122,61,0.08)';
        roundRect(slotX, DOCK_Y + 12, (dockW - 32) / slots - 8, 32, 8);
        ctx.fill();
        ctx.strokeStyle = termDim;
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = term;
        ctx.font = '14px ui-monospace, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('⬡', slotX + ((dockW - 32) / slots - 8) * 0.5, DOCK_Y + 32);
      }
    }

    for (var pi = 0; pi < particles.length; pi++) {
      var p = particles[pi];
      ctx.fillStyle = p.color || term;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state === 'playing' && sunrise > 0.7) {
      ctx.fillStyle = sun;
      ctx.globalAlpha = (sunrise - 0.7) * 2;
      ctx.font = '10px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('☀ sunrise approaching', W * 0.5, 78);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function handleTap(clientX, clientY) {
    if (state === 'title' || state === 'gameover') return;
    if (state !== 'playing') return;
    initAudio();

    var rect = canvas.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;

    var hit = findAgentAt(x, y);
    if (hit) {
      rerouteAgent(hit);
      return;
    }
    deployAgent(x, y);
  }

  function onPointerDown(e) {
    try { e.preventDefault(); } catch (err) {}
    if (state === 'playing') handleTap(e.clientX, e.clientY);
  }

  function onKeyDown(e) {
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'title') startGame();
      else if (state === 'gameover') startGame();
      else if (state === 'playing') deployAgent(W * 0.5, H * 0.5);
    }
  }

  if (btnStart) btnStart.addEventListener('click', function (e) {
    e.stopPropagation();
    startGame();
  });
  if (btnRestart) btnRestart.addEventListener('click', function (e) {
    e.stopPropagation();
    startGame();
  });

  if (canvas) {
    canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  }
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', resize);

  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        darkMode = prefersDark();
      });
    } catch (e) {}
  }

  resize();
  draw();

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
