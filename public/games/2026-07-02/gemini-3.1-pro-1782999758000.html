<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Gov.Contract</title>
    <style>
        :root {
            --bg: #e6f0fa;
            --text: #446688;
            --overlay: rgba(255, 255, 255, 0.95);
            --border: #0055aa;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0c1b33;
                --text: #cce0ff;
                --overlay: rgba(12, 27, 51, 0.95);
                --border: #55ccff;
            }
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .screen {
            pointer-events: auto;
            background: var(--overlay);
            color: var(--text);
            padding: 2.5rem;
            border: 2px solid var(--border);
            text-align: center;
            max-width: 85%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            margin: 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        .score-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #cc3333;
        }

        button {
            background: #cc3333;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.1s, filter 0.1s;
        }

        button:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="ui-layer">
        <div id="start-screen" class="screen">
            <h1>GOV.CONTRACT</h1>
            <p>Connect all checkpoints in one unbroken line before the deadline.</p>
            <p>Drag or use Arrow Keys.</p>
            <button data-smoke="start" onclick="startGame()">SIGN & START</button>
        </div>
        <div id="game-over-screen" class="screen" style="display: none;">
            <h1>CONTRACT EXPIRED</h1>
            <p class="score-text" id="score-display"></p>
            <button data-smoke="restart" onclick="startGame()">RESTART</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let cw = 0, ch = 0;

        let state = 'START'; // START, PLAYING, LEVEL_TRANSITION, GAMEOVER
        let level = 1;
        let score = 0;
        let numNodes = 4;
        let grid = null;
        let path = [];
        let maxTime = 10;
        let timeRemaining = 10;
        let lastTime = performance.now();
        let isDragging = false;
        let unbroken = true;
        let particles = [];
        let levelTransitionTimer = 0;

        function resize() {
            canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
            canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
            cw = canvas.width;
            ch = canvas.height;
        }
        window.addEventListener('resize', resize);
        resize();

        function generateLevel(nodesCount) {
            let size = Math.ceil(Math.sqrt(nodesCount)) + 1;
            if (size < 3) size = 3;
            if (size > 7) size = 7;
            
            let pathArr = [];
            let visited = new Set();
            const k = (x, y) => `${x},${y}`;
            
            function dfs(x, y) {
                if (pathArr.length === nodesCount) return true;
                
                let dirs = [[1,0], [-1,0], [0,1], [0,-1]];
                for(let i = dirs.length - 1; i > 0; i--){
                    const j = Math.floor(Math.random() * (i + 1));
                    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
                }
                
                for (let d of dirs) {
                    let nx = x + d[0], ny = y + d[1];
                    if (nx >= 0 && nx < size && ny >= 0 && ny < size && !visited.has(k(nx, ny))) {
                        visited.add(k(nx, ny));
                        pathArr.push({x: nx, y: ny});
                        if (dfs(nx, ny)) return true;
                        pathArr.pop();
                        visited.delete(k(nx, ny));
                    }
                }
                return false;
            }
            
            let attempts = 0;
            while (attempts < 1000) {
                attempts++;
                let sx = Math.floor(Math.random() * size);
                let sy = Math.floor(Math.random() * size);
                pathArr = [{x: sx, y: sy}];
                visited = new Set([k(sx, sy)]);
                if (dfs(sx, sy)) break;
            }
            
            if (pathArr.length < nodesCount) {
                pathArr = [];
                for (let i = 0; i < nodesCount; i++) {
                    pathArr.push({x: i % size, y: Math.floor(i / size)});
                }
            }
            
            let minX = size, maxX = 0, minY = size, maxY = 0;
            pathArr.forEach(p => {
                if(p.x < minX) minX = p.x;
                if(p.x > maxX) maxX = p.x;
                if(p.y < minY) minY = p.y;
                if(p.y > maxY) maxY = p.y;
            });
            
            let w = maxX - minX + 1;
            let h = maxY - minY + 1;
            
            let generatedNodes = pathArr.map(p => ({
                x: p.x - minX,
                y: p.y - minY
            }));
            
            let startNode = generatedNodes[0];
            startNode.isStart = true;
            
            // Shuffle so rendering order doesn't reveal path
            generatedNodes.sort(() => Math.random() - 0.5);
            
            return { w, h, nodes: generatedNodes };
        }

        // Initialize background preview
        grid = generateLevel(numNodes);

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('ui-layer').style.pointerEvents = 'none';
            
            level = 0;
            score = 0;
            nextLevel(true);
        }

        function nextLevel(initial = false) {
            if (!initial) {
                level++;
                score++;
                if (navigator.vibrate) navigator.vibrate(50);
            } else {
                level = 1;
                score = 0;
            }
            numNodes = Math.min(25, 3 + level);
            maxTime = numNodes * Math.max(0.6, 2.0 - level * 0.1);
            timeRemaining = maxTime;
            grid = generateLevel(numNodes);
            path = [];
            isDragging = false;
            unbroken = true;
            particles = [];
            state = 'PLAYING';
            lastTime = performance.now();
        }

        function gameOver() {
            state = 'GAMEOVER';
            document.getElementById('ui-layer').style.pointerEvents = 'auto';
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('score-display').innerText = `CONTRACTS SEALED: ${score}`;
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function spawnFireworks() {
            let lastNode = grid.nodes[path[path.length - 1]];
            let cx = grid.offsetX + lastNode.x * grid.cellSize;
            let cy = grid.offsetY + lastNode.y * grid.cellSize;
            for (let i = 0; i < 40; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 50 + Math.random() * 200;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0 + Math.random() * 0.5,
                    color: Math.random() > 0.5 ? '#cc3333' : '#ffaa00'
                });
            }
        }

        function getHitNode(px, py) {
            if (!grid) return null;
            for (let i = 0; i < grid.nodes.length; i++) {
                let n = grid.nodes[i];
                let cx = grid.offsetX + n.x * grid.cellSize;
                let cy = grid.offsetY + n.y * grid.cellSize;
                let dist = Math.hypot(px - cx, py - cy);
                if (dist < grid.cellSize * 0.45) {
                    return { index: i, node: n };
                }
            }
            return null;
        }

        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function checkLevelComplete() {
            if (path.length === numNodes) {
                state = 'LEVEL_TRANSITION';
                levelTransitionTimer = 0.4;
                if (unbroken) spawnFireworks();
                if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
                isDragging = false;
            }
        }

        function handleStart(e) {
            if (e.target.tagName === 'BUTTON') return; // let UI buttons work naturally
            if (state !== 'PLAYING') return;
            e.preventDefault();
            
            let pos = getEventPos(e);
            let hit = getHitNode(pos.x, pos.y);
            
            if (hit) {
                if (path.length === 0) {
                    if (hit.node.isStart) {
                        hit.node.stampedTime = performance.now();
                        path.push(hit.index);
                        isDragging = true;
                        unbroken = true;
                        if (navigator.vibrate) navigator.vibrate(10);
                        checkLevelComplete();
                    }
                } else {
                    if (hit.index === path[path.length - 1]) {
                        isDragging = true;
                    }
                }
            }
        }

        function handleMove(e) {
            if (!isDragging || state !== 'PLAYING') return;
            e.preventDefault();
            
            let pos = getEventPos(e);
            let hit = getHitNode(pos.x, pos.y);
            
            if (hit) {
                let lastIdx = path[path.length - 1];
                if (hit.index !== lastIdx) {
                    if (path.includes(hit.index)) {
                        let idxInPath = path.indexOf(hit.index);
                        if (idxInPath === path.length - 2) {
                            path.pop();
                            if (navigator.vibrate) navigator.vibrate(10);
                        } else if (idxInPath < path.length - 1) {
                            let lastNode = grid.nodes[lastIdx];
                            let currNode = hit.node;
                            let dist = Math.abs(lastNode.x - currNode.x) + Math.abs(lastNode.y - currNode.y);
                            if (dist === 1) {
                                path = path.slice(0, idxInPath + 1);
                                if (navigator.vibrate) navigator.vibrate(10);
                            }
                        }
                    } else {
                        let lastNode = grid.nodes[lastIdx];
                        let currNode = hit.node;
                        let dist = Math.abs(lastNode.x - currNode.x) + Math.abs(lastNode.y - currNode.y);
                        if (dist === 1) {
                            hit.node.stampedTime = performance.now();
                            path.push(hit.index);
                            if (navigator.vibrate) navigator.vibrate(15);
                            checkLevelComplete();
                        }
                    }
                }
            }
        }

        function handleEnd(e) {
            if (state !== 'PLAYING') return;
            isDragging = false;
            unbroken = false;
        }

        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd, {passive: false});
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);

        window.addEventListener('keydown', (e) => {
            if (state !== 'PLAYING') return;
            
            if (path.length === 0) {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                    let startIdx = grid.nodes.findIndex(n => n.isStart);
                    if (startIdx >= 0) {
                        grid.nodes[startIdx].stampedTime = performance.now();
                        path.push(startIdx);
                        isDragging = true;
                        unbroken = true;
                        checkLevelComplete();
                    }
                }
                return;
            }
            
            let dx = 0, dy = 0;
            if (e.key === 'ArrowUp' || e.key === 'w') dy = -1;
            else if (e.key === 'ArrowDown' || e.key === 's') dy = 1;
            else if (e.key === 'ArrowLeft' || e.key === 'a') dx = -1;
            else if (e.key === 'ArrowRight' || e.key === 'd') dx = 1;
            
            if (dx !== 0 || dy !== 0) {
                e.preventDefault();
                let lastIdx = path[path.length - 1];
                let lastNode = grid.nodes[lastIdx];
                let targetX = lastNode.x + dx;
                let targetY = lastNode.y + dy;
                
                let targetIdx = grid.nodes.findIndex(n => n.x === targetX && n.y === targetY);
                if (targetIdx !== -1) {
                    if (path.length > 1 && targetIdx === path[path.length - 2]) {
                        path.pop();
                        if (navigator.vibrate) navigator.vibrate(10);
                    }
                    else if (!path.includes(targetIdx)) {
                        grid.nodes[targetIdx].stampedTime = performance.now();
                        path.push(targetIdx);
                        if (navigator.vibrate) navigator.vibrate(15);
                        checkLevelComplete();
                    }
                }
            }
        });

        function loop(time) {
            let dt = (time - lastTime) / 1000;
            lastTime = time;
            
            if (state === 'PLAYING') {
                timeRemaining -= dt;
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    gameOver();
                }
            } else if (state === 'LEVEL_TRANSITION') {
                levelTransitionTimer -= dt;
                if (levelTransitionTimer <= 0) {
                    nextLevel();
                }
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 400 * dt; // gravity
                p.life -= dt * 1.5;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            render(time);
            requestAnimationFrame(loop);
        }

        function render(now) {
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const bgCol = isDark ? '#0c1b33' : '#e6f0fa';
            const gridLineCol = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
            const gridMajorCol = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
            const textCol = isDark ? '#88aadd' : '#446688';
            const stampCol = '#cc3333';
            const lineCol = isDark ? '#55ccff' : '#0055aa';
            const nodeCol = isDark ? '#1a365d' : '#cce0ff';
            const startCol = '#ffaa00';

            ctx.fillStyle = bgCol;
            ctx.fillRect(0, 0, cw, ch);
            
            // Draw background grid
            let gridSpacing = 30;
            ctx.lineWidth = 1;
            ctx.strokeStyle = gridLineCol;
            ctx.beginPath();
            for (let x = 0; x < cw; x += gridSpacing) { ctx.moveTo(x, 0); ctx.lineTo(x, ch); }
            for (let y = 0; y < ch; y += gridSpacing) { ctx.moveTo(0, y); ctx.lineTo(cw, y); }
            ctx.stroke();
            
            ctx.strokeStyle = gridMajorCol;
            ctx.beginPath();
            for (let x = 0; x < cw; x += gridSpacing * 4) { ctx.moveTo(x, 0); ctx.lineTo(x, ch); }
            for (let y = 0; y < ch; y += gridSpacing * 4) { ctx.moveTo(0, y); ctx.lineTo(cw, y); }
            ctx.stroke();

            if (grid) {
                let cellSize = Math.min(cw / (grid.w + 2), ch / (grid.h + 4));
                if (cellSize > 100) cellSize = 100;
                let offsetX = (cw - (grid.w - 1) * cellSize) / 2;
                let offsetY = (ch - (grid.h - 1) * cellSize) / 2 + 20; // push down slightly for UI
                grid.cellSize = cellSize;
                grid.offsetX = offsetX;
                grid.offsetY = offsetY;
                
                // Draw path lines
                if (path.length > 0) {
                    ctx.beginPath();
                    let first = grid.nodes[path[0]];
                    ctx.moveTo(offsetX + first.x * cellSize, offsetY + first.y * cellSize);
                    for (let i = 1; i < path.length; i++) {
                        let n = grid.nodes[path[i]];
                        ctx.lineTo(offsetX + n.x * cellSize, offsetY + n.y * cellSize);
                    }
                    ctx.globalAlpha = 0.85;
                    ctx.lineWidth = cellSize * 0.25;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.strokeStyle = lineCol;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }
                
                // Draw nodes
                for (let i = 0; i < grid.nodes.length; i++) {
                    let n = grid.nodes[i];
                    let cx = offsetX + n.x * cellSize;
                    let cy = offsetY + n.y * cellSize;
                    let isVisited = path.includes(i);
                    
                    if (isVisited) {
                        let age = (now - (n.stampedTime || now)) / 200; 
                        if (age > 1) age = 1;
                        
                        ctx.beginPath();
                        ctx.arc(cx, cy, cellSize * 0.25, 0, Math.PI * 2);
                        ctx.fillStyle = stampCol;
                        ctx.globalAlpha = age;
                        ctx.fill();
                        
                        ctx.fillStyle = '#fff';
                        ctx.font = `${cellSize*0.25}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText("★", cx, cy + Math.max(1, cellSize*0.02));
                        ctx.globalAlpha = 1.0;
                    } else {
                        if (n.isStart) {
                            let pulse = Math.sin(now / 150) * 0.1 + 1.1; 
                            ctx.beginPath();
                            ctx.arc(cx, cy, cellSize * 0.25 * pulse, 0, Math.PI * 2);
                            ctx.fillStyle = startCol;
                            ctx.globalAlpha = 0.6;
                            ctx.fill();
                            ctx.globalAlpha = 1.0;
                        }
                        
                        ctx.beginPath();
                        ctx.arc(cx, cy, cellSize * 0.25, 0, Math.PI * 2);
                        ctx.fillStyle = n.isStart ? startCol : nodeCol;
                        ctx.fill();
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = n.isStart ? '#fff' : lineCol;
                        ctx.stroke();
                    }
                }
            }

            if (state === 'PLAYING' || state === 'LEVEL_TRANSITION') {
                let timerHeight = 6;
                let timerWidth = cw * (timeRemaining / maxTime);
                let danger = (timeRemaining / maxTime) < 0.3;
                ctx.fillStyle = danger ? stampCol : lineCol;
                ctx.fillRect(0, 0, timerWidth, timerHeight);
                
                ctx.fillStyle = danger ? stampCol : textCol;
                ctx.font = 'bold 16px ui-monospace, monospace';
                ctx.textAlign = 'left';
                ctx.fillText(`DEADLINE: ${(timeRemaining).toFixed(1)}s`, 15, 30);
                
                ctx.textAlign = 'right';
                ctx.fillText(`CONTRACTS: ${score}`, cw - 15, 30);
            }

            for (let p of particles) {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
