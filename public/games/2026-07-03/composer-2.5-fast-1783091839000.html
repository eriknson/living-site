<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Drop</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef2f7;--fg:#0f1724;--muted:#5a6a7e;
  --neon:#0099aa;--neon2:#cc2255;--neon3:#cc9900;--grid:#c8d4e4;
  --panel:rgba(238,242,247,.92);--btn-bg:#0099aa;--btn-fg:#fff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0e14;--fg:#e8edf4;--muted:#6b7a8f;
    --neon:#00f0ff;--neon2:#ff3366;--neon3:#ffe066;--grid:#1a2840;
    --panel:rgba(10,14,20,.88);--btn-bg:#00f0ff;--btn-fg:#0a0e14;
  }
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eef2f7;--fg:#0f1724;--muted:#5a6a7e;
    --neon:#0099aa;--neon2:#cc2255;--neon3:#cc9900;--grid:#c8d4e4;
    --panel:rgba(238,242,247,.92);--btn-bg:#0099aa;--btn-fg:#fff;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:manipulation}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{flex:1;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hud-value{font-size:18px;font-weight:600;color:var(--neon)}
#combo{color:var(--neon3)}
#timer{color:var(--neon2)}
#layers-bar{position:absolute;top:52px;left:16px;right:16px;height:4px;background:var(--grid);
  border-radius:2px;overflow:hidden;pointer-events:none;z-index:2}
#layers-fill{height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--neon2));transition:width .3s}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:var(--panel);z-index:10;pointer-events:none;
  opacity:1;transition:opacity .4s ease}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none!important}
.overlay h1{font-size:clamp(28px,8vw,42px);letter-spacing:.06em;color:var(--neon);text-shadow:0 0 24px rgba(0,240,255,.4)}
.overlay h2{font-size:clamp(22px,6vw,32px);color:var(--neon2)}
.overlay p{font-size:13px;color:var(--muted);max-width:280px;text-align:center;line-height:1.5}
.overlay .score-big{font-size:32px;color:var(--neon3);margin:4px 0}
.btn{pointer-events:auto;min-height:48px;min-width:160px;padding:14px 32px;border:none;border-radius:4px;
  background:var(--btn-bg);color:var(--btn-fg);font:inherit;font-size:14px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
#feedback{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:20px;font-weight:700;
  pointer-events:none;opacity:0;z-index:5;transition:opacity .2s}
#feedback.show{opacity:1}
#feedback.perfect{color:var(--neon)}
#feedback.good{color:var(--neon3)}
#feedback.miss{color:var(--neon2)}
#feedback.ghost{color:#888}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Score</span><span class="hud-value" id="score">0</span></div>
    <div class="hud-block" style="align-items:center"><span class="hud-label">Combo</span><span class="hud-value" id="combo">×0</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Time</span><span class="hud-value" id="timer">45</span></div>
  </div>
  <div id="layers-bar"><div id="layers-fill"></div></div>
  <div id="feedback"></div>
  <div id="title-screen" class="overlay">
    <h1>STUTTER DROP</h1>
    <p>Tap the silent gaps between chopped beats. Each clean hit layers the track. Miss and the waveform glitches.</p>
    <button class="btn" data-smoke="start" id="btn-start">Drop In</button>
  </div>
  <div id="game-over" class="overlay hidden">
    <h2>DROP ENDED</h2>
    <p class="score-big" id="final-score">0</p>
    <p id="final-detail">Layers synced</p>
    <button class="btn" data-smoke="restart" id="btn-restart">Play Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('gameCanvas');
var ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('score');
var comboEl=document.getElementById('combo');
var timerEl=document.getElementById('timer');
var layersFill=document.getElementById('layers-fill');
var feedbackEl=document.getElementById('feedback');
var titleScreen=document.getElementById('title-screen');
var gameOverScreen=document.getElementById('game-over');
var finalScoreEl=document.getElementById('final-score');
var finalDetailEl=document.getElementById('final-detail');

var W=300,H=500, dpr=1;
var state='title'; // title | playing | over
var score=0, combo=0, maxCombo=0, layers=0, maxLayers=6;
var sessionMs=45000, elapsed=0, timeLeft=45;
var glitchAmt=0, glitchDecay=0;
var particles=[], ripples=[], gridPulse=0;
var audioCtx=null, masterGain=null;
var nextNoteTime=0, beatIndex=0, scheduleAhead=0.15, lookahead=25;
var schedulerTimer=null, rafId=null;
var activeGaps=[], ghostBeats=[];
var bpm=128, stutterFactor=1;
var hits=0, misses=0, perfects=0;
var finalBreakDone=false;
var lightMode=false;
var beatFlash=0, silencePulse=0;

function checkColorScheme(){
  lightMode=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches;
}
checkColorScheme();
if(window.matchMedia){
  try{window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',checkColorScheme);}catch(e){}
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||300;
  H=window.innerHeight||500;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize',resize);

function initAudio(){
  if(audioCtx) return true;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    audioCtx=new AC();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0.35;
    masterGain.connect(audioCtx.destination);
    return true;
  }catch(e){return false;}
}

function playKick(t,vol){
  if(!audioCtx||!masterGain) return;
  try{
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(150,t);
    o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime((vol||0.8)*0.5,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
    o.connect(g);g.connect(masterGain);
    o.start(t);o.stop(t+0.3);
  }catch(e){}
}

function playHat(t,vol){
  if(!audioCtx||!masterGain) return;
  try{
    var bufSize=audioCtx.sampleRate*0.04;
    var buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<bufSize;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,2);
    var src=audioCtx.createBufferSource();
    src.buffer=buf;
    var g=audioCtx.createGain();
    var f=audioCtx.createBiquadFilter();
    f.type='highpass';f.frequency.value=6000;
    g.gain.setValueAtTime((vol||0.4)*0.35,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.04);
    src.connect(f);f.connect(g);g.connect(masterGain);
    src.start(t);src.stop(t+0.05);
  }catch(e){}
}

function playBass(t,note,vol){
  if(!audioCtx||!masterGain||layers<2) return;
  try{
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type='triangle';
    o.frequency.value=note||55;
    g.gain.setValueAtTime((vol||0.5)*0.25,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    o.connect(g);g.connect(masterGain);
    o.start(t);o.stop(t+0.2);
  }catch(e){}
}

function playStab(t,vol){
  if(!audioCtx||!masterGain||layers<3) return;
  try{
    [220,277,330].forEach(function(freq,i){
      var o=audioCtx.createOscillator();
      var g=audioCtx.createGain();
      o.type='square';
      o.frequency.value=freq;
      g.gain.setValueAtTime((vol||0.3)*0.08,t+i*0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      o.connect(g);g.connect(masterGain);
      o.start(t);o.stop(t+0.2);
    });
  }catch(e){}
}

function playArp(t,vol){
  if(!audioCtx||!masterGain||layers<4) return;
  try{
    var notes=[440,523,659,784];
    notes.forEach(function(n,i){
      var o=audioCtx.createOscillator();
      var g=audioCtx.createGain();
      o.type='sawtooth';
      o.frequency.value=n;
      g.gain.setValueAtTime(0,t+i*0.06);
      g.gain.linearRampToValueAtTime((vol||0.25)*0.06,t+i*0.06+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*0.06+0.12);
      o.connect(g);g.connect(masterGain);
      o.start(t+i*0.06);o.stop(t+i*0.06+0.15);
    });
  }catch(e){}
}

function playDrop(t){
  if(!audioCtx||!masterGain) return;
  try{
    playKick(t,1);playKick(t+0.125,0.9);playHat(t+0.0625,0.8);
    playBass(t,55,0.8);playStab(t,0.7);playArp(t,0.6);
    playKick(t+0.25,1);playHat(t+0.1875,0.7);
  }catch(e){}
}

function getBeatDuration(){
  return 60/bpm;
}

function getProgress(){
  return Math.min(1,elapsed/sessionMs);
}

function getStutterWidth(){
  var p=getProgress();
  return 0.08+ p*0.22+(p>0.66?0.12:0);
}

function generatePattern(bi){
  var p=getProgress();
  var bd=getBeatDuration();
  var pattern=[];
  var stutter=getStutterWidth();

  if(p<0.33){
    pattern=[{type:'kick',t:0},{type:'gap',t:bd*0.5,w:bd*0.35,taps:1},{type:'hat',t:bd},{type:'gap',t:bd*1.5,w:bd*0.35,taps:1}];
  }else if(p<0.66){
    pattern=[
      {type:'kick',t:0},{type:'kick',t:bd*stutter*0.5},
      {type:'gap',t:bd*0.55,w:bd*stutter,taps:1},
      {type:'hat',t:bd},{type:'hat',t:bd*1.15},
      {type:'gap',t:bd*1.55,w:bd*stutter,taps:p>0.5?2:1}
    ];
  }else{
    pattern=[
      {type:'kick',t:0},{type:'kick',t:bd*0.08},{type:'kick',t:bd*0.16},
      {type:'gap',t:bd*0.35,w:bd*0.45,taps:2},
      {type:'hat',t:bd*0.7},{type:'hat',t:bd*0.78},
      {type:'gap',t:bd*1.1,w:bd*0.5,taps:1},
      {type:'kick',t:bd*1.65}
    ];
    if(p>0.78&&Math.random()<0.4){
      ghostBeats.push({time:nextNoteTime+bd*0.85,duration:bd*0.2,resolved:false});
    }
  }
  return pattern;
}

function scheduleNote(time,item,bi){
  var bd=getBeatDuration();
  var absTime=time+(item.t||0);
  if(item.type==='kick'){ playKick(absTime,0.7+layers*0.05); beatFlash=1; }
  else if(item.type==='hat'){ playHat(absTime,0.5+layers*0.04); beatFlash=0.7; }
  else if(item.type==='gap'){
    var gapStart=absTime;
    var gapEnd=absTime+(item.w||bd*0.3);
    var gapId=bi+'-'+item.t;
    activeGaps.push({
      id:gapId,start:gapStart,end:gapEnd,
      tapsNeeded:item.taps||1,tapsHit:0,hit:false,missed:false,
      windowStart:gapStart-0.06,windowEnd:gapEnd+0.1
    });
  }
}

function scheduler(){
  if(state!=='playing'||!audioCtx) return;
  while(nextNoteTime<audioCtx.currentTime+scheduleAhead){
    var p=getProgress();
    bpm=128+Math.floor(p*32);
    if(p>0.5&&Math.random()<0.15) bpm+=Math.floor(Math.random()*16-8);
    var bd=getBeatDuration();
    var pattern=generatePattern(beatIndex);
    for(var i=0;i<pattern.length;i++) scheduleNote(nextNoteTime,pattern[i],beatIndex);
    if(layers>=2) playBass(nextNoteTime,55+(beatIndex%4)*12,0.4);
    if(layers>=3&&beatIndex%2===0) playStab(nextNoteTime+0.02,0.35);
    if(layers>=4&&beatIndex%4===2) playArp(nextNoteTime+bd*0.5,0.3);
    nextNoteTime+=bd*2;
    beatIndex++;
    gridPulse=1;
  }
}

function startScheduler(){
  if(!audioCtx) return;
  nextNoteTime=audioCtx.currentTime+0.1;
  beatIndex=0;
  activeGaps=[];
  ghostBeats=[];
  if(schedulerTimer) clearInterval(schedulerTimer);
  schedulerTimer=setInterval(scheduler,lookahead);
}

function stopScheduler(){
  if(schedulerTimer){clearInterval(schedulerTimer);schedulerTimer=null;}
}

function showFeedback(text,cls){
  feedbackEl.textContent=text;
  feedbackEl.className=cls||'';
  feedbackEl.classList.add('show');
  setTimeout(function(){feedbackEl.classList.remove('show');},400);
}

function addLayer(){
  if(layers<maxLayers){
    layers++;
    layersFill.style.width=(layers/maxLayers*100)+'%';
    if(layers===maxLayers) showFeedback('FULL DROP','perfect');
  }
}

function triggerGlitch(){
  glitchAmt=1;
  glitchDecay=0.92;
  combo=0;
  comboEl.textContent='×0';
  if(navigator.vibrate) try{navigator.vibrate(80);}catch(e){}
}

function spawnParticles(x,y,color){
  for(var i=0;i<8;i++){
    particles.push({
      x:x,y:y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-2,
      life:1,color:color||'#00f0ff',size:2+Math.random()*3
    });
  }
}

function spawnRipple(x,y){
  ripples.push({x:x,y:y,r:10,life:1});
}

function resolveGap(gap,quality){
  if(gap.hit||gap.missed) return;
  gap.tapsHit++;
  if(gap.tapsHit>=gap.tapsNeeded){
    gap.hit=true;
    hits++;
    var pts=quality==='perfect'?150:80;
    score+=pts*(1+combo*0.1);
    combo++;
    if(combo>maxCombo) maxCombo=combo;
    scoreEl.textContent=Math.floor(score);
    comboEl.textContent='×'+combo;
    showFeedback(quality==='perfect'?'PERFECT':'GOOD',quality);
    spawnRipple(W*0.5,H*0.55);
    silencePulse=0;
    if(combo%3===0) addLayer();
    if(navigator.vibrate) try{navigator.vibrate(15);}catch(e){}
    if(quality==='perfect') perfects++;
  }
}

function checkGhostTap(t){
  for(var i=0;i<ghostBeats.length;i++){
    var g=ghostBeats[i];
    if(!g.resolved&&t>=g.time-0.05&&t<=g.time+g.duration+0.05){
      g.resolved=true;
      triggerGlitch();
      score=Math.max(0,score-50);
      scoreEl.textContent=Math.floor(score);
      showFeedback('GHOST!','ghost');
      return true;
    }
  }
  return false;
}

function handleTap(clientX,clientY){
  if(state!=='playing') return;
  var t=audioCtx?audioCtx.currentTime:performance.now()/1000;
  spawnParticles(clientX,clientY,lightMode?'#0099aa':'#00f0ff');

  if(audioCtx&&checkGhostTap(t)) return;

  var found=false;
  for(var i=0;i<activeGaps.length;i++){
    var gap=activeGaps[i];
    if(gap.hit||gap.missed) continue;
    if(t>=gap.windowStart&&t<=gap.windowEnd){
      found=true;
      var center=(gap.start+gap.end)/2;
      var dist=Math.abs(t-center);
      var half=(gap.end-gap.start)/2;
      var quality=dist<half*0.35?'perfect':'good';
      resolveGap(gap,quality);
      break;
    }
  }

  if(!found){
    var onBeat=false;
    for(var j=0;j<activeGaps.length;j++){
      var g2=activeGaps[j];
      if(!g2.hit&&!g2.missed&&t<g2.windowStart&&t>g2.windowStart-0.12){
        onBeat=true;break;
      }
    }
    if(onBeat||!found){
      misses++;
      triggerGlitch();
      score=Math.max(0,score-30);
      scoreEl.textContent=Math.floor(score);
      showFeedback('MISS','miss');
    }
  }
}

function updateGaps(){
  if(!audioCtx||state!=='playing') return;
  var t=audioCtx.currentTime;
  for(var i=0;i<activeGaps.length;i++){
    var gap=activeGaps[i];
    if(!gap.hit&&!gap.missed&&t>gap.windowEnd){
      gap.missed=true;
      misses++;
      triggerGlitch();
      showFeedback('MISS','miss');
    }
  }
  activeGaps=activeGaps.filter(function(g){return (!g.missed&&!g.hit)||t-g.end<0.5;}).slice(-24);
  ghostBeats=ghostBeats.filter(function(g){return t-g.time<2;});
}

function update(dt){
  if(state!=='playing') return;
  elapsed+=dt*1000;
  timeLeft=Math.max(0,Math.ceil((sessionMs-elapsed)/1000));
  timerEl.textContent=timeLeft;
  updateGaps();

  if(glitchAmt>0){
    glitchAmt*=glitchDecay;
    if(glitchAmt<0.01) glitchAmt=0;
  }
  gridPulse*=0.92;
  beatFlash*=0.85;

  var nowT=audioCtx?audioCtx.currentTime:0;
  silencePulse=0;
  for(var gi=0;gi<activeGaps.length;gi++){
    var ag=activeGaps[gi];
    if(!ag.hit&&!ag.missed&&nowT>=ag.start&&nowT<=ag.end){
      silencePulse=0.5+0.5*Math.sin((nowT-ag.start)/(ag.end-ag.start)*Math.PI);
    }
  }

  var p=getProgress();
  if(p>0.88&&!finalBreakDone&&layers>=3){
    finalBreakDone=true;
    if(audioCtx) playDrop(audioCtx.currentTime+0.05);
    showFeedback('FINAL BREAK!','perfect');
    for(var i=0;i<30;i++){
      particles.push({
        x:W*0.5+(Math.random()-0.5)*W*0.8,y:H*0.5+(Math.random()-0.5)*H*0.4,
        vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,
        life:1,color:lightMode?'#cc2255':'#ff3366',size:3+Math.random()*4
      });
    }
  }

  if(elapsed>=sessionMs) endGame();

  for(var i=particles.length-1;i>=0;i--){
    var pt=particles[i];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.15;pt.life-=0.025;
    if(pt.life<=0) particles.splice(i,1);
  }
  for(var j=ripples.length-1;j>=0;j--){
    ripples[j].r+=4;ripples[j].life-=0.03;
    if(ripples[j].life<=0) ripples.splice(j,1);
  }
}

function drawWaveform(wy,wh,t){
  var segments=80;
  var amp=18+layers*4;
  var bg=lightMode?'#c8d4e4':'#1a2840';
  var c1=lightMode?'#0099aa':'#00f0ff';
  var c2=lightMode?'#cc2255':'#ff3366';

  ctx.fillStyle=bg;
  ctx.fillRect(16,wy, W-32, wh);

  ctx.strokeStyle=c1;
  ctx.lineWidth=2;
  ctx.beginPath();
  for(var i=0;i<=segments;i++){
    var x=16+(W-32)*i/segments;
    var phase=t*0.003+i*0.25+beatIndex*0.1;
    var y=wy+wh/2+Math.sin(phase)*amp;
    if(layers>=2) y+=Math.sin(phase*2.3)*amp*0.3;
    if(layers>=4) y+=Math.sin(phase*0.7)*amp*0.5;
    if(glitchAmt>0) y+=(Math.random()-0.5)*glitchAmt*30;
    if(i===0) ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();

  if(layers>=3){
    ctx.strokeStyle=c2;
    ctx.globalAlpha=0.6;
    ctx.beginPath();
    for(var j=0;j<=segments;j++){
      var x2=16+(W-32)*j/segments;
      var ph2=t*0.004+j*0.18;
      var y2=wy+wh/2+Math.cos(ph2)*amp*0.7;
      if(glitchAmt>0) y2+=(Math.random()-0.5)*glitchAmt*20;
      if(j===0) ctx.moveTo(x2,y2);else ctx.lineTo(x2,y2);
    }
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  if(glitchAmt>0.3){
    ctx.fillStyle='rgba(255,51,102,'+(glitchAmt*0.3)+')';
    for(var k=0;k<5;k++){
      ctx.fillRect(16,wy+Math.random()*wh,W-32,2);
    }
  }
}

function drawDancefloor(t){
  var floorTop=H*0.42;
  var floorH=H-floorTop;
  var horizon=floorTop+floorH*0.15;
  var gridC=lightMode?'#0099aa':'#00f0ff';
  var gridDim=lightMode?'rgba(0,153,170,0.15)':'rgba(0,240,255,0.12)';

  ctx.fillStyle=lightMode?'#dce4ef':'#0d1219';
  ctx.fillRect(0,floorTop,W,floorH);

  var pulse=0.3+gridPulse*0.7;
  ctx.strokeStyle=gridDim;
  ctx.lineWidth=1;

  var lines=12;
  for(var i=0;i<lines;i++){
    var prog=i/lines;
    var y=horizon+(floorH-horizon*0.3)*prog*prog;
    var alpha=0.15+prog*0.5+pulse*0.2;
    ctx.globalAlpha=alpha;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  var vanX=W/2;
  for(var j=-8;j<=8;j++){
    var xOff=j*40;
    ctx.globalAlpha=0.2+Math.abs(j)/8*0.3+pulse*0.15;
    ctx.beginPath();
    ctx.moveTo(vanX+xOff*0.1,horizon);
    ctx.lineTo(vanX+xOff*2,floorTop+floorH);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  ctx.strokeStyle=gridC;
  ctx.lineWidth=1.5+gridPulse*2;
  ctx.globalAlpha=0.5+pulse*0.5;
  ctx.beginPath();
  ctx.moveTo(0,horizon);
  ctx.lineTo(W,horizon);
  ctx.stroke();
  ctx.globalAlpha=1;

  var now=audioCtx?audioCtx.currentTime:0;
  for(var g=0;g<activeGaps.length;g++){
    var gap=activeGaps[g];
    if(gap.hit||gap.missed) continue;
    if(now>=gap.start-0.2&&now<=gap.end+0.2){
      var gapProg=(now-gap.start)/(gap.end-gap.start);
      var gx=vanX;
      var gy=horizon+30+Math.sin(t*0.008)*5;
      var ringR=Math.max(4,20+Math.max(0,gapProg)*40);
      ctx.strokeStyle=lightMode?'#cc9900':'#ffe066';
      ctx.lineWidth=2;
      ctx.globalAlpha=0.4+Math.sin(t*0.02)*0.2;
      ctx.beginPath();
      ctx.arc(gx,gy,ringR,0,Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha=1;
    }
  }

  for(var gi=0;gi<ghostBeats.length;gi++){
    var gb=ghostBeats[gi];
    if(gb.resolved) continue;
    if(now>=gb.time-0.3&&now<=gb.time+gb.duration+0.3){
      var gx2=W*0.5+(gi%2===0?-60:60);
      var gy2=horizon+50;
      ctx.strokeStyle=lightMode?'#888':'#555';
      ctx.lineWidth=1.5;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.arc(gx2,gy2,18,0,Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function draw(){
  var t=performance.now();
  var bg=lightMode?'#eef2f7':'#0a0e14';
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  if(glitchAmt>0.5){
    ctx.save();
    ctx.translate((Math.random()-0.5)*glitchAmt*8,(Math.random()-0.5)*glitchAmt*4);
  }

  drawWaveform(70,55,t);

  if(silencePulse>0&&state==='playing'){
    var nowT=audioCtx?audioCtx.currentTime:0;
    ctx.fillStyle=lightMode?'rgba(204,153,0,'+(silencePulse*0.12)+')':'rgba(255,224,102,'+(silencePulse*0.15)+')';
    ctx.fillRect(0,H*0.35,W,H*0.3);
    ctx.strokeStyle=lightMode?'rgba(204,153,0,'+(silencePulse*0.7)+')':'rgba(255,224,102,'+(silencePulse*0.8)+')';
    ctx.lineWidth=3;
    ctx.strokeRect(W*0.2,H*0.42,W*0.6,H*0.16);
    ctx.fillStyle=lightMode?'#cc9900':'#ffe066';
    ctx.font='11px ui-monospace,Menlo,monospace';
    ctx.textAlign='center';
    ctx.globalAlpha=silencePulse;
    var tapHint=activeGaps.some(function(g){return !g.hit&&!g.missed&&g.tapsNeeded>1&&nowT>=g.start&&nowT<=g.end;})?'DOUBLE TAP':'TAP NOW';
    ctx.fillText(tapHint,W/2,H*0.52);
    ctx.globalAlpha=1;
  }

  if(beatFlash>0.05){
    ctx.fillStyle=lightMode?'rgba(0,153,170,'+(beatFlash*0.08)+')':'rgba(0,240,255,'+(beatFlash*0.1)+')';
    ctx.fillRect(0,0,W,130);
  }

  drawDancefloor(t);

  for(var i=0;i<ripples.length;i++){
    var r=ripples[i];
    ctx.strokeStyle=lightMode?'rgba(0,153,170,'+(r.life*0.6)+')':'rgba(0,240,255,'+(r.life*0.6)+')';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(r.x,r.y,Math.max(1,r.r),0,Math.PI*2);
    ctx.stroke();
  }

  for(var j=0;j<particles.length;j++){
    var p=particles[j];
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,Math.max(0.5,p.size),0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  if(state==='playing'){
    var p2=getProgress();
    ctx.fillStyle=lightMode?'rgba(15,23,36,0.5)':'rgba(0,0,0,0.35)';
    ctx.fillRect(0,H*0.38,W,24);
    ctx.fillStyle=lightMode?'#5a6a7e':'#6b7a8f';
    ctx.font='10px ui-monospace,Menlo,monospace';
    ctx.textAlign='center';
    var hint=p2<0.33?'TAP THE SILENCE':p2<0.66?'STUTTER WIDENS':'DOUBLE-TAPS & GHOSTS';
    ctx.fillText(hint,W/2,H*0.38+16);
  }

  if(glitchAmt>0.5) ctx.restore();
}

var lastTime=performance.now();
function loop(now){
  var dt=(now-lastTime)/1000;
  lastTime=now;
  if(dt>0.1) dt=0.1;
  update(dt);
  draw();
  rafId=requestAnimationFrame(loop);
}
rafId=requestAnimationFrame(loop);

function resetGame(){
  score=0;combo=0;maxCombo=0;layers=0;hits=0;misses=0;perfects=0;
  elapsed=0;timeLeft=45;glitchAmt=0;finalBreakDone=false;
  activeGaps=[];ghostBeats=[];particles=[];ripples=[];
  scoreEl.textContent='0';
  comboEl.textContent='×0';
  timerEl.textContent='45';
  layersFill.style.width='0%';
}

function startGame(){
  resetGame();
  initAudio();
  if(audioCtx&&audioCtx.state==='suspended'){
    audioCtx.resume().catch(function(){});
  }
  state='playing';
  titleScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  startScheduler();
}

function endGame(){
  if(state!=='playing') return;
  state='over';
  stopScheduler();
  finalScoreEl.textContent=Math.floor(score);
  finalDetailEl.textContent=layers+'/'+maxLayers+' layers · '+perfects+' perfect · ×'+maxCombo+' best combo';
  gameOverScreen.classList.remove('hidden');
}

document.getElementById('btn-start').addEventListener('click',function(e){
  e.stopPropagation();
  startGame();
});

document.getElementById('btn-restart').addEventListener('click',function(e){
  e.stopPropagation();
  startGame();
});

function onPointer(e){
  if(state!=='playing') return;
  e.preventDefault();
  var x,y;
  if(e.touches&&e.touches.length){
    x=e.touches[0].clientX;y=e.touches[0].clientY;
  }else{
    x=e.clientX;y=e.clientY;
  }
  handleTap(x,y);
}

canvas.addEventListener('touchstart',onPointer,{passive:false});
canvas.addEventListener('mousedown',onPointer);

document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&state==='playing'){
    e.preventDefault();
    handleTap(W*0.5,H*0.55);
  }
});

document.body.addEventListener('touchstart',function(e){
  if(state==='title'||state==='over') return;
  var t=e.target;
  if(t&&t.tagName==='BUTTON') return;
},{passive:true});

})();
</script>
