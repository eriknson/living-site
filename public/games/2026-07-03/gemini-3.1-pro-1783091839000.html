<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OOM KILLER</title>
<style>
  :root {
    --bg: #111111;
    --fg: #4af626;
    --alert: #ff2a2a;
    --dim: #225522;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --fg: #4af626;
      --alert: #ff2a2a;
      --dim: #225522;
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f4f0;
      --fg: #0a5c0a;
      --alert: #cc0000;
      --dim: #aaccbb;
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none; user-select: none; -webkit-user-select: none;
    text-shadow: 0 0 2px var(--fg);
  }
  #game-container { position: relative; width: 100dvw; height: 100dvh; }
  canvas { display: block; width: 100%; height: 100%; z-index: 1; position: absolute; top: 0; left: 0; }
  #crt-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 100;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
    background-size: 100% 4px;
  }
  @media (prefers-color-scheme: dark) {
    #crt-overlay { opacity: 1; }
    body { text-shadow: 0 0 2px var(--fg); }
  }
  @media (prefers-color-scheme: light) {
    #crt-overlay { opacity: 0.3; }
    body { text-shadow: none; }
  }
  .ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 20;
  }
  .screen {
    background: var(--bg); border: 2px solid var(--fg); padding: 2rem;
    text-align: center; pointer-events: auto; max-width: 80%; width: 300px;
    box-shadow: 0 0 20px var(--dim), inset 0 0 10px var(--dim);
  }
  h1 { margin-top: 0; font-size: 2rem; text-shadow: 2px 2px 0px var(--dim); letter-spacing: 2px; }
  p { line-height: 1.5; margin: 10px 0; font-size: 0.9rem; }
  button {
    border: 2px solid var(--fg); background: var(--bg); color: var(--fg);
    padding: 15px 30px; font-size: 1.2rem; font-family: inherit; font-weight: bold;
    text-transform: uppercase; cursor: pointer; margin-top: 1rem;
    transition: all 0.1s; pointer-events: auto;
    box-shadow: 4px 4px 0px var(--dim);
    width: 100%;
  }
  button:active {
    background: var(--fg); color: var(--bg); box-shadow: 0px 0px 0px var(--dim); transform: translate(4px, 4px);
  }
  .hud-top {
    position: absolute; top: 0; left: 0; width: 100%; padding: 15px; box-sizing: border-box;
    pointer-events: none; z-index: 15; display: none;
  }
  .hud-bottom {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 90px; display: none;
    pointer-events: none; border-top: 2px solid var(--fg); z-index: 15; background: var(--bg);
  }
  .zone {
    flex: 1; display: flex; justify-content: center; align-items: center;
    font-size: 2rem; font-weight: bold; transition: color 0.1s, background 0.1s;
  }
  .zone:first-child { border-right: 2px solid var(--fg); }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="crt-overlay"></div>
  
  <div class="hud-top" id="hud-top">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 1.1rem;">
      <span id="wave-text">WAVE 1</span>
      <span id="queue-text">QUEUE: 20</span>
    </div>
    <div style="width: 100%; height: 24px; border: 2px solid var(--fg); position: relative; background: var(--dim);">
      <div id="oom-fill" style="width: 0%; height: 100%; background: var(--fg); transition: width 0.1s, background 0.2s;"></div>
    </div>
    <div style="text-align: center; font-size: 0.9rem; margin-top: 8px; letter-spacing: 2px;">OOM_KILLER_PROG</div>
  </div>

  <div class="hud-bottom" id="hud-bottom">
    <div class="zone" id="zone-left">KEEP</div>
    <div class="zone" id="zone-right">DROP</div>
  </div>

  <div class="ui-layer">
    <div id="start-screen" class="screen">
      <h1>OOM KILLER</h1>
      <p>Sort memory pages before OOM maxes out.</p>
      <p>Swipe LEFT or RIGHT to sort the lowest page.</p>
      <p>Heavy pages [===] need TWO swipes.</p>
      <button data-smoke="start" id="btn-start">START_SYS</button>
    </div>

    <div id="game-over-screen" class="screen" style="display:none;">
      <h1 style="color: var(--alert)">SYS CRASH</h1>
      <p>OUT OF MEMORY</p>
      <p id="final-score" style="font-size: 1.2rem; font-weight: bold; margin: 20px 0;">WAVES CLEARED: 0</p>
      <button data-smoke="restart" id="btn-restart">REBOOT_SYS</button>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  
  let theme = { bg: '#111', fg: '#4af626', alert: '#ff2a2a', dim: '#225' };
  function updateTheme() {
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (isDark) {
      theme = { bg: '#111111', fg: '#4af626', alert: '#ff2a2a', dim: '#225522' };
    } else {
      theme = { bg: '#f0f4f0', fg: '#0a5c0a', alert: '#cc0000', dim: '#aaccbb' };
    }
  }
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
  }
  updateTheme();

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Audio
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;
  function initAudio() {
    try {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
  }
  function playTone(freq, type, duration, vol=0.1) {
    try {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }
  function playSound(name) {
    switch(name) {
      case 'swipe': playTone(300, 'sine', 0.1, 0.05); break;
      case 'crack': playTone(150, 'square', 0.1, 0.1); break;
      case 'correct': playTone(600, 'sine', 0.15, 0.05); setTimeout(()=>playTone(800, 'sine', 0.15, 0.05), 100); break;
      case 'incorrect': playTone(100, 'sawtooth', 0.3, 0.1); break;
      case 'miss': playTone(80, 'square', 0.4, 0.1); break;
      case 'swap_warn': playTone(400, 'square', 0.1, 0.05); break;
      case 'swap': playTone(200, 'sawtooth', 0.2, 0.1); setTimeout(()=>playTone(150, 'sawtooth', 0.2, 0.1), 100); break;
      case 'gameover': playTone(50, 'sawtooth', 1.0, 0.2); break;
      case 'wave': playTone(400, 'sine', 0.2, 0.1); setTimeout(()=>playTone(600, 'sine', 0.4, 0.1), 200); break;
    }
  }

  // Game State
  let state = 'MENU';
  let lastTime = 0;
  let wave = 1;
  let queue = 0;
  let oom = 0;
  let lanes = { left: 'KEEP', right: 'DROP' };
  let blocks = [];
  let particles = [];
  let shakeTime = 0;
  let swapTimer = 0;
  let swapWarning = 0;
  let spawnTimer = 0;
  let bgScroll = 0;

  // Difficulty
  let fallSpeed = 100;
  let spawnRate = 1.5;
  let heavyChance = 0;
  let oomPassiveRate = 2;

  const KEEP_LABELS = ['SYS_CORE', 'USER_DAT', 'NET_SOCK', 'DB_INDEX', 'SEC_KEYS', 'APP_MAIN'];
  const DROP_LABELS = ['TMP_FILE', 'ZOMBIE_P', 'ORPHAN_C', 'CACHE_0X', 'NULL_PTR', 'MEM_LEAK'];

  function resetGame() {
    wave = 1;
    oom = 0;
    lanes = { left: 'KEEP', right: 'DROP' };
    document.getElementById('zone-left').innerText = lanes.left;
    document.getElementById('zone-right').innerText = lanes.right;
    document.getElementById('zone-left').style.color = theme.fg;
    document.getElementById('zone-right').style.color = theme.fg;
    startWave();
  }

  function startWave() {
    state = 'PLAYING';
    blocks = [];
    particles = [];
    queue = 10 + wave * 5;
    fallSpeed = window.innerHeight * (0.2 + wave * 0.03);
    spawnRate = Math.max(0.5, 1.8 - wave * 0.2);
    heavyChance = Math.min(0.8, (wave - 1) * 0.15);
    oomPassiveRate = 3 + wave * 0.8;
    swapTimer = Math.max(5, 15 - wave * 1);
    swapWarning = 0;
    spawnTimer = 1;
  }

  function spawnBlock() {
    if (queue <= 0) return;
    queue--;
    
    const isKeep = Math.random() > 0.5;
    const isHeavy = Math.random() < heavyChance;
    const labelList = isKeep ? KEEP_LABELS : DROP_LABELS;
    const text = (isKeep ? '+ ' : '- ') + labelList[Math.floor(Math.random() * labelList.length)];
    
    ctx.font = 'bold 16px ui-monospace, monospace';
    const textWidth = ctx.measureText(text).width;
    const width = textWidth + 40;
    const height = 50;
    
    const minX = width / 2 + 10;
    const maxX = canvas.width - width / 2 - 10;
    const x = Math.max(minX, Math.min(maxX, canvas.width / 2 + (Math.random() * 80 - 40)));
    
    blocks.push({
      id: Math.random(),
      type: isKeep ? 'KEEP' : 'DROP',
      text: text,
      heavy: isHeavy,
      swipesLeft: isHeavy ? 2 : 1,
      x: x,
      y: -height,
      width: width,
      height: height,
      vx: 0,
      vy: fallSpeed,
      state: 'FALLING'
    });
  }

  function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 400,
        vy: (Math.random() - 0.5) * 400,
        life: 1.0, color: color,
        size: Math.random() * 4 + 2
      });
    }
  }

  function handleSwipe(dir) {
    if (state !== 'PLAYING') return;
    
    let lowest = null;
    let maxY = -1000;
    for (let b of blocks) {
      if (b.state === 'FALLING' && b.y > maxY) {
        maxY = b.y;
        lowest = b;
      }
    }
    
    if (lowest) {
      if (lowest.heavy && lowest.swipesLeft === 2) {
        lowest.swipesLeft = 1;
        lowest.heavy = false;
        createParticles(lowest.x, lowest.y, 10, theme.fg);
        playSound('crack');
        try { if (navigator.vibrate) navigator.vibrate(20); } catch(e){}
        lowest.y -= 10;
      } else {
        lowest.state = 'SWIPING';
        lowest.vx = dir === 'left' ? -canvas.width * 3 : canvas.width * 3;
        lowest.vy = 0;
        lowest.targetZone = dir === 'left' ? lanes.left : lanes.right;
        playSound('swipe');
        try { if (navigator.vibrate) navigator.vibrate(40); } catch(e){}
      }
    }
  }

  // Input
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') handleSwipe('left');
    if (e.key === 'ArrowRight') handleSwipe('right');
  });

  let touchX = 0, touchY = 0;
  window.addEventListener('touchstart', (e) => {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, {passive: false});

  window.addEventListener('touchmove', (e) => {
    if (state === 'PLAYING') e.preventDefault();
  }, {passive: false});

  window.addEventListener('touchend', (e) => {
    if (state !== 'PLAYING') return;
    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;
    let dx = endX - touchX;
    let dy = endY - touchY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      handleSwipe(dx > 0 ? 'right' : 'left');
    }
  });

  let isDragging = false;
  window.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    isDragging = true;
    touchX = e.clientX;
    touchY = e.clientY;
  });
  window.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    if (state !== 'PLAYING') return;
    let dx = e.clientX - touchX;
    let dy = e.clientY - touchY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      handleSwipe(dx > 0 ? 'right' : 'left');
    }
  });

  // UI Buttons
  document.getElementById('btn-start').addEventListener('click', () => {
    initAudio();
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('hud-top').style.display = 'block';
    document.getElementById('hud-bottom').style.display = 'flex';
    resetGame();
  });

  document.getElementById('btn-restart').addEventListener('click', () => {
    document.getElementById('game-over-screen').style.display = 'none';
    document.getElementById('hud-top').style.display = 'block';
    document.getElementById('hud-bottom').style.display = 'flex';
    resetGame();
  });

  function drawBlock(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    
    if (b.state === 'SWIPING') {
      const skew = b.vx > 0 ? 0.2 : -0.2;
      ctx.transform(1, 0, skew, 1, 0, 0);
    }
    
    ctx.fillStyle = theme.bg;
    ctx.strokeStyle = theme.fg;
    ctx.lineWidth = 2;
    
    ctx.fillRect(-b.width/2, -b.height/2, b.width, b.height);
    ctx.strokeRect(-b.width/2, -b.height/2, b.width, b.height);
    
    if (b.heavy) {
      ctx.lineWidth = 2;
      ctx.strokeRect(-b.width/2 + 4, -b.height/2 + 4, b.width - 8, b.height - 8);
      ctx.save();
      ctx.beginPath();
      ctx.rect(-b.width/2 + 4, -b.height/2 + 4, b.width - 8, b.height - 8);
      ctx.clip();
      ctx.strokeStyle = theme.dim;
      ctx.lineWidth = 2;
      for(let i = -b.width; i < b.width; i += 10) {
        ctx.beginPath();
        ctx.moveTo(i, -b.height/2);
        ctx.lineTo(i + b.height, b.height/2);
        ctx.stroke();
      }
      ctx.restore();
    }
    
    ctx.fillStyle = theme.dim;
    ctx.fillRect(-b.width/2, -b.height/2, b.width, 12);
    ctx.fillStyle = theme.bg;
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`0x${Math.floor(b.id * 10000).toString(16).toUpperCase()}`, 0, -b.height/2 + 6);
    
    ctx.fillStyle = theme.fg;
    ctx.font = 'bold 16px ui-monospace, monospace';
    if (oom > 80 && Math.random() < 0.1) {
      ctx.fillText(b.text, (Math.random()-0.5)*4, (Math.random()-0.5)*4 + 6);
    } else {
      ctx.fillText(b.text, 0, 6);
    }
    
    ctx.restore();
  }

  function loop(timestamp) {
    requestAnimationFrame(loop);
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.1) dt = 0.1;
    
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    bgScroll = (bgScroll + dt * 20) % 40;
    ctx.strokeStyle = theme.dim;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    for(let y = bgScroll; y < canvas.height; y += 40) {
      ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    }
    for(let x = 0; x < canvas.width; x += 40) {
      ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
    }
    ctx.stroke();
    ctx.globalAlpha = 1.0;
    
    let currentShake = 0;
    if (shakeTime > 0) {
      shakeTime -= dt;
      currentShake = 10;
    } else if (state === 'PLAYING' && oom > 80) {
      currentShake = 3;
    }
    
    if (currentShake > 0) {
      ctx.save();
      ctx.translate((Math.random() - 0.5) * currentShake, (Math.random() - 0.5) * currentShake);
    }
    
    if (state === 'PLAYING') {
      oom += oomPassiveRate * dt;
      
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnBlock();
        spawnTimer = spawnRate;
      }
      
      if (swapTimer > 0) {
        swapTimer -= dt;
        if (swapTimer <= 0) swapWarning = 2.0;
      }
      
      if (swapWarning > 0) {
        let prevWarn = swapWarning;
        swapWarning -= dt;
        
        if (Math.floor(prevWarn) > Math.floor(swapWarning)) {
          playSound('swap_warn');
        }
        
        if (Math.floor(swapWarning * 10) % 2 === 0) {
          document.getElementById('zone-left').style.color = theme.alert;
          document.getElementById('zone-right').style.color = theme.alert;
        } else {
          document.getElementById('zone-left').style.color = theme.fg;
          document.getElementById('zone-right').style.color = theme.fg;
        }
        
        if (swapWarning <= 0) {
          let temp = lanes.left;
          lanes.left = lanes.right;
          lanes.right = temp;
          document.getElementById('zone-left').innerText = lanes.left;
          document.getElementById('zone-right').innerText = lanes.right;
          document.getElementById('zone-left').style.color = theme.fg;
          document.getElementById('zone-right').style.color = theme.fg;
          swapTimer = Math.max(5, 15 - wave * 1);
          playSound('swap');
        }
      }
      
      document.getElementById('wave-text').innerText = `WAVE ${wave}`;
      document.getElementById('queue-text').innerText = `QUEUE: ${queue}`;
      const oomFill = document.getElementById('oom-fill');
      oomFill.style.width = `${Math.min(100, oom)}%`;
      
      if (oom > 80) {
        oomFill.style.background = (Math.floor(Date.now() / 100) % 2 === 0) ? theme.alert : theme.bg;
      } else {
        oomFill.style.background = theme.fg;
      }
      
      if (queue <= 0 && blocks.length === 0) {
        state = 'WAVE_TRANSITION';
        playSound('wave');
        setTimeout(() => {
          wave++;
          startWave();
        }, 2000);
      }
      
      if (oom >= 100) {
        state = 'GAMEOVER';
        playSound('gameover');
        document.getElementById('game-over-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `WAVES CLEARED: ${wave - 1}`;
        document.getElementById('hud-top').style.display = 'none';
        document.getElementById('hud-bottom').style.display = 'none';
      }
    }
    
    if (state === 'WAVE_TRANSITION') {
      ctx.fillStyle = theme.fg;
      ctx.font = 'bold 30px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`WAVE ${wave} CLEARED`, canvas.width/2, canvas.height/2);
    }
    
    for (let i = blocks.length - 1; i >= 0; i--) {
      let b = blocks[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      
      if (b.state === 'FALLING') {
        if (b.y + b.height / 2 > canvas.height - 90) {
          oom = Math.min(100, oom + 10);
          createParticles(b.x, b.y, 20, theme.alert);
          blocks.splice(i, 1);
          shakeTime = 0.3;
          playSound('miss');
          try { if (navigator.vibrate) navigator.vibrate([50, 50, 50]); } catch(e){}
        }
      } else if (b.state === 'SWIPING') {
        if (b.x < -b.width || b.x > canvas.width + b.width) {
          if (b.targetZone === b.type) {
            oom = Math.max(0, oom - 6);
            createParticles(b.x > canvas.width ? canvas.width : 0, b.y, 15, theme.fg);
            playSound('correct');
          } else {
            oom = Math.min(100, oom + 15);
            shakeTime = 0.4;
            createParticles(b.x > canvas.width ? canvas.width : 0, b.y, 20, theme.alert);
            playSound('incorrect');
            try { if (navigator.vibrate) navigator.vibrate([100]); } catch(e){}
          }
          blocks.splice(i, 1);
        }
      }
      
      if (blocks[i]) drawBlock(blocks[i]);
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 2;
      if (p.life <= 0) {
        particles.splice(i, 1);
      } else {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1.0;
      }
    }
    
    if (currentShake > 0) {
      ctx.restore();
    }
  }
  
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
