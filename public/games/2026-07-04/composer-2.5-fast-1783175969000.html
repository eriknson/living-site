<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rooftop Drop</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1f24;color:#e8ecf0;font-family:system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:light){html,body{background:#c8cdd2;color:#1a1f24}}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;touch-action:none;user-select:none;display:block;background:#2a3038}
@media(prefers-color-scheme:light){#canvas{background:#b0b8c0}}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;z-index:2}
#hud .block{display:flex;flex-direction:column;gap:4px}
#drop-bar-wrap{width:120px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-top:2px}
@media(prefers-color-scheme:light){#drop-bar-wrap{background:rgba(0,0,0,.12)}}
#drop-bar{height:100%;width:0;background:#00e5c0;border-radius:2px;transition:width .15s ease}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:none;padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(22px,6vw,32px);font-weight:600;letter-spacing:-.02em;margin-bottom:8px;line-height:1.15}
.overlay .sub{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;opacity:.65;max-width:280px;line-height:1.5;margin-bottom:28px;letter-spacing:.04em}
.overlay button{pointer-events:auto;min-height:48px;min-width:160px;padding:14px 32px;border:none;border-radius:6px;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.overlay button:active{transform:scale(.96)}
#title-screen{background:linear-gradient(180deg,rgba(26,31,36,.72) 0%,rgba(26,31,36,.45) 100%)}
@media(prefers-color-scheme:light){#title-screen{background:linear-gradient(180deg,rgba(200,205,210,.82) 0%,rgba(200,205,210,.55) 100%)}}
#title-screen h1{color:#00e5c0;text-shadow:0 0 24px rgba(0,229,192,.35)}
@media(prefers-color-scheme:light){#title-screen h1{color:#008f78;text-shadow:none}}
#btn-start{background:#00e5c0;color:#0a1218;box-shadow:0 0 20px rgba(0,229,192,.4)}
@media(prefers-color-scheme:light){#btn-start{background:#008f78;color:#fff;box-shadow:0 4px 16px rgba(0,143,120,.3)}}
#gameover-screen{background:linear-gradient(180deg,rgba(26,31,36,.85) 0%,rgba(26,31,36,.6) 100%)}
@media(prefers-color-scheme:light){#gameover-screen{background:linear-gradient(180deg,rgba(200,205,210,.9) 0%,rgba(200,205,210,.65) 100%)}}
#go-score{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:clamp(28px,8vw,42px);font-weight:700;margin:12px 0 4px;color:#ff6b35}
#go-label{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;opacity:.6;margin-bottom:8px}
#go-msg{font-size:13px;opacity:.75;margin-bottom:24px;max-width:260px;line-height:1.45}
#btn-restart{background:#ff6b35;color:#fff;box-shadow:0 0 20px rgba(255,107,53,.35)}
@media(prefers-color-scheme:light){#btn-restart{box-shadow:0 4px 16px rgba(255,107,53,.25)}}
#lane-hint{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;opacity:.4;pointer-events:none;letter-spacing:.1em;text-transform:uppercase;z-index:2}
@media (prefers-color-scheme: dark){
html,body{background:#1a1f24;color:#e8ecf0}
#canvas{background:#2a3038}
#drop-bar-wrap{background:rgba(255,255,255,.15)}
#title-screen{background:linear-gradient(180deg,rgba(26,31,36,.72) 0%,rgba(26,31,36,.45) 100%)}
#title-screen h1{color:#00e5c0;text-shadow:0 0 24px rgba(0,229,192,.35)}
#btn-start{background:#00e5c0;color:#0a1218;box-shadow:0 0 20px rgba(0,229,192,.4)}
#gameover-screen{background:linear-gradient(180deg,rgba(26,31,36,.85) 0%,rgba(26,31,36,.6) 100%)}
#btn-restart{box-shadow:0 0 20px rgba(255,107,53,.35)}
}
</style>
</head>
<body>
<div id="wrap">
<canvas id="canvas"></canvas>
<div id="hud">
  <div class="block"><span id="score-label">score 0</span><div id="drop-bar-wrap"><div id="drop-bar"></div></div></div>
  <div class="block" style="align-items:flex-end"><span id="timer-label">0:45</span><span id="combo-label" style="opacity:.5">×1</span></div>
</div>
<div id="title-screen" class="overlay">
  <h1>Rooftop Drop</h1>
  <p class="sub">Catch beat fragments through the fog. Tap left or right to switch lanes. Assemble the full micro-drop before static takes over.</p>
  <button id="btn-start" data-smoke="start">Start Drop</button>
</div>
<div id="gameover-screen" class="overlay hidden">
  <h1 id="go-title">Drop Complete</h1>
  <div id="go-score">0</div>
  <div id="go-label">fragments caught</div>
  <p id="go-msg"></p>
  <button id="btn-restart" data-smoke="restart">Drop Again</button>
</div>
<div id="lane-hint">← tap left &nbsp;·&nbsp; tap right →</div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('score-label');
var timerEl = document.getElementById('timer-label');
var comboEl = document.getElementById('combo-label');
var dropBar = document.getElementById('drop-bar');
var titleScreen = document.getElementById('title-screen');
var gameoverScreen = document.getElementById('gameover-screen');
var goTitle = document.getElementById('go-title');
var goScore = document.getElementById('go-score');
var goMsg = document.getElementById('go-msg');
var laneHint = document.getElementById('lane-hint');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 360, H = 640;
var state = 'title';
var lane = 1;
var laneTarget = 1;
var laneEase = 1;
var score = 0;
var combo = 1;
var comboTimer = 0;
var timeLeft = 45;
var elapsed = 0;
var bpm = 124;
var fog = 0.35;
var fragments = [];
var particles = [];
var dropParts = [0,0,0,0,0];
var dropNames = ['kick','snare','hat','bass','synth'];
var spawnTimer = 0;
var beatPhase = 0;
var shake = 0;
var flash = 0;
var finalHit = false;
var lightMode = false;
var audioCtx = null;
var masterGain = null;
var nextBeat = 0;
var rafId = 0;
var lastTs = 0;
var idleTime = 0;
var popups = [];
var fogWisps = [];
var hitPause = 0;

var COLORS = {
  neon: '#00e5c0',
  accent: '#ff6b35',
  wire: '#5eead4',
  fog: 'rgba(180,190,200,',
  static: '#8899aa'
};

function prefersLight(){
  try{
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  }catch(e){ return false; }
}

function updateTheme(){
  lightMode = prefersLight();
  if(lightMode){
    COLORS.neon = '#008f78';
    COLORS.wire = '#006b5a';
    COLORS.fog = 'rgba(140,150,165,';
    COLORS.static = '#667788';
  }else{
    COLORS.neon = '#00e5c0';
    COLORS.wire = '#5eead4';
    COLORS.fog = 'rgba(180,190,200,';
    COLORS.static = '#8899aa';
  }
}

function resize(){
  if(!canvas) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr,0,0,dpr,0,0);
}

function laneX(l){
  var pad = W * 0.12;
  var usable = W - pad * 2;
  return pad + usable * (l / 2);
}

function initAudio(){
  if(audioCtx) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.35;
    masterGain.connect(audioCtx.destination);
  }catch(e){ audioCtx = null; }
}

function playTone(freq, dur, type, vol, when){
  if(!audioCtx || !masterGain) return;
  try{
    var t = when != null ? when : audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }catch(e){}
}

function playKick(when){
  if(!audioCtx) return;
  try{
    var t = when != null ? when : audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.2);
  }catch(e){}
}

function playStutter(when){
  if(!audioCtx) return;
  try{
    var t = when != null ? when : audioCtx.currentTime;
    for(var i = 0; i < 4; i++){
      playTone(800 + i * 40, 0.04, 'square', 0.06, t + i * 0.035);
    }
  }catch(e){}
}

function playCatch(type){
  var freqs = [80, 200, 600, 110, 440];
  playTone(freqs[type] || 300, 0.08, 'triangle', 0.12);
  playStutter(audioCtx ? audioCtx.currentTime + 0.02 : 0);
}

function playFinalDrop(){
  if(!audioCtx) return;
  try{
    var t = audioCtx.currentTime;
    for(var i = 0; i < 8; i++){
      playKick(t + i * 0.12);
      playTone(220 + i * 30, 0.1, 'sawtooth', 0.08, t + i * 0.12 + 0.06);
    }
    playTone(880, 0.6, 'sine', 0.2, t + 1.0);
  }catch(e){}
}

function scheduleBeat(dt){
  if(!audioCtx || state !== 'playing') return;
  beatPhase += dt * bpm / 60;
  var beatInt = Math.floor(beatPhase);
  if(beatInt > nextBeat){
    nextBeat = beatInt;
    var stutter = (beatInt % 4 === 2) || (elapsed > 30 && beatInt % 2 === 0);
    if(stutter) playStutter();
    else if(beatInt % 4 === 0) playKick();
    else playTone(400, 0.05, 'triangle', 0.06);
  }
}

function initFogWisps(){
  fogWisps = [];
  for(var i = 0; i < 12; i++){
    fogWisps.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.7,
      w: 60 + Math.random() * 100,
      h: 20 + Math.random() * 40,
      sp: 8 + Math.random() * 18,
      a: 0.04 + Math.random() * 0.06
    });
  }
}

function spawnFragment(){
  var lanePick = Math.floor(Math.random() * 3);
  var split = elapsed > 20 && Math.random() < 0.25 + elapsed * 0.005;
  var missing = [];
  for(var m = 0; m < 5; m++) if(!dropParts[m]) missing.push(m);
  var type = missing.length && Math.random() < 0.65
    ? missing[Math.floor(Math.random() * missing.length)]
    : Math.floor(Math.random() * 5);
  var baseSize = Math.max(18, 32 - elapsed * 0.25);
  var speed = 90 + elapsed * 2.5 + Math.sin(beatPhase * Math.PI * 2) * 20;

  fragments.push({
    lane: lanePick,
    y: -40,
    type: type,
    size: baseSize,
    speed: speed,
    life: 1,
    pulse: Math.random() * Math.PI * 2,
    split: split,
    caught: false,
    id: Math.random()
  });

  if(split){
    var otherLane = lanePick === 0 ? 1 : (lanePick === 2 ? 1 : (Math.random() < 0.5 ? 0 : 2));
    fragments.push({
      lane: otherLane,
      y: -55,
      type: type,
      size: baseSize * 0.75,
      speed: speed * 1.1,
      life: 1,
      pulse: Math.random() * Math.PI * 2,
      split: true,
      caught: false,
      id: Math.random()
    });
  }
}

function addParticle(x, y, color){
  for(var i = 0; i < 8; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 80;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 0.4 + Math.random() * 0.3,
      color: color
    });
  }
}

function catchFragment(f){
  if(f.caught) return;
  f.caught = true;
  var isNew = dropParts[f.type] === 0;
  score += Math.round(10 * combo);
  if(isNew){
    dropParts[f.type] = 1;
    combo = Math.min(combo + 1, 8);
    comboTimer = 2;
  }else{
    comboTimer = Math.min(comboTimer + 0.5, 2);
  }
  shake = 0.15;
  flash = 0.08;
  hitPause = 0.04;
  playCatch(f.type);
  addParticle(laneX(f.lane), H * 0.82, COLORS.neon);
  popups.push({
    x: laneX(f.lane),
    y: H * 0.78,
    text: isNew ? dropNames[f.type] : ('+' + Math.round(10 * combo)),
    life: 0.7,
    big: isNew
  });
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
  updateHUD();
}

function missFragment(){
  combo = 1;
  comboTimer = 0;
  score = Math.max(0, score - 5);
  updateHUD();
}

function updateHUD(){
  if(scoreEl) scoreEl.textContent = 'score ' + score;
  if(comboEl) comboEl.textContent = '×' + combo;
  if(dropBar){
    var filled = dropParts.reduce(function(a,b){return a+b;},0);
    dropBar.style.width = (filled / 5 * 100) + '%';
  }
  if(timerEl){
    var s = Math.ceil(timeLeft);
    timerEl.textContent = Math.floor(s/60) + ':' + (s%60<10?'0':'') + (s%60);
  }
}

function resetGame(){
  lane = 1; laneTarget = 1; laneEase = 1;
  score = 0; combo = 1; comboTimer = 0;
  timeLeft = 45; elapsed = 0; bpm = 124; fog = 0.35;
  fragments = []; particles = [];
  dropParts = [0,0,0,0,0];
  spawnTimer = 0; beatPhase = 0; nextBeat = 0;
  shake = 0; flash = 0; finalHit = false; hitPause = 0;
  popups = [];
  initFogWisps();
  updateHUD();
}

function startGame(){
  resetGame();
  state = 'playing';
  if(titleScreen) titleScreen.classList.add('hidden');
  if(gameoverScreen) gameoverScreen.classList.add('hidden');
  if(laneHint) laneHint.style.opacity = '0.4';
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
  updateHUD();
}

function endGame(){
  state = 'gameover';
  var filled = dropParts.reduce(function(a,b){return a+b;},0);
  var complete = filled >= 5;
  if(complete && !finalHit){
    finalHit = true;
    playFinalDrop();
    shake = 0.4;
    flash = 0.25;
  }
  if(goScore) goScore.textContent = String(score);
  if(goTitle) goTitle.textContent = complete ? 'Full Drop!' : 'Static Wins';
  if(goMsg){
    goMsg.textContent = complete
      ? 'All five fragments locked in. The rooftop pulses one last time.'
      : 'Caught ' + filled + '/5 layers. The fog swallowed the rest.';
  }
  if(gameoverScreen) gameoverScreen.classList.remove('hidden');
  if(laneHint) laneHint.style.opacity = '0';
}

function moveLane(dir){
  if(state !== 'playing') return;
  laneTarget = Math.max(0, Math.min(2, laneTarget + dir));
}

function update(dt){
  idleTime += dt;
  for(var w = 0; w < fogWisps.length; w++){
    fogWisps[w].x += fogWisps[w].sp * dt;
    if(fogWisps[w].x > W + 80) fogWisps[w].x = -80;
  }
  if(hitPause > 0){ hitPause -= dt; return; }
  if(state !== 'playing') return;

  elapsed += dt;
  timeLeft -= dt;
  if(timeLeft <= 0){ timeLeft = 0; endGame(); return; }

  bpm = 124 + elapsed * 1.2;
  fog = Math.min(0.75, 0.35 + elapsed * 0.008);
  spawnTimer -= dt;
  var spawnRate = Math.max(0.35, 1.1 - elapsed * 0.012);
  if(spawnTimer <= 0){
    spawnFragment();
    spawnTimer = spawnRate;
  }

  if(comboTimer > 0) comboTimer -= dt;
  else if(combo > 1){ combo = Math.max(1, combo - 1); updateHUD(); }

  lane += (laneTarget - lane) * Math.min(1, dt * 14);
  if(Math.abs(lane - laneTarget) < 0.01) lane = laneTarget;

  var playerY = H * 0.82;
  var catchRadius = 36;

  for(var i = fragments.length - 1; i >= 0; i--){
    var f = fragments[i];
    if(f.caught){ fragments.splice(i,1); continue; }
    var stutterMod = 1 + Math.sin(beatPhase * Math.PI * 4) * 0.15;
    f.y += f.speed * stutterMod * dt;
    f.pulse += dt * 6;
    f.life -= dt * (0.08 + elapsed * 0.002);

    var fx = laneX(f.lane);
    var dx = Math.abs(laneX(lane) - fx);
    if(dx < 28 && Math.abs(f.y - playerY) < catchRadius && f.life > 0){
      catchFragment(f);
      fragments.splice(i,1);
      continue;
    }

    if(f.y > H + 50){
      if(f.life > 0.3) missFragment();
      fragments.splice(i,1);
    }else if(f.life <= 0){
      addParticle(fx, f.y, COLORS.static);
      missFragment();
      fragments.splice(i,1);
    }
  }

  for(var j = particles.length - 1; j >= 0; j--){
    var p = particles[j];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt;
    p.life -= dt;
    if(p.life <= 0) particles.splice(j,1);
  }

  for(var k = popups.length - 1; k >= 0; k--){
    popups[k].y -= 30 * dt;
    popups[k].life -= dt;
    if(popups[k].life <= 0) popups.splice(k, 1);
  }

  if(shake > 0) shake = Math.max(0, shake - dt * 1.5);
  if(flash > 0) flash = Math.max(0, flash - dt * 2);
  scheduleBeat(dt);
  updateHUD();
}

function drawWireHex(x, y, r, rot, color, alpha){
  if(!ctx) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha != null ? alpha : 1;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for(var i = 0; i <= 6; i++){
    var a = i / 6 * Math.PI * 2;
    var px = Math.cos(a) * r;
    var py = Math.sin(a) * r;
    if(i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
}

function draw(){
  if(!ctx) return;
  updateTheme();

  var sx = shake > 0 ? (Math.random() - 0.5) * shake * 12 : 0;
  var sy = shake > 0 ? (Math.random() - 0.5) * shake * 12 : 0;
  ctx.save();
  ctx.translate(sx, sy);

  var bgTop = lightMode ? '#b0b8c0' : '#2a3038';
  var bgBot = lightMode ? '#98a2ac' : '#1a1f24';
  var grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, bgTop);
  grad.addColorStop(1, bgBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  var skyLine = H * 0.22;
  ctx.fillStyle = lightMode ? '#8a929c' : '#232930';
  ctx.beginPath();
  ctx.moveTo(0, skyLine + 30);
  ctx.lineTo(W * 0.08, skyLine + 10);
  ctx.lineTo(W * 0.12, skyLine + 55);
  ctx.lineTo(W * 0.18, skyLine + 5);
  ctx.lineTo(W * 0.24, skyLine + 40);
  ctx.lineTo(W * 0.32, skyLine + 15);
  ctx.lineTo(W * 0.38, skyLine + 50);
  ctx.lineTo(W * 0.44, skyLine);
  ctx.lineTo(W * 0.48, skyLine + 35);
  ctx.lineTo(W * 0.55, skyLine + 8);
  ctx.lineTo(W * 0.62, skyLine + 45);
  ctx.lineTo(W * 0.68, skyLine + 12);
  ctx.lineTo(W * 0.74, skyLine + 38);
  ctx.lineTo(W * 0.82, skyLine + 6);
  ctx.lineTo(W * 0.88, skyLine + 42);
  ctx.lineTo(W, skyLine + 18);
  ctx.lineTo(W, H * 0.15);
  ctx.lineTo(0, H * 0.15);
  ctx.closePath();
  ctx.fill();

  var pyrX = W * 0.72;
  var pyrBase = skyLine + 18;
  ctx.strokeStyle = COLORS.neon;
  ctx.globalAlpha = 0.12 + Math.sin(idleTime * 1.5) * 0.04;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pyrX, pyrBase - 55);
  ctx.lineTo(pyrX - 14, pyrBase);
  ctx.lineTo(pyrX + 14, pyrBase);
  ctx.closePath();
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.strokeStyle = lightMode ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for(var l = 0; l < 3; l++){
    var lx = laneX(l);
    ctx.beginPath();
    ctx.moveTo(lx, H * 0.15);
    ctx.lineTo(lx, H);
    ctx.stroke();
  }

  var roofY = H * 0.88;
  ctx.fillStyle = lightMode ? '#78808a' : '#3a424c';
  ctx.beginPath();
  ctx.moveTo(0, roofY + 20);
  ctx.lineTo(W * 0.15, roofY);
  ctx.lineTo(W * 0.45, roofY - 8);
  ctx.lineTo(W * 0.7, roofY + 5);
  ctx.lineTo(W, roofY - 2);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = COLORS.neon;
  ctx.globalAlpha = 0.15 + Math.sin(beatPhase * Math.PI * 2) * 0.05;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W * 0.1, roofY + 10);
  ctx.lineTo(W * 0.9, roofY + 10);
  ctx.stroke();
  ctx.globalAlpha = 1;

  for(var i = 0; i < fragments.length; i++){
    var f = fragments[i];
    var fx = laneX(f.lane);
    var pulse = 1 + Math.sin(f.pulse) * 0.12;
    var r = f.size * pulse * 0.5;
    var alpha = Math.max(0.15, f.life);
    var col = f.life < 0.4 ? COLORS.static : COLORS.wire;
    drawWireHex(fx, f.y, r, f.pulse * 0.3, col, alpha);
    if(f.life < 0.4){
      ctx.globalAlpha = (0.4 - f.life) * 2;
      ctx.fillStyle = COLORS.static;
      for(var s = 0; s < 5; s++){
        ctx.fillRect(fx + (Math.random()-0.5)*r*2, f.y + (Math.random()-0.5)*r*2, 2, 2);
      }
      ctx.globalAlpha = 1;
    }
    ctx.font = '9px ui-monospace,monospace';
    ctx.fillStyle = col;
    ctx.globalAlpha = alpha * 0.7;
    ctx.textAlign = 'center';
    ctx.fillText(dropNames[f.type].slice(0,3), fx, f.y + 3);
    ctx.globalAlpha = 1;
  }

  var px = laneX(lane);
  var py = H * 0.82;
  drawWireHex(px, py, 22, elapsed * 2, COLORS.neon, 1);
  drawWireHex(px, py, 14, -elapsed * 3, COLORS.accent, 0.6);

  ctx.fillStyle = COLORS.neon;
  ctx.globalAlpha = 0.3 + Math.sin(elapsed * 8) * 0.15;
  ctx.beginPath();
  ctx.arc(px, py, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  for(var j = 0; j < particles.length; j++){
    var p = particles[j];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  for(var w = 0; w < fogWisps.length; w++){
    var fw = fogWisps[w];
    ctx.globalAlpha = fw.a * (state === 'playing' ? 1 + fog : 1);
    ctx.fillStyle = lightMode ? 'rgba(255,255,255,0.5)' : 'rgba(200,210,220,0.4)';
    ctx.beginPath();
    ctx.ellipse(fw.x, fw.y, fw.w, fw.h, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(var k = 0; k < popups.length; k++){
    var pu = popups[k];
    ctx.globalAlpha = Math.min(1, pu.life * 2);
    ctx.font = (pu.big ? 'bold 13px' : '11px') + " ui-monospace,monospace";
    ctx.fillStyle = pu.big ? COLORS.accent : COLORS.neon;
    ctx.textAlign = 'center';
    ctx.fillText(pu.text, pu.x, pu.y);
  }
  ctx.globalAlpha = 1;

  var fogA = state === 'playing' ? fog : 0.45;
  var fogGrad = ctx.createLinearGradient(0, 0, 0, H);
  fogGrad.addColorStop(0, COLORS.fog + (fogA * 0.6) + ')');
  fogGrad.addColorStop(0.5, COLORS.fog + (fogA * 0.35) + ')');
  fogGrad.addColorStop(1, COLORS.fog + (fogA * 0.15) + ')');
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, 0, W, H);

  if(flash > 0){
    ctx.fillStyle = COLORS.neon;
    ctx.globalAlpha = flash * 0.3;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function loop(ts){
  if(!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  update(dt);
  draw();
  rafId = requestAnimationFrame(loop);
}

function onPointer(e){
  if(e && e.preventDefault) e.preventDefault();
  if(state !== 'playing') return;
  var x = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : W/2);
  if(x < W / 2) moveLane(-1);
  else moveLane(1);
}

function onKey(e){
  if(!e) return;
  if(state === 'playing'){
    if(e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
    if(e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
  }
}

if(btnStart) btnStart.addEventListener('click', function(e){ if(e.stopPropagation) e.stopPropagation(); startGame(); });
if(btnRestart) btnRestart.addEventListener('click', function(e){ if(e.stopPropagation) e.stopPropagation(); startGame(); });

if(canvas){
  canvas.addEventListener('touchstart', onPointer, {passive:false});
  canvas.addEventListener('mousedown', onPointer);
}
document.addEventListener('keydown', onKey);

try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){ updateTheme(); });
  }
}catch(e){}

window.addEventListener('resize', resize);
resize();
initFogWisps();
updateTheme();
updateHUD();
rafId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
