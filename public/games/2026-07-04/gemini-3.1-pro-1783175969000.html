<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTOP PANIC</title>
<style>
  :root {
    --bg: #050505;
    --text: #33ff33;
    --dim: #1a4d1a;
    --hot: #ff3333;
    --cool: #33ccff;
    --warn: #ffcc00;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4f4;
      --text: #0a4a0a;
      --dim: #b3ccb3;
      --hot: #cc0000;
      --cool: #0066cc;
      --warn: #cc8800;
    }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #050505;
      --text: #33ff33;
      --dim: #1a4d1a;
      --hot: #ff3333;
      --cool: #33ccff;
      --warn: #ffcc00;
    }
    #scanlines {
      background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.1) 50%);
    }
  }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100dvh;
    overflow: hidden;
    background-color: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }

  #scanlines {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.1) 50%);
    background-size: 100% 4px;
  }
  @media (prefers-color-scheme: light) {
    #scanlines {
      background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.05) 50%);
    }
  }

  #ui-layer {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 2rem;
    background: var(--bg);
    border: 2px solid var(--text);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    pointer-events: none;
  }

  h1 { margin: 0 0 1rem 0; font-size: 2rem; text-transform: uppercase; }
  p { margin: 0.5rem 0; font-size: 1rem; max-width: 320px; line-height: 1.4; }

  button {
    pointer-events: auto;
    margin-top: 1.5rem;
    padding: 1rem 2rem;
    font-size: 1.2rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    border: 2px solid var(--text);
    cursor: pointer;
    text-transform: uppercase;
    font-weight: bold;
    transition: all 0.1s;
    box-shadow: 4px 4px 0 var(--dim);
  }
  button:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--dim);
    background: var(--text);
    color: var(--bg);
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="scanlines"></div>

<div id="ui-layer">
  <div id="title-screen" class="screen">
    <h1>HTOP PANIC</h1>
    <p>Sort processes before the system overheats. The air itself is the enemy.</p>
    <p style="font-size:0.9rem; margin-top: 1rem; opacity: 0.9;">
      Swipe <span style="color:var(--cool); font-weight:bold;">COOL (< 50%)</span> left.<br>
      Swipe <span style="color:var(--hot); font-weight:bold;">HOT (>= 50%)</span> right.
    </p>
    <button data-smoke="start">START SORTING</button>
  </div>

  <div id="game-over-screen" class="screen" style="display: none;">
    <h1>SYSTEM HALT</h1>
    <p style="color:var(--hot); font-weight:bold;">CRITICAL OVERHEAT</p>
    <p>Processes sorted: <span id="score-display" style="font-weight:bold; font-size: 1.2em;">0</span></p>
    <button data-smoke="restart">REBOOT</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const mainCtx = canvas.getContext('2d');
  const offCanvas = document.createElement('canvas');
  const offCtx = offCanvas.getContext('2d');

  let width = 0, height = 0, dpr = 1;
  
  const colors = {
    dark: { bg: '#050505', text: '#33ff33', dim: '#1a4d1a', hot: '#ff3333', cool: '#33ccff', warn: '#ffcc00' },
    light: { bg: '#f4f4f4', text: '#0a4a0a', dim: '#b3ccb3', hot: '#cc0000', cool: '#0066cc', warn: '#cc8800' }
  };
  
  let theme = colors.dark;
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    theme = mq.matches ? colors.light : colors.dark;
    mq.addEventListener('change', e => {
      theme = e.matches ? colors.light : colors.dark;
    });
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    offCanvas.width = width * dpr;
    offCanvas.height = height * dpr;
    offCtx.resetTransform();
    offCtx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // Audio Context
  let actx = null;
  function initAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch(e) {}
  }

  function playSound(type) {
    if (!actx || actx.state !== 'running') return;
    try {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);
      const now = actx.currentTime;

      if (type === 'good') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'bad') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    } catch(e) {}
  }

  // Game State
  let gameState = 'TITLE';
  let score = 0;
  let heat = 30;
  let processes = [];
  let particles = [];
  let bgChars = [];
  let spawnTimer = 0;
  let flashIntensity = 0;
  let flashColor = '';

  const processNames = ['node', 'chrome --type=renderer', 'kernel_task', 'WindowServer', 'docker-proxy', 'python3 train.py', 'ffmpeg -i', 'bash', 'sshd', 'slack', 'spotify', 'htop', 'systemd'];

  function getBaseVy() {
    return height * 0.15 + score * 3;
  }

  class Process {
    constructor(x, y, isDummy = false) {
      this.id = Math.random();
      this.w = Math.min(280, width * 0.8);
      this.h = 60;
      this.x = x;
      this.y = y;
      this.vx = 0;
      this.vy = getBaseVy();
      this.targetX = x;
      this.name = processNames[Math.floor(Math.random() * processNames.length)];
      
      const typeRoll = Math.random();
      if (typeRoll < 0.3) {
        this.cpu = 50 + Math.random() * 49;
        this.isDecoy = false;
      } else if (typeRoll < 0.4 && !isDummy) {
        this.cpu = 80 + Math.random() * 19;
        this.realCpu = 2 + Math.random() * 10;
        this.isDecoy = true;
      } else {
        this.cpu = 1 + Math.random() * 30;
        this.isDecoy = false;
      }

      this.state = 'falling';
      this.targetZone = null;
      this.scale = 1;
      this.lastX = x;
      this.lastMoveTime = performance.now();
    }
  }

  function spawnParticle(x, y, text, color) {
    particles.push({ x, y, text, color, life: 1, vy: -50 });
  }

  function triggerFlash(color) {
    flashColor = color;
    flashIntensity = 1.0;
    try { if (navigator.vibrate) navigator.vibrate(100); } catch(e){}
  }

  function evaluateSort(p) {
    const isHot = p.cpu >= 50;
    const toHot = p.targetZone === 'hot';

    if (isHot && toHot) {
      heat -= 10; score += 1; playSound('good');
      spawnParticle(p.x, p.y, '-10 HEAT', theme.cool);
    } else if (!isHot && !toHot) {
      heat -= 5; score += 1; playSound('good');
      spawnParticle(p.x, p.y, '-5 HEAT', theme.cool);
    } else if (isHot && !toHot) {
      heat += 20; playSound('bad'); triggerFlash(theme.hot);
      spawnParticle(p.x, p.y, 'OVERHEAT!', theme.hot);
    } else if (!isHot && toHot) {
      heat += 15; playSound('bad'); triggerFlash(theme.warn);
      spawnParticle(p.x, p.y, 'ERROR', theme.warn);
    }
    heat = Math.max(0, heat);
  }

  function evaluateMiss(p) {
    const isHot = p.cpu >= 50;
    if (isHot) {
      heat += 20;
      playSound('bad');
      triggerFlash(theme.hot);
    } else {
      heat += 5;
    }
    heat = Math.max(0, heat);
  }

  function gameOver() {
    gameState = 'GAMEOVER';
    playSound('bad');
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){}
    document.getElementById('score-display').innerText = score;
    document.getElementById('game-over-screen').style.display = 'flex';
  }

  // Input Handling
  let activeProcess = null;
  let touchOffset = {x: 0, y: 0};

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });

  canvas.addEventListener('pointerdown', e => {
    if (gameState !== 'PLAYING') return;
    try { canvas.setPointerCapture(e.pointerId); } catch(e){}
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    for (let i = processes.length - 1; i >= 0; i--) {
      const p = processes[i];
      if (Math.abs(p.x - x) < p.w/2 + 30 && Math.abs(p.y - y) < p.h/2 + 30) {
        activeProcess = p;
        touchOffset.x = p.x - x;
        touchOffset.y = p.y - y;
        p.state = 'dragging';
        p.scale = 1.05;
        p.vx = 0;
        p.vy = 0;
        p.lastX = x;
        p.lastMoveTime = performance.now();
        
        if (p.isDecoy) {
          p.isDecoy = false;
          p.cpu = p.realCpu;
          try { if (navigator.vibrate) navigator.vibrate(50); } catch(e){}
        }
        break;
      }
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (activeProcess) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const now = performance.now();
      const dt = (now - activeProcess.lastMoveTime) / 1000 || 0.016;
      activeProcess.vx = (x - activeProcess.lastX) / dt;

      activeProcess.x = x + touchOffset.x;
      activeProcess.y = y + touchOffset.y;
      activeProcess.lastX = x;
      activeProcess.lastMoveTime = now;
    }
  });

  canvas.addEventListener('pointerup', e => {
    if (activeProcess) {
      const zoneW = width * 0.3;
      const swipeVelocity = activeProcess.vx;

      if (activeProcess.x < zoneW || swipeVelocity < -600) {
        activeProcess.targetZone = 'cool';
        activeProcess.state = 'sorting';
        activeProcess.vx = -Math.max(1000, Math.abs(swipeVelocity));
        activeProcess.vy = 0;
      } else if (activeProcess.x > width - zoneW || swipeVelocity > 600) {
        activeProcess.targetZone = 'hot';
        activeProcess.state = 'sorting';
        activeProcess.vx = Math.max(1000, Math.abs(swipeVelocity));
        activeProcess.vy = 0;
      } else {
        activeProcess.state = 'returning';
        activeProcess.targetX = width / 2;
        activeProcess.vy = getBaseVy();
      }
      activeProcess.scale = 1;
      activeProcess = null;
    }
    try { canvas.releasePointerCapture(e.pointerId); } catch(e){}
  });

  function sortProcessToZone(p, zone) {
    if (p.state !== 'falling' && p.state !== 'returning') return;
    p.targetZone = zone;
    p.state = 'sorting';
    p.vx = zone === 'cool' ? -1000 : 1000;
    p.vy = 0;
    p.scale = 1;
    if (p.isDecoy) {
      p.isDecoy = false;
      p.cpu = p.realCpu;
    }
  }

  function findCenterProcess() {
    let best = null;
    let bestDist = Infinity;
    for (const p of processes) {
      if (p.state !== 'falling' && p.state !== 'returning') continue;
      const dist = Math.abs(p.x - width / 2);
      if (dist < bestDist) {
        bestDist = dist;
        best = p;
      }
    }
    return best;
  }

  function handleKeyDown(e) {
    if (gameState === 'TITLE' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      initAudio();
      startGame();
      return;
    }
    if (gameState === 'GAMEOVER' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      startGame();
      return;
    }
    if (gameState !== 'PLAYING') return;

    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      e.preventDefault();
      if (activeProcess) {
        sortProcessToZone(activeProcess, 'cool');
        activeProcess = null;
      } else {
        const p = findCenterProcess();
        if (p) sortProcessToZone(p, 'cool');
      }
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      e.preventDefault();
      if (activeProcess) {
        sortProcessToZone(activeProcess, 'hot');
        activeProcess = null;
      } else {
        const p = findCenterProcess();
        if (p) sortProcessToZone(p, 'hot');
      }
    }
  }

  function handleKeyUp(e) {}

  document.addEventListener('keydown', handleKeyDown);
  document.addEventListener('keyup', handleKeyUp);

  // Buttons
  document.querySelector('[data-smoke="start"]').addEventListener('click', () => {
    initAudio();
    startGame();
  });
  
  document.querySelector('[data-smoke="restart"]').addEventListener('click', () => {
    startGame();
  });

  function startGame() {
    score = 0;
    heat = 30;
    processes = [];
    particles = [];
    spawnTimer = 0;
    gameState = 'PLAYING';
    flashIntensity = 0;
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
  }

  let lastTime = performance.now();

  function loop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  function update(dt) {
    if (gameState === 'TITLE') {
      spawnTimer += dt;
      if (spawnTimer >= 1.5) {
        spawnTimer = 0;
        processes.push(new Process(width / 2 + (Math.random() - 0.5) * 50, -100, true));
      }
      updateProcesses(dt, true);
      heat = 30;
    } 
    else if (gameState === 'PLAYING') {
      const heatRate = 1.5 + score * 0.15;
      heat += heatRate * dt;

      if (heat >= 100) {
        heat = 100;
        gameOver();
      }

      const spawnInterval = Math.max(0.5, 2.0 - score * 0.03);
      spawnTimer += dt;
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        processes.push(new Process(width / 2 + (Math.random() - 0.5) * 50, -100));
      }

      updateProcesses(dt, false);
    }

    // BG Chars
    const targetCharSpawn = gameState === 'PLAYING' ? 0.05 + (heat/200) : 0.02;
    if (Math.random() < targetCharSpawn) {
      bgChars.push({ x: Math.random() * width, y: Math.random() * height, char: Math.random() > 0.5 ? '0' : '1', life: 1 });
    }
    for (let i = bgChars.length - 1; i >= 0; i--) {
      bgChars[i].life -= dt * 0.5;
      if (bgChars[i].life <= 0) bgChars.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].y += particles[i].vy * dt;
      particles[i].life -= dt;
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
  }

  function updateProcesses(dt, isTitle) {
    for (let i = processes.length - 1; i >= 0; i--) {
      const p = processes[i];
      if (p.state === 'falling') {
        p.y += p.vy * dt;
        p.x += Math.sin(Date.now()/500 + p.id) * 20 * dt;
        if (p.y > height + p.h) {
          if (!isTitle) evaluateMiss(p);
          processes.splice(i, 1);
        }
      } else if (p.state === 'returning') {
        p.x += (p.targetX - p.x) * 15 * dt;
        p.y += p.vy * dt;
        if (Math.abs(p.x - p.targetX) < 5) {
          p.state = 'falling';
          p.vx = 0;
        }
      } else if (p.state === 'sorting') {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.x < -p.w || p.x > width + p.w) {
          if (!isTitle) evaluateSort(p);
          processes.splice(i, 1);
        }
      }
    }
  }

  function draw() {
    offCtx.fillStyle = theme.bg;
    offCtx.fillRect(0, 0, width, height);

    // Draw background chars
    offCtx.font = '14px ui-monospace, monospace';
    offCtx.textAlign = 'center';
    bgChars.forEach(c => {
      offCtx.fillStyle = theme.dim;
      offCtx.globalAlpha = c.life * 0.3;
      offCtx.fillText(c.char, c.x, c.y);
    });
    offCtx.globalAlpha = 1.0;

    // Draw Zones
    const zoneW = width * 0.3;
    offCtx.strokeStyle = theme.dim;
    offCtx.lineWidth = 2;
    offCtx.setLineDash([5, 10]);
    offCtx.beginPath();
    offCtx.moveTo(zoneW, 0); offCtx.lineTo(zoneW, height);
    offCtx.moveTo(width - zoneW, 0); offCtx.lineTo(width - zoneW, height);
    offCtx.stroke();
    offCtx.setLineDash([]);

    offCtx.fillStyle = theme.dim;
    offCtx.font = 'bold 24px ui-monospace, monospace';
    if (gameState === 'PLAYING') {
      offCtx.fillText('<< COOL', zoneW / 2, height - 60);
      offCtx.fillText('HOT >>', width - zoneW / 2, height - 60);
    }

    // Draw Processes
    processes.forEach(p => {
      offCtx.save();
      offCtx.translate(p.x, p.y);
      offCtx.rotate(p.vx * 0.0005);
      offCtx.scale(p.scale, p.scale);

      const isHot = p.cpu >= 50;
      let strokeColor = theme.text;
      let barColor = isHot ? theme.hot : theme.cool;

      if (p.state === 'dragging' || p.state === 'sorting') {
        if (p.x < zoneW || p.vx < -500) {
          strokeColor = theme.cool;
        } else if (p.x > width - zoneW || p.vx > 500) {
          strokeColor = theme.hot;
        }
      }

      if (p.isDecoy && (Date.now() % 200 < 100)) {
         offCtx.translate((Math.random()-0.5)*4, (Math.random()-0.5)*4);
         strokeColor = theme.warn;
      }

      offCtx.fillStyle = theme.bg;
      offCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      offCtx.strokeStyle = strokeColor;
      offCtx.lineWidth = 2;
      offCtx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);

      offCtx.fillStyle = strokeColor;
      offCtx.font = '14px ui-monospace, monospace';
      offCtx.textAlign = 'left';
      offCtx.textBaseline = 'middle';
      offCtx.fillText(p.name, -p.w/2 + 10, -10);
      
      offCtx.textAlign = 'right';
      offCtx.fillText(`${p.cpu.toFixed(1)}%`, p.w/2 - 10, -10);

      const barW = p.w - 20;
      const fillW = Math.max(0, barW * (p.cpu / 100));
      offCtx.fillStyle = barColor;
      offCtx.fillRect(-p.w/2 + 10, 10, fillW, 10);
      offCtx.strokeStyle = strokeColor;
      offCtx.strokeRect(-p.w/2 + 10, 10, barW, 10);

      offCtx.restore();
    });

    // Draw HUD
    if (gameState !== 'TITLE') {
      offCtx.fillStyle = theme.text;
      offCtx.textAlign = 'left';
      offCtx.font = 'bold 16px ui-monospace, monospace';
      offCtx.fillText(`SCORE: ${score}`, 20, 30);

      offCtx.fillText(`HEAT: ${heat.toFixed(1)}%`, 20, 60);

      const hBarW = width - 40;
      offCtx.strokeStyle = theme.text;
      offCtx.lineWidth = 2;
      offCtx.strokeRect(20, 70, hBarW, 16);

      let hColor = theme.text;
      if (heat > 60) hColor = theme.warn;
      if (heat > 85) hColor = theme.hot;

      let barAlpha = 1;
      if (heat > 85) barAlpha = 0.5 + 0.5 * Math.sin(Date.now() / 100);

      offCtx.globalAlpha = barAlpha;
      offCtx.fillStyle = hColor;
      offCtx.fillRect(24, 74, Math.max(0, (hBarW - 8) * (heat / 100)), 8);
      offCtx.globalAlpha = 1;
    }

    // Particles
    particles.forEach(pt => {
      offCtx.globalAlpha = Math.max(0, pt.life);
      offCtx.fillStyle = pt.color;
      offCtx.font = 'bold 20px ui-monospace, monospace';
      offCtx.textAlign = 'center';
      offCtx.fillText(pt.text, pt.x, pt.y);
    });
    offCtx.globalAlpha = 1.0;

    // Render to main canvas with shimmer
    mainCtx.resetTransform();
    const pWidth = offCanvas.width;
    const pHeight = offCanvas.height;

    mainCtx.fillStyle = theme.bg;
    mainCtx.fillRect(0, 0, pWidth, pHeight);

    const heatRatio = heat / 100;
    if (heatRatio < 0.05) {
      mainCtx.drawImage(offCanvas, 0, 0);
    } else {
      const time = Date.now() / 150;
      const stripH = Math.max(1, Math.floor(4 * dpr));
      const maxD = heatRatio * 15 * dpr;

      for (let y = 0; y < pHeight; y += stripH) {
        const dx = Math.sin(time + y * 0.02) * maxD;
        mainCtx.drawImage(offCanvas, 0, y, pWidth, stripH, dx, y, pWidth, stripH);
      }
    }

    // Flashes
    if (flashIntensity > 0) {
      mainCtx.fillStyle = flashColor;
      mainCtx.globalAlpha = flashIntensity * 0.4;
      mainCtx.fillRect(0, 0, pWidth, pHeight);
      mainCtx.globalAlpha = 1.0;
      flashIntensity -= 0.05;
    }
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
