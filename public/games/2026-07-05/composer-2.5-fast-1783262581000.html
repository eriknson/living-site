<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Pocket</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c10;
    --fg: #e8ecf2;
    --muted: #6b7280;
    --accent: #00f0d4;
    --accent2: #ff3366;
    --panel: rgba(12, 16, 22, 0.92);
    --line: rgba(255,255,255,0.08);
    --glow: rgba(0, 240, 212, 0.35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f8;
      --fg: #111318;
      --muted: #64748b;
      --accent: #009688;
      --accent2: #e11d48;
      --panel: rgba(255, 255, 255, 0.94);
      --line: rgba(0,0,0,0.08);
      --glow: rgba(0, 150, 136, 0.25);
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: max(12px, env(safe-area-inset-top)) 16px 8px;
    pointer-events: none;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #hud span { opacity: 0.85; }
  #hud .score { font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
  #hud .combo { color: var(--accent); transition: transform 0.12s; }
  #hud .combo.pop { transform: scale(1.25); }
  #canvas {
    flex: 1;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    pointer-events: none;
    text-align: center;
    background: radial-gradient(ellipse at 50% 40%, var(--glow), transparent 70%);
  }
  .overlay.hidden { display: none; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.14em;
    margin-bottom: 6px;
    color: var(--accent);
  }
  .subtitle {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .stat-row {
    display: flex;
    justify-content: space-around;
    margin: 16px 0 20px;
    font-size: 10px;
    color: var(--muted);
  }
  .stat-row div strong {
    display: block;
    font-size: 20px;
    color: var(--fg);
    margin-top: 4px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 160px;
    padding: 14px 28px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--bg);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 0 24px var(--glow);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  @media (prefers-color-scheme: light) {
    button[data-smoke] { color: #fff; }
  }
  #glitch-bar-wrap {
    position: absolute;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 16px; right: 16px;
    z-index: 5;
    pointer-events: none;
  }
  #glitch-label {
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  #glitch-bar {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  #glitch-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent2), #ff8844);
    border-radius: 2px;
    transition: width 0.15s;
  }
  #timer {
    position: absolute;
    bottom: max(36px, calc(env(safe-area-inset-bottom) + 20px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
    letter-spacing: 0.08em;
  }
  .hint {
    margin-top: 14px;
    font-size: 10px;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>
      <div class="score" id="scoreEl">0</div>
      <span>score</span>
    </div>
    <div style="text-align:right">
      <div class="combo" id="comboEl">×0</div>
      <span>combo</span>
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="glitch-bar-wrap">
    <div id="glitch-label">track overload</div>
    <div id="glitch-bar"><div id="glitch-fill"></div></div>
  </div>
  <div id="timer">0:30</div>

  <div class="overlay" id="titleOverlay">
    <div class="panel">
      <h1>Stutter Pocket</h1>
      <p class="subtitle">Tap the neon gaps between stutter beats.<br>Find the pocket before the track glitches out.</p>
      <button type="button" data-smoke="start" id="startBtn">Drop In</button>
      <p class="hint">Tap · hold rhythm · 30s build</p>
    </div>
  </div>

  <div class="overlay hidden" id="gameOverOverlay">
    <div class="panel">
      <h1 id="endTitle">Peak Reached</h1>
      <p class="subtitle" id="endMsg">You rode the drop.</p>
      <div class="stat-row">
        <div>Score<strong id="finalScore">0</strong></div>
        <div>Best Combo<strong id="finalCombo">0</strong></div>
        <div>Accuracy<strong id="finalAcc">0%</strong></div>
      </div>
      <button type="button" data-smoke="restart" id="restartBtn">Again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('scoreEl');
  var comboEl = document.getElementById('comboEl');
  var glitchFill = document.getElementById('glitch-fill');
  var timerEl = document.getElementById('timer');
  var titleOverlay = document.getElementById('titleOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var endTitle = document.getElementById('endTitle');
  var endMsg = document.getElementById('endMsg');
  var finalScore = document.getElementById('finalScore');
  var finalCombo = document.getElementById('finalCombo');
  var finalAcc = document.getElementById('finalAcc');

  var W = 360, H = 640;
  var state = 'title';
  var score = 0, combo = 0, maxCombo = 0;
  var hits = 0, misses = 0, passed = 0;
  var glitch = 0;
  var roundDuration = 30;
  var startTime = 0, lastFrame = 0;
  var audioCtx = null;
  var masterGain = null;
  var glitchGain = null;
  var cleanGain = null;
  var distortionNode = null;
  var notes = [];
  var particles = [];
  var waveform = [];
  var pocketFlash = 0;
  var screenShake = 0;
  var beatPhase = 0;
  var rafId = 0;
  var noteId = 0;
  var isDark = true;
  var lastScheduledBeat = -999;

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return true; }
  }

  isDark = prefersDark();
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        isDark = prefersDark();
      });
    } catch (e) { /* ignore */ }
  }

  function resize() {
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  function getBPM(elapsed) {
    var seg = Math.floor(elapsed / 10);
    return 118 + seg * 17;
  }

  function getStutterDensity(elapsed) {
    var seg = Math.floor(elapsed / 10);
    return 1 + seg;
  }

  function getBuildVolume(elapsed) {
    return Math.min(1, 0.15 + (elapsed / roundDuration) * 0.85);
  }

  function initAudio() {
    if (audioCtx) return true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.6;
      masterGain.connect(audioCtx.destination);

      cleanGain = audioCtx.createGain();
      cleanGain.gain.value = 1;
      cleanGain.connect(masterGain);

      glitchGain = audioCtx.createGain();
      glitchGain.gain.value = 0;

      distortionNode = audioCtx.createWaveShaper();
      distortionNode.curve = makeDistCurve(80);
      distortionNode.oversample = '2x';
      glitchGain.connect(distortionNode);
      distortionNode.connect(masterGain);

      return true;
    } catch (e) {
      return false;
    }
  }

  function makeDistCurve(amount) {
    var n = 256;
    var curve = new Float32Array(n);
    var deg = Math.PI / 180;
    for (var i = 0; i < n; i++) {
      var x = (i * 2) / n - 1;
      curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
  }

  function playKick(time, vol) {
    if (!audioCtx || !cleanGain) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, time);
      osc.frequency.exponentialRampToValueAtTime(40, time + 0.12);
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(vol * 0.7, time + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.18);
      osc.connect(g);
      g.connect(cleanGain);
      osc.start(time);
      osc.stop(time + 0.2);
    } catch (e) { /* ignore */ }
  }

  function playHat(time, vol) {
    if (!audioCtx || !cleanGain) return;
    try {
      var len = Math.floor(audioCtx.sampleRate * 0.04);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var g = audioCtx.createGain();
      var f = audioCtx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 6000;
      g.gain.setValueAtTime(vol * 0.25, time);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
      src.connect(f);
      f.connect(g);
      g.connect(cleanGain);
      src.start(time);
      src.stop(time + 0.05);
    } catch (e) { /* ignore */ }
  }

  function playStutter(time, vol) {
    if (!audioCtx || !cleanGain) return;
    try {
      for (var i = 0; i < 3; i++) {
        var t = time + i * 0.035;
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = 220 + i * 40;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol * 0.15, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
        osc.connect(g);
        g.connect(cleanGain);
        osc.start(t);
        osc.stop(t + 0.04);
      }
    } catch (e) { /* ignore */ }
  }

  function playGapTone(time, perfect) {
    if (!audioCtx || !cleanGain) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = perfect ? 880 : 660;
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(perfect ? 0.35 : 0.2, time + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);
      osc.connect(g);
      g.connect(cleanGain);
      osc.start(time);
      osc.stop(time + 0.16);
    } catch (e) { /* ignore */ }
  }

  function playGlitchBurst() {
    if (!audioCtx || !glitchGain) return;
    try {
      var t = audioCtx.currentTime;
      glitchGain.gain.cancelScheduledValues(t);
      glitchGain.gain.setValueAtTime(Math.min(0.8, glitch / 100), t);
      glitchGain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 60 + Math.random() * 200;
      g.gain.setValueAtTime(0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(g);
      g.connect(glitchGain);
      osc.start(t);
      osc.stop(t + 0.3);
    } catch (e) { /* ignore */ }
  }

  function spawnNote(elapsed) {
    var bpm = getBPM(elapsed);
    var density = getStutterDensity(elapsed);
    var beatDur = 60 / bpm;
    var stutterCount = 2 + density;
    var gapTime = elapsed + 1.8;
    notes.push({
      id: ++noteId,
      time: gapTime,
      type: 'gap',
      spawned: elapsed,
      stutterCount: stutterCount,
      beatDur: beatDur,
      hit: false,
      missed: false,
      y: 0.5 + (Math.random() - 0.5) * 0.08
    });
  }

  function resetGame() {
    score = 0; combo = 0; maxCombo = 0;
    hits = 0; misses = 0; passed = 0;
    glitch = 0;
    notes = [];
    particles = [];
    waveform = [];
    pocketFlash = 0;
    screenShake = 0;
    beatPhase = 0;
    noteId = 0;
    lastScheduledBeat = -999;
    updateHUD();
    if (glitchFill) glitchFill.style.width = '0%';
    if (timerEl) timerEl.textContent = '0:30';
  }

  function startGame() {
    resetGame();
    state = 'playing';
    if (titleOverlay) titleOverlay.classList.add('hidden');
    if (gameOverOverlay) gameOverOverlay.classList.add('hidden');
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    startTime = performance.now();
    lastFrame = startTime;
    spawnNote(0);
    scheduleBeats(0);
  }

  function endGame(reason) {
    state = 'gameover';
    if (endTitle) endTitle.textContent = reason === 'overload' ? 'Track Blown' : 'Peak Reached';
    if (endMsg) {
      endMsg.textContent = reason === 'overload'
        ? 'Too many missed gaps — the stutter took over.'
        : 'You rode the drop from silence to peak.';
    }
    var acc = (hits + misses) > 0 ? Math.round((hits / (hits + misses)) * 100) : 0;
    if (finalScore) finalScore.textContent = String(score);
    if (finalCombo) finalCombo.textContent = String(maxCombo);
    if (finalAcc) finalAcc.textContent = acc + '%';
    if (gameOverOverlay) gameOverOverlay.classList.remove('hidden');
    if (navigator.vibrate) try { navigator.vibrate([30, 40, 30]); } catch (e) {}
  }

  function scheduleBeats(fromElapsed) {
    if (!audioCtx || state !== 'playing') return;
    var bpm = getBPM(fromElapsed);
    var beatDur = 60 / bpm;
    var halfBeat = beatDur * 0.5;
    var vol = getBuildVolume(fromElapsed);
    var now = audioCtx.currentTime;
    var lookAhead = 2.5;
    var startIdx = Math.floor(lastScheduledBeat / halfBeat) + 1;
    var endIdx = Math.ceil((fromElapsed + lookAhead) / halfBeat);
    for (var idx = startIdx; idx <= endIdx; idx++) {
      var t = idx * halfBeat;
      if (t > roundDuration) break;
      var audioT = now + (t - fromElapsed);
      if (audioT < now - 0.05) continue;
      if (idx % 8 === 0) playKick(audioT, vol);
      else if (idx % 4 === 0) playHat(audioT, vol);
      else if (idx % 2 === 1) playStutter(audioT, vol * 0.75);
      lastScheduledBeat = t;
    }
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) {
      comboEl.textContent = '×' + combo;
      if (combo > 0 && combo % 5 === 0) {
        comboEl.classList.add('pop');
        setTimeout(function () { comboEl.classList.remove('pop'); }, 120);
      }
    }
    if (glitchFill) glitchFill.style.width = Math.min(100, glitch) + '%';
  }

  function spawnParticles(x, y, color, n) {
    for (var i = 0; i < (n || 12); i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 2 + Math.random() * 5;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1,
        color: color
      });
    }
  }

  function judgeTap() {
    if (state !== 'playing') return;
    var elapsed = (performance.now() - startTime) / 1000;
    var pocketX = W * 0.5;
    var best = null;
    var bestDist = Infinity;
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.hit || n.missed) continue;
      var nx = timeToX(n.time, elapsed);
      var dist = Math.abs(nx - pocketX);
      if (dist < bestDist) { bestDist = dist; best = n; }
    }
    var windowPx = Math.max(44, W * 0.12);
    if (best && bestDist < windowPx) {
      var timingMs = Math.abs(best.time - elapsed) * 1000;
      var perfect = timingMs < 70;
      var good = timingMs < 130;
      if (good) {
        best.hit = true;
        hits++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        var pts = perfect ? 150 : 80;
        pts += combo * 5;
        score += pts;
        glitch = Math.max(0, glitch - (perfect ? 12 : 6));
        pocketFlash = perfect ? 1 : 0.6;
        spawnParticles(pocketX, H * best.y, perfect ? '#00f0d4' : '#44ddbb', perfect ? 18 : 10);
        if (audioCtx) playGapTone(audioCtx.currentTime, perfect);
        if (navigator.vibrate) try { navigator.vibrate(perfect ? 12 : 6); } catch (e) {}
      } else {
        registerMiss(false);
      }
    } else {
      registerMiss(true);
    }
    updateHUD();
  }

  function registerMiss(early) {
    misses++;
    combo = 0;
    glitch = Math.min(100, glitch + (early ? 8 : 14));
    screenShake = 6;
    playGlitchBurst();
    if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) {}
    if (glitch >= 100) endGame('overload');
    updateHUD();
  }

  function timeToX(noteTime, elapsed) {
    var scrollSpeed = W * 0.38;
    return W * 0.5 + (noteTime - elapsed) * scrollSpeed;
  }

  function updateNotes(elapsed, dt) {
    while (notes.length > 0 && notes[0].time < elapsed - 0.35) {
      var n = notes.shift();
      if (!n.hit && !n.missed) {
        n.missed = true;
        passed++;
        registerMiss(false);
      }
    }
    var lastSpawn = notes.length ? notes[notes.length - 1].time : 0;
    var gap = 1.6 - getStutterDensity(elapsed) * 0.08;
    if (elapsed - (notes.length ? notes[notes.length - 1].spawned : 0) > gap || notes.length === 0) {
      if (elapsed < roundDuration - 2) spawnNote(elapsed);
    }
    if (Math.floor(elapsed * 2) !== Math.floor((elapsed - dt) * 2)) {
      scheduleBeats(elapsed);
    }
  }

  function updateWaveform(elapsed) {
    waveform.push(Math.sin(elapsed * 12 + beatPhase) * 0.3 + (Math.random() - 0.5) * glitch * 0.005);
    if (waveform.length > 120) waveform.shift();
    beatPhase += dtScale(elapsed) * 0.08;
  }

  function dtScale(elapsed) {
    return getBPM(elapsed) / 118;
  }

  function draw() {
    if (!ctx) return;
    var now = performance.now();
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    var elapsed = state === 'playing' ? (now - startTime) / 1000 : 0;
    if (state === 'playing') {
      if (elapsed >= roundDuration) {
        endGame('complete');
      } else {
        updateNotes(elapsed, dt);
        updateWaveform(elapsed);
        var rem = Math.ceil(roundDuration - elapsed);
        if (timerEl) timerEl.textContent = '0:' + (rem < 10 ? '0' : '') + rem;
        if (masterGain) masterGain.gain.value = 0.3 + getBuildVolume(elapsed) * 0.5;
      }
    }

    var shakeX = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
    var shakeY = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
    screenShake *= 0.85;

    var bg = isDark ? '#0a0c10' : '#f0f3f6';
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var gridColor = isDark ? 'rgba(0,240,212,0.04)' : 'rgba(0,150,136,0.06)';
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for (var gx = 0; gx < W; gx += 40) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    for (var gy = 0; gy < H; gy += 40) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }

    var midY = H * 0.52 + shakeY;
    var accent = isDark ? '#00f0d4' : '#009688';
    var accent2 = isDark ? '#ff3366' : '#e11d48';

    ctx.save();
    ctx.translate(shakeX, 0);

    drawWaveform(midY, accent, elapsed);
    drawNotes(elapsed, midY, accent, accent2);
    drawPocket(midY, accent, accent2);

    if (pocketFlash > 0) {
      ctx.globalAlpha = pocketFlash * 0.25;
      ctx.fillStyle = accent;
      ctx.fillRect(W * 0.5 - 2, midY - H * 0.2, 4, H * 0.4);
      ctx.globalAlpha = 1;
      pocketFlash -= dt * 3;
    }

    drawParticles(dt);
    ctx.restore();

    if (state === 'title') drawIdleWave(midY, accent);
  }

  function drawWaveform(midY, accent, elapsed) {
    if (waveform.length < 2) return;
    ctx.beginPath();
    var amp = H * 0.12 * (0.3 + getBuildVolume(elapsed) * 0.7);
    for (var i = 0; i < waveform.length; i++) {
      var x = (i / waveform.length) * W;
      var y = midY + waveform[i] * amp * (1 + glitch * 0.008);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5 + getBuildVolume(elapsed) * 0.4;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawIdleWave(midY, accent) {
    var t = performance.now() / 1000;
    ctx.beginPath();
    for (var x = 0; x <= W; x += 4) {
      var y = midY + Math.sin(x * 0.02 + t * 3) * 20 + Math.sin(x * 0.05 - t * 2) * 8;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.45;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawNotes(elapsed, midY, accent, accent2) {
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      var x = timeToX(n.time, elapsed);
      if (x < -60 || x > W + 60) continue;
      var ny = H * n.y;
      var r = Math.max(22, W * 0.06);

      if (n.hit) {
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = accent;
      } else if (n.missed) {
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = accent2;
      } else {
        var pulse = 0.7 + Math.sin(elapsed * 10) * 0.3;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = accent;
        ctx.shadowColor = accent;
        ctx.shadowBlur = 16;
      }

      ctx.beginPath();
      ctx.arc(x, ny, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (!n.hit && !n.missed) {
        ctx.strokeStyle = isDark ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = isDark ? '#0a0c10' : '#fff';
        ctx.font = '10px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = 0.9;
        ctx.fillText('GAP', x, ny);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawPocket(midY, accent, accent2) {
    var px = W * 0.5;
    var h = H * 0.35;
    var grad = ctx.createLinearGradient(px - 30, 0, px + 30, 0);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.5, isDark ? 'rgba(0,240,212,0.15)' : 'rgba(0,150,136,0.12)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(px - 30, midY - h / 2, 60, h);

    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(px, midY - h / 2);
    ctx.lineTo(px, midY + h / 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = accent2;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(px, midY - 10);
    ctx.lineTo(px - 8, midY + 6);
    ctx.lineTo(px + 8, midY + 6);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life -= dt * 2;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function loop() {
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function onTap(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (state === 'playing') judgeTap();
  }

  function bindEvents() {
    resize();
    window.addEventListener('resize', resize);

    if (canvas) {
      canvas.addEventListener('touchstart', onTap, { passive: false });
      canvas.addEventListener('mousedown', onTap);
    }

    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (state === 'playing') judgeTap();
      }
    });

    if (startBtn) {
      startBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        startGame();
      });
    }
    if (restartBtn) {
      restartBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        startGame();
      });
    }

    var wrap = document.getElementById('wrap');
    if (wrap) {
      wrap.addEventListener('touchstart', function (e) {
        if (state === 'title' || state === 'gameover') return;
        var t = e.target;
        if (t && t.getAttribute && t.getAttribute('data-smoke')) return;
      }, { passive: true });
    }
  }

  bindEvents();
  loop();
})();
</script>
</body>
</html>
