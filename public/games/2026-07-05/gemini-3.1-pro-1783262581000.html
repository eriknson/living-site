<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chalk & Embers</title>
<style>
  :root {
    --bg-color: #0f172a;
    --text-color: #f8fafc;
    --overlay-bg: rgba(15, 23, 42, 0.85);
    --btn-bg: #1e293b;
    --btn-border: #334155;
    --btn-text: #f8fafc;
    --danger: #ef4444;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-color: #e2e8f0;
      --text-color: #0f172a;
      --overlay-bg: rgba(226, 232, 240, 0.85);
      --btn-bg: #cbd5e1;
      --btn-border: #94a3b8;
      --btn-text: #0f172a;
      --danger: #dc2626;
    }
  }
  body {
    margin: 0; padding: 0; overflow: hidden;
    width: 100dvw; height: 100dvh;
    background: var(--bg-color);
    color: var(--text-color);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 10;
  }
  .screen {
    display: flex; flex-direction: column; align-items: center;
    background: var(--overlay-bg);
    padding: 2.5rem 3rem;
    border-radius: 1rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--btn-border);
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }
  h1 {
    margin: 0 0 1rem 0; font-size: 2rem; letter-spacing: -0.05em; font-weight: 800; text-transform: uppercase;
  }
  h2 {
    margin: 0 0 1rem 0; font-size: 1.5rem; font-weight: 700;
  }
  p {
    margin: 0 0 1.5rem 0; font-size: 0.9rem; opacity: 0.8; line-height: 1.5; max-width: 260px;
  }
  .stats {
    font-size: 1.25rem; margin-bottom: 0.5rem; font-weight: 600;
  }
  button {
    pointer-events: auto;
    padding: 1rem 2rem;
    font-size: 1.1rem;
    font-family: inherit;
    font-weight: 700;
    color: var(--btn-text);
    background: var(--btn-bg);
    border: 2px solid var(--btn-border);
    border-radius: 0.5rem;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.1s, background 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 1rem;
  }
  button:active {
    transform: scale(0.95);
  }
  #hud {
    position: absolute; top: 0; left: 0; width: 100%;
    pointer-events: none;
    display: flex; justify-content: space-between;
    padding: 1.5rem 2rem;
    box-sizing: border-box;
    font-size: 1.5rem;
    font-weight: 700;
    z-index: 5;
  }
  .hud-item {
    display: flex; flex-direction: column;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }
  .hud-label {
    font-size: 0.75rem; text-transform: uppercase; opacity: 0.7; letter-spacing: 0.1em; margin-bottom: 0.2rem;
  }
  @media (prefers-color-scheme: light) {
    .hud-item {
      text-shadow: 0 2px 4px rgba(255,255,255,0.6);
    }
  }
</style>
</head>
<body>
  <div id="ui-layer">
    <div id="title-screen" class="screen">
      <h1>Chalk & Embers</h1>
      <p>Swipe up to flick sparks into the overcast sky. Chain reactions multiply your score before embers fade.</p>
      <button data-smoke="start" id="start-btn">Start Barrage</button>
    </div>
    <div id="game-over-screen" class="screen" style="display: none;">
      <h2>Time's Up</h2>
      <div class="stats">Score: <span id="final-score">0</span></div>
      <div class="stats">Max Combo: <span id="final-combo">0</span>x</div>
      <button data-smoke="restart" id="restart-btn">Play Again</button>
    </div>
  </div>
  
  <div id="hud" style="display: none;">
    <div class="hud-item" style="align-items: flex-start;">
      <div class="hud-label">Time</div>
      <div id="time">45</div>
    </div>
    <div class="hud-item" style="align-items: flex-end;">
      <div class="hud-label">Score</div>
      <div id="score">0</div>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

<script>
(function(){
  const PALETTE = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff'];
  
  let UI;
  let canvas, ctx;
  let width, height;
  let gameState = 'TITLE';
  
  let score = 0;
  let maxCombo = 0;
  let currentCombo = 0;
  let timeLeft = 45;
  let wave = 1;
  
  let entities = [];
  let clusters = [];
  let windStreaks = [];
  let wind = 0;
  let targetWind = 0;
  
  let lastTime = 0;
  let shakeTime = 0;
  let shakeIntensity = 0;
  
  let swipeStart = null;
  let swipeHistory = [];
  let lastFlickTime = 0;
  
  function getThemeColors() {
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    return {
      bg: isDark ? '#0f172a' : '#e2e8f0',
      text: isDark ? '#f8fafc' : '#0f172a',
      ember: isDark ? '#fbbf24' : '#d97706',
      cloud: isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)'
    };
  }

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    windStreaks.forEach(w => {
      if (w.x > width) w.x = Math.random() * width;
      if (w.y > height) w.y = Math.random() * height;
    });
  }

  function setGameState(state) {
    gameState = state;
    UI.title.style.display = 'none';
    UI.hud.style.display = 'none';
    UI.gameOver.style.display = 'none';
    
    if (state === 'TITLE') {
      UI.title.style.display = 'flex';
    } else if (state === 'PLAYING') {
      UI.hud.style.display = 'flex';
    } else if (state === 'GAMEOVER') {
      UI.gameOver.style.display = 'flex';
      UI.finalScore.innerText = score;
      UI.finalCombo.innerText = maxCombo;
    }
  }

  function spawnWave() {
    const numClusters = 4 + wave * 2;
    const radius = Math.max(15, 45 - wave * 5);
    
    for (let i = 0; i < numClusters; i++) {
      const r = radius + (Math.random() - 0.5) * 5;
      clusters.push({
        x: r + Math.random() * (width - r * 2),
        y: r + Math.random() * (height * 0.55 - r * 2),
        vx: (Math.random() - 0.5) * (10 + wave * 2),
        vy: (Math.random() - 0.5) * (10 + wave * 2),
        radius: r,
        scale: 0,
        color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
        active: true,
        offsets: Array.from({length: 5}, () => ({
          x: (Math.random() - 0.5) * r * 0.8,
          y: (Math.random() - 0.5) * r * 0.8,
          r: 0.5 + Math.random() * 0.5
        }))
      });
    }
  }

  function startGame() {
    score = 0;
    maxCombo = 0;
    currentCombo = 0;
    timeLeft = 45;
    wave = 1;
    entities = [];
    clusters = [];
    wind = 0;
    targetWind = 0;
    swipeStart = null;
    swipeHistory = [];
    lastFlickTime = performance.now();
    spawnWave();
    setGameState('PLAYING');
  }

  function hitCluster(cluster, projectile) {
    cluster.active = false;
    
    let combo = 1;
    if (projectile.type === 'particle') {
      combo = projectile.combo + 1;
    }
    
    if (gameState === 'PLAYING') {
      currentCombo = combo;
      if (combo > maxCombo) maxCombo = combo;
      const points = 10 * combo;
      score += points;
      
      entities.push({
        type: 'text',
        x: cluster.x,
        y: cluster.y,
        text: `+${points}`,
        subtext: combo > 1 ? `${combo}x` : '',
        life: 1.0,
        maxLife: 1.0,
        active: true,
        color: cluster.color
      });
    }
    
    const numParticles = gameState === 'PLAYING' ? (15 + wave * 3) : 15;
    for(let i=0; i<numParticles; i++) {
      const baseAngle = Math.atan2(projectile.vy, projectile.vx);
      const spread = Math.PI * 1.5;
      let finalAngle = baseAngle + (Math.random() - 0.5) * spread;
      if (Math.random() < 0.2) finalAngle = Math.random() * Math.PI * 2;
      
      const speed = 100 + Math.random() * 300;
      entities.push({
        type: 'particle',
        x: cluster.x,
        y: cluster.y,
        vx: Math.cos(finalAngle) * speed,
        vy: Math.sin(finalAngle) * speed,
        life: 0.5 + Math.random() * 0.7,
        maxLife: 1.2,
        color: cluster.color,
        active: true,
        combo: combo,
        trail: [],
        maxTrail: 8
      });
    }
    
    shakeTime = 0.2;
    shakeIntensity = Math.min(15, 3 + combo * 2);
    
    if (navigator.vibrate && gameState === 'PLAYING') {
      try { navigator.vibrate(Math.min(50, 10 + combo * 5)); } catch(err){}
    }
  }

  function update(dt, now) {
    if (gameState === 'PLAYING') {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        setGameState('GAMEOVER');
      }
      
      UI.time.innerText = Math.ceil(timeLeft);
      UI.score.innerText = score;
      
      if (timeLeft <= 10) {
        UI.time.style.color = Math.floor(now / 200) % 2 === 0 ? 'var(--danger)' : 'inherit';
      } else {
        UI.time.style.color = 'inherit';
      }
    }

    wind = wind + (targetWind - wind) * dt * 2;
    if (Math.random() < 0.01) {
      targetWind = (Math.random() - 0.5) * 250 * (1 + wave * 0.2);
    }
    
    clusters.forEach(c => {
      c.x += (c.vx + wind * 0.5) * dt;
      c.y += c.vy * dt;
      if (c.scale < 1) c.scale += dt * 3;
      if (c.scale > 1) c.scale = 1;
      
      if (gameState === 'PLAYING') {
        if (c.x < c.radius) { c.x = c.radius; c.vx *= -1; }
        if (c.x > width - c.radius) { c.x = width - c.radius; c.vx *= -1; }
        if (c.y < c.radius) { c.y = c.radius; c.vy *= -1; }
        if (c.y > height * 0.7 - c.radius) { c.y = height * 0.7 - c.radius; c.vy *= -1; }
      } else {
        if (c.y < -100 || c.y > height + 100 || c.x < -100 || c.x > width + 100) {
          c.active = false;
        }
      }
    });
    
    if (gameState !== 'PLAYING') {
      let activeClusters = clusters.filter(c => c.active);
      if (activeClusters.length < 5 && Math.random() < 0.02) {
        const r = 25 + Math.random() * 15;
        clusters.push({
          x: r + Math.random() * (width - r * 2),
          y: height + r,
          vx: (Math.random() - 0.5) * 20,
          vy: -40 - Math.random() * 60,
          radius: r,
          scale: 0,
          color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
          active: true,
          offsets: Array.from({length: 5}, () => ({
            x: (Math.random() - 0.5) * r * 0.8,
            y: (Math.random() - 0.5) * r * 0.8,
            r: 0.5 + Math.random() * 0.5
          }))
        });
      }
      
      if (Math.random() < 0.01) {
        entities.push({
          type: 'spark',
          x: width * 0.2 + Math.random() * width * 0.6,
          y: height,
          vx: (Math.random() - 0.5) * 300,
          vy: -800 - Math.random() * 600,
          life: 2.0,
          maxLife: 2.0,
          color: '#ffffff',
          active: true,
          trail: [],
          maxTrail: 10
        });
      }
    }
    
    for (let i = entities.length - 1; i >= 0; i--) {
      let e = entities[i];
      
      if (e.type === 'spark' || e.type === 'particle') {
        e.vy += 600 * dt; 
        e.vx += wind * dt;
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        e.life -= dt;
        
        if (e.trail) {
          e.trail.push({x: e.x, y: e.y});
          if (e.trail.length > e.maxTrail) e.trail.shift();
        }
        
        if (e.life <= 0) e.active = false;
        
        if (e.active && (e.type === 'spark' || e.type === 'particle')) {
          for (let j = 0; j < clusters.length; j++) {
            let c = clusters[j];
            if (!c.active) continue;
            let dx = c.x - e.x;
            let dy = c.y - e.y;
            if (dx*dx + dy*dy < c.radius * c.radius * c.scale) {
              hitCluster(c, e);
              e.active = false;
              break;
            }
          }
        }
      } else if (e.type === 'text') {
        e.y -= 40 * dt;
        e.life -= dt;
        if (e.life <= 0) e.active = false;
      }
      
      if (!e.active) entities.splice(i, 1);
    }
    
    if (gameState === 'PLAYING') {
      clusters = clusters.filter(c => c.active);
      if (clusters.length === 0) {
        wave++;
        spawnWave();
      }
    } else {
      clusters = clusters.filter(c => c.active);
    }
    
    if (shakeTime > 0) shakeTime -= dt;
  }

  function draw(now) {
    const theme = getThemeColors();
    
    ctx.save();
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, width, height);
    
    if (shakeTime > 0) {
      const dx = (Math.random() - 0.5) * shakeIntensity;
      const dy = (Math.random() - 0.5) * shakeIntensity;
      ctx.translate(dx, dy);
    }
    
    ctx.strokeStyle = theme.cloud;
    ctx.lineWidth = 2;
    ctx.beginPath();
    windStreaks.forEach(w => {
      w.x += wind * 0.016 * w.speed * 0.05;
      if (w.x > width + w.length) w.x = -w.length;
      if (w.x < -w.length) w.x = width + w.length;
      
      ctx.moveTo(w.x, w.y);
      ctx.lineTo(w.x + w.length, w.y);
    });
    ctx.stroke();
    
    clusters.forEach(c => {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = c.color;
      c.offsets.forEach(off => {
        ctx.beginPath();
        ctx.arc(c.x + off.x, c.y + off.y, c.radius * off.r * c.scale, 0, Math.PI * 2);
        ctx.fill();
      });
    });
    
    entities.forEach(e => {
      if (e.type === 'spark' || e.type === 'particle') {
        if (e.trail && e.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(e.trail[0].x, e.trail[0].y);
          for(let i=1; i<e.trail.length; i++) {
            ctx.lineTo(e.trail[i].x, e.trail[i].y);
          }
          ctx.strokeStyle = e.type === 'spark' ? theme.ember : e.color;
          ctx.lineWidth = e.type === 'spark' ? 4 : 3 * (e.life / e.maxLife);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.globalAlpha = e.life / e.maxLife;
          ctx.stroke();
        }
        
        ctx.globalAlpha = e.life / e.maxLife;
        ctx.fillStyle = e.type === 'spark' ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.type === 'spark' ? 3 : 4 * (e.life / e.maxLife), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      } else if (e.type === 'text') {
        const alpha = Math.min(1, e.life * 2);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = e.color;
        ctx.font = 'bold 24px ui-monospace, "SFMono-Regular", Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.text, e.x, e.y);
        if (e.subtext) {
          ctx.font = 'bold 32px ui-monospace, "SFMono-Regular", Menlo, monospace';
          ctx.fillStyle = theme.text;
          ctx.fillText(e.subtext, e.x, e.y - 28);
        }
        ctx.globalAlpha = 1.0;
      }
    });
    
    if (gameState === 'PLAYING' && swipeStart && swipeHistory.length > 0) {
      const current = swipeHistory[swipeHistory.length - 1];
      const totalDx = current.x - swipeStart.x;
      const totalDy = current.y - swipeStart.y;
      
      ctx.strokeStyle = theme.cloud;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 8]);
      ctx.beginPath();
      ctx.moveTo(swipeStart.x, height);
      ctx.lineTo(swipeStart.x + totalDx * 1.5, height + totalDy * 1.5);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    
    ctx.restore();
  }

  function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = now;
    
    update(dt, now);
    draw(now);
  }

  window.addEventListener('DOMContentLoaded', () => {
    UI = {
      title: document.getElementById('title-screen'),
      hud: document.getElementById('hud'),
      gameOver: document.getElementById('game-over-screen'),
      time: document.getElementById('time'),
      score: document.getElementById('score'),
      finalScore: document.getElementById('final-score'),
      finalCombo: document.getElementById('final-combo')
    };
    
    canvas = document.getElementById('game-canvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
    
    window.addEventListener('resize', resize);
    resize();
    
    for(let i=0; i<30; i++) {
      windStreaks.push({
        x: Math.random() * width,
        y: Math.random() * height,
        length: 40 + Math.random() * 80,
        speed: 1 + Math.random() * 2,
        alpha: 0.1 + Math.random() * 0.3
      });
    }
    
    setGameState('TITLE');
    
    lastTime = performance.now();
    requestAnimationFrame(loop);
  });
  
  window.addEventListener('pointerdown', e => {
    if (e.target.tagName === 'BUTTON') return;
    const now = performance.now();
    swipeStart = { x: e.clientX, y: e.clientY, t: now };
    swipeHistory = [{ x: e.clientX, y: e.clientY, t: now }];
  });

  window.addEventListener('pointermove', e => {
    if (!swipeStart) return;
    swipeHistory.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    if (swipeHistory.length > 20) swipeHistory.shift();
  });

  window.addEventListener('pointerup', e => {
    if (!swipeStart) return;
    
    const now = performance.now();
    const end = { x: e.clientX, y: e.clientY, t: now };
    swipeHistory.push(end);
    
    if (gameState === 'PLAYING' && (now - lastFlickTime > 250)) {
      let startForVelocity = swipeHistory[0];
      for (let i = swipeHistory.length - 1; i >= 0; i--) {
        if (end.t - swipeHistory[i].t > 150) {
          startForVelocity = swipeHistory[i];
          break;
        }
      }
      
      const dt = Math.max(1, end.t - startForVelocity.t);
      const dx = end.x - startForVelocity.x;
      const dy = end.y - startForVelocity.y;
      
      let vx = (dx / dt) * 1200;
      let vy = (dy / dt) * 1200;
      
      const totalDx = end.x - swipeStart.x;
      const totalDy = end.y - swipeStart.y;
      const totalDist = Math.sqrt(totalDx*totalDx + totalDy*totalDy);
      
      if (vy < -100 && totalDist > 20) {
        vx = Math.max(-2000, Math.min(2000, vx));
        vy = Math.max(-3000, Math.min(-500, vy));
        
        entities.push({
          type: 'spark',
          x: swipeStart.x, 
          y: height,
          vx: vx,
          vy: vy,
          life: 2.5,
          maxLife: 2.5,
          color: '#ffffff',
          active: true,
          trail: [],
          maxTrail: 12
        });
        
        lastFlickTime = now;
        
        if (navigator.vibrate) {
          try { navigator.vibrate(10); } catch(err){}
        }
      }
    }
    
    swipeStart = null;
    swipeHistory = [];
  });

})();
</script>
</body>
</html>
