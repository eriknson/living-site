<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Skyline</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080a0e;
    --fg: #e6eaef;
    --muted: #7a8494;
    --accent: #00e8c8;
    --accent2: #ff3d5a;
    --gold: #ffc857;
    --panel: rgba(10, 14, 20, 0.94);
    --line: rgba(255,255,255,0.07);
    --glow: rgba(0, 232, 200, 0.3);
    --fog: rgba(140, 150, 165, 0.55);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e8ecf0;
      --fg: #0f1419;
      --muted: #5c6672;
      --accent: #00796b;
      --accent2: #d32f4a;
      --gold: #c8860a;
      --panel: rgba(255, 255, 255, 0.96);
      --line: rgba(0,0,0,0.08);
      --glow: rgba(0, 121, 107, 0.22);
      --fog: rgba(180, 190, 200, 0.65);
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: max(10px, env(safe-area-inset-top)) 14px 6px;
    pointer-events: none;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #hud .big { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
  #hud .accent { color: var(--accent); }
  #hud .gold { color: var(--gold); }
  #loopRing {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    pointer-events: none;
    text-align: center;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  #loopRing .num {
    font-size: 18px;
    color: var(--gold);
    font-weight: 700;
    transition: transform 0.12s;
  }
  #loopRing .num.pop { transform: scale(1.3); }
  #canvas {
    flex: 1;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    pointer-events: none;
    text-align: center;
    background: radial-gradient(ellipse at 50% 35%, var(--glow), transparent 65%);
  }
  .overlay.hidden { display: none; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 22px;
    max-width: 340px;
    width: 100%;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.16em;
    margin-bottom: 8px;
    color: var(--accent);
  }
  .subtitle {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.65;
    margin-bottom: 18px;
  }
  .stat-row {
    display: flex;
    justify-content: space-around;
    margin: 14px 0 18px;
    font-size: 9px;
    color: var(--muted);
  }
  .stat-row div strong {
    display: block;
    font-size: 18px;
    color: var(--fg);
    margin-top: 4px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 168px;
    padding: 14px 26px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--bg);
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 0 28px var(--glow);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  @media (prefers-color-scheme: light) {
    button[data-smoke] { color: #fff; }
  }
  .hint {
    margin-top: 12px;
    font-size: 9px;
    color: var(--muted);
    line-height: 1.5;
  }
  #glitchWrap {
    position: absolute;
    bottom: max(14px, env(safe-area-inset-bottom));
    left: 14px; right: 14px;
    z-index: 5;
    pointer-events: none;
  }
  #glitchLabel {
    font-size: 8px;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
  }
  #glitchBar {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  #glitchFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent2), #ff8844);
    border-radius: 2px;
    transition: width 0.12s;
  }
  #timer {
    position: absolute;
    bottom: max(32px, calc(env(safe-area-inset-bottom) + 16px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>
      <div class="big" id="scoreEl">0</div>
      <span>score</span>
    </div>
    <div style="text-align:right">
      <div class="big accent" id="comboEl">×0</div>
      <span>combo</span>
    </div>
  </div>
  <div id="loopRing">
    <div class="num" id="loopEl">0</div>
    <span>/ 16 loop</span>
  </div>
  <canvas id="canvas"></canvas>
  <div id="glitchWrap">
    <div id="glitchLabel">signal noise</div>
    <div id="glitchBar"><div id="glitchFill"></div></div>
  </div>
  <div id="timer">0:45</div>

  <div class="overlay" id="titleOverlay">
    <div class="panel">
      <h1>Stutter Skyline</h1>
      <p class="subtitle">Tap the neon gaps as stutter beats roll across three lanes.<br>Nail a clean 16-beat loop before the drop hits the fog.</p>
      <button type="button" data-smoke="start" id="startBtn">Drop In</button>
      <p class="hint">Tap lanes · Space on desktop · 45s build</p>
    </div>
  </div>

  <div class="overlay hidden" id="gameOverOverlay">
    <div class="panel">
      <h1 id="endTitle">Peak Reached</h1>
      <p class="subtitle" id="endMsg">You rode the drop through the fog.</p>
      <div class="stat-row">
        <div>Score<strong id="finalScore">0</strong></div>
        <div>Loops<strong id="finalLoops">0</strong></div>
        <div>Accuracy<strong id="finalAcc">0%</strong></div>
      </div>
      <button type="button" data-smoke="restart" id="restartBtn">Again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('scoreEl');
  var comboEl = document.getElementById('comboEl');
  var loopEl = document.getElementById('loopEl');
  var glitchFill = document.getElementById('glitchFill');
  var timerEl = document.getElementById('timer');
  var titleOverlay = document.getElementById('titleOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var endTitle = document.getElementById('endTitle');
  var endMsg = document.getElementById('endMsg');
  var finalScore = document.getElementById('finalScore');
  var finalLoops = document.getElementById('finalLoops');
  var finalAcc = document.getElementById('finalAcc');

  var W = 360, H = 640;
  var LANES = 3;
  var state = 'title';
  var score = 0, combo = 0, maxCombo = 0;
  var hits = 0, misses = 0;
  var glitch = 0;
  var beatInLoop = 0, totalLoops = 0;
  var roundDuration = 45;
  var startTime = 0, lastFrame = 0;
  var audioCtx = null;
  var masterGain = null;
  var cleanGain = null;
  var glitchGain = null;
  var distortionNode = null;
  var notes = [];
  var particles = [];
  var noiseBars = [];
  var buildings = [];
  var pocketFlash = 0;
  var dropFlash = 0;
  var screenShake = 0;
  var hitPause = 0;
  var fogLift = 0;
  var rafId = 0;
  var noteId = 0;
  var lastScheduledBeat = -999;
  var nextSpawnAt = 0;
  var isDark = true;
  var idleT = 0;

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return true; }
  }

  isDark = prefersDark();
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        isDark = prefersDark();
      });
    } catch (e) { /* ignore */ }
  }

  function buildSkyline() {
    buildings = [
      { x: 0.02, w: 0.09, h: 0.22, peaks: 1 },
      { x: 0.11, w: 0.07, h: 0.16, peaks: 0 },
      { x: 0.18, w: 0.11, h: 0.34, peaks: 2 },
      { x: 0.30, w: 0.08, h: 0.28, peaks: 1 },
      { x: 0.40, w: 0.06, h: 0.19, peaks: 0 },
      { x: 0.48, w: 0.05, h: 0.38, peaks: 3 },
      { x: 0.55, w: 0.10, h: 0.24, peaks: 1 },
      { x: 0.67, w: 0.08, h: 0.30, peaks: 2 },
      { x: 0.77, w: 0.09, h: 0.18, peaks: 0 },
      { x: 0.86, w: 0.12, h: 0.26, peaks: 1 }
    ];
  }
  buildSkyline();

  function resize() {
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function getBPM(elapsed) {
    if (elapsed < 15) return 118;
    if (elapsed < 30) return 132;
    return 146;
  }

  function getStutterCount(elapsed) {
    if (elapsed < 15) return 2;
    if (elapsed < 30) return 3;
    return 4;
  }

  function getHitWindowMs(elapsed) {
    return Math.max(75, 145 - Math.floor(elapsed / 10) * 12);
  }

  function getScrollSpeed(elapsed) {
    return W * (0.34 + elapsed / roundDuration * 0.12);
  }

  function getBuildVolume(elapsed) {
    return Math.min(1, 0.12 + (elapsed / roundDuration) * 0.88);
  }

  function laneY(lane) {
    var top = H * 0.18;
    var span = H * 0.38;
    return top + (lane + 0.5) * (span / LANES);
  }

  function initAudio() {
    if (audioCtx) return true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.55;
      masterGain.connect(audioCtx.destination);

      cleanGain = audioCtx.createGain();
      cleanGain.gain.value = 1;
      cleanGain.connect(masterGain);

      glitchGain = audioCtx.createGain();
      glitchGain.gain.value = 0;
      distortionNode = audioCtx.createWaveShaper();
      distortionNode.curve = makeDistCurve(90);
      distortionNode.oversample = '2x';
      glitchGain.connect(distortionNode);
      distortionNode.connect(masterGain);
      return true;
    } catch (e) {
      return false;
    }
  }

  function makeDistCurve(amount) {
    var n = 256, curve = new Float32Array(n), deg = Math.PI / 180;
    for (var i = 0; i < n; i++) {
      var x = (i * 2) / n - 1;
      curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
  }

  function playKick(time, vol) {
    if (!audioCtx || !cleanGain) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, time);
      osc.frequency.exponentialRampToValueAtTime(42, time + 0.11);
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(vol * 0.75, time + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.2);
      osc.connect(g); g.connect(cleanGain);
      osc.start(time); osc.stop(time + 0.22);
    } catch (e) { /* ignore */ }
  }

  function playHat(time, vol) {
    if (!audioCtx || !cleanGain) return;
    try {
      var len = Math.floor(audioCtx.sampleRate * 0.035);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var g = audioCtx.createGain();
      var f = audioCtx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 7000;
      g.gain.setValueAtTime(vol * 0.22, time);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.035);
      src.connect(f); f.connect(g); g.connect(cleanGain);
      src.start(time); src.stop(time + 0.04);
    } catch (e) { /* ignore */ }
  }

  function playStutter(time, vol, lane) {
    if (!audioCtx || !cleanGain) return;
    try {
      var base = 180 + lane * 55;
      for (var i = 0; i < 3; i++) {
        var t = time + i * 0.032;
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = base + i * 35;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol * 0.13, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.028);
        osc.connect(g); g.connect(cleanGain);
        osc.start(t); osc.stop(t + 0.03);
      }
    } catch (e) { /* ignore */ }
  }

  function playGapTone(time, perfect) {
    if (!audioCtx || !cleanGain) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = perfect ? 920 : 700;
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(perfect ? 0.38 : 0.22, time + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.14);
      osc.connect(g); g.connect(cleanGain);
      osc.start(time); osc.stop(time + 0.15);
    } catch (e) { /* ignore */ }
  }

  function playDrop(time) {
    if (!audioCtx || !cleanGain) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(80, time);
      osc.frequency.exponentialRampToValueAtTime(28, time + 0.6);
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(0.85, time + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.9);
      osc.connect(g); g.connect(cleanGain);
      osc.start(time); osc.stop(time + 0.95);

      var len = Math.floor(audioCtx.sampleRate * 0.15);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.35, time + 0.05);
      ng.gain.exponentialRampToValueAtTime(0.0001, time + 0.2);
      src.connect(ng); ng.connect(cleanGain);
      src.start(time + 0.05); src.stop(time + 0.22);
    } catch (e) { /* ignore */ }
  }

  function playGlitchBurst() {
    if (!audioCtx || !glitchGain) return;
    try {
      var t = audioCtx.currentTime;
      glitchGain.gain.cancelScheduledValues(t);
      glitchGain.gain.setValueAtTime(Math.min(0.75, glitch / 110), t);
      glitchGain.gain.exponentialRampToValueAtTime(0.008, t + 0.28);
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 55 + Math.random() * 180;
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      osc.connect(g); g.connect(glitchGain);
      osc.start(t); osc.stop(t + 0.25);
    } catch (e) { /* ignore */ }
  }

  function spawnNote(elapsed) {
    var bpm = getBPM(elapsed);
    var beatDur = 60 / bpm;
    var stutter = getStutterCount(elapsed);
    var lead = 2.1 - Math.min(0.5, elapsed / roundDuration * 0.35);
    var lane = Math.floor(Math.random() * LANES);
    var gapTime = elapsed + lead;
    notes.push({
      id: ++noteId,
      time: gapTime,
      lane: lane,
      stutter: stutter,
      beatDur: beatDur,
      hit: false,
      missed: false
    });
    nextSpawnAt = elapsed + beatDur * (0.85 + Math.random() * 0.3);
  }

  function resetGame() {
    score = 0; combo = 0; maxCombo = 0;
    hits = 0; misses = 0; glitch = 0;
    beatInLoop = 0; totalLoops = 0;
    notes = []; particles = []; noiseBars = [];
    pocketFlash = 0; dropFlash = 0; screenShake = 0;
    hitPause = 0; fogLift = 0;
    noteId = 0; lastScheduledBeat = -999;
    nextSpawnAt = 0;
    updateHUD();
    if (glitchFill) glitchFill.style.width = '0%';
    if (timerEl) timerEl.textContent = '0:45';
  }

  function startGame() {
    resetGame();
    state = 'playing';
    if (titleOverlay) titleOverlay.classList.add('hidden');
    if (gameOverOverlay) gameOverOverlay.classList.add('hidden');
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    startTime = performance.now();
    lastFrame = startTime;
    spawnNote(0);
    scheduleBeats(0);
  }

  function endGame(reason) {
    state = 'gameover';
    if (endTitle) {
      endTitle.textContent = reason === 'overload' ? 'Track Blown' : 'Peak Reached';
    }
    if (endMsg) {
      endMsg.textContent = reason === 'overload'
        ? 'The stutter swallowed the skyline — too much noise.'
        : 'You cleared the fog and rode the drop home.';
    }
    var acc = (hits + misses) > 0 ? Math.round((hits / (hits + misses)) * 100) : 0;
    if (finalScore) finalScore.textContent = String(score);
    if (finalLoops) finalLoops.textContent = String(totalLoops);
    if (finalAcc) finalAcc.textContent = acc + '%';
    if (gameOverOverlay) gameOverOverlay.classList.remove('hidden');
    if (navigator.vibrate) try { navigator.vibrate([25, 35, 25]); } catch (e) {}
  }

  function scheduleBeats(fromElapsed) {
    if (!audioCtx || state !== 'playing') return;
    var bpm = getBPM(fromElapsed);
    var beatDur = 60 / bpm;
    var half = beatDur * 0.5;
    var vol = getBuildVolume(fromElapsed);
    var now = audioCtx.currentTime;
    var lookAhead = 2.8;
    var startIdx = Math.floor(lastScheduledBeat / half) + 1;
    var endIdx = Math.ceil((fromElapsed + lookAhead) / half);
    for (var idx = startIdx; idx <= endIdx; idx++) {
      var t = idx * half;
      if (t > roundDuration) break;
      var audioT = now + (t - fromElapsed);
      if (audioT < now - 0.05) continue;
      if (idx % 8 === 0) playKick(audioT, vol);
      else if (idx % 4 === 0) playHat(audioT, vol);
      else if (idx % 2 === 1) playStutter(audioT, vol * 0.7, idx % LANES);
      lastScheduledBeat = t;
    }
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) comboEl.textContent = '×' + combo;
    if (loopEl) {
      loopEl.textContent = String(beatInLoop);
      if (beatInLoop === 16 || beatInLoop === 8) {
        loopEl.classList.add('pop');
        setTimeout(function () { if (loopEl) loopEl.classList.remove('pop'); }, 140);
      }
    }
    if (glitchFill) glitchFill.style.width = Math.min(100, glitch) + '%';
  }

  function spawnParticles(x, y, color, n) {
    for (var i = 0; i < (n || 10); i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 1.5 + Math.random() * 4.5;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1,
        life: 1,
        color: color
      });
    }
  }

  function addNoiseBar(lane) {
    for (var i = 0; i < 4; i++) {
      noiseBars.push({
        lane: lane,
        x: Math.random() * W,
        w: 20 + Math.random() * 80,
        life: 0.6 + Math.random() * 0.4
      });
    }
  }

  function triggerDrop() {
    totalLoops++;
    beatInLoop = 0;
    dropFlash = 1;
    fogLift = 1;
    hitPause = 0.06;
    score += 500 + combo * 20;
    spawnParticles(W * 0.5, H * 0.35, isDark ? '#ffc857' : '#c8860a', 40);
    if (audioCtx) playDrop(audioCtx.currentTime);
    if (navigator.vibrate) try { navigator.vibrate([8, 20, 40, 20, 60]); } catch (e) {}
    updateHUD();
  }

  function registerMiss(offbeat) {
    misses++;
    combo = 0;
    beatInLoop = Math.max(0, beatInLoop - 2);
    glitch = Math.min(100, glitch + (offbeat ? 10 : 16));
    screenShake = 7;
    playGlitchBurst();
    if (navigator.vibrate) try { navigator.vibrate(45); } catch (e) {}
    if (glitch >= 100) endGame('overload');
    updateHUD();
  }

  function judgeTap() {
    if (state !== 'playing') return;
    var elapsed = (performance.now() - startTime) / 1000;
    var pocketX = W * 0.5;
    var best = null;
    var bestDist = Infinity;
    var winMs = getHitWindowMs(elapsed);

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.hit || n.missed) continue;
      var nx = timeToX(n.time, elapsed);
      var dist = Math.abs(nx - pocketX);
      if (dist < bestDist) { bestDist = dist; best = n; }
    }

    var windowPx = Math.max(44, (winMs / 1000) * getScrollSpeed(elapsed));
    if (best && bestDist < windowPx) {
      var timingMs = Math.abs(best.time - elapsed) * 1000;
      if (timingMs <= winMs) {
        var perfect = timingMs < 65;
        best.hit = true;
        hits++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        beatInLoop++;
        if (beatInLoop >= 16) triggerDrop();
        var pts = perfect ? 120 : 70;
        pts += combo * 4 + beatInLoop * 3;
        score += pts;
        glitch = Math.max(0, glitch - (perfect ? 14 : 7));
        pocketFlash = perfect ? 1 : 0.55;
        if (perfect) hitPause = 0.025;
        spawnParticles(pocketX, laneY(best.lane), perfect ? '#00e8c8' : '#44ddbb', perfect ? 16 : 9);
        if (audioCtx) playGapTone(audioCtx.currentTime, perfect);
        if (navigator.vibrate) try { navigator.vibrate(perfect ? 10 : 5); } catch (e) {}
      } else {
        registerMiss(false);
        addNoiseBar(best.lane);
      }
    } else {
      registerMiss(true);
      addNoiseBar(Math.floor(Math.random() * LANES));
    }
    updateHUD();
  }

  function timeToX(noteTime, elapsed) {
    return W * 0.5 + (noteTime - elapsed) * getScrollSpeed(elapsed);
  }

  function updateNotes(elapsed) {
    while (notes.length > 0 && notes[0].time < elapsed - 0.4) {
      var n = notes.shift();
      if (!n.hit && !n.missed) {
        n.missed = true;
        registerMiss(false);
        addNoiseBar(n.lane);
      }
    }
    if (elapsed >= nextSpawnAt && elapsed < roundDuration - 1.5) {
      spawnNote(elapsed);
    }
    scheduleBeats(elapsed);
  }

  function drawSkyline(elapsed) {
    var baseY = H * 0.72;
    var accent = isDark ? '#00e8c8' : '#00796b';
    var fogAmt = 0.35 + glitch * 0.004 - fogLift * 0.25;

    for (var b = 0; b < buildings.length; b++) {
      var bd = buildings[b];
      var bx = bd.x * W;
      var bw = bd.w * W;
      var bh = bd.h * H * (0.85 + getBuildVolume(elapsed) * 0.15);
      var by = baseY - bh;

      ctx.strokeStyle = accent;
      ctx.lineWidth = 1.2;
      ctx.globalAlpha = 0.55 + getBuildVolume(elapsed) * 0.35;
      ctx.beginPath();
      ctx.rect(bx, by, bw, bh);
      ctx.stroke();

      if (bd.peaks > 0) {
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + bw * 0.5, by - bh * 0.18);
        ctx.lineTo(bx + bw, by);
        ctx.stroke();
      }

      var winRows = Math.floor(bh / 22);
      var winCols = Math.floor(bw / 14);
      ctx.globalAlpha = 0.25 + Math.sin(elapsed * 2 + b) * 0.08;
      for (var r = 0; r < winRows; r++) {
        for (var c = 0; c < winCols; c++) {
          if ((r + c + b) % 3 !== 0) continue;
          var wx = bx + 4 + c * 12;
          var wy = by + 6 + r * 20;
          if (wy > baseY - 8) continue;
          ctx.fillStyle = accent;
          ctx.fillRect(wx, wy, 5, 8);
        }
      }
    }
    ctx.globalAlpha = 1;

    var fogGrad = ctx.createLinearGradient(0, baseY - H * 0.35, 0, baseY + H * 0.08);
    fogGrad.addColorStop(0, 'rgba(140,150,165,0)');
    fogGrad.addColorStop(0.45, isDark ? 'rgba(120,130,145,' + (fogAmt * 0.5) + ')' : 'rgba(170,180,190,' + (fogAmt * 0.55) + ')');
    fogGrad.addColorStop(1, isDark ? 'rgba(90,100,115,' + Math.min(0.85, fogAmt) + ')' : 'rgba(200,208,215,' + Math.min(0.9, fogAmt + 0.1) + ')');
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, baseY - H * 0.38, W, H * 0.45);
  }

  function drawLanes(elapsed) {
    var accent = isDark ? 'rgba(0,232,200,0.08)' : 'rgba(0,121,107,0.1)';
    for (var l = 0; l < LANES; l++) {
      var y = laneY(l);
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 8]);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function drawStutterTrail(n, x, y, elapsed, accent) {
    var st = n.stutter || 2;
    var gap = (n.beatDur || 0.5) * 0.22;
    for (var s = 0; s < st; s++) {
      var sx = x - (st - s) * gap * getScrollSpeed(elapsed);
      var pulse = 0.4 + Math.sin(elapsed * 18 + s * 2) * 0.25;
      ctx.globalAlpha = pulse * 0.7;
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.arc(sx, y, 6 + s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawNotes(elapsed) {
    var accent = isDark ? '#00e8c8' : '#00796b';
    var accent2 = isDark ? '#ff3d5a' : '#d32f4a';
    var gold = isDark ? '#ffc857' : '#c8860a';
    var pocketX = W * 0.5;

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      var x = timeToX(n.time, elapsed);
      if (x < -80 || x > W + 80) continue;
      var y = laneY(n.lane);
      var r = Math.max(24, W * 0.065);

      if (!n.hit && !n.missed) drawStutterTrail(n, x, y, elapsed, accent);

      if (n.hit) {
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = accent;
      } else if (n.missed) {
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = accent2;
      } else {
        var pulse = 0.75 + Math.sin(elapsed * 12 + n.lane) * 0.25;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = beatInLoop >= 14 ? gold : accent;
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 14;
      }

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (!n.hit && !n.missed) {
        ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = isDark ? '#080a0e' : '#fff';
        ctx.font = '9px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = 0.85;
        ctx.fillText('GAP', x, y);
      }
      ctx.globalAlpha = 1;
    }

    var ph = H * 0.38;
    var grad = ctx.createLinearGradient(pocketX - 40, 0, pocketX + 40, 0);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.5, isDark ? 'rgba(0,232,200,0.12)' : 'rgba(0,121,107,0.1)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(pocketX - 36, H * 0.16, 72, ph);

    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 7]);
    ctx.beginPath();
    ctx.moveTo(pocketX, H * 0.16);
    ctx.lineTo(pocketX, H * 0.16 + ph);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawNoiseBars(dt) {
    for (var i = noiseBars.length - 1; i >= 0; i--) {
      var bar = noiseBars[i];
      bar.life -= dt * 1.2;
      if (bar.life <= 0) { noiseBars.splice(i, 1); continue; }
      var y = laneY(bar.lane) - 12;
      ctx.globalAlpha = bar.life * 0.5;
      ctx.fillStyle = isDark ? '#ff3d5a' : '#d32f4a';
      ctx.fillRect(bar.x, y, bar.w * bar.life, 3);
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.life -= dt * 1.8;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGlitchOverlay() {
    if (glitch < 25 && dropFlash <= 0) return;
    var intensity = Math.max(glitch / 100, dropFlash * 0.5);
    ctx.globalAlpha = intensity * 0.35;
    ctx.fillStyle = isDark ? '#ff3d5a' : '#d32f4a';
    ctx.fillRect(3, 0, W * 0.04, H);
    ctx.fillStyle = isDark ? '#00e8c8' : '#00796b';
    ctx.fillRect(W * 0.04, 0, W * 0.03, H);
    ctx.globalAlpha = intensity * 0.08;
    ctx.fillStyle = '#fff';
    for (var y = 0; y < H; y += 4) {
      if (Math.random() > 0.92) ctx.fillRect(0, y, W, 1);
    }
    ctx.globalAlpha = 1;
  }

  function drawDropBanner(elapsed) {
    if (dropFlash <= 0) return;
    ctx.save();
    ctx.globalAlpha = dropFlash * 0.9;
    ctx.fillStyle = isDark ? '#ffc857' : '#c8860a';
    ctx.font = 'bold 22px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('DROP', W * 0.5, H * 0.12);
    ctx.globalAlpha = dropFlash * 0.4;
    ctx.font = '11px ui-monospace, monospace';
    ctx.fillText('loop cleared', W * 0.5, H * 0.12 + 22);
    ctx.restore();
  }

  function drawIdle(elapsed) {
    idleT = elapsed;
    var midY = H * 0.35;
    var accent = isDark ? '#00e8c8' : '#00796b';
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    for (var x = 0; x <= W; x += 5) {
      var y = midY + Math.sin(x * 0.018 + elapsed * 2.5) * 16;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
    drawSkyline(0);
  }

  function draw() {
    if (!ctx) return;
    var now = performance.now();
    if (hitPause > 0) {
      hitPause -= (now - lastFrame) / 1000;
      lastFrame = now;
      rafId = requestAnimationFrame(draw);
      return;
    }
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    var elapsed = state === 'playing' ? (now - startTime) / 1000 : idleT;
    if (state === 'playing') {
      if (elapsed >= roundDuration) {
        endGame('complete');
      } else {
        updateNotes(elapsed);
        var rem = Math.ceil(roundDuration - elapsed);
        if (timerEl) timerEl.textContent = '0:' + (rem < 10 ? '0' : '') + rem;
        if (masterGain) masterGain.gain.value = 0.28 + getBuildVolume(elapsed) * 0.45;
      }
    }

    dropFlash = Math.max(0, dropFlash - dt * 1.8);
    fogLift = Math.max(0, fogLift - dt * 0.35);

    var shakeX = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
    var shakeY = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
    screenShake *= 0.82;

    ctx.fillStyle = isDark ? '#080a0e' : '#e8ecf0';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(shakeX, shakeY);

    if (state === 'title') {
      drawIdle(now / 1000);
    } else {
      drawLanes(elapsed);
      drawSkyline(elapsed);
      drawNotes(elapsed);
      drawNoiseBars(dt);
      drawParticles(dt);

      if (pocketFlash > 0) {
        ctx.globalAlpha = pocketFlash * 0.2;
        ctx.fillStyle = isDark ? '#00e8c8' : '#00796b';
        ctx.fillRect(W * 0.5 - 2, H * 0.16, 4, H * 0.38);
        ctx.globalAlpha = 1;
        pocketFlash -= dt * 2.8;
      }

      drawDropBanner(elapsed);
      drawGlitchOverlay();
    }
    ctx.restore();

    rafId = requestAnimationFrame(draw);
  }

  function onTap(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (state === 'playing') judgeTap();
  }

  function safeCenterTap(e) {
    try {
      if (e && e.preventDefault) e.preventDefault();
      if (state === 'playing') judgeTap();
    } catch (err) { /* ignore */ }
  }

  function bindEvents() {
    resize();
    window.addEventListener('resize', resize);

    if (canvas) {
      canvas.addEventListener('touchstart', onTap, { passive: false });
      canvas.addEventListener('mousedown', onTap);
    }

    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (state === 'playing') judgeTap();
      }
    });

    if (startBtn) {
      startBtn.addEventListener('click', function (e) {
        if (e && e.stopPropagation) e.stopPropagation();
        startGame();
      });
    }
    if (restartBtn) {
      restartBtn.addEventListener('click', function (e) {
        if (e && e.stopPropagation) e.stopPropagation();
        startGame();
      });
    }

    var wrap = document.getElementById('wrap');
    if (wrap) {
      wrap.addEventListener('touchstart', function (e) {
        try {
          var t = e.target;
          if (t && t.getAttribute && t.getAttribute('data-smoke')) return;
          if (state !== 'playing') return;
        } catch (err) { /* ignore */ }
      }, { passive: true });

      wrap.addEventListener('click', function (e) {
        try {
          if (state !== 'playing') return;
          var rect = wrap.getBoundingClientRect();
          var cx = rect.left + rect.width / 2;
          var cy = rect.top + rect.height / 2;
          var dx = (e.clientX || cx) - cx;
          var dy = (e.clientY || cy) - cy;
          if (Math.abs(dx) < rect.width * 0.2 && Math.abs(dy) < rect.height * 0.2) {
            safeCenterTap(e);
          }
        } catch (err) { /* ignore */ }
      });
    }
  }

  bindEvents();
  draw();
})();
</script>
</body>
</html>
