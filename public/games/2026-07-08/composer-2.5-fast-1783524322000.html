<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glitch Stitch</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #06080f;
    --fg: #eef2f8;
    --muted: #6b7585;
    --accent: #00e5c0;
    --accent2: #ff3864;
    --gold: #ffb020;
    --panel: rgba(6, 10, 18, 0.94);
    --line: rgba(255,255,255,0.08);
    --glow: rgba(0, 229, 192, 0.32);
    --wave: #00b8ff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e8edf4;
      --fg: #0c1218;
      --muted: #5a6472;
      --accent: #008f78;
      --accent2: #d62850;
      --gold: #c47a00;
      --panel: rgba(255, 255, 255, 0.96);
      --line: rgba(0,0,0,0.08);
      --glow: rgba(0, 143, 120, 0.22);
      --wave: #0077aa;
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100dvw;
    height: 100dvh;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top)) 16px 8px;
    pointer-events: none;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  #hud .val { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
  #hud .accent { color: var(--accent); }
  #hud .gold { color: var(--gold); }
  #layerHud {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    text-align: center;
    pointer-events: none;
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 0.12em;
  }
  #layerHud .val { font-size: 17px; color: var(--gold); font-weight: 700; }
  #canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    touch-action: none;
  }
  #staticMeter {
    position: absolute;
    left: 16px; right: 16px;
    bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 5;
    pointer-events: none;
  }
  #staticLabel {
    font-size: 8px;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
  }
  #staticBar {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  #staticFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent2), var(--gold));
    border-radius: 2px;
    transition: width 0.12s;
  }
  #timer {
    position: absolute;
    bottom: max(36px, calc(env(safe-area-inset-bottom) + 22px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
    letter-spacing: 0.1em;
  }
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    pointer-events: none;
    text-align: center;
    background: radial-gradient(ellipse at 50% 35%, var(--glow), transparent 70%);
  }
  .overlay.hidden { display: none; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 22px;
    max-width: 340px;
    width: 100%;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.18em;
    margin-bottom: 8px;
    color: var(--accent);
  }
  .subtitle {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.65;
    margin-bottom: 18px;
  }
  .stat-row {
    display: flex;
    justify-content: space-around;
    margin: 14px 0 18px;
    font-size: 9px;
    color: var(--muted);
  }
  .stat-row div strong {
    display: block;
    font-size: 18px;
    color: var(--fg);
    margin-top: 4px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 168px;
    padding: 14px 26px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--bg);
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.1s;
    box-shadow: 0 0 28px var(--glow);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  @media (prefers-color-scheme: light) {
    button[data-smoke] { color: #fff; }
  }
  .hint {
    margin-top: 12px;
    font-size: 9px;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>
      <div class="val" id="scoreEl">0</div>
      <span>score</span>
    </div>
    <div style="text-align:right">
      <div class="val accent" id="comboEl">×0</div>
      <span>streak</span>
    </div>
  </div>
  <div id="layerHud">
    <div class="val" id="layerEl">L0</div>
    <span>synth layer</span>
  </div>
  <canvas id="canvas"></canvas>
  <div id="staticMeter">
    <div id="staticLabel">static</div>
    <div id="staticBar"><div id="staticFill"></div></div>
  </div>
  <div id="timer">0:50</div>

  <div class="overlay" id="titleOverlay">
    <div class="panel">
      <h1>Glitch Stitch</h1>
      <p class="subtitle">Beat fragments drop from the booth lights.<br>Tap each slice on the downbeat — stitch 8-bar loops before the mix glitches out.</p>
      <button type="button" data-smoke="start" id="startBtn">Drop In</button>
      <p class="hint">Tap anywhere · Space on desktop · 50s round</p>
    </div>
  </div>

  <div class="overlay hidden" id="gameOverOverlay">
    <div class="panel">
      <h1 id="endTitle">Set Cut</h1>
      <p class="subtitle" id="endMsg">The crowd fades into fog.</p>
      <div class="stat-row">
        <div>Score<strong id="finalScore">0</strong></div>
        <div>Layers<strong id="finalLayers">0</strong></div>
        <div>Accuracy<strong id="finalAcc">0%</strong></div>
      </div>
      <button type="button" data-smoke="restart" id="restartBtn">Rewind</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('scoreEl');
  var comboEl = document.getElementById('comboEl');
  var layerEl = document.getElementById('layerEl');
  var staticFill = document.getElementById('staticFill');
  var timerEl = document.getElementById('timer');
  var titleOverlay = document.getElementById('titleOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var endTitle = document.getElementById('endTitle');
  var endMsg = document.getElementById('endMsg');
  var finalScore = document.getElementById('finalScore');
  var finalLayers = document.getElementById('finalLayers');
  var finalAcc = document.getElementById('finalAcc');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');

  var W = 360, H = 640;
  var state = 'title';
  var score = 0, combo = 0, maxCombo = 0;
  var hits = 0, misses = 0, ghostHits = 0;
  var staticLevel = 0;
  var synthLayer = 0, maxLayer = 0;
  var barIndex = 0, beatInBar = 0, cleanBeatsInBar = 0;
  var roundDuration = 50;
  var startTime = 0, lastFrame = 0;
  var audioCtx = null, masterGain = null, staticGain = null;
  var slices = [], particles = [], crowdDots = [], waveHistory = [];
  var nextBeatAt = 0, beatCount = 0, lastScheduledBeat = -1;
  var hitFlash = 0, missFlash = 0, shake = 0, hitPause = 0;
  var glitchOffset = 0, layerPulse = 0, crowdPulse = 0;
  var isDark = true;
  var rafId = 0;
  var hitLineY = 0;
  var lastJudgment = '';

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return true; }
  }
  isDark = prefersDark();
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        isDark = prefersDark();
      });
    } catch (e) {}
  }

  function buildCrowd() {
    crowdDots = [];
    for (var i = 0; i < 48; i++) {
      crowdDots.push({
        x: 0.08 + Math.random() * 0.84,
        h: 0.04 + Math.random() * 0.12,
        phase: Math.random() * Math.PI * 2,
        spd: 0.8 + Math.random() * 1.2
      });
    }
  }
  buildCrowd();

  function resize() {
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    hitLineY = H * 0.76;
  }

  function getBPM(elapsed) {
    var base = 118 + Math.floor(elapsed / 12) * 4;
    return Math.min(base, 142);
  }

  function getHitWindow(elapsed) {
    return Math.max(0.06, 0.14 - elapsed * 0.0012);
  }

  function ghostChance(elapsed) {
    if (elapsed < 8) return 0;
    return Math.min(0.35, 0.08 + elapsed * 0.004);
  }

  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) {
        audioCtx = new AC();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.55;
        staticGain = audioCtx.createGain();
        staticGain.gain.value = 0;
        masterGain.connect(audioCtx.destination);
        staticGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function playKick(t) {
    if (!audioCtx || !masterGain) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.08);
      g.gain.setValueAtTime(0.7, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      o.connect(g);
      g.connect(masterGain);
      o.start(t);
      o.stop(t + 0.16);
    } catch (e) {}
  }

  function playHat(t, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      var len = Math.floor(audioCtx.sampleRate * 0.04);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var g = audioCtx.createGain();
      g.gain.value = vol || 0.18;
      var f = audioCtx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 7000;
      src.connect(f);
      f.connect(g);
      g.connect(masterGain);
      src.start(t);
    } catch (e) {}
  }

  function playStab(t, freq, vol) {
    if (!audioCtx || !masterGain || synthLayer < 2) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || 0.12, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.connect(g);
      g.connect(masterGain);
      o.start(t);
      o.stop(t + 0.14);
    } catch (e) {}
  }

  function playBass(t, freq) {
    if (!audioCtx || !masterGain || synthLayer < 1) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(g);
      g.connect(masterGain);
      o.start(t);
      o.stop(t + 0.2);
    } catch (e) {}
  }

  function playMelody(t, freq) {
    if (!audioCtx || !masterGain || synthLayer < 3) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.08, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      var f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 2200;
      o.connect(f);
      f.connect(g);
      g.connect(masterGain);
      o.start(t);
      o.stop(t + 0.28);
    } catch (e) {}
  }

  function burstStatic() {
    if (!audioCtx || !staticGain) return;
    try {
      var len = Math.floor(audioCtx.sampleRate * 0.18);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0.25 + staticLevel * 0.004, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      src.connect(g);
      g.connect(staticGain);
      src.start();
    } catch (e) {}
  }

  var bassNotes = [55, 55, 73.42, 65.41, 55, 82.41, 73.42, 65.41];
  var stabNotes = [220, 0, 277.18, 0, 329.63, 0, 277.18, 0];
  var melNotes = [440, 523.25, 659.25, 523.25, 440, 392, 440, 523.25];

  function scheduleBeat(beatIdx, beatTime, elapsed) {
    if (!audioCtx) return;
    playKick(beatTime);
    if (beatIdx % 2 === 1) playHat(beatTime, 0.14);
    if (beatIdx % 4 === 2) playHat(beatTime + 0.08, 0.1);
    var bi = beatIdx % 8;
    playBass(beatTime, bassNotes[bi]);
    if (bi % 2 === 0) playStab(beatTime, stabNotes[bi], 0.1);
    if (bi % 2 === 1) playMelody(beatTime, melNotes[bi]);
  }

  function makeWaveform(seed) {
    var pts = [];
    var n = 12 + Math.floor((seed * 17) % 8);
    for (var i = 0; i < n; i++) {
      pts.push(0.3 + Math.sin(seed * 13.7 + i * 1.7) * 0.25 + Math.cos(seed * 7.3 + i) * 0.15);
    }
    return pts;
  }

  function spawnSlice(isGhost, idealHitTime) {
    var seed = Math.random();
    var elapsed = state === 'playing' ? (performance.now() - startTime) / 1000 : 0;
    var fallTime = (60 / getBPM(elapsed)) * 2;
    var spawnAt = idealHitTime - fallTime * 1000;
    slices.push({
      x: W * 0.5,
      y: -40,
      w: Math.min(W * 0.62, 240),
      h: 36 + seed * 18,
      targetY: hitLineY,
      fallTime: fallTime,
      spawnAt: spawnAt,
      idealHit: idealHitTime,
      ghost: !!isGhost,
      wave: makeWaveform(seed),
      judged: false,
      id: beatCount + (isGhost ? 0.5 : 0)
    });
  }

  function resetRound() {
    score = 0; combo = 0; maxCombo = 0;
    hits = 0; misses = 0; ghostHits = 0;
    staticLevel = 0;
    synthLayer = 0; maxLayer = 0;
    barIndex = 0; beatInBar = 0; cleanBeatsInBar = 0;
    slices = []; particles = [];
    waveHistory = [];
    nextBeatAt = 0; beatCount = 0; lastScheduledBeat = -1;
    hitFlash = 0; missFlash = 0; shake = 0; hitPause = 0;
    glitchOffset = 0; layerPulse = 0;
    lastJudgment = '';
    updateHUD();
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) comboEl.textContent = '×' + combo;
    if (layerEl) layerEl.textContent = 'L' + synthLayer;
    if (staticFill) staticFill.style.width = Math.min(100, staticLevel) + '%';
  }

  function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = Math.ceil(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function addParticles(x, y, color, n) {
    for (var i = 0; i < (n || 10); i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 30,
        life: 0.4 + Math.random() * 0.3,
        max: 0.4 + Math.random() * 0.3,
        color: color
      });
    }
  }

  function judgeTap() {
    if (state !== 'playing') return;
    var now = performance.now();
    var elapsed = (now - startTime) / 1000;
    var windowMs = getHitWindow(elapsed) * 1000;
    var best = null, bestDist = Infinity;

    for (var i = 0; i < slices.length; i++) {
      var s = slices[i];
      if (s.judged) continue;
      var dist = Math.abs(now - s.idealHit);
      if (dist < bestDist) {
        bestDist = dist;
        best = s;
      }
    }

    if (!best || bestDist > windowMs) {
      registerMiss('early');
      return;
    }

    if (best.ghost) {
      best.judged = true;
      ghostHits++;
      registerMiss('ghost');
      return;
    }

    best.judged = true;
    var quality = bestDist < windowMs * 0.18 ? 'perfect' : 'good';
    registerHit(quality, best.x, hitLineY);
  }

  function registerHit(quality, x, y) {
    hits++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    cleanBeatsInBar++;
    var pts = quality === 'perfect' ? 120 : 70;
    pts += Math.min(combo * 8, 80);
    score += pts;
    hitFlash = quality === 'perfect' ? 1 : 0.6;
    layerPulse = 0.5;
    shake = 2;
    hitPause = quality === 'perfect' ? 0.03 : 0.015;
    lastJudgment = quality === 'perfect' ? 'PERFECT' : 'GOOD';
    staticLevel = Math.max(0, staticLevel - 4);
    addParticles(x, y, quality === 'perfect' ? '#00e5c0' : '#00b8ff', quality === 'perfect' ? 16 : 10);
    waveHistory.push({ t: performance.now(), amp: quality === 'perfect' ? 1 : 0.6 });
    if (waveHistory.length > 32) waveHistory.shift();
    try { navigator.vibrate && navigator.vibrate(quality === 'perfect' ? 18 : 10); } catch (e) {}
    updateHUD();
  }

  function registerMiss(reason) {
    misses++;
    combo = 0;
    cleanBeatsInBar = 0;
    missFlash = 0.8;
    shake = 6;
    staticLevel = Math.min(100, staticLevel + (reason === 'ghost' ? 14 : 10));
    lastJudgment = reason === 'ghost' ? 'GHOST!' : 'MISS';
    burstStatic();
    glitchOffset = 8;
    try { navigator.vibrate && navigator.vibrate([30, 20, 30]); } catch (e) {}
    updateHUD();
    if (staticLevel >= 100) endGame('glitch');
  }

  function onBeatMiss() {
    if (state !== 'playing') return;
    misses++;
    combo = 0;
    cleanBeatsInBar = 0;
    staticLevel = Math.min(100, staticLevel + 12);
    missFlash = 0.7;
    burstStatic();
    glitchOffset = 6;
    lastJudgment = 'LATE';
    updateHUD();
    if (staticLevel >= 100) endGame('glitch');
  }

  function advanceBar() {
    barIndex++;
    if (cleanBeatsInBar >= 7) {
      if (synthLayer < 4) {
        synthLayer++;
        layerPulse = 1.2;
        crowdPulse = 1;
        score += 500;
        try { navigator.vibrate && navigator.vibrate([8, 40, 8, 40, 20]); } catch (e) {}
      }
    }
    if (synthLayer > maxLayer) maxLayer = synthLayer;
    cleanBeatsInBar = 0;
    beatInBar = 0;
    updateHUD();
  }

  function beatLoop(now) {
    if (state !== 'playing') return;
    var elapsed = (now - startTime) / 1000;
    if (elapsed >= roundDuration) {
      endGame('time');
      return;
    }
    if (timerEl) timerEl.textContent = formatTime(roundDuration - elapsed);

    var bpm = getBPM(elapsed);
    var beatInterval = 60 / bpm * 1000;

    if (nextBeatAt === 0) nextBeatAt = now + 400;

    while (nextBeatAt <= now + 50) {
      beatCount++;
      beatInBar = (beatInBar + 1) % 8;
      if (beatInBar === 0 && beatCount > 1) advanceBar();

      spawnSlice(false, nextBeatAt);
      if (Math.random() < ghostChance(elapsed)) {
        spawnSlice(true, nextBeatAt + beatInterval * 0.5);
      }

      if (audioCtx && beatCount !== lastScheduledBeat) {
        lastScheduledBeat = beatCount;
        var t = audioCtx.currentTime + Math.max(0, (nextBeatAt - now) / 1000);
        scheduleBeat(beatCount, t, elapsed);
      }

      nextBeatAt += beatInterval;
    }

    for (var i = slices.length - 1; i >= 0; i--) {
      var sl = slices[i];
      if (sl.judged) {
        slices.splice(i, 1);
        continue;
      }
      if (now > sl.idealHit + getHitWindow(elapsed) * 1000 && !sl.judged) {
        sl.judged = true;
        if (!sl.ghost) onBeatMiss();
        slices.splice(i, 1);
      } else if (now > sl.idealHit + 600) {
        slices.splice(i, 1);
      }
    }
  }

  function endGame(reason) {
    state = 'over';
    if (gameOverOverlay) gameOverOverlay.classList.remove('hidden');
    if (finalScore) finalScore.textContent = String(score);
    if (finalLayers) finalLayers.textContent = String(maxLayer);
    var total = hits + misses;
    var acc = total > 0 ? Math.round((hits / total) * 100) : 0;
    if (finalAcc) finalAcc.textContent = acc + '%';

    if (reason === 'glitch') {
      if (endTitle) endTitle.textContent = 'Signal Lost';
      if (endMsg) endMsg.textContent = 'Static swallowed the loop — the booth went dark.';
    } else if (maxLayer >= 4) {
      if (endTitle) endTitle.textContent = 'Peak Hour';
      if (endMsg) endMsg.textContent = 'Full stack unlocked. The crowd pulse synced perfectly.';
    } else if (maxLayer >= 2) {
      if (endTitle) endTitle.textContent = 'Warm Mix';
      if (endMsg) endMsg.textContent = 'Layers stitched through the overcast — yacht-rock haze on the floor.';
    } else {
      if (endTitle) endTitle.textContent = 'Set Cut';
      if (endMsg) endMsg.textContent = 'July fog crept in at thirteen degrees. Try another loop.';
    }
  }

  function startGame() {
    initAudio();
    resetRound();
    state = 'playing';
    startTime = performance.now();
    lastFrame = startTime;
    nextBeatAt = 0;
    if (titleOverlay) titleOverlay.classList.add('hidden');
    if (gameOverOverlay) gameOverOverlay.classList.add('hidden');
    updateHUD();
    if (timerEl) timerEl.textContent = formatTime(roundDuration);
  }

  function drawBackground(t) {
    if (!ctx) return;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    if (isDark) {
      g.addColorStop(0, '#0a0e18');
      g.addColorStop(0.5, '#060810');
      g.addColorStop(1, '#040608');
    } else {
      g.addColorStop(0, '#dce4ef');
      g.addColorStop(0.5, '#e8edf4');
      g.addColorStop(1, '#cfd8e4');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = isDark ? 0.06 : 0.04;
    for (var row = 0; row < 12; row++) {
      ctx.fillStyle = row % 2 === 0 ? (isDark ? '#00e5c0' : '#008f78') : 'transparent';
      ctx.fillRect(0, row * (H / 12), W, H / 24);
    }
    ctx.restore();

    var scanY = (t * 0.04) % H;
    ctx.save();
    ctx.globalAlpha = isDark ? 0.04 : 0.03;
    ctx.fillStyle = '#00b8ff';
    ctx.fillRect(0, scanY, W, 2);
    ctx.restore();
  }

  function drawWaveformBand(y, h, amp, hue, alpha) {
    if (!ctx) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = isDark ? 'hsl(' + hue + ', 90%, 55%)' : 'hsl(' + hue + ', 70%, 40%)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    var steps = 40;
    for (var i = 0; i <= steps; i++) {
      var x = (i / steps) * W;
      var ph = performance.now() * 0.003 + i * 0.4 + y * 0.01;
      var yy = y + h * 0.5 + Math.sin(ph) * h * 0.35 * amp;
      if (i === 0) ctx.moveTo(x, yy);
      else ctx.lineTo(x, yy);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawSynthLayers(t) {
    var baseY = H * 0.12;
    var layers = [
      { on: true, hue: 180, label: 'kick' },
      { on: synthLayer >= 1, hue: 160, label: 'bass' },
      { on: synthLayer >= 2, hue: 200, label: 'stab' },
      { on: synthLayer >= 3, hue: 40, label: 'lead' },
      { on: synthLayer >= 4, hue: 350, label: 'crowd' }
    ];
    for (var i = 0; i < layers.length; i++) {
      if (!layers[i].on) continue;
      var pulse = 0.5 + Math.sin(t * 0.004 + i) * 0.2;
      if (layerPulse > 0 && i === synthLayer) pulse += layerPulse;
      drawWaveformBand(baseY + i * 22, 14, pulse, layers[i].hue, isDark ? 0.35 : 0.28);
    }
    if (layerPulse > 0) layerPulse -= 0.02;
  }

  function drawHitZone(t) {
    if (!ctx) return;
    var pulse = 0.6 + Math.sin(t * 0.008) * 0.15 + hitFlash * 0.4;
    ctx.save();
    ctx.strokeStyle = isDark ? 'rgba(0, 229, 192, ' + (0.25 + pulse * 0.35) + ')' : 'rgba(0, 143, 120, ' + (0.3 + pulse * 0.3) + ')';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(W * 0.08, hitLineY);
    ctx.lineTo(W * 0.92, hitLineY);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = isDark ? 'rgba(0, 229, 192, 0.08)' : 'rgba(0, 143, 120, 0.1)';
    ctx.fillRect(W * 0.08, hitLineY - 28, W * 0.84, 56);

    if (lastJudgment && (hitFlash > 0.1 || missFlash > 0.1)) {
      ctx.font = '700 13px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = missFlash > hitFlash ? '#ff3864' : '#00e5c0';
      ctx.globalAlpha = Math.max(hitFlash, missFlash);
      ctx.fillText(lastJudgment, W * 0.5, hitLineY - 42);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawSlice(s, now) {
    if (!ctx) return;
    var prog = Math.max(0, Math.min(1.05, (now - s.spawnAt) / (s.fallTime * 1000)));
    var ease = prog * prog * (3 - 2 * prog);
    var y = s.y + (s.targetY - s.y) * ease;
    var x = s.x - s.w * 0.5;
    var alpha = s.ghost ? 0.35 : 0.92;
    var stutter = s.ghost ? Math.sin(now * 0.02) * 3 : 0;

    ctx.save();
    if (shake > 0 && !s.ghost) {
      ctx.translate((Math.random() - 0.5) * shake * 0.3, (Math.random() - 0.5) * shake * 0.3);
    }

    ctx.globalAlpha = alpha;
    var grd = ctx.createLinearGradient(x, y, x + s.w, y + s.h);
    if (s.ghost) {
      grd.addColorStop(0, isDark ? 'rgba(255,56,100,0.2)' : 'rgba(214,40,80,0.15)');
      grd.addColorStop(1, isDark ? 'rgba(255,176,32,0.15)' : 'rgba(196,122,0,0.12)');
    } else {
      grd.addColorStop(0, isDark ? 'rgba(0,184,255,0.5)' : 'rgba(0,119,170,0.4)');
      grd.addColorStop(1, isDark ? 'rgba(0,229,192,0.45)' : 'rgba(0,143,120,0.35)');
    }
    ctx.fillStyle = grd;
    var rx = 10;
    ctx.beginPath();
    ctx.moveTo(x + rx, y + stutter);
    ctx.lineTo(x + s.w - rx, y + stutter);
    ctx.quadraticCurveTo(x + s.w, y + stutter, x + s.w, y + rx + stutter);
    ctx.lineTo(x + s.w, y + s.h - rx + stutter);
    ctx.quadraticCurveTo(x + s.w, y + s.h + stutter, x + s.w - rx, y + s.h + stutter);
    ctx.lineTo(x + rx, y + s.h + stutter);
    ctx.quadraticCurveTo(x, y + s.h + stutter, x, y + s.h - rx + stutter);
    ctx.lineTo(x, y + rx + stutter);
    ctx.quadraticCurveTo(x, y + stutter, x + rx, y + stutter);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = s.ghost ? 'rgba(255,56,100,0.5)' : (isDark ? 'rgba(0,229,192,0.7)' : 'rgba(0,143,120,0.6)');
    ctx.lineWidth = s.ghost ? 1 : 1.5;
    ctx.stroke();

    ctx.beginPath();
    var mid = y + s.h * 0.5 + stutter;
    var step = s.w / s.wave.length;
    for (var i = 0; i < s.wave.length; i++) {
      var wx = x + i * step + step * 0.5;
      var wy = mid - s.wave[i] * s.h * 0.35;
      if (i === 0) ctx.moveTo(wx, wy);
      else ctx.lineTo(wx, wy);
    }
    ctx.strokeStyle = s.ghost ? 'rgba(255,176,32,0.6)' : (isDark ? '#fff' : '#0c1218');
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if (s.ghost) {
      ctx.font = '8px ui-monospace, Menlo, monospace';
      ctx.fillStyle = 'rgba(255,56,100,0.7)';
      ctx.textAlign = 'center';
      ctx.fillText('?', s.x, y + s.h + 12 + stutter);
    }

    ctx.restore();
  }

  function drawCrowd(t) {
    if (!ctx) return;
    var floorY = H * 0.88;
    var pulseAmt = 0.04 + crowdPulse * 0.08;
    if (crowdPulse > 0) crowdPulse -= 0.015;

    ctx.save();
    for (var i = 0; i < crowdDots.length; i++) {
      var c = crowdDots[i];
      var bob = Math.sin(t * 0.003 * c.spd + c.phase) * pulseAmt;
      var cx = c.x * W;
      var cy = floorY - c.h * H * (0.5 + bob + (synthLayer >= 4 ? 0.15 : 0));
      var alpha = isDark ? 0.25 + synthLayer * 0.08 : 0.2 + synthLayer * 0.06;
      ctx.fillStyle = isDark ? 'rgba(0,229,192,' + alpha + ')' : 'rgba(0,143,120,' + alpha + ')';
      ctx.fillRect(cx - 3, cy, 6, c.h * H);
    }

    if (synthLayer >= 4) {
      ctx.globalAlpha = 0.15 + Math.sin(t * 0.006) * 0.05;
      for (var j = 0; j < 5; j++) {
        var lx = W * (0.1 + j * 0.2);
        var lg = ctx.createLinearGradient(lx, floorY - 80, lx, floorY);
        lg.addColorStop(0, 'rgba(0,229,192,0)');
        lg.addColorStop(0.5, isDark ? 'rgba(0,184,255,0.3)' : 'rgba(0,119,170,0.25)');
        lg.addColorStop(1, 'rgba(0,229,192,0)');
        ctx.fillStyle = lg;
        ctx.fillRect(lx - 15, floorY - 80, 30, 80);
      }
    }
    ctx.restore();
  }

  function drawBarProgress() {
    if (!ctx || state !== 'playing') return;
    var bx = W * 0.08;
    var bw = W * 0.84;
    var by = H * 0.055;
    ctx.save();
    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
    ctx.fillRect(bx, by, bw, 3);
    var prog = beatInBar / 8;
    ctx.fillStyle = isDark ? '#00e5c0' : '#008f78';
    ctx.fillRect(bx, by, bw * prog, 3);
    ctx.font = '8px ui-monospace, Menlo, monospace';
    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.35)';
    ctx.textAlign = 'left';
    ctx.fillText('bar ' + (barIndex + 1) + '/8', bx, by - 4);
    ctx.restore();
  }

  function drawParticles(dt) {
    if (!ctx) return;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life / p.max;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawStaticOverlay() {
    if (!ctx || staticLevel < 5) return;
    ctx.save();
    ctx.globalAlpha = staticLevel * 0.004;
    for (var i = 0; i < 80; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
      ctx.fillRect(Math.random() * W, Math.random() * H, Math.random() * 4 + 1, 1);
    }
    ctx.restore();
  }

  function drawGlitch() {
    if (!ctx || glitchOffset <= 0) return;
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#ff3864';
    ctx.fillRect(glitchOffset, 0, W, 3);
    ctx.fillStyle = '#00b8ff';
    ctx.fillRect(-glitchOffset, H * 0.4, W, 2);
    ctx.restore();
    glitchOffset *= 0.85;
    if (glitchOffset < 0.5) glitchOffset = 0;
  }

  function drawIdle(t) {
    drawBackground(t);
    drawSynthLayers(t);
    drawHitZone(t);
    drawCrowd(t);
    if (ctx) {
      ctx.save();
      ctx.globalAlpha = isDark ? 0.5 : 0.4;
      ctx.font = '9px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = isDark ? '#6b7585' : '#5a6472';
      ctx.fillText('stutter-house · overcast bay · 13°', W * 0.5, H * 0.94);
      ctx.restore();
    }
  }

  function frame(now) {
    rafId = requestAnimationFrame(frame);
    if (!ctx) return;
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    if (hitPause > 0) { hitPause -= dt; return; }

    if (state === 'playing') beatLoop(now);

    if (hitFlash > 0) hitFlash -= dt * 2.5;
    if (missFlash > 0) missFlash -= dt * 2;
    if (shake > 0) shake *= 0.88;

    if (staticGain && audioCtx) {
      try {
        staticGain.gain.value = staticLevel * 0.0015;
      } catch (e) {}
    }

    ctx.save();
    if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawBackground(now);
    drawSynthLayers(now);
    drawBarProgress();

    for (var i = 0; i < slices.length; i++) drawSlice(slices[i], now);

    drawHitZone(now);
    drawCrowd(now);
    drawParticles(dt);
    drawStaticOverlay();

    ctx.restore();
    drawGlitch();
  }

  function onTap(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (e && e.target && e.target.getAttribute && e.target.getAttribute('data-smoke')) return;
    judgeTap();
  }

  function onKey(e) {
    if (!e) return;
    if (e.code === 'Space' || e.code === 'Enter') {
      if (e.preventDefault) e.preventDefault();
      if (state === 'title') startBtn && startBtn.click();
      else if (state === 'over') restartBtn && restartBtn.click();
      else judgeTap();
    }
  }

  resize();
  window.addEventListener('resize', resize);

  if (canvas) {
    canvas.addEventListener('touchstart', onTap, { passive: false });
    canvas.addEventListener('mousedown', onTap);
  }
  window.addEventListener('keydown', onKey);

  if (startBtn) startBtn.addEventListener('click', function (e) {
    if (e && e.stopPropagation) e.stopPropagation();
    startGame();
  });
  if (restartBtn) restartBtn.addEventListener('click', function (e) {
    if (e && e.stopPropagation) e.stopPropagation();
    startGame();
  });

  if (titleOverlay) {
    titleOverlay.addEventListener('touchstart', function (e) {
      if (e && e.target && e.target.getAttribute && e.target.getAttribute('data-smoke')) return;
      if (state === 'title') judgeTap();
    }, { passive: false });
  }

  drawIdle(performance.now());
  rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
