<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kernel Triage</title>
<style>
  :root {
    --bg-color: #051005;
    --fg-color: #33ff33;
    --danger-color: #ff3333;
    --glow: 0 0 8px rgba(51, 255, 51, 0.6);
    --danger-glow: 0 0 8px rgba(255, 51, 51, 0.6);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #051005;
      --fg-color: #33ff33;
      --danger-color: #ff3333;
      --glow: 0 0 8px rgba(51, 255, 51, 0.6);
      --danger-glow: 0 0 8px rgba(255, 51, 51, 0.6);
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-color: #f0f5f0;
      --fg-color: #004400;
      --danger-color: #cc0000;
      --glow: none;
      --danger-glow: none;
    }
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-color);
    color: var(--fg-color);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.15) 2px,
      rgba(0, 0, 0, 0.15) 4px
    );
    pointer-events: none;
    z-index: 1;
  }
  @media (prefers-color-scheme: dark) {
    #scanlines {
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.15) 2px,
        rgba(0, 0, 0, 0.15) 4px
      );
    }
  }
  @media (prefers-color-scheme: light) {
    #scanlines {
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.05) 2px,
        rgba(0, 0, 0, 0.05) 4px
      );
    }
  }

  #game-canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 0;
  }

  #ui-layer {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg-color);
    pointer-events: none;
  }

  .screen > * {
    pointer-events: auto;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    text-align: center;
    text-shadow: var(--glow);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  p {
    font-size: 1.1rem;
    margin: 5px 0;
    text-align: center;
    opacity: 0.9;
    text-shadow: var(--glow);
    max-width: 80%;
  }

  button {
    background: var(--bg-color);
    color: var(--fg-color);
    border: 2px solid var(--fg-color);
    padding: 15px 30px;
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 30px;
    box-shadow: 4px 4px 0 var(--fg-color);
    transition: transform 0.1s, box-shadow 0.1s;
    text-shadow: var(--glow);
  }

  button:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--fg-color);
    background: var(--fg-color);
    color: var(--bg-color);
    text-shadow: none;
  }

  #hud {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    display: none;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }

  #timer-bar-container {
    flex-grow: 1;
    height: 12px;
    border: 2px solid var(--fg-color);
    margin-right: 20px;
    padding: 2px;
    box-shadow: var(--glow);
  }

  #timer-bar {
    height: 100%;
    background: var(--fg-color);
    width: 100%;
    transition: width 0.1s linear, background-color 0.2s;
  }

  #score {
    font-size: 1.5rem;
    font-weight: bold;
    text-shadow: var(--glow);
    min-width: 100px;
    text-align: right;
  }

  .cursor-blink::after {
    content: '█';
    animation: blink 1s step-end infinite;
    margin-left: 4px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="scanlines"></div>
  <canvas id="game-canvas"></canvas>
  
  <div id="ui-layer">
    <div id="start-screen" class="screen">
      <h1>Kernel Panic</h1>
      <p>Triage memory blocks to correct heap slots.</p>
      <p>Flick to sort. Prevent escalation.</p>
      <button data-smoke="start">INITIALIZE</button>
    </div>
    
    <div id="game-over-screen" class="screen" style="display:none;">
      <h1 style="color: var(--danger-color); text-shadow: var(--danger-glow);">SYSTEM HALTED</h1>
      <p>Privilege Escalation Successful.</p>
      <p>Uptime: <span id="score-display">0</span> cycles</p>
      <button data-smoke="restart">REBOOT</button>
    </div>
    
    <div id="hud">
      <div id="timer-bar-container">
        <div id="timer-bar"></div>
      </div>
      <div id="score" class="cursor-blink">0x0000</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let state = 'start';
    let score = 0;
    let timeRemaining = 100;
    let maxTime = 100;
    let blocks = [];
    let particles = [];
    let slots = [];
    let lastTime = 0;
    let spawnTimer = 0;
    let difficulty = 1;
    let gravity = { x: 0, y: 150 };
    let width, height;
    let fgColor, bgColor, dangerColor;
    let animationId;
    
    let pointer = { x: 0, y: 0, isDown: false, id: null };
    let dragBlock = null;
    let pointerHistory = [];
    let lastTouch = { x: 0, y: 0 };
    
    let audioCtx = null;

    // Precompute hex rows for background
    const hexChars = '0123456789ABCDEF';
    const hexRows = [];
    for (let i = 0; i < 100; i++) {
      let s = '';
      let seed = i * 12345 + 999;
      for (let j = 0; j < 16; j++) {
        seed = (seed * 9301 + 49297) % 233280;
        s += hexChars[Math.floor((seed / 233280) * 16)] + ' ';
      }
      hexRows.push(s);
    }
    let memoryDumpOffset = 0;

    function updateColors() {
      const style = getComputedStyle(document.body);
      fgColor = style.getPropertyValue('--fg-color').trim();
      bgColor = style.getPropertyValue('--bg-color').trim();
      dangerColor = style.getPropertyValue('--danger-color').trim();
    }

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          try {
            audioCtx = new AudioContextClass();
          } catch(e) {}
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        try { audioCtx.resume(); } catch(e) {}
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'success') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'spawn') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'bounce') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(200, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'crash') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.exponentialRampToValueAtTime(10, now + 1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 1);
          osc.start(now);
          osc.stop(now + 1);
        }
      } catch(e) {}
    }

    function triggerHaptic() {
      if (navigator.vibrate) {
        try { navigator.vibrate(50); } catch(e) {}
      }
    }

    function formatScore(s) {
      return '0x' + s.toString(16).toUpperCase().padStart(4, '0');
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      let dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
      
      let slotWidth = width / 3;
      let slotHeight = Math.min(100, height * 0.15);
      slots = [
        { x: 0, y: 0, w: slotWidth, h: slotHeight, type: 'SYS', flash: 0 },
        { x: slotWidth, y: 0, w: slotWidth, h: slotHeight, type: 'USR', flash: 0 },
        { x: slotWidth * 2, y: 0, w: slotWidth, h: slotHeight, type: 'NET', flash: 0 }
      ];
      lastTouch.x = width / 2;
      lastTouch.y = height / 2;
    }

    window.addEventListener('resize', resize);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateColors);

    // Prevent scrolling on touch
    window.addEventListener('touchstart', e => {
      if (e.target.tagName !== 'BUTTON') {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('pointerdown', e => {
      if (state !== 'playing') return;
      if (dragBlock) return;
      
      lastTouch.x = e.clientX;
      lastTouch.y = e.clientY;

      for (let i = blocks.length - 1; i >= 0; i--) {
        let b = blocks[i];
        let dx = b.x - e.clientX;
        let dy = b.y - e.clientY;
        if (dx*dx + dy*dy <= b.radius * b.radius * 2.25) {
          dragBlock = b;
          b.isDragging = true;
          b.vx = 0;
          b.vy = 0;
          pointer.id = e.pointerId;
          pointerHistory = [{x: e.clientX, y: e.clientY, time: performance.now()}];
          break;
        }
      }
    });

    window.addEventListener('pointermove', e => {
      if (state !== 'playing') return;
      lastTouch.x = e.clientX;
      lastTouch.y = e.clientY;
      
      if (dragBlock && e.pointerId === pointer.id) {
        dragBlock.x = e.clientX;
        dragBlock.y = e.clientY;
        pointerHistory.push({x: e.clientX, y: e.clientY, time: performance.now()});
        if (pointerHistory.length > 10) pointerHistory.shift();
      }
    });

    function releaseDrag(e) {
      if (state !== 'playing') return;
      if (dragBlock && e.pointerId === pointer.id) {
        dragBlock.isDragging = false;
        
        if (pointerHistory.length > 1) {
          let first = pointerHistory[0];
          let last = pointerHistory[pointerHistory.length - 1];
          let dt = (last.time - first.time) / 1000;
          if (dt > 0 && dt < 0.5) {
            dragBlock.vx = (last.x - first.x) / dt * 1.5;
            dragBlock.vy = (last.y - first.y) / dt * 1.5;
            
            let speed = Math.sqrt(dragBlock.vx**2 + dragBlock.vy**2);
            let maxSpeed = 2500;
            if (speed > maxSpeed) {
              dragBlock.vx = (dragBlock.vx / speed) * maxSpeed;
              dragBlock.vy = (dragBlock.vy / speed) * maxSpeed;
            }
          }
        }
        
        dragBlock = null;
        pointer.id = null;
      }
    }

    window.addEventListener('pointerup', releaseDrag);
    window.addEventListener('pointercancel', releaseDrag);

    let keyFlickVel = { x: 0, y: 0 };

    function grabBlockAt(x, y) {
      for (let i = blocks.length - 1; i >= 0; i--) {
        let b = blocks[i];
        let dx = b.x - x;
        let dy = b.y - y;
        if (dx * dx + dy * dy <= b.radius * b.radius * 2.25) {
          dragBlock = b;
          b.isDragging = true;
          b.vx = 0;
          b.vy = 0;
          pointer.id = 'keyboard';
          pointerHistory = [{ x: x, y: y, time: performance.now() }];
          return true;
        }
      }
      return false;
    }

    function handleKeyDown(e) {
      if ((e.key === 'Enter' || e.key === ' ') && (state === 'start' || state === 'gameover')) {
        e.preventDefault();
        startGame();
        return;
      }
      if (state !== 'playing') return;

      const moveSpeed = 14;
      let moved = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        lastTouch.x = Math.max(0, lastTouch.x - moveSpeed);
        keyFlickVel.x = -600;
        moved = true;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        lastTouch.x = Math.min(width, lastTouch.x + moveSpeed);
        keyFlickVel.x = 600;
        moved = true;
      } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        lastTouch.y = Math.max(0, lastTouch.y - moveSpeed);
        keyFlickVel.y = -600;
        moved = true;
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        lastTouch.y = Math.min(height, lastTouch.y + moveSpeed);
        keyFlickVel.y = 600;
        moved = true;
      }

      if (moved) {
        e.preventDefault();
        if (dragBlock && pointer.id === 'keyboard') {
          dragBlock.x = lastTouch.x;
          dragBlock.y = lastTouch.y;
          pointerHistory.push({ x: lastTouch.x, y: lastTouch.y, time: performance.now() });
          if (pointerHistory.length > 10) pointerHistory.shift();
        }
      }

      if (e.code === 'Space' && !dragBlock && !e.repeat) {
        e.preventDefault();
        grabBlockAt(lastTouch.x, lastTouch.y);
      }
    }

    function handleKeyUp(e) {
      if (state !== 'playing') return;
      if (e.code === 'Space' && dragBlock && pointer.id === 'keyboard') {
        e.preventDefault();
        dragBlock.isDragging = false;
        dragBlock.vx = keyFlickVel.x;
        dragBlock.vy = keyFlickVel.y;
        dragBlock = null;
        pointer.id = null;
        keyFlickVel = { x: 0, y: 0 };
      }
    }

    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);

    function createParticles(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 400,
          vy: (Math.random() - 0.5) * 400,
          life: 1.0,
          color: color,
          size: Math.random() * 3 + 2
        });
      }
    }

    function spawnBlock() {
      const types = ['SYS', 'USR', 'NET'];
      let isErr = Math.random() < (0.1 + difficulty * 0.02);
      let type = isErr ? 'ERR' : types[Math.floor(Math.random() * types.length)];
      
      let radius = 25;
      let x = width / 2 + (Math.random() - 0.5) * (width - radius * 4);
      x = Math.max(radius, Math.min(width - radius, x));
      
      let b = {
        x: x,
        y: height - radius - 60, // Above HUD
        vx: (Math.random() - 0.5) * 200,
        vy: -200 - Math.random() * 200,
        radius: radius,
        type: type,
        isDragging: false,
        maxLifetime: 15 - difficulty * 0.5,
        lifetime: 15 - difficulty * 0.5,
        trail: [],
        dead: false
      };
      b.maxLifetime = Math.max(5, b.maxLifetime);
      b.lifetime = b.maxLifetime;
      
      blocks.push(b);
      playSound('spawn');
    }

    function circleRectCollide(circle, rect) {
      let testX = circle.x;
      let testY = circle.y;

      if (circle.x < rect.x) testX = rect.x;
      else if (circle.x > rect.x + rect.w) testX = rect.x + rect.w;

      if (circle.y < rect.y) testY = rect.y;
      else if (circle.y > rect.y + rect.h) testY = rect.y + rect.h;

      let distX = circle.x - testX;
      let distY = circle.y - testY;
      let distance = Math.sqrt((distX*distX) + (distY*distY));

      return distance <= circle.radius;
    }

    function resolveCollisions() {
      for (let i = 0; i < blocks.length; i++) {
        for (let j = i + 1; j < blocks.length; j++) {
          let b1 = blocks[i];
          let b2 = blocks[j];
          let dx = b2.x - b1.x;
          let dy = b2.y - b1.y;
          let dist = Math.sqrt(dx*dx + dy*dy);
          let minDist = b1.radius + b2.radius;
          
          if (dist < minDist && dist > 0) {
            let overlap = minDist - dist;
            let nx = dx / dist;
            let ny = dy / dist;
            
            if (!b1.isDragging) {
              b1.x -= nx * overlap * 0.5;
              b1.vx -= nx * 50;
              b1.vy -= ny * 50;
            }
            if (!b2.isDragging) {
              b2.x += nx * overlap * 0.5;
              b2.vx += nx * 50;
              b2.vy += ny * 50;
            }
          }
        }
      }
    }

    function gameOver() {
      state = 'gameover';
      document.getElementById('game-over-screen').style.display = 'flex';
      document.getElementById('hud').style.display = 'none';
      document.getElementById('score-display').innerText = formatScore(score);
      playSound('crash');
      triggerHaptic();
      if (dragBlock) {
        dragBlock.isDragging = false;
        dragBlock = null;
        pointer.id = null;
      }
    }

    function update(dt) {
      if (state !== 'playing') return;

      timeRemaining -= dt * (2 + difficulty * 0.5);
      if (timeRemaining <= 0) {
        gameOver();
        return;
      }

      let tb = document.getElementById('timer-bar');
      tb.style.width = Math.max(0, (timeRemaining / maxTime * 100)) + '%';
      if (timeRemaining < 20) {
        tb.style.backgroundColor = dangerColor;
      } else {
        tb.style.backgroundColor = fgColor;
      }
      document.getElementById('score').innerText = formatScore(score);

      difficulty += dt * 0.02;
      
      if (Math.random() < 0.005 * difficulty) {
        gravity.x = (Math.random() - 0.5) * 400 * Math.min(difficulty, 3);
      }
      gravity.x += (0 - gravity.x) * dt * 0.5;

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnBlock();
        spawnTimer = Math.max(0.5, 2.0 - difficulty * 0.1);
      }

      for (let s of slots) {
        if (s.flash > 0) s.flash -= dt * 2;
      }

      for (let b of blocks) {
        if (!b.isDragging) {
          b.vx += gravity.x * dt;
          b.vy += gravity.y * dt;
          
          b.vx *= 0.99;
          b.vy *= 0.99;

          b.x += b.vx * dt;
          b.y += b.vy * dt;

          let bounced = false;
          if (b.x - b.radius < 0) { b.x = b.radius; b.vx *= -0.8; bounced = true; }
          if (b.x + b.radius > width) { b.x = width - b.radius; b.vx *= -0.8; bounced = true; }
          if (b.y - b.radius < 0) { b.y = b.radius; b.vy *= -0.8; bounced = true; }
          if (b.y + b.radius > height) { b.y = height - b.radius; b.vy *= -0.8; bounced = true; }
          
          if (bounced && Math.sqrt(b.vx**2 + b.vy**2) > 100) {
            playSound('bounce');
          }
        }
        
        if (b.type !== 'ERR') {
          b.lifetime -= dt;
          if (b.lifetime <= 0) {
            timeRemaining -= 10;
            createParticles(b.x, b.y, dangerColor);
            playSound('error');
            b.dead = true;
          }
        } else {
          let dx = lastTouch.x - b.x;
          let dy = lastTouch.y - b.y;
          let dist = Math.sqrt(dx*dx + dy*dy);
          if (dist > 0) {
            b.vx += (dx / dist) * 150 * dt;
            b.vy += (dy / dist) * 150 * dt;
          }
        }
        
        if (Math.abs(b.vx) > 10 || Math.abs(b.vy) > 10 || b.isDragging) {
          b.trail.push({x: b.x, y: b.y});
          if (b.trail.length > 15) b.trail.shift();
        }
      }

      resolveCollisions();

      for (let b of blocks) {
        b.x = Math.max(b.radius, Math.min(width - b.radius, b.x));
        b.y = Math.max(b.radius, Math.min(height - b.radius, b.y));
      }

      for (let i = blocks.length - 1; i >= 0; i--) {
        let b = blocks[i];
        if (b.dead) continue;
        
        for (let s of slots) {
          if (circleRectCollide(b, s)) {
            if (b.type === 'ERR') {
              timeRemaining -= 25;
              playSound('error');
              createParticles(b.x, b.y, dangerColor);
              triggerHaptic();
            } else if (b.type === s.type) {
              score += 10;
              timeRemaining = Math.min(maxTime, timeRemaining + 15);
              playSound('success');
              createParticles(b.x, b.y, fgColor);
              s.flash = 1.0;
            } else {
              timeRemaining -= 15;
              playSound('error');
              createParticles(b.x, b.y, dangerColor);
              triggerHaptic();
            }
            if (b === dragBlock) {
              dragBlock = null;
              pointer.id = null;
            }
            b.dead = true;
            break;
          }
        }
      }

      blocks = blocks.filter(b => !b.dead);

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawMemoryDump(dt) {
      ctx.fillStyle = fgColor;
      ctx.globalAlpha = 0.04;
      ctx.font = '12px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      
      memoryDumpOffset += dt * 15;
      if (memoryDumpOffset > 20) memoryDumpOffset -= 20;
      
      for (let i = -1; i < height / 20 + 1; i++) {
        let rowY = i * 20 + memoryDumpOffset;
        let rowIndex = Math.abs(i) % hexRows.length;
        ctx.fillText(`0x${(rowIndex*16).toString(16).padStart(4,'0').toUpperCase()}  ${hexRows[rowIndex]}`, 10, rowY);
      }
      ctx.globalAlpha = 1.0;
    }

    function draw(dt) {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, width, height);

      drawMemoryDump(dt);

      ctx.lineWidth = 2;
      ctx.font = 'bold 16px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let s of slots) {
        if (s.flash > 0) {
          ctx.fillStyle = fgColor;
          ctx.globalAlpha = s.flash * 0.4;
          ctx.fillRect(s.x, s.y, s.w, s.h);
          ctx.globalAlpha = 1.0;
        }
        ctx.strokeStyle = fgColor;
        ctx.strokeRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = fgColor;
        ctx.fillText(`[${s.type}]`, s.x + s.w/2, s.y + s.h/2);
      }

      ctx.font = '12px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = fgColor;
      ctx.globalAlpha = 0.7;
      ctx.fillText(`SYS.GRAV_X = ${gravity.x.toFixed(1)}`, 10, slots[0].h + 10);
      ctx.fillText(`SYS.GRAV_Y = ${gravity.y.toFixed(1)}`, 10, slots[0].h + 25);
      ctx.fillText(`SYS.ENTROPY = ${difficulty.toFixed(2)}`, 10, slots[0].h + 40);
      ctx.globalAlpha = 1.0;

      ctx.font = 'bold 14px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let b of blocks) {
        let color = b.type === 'ERR' ? dangerColor : fgColor;
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        
        if (b.trail.length > 1) {
          ctx.beginPath();
          for (let i = 0; i < b.trail.length; i++) {
            let pt = b.trail[i];
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.globalAlpha = 0.3;
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        
        if (b.isDragging) {
          ctx.globalAlpha = 0.3;
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }

        if (b.type === 'ERR') {
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillText('ERR', b.x, b.y);
        } else {
          ctx.stroke();
          ctx.fillText(b.type, b.x, b.y);
          
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius + 4, -Math.PI/2, -Math.PI/2 + (b.lifetime / b.maxLifetime) * Math.PI * 2);
          ctx.stroke();
        }
      }

      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1.0;
    }

    function loop(timestamp) {
      let dt = (timestamp - lastTime) / 1000;
      if (dt > 0.1) dt = 0.1;
      lastTime = timestamp;

      if (state === 'playing') {
        update(dt);
      }
      draw(dt);

      animationId = requestAnimationFrame(loop);
    }

    function startGame() {
      initAudio();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      
      state = 'playing';
      score = 0;
      timeRemaining = maxTime;
      blocks = [];
      particles = [];
      difficulty = 1;
      gravity = { x: 0, y: 150 };
      spawnTimer = 1;
      dragBlock = null;
      pointer.id = null;
      
      updateColors();
      resize();
      
      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(function startLoop(timestamp) {
        lastTime = timestamp;
        animationId = requestAnimationFrame(loop);
      });
    }

    document.querySelector('[data-smoke="start"]').addEventListener('click', startGame);
    document.querySelector('[data-smoke="restart"]').addEventListener('click', startGame);

    // Initial setup
    updateColors();
    resize();
    draw(0); // Draw initial frame behind start screen
  </script>
</body>
</html>
