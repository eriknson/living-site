<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Loop</title>
<style>
  :root {
    --bg: #e8ecef;
    --fg: #1a2328;
    --muted: #6b7a82;
    --neon: #00d4aa;
    --neon-dim: #00a884;
    --danger: #e85d4c;
    --panel: rgba(255,255,255,0.82);
    --panel-border: rgba(0,0,0,0.08);
    --fog: rgba(200,210,218,0.75);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a1f;
      --fg: #e2eaef;
      --muted: #7a8f9a;
      --neon: #3dffc8;
      --neon-dim: #1abf96;
      --danger: #ff6b5a;
      --panel: rgba(20,28,34,0.88);
      --panel-border: rgba(255,255,255,0.08);
      --fog: rgba(30,42,52,0.82);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: manipulation;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    z-index: 10;
  }
  #hud .val { color: var(--fg); font-size: 13px; }
  #arena-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.35s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px 32px;
    max-width: 340px;
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .panel h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .panel p {
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .panel .sub {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--neon-dim);
    margin-bottom: 16px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 160px;
    padding: 14px 28px;
    border: none;
    border-radius: 999px;
    background: var(--neon);
    color: #0a1218;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 4px 20px rgba(0,212,170,0.35);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  @media (prefers-color-scheme: dark) {
    button[data-smoke] { color: #0a1218; box-shadow: 0 4px 24px rgba(61,255,200,0.25); }
  }
  #result-title { font-size: 20px; margin-bottom: 6px; }
  #result-detail { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  #bar-dots {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    pointer-events: none;
    z-index: 15;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--neon-dim);
    opacity: 0.35;
    transition: background 0.2s, opacity 0.2s;
  }
  .dot.active { background: var(--neon); opacity: 1; border-color: var(--neon); }
  .dot.done { background: var(--neon-dim); opacity: 0.7; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span>Combo <span class="val" id="combo">0</span></span>
    <span>Bar <span class="val" id="bar">1</span>/4</span>
    <span>Miss <span class="val" id="misses">0</span>/3</span>
  </div>
  <div id="arena-wrap">
    <canvas id="game"></canvas>
    <div id="bar-dots">
      <div class="dot active" data-bar="0"></div>
      <div class="dot" data-bar="1"></div>
      <div class="dot" data-bar="2"></div>
      <div class="dot" data-bar="3"></div>
    </div>
    <div class="overlay" id="title-screen">
      <div class="panel">
        <div class="sub">Stutter House · 14° Fog</div>
        <h1>Fog Loop</h1>
        <p>Tap the neon pulses as they cross the beat line. Nail one flawless four-bar loop before the fog clears. Avoid ghost notes.</p>
        <button type="button" data-smoke="start">Drop In</button>
      </div>
    </div>
    <div class="overlay hidden" id="gameover-screen">
      <div class="panel">
        <div class="sub" id="result-sub">Loop ended</div>
        <div id="result-title">Glitch</div>
        <div id="result-detail">The skyline stuttered.</div>
        <button type="button" data-smoke="restart">Replay Loop</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var comboEl = document.getElementById('combo');
  var barEl = document.getElementById('bar');
  var missesEl = document.getElementById('misses');
  var titleScreen = document.getElementById('title-screen');
  var gameoverScreen = document.getElementById('gameover-screen');
  var resultTitle = document.getElementById('result-title');
  var resultDetail = document.getElementById('result-detail');
  var resultSub = document.getElementById('result-sub');
  var barDots = document.querySelectorAll('.dot');
  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');

  var W = 360, H = 640;
  var state = 'title';
  var audioCtx = null;
  var masterGain = null;
  var bpm = 122;
  var beatDur = 60 / bpm;
  var loopBeatDur = beatDur;
  var notes = [];
  var particles = [];
  var skyline = [];
  var fogPhase = 0;
  var fogLevel = 0.88;
  var fogDecay = 0.00032;
  var combo = 0;
  var misses = 0;
  var currentBar = 0;
  var barMisses = 0;
  var loopStart = 0;
  var songTime = 0;
  var lastFrame = 0;
  var glitchAmt = 0;
  var hitFlash = 0;
  var missFlash = 0;
  var escLevel = 0;
  var rafId = 0;
  var darkMode = false;

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  }

  function resize() {
    if (!canvas) return;
    var wrap = document.getElementById('arena-wrap');
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    buildSkyline();
  }

  function buildSkyline() {
    skyline = [];
    var x = 0;
    var baseY = H * 0.72;
    while (x < W + 80) {
      var bw = 18 + Math.floor(Math.random() * 42);
      var bh = 40 + Math.floor(Math.random() * (H * 0.28));
      skyline.push({ x: x, w: bw, h: bh, base: baseY, windows: Math.floor(Math.random() * 5) + 2 });
      x += bw + 4 + Math.floor(Math.random() * 12);
    }
  }

  function initAudio() {
    if (audioCtx) return true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(audioCtx.destination);
      return true;
    } catch (e) { return false; }
  }

  function playTone(freq, dur, type, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || 0.2, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) { /* silent */ }
  }

  function playKick() { playTone(90, 0.12, 'sine', 0.45); playTone(48, 0.08, 'triangle', 0.2); }
  function playSnare() { playTone(220, 0.06, 'triangle', 0.15); playTone(400, 0.04, 'square', 0.08); }
  function playHat() { playTone(8000, 0.03, 'square', 0.06); }
  function playMiss() { playTone(120, 0.2, 'sawtooth', 0.12); }
  function playWin() {
    playTone(440, 0.15, 'sine', 0.2);
    setTimeout(function () { playTone(554, 0.15, 'sine', 0.2); }, 120);
    setTimeout(function () { playTone(659, 0.25, 'sine', 0.25); }, 240);
  }

  function stutterOffset(beatIdx) {
    var base = 0.04 + escLevel * 0.03;
    var seed = Math.sin(beatIdx * 2.71 + escLevel) * 10000;
    return ((seed - Math.floor(seed)) - 0.5) * 2 * base;
  }

  function generateLoop() {
    notes = [];
    var beatsPerBar = 16;
    var totalBeats = beatsPerBar * 4;
    var t = 0;
    for (var b = 0; b < totalBeats; b++) {
      var bar = Math.floor(b / beatsPerBar);
      var beatInBar = b % beatsPerBar;
      var isDown = beatInBar % 4 === 0;
      var isSnare = beatInBar % 8 === 4;
      var ghostChance = 0.08 + escLevel * 0.12 + bar * 0.04;
      var restChance = 0.15;

      if (Math.random() > restChance) {
        var offset = stutterOffset(b);
        notes.push({
          time: t + offset,
          bar: bar,
          type: 'real',
          lane: isDown ? 0 : (isSnare ? 1 : 2),
          hit: false,
          judged: false
        });
      }

      if (Math.random() < ghostChance) {
        var gTime = t + beatDur * (0.25 + Math.random() * 0.5) + stutterOffset(b + 0.5) * 0.5;
        notes.push({
          time: gTime,
          bar: bar,
          type: 'ghost',
          lane: Math.floor(Math.random() * 3),
          hit: false,
          judged: false
        });
      }

      t += beatDur / 4;
    }
    notes.sort(function (a, b) { return a.time - b.time; });
  }

  function resetGame() {
    combo = 0;
    misses = 0;
    currentBar = 0;
    barMisses = 0;
    fogLevel = 0.88;
    escLevel = 0;
    glitchAmt = 0;
    hitFlash = 0;
    missFlash = 0;
    songTime = 0;
    loopStart = performance.now();
    lastFrame = loopStart;
    loopBeatDur = 60 / (122 + escLevel * 4);
    beatDur = loopBeatDur;
    generateLoop();
    updateHud();
    updateBarDots();
  }

  function updateHud() {
    if (comboEl) comboEl.textContent = String(combo);
    if (barEl) barEl.textContent = String(Math.min(4, currentBar + 1));
    if (missesEl) missesEl.textContent = String(misses);
  }

  function updateBarDots() {
    for (var i = 0; i < barDots.length; i++) {
      barDots[i].classList.remove('active', 'done');
      if (i < currentBar) barDots[i].classList.add('done');
      else if (i === currentBar) barDots[i].classList.add('active');
    }
  }

  function spawnParticles(x, y, col, n) {
    for (var i = 0; i < (n || 8); i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.4 + Math.random() * 0.3,
        col: col
      });
    }
  }

  function judgeHit() {
    if (state !== 'playing') return;
    var windowPerfect = 0.085;
    var windowGood = 0.16;
    var best = null;
    var bestDiff = 999;

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged || n.hit) continue;
      var diff = Math.abs(n.time - songTime);
      if (diff < windowGood && diff < bestDiff) {
        bestDiff = diff;
        best = n;
      }
    }

    var hitX = W * 0.18;
    var hitY = H * 0.42;

    if (!best) {
      registerMiss('early');
      spawnParticles(hitX, hitY, '#e85d4c', 6);
      return;
    }

    best.hit = true;
    best.judged = true;

    if (best.type === 'ghost') {
      registerMiss('ghost');
      spawnParticles(hitX, hitY, '#e85d4c', 10);
      glitchAmt = 1;
      playMiss();
      try { navigator.vibrate && navigator.vibrate(80); } catch (e) { /* */ }
      return;
    }

    var quality = bestDiff <= windowPerfect ? 'perfect' : 'good';
    combo++;
    hitFlash = 1;
    spawnParticles(hitX, hitY, darkMode ? '#3dffc8' : '#00d4aa', quality === 'perfect' ? 14 : 8);

    if (best.lane === 0) playKick();
    else if (best.lane === 1) playSnare();
    else playHat();

    if (quality === 'perfect') {
      try { navigator.vibrate && navigator.vibrate(12); } catch (e) { /* */ }
    }

    updateHud();
  }

  function registerMiss(reason) {
    misses++;
    barMisses++;
    combo = 0;
    missFlash = 1;
    glitchAmt = Math.min(1, glitchAmt + 0.5);
    playMiss();
    try { navigator.vibrate && navigator.vibrate([40, 30, 40]); } catch (e) { /* */ }
    updateHud();

    if (misses >= 3) {
      endGame(false, 'Three misses — the loop glitched out.');
      return;
    }

    if (barMisses > 0) {
      glitchAmt = 1;
      currentBar = 0;
      barMisses = 0;
      escLevel = Math.min(3, escLevel + 0.5);
      songTime = 0;
      loopBeatDur = 60 / (122 + escLevel * 4);
      beatDur = loopBeatDur;
      generateLoop();
      updateBarDots();
    }
  }

  function autoMissExpired() {
    var expire = 0.18;
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged || n.hit) continue;
      if (songTime - n.time > expire) {
        n.judged = true;
        if (n.type === 'real') {
          registerMiss('late');
          return;
        } else {
          n.hit = true;
        }
      }
    }
  }

  function checkBarProgress() {
    var beatsPerBar = 16;
    var barDur = beatDur * beatsPerBar;
    var newBar = Math.min(3, Math.floor(songTime / barDur));
    if (newBar > currentBar && barMisses === 0) {
      currentBar = newBar;
      escLevel = Math.min(3, escLevel + 0.35);
      updateBarDots();
      updateHud();
    }
  }

  function checkWin() {
    var totalDur = beatDur * 16 * 4;
    if (songTime >= totalDur - 0.05 && misses < 3 && barMisses === 0 && currentBar >= 3) {
      var allHit = true;
      for (var i = 0; i < notes.length; i++) {
        if (notes[i].type === 'real' && !notes[i].hit) allHit = false;
      }
      if (allHit) endGame(true, 'Flawless four-bar loop locked in.');
    }
  }

  function endGame(won, detail) {
    state = 'gameover';
    if (gameoverScreen) gameoverScreen.classList.remove('hidden');
    if (resultTitle) resultTitle.textContent = won ? 'Loop Locked' : 'Glitch';
    if (resultDetail) resultDetail.textContent = detail || '';
    if (resultSub) resultSub.textContent = won ? 'Fog holds · beat drops clean' : 'Loop ended';
    if (resultDetail) {
      resultDetail.textContent = (detail || '') + (combo > 0 ? ' · Best combo ' + combo : '');
    }
    if (won) playWin();
  }

  function tick(now) {
    if (state !== 'playing') {
      rafId = requestAnimationFrame(tick);
      return;
    }

    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    songTime += dt;
    fogPhase += dt * 0.6;
    fogLevel = Math.max(0, fogLevel - fogDecay);

    if (fogLevel <= 0.05) {
      endGame(false, 'The fog cleared before you locked the loop.');
      return;
    }

    autoMissExpired();
    checkBarProgress();
    checkWin();

    glitchAmt *= 0.92;
    hitFlash *= 0.88;
    missFlash *= 0.9;

    for (var p = particles.length - 1; p >= 0; p--) {
      particles[p].life -= dt;
      particles[p].x += particles[p].vx * dt;
      particles[p].y += particles[p].vy * dt;
      particles[p].vy += 80 * dt;
      if (particles[p].life <= 0) particles.splice(p, 1);
    }

    draw();
    rafId = requestAnimationFrame(tick);
  }

  function idleTick(now) {
    if (state !== 'title' && state !== 'gameover') return;
    fogPhase += 0.016;
    draw();
    requestAnimationFrame(idleTick);
  }

  function draw() {
    if (!ctx) return;
    darkMode = prefersDark();

    var bg = darkMode ? '#141a1f' : '#e8ecef';
    var neon = darkMode ? '#3dffc8' : '#00d4aa';
    var neonDim = darkMode ? '#1abf96' : '#00a884';
    var fogCol = darkMode ? 'rgba(30,42,52,' : 'rgba(200,210,218,';
    var gridCol = darkMode ? 'rgba(61,255,200,0.08)' : 'rgba(0,168,132,0.1)';

    ctx.save();
    if (glitchAmt > 0.05) {
      var gx = (Math.random() - 0.5) * glitchAmt * 8;
      var gy = (Math.random() - 0.5) * glitchAmt * 4;
      ctx.translate(gx, gy);
    }

    ctx.fillStyle = bg;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // subtle grid
    ctx.strokeStyle = gridCol;
    ctx.lineWidth = 1;
    for (var gx2 = 0; gx2 < W; gx2 += 32) {
      ctx.beginPath();
      ctx.moveTo(gx2, 0);
      ctx.lineTo(gx2, H);
      ctx.stroke();
    }
    for (var gy2 = 0; gy2 < H; gy2 += 32) {
      ctx.beginPath();
      ctx.moveTo(0, gy2);
      ctx.lineTo(W, gy2);
      ctx.stroke();
    }

    // skyline wireframe
    var baseY = H * 0.72;
    ctx.strokeStyle = neonDim;
    ctx.lineWidth = 1.5;
    ctx.fillStyle = darkMode ? 'rgba(61,255,200,0.04)' : 'rgba(0,168,132,0.06)';

    for (var s = 0; s < skyline.length; s++) {
      var b = skyline[s];
      var top = b.base - b.h;
      ctx.beginPath();
      ctx.rect(b.x, top, b.w, b.h);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = darkMode ? 'rgba(61,255,200,0.25)' : 'rgba(0,168,132,0.3)';
      ctx.lineWidth = 0.5;
      for (var w = 0; w < b.windows; w++) {
        var wx = b.x + 4 + (w % 2) * (b.w * 0.45);
        var wy = top + 8 + Math.floor(w / 2) * 14;
        if (wy < b.base - 6) {
          ctx.strokeRect(wx, wy, 5, 7);
        }
      }
      ctx.strokeStyle = neonDim;
      ctx.lineWidth = 1.5;
    }

    // ground line
    ctx.beginPath();
    ctx.moveTo(0, baseY);
    ctx.lineTo(W, baseY);
    ctx.stroke();

    // hit line
    var hitX = W * 0.18;
    var laneY = [H * 0.32, H * 0.42, H * 0.52];
    var pulse = 0.6 + Math.sin(songTime * 8) * 0.2 + hitFlash * 0.4;

    ctx.strokeStyle = neon;
    ctx.lineWidth = 2 + hitFlash * 2;
    ctx.globalAlpha = 0.5 + pulse * 0.5;
    ctx.beginPath();
    ctx.moveTo(hitX, H * 0.26);
    ctx.lineTo(hitX, H * 0.58);
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (missFlash > 0.1) {
      ctx.fillStyle = 'rgba(232,93,76,' + (missFlash * 0.25) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // approaching notes
    var lookAhead = 2.2;
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged && n.hit) continue;
      var dtNote = n.time - songTime;
      if (dtNote < -0.3 || dtNote > lookAhead) continue;

      var prog = 1 - dtNote / lookAhead;
      var nx = hitX + (W * 0.75) * (1 - prog);
      var ny = laneY[n.lane] || laneY[1];
      var isGhost = n.type === 'ghost';
      var r = isGhost ? 7 : 10;

      ctx.beginPath();
      if (isGhost) {
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = darkMode ? 'rgba(232,93,76,0.35)' : 'rgba(232,93,76,0.4)';
        ctx.lineWidth = 1.5;
        ctx.arc(nx, ny, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '8px ui-monospace, Menlo, monospace';
        ctx.fillStyle = darkMode ? 'rgba(232,93,76,0.5)' : 'rgba(232,93,76,0.55)';
        ctx.fillText('?', nx - 3, ny + 3);
      } else {
        var alpha = 0.5 + prog * 0.5;
        ctx.fillStyle = darkMode
          ? 'rgba(61,255,200,' + alpha + ')'
          : 'rgba(0,212,170,' + alpha + ')';
        ctx.shadowColor = neon;
        ctx.shadowBlur = 8 + prog * 12;
        ctx.arc(nx, ny, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = neon;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // particles
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.col;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // fog overlay
    var fogA = fogLevel * (0.65 + Math.sin(fogPhase) * 0.12);
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, fogCol + (fogA * 0.3) + ')');
    grad.addColorStop(0.4, fogCol + (fogA * 0.55) + ')');
    grad.addColorStop(1, fogCol + (fogA * 0.85) + ')');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // fog meter
    ctx.fillStyle = darkMode ? 'rgba(226,234,239,0.5)' : 'rgba(26,35,40,0.45)';
    ctx.font = '10px ui-monospace, Menlo, monospace';
    ctx.fillText('FOG', 14, H - 14);
    ctx.fillStyle = darkMode ? 'rgba(61,255,200,0.3)' : 'rgba(0,168,132,0.25)';
    ctx.fillRect(44, H - 20, 80, 4);
    ctx.fillStyle = neon;
    ctx.fillRect(44, H - 20, 80 * fogLevel, 4);

    ctx.restore();
  }

  function startGame() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    resetGame();
    state = 'playing';
    if (titleScreen) titleScreen.classList.add('hidden');
    if (gameoverScreen) gameoverScreen.classList.add('hidden');
    lastFrame = performance.now();
    draw();
  }

  function onTap(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (state === 'playing') judgeHit();
  }

  function bindEvents() {
    if (startBtn) {
      startBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        startGame();
      });
    }
    if (restartBtn) {
      restartBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        startGame();
      });
    }

    if (canvas) {
      canvas.addEventListener('touchstart', onTap, { passive: false });
      canvas.addEventListener('mousedown', onTap);
    }

    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') {
        if (state === 'playing') {
          e.preventDefault();
          judgeHit();
        }
      }
    });

    window.addEventListener('resize', resize);
    if (window.matchMedia) {
      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
          if (state !== 'playing') draw();
        });
      } catch (e) { /* */ }
    }
  }

  // init
  bindEvents();
  resize();
  draw();
  rafId = requestAnimationFrame(tick);
  requestAnimationFrame(idleTick);
})();
</script>
</body>
</html>
