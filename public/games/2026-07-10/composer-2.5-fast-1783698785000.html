<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veil Drop</title>
<style>
  :root {
    --bg: #dfe4e8;
    --fg: #1a2328;
    --muted: #5c6d78;
    --neon: #00d4aa;
    --neon-dim: #00a884;
    --accent: #ff6b4a;
    --panel: rgba(255,255,255,0.86);
    --panel-border: rgba(0,0,0,0.07);
    --lane: rgba(0,168,132,0.06);
    --fog: rgba(190,200,210,0.78);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181d;
      --fg: #e4ecf1;
      --muted: #7a909c;
      --neon: #3dffc8;
      --neon-dim: #1abf96;
      --accent: #ff7a5c;
      --panel: rgba(18,26,32,0.9);
      --panel-border: rgba(255,255,255,0.07);
      --lane: rgba(61,255,200,0.05);
      --fog: rgba(24,34,42,0.84);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: manipulation;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    z-index: 10;
    gap: 8px;
  }
  #hud .val { color: var(--fg); font-size: 12px; }
  #arena-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 22px;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 26px 28px;
    max-width: 320px;
    text-align: center;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .panel h1 {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .panel p {
    font-size: 13px;
    line-height: 1.55;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .panel .sub {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--neon-dim);
    margin-bottom: 14px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 168px;
    padding: 14px 26px;
    border: none;
    border-radius: 999px;
    background: var(--neon);
    color: #0a1218;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 4px 22px rgba(0,212,170,0.32);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  #bar-track {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    pointer-events: none;
    z-index: 15;
  }
  .bar-seg {
    width: 22px;
    height: 4px;
    border-radius: 2px;
    background: var(--lane);
    border: 1px solid var(--neon-dim);
    opacity: 0.35;
    transition: background 0.2s, opacity 0.2s, transform 0.2s;
  }
  .bar-seg.active { opacity: 0.7; transform: scaleY(1.4); }
  .bar-seg.perfect { background: var(--neon); opacity: 1; border-color: var(--neon); }
  #result-title { font-size: 19px; margin-bottom: 5px; }
  #result-detail { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span>Score <span class="val" id="score">0</span></span>
    <span>BPM <span class="val" id="bpm">122</span></span>
    <span>Bar <span class="val" id="bar">0</span>/8</span>
    <span>Miss <span class="val" id="misses">0</span>/3</span>
  </div>
  <div id="arena-wrap">
    <canvas id="game"></canvas>
    <div id="bar-track"></div>
    <div class="overlay" id="title-screen">
      <div class="panel">
        <div class="sub">Stutter House · 13° Karl Fog</div>
        <h1>Veil Drop</h1>
        <p>Tap snare pulses as they cascade through fog lanes. Miss a beat and a ghost drummer doubles the lane. Nail eight flawless bars to trigger the drop.</p>
        <button type="button" data-smoke="start">Drop In</button>
      </div>
    </div>
    <div class="overlay hidden" id="gameover-screen">
      <div class="panel">
        <div class="sub" id="result-sub">Loop ended</div>
        <div id="result-title">Glitch</div>
        <div id="result-detail">The skyline stuttered.</div>
        <button type="button" data-smoke="restart">Replay Loop</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('score');
  var bpmEl = document.getElementById('bpm');
  var barEl = document.getElementById('bar');
  var missesEl = document.getElementById('misses');
  var titleScreen = document.getElementById('title-screen');
  var gameoverScreen = document.getElementById('gameover-screen');
  var resultTitle = document.getElementById('result-title');
  var resultDetail = document.getElementById('result-detail');
  var resultSub = document.getElementById('result-sub');
  var barTrack = document.getElementById('bar-track');
  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');

  var W = 360, H = 640;
  var state = 'title';
  var audioCtx = null;
  var masterGain = null;
  var baseBpm = 122;
  var bpm = 122;
  var beatDur = 60 / bpm;
  var notes = [];
  var particles = [];
  var ghostDrummers = [];
  var waveform = [];
  var skyline = [];
  var fogPhase = 0;
  var fogLevel = 0.72;
  var fogTarget = 0.72;
  var combo = 0;
  var score = 0;
  var misses = 0;
  var perfectBars = 0;
  var currentBar = 0;
  var barHadMiss = false;
  var songTime = 0;
  var lastFrame = 0;
  var nextSpawnBeat = 0;
  var beatCounter = 0;
  var hitFlash = 0;
  var missFlash = 0;
  var dropFlash = 0;
  var dropActive = 0;
  var glitchAmt = 0;
  var laneCount = 4;
  var escLevel = 0;
  var roundLimit = 58;
  var darkMode = false;
  var laneW = 0;
  var hitY = 0;
  var spawnY = 0;

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  }

  function buildBarTrack() {
    if (!barTrack) return;
    barTrack.innerHTML = '';
    for (var i = 0; i < 8; i++) {
      var d = document.createElement('div');
      d.className = 'bar-seg';
      d.setAttribute('data-bar', String(i));
      barTrack.appendChild(d);
    }
  }

  function updateBarTrack() {
    if (!barTrack) return;
    var segs = barTrack.querySelectorAll('.bar-seg');
    for (var i = 0; i < segs.length; i++) {
      segs[i].classList.remove('active', 'perfect');
      if (i < perfectBars) segs[i].classList.add('perfect');
      else if (i === perfectBars) segs[i].classList.add('active');
    }
  }

  function resize() {
    if (!canvas) return;
    var wrap = document.getElementById('arena-wrap');
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    laneW = W / laneCount;
    hitY = H * 0.72;
    spawnY = H * 0.08;
    buildSkyline();
    buildWaveform();
  }

  function buildSkyline() {
    skyline = [];
    var x = -20;
    var baseY = H * 0.88;
    while (x < W + 60) {
      var bw = 14 + Math.floor(Math.random() * 36);
      var bh = 30 + Math.floor(Math.random() * (H * 0.22));
      skyline.push({ x: x, w: bw, h: bh, base: baseY, glow: Math.random() });
      x += bw + 3 + Math.floor(Math.random() * 10);
    }
  }

  function buildWaveform() {
    waveform = [];
    for (var i = 0; i < 120; i++) {
      waveform.push(0.15 + Math.random() * 0.35);
    }
  }

  function initAudio() {
    if (audioCtx) return true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.38;
      masterGain.connect(audioCtx.destination);
      return true;
    } catch (e) { return false; }
  }

  function playTone(freq, dur, type, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || 0.2, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) { /* silent */ }
  }

  function playKick() { playTone(55, 0.14, 'sine', 0.5); playTone(110, 0.06, 'triangle', 0.15); }
  function playSnare() {
    playTone(180, 0.05, 'triangle', 0.18);
    playTone(320, 0.04, 'square', 0.09);
    if (audioCtx && masterGain) {
      try {
        var t = audioCtx.currentTime;
        var buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.04), audioCtx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.15));
        var src = audioCtx.createBufferSource();
        var g = audioCtx.createGain();
        src.buffer = buf;
        g.gain.value = 0.12;
        src.connect(g);
        g.connect(masterGain);
        src.start(t);
      } catch (e) { /* */ }
    }
  }
  function playHat() { playTone(9000, 0.025, 'square', 0.05); }
  function playMiss() { playTone(90, 0.22, 'sawtooth', 0.1); }
  function playDrop() {
    playTone(65, 0.5, 'sine', 0.55);
    setTimeout(function () { playTone(98, 0.35, 'sine', 0.4); }, 80);
    setTimeout(function () { playTone(130, 0.6, 'triangle', 0.35); }, 160);
    setTimeout(function () { playTone(196, 0.8, 'sine', 0.3); }, 300);
  }
  function playWin() {
    playTone(440, 0.12, 'sine', 0.22);
    setTimeout(function () { playTone(554, 0.12, 'sine', 0.22); }, 100);
    setTimeout(function () { playTone(659, 0.3, 'sine', 0.28); }, 200);
  }

  function stutterOffset(idx) {
    var amt = 0.03 + escLevel * 0.025;
    var seed = Math.sin(idx * 3.17 + escLevel * 1.4) * 10000;
    return ((seed - Math.floor(seed)) - 0.5) * 2 * amt;
  }

  function laneX(lane) {
    return lane * laneW + laneW * 0.5;
  }

  function spawnNote(lane, type, beatIdx) {
    var fallTime = beatDur * (2.1 - escLevel * 0.15);
    notes.push({
      lane: lane,
      spawnTime: songTime,
      hitTime: songTime + fallTime + stutterOffset(beatIdx),
      y: spawnY,
      type: type || 'snare',
      judged: false,
      hit: false,
      ghost: type === 'ghost',
      pulse: Math.random() * Math.PI * 2
    });
  }

  function scheduleBeats() {
    while (nextSpawnBeat <= songTime + 2.5) {
      var beatInBar = beatCounter % 16;
      var barNum = Math.floor(beatCounter / 16);
      var isKick = beatInBar % 4 === 0;
      var isSnare = beatInBar % 8 === 4 || beatInBar % 8 === 12;
      var isHat = !isKick && !isSnare && beatInBar % 2 === 1;

      var activeLanes = Math.min(laneCount, 3 + Math.floor(escLevel));
      var lane = beatCounter % activeLanes;

      if (isSnare || (isHat && Math.random() < 0.35 + escLevel * 0.1)) {
        spawnNote(lane, isSnare ? 'snare' : 'hat', beatCounter);
      }
      if (isKick && Math.random() < 0.4) {
        spawnNote(0, 'kick', beatCounter + 0.3);
      }

      for (var g = 0; g < ghostDrummers.length; g++) {
        var gd = ghostDrummers[g];
        if (gd.lane === lane && isSnare) {
          spawnNote(lane, 'ghost', beatCounter + 0.7 + g * 0.1);
          if (Math.random() < 0.5) spawnNote(lane, 'snare', beatCounter + 0.2);
        }
      }

      var ghostChance = 0.06 + escLevel * 0.1 + barNum * 0.02;
      if (Math.random() < ghostChance) {
        spawnNote(Math.floor(Math.random() * activeLanes), 'ghost', beatCounter + 1.5);
      }

      nextSpawnBeat += beatDur / 4;
      beatCounter++;
      if (beatCounter % 16 === 0) {
        escLevel = Math.min(4, escLevel + 0.2);
        bpm = Math.min(148, baseBpm + Math.floor(beatCounter / 16) * 2);
        beatDur = 60 / bpm;
        if (bpmEl) bpmEl.textContent = String(bpm);
      }
    }
  }

  function addGhostDrummer(lane) {
    for (var i = 0; i < ghostDrummers.length; i++) {
      if (ghostDrummers[i].lane === lane) {
        ghostDrummers[i].count++;
        return;
      }
    }
    ghostDrummers.push({ lane: lane, count: 1, phase: Math.random() * Math.PI * 2 });
  }

  function resetGame() {
    combo = 0;
    score = 0;
    misses = 0;
    perfectBars = 0;
    currentBar = 0;
    barHadMiss = false;
    songTime = 0;
    nextSpawnBeat = 0;
    beatCounter = 0;
    bpm = baseBpm;
    beatDur = 60 / bpm;
    fogLevel = 0.72;
    fogTarget = 0.72;
    escLevel = 0;
    laneCount = 4;
    hitFlash = 0;
    missFlash = 0;
    dropFlash = 0;
    dropActive = 0;
    glitchAmt = 0;
    notes = [];
    particles = [];
    ghostDrummers = [];
    lastFrame = performance.now();
    updateHud();
    updateBarTrack();
    if (bpmEl) bpmEl.textContent = String(bpm);
  }

  function updateHud() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (barEl) barEl.textContent = String(perfectBars);
    if (missesEl) missesEl.textContent = String(misses);
  }

  function spawnParticles(x, y, col, n) {
    for (var i = 0; i < (n || 8); i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 50 + Math.random() * 140;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 40,
        life: 0.35 + Math.random() * 0.35,
        col: col
      });
    }
  }

  function registerMiss(reason) {
    misses++;
    combo = 0;
    barHadMiss = true;
    missFlash = 1;
    glitchAmt = Math.min(1, glitchAmt + 0.45);
    fogTarget = Math.min(0.98, fogTarget + 0.08);
    playMiss();
    try { navigator.vibrate && navigator.vibrate([50, 30, 50]); } catch (e) { /* */ }
    updateHud();

    var lane = Math.floor(Math.random() * laneCount);
    addGhostDrummer(lane);

    if (misses >= 3) {
      endGame(false, 'Three misses — ghost drummers took the lane.');
      return;
    }

    perfectBars = 0;
    updateBarTrack();
  }

  function registerHit(note, quality) {
    note.hit = true;
    note.judged = true;
    combo++;
    var pts = quality === 'perfect' ? 120 : 70;
    score += pts + combo * 8;
    hitFlash = 1;
    spawnParticles(laneX(note.lane), hitY, darkMode ? '#3dffc8' : '#00d4aa', quality === 'perfect' ? 16 : 9);

    if (note.type === 'kick') playKick();
    else if (note.type === 'snare') playSnare();
    else playHat();

    if (quality === 'perfect') {
      try { navigator.vibrate && navigator.vibrate(10); } catch (e) { /* */ }
    }
    updateHud();
  }

  function judgeTap(tapX) {
    if (state !== 'playing') return;
    var windowPerfect = 0.09;
    var windowGood = 0.17;
    var best = null;
    var bestDiff = 999;
    var tapLane = Math.max(0, Math.min(laneCount - 1, Math.floor(tapX / laneW)));

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged || n.hit) continue;
      var diff = Math.abs(n.hitTime - songTime);
      if (diff > windowGood) continue;
      var laneDiff = Math.abs(n.lane - tapLane);
      var weighted = diff + laneDiff * 0.04;
      if (weighted < bestDiff) {
        bestDiff = weighted;
        best = n;
      }
    }

    if (!best) {
      registerMiss('early');
      spawnParticles(laneX(tapLane), hitY, '#ff6b4a', 5);
      return;
    }

    if (best.ghost) {
      best.judged = true;
      registerMiss('ghost');
      spawnParticles(laneX(best.lane), hitY, '#ff6b4a', 12);
      return;
    }

    var quality = Math.abs(best.hitTime - songTime) <= windowPerfect ? 'perfect' : 'good';
    registerHit(best, quality);
  }

  function updateNotes(dt) {
    for (var i = notes.length - 1; i >= 0; i--) {
      var n = notes[i];
      var fallDur = Math.max(0.3, n.hitTime - n.spawnTime);
      var prog = Math.min(1.2, (songTime - n.spawnTime) / fallDur);
      n.y = spawnY + (hitY - spawnY) * prog;

      if (!n.judged && songTime - n.hitTime > 0.16) {
        n.judged = true;
        if (!n.ghost && !n.hit) {
          registerMiss('late');
          addGhostDrummer(n.lane);
        }
      }

      if (songTime - n.spawnTime > fallDur + 0.5) {
        notes.splice(i, 1);
      }
    }
  }

  function checkBarProgress() {
    var barDur = beatDur * 16;
    var newBar = Math.floor(songTime / barDur);
    if (newBar > currentBar) {
      if (!barHadMiss) {
        perfectBars++;
        updateBarTrack();
        if (perfectBars >= 8) {
          triggerDrop();
        }
      } else {
        perfectBars = 0;
        updateBarTrack();
      }
      barHadMiss = false;
      currentBar = newBar;
      escLevel = Math.min(4.5, escLevel + 0.25);
      fogTarget = Math.max(0.55, fogTarget - 0.02);
      updateHud();
    }
  }

  function triggerDrop() {
    dropActive = 2.2;
    dropFlash = 1;
    fogTarget = 0.08;
    fogLevel = 0.1;
    score += 2000;
    playDrop();
    try { navigator.vibrate && navigator.vibrate([20, 40, 80, 40, 120]); } catch (e) { /* */ }
    updateHud();
    setTimeout(function () {
      if (state === 'playing') endGame(true, 'Eight-bar loop locked — the fog tore open.');
    }, 1800);
  }

  function endGame(won, detail) {
    state = 'gameover';
    if (gameoverScreen) gameoverScreen.classList.remove('hidden');
    if (resultTitle) resultTitle.textContent = won ? 'Veil Dropped' : 'Glitch';
    if (resultSub) resultSub.textContent = won ? 'Fog clears · beat drops clean' : 'Loop ended';
    if (resultDetail) {
      resultDetail.textContent = (detail || '') + ' · Score ' + score + (combo > 0 ? ' · Combo ' + combo : '');
    }
    if (won) playWin();
  }

  function tick(now) {
    if (state !== 'playing') {
      requestAnimationFrame(tick);
      return;
    }

    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    songTime += dt;
    fogPhase += dt * 0.55;

    if (dropActive > 0) {
      dropActive -= dt;
      dropFlash = Math.max(0, dropActive / 2.2);
    } else {
      fogLevel += (fogTarget - fogLevel) * dt * 1.8;
    }

    if (songTime >= roundLimit && misses < 3) {
      endGame(score >= 1500, 'Survived the fog drift — score ' + score + '.');
      return;
    }

    if (fogLevel > 0.96 && dropActive <= 0) {
      endGame(false, 'Karl swallowed the skyline before the drop.');
      return;
    }

    scheduleBeats();
    updateNotes(dt);
    checkBarProgress();

    glitchAmt *= 0.9;
    hitFlash *= 0.86;
    missFlash *= 0.88;

    for (var p = particles.length - 1; p >= 0; p--) {
      particles[p].life -= dt;
      particles[p].x += particles[p].vx * dt;
      particles[p].y += particles[p].vy * dt;
      particles[p].vy += 120 * dt;
      if (particles[p].life <= 0) particles.splice(p, 1);
    }

    draw();
    requestAnimationFrame(tick);
  }

  function idleTick() {
    if (state === 'title' || state === 'gameover') {
      fogPhase += 0.014;
      draw();
    }
    requestAnimationFrame(idleTick);
  }

  function drawWaveform(neon, neonDim) {
    if (!ctx || waveform.length < 2) return;
    var midY = H * 0.38;
    var amp = H * 0.12 * (0.6 + Math.sin(fogPhase * 0.8) * 0.15);
    ctx.beginPath();
    ctx.moveTo(0, midY);
    for (var i = 0; i < waveform.length; i++) {
      var x = (i / (waveform.length - 1)) * W;
      var wobble = Math.sin(fogPhase * 2 + i * 0.2) * 0.08;
      var y = midY + (waveform[i] + wobble) * amp * Math.sin(songTime * 3 + i * 0.15);
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = darkMode ? 'rgba(61,255,200,0.22)' : 'rgba(0,212,170,0.2)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = darkMode ? 'rgba(61,255,200,0.08)' : 'rgba(0,168,132,0.1)';
    ctx.lineWidth = 6;
    ctx.stroke();
  }

  function draw() {
    if (!ctx) return;
    darkMode = prefersDark();

    var bg = darkMode ? '#12181d' : '#dfe4e8';
    var neon = darkMode ? '#3dffc8' : '#00d4aa';
    var neonDim = darkMode ? '#1abf96' : '#00a884';
    var fogBase = darkMode ? 'rgba(24,34,42,' : 'rgba(190,200,210,';
    var laneCol = darkMode ? 'rgba(61,255,200,0.06)' : 'rgba(0,168,132,0.07)';

    ctx.save();
    if (glitchAmt > 0.04) {
      ctx.translate((Math.random() - 0.5) * glitchAmt * 7, (Math.random() - 0.5) * glitchAmt * 4);
    }

    ctx.fillStyle = bg;
    ctx.fillRect(-5, -5, W + 10, H + 10);

    drawWaveform(neon, neonDim);

    for (var l = 0; l < laneCount; l++) {
      var lx = l * laneW;
      ctx.fillStyle = laneCol;
      ctx.fillRect(lx + 1, spawnY - 10, laneW - 2, hitY - spawnY + 40);
      ctx.strokeStyle = darkMode ? 'rgba(61,255,200,0.12)' : 'rgba(0,168,132,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lx, spawnY - 10);
      ctx.lineTo(lx, hitY + 30);
      ctx.stroke();
    }

    var baseY = H * 0.9;
    ctx.strokeStyle = neonDim;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5;
    for (var s = 0; s < skyline.length; s++) {
      var b = skyline[s];
      var top = b.base - b.h;
      ctx.strokeRect(b.x, top, b.w, b.h);
      if (b.glow > 0.7) {
        ctx.fillStyle = darkMode ? 'rgba(61,255,200,0.06)' : 'rgba(0,212,170,0.05)';
        ctx.fillRect(b.x + 2, top + 4, 4, 6);
      }
    }
    ctx.globalAlpha = 1;

    for (var g = 0; g < ghostDrummers.length; g++) {
      var gd = ghostDrummers[g];
      var gx = laneX(gd.lane);
      var gy = spawnY + 8 + Math.sin(fogPhase * 3 + gd.phase) * 3;
      ctx.globalAlpha = 0.35 + Math.sin(fogPhase * 4 + g) * 0.1;
      ctx.fillStyle = darkMode ? 'rgba(255,122,92,0.5)' : 'rgba(255,107,74,0.45)';
      ctx.beginPath();
      ctx.ellipse(gx, gy, 10, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '8px ui-monospace, Menlo, monospace';
      ctx.fillStyle = darkMode ? 'rgba(255,122,92,0.7)' : 'rgba(255,107,74,0.65)';
      ctx.globalAlpha = 0.8;
      ctx.fillText('x' + (gd.count + 1), gx - 8, gy + 22);
      ctx.globalAlpha = 1;
    }

    ctx.setLineDash([]);
    ctx.strokeStyle = neon;
    ctx.lineWidth = 2 + hitFlash * 2.5;
    ctx.globalAlpha = 0.55 + hitFlash * 0.35 + Math.sin(songTime * 10) * 0.1;
    ctx.beginPath();
    ctx.moveTo(0, hitY);
    ctx.lineTo(W, hitY);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = darkMode ? 'rgba(61,255,200,0.25)' : 'rgba(0,168,132,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, hitY - 18);
    ctx.lineTo(W, hitY - 18);
    ctx.moveTo(0, hitY + 18);
    ctx.lineTo(W, hitY + 18);
    ctx.stroke();
    ctx.setLineDash([]);

    if (missFlash > 0.08) {
      ctx.fillStyle = 'rgba(255,107,74,' + (missFlash * 0.22) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (dropFlash > 0.05) {
      ctx.fillStyle = darkMode
        ? 'rgba(61,255,200,' + (dropFlash * 0.35) + ')'
        : 'rgba(0,212,170,' + (dropFlash * 0.3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged && n.hit) continue;
      if (n.y < spawnY - 20 || n.y > H) continue;

      var nx = laneX(n.lane);
      var nearHit = Math.abs(n.hitTime - songTime) < 0.35;
      var r = n.ghost ? 8 : (n.type === 'kick' ? 13 : 11);
      var pulse = 1 + Math.sin(songTime * 14 + n.pulse) * 0.12;

      if (n.ghost) {
        ctx.setLineDash([3, 5]);
        ctx.strokeStyle = darkMode ? 'rgba(255,122,92,0.4)' : 'rgba(255,107,74,0.45)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(nx, n.y, r * pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '9px ui-monospace, Menlo, monospace';
        ctx.fillStyle = darkMode ? 'rgba(255,122,92,0.55)' : 'rgba(255,107,74,0.6)';
        ctx.fillText('?', nx - 3, n.y + 3);
      } else {
        var alpha = nearHit ? 0.95 : 0.55;
        var col = n.type === 'kick'
          ? (darkMode ? 'rgba(61,255,200,' + alpha + ')' : 'rgba(0,212,170,' + alpha + ')')
          : (darkMode ? 'rgba(100,255,210,' + alpha + ')' : 'rgba(0,230,185,' + alpha + ')');
        ctx.fillStyle = col;
        ctx.shadowColor = neon;
        ctx.shadowBlur = nearHit ? 16 : 6;
        ctx.beginPath();
        if (n.type === 'kick') {
          ctx.rect(nx - r, n.y - r * 0.7, r * 2, r * 1.4);
        } else {
          ctx.arc(nx, n.y, r * pulse, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = neon;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.col;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    var fogA = fogLevel * (0.7 + Math.sin(fogPhase) * 0.1);
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, fogBase + (fogA * 0.25) + ')');
    grad.addColorStop(0.35, fogBase + (fogA * 0.5) + ')');
    grad.addColorStop(0.7, fogBase + (fogA * 0.75) + ')');
    grad.addColorStop(1, fogBase + (fogA * 0.92) + ')');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = darkMode ? 'rgba(228,236,241,0.55)' : 'rgba(26,35,40,0.5)';
    ctx.font = '9px ui-monospace, Menlo, monospace';
    ctx.fillText('FOG', 12, H - 12);
    ctx.fillStyle = darkMode ? 'rgba(61,255,200,0.25)' : 'rgba(0,168,132,0.22)';
    ctx.fillRect(38, H - 16, 72, 3);
    ctx.fillStyle = neon;
    ctx.fillRect(38, H - 16, 72 * fogLevel, 3);

    ctx.restore();
  }

  function startGame() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    resetGame();
    state = 'playing';
    if (titleScreen) titleScreen.classList.add('hidden');
    if (gameoverScreen) gameoverScreen.classList.add('hidden');
    lastFrame = performance.now();
    draw();
  }

  function pointerX(e) {
    if (!canvas) return W * 0.5;
    var rect = canvas.getBoundingClientRect();
    if (e.touches && e.touches[0]) return e.touches[0].clientX - rect.left;
    if (e.changedTouches && e.changedTouches[0]) return e.changedTouches[0].clientX - rect.left;
    return (e.clientX || W * 0.5) - rect.left;
  }

  function onTap(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (state !== 'playing') return;
    judgeTap(pointerX(e));
  }

  function bindEvents() {
    if (startBtn) {
      startBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        startGame();
      });
    }
    if (restartBtn) {
      restartBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        startGame();
      });
    }
    if (canvas) {
      canvas.addEventListener('touchstart', onTap, { passive: false });
      canvas.addEventListener('mousedown', onTap);
    }
    window.addEventListener('keydown', function (e) {
      if (state === 'playing' && (e.code === 'Space' || e.code === 'Enter')) {
        e.preventDefault();
        judgeTap(W * 0.5);
      }
    });
    window.addEventListener('resize', resize);
    try {
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
          draw();
        });
      }
    } catch (e) { /* */ }
  }

  buildBarTrack();
  bindEvents();
  resize();
  draw();
  requestAnimationFrame(tick);
  requestAnimationFrame(idleTick);
})();
</script>
</body>
</html>
