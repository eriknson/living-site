<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typhoon Rescue</title>
<style>
  :root {
    --bg-sky: #c5d0d6;
    --text-color: #2c3e50;
    --btn-bg: #e67e22;
    --btn-text: #fff;
    --overlay-bg: rgba(197, 208, 214, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-sky: #1a252c;
      --text-color: #ecf0f1;
      --btn-bg: #d35400;
      --overlay-bg: rgba(26, 37, 44, 0.85);
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background-color: var(--bg-sky);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block; width: 100dvw; height: 100dvh;
  }
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 10;
  }
  .screen {
    display: none; flex-direction: column; align-items: center;
    background: var(--overlay-bg); padding: 2rem; border-radius: 1rem;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    text-align: center; color: var(--text-color);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .screen.active { display: flex; }
  h1 { margin: 0 0 1rem 0; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; }
  p { margin: 0 0 2rem 0; line-height: 1.5; max-width: 320px; font-size: 0.95rem; }
  button {
    pointer-events: auto; background: var(--btn-bg); color: var(--btn-text);
    border: none; padding: 1rem 2.5rem; font-size: 1.2rem; font-weight: bold;
    border-radius: 2rem; cursor: pointer; text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.1s, background 0.2s;
    font-family: inherit; letter-spacing: 1px;
  }
  button:active { transform: scale(0.95); }
  #hud {
    position: absolute; top: 0; left: 0; width: 100%; padding: 1rem 1.5rem;
    box-sizing: border-box; display: flex; justify-content: space-between;
    pointer-events: none; color: var(--text-color); font-size: 1.1rem;
    font-weight: bold; z-index: 5; text-shadow: 0 1px 3px rgba(255,255,255,0.6);
  }
  @media (prefers-color-scheme: dark) {
    #hud { text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
  }
  .hud-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .right-align { align-items: flex-end; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud" style="display: none;">
  <div class="hud-group">
    <div id="scoreDisplay">RESCUED: 0</div>
    <div id="weightDisplay">WEIGHT: 0/5</div>
  </div>
  <div class="hud-group right-align">
    <div id="timeDisplay">60s</div>
    <div id="windDisplay">WIND: 0</div>
  </div>
</div>

<div id="ui-layer">
  <div id="startScreen" class="screen active">
    <h1>Typhoon Rescue</h1>
    <p>Drag anywhere to aim and flick the lifeboat.<br><br>Rescue flares in the water and return them to the ship on the left.<br><br>More passengers = heavier boat.<br>Avoid floating debris!</p>
    <button data-smoke="start" id="startBtn">Launch</button>
  </div>
  
  <div id="gameOverScreen" class="screen">
    <h1>Evacuation Complete</h1>
    <p id="finalScore">You rescued 0 people.</p>
    <button data-smoke="restart" id="restartBtn">Play Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const hud = document.getElementById('hud');
const scoreDisplay = document.getElementById('scoreDisplay');
const weightDisplay = document.getElementById('weightDisplay');
const timeDisplay = document.getElementById('timeDisplay');
const windDisplay = document.getElementById('windDisplay');

let width, height;
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  if (state === 'start') draw(); // redraw background on resize
}
window.addEventListener('resize', resize);

// Game State
let state = 'start'; // start, playing, gameover
let score = 0;
let timeLeft = 60;
let lastTime = 0;
let gameTime = 0;

// Physics Constants
const GRAVITY = 700; // px/s^2
const MAX_PASSENGERS = 5;
const PASSENGER_WEIGHT_PENALTY = 0.25; // 25% more gravity per passenger
const MAX_DRAG = 180;
const POWER_MULTIPLIER = 5.5; // velocity = drag * multiplier

// Entities
let boat = {
  x: 0, y: 0, vx: 0, vy: 0,
  radius: 16,
  passengers: 0,
  inAir: false,
  cooldown: 0
};

let ship = {
  x: 0, width: 90, height: 200
};

let flares = [];
let debris = [];
let particles = [];
let floatingTexts = [];

// Environment
let wind = 0; // -1 to 1
let targetWind = 0;

// Input
let isDragging = false;
let dragStart = {x: 0, y: 0};
let dragCurrent = {x: 0, y: 0};

// Colors (updated in draw loop)
let colors = {};

function initGame() {
  score = 0;
  timeLeft = 60;
  gameTime = 0;
  flares = [];
  debris = [];
  particles = [];
  floatingTexts = [];
  
  ship.x = width * 0.02;
  
  boat.x = ship.x + ship.width + 60;
  boat.y = getWaveHeight(boat.x, 0, 0);
  boat.vx = 0;
  boat.vy = 0;
  boat.passengers = 0;
  boat.inAir = false;
  boat.cooldown = 0;
  
  wind = 0;
  targetWind = (Math.random() - 0.5) * 1.5;
  
  updateHUD();
}

function startPlay() {
  state = 'playing';
  startScreen.classList.remove('active');
  gameOverScreen.classList.remove('active');
  hud.style.display = 'flex';
  initGame();
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function gameOver() {
  state = 'gameover';
  hud.style.display = 'none';
  gameOverScreen.classList.add('active');
  document.getElementById('finalScore').innerText = `You rescued ${score} people.`;
  isDragging = false;
}

startBtn.addEventListener('click', startPlay);
restartBtn.addEventListener('click', startPlay);

// Input Handling
function getTouchPos(e) {
  if (e.touches && e.touches.length > 0) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

function handleStart(e) {
  if (state !== 'playing') return;
  if (boat.inAir || boat.cooldown > 0) return;
  isDragging = true;
  dragStart = getTouchPos(e);
  dragCurrent = dragStart;
}

function handleMove(e) {
  if (!isDragging) return;
  dragCurrent = getTouchPos(e);
}

function handleEnd(e) {
  if (!isDragging) return;
  isDragging = false;
  
  let dx = dragStart.x - dragCurrent.x;
  let dy = dragStart.y - dragCurrent.y;
  let dist = Math.hypot(dx, dy);
  
  if (dist > 15) {
    if (dist > MAX_DRAG) {
      dx = (dx / dist) * MAX_DRAG;
      dy = (dy / dist) * MAX_DRAG;
    }
    
    boat.vx = dx * POWER_MULTIPLIER;
    boat.vy = dy * POWER_MULTIPLIER;
    
    // Prevent launching downwards into the water
    if (boat.vy > 0) boat.vy = -150;
    
    boat.inAir = true;
    boat.y -= 5; // pop off water
    
    spawnParticles(boat.x, boat.y, 15, colors.waterTop);
    
    // Vibrate
    try { if (navigator.vibrate) navigator.vibrate(15); } catch(e){}
  }
}

window.addEventListener('mousedown', handleStart);
window.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);
window.addEventListener('touchstart', handleStart, {passive: false});
window.addEventListener('touchmove', handleMove, {passive: false});
window.addEventListener('touchend', handleEnd, {passive: false});

// Prevent default on touch to avoid double firing and scrolling
document.addEventListener('touchmove', function(e) {
  if (e.target.tagName !== 'BUTTON') {
    if (e.cancelable) e.preventDefault();
  }
}, {passive: false});

function getWaveHeight(x, t, layer = 0) {
  const baseHeight = height * 0.65 + layer * 25;
  let ampMult = 1;
  if (state === 'playing') {
    ampMult = 1 + (60 - timeLeft) / 120; // waves get up to 1.5x bigger
  }
  
  const w1 = Math.sin(x * 0.004 + t * 2.5 + layer) * 22 * ampMult;
  const w2 = Math.sin(x * 0.009 + t * 3.2 - layer) * 14 * ampMult;
  const w3 = Math.sin(x * 0.018 - t * 1.8 + layer*2) * 9 * ampMult;
  return baseHeight + w1 + w2 + w3;
}

function spawnParticles(x, y, count, color) {
  for (let i=0; i<count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 250,
      vy: (Math.random() - 1) * 250,
      life: 1 + Math.random() * 0.5,
      color: color
    });
  }
}

function update(dt) {
  gameTime += dt;
  
  // Timer
  timeLeft -= dt;
  if (timeLeft <= 0) {
    gameOver();
    return;
  }
  
  let difficulty = 1 + (60 - timeLeft) / 60; // 1 to 2
  
  // Wind changes
  if (Math.random() < 0.5 * dt) {
    targetWind = (Math.random() - 0.5) * 2; // -1 to 1
  }
  wind += (targetWind - wind) * dt * 0.3;
  
  // Spawning
  if (Math.random() < 1.2 * difficulty * dt) {
    flares.push({
      x: width + 50,
      y: 0,
      radius: 7,
      drift: -40 - Math.random() * 60,
      bobOffset: Math.random() * Math.PI * 2
    });
  }
  if (Math.random() < 0.6 * difficulty * dt) {
    debris.push({
      x: width + 50,
      y: 0,
      radius: 14 + Math.random() * 12,
      drift: -60 - Math.random() * 50,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 3
    });
  }
  
  // Boat Physics
  if (boat.cooldown > 0) boat.cooldown -= dt;
  
  let currentGravity = GRAVITY * (1 + boat.passengers * PASSENGER_WEIGHT_PENALTY);
  
  if (boat.inAir) {
    boat.vy += currentGravity * dt;
    boat.vx += wind * 600 * dt; // wind affects horizontal speed
    
    boat.x += boat.vx * dt;
    boat.y += boat.vy * dt;
    
    // Bounds
    if (boat.x < ship.x + ship.width + boat.radius) {
      boat.x = ship.x + ship.width + boat.radius;
      boat.vx *= -0.6;
    }
    if (boat.x > width - boat.radius) {
      boat.x = width - boat.radius;
      boat.vx *= -0.6;
    }
    
    let waveY = getWaveHeight(boat.x, gameTime, 0);
    if (boat.y > waveY) {
      boat.y = waveY;
      boat.inAir = false;
      boat.vy = 0;
      boat.vx *= 0.1; // strong friction on water
      spawnParticles(boat.x, boat.y, 20, colors.waterTop);
      try { if (navigator.vibrate) navigator.vibrate(10); } catch(e){}
    }
  } else {
    let waveY = getWaveHeight(boat.x, gameTime, 0);
    boat.y = waveY;
    // Drift slowly left with waves
    boat.x -= 30 * dt;
    
    // Bounds
    if (boat.x < ship.x + ship.width + boat.radius) {
      boat.x = ship.x + ship.width + boat.radius;
    }
  }
  
  // Ship dropoff
  if (boat.x < ship.x + ship.width + boat.radius + 25 && boat.passengers > 0) {
    let pts = boat.passengers;
    score += pts;
    spawnParticles(boat.x, boat.y - 20, pts * 15, '#2ecc71');
    boat.passengers = 0;
    
    floatingTexts.push({
      x: boat.x + 20, y: boat.y - 40, text: `+${pts}`, life: 1.5
    });
    
    try { if (navigator.vibrate) navigator.vibrate([20, 50, 20]); } catch(e){}
  }
  
  // Flares
  for (let i = flares.length - 1; i >= 0; i--) {
    let f = flares[i];
    f.x += f.drift * dt;
    f.y = getWaveHeight(f.x, gameTime, 0) - 5 + Math.sin(gameTime * 5 + f.bobOffset) * 5;
    
    let dist = Math.hypot(boat.x - f.x, boat.y - f.y);
    if (dist < boat.radius + f.radius + 10) { // slightly generous hitbox
      if (boat.passengers < MAX_PASSENGERS) {
        boat.passengers++;
        spawnParticles(f.x, f.y, 15, colors.flare);
        flares.splice(i, 1);
        try { if (navigator.vibrate) navigator.vibrate(15); } catch(e){}
      }
    } else if (f.x < -50) {
      flares.splice(i, 1);
    }
  }
  
  // Debris
  for (let i = debris.length - 1; i >= 0; i--) {
    let d = debris[i];
    d.x += d.drift * dt;
    d.y = getWaveHeight(d.x, gameTime, 0);
    d.rotation += d.rotSpeed * dt;
    
    let dist = Math.hypot(boat.x - d.x, boat.y - d.y);
    if (dist < boat.radius + d.radius * 0.8) {
      // Crash!
      if (boat.passengers > 0) {
        spawnParticles(boat.x, boat.y, 25, colors.flare); // lose passengers
        boat.passengers = 0;
        floatingTexts.push({
          x: boat.x, y: boat.y - 40, text: `LOST!`, life: 1.5, color: colors.flare
        });
      }
      spawnParticles(boat.x, boat.y, 20, colors.debris);
      boat.vx = -boat.vx * 0.5 - 250; // knockback
      boat.vy = -250;
      boat.inAir = true;
      boat.cooldown = 1.2; // stunned
      debris.splice(i, 1);
      try { if (navigator.vibrate) navigator.vibrate([40, 60, 40]); } catch(e){}
    } else if (d.x < -50) {
      debris.splice(i, 1);
    }
  }
  
  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += GRAVITY * dt;
    p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  // Floating Texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    ft.y -= 40 * dt;
    ft.life -= dt;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
  
  updateHUD();
}

function updateHUD() {
  scoreDisplay.innerText = `RESCUED: ${score}`;
  weightDisplay.innerText = `WEIGHT: ${boat.passengers}/${MAX_PASSENGERS}`;
  timeDisplay.innerText = `${Math.ceil(timeLeft)}s`;
  
  let windDir = wind > 0 ? '→' : '←';
  let windStrength = Math.abs(wind).toFixed(1);
  windDisplay.innerText = `WIND: ${windDir} ${windStrength}`;
  
  if (boat.passengers === MAX_PASSENGERS) {
    weightDisplay.style.color = colors.flare;
  } else {
    weightDisplay.style.color = '';
  }
  if (timeLeft <= 10) {
    timeDisplay.style.color = colors.flare;
  } else {
    timeDisplay.style.color = '';
  }
}

function draw() {
  // Update colors based on dark mode
  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (isDark) {
    colors.sky = '#1a252c';
    colors.waterTop = '#2c3e50';
    colors.waterBottom = '#111820';
    colors.waterBack = '#1e2b36';
    colors.flare = '#f1c40f';
    colors.flareGlow = 'rgba(241, 196, 15, 0.4)';
    colors.debris = '#0a0f14';
    colors.ship = '#34495e';
    colors.boat = '#e67e22';
    colors.coast = '#111820';
  } else {
    colors.sky = '#c5d0d6';
    colors.waterTop = '#7fb3d5';
    colors.waterBottom = '#2980b9';
    colors.waterBack = '#5c97bf';
    colors.flare = '#e74c3c';
    colors.flareGlow = 'rgba(231, 76, 60, 0.4)';
    colors.debris = '#2c3e50';
    colors.ship = '#7f8c8d';
    colors.boat = '#d35400';
    colors.coast = '#aeb6bf';
  }

  // Background
  ctx.fillStyle = colors.sky;
  ctx.fillRect(0, 0, width, height);
  
  // Coastline (distant)
  ctx.fillStyle = colors.coast;
  ctx.beginPath();
  ctx.moveTo(0, height * 0.55);
  for (let x = 0; x <= width; x += 40) {
    ctx.lineTo(x, height * 0.55 - Math.sin(x * 0.008) * 25 - Math.cos(x * 0.003) * 40);
  }
  ctx.lineTo(width, height);
  ctx.lineTo(0, height);
  ctx.fill();
  
  // Rain / Wind streaks
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0; i<40; i++) {
    let rx = (Math.random() * width + gameTime * 600 * wind) % width;
    if (rx < 0) rx += width;
    let ry = Math.random() * height;
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + wind * 30, ry + 40);
  }
  ctx.stroke();

  // Back Water Layer
  ctx.beginPath();
  ctx.moveTo(0, height);
  for (let x = 0; x <= width; x += 20) {
    ctx.lineTo(x, getWaveHeight(x, gameTime, 1));
  }
  ctx.lineTo(width, height);
  ctx.fillStyle = colors.waterBack;
  ctx.fill();

  // Draw Ship
  ctx.fillStyle = colors.ship;
  ctx.beginPath();
  ctx.moveTo(ship.x, height);
  ctx.lineTo(ship.x, height * 0.35);
  ctx.lineTo(ship.x + ship.width, height * 0.35);
  ctx.lineTo(ship.x + ship.width + 10, height);
  ctx.fill();
  
  // Ship Details
  ctx.fillStyle = isDark ? '#2c3e50' : '#95a5a6';
  ctx.fillRect(ship.x + 15, height * 0.4, ship.width - 30, 40);
  // Cross
  ctx.fillStyle = colors.flare;
  ctx.fillRect(ship.x + ship.width/2 - 5, height * 0.5, 10, 30);
  ctx.fillRect(ship.x + ship.width/2 - 15, height * 0.5 + 10, 30, 10);

  // Draw Flares
  for (let f of flares) {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius, 0, Math.PI*2);
    ctx.fillStyle = colors.flare;
    ctx.fill();
    
    // Glow
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius * 3 + Math.sin(gameTime * 8 + f.bobOffset) * 4, 0, Math.PI*2);
    ctx.fillStyle = colors.flareGlow;
    ctx.fill();
  }

  // Draw Debris
  for (let d of debris) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rotation);
    ctx.fillStyle = colors.debris;
    ctx.fillRect(-d.radius, -d.radius/2, d.radius*2, d.radius);
    // Detail line
    ctx.fillStyle = isDark ? '#1a252c' : '#1a252c';
    ctx.fillRect(-d.radius*0.8, -2, d.radius*1.6, 4);
    ctx.restore();
  }

  // Draw Boat
  ctx.save();
  ctx.translate(boat.x, boat.y);
  
  let angle = boat.inAir ? Math.atan2(boat.vy, boat.vx) * 0.5 : 0;
  if (!boat.inAir) {
    let h1 = getWaveHeight(boat.x - 10, gameTime, 0);
    let h2 = getWaveHeight(boat.x + 10, gameTime, 0);
    angle = Math.atan2(h2 - h1, 20);
  }
  ctx.rotate(angle);
  
  // Hull
  ctx.fillStyle = boat.cooldown > 0 && Math.floor(gameTime*12)%2===0 ? '#fff' : colors.boat;
  ctx.beginPath();
  ctx.ellipse(0, 0, boat.radius, boat.radius*0.6, 0, 0, Math.PI*2);
  ctx.fill();
  
  // Cabin
  ctx.fillStyle = isDark ? '#d35400' : '#e67e22';
  ctx.beginPath();
  ctx.ellipse(-boat.radius*0.2, -boat.radius*0.4, boat.radius*0.5, boat.radius*0.4, 0, 0, Math.PI*2);
  ctx.fill();
  
  // Passengers
  ctx.fillStyle = '#fff';
  for(let i=0; i<boat.passengers; i++) {
    ctx.beginPath();
    ctx.arc(-boat.radius*0.5 + i * 5, -boat.radius*0.6, 2.5, 0, Math.PI*2);
    ctx.fill();
  }
  
  ctx.restore();

  // Draw Foreground Water
  ctx.beginPath();
  ctx.moveTo(0, height);
  for (let x = 0; x <= width; x += 20) {
    ctx.lineTo(x, getWaveHeight(x, gameTime, 0));
  }
  ctx.lineTo(width, height);
  
  let gradient = ctx.createLinearGradient(0, height*0.6, 0, height);
  gradient.addColorStop(0, colors.waterTop);
  gradient.addColorStop(1, colors.waterBottom);
  ctx.fillStyle = gradient;
  ctx.globalAlpha = 0.9;
  ctx.fill();
  ctx.globalAlpha = 1.0;

  // Draw Particles
  for (let p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1.0;

  // Draw Aiming Arc
  if (isDragging && !boat.inAir && boat.cooldown <= 0) {
    let dx = dragStart.x - dragCurrent.x;
    let dy = dragStart.y - dragCurrent.y;
    let dist = Math.hypot(dx, dy);
    
    if (dist > 15) {
      if (dist > MAX_DRAG) {
        dx = (dx / dist) * MAX_DRAG;
        dy = (dy / dist) * MAX_DRAG;
      }
      
      let simVx = dx * POWER_MULTIPLIER;
      let simVy = dy * POWER_MULTIPLIER;
      if (simVy > 0) simVy = -150;
      
      let simX = boat.x;
      let simY = boat.y;
      let currentGravity = GRAVITY * (1 + boat.passengers * PASSENGER_WEIGHT_PENALTY);
      
      ctx.beginPath();
      ctx.moveTo(simX, simY);
      ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 6]);
      
      for (let i = 0; i < 35; i++) {
        let t = 0.04; // sim step
        simVy += currentGravity * t;
        simVx += wind * 600 * t;
        simX += simVx * t;
        simY += simVy * t;
        ctx.lineTo(simX, simY);
        if (simY > getWaveHeight(simX, gameTime, 0)) break;
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  
  // Draw Floating Texts
  ctx.font = "bold 22px ui-monospace, 'SFMono-Regular', Menlo, monospace";
  ctx.textAlign = "center";
  for (let ft of floatingTexts) {
    ctx.fillStyle = ft.color || `rgba(46, 204, 113, ${Math.min(1, ft.life)})`;
    ctx.fillText(ft.text, ft.x, ft.y);
  }
}

function loop(time) {
  if (state !== 'playing') return;
  
  let dt = (time - lastTime) / 1000;
  lastTime = time;
  
  if (dt > 0.1) dt = 0.1; // cap dt to prevent physics explosions on lag
  
  update(dt);
  draw();
  
  if (state === 'playing') {
    requestAnimationFrame(loop);
  }
}

// Init
resize();
</script>
