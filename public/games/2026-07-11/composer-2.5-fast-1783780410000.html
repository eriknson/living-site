<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Sync</title>
<style>
  :root {
    --bg: #c8d2da;
    --fg: #152028;
    --muted: #4d6270;
    --neon: #00e8b8;
    --neon-dim: #00b894;
    --accent: #ff5e3a;
    --panel: rgba(255,255,255,0.88);
    --panel-border: rgba(0,0,0,0.08);
    --hud-bg: rgba(255,255,255,0.55);
    --wire: rgba(0,184,148,0.55);
    --fog-top: rgba(200,210,220,0.35);
    --fog-bot: rgba(200,210,220,0.82);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1218;
      --fg: #e2ecf4;
      --muted: #6d8494;
      --neon: #3dffd4;
      --neon-dim: #1ad4a8;
      --accent: #ff6f4f;
      --panel: rgba(14,22,30,0.92);
      --panel-border: rgba(255,255,255,0.08);
      --hud-bg: rgba(12,18,24,0.72);
      --wire: rgba(61,255,212,0.45);
      --fog-top: rgba(12,18,24,0.15);
      --fog-bot: rgba(12,18,24,0.88);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, sans-serif;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    padding: 10px 14px;
    background: var(--hud-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    z-index: 10;
    border-bottom: 1px solid var(--panel-border);
  }
  #hud .cell { text-align: center; }
  #hud .val { display: block; color: var(--fg); font-size: 13px; margin-top: 2px; }
  #arena {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.4s ease, visibility 0.4s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 26px 24px;
    max-width: 310px;
    text-align: center;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .panel .tag {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--neon-dim);
    margin-bottom: 10px;
  }
  .panel h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }
  .panel p {
    font-size: 13px;
    line-height: 1.55;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .panel .score-line {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px;
    color: var(--fg);
    margin-bottom: 16px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 170px;
    padding: 14px 28px;
    border: none;
    border-radius: 999px;
    background: var(--neon);
    color: #081218;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    box-shadow: 0 4px 24px rgba(0,232,184,0.3);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  #sync-bar {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 12px;
    height: 4px;
    background: rgba(128,148,160,0.2);
    border-radius: 2px;
    overflow: hidden;
    pointer-events: none;
    z-index: 12;
  }
  #sync-fill {
    height: 100%;
    width: 100%;
    background: var(--neon);
    border-radius: 2px;
    transform-origin: left;
    transition: transform 0.15s ease;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="cell">score<span class="val" id="hud-score">0</span></div>
    <div class="cell">bpm<span class="val" id="hud-bpm">118</span></div>
    <div class="cell">combo<span class="val" id="hud-combo">×0</span></div>
  </div>
  <div id="arena">
    <canvas id="game"></canvas>
    <div id="sync-bar"><div id="sync-fill"></div></div>
    <div class="overlay" id="title-overlay">
      <div class="panel">
        <div class="tag">stutter house · sf fog · 13°c</div>
        <h1>Fog Sync</h1>
        <p>Tap fractures as the pulse subdivides. Keep the orb synced through foggy blocks — late hits spawn ghost notes that choke the lane. Spacebar works on desktop.</p>
        <button type="button" data-smoke="start">Ride the pulse</button>
      </div>
    </div>
    <div class="overlay hidden" id="end-overlay">
      <div class="panel">
        <div class="tag" id="end-tag">cycle complete</div>
        <h1 id="end-title">Drop out</h1>
        <p class="score-line" id="end-score">0 pts · sync lost</p>
        <p id="end-msg">The groove fractured.</p>
        <button type="button" data-smoke="restart">Replay loop</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var hudScore = document.getElementById('hud-score');
  var hudBpm = document.getElementById('hud-bpm');
  var hudCombo = document.getElementById('hud-combo');
  var syncFill = document.getElementById('sync-fill');
  var titleOverlay = document.getElementById('title-overlay');
  var endOverlay = document.getElementById('end-overlay');
  var endTag = document.getElementById('end-tag');
  var endTitle = document.getElementById('end-title');
  var endScore = document.getElementById('end-score');
  var endMsg = document.getElementById('end-msg');
  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');

  var state = 'title';
  var W = 360, H = 640;
  var dpr = 1;
  var lastTs = 0;
  var rafId = 0;

  var score = 0;
  var combo = 0;
  var maxCombo = 0;
  var sync = 100;
  var bpm = 118;
  var subdivision = 1;
  var elapsed = 0;
  var roundLen = 30;
  var nextBeatAt = 0;
  var beatCount = 0;
  var stutterPhase = false;
  var hitPause = 0;
  var shake = 0;
  var orbPulse = 0;
  var lastJudgment = '';
  var judgmentTimer = 0;
  var dropFlash = 0;

  var markers = [];
  var ghosts = [];
  var particles = [];
  var buildings = [];
  var beatId = 0;

  var audioCtx = null;
  var masterGain = null;

  var PERFECT_MS = 70;
  var GOOD_MS = 130;

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function resize() {
    if (!canvas || !ctx) return;
    var rect = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initBuildings();
  }

  function initBuildings() {
    buildings = [];
    var cols = 7;
    for (var i = 0; i < cols; i++) {
      buildings.push({
        x: (i / (cols - 1)) * W,
        h: 40 + Math.random() * 90,
        w: 18 + Math.random() * 28,
        depth: 0.3 + Math.random() * 0.7,
        windows: Math.floor(2 + Math.random() * 5)
      });
    }
  }

  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) {
        audioCtx = new AC();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.22;
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* noop */ }
  }

  function playTone(freq, dur, type, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || 0.35, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) { /* noop */ }
  }

  function playKick() { playTone(90, 0.12, 'sine', 0.5); playTone(48, 0.08, 'triangle', 0.25); }
  function playSnare() { playTone(220, 0.06, 'square', 0.12); playTone(400, 0.04, 'triangle', 0.08); }
  function playHit(quality) {
    if (quality === 'perfect') playTone(880, 0.08, 'sine', 0.3);
    else if (quality === 'good') playTone(660, 0.07, 'sine', 0.22);
    else playTone(180, 0.15, 'sawtooth', 0.18);
  }
  function playDrop() {
    playTone(120, 0.4, 'sine', 0.45);
    playTone(60, 0.6, 'triangle', 0.35);
    if (navigator.vibrate) navigator.vibrate([30, 20, 50]);
  }

  function beatInterval() {
    return 60000 / (bpm * subdivision);
  }

  function hitY() { return H * 0.78; }
  function spawnY() { return H * 0.08; }
  function laneX() { return W * 0.5; }
  function laneW() {
    var clutter = Math.min(ghosts.length * 0.04, 0.45);
    return W * (0.42 - clutter);
  }

  function resetGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    sync = 100;
    bpm = 118;
    subdivision = 1;
    elapsed = 0;
    nextBeatAt = 0;
    beatCount = 0;
    stutterPhase = false;
    hitPause = 0;
    shake = 0;
    orbPulse = 0;
    lastJudgment = '';
    judgmentTimer = 0;
    dropFlash = 0;
    markers = [];
    ghosts = [];
    particles = [];
    beatId = 0;
    updateHud();
    syncFill.style.transform = 'scaleX(1)';
  }

  function startGame() {
    initAudio();
    resetGame();
    state = 'playing';
    titleOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    nextBeatAt = beatInterval() / 1000;
    spawnBeat();
  }

  function endGame(won) {
    state = 'gameover';
    endOverlay.classList.remove('hidden');
    if (won) {
      endTag.textContent = 'cycle complete';
      endTitle.textContent = 'Drop out';
      endMsg.textContent = 'You rode the stutter burst through the fog.';
      playDrop();
      dropFlash = 1;
    } else {
      endTag.textContent = 'sync lost';
      endTitle.textContent = 'Fractured';
      endMsg.textContent = 'Ghost notes choked the lane.';
    }
    endScore.textContent = score + ' pts · combo ×' + maxCombo + (won ? ' · drop nailed' : '');
  }

  function updateHud() {
    hudScore.textContent = String(score);
    hudBpm.textContent = String(Math.round(bpm));
    hudCombo.textContent = '×' + combo;
    syncFill.style.transform = 'scaleX(' + Math.max(0, sync / 100) + ')';
  }

  function escalate() {
    if (elapsed < 8) { subdivision = 1; bpm = 118; }
    else if (elapsed < 16) { subdivision = 2; bpm = 128; }
    else if (elapsed < 24) { subdivision = 3; bpm = 142; }
    else {
      subdivision = 4;
      bpm = stutterPhase ? 168 : 152;
    }
    if (elapsed >= 26 && !stutterPhase) {
      stutterPhase = true;
      lastJudgment = 'STUTTER';
      judgmentTimer = 1.2;
    }
  }

  function spawnBeat() {
    beatId++;
    var isDown = beatCount % 4 === 0;
    var isSnare = beatCount % 4 === 2;
    markers.push({
      id: beatId,
      y: spawnY(),
      born: elapsed,
      targetTime: elapsed + (hitY() - spawnY()) / ((hitY() - spawnY()) / beatInterval()),
      judged: false,
      accent: isDown,
      snare: isSnare,
      frac: subdivision
    });
    beatCount++;
    if (isDown) playKick();
    else if (isSnare) playSnare();
  }

  function spawnParticles(x, y, col, n) {
    for (var i = 0; i < (n || 8); i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 1.5 + Math.random() * 4;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.4 + Math.random() * 0.35,
        max: 0.75,
        col: col
      });
    }
  }

  function spawnGhost(x, y) {
    ghosts.push({
      x: x + (Math.random() - 0.5) * 30,
      y: y,
      life: 6,
      max: 6,
      drift: (Math.random() - 0.5) * 12,
      alpha: 0.55
    });
    if (ghosts.length > 12) ghosts.shift();
  }

  function judgeTap() {
    if (state !== 'playing') return;
    var hy = hitY();
    var best = null;
    var bestDist = Infinity;
    for (var i = 0; i < markers.length; i++) {
      var m = markers[i];
      if (m.judged) continue;
      var dist = Math.abs(m.y - hy);
      if (dist < bestDist) { bestDist = dist; best = m; }
    }
    if (!best) {
      combo = 0;
      sync = Math.max(0, sync - 6);
      lastJudgment = 'early';
      judgmentTimer = 0.5;
      shake = 4;
      playHit('miss');
      updateHud();
      if (sync <= 0) endGame(false);
      return;
    }
    var pxPerMs = (hitY() - spawnY()) / beatInterval();
    var msOff = bestDist / pxPerMs;
    var quality;
    if (msOff <= PERFECT_MS) quality = 'perfect';
    else if (msOff <= GOOD_MS) quality = 'good';
    else {
      quality = 'late';
      spawnGhost(laneX(), hy);
    }
    best.judged = true;
    if (quality === 'perfect') {
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      var mult = 1 + Math.floor(combo / 5);
      score += 100 * mult * (stutterPhase ? 2 : 1);
      sync = Math.min(100, sync + 4);
      hitPause = 0.04;
      orbPulse = 1;
      lastJudgment = 'PERFECT';
      spawnParticles(laneX(), hy, css('--neon'), 12);
      if (navigator.vibrate) navigator.vibrate(8);
    } else if (quality === 'good') {
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      score += 50 * (1 + Math.floor(combo / 8)) * (stutterPhase ? 1.5 : 1);
      sync = Math.min(100, sync + 2);
      orbPulse = 0.6;
      lastJudgment = 'good';
      spawnParticles(laneX(), hy, css('--neon-dim'), 6);
    } else {
      combo = 0;
      sync = Math.max(0, sync - 10);
      shake = 6;
      lastJudgment = 'late';
      if (navigator.vibrate) navigator.vibrate(20);
    }
    judgmentTimer = 0.55;
    playHit(quality === 'late' ? 'miss' : quality);
    updateHud();
    if (sync <= 0) endGame(false);
  }

  function update(dt) {
    if (state !== 'playing') return;
    var spd = hitPause > 0 ? 0 : 1;
    if (hitPause > 0) hitPause -= dt;

    elapsed += dt * spd;
    escalate();

    while (nextBeatAt <= elapsed) {
      spawnBeat();
      nextBeatAt += beatInterval() / 1000;
    }

    var travel = (hitY() - spawnY()) / (beatInterval() / 1000);
    for (var i = markers.length - 1; i >= 0; i--) {
      var m = markers[i];
      m.y += travel * dt * spd;
      if (!m.judged && m.y > hitY() + 28) {
        m.judged = true;
        combo = 0;
        sync = Math.max(0, sync - 8);
        spawnGhost(laneX() + (Math.random() - 0.5) * laneW() * 0.5, hitY());
        shake = 5;
        lastJudgment = 'miss';
        judgmentTimer = 0.45;
        playHit('miss');
        updateHud();
        if (sync <= 0) { endGame(false); return; }
      }
      if (m.y > H + 20) markers.splice(i, 1);
    }

    for (var g = ghosts.length - 1; g >= 0; g--) {
      ghosts[g].life -= dt;
      ghosts[g].x += ghosts[g].drift * dt;
      ghosts[g].y += 8 * dt;
      if (ghosts[g].life <= 0) ghosts.splice(g, 1);
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.life -= dt;
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 12 * dt;
      if (pt.life <= 0) particles.splice(p, 1);
    }

    if (judgmentTimer > 0) judgmentTimer -= dt;
    if (orbPulse > 0) orbPulse = Math.max(0, orbPulse - dt * 2.5);
    if (shake > 0) shake = Math.max(0, shake - dt * 18);
    if (dropFlash > 0) dropFlash = Math.max(0, dropFlash - dt * 0.8);

    if (elapsed >= roundLen) {
      var won = sync > 0;
      if (stutterPhase && combo >= 3) score += 500;
      endGame(won);
    }
    updateHud();
  }

  function drawWireCity(t) {
    var wire = css('--wire');
    ctx.strokeStyle = wire;
    ctx.lineWidth = 1;
    var groundY = H * 0.88;
    var vanishX = W * 0.5;
    var vanishY = H * 0.32;

    ctx.globalAlpha = 0.22;
    for (var s = 0; s < 8; s++) {
      var frac = s / 8;
      var y = groundY - (groundY - vanishY) * frac * frac;
      var halfW = (W * 0.55) * frac;
      ctx.beginPath();
      ctx.moveTo(vanishX - halfW, y);
      ctx.lineTo(vanishX + halfW, y);
      ctx.stroke();
      if (s % 2 === 0) {
        ctx.beginPath();
        ctx.moveTo(vanishX - halfW * 0.3, y);
        ctx.lineTo(vanishX - halfW, groundY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(vanishX + halfW * 0.3, y);
        ctx.lineTo(vanishX + halfW, groundY);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();

    for (var i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      var bx = b.x;
      var by = groundY - b.h * b.depth;
      var bw = b.w;
      ctx.globalAlpha = 0.35 + b.depth * 0.45;
      ctx.strokeRect(bx - bw / 2, by, bw, groundY - by);
      ctx.beginPath();
      ctx.moveTo(bx - bw / 2, by);
      ctx.lineTo(bx - bw / 4, by - 12 * b.depth);
      ctx.lineTo(bx + bw / 4, by - 12 * b.depth);
      ctx.lineTo(bx + bw / 2, by);
      ctx.stroke();
      ctx.fillStyle = wire;
      for (var w = 0; w < b.windows; w++) {
        var wy = by + 10 + w * 14;
        if (wy < groundY - 8) ctx.fillRect(bx - 3, wy, 5, 7);
      }
    }
    ctx.globalAlpha = 1;

    var fogGrad = ctx.createLinearGradient(0, 0, 0, H);
    fogGrad.addColorStop(0, css('--fog-top'));
    fogGrad.addColorStop(0.55, 'rgba(0,0,0,0)');
    fogGrad.addColorStop(1, css('--fog-bot'));
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, 0, W, H);

    var mist = Math.sin(t * 0.4) * 0.03;
    ctx.globalAlpha = 0.12 + mist;
    ctx.fillStyle = css('--neon');
    ctx.fillRect(0, H * 0.55, W, H * 0.45);
    ctx.globalAlpha = 1;
  }

  function drawLane() {
    var lx = laneX();
    var lw = laneW();
    var hy = hitY();
    ctx.strokeStyle = css('--wire');
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(lx - lw / 2, spawnY());
    ctx.lineTo(lx - lw / 2, H);
    ctx.moveTo(lx + lw / 2, spawnY());
    ctx.lineTo(lx + lw / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = css('--neon');
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.7 + Math.sin(performance.now() * 0.008) * 0.15;
    ctx.beginPath();
    ctx.moveTo(lx - lw / 2 + 8, hy);
    ctx.lineTo(lx + lw / 2 - 8, hy);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.fillStyle = css('--neon');
    ctx.globalAlpha = 0.08;
    ctx.fillRect(lx - lw / 2, hy - 18, lw, 36);
    ctx.globalAlpha = 1;
  }

  function drawOrb(t) {
    var lx = laneX();
    var hy = hitY() - 42;
    var r = 14 + orbPulse * 8;
    var g = ctx.createRadialGradient(lx, hy, 0, lx, hy, r * 2.2);
    g.addColorStop(0, css('--neon'));
    g.addColorStop(0.45, css('--neon-dim'));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(lx, hy, r * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(lx, hy, 5 + orbPulse * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (stutterPhase) {
      ctx.strokeStyle = css('--accent');
      ctx.lineWidth = 1;
      for (var i = 0; i < 6; i++) {
        var a = t * 4 + i * 1.05;
        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.arc(lx, hy, r + 8 + i * 5 + Math.sin(a) * 3, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawMarkerFracture(x, y, sz, m) {
    var pieces = Math.min(subdivision, 4);
    if (pieces <= 1) {
      ctx.beginPath();
      ctx.arc(x, y, sz / 2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    var gap = 2 + pieces;
    for (var f = 0; f < pieces; f++) {
      var ang = (f / pieces) * Math.PI * 2 + m.id * 0.4;
      var ox = Math.cos(ang) * gap;
      var oy = Math.sin(ang) * gap * 0.6;
      ctx.beginPath();
      if (subdivision >= 3) {
        ctx.rect(x + ox - sz * 0.35, y + oy - sz * 0.35, sz * 0.7, sz * 0.7);
      } else {
        ctx.arc(x + ox, y + oy, sz * 0.38, 0, Math.PI * 2);
      }
      ctx.fill();
    }
    ctx.strokeStyle = css('--neon-dim');
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - sz, y);
    ctx.lineTo(x + sz, y);
    ctx.stroke();
  }

  function drawMarkers() {
    var lx = laneX();
    var lw = laneW();
    for (var i = 0; i < markers.length; i++) {
      var m = markers[i];
      if (m.judged) continue;
      var spread = (m.frac - 1) * 0.15;
      var xOff = Math.sin(m.id * 1.7) * lw * spread * 0.35;
      var x = lx + xOff;
      var sz = m.accent ? 11 : (m.snare ? 8 : 6);
      ctx.fillStyle = m.accent ? css('--neon') : css('--fg');
      ctx.globalAlpha = 0.55 + (m.y / hitY()) * 0.45;
      drawMarkerFracture(x, m.y, sz, m);
      if (subdivision >= 2) {
        ctx.strokeStyle = css('--neon-dim');
        ctx.lineWidth = 1;
        ctx.globalAlpha *= 0.7;
        ctx.strokeRect(x - sz, m.y - sz, sz * 2, sz * 2);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawGhosts() {
    for (var i = 0; i < ghosts.length; i++) {
      var g = ghosts[i];
      var a = (g.life / g.max) * g.alpha;
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = css('--muted');
      ctx.beginPath();
      ctx.ellipse(g.x, g.y, 16, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = a * 0.25;
      ctx.strokeStyle = css('--accent');
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(g.x - 12, g.y);
      ctx.lineTo(g.x + 12, g.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.life / p.max;
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawHudText() {
    if (judgmentTimer <= 0) return;
    ctx.font = '600 13px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = lastJudgment === 'PERFECT' || lastJudgment === 'STUTTER' ? css('--neon') :
      lastJudgment === 'good' ? css('--neon-dim') : css('--accent');
    ctx.globalAlpha = Math.min(1, judgmentTimer * 2);
    ctx.fillText(lastJudgment.toUpperCase(), laneX(), hitY() - 72);
    ctx.globalAlpha = 1;
  }

  function drawProgress() {
    var bx = 14, by = 36, bw = W - 28, bh = 3;
    ctx.fillStyle = 'rgba(128,148,160,0.2)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = css('--neon');
    ctx.fillRect(bx, by, bw * Math.min(1, elapsed / roundLen), bh);
    if (stutterPhase) {
      ctx.fillStyle = css('--accent');
      ctx.globalAlpha = 0.5 + Math.sin(performance.now() * 0.02) * 0.3;
      ctx.fillRect(bx + bw * (26 / roundLen), by - 1, bw * (4 / roundLen), bh + 2);
      ctx.globalAlpha = 1;
    }
  }

  function render(t) {
    if (!ctx) return;
    var shakeX = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    var shakeY = shake > 0 ? (Math.random() - 0.5) * shake * 0.6 : 0;
    ctx.save();
    ctx.translate(shakeX, shakeY);
    ctx.fillStyle = css('--bg');
    ctx.fillRect(0, 0, W, H);
    drawWireCity(t);
    drawLane();
    drawGhosts();
    drawMarkers();
    drawOrb(t);
    drawParticles();
    drawProgress();
    drawHudText();
    if (dropFlash > 0) {
      ctx.fillStyle = css('--neon');
      ctx.globalAlpha = dropFlash * 0.25;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    render(ts / 1000);
    rafId = requestAnimationFrame(loop);
  }

  function onTap(e) {
    if (e && e.preventDefault) e.preventDefault();
    judgeTap();
  }

  function bindEvents() {
    if (startBtn) startBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
    if (restartBtn) restartBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
    if (canvas) {
      canvas.addEventListener('touchstart', function (e) {
        e.preventDefault();
        if (state === 'playing') onTap(e);
      }, { passive: false });
      canvas.addEventListener('mousedown', function (e) {
        if (state === 'playing') onTap(e);
      });
    }
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (state === 'title') startGame();
        else if (state === 'gameover') startGame();
        else if (state === 'playing') onTap(e);
      }
    });
    window.addEventListener('resize', resize);
  }

  function boot() {
    document.body.style.minHeight = '100dvh';
    resize();
    bindEvents();
    render(0);
    rafId = requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
