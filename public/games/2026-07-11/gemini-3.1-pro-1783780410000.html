<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember & Ash</title>
<style>
  :root {
    --bg: #f4ece1;
    --fg: #1a1a1a;
    --ochre: #c98a2c;
    --blue: #4a90e2;
    --orange: #e25c1d;
    --smoke: rgba(20, 20, 20, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --fg: #f4ece1;
      --ochre: #8b5a19;
      --blue: #5ca0f2;
      --orange: #f27031;
      --smoke: rgba(200, 200, 200, 0.15);
    }
  }
  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .hidden {
    opacity: 0;
    pointer-events: none !important;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: center;
  }
  p {
    font-size: 1.1rem;
    margin-bottom: 2.5rem;
    text-align: center;
    max-width: 85%;
    line-height: 1.5;
  }
  .blue-text { color: #5ca0f2; font-weight: bold; }
  .orange-text { color: #f27031; font-weight: bold; }
  
  button {
    pointer-events: auto;
    background: #fff;
    color: #000;
    border: none;
    padding: 1.2rem 2.5rem;
    font-size: 1.2rem;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: bold;
    box-shadow: 0 4px 0 rgba(255,255,255,0.3);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active {
    transform: translateY(4px);
    box-shadow: none;
  }
  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 20px);
    left: env(safe-area-inset-left, 20px);
    right: env(safe-area-inset-right, 20px);
    display: flex;
    justify-content: space-between;
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--fg);
    text-shadow: 0 2px 4px var(--bg);
    pointer-events: none;
  }
  #progress-bar-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 6px;
    background: rgba(0,0,0,0.1);
    z-index: 10;
  }
  #progress-bar {
    height: 100%;
    background: var(--fg);
    width: 100%;
    transform-origin: left;
  }
</style>
</head>
<body>
<div id="progress-bar-container"><div id="progress-bar"></div></div>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div id="time">40s</div>
    <div id="score">0</div>
  </div>
  <div id="start-screen" class="screen">
    <h1>Ember & Ash</h1>
    <p>Swipe left/right to shift falling sparks.<br><br><span class="blue-text">Blue Ash</span> goes Left.<br><span class="orange-text">Orange Embers</span> go Right.<br><br>Survive the wind.</p>
    <button data-smoke="start" id="start-btn">Start</button>
  </div>
  <div id="game-over-screen" class="screen hidden">
    <h1 id="go-title">Game Over</h1>
    <p id="go-msg">Consumed by smoke.</p>
    <button data-smoke="restart" id="restart-btn">Restart</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let width, height;

let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
let colors = getColors(isDark);

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  isDark = e.matches;
  colors = getColors(isDark);
});

function getColors(dark) {
  return dark ? {
    bg: '#1a1a1a', fg: '#f4ece1', ochre: '#8b5a19', blue: '#5ca0f2', orange: '#f27031', smoke: 'rgba(200, 200, 200, 0.15)'
  } : {
    bg: '#f4ece1', fg: '#1a1a1a', ochre: '#c98a2c', blue: '#4a90e2', orange: '#e25c1d', smoke: 'rgba(20, 20, 20, 0.85)'
  };
}

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  try {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    let now = audioCtx.currentTime;
    
    if (type === 'good') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'bad') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'wind') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.linearRampToValueAtTime(300, now + 0.5);
      osc.frequency.linearRampToValueAtTime(100, now + 1.0);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.1, now + 0.2);
      gain.gain.linearRampToValueAtTime(0, now + 1.0);
      osc.start(now); osc.stop(now + 1.0);
    } else if (type === 'swipe') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    }
  } catch(e) {}
}

// Game State
let state = 'start'; // start, playing, gameover, win
let timeRemaining = 40;
let score = 0;
let smokeLevel = 0;
let currentSmokeY = height + 50;
let smokeTime = 0;
let items = [];
let particles = [];
let windParticles = [];
let spawnTimer = 0;
let windTimer = 5;
let windWarningTimer = 0;
let nextWindDir = 0;
let shakeTime = 0;
let shakeIntensity = 0;

function addShake(intensity, duration) {
  shakeIntensity = intensity;
  shakeTime = duration;
}

function getLaneX(lane) {
  return (width / 3) * lane + (width / 6);
}

class Item {
  constructor(lane, type, baseSpeed) {
    this.lane = lane;
    this.type = type;
    this.y = -50;
    this.x = getLaneX(lane);
    this.speed = baseSpeed + Math.random() * 50;
    this.wobble = Math.random() * Math.PI * 2;
    this.dead = false;
    this.missed = false;
  }
  update(dt) {
    this.y += this.speed * dt;
    let targetX = getLaneX(this.lane);
    this.x += (targetX - this.x) * 15 * dt;
    this.wobble += dt * 5;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(Math.sin(this.wobble) * 0.2);
    
    let size = 18;
    let color = this.type === 'ash' ? colors.blue : colors.orange;
    
    ctx.fillStyle = color;
    ctx.beginPath();
    for(let i=0; i<6; i++) {
      let angle = (i / 6) * Math.PI * 2;
      let r = size + (i%2 === 0 ? 6 : -4);
      let px = Math.cos(angle) * r;
      let py = Math.sin(angle) * r;
      if (i===0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = colors.bg;
    ctx.beginPath();
    for(let i=0; i<6; i++) {
      let angle = (i / 6) * Math.PI * 2 + 0.5;
      let r = (size - 6) + (i%2 === 0 ? 4 : -2);
      let px = Math.cos(angle) * r;
      let py = Math.sin(angle) * r;
      if (i===0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color, isBad) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.isBad = isBad;
    let angle = Math.random() * Math.PI * 2;
    let speed = 50 + Math.random() * 150;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - (isBad ? 100 : 200);
    this.life = 0.5 + Math.random() * 0.5;
    this.maxLife = this.life;
    this.size = 2 + Math.random() * 4;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.isBad) {
      this.vy -= 300 * dt;
      this.vx *= 0.95;
    } else {
      this.vy += 600 * dt;
    }
    this.life -= dt;
  }
  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.life / this.maxLife;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

function spawnParticles(x, y, color, isBad) {
  for(let i=0; i<10; i++) particles.push(new Particle(x, y, color, isBad));
  if (isBad) {
    addShake(8, 0.2);
    playSound('bad');
    if (navigator.vibrate) try { navigator.vibrate([30, 50, 30]); } catch(e){}
  } else {
    playSound('good');
  }
}

function shiftItems(dir) {
  let shiftedAny = false;
  items.forEach(item => {
    if (item.dead || item.missed) return;
    let newLane = item.lane + dir;
    if (newLane >= 0 && newLane <= 2) {
      item.lane = newLane;
      shiftedAny = true;
    }
  });
  if (shiftedAny) {
    playSound('swipe');
    if (navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
  }
}

// Input
let touchStartX = 0;
let touchStartY = 0;
let isMouseDown = false;

window.addEventListener('touchstart', e => {
  if (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'button') return;
  e.preventDefault();
  if (state !== 'playing') return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: false});

window.addEventListener('touchmove', e => {
  if (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'button') return;
  e.preventDefault();
}, {passive: false});

window.addEventListener('touchend', e => {
  if (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'button') return;
  if (state !== 'playing') return;
  let dx = e.changedTouches[0].clientX - touchStartX;
  let dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
    shiftItems(dx > 0 ? 1 : -1);
  }
}, {passive: false});

window.addEventListener('mousedown', e => {
  if (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'button') return;
  if (state !== 'playing') return;
  isMouseDown = true;
  touchStartX = e.clientX;
  touchStartY = e.clientY;
});

window.addEventListener('mouseup', e => {
  if (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'button') return;
  if (!isMouseDown) return;
  isMouseDown = false;
  if (state !== 'playing') return;
  let dx = e.clientX - touchStartX;
  let dy = e.clientY - touchStartY;
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
    shiftItems(dx > 0 ? 1 : -1);
  }
});

window.addEventListener('keydown', e => {
  if (state !== 'playing') return;
  if (e.key === 'ArrowLeft') shiftItems(-1);
  if (e.key === 'ArrowRight') shiftItems(1);
});

function startGame() {
  state = 'playing';
  timeRemaining = 40;
  score = 0;
  smokeLevel = 0;
  items = [];
  particles = [];
  windParticles = [];
  spawnTimer = 1;
  windTimer = 4;
  windWarningTimer = 0;
  
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
}

function gameOver(won) {
  state = won ? 'win' : 'gameover';
  document.getElementById('hud').classList.add('hidden');
  let goScreen = document.getElementById('game-over-screen');
  goScreen.classList.remove('hidden');
  
  document.getElementById('go-title').innerText = won ? 'Survived' : 'Consumed';
  document.getElementById('go-msg').innerText = won ? `You weathered the storm.\nScore: ${score}` : `The smoke took over.\nScore: ${score}`;
  goScreen.style.pointerEvents = 'none'; // container
}

document.getElementById('start-btn').addEventListener('click', () => { initAudio(); startGame(); });
document.getElementById('restart-btn').addEventListener('click', () => { initAudio(); startGame(); });

function drawBackground(ctx) {
  let grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, colors.bg);
  grad.addColorStop(1, colors.ochre);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);
  
  ctx.strokeStyle = colors.fg;
  ctx.globalAlpha = 0.05;
  ctx.lineWidth = 1;
  for(let i=0; i<height; i+=40) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();
  }
  ctx.globalAlpha = 1.0;
}

function drawCutoutBin(ctx, x, y, w, h, color, label) {
  ctx.save();
  ctx.translate(x, y);
  
  ctx.fillStyle = colors.fg;
  ctx.beginPath();
  ctx.moveTo(-w/2, -h/2);
  ctx.lineTo(w/2, -h/2);
  ctx.lineTo(w/2 - 5, h/2);
  ctx.lineTo(-w/2 + 5, h/2);
  ctx.closePath();
  ctx.fill();
  
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.stroke();
  
  ctx.fillStyle = color;
  ctx.font = 'bold 16px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, 0, 0);
  
  ctx.restore();
}

function drawBins(ctx) {
  let binY = height * 0.85;
  let binWidth = width / 3 * 0.8;
  let binHeight = 50;
  
  drawCutoutBin(ctx, getLaneX(0), binY, binWidth, binHeight, colors.blue, 'ASH');
  drawCutoutBin(ctx, getLaneX(2), binY, binWidth, binHeight, colors.orange, 'EMBER');
  
  ctx.strokeStyle = colors.fg;
  ctx.globalAlpha = 0.1;
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);
  let l1 = width / 3;
  ctx.beginPath(); ctx.moveTo(l1, 0); ctx.lineTo(l1, height); ctx.stroke();
  let l2 = width * 2 / 3;
  ctx.beginPath(); ctx.moveTo(l2, 0); ctx.lineTo(l2, height); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1.0;
}

function drawSmoke(ctx, dt) {
  smokeTime += dt;
  let targetSmokeY = height + 50 - (smokeLevel * (height * 0.6 + 50));
  currentSmokeY += (targetSmokeY - currentSmokeY) * 5 * dt;
  
  ctx.fillStyle = colors.smoke;
  ctx.beginPath();
  ctx.moveTo(0, height);
  for (let x = 0; x <= width; x += 20) {
    let y = currentSmokeY + Math.sin(x * 0.01 + smokeTime * 2) * 15 + Math.sin(x * 0.02 - smokeTime * 3) * 10;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(width, height);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = colors.fg;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.moveTo(0, height);
  for (let x = 0; x <= width; x += 20) {
    let y = currentSmokeY + 20 + Math.sin(x * 0.015 - smokeTime * 1.5) * 15 + Math.sin(x * 0.025 + smokeTime * 2) * 10;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(width, height);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1.0;
}

function drawWindWarning(ctx, dt) {
  if (windWarningTimer > 0) {
    windWarningTimer -= dt;
    ctx.fillStyle = colors.fg;
    ctx.globalAlpha = 0.15 + Math.sin(windWarningTimer * 15) * 0.1;
    let arrowX = nextWindDir === 1 ? width/2 - 60 : width/2 + 60;
    ctx.font = 'bold 120px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(nextWindDir === 1 ? '»' : '«', arrowX, height/2);
    ctx.globalAlpha = 1.0;
  }
}

let lastTime = 0;
function loop(timestamp) {
  let dt = (timestamp - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = timestamp;
  
  if (state === 'playing') {
    timeRemaining -= dt;
    if (timeRemaining <= 0) {
      gameOver(true);
    } else {
      document.getElementById('time').innerText = Math.ceil(timeRemaining) + 's';
      document.getElementById('score').innerText = score;
      document.getElementById('progress-bar').style.transform = `scaleX(${timeRemaining / 40})`;
      
      let progress = 1 - (timeRemaining / 40);
      let currentSpawnRate = 1.2 - progress * 0.7;
      let currentBaseSpeed = 150 + progress * 250;
      
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTimer = currentSpawnRate;
        let lane = Math.floor(Math.random() * 3);
        let type = Math.random() < 0.5 ? 'ash' : 'ember';
        items.push(new Item(lane, type, currentBaseSpeed));
      }
      
      if (windTimer <= 1.0 && windWarningTimer <= 0) {
        windWarningTimer = 1.0;
        nextWindDir = Math.random() < 0.5 ? -1 : 1;
      }
      
      windTimer -= dt;
      if (windTimer <= 0) {
        windTimer = 5 - progress * 2.5;
        windWarningTimer = 0;
        shiftItems(nextWindDir);
        playSound('wind');
        addShake(5, 0.3);
        for(let i=0; i<30; i++) {
          windParticles.push({
            x: nextWindDir === 1 ? -Math.random()*width : width + Math.random()*width,
            y: Math.random() * height,
            vx: nextWindDir * (800 + Math.random()*400),
            life: 1.5
          });
        }
      }
      
      items.forEach(item => {
        item.update(dt);
        if (item.y > height * 0.85 && !item.dead && !item.missed) {
          if (item.lane === 0) {
            item.dead = true;
            if (item.type === 'ash') {
              score += 10;
              smokeLevel = Math.max(0, smokeLevel - 0.05);
              spawnParticles(item.x, item.y, colors.blue, false);
            } else {
              smokeLevel = Math.min(1.0, smokeLevel + 0.15);
              spawnParticles(item.x, item.y, colors.orange, true);
            }
          } else if (item.lane === 2) {
            item.dead = true;
            if (item.type === 'ember') {
              score += 10;
              smokeLevel = Math.max(0, smokeLevel - 0.05);
              spawnParticles(item.x, item.y, colors.orange, false);
            } else {
              smokeLevel = Math.min(1.0, smokeLevel + 0.15);
              spawnParticles(item.x, item.y, colors.blue, true);
            }
          } else {
            item.missed = true;
            smokeLevel = Math.min(1.0, smokeLevel + 0.1);
            spawnParticles(item.x, item.y, colors.fg, true);
          }
        }
      });
      
      items = items.filter(i => {
        if (i.missed) return i.y < height + 50;
        return !i.dead;
      });
      
      particles.forEach(p => p.update(dt));
      particles = particles.filter(p => p.life > 0);
      
      if (smokeLevel >= 1.0) gameOver(false);
    }
  }
  
  ctx.save();
  if (shakeTime > 0) {
    shakeTime -= dt;
    ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
  }
  
  drawBackground(ctx);
  drawBins(ctx);
  
  if (state === 'playing') drawWindWarning(ctx, dt);
  
  items.forEach(item => item.draw(ctx));
  particles.forEach(p => p.draw(ctx));
  
  ctx.strokeStyle = colors.fg;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.3;
  windParticles.forEach(p => {
    p.x += p.vx * dt;
    p.life -= dt;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.vx * 0.1, p.y); ctx.stroke();
  });
  ctx.globalAlpha = 1.0;
  windParticles = windParticles.filter(p => p.life > 0);
  
  drawSmoke(ctx, dt);
  ctx.restore();
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
