<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Drop</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  :root {
    --bg: #e8ecef;
    --fg: #1a1f24;
    --muted: #6b7785;
    --neon: #00e5c0;
    --neon2: #ff4d6a;
    --panel: rgba(255,255,255,0.88);
    --fog: rgba(200,210,220,0.55);
    --hit: rgba(0,229,192,0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b9aab;
      --neon: #00ffd0;
      --neon2: #ff6b8a;
      --panel: rgba(13,17,23,0.92);
      --fog: rgba(40,50,65,0.65);
      --hit: rgba(0,255,208,0.25);
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    flex: 1;
    width: 100dvw;
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: pointer;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1.5rem;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.4s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
    border-radius: 12px;
    padding: 1.75rem 1.5rem;
    max-width: 22rem;
    width: 90%;
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    pointer-events: none;
  }
  h1 {
    font-size: clamp(1.4rem, 5vw, 1.9rem);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    color: var(--fg);
  }
  .tagline {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 1.25rem;
  }
  .neon-line {
    height: 2px;
    width: 60%;
    margin: 0 auto 1.25rem;
    background: linear-gradient(90deg, transparent, var(--neon), var(--neon2), transparent);
    border-radius: 2px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 160px;
    padding: 0.85rem 2rem;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: var(--neon);
    color: #0a0f14;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 0 20px color-mix(in srgb, var(--neon) 50%, transparent);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  @media (prefers-color-scheme: dark) {
    button[data-smoke] { color: #0d1117; }
  }
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: max(0.75rem, env(safe-area-inset-top)) 1rem 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #hud.visible { opacity: 1; }
  .hud-block { display: flex; flex-direction: column; gap: 0.15rem; }
  .hud-label { color: var(--muted); font-size: 0.62rem; text-transform: uppercase; }
  .hud-val { font-size: 1rem; font-weight: 600; }
  #drop-bar-wrap {
    position: absolute;
    bottom: max(1rem, env(safe-area-inset-bottom));
    left: 1rem;
    right: 1rem;
    height: 4px;
    background: color-mix(in srgb, var(--fg) 10%, transparent);
    border-radius: 2px;
    overflow: hidden;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #drop-bar-wrap.visible { opacity: 1; }
  #drop-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    border-radius: 2px;
    transition: width 0.08s linear;
    box-shadow: 0 0 8px var(--neon);
  }
  .final-score {
    font-size: 2rem;
    font-weight: 700;
    color: var(--neon);
    margin: 0.5rem 0;
  }
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span class="hud-val" id="score-val">0</span>
    </div>
    <div class="hud-block" style="align-items:center;text-align:center">
      <span class="hud-label" id="bpm-label">118 BPM</span>
      <span class="hud-val" id="combo-val">×0</span>
    </div>
    <div class="hud-block" style="align-items:flex-end;text-align:right">
      <span class="hud-label">Time</span>
      <span class="hud-val" id="time-val">45</span>
    </div>
  </div>
  <div id="drop-bar-wrap"><div id="drop-bar"></div></div>
  <div id="title-overlay" class="overlay">
    <div class="panel">
      <h1>Fog Drop</h1>
      <div class="neon-line"></div>
      <p class="tagline">Tap the neon slices as they cross the line.<br>Extend the drop. Don't glitch the mix.</p>
      <button type="button" data-smoke="start">Enter the Drop</button>
    </div>
  </div>
  <div id="over-overlay" class="overlay hidden">
    <div class="panel">
      <h1>Mix Glitched</h1>
      <div class="neon-line"></div>
      <div class="final-score" id="final-score">0</div>
      <div class="stats-row">
        <span id="stat-perfect">0 perfect</span>
        <span id="stat-max">max ×0</span>
      </div>
      <button type="button" data-smoke="restart">Ride Again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  var ROUND_SEC = 45;
  var LANES = 3;
  var PERFECT_MS = 70;
  var GOOD_MS = 140;

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var hud = document.getElementById('hud');
  var dropWrap = document.getElementById('drop-bar-wrap');
  var dropBar = document.getElementById('drop-bar');
  var scoreEl = document.getElementById('score-val');
  var comboEl = document.getElementById('combo-val');
  var bpmEl = document.getElementById('bpm-label');
  var timeEl = document.getElementById('time-val');
  var titleOverlay = document.getElementById('title-overlay');
  var overOverlay = document.getElementById('over-overlay');
  var finalScoreEl = document.getElementById('final-score');
  var statPerfect = document.getElementById('stat-perfect');
  var statMax = document.getElementById('stat-max');
  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');

  var W = 360, H = 640;
  var state = STATE.TITLE;
  var dpr = 1;
  var markers = [];
  var particles = [];
  var fogBands = [];
  var waves = [];
  var lastSpawn = 0;
  var nextId = 1;
  var score = 0;
  var combo = 0;
  var maxCombo = 0;
  var perfects = 0;
  var dropMeter = 0.5;
  var timeLeft = ROUND_SEC;
  var roundStart = 0;
  var bpm = 118;
  var beatInterval = 60000 / bpm;
  var glitchAmt = 0;
  var shakeT = 0;
  var hitFlash = 0;
  var missFlash = 0;
  var audioCtx = null;
  var masterGain = null;
  var animId = 0;
  var lastFrame = 0;
  var isDark = false;
  var hitY = 0;
  var laneW = 0;
  var laneXs = [];
  var floatTexts = [];
  var beatPulse = 0;
  var bpmLabel = '118';

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35;
      masterGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, type, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g);
      g.connect(masterGain);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function playKick() {
    if (!audioCtx || !masterGain) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.15);
    } catch (e) {}
  }

  function playMiss() {
    playTone(80, 0.2, 'sawtooth', 0.15);
    playTone(60, 0.3, 'square', 0.08);
  }

  function playPerfect() {
    playKick();
    playTone(440 + combo * 8, 0.08, 'triangle', 0.12);
  }

  function playGood() {
    playKick();
    playTone(330, 0.06, 'triangle', 0.08);
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    hitY = H * 0.82;
    laneW = W * 0.78 / LANES;
    var startX = (W - laneW * LANES) / 2;
    laneXs = [];
    for (var i = 0; i < LANES; i++) laneXs.push(startX + laneW * i + laneW / 2);
    initFog();
    initWaves();
  }

  function initFog() {
    fogBands = [];
    for (var i = 0; i < 6; i++) {
      fogBands.push({
        y: Math.random() * H * 0.5,
        x: Math.random() * W,
        w: W * (0.4 + Math.random() * 0.5),
        h: 30 + Math.random() * 50,
        spd: 8 + Math.random() * 20,
        alpha: 0.15 + Math.random() * 0.2
      });
    }
  }

  function initWaves() {
    waves = [];
    for (var i = 0; i < 5; i++) {
      waves.push({ phase: Math.random() * Math.PI * 2, amp: 4 + i * 2, y: H * 0.55 + i * 18 });
    }
  }

  function getBpmMult(elapsed) {
    if (elapsed > 30) return 3;
    if (elapsed > 15) return 2;
    return 1;
  }

  function spawnMarker(now, elapsed) {
    var mult = getBpmMult(elapsed);
    var interval = beatInterval / mult;
    if (now - lastSpawn < interval * 0.85) return;
    lastSpawn = now;

    var lane = Math.floor(Math.random() * LANES);
    var offbeat = elapsed > 20 && Math.random() < 0.35;
    var sliceH = 14 + Math.random() * 10;
    var travel = hitY + 50;
    var fallSec = interval / 1000;
    var baseSpeed = travel / fallSec;
    beatPulse = 1;
    markers.push({
      id: nextId++,
      lane: lane,
      y: -40,
      h: sliceH,
      speed: baseSpeed * (offbeat ? 0.72 : 1),
      offbeat: offbeat,
      hit: false,
      missed: false,
      spawnTime: now
    });

    if (mult >= 2 && Math.random() < 0.4) {
      var lane2 = (lane + 1 + Math.floor(Math.random() * (LANES - 1))) % LANES;
      markers.push({
        id: nextId++,
        lane: lane2,
        y: -30,
        h: sliceH * 0.8,
        speed: baseSpeed * 0.5,
        offbeat: true,
        hit: false,
        missed: false,
        spawnTime: now
      });
    }
  }

  function addFloatText(text, x, y, color) {
    floatTexts.push({ text: text, x: x, y: y, color: color, life: 0.7, vy: -1.2 });
  }

  function spawnParticles(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 2 + Math.random() * 5;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 2,
        life: 0.4 + Math.random() * 0.3,
        maxLife: 0.7,
        color: color,
        size: 2 + Math.random() * 4
      });
    }
  }

  function resetGame() {
    markers = [];
    particles = [];
    floatTexts = [];
    beatPulse = 0;
    bpmLabel = '118';
    score = 0;
    combo = 0;
    maxCombo = 0;
    perfects = 0;
    dropMeter = 0.5;
    timeLeft = ROUND_SEC;
    bpm = 118;
    beatInterval = 60000 / bpm;
    glitchAmt = 0;
    shakeT = 0;
    hitFlash = 0;
    missFlash = 0;
    lastSpawn = 0;
    roundStart = performance.now();
    updateHud();
    dropBar.style.width = '50%';
  }

  function startGame() {
    initAudio();
    resetGame();
    state = STATE.PLAY;
    titleOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    hud.classList.add('visible');
    dropWrap.classList.add('visible');
    if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
  }

  function endGame() {
    state = STATE.OVER;
    hud.classList.remove('visible');
    dropWrap.classList.remove('visible');
    overOverlay.classList.remove('hidden');
    finalScoreEl.textContent = String(score);
    statPerfect.textContent = perfects + ' perfect';
    statMax.textContent = 'max ×' + maxCombo;
    if (navigator.vibrate) try { navigator.vibrate([40, 30, 40]); } catch (e) {}
  }

  function updateHud() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) comboEl.textContent = '×' + combo;
    if (bpmEl) bpmEl.textContent = bpmLabel;
    if (timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
    if (dropBar) dropBar.style.width = Math.round(dropMeter * 100) + '%';
  }

  function tryHit(clientX, clientY) {
    if (state !== STATE.PLAY) return;
    var best = null;
    var bestDist = Infinity;
    var tapLane = -1;
    var minLaneDist = Infinity;
    for (var l = 0; l < LANES; l++) {
      var d = Math.abs(clientX - laneXs[l]);
      if (d < minLaneDist) { minLaneDist = d; tapLane = l; }
    }

    for (var i = 0; i < markers.length; i++) {
      var m = markers[i];
      if (m.hit || m.missed) continue;
      var centerY = m.y + m.h / 2;
      var distY = Math.abs(centerY - hitY);
      var laneOk = m.lane === tapLane || minLaneDist < laneW * 0.6;
      if (laneOk && distY < GOOD_MS * (H / 500) * 2.5 && distY < bestDist) {
        bestDist = distY;
        best = m;
      }
    }

    if (!best) {
      var nearMiss = false;
      for (var j = 0; j < markers.length; j++) {
        var mk = markers[j];
        if (!mk.hit && !mk.missed && Math.abs(mk.y + mk.h / 2 - hitY) < 50) nearMiss = true;
      }
      if (nearMiss) registerMiss('early');
      return;
    }

    var pxDist = bestDist / (H / 500) * 500;
    if (pxDist <= PERFECT_MS) {
      registerHit(best, 'perfect');
    } else if (pxDist <= GOOD_MS) {
      registerHit(best, 'good');
    } else {
      registerMiss('late');
    }
  }

  function registerHit(m, quality) {
    m.hit = true;
    var pts = quality === 'perfect' ? 100 : 50;
    if (m.offbeat) pts = Math.round(pts * 1.5);
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    var mult = 1 + Math.floor(combo / 5) * 0.25;
    score += Math.round(pts * mult);
    if (quality === 'perfect') perfects++;
    dropMeter = Math.min(1, dropMeter + 0.06);
    glitchAmt = Math.max(0, glitchAmt - 0.15);
    hitFlash = 0.25;
    shakeT = 0.08;
    var col = quality === 'perfect' ? '#00ffd0' : '#7dfff0';
    spawnParticles(laneXs[m.lane], hitY, col, quality === 'perfect' ? 14 : 8);
    addFloatText(quality === 'perfect' ? 'PERFECT' : 'GOOD', laneXs[m.lane], hitY - 30, col);
    if (dropMeter >= 0.95) addFloatText('IN THE DROP', W / 2, H * 0.35, pNeon());
    if (quality === 'perfect') playPerfect(); else playGood();
    if (navigator.vibrate) try { navigator.vibrate(quality === 'perfect' ? 12 : 6); } catch (e) {}
    updateHud();
  }

  function pNeon() {
    return prefersDark() ? '#00ffd0' : '#00c9a7';
  }

  function registerMiss(reason) {
    combo = 0;
    dropMeter = Math.max(0, dropMeter - 0.12);
    glitchAmt = Math.min(1, glitchAmt + 0.25);
    missFlash = 0.3;
    shakeT = 0.15;
    addFloatText('GLITCH', W / 2, hitY - 40, prefersDark() ? '#ff6b8a' : '#ff4d6a');
    playMiss();
    if (dropMeter <= 0 && state === STATE.PLAY) endGame();
    if (navigator.vibrate) try { navigator.vibrate(50); } catch (e) {}
    updateHud();
  }

  function checkMissedMarkers() {
    for (var i = 0; i < markers.length; i++) {
      var m = markers[i];
      if (!m.hit && !m.missed && m.y > hitY + 40) {
        m.missed = true;
        registerMiss('passed');
      }
    }
  }

  function palette() {
    isDark = prefersDark();
    return {
      sky: isDark ? '#0d1117' : '#c8d2dc',
      ocean: isDark ? '#141c28' : '#8fa4b8',
      fog: isDark ? 'rgba(50,65,85,0.7)' : 'rgba(210,220,230,0.6)',
      neon: isDark ? '#00ffd0' : '#00c9a7',
      neon2: isDark ? '#ff6b8a' : '#ff4d6a',
      slice: isDark ? '#00ffd0' : '#00b894',
      offbeat: isDark ? '#ff6b8a' : '#e8436a',
      hitLine: isDark ? 'rgba(0,255,208,0.6)' : 'rgba(0,180,150,0.5)',
      coast: isDark ? '#1a2535' : '#5a7088'
    };
  }

  function drawBackground(p, t) {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, p.sky);
    grad.addColorStop(0.45, p.ocean);
    grad.addColorStop(1, isDark ? '#0a0e14' : '#6a8498');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = p.coast;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.38);
    for (var x = 0; x <= W; x += 8) {
      var cy = H * 0.38 + Math.sin(x * 0.008 + t * 0.0003) * 12;
      ctx.lineTo(x, cy);
    }
    ctx.lineTo(W, H * 0.5);
    ctx.lineTo(0, H * 0.5);
    ctx.closePath();
    ctx.fill();

    for (var w = 0; w < waves.length; w++) {
      var wv = waves[w];
      ctx.strokeStyle = isDark ? 'rgba(0,255,208,0.08)' : 'rgba(0,150,130,0.12)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (var wx = 0; wx <= W; wx += 6) {
        var wy = wv.y + Math.sin(wx * 0.02 + wv.phase + t * 0.002) * wv.amp;
        if (wx === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
      }
      ctx.stroke();
    }

    for (var f = 0; f < fogBands.length; f++) {
      var fb = fogBands[f];
      fb.x += fb.spd * 0.016;
      if (fb.x > W + fb.w) fb.x = -fb.w;
      var fg = ctx.createLinearGradient(fb.x, fb.y, fb.x + fb.w, fb.y);
      fg.addColorStop(0, 'transparent');
      fg.addColorStop(0.5, p.fog);
      fg.addColorStop(1, 'transparent');
      ctx.fillStyle = fg;
      ctx.fillRect(fb.x, fb.y, fb.w, fb.h);
    }
  }

  function drawLanes(p) {
    var top = H * 0.12;
    var bot = H * 0.88;
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 1;
    for (var l = 0; l <= LANES; l++) {
      var lx = (W - laneW * LANES) / 2 + laneW * l;
      ctx.beginPath();
      ctx.moveTo(lx, top);
      ctx.lineTo(lx, bot);
      ctx.stroke();
    }

    if (beatPulse > 0) {
      ctx.strokeStyle = p.neon;
      ctx.globalAlpha = beatPulse * 0.5;
      ctx.lineWidth = 4 + beatPulse * 4;
      ctx.beginPath();
      ctx.moveTo(W * 0.08, hitY);
      ctx.lineTo(W * 0.92, hitY);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.shadowColor = p.neon;
    ctx.shadowBlur = 12;
    ctx.strokeStyle = p.hitLine;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W * 0.08, hitY);
    ctx.lineTo(W * 0.92, hitY);
    ctx.stroke();
    ctx.restore();

    if (hitFlash > 0) {
      ctx.fillStyle = 'rgba(0,255,208,' + hitFlash * 0.3 + ')';
      ctx.fillRect(W * 0.08, hitY - 20, W * 0.84, 40);
    }
  }

  function drawMarkers(p, t) {
    for (var i = 0; i < markers.length; i++) {
      var m = markers[i];
      if (m.hit) continue;
      var lx = laneXs[m.lane];
      var hw = laneW * 0.38;
      var col = m.offbeat ? p.offbeat : p.slice;
      var pulse = 0.7 + 0.3 * Math.sin(t * 0.012 + m.id);

      ctx.save();
      ctx.shadowColor = col;
      ctx.shadowBlur = m.offbeat ? 18 : 10;
      var grd = ctx.createLinearGradient(lx - hw, m.y, lx + hw, m.y + m.h);
      grd.addColorStop(0, 'transparent');
      grd.addColorStop(0.3, col);
      grd.addColorStop(0.7, col);
      grd.addColorStop(1, 'transparent');
      ctx.globalAlpha = m.missed ? 0.2 : pulse;
      ctx.fillStyle = grd;
      ctx.fillRect(lx - hw, m.y, hw * 2, m.h);

      ctx.fillStyle = col;
      ctx.globalAlpha = m.missed ? 0.15 : 0.9;
      ctx.fillRect(lx - hw * 0.15, m.y, hw * 0.3, m.h);
      ctx.restore();
    }
  }

  function drawFloatTexts(dt) {
    ctx.textAlign = 'center';
    ctx.font = '600 11px ui-monospace, Menlo, monospace';
    for (var i = floatTexts.length - 1; i >= 0; i--) {
      var ft = floatTexts[i];
      ft.life -= dt;
      if (ft.life <= 0) { floatTexts.splice(i, 1); continue; }
      ft.y += ft.vy;
      ctx.globalAlpha = Math.min(1, ft.life * 1.4);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.life -= dt;
      if (pt.life <= 0) { particles.splice(i, 1); continue; }
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.15;
      var a = pt.life / pt.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawGlitch(p) {
    if (glitchAmt <= 0.01 && missFlash <= 0) return;
    var g = Math.max(glitchAmt, missFlash);
    if (missFlash > 0) {
      ctx.fillStyle = 'rgba(255,75,106,' + missFlash * 0.25 + ')';
      ctx.fillRect(0, 0, W, H);
    }
    var slices = Math.floor(g * 6);
    for (var s = 0; s < slices; s++) {
      var sy = Math.random() * H;
      var sh = 3 + Math.random() * 14;
      var off = (Math.random() - 0.5) * g * 24;
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,255,208,0.15)' : 'rgba(255,75,106,0.12)';
      ctx.fillRect(off, sy, W, sh);
    }
  }

  function drawFrame(now) {
    if (!ctx) return;
    var dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016);
    lastFrame = now;

    if (hitFlash > 0) hitFlash -= dt;
    if (missFlash > 0) missFlash -= dt;
    if (shakeT > 0) shakeT -= dt;
    if (beatPulse > 0) beatPulse = Math.max(0, beatPulse - dt * 3);
    glitchAmt = Math.max(0, glitchAmt - dt * 0.08);

    if (state === STATE.PLAY) {
      var elapsed = (now - roundStart) / 1000;
      timeLeft = Math.max(0, ROUND_SEC - elapsed);
      var mult = getBpmMult(elapsed);
      bpmLabel = Math.round(bpm * mult) + (mult > 1 ? '×' + mult : '') + ' BPM';
      if (timeLeft <= 0) endGame();
      else {
        spawnMarker(now, elapsed);
        for (var i = markers.length - 1; i >= 0; i--) {
          var m = markers[i];
          if (!m.hit) m.y += m.speed * dt;
          if (m.hit || m.y > H + 50) markers.splice(i, 1);
        }
        checkMissedMarkers();
        updateHud();
      }
    }

    var p = palette();
    var shakeX = shakeT > 0 ? (Math.random() - 0.5) * shakeT * 40 : 0;
    var shakeY = shakeT > 0 ? (Math.random() - 0.5) * shakeT * 20 : 0;

    ctx.save();
    ctx.translate(shakeX, shakeY);
    drawBackground(p, now);
    drawLanes(p);
    drawMarkers(p, now);
    drawParticles(dt);
    drawFloatTexts(dt);
    ctx.restore();

    if (state === STATE.PLAY || state === STATE.OVER) drawGlitch(p);

    if (state === STATE.TITLE) {
      drawBackground(p, now);
      drawLanes(p);
    }

    animId = requestAnimationFrame(drawFrame);
  }

  function pointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX - rect.left;
      cy = e.touches[0].clientY - rect.top;
    } else if (e.changedTouches && e.changedTouches.length) {
      cx = e.changedTouches[0].clientX - rect.left;
      cy = e.changedTouches[0].clientY - rect.top;
    } else {
      cx = e.clientX - rect.left;
      cy = e.clientY - rect.top;
    }
    var sx = W / rect.width;
    var sy = H / rect.height;
    return { x: cx * sx, y: cy * sy };
  }

  function onPointer(e) {
    if (state !== STATE.PLAY) return;
    try { e.preventDefault(); } catch (err) {}
    var pos = pointerPos(e);
    tryHit(pos.x, pos.y);
  }

  function onKey(e) {
    if (state === STATE.PLAY && (e.code === 'Space' || e.code === 'Enter')) {
      try { e.preventDefault(); } catch (err) {}
      tryHit(W / 2, hitY);
    }
  }

  if (startBtn) startBtn.addEventListener('click', function (e) {
    try { e.stopPropagation(); } catch (err) {}
    startGame();
  });
  if (restartBtn) restartBtn.addEventListener('click', function (e) {
    try { e.stopPropagation(); } catch (err) {}
    startGame();
  });

  if (canvas) {
    canvas.addEventListener('touchstart', onPointer, { passive: false });
    canvas.addEventListener('mousedown', onPointer);
  }
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);

  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        isDark = prefersDark();
      });
    } catch (e) {}
  }

  resize();
  animId = requestAnimationFrame(drawFrame);

  document.body.style.minHeight = '100dvh';
})();
</script>
</body>
</html>
