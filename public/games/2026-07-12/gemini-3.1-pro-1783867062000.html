<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odin's Stack</title>
<style>
  :root {
    --bg: #0a0a0c;
    --text: #e0e0e0;
    --primary: #ffb000;
    --primary-dim: rgba(255, 176, 0, 0.2);
    --overlay: rgba(10, 10, 12, 0.85);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4f5;
      --text: #18181b;
      --primary: #d97706;
      --primary-dim: rgba(217, 119, 6, 0.2);
      --overlay: rgba(244, 244, 245, 0.85);
    }
  }

  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  
  #gameCanvas {
    display: block;
    width: 100%; height: 100%;
  }

  #uiLayer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 10;
  }

  .screen {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: var(--overlay);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .screen.hidden {
    opacity: 0;
  }

  h1 {
    font-size: 2.5rem;
    color: var(--primary);
    margin-bottom: 1rem;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 4px;
    pointer-events: none;
  }

  p {
    font-size: 1.1rem;
    color: var(--text);
    opacity: 0.8;
    text-align: center;
    max-width: 80%;
    line-height: 1.6;
    margin-bottom: 2.5rem;
    pointer-events: none;
  }

  button {
    pointer-events: auto;
    background: var(--bg);
    border: 2px solid var(--primary);
    color: var(--primary);
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: bold;
    padding: 1rem 2.5rem;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.2s;
    border-radius: 4px;
    box-shadow: 0 0 15px var(--primary-dim), inset 0 0 10px var(--primary-dim);
  }

  button:active {
    background: var(--primary);
    color: var(--bg);
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="uiLayer">
    <div id="startScreen" class="screen">
      <h1>Odin's Stack</h1>
      <p>Sort syntax runes into compiling spell blocks.<br>Don't let the compiler demon corrupt your stack.</p>
      <button data-smoke="start" id="startBtn">START COMPILE</button>
    </div>
    <div id="gameOverScreen" class="screen hidden">
      <h1>STACK CORRUPTED</h1>
      <p id="finalScore">Lines Compiled: 0</p>
      <button data-smoke="restart" id="restartBtn">REBOOT</button>
    </div>
  </div>
  <script>
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        r = r || 0;
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      }
    }

    const PUZZLES = [
      [{text: ""}, {type: "keyword", answer: "proc"}, {text: " main() {"}],
      [{text: "x "}, {type: "operator", answer: ":="}, {text: " 10"}],
      [{text: "fmt."}, {type: "identifier", answer: "println"}, {text: "(\"Hi\")"}],
      [{text: "import "}, {type: "literal", answer: "\"core:fmt\""}],
      [{text: "Vec2 :: "}, {type: "keyword", answer: "struct"}, {text: " { x: "}, {type: "type", answer: "f32"}, {text: " }"}],
      [{text: "for i in 0"}, {type: "operator", answer: "..="}, {text: "9 { "}, {type: "keyword", answer: "return"}, {text: " }"}],
      [{text: "if a "}, {type: "operator", answer: "=="}, {text: " b { "}, {type: "identifier", answer: "x"}, {text: " "}, {type: "operator", answer: ":="}, {text: " 1 }"}],
      [{text: "add :: "}, {type: "keyword", answer: "proc"}, {text: "(a: "}, {type: "type", answer: "int"}, {text: ") "}, {type: "operator", answer: "->"}, {text: " int"}],
      [{text: "state : "}, {type: "type", answer: "bool"}, {text: " "}, {type: "operator", answer: "="}, {text: " "}, {type: "literal", answer: "true"}]
    ];

    const DECOY_POOL = ["proc", "struct", "return", "import", "if", "for", ":=", "..=", "==", "+", "->", "=", "println", "main", "x", "y", "int", "string", "bool", "f32", "0", "\"core:fmt\"", "true", "false"];

    const COLORS = {
      dark: {
        bg: '#0a0a0c', text: '#e0e0e0', textDim: '#52525b',
        keyword: '#ffb000', operator: '#00e5ff', identifier: '#00e676', type: '#ff3d00', literal: '#a1a1aa',
        demon: '#ef4444', runeBg: '#18181b', runeBorder: '#3f3f46', socketBg: '#09090b', socketBorder: '#27272a'
      },
      light: {
        bg: '#f4f4f5', text: '#18181b', textDim: '#a1a1aa',
        keyword: '#d97706', operator: '#0891b2', identifier: '#16a34a', type: '#dc2626', literal: '#52525b',
        demon: '#dc2626', runeBg: '#ffffff', runeBorder: '#d4d4d8', socketBg: '#e4e4e7', socketBorder: '#a1a1aa'
      }
    };

    let canvas, ctx, width, height, dpr, isDarkMode = true;
    let state = 'START', score = 0, demonProgress = 0, demonSpeed = 0.0005, lastTime = 0, waveIndex = 0;
    let runes = [], sockets = [], staticTexts = [], particles = [];
    let draggedRune = null, dragOffsetX = 0, dragOffsetY = 0, pointerX = 0, pointerY = 0;
    let waveFontSize = 24, shakeAmount = 0, flashAlpha = 0;

    function init() {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d', { alpha: false });
      
      window.addEventListener('resize', resize);
      resize();

      const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      isDarkMode = darkModeMediaQuery.matches;
      darkModeMediaQuery.addEventListener('change', (e) => { isDarkMode = e.matches; });

      canvas.addEventListener('mousedown', (e) => onPointerDown({ x: e.clientX, y: e.clientY }));
      canvas.addEventListener('mousemove', (e) => onPointerMove({ x: e.clientX, y: e.clientY }));
      window.addEventListener('mouseup', (e) => onPointerUp({ x: e.clientX, y: e.clientY }));
      
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(e.changedTouches.length > 0) onPointerDown({ x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY });
      }, { passive: false });
      
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if(e.changedTouches.length > 0) onPointerMove({ x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY });
      }, { passive: false });
      
      window.addEventListener('touchend', (e) => {
        if (e.changedTouches.length > 0) onPointerUp({ x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY });
        else onPointerUp({ x: pointerX, y: pointerY });
      });

      document.getElementById('startBtn').addEventListener('click', startGame);
      document.getElementById('restartBtn').addEventListener('click', startGame);

      requestAnimationFrame(loop);
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      state = 'PLAYING';
      score = 0; demonProgress = 0; demonSpeed = 0.0005; waveIndex = 0; particles = [];
      startWave();
    }

    function gameOver() {
      state = 'GAMEOVER';
      document.getElementById('finalScore').innerText = `Lines Compiled: ${score}`;
      document.getElementById('gameOverScreen').classList.remove('hidden');
      navigator.vibrate?.([100, 50, 100, 50, 200]);
    }

    function startWave() {
      runes = []; sockets = []; staticTexts = [];
      
      let puzzlePool;
      if (waveIndex < 3) puzzlePool = PUZZLES.slice(0, 3);
      else if (waveIndex < 7) puzzlePool = PUZZLES.slice(3, 6);
      else puzzlePool = PUZZLES.slice(6);
      
      const puzzleDef = puzzlePool[Math.floor(Math.random() * puzzlePool.length)];
      
      waveFontSize = Math.min(24, width / 18);
      ctx.font = `bold ${waveFontSize}px ui-monospace, 'SFMono-Regular', Menlo, monospace`;
      
      let totalWidth = 0;
      const elements = [];
      for (const part of puzzleDef) {
        if (part.answer) {
          const w = ctx.measureText(part.answer).width + 30;
          elements.push({ isSocket: true, width: w, part });
          totalWidth += w;
        } else {
          const w = ctx.measureText(part.text).width;
          elements.push({ isSocket: false, width: w, text: part.text });
          totalWidth += w;
        }
      }
      
      if (totalWidth > width * 0.9) {
        waveFontSize *= (width * 0.9) / totalWidth;
        ctx.font = `bold ${waveFontSize}px ui-monospace, 'SFMono-Regular', Menlo, monospace`;
        totalWidth = 0;
        elements.length = 0;
        for (const part of puzzleDef) {
          if (part.answer) {
            const w = ctx.measureText(part.answer).width + 30;
            elements.push({ isSocket: true, width: w, part });
            totalWidth += w;
          } else {
            const w = ctx.measureText(part.text).width;
            elements.push({ isSocket: false, width: w, text: part.text });
            totalWidth += w;
          }
        }
      }
      
      let currentX = (width - totalWidth) / 2;
      const y = height * 0.25;
      
      for (const el of elements) {
        if (el.isSocket) {
          sockets.push({
            id: Math.random(), type: el.part.type, answer: el.part.answer,
            x: currentX, y: y - 24, width: el.width, height: 48, isFilled: false
          });
        } else {
          staticTexts.push({ text: el.text, x: currentX, y: y });
        }
        currentX += el.width;
      }
      
      const answers = sockets.map(s => ({ text: s.answer, type: s.type }));
      const numDecoys = Math.min(6, 2 + Math.floor(waveIndex / 2));
      const decoys = [];
      for (let i = 0; i < numDecoys; i++) {
        const decoyText = DECOY_POOL[Math.floor(Math.random() * DECOY_POOL.length)];
        let type = "literal";
        if (["proc", "struct", "return", "import", "if", "for"].includes(decoyText)) type = "keyword";
        else if ([":=", "..=", "==", "+", "->", "="].includes(decoyText)) type = "operator";
        else if (["println", "main", "x", "y"].includes(decoyText)) type = "identifier";
        else if (["int", "string", "bool", "f32"].includes(decoyText)) type = "type";
        decoys.push({ text: decoyText, type });
      }
      
      const allRunes = [...answers, ...decoys].sort(() => Math.random() - 0.5);
      
      for (const r of allRunes) {
        const w = ctx.measureText(r.text).width + 30;
        runes.push({
          id: Math.random(), text: r.text, type: r.type,
          width: w, height: 48,
          x: Math.random() * (width - w),
          y: height * 0.5 + Math.random() * (height * 0.3),
          isDragging: false, isLocked: false,
          vx: (Math.random() - 0.5) * 1, vy: (Math.random() - 0.5) * 1
        });
      }
    }

    function onPointerDown(pos) {
      if (state !== 'PLAYING') return;
      pointerX = pos.x; pointerY = pos.y;
      
      for (let i = runes.length - 1; i >= 0; i--) {
        const r = runes[i];
        if (!r.isLocked && pos.x >= r.x && pos.x <= r.x + r.width && pos.y >= r.y && pos.y <= r.y + r.height) {
          r.isDragging = true; draggedRune = r;
          dragOffsetX = pos.x - r.x; dragOffsetY = pos.y - r.y;
          runes.splice(i, 1); runes.push(r);
          navigator.vibrate?.(10);
          break;
        }
      }
    }

    function onPointerMove(pos) {
      if (state !== 'PLAYING') return;
      pointerX = pos.x; pointerY = pos.y;
      if (draggedRune) {
        draggedRune.x = pos.x - dragOffsetX;
        draggedRune.y = pos.y - dragOffsetY;
      }
    }

    function onPointerUp(pos) {
      if (state !== 'PLAYING' || !draggedRune) return;
      const r = draggedRune;
      r.isDragging = false; draggedRune = null;
      
      const cx = r.x + r.width / 2;
      const cy = r.y + r.height / 2;
      
      let droppedOnSocket = null;
      for (const s of sockets) {
        if (!s.isFilled && cx >= s.x && cx <= s.x + s.width && cy >= s.y && cy <= s.y + s.height) {
          droppedOnSocket = s; break;
        }
      }
      
      if (droppedOnSocket) {
        if (droppedOnSocket.answer === r.text) {
          r.isLocked = true;
          r.x = droppedOnSocket.x + (droppedOnSocket.width - r.width) / 2;
          r.y = droppedOnSocket.y + (droppedOnSocket.height - r.height) / 2;
          droppedOnSocket.isFilled = true;
          
          spawnParticles(cx, cy, getColor(r.type));
          navigator.vibrate?.([15, 30, 15]);
          
          if (sockets.every(s => s.isFilled)) {
            score++;
            demonProgress = Math.max(0, demonProgress - 0.15);
            demonSpeed += 0.00005;
            flashAlpha = 0.8;
            setTimeout(() => { waveIndex++; startWave(); }, 600);
          }
        } else {
          demonProgress += 0.1;
          shakeAmount = 15;
          spawnParticles(cx, cy, isDarkMode ? COLORS.dark.demon : COLORS.light.demon);
          navigator.vibrate?.([50, 50, 50]);
          r.vx = (Math.random() - 0.5) * 20;
          r.vy = -10 - Math.random() * 10;
        }
      } else {
        r.vx = (Math.random() - 0.5) * 4;
        r.vy = (Math.random() - 0.5) * 4;
      }
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 20; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
          life: 1, size: Math.random() * 4 + 2, color
        });
      }
    }

    function getColor(type, dim = false) {
      const c = isDarkMode ? COLORS.dark : COLORS.light;
      let color = c.text;
      switch (type) {
        case 'keyword': color = c.keyword; break;
        case 'operator': color = c.operator; break;
        case 'identifier': color = c.identifier; break;
        case 'type': color = c.type; break;
        case 'literal': color = c.literal; break;
      }
      return dim ? color + '80' : color;
    }

    function loop(timestamp) {
      const dt = timestamp - lastTime;
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function update(dt) {
      if (state === 'PLAYING') {
        demonProgress += demonSpeed;
        if (demonProgress >= 1) gameOver();
        
        for (const r of runes) {
          if (!r.isDragging && !r.isLocked) {
            r.x += r.vx; r.y += r.vy;
            r.vx += (Math.random() - 0.5) * 0.2;
            r.vy += (Math.random() - 0.5) * 0.2;
            r.vx *= 0.95; r.vy *= 0.95;
            
            const padding = 10;
            if (r.x < padding) { r.x = padding; r.vx += 1; }
            if (r.x + r.width > width - padding) { r.x = width - r.width - padding; r.vx -= 1; }
            if (r.y < height * 0.45) { r.y = height * 0.45; r.vy += 1; }
            if (r.y + r.height > height - padding) { r.y = height - r.height - padding; r.vy -= 1; }
          }
        }
        
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.life -= 0.03;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }
    }

    function draw() {
      const c = isDarkMode ? COLORS.dark : COLORS.light;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      
      ctx.fillStyle = c.bg;
      ctx.fillRect(0, 0, width, height);
      
      if (state === 'START') return;
      
      ctx.save();
      if (shakeAmount > 0) {
        ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
        shakeAmount *= 0.9;
        if (shakeAmount < 0.5) shakeAmount = 0;
      }
      
      ctx.strokeStyle = isDarkMode ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke(); }
      for (let y = 0; y < height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); }
      
      const barHeight = 8;
      ctx.fillStyle = c.socketBorder; ctx.fillRect(0, 0, width, barHeight);
      ctx.fillStyle = c.demon;
      const filledWidth = width * demonProgress;
      ctx.fillRect(0, 0, filledWidth, barHeight);
      
      if (demonProgress > 0.5) {
        for (let i = 0; i < 5; i++) {
          if (Math.random() > 0.8) {
            ctx.fillRect(Math.random() * filledWidth, barHeight + Math.random() * 10, Math.random() * 10 + 5, Math.random() * 10 + 5);
          }
        }
      }
      
      if (demonProgress > 0.7) {
        const pulse = Math.sin(Date.now() / 100) * 0.05 * (demonProgress - 0.7) / 0.3;
        ctx.fillStyle = `rgba(239, 68, 68, ${pulse})`;
        ctx.fillRect(0, 0, width, height);
      }
      
      ctx.font = `bold ${waveFontSize}px ui-monospace, 'SFMono-Regular', Menlo, monospace`;
      ctx.textBaseline = 'middle';
      
      for (const s of sockets) {
        ctx.fillStyle = c.socketBg;
        if (!s.isFilled) {
          ctx.setLineDash([5, 5]); ctx.strokeStyle = getColor(s.type, true);
        } else {
          ctx.setLineDash([]); ctx.strokeStyle = c.socketBorder;
        }
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(s.x, s.y, s.width, s.height, 6);
        ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
        
        if (!s.isFilled) {
          ctx.fillStyle = getColor(s.type, true);
          ctx.textAlign = 'center';
          ctx.font = `${Math.min(12, width/35)}px ui-monospace, 'SFMono-Regular', Menlo, monospace`;
          ctx.fillText(s.type, s.x + s.width / 2, s.y + s.height / 2);
          ctx.font = `bold ${waveFontSize}px ui-monospace, 'SFMono-Regular', Menlo, monospace`;
          ctx.textAlign = 'left';
        }
      }
      
      ctx.fillStyle = c.text;
      ctx.shadowColor = isDarkMode ? 'rgba(255, 255, 255, 0.2)' : 'transparent';
      ctx.shadowBlur = 5;
      for (const st of staticTexts) {
        ctx.fillText(st.text, st.x, st.y);
      }
      ctx.shadowBlur = 0;
      
      for (const r of runes) {
        ctx.fillStyle = c.runeBg;
        ctx.strokeStyle = r.isDragging ? getColor(r.type) : c.runeBorder;
        ctx.lineWidth = 2;
        
        if (r.isDragging) {
          ctx.shadowColor = getColor(r.type); ctx.shadowBlur = 15;
        }
        
        ctx.beginPath(); ctx.roundRect(r.x, r.y, r.width, r.height, 6);
        ctx.fill(); ctx.stroke();
        
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        ctx.fillStyle = getColor(r.type);
        ctx.textAlign = 'center';
        ctx.fillText(r.text, r.x + r.width / 2, r.y + r.height / 2);
        ctx.textAlign = 'left';
      }
      
      for (const p of particles) {
        ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      
      if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
        ctx.fillRect(0, 0, width, height);
        flashAlpha -= 0.05;
      }
      
      ctx.restore();
      
      ctx.fillStyle = c.textDim;
      ctx.font = `${Math.min(14, width/30)}px ui-monospace, 'SFMono-Regular', Menlo, monospace`;
      ctx.textAlign = 'right';
      ctx.fillText(`Compiled: ${score}`, width - 15, 30);
      ctx.textAlign = 'left';
    }

    init();
  </script>
</body>
</html>
