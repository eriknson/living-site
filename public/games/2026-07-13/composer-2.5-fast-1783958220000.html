<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Drop</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  :root {
    --bg: #d4dce4;
    --fg: #1c2228;
    --muted: #5c6b78;
    --amber: #e8a020;
    --neon: #00c9a7;
    --neon2: #ff5c6a;
    --panel: rgba(255,255,255,0.9);
    --fog: rgba(180,195,210,0.55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1016;
      --fg: #e8edf2;
      --muted: #8a9aaa;
      --amber: #ffb830;
      --neon: #00ffd0;
      --neon2: #ff7080;
      --panel: rgba(12,16,22,0.94);
      --fog: rgba(35,45,58,0.7);
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    min-height: 100dvh;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1.5rem;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.45s ease, visibility 0.45s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
    border-radius: 14px;
    padding: 1.75rem 1.5rem;
    max-width: 22rem;
    width: 90%;
    text-align: center;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    pointer-events: none;
  }
  h1 {
    font-size: clamp(1.35rem, 5vw, 1.85rem);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.45rem;
  }
  .tagline {
    font-size: 0.76rem;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 1.1rem;
  }
  .neon-line {
    height: 2px;
    width: 65%;
    margin: 0 auto 1.1rem;
    background: linear-gradient(90deg, transparent, var(--amber), var(--neon), transparent);
    border-radius: 2px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 168px;
    padding: 0.85rem 2rem;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: var(--neon);
    color: #0a1218;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
    box-shadow: 0 0 22px color-mix(in srgb, var(--neon) 45%, transparent);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: max(0.7rem, env(safe-area-inset-top)) 1rem 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #hud.visible { opacity: 1; }
  .hud-block { display: flex; flex-direction: column; gap: 0.12rem; }
  .hud-label { color: var(--muted); font-size: 0.6rem; text-transform: uppercase; }
  .hud-val { font-size: 0.98rem; font-weight: 600; }
  .lives { display: flex; gap: 5px; margin-top: 2px; }
  .life {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--neon);
    box-shadow: 0 0 6px var(--neon);
    transition: opacity 0.25s, transform 0.25s;
  }
  .life.dead { opacity: 0.2; transform: scale(0.7); box-shadow: none; background: var(--muted); }
  .final-score { font-size: 2rem; font-weight: 700; color: var(--neon); margin: 0.45rem 0; }
  .stats-row {
    display: flex; justify-content: center; gap: 1.25rem;
    font-size: 0.7rem; color: var(--muted); margin-bottom: 0.9rem;
  }
  .win-title { color: var(--amber); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span class="hud-val" id="score-val">0</span>
      <div class="lives" id="lives"></div>
    </div>
    <div class="hud-block" style="align-items:center;text-align:center">
      <span class="hud-label" id="bpm-label">124 BPM</span>
      <span class="hud-val" id="combo-val">×0</span>
    </div>
    <div class="hud-block" style="align-items:flex-end;text-align:right">
      <span class="hud-label">Drop</span>
      <span class="hud-val" id="time-val">45</span>
    </div>
  </div>
  <div id="title-overlay" class="overlay">
    <div class="panel">
      <h1>Fog Drop</h1>
      <div class="neon-line"></div>
      <p class="tagline">Ride the stutter-house waveform through summer fog.<br>Tap peaks · hold valleys · dodge ghosts.<br>Three glitches and the mix cuts out.</p>
      <button type="button" data-smoke="start">Enter the Drop</button>
    </div>
  </div>
  <div id="over-overlay" class="overlay hidden">
    <div class="panel">
      <h1 id="over-title">Mix Cut</h1>
      <div class="neon-line"></div>
      <div class="final-score" id="final-score">0</div>
      <div class="stats-row">
        <span id="stat-perfect">0 perfect</span>
        <span id="stat-max">max ×0</span>
      </div>
      <button type="button" data-smoke="restart">Ride Again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  var ROUND_SEC = 45;
  var MAX_MISS = 3;
  var HIT_EARLY = 0.11;
  var HIT_LATE = 0.09;
  var SCROLL_PX = 280;

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var hud = document.getElementById('hud');
  var scoreEl = document.getElementById('score-val');
  var comboEl = document.getElementById('combo-val');
  var bpmEl = document.getElementById('bpm-label');
  var timeEl = document.getElementById('time-val');
  var livesEl = document.getElementById('lives');
  var titleOverlay = document.getElementById('title-overlay');
  var overOverlay = document.getElementById('over-overlay');
  var overTitle = document.getElementById('over-title');
  var finalScoreEl = document.getElementById('final-score');
  var statPerfect = document.getElementById('stat-perfect');
  var statMax = document.getElementById('stat-max');
  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');

  var W = 360, H = 640, dpr = 1;
  var state = STATE.TITLE;
  var beatmap = [];
  var particles = [];
  var fogBands = [];
  var floatTexts = [];
  var score = 0, combo = 0, maxCombo = 0, perfects = 0;
  var misses = 0, timeLeft = ROUND_SEC, roundStart = 0;
  var hitLineX = 0, waveY = 0, ampBase = 28;
  var holding = false, activeHold = null;
  var shakeT = 0, hitFlash = 0, missFlash = 0, glitchAmt = 0;
  var beatPulse = 0, riderY = 0, riderVY = 0;
  var audioCtx = null, masterGain = null, nextBeatSound = 0;
  var lastFrame = 0, isDark = false;
  var won = false;

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  }

  function bpmAt(t) {
    var p = Math.min(1, Math.max(0, t / ROUND_SEC));
    return 124 + 44 * Math.pow(p, 1.15);
  }

  function ampAt(t) {
    return ampBase * (1 + 0.65 * Math.min(1, t / ROUND_SEC));
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.32;
      masterGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }

  function tone(freq, dur, type, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t0 = audioCtx.currentTime;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + dur);
    } catch (e) {}
  }

  function kick() {
    if (!audioCtx || !masterGain) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t0 = audioCtx.currentTime;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.frequency.setValueAtTime(160, t0);
      o.frequency.exponentialRampToValueAtTime(42, t0 + 0.07);
      g.gain.setValueAtTime(0.45, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + 0.14);
    } catch (e) {}
  }

  function stutterBass(t) {
    if (!audioCtx || !masterGain) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t0 = audioCtx.currentTime;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(55 + Math.sin(t * 0.5) * 8, t0);
      g.gain.setValueAtTime(0.08, t0);
      g.gain.setValueAtTime(0.001, t0 + 0.06);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + 0.07);
    } catch (e) {}
  }

  function playHit(q) {
    kick();
    tone(220 + combo * 6, 0.07, 'triangle', q === 'perfect' ? 0.14 : 0.09);
  }

  function playMiss() {
    tone(70, 0.25, 'sawtooth', 0.12);
    tone(45, 0.35, 'square', 0.06);
  }

  function playWin() {
    tone(330, 0.15, 'triangle', 0.12);
    tone(440, 0.2, 'triangle', 0.1);
    tone(550, 0.25, 'sine', 0.08);
  }

  function buildBeatmap() {
    var notes = [];
    var t = 1.2;
    var pat = ['tap','tap','hold','tap','tap','tap','hold','tap'];
    var ghostStart = 14;
    while (t < ROUND_SEC - 0.5) {
      var bpm = bpmAt(t);
      var beat = 60 / bpm;
      var kind = pat[notes.length % pat.length];
      if (t > ghostStart && Math.random() < 0.22 + (t / ROUND_SEC) * 0.18) {
        notes.push({ time: t + beat * 0.48, type: 'ghost', dur: 0, hit: false, missed: false, resolved: false });
      }
      if (kind === 'hold') {
        notes.push({ time: t, type: 'hold', dur: beat * 1.6, hit: false, missed: false, resolved: false, holding: false });
        t += beat * 2.2;
      } else {
        notes.push({ time: t, type: 'tap', dur: 0, hit: false, missed: false, resolved: false });
        t += beat * (0.9 + (notes.length % 3) * 0.15);
      }
    }
    notes.sort(function (a, b) { return a.time - b.time; });
    return notes;
  }

  function initFog() {
    fogBands = [];
    for (var i = 0; i < 7; i++) {
      fogBands.push({
        y: Math.random() * H * 0.55,
        x: Math.random() * W,
        w: W * (0.35 + Math.random() * 0.55),
        h: 24 + Math.random() * 48,
        spd: 6 + Math.random() * 18,
        a: 0.12 + Math.random() * 0.18
      });
    }
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    hitLineX = W * 0.32;
    waveY = H * 0.52;
    initFog();
  }

  function renderLives() {
    if (!livesEl) return;
    livesEl.innerHTML = '';
    for (var i = 0; i < MAX_MISS; i++) {
      var d = document.createElement('span');
      d.className = 'life' + (i >= MAX_MISS - misses ? '' : ' dead');
      livesEl.appendChild(d);
    }
  }

  function resetGame() {
    beatmap = buildBeatmap();
    particles = [];
    floatTexts = [];
    score = 0; combo = 0; maxCombo = 0; perfects = 0;
    misses = 0; timeLeft = ROUND_SEC; holding = false; activeHold = null;
    shakeT = 0; hitFlash = 0; missFlash = 0; glitchAmt = 0; beatPulse = 0;
    riderY = waveY; riderVY = 0; won = false; nextBeatSound = 0;
    roundStart = performance.now();
    renderLives();
    updateHud();
  }

  function startGame() {
    initAudio();
    resetGame();
    state = STATE.PLAY;
    titleOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    hud.classList.add('visible');
    if (navigator.vibrate) try { navigator.vibrate(28); } catch (e) {}
  }

  function endGame(victory) {
    state = STATE.OVER;
    won = !!victory;
    hud.classList.remove('visible');
    overOverlay.classList.remove('hidden');
    overTitle.textContent = victory ? 'Perfect Loop' : 'Mix Cut';
    overTitle.className = victory ? 'win-title' : '';
    finalScoreEl.textContent = String(score);
    statPerfect.textContent = perfects + ' perfect';
    statMax.textContent = 'max ×' + maxCombo;
    if (victory) playWin();
    if (navigator.vibrate) try { navigator.vibrate(victory ? [20, 40, 20] : [50, 30, 50]); } catch (e) {}
  }

  function updateHud() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) comboEl.textContent = '×' + combo;
    if (timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
    if (bpmEl && state === STATE.PLAY) {
      var el = (performance.now() - roundStart) / 1000;
      bpmEl.textContent = Math.round(bpmAt(el)) + ' BPM';
    }
  }

  function addFloat(text, x, y, col) {
    floatTexts.push({ text: text, x: x, y: y, col: col, life: 0.75, vy: -1.4 });
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 2 + Math.random() * 5;
      particles.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
        life: 0.35 + Math.random() * 0.35, max: 0.7,
        col: col, sz: 2 + Math.random() * 3
      });
    }
  }

  function registerMiss(reason) {
    if (state !== STATE.PLAY) return;
    misses++;
    combo = 0;
    glitchAmt = Math.min(1, glitchAmt + 0.35);
    missFlash = 0.35;
    shakeT = 0.18;
    addFloat(reason === 'ghost' ? 'PHANTOM' : 'GLITCH', hitLineX, waveY - 50, pal().neon2);
    playMiss();
    renderLives();
    if (navigator.vibrate) try { navigator.vibrate(55); } catch (e) {}
    updateHud();
    if (misses >= MAX_MISS) endGame(false);
  }

  function registerHit(note, quality) {
    note.hit = true;
    note.resolved = true;
    var pts = quality === 'perfect' ? 120 : 65;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    var mult = 1 + Math.floor(combo / 4) * 0.3;
    score += Math.round(pts * mult);
    if (quality === 'perfect') perfects++;
    hitFlash = 0.28;
    shakeT = 0.07;
    beatPulse = 1;
    var c = quality === 'perfect' ? pal().neon : pal().amber;
    burst(hitLineX, waveY - notePeak(note), c, quality === 'perfect' ? 16 : 9);
    addFloat(quality === 'perfect' ? 'DROP!' : 'NICE', hitLineX, waveY - 60, c);
    playHit(quality);
    if (navigator.vibrate) try { navigator.vibrate(quality === 'perfect' ? 14 : 7); } catch (e) {}
    updateHud();
  }

  function notePeak(note) {
    if (note.type === 'ghost') return ampAt(note.time) * 0.55;
    if (note.type === 'hold') return ampAt(note.time) * 0.35;
    return ampAt(note.time);
  }

  function gameTime(now) {
    return (now - roundStart) / 1000;
  }

  function noteX(note, gt) {
    return hitLineX + (note.time - gt) * SCROLL_PX;
  }

  function waveHeight(x, gt) {
    var amp = ampAt(gt);
    var w1 = Math.sin(x * 0.018 + gt * 3.2) * amp;
    var w2 = Math.sin(x * 0.041 - gt * 5.1) * amp * 0.35;
    var stutter = Math.sin(gt * 12.5) > 0.2 ? 1 : 0.55;
    return waveY + (w1 + w2) * stutter;
  }

  function findNoteInWindow(gt, typeFilter) {
    var best = null, bestD = Infinity;
    for (var i = 0; i < beatmap.length; i++) {
      var n = beatmap[i];
      if (n.resolved || n.hit || n.missed) continue;
      if (typeFilter && n.type !== typeFilter) continue;
      var d = gt - n.time;
      if (d >= -HIT_EARLY && d <= HIT_LATE) {
        var ad = Math.abs(d);
        if (ad < bestD) { bestD = ad; best = n; }
      }
    }
    return best;
  }

  function onPress() {
    if (state !== STATE.PLAY) return;
    holding = true;
    var gt = gameTime(performance.now());

    var ghost = findNoteInWindow(gt, 'ghost');
    if (ghost) {
      ghost.resolved = true;
      ghost.missed = true;
      registerMiss('ghost');
      return;
    }

    var hold = findNoteInWindow(gt, 'hold');
    if (hold && !hold.holding) {
      hold.holding = true;
      activeHold = hold;
      var d = Math.abs(gt - hold.time);
      registerHit(hold, d < 0.045 ? 'perfect' : 'good');
      return;
    }

    var tap = findNoteInWindow(gt, 'tap');
    if (tap) {
      var td = Math.abs(gt - tap.time);
      registerHit(tap, td < 0.045 ? 'perfect' : 'good');
      return;
    }

    var near = false;
    for (var j = 0; j < beatmap.length; j++) {
      var m = beatmap[j];
      if (!m.resolved && m.type !== 'ghost' && Math.abs(gt - m.time) < 0.22) near = true;
    }
    if (near) registerMiss('early');
  }

  function onRelease() {
    holding = false;
    if (state !== STATE.PLAY || !activeHold) return;
    var gt = gameTime(performance.now());
    var end = activeHold.time + activeHold.dur;
    if (gt < end - 0.06) {
      activeHold.resolved = true;
      activeHold.missed = true;
      registerMiss('early release');
    }
    activeHold = null;
  }

  function updateNotes(now, gt) {
    for (var i = 0; i < beatmap.length; i++) {
      var n = beatmap[i];
      if (n.resolved) continue;

      if (n.type === 'hold' && n.holding) {
        if (gt > n.time + n.dur + HIT_LATE) {
          n.resolved = true;
          if (!holding && gt > n.time + n.dur * 0.7) {
            registerMiss('hold break');
          }
        }
        continue;
      }

      if (gt - n.time > HIT_LATE) {
        if (n.type === 'ghost') {
          n.resolved = true;
        } else if (!n.hit) {
          n.missed = true;
          n.resolved = true;
          registerMiss('missed');
        }
      }
    }

    if (Math.floor(gt * 2) > nextBeatSound) {
      nextBeatSound = Math.floor(gt * 2);
      if (Math.floor(gt * 4) % 2 === 0) kick();
      else stutterBass(gt);
    }
  }

  function pal() {
    isDark = prefersDark();
    return {
      sky: isDark ? '#0c1016' : '#c5ced8',
      mid: isDark ? '#141c26' : '#9aabb8',
      deep: isDark ? '#080c12' : '#6e8494',
      fog: isDark ? 'rgba(40,52,68,0.75)' : 'rgba(190,205,218,0.6)',
      amber: isDark ? '#ffb830' : '#e8a020',
      neon: isDark ? '#00ffd0' : '#00c9a7',
      neon2: isDark ? '#ff7080' : '#ff5c6a',
      ghost: isDark ? 'rgba(255,120,130,0.45)' : 'rgba(200,80,90,0.4)',
      hold: isDark ? 'rgba(255,184,48,0.85)' : 'rgba(232,160,32,0.85)'
    };
  }

  function drawBg(p, gt) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, p.sky);
    g.addColorStop(0.35, p.mid);
    g.addColorStop(0.7, isDark ? '#101820' : '#7a92a4');
    g.addColorStop(1, p.deep);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var ag = ctx.createRadialGradient(W * 0.5, H * 0.15, 0, W * 0.5, H * 0.2, W * 0.9);
    ag.addColorStop(0, isDark ? 'rgba(255,184,48,0.08)' : 'rgba(232,160,32,0.12)');
    ag.addColorStop(1, 'transparent');
    ctx.fillStyle = ag;
    ctx.fillRect(0, 0, W, H);

    for (var f = 0; f < fogBands.length; f++) {
      var fb = fogBands[f];
      fb.x += fb.spd * 0.014;
      if (fb.x > W + fb.w) fb.x = -fb.w;
      var fg = ctx.createLinearGradient(fb.x, fb.y, fb.x + fb.w, fb.y);
      fg.addColorStop(0, 'transparent');
      fg.addColorStop(0.5, p.fog);
      fg.addColorStop(1, 'transparent');
      ctx.globalAlpha = fb.a;
      ctx.fillStyle = fg;
      ctx.fillRect(fb.x, fb.y, fb.w, fb.h);
    }
    ctx.globalAlpha = 1;
  }

  function drawWaveform(p, gt) {
    var amp = ampAt(gt);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = isDark ? 'rgba(0,255,208,0.12)' : 'rgba(0,180,150,0.15)';
    ctx.beginPath();
    for (var x = 0; x <= W; x += 4) {
      var y = waveHeight(x, gt);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.save();
    ctx.shadowColor = p.neon;
    ctx.shadowBlur = 16 + beatPulse * 12;
    ctx.strokeStyle = p.neon;
    ctx.lineWidth = 2 + beatPulse * 2;
    ctx.beginPath();
    for (var x2 = 0; x2 <= W; x2 += 3) {
      var y2 = waveHeight(x2, gt);
      if (x2 === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
    }
    ctx.stroke();
    ctx.restore();
    if (beatPulse > 0) beatPulse = Math.max(0, beatPulse - 0.04);
  }

  function drawNotes(p, gt) {
    for (var i = 0; i < beatmap.length; i++) {
      var n = beatmap[i];
      var nx = noteX(n, gt);
      if (nx < -40 || nx > W + 40) continue;
      if (n.resolved && !n.holding) continue;

      var peak = notePeak(n);
      var wy = waveHeight(nx, gt) - peak;
      var pulse = 0.75 + 0.25 * Math.sin(gt * 8 + i);

      if (n.type === 'ghost') {
        ctx.save();
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = p.ghost;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(nx, waveHeight(nx, gt));
        ctx.lineTo(nx, wy);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = p.ghost;
        ctx.beginPath();
        ctx.arc(nx, wy, 7 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        continue;
      }

      if (n.type === 'hold') {
        var endX = noteX({ time: n.time + n.dur }, gt);
        var hw = Math.max(8, (endX - nx) * 0.5);
        ctx.save();
        ctx.shadowColor = p.amber;
        ctx.shadowBlur = n.holding ? 20 : 10;
        ctx.fillStyle = n.holding ? p.hold : (isDark ? 'rgba(255,184,48,0.35)' : 'rgba(232,160,32,0.35)');
        ctx.fillRect(nx - 4, wy - 6, Math.max(12, endX - nx + 8), 12);
        ctx.strokeStyle = p.amber;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(nx, waveHeight(nx, gt));
        ctx.lineTo(nx, wy);
        ctx.stroke();
        ctx.restore();
        continue;
      }

      var col = n.hit ? p.neon : p.amber;
      ctx.save();
      ctx.shadowColor = col;
      ctx.shadowBlur = 14;
      ctx.strokeStyle = col;
      ctx.globalAlpha = n.missed ? 0.25 : pulse;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(nx, waveHeight(nx, gt));
      ctx.lineTo(nx, wy);
      ctx.stroke();
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(nx, wy, 9 + beatPulse * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawHitLine(p) {
    ctx.save();
    ctx.shadowColor = p.amber;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = isDark ? 'rgba(255,184,48,0.55)' : 'rgba(232,160,32,0.5)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(hitLineX, H * 0.12);
    ctx.lineTo(hitLineX, H * 0.88);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    if (hitFlash > 0) {
      ctx.fillStyle = 'rgba(0,255,208,' + hitFlash * 0.25 + ')';
      ctx.fillRect(hitLineX - 18, H * 0.12, 36, H * 0.76);
    }
  }

  function drawRider(p, gt) {
    var target = waveHeight(hitLineX, gt) - 8;
    riderVY += (target - riderY) * 0.18;
    riderVY *= 0.72;
    riderY += riderVY;

    ctx.save();
    ctx.shadowColor = p.neon;
    ctx.shadowBlur = 22;
    var rg = ctx.createRadialGradient(hitLineX, riderY, 0, hitLineX, riderY, 16);
    rg.addColorStop(0, '#ffffff');
    rg.addColorStop(0.35, p.neon);
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(hitLineX, riderY, 11 + (holding ? 3 : 0), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = p.amber;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(hitLineX, riderY, 14 + (holding ? 4 : 0), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.life -= dt;
      if (pt.life <= 0) { particles.splice(i, 1); continue; }
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.12;
      ctx.globalAlpha = pt.life / pt.max;
      ctx.fillStyle = pt.col;
      ctx.fillRect(pt.x - pt.sz / 2, pt.y - pt.sz / 2, pt.sz, pt.sz);
    }
    ctx.globalAlpha = 1;
  }

  function drawFloats(dt) {
    ctx.textAlign = 'center';
    ctx.font = '600 11px ui-monospace, Menlo, monospace';
    for (var i = floatTexts.length - 1; i >= 0; i--) {
      var ft = floatTexts[i];
      ft.life -= dt;
      if (ft.life <= 0) { floatTexts.splice(i, 1); continue; }
      ft.y += ft.vy;
      ctx.globalAlpha = Math.min(1, ft.life * 1.5);
      ctx.fillStyle = ft.col;
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawGlitch() {
    var g = Math.max(glitchAmt, missFlash);
    if (g <= 0.01) return;
    if (missFlash > 0) {
      ctx.fillStyle = 'rgba(255,92,106,' + missFlash * 0.22 + ')';
      ctx.fillRect(0, 0, W, H);
    }
    var slices = Math.floor(g * 7);
    for (var s = 0; s < slices; s++) {
      var sy = Math.random() * H;
      var off = (Math.random() - 0.5) * g * 28;
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,255,208,0.12)' : 'rgba(255,184,48,0.1)';
      ctx.fillRect(off, sy, W, 3 + Math.random() * 12);
    }
  }

  function drawFrame(now) {
    if (!ctx) { requestAnimationFrame(drawFrame); return; }
    var dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016);
    lastFrame = now;

    if (hitFlash > 0) hitFlash -= dt;
    if (missFlash > 0) missFlash -= dt;
    if (shakeT > 0) shakeT -= dt;
    glitchAmt = Math.max(0, glitchAmt - dt * 0.07);

    var gt = state === STATE.PLAY ? gameTime(now) : 0;
    if (state === STATE.PLAY) {
      timeLeft = Math.max(0, ROUND_SEC - gt);
      updateNotes(now, gt);
      updateHud();
      if (timeLeft <= 0 && misses < MAX_MISS) endGame(true);
    }

    var p = pal();
    var sx = shakeT > 0 ? (Math.random() - 0.5) * shakeT * 36 : 0;
    var sy = shakeT > 0 ? (Math.random() - 0.5) * shakeT * 18 : 0;

    ctx.save();
    ctx.translate(sx, sy);
    drawBg(p, gt || now * 0.001);
    if (state === STATE.PLAY || state === STATE.OVER) {
      drawWaveform(p, gt);
      drawNotes(p, gt);
      drawHitLine(p);
      drawRider(p, gt);
      drawParticles(dt);
      drawFloats(dt);
    } else {
      drawWaveform(p, now * 0.001);
      drawHitLine(p);
    }
    ctx.restore();

    if (state === STATE.PLAY || state === STATE.OVER) drawGlitch();

    requestAnimationFrame(drawFrame);
  }

  function pointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX - rect.left;
      cy = e.touches[0].clientY - rect.top;
    } else {
      cx = e.clientX - rect.left;
      cy = e.clientY - rect.top;
    }
    return { x: cx, y: cy };
  }

  function onTouchStart(e) {
    try { e.preventDefault(); } catch (err) {}
    onPress();
  }

  function onTouchEnd(e) {
    try { e.preventDefault(); } catch (err) {}
    onRelease();
  }

  function onKeyDown(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === STATE.PLAY) {
        try { e.preventDefault(); } catch (err) {}
        if (!holding) onPress();
      }
    }
  }

  function onKeyUp(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === STATE.PLAY) {
        try { e.preventDefault(); } catch (err) {}
        onRelease();
      }
    }
  }

  if (startBtn) startBtn.addEventListener('click', function (e) {
    try { e.stopPropagation(); } catch (err) {}
    startGame();
  });
  if (restartBtn) restartBtn.addEventListener('click', function (e) {
    try { e.stopPropagation(); } catch (err) {}
    startGame();
  });

  if (canvas) {
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });
    canvas.addEventListener('mousedown', function (e) {
      try { e.preventDefault(); } catch (err) {}
      onPress();
    });
    canvas.addEventListener('mouseup', onRelease);
  }
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('resize', resize);

  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        isDark = prefersDark();
      });
    } catch (e) {}
  }

  resize();
  renderLives();
  requestAnimationFrame(drawFrame);
})();
</script>
</body>
</html>
