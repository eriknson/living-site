<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Route</title>
<style>
  :root {
    --bg: #0a0a0c;
    --fg: #e0e0e0;
    --primary: #FF8C00;
    --start: #00ff66;
    --end: #00bfff;
    --action: #ffcc00;
    --broken: #ff3333;
    --wire: #ffffff;
    --grid: #2a2a35;
    --ui-bg: #15151a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0c;
      --fg: #e0e0e0;
      --primary: #FF8C00;
      --start: #00ff66;
      --end: #00bfff;
      --action: #ffcc00;
      --broken: #ff3333;
      --wire: #ffffff;
      --grid: #2a2a35;
      --ui-bg: #15151a;
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f0f4;
      --fg: #111111;
      --primary: #e67e00;
      --start: #00aa44;
      --end: #0077cc;
      --action: #d4a000;
      --broken: #cc0000;
      --wire: #222222;
      --grid: #cccccc;
      --ui-bg: #e8e8ed;
    }
  }
  
  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  
  #game-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  #header {
    height: 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
  }
  
  #timer-bar-container {
    width: 100%;
    height: 8px;
    background: var(--grid);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 10px;
  }
  
  #timer-bar {
    width: 100%;
    height: 100%;
    background: var(--primary);
    transform-origin: left;
    transition: transform 0.1s linear;
  }
  
  #canvas-container {
    flex: 1;
    position: relative;
    width: 100%;
  }
  
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  
  #footer {
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  
  button {
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: bold;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    padding: 15px 30px;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
    transition: transform 0.1s, opacity 0.2s;
  }
  
  button:active {
    transform: scale(0.95);
  }
  
  button:disabled {
    opacity: 0.3;
    pointer-events: none;
    background: var(--grid);
    box-shadow: none;
    color: var(--fg);
  }
  
  #btn-confirm {
    pointer-events: auto;
    width: 100%;
    max-width: 300px;
    height: 60px;
  }
  
  #screens {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  
  .screen {
    background: var(--ui-bg);
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    pointer-events: none;
    display: none;
    border: 1px solid var(--grid);
    max-width: 80%;
  }
  
  .screen.active {
    display: block;
  }
  
  .screen h1, .screen p, .screen .score-display {
    pointer-events: none;
  }
  
  .screen button {
    pointer-events: auto;
  }
  
  h1 {
    margin: 0 0 10px 0;
    font-size: 1.5rem;
    color: var(--primary);
  }
  
  p {
    margin: 0 0 20px 0;
    font-size: 0.9rem;
    line-height: 1.4;
    opacity: 0.8;
  }
  
  .score-display {
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="header">
    <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
      <span>PIPELINE ROUTER</span>
      <span>SHIPPED: <span id="score-text">0</span></span>
    </div>
    <div id="timer-bar-container">
      <div id="timer-bar"></div>
    </div>
  </div>
  
  <div id="canvas-container">
    <canvas id="game-canvas"></canvas>
  </div>
  
  <div id="footer">
    <button id="btn-confirm" disabled>Confirm Route</button>
  </div>
</div>

<div id="screens">
  <div id="screen-start" class="screen active">
    <h1>AGENT ROUTE</h1>
    <p>Link Start [S] to End [E].<br>Collect all Actions [Yellow].<br>Avoid Broken nodes [Red].<br>Ship before sunrise.</p>
    <button data-smoke="start" id="btn-start">Start Pipeline</button>
  </div>
  
  <div id="screen-gameover" class="screen">
    <h1>SUNRISE REACHED</h1>
    <p>The pipeline stalled.</p>
    <div class="score-display" id="final-score">0</div>
    <button data-smoke="restart" id="btn-restart">Retry</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const btnStart = document.getElementById('btn-start');
const btnRestart = document.getElementById('btn-restart');
const btnConfirm = document.getElementById('btn-confirm');
const screenStart = document.getElementById('screen-start');
const screenGameover = document.getElementById('screen-gameover');
const timerBar = document.getElementById('timer-bar');
const scoreText = document.getElementById('score-text');
const finalScore = document.getElementById('final-score');

let gameState = 'start';
let score = 0;
let timeLeft = 30;
const MAX_TIME = 30;
let difficulty = 1;
let level = null;
let currentPath = [];
let isDragging = false;
let lastTime = 0;
let animationFrameId = null;
let floaters = [];

function getColors() {
    const style = getComputedStyle(document.body);
    return {
        bg: style.getPropertyValue('--bg').trim(),
        fg: style.getPropertyValue('--fg').trim(),
        primary: style.getPropertyValue('--primary').trim(),
        start: style.getPropertyValue('--start').trim(),
        end: style.getPropertyValue('--end').trim(),
        action: style.getPropertyValue('--action').trim(),
        broken: style.getPropertyValue('--broken').trim(),
        wire: style.getPropertyValue('--wire').trim(),
        grid: style.getPropertyValue('--grid').trim()
    };
}

let colors = getColors();
window.matchMedia('(prefers-color-scheme: light), (prefers-color-scheme: dark)').addEventListener('change', () => {
    colors = getColors();
    draw();
});

function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    draw();
}
window.addEventListener('resize', resize);

function initGame() {
    score = 0;
    timeLeft = MAX_TIME;
    difficulty = 1;
    scoreText.innerText = score;
    floaters = [];
    generateNextLevel();
    gameState = 'playing';
    screenStart.classList.remove('active');
    screenGameover.classList.remove('active');
    lastTime = performance.now();
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    loop(performance.now());
}

function generateNextLevel() {
    let w = Math.min(6, 3 + Math.floor(difficulty / 3));
    let h = Math.min(8, 4 + Math.floor(difficulty / 3));
    
    let path = [];
    let grid = [];
    let targetLength = Math.min(w * h - 2, 4 + difficulty * 2);
    
    let attempts = 0;
    while (path.length < 3 && attempts < 50) {
        attempts++;
        grid = Array(w).fill(0).map(() => Array(h).fill('empty'));
        let startX = Math.floor(Math.random() * w);
        let startY = Math.floor(Math.random() * h);
        
        path = [{x: startX, y: startY}];
        grid[startX][startY] = 'path';
        
        let dirs = [[0,1], [1,0], [0,-1], [-1,0]];
        
        function dfs(x, y, len) {
            if (len >= targetLength) return true;
            let shuffledDirs = dirs.sort(() => Math.random() - 0.5);
            for (let d of shuffledDirs) {
                let nx = x + d[0];
                let ny = y + d[1];
                if (nx >= 0 && nx < w && ny >= 0 && ny < h && grid[nx][ny] === 'empty') {
                    grid[nx][ny] = 'path';
                    path.push({x: nx, y: ny});
                    if (dfs(nx, ny, len + 1)) return true;
                    path.pop();
                    grid[nx][ny] = 'empty';
                }
            }
            return false;
        }
        
        dfs(startX, startY, 1);
    }
    
    let endNode = path[path.length - 1];
    
    let numActions = Math.min(path.length - 2, 1 + Math.floor(difficulty / 2));
    let actionIndices = new Set();
    let actionAttempts = 0;
    while(actionIndices.size < numActions && actionIndices.size < path.length - 2 && actionAttempts < 100) {
        actionAttempts++;
        let idx = 1 + Math.floor(Math.random() * (path.length - 2));
        actionIndices.add(idx);
    }
    
    let numBroken = Math.min((w*h - path.length), Math.floor(difficulty * 1.2));
    let emptySpots = [];
    for (let i=0; i<w; i++) {
        for (let j=0; j<h; j++) {
            if (grid[i][j] === 'empty') emptySpots.push({x: i, y: j});
        }
    }
    emptySpots.sort(() => Math.random() - 0.5);
    let brokenNodes = emptySpots.slice(0, numBroken);
    
    level = {
        w, h,
        start: path[0],
        end: endNode,
        actions: Array.from(actionIndices).map(i => path[i]),
        broken: brokenNodes
    };
    
    currentPath = [];
    btnConfirm.disabled = true;
    btnConfirm.innerText = "Confirm Route";
    btnConfirm.style.background = "";
    btnConfirm.style.color = "";
    draw();
}

function addTime(amount) {
    timeLeft = Math.min(MAX_TIME, timeLeft + amount);
    const rect = canvas.parentElement.getBoundingClientRect();
    floaters.push({
        x: rect.width / 2,
        y: 40,
        text: `+${amount}s`,
        life: 1.0
    });
}

function loop(time) {
    if (gameState !== 'playing') return;
    let dt = (time - lastTime) / 1000;
    lastTime = time;
    
    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        gameOver();
    }
    
    timerBar.style.transform = `scaleX(${timeLeft / MAX_TIME})`;
    if (timeLeft < 5) {
        timerBar.style.background = (Math.floor(time / 200) % 2 === 0) ? colors.broken : colors.primary;
    } else {
        timerBar.style.background = colors.primary;
    }
    
    for (let i = floaters.length - 1; i >= 0; i--) {
        let f = floaters[i];
        f.life -= dt * 1.5;
        f.y -= dt * 30;
        if (f.life <= 0) {
            floaters.splice(i, 1);
        }
    }
    
    draw();
    animationFrameId = requestAnimationFrame(loop);
}

function gameOver() {
    gameState = 'gameover';
    finalScore.innerText = score;
    screenGameover.classList.add('active');
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function getGridMetrics() {
    if (!level) return null;
    const rect = canvas.parentElement.getBoundingClientRect();
    const padding = 20;
    const availableW = rect.width - padding * 2;
    const availableH = rect.height - padding * 2;
    
    const cellW = availableW / level.w;
    const cellH = availableH / level.h;
    const cellSize = Math.min(cellW, cellH, 80);
    
    const gridW = cellSize * level.w;
    const gridH = cellSize * level.h;
    
    const offsetX = (rect.width - gridW) / 2;
    const offsetY = (rect.height - gridH) / 2;
    
    return { cellSize, offsetX, offsetY };
}

function draw() {
    if (!level) return;
    const rect = canvas.parentElement.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    
    const m = getGridMetrics();
    if (!m) return;
    
    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    for (let i = 0; i <= level.w; i++) {
        ctx.beginPath();
        ctx.moveTo(m.offsetX + i * m.cellSize, m.offsetY);
        ctx.lineTo(m.offsetX + i * m.cellSize, m.offsetY + level.h * m.cellSize);
        ctx.stroke();
    }
    for (let j = 0; j <= level.h; j++) {
        ctx.beginPath();
        ctx.moveTo(m.offsetX, m.offsetY + j * m.cellSize);
        ctx.lineTo(m.offsetX + level.w * m.cellSize, m.offsetY + j * m.cellSize);
        ctx.stroke();
    }
    
    const cx = (x) => m.offsetX + x * m.cellSize + m.cellSize / 2;
    const cy = (y) => m.offsetY + y * m.cellSize + m.cellSize / 2;
    const nodeRadius = m.cellSize * 0.15;
    
    ctx.fillStyle = colors.grid;
    for (let i = 0; i < level.w; i++) {
        for (let j = 0; j < level.h; j++) {
            ctx.beginPath();
            ctx.arc(cx(i), cy(j), nodeRadius * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    ctx.strokeStyle = colors.broken;
    ctx.lineWidth = 3;
    for (let b of level.broken) {
        let x = cx(b.x);
        let y = cy(b.y);
        let r = nodeRadius * 1.2;
        ctx.beginPath();
        ctx.moveTo(x - r, y - r);
        ctx.lineTo(x + r, y + r);
        ctx.moveTo(x + r, y - r);
        ctx.lineTo(x - r, y + r);
        ctx.stroke();
    }
    
    for (let a of level.actions) {
        let isCollected = currentPath.some(p => p.x === a.x && p.y === a.y);
        ctx.fillStyle = isCollected ? colors.grid : colors.action;
        let x = cx(a.x);
        let y = cy(a.y);
        let r = nodeRadius * 1.5;
        
        if (!isCollected && gameState === 'playing') {
            r += Math.sin(performance.now() / 150) * nodeRadius * 0.3;
        }
        
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + r, y);
        ctx.lineTo(x, y + r);
        ctx.lineTo(x - r, y);
        ctx.fill();
    }
    
    if (currentPath.length > 0) {
        let isComplete = !btnConfirm.disabled;
        ctx.strokeStyle = isComplete ? colors.start : colors.wire;
        ctx.lineWidth = m.cellSize * 0.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(cx(currentPath[0].x), cy(currentPath[0].y));
        for (let i = 1; i < currentPath.length; i++) {
            ctx.lineTo(cx(currentPath[i].x), cy(currentPath[i].y));
        }
        ctx.stroke();
        
        ctx.strokeStyle = (isComplete ? colors.start : colors.wire) + '66';
        ctx.lineWidth = m.cellSize * 0.4;
        ctx.stroke();
        
        ctx.fillStyle = isComplete ? colors.start : colors.wire;
        for (let p of currentPath) {
            ctx.beginPath();
            ctx.arc(cx(p.x), cy(p.y), nodeRadius * 0.8, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    ctx.fillStyle = colors.start;
    ctx.beginPath();
    ctx.arc(cx(level.start.x), cy(level.start.y), nodeRadius * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = colors.bg;
    ctx.font = `bold ${m.cellSize * 0.25}px ui-monospace, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('S', cx(level.start.x), cy(level.start.y));
    
    ctx.fillStyle = colors.end;
    ctx.beginPath();
    ctx.arc(cx(level.end.x), cy(level.end.y), nodeRadius * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = colors.bg;
    ctx.fillText('E', cx(level.end.x), cy(level.end.y));
    
    for (let f of floaters) {
        let alpha = Math.floor(f.life * 255).toString(16).padStart(2, '0');
        ctx.fillStyle = colors.primary + alpha;
        ctx.font = `bold 24px ui-monospace, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x, f.y);
    }
}

function getGridPos(clientX, clientY) {
    if (!level) return null;
    const rect = canvas.getBoundingClientRect();
    const m = getGridMetrics();
    
    let x = clientX - rect.left - m.offsetX;
    let y = clientY - rect.top - m.offsetY;
    
    let gx = Math.floor(x / m.cellSize);
    let gy = Math.floor(y / m.cellSize);
    
    if (gx >= 0 && gx < level.w && gy >= 0 && gy < level.h) {
        return {x: gx, y: gy};
    }
    return null;
}

function handleInputStart(clientX, clientY) {
    if (gameState !== 'playing') return;
    let pos = getGridPos(clientX, clientY);
    if (pos) {
        if (pos.x === level.start.x && pos.y === level.start.y) {
            isDragging = true;
            currentPath = [{x: pos.x, y: pos.y}];
            checkPathValid();
            if (navigator.vibrate) navigator.vibrate(20);
        } else if (currentPath.length > 0) {
            let last = currentPath[currentPath.length - 1];
            if (pos.x === last.x && pos.y === last.y) {
                isDragging = true;
            }
        }
    }
}

function handleInputMove(clientX, clientY) {
    if (!isDragging || gameState !== 'playing') return;
    let pos = getGridPos(clientX, clientY);
    if (!pos) return;
    
    let last = currentPath[currentPath.length - 1];
    
    if (pos.x !== last.x || pos.y !== last.y) {
        let dx = Math.abs(pos.x - last.x);
        let dy = Math.abs(pos.y - last.y);
        
        if (dx + dy === 1) {
            let isBroken = level.broken.some(b => b.x === pos.x && b.y === pos.y);
            if (isBroken) return;
            
            let pathIdx = currentPath.findIndex(p => p.x === pos.x && p.y === pos.y);
            if (pathIdx !== -1) {
                if (pathIdx === currentPath.length - 2) {
                    currentPath.pop();
                    if (navigator.vibrate) navigator.vibrate(10);
                    checkPathValid();
                }
            } else {
                currentPath.push({x: pos.x, y: pos.y});
                if (navigator.vibrate) navigator.vibrate(15);
                checkPathValid();
            }
        }
    }
}

function handleInputEnd() {
    isDragging = false;
}

function checkPathValid() {
    if (currentPath.length === 0) {
        btnConfirm.disabled = true;
        return;
    }
    
    let last = currentPath[currentPath.length - 1];
    let reachedEnd = (last.x === level.end.x && last.y === level.end.y);
    
    let allActionsCollected = true;
    for (let a of level.actions) {
        if (!currentPath.some(p => p.x === a.x && p.y === a.y)) {
            allActionsCollected = false;
            break;
        }
    }
    
    if (reachedEnd && allActionsCollected) {
        if (btnConfirm.disabled) {
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
        }
        btnConfirm.disabled = false;
        btnConfirm.innerText = "SHIP IT";
        btnConfirm.style.background = colors.start;
        btnConfirm.style.color = colors.bg;
    } else {
        btnConfirm.disabled = true;
        btnConfirm.innerText = "Confirm Route";
        btnConfirm.style.background = "";
        btnConfirm.style.color = "";
    }
    draw();
}

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    let touch = e.touches[0];
    handleInputStart(touch.clientX, touch.clientY);
}, {passive: false});

window.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    let touch = e.touches[0];
    handleInputMove(touch.clientX, touch.clientY);
}, {passive: false});

window.addEventListener('touchend', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    handleInputEnd();
}, {passive: false});

canvas.addEventListener('mousedown', (e) => {
    handleInputStart(e.clientX, e.clientY);
});
window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    handleInputMove(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => {
    handleInputEnd();
});

function handleKeyDown(e) {
    if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (gameState === 'start') {
            initGame();
        } else if (gameState === 'gameover') {
            initGame();
        } else if (gameState === 'playing' && !btnConfirm.disabled) {
            btnConfirm.click();
        }
    } else if (gameState === 'playing' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        const m = getGridMetrics();
        if (!m || !level) return;
        const rect = canvas.getBoundingClientRect();
        if (currentPath.length === 0) {
            handleInputStart(
                rect.left + m.offsetX + (level.start.x + 0.5) * m.cellSize,
                rect.top + m.offsetY + (level.start.y + 0.5) * m.cellSize
            );
        }
        if (currentPath.length === 0) return;
        isDragging = true;
        const last = currentPath[currentPath.length - 1];
        const dirs = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
        const d = dirs[e.key];
        handleInputMove(
            rect.left + m.offsetX + (last.x + d[0] + 0.5) * m.cellSize,
            rect.top + m.offsetY + (last.y + d[1] + 0.5) * m.cellSize
        );
    } else if (gameState === 'playing' && (e.key === 'Backspace' || e.key === 'z') && currentPath.length > 1) {
        e.preventDefault();
        currentPath.pop();
        checkPathValid();
    }
}

function handleKeyUp(e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        handleInputEnd();
    }
}

document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

btnStart.addEventListener('click', () => {
    initGame();
});

btnRestart.addEventListener('click', () => {
    initGame();
});

btnConfirm.addEventListener('click', () => {
    if (btnConfirm.disabled) return;
    
    score += 1;
    scoreText.innerText = score;
    
    let timeBonus = 5 + Math.floor(difficulty / 2);
    addTime(timeBonus);
    
    difficulty++;
    
    if (navigator.vibrate) navigator.vibrate([50, 50, 100]);
    
    generateNextLevel();
});

resize();
</script>
</body>
</html>
