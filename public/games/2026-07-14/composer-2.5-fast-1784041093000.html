<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recompose</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  :root {
    --bg: #c8d2dc;
    --fg: #182028;
    --muted: #5a6a78;
    --amber: #e09018;
    --neon: #00bfa0;
    --coral: #e85a68;
    --panel: rgba(255,255,255,0.92);
    --fog: rgba(175,190,205,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0e14;
      --fg: #e6edf4;
      --muted: #8494a4;
      --amber: #ffb830;
      --neon: #00ffd8;
      --coral: #ff7080;
      --panel: rgba(10,14,20,0.94);
      --fog: rgba(32,42,56,0.65);
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    min-height: 100dvh;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1.5rem;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.45s ease, visibility 0.45s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
    border-radius: 14px;
    padding: 1.75rem 1.5rem;
    max-width: 22rem;
    width: 90%;
    text-align: center;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    pointer-events: none;
  }
  h1 {
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }
  .tagline {
    font-size: 0.74rem;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 1rem;
  }
  .neon-line {
    height: 2px;
    width: 62%;
    margin: 0 auto 1rem;
    background: linear-gradient(90deg, transparent, var(--amber), var(--neon), transparent);
    border-radius: 2px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 168px;
    padding: 0.85rem 2rem;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: var(--neon);
    color: #081018;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
    box-shadow: 0 0 22px color-mix(in srgb, var(--neon) 42%, transparent);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: max(0.65rem, env(safe-area-inset-top)) 1rem 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #hud.visible { opacity: 1; }
  .hud-block { display: flex; flex-direction: column; gap: 0.1rem; }
  .hud-label { color: var(--muted); font-size: 0.58rem; text-transform: uppercase; }
  .hud-val { font-size: 0.95rem; font-weight: 600; }
  .layer-dots { display: flex; gap: 4px; margin-top: 3px; }
  .layer-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: color-mix(in srgb, var(--muted) 40%, transparent);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .layer-dot.on {
    background: var(--neon);
    box-shadow: 0 0 6px var(--neon);
  }
  .bass-bar {
    width: 52px; height: 4px; border-radius: 2px;
    background: color-mix(in srgb, var(--fg) 12%, transparent);
    margin-top: 3px; overflow: hidden;
  }
  .bass-fill {
    height: 100%; width: 100%;
    background: var(--amber);
    transform-origin: left;
    transition: transform 0.2s;
  }
  .final-score { font-size: 2rem; font-weight: 700; color: var(--neon); margin: 0.4rem 0; }
  .stats-row {
    display: flex; justify-content: center; gap: 1.1rem;
    font-size: 0.68rem; color: var(--muted); margin-bottom: 0.85rem;
  }
  .win-title { color: var(--amber); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span class="hud-val" id="score-val">0</span>
      <div class="layer-dots" id="layers"></div>
    </div>
    <div class="hud-block" style="align-items:center;text-align:center">
      <span class="hud-label" id="bpm-label">128 BPM</span>
      <span class="hud-val" id="combo-val">×0</span>
    </div>
    <div class="hud-block" style="align-items:flex-end;text-align:right">
      <span class="hud-label">Bass</span>
      <div class="bass-bar"><div class="bass-fill" id="bass-fill"></div></div>
      <span class="hud-val" id="time-val">50</span>
    </div>
  </div>
  <div id="title-overlay" class="overlay">
    <div class="panel">
      <h1>Recompose</h1>
      <div class="neon-line"></div>
      <p class="tagline">Stutter-house drops orbit through summer fog.<br>Tap solid kicks · let ghosts drift past.<br>Stack vocal chops every 8 bars.</p>
      <button type="button" data-smoke="start">Drop In</button>
    </div>
  </div>
  <div id="over-overlay" class="overlay hidden">
    <div class="panel">
      <h1 id="over-title">Mix Cut</h1>
      <div class="neon-line"></div>
      <div class="final-score" id="final-score">0</div>
      <div class="stats-row">
        <span id="stat-perfect">0 perfect</span>
        <span id="stat-layers">0 chops</span>
      </div>
      <button type="button" data-smoke="restart">Ride Again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  var ROUND_SEC = 50;
  var MAX_MISS = 3;
  var HIT_EARLY = 0.13;
  var HIT_LATE = 0.1;
  var BAR_BEATS = 4;
  var LAYERS_MAX = 4;

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var hud = document.getElementById('hud');
  var scoreEl = document.getElementById('score-val');
  var comboEl = document.getElementById('combo-val');
  var bpmEl = document.getElementById('bpm-label');
  var timeEl = document.getElementById('time-val');
  var bassFill = document.getElementById('bass-fill');
  var layersEl = document.getElementById('layers');
  var titleOverlay = document.getElementById('title-overlay');
  var overOverlay = document.getElementById('over-overlay');
  var overTitle = document.getElementById('over-title');
  var finalScoreEl = document.getElementById('final-score');
  var statPerfect = document.getElementById('stat-perfect');
  var statLayers = document.getElementById('stat-layers');
  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');

  var W = 360, H = 640, dpr = 1;
  var state = STATE.TITLE;
  var beatmap = [];
  var particles = [];
  var fogBands = [];
  var floatTexts = [];
  var score = 0, combo = 0, maxCombo = 0, perfects = 0;
  var misses = 0, timeLeft = ROUND_SEC, roundStart = 0;
  var cx = 0, cy = 0, ringR = 120;
  var shakeT = 0, hitFlash = 0, missFlash = 0, beatPulse = 0;
  var bassLevel = 1, skipStreak = 0;
  var vocalLayers = 0, barMisses = 0, barsCleared = 0;
  var audioCtx = null, masterGain = null, bassGain = null, chopGain = null;
  var lastFrame = 0, isDark = false;
  var nextBeatSound = -1;

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  }

  function bpmAt(t) {
    var p = Math.min(1, Math.max(0, t / ROUND_SEC));
    return 128 + 48 * Math.pow(p, 1.2);
  }

  function ghostChance(t) {
    return 0.12 + 0.28 * Math.min(1, t / ROUND_SEC);
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.34;
      bassGain = audioCtx.createGain();
      bassGain.gain.value = 1;
      chopGain = audioCtx.createGain();
      chopGain.gain.value = 0;
      bassGain.connect(masterGain);
      chopGain.connect(masterGain);
      masterGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }

  function resumeAudio() {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function tone(freq, dur, type, vol, dest) {
    if (!audioCtx) return;
    var out = dest || masterGain;
    if (!out) return;
    try {
      resumeAudio();
      var t0 = audioCtx.currentTime;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(out);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  function kick() {
    if (!audioCtx || !bassGain) return;
    try {
      resumeAudio();
      var t0 = audioCtx.currentTime;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.frequency.setValueAtTime(150, t0);
      o.frequency.exponentialRampToValueAtTime(38, t0 + 0.08);
      g.gain.setValueAtTime(0.42 * bassLevel, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
      o.connect(g); g.connect(bassGain);
      o.start(t0); o.stop(t0 + 0.16);
    } catch (e) {}
  }

  function hat() {
    if (!audioCtx || !masterGain) return;
    try {
      resumeAudio();
      var t0 = audioCtx.currentTime;
      var len = Math.floor(audioCtx.sampleRate * 0.04);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = audioCtx.createBufferSource();
      var g = audioCtx.createGain();
      src.buffer = buf;
      g.gain.value = 0.06;
      src.connect(g); g.connect(masterGain);
      src.start(t0);
    } catch (e) {}
  }

  function playChop(layer) {
    if (!audioCtx || !chopGain) return;
    var freqs = [392, 440, 523, 587, 659];
    var f = freqs[layer % freqs.length];
    tone(f, 0.09, 'triangle', 0.08 + layer * 0.02, chopGain);
    tone(f * 1.5, 0.06, 'sine', 0.05, chopGain);
  }

  function playHit(q) {
    kick();
    tone(200 + combo * 5, 0.07, 'triangle', q === 'perfect' ? 0.13 : 0.08);
  }

  function playMiss() {
    tone(65, 0.22, 'sawtooth', 0.1);
    tone(40, 0.3, 'square', 0.05);
  }

  function playWin() {
    tone(330, 0.14, 'triangle', 0.11);
    tone(440, 0.18, 'triangle', 0.09);
    tone(554, 0.22, 'sine', 0.07);
  }

  function buildBeatmap() {
    var notes = [];
    var t = 1.4;
    var beatIdx = 0;
    while (t < ROUND_SEC - 0.4) {
      var bpm = bpmAt(t);
      var beat = 60 / bpm;
      var barPos = beatIdx % BAR_BEATS;

      if (barPos === 0 || barPos === 2) {
        notes.push({ time: t, type: 'kick', hit: false, missed: false, resolved: false });
      }
      if (barPos === 1 && beatIdx > 8) {
        notes.push({ time: t, type: 'kick', hit: false, missed: false, resolved: false });
      }

      if (t > 6 && Math.random() < ghostChance(t)) {
        var off = beat * (0.38 + Math.random() * 0.22);
        if (Math.random() > 0.5) off = -off * 0.6;
        var gt = t + off;
        if (gt > 1 && gt < ROUND_SEC - 0.5) {
          notes.push({ time: gt, type: 'ghost', hit: false, missed: false, resolved: false });
        }
      }

      t += beat;
      beatIdx++;
    }
    notes.sort(function (a, b) { return a.time - b.time; });
    return notes;
  }

  function initFog() {
    fogBands = [];
    for (var i = 0; i < 8; i++) {
      fogBands.push({
        y: Math.random() * H * 0.6,
        x: Math.random() * W,
        w: W * (0.3 + Math.random() * 0.5),
        h: 20 + Math.random() * 44,
        spd: 5 + Math.random() * 16,
        a: 0.1 + Math.random() * 0.16
      });
    }
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W * 0.5;
    cy = H * 0.48;
    ringR = Math.min(W, H) * 0.34;
    initFog();
  }

  function renderLayers() {
    if (!layersEl) return;
    layersEl.innerHTML = '';
    for (var i = 0; i < LAYERS_MAX; i++) {
      var d = document.createElement('span');
      d.className = 'layer-dot' + (i < vocalLayers ? ' on' : '');
      layersEl.appendChild(d);
    }
  }

  function setBassVisual() {
    if (bassFill) bassFill.style.transform = 'scaleX(' + Math.max(0, bassLevel) + ')';
    if (bassGain && audioCtx) {
      try {
        bassGain.gain.setTargetAtTime(Math.max(0.02, bassLevel), audioCtx.currentTime, 0.08);
      } catch (e) {}
    }
    if (chopGain && audioCtx) {
      try {
        chopGain.gain.setTargetAtTime(vocalLayers * 0.14, audioCtx.currentTime, 0.12);
      } catch (e) {}
    }
  }

  function resetGame() {
    beatmap = buildBeatmap();
    particles = [];
    floatTexts = [];
    score = 0; combo = 0; maxCombo = 0; perfects = 0;
    misses = 0; timeLeft = ROUND_SEC;
    shakeT = 0; hitFlash = 0; missFlash = 0; beatPulse = 0;
    bassLevel = 1; skipStreak = 0;
    vocalLayers = 0; barMisses = 0; barsCleared = 0;
    nextBeatSound = -1;
    roundStart = performance.now();
    renderLayers();
    setBassVisual();
    updateHud();
  }

  function startGame() {
    initAudio();
    resetGame();
    state = STATE.PLAY;
    titleOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    hud.classList.add('visible');
    if (navigator.vibrate) try { navigator.vibrate(24); } catch (e) {}
  }

  function endGame(victory) {
    state = STATE.OVER;
    hud.classList.remove('visible');
    overOverlay.classList.remove('hidden');
    overTitle.textContent = victory ? 'Full Loop' : 'Mix Cut';
    overTitle.className = victory ? 'win-title' : '';
    finalScoreEl.textContent = String(score);
    statPerfect.textContent = perfects + ' perfect';
    statLayers.textContent = vocalLayers + ' chops';
    if (victory) playWin();
    if (navigator.vibrate) try { navigator.vibrate(victory ? [18, 36, 18] : [48, 28, 48]); } catch (e) {}
  }

  function updateHud() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) comboEl.textContent = '×' + combo;
    if (timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
    if (bpmEl && state === STATE.PLAY) {
      var el = (performance.now() - roundStart) / 1000;
      bpmEl.textContent = Math.round(bpmAt(el)) + ' BPM';
    }
    setBassVisual();
  }

  function gameTime(now) {
    return (now - roundStart) / 1000;
  }

  function addFloat(text, x, y, col) {
    floatTexts.push({ text: text, x: x, y: y, col: col, life: 0.7, vy: -1.3 });
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 2 + Math.random() * 5;
      particles.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5,
        life: 0.3 + Math.random() * 0.35, max: 0.65,
        col: col, sz: 2 + Math.random() * 3
      });
    }
  }

  function checkBarProgress(gt) {
    var barDur = (60 / bpmAt(gt)) * BAR_BEATS;
    var barNum = Math.floor(gt / barDur);
    if (barNum > barsCleared) {
      if (barMisses <= 1 && barNum > 0) {
        if (vocalLayers < LAYERS_MAX) {
          vocalLayers++;
          playChop(vocalLayers);
          addFloat('CHOP +' + vocalLayers, cx, cy - ringR - 30, pal().neon);
          renderLayers();
        }
      } else if (barMisses > 2) {
        bassLevel = Math.max(0, bassLevel - 0.15);
        addFloat('BASS CUT', cx, cy + ringR + 20, pal().coral);
      }
      barsCleared = barNum;
      barMisses = 0;
    }
  }

  function registerMiss(reason) {
    if (state !== STATE.PLAY) return;
    misses++;
    combo = 0;
    barMisses++;
    skipStreak = 0;
    bassLevel = Math.max(0, bassLevel - 0.22);
    missFlash = 0.32;
    shakeT = 0.16;
    addFloat(reason === 'ghost' ? 'PHANTOM' : 'GLITCH', cx, cy - 40, pal().coral);
    playMiss();
    if (navigator.vibrate) try { navigator.vibrate(50); } catch (e) {}
    updateHud();
    if (misses >= MAX_MISS || bassLevel <= 0.01) endGame(false);
  }

  function registerHit(note, quality) {
    note.hit = true;
    note.resolved = true;
    var pts = quality === 'perfect' ? 110 : 60;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    var mult = 1 + Math.floor(combo / 5) * 0.25;
    score += Math.round(pts * mult);
    if (quality === 'perfect') perfects++;
    skipStreak++;
    bassLevel = Math.min(1, bassLevel + 0.06);
    hitFlash = 0.26;
    shakeT = 0.06;
    beatPulse = 1;
    var ang = noteToAngle(note.time, gameTime(performance.now()));
    var px = cx + Math.sin(ang) * ringR;
    var py = cy - Math.cos(ang) * ringR;
    var c = quality === 'perfect' ? pal().neon : pal().amber;
    burst(px, py, c, quality === 'perfect' ? 14 : 8);
    addFloat(quality === 'perfect' ? 'DROP!' : 'NICE', px, py - 18, c);
    playHit(quality);
    if (navigator.vibrate) try { navigator.vibrate(quality === 'perfect' ? 12 : 6); } catch (e) {}
    updateHud();
  }

  function noteToAngle(noteTime, gt) {
    var ahead = noteTime - gt;
    return -Math.PI / 2 + ahead * 4.2;
  }

  function findNoteInWindow(gt, typeFilter) {
    var best = null, bestD = Infinity;
    for (var i = 0; i < beatmap.length; i++) {
      var n = beatmap[i];
      if (n.resolved || n.hit || n.missed) continue;
      if (typeFilter && n.type !== typeFilter) continue;
      var d = gt - n.time;
      if (d >= -HIT_EARLY && d <= HIT_LATE) {
        var ad = Math.abs(d);
        if (ad < bestD) { bestD = ad; best = n; }
      }
    }
    return best;
  }

  function onTap() {
    if (state !== STATE.PLAY) return;
    var gt = gameTime(performance.now());

    var ghost = findNoteInWindow(gt, 'ghost');
    if (ghost) {
      ghost.resolved = true;
      ghost.missed = true;
      registerMiss('ghost');
      return;
    }

    var kick = findNoteInWindow(gt, 'kick');
    if (kick) {
      var td = Math.abs(gt - kick.time);
      registerHit(kick, td < 0.04 ? 'perfect' : 'good');
      return;
    }

    var nearKick = false;
    for (var j = 0; j < beatmap.length; j++) {
      var m = beatmap[j];
      if (!m.resolved && m.type === 'kick' && Math.abs(gt - m.time) < 0.2) nearKick = true;
    }
    if (nearKick) registerMiss('early');
  }

  function updateNotes(gt) {
    for (var i = 0; i < beatmap.length; i++) {
      var n = beatmap[i];
      if (n.resolved) continue;
      if (gt - n.time > HIT_LATE) {
        if (n.type === 'ghost') {
          n.resolved = true;
        } else if (!n.hit) {
          n.missed = true;
          n.resolved = true;
          registerMiss('missed');
        }
      }
    }

    var beatIdx = Math.floor(gt * bpmAt(gt) / 60);
    if (beatIdx > nextBeatSound) {
      nextBeatSound = beatIdx;
      if (beatIdx % 2 === 0) kick();
      else if (beatIdx % 4 === 1) hat();
    }

    checkBarProgress(gt);
  }

  function pal() {
    isDark = prefersDark();
    return {
      sky: isDark ? '#0a0e14' : '#c0cad4',
      mid: isDark ? '#121a24' : '#96a8b6',
      deep: isDark ? '#060a10' : '#6a8090',
      fog: isDark ? 'rgba(36,48,62,0.72)' : 'rgba(185,200,214,0.55)',
      amber: isDark ? '#ffb830' : '#e09018',
      neon: isDark ? '#00ffd8' : '#00bfa0',
      coral: isDark ? '#ff7080' : '#e85a68',
      ghost: isDark ? 'rgba(255,112,128,0.5)' : 'rgba(232,90,104,0.42)',
      dim: isDark ? 'rgba(0,255,216,0.08)' : 'rgba(0,191,160,0.1)'
    };
  }

  function drawBg(p, gt) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, p.sky);
    g.addColorStop(0.4, p.mid);
    g.addColorStop(1, p.deep);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var ag = ctx.createRadialGradient(cx, H * 0.12, 0, cx, H * 0.15, W * 0.85);
    ag.addColorStop(0, isDark ? 'rgba(255,184,48,0.07)' : 'rgba(224,144,24,0.1)');
    ag.addColorStop(1, 'transparent');
    ctx.fillStyle = ag;
    ctx.fillRect(0, 0, W, H);

    for (var f = 0; f < fogBands.length; f++) {
      var fb = fogBands[f];
      fb.x += fb.spd * 0.013;
      if (fb.x > W + fb.w) fb.x = -fb.w;
      var fg = ctx.createLinearGradient(fb.x, fb.y, fb.x + fb.w, fb.y);
      fg.addColorStop(0, 'transparent');
      fg.addColorStop(0.5, p.fog);
      fg.addColorStop(1, 'transparent');
      ctx.globalAlpha = fb.a;
      ctx.fillStyle = fg;
      ctx.fillRect(fb.x, fb.y, fb.w, fb.h);
    }
    ctx.globalAlpha = 1;
  }

  function drawRing(p, gt) {
    ctx.save();
    ctx.translate(cx, cy);

    for (var r = 3; r >= 0; r--) {
      ctx.beginPath();
      ctx.arc(0, 0, ringR + r * 14, 0, Math.PI * 2);
      ctx.strokeStyle = p.dim;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.shadowColor = p.neon;
    ctx.shadowBlur = 10 + beatPulse * 14;
    ctx.strokeStyle = p.neon;
    ctx.lineWidth = 2.5 + beatPulse;
    ctx.beginPath();
    ctx.arc(0, 0, ringR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = isDark ? 'rgba(255,184,48,0.5)' : 'rgba(224,144,24,0.45)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 7]);
    ctx.beginPath();
    ctx.moveTo(0, -ringR - 18);
    ctx.lineTo(0, -ringR + 22);
    ctx.stroke();
    ctx.setLineDash([]);

    var wob = Math.sin(gt * 9) * 0.04 + Math.sin(gt * 17) * 0.02;
    for (var i = 0; i < 64; i++) {
      var a = (i / 64) * Math.PI * 2 - Math.PI / 2;
      var rad = ringR * 0.55 + Math.sin(a * 5 + gt * 6) * 8 * (1 + wob);
      var x = Math.cos(a) * rad;
      var y = Math.sin(a) * rad;
      var al = 0.15 + 0.12 * Math.sin(a * 3 + gt * 4);
      ctx.fillStyle = isDark ? 'rgba(0,255,216,' + al + ')' : 'rgba(0,191,160,' + al + ')';
      ctx.beginPath();
      ctx.arc(x, y, 1.5 + Math.sin(i + gt * 8) * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }

    if (beatPulse > 0) beatPulse = Math.max(0, beatPulse - 0.045);
    ctx.restore();
  }

  function drawNotes(p, gt) {
    for (var i = 0; i < beatmap.length; i++) {
      var n = beatmap[i];
      if (n.resolved) continue;
      var ang = noteToAngle(n.time, gt);
      if (ang < -Math.PI * 1.6 || ang > Math.PI * 0.5) continue;

      var px = cx + Math.sin(ang) * ringR;
      var py = cy - Math.cos(ang) * ringR;
      var pulse = 0.7 + 0.3 * Math.sin(gt * 10 + i);

      if (n.type === 'ghost') {
        ctx.save();
        ctx.setLineDash([3, 5]);
        ctx.strokeStyle = p.ghost;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(cx + Math.sin(ang) * (ringR - 28), cy - Math.cos(ang) * (ringR - 28));
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = p.ghost;
        ctx.beginPath();
        ctx.arc(px, py, 6 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '500 7px ui-monospace, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('?', px, py - 11);
        ctx.restore();
        continue;
      }

      var col = n.hit ? p.neon : p.amber;
      ctx.save();
      ctx.shadowColor = col;
      ctx.shadowBlur = 12 + beatPulse * 6;
      ctx.strokeStyle = col;
      ctx.lineWidth = 3;
      ctx.globalAlpha = n.missed ? 0.25 : pulse;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(cx + Math.sin(ang) * (ringR - 32), cy - Math.cos(ang) * (ringR - 32));
      ctx.stroke();
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(px, py, 10 + beatPulse * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = isDark ? '#0a0e14' : '#e8eef2';
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawCenterPulse(p, gt) {
    var r = 18 + beatPulse * 8 + Math.sin(gt * 14) * 3;
    ctx.save();
    ctx.translate(cx, cy);
    var rg = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2);
    rg.addColorStop(0, '#ffffff');
    rg.addColorStop(0.3, p.neon);
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    for (var v = 0; v < vocalLayers; v++) {
      var va = gt * (1.2 + v * 0.15) + v * 1.4;
      var vr = 10 + v * 5;
      ctx.strokeStyle = isDark ? 'rgba(255,184,48,0.35)' : 'rgba(224,144,24,0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (var s = 0; s <= 24; s++) {
        var t = s / 24;
        var wx = Math.cos(t * Math.PI * 2 + va) * vr * (1 + Math.sin(t * 12 + va) * 0.3);
        var wy = Math.sin(t * Math.PI * 2 + va) * vr * 0.6;
        if (s === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.life -= dt;
      if (pt.life <= 0) { particles.splice(i, 1); continue; }
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.1;
      ctx.globalAlpha = pt.life / pt.max;
      ctx.fillStyle = pt.col;
      ctx.fillRect(pt.x - pt.sz / 2, pt.y - pt.sz / 2, pt.sz, pt.sz);
    }
    ctx.globalAlpha = 1;
  }

  function drawFloats(dt) {
    ctx.textAlign = 'center';
    ctx.font = '600 11px ui-monospace, Menlo, monospace';
    for (var i = floatTexts.length - 1; i >= 0; i--) {
      var ft = floatTexts[i];
      ft.life -= dt;
      if (ft.life <= 0) { floatTexts.splice(i, 1); continue; }
      ft.y += ft.vy;
      ctx.globalAlpha = Math.min(1, ft.life * 1.4);
      ctx.fillStyle = ft.col;
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawGlitch() {
    if (missFlash <= 0.01) return;
    ctx.fillStyle = 'rgba(232,90,104,' + missFlash * 0.2 + ')';
    ctx.fillRect(0, 0, W, H);
    var slices = Math.floor(missFlash * 6);
    for (var s = 0; s < slices; s++) {
      var sy = Math.random() * H;
      var off = (Math.random() - 0.5) * missFlash * 24;
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,255,216,0.1)' : 'rgba(255,184,48,0.08)';
      ctx.fillRect(off, sy, W, 2 + Math.random() * 10);
    }
  }

  function drawFrame(now) {
    if (!ctx) { requestAnimationFrame(drawFrame); return; }
    var dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016);
    lastFrame = now;

    if (hitFlash > 0) hitFlash -= dt;
    if (missFlash > 0) missFlash -= dt;
    if (shakeT > 0) shakeT -= dt;

    var gt = state === STATE.PLAY ? gameTime(now) : 0;
    if (state === STATE.PLAY) {
      timeLeft = Math.max(0, ROUND_SEC - gt);
      updateNotes(gt);
      updateHud();
      if (timeLeft <= 0 && misses < MAX_MISS && bassLevel > 0.01) endGame(true);
    }

    var p = pal();
    var sx = shakeT > 0 ? (Math.random() - 0.5) * shakeT * 32 : 0;
    var sy = shakeT > 0 ? (Math.random() - 0.5) * shakeT * 16 : 0;

    ctx.save();
    ctx.translate(sx, sy);
    drawBg(p, gt || now * 0.001);
    if (state === STATE.PLAY || state === STATE.OVER) {
      drawRing(p, gt);
      drawNotes(p, gt);
      drawCenterPulse(p, gt);
      drawParticles(dt);
      drawFloats(dt);
    } else {
      drawRing(p, now * 0.001);
      drawCenterPulse(p, now * 0.001);
    }
    ctx.restore();

    if (hitFlash > 0) {
      ctx.fillStyle = 'rgba(0,255,216,' + hitFlash * 0.12 + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (state === STATE.PLAY || state === STATE.OVER) drawGlitch();

    requestAnimationFrame(drawFrame);
  }

  function onTouchStart(e) {
    try { e.preventDefault(); } catch (err) {}
    onTap();
  }

  function onKeyDown(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === STATE.PLAY) {
        try { e.preventDefault(); } catch (err) {}
        onTap();
      }
    }
  }

  if (startBtn) startBtn.addEventListener('click', function (e) {
    try { e.stopPropagation(); } catch (err) {}
    startGame();
  });
  if (restartBtn) restartBtn.addEventListener('click', function (e) {
    try { e.stopPropagation(); } catch (err) {}
    startGame();
  });

  if (canvas) {
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('mousedown', function (e) {
      try { e.preventDefault(); } catch (err) {}
      onTap();
    });
  }
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', resize);

  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        isDark = prefersDark();
      });
    } catch (e) {}
  }

  resize();
  renderLayers();
  requestAnimationFrame(drawFrame);
})();
</script>
</body>
</html>
