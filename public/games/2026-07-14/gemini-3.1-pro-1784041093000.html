<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lumin Shaft</title>
<style>
  :root {
    --bg: #f4f4f0;
    --text: #1a1a1a;
    --ui-bg: rgba(244, 244, 240, 0.85);
    --btn-bg: #1a1a1a;
    --btn-text: #f4f4f0;
    --btn-border: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --text: #f0f0f0;
      --ui-bg: rgba(10, 10, 10, 0.85);
      --btn-bg: #f0f0f0;
      --btn-text: #0a0a0a;
      --btn-border: #f0f0f0;
    }
  }
  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .screen {
    background: var(--ui-bg);
    padding: 2.5rem 2rem;
    border: 1px solid var(--text);
    text-align: center;
    display: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    pointer-events: none;
    min-width: 250px;
  }
  .screen.active {
    display: block;
  }
  h1 { margin: 0 0 1rem 0; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px;}
  p { margin: 0 0 2rem 0; line-height: 1.5; font-size: 0.95rem; opacity: 0.9; }
  button {
    pointer-events: auto;
    font-family: inherit;
    font-size: 1.1rem;
    padding: 1rem 2.5rem;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 2px solid var(--btn-border);
    cursor: pointer;
    text-transform: uppercase;
    font-weight: bold;
    letter-spacing: 0.1em;
    transition: transform 0.1s;
  }
  button:active {
    transform: scale(0.95);
  }
  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 20px); 
    left: 20px; right: 20px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 1.2rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    z-index: 5;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud" style="display: none;">
  <span id="scoreEl">0</span>
  <span id="levelEl">LVL 1</span>
</div>
<div id="ui">
  <div id="startScreen" class="screen active">
    <h1>Lumin Shaft</h1>
    <p>Swipe to move.<br>Tap/Flick down to shoot.<br>Match 3+ crystals.<br>Beware the dark.</p>
    <button data-smoke="start" id="startBtn">Descend</button>
  </div>
  <div id="gameOverScreen" class="screen">
    <h1>Crushed</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <button data-smoke="restart" id="restartBtn">Replay</button>
  </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) return;

    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('scoreEl');
    const levelEl = document.getElementById('levelEl');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let state = 'TITLE'; 
    let score = 0;
    let level = 1;
    let lastTime = performance.now();
    let isAnimating = false;
    let particles = [];
    let floatingTexts = [];

    const COLS = 7;
    const ROWS = 13;
    let cellW = 0;
    let cellH = 0;
    let boardOffsetX = 0;
    let boardOffsetY = 0;
    let grid = []; 
    let pushOffset = 0;
    let pushTimer = 0;

    let wallLeft = 0;
    let wallRight = COLS - 1;

    let playerX = 3;
    let playerGem = null;
    let fallingGem = null; 

    let pendingMatches = false;
    let matchTimer = 0;
    let gravityWaitTimer = 0;
    let shakeAmount = 0;
    let chainCount = 0;
    let shatteringGems = [];
    let revealingGems = [];

    const COLORS = [
        {h: 350, s: 80, l: 55}, // Red
        {h: 150, s: 80, l: 45}, // Green
        {h: 210, s: 90, l: 65}, // Blue
        {h: 40, s: 90, l: 60},  // Amber
        {h: 180, s: 90, l: 60}  // Cyan
    ];

    let audioCtx = null;
    function initAudio() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        } catch(e) {}
    }
    function playTone(freq, type, duration, vol=0.1) {
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    let isLightMode = !(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            isLightMode = !e.matches;
        });
    }

    function resize() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        let wConstraint = canvas.width / COLS;
        let hConstraint = canvas.height / (ROWS + 2);
        cellW = Math.min(wConstraint, hConstraint);
        cellH = cellW;
        boardOffsetX = (canvas.width - cellW * COLS) / 2;
        boardOffsetY = canvas.height - (cellH * ROWS) - 20;
    }
    window.addEventListener('resize', resize);
    resize();

    function initGrid() {
        grid = [];
        for (let r = 0; r < ROWS; r++) {
            grid.push(new Array(COLS).fill(null));
        }
        for (let r = ROWS - 5; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = getRandomGem(c, true);
            }
        }
    }

    function getRandomGem(c, forceSafe = false) {
        let maxColors = Math.min(3 + Math.floor((level - 1) / 2), COLORS.length);
        let color = Math.floor(Math.random() * maxColors);
        let isBlack = false;
        if (!forceSafe && level > 1) {
            isBlack = Math.random() < Math.min(0.15, 0.05 + level * 0.02);
        }
        return { color, isBlack, type: 'gem', yOffset: 0 };
    }

    function spawnPlayerGem() {
        playerGem = getRandomGem(0, true);
        fallingGem = null;
        playerX = Math.floor(COLS / 2);
        if (playerX < wallLeft) playerX = wallLeft;
        if (playerX > wallRight) playerX = wallRight;
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    function startGame() {
        initAudio();
        state = 'PLAYING';
        score = 0;
        level = 1;
        wallLeft = 0;
        wallRight = COLS - 1;
        pushOffset = 0;
        pushTimer = 0;
        particles = [];
        floatingTexts = [];
        isAnimating = false;
        chainCount = 0;
        
        startScreen.classList.remove('active');
        gameOverScreen.classList.remove('active');
        hud.style.display = 'flex';
        updateHUD();
        
        initGrid();
        spawnPlayerGem();
    }

    function triggerGameOver() {
        state = 'GAMEOVER';
        finalScoreEl.innerText = score;
        gameOverScreen.classList.add('active');
        hud.style.display = 'none';
        playTone(150, 'sawtooth', 0.5);
        if (navigator.vibrate) try { navigator.vibrate([100, 50, 100]); } catch(e){}
    }

    function updateHUD() {
        scoreEl.innerText = score;
        levelEl.innerText = 'LVL ' + level;
    }

    let isDragging = false;
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('pointerdown', e => {
        if (state !== 'PLAYING') return;
        e.preventDefault();
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        
        isDragging = true;
        touchStartX = e.clientX;
        touchStartY = e.clientY;
        updatePlayerPos(e.clientX);
    });

    canvas.addEventListener('pointermove', e => {
        if (!isDragging || state !== 'PLAYING') return;
        e.preventDefault();
        let dx = e.clientX - touchStartX;
        let dy = e.clientY - touchStartY;
        
        if (dy > 40 && Math.abs(dy) > Math.abs(dx)) {
            shoot();
            isDragging = false;
        } else {
            updatePlayerPos(e.clientX);
        }
    });

    canvas.addEventListener('pointerup', e => {
        if (state !== 'PLAYING') return;
        e.preventDefault();
        if (isDragging) {
            let dx = e.clientX - touchStartX;
            let dy = e.clientY - touchStartY;
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
                shoot();
            }
        }
        isDragging = false;
    });

    canvas.addEventListener('pointercancel', () => isDragging = false);

    window.addEventListener('keydown', e => {
        if (state !== 'PLAYING' || fallingGem) return;
        if (e.key === 'ArrowLeft') {
            playerX = Math.max(wallLeft, playerX - 1);
        } else if (e.key === 'ArrowRight') {
            playerX = Math.min(wallRight, playerX + 1);
        } else if (e.key === 'ArrowDown' || e.key === ' ') {
            shoot();
        }
    });

    function updatePlayerPos(clientX) {
        if (fallingGem) return; 
        let x = clientX - boardOffsetX;
        let col = Math.floor(x / cellW);
        if (col < wallLeft) col = wallLeft;
        if (col > wallRight) col = wallRight;
        playerX = col;
    }

    function shoot() {
        if (fallingGem || state !== 'PLAYING' || !playerGem) return;
        fallingGem = {
            x: playerX,
            y: -1, 
            color: playerGem.color,
            isBlack: false,
            type: 'gem'
        };
        playerGem = null;
        playTone(600, 'sine', 0.1);
        if (navigator.vibrate) try { navigator.vibrate(10); } catch(e){}
    }

    const FALL_SPEED = 25; 

    function gameLoop(time) {
        requestAnimationFrame(gameLoop);
        let dt = (time - lastTime) / 1000;
        lastTime = time;
        if (dt > 0.1) dt = 0.1; 
        
        if (state === 'PLAYING') {
            updateGame(dt);
        }
        draw(dt);
    }

    function updateGame(dt) {
        shakeAmount = Math.max(0, shakeAmount - dt * 20);
        updateParticles(dt);
        updateFloatingTexts(dt);
        
        if (pendingMatches) {
            isAnimating = true;
            matchTimer -= dt;
            if (matchTimer <= 0) resolveMatches();
            return;
        }
        
        if (gravityWaitTimer > 0) {
            isAnimating = true;
            gravityWaitTimer -= dt;
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c] && grid[r][c].yOffset > 0) {
                        grid[r][c].yOffset -= dt * FALL_SPEED * 2 * cellH; 
                        if (grid[r][c].yOffset < 0) grid[r][c].yOffset = 0;
                    }
                }
            }
            
            if (gravityWaitTimer <= 0) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (grid[r][c]) grid[r][c].yOffset = 0;
                    }
                }
                if (!checkMatches()) {
                    updateLevel();
                    if (!playerGem) spawnPlayerGem();
                }
            }
            return;
        }
        
        isAnimating = fallingGem != null;
        
        if (fallingGem) {
            fallingGem.y += FALL_SPEED * dt;
            let hitR = Math.floor(fallingGem.y + 1); 
            let hit = false;
            if (hitR >= ROWS) {
                hit = true;
                fallingGem.y = ROWS - 1;
            } else if (hitR >= 0 && grid[hitR][fallingGem.x] !== null) {
                hit = true;
                fallingGem.y = hitR - 1;
            }
            
            if (hit) {
                let finalR = Math.round(fallingGem.y);
                if (finalR < 0) {
                    triggerGameOver();
                    return;
                }
                grid[finalR][fallingGem.x] = {
                    color: fallingGem.color,
                    isBlack: false,
                    type: 'gem',
                    yOffset: 0
                };
                fallingGem = null;
                shakeAmount = 2;
                playTone(200, 'square', 0.1);
                if (navigator.vibrate) try { navigator.vibrate(20); } catch(e){}
                
                if (!checkMatches()) {
                    updateLevel();
                    spawnPlayerGem();
                }
            }
        } else {
            pushTimer += dt;
            let pushInterval = Math.max(1.5, 6.0 - level * 0.6);
            pushOffset = (pushTimer / pushInterval) * cellH;
            
            if (pushTimer >= pushInterval) {
                pushTimer = 0;
                pushOffset = 0;
                pushRowUp();
            }
        }
    }

    function pushRowUp() {
        for (let c = wallLeft; c <= wallRight; c++) {
            if (grid[0][c] !== null) {
                triggerGameOver();
                return;
            }
        }
        for (let r = 0; r < ROWS - 1; r++) {
            grid[r] = grid[r + 1];
        }
        let newRow = [];
        for (let c = 0; c < COLS; c++) {
            if (c < wallLeft || c > wallRight) {
                newRow.push({ type: 'stone' });
            } else {
                newRow.push(getRandomGem(c));
            }
        }
        grid[ROWS - 1] = newRow;
        checkMatches();
    }

    function checkMatches() {
        let matched = new Set();
        let visited = Array.from({length: ROWS}, () => new Array(COLS).fill(false));
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = wallLeft; c <= wallRight; c++) {
                if (visited[r][c]) continue;
                let gem = grid[r][c];
                if (!gem || gem.type !== 'gem' || gem.isBlack) {
                    visited[r][c] = true;
                    continue;
                }
                
                let cluster = [];
                let stack = [{r, c}];
                let color = gem.color;
                
                while (stack.length > 0) {
                    let curr = stack.pop();
                    let cr = curr.r, cc = curr.c;
                    if (cr < 0 || cr >= ROWS || cc < wallLeft || cc > wallRight) continue;
                    if (visited[cr][cc]) continue;
                    
                    let cg = grid[cr][cc];
                    if (!cg || cg.type !== 'gem' || cg.isBlack || cg.color !== color) continue;
                    
                    visited[cr][cc] = true;
                    cluster.push({r: cr, c: cc});
                    
                    stack.push({r: cr - 1, c: cc});
                    stack.push({r: cr + 1, c: cc});
                    stack.push({r: cr, c: cc - 1});
                    stack.push({r: cr, c: cc + 1});
                }
                
                if (cluster.length >= 3) {
                    cluster.forEach(p => matched.add(`${p.r},${p.c}`));
                }
            }
        }
        
        if (matched.size > 0) {
            chainCount++;
            shatteringGems = [];
            revealingGems = [];
            
            let pts = 10 * Math.pow(2, chainCount - 1) * matched.size;
            score += pts;
            updateHUD();
            
            let matchedArray = [];
            matched.forEach(pos => {
                let [r, c] = pos.split(',').map(Number);
                shatteringGems.push({r, c});
                matchedArray.push({r, c});
                
                let dirs = [[-1,0], [1,0], [0,-1], [0,1]];
                dirs.forEach(d => {
                    let nr = r + d[0];
                    let nc = c + d[1];
                    if (nr >= 0 && nr < ROWS && nc >= wallLeft && nc <= wallRight) {
                        let ng = grid[nr][nc];
                        if (ng && ng.type === 'gem' && ng.isBlack) {
                            revealingGems.push({r: nr, c: nc});
                        }
                    }
                });
            });

            let centerC = matchedArray.reduce((acc, p) => acc + p.c, 0) / matchedArray.length;
            let centerR = matchedArray.reduce((acc, p) => acc + p.r, 0) / matchedArray.length;
            if (chainCount > 1) {
                createFloatingText(chainCount + "x CHAIN", centerC, centerR, '#ffdd00');
            }
            createFloatingText("+" + pts, centerC, centerR + 0.8, '#ffffff');
            
            playTone(400 + chainCount * 100, 'square', 0.15);
            if (navigator.vibrate) try { navigator.vibrate(30); } catch(e){}
            
            pendingMatches = true;
            matchTimer = 0.3; 
            return true;
        } else {
            chainCount = 0; 
            return false;
        }
    }

    function resolveMatches() {
        pendingMatches = false;
        shatteringGems.forEach(p => {
            let gem = grid[p.r][p.c];
            if (gem) {
                createParticles(p.c, p.r, getGemColorStr(gem.color), 8);
                grid[p.r][p.c] = null;
            }
        });
        
        revealingGems.forEach(p => {
            let gem = grid[p.r][p.c];
            if (gem && gem.isBlack) {
                gem.isBlack = false;
                gem.color = Math.floor(Math.random() * COLORS.length);
                createParticles(p.c, p.r, '#ffffff', 5);
            }
        });
        
        let moved = false;
        for (let c = wallLeft; c <= wallRight; c++) {
            let writeR = ROWS - 1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (grid[r][c] !== null) {
                    if (writeR !== r) {
                        grid[writeR][c] = grid[r][c];
                        grid[r][c] = null;
                        grid[writeR][c].yOffset = (writeR - r) * cellH; 
                        moved = true;
                    }
                    writeR--;
                }
            }
        }
        
        if (moved) {
            playTone(300, 'triangle', 0.1);
        }
        gravityWaitTimer = moved ? 0.25 : 0.05;
    }

    function updateLevel() {
        let oldLevel = level;
        level = Math.floor(score / 800) + 1;
        if (level > oldLevel) {
            updateHUD();
            playTone(800, 'square', 0.3);
            
            let narrowAmt = level - 1;
            if (narrowAmt > 2) narrowAmt = 2; 
            
            wallLeft = narrowAmt;
            wallRight = (COLS - 1) - narrowAmt;
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (c < wallLeft || c > wallRight) {
                        if (grid[r][c] && grid[r][c].type !== 'stone') {
                            grid[r][c] = { type: 'stone' };
                            createParticles(c, r, '#888888', 5);
                        } else if (!grid[r][c]) {
                            grid[r][c] = { type: 'stone' };
                        }
                    }
                }
            }
            
            if (playerX < wallLeft) playerX = wallLeft;
            if (playerX > wallRight) playerX = wallRight;
        }
    }

    function getGemColorStr(idx) {
        let c = COLORS[idx];
        return `hsl(${c.h}, ${c.s}%, ${c.l}%)`;
    }
    function getGemColorDark(idx) {
        let c = COLORS[idx];
        return `hsl(${c.h}, ${c.s}%, ${Math.max(0, c.l - 20)}%)`;
    }
    function getGemColorLight(idx) {
        let c = COLORS[idx];
        return `hsl(${c.h}, ${c.s}%, ${Math.min(100, c.l + 20)}%)`;
    }

    function drawGem(x, y, size, gem, alpha = 1) {
        ctx.save();
        ctx.translate(x + size/2, y + size/2);
        ctx.globalAlpha = alpha;
        
        let pad = size * 0.08;
        let s = size/2 - pad;
        
        if (gem.type === 'stone') {
            ctx.fillStyle = '#444';
            ctx.fillRect(-s, -s, s*2, s*2);
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.moveTo(-s, -s); ctx.lineTo(s, -s); ctx.lineTo(0, 0); ctx.fill();
            ctx.restore();
            return;
        }
        
        if (gem.isBlack) {
            ctx.fillStyle = '#222';
            ctx.beginPath();
            let off = s * 0.4;
            ctx.moveTo(-off, -s); ctx.lineTo(off, -s); ctx.lineTo(s, -off); ctx.lineTo(s, off);
            ctx.lineTo(off, s); ctx.lineTo(-off, s); ctx.lineTo(-s, off); ctx.lineTo(-s, -off);
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(0, 0, s*0.3, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.fillStyle = getGemColorStr(gem.color);
            ctx.beginPath();
            if (gem.color === 0) {
                ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
            } else if (gem.color === 1) {
                ctx.moveTo(-s*0.5, -s); ctx.lineTo(s*0.5, -s); ctx.lineTo(s, 0);
                ctx.lineTo(s*0.5, s); ctx.lineTo(-s*0.5, s); ctx.lineTo(-s, 0);
            } else if (gem.color === 2) {
                ctx.rect(-s*0.8, -s*0.8, s*1.6, s*1.6);
            } else if (gem.color === 3) {
                ctx.moveTo(0, -s); ctx.lineTo(s, s); ctx.lineTo(-s, s);
            } else {
                ctx.arc(0, 0, s, 0, Math.PI*2);
            }
            ctx.fill();
            
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            if (gem.color === 0 || gem.color === 3) {
                ctx.moveTo(0, -s); ctx.lineTo(0, 0); ctx.lineTo(-s*0.5, 0);
            } else if (gem.color === 1) {
                ctx.moveTo(-s*0.5, -s); ctx.lineTo(0, -s); ctx.lineTo(0, 0); ctx.lineTo(-s, 0);
            } else if (gem.color === 2) {
                ctx.rect(-s*0.8, -s*0.8, s*0.8, s*0.8);
            } else {
                ctx.arc(0, 0, s*0.6, Math.PI, Math.PI*1.5);
                ctx.lineTo(0,0);
            }
            ctx.fill();
        }
        ctx.restore();
    }

    function createParticles(c, r, colorStr, count) {
        let px = boardOffsetX + c * cellW + cellW/2;
        let py = boardOffsetY + r * cellH + cellH/2 - pushOffset;
        for (let i = 0; i < count; i++) {
            particles.push({
                x: px, y: py,
                vx: (Math.random() - 0.5) * 300,
                vy: (Math.random() - 0.5) * 300,
                life: 1.0,
                decay: 1.0 + Math.random() * 2,
                size: Math.random() * 4 + 2,
                color: colorStr
            });
        }
    }

    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= p.decay * dt;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function createFloatingText(text, c, r, color) {
        let px = boardOffsetX + c * cellW + cellW/2;
        let py = boardOffsetY + r * cellH - pushOffset;
        floatingTexts.push({ text, x: px, y: py, life: 1.0, color });
    }

    function updateFloatingTexts(dt) {
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y -= 30 * dt;
            ft.life -= dt;
            if (ft.life <= 0) floatingTexts.splice(i, 1);
        }
    }

    function draw(dt) {
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg').trim();
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = isLightMode ? 'rgba(0, 0, 0, 0.04)' : 'rgba(255, 255, 255, 0.04)';
        ctx.fillRect(boardOffsetX + wallLeft * cellW, boardOffsetY, (wallRight - wallLeft + 1) * cellW, ROWS * cellH);
        
        ctx.strokeStyle = isLightMode ? 'rgba(0, 0, 0, 0.08)' : 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let c = wallLeft; c <= wallRight + 1; c++) {
            let lx = boardOffsetX + c * cellW;
            ctx.moveTo(lx, boardOffsetY);
            ctx.lineTo(lx, boardOffsetY + ROWS * cellH);
        }
        ctx.stroke();
        
        ctx.save();
        let sx = (Math.random() - 0.5) * shakeAmount * 8;
        let sy = (Math.random() - 0.5) * shakeAmount * 8;
        ctx.translate(sx, sy);
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let gem = grid[r][c];
                if (gem) {
                    let dx = boardOffsetX + c * cellW;
                    let dy = boardOffsetY + r * cellH - pushOffset - (gem.yOffset || 0);
                    let isShattering = pendingMatches && shatteringGems.some(p => p.r === r && p.c === c);
                    if (isShattering) {
                        let scale = Math.max(0, matchTimer / 0.3);
                        let shift = (cellW - cellW * scale) / 2;
                        drawGem(dx + shift, dy + shift, cellW * scale, gem);
                    } else {
                        drawGem(dx, dy, cellW, gem);
                    }
                }
            }
        }
        
        if (playerGem && state === 'PLAYING') {
            let px = boardOffsetX + playerX * cellW;
            let py = boardOffsetY - cellH; 
            drawGem(px, py, cellW, playerGem);
            
            ctx.fillStyle = isLightMode ? 'rgba(0, 0, 0, 0.1)' : 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(px + cellW/2 - 1, py + cellH, 2, ROWS * cellH);
        }
        
        if (fallingGem && state === 'PLAYING') {
            let fx = boardOffsetX + fallingGem.x * cellW;
            let fy = boardOffsetY + fallingGem.y * cellH - pushOffset;
            drawGem(fx, fy, cellW, fallingGem);
        }
        
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });
        
        floatingTexts.forEach(ft => {
            ctx.fillStyle = ft.color;
            ctx.globalAlpha = Math.max(0, ft.life);
            ctx.font = "bold 1.2rem ui-monospace, 'SFMono-Regular', Menlo, monospace";
            ctx.textAlign = "center";
            ctx.shadowColor = "rgba(0,0,0,0.8)";
            ctx.shadowBlur = 4;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        });
        
        ctx.restore();
        
        let lampX = boardOffsetX + playerX * cellW + cellW/2;
        if (fallingGem) lampX = boardOffsetX + fallingGem.x * cellW + cellW/2;
        let lampY = boardOffsetY - cellH/2;
        
        let grad = ctx.createRadialGradient(lampX, lampY, cellW * 1.5, lampX, lampY, cellH * 9);
        let flicker = Math.random() * 0.03;
        if (isLightMode) {
            grad.addColorStop(0, `rgba(244, 244, 240, ${0 + flicker})`);
            grad.addColorStop(1, 'rgba(244, 244, 240, 0.95)'); 
        } else {
            grad.addColorStop(0, `rgba(10, 10, 10, ${0 + flicker})`);
            grad.addColorStop(1, 'rgba(10, 10, 10, 0.98)'); 
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    initGrid(); // Draw idle grid initially
    requestAnimationFrame(gameLoop);
})();
</script>
