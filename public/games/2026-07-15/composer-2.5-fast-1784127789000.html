<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Lanes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  :root {
    --bg: #b8c8d8;
    --fg: #142028;
    --muted: #4a6070;
    --neon: #00c8b0;
    --amber: #e08820;
    --coral: #e05868;
    --panel: rgba(255,255,255,0.93);
    --lane-a: #00b8a8;
    --lane-b: #e09018;
    --lane-c: #38a8d8;
    --lane-d: #58c878;
    --lane-e: #d87048;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #080c12;
      --fg: #e4ecf4;
      --muted: #7a8a9a;
      --neon: #00ffd0;
      --amber: #ffb830;
      --coral: #ff6880;
      --panel: rgba(8,12,18,0.94);
      --lane-a: #00ffd8;
      --lane-b: #ffb830;
      --lane-c: #48c8ff;
      --lane-d: #68e890;
      --lane-e: #ff8858;
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    min-height: 100dvh;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1.5rem;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.45s ease, visibility 0.45s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
    border-radius: 14px;
    padding: 1.75rem 1.5rem;
    max-width: 22rem;
    width: 90%;
    text-align: center;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    pointer-events: none;
  }
  h1 {
    font-size: clamp(1.2rem, 5vw, 1.75rem);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 0.35rem;
  }
  .tagline {
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 1rem;
  }
  .neon-line {
    height: 2px;
    width: 62%;
    margin: 0 auto 1rem;
    background: linear-gradient(90deg, transparent, var(--amber), var(--neon), transparent);
    border-radius: 2px;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 168px;
    padding: 0.85rem 2rem;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: var(--neon);
    color: #081018;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
    box-shadow: 0 0 22px color-mix(in srgb, var(--neon) 42%, transparent);
  }
  button[data-smoke]:active { transform: scale(0.96); }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: max(0.65rem, env(safe-area-inset-top)) 1rem 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #hud.visible { opacity: 1; }
  .hud-block { display: flex; flex-direction: column; gap: 0.1rem; }
  .hud-label { color: var(--muted); font-size: 0.58rem; text-transform: uppercase; }
  .hud-val { font-size: 0.95rem; font-weight: 600; }
  .chain-dots { display: flex; gap: 3px; margin-top: 3px; }
  .chain-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: color-mix(in srgb, var(--muted) 35%, transparent);
    transition: background 0.25s, box-shadow 0.25s;
  }
  .chain-dot.on {
    background: var(--neon);
    box-shadow: 0 0 5px var(--neon);
  }
  .final-score { font-size: 2rem; font-weight: 700; color: var(--neon); margin: 0.4rem 0; }
  .stats-row {
    display: flex; justify-content: center; gap: 1.1rem;
    font-size: 0.68rem; color: var(--muted); margin-bottom: 0.85rem;
  }
  .win-title { color: var(--amber); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span class="hud-val" id="score-val">0</span>
      <div class="chain-dots" id="chain-dots"></div>
    </div>
    <div class="hud-block" style="align-items:center;text-align:center">
      <span class="hud-label" id="bpm-label">128 BPM</span>
      <span class="hud-val" id="combo-val">×0</span>
    </div>
    <div class="hud-block" style="align-items:flex-end;text-align:right">
      <span class="hud-label">Loop</span>
      <span class="hud-val" id="loop-val">0/8</span>
      <span class="hud-val" id="time-val">30</span>
    </div>
  </div>
  <div id="title-overlay" class="overlay">
    <div class="panel">
      <h1>Stutter Lanes</h1>
      <div class="neon-line"></div>
      <p class="tagline">Summer fog. Neon drops.<br>Switch lanes · tap the stutter beat.<br>Chain synth fragments before the loop resets.</p>
      <button type="button" data-smoke="start">Drop In</button>
    </div>
  </div>
  <div id="over-overlay" class="overlay hidden">
    <div class="panel">
      <h1 id="over-title">Loop Cut</h1>
      <div class="neon-line"></div>
      <div class="final-score" id="final-score">0</div>
      <div class="stats-row">
        <span id="stat-perfect">0 perfect</span>
        <span id="stat-chain">0 chains</span>
      </div>
      <button type="button" data-smoke="restart">Ride Again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  var ROUND_SEC = 30;
  var MAX_MISS = 4;
  var CHAIN_LEN = 8;
  var LANE_COLORS = ['var(--lane-a)', 'var(--lane-b)', 'var(--lane-c)', 'var(--lane-d)', 'var(--lane-e)'];

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var hud = document.getElementById('hud');
  var scoreEl = document.getElementById('score-val');
  var comboEl = document.getElementById('combo-val');
  var bpmEl = document.getElementById('bpm-label');
  var timeEl = document.getElementById('time-val');
  var loopEl = document.getElementById('loop-val');
  var chainDotsEl = document.getElementById('chain-dots');
  var titleOverlay = document.getElementById('title-overlay');
  var overOverlay = document.getElementById('over-overlay');
  var overTitle = document.getElementById('over-title');
  var finalScoreEl = document.getElementById('final-score');
  var statPerfect = document.getElementById('stat-perfect');
  var statChain = document.getElementById('stat-chain');
  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');

  var W = 360, H = 640, dpr = 1;
  var state = STATE.TITLE;
  var notes = [];
  var particles = [];
  var fogBands = [];
  var wavePoints = [];
  var floatTexts = [];
  var score = 0, combo = 0, maxCombo = 0, perfects = 0;
  var misses = 0, timeLeft = ROUND_SEC, roundStart = 0;
  var laneCount = 3, playerLane = 1;
  var chainPos = 0, chainsCompleted = 0;
  var shakeT = 0, hitFlash = 0, missFlash = 0, beatPulse = 0;
  var laneFlash = -1, switchAnim = 0;
  var audioCtx = null, masterGain = null;
  var lastFrame = 0, isDark = false;
  var nextBeatSound = -1;
  var hitLineY = 0, laneH = 0, laneTop = 0;

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  }

  function cssVar(name) {
    try {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#00ffd0';
    } catch (e) { return '#00ffd0'; }
  }

  function laneColor(i) {
    var names = ['--lane-a', '--lane-b', '--lane-c', '--lane-d', '--lane-e'];
    return cssVar(names[i % names.length]);
  }

  function pal() {
    return {
      bg: cssVar('--bg'),
      fg: cssVar('--fg'),
      muted: cssVar('--muted'),
      neon: cssVar('--neon'),
      amber: cssVar('--amber'),
      coral: cssVar('--coral')
    };
  }

  function bpmAt(t) {
    var p = Math.min(1, Math.max(0, t / ROUND_SEC));
    return 128 + 52 * Math.pow(p, 1.15);
  }

  function laneCountAt(t) {
    if (t < 8) return 3;
    if (t < 16) return 4;
    return 5;
  }

  function hitWindowAt(t) {
    var p = Math.min(1, Math.max(0, t / ROUND_SEC));
    return 0.14 - 0.06 * Math.pow(p, 1.3);
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.32;
      masterGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }

  function resumeAudio() {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function tone(freq, dur, type, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      resumeAudio();
      var t0 = audioCtx.currentTime;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.1, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  function kick() {
    if (!audioCtx || !masterGain) return;
    try {
      resumeAudio();
      var t0 = audioCtx.currentTime;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.frequency.setValueAtTime(140, t0);
      o.frequency.exponentialRampToValueAtTime(42, t0 + 0.07);
      g.gain.setValueAtTime(0.38, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + 0.15);
    } catch (e) {}
  }

  function stutterClick() {
    if (!audioCtx) return;
    try {
      resumeAudio();
      var t0 = audioCtx.currentTime;
      var len = Math.floor(audioCtx.sampleRate * 0.025);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = audioCtx.createBufferSource();
      var g = audioCtx.createGain();
      src.buffer = buf;
      g.gain.value = 0.07;
      src.connect(g); g.connect(masterGain);
      src.start(t0);
    } catch (e) {}
  }

  function playFragment(lane, chainIdx) {
    var freqs = [220, 277, 330, 392, 440, 523, 587, 659];
    var f = freqs[(lane + chainIdx) % freqs.length];
    tone(f, 0.1, 'triangle', 0.11);
    tone(f * 2, 0.06, 'sine', 0.05);
    stutterClick();
  }

  function playHit(q) {
    kick();
    tone(180 + combo * 4, 0.06, 'triangle', q === 'perfect' ? 0.12 : 0.07);
  }

  function playMiss() {
    tone(55, 0.2, 'sawtooth', 0.09);
  }

  function playSwitch() {
    tone(880, 0.04, 'sine', 0.04);
  }

  function playChainComplete() {
    tone(330, 0.12, 'triangle', 0.1);
    tone(440, 0.15, 'triangle', 0.08);
    tone(554, 0.2, 'sine', 0.06);
  }

  function playWin() {
    tone(392, 0.14, 'triangle', 0.1);
    tone(523, 0.18, 'triangle', 0.08);
    tone(659, 0.24, 'sine', 0.06);
  }

  function buildNotes() {
    var list = [];
    var t = 1.2;
    var beatIdx = 0;
    var expectedLane = 1;
    var stutterPhase = 0;

    while (t < ROUND_SEC - 0.3) {
      var bpm = bpmAt(t);
      var beat = 60 / bpm;
      var lanes = laneCountAt(t);
      var barPos = beatIdx % 4;

      if (barPos === 0) {
        expectedLane = Math.floor(Math.random() * lanes);
        stutterPhase = 0;
      }

      if (barPos === 0 || barPos === 2) {
        list.push({
          time: t,
          lane: expectedLane,
          type: 'drop',
          hit: false,
          missed: false,
          resolved: false,
          chainIdx: chainPos
        });
      }

      if (barPos === 1 && beatIdx > 6 && stutterPhase < 2) {
        list.push({
          time: t,
          lane: expectedLane,
          type: 'stutter',
          hit: false,
          missed: false,
          resolved: false,
          chainIdx: chainPos
        });
        stutterPhase++;
      }

      if (barPos === 3 && beatIdx > 12 && Math.random() < 0.35) {
        var ghostLane = (expectedLane + 1 + Math.floor(Math.random() * (lanes - 1))) % lanes;
        list.push({
          time: t + beat * 0.5,
          lane: ghostLane,
          type: 'ghost',
          hit: false,
          missed: false,
          resolved: false,
          chainIdx: -1
        });
      }

      t += beat;
      beatIdx++;
    }
    list.sort(function (a, b) { return a.time - b.time; });
    return list;
  }

  function initFog() {
    fogBands = [];
    for (var i = 0; i < 10; i++) {
      fogBands.push({
        y: Math.random() * H,
        x: Math.random() * W * 1.2 - W * 0.1,
        w: W * (0.25 + Math.random() * 0.55),
        h: 16 + Math.random() * 36,
        spd: 4 + Math.random() * 14,
        a: 0.06 + Math.random() * 0.12
      });
    }
  }

  function initWave() {
    wavePoints = [];
    for (var i = 0; i <= 64; i++) wavePoints.push(0);
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    laneTop = H * 0.14;
    laneH = (H * 0.58) / Math.max(laneCount, 3);
    hitLineY = laneTop + laneH * laneCount + H * 0.04;
    initFog();
    initWave();
  }

  function renderChainDots() {
    if (!chainDotsEl) return;
    chainDotsEl.innerHTML = '';
    for (var i = 0; i < CHAIN_LEN; i++) {
      var d = document.createElement('span');
      d.className = 'chain-dot' + (i < chainPos ? ' on' : '');
      chainDotsEl.appendChild(d);
    }
  }

  function resetGame() {
    notes = buildNotes();
    particles = [];
    floatTexts = [];
    score = 0; combo = 0; maxCombo = 0; perfects = 0;
    misses = 0; timeLeft = ROUND_SEC;
    laneCount = 3; playerLane = 1;
    chainPos = 0; chainsCompleted = 0;
    shakeT = 0; hitFlash = 0; missFlash = 0; beatPulse = 0;
    laneFlash = -1; switchAnim = 0;
    nextBeatSound = -1;
    roundStart = performance.now();
    laneH = (H * 0.58) / laneCount;
    renderChainDots();
    updateHud();
  }

  function startGame() {
    initAudio();
    resetGame();
    state = STATE.PLAY;
    if (titleOverlay) titleOverlay.classList.add('hidden');
    if (overOverlay) overOverlay.classList.add('hidden');
    if (hud) hud.classList.add('visible');
    if (navigator.vibrate) try { navigator.vibrate(24); } catch (e) {}
  }

  function endGame(victory) {
    state = STATE.OVER;
    if (hud) hud.classList.remove('visible');
    if (overOverlay) overOverlay.classList.remove('hidden');
    if (overTitle) {
      overTitle.textContent = victory ? 'Full Drop' : 'Loop Cut';
      overTitle.className = victory ? 'win-title' : '';
    }
    if (finalScoreEl) finalScoreEl.textContent = String(score);
    if (statPerfect) statPerfect.textContent = perfects + ' perfect';
    if (statChain) statChain.textContent = chainsCompleted + ' chains';
    if (victory) playWin();
    if (navigator.vibrate) try { navigator.vibrate(victory ? [16, 32, 16] : [40, 24, 40]); } catch (e) {}
  }

  function updateHud() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) comboEl.textContent = '×' + combo;
    if (timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
    if (loopEl) loopEl.textContent = chainPos + '/' + CHAIN_LEN;
    if (bpmEl && state === STATE.PLAY) {
      var el = (performance.now() - roundStart) / 1000;
      bpmEl.textContent = Math.round(bpmAt(el)) + ' BPM';
    }
  }

  function gameTime(now) {
    return (now - roundStart) / 1000;
  }

  function addFloat(text, x, y, col) {
    floatTexts.push({ text: text, x: x, y: y, col: col, life: 0.65, vy: -1.2 });
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 2 + Math.random() * 4;
      particles.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.2,
        life: 0.25 + Math.random() * 0.3, max: 0.55,
        col: col, sz: 2 + Math.random() * 3
      });
    }
  }

  function switchLane(dir) {
    if (state !== STATE.PLAY) return;
    var newLane = playerLane + dir;
    if (newLane < 0 || newLane >= laneCount) return;
    playerLane = newLane;
    switchAnim = 1;
    laneFlash = playerLane;
    playSwitch();
    if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
  }

  function advanceChain(lane) {
    chainPos++;
    playFragment(lane, chainPos);
    renderChainDots();
    if (chainPos >= CHAIN_LEN) {
      chainsCompleted++;
      chainPos = 0;
      renderChainDots();
      score += 200 + combo * 10;
      addFloat('LOOP!', W * 0.5, hitLineY - 40, pal().amber);
      playChainComplete();
      burst(W * 0.5, hitLineY, pal().neon, 20);
      if (navigator.vibrate) try { navigator.vibrate([12, 20, 12]); } catch (e) {}
    }
  }

  function registerHit(note, quality) {
    note.hit = true;
    note.resolved = true;
    var pts = quality === 'perfect' ? 100 : 60;
    if (note.type === 'stutter') pts += 20;
    score += pts + combo * 8;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    if (quality === 'perfect') perfects++;
    hitFlash = 1;
    beatPulse = 1;
    playHit(quality);
    var lx = laneCenter(note.lane);
    burst(lx, hitLineY, laneColor(note.lane), quality === 'perfect' ? 14 : 8);
    addFloat(quality === 'perfect' ? 'PERFECT' : 'NICE', lx, hitLineY - 28, laneColor(note.lane));
    if (note.type !== 'ghost') advanceChain(note.lane);
    if (navigator.vibrate) try { navigator.vibrate(quality === 'perfect' ? 18 : 10); } catch (e) {}
  }

  function registerMiss(reason) {
    if (state !== STATE.PLAY) return;
    misses++;
    combo = 0;
    missFlash = 1;
    shakeT = 0.25;
    playMiss();
    addFloat(reason || 'MISS', W * 0.5, hitLineY - 50, pal().coral);
    if (chainPos > 0) {
      chainPos = 0;
      renderChainDots();
      addFloat('RESET', W * 0.5, hitLineY - 70, pal().coral);
    }
    if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
    if (misses >= MAX_MISS) endGame(false);
  }

  function laneCenter(lane) {
    return W * 0.5 + (lane - (laneCount - 1) * 0.5) * (W * 0.22);
  }

  function laneY(lane) {
    return laneTop + lane * laneH + laneH * 0.5;
  }

  function tryHit() {
    if (state !== STATE.PLAY) return;
    var gt = gameTime(performance.now());
    var window_ = hitWindowAt(gt);
    var best = null;
    var bestDist = window_ + 1;
    var nearNote = false;

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.resolved || n.type === 'ghost') continue;
      var dist = Math.abs(n.time - gt);
      if (dist <= window_ * 1.8) nearNote = true;
      if (dist <= window_ && dist < bestDist) {
        best = n;
        bestDist = dist;
      }
    }

    if (!best) {
      if (nearNote) registerMiss('OFF');
      return;
    }

    if (playerLane !== best.lane) {
      registerMiss('WRONG LANE');
      best.missed = true;
      best.resolved = true;
      return;
    }

    var quality = bestDist < window_ * 0.35 ? 'perfect' : 'good';
    registerHit(best, quality);
  }

  function resolveNotes(gt) {
    var window_ = hitWindowAt(gt);
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.resolved) continue;
      if (gt - n.time > window_) {
        n.resolved = true;
        if (!n.hit && n.type !== 'ghost') {
          n.missed = true;
          registerMiss('LATE');
        }
      }
    }
  }

  function updatePlay(now, dt) {
    var gt = gameTime(now);
    timeLeft = ROUND_SEC - gt;

    var newLaneCount = laneCountAt(gt);
    if (newLaneCount !== laneCount) {
      laneCount = newLaneCount;
      laneH = (H * 0.58) / laneCount;
      if (playerLane >= laneCount) playerLane = laneCount - 1;
    }

    resolveNotes(gt);

    if (timeLeft <= 0) {
      endGame(chainsCompleted >= 2 || score >= 800);
      return;
    }

    if (Math.floor(gt * 4) !== nextBeatSound) {
      nextBeatSound = Math.floor(gt * 4);
      var bpm = bpmAt(gt);
      if (Math.round(gt * bpm / 60) % 4 === 0) kick();
    }

    shakeT = Math.max(0, shakeT - dt);
    hitFlash = Math.max(0, hitFlash - dt * 3);
    missFlash = Math.max(0, missFlash - dt * 2.5);
    beatPulse = Math.max(0, beatPulse - dt * 4);
    switchAnim = Math.max(0, switchAnim - dt * 5);
    if (laneFlash >= 0) laneFlash = switchAnim > 0 ? laneFlash : -1;

    for (var f = 0; f < fogBands.length; f++) {
      fogBands[f].x += fogBands[f].spd * dt;
      if (fogBands[f].x > W + 50) {
        fogBands[f].x = -fogBands[f].w - 20;
        fogBands[f].y = Math.random() * H;
      }
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      particles[p].x += particles[p].vx;
      particles[p].y += particles[p].vy;
      particles[p].vy += 0.12;
      particles[p].life -= dt;
      if (particles[p].life <= 0) particles.splice(p, 1);
    }

    for (var t = floatTexts.length - 1; t >= 0; t--) {
      floatTexts[t].y += floatTexts[t].vy;
      floatTexts[t].life -= dt;
      if (floatTexts[t].life <= 0) floatTexts.splice(t, 1);
    }

    var waveAmp = 8 + chainPos * 3 + beatPulse * 18;
    for (var w = 0; w < wavePoints.length; w++) {
      var phase = gt * bpmAt(gt) / 60 * Math.PI * 2;
      wavePoints[w] = Math.sin(w / 8 + phase) * waveAmp * (0.4 + chainPos / CHAIN_LEN * 0.6);
    }

    updateHud();
  }

  function drawBackground() {
    if (!ctx) return;
    var p = pal();
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    if (isDark) {
      grad.addColorStop(0, '#0c1420');
      grad.addColorStop(0.45, '#101820');
      grad.addColorStop(1, '#081018');
    } else {
      grad.addColorStop(0, '#c8d8e8');
      grad.addColorStop(0.45, '#a8bcc8');
      grad.addColorStop(1, '#8898a8');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < fogBands.length; i++) {
      var fb = fogBands[i];
      ctx.fillStyle = isDark
        ? 'rgba(180,200,220,' + fb.a + ')'
        : 'rgba(255,255,255,' + (fb.a + 0.08) + ')';
      ctx.beginPath();
      ctx.ellipse(fb.x + fb.w * 0.5, fb.y, fb.w * 0.5, fb.h * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawLanes() {
    if (!ctx) return;
    var p = pal();

    for (var l = 0; l < laneCount; l++) {
      var ly = laneTop + l * laneH;
      var col = laneColor(l);
      var active = l === playerLane;

      ctx.fillStyle = isDark
        ? (active ? 'rgba(0,255,208,0.06)' : 'rgba(255,255,255,0.02)')
        : (active ? 'rgba(0,180,160,0.08)' : 'rgba(255,255,255,0.15)');
      ctx.fillRect(W * 0.06, ly, W * 0.88, laneH - 2);

      if (active) {
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.5 + switchAnim * 0.5;
        ctx.strokeRect(W * 0.06, ly + 1, W * 0.88, laneH - 4);
        ctx.globalAlpha = 1;
      }

      ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W * 0.06, ly + laneH);
      ctx.lineTo(W * 0.94, ly + laneH);
      ctx.stroke();
    }

    ctx.strokeStyle = p.neon;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.7 + beatPulse * 0.3;
    ctx.beginPath();
    ctx.moveTo(W * 0.04, hitLineY);
    ctx.lineTo(W * 0.96, hitLineY);
    ctx.stroke();
    ctx.globalAlpha = 1;

    var px = laneCenter(playerLane);
    var py = laneY(playerLane);
    ctx.fillStyle = p.neon;
    ctx.shadowColor = p.neon;
    ctx.shadowBlur = 12 + beatPulse * 16;
    ctx.beginPath();
    ctx.arc(px, py, 10 + switchAnim * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawLaneHints(gt) {
    if (!ctx) return;
    var nearest = null;
    var nearestT = 999;
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.resolved || n.type === 'ghost') continue;
      var dt = n.time - gt;
      if (dt > 0 && dt < nearestT && dt < 0.9) {
        nearest = n;
        nearestT = dt;
      }
    }
    if (!nearest) return;
    var lx = laneCenter(nearest.lane);
    var ly = laneY(nearest.lane);
    var col = laneColor(nearest.lane);
    var pulse = 0.5 + Math.sin(gt * 18) * 0.5;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.25 + pulse * 0.35;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(lx, ly - 18);
    ctx.lineTo(lx, hitLineY - 6);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function drawNotes(gt) {
    if (!ctx) return;
    var travelTime = 1.8;
    drawLaneHints(gt);

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.resolved && !n.hit) continue;
      var timeToHit = n.time - gt;
      if (timeToHit < -0.3 || timeToHit > travelTime) continue;

      var prog = 1 - timeToHit / travelTime;
      var lx = laneCenter(n.lane);
      var startY = laneTop - 20;
      var ny = startY + (hitLineY - startY) * prog;
      var col = n.type === 'ghost' ? pal().muted : laneColor(n.lane);
      var alpha = n.type === 'ghost' ? 0.35 : 0.85;
      var r = n.type === 'drop' ? 11 : (n.type === 'stutter' ? 8 : 7);

      if (n.hit) {
        alpha *= Math.max(0, 1 - (gt - n.time) * 4);
        if (alpha <= 0) continue;
      }

      ctx.globalAlpha = alpha;
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = n.type === 'drop' ? 14 : 8;

      if (n.type === 'stutter') {
        ctx.fillRect(lx - r, ny - r * 0.6, r * 2, r * 1.2);
      } else {
        ctx.beginPath();
        ctx.arc(lx, ny, r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (n.type === 'drop' && !n.resolved) {
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = alpha * 0.4;
        ctx.beginPath();
        ctx.moveTo(lx, ny + r);
        ctx.lineTo(lx, hitLineY);
        ctx.stroke();
      }

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }

  function drawWaveform() {
    if (!ctx) return;
    var p = pal();
    var baseY = H * 0.88;
    var waveW = W * 0.88;
    var startX = W * 0.06;

    var chainFrac = chainPos / CHAIN_LEN;
    ctx.strokeStyle = chainFrac > 0.5 ? p.amber : p.neon;
    ctx.lineWidth = 2 + chainFrac * 1.5;
    ctx.globalAlpha = 0.55 + chainFrac * 0.4;
    ctx.beginPath();
    for (var i = 0; i < wavePoints.length; i++) {
      var x = startX + (i / (wavePoints.length - 1)) * waveW;
      var y = baseY + wavePoints[i];
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    if (chainPos > 0) {
      ctx.fillStyle = p.neon;
      ctx.globalAlpha = 0.12 + chainFrac * 0.2;
      ctx.lineTo(startX + waveW, baseY + 20);
      ctx.lineTo(startX, baseY + 20);
      ctx.closePath();
      ctx.fill();
    }

    ctx.strokeStyle = p.amber;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.25;
    ctx.beginPath();
    ctx.moveTo(startX, baseY);
    ctx.lineTo(startX + waveW, baseY);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    if (!ctx) return;
    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i];
      ctx.globalAlpha = pt.life / pt.max;
      ctx.fillStyle = pt.col;
      ctx.fillRect(pt.x - pt.sz * 0.5, pt.y - pt.sz * 0.5, pt.sz, pt.sz);
    }
    ctx.globalAlpha = 1;
  }

  function drawFloats() {
    if (!ctx) return;
    ctx.font = '600 11px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    for (var i = 0; i < floatTexts.length; i++) {
      var ft = floatTexts[i];
      ctx.globalAlpha = ft.life / 0.65;
      ctx.fillStyle = ft.col;
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawFlash() {
    if (!ctx) return;
    if (hitFlash > 0) {
      ctx.fillStyle = 'rgba(0,255,200,' + (hitFlash * 0.12) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (missFlash > 0) {
      ctx.fillStyle = 'rgba(255,60,80,' + (missFlash * 0.15) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawTitleBg() {
    drawBackground();
    drawWaveform();
    if (!ctx) return;
    var p = pal();
    ctx.fillStyle = p.fg;
    ctx.globalAlpha = 0.08;
    ctx.font = '700 48px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('///', W * 0.5, H * 0.42);
    ctx.globalAlpha = 1;
  }

  function draw(now) {
    if (!ctx) return;
    isDark = prefersDark();

    var sx = 0, sy = 0;
    if (shakeT > 0) {
      sx = (Math.random() - 0.5) * shakeT * 12;
      sy = (Math.random() - 0.5) * shakeT * 12;
    }
    ctx.save();
    ctx.translate(sx, sy);

    if (state === STATE.TITLE) {
      drawTitleBg();
    } else {
      drawBackground();
      var gt = state === STATE.PLAY ? gameTime(now) : 0;
      drawLanes();
      if (state === STATE.PLAY) drawNotes(gt);
      drawWaveform();
      drawParticles();
      drawFloats();
      drawFlash();
    }

    ctx.restore();
  }

  function loop(now) {
    if (!lastFrame) lastFrame = now;
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    if (state === STATE.PLAY) updatePlay(now, dt);
    draw(now);
    requestAnimationFrame(loop);
  }

  function pointerZone(x) {
    if (x < W * 0.28) return 'left';
    if (x > W * 0.72) return 'right';
    return 'center';
  }

  function onPointer(x, y) {
    if (state === STATE.TITLE || state === STATE.OVER) return;
    var zone = pointerZone(x);
    if (zone === 'left') switchLane(-1);
    else if (zone === 'right') switchLane(1);
    else tryHit();
  }

  function onKey(e) {
    if (!e) return;
    var k = e.key || '';
    if (k === ' ' || k === 'Enter') {
      if (state === STATE.PLAY) { e.preventDefault(); tryHit(); }
    } else if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
      if (state === STATE.PLAY) { e.preventDefault(); switchLane(-1); }
    } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
      if (state === STATE.PLAY) { e.preventDefault(); switchLane(1); }
    }
  }

  if (canvas) {
    canvas.addEventListener('touchstart', function (e) {
      if (!e.touches || !e.touches.length) return;
      e.preventDefault();
      var t = e.touches[0];
      onPointer(t.clientX, t.clientY);
    }, { passive: false });

    canvas.addEventListener('mousedown', function (e) {
      e.preventDefault();
      onPointer(e.clientX, e.clientY);
    });
  }

  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);

  try {
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        isDark = prefersDark();
      });
    }
  } catch (e) {}

  if (startBtn) startBtn.addEventListener('click', startGame);
  if (restartBtn) restartBtn.addEventListener('click', startGame);

  resize();
  renderChainDots();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
