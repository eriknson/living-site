<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayesian Calibrator</title>
<style>
  :root {
    --bg-color: #051005;
    --fg-color: #33ff33;
    --dim-color: #114411;
    --high-color: #ccffcc;
    --font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-color: #a3c2a0;
      --fg-color: #1a331a;
      --dim-color: #6b8e67;
      --high-color: #000000;
    }
  }

  body {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--bg-color);
    color: var(--fg-color);
    font-family: var(--font-family);
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Vignette & Scanlines */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
    pointer-events: none;
    z-index: 99;
  }
  @media (prefers-color-scheme: light) {
    body::before {
      box-shadow: inset 0 0 60px rgba(0,0,0,0.3);
    }
  }
  body::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.15) 2px,
      rgba(0, 0, 0, 0.15) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  #ui-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 150;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: var(--bg-color);
  }

  .crt-text {
    font-size: 2.5rem;
    font-weight: bold;
    text-align: center;
    text-shadow: 0 0 8px var(--fg-color);
    margin-bottom: 20px;
    line-height: 1.2;
    text-transform: uppercase;
  }

  .instructions {
    text-align: center;
    font-size: 1rem;
    opacity: 0.8;
    margin-bottom: 30px;
    max-width: 80%;
    line-height: 1.4;
  }

  button {
    pointer-events: auto;
    position: relative;
    z-index: 1000;
    background: var(--bg-color);
    color: var(--fg-color);
    border: 2px solid var(--fg-color);
    padding: 15px 40px;
    font-size: 1.5rem;
    font-family: inherit;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 10px var(--fg-color);
    transition: all 0.1s;
  }
  button:active {
    background: var(--fg-color);
    color: var(--bg-color);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }

  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: bold;
    pointer-events: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

  <div id="ui-layer">
    <div id="title-screen" class="screen" style="display:flex;">
      <div class="crt-text">BAYESIAN<br>CALIBRATOR</div>
      <div class="instructions">Drag belief chips into bins.<br>Match your posterior distribution to the hidden target lines.<br><br>Lock in 5 calibrations.</div>
      <button data-smoke="start">INITIALIZE</button>
    </div>
    
    <div id="game-over-screen" class="screen" style="display:none;">
      <div id="result-text" class="crt-text"></div>
      <div id="result-sub" class="instructions"></div>
      <button data-smoke="restart">REBOOT</button>
    </div>

    <div id="hud" style="display:none;">
      <div id="level-text">CALIBRATION: 1/5</div>
      <div id="timer-text">45.00</div>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

<script>
  const MAX_LEVELS = 5;
  const START_TIME = 45.0;
  const LOCK_IN_REQ = 1.0;
  const POOL_SIZE = 15;

  let canvas, ctx;
  let state = 'title'; // title, playing, gameover
  let tokens = [];
  let bins = [];
  let particles = [];
  
  let level = 1;
  let timeLeft = START_TIME;
  let lastTime = performance.now();
  let lockInTimer = 0;
  let allMatched = false;
  
  let w = 0, h = 0;
  let tokenRadius = 15;
  let poolRect = {x:0, y:0, w:0, h:0};
  
  let colors = {};
  
  let audioCtx = null;
  let touchId = null;
  let draggedToken = null;

  function updateColors() {
    const style = getComputedStyle(document.body);
    colors.bg = style.getPropertyValue('--bg-color').trim();
    colors.fg = style.getPropertyValue('--fg-color').trim();
    colors.dim = style.getPropertyValue('--dim-color').trim();
    colors.high = style.getPropertyValue('--high-color').trim();
  }

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        try { audioCtx = new AudioContext(); } catch(e) {}
      }
    }
  }

  function playTone(freq, duration, delay = 0) {
    if (!audioCtx) return;
    try {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      
      let now = audioCtx.currentTime + delay;
      osc.start(now);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.1, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.stop(now + duration);
    } catch(e) {}
  }

  class Particle {
    constructor(x, y) {
      this.x = x; this.y = y;
      this.vx = (Math.random()-0.5)*400;
      this.vy = (Math.random()-0.5)*400;
      this.life = 1.0;
    }
    update(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.life -= dt * 3;
    }
    draw(ctx) {
      if (this.life <= 0) return;
      ctx.fillStyle = colors.high;
      ctx.globalAlpha = this.life;
      ctx.fillRect(this.x, this.y, 4, 4);
      ctx.globalAlpha = 1.0;
    }
  }

  class Token {
    constructor(x, y) {
      this.x = x; this.y = y;
      this.vx = (Math.random() - 0.5) * 150;
      this.vy = (Math.random() - 0.5) * 150;
      this.dragged = false;
    }
    update(dt) {
      if (this.dragged) return;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      
      if (this.x < poolRect.x + tokenRadius) { this.x = poolRect.x + tokenRadius; this.vx *= -1; }
      if (this.x > poolRect.x + poolRect.w - tokenRadius) { this.x = poolRect.x + poolRect.w - tokenRadius; this.vx *= -1; }
      if (this.y < poolRect.y + tokenRadius) { this.y = poolRect.y + tokenRadius; this.vy *= -1; }
      if (this.y > poolRect.y + poolRect.h - tokenRadius) { this.y = poolRect.y + poolRect.h - tokenRadius; this.vy *= -1; }
    }
  }

  function generateTargets(numBins) {
    let configs = {
      2: [ [1,1], [1,2], [1,3], [1,4] ],
      3: [ [1,1,1], [1,2,1], [1,1,2], [2,1,2], [1,2,3], [1,1,3] ],
      4: [ [1,1,1,1], [1,2,1,1], [2,1,2,1], [1,1,2,2], [1,1,1,2] ]
    };
    let possible = configs[numBins] || configs[2];
    let choice = possible[Math.floor(Math.random() * possible.length)].slice();
    choice.sort(() => Math.random() - 0.5);
    let sum = choice.reduce((a,b)=>a+b, 0);
    return choice.map(c => c / sum);
  }

  function updateLayout() {
    w = canvas.width;
    h = canvas.height;
    tokenRadius = Math.min(w, h) * 0.04;
    tokenRadius = Math.max(15, tokenRadius);
    
    poolRect = { x: 20, y: h * 0.45, w: w - 40, h: h * 0.32 };
    
    let numBins = bins ? bins.length : 0;
    if (numBins === 0) return;
    
    let binW = w / numBins;
    bins.forEach((bin, i) => {
      bin.baseX = i * binW;
      bin.rect = { x: bin.baseX, y: h * 0.8, w: binW, h: h * 0.2 };
    });
  }

  function startLevel(lvl) {
    level = lvl;
    let numBins = 2;
    if (lvl === 2) numBins = 3;
    if (lvl === 3) numBins = 3;
    if (lvl === 4) numBins = 4;
    if (lvl === 5) numBins = 4;
    
    let targets = generateTargets(numBins);
    bins = [];
    for (let i = 0; i < numBins; i++) {
      bins.push({ count: 0, target: targets[i], sway: (lvl === 5) });
    }
    
    updateLayout();
    
    tokens = [];
    for (let i = 0; i < POOL_SIZE; i++) {
      tokens.push(new Token(w/2 + (Math.random()-0.5)*50, poolRect.y + poolRect.h/2 + (Math.random()-0.5)*50));
    }
    
    lockInTimer = 0;
    allMatched = false;
    document.getElementById('level-text').innerText = `CALIBRATION: ${lvl}/${MAX_LEVELS}`;
  }

  function startGame() {
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    document.body.style.backgroundColor = colors.bg;
    
    state = 'playing';
    timeLeft = START_TIME;
    startLevel(1);
    
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(()=>{});
    }
  }

  function gameOver(win) {
    state = 'gameover';
    document.getElementById('hud').style.display = 'none';
    let goScreen = document.getElementById('game-over-screen');
    goScreen.style.display = 'flex';
    
    if (win) {
      document.getElementById('result-text').innerText = "CALIBRATION COMPLETE";
      document.getElementById('result-sub').innerText = `Time remaining: ${timeLeft.toFixed(2)}s`;
      playTone(400, 0.1); playTone(600, 0.1, 0.1); playTone(800, 0.2, 0.2); playTone(1200, 0.4, 0.4);
    } else {
      document.getElementById('result-text').innerText = "SIGNAL LOST";
      document.getElementById('result-sub').innerText = `Timeout at level ${level}`;
      playTone(300, 0.2); playTone(200, 0.4, 0.2);
      
      document.body.style.backgroundColor = colors.high;
      setTimeout(() => { document.body.style.backgroundColor = colors.bg; }, 100);
    }
  }

  function nextLevel() {
    if (navigator.vibrate) try { navigator.vibrate(100); } catch(e){}
    playTone(800, 0.1);
    playTone(1200, 0.1, 0.1);
    
    // burst remaining tokens
    for(let b of bins) {
      let cx = b.rect.x + b.rect.w/2;
      let cy = b.rect.y + b.rect.h/2;
      for(let i=0; i<15; i++) particles.push(new Particle(cx, cy));
    }
    
    if (level === MAX_LEVELS) {
      gameOver(true);
    } else {
      startLevel(level + 1);
    }
  }

  function checkMatch() {
    let totalTokens = bins.reduce((s, b) => s + b.count, 0);
    if (totalTokens === 0) return false;
    
    for (let b of bins) {
      let currentPct = b.count / totalTokens;
      if (Math.abs(currentPct - b.target) > 0.051) return false;
    }
    return true;
  }

  function updatePlaying(dt) {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      gameOver(false);
      return;
    }
    document.getElementById('timer-text').innerText = timeLeft.toFixed(2);
    
    tokens.forEach(t => t.update(dt));
    particles.forEach(p => p.update(dt));
    particles = particles.filter(p => p.life > 0);
    
    // Physics
    for (let i=0; i<tokens.length; i++) {
      for (let j=i+1; j<tokens.length; j++) {
        let t1 = tokens[i], t2 = tokens[j];
        if (t1.dragged || t2.dragged) continue;
        let dx = t2.x - t1.x;
        let dy = t2.y - t1.y;
        let dist = Math.hypot(dx, dy);
        if (dist < tokenRadius * 2) {
          if (dist < 0.001) { t1.x += 1; continue; }
          let overlap = tokenRadius * 2 - dist;
          let nx = dx / dist;
          let ny = dy / dist;
          t1.x -= nx * overlap * 0.5;
          t1.y -= ny * overlap * 0.5;
          t2.x += nx * overlap * 0.5;
          t2.y += ny * overlap * 0.5;
          
          let p = (t1.vx * nx + t1.vy * ny - t2.vx * nx - t2.vy * ny);
          t1.vx -= p * nx; t1.vy -= p * ny;
          t2.vx += p * nx; t2.vy += p * ny;
        }
      }
    }
    
    let time = performance.now() / 1000;
    bins.forEach((bin, i) => {
      if (bin.sway) {
        bin.rect.x = bin.baseX + Math.sin(time * 2 + i) * (bin.rect.w * 0.15);
      }
    });
    
    allMatched = checkMatch();
    if (allMatched) {
      lockInTimer += dt;
      if (lockInTimer >= LOCK_IN_REQ) {
        nextLevel();
      }
    } else {
      lockInTimer = 0;
    }
  }

  function drawChart(ctx) {
    let numBins = bins.length;
    let chartW = w * 0.8;
    let chartH = h * 0.18;
    let chartX = (w - chartW) / 2;
    let chartY = h * 0.12;
    
    let barW = chartW / numBins * 0.6;
    let gap = chartW / numBins * 0.4;
    let totalTokens = bins.reduce((sum, b) => sum + b.count, 0);
    
    bins.forEach((bin, i) => {
      let currentPct = totalTokens > 0 ? bin.count / totalTokens : 0;
      let targetPct = bin.target;
      let bx = chartX + i * (barW + gap) + gap/2;
      
      // Target
      ctx.strokeStyle = colors.dim;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(bx, chartY + chartH * (1 - targetPct), barW, chartH * targetPct);
      ctx.setLineDash([]);
      
      // Current
      let match = Math.abs(currentPct - targetPct) <= 0.051; 
      if (match && totalTokens > 0) {
        ctx.fillStyle = colors.high;
        ctx.shadowColor = colors.high;
        ctx.shadowBlur = 10;
      } else {
        ctx.fillStyle = colors.fg;
        ctx.shadowBlur = 0;
      }
      
      let curH = chartH * currentPct;
      ctx.fillRect(bx, chartY + chartH - curH, barW, curH);
      ctx.shadowBlur = 0;
      
      ctx.fillStyle = colors.fg;
      ctx.font = `1rem ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign = 'center';
      ctx.fillText(`${(targetPct*100).toFixed(0)}%`, bx + barW/2, chartY + chartH + 20);
    });
    
    // Lock-in bar
    if (allMatched && lockInTimer > 0) {
      let cx = w / 2;
      let cy = chartY + chartH + 45;
      ctx.fillStyle = colors.dim;
      ctx.fillRect(cx - 60, cy - 5, 120, 10);
      ctx.fillStyle = colors.high;
      ctx.fillRect(cx - 60, cy - 5, 120 * (lockInTimer / LOCK_IN_REQ), 10);
      
      ctx.font = `bold 1rem ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillText("LOCKING...", cx, cy + 22);
    }
  }

  function draw(dt) {
    ctx.clearRect(0, 0, w, h);
    if (state !== 'playing') return;
    
    // Pool area hint
    ctx.strokeStyle = colors.dim;
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 4]);
    ctx.strokeRect(poolRect.x, poolRect.y, poolRect.w, poolRect.h);
    ctx.setLineDash([]);
    
    drawChart(ctx);
    
    // Bins
    bins.forEach((b, i) => {
      let r = b.rect;
      ctx.strokeStyle = colors.dim;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(r.x + 10, r.y + 10, r.w - 20, r.h - 20);
      ctx.setLineDash([]);
      
      ctx.fillStyle = colors.fg;
      ctx.font = `1.2rem ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign = 'center';
      ctx.fillText(`BIN ${i+1}`, r.x + r.w/2, r.y + 35);
      
      ctx.fillStyle = b.count > 0 ? colors.high : colors.dim;
      ctx.font = `bold 2.5rem ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillText(b.count, r.x + r.w/2, r.y + r.h/2 + 20);
      
      ctx.fillStyle = colors.fg;
      for(let k=0; k<b.count; k++) {
        ctx.fillRect(r.x + r.w/2 - 15, r.y + r.h - 25 - k * 8, 30, 4);
      }
    });
    
    // Particles
    particles.forEach(p => p.draw(ctx));
    
    // Tokens
    ctx.lineWidth = 2;
    tokens.forEach(t => {
      ctx.beginPath();
      ctx.arc(t.x, t.y, tokenRadius, 0, Math.PI*2);
      if (t.dragged) {
        ctx.fillStyle = colors.bg; ctx.fill();
        ctx.strokeStyle = colors.high; ctx.stroke();
        ctx.fillStyle = colors.high;
        ctx.beginPath();
        ctx.arc(t.x, t.y, tokenRadius * 0.2, 0, Math.PI*2);
        ctx.fill();
      } else {
        ctx.fillStyle = colors.bg; ctx.fill();
        ctx.strokeStyle = colors.fg; ctx.stroke();
        ctx.fillStyle = colors.dim;
        ctx.beginPath();
        ctx.arc(t.x, t.y, tokenRadius * 0.4, 0, Math.PI*2);
        ctx.fill();
      }
    });
  }

  function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;
    
    if (state === 'playing') {
      updatePlaying(dt);
    }
    draw(dt);
  }

  // Input Handlers
  function handlePointerDown(e) {
    if (state !== 'playing') return;
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    
    if (touchId !== null) return;
    touchId = e.pointerId;
    try { canvas.setPointerCapture(touchId); } catch(err){}
    
    let tx = e.clientX;
    let ty = e.clientY;
    
    for (let t of tokens) {
      if (!t.dragged && Math.hypot(t.x - tx, t.y - ty) < tokenRadius * 2.0) {
        draggedToken = t;
        t.dragged = true;
        if (navigator.vibrate) try { navigator.vibrate(20); } catch(err){}
        return;
      }
    }
    
    for (let b of bins) {
      let r = b.rect;
      if (tx >= r.x && tx <= r.x + r.w && ty >= r.y && ty <= r.y + r.h) {
        if (b.count > 0) {
          b.count--;
          let nt = new Token(tx, ty);
          nt.dragged = true;
          draggedToken = nt;
          tokens.push(nt);
          if (navigator.vibrate) try { navigator.vibrate(20); } catch(err){}
          return;
        }
      }
    }
  }

  function handlePointerMove(e) {
    if (e.pointerId !== touchId || !draggedToken) return;
    draggedToken.x = e.clientX;
    draggedToken.y = e.clientY;
  }

  function handlePointerUp(e) {
    if (e.pointerId !== touchId) return;
    touchId = null;
    
    if (draggedToken) {
      let tx = e.clientX;
      let ty = e.clientY;
      let droppedInBin = false;
      
      for (let b of bins) {
        let r = b.rect;
        if (tx >= r.x && tx <= r.x + r.w && ty >= r.y && ty <= r.y + r.h) {
          b.count++;
          droppedInBin = true;
          if (navigator.vibrate) try { navigator.vibrate(30); } catch(err){}
          playTone(400, 0.1);
          break;
        }
      }
      
      if (droppedInBin) {
        for(let i=0; i<8; i++) particles.push(new Particle(tx, ty));
        let idx = tokens.indexOf(draggedToken);
        if (idx > -1) tokens.splice(idx, 1);
      } else {
        draggedToken.dragged = false;
        draggedToken.vx = (Math.random()-0.5)*300;
        draggedToken.vy = (Math.random()-0.5)*300;
      }
      draggedToken = null;
    }
  }

  function handlePointerCancel(e) {
    if (e.pointerId === touchId) {
      touchId = null;
      if (draggedToken) {
        draggedToken.dragged = false;
        draggedToken.vx = (Math.random()-0.5)*300;
        draggedToken.vy = (Math.random()-0.5)*300;
        draggedToken = null;
      }
    }
  }

  window.onload = () => {
    canvas = document.getElementById('game-canvas');
    ctx = canvas.getContext('2d');
    
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      updateColors();
    });
    
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      updateLayout();
    });
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    updateColors();
    updateLayout();
    
    document.querySelector('[data-smoke="start"]').addEventListener('click', startGame);
    document.querySelector('[data-smoke="restart"]').addEventListener('click', startGame);
    
    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointercancel', handlePointerCancel);
    canvas.addEventListener('pointerleave', handlePointerCancel);
    
    requestAnimationFrame(loop);
  };
</script>
</body>
</html>
