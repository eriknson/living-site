<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golden Hour Skim</title>
<style>
:root{
  color-scheme: light dark;
  --ink:#17211f;
  --paper:#fff8e8;
  --glass:rgba(255,248,232,.74);
  --line:rgba(23,33,31,.16);
  --gold:#f1b33a;
  --coral:#ef6f50;
  --sea:#42b7aa;
  --deep:#0d3839;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#eef5e9;
    --paper:#071513;
    --glass:rgba(7,21,19,.72);
    --line:rgba(238,245,233,.18);
    --gold:#ffd166;
    --coral:#ff8a63;
    --sea:#5fd5c8;
    --deep:#061111;
  }
}
*{box-sizing:border-box}
html,body{margin:0;width:100dvw;height:100dvh;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh}
#game{position:fixed;inset:0;width:100dvw;height:100dvh;display:block;touch-action:none;user-select:none;background:var(--paper)}
#hud{position:fixed;inset:env(safe-area-inset-top) 0 auto 0;padding:12px 14px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;pointer-events:none;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.pill{display:inline-flex;gap:8px;align-items:center;min-height:34px;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
#hud .left{justify-self:start;display:flex;gap:7px;flex-wrap:wrap}
#hud .mid{justify-self:center}
#hud .right{justify-self:end;text-align:right}
#meter{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 56px);height:5px;border-radius:999px;background:rgba(0,0,0,.13);overflow:hidden;pointer-events:none}
#meterFill{height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--coral))}
#screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none;transition:opacity .28s ease}
.card{width:min(430px,calc(100dvw - 32px));padding:26px 22px 22px;border:1px solid var(--line);border-radius:28px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.2);text-align:center}
.eyebrow{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.74;margin-bottom:10px}
h1{font-size:clamp(34px,12vw,58px);line-height:.9;margin:0 0 14px;font-weight:850;letter-spacing:-.06em}
p{margin:0 auto 18px;max-width:32em;line-height:1.45;opacity:.82}
.hint{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
button{appearance:none;border:0;border-radius:999px;min-height:52px;min-width:176px;padding:0 22px;background:var(--ink);color:var(--paper);font-weight:800;font-size:15px;letter-spacing:.01em;box-shadow:0 12px 30px rgba(0,0,0,.22);cursor:pointer;pointer-events:auto}
button:active{transform:translateY(1px) scale(.99)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
#restartBtn{display:none}
.hide{opacity:0}
@media (max-width:420px){
  #hud{grid-template-columns:1fr auto;padding-left:10px;padding-right:10px}
  #hud .mid{display:none}
  #meter{left:10px;right:10px}
  .card{padding:24px 18px 20px}
}
</style>
</head>
<body>
<canvas id="game" aria-label="Golden Hour Skim game canvas"></canvas>
<div id="hud" aria-live="polite">
  <div class="left"><span class="pill" id="score">0/28 notes</span><span class="pill" id="combo">x1</span></div>
  <div class="mid pill" id="wind">wind calm</div>
  <div class="right pill" id="time">60.0s</div>
</div>
<div id="meter"><div id="meterFill"></div></div>
<div id="screen">
  <section class="card" id="panel">
    <div class="eyebrow" id="eyebrow">clear summer / yacht deck</div>
    <h1 id="title">Golden Hour Skim</h1>
    <p id="copy">Flick the vinyl coaster through drifting dream-pop notes. Chain clean shots before the wind pushes them into the bay.</p>
    <p class="hint" id="hint">Drag, aim, release. Arrows aim, Space fires.</p>
    <button data-smoke="start" id="startBtn" type="button">Cast the Coaster</button>
    <button data-smoke="restart" id="restartBtn" type="button">Spin Again</button>
  </section>
</div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas&&canvas.getContext?canvas.getContext("2d",{alpha:false}):null;
const ui={screen:$("screen"),eyebrow:$("eyebrow"),title:$("title"),copy:$("copy"),hint:$("hint"),start:$("startBtn"),restart:$("restartBtn"),score:$("score"),combo:$("combo"),time:$("time"),wind:$("wind"),meter:$("meterFill")};
let W=1,H=1,D=1,last=0,state="title",audio=null,keys={};
let table={x:0,y:0,w:1,h:1,r:30};
let puck,notes=[],parts=[],ripples=[],aim=null,shots=0,score=0,goal=28,combo=1,shotHits=0,timeLeft=60,ended=false,wind={x:0,y:0,power:0,label:"calm",next:0},shake=0,flash=0,spawnBank=0,level=0,won=false;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hypot=(x,y)=>Math.sqrt(x*x+y*y);
const safeText=(el,txt)=>{if(el)el.textContent=txt};
function resize(){
  W=Math.max(1,window.innerWidth||document.documentElement.clientWidth||320);
  H=Math.max(1,window.innerHeight||document.documentElement.clientHeight||568);
  D=Math.min(2,window.devicePixelRatio||1);
  if(canvas){canvas.width=Math.floor(W*D);canvas.height=Math.floor(H*D);canvas.style.width=W+"px";canvas.style.height=H+"px"}
  if(ctx)ctx.setTransform(D,0,0,D,0,0);
  const m=Math.max(12,Math.min(28,W*.04));
  table.x=m; table.y=Math.max(92,H*.15); table.w=W-m*2; table.h=H-table.y-m; table.r=Math.min(42,table.w*.09);
  if(puck)keepInTable(puck);
}
function makePuck(){return {x:table.x+table.w*.5,y:table.y+table.h*.78,vx:0,vy:0,r:clamp(W*.045,16,23),spin:0,ready:true,ghost:0}}
function reset(){
  state="playing";ended=false;won=false;score=0;combo=1;shots=0;shotHits=0;timeLeft=60;spawnBank=0;level=0;shake=0;flash=0;parts=[];ripples=[];notes=[];wind.next=0;
  puck=makePuck();
  for(let i=0;i<7;i++)spawnNote(i<3);
  showOverlay(false);
  updateUI();
  beep(260,.04,.08,"sine");
}
function endGame(win){
  if(ended)return;
  ended=true;won=!!win;state="over";aim=null;
  safeText(ui.eyebrow,win?"sunset secured":"the bay took the last chorus");
  safeText(ui.title,win?"Deck Cleared":"Sunset Slipped");
  safeText(ui.copy,win?`You skimmed ${score} notes in ${shots||1} shots. Best combo x${combo}.`:`You caught ${score}/${goal}. Flick earlier and lean into the wind.`);
  safeText(ui.hint,"One more cruise, same golden minute.");
  if(ui.start)ui.start.style.display="none";
  if(ui.restart)ui.restart.style.display="inline-block";
  showOverlay(true);
  burst(W*.5,H*.46,36,win?"#ffd166":"#5fd5c8",5);
  vibrate(win?45:25);
  beep(win?620:160,.18,.08,win?"triangle":"sawtooth");
}
function showOverlay(on){
  if(!ui.screen)return;
  ui.screen.classList.toggle("hide",!on);
}
function spawnNote(close){
  const r=rand(10,17);
  let x,y,tries=0;
  do{
    const band=close?rand(.38,.7):rand(.16,.72);
    x=table.x+table.w*rand(.15,.85);
    y=table.y+table.h*band;
    tries++;
  }while(puck&&hypot(x-puck.x,y-puck.y)<130&&tries<20);
  const far=score>12?rand(.5,1):rand(.15,.55);
  notes.push({x,y,vx:rand(-16,16)+wind.x*.06,vy:rand(-10,18)+far*12,r,phase:rand(0,6.28),life:1,hue:Math.random()<.18?"coral":"gold",value:1});
}
function updateUI(){
  safeText(ui.score,score+"/"+goal+" notes");
  safeText(ui.combo,"x"+combo);
  safeText(ui.time,Math.max(0,timeLeft).toFixed(1)+"s");
  safeText(ui.wind,"wind "+wind.label);
  if(ui.meter)ui.meter.style.width=clamp(timeLeft/60,0,1)*100+"%";
}
function setWind(t){
  if(t<wind.next)return;
  level=Math.floor((60-timeLeft)/10);
  const p=Math.min(145,24+level*19+rand(0,28));
  const a=rand(-.4,Math.PI+.4);
  wind.x=Math.cos(a)*p;
  wind.y=Math.sin(a)*p*.5;
  wind.power=p;
  wind.next=t+rand(4.4,6.7);
  wind.label=p<45?"calm":(wind.x>35?"east":(wind.x<-35?"west":"soft"));
  burst(table.x+table.w*.5,table.y+24,10,"#f1b33a",2);
}
function launch(dx,dy){
  if(state!=="playing"||!puck||!puck.ready)return;
  const len=hypot(dx,dy);
  if(len<12)return;
  const s=clamp(len*7.2,190,920);
  puck.vx=dx/len*s; puck.vy=dy/len*s;
  puck.ready=false;puck.ghost=.8;shots++;shotHits=0;aim=null;
  ripples.push({x:puck.x,y:puck.y,r:8,a:.7});
  burst(puck.x,puck.y,12,"#42b7aa",2.3);
  vibrate(10);beep(120+Math.min(500,s*.45),.035,.05,"square");
}
function step(dt,t){
  if(state==="playing"){
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=0;endGame(false)}
    setWind(t);
    spawnBank+=dt*(.44+level*.06);
    while(notes.length<Math.min(13,7+level)&&spawnBank>1&&score+notes.length<goal+6){spawnBank--;spawnNote(false)}
    movePuck(dt);
    moveNotes(dt);
    collide();
    updateUI();
    if(score>=goal)endGame(true);
  }
  parts=parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;p.a-=dt*p.fade;return p.a>0});
  ripples=ripples.filter(r=>{r.r+=120*dt;r.a-=dt*1.8;return r.a>0});
  shake=Math.max(0,shake-dt*18);flash=Math.max(0,flash-dt*2.4);
}
function movePuck(dt){
  if(!puck)return;
  const sp=hypot(puck.vx,puck.vy);
  if(!puck.ready&&sp>8){puck.vx+=wind.x*dt*.22;puck.vy+=wind.y*dt*.18}
  puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;puck.spin+=sp*dt*.04;
  const f=Math.exp(-1.55*dt);
  puck.vx*=f;puck.vy*=f;
  const b=.74;
  if(puck.x-puck.r<table.x){puck.x=table.x+puck.r;puck.vx=Math.abs(puck.vx)*b;railHit()}
  if(puck.x+puck.r>table.x+table.w){puck.x=table.x+table.w-puck.r;puck.vx=-Math.abs(puck.vx)*b;railHit()}
  if(puck.y-puck.r<table.y){puck.y=table.y+puck.r;puck.vy=Math.abs(puck.vy)*b;railHit()}
  if(puck.y+puck.r>table.y+table.h){puck.y=table.y+table.h-puck.r;puck.vy=-Math.abs(puck.vy)*b;railHit()}
  if(!puck.ready&&hypot(puck.vx,puck.vy)<24){
    puck.vx=0;puck.vy=0;puck.ready=true;puck.ghost=0;
    if(shotHits===0){combo=1;timeLeft=Math.max(0,timeLeft-1.6);safeText(ui.hint,"Dry skip: minus 1.6 seconds.");burst(puck.x,puck.y,8,"#ef6f50",2)}
  }
}
function moveNotes(dt){
  for(let i=notes.length-1;i>=0;i--){
    const n=notes[i];
    n.phase+=dt*(2+level*.2);
    n.vx+=Math.sin(n.phase)*dt*8+wind.x*dt*.035;
    n.vy+=(Math.cos(n.phase*.7)*6+8+level*1.4)*dt+wind.y*dt*.015;
    n.x+=n.vx*dt;n.y+=n.vy*dt;
    n.vx*=Math.exp(-.45*dt);n.vy*=Math.exp(-.35*dt);
    const pad=n.r*.8;
    if(n.x<table.x-pad||n.x>table.x+table.w+pad||n.y<table.y-pad||n.y>table.y+table.h+pad){
      notes.splice(i,1);timeLeft=Math.max(0,timeLeft-1.2);combo=1;shake=3;burst(clamp(n.x,table.x,table.x+table.w),clamp(n.y,table.y,table.y+table.h),14,"#5fd5c8",3);
      if(score+notes.length<goal)spawnNote(false);
    }
  }
}
function collide(){
  if(!puck)return;
  for(let i=notes.length-1;i>=0;i--){
    const n=notes[i],dx=n.x-puck.x,dy=n.y-puck.y,d=hypot(dx,dy);
    if(d<n.r+puck.r){
      notes.splice(i,1);score+=n.value;shotHits++;combo=Math.min(9,combo+1);timeLeft=Math.min(60,timeLeft+.45+.08*combo);flash=.45;shake=5;
      const nx=dx/(d||1),ny=dy/(d||1),sp=Math.max(120,hypot(puck.vx,puck.vy));
      puck.vx-=nx*sp*.08;puck.vy-=ny*sp*.08;
      burst(n.x,n.y,24,n.hue==="coral"?"#ff8a63":"#ffd166",4.4);
      ripples.push({x:n.x,y:n.y,r:5,a:.9});
      safeText(ui.hint,combo>3?"Chorus chain x"+combo+"!":"Clean catch. Keep skimming.");
      vibrate(combo>4?18:8);beep(260+combo*58,.05,.045,"triangle");
      if(score+notes.length<goal)spawnNote(false);
    }
  }
}
function railHit(){shake=Math.max(shake,1.5);beep(95,.025,.035,"square")}
function keepInTable(o){o.x=clamp(o.x,table.x+o.r,table.x+table.w-o.r);o.y=clamp(o.y,table.y+o.r,table.y+table.h-o.r)}
function burst(x,y,c,color,spd){
  for(let i=0;i<c;i++){const a=rand(0,Math.PI*2),s=rand(25,90)*spd;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(1.3,3.8),a:rand(.45,1),fade:rand(1.8,3.4),color})}
}
function draw(){
  if(!ctx)return;
  const sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake):0;
  ctx.save();ctx.translate(sx,sy);
  drawSea();drawSun();drawTable();drawWind();drawNotes();drawPuck();drawAim();drawFX();
  if(flash>0){ctx.globalAlpha=flash*.12;ctx.fillStyle="#fff8e8";ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  ctx.restore();
}
function drawSea(){
  const dark=typeof matchMedia!=="undefined"&&matchMedia("(prefers-color-scheme: dark)").matches;
  const g=ctx.createLinearGradient(0,0,0,H);
  if(dark){g.addColorStop(0,"#072528");g.addColorStop(.55,"#0b3b3c");g.addColorStop(1,"#061111")}
  else{g.addColorStop(0,"#f9d98f");g.addColorStop(.44,"#69c8bd");g.addColorStop(1,"#d9f4ec")}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=dark?.18:.2;ctx.strokeStyle="#fff8e8";ctx.lineWidth=1;
  for(let y=H*.1;y<H;y+=34){ctx.beginPath();for(let x=0;x<=W;x+=18){ctx.lineTo(x,y+Math.sin(x*.025+last*.001+y*.04)*5)}ctx.stroke()}
  ctx.globalAlpha=1;
  for(let i=0;i<70;i++){const x=(i*83+last*.012)%W,y=(i*47)%H;ctx.globalAlpha=.045;ctx.fillStyle=i%2?"#fff8e8":"#0d3839";ctx.fillRect(x,y,1.2,1.2)}
  ctx.globalAlpha=1;
}
function drawSun(){
  const p=1-clamp(timeLeft/60,0,1),x=W*.82,y=table.y-34+p*42,r=Math.max(22,W*.08);
  const g=ctx.createRadialGradient(x,y,4,x,y,r*2.4);g.addColorStop(0,"rgba(255,209,102,.7)");g.addColorStop(1,"rgba(255,209,102,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.4,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,209,102,.72)";ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawTable(){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.28)";ctx.shadowBlur=30;ctx.shadowOffsetY=14;
  roundRect(table.x,table.y,table.w,table.h,table.r);ctx.fillStyle="#9f6931";ctx.fill();
  ctx.shadowColor="transparent";
  for(let x=table.x+10;x<table.x+table.w;x+=22){ctx.strokeStyle="rgba(255,232,178,.18)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,table.y+4);ctx.lineTo(x+table.h*.08,table.y+table.h-4);ctx.stroke()}
  const inset=18;roundRect(table.x+inset,table.y+inset,table.w-inset*2,table.h-inset*2,table.r*.65);
  const felt=ctx.createLinearGradient(0,table.y,0,table.y+table.h);felt.addColorStop(0,"#2f8f72");felt.addColorStop(1,"#0d5b54");ctx.fillStyle=felt;ctx.fill();
  ctx.globalAlpha=.18;ctx.strokeStyle="#fff8e8";ctx.lineWidth=1;
  for(let y=table.y+inset+26;y<table.y+table.h-inset;y+=34){ctx.beginPath();ctx.moveTo(table.x+inset+12,y);ctx.lineTo(table.x+table.w-inset-12,y+Math.sin(y*.07)*8);ctx.stroke()}
  ctx.globalAlpha=1;
  ctx.strokeStyle="rgba(255,248,232,.28)";ctx.setLineDash([8,12]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(table.x+table.w*.5,table.y+inset+8);ctx.lineTo(table.x+table.w*.5,table.y+table.h-inset-8);ctx.stroke();ctx.setLineDash([]);
  const pockets=[[.14,.09],[.86,.09],[.1,.91],[.9,.91]];
  for(const p of pockets){const px=table.x+table.w*p[0],py=table.y+table.h*p[1];ctx.fillStyle="rgba(5,18,18,.55)";ctx.beginPath();ctx.arc(px,py,18,0,7);ctx.fill();ctx.strokeStyle="rgba(255,209,102,.35)";ctx.stroke()}
  ctx.restore();
}
function drawWind(){
  const cx=table.x+table.w*.5,cy=table.y+26,ang=Math.atan2(wind.y,wind.x),len=clamp(wind.power,20,150);
  ctx.save();ctx.globalAlpha=.62;ctx.translate(cx,cy);ctx.rotate(ang);ctx.strokeStyle="#fff8e8";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-len*.45,0);ctx.quadraticCurveTo(0,-10,len*.38,0);ctx.stroke();ctx.beginPath();ctx.moveTo(len*.38,0);ctx.lineTo(len*.25,-7);ctx.lineTo(len*.25,7);ctx.closePath();ctx.fillStyle="#fff8e8";ctx.fill();ctx.restore();
}
function drawNotes(){
  for(const n of notes){
    const pulse=1+Math.sin(n.phase*2)*.06;
    const g=ctx.createRadialGradient(n.x-n.r*.3,n.y-n.r*.4,2,n.x,n.y,n.r*2.2);
    g.addColorStop(0,"#fff8e8");g.addColorStop(.35,n.hue==="coral"?"#ff8a63":"#ffd166");g.addColorStop(1,"rgba(255,209,102,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r*2.2*pulse,0,7);ctx.fill();
    ctx.fillStyle=n.hue==="coral"?"#ef6f50":"#f1b33a";ctx.beginPath();ctx.arc(n.x,n.y,n.r*pulse,0,7);ctx.fill();
    ctx.strokeStyle="rgba(255,248,232,.9)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(n.x-2,n.y+n.r*.45);ctx.lineTo(n.x-2,n.y-n.r*.55);ctx.lineTo(n.x+n.r*.42,n.y-n.r*.38);ctx.stroke();ctx.beginPath();ctx.arc(n.x-n.r*.35,n.y+n.r*.45,n.r*.28,0,7);ctx.stroke();
  }
}
function drawPuck(){
  if(!puck)return;
  ctx.save();ctx.translate(puck.x,puck.y);ctx.rotate(puck.spin);
  if(puck.ghost>0){ctx.globalAlpha=puck.ghost*.28;ctx.strokeStyle="#fff8e8";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,puck.r+8,0,7);ctx.stroke();ctx.globalAlpha=1}
  const g=ctx.createRadialGradient(-puck.r*.35,-puck.r*.45,2,0,0,puck.r);
  g.addColorStop(0,"#3c4740");g.addColorStop(.55,"#111816");g.addColorStop(1,"#020403");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,puck.r,0,7);ctx.fill();
  ctx.strokeStyle="rgba(255,248,232,.18)";ctx.lineWidth=1;
  for(let r=puck.r*.35;r<puck.r;r+=4){ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke()}
  ctx.fillStyle="#ef6f50";ctx.beginPath();ctx.arc(0,0,puck.r*.36,0,7);ctx.fill();
  ctx.fillStyle="#fff8e8";ctx.beginPath();ctx.arc(0,0,puck.r*.1,0,7);ctx.fill();
  if(puck.ready){ctx.strokeStyle="rgba(255,209,102,.9)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,puck.r+5,0,7);ctx.stroke()}
  ctx.restore();
}
function drawAim(){
  if(!aim||!puck||state!=="playing"||!puck.ready)return;
  const dx=aim.x-puck.x,dy=aim.y-puck.y,len=clamp(hypot(dx,dy),0,130),a=Math.atan2(dy,dx);
  ctx.save();ctx.translate(puck.x,puck.y);ctx.rotate(a);ctx.strokeStyle="rgba(255,248,232,.75)";ctx.lineWidth=4;ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(puck.r+8,0);ctx.lineTo(len+28,0);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="rgba(255,209,102,.9)";ctx.beginPath();ctx.moveTo(len+36,0);ctx.lineTo(len+20,-8);ctx.lineTo(len+20,8);ctx.closePath();ctx.fill();ctx.restore();
}
function drawFX(){
  for(const r of ripples){ctx.globalAlpha=r.a;ctx.strokeStyle="#fff8e8";ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke()}
  for(const p of parts){ctx.globalAlpha=p.a;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
}
function pointerPos(e){
  const p=e.touches&&e.touches[0]?e.touches[0]:e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e;
  return {x:p.clientX||0,y:p.clientY||0};
}
function onDown(e){if(e.cancelable)e.preventDefault();if(state!=="playing"||!puck||!puck.ready)return;aim=pointerPos(e)}
function onMove(e){if(e.cancelable)e.preventDefault();if(!aim||state!=="playing")return;aim=pointerPos(e)}
function onUp(e){if(e.cancelable)e.preventDefault();if(!aim||state!=="playing"||!puck)return;const p=pointerPos(e),dx=p.x-puck.x,dy=p.y-puck.y;launch(dx,dy)}
function key(e,down){
  keys[e.code]=down;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","KeyW","KeyA","KeyS","KeyD"].includes(e.code)&&e.cancelable)e.preventDefault();
  if(state!=="playing"||!puck||!puck.ready)return;
  const x=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),y=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(x||y)aim={x:puck.x+x*96,y:puck.y+y*96};
  if(!down&&e.code==="Space"&&aim)launch(aim.x-puck.x,aim.y-puck.y);
}
function beep(freq,dur,gain,type){
  try{
    if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC()}
    if(audio.state==="suspended"&&audio.resume)audio.resume();
    const o=audio.createOscillator(),v=audio.createGain(),now=audio.currentTime;
    o.type=type||"sine";o.frequency.setValueAtTime(freq,now);v.gain.setValueAtTime(0,now);v.gain.linearRampToValueAtTime(gain,now+.01);v.gain.exponentialRampToValueAtTime(.0001,now+dur);
    o.connect(v);v.connect(audio.destination);o.start(now);o.stop(now+dur+.02);
  }catch(_){}
}
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(_){}}
function loop(t){
  const dt=Math.min(.033,((t||0)-last)/1000||.016);last=t||0;
  try{step(dt,last/1000);draw()}catch(_){}
  requestAnimationFrame(loop);
}
function bind(){
  if(ui.start)ui.start.addEventListener("click",reset);
  if(ui.restart)ui.restart.addEventListener("click",reset);
  if(canvas){
    canvas.addEventListener("touchstart",onDown,{passive:false});canvas.addEventListener("touchmove",onMove,{passive:false});canvas.addEventListener("touchend",onUp,{passive:false});canvas.addEventListener("touchcancel",onUp,{passive:false});
    canvas.addEventListener("pointerdown",onDown);canvas.addEventListener("pointermove",onMove);canvas.addEventListener("pointerup",onUp);canvas.addEventListener("pointercancel",onUp);
  }
  window.addEventListener("keydown",e=>key(e,true));window.addEventListener("keyup",e=>key(e,false));window.addEventListener("resize",resize);
}
function init(){
  resize();puck=makePuck();for(let i=0;i<6;i++)spawnNote(i<3);showOverlay(true);updateUI();bind();draw();requestAnimationFrame(loop);
}
init();
})();
</script>
