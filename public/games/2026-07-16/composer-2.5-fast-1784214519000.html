<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STUTTER DROP</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0c;--fg:#e8e8ec;--muted:#6a6a78;
  --neon:#00e8ff;--neon2:#ff2d55;--neon3:#39ff14;--accent:#ffb300;
  --panel:rgba(12,12,16,.88);--line:rgba(255,255,255,.08);
  --zone:rgba(0,232,255,.18);--ghost:rgba(255,255,255,.25);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f4f4f6;--fg:#121218;--muted:#6a6a78;
    --neon:#0099b8;--neon2:#d91a45;--neon3:#1a9e12;--accent:#c98a00;
    --panel:rgba(255,255,255,.92);--line:rgba(0,0,0,.08);
    --zone:rgba(0,153,184,.15);--ghost:rgba(0,0,0,.2);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:manipulation}
#app{width:100dvw;height:100dvh;display:flex;flex-direction:column;position:relative;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;
  font-size:11px;letter-spacing:.08em;z-index:2;flex-shrink:0}
header span{color:var(--muted)}
.hud-val{color:var(--neon);font-weight:600}
#canvas-wrap{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;z-index:10;
  background:linear-gradient(180deg,var(--panel) 0%,transparent 35%,transparent 65%,var(--panel) 100%);
  transition:opacity .35s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay h1{font-size:clamp(22px,7vw,36px);letter-spacing:.22em;font-weight:700;
  background:linear-gradient(90deg,var(--neon),var(--neon2));-webkit-background-clip:text;
  background-clip:text;color:transparent;margin-bottom:6px}
.overlay .sub{font-size:11px;color:var(--muted);letter-spacing:.12em;margin-bottom:28px;text-align:center;
  max-width:280px;line-height:1.6}
.overlay .final-score{font-size:clamp(28px,9vw,48px);color:var(--neon);margin:8px 0 4px}
.overlay .final-label{font-size:10px;color:var(--muted);letter-spacing:.14em;margin-bottom:24px}
.btn{pointer-events:auto;min-height:48px;min-width:160px;padding:14px 32px;border:none;border-radius:2px;
  font-family:inherit;font-size:12px;letter-spacing:.18em;cursor:pointer;
  background:var(--neon);color:var(--bg);font-weight:700;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.96)}
.btn-ghost{background:transparent;border:1px solid var(--neon);color:var(--neon);margin-top:12px}
#layers-bar{display:flex;gap:4px;padding:0 16px 10px;justify-content:center;flex-shrink:0}
.layer-dot{width:28px;height:4px;border-radius:2px;background:var(--line);transition:background .2s,box-shadow .2s}
.layer-dot.on{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.layer-dot.drop{background:var(--neon2);box-shadow:0 0 12px var(--neon2)}
#feedback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:14px;letter-spacing:.2em;pointer-events:none;opacity:0;z-index:5;
  transition:opacity .15s}
#feedback.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <span>STUTTER <span class="hud-val">DROP</span></span>
    <span>TIME <span class="hud-val" id="time">60</span></span>
    <span>COMBO <span class="hud-val" id="combo">0</span></span>
    <span>SCORE <span class="hud-val" id="score">0</span></span>
  </header>
  <div id="canvas-wrap">
    <canvas id="game"></canvas>
    <div id="feedback"></div>
    <div class="overlay" id="title-screen">
      <h1>STUTTER DROP</h1>
      <p class="sub">Tap the pulse on beat. Stack layers from silence. Ride the drop.</p>
      <button class="btn" data-smoke="start" id="btn-start">BEGIN LOOP</button>
    </div>
    <div class="overlay hidden" id="gameover-screen">
      <p class="final-label">SESSION COMPLETE</p>
      <p class="final-score" id="final-score">0</p>
      <p class="final-label" id="final-rank">BUILDER</p>
      <button class="btn" data-smoke="restart" id="btn-restart">STACK AGAIN</button>
    </div>
  </div>
  <div id="layers-bar"></div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('game');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var wrap = document.getElementById('canvas-wrap');
var timeEl = document.getElementById('time');
var scoreEl = document.getElementById('score');
var comboEl = document.getElementById('combo');
var feedbackEl = document.getElementById('feedback');
var titleScreen = document.getElementById('title-screen');
var gameoverScreen = document.getElementById('gameover-screen');
var finalScoreEl = document.getElementById('final-score');
var finalRankEl = document.getElementById('final-rank');
var layersBar = document.getElementById('layers-bar');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 360, H = 640;
var dpr = 1;
var state = 'title';
var score = 0, combo = 0, maxCombo = 0, layers = 0;
var timeLeft = 60, sessionStart = 0;
var bpm = 118, targetBpm = 138;
var beats = [], particles = [], wavePhase = 0;
var hitPause = 0, shakeX = 0, shakeY = 0;
var feedbackTimer = 0, dropTriggered = false;
var audioCtx = null, masterGain = null;
var layerNodes = [];
var LAYER_COUNT = 7;
var BEAT_ZONE_Y = 0.78;
var PERFECT_MS = 70, GOOD_MS = 130;
var animId = 0, lastTs = 0, spawnAcc = 0;
var ghostChance = 0;
var isDark = true;

function initLayersBar(){
  layersBar.innerHTML = '';
  for(var i=0;i<LAYER_COUNT;i++){
    var d = document.createElement('div');
    d.className = 'layer-dot';
    d.dataset.i = i;
    layersBar.appendChild(d);
  }
}
initLayersBar();

function checkTheme(){
  isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
checkTheme();
if(window.matchMedia){
  try{
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', checkTheme);
  }catch(e){}
}

function resize(){
  if(!canvas || !wrap) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  var rect = wrap.getBoundingClientRect();
  W = Math.max(rect.width, 1);
  H = Math.max(rect.height, 1);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

function css(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function vibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function showFeedback(text, color){
  if(!feedbackEl) return;
  feedbackEl.textContent = text;
  feedbackEl.style.color = color || css('--neon');
  feedbackEl.classList.add('show');
  feedbackTimer = 0.4;
}

function updateLayerUI(){
  var dots = layersBar.querySelectorAll('.layer-dot');
  for(var i=0;i<dots.length;i++){
    dots[i].className = 'layer-dot' + (i < layers ? (layers >= LAYER_COUNT && i === LAYER_COUNT-1 ? ' on drop' : ' on') : '');
  }
}

function initAudio(){
  if(audioCtx) return true;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(audioCtx.destination);
    return true;
  }catch(e){ return false; }
}

function makeKick(t){
  if(!audioCtx) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.08);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.4);
}

function makeHat(t, vol){
  if(!audioCtx) return;
  var len = Math.floor(audioCtx.sampleRate * 0.04);
  var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1-i/len);
  var src = audioCtx.createBufferSource();
  src.buffer = buf;
  var filt = audioCtx.createBiquadFilter();
  filt.type = 'highpass'; filt.frequency.value = 7000;
  var g = audioCtx.createGain();
  g.gain.value = vol || 0.25;
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 0.05);
}

function makeSnare(t){
  if(!audioCtx) return;
  makeHat(t, 0.35);
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(180, t);
  g.gain.setValueAtTime(0.4, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.15);
}

function makeBass(t, note){
  if(!audioCtx) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  var f = audioCtx.createBiquadFilter();
  o.type = 'sawtooth';
  o.frequency.value = note || 55;
  f.type = 'lowpass'; f.frequency.value = 400;
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.3);
}

function makeStab(t){
  if(!audioCtx) return;
  var notes = [220, 277, 330];
  for(var n=0;n<notes.length;n++){
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = notes[n];
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.2);
  }
}

function playLayerHit(layer){
  if(!audioCtx) return;
  var t = audioCtx.currentTime;
  if(layer >= 1) makeKick(t);
  if(layer >= 2) makeHat(t, 0.2);
  if(layer >= 3 && layer % 2 === 1) makeSnare(t);
  if(layer >= 4) makeBass(t, 55 + (layer%3)*12);
  if(layer >= 5) makeHat(t, 0.12);
  if(layer >= 6) makeStab(t);
}

function playDrop(){
  if(!audioCtx) return;
  var t = audioCtx.currentTime;
  for(var i=0;i<8;i++){
    var off = i * 0.125;
    makeKick(t + off);
    makeBass(t + off, 41);
    makeHat(t + off + 0.0625, 0.3);
    if(i%2===0) makeSnare(t + off);
    makeStab(t + off + 0.03);
  }
  vibrate([30,20,30,20,50]);
}

function playMissSound(){
  if(!audioCtx) return;
  var t = audioCtx.currentTime;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.value = 80;
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.25);
}

function spawnBeat(isGhost){
  var lane = Math.random() < 0.5 ? 0 : 1;
  beats.push({
    y: -0.05,
    lane: lane,
    ghost: !!isGhost,
    speed: 0.55 + (bpm - 118) * 0.008,
    id: Math.random(),
    hit: false,
    trail: []
  });
}

function getBpm(){
  if(state !== 'playing') return bpm;
  var elapsed = 60 - timeLeft;
  var prog = Math.min(elapsed / 60, 1);
  return bpm + (targetBpm - bpm) * prog;
}

function spawnParticles(x, y, color, n){
  for(var i=0;i<(n||12);i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 60 + Math.random() * 120;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.3,
      color:color,r:2+Math.random()*3});
  }
}

function tryHit(){
  if(state !== 'playing' || !ctx) return;
  var zoneY = H * BEAT_ZONE_Y;
  var best = null, bestDist = 999;
  var curBpm = getBpm();
  var beatDur = 60 / curBpm;
  var perfectPx = (PERFECT_MS / 1000) / beatDur * H * 0.9;
  var goodPx = (GOOD_MS / 1000) / beatDur * H * 0.9;

  for(var i=0;i<beats.length;i++){
    var b = beats[i];
    if(b.hit) continue;
    var by = b.y * H;
    var dist = Math.abs(by - zoneY);
    if(dist < bestDist){ bestDist = dist; best = b; }
  }

  if(!best || bestDist > goodPx){
    combo = 0;
    if(comboEl) comboEl.textContent = '0';
    playMissSound();
    shakeX = 6; shakeY = 4;
    showFeedback('MISS', css('--muted'));
    vibrate(40);
    return;
  }

  best.hit = true;
  if(best.ghost){
    combo = 0;
    if(comboEl) comboEl.textContent = '0';
    score = Math.max(0, score - 50);
    playMissSound();
    shakeX = 8;
    showFeedback('GHOST', css('--neon2'));
    vibrate([20,30,20]);
    spawnParticles(W*0.5, zoneY, css('--neon2'), 8);
    return;
  }

  var perfect = bestDist <= perfectPx;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  var mult = Math.min(1 + combo * 0.1, 3);
  var pts = Math.floor((perfect ? 100 : 50) * mult);
  score += pts;

  if(perfect){
    hitPause = 0.04;
    showFeedback('PERFECT x' + combo, css('--neon3'));
    vibrate(15);
    spawnParticles(W*0.5, zoneY, css('--neon3'), 16);
  } else {
    showFeedback('GOOD x' + combo, css('--neon'));
    vibrate(8);
    spawnParticles(W*0.5, zoneY, css('--neon'), 10);
  }

  var newLayer = Math.min(LAYER_COUNT, Math.floor(score / 400) + 1);
  if(newLayer > layers){
    layers = newLayer;
    playLayerHit(layers);
    updateLayerUI();
    if(layers >= LAYER_COUNT && !dropTriggered){
      dropTriggered = true;
      playDrop();
      showFeedback('DROP!', css('--neon2'));
    }
  } else {
    playLayerHit(Math.max(1, layers));
  }

  scoreEl.textContent = score;
  if(comboEl) comboEl.textContent = combo;
}

function onTap(e){
  if(e && e.preventDefault) e.preventDefault();
  tryHit();
}

canvas.addEventListener('pointerdown', onTap);
canvas.addEventListener('touchstart', function(e){ e.preventDefault(); onTap(e); }, {passive:false});
document.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'Enter'){
    if(state === 'title') return;
    e.preventDefault();
    tryHit();
  }
});

function startGame(){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
  state = 'playing';
  score = 0; combo = 0; maxCombo = 0; layers = 0;
  timeLeft = 60; dropTriggered = false;
  beats = []; particles = []; spawnAcc = 0; ghostChance = 0;
  bpm = 118;
  sessionStart = performance.now();
  scoreEl.textContent = '0';
  if(comboEl) comboEl.textContent = '0';
  timeEl.textContent = '60';
  updateLayerUI();
  titleScreen.classList.add('hidden');
  gameoverScreen.classList.add('hidden');
}

function endGame(){
  state = 'gameover';
  if(layers >= LAYER_COUNT) playDrop();
  finalScoreEl.textContent = score;
  var rank = 'SILENCE';
  if(score >= 3000) rank = 'HEADLINER';
  else if(score >= 2000) rank = 'DROP MASTER';
  else if(score >= 1200) rank = 'BUILDER';
  else if(score >= 500) rank = 'LOOP RIDER';
  finalRankEl.textContent = rank + ' · COMBO ' + maxCombo;
  gameoverScreen.classList.remove('hidden');
}

btnStart.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});
btnRestart.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

function drawWave(y, amp, color, alpha, freq){
  if(!ctx) return;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 2;
  for(var x=0;x<=W;x+=3){
    var t = x/W * Math.PI * (freq||6) + wavePhase;
    var wy = y + Math.sin(t) * amp + Math.sin(t*2.3+1) * amp * 0.35;
    if(x===0) ctx.moveTo(x,wy); else ctx.lineTo(x,wy);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function render(ts){
  if(!ctx){ animId = requestAnimationFrame(render); return; }
  var dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  if(hitPause > 0){ hitPause -= dt; dt *= 0.15; }

  var neon = css('--neon');
  var neon2 = css('--neon2');
  var neon3 = css('--neon3');
  var bg = css('--bg');
  var fg = css('--fg');
  var muted = css('--muted');
  var zoneCol = css('--zone');

  ctx.save();
  ctx.translate(shakeX * (Math.random()-0.5), shakeY * (Math.random()-0.5));
  if(shakeX > 0.1){ shakeX *= 0.85; shakeY *= 0.85; } else { shakeX = 0; shakeY = 0; }

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  wavePhase += dt * (2 + layers * 0.4);

  var cx = W * 0.5;
  var zoneY = H * BEAT_ZONE_Y;

  for(var l=0;l<=layers;l++){
    var a = 0.08 + l * 0.04;
    var amp = 12 + l * 5 + (state==='playing' ? Math.sin(wavePhase*3)*4 : 0);
    drawWave(H*0.35 + l*8, amp, l%2===0?neon:neon2, a, 4+l*0.5);
  }

  ctx.strokeStyle = zoneCol;
  ctx.lineWidth = 2;
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(16, zoneY);
  ctx.lineTo(W-16, zoneY);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = muted;
  ctx.font = '10px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('TAP ZONE', cx, zoneY - 10);

  if(state === 'playing'){
    var curBpm = getBpm();
    var interval = 60 / curBpm;
    spawnAcc += dt;
    while(spawnAcc >= interval){
      spawnAcc -= interval;
      var elapsed = 60 - timeLeft;
      ghostChance = Math.min(0.45, elapsed > 15 ? (elapsed-15)/80 : 0);
      spawnBeat(Math.random() < ghostChance);
    }

    timeLeft -= dt;
    timeEl.textContent = Math.max(0, Math.ceil(timeLeft));
    if(timeLeft <= 0) endGame();
  }

  var curBpmPlay = state === 'playing' ? getBpm() : bpm;

  for(var i=beats.length-1;i>=0;i--){
    var b = beats[i];
    b.y += b.speed * dt * curBpmPlay / 118;
    if(b.y > 1.1 || b.hit){ beats.splice(i,1); continue; }

    var bx = b.lane === 0 ? W*0.35 : W*0.65;
    var by = b.y * H;
    b.trail.push({x:bx,y:by});
    if(b.trail.length > 6) b.trail.shift();

    for(var t=0;t<b.trail.length;t++){
      var tr = b.trail[t];
      ctx.globalAlpha = (t+1)/b.trail.length * 0.35;
      ctx.fillStyle = b.ghost ? muted : neon;
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, 4 + t, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    var r = 18 + (b.ghost ? 0 : 4);
    var pulse = 1 + Math.sin(wavePhase*5 + b.id*10)*0.08;

    if(b.ghost){
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = css('--ghost');
      ctx.strokeStyle = muted;
    } else {
      ctx.globalAlpha = 1;
      var grd = ctx.createRadialGradient(bx,by,0,bx,by,r*2);
      grd.addColorStop(0, neon);
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.strokeStyle = neon;
    }

    ctx.beginPath();
    ctx.arc(bx, by, r * pulse, 0, Math.PI*2);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;

    if(!b.ghost){
      ctx.beginPath();
      ctx.arc(bx, by, r*0.4, 0, Math.PI*2);
      ctx.fillStyle = isDark ? '#fff' : '#000';
      ctx.globalAlpha = 0.6;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  for(var p=particles.length-1;p>=0;p--){
    var pt = particles[p];
    pt.life -= dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 80 * dt;
    if(pt.life <= 0){ particles.splice(p,1); continue; }
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if(state === 'title'){
    ctx.fillStyle = fg;
    ctx.globalAlpha = 0.5;
    ctx.font = '11px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('neon waveform · summer pulse', cx, H*0.12);
    ctx.globalAlpha = 1;
  }

  if(feedbackTimer > 0){
    feedbackTimer -= dt;
    if(feedbackTimer <= 0 && feedbackEl) feedbackEl.classList.remove('show');
  }

  ctx.restore();
  animId = requestAnimationFrame(render);
}

lastTs = performance.now();
animId = requestAnimationFrame(render);

})();
</script>
</body>
</html>
