<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Karl's Gap</title>
    <style>
        :root {
            --text-color: #111;
            --bg-overlay: rgba(255, 255, 255, 0.85);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #fff;
                --bg-overlay: rgba(11, 29, 46, 0.85);
            }
        }
        body, html {
            margin: 0; padding: 0;
            width: 100dvw; height: 100dvh;
            overflow: hidden;
            background: #88b5ba; /* Default light mode water */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
        }
        #ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }
        .screen-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .panel {
            background: var(--bg-overlay);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: none;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.4rem;
            margin: 0 0 1rem 0;
            font-weight: 800;
            letter-spacing: -1px;
        }
        h2 {
            font-size: 2rem;
            margin: 0 0 0.5rem 0;
        }
        p {
            font-size: 1.1rem;
            margin: 0 0 2rem 0;
            opacity: 0.8;
            line-height: 1.5;
        }
        button {
            pointer-events: auto;
            padding: 1.2rem 2.5rem;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            background: #e03f31;
            color: #fff;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 15px rgba(224, 63, 49, 0.4);
            width: 100%;
            max-width: 250px;
        }
        button:active {
            transform: scale(0.95);
            background: #c23427;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    
    <div id="ui">
        <div id="title-screen" class="screen-container">
            <div class="panel">
                <h1>Karl's Gap</h1>
                <p>Pull back to flick your sailboat. Steer clear of the fog and bridge towers.</p>
                <button id="btn-start" data-smoke="start">Start</button>
            </div>
        </div>

        <div id="game-over-screen" class="screen-container" style="display: none;">
            <div class="panel">
                <h2>Lost in Fog</h2>
                <p>Score: <strong id="score-val" style="font-size: 1.5em;">0</strong></p>
                <button id="btn-restart" data-smoke="restart">Sail Again</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Prevent all default touch behaviors for full control
            document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            
            const uiTitle = document.getElementById('title-screen');
            const uiGameOver = document.getElementById('game-over-screen');
            const btnStart = document.getElementById('btn-start');
            const btnRestart = document.getElementById('btn-restart');
            const scoreVal = document.getElementById('score-val');

            let W, H;
            let isDark = false;
            if (window.matchMedia) {
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                isDark = mq.matches;
                mq.addEventListener('change', e => isDark = e.matches);
            }

            const colors = {
                dark: {
                    water: '#0b1d2e', waterDetail: '#122b45',
                    bridge: '#b83b32', bridgeDark: '#6b201a', cable: '#8a2b23', road: '#222',
                    fogColorStr: 'rgba(170, 185, 200, 0.85)',
                    boatHull: '#e0e0e0', boatSail: '#ffffff',
                    trajectory: 'rgba(255,255,255,0.5)', text: '#ffffff'
                },
                light: {
                    water: '#88b5ba', waterDetail: '#9ccfd4',
                    bridge: '#e03f31', bridgeDark: '#a32b21', cable: '#c23427', road: '#666',
                    fogColorStr: 'rgba(250, 252, 255, 0.9)',
                    boatHull: '#ffffff', boatSail: '#f0f0f0',
                    trajectory: 'rgba(0,0,0,0.3)', text: '#111111'
                }
            };

            let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
            let roundState = 'IDLE'; // IDLE, AIMING, SAILING, ENTERING
            let score = 0;
            let level = 1;
            let postcardAlpha = 0;

            let boat, towers, deck, fogs, sideFogs, particles;
            let aimStart = {x: 0, y: 0}, aimCurrent = {x: 0, y: 0};

            class Particle {
                constructor(x, y, color, layer = 0) {
                    this.x = x; this.y = y;
                    this.vx = (Math.random() - 0.5) * 8;
                    this.vy = (Math.random() - 0.5) * 8;
                    this.life = 1.0;
                    this.decay = 0.02 + Math.random() * 0.03;
                    this.color = color;
                    this.size = Math.random() * 4 + 2;
                    this.layer = layer; // 0: below bridge, 1: above bridge
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.life -= this.decay;
                }
                draw(ctx) {
                    ctx.globalAlpha = Math.max(0, this.life);
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            let audioCtx = null;
            function initAudio() {
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                } catch (e) {}
            }

            function playSound(type) {
                try {
                    if (!audioCtx || audioCtx.state === 'suspended') return;
                    let now = audioCtx.currentTime;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    if (type === 'flick') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1);
                    } else if (type === 'score') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(523.25, now);
                        osc.frequency.setValueAtTime(659.25, now + 0.1);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.linearRampToValueAtTime(0, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                    } else if (type === 'crash') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(100, now);
                        osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                    }
                } catch(e) {}
            }

            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W;
                canvas.height = H;
                if (!boat) {
                    boat = { x: W / 2, y: H * 0.8, vx: 0, vy: 0, angle: 0, radius: H * 0.02, crossed: false, visible: true };
                    generateLevel(1);
                    particles = [];
                } else {
                    boat.radius = H * 0.02;
                }
            }
            window.addEventListener('resize', resize);

            function generateLevel(lvl) {
                let gapRatio = Math.max(0.12, 0.4 - (lvl - 1) * 0.03);
                let gapWidth = W * gapRatio;
                let margin = W * 0.15;
                let minCenterX = margin + gapWidth / 2;
                let maxCenterX = W - margin - gapWidth / 2;
                let gapCenter = minCenterX + Math.random() * (maxCenterX - minCenterX);

                let towerW = W * 0.15;
                let towerH = H * 0.12;
                let towerY = H * 0.25;

                let leftTowerX = gapCenter - gapWidth / 2 - towerW;
                let rightTowerX = gapCenter + gapWidth / 2;

                towers = [
                    { x: leftTowerX, y: towerY, w: towerW, h: towerH },
                    { x: rightTowerX, y: towerY, w: towerW, h: towerH }
                ];
                deck = { y: towerY, h: towerH };

                sideFogs = [];
                for (let x = 0; x < leftTowerX + H*0.05; x += H * 0.05) {
                    sideFogs.push({ x, y: towerY + towerH / 2, r: H * 0.06, vx: 0, vy: 0 });
                }
                for (let x = rightTowerX + towerW - H*0.05; x < W + H*0.05; x += H * 0.05) {
                    sideFogs.push({ x, y: towerY + towerH / 2, r: H * 0.06, vx: 0, vy: 0 });
                }

                fogs = [];
                let numFogs = Math.min(6, Math.floor(lvl / 2));
                for (let i = 0; i < numFogs; i++) {
                    let r = H * 0.03 + Math.random() * H * 0.02;
                    let x = Math.random() < 0.5 ? -r : W + r;
                    let y = towerY + towerH + r + Math.random() * (H * 0.25);
                    let vx = (H * 0.0015 + Math.random() * H * 0.001 + Math.min(lvl, 20) * H * 0.0003) * (x < 0 ? 1 : -1);
                    fogs.push({ x, y, r, vx, vy: 0 });
                }
            }

            function startGame() {
                initAudio();
                uiTitle.style.display = 'none';
                uiGameOver.style.display = 'none';
                gameState = 'PLAYING';
                score = 0;
                level = 1;
                particles = [];
                postcardAlpha = 0;
                
                boat = { x: W / 2, y: H * 0.8, vx: 0, vy: 0, angle: 0, radius: H * 0.02, crossed: false, visible: true };
                generateLevel(level);
                roundState = 'IDLE';
            }

            function crash(reason) {
                gameState = 'GAMEOVER';
                boat.crossed = false;
                boat.visible = false;
                if (navigator.vibrate) try { navigator.vibrate([50, 50, 50]); } catch(e){}
                playSound('crash');
                
                let mc = isDark ? colors.dark : colors.light;
                for (let i = 0; i < 40; i++) {
                    particles.push(new Particle(boat.x, boat.y, mc.bridge, 1));
                }
                
                scoreVal.innerText = score.toString();
                uiGameOver.style.display = 'flex';
            }

            btnStart.addEventListener('click', startGame);
            btnRestart.addEventListener('click', startGame);

            // Input handling
            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('button')) return;
                if (gameState === 'PLAYING' && roundState === 'IDLE') {
                    roundState = 'AIMING';
                    aimStart = { x: e.clientX, y: e.clientY };
                    aimCurrent = { x: e.clientX, y: e.clientY };
                }
            });
            window.addEventListener('pointermove', (e) => {
                if (gameState === 'PLAYING' && roundState === 'AIMING') {
                    aimCurrent = { x: e.clientX, y: e.clientY };
                }
            });
            window.addEventListener('pointerup', (e) => {
                if (gameState === 'PLAYING' && roundState === 'AIMING') {
                    let dx = aimStart.x - aimCurrent.x;
                    let dy = aimStart.y - aimCurrent.y;
                    let dist = Math.hypot(dx, dy);
                    let maxDrag = H * 0.3;
                    
                    if (dist > maxDrag) {
                        dx = (dx / dist) * maxDrag;
                        dy = (dy / dist) * maxDrag;
                    }

                    if (dist > 10) {
                        boat.vx = dx * 0.15;
                        boat.vy = dy * 0.15;
                        roundState = 'SAILING';
                        playSound('flick');
                    } else {
                        roundState = 'IDLE';
                    }
                }
            });
            window.addEventListener('pointercancel', (e) => {
                if (gameState === 'PLAYING' && roundState === 'AIMING') roundState = 'IDLE';
            });

            function updateBoat() {
                if (roundState === 'SAILING') {
                    boat.vx *= 0.985;
                    boat.vy *= 0.985;
                    boat.x += boat.vx;
                    boat.y += boat.vy;

                    let speed = Math.hypot(boat.vx, boat.vy);
                    if (speed > 0.5) {
                        boat.angle = Math.atan2(boat.vy, boat.vx) + Math.PI / 2;
                    }

                    if (speed > 1 && Math.random() < 0.5) {
                        let wakeX = boat.x - Math.cos(boat.angle - Math.PI / 2) * boat.radius;
                        let wakeY = boat.y - Math.sin(boat.angle - Math.PI / 2) * boat.radius;
                        let p = new Particle(wakeX, wakeY, 'rgba(255,255,255,0.3)', 0);
                        p.vx = 0; p.vy = 0;
                        particles.push(p);
                    }

                    if (boat.y < deck.y && !boat.crossed) {
                        boat.crossed = true;
                        postcardAlpha = 1.0;
                        if (navigator.vibrate) try { navigator.vibrate(30); } catch(e){}
                        playSound('score');
                    }

                    if (boat.y < -H * 0.1) {
                        score++;
                        level++;
                        generateLevel(level);
                        boat.y = H + H * 0.1;
                        boat.vx = 0;
                        boat.vy = -H * 0.015;
                        boat.crossed = false;
                        roundState = 'ENTERING';
                    }

                    if (speed < 0.2 && !boat.crossed && boat.y >= deck.y) {
                        crash('stranded');
                    }
                } else if (roundState === 'ENTERING') {
                    boat.vy *= 0.95;
                    boat.y += boat.vy;
                    boat.angle = 0;
                    
                    if (boat.y <= H * 0.8) {
                        boat.y = H * 0.8;
                        boat.vy = 0;
                        roundState = 'IDLE';
                    } else if (Math.abs(boat.vy) < 0.2) {
                        boat.y = H * 0.8;
                        boat.vy = 0;
                        roundState = 'IDLE';
                    }
                }
            }

            function checkCollisions() {
                if (roundState !== 'SAILING' && roundState !== 'ENTERING') return;
                
                if (boat.x < -boat.radius || boat.x > W + boat.radius || boat.y > H + boat.radius) {
                    crash('bounds'); return;
                }

                for (let t of towers) {
                    let testX = Math.max(t.x, Math.min(boat.x, t.x + t.w));
                    let testY = Math.max(t.y, Math.min(boat.y, t.y + t.h));
                    let dist = Math.hypot(boat.x - testX, boat.y - testY);
                    if (dist <= boat.radius * 0.8) {
                        crash('tower'); return;
                    }
                }

                let allFogs = fogs.concat(sideFogs);
                for (let f of allFogs) {
                    let dist = Math.hypot(boat.x - f.x, boat.y - f.y);
                    if (dist < boat.radius + f.r * 0.7) {
                        crash('fog'); return;
                    }
                }
            }

            function update() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }

                if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                    for (let f of fogs) {
                        f.x += f.vx;
                        if (f.x > W + f.r * 2 && f.vx > 0) f.x = -f.r * 2;
                        if (f.x < -f.r * 2 && f.vx < 0) f.x = W + f.r * 2;
                    }
                }

                if (gameState === 'PLAYING') {
                    updateBoat();
                    checkCollisions();
                }
            }

            function drawBridgeTopDown(ctx, towers, deck, mc) {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(0, deck.y + 20, W, deck.h);

                ctx.fillStyle = mc.road;
                ctx.fillRect(0, deck.y, W, deck.h);

                ctx.fillStyle = mc.bridge;
                ctx.fillRect(0, deck.y, W, deck.h * 0.1);
                ctx.fillRect(0, deck.y + deck.h * 0.9, W, deck.h * 0.1);

                ctx.fillStyle = mc.bridge;
                for (let t of towers) {
                    ctx.fillRect(t.x, t.y, t.w, t.h);
                    ctx.fillStyle = mc.cable;
                    ctx.fillRect(t.x + t.w * 0.2, t.y + t.h * 0.2, t.w * 0.6, t.h * 0.6);
                    ctx.fillStyle = mc.bridge;
                }

                let leftX = towers[0].x + towers[0].w / 2;
                let rightX = towers[1].x + towers[1].w / 2;
                let gapW = rightX - leftX;

                if (gapW > 0) {
                    ctx.strokeStyle = mc.bridge;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(leftX, deck.y + deck.h * 0.1);
                    ctx.quadraticCurveTo(leftX + gapW / 2, deck.y + deck.h * 0.1, rightX, deck.y + deck.h * 0.1);
                    ctx.moveTo(leftX, deck.y + deck.h * 0.9);
                    ctx.quadraticCurveTo(leftX + gapW / 2, deck.y + deck.h * 0.9, rightX, deck.y + deck.h * 0.9);
                    ctx.stroke();
                }
            }

            function render() {
                ctx.clearRect(0, 0, W, H);
                let mc = isDark ? colors.dark : colors.light;
                
                document.body.style.background = mc.water;

                ctx.fillStyle = mc.water;
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = mc.waterDetail;
                for(let i=0; i<10; i++) {
                    let y = (performance.now() * 0.02 + i * H * 0.1) % H;
                    ctx.fillRect(0, y, W, H * 0.01);
                }

                for (let p of particles) if (p.layer === 0) p.draw(ctx);

                if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                    if (roundState === 'AIMING') {
                        let dx = aimStart.x - aimCurrent.x;
                        let dy = aimStart.y - aimCurrent.y;
                        let dist = Math.hypot(dx, dy);
                        let maxDrag = H * 0.3;
                        if (dist > maxDrag) { dx = (dx/dist)*maxDrag; dy = (dy/dist)*maxDrag; }
                        
                        if (dist > 10) {
                            ctx.beginPath();
                            ctx.moveTo(boat.x, boat.y);
                            let px = boat.x, py = boat.y;
                            let vx = dx * 0.15, vy = dy * 0.15;
                            for (let i = 0; i < 20; i++) {
                                px += vx; py += vy;
                                vx *= 0.985; vy *= 0.985;
                                ctx.lineTo(px, py);
                            }
                            ctx.strokeStyle = mc.trajectory;
                            ctx.lineWidth = 3;
                            ctx.setLineDash([8, 8]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                    }

                    if (boat.visible) {
                        ctx.save();
                        ctx.translate(boat.x, boat.y);
                        ctx.rotate(boat.angle);
                        
                        ctx.fillStyle = mc.boatHull;
                        ctx.shadowColor = 'rgba(0,0,0,0.4)';
                        ctx.shadowBlur = 8;
                        ctx.shadowOffsetY = 4;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, boat.radius * 0.6, boat.radius, 0, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.shadowColor = 'transparent';
                        ctx.fillStyle = mc.boatSail;
                        ctx.beginPath();
                        ctx.moveTo(0, -boat.radius * 0.8);
                        ctx.lineTo(-boat.radius * 0.8, boat.radius * 0.6);
                        ctx.lineTo(boat.radius * 0.2, boat.radius * 0.4);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                drawBridgeTopDown(ctx, towers, deck, mc);

                let allFogs = fogs.concat(sideFogs);
                ctx.shadowBlur = 20;
                ctx.shadowColor = mc.fogColorStr;
                ctx.fillStyle = mc.fogColorStr;
                for (let f of allFogs) {
                    let pulse = Math.sin(performance.now() * 0.002 + f.x) * f.r * 0.1;
                    let radius = Math.max(0.1, f.r + pulse);
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;

                for (let p of particles) if (p.layer === 1) p.draw(ctx);

                if (postcardAlpha > 0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${postcardAlpha})`;
                    ctx.fillRect(0, 0, W, H);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${postcardAlpha})`;
                    ctx.lineWidth = 15;
                    ctx.strokeRect(15, 15, W - 30, H - 30);
                    postcardAlpha -= 0.04;
                }

                if (gameState === 'PLAYING') {
                    ctx.fillStyle = mc.text;
                    ctx.font = 'bold 36px ui-monospace, "SFMono-Regular", Menlo, monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 4;
                    ctx.fillText(score.toString(), W / 2, 25);
                    ctx.shadowBlur = 0;
                }
            }

            function gameLoop() {
                requestAnimationFrame(gameLoop);
                update();
                render();
            }

            // Init
            resize();
            requestAnimationFrame(gameLoop);

        })();
    </script>
</body>
</html>
