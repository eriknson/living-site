<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mist Sync</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  background:var(--bg);color:var(--fg);
  --bg:#e8eaed;--fg:#1a1a1a;--muted:#5a5f66;--panel:rgba(255,255,255,.88);--border:rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  body{--bg:#0d0f12;--fg:#e8eaed;--muted:#8b9199;--panel:rgba(18,20,24,.92);--border:rgba(255,255,255,.08)}
}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;height:100%;display:block;touch-action:none}
#hud{
  position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;
}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hud-val{font-size:18px;font-weight:600;line-height:1.1}
#streak-bar{
  position:absolute;top:max(56px,env(safe-area-inset-top));left:16px;right:16px;height:3px;
  background:var(--border);border-radius:2px;overflow:hidden;pointer-events:none;z-index:2;
}
#streak-fill{height:100%;width:0;background:linear-gradient(90deg,#e63946,#ffd60a,#1d9bf0);transition:width .15s ease}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;pointer-events:none;z-index:10;transition:opacity .35s ease;
}
.overlay.hidden{opacity:0;visibility:hidden}
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:28px 24px;max-width:340px;width:100%;backdrop-filter:blur(12px);
}
.panel h1{font-size:22px;letter-spacing:-.02em;margin-bottom:6px;font-weight:700}
.panel p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:20px}
.panel .tag{
  display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;
}
.btn{
  pointer-events:auto;min-height:48px;min-width:160px;padding:14px 28px;
  border:none;border-radius:12px;font:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:transform .12s ease,opacity .12s ease;
  background:var(--fg);color:var(--bg);
}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid #1d9bf0;outline-offset:2px}
#gameover .score-row{display:flex;justify-content:space-around;margin:16px 0 20px;gap:12px}
#gameover .score-item{text-align:center}
#gameover .score-item .val{font-size:24px;font-weight:700}
#gameover .score-item .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
#timer-ring{
  position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:72px;height:72px;pointer-events:none;z-index:2;
}
#hit-zone{
  position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);
  width:120px;height:120px;border-radius:50%;pointer-events:none;z-index:1;
  border:2px solid rgba(255,255,255,.25);opacity:0;transition:opacity .3s;
}
#hit-zone.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hit-zone"></div>
  <svg id="timer-ring" viewBox="0 0 72 72"><circle cx="36" cy="36" r="32" fill="none" stroke="var(--border)" stroke-width="3"/><circle id="timer-arc" cx="36" cy="36" r="32" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="0" transform="rotate(-90 36 36)"/></svg>
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Score</span><span class="hud-val" id="score">0</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Streak</span><span class="hud-val" id="streak">0</span></div>
  </div>
  <div id="streak-bar"><div id="streak-fill"></div></div>
  <div id="title" class="overlay">
    <div class="panel">
      <div class="tag">Stutter House · SF Fog</div>
      <h1>Mist Sync</h1>
      <p>Tap on the beat to burn through the grey. Clear 16 in a row and the primaries bloom.</p>
      <button class="btn" data-smoke="start" id="btn-start">Begin</button>
    </div>
  </div>
  <div id="gameover" class="overlay hidden">
    <div class="panel">
      <div class="tag">Session End</div>
      <h1 id="go-title">Out of Sync</h1>
      <div class="score-row">
        <div class="score-item"><div class="val" id="final-score">0</div><div class="lbl">Score</div></div>
        <div class="score-item"><div class="val" id="final-streak">0</div><div class="lbl">Best Streak</div></div>
        <div class="score-item"><div class="val" id="final-acc">0%</div><div class="lbl">Accuracy</div></div>
      </div>
      <button class="btn" data-smoke="restart" id="btn-restart">Play Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var hitZoneEl = document.getElementById('hit-zone');
var scoreEl = document.getElementById('score');
var streakEl = document.getElementById('streak');
var streakFill = document.getElementById('streak-fill');
var timerArc = document.getElementById('timer-arc');
var titleEl = document.getElementById('title');
var gameoverEl = document.getElementById('gameover');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 0, H = 0, dpr = 1;
var state = 'menu';
var score = 0, streak = 0, bestStreak = 0, misses = 0, maxMisses = 5;
var hits = 0, totalBeats = 0;
var roundTime = 0, roundDuration = 50;
var bloomActive = false, bloomTimer = 0;
var fogCanvas, fogCtx, fogData;
var particles = [];
var beatMarkers = [];
var nextBeatTime = 1.2;
var patternIdx = 0;
var bpm = 88;
var elapsed = 0;
var floatTexts = [];
var tapRipples = [];
var audioCtx = null;
var masterGain = null;
var animId = 0;
var lastTs = 0;
var shake = 0;
var comboFlash = 0;
var regrowRate = 0.003;
var beatPattern = [];
var patternLen = 16;
var BLOOM_TARGET = 16;

var COLORS = {
  red: {r:255,g:45,b:45},
  yellow: {r:255,g:214,b:0},
  blue: {r:29,g:155,b:240},
  grey: {r:140,g:145,b:150}
};

function isDark(){
  try { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  catch(e){ return false; }
}

function resize(){
  if(!canvas) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  initFog();
}

function initFog(){
  if(!W || !H) return;
  fogCanvas = document.createElement('canvas');
  fogCanvas.width = Math.ceil(W / 4);
  fogCanvas.height = Math.ceil(H / 4);
  fogCtx = fogCanvas.getContext('2d');
  if(!fogCtx) return;
  fogCtx.fillStyle = isDark() ? 'rgba(30,32,36,0.95)' : 'rgba(180,185,190,0.92)';
  fogCtx.fillRect(0, 0, fogCanvas.width, fogCanvas.height);
}

function clearFogAt(x, y, radius, strength){
  if(!fogCtx || !fogCanvas) return;
  var sx = x / 4, sy = y / 4, sr = radius / 4;
  var grad = fogCtx.createRadialGradient(sx, sy, 0, sx, sy, sr);
  grad.addColorStop(0, 'rgba(0,0,0,' + strength + ')');
  grad.addColorStop(0.6, 'rgba(0,0,0,' + (strength * 0.5) + ')');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  fogCtx.globalCompositeOperation = 'destination-out';
  fogCtx.fillStyle = grad;
  fogCtx.beginPath();
  fogCtx.arc(sx, sy, sr, 0, Math.PI * 2);
  fogCtx.fill();
  fogCtx.globalCompositeOperation = 'source-over';
}

function regrowFog(dt){
  if(!fogCtx || !fogCanvas) return;
  var rate = regrowRate * (1 + misses * 0.15) * dt;
  var fill = isDark() ? 'rgba(30,32,36,' + rate + ')' : 'rgba(180,185,190,' + rate + ')';
  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.fillStyle = fill;
  fogCtx.fillRect(0, 0, fogCanvas.width, fogCanvas.height);
}

function buildPattern(){
  beatPattern = [];
  for(var i = 0; i < patternLen; i++){
    var stutter = Math.random() < 0.2 + Math.min(0.15, (bpm - 88) * 0.004);
    beatPattern.push({stutter: stutter && i > 0, gap: 60 / bpm * (Math.random() < 0.1 ? 1.45 : 1)});
  }
}

function spawnBeat(at, stutter){
  beatMarkers.push({
    hitTime: at,
    stutter: !!stutter,
    judged: false,
    _played: false
  });
}

function queueNextBeat(){
  if(!beatPattern.length) buildPattern();
  var step = beatPattern[patternIdx % beatPattern.length];
  patternIdx++;
  spawnBeat(nextBeatTime, step.stutter);
  nextBeatTime += step.gap;
  if(step.stutter){
    spawnBeat(nextBeatTime, true);
    nextBeatTime += 60 / bpm * 0.26;
  }
}

function initAudio(){
  if(audioCtx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.35;
    masterGain.connect(audioCtx.destination);
  } catch(e){ audioCtx = null; }
}

function playKick(time, vol){
  if(!audioCtx || !masterGain) return;
  try {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(40, time + 0.08);
    g.gain.setValueAtTime(vol || 0.7, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
    osc.connect(g); g.connect(masterGain);
    osc.start(time); osc.stop(time + 0.16);
  } catch(e){}
}

function playHat(time, vol){
  if(!audioCtx || !masterGain) return;
  try {
    var bufSize = audioCtx.sampleRate * 0.04;
    var buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    var data = buf.getChannelData(0);
    for(var i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    var g = audioCtx.createGain();
    var filt = audioCtx.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.value = 6000;
    g.gain.setValueAtTime(vol || 0.25, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
    src.connect(filt); filt.connect(g); g.connect(masterGain);
    src.start(time); src.stop(time + 0.05);
  } catch(e){}
}

function playTone(time, freq, dur, vol){
  if(!audioCtx || !masterGain) return;
  try {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(vol || 0.15, time + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(time); osc.stop(time + dur + 0.05);
  } catch(e){}
}

function scheduleBeats(){
  beatMarkers = [];
  patternIdx = 0;
  buildPattern();
  nextBeatTime = elapsed + 1.2;
  for(var i = 0; i < 6; i++) queueNextBeat();
}

function addFloatText(text, color){
  floatTexts.push({text: text, y: H * 0.48, life: 0.9, color: color || '#ffd60a', scale: 1});
}

function addRipple(){
  tapRipples.push({r: 20, life: 0.35, max: 70});
}

function spawnParticles(x, y, color, count){
  for(var i = 0; i < (count || 12); i++){
    var ang = Math.random() * Math.PI * 2;
    var spd = 60 + Math.random() * 180;
    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.8,
      r: 2 + Math.random() * 4,
      color: color
    });
  }
}

function pickColor(){
  var keys = ['red','yellow','blue'];
  return COLORS[keys[Math.floor(Math.random() * 3)]];
}

function drawColorLayer(t){
  if(!ctx) return;
  var cx = W * 0.5, cy = H * 0.42;
  var blobs = [
    {x: W*0.25, y: H*0.35, c: COLORS.red, r: W*0.35},
    {x: W*0.75, y: H*0.38, c: COLORS.yellow, r: W*0.32},
    {x: W*0.5, y: H*0.55, c: COLORS.blue, r: W*0.38}
  ];
  ctx.save();
  for(var i = 0; i < blobs.length; i++){
    var b = blobs[i];
    var ox = Math.sin(t * 0.4 + i * 2) * 20;
    var oy = Math.cos(t * 0.35 + i * 1.5) * 15;
    var grad = ctx.createRadialGradient(b.x + ox, b.y + oy, 0, b.x + ox, b.y + oy, b.r);
    var sat = bloomActive ? 1.3 : 0.85 + streak * 0.015;
    grad.addColorStop(0, 'rgba(' + b.c.r + ',' + b.c.g + ',' + b.c.b + ',' + Math.min(1, 0.7 * sat) + ')');
    grad.addColorStop(0.5, 'rgba(' + b.c.r + ',' + b.c.g + ',' + b.c.b + ',' + Math.min(1, 0.35 * sat) + ')');
    grad.addColorStop(1, 'rgba(' + b.c.r + ',' + b.c.g + ',' + b.c.b + ',0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x + ox, b.y + oy, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  if(bloomActive){
    var bloomGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*0.8);
    bloomGrad.addColorStop(0, 'rgba(255,100,50,0.35)');
    bloomGrad.addColorStop(0.35, 'rgba(255,220,0,0.25)');
    bloomGrad.addColorStop(0.7, 'rgba(50,150,255,0.2)');
    bloomGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bloomGrad;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function drawBeatMarkers(t){
  if(!ctx || state !== 'playing') return;
  var zoneY = H * 0.58;
  var zoneR = 50;
  for(var i = 0; i < beatMarkers.length; i++){
    var m = beatMarkers[i];
    if(m.judged) continue;
    var dt = m.hitTime - elapsed;
    var approachTime = 1.2;
    if(dt < -0.3 || dt > approachTime) continue;
    var prog = 1 - dt / approachTime;
    var y = zoneY - prog * (H * 0.45);
    var alpha = Math.min(1, prog * 1.5) * (dt > -0.15 ? 1 : Math.max(0, 1 + dt * 6));
    var r = zoneR * (0.4 + prog * 0.6);
    var col = m.stutter ? COLORS.yellow : COLORS.blue;
    ctx.save();
    ctx.globalAlpha = alpha * 0.7;
    ctx.strokeStyle = 'rgba(' + col.r + ',' + col.g + ',' + col.b + ',0.8)';
    ctx.lineWidth = m.stutter ? 3 : 2;
    ctx.beginPath();
    ctx.arc(W * 0.5, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = alpha * 0.3;
    ctx.fillStyle = 'rgba(' + col.r + ',' + col.g + ',' + col.b + ',0.15)';
    ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.strokeStyle = isDark() ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(W * 0.5, zoneY, zoneR, 0, Math.PI * 2);
  ctx.stroke();
  if(comboFlash > 0){
    ctx.globalAlpha = comboFlash;
    ctx.strokeStyle = '#ffd60a';
    ctx.lineWidth = 3;
    ctx.stroke();
    comboFlash -= 0.04;
  }
  ctx.restore();
}

function drawFog(){
  if(!ctx || !fogCanvas) return;
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(fogCanvas, 0, 0, W, H);
  ctx.restore();
}

function drawParticles(dt){
  if(!ctx) return;
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt;
    var a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgb(' + p.color.r + ',' + p.color.g + ',' + p.color.b + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFeedback(dt){
  if(!ctx) return;
  shake *= 0.85;
  var zoneY = H * 0.58;
  for(var i = floatTexts.length - 1; i >= 0; i--){
    var f = floatTexts[i];
    f.life -= dt;
    f.y -= 40 * dt;
    if(f.life <= 0){ floatTexts.splice(i, 1); continue; }
    var a = Math.min(1, f.life * 2);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '600 15px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, W * 0.5, f.y);
    ctx.restore();
  }
  for(var j = tapRipples.length - 1; j >= 0; j--){
    var rp = tapRipples[j];
    rp.life -= dt;
    if(rp.life <= 0){ tapRipples.splice(j, 1); continue; }
    var prog = 1 - rp.life / 0.35;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - prog)) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W * 0.5, zoneY, rp.r + prog * rp.max, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function updateHUD(){
  if(scoreEl) scoreEl.textContent = score;
  if(streakEl) streakEl.textContent = streak;
  if(streakFill) streakFill.style.width = Math.min(100, (streak / BLOOM_TARGET) * 100) + '%';
  if(timerArc){
    var remain = Math.max(0, roundDuration - roundTime);
    var circ = 201;
    timerArc.setAttribute('stroke-dashoffset', circ * (1 - remain / roundDuration));
  }
}

function regrowFogBurst(amount){
  if(!fogCtx || !fogCanvas) return;
  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.fillStyle = isDark() ? 'rgba(30,32,36,' + amount + ')' : 'rgba(180,185,190,' + amount + ')';
  fogCtx.fillRect(0, 0, fogCanvas.width, fogCanvas.height);
}

function judgeMiss(beat){
  if(beat.judged) return;
  beat.judged = true;
  totalBeats++;
  misses++;
  streak = 0;
  shake = 8;
  regrowRate = Math.min(0.012, regrowRate + 0.0008);
  if(typeof navigator !== 'undefined' && navigator.vibrate) try { navigator.vibrate(80); } catch(e){}
  regrowFogBurst(0.18);
  addFloatText('MISS', '#e63946');
  if(misses >= maxMisses) endGame(false);
}

function judgeHit(quality){
  var zoneY = H * 0.58;
  var nearest = null, nearestDist = Infinity;
  for(var i = 0; i < beatMarkers.length; i++){
    var m = beatMarkers[i];
    if(m.judged) continue;
    var dt = Math.abs(m.hitTime - elapsed);
    if(dt < nearestDist){ nearestDist = dt; nearest = m; }
  }
  if(!nearest || nearestDist > 0.18){
    if(quality === 'tap') return false;
    return false;
  }
  nearest.judged = true;
  totalBeats++;
  hits++;
  var col = pickColor();
  var pts = 0;
  addRipple();
  if(nearestDist < 0.055){
    pts = 100; quality = 'perfect';
    comboFlash = 1;
    addFloatText('PERFECT', '#ffd60a');
    if(typeof navigator !== 'undefined' && navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
  } else if(nearestDist < 0.13){
    pts = 50; quality = 'good';
    addFloatText('GOOD', '#1d9bf0');
  } else {
    pts = 20;
    addFloatText('OK', '#8b9199');
  }
  streak++;
  if(streak > bestStreak) bestStreak = streak;
  var mult = 1 + Math.floor(streak / 4) * 0.25;
  score += Math.round(pts * mult);
  clearFogAt(W * 0.5, zoneY, 80 + streak * 3, 0.85);
  spawnParticles(W * 0.5, zoneY, col, quality === 'perfect' ? 18 : 10);
  if(audioCtx){
    var now = audioCtx.currentTime;
    playTone(now, quality === 'perfect' ? 880 : 660, 0.08, 0.12);
  }
  if(streak >= BLOOM_TARGET && !bloomActive){
    triggerBloom();
  }
  misses = Math.max(0, misses - (quality === 'perfect' ? 1 : 0));
  return true;
}

function triggerBloom(){
  bloomActive = true;
  bloomTimer = 2.5;
  score += 500;
  clearFogAt(W * 0.5, H * 0.5, Math.max(W,H) * 0.7, 1);
  spawnParticles(W * 0.5, H * 0.42, COLORS.red, 30);
  spawnParticles(W * 0.35, H * 0.5, COLORS.yellow, 25);
  spawnParticles(W * 0.65, H * 0.5, COLORS.blue, 25);
  if(typeof navigator !== 'undefined' && navigator.vibrate) try { navigator.vibrate([30,20,30,20,50]); } catch(e){}
  if(audioCtx){
    var now = audioCtx.currentTime;
    playTone(now, 440, 0.3, 0.2);
    playTone(now + 0.1, 554, 0.3, 0.18);
    playTone(now + 0.2, 659, 0.4, 0.16);
  }
}

function endGame(completed){
  state = 'gameover';
  if(hitZoneEl) hitZoneEl.classList.remove('show');
  if(gameoverEl) gameoverEl.classList.remove('hidden');
  var acc = totalBeats > 0 ? Math.round((hits / totalBeats) * 100) : 0;
  var fs = document.getElementById('final-score');
  var fst = document.getElementById('final-streak');
  var fa = document.getElementById('final-acc');
  var gt = document.getElementById('go-title');
  if(fs) fs.textContent = score;
  if(fst) fst.textContent = bestStreak;
  if(fa) fa.textContent = acc + '%';
  if(gt) gt.textContent = completed ? 'Color Bloom' : 'Out of Sync';
}

function startGame(){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') try { audioCtx.resume(); } catch(e){}
  score = 0; streak = 0; bestStreak = 0; misses = 0;
  hits = 0; totalBeats = 0;
  roundTime = 0; elapsed = 0;
  bpm = 88; regrowRate = 0.003;
  bloomActive = false; bloomTimer = 0;
  particles = []; floatTexts = []; tapRipples = [];
  state = 'playing';
  if(titleEl) titleEl.classList.add('hidden');
  if(gameoverEl) gameoverEl.classList.add('hidden');
  if(hitZoneEl) hitZoneEl.classList.add('show');
  initFog();
  scheduleBeats();
  updateHUD();
}

function update(dt){
  if(state !== 'playing') return;
  elapsed += dt;
  roundTime += dt;

  if(bloomActive){
    bloomTimer -= dt;
    if(bloomTimer <= 0) bloomActive = false;
  }

  regrowFog(dt);

  for(var i = 0; i < beatMarkers.length; i++){
    var m = beatMarkers[i];
    if(!m.judged && elapsed > m.hitTime + 0.15) judgeMiss(m);
  }

  while(beatMarkers.length < 8) queueNextBeat();
  if(patternIdx > 0 && patternIdx % 16 === 0) bpm = Math.min(128, bpm + 3);
  beatMarkers = beatMarkers.filter(function(m){ return m.judged || elapsed - m.hitTime < 2; });

  if(roundTime >= roundDuration){
    endGame(true);
    return;
  }

  if(audioCtx && masterGain){
    var now = audioCtx.currentTime;
    for(var j = 0; j < beatMarkers.length; j++){
      var b = beatMarkers[j];
      if(!b.judged && !b._played && elapsed >= b.hitTime - 0.001){
        b._played = true;
        playKick(now, b.stutter ? 0.5 : 0.65);
        if(b.stutter) playKick(now + 0.04, 0.35);
        playHat(now + 0.02, 0.15);
      }
    }
  }

  updateHUD();
}

function render(t, dt){
  if(!ctx) return;
  var frameDt = dt || 1/60;
  var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  var sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.fillStyle = isDark() ? '#0d0f12' : '#e8eaed';
  ctx.fillRect(0, 0, W, H);
  drawColorLayer(t);
  drawFog();
  drawBeatMarkers(t);
  drawParticles(frameDt);
  drawFeedback(frameDt);
  ctx.restore();
}

function loop(ts){
  if(!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  update(dt);
  render(ts / 1000, dt);
  animId = requestAnimationFrame(loop);
}

function onTap(e){
  if(e && e.preventDefault) e.preventDefault();
  if(state !== 'playing') return;
  judgeHit('tap');
}

function onKey(e){
  if(e.code === 'Space' || e.code === 'Enter'){
    if(state === 'playing'){
      if(e.preventDefault) e.preventDefault();
      judgeHit('tap');
    }
  }
}

if(btnStart) btnStart.addEventListener('click', function(e){ if(e.stopPropagation) e.stopPropagation(); startGame(); });
if(btnRestart) btnRestart.addEventListener('click', function(e){ if(e.stopPropagation) e.stopPropagation(); startGame(); });

if(canvas){
  canvas.addEventListener('touchstart', onTap, {passive:false});
  canvas.addEventListener('mousedown', onTap);
}
document.addEventListener('keydown', onKey);
window.addEventListener('resize', resize);

resize();
render(0, 1/60);
animId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
