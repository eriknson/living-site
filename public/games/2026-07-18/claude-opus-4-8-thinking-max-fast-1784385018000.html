<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#04080a">
<title>UNDERFLOW // wire the dead code</title>
<style>
  :root{
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    /* light (paper terminal) */
    --bg:#eef2ea;
    --ink:#0b6b34;
    --ink-dim:rgba(11,107,52,.62);
    --panel:rgba(240,244,236,.80);
    --border:rgba(11,107,52,.30);
    --btn-bg:#0b6b34;
    --btn-fg:#f2f7ee;
    --danger:#c0392b;
    --amber:#a45c00;
    --glow:rgba(11,107,52,.20);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#04080a;
      --ink:#40f0a0;
      --ink-dim:rgba(64,240,160,.62);
      --panel:rgba(6,14,16,.70);
      --border:rgba(64,240,160,.26);
      --btn-bg:#0c2b20;
      --btn-fg:#a6ffd4;
      --danger:#ff5a6a;
      --amber:#ffcf6b;
      --glow:rgba(64,240,160,.45);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;}
  body{min-height:100dvh;color:var(--ink);font-family:var(--mono);}
  #game{
    display:block;
    width:100vw;width:100dvw;
    height:100vh;height:100dvh;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .overlay{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);
    pointer-events:none;
  }
  .overlay.hidden{display:none;}
  .panel{
    pointer-events:none;
    width:100%;max-width:430px;text-align:center;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:34px 24px 24px;
    box-shadow:0 18px 60px rgba(0,0,0,.30), inset 0 0 0 1px rgba(255,255,255,.03);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .brand{
    font-size:clamp(36px,11.5vw,64px);
    font-weight:700;letter-spacing:2px;line-height:.98;
    color:var(--ink);
    text-shadow:0 0 22px var(--glow);
    white-space:nowrap;
  }
  .brand.small{font-size:clamp(24px,7.5vw,38px);letter-spacing:2px;}
  .tag{margin-top:10px;font-size:13px;letter-spacing:3px;color:var(--ink-dim);text-transform:uppercase;}
  .how{margin:20px auto 4px;font-size:14.5px;line-height:1.65;color:var(--ink);max-width:330px;opacity:.94;}
  .how b{color:var(--ink);font-weight:700;}
  .how b.bad{color:var(--danger);}
  .stats{margin:18px auto 4px;font-size:15px;line-height:1.9;color:var(--ink);letter-spacing:1px;}
  .stats .k{color:var(--ink-dim);}
  .stats .v{color:var(--ink);font-weight:700;}
  .stats .big{font-size:34px;display:block;margin:2px 0 6px;text-shadow:0 0 18px var(--glow);}
  .btn{
    pointer-events:auto;
    font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:2px;
    color:var(--btn-fg);background:var(--btn-bg);
    border:1px solid var(--border);border-radius:14px;
    padding:17px 30px;margin-top:22px;min-width:210px;min-height:56px;
    cursor:pointer;
    box-shadow:0 8px 30px var(--glow);
    transition:transform .07s ease, filter .16s ease, box-shadow .16s ease;
  }
  .btn:hover{filter:brightness(1.12);box-shadow:0 10px 40px var(--glow);}
  .btn:active{transform:translateY(2px) scale(.985);}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .hint{margin-top:14px;font-size:11.5px;letter-spacing:2px;color:var(--ink-dim);text-transform:uppercase;}
  .chip{
    pointer-events:auto;position:absolute;
    right:calc(env(safe-area-inset-right) + 12px);
    bottom:calc(env(safe-area-inset-bottom) + 12px);
    width:44px;height:44px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:18px;
    color:var(--ink);background:var(--panel);
    border:1px solid var(--border);
    cursor:pointer;opacity:.85;
  }
  .chip.hidden{display:none;}
  .chip:active{transform:scale(.94);}
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="title" class="overlay">
      <div class="panel">
        <div class="brand">UNDER<span style="opacity:.55">FLOW</span></div>
        <div class="tag">the stack is going quiet</div>
        <p class="how">
          Drag one path through the <b>live</b> nodes<br>
          before the decline floods them.<br>
          Steer clear of <b class="bad">dead</b> code.
        </p>
        <button class="btn" data-smoke="start" id="startBtn">&#9654;&nbsp; CONNECT</button>
        <div class="hint">drag &middot; mouse &middot; wasd / arrows</div>
      </div>
    </div>
    <div id="over" class="overlay hidden">
      <div class="panel">
        <div class="brand small" id="overTitle">SIGNAL LOST</div>
        <div class="stats" id="overStats"></div>
        <button class="btn" data-smoke="restart" id="restartBtn">&#8635;&nbsp; RECONNECT</button>
        <div class="hint">enter / space to retry</div>
      </div>
    </div>
    <button class="chip hidden" id="soundBtn" aria-label="toggle sound">&#9834;</button>
  </div>

<script>
"use strict";
(function(){
  var canvas = document.getElementById('game');
  var ctx = canvas ? canvas.getContext('2d') : null;

  // Elements (guarded)
  var elTitle   = document.getElementById('title');
  var elOver    = document.getElementById('over');
  var elOverStats = document.getElementById('overStats');
  var elOverTitle = document.getElementById('overTitle');
  var elStart   = document.getElementById('startBtn');
  var elRestart = document.getElementById('restartBtn');
  var elSound   = document.getElementById('soundBtn');

  // ---------- helpers ----------
  var PI = Math.PI, TAU = PI*2;
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function rnd(a,b){ return a+Math.random()*(b-a); }
  function rndi(a,b){ return Math.floor(rnd(a,b+1)); }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
  function easeOutCubic(t){ t=1-t; return 1-t*t*t; }
  function easeOutBack(t){ var c=1.70158; t=t-1; return 1 + (c+1)*t*t*t + c*t*t; }
  function segDist2(px,py,ax,ay,bx,by){
    var abx=bx-ax, aby=by-ay, apx=px-ax, apy=py-ay;
    var ab2=abx*abx+aby*aby;
    var t = ab2>0 ? (apx*abx+apy*aby)/ab2 : 0;
    t = t<0?0:(t>1?1:t);
    var cx=ax+abx*t, cy=ay+aby*t, dx=px-cx, dy=py-cy;
    return dx*dx+dy*dy;
  }

  // ---------- config ----------
  var CONF = {
    greenBase:2, greenPerWave:1, greenMax:8,
    decoyStart:2, decoyMax:6,
    floodBase:0.020, floodPerWave:0.0050, floodAccel:0.0011, floodMax:0.115,
    floodBaseline:0.055,
    connectPad:17, decoyPad:4,
    pushback:0.013, decoySurge:0.030,
    comboWindow:2.4,
    lives:3,
    penSpeed:560,
    greenR:23, decoyR:19
  };
  var GOOD_TOKENS = ['fn','{}','=>','[]','()','db','npm','git','nil','0x','++','//','def','try','sql','api','ssh','env','let','===','&&','ret','var','tcp','dns','.ts','#!','md','GET','404?','<a>'];
  var BAD_TOKENS  = ['404','err','x_x','seg','!!','rm','die','bug','NaN','EOF','0/0','~/.','SIGKILL','panic','void'];

  // ---------- palette ----------
  var darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var PAL = makePalette(darkMQ ? darkMQ.matches : true);
  function makePalette(dark){
    if(dark){
      return {
        dark:true, glowScale:1,
        bg:'#04080a', bg2:'#020506',
        grid:'rgba(64,240,160,0.055)',
        ink:'#40f0a0', inkBright:'#b6ffdb', inkSoft:'rgba(64,240,160,0.55)',
        node:'#0e2b20', nodeRing:'#40f0a0', nodeConn:'#0b3a28',
        wire:'#66ffbe', wireCore:'#e8fff4',
        amber:'#ffcf6b', danger:'#ff5a6a', dangerSoft:'rgba(255,90,106,0.5)',
        floodBody:'rgba(3,26,16,0.80)', floodBand:'rgba(64,240,160,0.05)',
        floodSurface:'#3af0a0', floodGlow:'rgba(64,240,160,0.55)',
        floodDigit:'rgba(64,240,160,0.22)',
        text:'#9fffce', textDim:'rgba(64,240,160,0.5)',
        flash:'220,255,238', scan:'rgba(0,0,0,0.20)', vignette:'rgba(0,0,0,0.55)'
      };
    }
    return {
      dark:false, glowScale:0.35,
      bg:'#eef2ea', bg2:'#e6ebe2',
      grid:'rgba(11,107,52,0.10)',
      ink:'#0b6b34', inkBright:'#0a8a42', inkSoft:'rgba(11,107,52,0.55)',
      node:'#dce9dd', nodeRing:'#0b6b34', nodeConn:'#bfe2c8',
      wire:'#0a8a42', wireCore:'#0b6b34',
      amber:'#a45c00', danger:'#c0392b', dangerSoft:'rgba(192,57,43,0.45)',
      floodBody:'rgba(11,107,52,0.16)', floodBand:'rgba(11,107,52,0.07)',
      floodSurface:'#0b6b34', floodGlow:'rgba(11,107,52,0.30)',
      floodDigit:'rgba(11,107,52,0.20)',
      text:'#0b6b34', textDim:'rgba(11,107,52,0.6)',
      flash:'11,107,52', scan:'rgba(0,0,0,0.03)', vignette:'rgba(0,0,0,0.10)'
    };
  }
  if(darkMQ){
    var onScheme = function(){ PAL = makePalette(darkMQ.matches); buildScanline(); var tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.setAttribute('content', PAL.bg); };
    if(darkMQ.addEventListener) darkMQ.addEventListener('change', onScheme);
    else if(darkMQ.addListener) darkMQ.addListener(onScheme);
  }

  // ---------- view / dpr ----------
  var view = { w: window.innerWidth||360, h: window.innerHeight||640, dpr:1 };
  var scanPat = null;
  function buildScanline(){
    try{
      var c = document.createElement('canvas'); c.width=1; c.height=3;
      var g = c.getContext('2d'); if(!g){ scanPat=null; return; }
      g.fillStyle = PAL.scan; g.fillRect(0,2,1,1);
      scanPat = ctx ? ctx.createPattern(c,'repeat') : null;
    }catch(e){ scanPat=null; }
  }
  function resize(){
    view.w = canvas.clientWidth || window.innerWidth || 360;
    view.h = canvas.clientHeight || window.innerHeight || 640;
    view.dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width  = Math.round(view.w*view.dpr);
    canvas.height = Math.round(view.h*view.dpr);
    buildScanline();
    // keep nodes in bounds
    if(G && G.nodes){
      var r = playRect();
      for(var i=0;i<G.nodes.length;i++){
        var n=G.nodes[i];
        n.x = clamp(n.x, r.x0+n.r, r.x1-n.r);
        n.y = clamp(n.y, r.y0+n.r, r.y1-n.r);
      }
    }
  }
  function playRect(){
    var padX = Math.max(24, 18);
    return {
      x0: padX, x1: view.w - padX,
      y0: 96, y1: view.h*0.86
    };
  }

  // ---------- audio ----------
  var AC = null, master = null, muted = false, audioReady=false;
  function initAudio(){
    if(audioReady) { if(AC && AC.state==='suspended'){ try{AC.resume();}catch(e){} } return; }
    try{
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if(!Ctor) return;
      AC = new Ctor();
      master = AC.createGain();
      master.gain.value = muted?0:0.26;
      master.connect(AC.destination);
      audioReady = true;
      if(AC.state==='suspended'){ try{AC.resume();}catch(e){} }
    }catch(e){ AC=null; audioReady=false; }
  }
  function tone(freq, dur, type, vol, glideTo){
    if(!audioReady||!AC||muted) return;
    try{
      var t=AC.currentTime;
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine';
      o.frequency.setValueAtTime(freq, t);
      if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo), t+dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  function noise(dur, vol){
    if(!audioReady||!AC||muted) return;
    try{
      var t=AC.currentTime, n=Math.floor(AC.sampleRate*dur);
      var buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
      var s=AC.createBufferSource(); s.buffer=buf;
      var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
      var g=AC.createGain(); g.gain.value=vol||0.2;
      s.connect(f); f.connect(g); g.connect(master); s.start(t);
    }catch(e){}
  }
  function sConnect(combo){ tone(440 + Math.min(combo,14)*36, 0.14, 'triangle', 0.22, 660+Math.min(combo,14)*44); }
  function sClutch(){ tone(720,0.10,'square',0.16,980); tone(1080,0.14,'triangle',0.14,1320); }
  function sBad(){ noise(0.18,0.28); tone(150,0.22,'sawtooth',0.22,70); }
  function sClear(w){
    var base=[523,659,784,1047];
    for(var i=0;i<base.length;i++){ (function(f,i){ setTimeout(function(){ tone(f,0.16,'triangle',0.18,f*1.5); }, i*70); })(base[i],i); }
  }
  function sOver(){ tone(330,0.5,'sawtooth',0.2,90); tone(220,0.6,'sine',0.14,70); }
  function setMuted(m){
    muted=m;
    if(master){ try{ master.gain.value = m?0:0.26; }catch(e){} }
    if(elSound) elSound.textContent = m ? '\u266A\u0338' : '\u266A';
  }

  // ---------- game state ----------
  var G = null;
  function newState(){
    return {
      mode:'title', t:0,
      score:0, best:(G?G.best:0)||0, wave:0, lives:CONF.lives,
      nodes:[], strokes:[], cur:null,
      drawing:false, pointerId:null,
      penX:view.w*0.5, penY:view.h*0.5,
      flood:CONF.floodBaseline, floodSpeed:CONF.floodBase, timeInWave:0, spawnGrace:0,
      combo:0, comboTimer:0, mult:1, bestCombo:0,
      particles:[], floaters:[], glyphs:[], digits:[],
      shake:0, flash:0, flashCol:PAL.flash, freeze:0,
      clearing:false, clearT:0,
      recFrom:0, recActive:false, recT:0,
      hint:1, kbActive:false,
      surfaceSeed: Math.random()*1000
    };
  }
  var keys = {};

  function makeGlyphs(){
    var arr=[]; var n=22;
    for(var i=0;i<n;i++){
      arr.push({ x:rnd(0,view.w), y:rnd(0,view.h), vy:rnd(8,26), ch:pick(GOOD_TOKENS), a:rnd(0.05,0.16), s:rnd(11,17) });
    }
    return arr;
  }

  function spawnWave(w){
    G.wave=w; G.timeInWave=0; G.spawnGrace=0.7;
    G.strokes=[]; G.cur=null; G.drawing=false; G.pointerId=null;
    G.clearing=false; G.clearT=0;
    G.floodSpeed = Math.min(CONF.floodMax, CONF.floodBase + (w-1)*CONF.floodPerWave);
    var r = playRect();
    var greens = Math.min(CONF.greenMax, CONF.greenBase + w*CONF.greenPerWave);
    var decoys = w < CONF.decoyStart ? 0 : Math.min(CONF.decoyMax, w - CONF.decoyStart + 1);
    var nodes=[];
    var drift = 6 + (w-1)*3.4; drift = Math.min(drift, 30);
    var surfaceY = view.h*(1-G.flood);
    var yMax = Math.min(r.y1, surfaceY - 120);
    if(yMax < r.y0+40) yMax = r.y0+40;
    function place(type){
      var rr = type==='good'?CONF.greenR:CONF.decoyR;
      var minD = rr*2.7;
      for(var attempt=0; attempt<80; attempt++){
        var x=rnd(r.x0+rr, r.x1-rr);
        var y=rnd(r.y0+rr, yMax);
        var ok=true;
        for(var i=0;i<nodes.length;i++){
          var dx=x-nodes[i].x, dy=y-nodes[i].y;
          if(dx*dx+dy*dy < (minD)*(minD)){ ok=false; break; }
        }
        if(ok || attempt===79){
          var ang=rnd(0,TAU);
          nodes.push({ x:x, y:y, vx:Math.cos(ang)*drift, vy:Math.sin(ang)*drift*0.7,
            r:rr, type:type, token: type==='good'?pick(GOOD_TOKENS):pick(BAD_TOKENS),
            connected:false, alive:true, pulse:rnd(0,TAU), scaleT:0, hit:false, glitch:rnd(0,TAU) });
          return;
        }
      }
    }
    var gi;
    for(gi=0; gi<greens; gi++) place('good');
    for(gi=0; gi<decoys; gi++) place('bad');
    G.nodes = nodes;
  }

  // ---------- lifecycle ----------
  function beginRun(){
    var best = G? G.best : 0;
    G = newState(); G.best = best||0;
    G.glyphs = makeGlyphs();
    G.mode='playing';
    G.flood = CONF.floodBaseline;
    spawnWave(1);
    if(elTitle) elTitle.classList.add('hidden');
    if(elOver) elOver.classList.add('hidden');
    if(elSound) elSound.classList.remove('hidden');
    initAudio();
    burst(view.w*0.5, view.h*0.5, 10, PAL.ink, 1);
  }
  function gameOver(){
    if(G.mode!=='playing') return;
    G.mode='over';
    if(G.score>G.best) G.best=G.score;
    G.shake = Math.max(G.shake, 16);
    G.flash = 0.5; G.flashCol = PAL.flash;
    sOver();
    if(navigator.vibrate) try{ navigator.vibrate([40,40,80]); }catch(e){}
    if(elOverStats){
      elOverStats.innerHTML =
        '<span class="k">SCORE</span><span class="v big">'+String(G.score).padStart(6,'0')+'</span>'+
        '<span class="k">WAVE&nbsp;</span> <span class="v">'+String(G.wave).padStart(2,'0')+'</span>'+
        '&nbsp;&nbsp;<span class="k">BEST</span> <span class="v">'+String(G.best).padStart(6,'0')+'</span>';
    }
    if(elOverTitle) elOverTitle.textContent = G.score>=G.best && G.score>0 ? 'NEW BEST' : (pick(['SIGNAL LOST','CONNECTION DROPPED','404 // GONE','FLATLINE']));
    if(elOver) elOver.classList.remove('hidden');
    if(elSound) elSound.classList.add('hidden');
  }

  // ---------- juice ----------
  function burst(x,y,count,color,scale){
    scale=scale||1;
    for(var i=0;i<count;i++){
      if(G.particles.length>240) break;
      var a=rnd(0,TAU), sp=rnd(40,240)*scale;
      G.particles.push({ x:x,y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rnd(0.3,0.7), max:0.7, r:rnd(1.4,3.6)*scale, col:color, grav:rnd(-40,120) });
    }
  }
  function ring(x,y,color,scale){
    G.particles.push({ ring:true, x:x,y:y, life:0.5, max:0.5, r:6, R:70*(scale||1), col:color });
  }
  function floater(x,y,text,color,size){
    if(G.floaters.length>40) return;
    G.floaters.push({ x:x,y:y, vy:-46, life:0.9, max:0.9, text:text, col:color, size:size||16 });
  }
  function addShake(v){ G.shake = Math.min(28, G.shake + v); }
  function hitStop(s){ G.freeze = Math.max(G.freeze, s); }

  // ---------- pen / connection ----------
  function penDown(x,y){
    if(G.mode!=='playing' || G.clearing) return;
    G.drawing=true;
    G.cur = { pts:[{x:x,y:y}] };
    G.strokes.push(G.cur);
    if(G.strokes.length>10) G.strokes.shift();
    testPoint(x,y);
  }
  function penMove(x,y){
    if(!G.drawing || !G.cur || G.mode!=='playing' || G.clearing) return;
    var pts=G.cur.pts, last=pts[pts.length-1];
    var dx=x-last.x, dy=y-last.y;
    if(dx*dx+dy*dy < 9) { last.x=x; last.y=y; return; }
    pts.push({x:x,y:y});
    if(pts.length>260) pts.shift();
    testSeg(last.x,last.y,x,y);
  }
  function penUp(){ G.drawing=false; G.cur=null; }
  function testPoint(x,y){ testSeg(x,y,x,y); }
  function testSeg(ax,ay,bx,by){
    for(var i=0;i<G.nodes.length;i++){
      var n=G.nodes[i]; if(!n.alive) continue;
      var d2=segDist2(n.x,n.y,ax,ay,bx,by);
      if(n.type==='good'){
        if(!n.connected){
          var rr=n.r+CONF.connectPad; if(d2 < rr*rr) connectNode(n);
        }
      } else {
        if(!n.hit){
          var hr=n.r+CONF.decoyPad; if(d2 < hr*hr) hitDecoy(n);
        }
      }
    }
  }
  function connectNode(n){
    n.connected=true; n.scaleT=0.0001; n.pop=1;
    G.combo++; G.comboTimer=CONF.comboWindow;
    if(G.combo>G.bestCombo) G.bestCombo=G.combo;
    G.mult = 1 + Math.floor(G.combo/3); if(G.mult>9) G.mult=9;
    var surfaceY = floodYAt(n.x);
    var clutch = (surfaceY - n.y) < view.h*0.14;
    var gain = (10 + G.wave*2) * G.mult * (clutch?2:1);
    G.score += gain;
    G.flood = Math.max(0, G.flood - CONF.pushback);
    burst(n.x,n.y, clutch?16:10, clutch?PAL.amber:PAL.wire, clutch?1.2:0.9);
    ring(n.x,n.y, PAL.floodSurface, 0.6);
    floater(n.x, n.y-n.r-6, '+'+gain, clutch?PAL.amber:PAL.inkBright, clutch?20:16);
    addShake(clutch?4:1.6);
    if(clutch){ sClutch(); floater(n.x, n.y-n.r-26,'CLUTCH', PAL.amber, 13); }
    else sConnect(G.combo);
    if(navigator.vibrate) try{ navigator.vibrate(clutch?18:8); }catch(e){}
    checkWaveClear();
  }
  function hitDecoy(n){
    n.hit=true; n.alive=false;
    burst(n.x,n.y,18,PAL.danger,1.2);
    ring(n.x,n.y,PAL.danger,0.7);
    G.flood = Math.min(0.97, G.flood + CONF.decoySurge);
    loseLife('DEAD CODE', n.x, n.y);
  }
  function loseLife(reason,x,y){
    G.lives--; G.combo=0; G.mult=1; G.comboTimer=0;
    G.flash=0.55; G.flashCol=PAL.danger.indexOf('#')===0 ? (PAL.dark?'255,90,106':'192,57,43') : PAL.flash;
    addShake(12); hitStop(0.05);
    floater(x||view.w*0.5, y||view.h*0.5, reason, PAL.danger, 15);
    sBad();
    if(navigator.vibrate) try{ navigator.vibrate([30,20,30]); }catch(e){}
    if(G.lives<=0) gameOver();
  }
  function checkWaveClear(){
    var aliveGreens=0, connected=0;
    for(var i=0;i<G.nodes.length;i++){
      var n=G.nodes[i]; if(n.type!=='good'||!n.alive) continue;
      aliveGreens++; if(n.connected) connected++;
    }
    if(aliveGreens>0 && connected>=aliveGreens && !G.clearing) waveClear();
  }
  function waveClear(){
    G.clearing=true; G.clearT=0;
    var cx=0,cy=0,c=0;
    for(var i=0;i<G.nodes.length;i++){ var n=G.nodes[i]; if(n.type==='good'&&n.connected){ cx+=n.x; cy+=n.y; c++; } }
    if(c){ cx/=c; cy/=c; } else { cx=view.w*0.5; cy=view.h*0.4; }
    var clutch = G.flood>0.55;
    var bonus = 40*G.wave + Math.round(G.flood*130);
    G.score += bonus;
    floater(cx, cy-30, '+'+bonus, PAL.amber, 22);
    if(clutch){ floater(cx, cy-58, 'JUST IN TIME', PAL.amber, 14); }
    floater(view.w*0.5, view.h*0.32, 'WAVE '+String(G.wave).padStart(2,'0')+' CLEAR', PAL.inkBright, 20);
    burst(cx,cy,40,PAL.wire,1.5); burst(cx,cy,18,PAL.amber,1.2);
    ring(cx,cy,PAL.floodSurface,1.6);
    G.flash=0.4; G.flashCol=PAL.flash;
    addShake(clutch?9:5); hitStop(0.09);
    sClear(G.wave);
    if(navigator.vibrate) try{ navigator.vibrate(clutch?[15,30,40]:[10,20,20]); }catch(e){}
    G.recActive=true; G.recFrom=G.flood; G.recT=0;
  }

  function floodYAt(x){
    var base = view.h*(1-G.flood);
    var t=G.t, s=G.surfaceSeed;
    var y = base
      + Math.sin(x*0.018 + t*0.9 + s)*7
      + Math.sin(x*0.045 - t*1.4 + s*1.7)*4
      + Math.sin(x*0.006 + t*0.4)*10
      - (x/view.w)*6; /* slight downward chart tilt */
    return y;
  }

  // ---------- update ----------
  function update(dt){
    G.t += dt;
    // ambient always
    updateGlyphs(dt);
    updateParticles(dt);
    updateFloaters(dt);
    if(G.shake>0) G.shake = Math.max(0, G.shake - dt*38);
    if(G.flash>0) G.flash = Math.max(0, G.flash - dt*1.6);

    if(G.mode==='title'){ updateTitleDemo(dt); return; }
    if(G.mode!=='playing') return;

    if(G.freeze>0){ G.freeze-=dt; return; }

    // keyboard pen
    if(G.kbActive){
      var vx=0,vy=0;
      if(keys['arrowleft']||keys['a']) vx-=1;
      if(keys['arrowright']||keys['d']) vx+=1;
      if(keys['arrowup']||keys['w']) vy-=1;
      if(keys['arrowdown']||keys['s']) vy+=1;
      var m=Math.hypot(vx,vy);
      if(m>0){ vx/=m; vy/=m; G.penX=clamp(G.penX+vx*CONF.penSpeed*dt,0,view.w); G.penY=clamp(G.penY+vy*CONF.penSpeed*dt,0,view.h); penMove(G.penX,G.penY); }
    }

    // wave clearing transition
    if(G.clearing){
      G.clearT+=dt;
      if(G.recActive){
        G.recT+=dt; var p=clamp(G.recT/0.55,0,1);
        G.flood = lerp(G.recFrom, CONF.floodBaseline, easeOutCubic(p));
        if(p>=1) G.recActive=false;
      }
      for(var i=0;i<G.nodes.length;i++){ G.nodes[i].scaleT = Math.max(0, (G.nodes[i].scaleT||1) - dt*2.2); }
      if(G.clearT>0.72){ spawnWave(G.wave+1); }
      return;
    }

    G.timeInWave+=dt;
    if(G.spawnGrace>0) G.spawnGrace-=dt;
    if(G.comboTimer>0){ G.comboTimer-=dt; if(G.comboTimer<=0){ G.combo=0; G.mult=1; } }
    if(G.hint>0 && (G.wave>1 || G.timeInWave>3.5)) G.hint=Math.max(0,G.hint-dt*0.8);

    // flood rise
    if(G.spawnGrace<=0){
      var sp = G.floodSpeed*(1 + CONF.floodAccel*G.timeInWave*12);
      G.flood = clamp(G.flood + sp*dt, 0, 1);
    }

    // nodes drift + spawn-in
    var r=playRect();
    for(var i=0;i<G.nodes.length;i++){
      var n=G.nodes[i];
      if(n.scaleT<1) n.scaleT=Math.min(1, n.scaleT + dt*4.2);
      n.pulse += dt*3;
      if(n.pop) n.pop=Math.max(0,n.pop-dt*4);
      if(n.type==='bad') n.glitch += dt*10;
      if(!n.alive) continue;
      n.x += n.vx*dt; n.y += n.vy*dt;
      if(n.x<r.x0+n.r){ n.x=r.x0+n.r; n.vx=Math.abs(n.vx); }
      if(n.x>r.x1-n.r){ n.x=r.x1-n.r; n.vx=-Math.abs(n.vx); }
      if(n.y<r.y0+n.r){ n.y=r.y0+n.r; n.vy=Math.abs(n.vy); }
      if(n.y>r.y1-n.r){ n.y=r.y1-n.r; n.vy=-Math.abs(n.vy); }
    }

    // swallow check
    if(G.spawnGrace<=0){
      for(var j=0;j<G.nodes.length;j++){
        var m=G.nodes[j]; if(!m.alive) continue;
        var sy=floodYAt(m.x);
        if(m.y - m.r*0.25 > sy){
          if(m.type==='good' && !m.connected){
            m.alive=false;
            burst(m.x,m.y,16,PAL.danger,1);
            loseLife('SWALLOWED', m.x, m.y-20);
            if(G.mode==='playing') checkWaveClear();
          } else if(m.type==='good' && m.connected){
            /* saved node sinks harmlessly */
          } else if(m.type==='bad'){
            m.alive=false;
          }
        }
      }
    }
    if(G.mode==='playing' && G.flood>=0.985) gameOver();

    // decaying flow of digits in flood
    updateDigits(dt);
  }

  function updateParticles(dt){
    var a=G.particles;
    for(var i=a.length-1;i>=0;i--){
      var p=a[i]; p.life-=dt;
      if(p.life<=0){ a.splice(i,1); continue; }
      if(p.ring){ p.r = lerp(p.r, p.R, dt*6); continue; }
      p.vy += (p.grav||0)*dt; p.vx*=(1-dt*1.2); p.vy*=(1-dt*0.6);
      p.x+=p.vx*dt; p.y+=p.vy*dt;
    }
  }
  function updateFloaters(dt){
    var a=G.floaters;
    for(var i=a.length-1;i>=0;i--){ var f=a[i]; f.life-=dt; f.y+=f.vy*dt; f.vy*=(1-dt*1.5); if(f.life<=0) a.splice(i,1); }
  }
  function updateGlyphs(dt){
    var a=G.glyphs;
    for(var i=0;i<a.length;i++){ var g=a[i]; g.y-=g.vy*dt; if(g.y<-20){ g.y=view.h+20; g.x=rnd(0,view.w); g.ch=pick(GOOD_TOKENS); } }
  }
  function updateDigits(dt){
    if(!G.digits) G.digits=[];
    var surface = view.h*(1-G.flood);
    if(G.digits.length<26 && Math.random()<0.5){
      G.digits.push({ x:rnd(0,view.w), y:surface+rnd(4,30), v:rnd(30,90), ch: (Math.random()<0.5?'0':'1') });
    }
    for(var i=G.digits.length-1;i>=0;i--){ var d=G.digits[i]; d.y+=d.v*dt; if(d.y>view.h+10) G.digits.splice(i,1); }
  }

  // ---------- title demo ----------
  var DEMO_DEFS=[[0.15,0.24],[0.83,0.19],[0.90,0.58],[0.66,0.80],[0.20,0.68],[0.50,0.46]];
  function updateTitleDemo(dt){
    if(!G.demo){ G.demo={ idx:0, prog:0, trail:[], cx:0, cy:0 }; }
    var d=G.demo;
    d.nodes=[]; for(var i=0;i<DEMO_DEFS.length;i++){ d.nodes.push({x:DEMO_DEFS[i][0]*view.w, y:DEMO_DEFS[i][1]*view.h}); }
    var from=d.nodes[d.idx], to=d.nodes[(d.idx+1)%d.nodes.length];
    d.prog += dt*0.62;
    if(d.prog>=1){ d.prog=0; d.idx=(d.idx+1)%d.nodes.length; if(d.idx===0) d.trail=[]; }
    var t=easeOutCubic(d.prog);
    d.cx=lerp(from.x,to.x,t); d.cy=lerp(from.y,to.y,t);
    d.trail.push({x:d.cx,y:d.cy}); if(d.trail.length>120) d.trail.shift();
  }

  // ---------- render ----------
  function render(){
    if(!ctx) return;
    var w=view.w, h=view.h, dpr=view.dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    // bg
    ctx.fillStyle=PAL.bg; ctx.fillRect(0,0,w,h);
    drawGrid(w,h);
    drawGlyphs();

    var sx=0, sy=0;
    if(G.shake>0){ sx=rnd(-G.shake,G.shake); sy=rnd(-G.shake,G.shake); }
    ctx.save(); ctx.translate(sx,sy);

    if(G.mode==='title'){ drawTitleDemo(); }
    drawFlood(w,h);
    if(G.mode==='playing'||G.mode==='over'){
      drawStrokes();
      drawNodes();
      drawPenTip();
    }
    drawParticles();
    drawFloaters();
    ctx.restore();

    // hud (no shake)
    if(G.mode==='playing') drawHUD(w,h);
    drawDangerEdge(w,h);
    drawScanline(w,h);
    drawVignette(w,h);
    if(G.flash>0){ ctx.fillStyle='rgba('+G.flashCol+','+(G.flash*0.5)+')'; ctx.fillRect(0,0,w,h); }
  }

  function drawGrid(w,h){
    ctx.strokeStyle=PAL.grid; ctx.lineWidth=1;
    var step=Math.max(34, Math.min(w,h)/12);
    ctx.beginPath();
    for(var x=(G.t*6)%step; x<w; x+=step){ ctx.moveTo(x,0); ctx.lineTo(x,h); }
    for(var y=(G.t*6)%step; y<h; y+=step){ ctx.moveTo(0,y); ctx.lineTo(w,y); }
    ctx.stroke();
  }
  function drawGlyphs(){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var i=0;i<G.glyphs.length;i++){ var g=G.glyphs[i];
      ctx.font=g.s+'px '+MONO; ctx.fillStyle='rgba('+(PAL.dark?'64,240,160':'11,107,52')+','+g.a+')';
      ctx.fillText(g.ch, g.x, g.y);
    }
  }
  var MONO = "ui-monospace, Menlo, Consolas, monospace";

  function drawFlood(w,h){
    var pts=[], N=Math.max(10, Math.ceil(w/22));
    for(var i=0;i<=N;i++){ var x=i/N*w; pts.push({x:x,y:floodYAt(x)}); }
    // body
    ctx.beginPath(); ctx.moveTo(0,h);
    ctx.lineTo(pts[0].x,pts[0].y);
    for(var k=1;k<pts.length;k++) ctx.lineTo(pts[k].x,pts[k].y);
    ctx.lineTo(w,h); ctx.closePath();
    ctx.fillStyle=PAL.floodBody; ctx.fill();
    // depth bands
    ctx.save(); ctx.clip();
    ctx.fillStyle=PAL.floodBand;
    var top=Math.min(pts[0].y,pts[N].y);
    for(var b=0;b<4;b++){ ctx.fillRect(0, top + b*26, w, 12); }
    // draining digits
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='11px '+MONO; ctx.fillStyle=PAL.floodDigit;
    if(G.digits) for(var di=0;di<G.digits.length;di++){ var d=G.digits[di]; ctx.fillText(d.ch, d.x, d.y); }
    ctx.restore();
    // surface line (glow)
    ctx.save();
    ctx.shadowBlur=16*PAL.glowScale; ctx.shadowColor=PAL.floodGlow;
    ctx.strokeStyle=PAL.floodSurface; ctx.lineWidth=2.4; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(var m=1;m<pts.length;m++) ctx.lineTo(pts[m].x,pts[m].y);
    ctx.stroke();
    ctx.restore();
    // traffic label riding surface (left side, away from sound chip)
    if(G.mode==='playing'||G.mode==='over'){
      var traffic=Math.max(0,Math.round((1-G.flood)*100));
      ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.font='12px '+MONO;
      ctx.fillStyle = G.flood>0.7 ? PAL.danger : PAL.textDim;
      ctx.fillText('TRAFFIC \u25BC '+traffic+'%', 14, floodYAt(40)-6);
    }
  }

  function drawStrokes(){
    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    for(var s=0;s<G.strokes.length;s++){
      var st=G.strokes[s], pts=st.pts; if(pts.length<1) continue;
      // glow pass
      ctx.shadowBlur=14*PAL.glowScale; ctx.shadowColor=PAL.floodGlow;
      ctx.strokeStyle=PAL.wire; ctx.lineWidth=5;
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
      if(pts.length===1) ctx.lineTo(pts[0].x+0.1,pts[0].y+0.1);
      ctx.stroke();
      // core
      ctx.shadowBlur=0; ctx.strokeStyle=PAL.wireCore; ctx.lineWidth=1.6; ctx.globalAlpha=0.9;
      ctx.stroke(); ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  function drawPenTip(){
    if(!G.drawing || !G.cur || G.cur.pts.length===0) return;
    var p=G.cur.pts[G.cur.pts.length-1];
    var pr = 6 + Math.sin(G.t*10)*1.6;
    ctx.save(); ctx.shadowBlur=20*PAL.glowScale; ctx.shadowColor=PAL.floodGlow;
    ctx.fillStyle=PAL.wireCore; ctx.beginPath(); ctx.arc(p.x,p.y,pr,0,TAU); ctx.fill();
    ctx.restore();
  }

  function drawNodes(){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var i=0;i<G.nodes.length;i++){
      var n=G.nodes[i]; if(!n.alive && n.scaleT<=0) continue;
      var sc = easeOutBack(clamp(n.scaleT,0,1));
      if(G.clearing) sc *= clamp(n.scaleT,0,1);
      var r=n.r*sc; if(r<=0.5) continue;
      var sy=floodYAt(n.x);
      ctx.save(); ctx.translate(n.x,n.y);
      if(n.type==='bad'){
        ctx.translate(Math.sin(n.glitch)*1.6, Math.cos(n.glitch*1.3)*1.4);
        drawDecoy(n,r);
      } else {
        drawGood(n,r, !n.connected && (sy-n.y) < 92);
      }
      ctx.restore();
    }
  }
  function drawGood(n,r,danger){
    var ringCol = n.connected?PAL.inkBright:PAL.nodeRing;
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU);
    ctx.fillStyle = n.connected?PAL.nodeConn:PAL.node; ctx.fill();
    ctx.shadowBlur=(n.connected?16:10)*PAL.glowScale; ctx.shadowColor=PAL.floodGlow;
    ctx.lineWidth=n.connected?3:2.2; ctx.strokeStyle=ringCol;
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.stroke();
    if(!n.connected){
      var pa=0.5+0.5*Math.sin(n.pulse);
      ctx.globalAlpha=0.22*pa; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(0,0,r+6+pa*4,0,TAU); ctx.stroke(); ctx.globalAlpha=1;
    }
    if(danger){
      var b=0.4+0.5*Math.sin(G.t*13);
      ctx.globalAlpha=Math.abs(b); ctx.strokeStyle=PAL.amber; ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.arc(0,0,r+7,0,TAU); ctx.stroke(); ctx.globalAlpha=1;
    }
    if(n.pop){ ctx.globalAlpha=n.pop*0.8; ctx.strokeStyle=PAL.wireCore; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,r+(1-n.pop)*18,0,TAU); ctx.stroke(); ctx.globalAlpha=1; }
    ctx.shadowBlur=0;
    ctx.font=(Math.round(r*0.72))+'px '+MONO;
    ctx.fillStyle=n.connected?PAL.inkBright:PAL.ink; ctx.fillText(n.token,0,1);
    if(danger){ ctx.fillStyle=PAL.amber; ctx.font='11px '+MONO; ctx.fillText('\u25BC',0,-r-8); }
  }
  function drawDecoy(n,r){
    var s=r*0.80;
    ctx.save(); ctx.rotate(PI/4);
    ctx.beginPath(); ctx.rect(-s,-s,s*2,s*2);
    ctx.fillStyle=PAL.node; ctx.fill();
    ctx.shadowBlur=12*PAL.glowScale; ctx.shadowColor=PAL.dangerSoft;
    ctx.lineWidth=2.4; ctx.strokeStyle=PAL.danger;
    ctx.beginPath(); ctx.rect(-s,-s,s*2,s*2); ctx.stroke();
    ctx.globalAlpha=0.3+0.3*Math.sin(n.glitch*0.7);
    ctx.beginPath(); ctx.rect(-s-4,-s-4,s*2+8,s*2+8); ctx.lineWidth=1; ctx.stroke(); ctx.globalAlpha=1;
    ctx.restore();
    ctx.shadowBlur=0;
    ctx.fillStyle=PAL.danger; ctx.font=(Math.round(r*0.6))+'px '+MONO; ctx.fillText(n.token,0,1);
  }

  function drawParticles(){
    for(var i=0;i<G.particles.length;i++){
      var p=G.particles[i], a=clamp(p.life/p.max,0,1);
      if(p.ring){
        ctx.globalAlpha=a*0.6; ctx.strokeStyle=p.col; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke(); ctx.globalAlpha=1; continue;
      }
      ctx.globalAlpha=a; ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  function drawFloaters(){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var i=0;i<G.floaters.length;i++){
      var f=G.floaters[i], a=clamp(f.life/f.max,0,1);
      ctx.globalAlpha=a; ctx.font='700 '+f.size+'px '+MONO; ctx.fillStyle=f.col;
      ctx.shadowBlur=8*PAL.glowScale; ctx.shadowColor=PAL.floodGlow;
      ctx.fillText(f.text, f.x, f.y);
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
  }

  function drawHUD(w,h){
    var top = 18;
    ctx.textBaseline='top';
    // score
    ctx.textAlign='left'; ctx.font='700 22px '+MONO; ctx.fillStyle=PAL.ink;
    ctx.fillText(String(G.score).padStart(6,'0'), 16, top);
    ctx.font='10px '+MONO; ctx.fillStyle=PAL.textDim; ctx.fillText('SCORE', 16, top+26);
    // combo (offset right of score to avoid overlap)
    if(G.combo>1){
      ctx.textAlign='left'; ctx.font='700 15px '+MONO; ctx.fillStyle=PAL.amber;
      ctx.fillText('x'+G.mult+' \u00D7'+G.combo, 124, top+1);
      var cw=52, cp=clamp(G.comboTimer/CONF.comboWindow,0,1);
      ctx.fillStyle=PAL.textDim; ctx.fillRect(124, top+21, cw, 3);
      ctx.fillStyle=PAL.amber; ctx.fillRect(124, top+21, cw*cp, 3);
    }
    // wave (right)
    ctx.textAlign='right'; ctx.font='700 22px '+MONO; ctx.fillStyle=PAL.ink;
    ctx.fillText('W'+String(G.wave).padStart(2,'0'), w-16, top);
    ctx.font='10px '+MONO; ctx.fillStyle=PAL.textDim; ctx.fillText('WAVE', w-16, top+26);
    // lives
    ctx.textAlign='right'; ctx.font='16px '+MONO;
    var s='';
    for(var i=0;i<CONF.lives;i++) s += (i<G.lives?'\u25C6':'\u25C7')+' ';
    ctx.fillStyle=G.lives<=1?PAL.danger:PAL.ink; ctx.fillText(s.trim(), w-16, top+42);

    // hint (wave 1)
    if(G.hint>0.02 && G.wave===1){
      ctx.globalAlpha=clamp(G.hint,0,1);
      ctx.textAlign='center'; ctx.font='700 15px '+MONO; ctx.fillStyle=PAL.inkBright;
      ctx.fillText('DRAG THROUGH THE GLOWING NODES', w*0.5, h*0.20);
      ctx.font='12px '+MONO; ctx.fillStyle=PAL.textDim;
      ctx.fillText('connect them all before the flood rises', w*0.5, h*0.20+22);
      ctx.globalAlpha=1;
    }
  }

  function drawDangerEdge(w,h){
    if(G.mode!=='playing') return;
    var d = clamp((G.flood-0.6)/0.38,0,1);
    if(d<=0) return;
    var p = d*(0.35+0.25*Math.sin(G.t*8));
    ctx.save();
    ctx.lineWidth=Math.max(6,20*d); ctx.strokeStyle=PAL.danger; ctx.globalAlpha=p*0.5;
    ctx.strokeRect(3,3,w-6,h-6);
    ctx.restore(); ctx.globalAlpha=1;
  }
  function drawScanline(w,h){
    if(scanPat){ ctx.fillStyle=scanPat; ctx.fillRect(0,0,w,h); }
  }
  function drawVignette(w,h){
    // cheap corner darkening via radial-ish alpha rects (no gradient token)
    ctx.save();
    ctx.globalAlpha=PAL.dark?0.30:0.06;
    var g=ctx; g.fillStyle=PAL.vignette;
    var t=26;
    g.fillRect(0,0,w,t); g.fillRect(0,h-t,w,t); g.fillRect(0,0,t,h); g.fillRect(w-t,0,t,h);
    ctx.restore(); ctx.globalAlpha=1;
  }

  function drawTitleDemo(){
    if(!G.demo||!G.demo.nodes) return; var d=G.demo;
    ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.globalAlpha=0.55;
    ctx.shadowBlur=10*PAL.glowScale; ctx.shadowColor=PAL.floodGlow;
    ctx.strokeStyle=PAL.wire; ctx.lineWidth=2.6;
    ctx.beginPath();
    for(var i=0;i<d.trail.length;i++){ var p=d.trail[i]; if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); }
    ctx.stroke(); ctx.restore(); ctx.globalAlpha=1;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var n=0;n<d.nodes.length;n++){ var nd=d.nodes[n];
      var lit = n<=d.idx;
      ctx.save(); ctx.globalAlpha=0.7; ctx.shadowBlur=9*PAL.glowScale; ctx.shadowColor=PAL.floodGlow;
      ctx.fillStyle=PAL.node; ctx.beginPath(); ctx.arc(nd.x,nd.y,13,0,TAU); ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle= lit?PAL.inkBright:PAL.nodeRing;
      ctx.beginPath(); ctx.arc(nd.x,nd.y,13,0,TAU); ctx.stroke(); ctx.restore();
    }
    ctx.save(); ctx.globalAlpha=0.85; ctx.shadowBlur=14*PAL.glowScale; ctx.shadowColor=PAL.floodGlow;
    ctx.fillStyle=PAL.wireCore; ctx.beginPath(); ctx.arc(d.cx,d.cy,5,0,TAU); ctx.fill(); ctx.restore();
    ctx.globalAlpha=1;
  }

  // ---------- loop ----------
  var last=0, rafId=0;
  function frame(ts){
    rafId=requestAnimationFrame(frame);
    if(!last) last=ts;
    var dt=(ts-last)/1000; last=ts;
    if(dt>0.05) dt=0.05; if(dt<0) dt=0;
    try{ update(dt); }catch(e){}
    try{ render(); }catch(e){}
  }

  // ---------- input ----------
  function evPos(e){
    var rect=canvas.getBoundingClientRect();
    return { x:(e.clientX-rect.left), y:(e.clientY-rect.top) };
  }
  function onDown(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(G.mode!=='playing') return;
    if(G.pointerId!==null) return;
    G.pointerId = e.pointerId!==undefined?e.pointerId:1;
    G.kbActive=false;
    var p=evPos(e); G.penX=p.x; G.penY=p.y;
    penDown(p.x,p.y);
    if(e.cancelable) e.preventDefault();
  }
  function onMove(e){
    if(G.mode!=='playing' || !G.drawing) return;
    var id=e.pointerId!==undefined?e.pointerId:1;
    if(G.pointerId!==null && id!==G.pointerId) return;
    // coalesced events for smoother strokes
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [e];
    for(var i=0;i<evs.length;i++){ var p=evPos(evs[i]); G.penX=p.x; G.penY=p.y; penMove(p.x,p.y); }
    if(e.cancelable) e.preventDefault();
  }
  function onUp(e){
    var id=e.pointerId!==undefined?e.pointerId:1;
    if(G.pointerId!==null && id!==G.pointerId) return;
    G.pointerId=null; penUp();
    if(e.cancelable) e.preventDefault();
  }
  if(canvas){
    canvas.addEventListener('pointerdown', onDown, {passive:false});
    canvas.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp, {passive:false});
    canvas.addEventListener('pointercancel', onUp, {passive:false});
    // touch fallback preventDefault (older browsers)
    canvas.addEventListener('touchstart', function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});
    canvas.addEventListener('touchmove', function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});
  }

  function onKeyDown(e){
    var k=(e.key||'').toLowerCase();
    keys[k]=true;
    if(G.mode==='title' && (k==='enter'||k===' '||k==='spacebar')){ beginRun(); e.preventDefault(); return; }
    if(G.mode==='over' && (k==='enter'||k===' '||k==='spacebar'||k==='r')){ beginRun(); e.preventDefault(); return; }
    if(k==='m'){ setMuted(!muted); return; }
    if(G.mode==='playing'){
      var moveKey = (k==='arrowleft'||k==='arrowright'||k==='arrowup'||k==='arrowdown'||k==='a'||k==='d'||k==='w'||k==='s');
      if(moveKey){
        if(!G.kbActive && !G.drawing){
          G.kbActive=true;
          // start from last connected node if any, else center
          var start=null;
          for(var i=0;i<G.nodes.length;i++){ if(G.nodes[i].type==='good'&&G.nodes[i].connected) start=G.nodes[i]; }
          G.penX = start?start.x:view.w*0.5; G.penY=start?start.y:view.h*0.5;
          penDown(G.penX,G.penY);
        }
        e.preventDefault();
      }
    }
  }
  function onKeyUp(e){
    var k=(e.key||'').toLowerCase(); keys[k]=false;
    if(G.kbActive){
      var any = keys['arrowleft']||keys['arrowright']||keys['arrowup']||keys['arrowdown']||keys['a']||keys['d']||keys['w']||keys['s'];
      if(!any){ G.kbActive=false; penUp(); }
    }
  }
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);

  // buttons (guarded, safe to call any state)
  function safeStart(e){ if(e){ e.preventDefault(); } initAudio(); beginRun(); }
  if(elStart) elStart.addEventListener('click', safeStart);
  if(elRestart) elRestart.addEventListener('click', safeStart);
  if(elSound) elSound.addEventListener('click', function(e){ e.preventDefault(); initAudio(); setMuted(!muted); });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden){ last=0; } });

  // ---------- boot ----------
  G = newState();
  G.glyphs = makeGlyphs();
  resize();
  buildScanline();
  rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
