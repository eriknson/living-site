<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Drop</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #e8eef2;
    --fg: #1a2830;
    --muted: #5a6d78;
    --accent: #00d4aa;
    --accent2: #ff6b35;
    --panel: rgba(255,255,255,0.88);
    --shadow: rgba(26,40,48,0.12);
    --hit: rgba(0,212,170,0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1218;
      --fg: #e4eef4;
      --muted: #7a929e;
      --accent: #00f5c4;
      --accent2: #ff8555;
      --panel: rgba(12,22,30,0.92);
      --shadow: rgba(0,0,0,0.45);
      --hit: rgba(0,245,196,0.25);
    }
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    position: fixed;
    inset: 0;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: max(12px, env(safe-area-inset-top)) 16px 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 2;
    pointer-events: none;
  }
  #hud span { color: var(--muted); }
  #hud strong { color: var(--fg); font-weight: 600; }
  #drop-meter-wrap {
    flex: 0 0 auto;
    padding: 0 16px 6px;
    pointer-events: none;
    z-index: 2;
  }
  #drop-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  #drop-meter {
    height: 4px;
    background: var(--shadow);
    border-radius: 2px;
    overflow: hidden;
  }
  #drop-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.15s ease-out;
  }
  #arena-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.35s ease;
  }
  .overlay.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .panel {
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--shadow);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 8px 32px var(--shadow);
    pointer-events: none;
  }
  .panel h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .panel p {
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .panel .stat {
    font-size: 28px;
    font-weight: 700;
    color: var(--fg);
    margin: 12px 0 4px;
  }
  .panel .stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 20px;
  }
  .btn {
    pointer-events: auto;
    min-height: 48px;
    min-width: 180px;
    padding: 14px 28px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #00a88a);
    color: #041018;
    box-shadow: 0 4px 20px rgba(0,212,170,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  @media (prefers-color-scheme: dark) {
    .btn { color: #041018; box-shadow: 0 4px 24px rgba(0,245,196,0.25); }
  }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible { outline: 2px solid var(--accent2); outline-offset: 3px; }
  #feedback {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.15em;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    transition: opacity 0.2s;
  }
  #feedback.show { opacity: 1; }
  #feedback.perfect { color: var(--accent); }
  #feedback.good { color: var(--accent2); }
  #feedback.miss { color: #e74c3c; }
  #feedback.ghost { color: #e74c3c; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><span>Score </span><strong id="score">0</strong></div>
    <div><span>Combo </span><strong id="combo">0</strong></div>
    <div><span>Time </span><strong id="timer">30</strong></div>
  </div>
  <div id="drop-meter-wrap">
    <div id="drop-label">Drop build</div>
    <div id="drop-meter"><div id="drop-fill"></div></div>
  </div>
  <div id="arena-wrap">
    <canvas id="game"></canvas>
    <div id="feedback"></div>
    <div id="title-overlay" class="overlay">
      <div class="panel">
        <h1>FOG DROP</h1>
        <p>Tap the beat as markers hit the gate line. Build the drop — miss and the bass cuts. Survive 30 seconds for the chorus hit.</p>
        <button class="btn" data-smoke="start" id="btn-start">Start Drop</button>
      </div>
    </div>
    <div id="over-overlay" class="overlay hidden">
      <div class="panel">
        <h1 id="over-title">DROP COMPLETE</h1>
        <div class="stat" id="final-score">0</div>
        <div class="stat-label">Final score</div>
        <p id="over-msg">The fog rolls on.</p>
        <button class="btn" data-smoke="restart" id="btn-restart">Play Again</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('score');
  var comboEl = document.getElementById('combo');
  var timerEl = document.getElementById('timer');
  var dropFill = document.getElementById('drop-fill');
  var feedbackEl = document.getElementById('feedback');
  var titleOverlay = document.getElementById('title-overlay');
  var overOverlay = document.getElementById('over-overlay');
  var finalScoreEl = document.getElementById('final-score');
  var overTitleEl = document.getElementById('over-title');
  var overMsgEl = document.getElementById('over-msg');
  var btnStart = document.getElementById('btn-start');
  var btnRestart = document.getElementById('btn-restart');

  var state = 'title';
  var W = 360, H = 640;
  var dpr = 1;
  var score = 0, combo = 0, maxCombo = 0;
  var dropBuild = 0;
  var roundTime = 30;
  var timeLeft = 30;
  var startTime = 0;
  var lastFrame = 0;
  var fogPhase = 0;
  var bassMutedUntil = 0;
  var notes = [];
  var particles = [];
  var beatIndex = 0;
  var nextBeatTime = 0;
  var audioCtx = null;
  var masterGain = null;
  var bassGain = null;
  var scheduledUntil = 0;
  var animId = 0;
  var feedbackTimer = 0;
  var chorusHit = false;
  var hitLineY = 0;
  var bridgePoints = [];
  var flashAlpha = 0;
  var beatPulse = 0;
  var useAudioClock = false;

  var ROUND_DURATION = 30;
  var BPM_START = 118;
  var BPM_END = 158;
  var TRAVEL_TIME = 0.85;
  var PERFECT_WIN = 0.055;
  var GOOD_WIN = 0.11;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function getBpm(elapsed) {
    var t = clamp(elapsed / ROUND_DURATION, 0, 1);
    return lerp(BPM_START, BPM_END, t * t);
  }

  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.55;
      masterGain.connect(audioCtx.destination);
      bassGain = audioCtx.createGain();
      bassGain.gain.value = 1;
      bassGain.connect(masterGain);
      return true;
    } catch (e) {
      audioCtx = null;
      return false;
    }
  }

  function resumeAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }

  function playKick(time, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, time);
      osc.frequency.exponentialRampToValueAtTime(40, time + 0.08);
      g.gain.setValueAtTime(vol || 0.5, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.14);
      osc.connect(g);
      g.connect(bassGain);
      osc.start(time);
      osc.stop(time + 0.15);
    } catch (e) {}
  }

  function playHat(time, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      var len = Math.floor(audioCtx.sampleRate * 0.04);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var g = audioCtx.createGain();
      var f = audioCtx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 7000;
      g.gain.setValueAtTime(vol || 0.12, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
      src.connect(f);
      f.connect(g);
      g.connect(masterGain);
      src.start(time);
      src.stop(time + 0.04);
    } catch (e) {}
  }

  function playBass(time, freq, vol, dur) {
    if (!audioCtx || !bassGain) return;
    if (time < bassMutedUntil) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      var stutter = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, time);
      g.gain.setValueAtTime(0.001, time);
      g.gain.linearRampToValueAtTime(vol || 0.22, time + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, time + (dur || 0.18));
      stutter.gain.setValueAtTime(0, time);
      stutter.gain.setValueAtTime(1, time + 0.02);
      stutter.gain.setValueAtTime(0, time + 0.04);
      stutter.gain.setValueAtTime(1, time + 0.06);
      stutter.gain.setValueAtTime(0.6, time + 0.08);
      stutter.gain.setValueAtTime(1, time + 0.1);
      osc.connect(g);
      g.connect(stutter);
      stutter.connect(bassGain);
      osc.start(time);
      osc.stop(time + (dur || 0.2));
    } catch (e) {}
  }

  function nowTime() {
    if (useAudioClock && audioCtx) return audioCtx.currentTime;
    return performance.now() / 1000;
  }

  function playChorusHit() {
    if (!audioCtx || !masterGain) return;
    try {
      var t = audioCtx.currentTime;
      var freqs = [220, 277, 330, 440];
      for (var i = 0; i < freqs.length; i++) {
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = freqs[i];
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.08, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
        var f = audioCtx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = 2000;
        osc.connect(f);
        f.connect(g);
        g.connect(masterGain);
        osc.start(t);
        osc.stop(t + 1.3);
      }
      playKick(t, 0.7);
      playKick(t + 0.25, 0.6);
    } catch (e) {}
  }

  function muteBass() {
    bassMutedUntil = nowTime() + 0.6;
    if (navigator.vibrate) navigator.vibrate(80);
  }

  function buildBridge() {
    bridgePoints = [];
    var cx = W * 0.5;
    var baseY = H * 0.38;
    var span = W * 0.72;
    var left = cx - span * 0.5;
    var right = cx + span * 0.5;
    var towerW = span * 0.08;
    var towerH = H * 0.14;

    bridgePoints.push({ type: 'move', x: left, y: baseY + towerH });
    bridgePoints.push({ type: 'line', x: left, y: baseY });
    bridgePoints.push({ type: 'line', x: left + towerW, y: baseY });
    bridgePoints.push({ type: 'line', x: left + towerW, y: baseY + towerH });
    bridgePoints.push({ type: 'line', x: left + towerW * 1.5, y: baseY + towerH * 0.55 });
    bridgePoints.push({ type: 'line', x: cx - towerW * 0.5, y: baseY + towerH * 0.2 });
    bridgePoints.push({ type: 'line', x: cx, y: baseY - towerH * 0.15 });
    bridgePoints.push({ type: 'line', x: cx + towerW * 0.5, y: baseY + towerH * 0.2 });
    bridgePoints.push({ type: 'line', x: right - towerW * 1.5, y: baseY + towerH * 0.55 });
    bridgePoints.push({ type: 'line', x: right - towerW, y: baseY + towerH });
    bridgePoints.push({ type: 'line', x: right - towerW, y: baseY });
    bridgePoints.push({ type: 'line', x: right, y: baseY });
    bridgePoints.push({ type: 'line', x: right, y: baseY + towerH });

    var cables = [];
    for (var i = 0; i <= 8; i++) {
      var t = i / 8;
      var x = left + towerW + t * (right - left - towerW * 2);
      var sag = Math.sin(t * Math.PI) * towerH * 0.35;
      cables.push({ x1: x, y1: baseY + towerH * 0.55, x2: x, y2: baseY + towerH * 0.55 + sag + towerH * 0.5 });
    }
    bridgePoints.cables = cables;
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.parentElement.getBoundingClientRect();
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    hitLineY = H * 0.72;
    buildBridge();
  }

  function spawnNote(beatTime, isGhost) {
    var lane = Math.floor(Math.random() * 3);
    var x = W * (0.22 + lane * 0.28);
    notes.push({
      beatTime: beatTime,
      hitTime: beatTime,
      x: x,
      startY: -30,
      isGhost: !!isGhost,
      hit: false,
      missed: false,
      lane: lane
    });
  }

  function scheduleBeats(fromTime) {
    if (!audioCtx || state !== 'playing') return;
    var elapsed = fromTime - startTime;
    var horizon = fromTime + 2.5;
    while (nextBeatTime < horizon) {
      var el = nextBeatTime - startTime;
      var bpm = getBpm(el);
      var interval = 60 / bpm;
      var ghostChance = el > 12 ? clamp((el - 12) / 18, 0, 0.38) : 0;
      var isGhost = Math.random() < ghostChance;

      if (!isGhost) {
        playKick(nextBeatTime, 0.35 + dropBuild * 0.004);
        if (beatIndex % 2 === 1) playHat(nextBeatTime, 0.1);
        if (dropBuild > 20) {
          var bassFreq = 55 + (beatIndex % 4) * 15;
          playBass(nextBeatTime, bassFreq, 0.15 + dropBuild * 0.003, 0.16);
        }
      } else {
        playHat(nextBeatTime, 0.06);
      }

      spawnNote(nextBeatTime, isGhost);
      beatIndex++;
      nextBeatTime += interval;
    }
    scheduledUntil = nextBeatTime;
  }

  function showFeedback(text, cls) {
    if (!feedbackEl) return;
    feedbackEl.textContent = text;
    feedbackEl.className = 'show ' + (cls || '');
    feedbackTimer = 0.35;
  }

  function spawnParticles(x, y, color) {
    for (var i = 0; i < 10; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 40 + Math.random() * 80;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.4 + Math.random() * 0.3,
        color: color
      });
    }
  }

  function tryHit() {
    if (state !== 'playing') return;
    var now = nowTime();
    var best = null;
    var bestDiff = 999;

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.hit || n.missed) continue;
      var diff = Math.abs(now - n.hitTime);
      if (diff < bestDiff) {
        bestDiff = diff;
        best = n;
      }
    }

    if (!best || bestDiff > GOOD_WIN) {
      showFeedback('MISS', 'miss');
      combo = 0;
      muteBass();
      return;
    }

    if (best.isGhost) {
      best.hit = true;
      showFeedback('FAKE', 'ghost');
      combo = 0;
      score = Math.max(0, score - 30);
      muteBass();
      spawnParticles(best.x, hitLineY, '#e74c3c');
      updateHud();
      return;
    }

    best.hit = true;
    var pts = 0;
    var label = '';
    if (bestDiff <= PERFECT_WIN) {
      pts = 100 + combo * 5;
      label = 'PERFECT';
      combo++;
      dropBuild = clamp(dropBuild + 3, 0, 100);
      spawnParticles(best.x, hitLineY, '#00f5c4');
      if (navigator.vibrate) navigator.vibrate(12);
    } else {
      pts = 50 + combo * 2;
      label = 'GOOD';
      combo++;
      dropBuild = clamp(dropBuild + 1.5, 0, 100);
      spawnParticles(best.x, hitLineY, '#ff8555');
    }
    score += pts;
    if (combo > maxCombo) maxCombo = combo;
    showFeedback(label, bestDiff <= PERFECT_WIN ? 'perfect' : 'good');
    beatPulse = 1;
    if (audioCtx) playHat(now, 0.2);
    updateHud();
  }

  function updateHud() {
    if (scoreEl) scoreEl.textContent = String(Math.floor(score));
    if (comboEl) comboEl.textContent = String(combo);
    if (timerEl) timerEl.textContent = String(Math.ceil(timeLeft));
    if (dropFill) dropFill.style.width = dropBuild + '%';
  }

  function resetGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    dropBuild = 0;
    timeLeft = ROUND_DURATION;
    beatIndex = 0;
    notes = [];
    particles = [];
    bassMutedUntil = 0;
    chorusHit = false;
    feedbackTimer = 0;
    nextBeatTime = 0;
    scheduledUntil = 0;
    updateHud();
    if (feedbackEl) feedbackEl.className = '';
  }

  function startGame() {
    if (!ctx) return;
    resumeAudio();
    if (!audioCtx) initAudio();
    resumeAudio();
    resetGame();
    state = 'playing';
    if (titleOverlay) titleOverlay.classList.add('hidden');
    if (overOverlay) overOverlay.classList.add('hidden');

    useAudioClock = !!audioCtx;
    var t0 = useAudioClock ? audioCtx.currentTime + 0.15 : performance.now() / 1000 + 0.15;
    startTime = t0;
    nextBeatTime = t0 + TRAVEL_TIME;
    lastFrame = performance.now();

    if (audioCtx) scheduleBeats(t0);
  }

  function endGame() {
    state = 'gameover';
    chorusHit = dropBuild >= 65;
    if (chorusHit) {
      flashAlpha = 1;
      playChorusHit();
      if (overTitleEl) overTitleEl.textContent = 'CHORUS HIT';
      if (overMsgEl) overMsgEl.textContent = 'The drop landed. Golden hour over the gate.';
    } else {
      if (overTitleEl) overTitleEl.textContent = 'DROP FADED';
      if (overMsgEl) overMsgEl.textContent = 'Build more next time — the fog keeps rolling.';
    }
    if (finalScoreEl) finalScoreEl.textContent = String(Math.floor(score));
    if (overOverlay) overOverlay.classList.remove('hidden');
  }

  function updateNotes() {
    var t = nowTime();
    for (var i = notes.length - 1; i >= 0; i--) {
      var n = notes[i];
      if (!n.hit && !n.missed && t > n.hitTime + GOOD_WIN) {
        if (!n.isGhost) {
          n.missed = true;
          combo = 0;
          muteBass();
          showFeedback('MISS', 'miss');
          updateHud();
        } else {
          notes.splice(i, 1);
        }
      }
    }
    if (notes.length > 40) notes.splice(0, notes.length - 40);
  }

  function drawBackground(t) {
    if (!ctx) return;
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var skyTop = dark ? '#0a1520' : '#b8ccd8';
    var skyMid = dark ? '#142430' : '#9eb4c4';
    var skyBot = dark ? '#1a3040' : '#7a98aa';
    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, skyTop);
    grd.addColorStop(0.45, skyMid);
    grd.addColorStop(1, skyBot);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = dark ? 'rgba(180,200,210,0.04)' : 'rgba(255,255,255,0.15)';
    for (var i = 0; i < 5; i++) {
      var fy = H * (0.15 + i * 0.12) + Math.sin(t * 0.3 + i) * 8;
      ctx.fillRect(0, fy, W, H * 0.18);
    }
  }

  function drawLanes() {
    if (!ctx) return;
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    ctx.strokeStyle = dark ? 'rgba(0,245,196,0.08)' : 'rgba(0,168,136,0.1)';
    ctx.lineWidth = 1;
    for (var lane = 0; lane < 3; lane++) {
      var x = W * (0.22 + lane * 0.28);
      ctx.beginPath();
      ctx.moveTo(x, H * 0.08);
      ctx.lineTo(x, H * 0.92);
      ctx.stroke();
    }
  }

  function drawBridge(t) {
    if (!ctx || !bridgePoints.length) return;
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var neon = dark ? '#00f5c4' : '#00a88a';
    var warm = dark ? '#ff8555' : '#e85a28';
    var buildGlow = state === 'playing' ? dropBuild / 100 : 0.3;
    var pulse = 0.7 + Math.sin(t * 3) * 0.15 + buildGlow * 0.4;

    ctx.save();
    ctx.strokeStyle = neon;
    ctx.lineWidth = 2;
    ctx.shadowColor = neon;
    ctx.shadowBlur = 12 * pulse;
    ctx.beginPath();
    for (var i = 0; i < bridgePoints.length; i++) {
      var p = bridgePoints[i];
      if (p.type === 'move') ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    if (bridgePoints.cables) {
      ctx.strokeStyle = warm;
      ctx.lineWidth = 1;
      ctx.shadowColor = warm;
      ctx.shadowBlur = 6;
      for (var j = 0; j < bridgePoints.cables.length; j++) {
        var c = bridgePoints.cables[j];
        ctx.beginPath();
        ctx.moveTo(c.x1, c.y1);
        ctx.lineTo(c.x2, c.y2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawFog(t) {
    if (!ctx) return;
    fogPhase = t * 0.15;
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    for (var i = 0; i < 4; i++) {
      var alpha = dark ? 0.08 + i * 0.04 : 0.12 + i * 0.05;
      var y = H * (0.5 + i * 0.12) + Math.sin(fogPhase + i * 1.7) * 20;
      var xOff = Math.sin(fogPhase * 0.7 + i) * W * 0.08;
      ctx.fillStyle = dark ? 'rgba(200,220,230,' + alpha + ')' : 'rgba(255,255,255,' + alpha + ')';
      ctx.beginPath();
      ctx.ellipse(W * 0.5 + xOff, y, W * 0.55, H * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHitZone() {
    if (!ctx) return;
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var pulseExtra = beatPulse * 12;
    beatPulse = Math.max(0, beatPulse - 0.08);
    ctx.strokeStyle = dark ? 'rgba(0,245,196,0.5)' : 'rgba(0,168,136,0.55)';
    ctx.lineWidth = 2 + pulseExtra * 0.05;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(W * 0.08, hitLineY);
    ctx.lineTo(W * 0.92, hitLineY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = dark ? 'rgba(0,245,196,0.06)' : 'rgba(0,168,136,0.08)';
    ctx.fillRect(0, hitLineY - 20 - pulseExtra, W, 40 + pulseExtra * 2);
  }

  function drawNotes(now) {
    if (!ctx) return;
    var t = nowTime();
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.hit || n.missed) continue;
      var progress = 1 - (n.hitTime - t) / TRAVEL_TIME;
      if (progress < 0 || progress > 1.05) continue;
      var y = lerp(n.startY, hitLineY, clamp(progress, 0, 1));
      var nearHit = Math.abs(t - n.hitTime) < GOOD_WIN;
      var r = nearHit ? 16 : 12;

      if (n.isGhost) {
        ctx.fillStyle = dark ? 'rgba(255,120,80,0.35)' : 'rgba(200,80,50,0.3)';
        ctx.strokeStyle = dark ? 'rgba(255,120,80,0.6)' : 'rgba(200,80,50,0.5)';
      } else {
        ctx.fillStyle = dark ? 'rgba(0,245,196,0.85)' : 'rgba(0,168,136,0.9)';
        ctx.strokeStyle = dark ? '#00f5c4' : '#00a88a';
      }
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(n.x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (nearHit && !n.isGhost) {
        ctx.strokeStyle = dark ? 'rgba(0,245,196,0.4)' : 'rgba(0,168,136,0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(n.x, y, r + 8 + Math.sin(now * 0.01) * 3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawParticles(dt) {
    if (!ctx) return;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 120 * dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawFlash() {
    if (!ctx || flashAlpha <= 0) return;
    flashAlpha = Math.max(0, flashAlpha - 0.025);
    ctx.fillStyle = 'rgba(0,245,196,' + (flashAlpha * 0.35) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  function render(now) {
    if (!ctx) return;
    var t = now * 0.001;
    drawBackground(t);
    drawLanes();
    drawBridge(t);
    drawFog(t);
    drawHitZone();
    drawNotes(now);
    drawParticles(lastFrame ? (now - lastFrame) * 0.001 : 0.016);
    drawFlash();
  }

  function loop(now) {
    animId = requestAnimationFrame(loop);
    var dt = lastFrame ? (now - lastFrame) * 0.001 : 0.016;
    lastFrame = now;

    if (feedbackTimer > 0) {
      feedbackTimer -= dt;
      if (feedbackTimer <= 0 && feedbackEl) feedbackEl.className = '';
    }

    if (state === 'playing') {
      var elapsed = nowTime() - startTime;
      timeLeft = ROUND_DURATION - elapsed;
      if (audioCtx) scheduleBeats(audioCtx.currentTime);
      else {
        while (nextBeatTime < nowTime() + 2.5) {
          var el = nextBeatTime - startTime;
          var bpm = getBpm(el);
          var ghostChance = el > 12 ? clamp((el - 12) / 18, 0, 0.38) : 0;
          spawnNote(nextBeatTime, Math.random() < ghostChance);
          beatIndex++;
          nextBeatTime += 60 / bpm;
        }
      }
      updateNotes();
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateHud();
        endGame();
      } else {
        updateHud();
      }
    }

    render(now);
  }

  function onPointer(e) {
    if (e.target && (e.target.closest && e.target.closest('.btn'))) return;
    if (state === 'playing') {
      e.preventDefault();
      tryHit();
    }
  }

  function onKey(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === 'playing') {
        e.preventDefault();
        tryHit();
      }
    }
  }

  if (btnStart) {
    btnStart.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
  }
  if (btnRestart) {
    btnRestart.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
  }

  if (canvas) {
    canvas.addEventListener('touchstart', onPointer, { passive: false });
    canvas.addEventListener('mousedown', onPointer);
  }
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);

  resize();
  updateHud();
  requestAnimationFrame(loop);

  document.body.addEventListener('touchstart', function (e) {
    if (state === 'playing' && e.target === canvas) e.preventDefault();
  }, { passive: false });
})();
</script>
</body>
</html>
