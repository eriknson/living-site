<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stutter Fog</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #c8d0d8;
    --fg: #142028;
    --muted: #4a5c68;
    --neon: #00e8b8;
    --neon2: #ff7040;
    --wire: rgba(0, 200, 170, 0.55);
    --panel: rgba(248, 250, 252, 0.92);
    --shadow: rgba(20, 32, 40, 0.14);
    --lane-bg: rgba(255, 255, 255, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c141c;
      --fg: #e8f0f6;
      --muted: #7a909e;
      --neon: #00ffc8;
      --neon2: #ff8855;
      --wire: rgba(0, 255, 200, 0.45);
      --panel: rgba(10, 18, 26, 0.94);
      --shadow: rgba(0, 0, 0, 0.5);
      --lane-bg: rgba(255, 255, 255, 0.04);
    }
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    position: fixed;
    inset: 0;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: max(10px, env(safe-area-inset-top)) 14px 6px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    z-index: 2;
    pointer-events: none;
  }
  #hud span { color: var(--muted); }
  #hud strong { color: var(--fg); font-weight: 600; }
  #build-wrap {
    flex: 0 0 auto;
    padding: 0 14px 6px;
    pointer-events: none;
    z-index: 2;
  }
  #build-label {
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 3px;
  }
  #build-meter {
    height: 3px;
    background: var(--shadow);
    border-radius: 2px;
    overflow: hidden;
  }
  #build-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    border-radius: 2px;
    transition: width 0.12s ease-out;
  }
  #lane-bar {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    padding: 0 14px 8px;
    pointer-events: none;
    z-index: 2;
  }
  .lane-chip {
    flex: 1;
    text-align: center;
    font-size: 9px;
    letter-spacing: 0.08em;
    padding: 4px 2px;
    border-radius: 4px;
    color: var(--muted);
    background: var(--lane-bg);
    transition: background 0.2s, color 0.2s, box-shadow 0.2s;
  }
  .lane-chip.active {
    color: var(--fg);
    background: rgba(0, 232, 184, 0.18);
    box-shadow: inset 0 0 0 1px var(--neon);
  }
  @media (prefers-color-scheme: dark) {
    .lane-chip.active { background: rgba(0, 255, 200, 0.12); }
  }
  #arena-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 120px;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--shadow);
    border-radius: 18px;
    padding: 26px 22px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 10px 40px var(--shadow);
    pointer-events: none;
  }
  .panel h1 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-bottom: 6px;
    background: linear-gradient(135deg, var(--neon), var(--neon2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .panel p {
    font-size: 11px;
    line-height: 1.65;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .panel .stat {
    font-size: 32px;
    font-weight: 700;
    color: var(--fg);
    margin: 10px 0 2px;
  }
  .panel .stat-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.12em;
    margin-bottom: 18px;
  }
  .btn {
    pointer-events: auto;
    min-height: 48px;
    min-width: 180px;
    padding: 14px 28px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    background: linear-gradient(135deg, var(--neon), #00a888);
    color: #041018;
    box-shadow: 0 4px 22px rgba(0, 232, 184, 0.35);
    transition: transform 0.12s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible { outline: 2px solid var(--neon2); outline-offset: 3px; }
  #feedback {
    position: absolute;
    left: 50%;
    top: 58%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.14em;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    transition: opacity 0.15s;
  }
  #feedback.show { opacity: 1; }
  #feedback.perfect { color: var(--neon); }
  #feedback.good { color: var(--neon2); }
  #feedback.miss, #feedback.ghost { color: #e05545; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><span>Score </span><strong id="score">0</strong></div>
    <div><span>Combo </span><strong id="combo">0</strong></div>
    <div><span>Time </span><strong id="timer">30</strong></div>
  </div>
  <div id="build-wrap">
    <div id="build-label">Chorus build</div>
    <div id="build-meter"><div id="build-fill"></div></div>
  </div>
  <div id="lane-bar">
    <div class="lane-chip active" data-lane="0">LEAD</div>
    <div class="lane-chip" data-lane="1">SNARE</div>
    <div class="lane-chip" data-lane="2">KICK</div>
    <div class="lane-chip" data-lane="3">SUB</div>
  </div>
  <div id="arena-wrap">
    <canvas id="game"></canvas>
    <div id="feedback"></div>
    <div id="title-overlay" class="overlay">
      <div class="panel">
        <h1>STUTTER FOG</h1>
        <p>Tap when neon pulses hit the gate on your lane. Miss and you drop into the bass. Ignore ghost ripples. Survive 30 seconds for the chorus swell.</p>
        <button class="btn" data-smoke="start" id="btn-start">Drop In</button>
      </div>
    </div>
    <div id="over-overlay" class="overlay hidden">
      <div class="panel">
        <h1 id="over-title">TRACK END</h1>
        <div class="stat" id="final-score">0</div>
        <div class="stat-label">Final score</div>
        <p id="over-msg">The fog rolls on.</p>
        <button class="btn" data-smoke="restart" id="btn-restart">Play Again</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('score');
  var comboEl = document.getElementById('combo');
  var timerEl = document.getElementById('timer');
  var feedbackEl = document.getElementById('feedback');
  var titleOverlay = document.getElementById('title-overlay');
  var overOverlay = document.getElementById('over-overlay');
  var finalScoreEl = document.getElementById('final-score');
  var overTitleEl = document.getElementById('over-title');
  var overMsgEl = document.getElementById('over-msg');
  var btnStart = document.getElementById('btn-start');
  var btnRestart = document.getElementById('btn-restart');
  var laneChips = document.querySelectorAll('.lane-chip');
  var buildFill = document.getElementById('build-fill');

  var state = 'title';
  var W = 360, H = 640, dpr = 1;
  var score = 0, combo = 0, maxCombo = 0;
  var playerLane = 0;
  var timeLeft = 30;
  var startTime = 0;
  var lastFrame = 0;
  var notes = [];
  var particles = [];
  var fogParticles = [];
  var beatIndex = 0;
  var nextBeatTime = 0;
  var audioCtx = null;
  var masterGain = null;
  var bassGain = null;
  var animId = 0;
  var feedbackTimer = 0;
  var chorusHit = false;
  var flashAlpha = 0;
  var beatPulse = 0;
  var fogDensity = 0.25;
  var useAudioClock = false;
  var skyline = [];
  var laneRects = [];
  var hitX = 0;

  var ROUND = 30;
  var BPM0 = 112;
  var BPM1 = 156;
  var TRAVEL = 0.9;
  var PERF = 0.06;
  var GOOD = 0.115;
  var LANES = ['LEAD', 'SNARE', 'KICK', 'SUB'];
  var LANE_COLS = ['#00e8b8', '#40c8e8', '#ff8855', '#ff5540'];

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function getBpm(elapsed) {
    var t = clamp(elapsed / ROUND, 0, 1);
    return lerp(BPM0, BPM1, t * t);
  }

  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.52;
      masterGain.connect(audioCtx.destination);
      bassGain = audioCtx.createGain();
      bassGain.gain.value = 1;
      bassGain.connect(masterGain);
      return true;
    } catch (e) {
      audioCtx = null;
      return false;
    }
  }

  function resumeAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }

  function nowTime() {
    if (useAudioClock && audioCtx) return audioCtx.currentTime;
    return performance.now() / 1000;
  }

  function playKick(time, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, time);
      osc.frequency.exponentialRampToValueAtTime(42, time + 0.07);
      g.gain.setValueAtTime(vol || 0.48, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.13);
      osc.connect(g);
      g.connect(bassGain);
      osc.start(time);
      osc.stop(time + 0.14);
    } catch (e) {}
  }

  function playHat(time, vol) {
    if (!audioCtx || !masterGain) return;
    try {
      var len = Math.floor(audioCtx.sampleRate * 0.035);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var g = audioCtx.createGain();
      var f = audioCtx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 7500;
      g.gain.setValueAtTime(vol || 0.11, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
      src.connect(f);
      f.connect(g);
      g.connect(masterGain);
      src.start(time);
      src.stop(time + 0.035);
    } catch (e) {}
  }

  function playStutterBass(time, freq, vol) {
    if (!audioCtx || !bassGain) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      var st = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, time);
      g.gain.setValueAtTime(0.001, time);
      g.gain.linearRampToValueAtTime(vol || 0.2, time + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.16);
      var cuts = [0, 0.025, 0.05, 0.075, 0.1];
      for (var i = 0; i < cuts.length; i++) {
        st.gain.setValueAtTime(i % 2 ? 0.15 : 1, time + cuts[i]);
      }
      osc.connect(g);
      g.connect(st);
      st.connect(bassGain);
      osc.start(time);
      osc.stop(time + 0.18);
    } catch (e) {}
  }

  function playChorus() {
    if (!audioCtx || !masterGain) return;
    try {
      var t = audioCtx.currentTime;
      var freqs = [196, 247, 294, 392];
      for (var i = 0; i < freqs.length; i++) {
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        var f = audioCtx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = 2200;
        osc.type = 'sawtooth';
        osc.frequency.value = freqs[i];
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.07, t + 0.06);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
        osc.connect(f);
        f.connect(g);
        g.connect(masterGain);
        osc.start(t);
        osc.stop(t + 1.2);
      }
      playKick(t, 0.65);
      playKick(t + 0.22, 0.55);
    } catch (e) {}
  }

  function buildSkyline() {
    skyline = [];
    var baseY = H * 0.28;
    var specs = [
      { x: 0.04, w: 0.07, h: 0.12, spire: false },
      { x: 0.12, w: 0.09, h: 0.18, spire: true },
      { x: 0.22, w: 0.06, h: 0.14, spire: false },
      { x: 0.30, w: 0.05, h: 0.22, spire: true },
      { x: 0.38, w: 0.08, h: 0.16, spire: false },
      { x: 0.48, w: 0.04, h: 0.26, spire: true },
      { x: 0.55, w: 0.07, h: 0.13, spire: false },
      { x: 0.64, w: 0.06, h: 0.19, spire: false },
      { x: 0.72, w: 0.08, h: 0.15, spire: true },
      { x: 0.82, w: 0.07, h: 0.11, spire: false },
      { x: 0.90, w: 0.08, h: 0.17, spire: false }
    ];
    for (var i = 0; i < specs.length; i++) {
      var s = specs[i];
      var bx = s.x * W;
      var bw = s.w * W;
      var bh = s.h * H;
      var by = baseY - bh;
      var pts = [
        [bx, baseY], [bx, by + bh * 0.3], [bx + bw * 0.5, by],
        [bx + bw, by + bh * 0.25], [bx + bw, baseY]
      ];
      if (s.spire) {
        pts.splice(2, 0, [bx + bw * 0.5, by - bh * 0.12]);
      }
      skyline.push({ pts: pts, windows: s.w > 0.06 ? 3 : 2 });
    }
  }

  function layoutLanes() {
    laneRects = [];
    var top = H * 0.34;
    var bottom = H * 0.92;
    var gap = 6;
    var laneH = (bottom - top - gap * 3) / 4;
    hitX = W * 0.82;
    for (var i = 0; i < 4; i++) {
      laneRects.push({
        y: top + i * (laneH + gap),
        h: laneH,
        x: W * 0.06,
        w: W * 0.88
      });
    }
  }

  function initFog() {
    fogParticles = [];
    for (var i = 0; i < 40; i++) {
      fogParticles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 20 + Math.random() * 50,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.15,
        a: 0.04 + Math.random() * 0.08
      });
    }
  }

  function resize() {
    if (!canvas) return;
    var wrap = document.getElementById('arena-wrap');
    var rect = wrap ? wrap.getBoundingClientRect() : { width: 360, height: 500 };
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(280, Math.floor(rect.width));
    H = Math.max(320, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    buildSkyline();
    layoutLanes();
    initFog();
  }

  function updateLaneUI() {
    for (var i = 0; i < laneChips.length; i++) {
      laneChips[i].classList.toggle('active', i === playerLane);
    }
  }

  function dropLane() {
    if (playerLane >= 3) {
      endGame(false);
      return;
    }
    playerLane++;
    updateLaneUI();
    combo = 0;
    if (comboEl) comboEl.textContent = '0';
    flashAlpha = 0.5;
    if (navigator.vibrate) navigator.vibrate([60, 40, 80]);
    spawnParticles(hitX, laneRects[playerLane].y + laneRects[playerLane].h * 0.5, '#e05545', 12);
  }

  function showFeedback(text, cls) {
    if (!feedbackEl) return;
    feedbackEl.textContent = text;
    feedbackEl.className = cls + ' show';
    feedbackTimer = 0.45;
  }

  function spawnParticles(x, y, col, n) {
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 0.4 + Math.random() * 0.3,
        col: col,
        r: 2 + Math.random() * 3
      });
    }
  }

  function spawnNote(beatTime, lane, ghost) {
    notes.push({
      hitTime: beatTime,
      lane: lane,
      ghost: !!ghost,
      judged: false,
      ripple: 0
    });
  }

  function scheduleBeats(from, to) {
    var t = from;
    var idx = beatIndex;
    while (t < to) {
      var elapsed = t - startTime;
      var bpm = getBpm(elapsed);
      var interval = 60 / bpm;
      var beatInBar = idx % 4;
      var ghostChance = clamp(elapsed / ROUND, 0, 1) * 0.35;

      if (beatInBar === 0 || beatInBar === 2) {
        spawnNote(t, playerLane, false);
        if (audioCtx) playKick(t, 0.42 + playerLane * 0.04);
      } else if (beatInBar === 1) {
        spawnNote(t, playerLane, false);
        if (audioCtx) playHat(t, 0.1);
      } else {
        spawnNote(t, playerLane, Math.random() < ghostChance);
        if (audioCtx && !notes[notes.length - 1].ghost) {
          playStutterBass(t, 55 + playerLane * 18, 0.14);
        }
      }

      if (Math.random() < ghostChance * 0.7) {
        var gl = Math.floor(Math.random() * 4);
        if (gl !== playerLane) spawnNote(t + interval * 0.5, gl, true);
      }

      idx++;
      t += interval;
    }
    beatIndex = idx;
    nextBeatTime = t;
  }

  function resetGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    playerLane = 0;
    timeLeft = ROUND;
    notes = [];
    particles = [];
    beatIndex = 0;
    nextBeatTime = 0;
    chorusHit = false;
    fogDensity = 0.25;
    flashAlpha = 0;
    beatPulse = 0;
    feedbackTimer = 0;
    if (scoreEl) scoreEl.textContent = '0';
    if (comboEl) comboEl.textContent = '0';
    if (timerEl) timerEl.textContent = String(ROUND);
    if (buildFill) buildFill.style.width = '0%';
    updateLaneUI();
  }

  function startGame() {
    resetGame();
    resumeAudio();
    useAudioClock = !!audioCtx;
    startTime = nowTime() + 0.35;
    nextBeatTime = startTime;
    scheduleBeats(startTime, startTime + 2.5);
    state = 'play';
    if (titleOverlay) titleOverlay.classList.add('hidden');
    if (overOverlay) overOverlay.classList.add('hidden');
    lastFrame = performance.now();
    if (animId) cancelAnimationFrame(animId);
    loop(lastFrame);
  }

  function endGame(won) {
    state = 'over';
    if (animId) cancelAnimationFrame(animId);
    if (finalScoreEl) finalScoreEl.textContent = String(score);
    if (overTitleEl) overTitleEl.textContent = won ? 'CHORUS HIT' : 'DROPPED OUT';
    if (overMsgEl) {
      overMsgEl.textContent = won
        ? 'The stutter-house swell breaks through the fog. Max combo ' + maxCombo + '.'
        : 'You sank into the sub-bass. Max combo ' + maxCombo + '.';
    }
    if (overOverlay) overOverlay.classList.remove('hidden');
    if (won && navigator.vibrate) navigator.vibrate([30, 20, 30, 20, 60]);
  }

  function judgeHit() {
    if (state !== 'play') return;
    var t = nowTime();
    var best = null;
    var bestDiff = 999;
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged || n.lane !== playerLane) continue;
      var diff = Math.abs(t - n.hitTime);
      if (diff < bestDiff) {
        bestDiff = diff;
        best = n;
      }
    }
    if (!best || bestDiff > GOOD) {
      showFeedback('MISS', 'miss');
      dropLane();
      return;
    }
    if (best.ghost) {
      best.judged = true;
      showFeedback('GHOST', 'ghost');
      dropLane();
      return;
    }
    best.judged = true;
    var lr = laneRects[best.lane];
    var cy = lr.y + lr.h * 0.5;
    if (bestDiff <= PERF) {
      combo++;
      score += 100 + combo * 8;
      showFeedback('PERFECT', 'perfect');
      spawnParticles(hitX, cy, LANE_COLS[best.lane], 14);
      if (navigator.vibrate) navigator.vibrate(12);
    } else {
      combo++;
      score += 50 + combo * 4;
      showFeedback('GOOD', 'good');
      spawnParticles(hitX, cy, LANE_COLS[best.lane], 8);
    }
    if (combo > maxCombo) maxCombo = combo;
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) comboEl.textContent = String(combo);
    if (buildFill) buildFill.style.width = clamp(combo / 12, 0, 1) * 100 + '%';
    beatPulse = 1;
  }

  function autoMiss() {
    var t = nowTime();
    for (var i = notes.length - 1; i >= 0; i--) {
      var n = notes[i];
      if (n.judged || n.ghost || n.lane !== playerLane) continue;
      if (t - n.hitTime > GOOD) {
        n.judged = true;
        showFeedback('MISS', 'miss');
        dropLane();
        break;
      }
    }
  }

  function onTap(e) {
    if (e && e.preventDefault) e.preventDefault();
    judgeHit();
  }

  function drawBackground(isDark) {
    if (!ctx) return;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    if (isDark) {
      g.addColorStop(0, '#0a1018');
      g.addColorStop(0.45, '#101820');
      g.addColorStop(1, '#081018');
    } else {
      g.addColorStop(0, '#b8c4ce');
      g.addColorStop(0.45, '#c4ced6');
      g.addColorStop(1, '#a8b4be');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < fogParticles.length; i++) {
      var f = fogParticles[i];
      f.x += f.vx;
      f.y += f.vy;
      if (f.x < -60) f.x = W + 40;
      if (f.x > W + 60) f.x = -40;
      if (f.y < -20) f.y = H + 20;
      if (f.y > H + 20) f.y = -20;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = isDark
        ? 'rgba(180, 200, 210, ' + (f.a * (0.5 + fogDensity)) + ')'
        : 'rgba(255, 255, 255, ' + (f.a * (0.6 + fogDensity * 0.5)) + ')';
      ctx.fill();
    }
  }

  function drawSkyline(isDark) {
    if (!ctx) return;
    var wire = isDark ? 'rgba(0, 255, 200, 0.5)' : 'rgba(0, 180, 150, 0.55)';
    var fill = isDark ? 'rgba(0, 40, 50, 0.35)' : 'rgba(200, 210, 220, 0.4)';
    for (var i = 0; i < skyline.length; i++) {
      var b = skyline[i];
      ctx.beginPath();
      var p = b.pts;
      ctx.moveTo(p[0][0], p[0][1]);
      for (var j = 1; j < p.length; j++) ctx.lineTo(p[j][0], p[j][1]);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = wire;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      for (var w = 0; w < b.windows; w++) {
        var wx = b.pts[0][0] + (b.pts[3][0] - b.pts[0][0]) * (0.2 + w * 0.25);
        var wy = b.pts[0][1] - (b.pts[0][1] - b.pts[2][1]) * 0.45;
        ctx.fillStyle = isDark ? 'rgba(0, 255, 200, 0.35)' : 'rgba(0, 160, 130, 0.4)';
        ctx.fillRect(wx, wy, 3, 5);
      }
    }
  }

  function drawLanes(isDark) {
    if (!ctx) return;
    for (var i = 0; i < 4; i++) {
      var r = laneRects[i];
      var active = i === playerLane;
      ctx.fillStyle = active
        ? (isDark ? 'rgba(0, 255, 200, 0.06)' : 'rgba(0, 200, 170, 0.1)')
        : (isDark ? 'rgba(255,255,255,0.02)' : 'rgba(255,255,255,0.25)');
      ctx.fillRect(r.x, r.y, r.w, r.h);

      if (i > 0) {
        var fogA = fogDensity * (0.3 + i * 0.15);
        ctx.fillStyle = isDark
          ? 'rgba(140, 160, 170, ' + fogA + ')'
          : 'rgba(220, 228, 235, ' + fogA + ')';
        ctx.fillRect(r.x, r.y - 3, r.w, 6);
      }

      ctx.strokeStyle = active
        ? (isDark ? 'rgba(0,255,200,0.5)' : 'rgba(0,180,150,0.55)')
        : (isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)');
      ctx.lineWidth = active ? 1.5 : 0.8;
      ctx.strokeRect(r.x, r.y, r.w, r.h);

      var cy = r.y + r.h * 0.5;
      ctx.beginPath();
      ctx.arc(hitX, cy, r.h * 0.28, 0, Math.PI * 2);
      ctx.strokeStyle = active
        ? (isDark ? 'rgba(0,255,200,0.7)' : 'rgba(0,180,150,0.65)')
        : (isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.1)');
      ctx.lineWidth = active ? 2 : 1;
      ctx.stroke();

      if (active) {
        ctx.beginPath();
        ctx.arc(hitX, cy, r.h * 0.18 + beatPulse * 6, 0, Math.PI * 2);
        ctx.strokeStyle = isDark ? 'rgba(0,255,200,0.35)' : 'rgba(0,180,150,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      ctx.font = '9px ui-monospace, Menlo, monospace';
      ctx.fillStyle = isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.25)';
      ctx.fillText(LANES[i], r.x + 4, r.y + r.h - 5);
    }
  }

  function drawNotes(t, isDark) {
    if (!ctx) return;
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.judged) continue;
      var lr = laneRects[n.lane];
      if (!lr) continue;
      var cy = lr.y + lr.h * 0.5;
      var prog = clamp((t - (n.hitTime - TRAVEL)) / TRAVEL, 0, 1.2);
      var px = lerp(W * 0.08, hitX, prog);
      var rippleR = lr.h * (0.15 + prog * 0.35);
      var col = n.ghost ? null : LANE_COLS[n.lane];
      var alpha = n.ghost ? 0.35 : (0.5 + (n.lane === playerLane ? 0.4 : 0.1));

      ctx.beginPath();
      ctx.arc(px, cy, rippleR, 0, Math.PI * 2);
      if (n.ghost) {
        ctx.strokeStyle = isDark ? 'rgba(255,120,80,0.35)' : 'rgba(200,100,60,0.4)';
      } else {
        var ri = parseInt(col.slice(1, 3), 16);
        var gi = parseInt(col.slice(3, 5), 16);
        var bi = parseInt(col.slice(5, 7), 16);
        ctx.strokeStyle = 'rgba(' + ri + ',' + gi + ',' + bi + ',' + alpha + ')';
      }
      ctx.lineWidth = n.ghost ? 1 : 2;
      if (n.ghost) ctx.setLineDash([4, 6]); else ctx.setLineDash([]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.arc(px, cy, 4 + beatPulse * 2, 0, Math.PI * 2);
      ctx.fillStyle = n.ghost
        ? (isDark ? 'rgba(255,120,80,0.4)' : 'rgba(200,80,50,0.45)')
        : (isDark ? 'rgba(0,255,200,0.85)' : 'rgba(0,180,150,0.8)');
      ctx.fill();
    }
  }

  function drawParticles(dt) {
    if (!ctx) return;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 80 * dt;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawFlash() {
    if (!ctx || flashAlpha <= 0) return;
    ctx.fillStyle = 'rgba(224, 85, 69, ' + flashAlpha * 0.25 + ')';
    ctx.fillRect(0, 0, W, H);
    flashAlpha = Math.max(0, flashAlpha - 0.04);
  }

  function loop(now) {
    if (state !== 'play') return;
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    var t = nowTime();
    var elapsed = t - startTime;

    if (nextBeatTime < t + 2) scheduleBeats(nextBeatTime, t + 2.5);
    autoMiss();

    timeLeft = Math.max(0, ROUND - elapsed);
    if (timerEl) timerEl.textContent = String(Math.ceil(timeLeft));
    fogDensity = 0.25 + clamp(elapsed / ROUND, 0, 1) * 0.55;
    beatPulse = Math.max(0, beatPulse - dt * 3);
    if (buildFill && combo === 0) {
      buildFill.style.width = clamp(elapsed / ROUND, 0, 1) * 55 + '%';
    }

    if (feedbackTimer > 0) {
      feedbackTimer -= dt;
      if (feedbackTimer <= 0 && feedbackEl) feedbackEl.className = '';
    }

    notes = notes.filter(function (n) { return t - n.hitTime < 0.5; });

    if (elapsed >= ROUND) {
      if (!chorusHit) {
        chorusHit = true;
        playChorus();
        flashAlpha = 0.35;
        score += 500 + combo * 20;
        if (scoreEl) scoreEl.textContent = String(score);
      }
      endGame(true);
      return;
    }

    var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (ctx) {
      drawBackground(isDark);
      drawSkyline(isDark);
      drawLanes(isDark);
      drawNotes(t, isDark);
      drawParticles(dt);
      drawFlash();
    }

    animId = requestAnimationFrame(loop);
  }

  function bindEvents() {
    if (btnStart) btnStart.addEventListener('click', function (e) {
      e.stopPropagation();
      initAudio();
      startGame();
    });
    if (btnRestart) btnRestart.addEventListener('click', function (e) {
      e.stopPropagation();
      resumeAudio();
      startGame();
    });
    if (canvas) {
      canvas.addEventListener('touchstart', onTap, { passive: false });
      canvas.addEventListener('mousedown', onTap);
    }
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (state === 'title' && btnStart) btnStart.click();
        else if (state === 'over' && btnRestart) btnRestart.click();
        else judgeHit();
      }
    });
    window.addEventListener('resize', resize);
  }

  initAudio();
  resize();
  bindEvents();

  if (ctx) {
    var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    drawBackground(isDark);
    drawSkyline(isDark);
    drawLanes(isDark);
  }

  function idleLoop() {
    if (state !== 'title') return;
    var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    fogPhase = (fogPhase || 0) + 0.008;
    for (var i = 0; i < fogParticles.length; i++) {
      fogParticles[i].x += fogParticles[i].vx;
      fogParticles[i].y += fogParticles[i].vy;
    }
    if (ctx) {
      drawBackground(isDark);
      drawSkyline(isDark);
      drawLanes(isDark);
    }
    requestAnimationFrame(idleLoop);
  }
  var fogPhase = 0;
  requestAnimationFrame(idleLoop);
})();
</script>
</body>
</html>
