<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harp Mist</title>
<style>
  :root {
    --bg-color: #e0e5ec;
    --text-color: #333;
    --gold: #D4AF37;
    --ui-bg: rgba(255, 255, 255, 0.7);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #1a1c23;
      --text-color: #eee;
      --ui-bg: rgba(20, 22, 30, 0.7);
    }
  }
  body, html {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--bg-color);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    background: var(--ui-bg);
    padding: 3rem;
    pointer-events: auto;
    text-align: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(212, 175, 55, 0.3);
  }
  .screen.active {
    display: flex;
  }
  h1 {
    margin: 0 0 1rem 0;
    color: var(--text-color);
    font-weight: 300;
    letter-spacing: 4px;
    font-size: 2rem;
  }
  p {
    margin: 0 0 2.5rem 0;
    color: var(--text-color);
    font-size: 0.9rem;
    line-height: 1.8;
    opacity: 0.8;
  }
  button {
    background: var(--text-color);
    border: none;
    color: var(--bg-color);
    padding: 1rem 3rem;
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: bold;
  }
  button:active {
    transform: scale(0.95);
  }
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 2rem;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    color: var(--text-color);
    font-size: 1.2rem;
    z-index: 5;
    font-weight: bold;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud" style="display: none;">
    <div id="scoreDisplay">000</div>
    <div id="livesDisplay">///</div>
  </div>
  <div id="ui-layer">
    <div id="startScreen" class="screen active">
      <h1>HARP MIST</h1>
      <p>Swipe or tap sides to switch strings.<br>Catch the golden tones.<br>Don't let them dissolve.</p>
      <button data-smoke="start" id="startBtn">Begin</button>
    </div>
    <div id="gameOverScreen" class="screen">
      <h1>FADED</h1>
      <p id="finalScore">SCORE: 000</p>
      <button data-smoke="restart" id="restartBtn">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const hud = document.getElementById('hud');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const finalScore = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let width, height;
    let state = 'START';
    let lastTime = 0;

    let score = 0;
    let lives = 3;
    let combo = 0;
    let laneCount = 3;
    let playerLane = 1;
    let playerX = 0;
    let targetPlayerX = 0;
    let notes = [];
    let particles = [];
    let mistClouds = [];
    let baseSpeed = 0;
    let spawnTimer = 0;
    let spawnInterval = 0;
    let harmonicSwell = 0;
    let lastSpawnLane = -1;

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          console.warn('Web Audio API not supported');
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(lane, type = 'catch') {
      if (!audioCtx) return;
      
      const now = audioCtx.currentTime;
      const freqs = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      if (type === 'catch') {
        osc.type = 'sine';
        const idx = (lane + combo) % freqs.length;
        osc.frequency.setValueAtTime(freqs[idx], now);
        
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        
        osc.start(now);
        osc.stop(now + 0.8);
      } else if (type === 'miss') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.3);
        
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'swell') {
        [0, 2, 4].forEach(offset => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          
          o.type = 'sine';
          o.frequency.setValueAtTime(freqs[(lane + offset) % freqs.length], now);
          
          g.gain.setValueAtTime(0, now);
          g.gain.linearRampToValueAtTime(0.15, now + 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
          
          o.start(now);
          o.stop(now + 1.5);
        });
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
      
      updatePlayerTarget();
      playerX = targetPlayerX;
      initMist();
    }
    window.addEventListener('resize', resize);

    function getLaneX(lane) {
      const spacing = width / (laneCount + 1);
      return spacing * (lane + 1);
    }

    function updatePlayerTarget() {
      targetPlayerX = getLaneX(playerLane);
    }

    function initMist() {
      mistClouds = [];
      for (let i = 0; i < 12; i++) {
        mistClouds.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 150 + 100,
          vx: (Math.random() - 0.5) * 20,
          vy: (Math.random() - 0.5) * 20,
          alpha: Math.random() * 0.4 + 0.1
        });
      }
    }

    function updateMist(dt) {
      const speedMult = state === 'PLAYING' ? 1 + (baseSpeed / 500) : 1;
      mistClouds.forEach(c => {
        c.x += c.vx * dt * speedMult;
        c.y += c.vy * dt * speedMult;
        if (c.x < -c.r) c.x = width + c.r;
        if (c.x > width + c.r) c.x = -c.r;
        if (c.y < -c.r) c.y = height + c.r;
        if (c.y > height + c.r) c.y = -c.r;
      });
    }

    function startGame() {
      state = 'PLAYING';
      startScreen.classList.remove('active');
      gameOverScreen.classList.remove('active');
      hud.style.display = 'flex';
      
      score = 0;
      lives = 3;
      combo = 0;
      laneCount = 3;
      playerLane = 1;
      notes = [];
      particles = [];
      baseSpeed = height * 0.35;
      spawnInterval = 1.5;
      spawnTimer = 0;
      harmonicSwell = 0;
      lastSpawnLane = -1;
      
      updatePlayerTarget();
      playerX = targetPlayerX;
      updateHUD();
    }

    function gameOver() {
      state = 'GAMEOVER';
      hud.style.display = 'none';
      gameOverScreen.classList.add('active');
      finalScore.textContent = `SCORE: ${score.toString().padStart(3, '0')}`;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }

    startBtn.addEventListener('click', () => { initAudio(); startGame(); });
    restartBtn.addEventListener('click', () => { initAudio(); startGame(); });

    let touchStartX = 0;
    let touchStartY = 0;
    let touchTime = 0;

    window.addEventListener('touchstart', e => {
      if (state !== 'PLAYING') return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchTime = performance.now();
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (state !== 'PLAYING') return;
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', e => {
      if (state !== 'PLAYING') return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;
      const dt = performance.now() - touchTime;
      
      if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
        movePlayer(dx > 0 ? 1 : -1);
      } else if (dt < 300 && Math.abs(dx) < 20 && Math.abs(dy) < 20) {
        movePlayer(touchEndX > width / 2 ? 1 : -1);
      }
    });

    window.addEventListener('keydown', e => {
      if (state !== 'PLAYING') return;
      if (e.key === 'ArrowLeft') movePlayer(-1);
      if (e.key === 'ArrowRight') movePlayer(1);
    });

    function movePlayer(dir) {
      playerLane += dir;
      if (playerLane < 0) playerLane = 0;
      if (playerLane >= laneCount) playerLane = laneCount - 1;
    }

    function spawnNote() {
      let lane;
      do {
        lane = Math.floor(Math.random() * laneCount);
      } while (lane === lastSpawnLane && Math.random() > 0.3);
      
      lastSpawnLane = lane;
      
      notes.push({
        lane: lane,
        y: -20,
        speed: baseSpeed * (0.9 + Math.random() * 0.2),
        missed: false
      });
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 15; i++) {
        const life = 0.3 + Math.random() * 0.3;
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 300,
          vy: (Math.random() - 0.5) * 300,
          life: life,
          maxLife: life,
          color: color
        });
      }
    }

    function updateHUD() {
      scoreDisplay.textContent = score.toString().padStart(3, '0');
      livesDisplay.textContent = '/'.repeat(lives);
    }

    function update(dt) {
      updatePlayerTarget();
      playerX += (targetPlayerX - playerX) * 15 * dt;
      
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnNote();
        spawnTimer = spawnInterval;
      }
      
      baseSpeed += 15 * dt;
      spawnInterval = Math.max(0.4, spawnInterval - 0.015 * dt);
      
      if (score >= 15 && laneCount === 3) {
        laneCount = 4;
        playerLane = Math.min(playerLane, 3);
      } else if (score >= 40 && laneCount === 4) {
        laneCount = 5;
        playerLane = Math.min(playerLane, 4);
      }
      
      if (harmonicSwell > 0) {
        harmonicSwell -= dt;
      }
      
      const playerY = height - 120;
      
      for (let i = notes.length - 1; i >= 0; i--) {
        let n = notes[i];
        n.y += n.speed * dt;
        
        if (!n.missed && Math.abs(n.y - playerY) < 30 && n.lane === playerLane) {
          score++;
          combo++;
          playTone(n.lane, 'catch');
          createParticles(getLaneX(n.lane), playerY, '#D4AF37');
          notes.splice(i, 1);
          
          if (combo > 0 && combo % 3 === 0) {
            harmonicSwell = 1.0;
            playTone(0, 'swell');
            if (navigator.vibrate) navigator.vibrate(50);
          } else {
            if (navigator.vibrate) navigator.vibrate(10);
          }
          
          updateHUD();
          continue;
        }
        
        if (!n.missed && n.y > playerY + 30) {
          n.missed = true;
          lives--;
          combo = 0;
          playTone(n.lane, 'miss');
          createParticles(getLaneX(n.lane), n.y, '#ff4444');
          if (navigator.vibrate) navigator.vibrate(100);
          updateHUD();
          
          if (lives <= 0) {
            gameOver();
            return;
          }
        }
        
        if (n.missed) {
          n.alpha = Math.max(0, 1 - (n.y - (playerY + 30)) / 100);
          if (n.alpha <= 0) {
            notes.splice(i, 1);
          }
        }
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
      
      updateMist(dt);
    }

    function draw() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const t = performance.now() * 0.001;
      
      ctx.fillStyle = isDark ? '#1a1c23' : '#e0e5ec';
      ctx.fillRect(0, 0, width, height);
      
      const mistBase = isDark ? '20, 22, 30' : '255, 255, 255';
      mistClouds.forEach(c => {
        const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
        grad.addColorStop(0, `rgba(${mistBase}, ${c.alpha})`);
        grad.addColorStop(1, `rgba(${mistBase}, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
      });
      
      if (harmonicSwell > 0) {
        const swellAlpha = Math.min(1, harmonicSwell) * 0.15;
        ctx.fillStyle = `rgba(212, 175, 55, ${swellAlpha})`;
        ctx.fillRect(0, 0, width, height);
      }
      
      ctx.strokeStyle = isDark ? 'rgba(212, 175, 55, 0.2)' : 'rgba(212, 175, 55, 0.4)';
      ctx.lineWidth = 2 + harmonicSwell * 2;
      if (harmonicSwell > 0) {
        ctx.strokeStyle = `rgba(212, 175, 55, ${0.4 + harmonicSwell * 0.4})`;
        ctx.shadowColor = '#D4AF37';
        ctx.shadowBlur = 10 * harmonicSwell;
      } else {
        ctx.shadowBlur = 0;
      }
      
      for (let i = 0; i < laneCount; i++) {
        const baseX = getLaneX(i);
        ctx.beginPath();
        for (let y = 0; y <= height; y += 50) {
          const extraSway = harmonicSwell * Math.sin(y * 0.02 + t * 10 + i) * 10;
          const sway = Math.sin(y * 0.01 + t * 2 + i) * 5 + extraSway;
          const x = baseX + sway;
          if (y === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      
      const playerY = height - 120;
      const dx = (targetPlayerX - playerX);
      const playerTilt = dx * 0.015;
      const playerStretch = 1.0 + Math.abs(dx) * 0.002;
      
      ctx.save();
      ctx.translate(playerX, playerY);
      ctx.rotate(playerTilt);
      ctx.scale(playerStretch, 1 / playerStretch);
      
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#D4AF37';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.stroke();
      
      const pulse = 1 + Math.sin(t * 5) * 0.2;
      ctx.fillStyle = isDark ? '#fff' : '#fff';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(0, 0, 8 * pulse, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
      
      notes.forEach(n => {
        ctx.globalAlpha = n.alpha !== undefined ? n.alpha : 1.0;
        const extraSway = harmonicSwell * Math.sin(n.y * 0.02 + t * 10 + n.lane) * 10;
        const sway = Math.sin(n.y * 0.01 + t * 2 + n.lane) * 5 + extraSway;
        const x = getLaneX(n.lane) + sway;
        
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#D4AF37';
        ctx.shadowBlur = 15;
        
        ctx.beginPath();
        ctx.arc(x, n.y, 8, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#D4AF37';
        ctx.beginPath();
        ctx.arc(x, n.y, 4, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, n.y - 8);
        ctx.lineTo(x, n.y - 30);
        ctx.stroke();
      });
      ctx.globalAlpha = 1.0;
      
      ctx.shadowBlur = 0;
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;
      
      ctx.fillStyle = isDark ? 'rgba(20, 22, 30, 0.4)' : 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      for (let i = 0; i <= width; i += 50) {
        const y = height - 80 + Math.sin(i * 0.01 + t) * 40 + Math.cos(i * 0.02 - t * 1.5) * 20;
        if (i === 0) ctx.moveTo(i, height);
        ctx.lineTo(i, y);
      }
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.fill();
    }

    function loop(time) {
      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;
      
      if (state === 'PLAYING') {
        update(dt);
      } else {
        updateMist(dt);
      }
      draw();
      
      requestAnimationFrame(loop);
    }

    resize();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
