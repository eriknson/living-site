<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FLOWSTATE — Route the Agents</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#eef3f9; --panel:rgba(255,255,255,0.86); --panelb:rgba(20,60,100,0.20);
    --fg:#0e2233; --muted:rgba(14,34,51,0.58); --accent:#0a90b4; --danger:#d81e5b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a0f16; --panel:rgba(15,23,33,0.82); --panelb:rgba(120,170,210,0.20);
      --fg:#e7eef6; --muted:rgba(231,238,246,0.60); --accent:#4fe3ff; --danger:#ff5470;
    }
  }
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    min-height:100dvh; overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #game{ position:fixed; inset:0; width:100dvw; height:100dvh; display:block; touch-action:none; z-index:1; }

  #hud{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
    pointer-events:none; opacity:0; transition:opacity .35s ease; letter-spacing:.08em;
  }
  [data-mode="playing"] #hud, [data-mode="gameover"] #hud{ opacity:1; }
  .lab{ font-size:10px; color:var(--muted); letter-spacing:.24em; }
  .val{ font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .hud-c{ text-align:center; flex:1; }
  .flow{ font-size:12px; color:var(--accent); height:15px; letter-spacing:.16em; text-shadow:0 0 12px currentColor; }
  .backlog{ font-size:11px; letter-spacing:.16em; margin-top:4px; color:var(--muted); display:flex; align-items:center; justify-content:center; gap:8px; }
  .bl-bar{ display:inline-flex; gap:3px; }
  .seg{ width:7px; height:12px; border-radius:2px; background:var(--fg); opacity:.24; transition:opacity .15s ease, background .15s ease, box-shadow .15s ease; }
  .seg.on{ opacity:1; background:var(--accent); box-shadow:0 0 7px var(--accent); }
  .bl-bar.warn .seg.on{ background:var(--danger); box-shadow:0 0 9px var(--danger); }
  .hud-r{ display:flex; justify-content:flex-end; }
  #mute{
    pointer-events:auto; width:40px; height:40px; border-radius:11px;
    background:var(--panel); border:1px solid var(--panelb); color:var(--fg);
    font-size:15px; cursor:pointer;
  }

  .overlay{
    position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    padding:24px; pointer-events:none;
  }
  .overlay.hidden{ display:none; }
  .panel{
    pointer-events:auto; width:min(430px,92vw);
    background:var(--panel); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--panelb); border-radius:22px; padding:32px 26px 24px; text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.38);
  }
  .eyebrow{ font-size:11px; letter-spacing:.36em; color:var(--accent); text-transform:uppercase; }
  h1.title{ font-size:clamp(34px,11vw,46px); letter-spacing:.10em; margin:10px 0 2px; font-weight:700; }
  .tag{ color:var(--muted); font-size:13px; line-height:1.65; margin:12px auto 18px; max-width:33ch; }
  .tag b{ color:var(--accent); }
  .legend{ display:flex; justify-content:center; gap:14px; margin:2px 0 20px; flex-wrap:wrap; }
  .chip{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); letter-spacing:.08em; }
  .dot{ width:10px; height:10px; border-radius:50%; box-shadow:0 0 9px currentColor; }
  .btn{
    pointer-events:auto; -webkit-appearance:none; appearance:none; cursor:pointer; font-family:inherit;
    font-size:16px; font-weight:700; letter-spacing:.14em; color:#04121a; background:var(--accent);
    border:none; border-radius:14px; padding:16px 22px; width:100%; min-height:56px;
    box-shadow:0 0 26px color-mix(in srgb, var(--accent) 55%, transparent); transition:transform .08s ease;
  }
  .btn:active{ transform:scale(.97); }
  .hint{ margin-top:14px; font-size:11px; color:var(--muted); letter-spacing:.12em; }
  .reason{ color:var(--danger); font-size:12px; letter-spacing:.30em; text-transform:uppercase; text-shadow:0 0 12px var(--danger); }
  .stats{ display:flex; justify-content:center; gap:26px; margin:16px 0 22px; }
  .stat .lab{ font-size:10px; }
  .stat .num{ font-size:27px; font-weight:700; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-l"><div class="lab">SCORE</div><div class="val" id="score">0</div></div>
    <div class="hud-c"><div class="flow" id="flow"></div><div class="backlog"><span>BACKLOG</span><span class="bl-bar" id="backlog"></span></div></div>
    <div class="hud-r"><button id="mute" aria-label="toggle sound">♪</button></div>
  </div>

  <div class="overlay" id="title">
    <div class="panel">
      <div class="eyebrow">Parallel Deploy</div>
      <h1 class="title">FLOWSTATE</h1>
      <p class="tag">Drag each agent to its matching port and release to launch. Weave the routes so they never collide. Ship several at once for <b>FLOW</b>.</p>
      <div class="legend" id="legend"></div>
      <button class="btn" data-smoke="start" id="startBtn">▶ START ROUTING</button>
      <div class="hint">drag · release to launch · reroute anytime</div>
    </div>
  </div>

  <div class="overlay hidden" id="over">
    <div class="panel">
      <div class="reason" id="over-reason">MERGE CONFLICT</div>
      <h1 class="title" style="font-size:28px;margin-top:12px;">BUILD FAILED</h1>
      <div class="stats">
        <div class="stat"><div class="lab">SCORE</div><div class="num" id="over-score">0</div></div>
        <div class="stat"><div class="lab">BEST</div><div class="num" id="over-best">0</div></div>
        <div class="stat"><div class="lab">DEPLOYS</div><div class="num" id="over-deploys">0</div></div>
      </div>
      <button class="btn" data-smoke="restart" id="restartBtn">↻ REDEPLOY</button>
      <div class="hint">space / enter to redeploy</div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // ---------- helpers ----------
  var TAU = Math.PI*2;
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function approach(cur,target,rate,dt){ return cur+(target-cur)*(1-Math.exp(-rate*dt)); }
  function rand(a,b){ return a+Math.random()*(b-a); }
  function hexA(hex,a){
    hex=(''+hex).replace('#','');
    if(hex.length===3){ hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]; }
    var n=parseInt(hex,16); if(isNaN(n)) return 'rgba(255,255,255,'+a+')';
    var r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  // ---------- palettes (cyan / green / amber / rose on charcoal or blueprint) ----------
  var DARK = {
    bg0:'#0a0f16', bg1:'#0b1119', gridHex:'#7fb0d8', minorA:0.06, majorA:0.13,
    textHex:'#e7eef6', fogHex:'#9fc2e0', fogA:0.05, accentHex:'#4fe3ff', dangerHex:'#ff5470',
    glowA:0.55, nodeFillA:0.09, vignetteHex:'#000000', vignetteA:0.55, light:false,
    types:[{name:'API',core:'#3ee9ff'},{name:'WEB',core:'#46f0a4'},{name:'JOBS',core:'#ffc24b'},{name:'EDGE',core:'#ff6f91'}]
  };
  var LIGHT = {
    bg0:'#eef3f9', bg1:'#e2eaf3', gridHex:'#2c5378', minorA:0.10, majorA:0.20,
    textHex:'#0e2233', fogHex:'#ffffff', fogA:0.34, accentHex:'#0a90b4', dangerHex:'#d81e5b',
    glowA:0.30, nodeFillA:0.12, vignetteHex:'#28425c', vignetteA:0.14, light:true,
    types:[{name:'API',core:'#0891b2'},{name:'WEB',core:'#0f9d58'},{name:'JOBS',core:'#d97706'},{name:'EDGE',core:'#d6376b'}]
  };
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : {matches:false, addEventListener:function(){}};
  function palette(){ return mq.matches ? DARK : LIGHT; }

  // ---------- config ----------
  var CFG = {
    grabPad:22, snapPad:36, minPathLen:26,
    baseSpeed:102, maxSpeed:222, spawnStart:2.3, spawnMin:0.85,
    capacity:6, collideK:0.6, pointMinDist:6, syncWindow:0.62
  };
  var REVEAL_ORDER = [0,3,1,2];

  // ---------- canvas ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext ? canvas.getContext('2d') : null;
  var W=0,H=0,dpr=1, nodeR=26, agentR=13;

  // ---------- state ----------
  var state = {
    mode:'title', t:0, anim:0, spawnTimer:0, timeScale:1, slowmo:0,
    agents:[], nodes:[], spawns:[], walls:[], particles:[], floaters:[],
    score:0, best:0, deploys:0, flowMult:1, lastDeployT:-99, deployTimes:[],
    backlog:0, activeColors:2, shake:0, flash:null, pulse:0, pulseColor:'#fff',
    tutorial:true, wallShift:12, dieT:0, overReason:''
  };

  // ---------- audio ----------
  var AC=null, master=null, muted=false;
  function initAudio(){
    if(AC) return;
    try{
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return;
      AC = new C(); master = AC.createGain(); master.gain.value=0.85; master.connect(AC.destination);
    }catch(e){ AC=null; }
  }
  function blip(freq,dur,type,vol,slideTo,when){
    if(!AC||muted) return;
    try{
      var t=AC.currentTime+(when||0);
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  }
  function noiseBurst(dur,vol){
    if(!AC||muted) return;
    try{
      var t=AC.currentTime, n=Math.floor(AC.sampleRate*dur);
      var buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
      var src=AC.createBufferSource(); src.buffer=buf;
      var g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
      src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+dur+0.02);
    }catch(e){}
  }
  function sfxTick(){ blip(680,0.03,'square',0.04); }
  function sfxLaunch(){ blip(220,0.13,'sawtooth',0.08,520); }
  function sfxDeploy(){ blip(523,0.09,'triangle',0.12,760); blip(880,0.10,'sine',0.06,0,0.02); }
  function sfxSync(n){ var notes=[523,659,784,988,1175]; var k=Math.min(n,5); for(var i=0;i<k;i++){ blip(notes[i],0.13,'triangle',0.10,0,i*0.045); } }
  function sfxFlow(){ var ch=[392,523,659,784,1047]; for(var i=0;i<ch.length;i++){ blip(ch[i],0.5,'triangle',0.08,0,i*0.03); } blip(1568,0.4,'sine',0.05,0,0.05); }
  function sfxCrash(){ blip(150,0.45,'sawtooth',0.22,55); noiseBurst(0.35,0.22); }
  function haptic(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

  // ---------- layout ----------
  function layout(){
    var topBand = clamp(H*0.17, 96, 150);
    nodeR = clamp(Math.min(W,H)*0.06, 20, 30);
    agentR = clamp(nodeR*0.52, 11, 16);
    var sx=[0.16,0.38,0.62,0.84];
    for(var i=0;i<state.nodes.length;i++){ state.nodes[i].x=W*sx[i]; state.nodes[i].y=topBand; }
    var sy = H - clamp(H*0.09, 58, 100);
    var spx=[0.2,0.5,0.8];
    for(var j=0;j<state.spawns.length;j++){ state.spawns[j].x=W*spx[j]; state.spawns[j].y=sy; }
  }
  function handleResize(){
    var oldW=W, oldH=H;
    dpr = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth || document.documentElement.clientWidth;
    H = window.innerHeight || document.documentElement.clientHeight;
    if(!ctx) return;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    if(oldW && oldH && (oldW!==W || oldH!==H)){
      var rx=W/oldW, ry=H/oldH;
      var scale=function(p){ p.x*=rx; p.y*=ry; };
      for(var a=0;a<state.agents.length;a++){
        var ag=state.agents[a]; scale(ag.pos);
        if(ag.path){ for(var p=0;p<ag.path.length;p++) scale(ag.path[p]); }
        for(var tr=0;tr<ag.trail.length;tr++) scale(ag.trail[tr]);
      }
      for(var q=0;q<state.particles.length;q++) scale(state.particles[q]);
      for(var f=0;f<state.floaters.length;f++) scale(state.floaters[f]);
      for(var w=0;w<state.walls.length;w++){ var wl=state.walls[w]; wl.x*=rx; wl.y*=ry; wl.w*=rx; wl.h*=ry; wl.tx*=rx; wl.ty*=ry; }
    }
    layout();
    for(var k=0;k<state.agents.length;k++){
      var m=state.agents[k];
      if(m.path && m.node){ m.path[m.path.length-1]={x:m.node.x, y:m.node.y}; computeSeg(m); }
    }
  }

  // ---------- setup / reset ----------
  function setupOnce(){
    for(var i=0;i<4;i++){ state.nodes.push({idx:i, x:0, y:0, alpha:0, revealed:true, pulse:0}); }
    for(var j=0;j<3;j++){ state.spawns.push({x:0, y:0}); }
  }
  function ensureNodesRevealed(){
    for(var k=0;k<state.activeColors && k<REVEAL_ORDER.length;k++){
      state.nodes[REVEAL_ORDER[k]].revealed = true;
    }
  }
  function resetGame(){
    state.t=0; state.anim=state.anim; state.spawnTimer=0.6;
    state.agents=[]; state.particles=[]; state.floaters=[]; state.walls=[];
    state.score=0; state.deploys=0; state.flowMult=1; state.lastDeployT=-99; state.deployTimes=[];
    state.backlog=0; state.activeColors=2; state.shake=0; state.flash=null; state.pulse=0;
    state.tutorial=true; state.wallShift=12; state.dieT=0; state.overReason='';
    for(var i=0;i<state.nodes.length;i++){ state.nodes[i].revealed=false; state.nodes[i].pulse=0; }
    ensureNodesRevealed();
    layout();
  }

  // ---------- difficulty ----------
  function difficulty(t){
    var speed = lerp(CFG.baseSpeed, CFG.maxSpeed, clamp(t/78,0,1));
    var interval = lerp(CFG.spawnStart, CFG.spawnMin, clamp(t/72,0,1));
    var colors = 2; if(t>13) colors=3; if(t>36) colors=4;
    return { speed:speed, interval:interval, colors:colors };
  }

  // ---------- agents ----------
  function spawnAgent(){
    var revealed=[];
    for(var i=0;i<state.nodes.length;i++){ if(state.nodes[i].revealed) revealed.push(state.nodes[i]); }
    if(!revealed.length) return;
    var node = revealed[(Math.random()*revealed.length)|0];
    var slot = (Math.random()*state.spawns.length)|0;
    var s = state.spawns[slot];
    state.agents.push({
      mode:'wait', slot:slot, colorIdx:node.idx,
      pos:{x:s.x, y:H+30}, dir:-Math.PI/2, trail:[], bobPhase:rand(0,TAU),
      path:null, segLens:null, total:0, dist:0, node:null, wasFly:false, dead:false, born:state.t
    });
  }
  function computeSeg(a){
    var pts=a.path, cl=[0], tot=0;
    for(var i=1;i<pts.length;i++){ tot+=Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); cl.push(tot); }
    a.segLens=cl; a.total=tot;
  }
  function advanceAgent(a){
    if(a.dist>=a.total){ deploy(a); return; }
    var pts=a.path, cl=a.segLens, i=1;
    while(i<cl.length && cl[i]<a.dist) i++;
    if(i>=cl.length){ deploy(a); return; }
    var s0=cl[i-1], sl=(cl[i]-s0)||1, u=(a.dist-s0)/sl;
    a.pos.x = pts[i-1].x + (pts[i].x-pts[i-1].x)*u;
    a.pos.y = pts[i-1].y + (pts[i].y-pts[i-1].y)*u;
    a.dir = Math.atan2(pts[i].y-pts[i-1].y, pts[i].x-pts[i-1].x);
  }
  function launch(a, pts, node){
    pts[pts.length-1] = {x:node.x, y:node.y};
    a.path=pts; a.node=node; a.dist=0; a.mode='fly'; a.wasFly=false; a.trail=[];
    computeSeg(a); sfxLaunch(); haptic(6);
  }

  // ---------- deploy / flow / collision ----------
  function deploy(a){
    a.mode='done'; a.dead=true; state.deploys++;
    var node=state.nodes[a.colorIdx]; node.pulse=1;
    var col=palette().types[a.colorIdx].core;
    burst(node.x, node.y, col, 16);
    var now=state.t; state.deployTimes.push(now);
    state.deployTimes = state.deployTimes.filter(function(x){ return now-x<=CFG.syncWindow; });
    var sc=state.deployTimes.length;
    var gained=Math.round(100*state.flowMult);
    if(sc>=2){
      state.flowMult=Math.min(state.flowMult+1,6);
      gained += 100*(sc-1);
      if(sc>=3){ flowState(col); }
      else { state.pulse=Math.max(state.pulse,0.55); state.pulseColor=col; state.flash={a:0.16, color:hexA(col,1)}; }
      sfxSync(sc); haptic([10,18,10]);
      floater(node.x, node.y-nodeR-8, 'SYNC +'+gained, col, false);
    } else {
      sfxDeploy(); haptic(9);
      floater(node.x, node.y-nodeR-8, '+'+gained, col, false);
    }
    state.score+=gained; state.lastDeployT=now; state.tutorial=false;
  }
  function flowState(col){
    state.pulse=1; state.pulseColor=col; state.slowmo=0.5;
    state.flash={a:0.5, color:hexA(col,1)}; state.shake=Math.max(state.shake,7);
    state.score+=250; floater(W/2, H*0.42, 'FLOW STATE', col, true);
    sfxFlow(); haptic([20,30,20,30,40]);
  }
  function gameOverSeq(reason,x,y){
    if(state.mode!=='playing') return;
    state.overReason=reason; state.mode='dying'; state.dieT=0; state.shake=15;
    state.flash={a:0.6, color:hexA(palette().dangerHex,1)};
    if(x!=null) burst(x,y, palette().dangerHex, 30);
    sfxCrash(); haptic([45,30,60]);
  }
  function collide(a,b){
    var mx=(a.pos.x+b.pos.x)/2, my=(a.pos.y+b.pos.y)/2;
    a.mode='done'; b.mode='done';
    burst(mx,my, palette().types[a.colorIdx].core, 12);
    gameOverSeq('MERGE CONFLICT', mx, my);
  }
  function checkCollisions(){
    var fl=[];
    for(var i=0;i<state.agents.length;i++){ if(state.agents[i].mode==='fly') fl.push(state.agents[i]); }
    var thr=agentR*2*CFG.collideK; thr=thr*thr;
    for(var a=0;a<fl.length;a++){
      for(var b=a+1;b<fl.length;b++){
        var dx=fl[a].pos.x-fl[b].pos.x, dy=fl[a].pos.y-fl[b].pos.y;
        if(dx*dx+dy*dy < thr){ collide(fl[a], fl[b]); return; }
      }
    }
  }

  // ---------- walls ----------
  function newWallSpot(){
    var w=clamp(W*0.32, 110, 240), h=clamp(nodeR*1.2, 26, 40);
    var mx=20, x=mx+Math.random()*Math.max(10,(W-w-2*mx));
    var top=state.nodes[0].y+nodeR+50, bot=state.spawns[0].y-70;
    var y=top+Math.random()*Math.max(20,(bot-top-h));
    return {x:x, y:y, w:w, h:h};
  }
  function addWall(){ var s=newWallSpot(); state.walls.push({x:s.x, y:s.y, w:s.w, h:s.h, tx:s.x, ty:s.y, alpha:0, talpha:1}); }
  function shiftWall(){ if(!state.walls.length) return; var wl=state.walls[(Math.random()*state.walls.length)|0]; var s=newWallSpot(); wl.tx=s.x; wl.ty=s.y; }
  function updateWalls(dt){
    if(state.t>22 && state.walls.length===0) addWall();
    if(state.t>50 && state.walls.length===1) addWall();
    state.wallShift-=dt;
    if(state.wallShift<=0 && state.walls.length){ shiftWall(); state.wallShift=10+Math.random()*6; }
    for(var i=0;i<state.walls.length;i++){
      var w=state.walls[i];
      w.alpha=approach(w.alpha, w.talpha, 3, dt);
      w.x=approach(w.x, w.tx, 3.2, dt); w.y=approach(w.y, w.ty, 3.2, dt);
    }
  }
  function pathHitsWall(pts){
    for(var wi=0;wi<state.walls.length;wi++){
      var w=state.walls[wi]; if(w.alpha<0.6) continue;
      for(var i=0;i<pts.length-1;i++){
        var a=pts[i], b=pts[i+1], seg=Math.hypot(b.x-a.x,b.y-a.y), steps=Math.max(1,Math.ceil(seg/8));
        for(var s=0;s<=steps;s++){
          var u=s/steps, x=a.x+(b.x-a.x)*u, y=a.y+(b.y-a.y)*u;
          if(x>=w.x-2 && x<=w.x+w.w+2 && y>=w.y-2 && y<=w.y+w.h+2) return true;
        }
      }
    }
    return false;
  }

  // ---------- particles / floaters ----------
  function burst(x,y,col,n){
    for(var i=0;i<n;i++){
      var an=Math.random()*TAU, sp=rand(40,240);
      state.particles.push({x:x,y:y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,life:rand(0.5,1),col:col,r:rand(1.5,4)});
    }
    if(state.particles.length>360) state.particles.splice(0, state.particles.length-360);
  }
  function floater(x,y,text,col,big){ state.floaters.push({x:x,y:y,text:text,col:col,life:big?1.4:1.0,vy:big?-14:-30,big:!!big}); }
  function stepParticles(rdt){
    var ps=state.particles;
    for(var i=ps.length-1;i>=0;i--){
      var p=ps[i]; p.life-=rdt*1.5;
      if(p.life<=0){ ps.splice(i,1); continue; }
      p.x+=p.vx*rdt; p.y+=p.vy*rdt; p.vx*=(1-2.2*rdt); p.vy*=(1-2.2*rdt);
    }
  }

  // ---------- effects ----------
  function stepEffects(rdt){
    state.anim+=rdt;
    state.shake=approach(state.shake,0,9,rdt); if(state.shake<0.3) state.shake=0;
    if(state.flash){ state.flash.a-=rdt*1.7; if(state.flash.a<=0) state.flash=null; }
    state.pulse=Math.max(0, state.pulse-rdt*1.15);
    for(var i=0;i<state.nodes.length;i++){
      var n=state.nodes[i];
      n.alpha=approach(n.alpha, n.revealed?1:0, 5, rdt);
      n.pulse=Math.max(0, n.pulse-rdt*1.9);
    }
    for(var f=state.floaters.length-1;f>=0;f--){
      var fl=state.floaters[f]; fl.life-=rdt*(fl.big?0.7:1.05);
      if(fl.life<=0){ state.floaters.splice(f,1); continue; }
      fl.y+=fl.vy*rdt; fl.vy*=(1-1.6*rdt);
    }
  }

  // ---------- game update ----------
  function updateGame(dt, rdt){
    state.t+=dt;
    var d=difficulty(state.t);
    state.activeColors=d.colors; ensureNodesRevealed();

    state.spawnTimer-=dt;
    if(state.spawnTimer<=0){ spawnAgent(); state.spawnTimer=d.interval*rand(0.8,1.2); }

    updateWalls(dt);

    // queue layout for waiting agents
    var bySlot=[[],[],[]];
    for(var i=0;i<state.agents.length;i++){ var a=state.agents[i]; if(a.mode==='wait') bySlot[a.slot].push(a); }
    for(var s=0;s<bySlot.length;s++){
      var arr=bySlot[s], sp=state.spawns[s];
      for(var k=0;k<arr.length;k++){
        var ag=arr[k], tx=sp.x, ty=sp.y - k*(agentR*2.4);
        ag.pos.x=approach(ag.pos.x, tx, 12, rdt);
        ag.pos.y=approach(ag.pos.y, ty + Math.sin(state.anim*2+ag.bobPhase)*3, 12, rdt);
      }
    }

    // flying
    for(var m=0;m<state.agents.length;m++){
      var fa=state.agents[m];
      if(fa.mode==='fly'){
        fa.dist += d.speed*dt; advanceAgent(fa);
        if(fa.mode==='fly'){ fa.trail.push({x:fa.pos.x,y:fa.pos.y}); if(fa.trail.length>12) fa.trail.shift(); }
      }
    }

    checkCollisions();
    if(state.mode!=='playing') return;

    // backlog
    var waiting=0, worst=0, worstSlot=0;
    for(var b=0;b<bySlot.length;b++){ waiting+=bySlot[b].length; if(bySlot[b].length>worst){ worst=bySlot[b].length; worstSlot=b; } }
    state.backlog=waiting;
    if(waiting>CFG.capacity){ var sp2=state.spawns[worstSlot]; gameOverSeq('BACKLOG OVERFLOW', sp2.x, sp2.y); return; }

    if(state.t-state.lastDeployT>2.6) state.flowMult=1;

    // cleanup
    var alive=[];
    for(var c=0;c<state.agents.length;c++){ if(!state.agents[c].dead) alive.push(state.agents[c]); }
    state.agents=alive;
  }

  // ---------- input ----------
  var active=null;
  function toWorld(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  function grabAgent(p){
    var best=null, bd=1e9, lim=agentR+CFG.grabPad;
    for(var i=0;i<state.agents.length;i++){
      var a=state.agents[i]; if(a.mode!=='wait' && a.mode!=='fly') continue;
      var d=Math.hypot(p.x-a.pos.x, p.y-a.pos.y);
      if(d<lim && d<bd){ bd=d; best=a; }
    }
    return best;
  }
  function evalPath(pts, agent){
    var len=0; for(var i=1;i<pts.length;i++){ len+=Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); }
    var last=pts[pts.length-1], hover=null, hd=1e9;
    for(var n=0;n<state.nodes.length;n++){
      var nd=state.nodes[n]; if(!nd.revealed) continue;
      var d=Math.hypot(last.x-nd.x, last.y-nd.y); if(d<hd){ hd=d; hover=nd; }
    }
    var valid = !!(hover && hd<=CFG.snapPad+nodeR && len>=CFG.minPathLen && hover.idx===agent.colorIdx && !pathHitsWall(pts));
    return { hover:hover, valid:valid };
  }
  function onDown(e){
    if(state.mode!=='playing') return;
    e.preventDefault();
    if(active) return;
    var p=toWorld(e), a=grabAgent(p);
    if(!a) return;
    a.wasFly=(a.mode==='fly'); a.mode='draw';
    active={ agent:a, id:e.pointerId, points:[{x:a.pos.x,y:a.pos.y}], hoverNode:null, validNode:null, valid:false };
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    sfxTick();
  }
  function onMove(e){
    if(!active || e.pointerId!==active.id) return;
    e.preventDefault();
    var p=toWorld(e), pts=active.points, last=pts[pts.length-1];
    if(Math.hypot(p.x-last.x, p.y-last.y)>=CFG.pointMinDist){
      pts.push({x:p.x,y:p.y}); if(pts.length>260) pts.shift();
      var r=evalPath(pts, active.agent);
      active.hoverNode=r.hover; active.valid=r.valid; active.validNode=r.valid?r.hover:null;
    }
  }
  function onUp(e){
    if(!active || (e.pointerId!=null && e.pointerId!==active.id)) return;
    if(e.preventDefault) e.preventDefault();
    var a=active.agent, r=evalPath(active.points, a);
    if(r.valid){ launch(a, active.points.slice(), r.hover); }
    else {
      if(a.wasFly){ a.mode='fly'; } else { a.mode='wait'; }
      a.wasFly=false;
      if(r.hover && r.hover.idx!==a.colorIdx){ r.hover.pulse=0.7; }
    }
    try{ canvas.releasePointerCapture(active.id); }catch(_){}
    active=null;
  }

  // ---------- drawing ----------
  function pathTo(pts){ ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); }
  function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function glowDot(x,y,r,col,a){
    var g=ctx.createRadialGradient(x,y,0,x,y,r*2.6);
    g.addColorStop(0,hexA(col,a)); g.addColorStop(0.5,hexA(col,a*0.5)); g.addColorStop(1,hexA(col,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*2.6,0,TAU); ctx.fill();
  }
  function glowRing(x,y,r,col,a){
    var g=ctx.createRadialGradient(x,y,r*0.2,x,y,r*2.2);
    g.addColorStop(0,hexA(col,a)); g.addColorStop(1,hexA(col,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*2.2,0,TAU); ctx.fill();
  }

  function drawBg(P){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,P.bg0); g.addColorStop(1,P.bg1);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  function drawFog(P){
    var blobs=[[0.2,0.28,1.0],[0.82,0.5,1.3],[0.5,0.82,1.1]];
    for(var i=0;i<blobs.length;i++){
      var b=blobs[i];
      var x=W*(b[0]+Math.sin(state.anim*0.15+i*2)*0.06);
      var y=H*(b[1]+Math.cos(state.anim*0.12+i*1.3)*0.05);
      var r=Math.min(W,H)*0.5*b[2];
      var g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,hexA(P.fogHex,P.fogA)); g.addColorStop(1,hexA(P.fogHex,0));
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
  }
  function drawGrid(P){
    var cell=clamp(Math.min(W,H)/9, 34, 64);
    ctx.lineWidth=1; ctx.strokeStyle=hexA(P.gridHex,P.minorA); ctx.beginPath();
    for(var x=0;x<=W;x+=cell){ ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,H); }
    for(var y=0;y<=H;y+=cell){ ctx.moveTo(0,y+0.5); ctx.lineTo(W,y+0.5); }
    ctx.stroke();
    ctx.strokeStyle=hexA(P.gridHex,P.majorA); ctx.beginPath();
    for(var x2=0;x2<=W;x2+=cell*4){ ctx.moveTo(x2+0.5,0); ctx.lineTo(x2+0.5,H); }
    for(var y2=0;y2<=H;y2+=cell*4){ ctx.moveTo(0,y2+0.5); ctx.lineTo(W,y2+0.5); }
    ctx.stroke();
  }
  function drawWalls(P){
    for(var i=0;i<state.walls.length;i++){
      var w=state.walls[i]; if(w.alpha<0.02) continue;
      ctx.save(); ctx.globalAlpha=w.alpha; var col=P.accentHex;
      roundRect(w.x,w.y,w.w,w.h,10);
      ctx.fillStyle=hexA(P.textHex,0.05); ctx.fill();
      ctx.strokeStyle=hexA(col,0.5); ctx.lineWidth=2; ctx.stroke();
      ctx.save(); ctx.clip();
      ctx.strokeStyle=hexA(col,0.14); ctx.lineWidth=1;
      for(var x=w.x-w.h; x<w.x+w.w; x+=10){ ctx.beginPath(); ctx.moveTo(x,w.y+w.h); ctx.lineTo(x+w.h,w.y); ctx.stroke(); }
      ctx.restore();
      ctx.fillStyle=hexA(P.textHex,0.5); ctx.font='10px ui-monospace,Menlo,monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('MODULE', w.x+w.w/2, w.y+w.h/2);
      ctx.restore();
    }
  }
  function drawPaths(P){
    for(var i=0;i<state.agents.length;i++){
      var a=state.agents[i];
      if(a.mode==='fly' && a.path && a.path.length>1){
        var col=P.types[a.colorIdx].core;
        ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.strokeStyle=hexA(col,0.12); ctx.lineWidth=2.5; pathTo(a.path); ctx.stroke();
        ctx.strokeStyle=hexA(col,0.5); ctx.lineWidth=2.5; ctx.setLineDash([2,10]); ctx.lineDashOffset=-state.anim*46;
        pathTo(a.path); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      }
    }
  }
  function drawNodes(P){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var i=0;i<state.nodes.length;i++){
      var n=state.nodes[i]; if(n.alpha<0.01) continue;
      var t=P.types[n.idx], col=t.core;
      ctx.globalAlpha=n.alpha;
      glowRing(n.x,n.y,nodeR,col,P.glowA*0.8);
      if(n.pulse>0){
        ctx.globalAlpha=n.alpha*n.pulse; ctx.strokeStyle=col; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(n.x,n.y, nodeR+(1-n.pulse)*42, 0, TAU); ctx.stroke();
        ctx.globalAlpha=n.alpha;
      }
      var hi = active && active.validNode===n;
      var wrong = active && active.hoverNode===n && !active.valid;
      ctx.lineWidth=hi?4:2.5;
      ctx.strokeStyle = hi?col:(wrong?P.dangerHex:hexA(col,0.9));
      ctx.beginPath(); ctx.arc(n.x,n.y,nodeR,0,TAU); ctx.stroke();
      ctx.fillStyle=hexA(col, P.nodeFillA+(hi?0.14:0)); ctx.beginPath(); ctx.arc(n.x,n.y,nodeR-3,0,TAU); ctx.fill();
      ctx.fillStyle=hexA(col,0.55); ctx.beginPath(); ctx.arc(n.x,n.y,3.5,0,TAU); ctx.fill();
      ctx.fillStyle=hexA(P.textHex,0.78); ctx.font='600 '+Math.round(nodeR*0.42)+'px ui-monospace,Menlo,monospace';
      ctx.fillText(t.name, n.x, n.y+nodeR+13);
      ctx.globalAlpha=1;
    }
  }
  function drawSpawns(P){
    ctx.save(); ctx.strokeStyle=hexA(P.textHex,0.16); ctx.lineWidth=1.5; ctx.setLineDash([2,4]);
    for(var i=0;i<state.spawns.length;i++){ var s=state.spawns[i]; ctx.beginPath(); ctx.arc(s.x,s.y,12,0,TAU); ctx.stroke(); }
    ctx.setLineDash([]); ctx.restore();
  }
  function drawAgents(P){
    for(var i=0;i<state.agents.length;i++){
      var a=state.agents[i], col=P.types[a.colorIdx].core;
      if(a.mode==='fly' && a.trail.length>1){
        ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.strokeStyle=hexA(col,0.16); ctx.lineWidth=agentR*0.7; pathTo(a.trail); ctx.stroke(); ctx.restore();
      }
      glowDot(a.pos.x,a.pos.y,agentR,col,P.glowA);
      if(a.mode==='wait'){
        var pr=(Math.sin(state.anim*3.2+a.bobPhase)+1)/2;
        ctx.strokeStyle=hexA(col,0.32+0.32*pr); ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(a.pos.x,a.pos.y, agentR+5+pr*4, 0, TAU); ctx.stroke();
      }
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(a.pos.x,a.pos.y,agentR,0,TAU); ctx.fill();
      if(a.mode==='fly'){
        ctx.save(); ctx.translate(a.pos.x,a.pos.y); ctx.rotate(a.dir||0);
        ctx.fillStyle=hexA('#ffffff',0.92); ctx.beginPath();
        ctx.moveTo(agentR*0.55,0); ctx.lineTo(-agentR*0.2,agentR*0.42); ctx.lineTo(-agentR*0.2,-agentR*0.42); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle=hexA('#ffffff',0.85); ctx.beginPath(); ctx.arc(a.pos.x,a.pos.y,agentR*0.32,0,TAU); ctx.fill();
      }
    }
  }
  function drawTutorial(P){
    if(!state.tutorial) return;
    var g=null;
    for(var i=0;i<state.agents.length;i++){ if(state.agents[i].mode==='wait'){ g=state.agents[i]; break; } }
    if(!g) return;
    var n=state.nodes[g.colorIdx], col=P.types[g.colorIdx].core;
    ctx.save(); ctx.setLineDash([2,8]); ctx.lineDashOffset=-state.anim*40;
    ctx.strokeStyle=hexA(col,0.5); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(g.pos.x,g.pos.y);
    ctx.quadraticCurveTo((g.pos.x+n.x)/2+30, (g.pos.y+n.y)/2, n.x, n.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=hexA(P.textHex,0.72); ctx.font='12px ui-monospace,Menlo,monospace'; ctx.textAlign='center';
    ctx.fillText('drag me to '+P.types[g.colorIdx].name, g.pos.x, g.pos.y+agentR+22);
    ctx.restore();
  }
  function drawDrawing(P){
    if(!active) return;
    var a=active.agent, pts=active.points; if(pts.length<1) return;
    var col=P.types[a.colorIdx].core, good=active.valid, c=good?col:P.dangerHex;
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle=hexA(c,0.22); ctx.lineWidth=9; pathTo(pts); ctx.stroke();
    ctx.strokeStyle=c; ctx.lineWidth=3; ctx.setLineDash([2,9]); ctx.lineDashOffset=-state.anim*50; pathTo(pts); ctx.stroke();
    ctx.setLineDash([]);
    var e=pts[pts.length-1]; ctx.fillStyle=hexA(c,0.9); ctx.beginPath(); ctx.arc(e.x,e.y,5,0,TAU); ctx.fill();
    ctx.restore();
  }
  function drawParticles(P){
    if(!P.light) ctx.globalCompositeOperation='lighter';
    for(var i=0;i<state.particles.length;i++){
      var p=state.particles[i]; ctx.globalAlpha=clamp(p.life,0,1);
      ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
  function drawFloaters(P){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var i=0;i<state.floaters.length;i++){
      var f=state.floaters[i]; ctx.globalAlpha=clamp(f.life,0,1); ctx.fillStyle=f.col;
      ctx.font=(f.big?'700 ':'600 ')+(f.big?26:15)+'px ui-monospace,Menlo,monospace';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha=1;
  }
  function drawPulse(P){
    if(state.pulse<=0.01) return;
    var p=state.pulse, r=(1-p)*Math.max(W,H)*0.9;
    ctx.globalAlpha=p*0.5; ctx.strokeStyle=state.pulseColor; ctx.lineWidth=6*p+1;
    ctx.beginPath(); ctx.arc(W/2,H/2,r,0,TAU); ctx.stroke(); ctx.globalAlpha=1;
  }
  function drawFlash(){
    if(!state.flash) return;
    ctx.globalAlpha=clamp(state.flash.a,0,1); ctx.fillStyle=state.flash.color; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  function drawVignette(P){
    var g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.78);
    g.addColorStop(0,hexA(P.vignetteHex,0)); g.addColorStop(1,hexA(P.vignetteHex,P.vignetteA));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  // ---------- title demo ----------
  var demoOrbs=[{n:0,sx:0.28},{n:3,sx:0.72},{n:1,sx:0.5}];
  function drawTitleDemo(P){
    var y0=H*0.9;
    for(var i=0;i<demoOrbs.length;i++){
      var o=demoOrbs[i], node=state.nodes[o.n], col=P.types[o.n].core;
      var p=(state.anim*0.16 + i*0.34) % 1;
      var p0={x:W*o.sx, y:y0}, p1={x:node.x, y:node.y};
      var cx=(p0.x+p1.x)/2 + Math.sin(i*2)*W*0.12, cy=(p0.y+p1.y)/2;
      var samp=[];
      for(var s=0;s<=20;s++){
        var u=s/20, iv=1-u;
        samp.push({x:iv*iv*p0.x+2*iv*u*cx+u*u*p1.x, y:iv*iv*p0.y+2*iv*u*cy+u*u*p1.y});
      }
      ctx.save(); ctx.lineCap='round';
      ctx.strokeStyle=hexA(col,0.18); ctx.lineWidth=2; ctx.setLineDash([2,9]); ctx.lineDashOffset=-state.anim*30;
      pathTo(samp); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      var iv2=1-p, pos={x:iv2*iv2*p0.x+2*iv2*p*cx+p*p*p1.x, y:iv2*iv2*p0.y+2*iv2*p*cy+p*p*p1.y};
      glowDot(pos.x,pos.y,agentR,col,P.glowA);
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(pos.x,pos.y,agentR,0,TAU); ctx.fill();
    }
  }

  // ---------- render ----------
  function render(){
    if(!ctx) return;
    var P=palette();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    var sx=0, sy=0;
    if(state.shake>0.3){ sx=rand(-1,1)*state.shake; sy=rand(-1,1)*state.shake; }
    ctx.save(); ctx.translate(sx,sy);
    drawBg(P); drawFog(P); drawGrid(P); drawWalls(P);
    if(state.mode==='title'){ drawTitleDemo(P); drawNodes(P); }
    else { drawPaths(P); drawNodes(P); drawSpawns(P); drawAgents(P); drawTutorial(P); drawDrawing(P); }
    drawParticles(P); drawFloaters(P); drawPulse(P);
    ctx.restore();
    drawFlash(); drawVignette(P);
    updateHud();
  }

  // ---------- HUD / overlays ----------
  var scoreEl=document.getElementById('score');
  var flowEl=document.getElementById('flow');
  var backlogEl=document.getElementById('backlog');
  var legendEl=document.getElementById('legend');
  var titleEl=document.getElementById('title');
  var overEl=document.getElementById('over');
  var backlogSegs=[];
  function buildBacklog(){
    backlogEl.innerHTML='';
    backlogSegs=[];
    for(var i=0;i<CFG.capacity;i++){ var s=document.createElement('span'); s.className='seg'; backlogEl.appendChild(s); backlogSegs.push(s); }
  }
  function updateHud(){
    scoreEl.textContent=Math.floor(state.score);
    flowEl.textContent = state.flowMult>1 ? ('FLOW ×'+state.flowMult) : '';
    var b=Math.min(state.backlog, CFG.capacity);
    for(var i=0;i<backlogSegs.length;i++){
      if(i<b) backlogSegs[i].classList.add('on'); else backlogSegs[i].classList.remove('on');
    }
    if(state.backlog>=CFG.capacity-1) backlogEl.classList.add('warn'); else backlogEl.classList.remove('warn');
  }
  function buildLegend(){
    var P=palette(); legendEl.innerHTML='';
    for(var i=0;i<P.types.length;i++){
      var t=P.types[i];
      var chip=document.createElement('div'); chip.className='chip';
      var dot=document.createElement('span'); dot.className='dot'; dot.style.background=t.core; dot.style.color=t.core;
      var lab=document.createElement('span'); lab.textContent=t.name;
      chip.appendChild(dot); chip.appendChild(lab); legendEl.appendChild(chip);
    }
  }
  function showOver(){
    document.getElementById('over-reason').textContent=state.overReason;
    document.getElementById('over-score').textContent=Math.floor(state.score);
    document.getElementById('over-best').textContent=Math.floor(state.best);
    document.getElementById('over-deploys').textContent=state.deploys;
    overEl.classList.remove('hidden');
  }
  function finishGameOver(){
    state.mode='gameover';
    if(state.score>state.best) state.best=state.score;
    showOver();
  }
  function start(){
    initAudio(); try{ if(AC && AC.resume) AC.resume(); }catch(e){}
    resetGame(); active=null; state.mode='playing';
    titleEl.classList.add('hidden'); overEl.classList.add('hidden');
  }

  // ---------- main loop ----------
  var last=0;
  function frame(now){
    var rdt=(now-last)/1000; last=now;
    if(!(rdt>=0)) rdt=0; if(rdt>0.05) rdt=0.05;
    var target=1;
    if(state.mode==='dying') target=0.06;
    else if(state.slowmo>0){ target=0.4; state.slowmo-=rdt; }
    state.timeScale=approach(state.timeScale,target,10,rdt);
    var dt=rdt*state.timeScale;

    stepEffects(rdt);
    if(state.mode==='playing') updateGame(dt,rdt);
    stepParticles(rdt);
    if(state.mode==='dying'){ state.dieT+=rdt; if(state.dieT>0.7) finishGameOver(); }

    render();
    document.body.dataset.mode = (state.mode==='dying'?'playing':state.mode);
    requestAnimationFrame(frame);
  }

  // ---------- wire up ----------
  function init(){
    setupOnce();
    handleResize();
    buildLegend();
    buildBacklog();
    document.body.dataset.mode='title';

    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', function(){ setTimeout(handleResize,120); });
    if(mq.addEventListener) mq.addEventListener('change', function(){ buildLegend(); });
    else if(mq.addListener) mq.addListener(function(){ buildLegend(); });

    if(ctx){
      canvas.addEventListener('pointerdown', onDown, {passive:false});
      canvas.addEventListener('pointermove', onMove, {passive:false});
      window.addEventListener('pointerup', onUp, {passive:false});
      window.addEventListener('pointercancel', onUp, {passive:false});
      canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    }

    var startBtn=document.getElementById('startBtn');
    var restartBtn=document.getElementById('restartBtn');
    if(startBtn) startBtn.addEventListener('click', start);
    if(restartBtn) restartBtn.addEventListener('click', start);

    var muteBtn=document.getElementById('mute');
    if(muteBtn) muteBtn.addEventListener('click', function(){
      muted=!muted; muteBtn.textContent=muted?'✕':'♪'; if(!muted) initAudio();
    });

    window.addEventListener('keydown', function(e){
      if(e.key===' ' || e.key==='Enter'){
        if(state.mode==='title' || state.mode==='gameover'){ e.preventDefault(); start(); }
      } else if(e.key==='m' || e.key==='M'){ if(muteBtn) muteBtn.click(); }
    });

    last=performance.now();
    requestAnimationFrame(frame);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
