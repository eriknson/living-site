<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawn Drift</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  background:var(--bg);color:var(--fg);
  --bg:#e8e4dc;--fg:#2a2824;--panel:rgba(255,252,246,.92);--border:rgba(42,40,36,.12);--accent:#c47a2c;--muted:#6b6560;
}
@media(prefers-color-scheme:dark){
  body{--bg:#1a1917;--fg:#e8e2d8;--panel:rgba(26,25,23,.94);--border:rgba(232,226,216,.1);--accent:#e8a84a;--muted:#9a948c}
}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;display:block;touch-action:none}
#hud{
  position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;
}
#hud .stat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.4}
#hud .val{font-size:20px;color:var(--fg);font-variant-numeric:tabular-nums}
#warmth-bar{
  position:absolute;top:max(52px,calc(env(safe-area-inset-top) + 40px));left:16px;right:16px;height:3px;
  background:var(--border);border-radius:2px;overflow:hidden;pointer-events:none;z-index:2;
}
#warmth-fill{height:100%;width:0%;background:linear-gradient(90deg,#8a7a68,#d4a040);transition:width .35s ease;border-radius:2px}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;pointer-events:none;z-index:10;
}
.overlay.hidden{display:none}
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:28px 24px 24px;max-width:340px;width:min(92vw,340px);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 12px 40px rgba(0,0,0,.12);
}
@media(prefers-color-scheme:dark){.panel{box-shadow:0 12px 40px rgba(0,0,0,.45)}}
.panel h1{font-size:22px;font-weight:600;letter-spacing:.04em;margin-bottom:6px;color:var(--fg)}
.panel .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.panel p{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:20px}
.btn{
  pointer-events:auto;min-height:48px;min-width:160px;padding:14px 28px;
  border:none;border-radius:12px;font:inherit;font-size:14px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  background:var(--accent);color:#1a1510;transition:transform .12s ease,opacity .12s;
}
@media(prefers-color-scheme:dark){.btn{color:#1a1510}}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#score-final{font-size:32px;color:var(--accent);margin:8px 0 4px;font-variant-numeric:tabular-nums}
#hint{
  position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);opacity:.7;pointer-events:none;z-index:2;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="stat">Dawn<span class="val" id="score">0</span></div>
    <div class="stat" style="text-align:right">Combo<span class="val" id="combo">×1</span></div>
  </div>
  <div id="warmth-bar"><div id="warmth-fill"></div></div>
  <div id="hint">Swipe ← → to change lanes</div>
  <div class="overlay" id="title-screen">
    <div class="panel">
      <h1>Dawn Drift</h1>
      <div class="tag">Midsummer fog · San Francisco Bay</div>
      <p>Steer your sailboat through rolling fog banks. Snatch golden sunrise tokens before the grey swallows the bay.</p>
      <button class="btn" data-smoke="start" id="btn-start">Cast Off</button>
    </div>
  </div>
  <div class="overlay hidden" id="gameover-screen">
    <div class="panel">
      <h1>Fog Claims the Bay</h1>
      <div class="tag">Voyage ended</div>
      <div id="score-final">0</div>
      <p id="go-msg">The grey rolled back in.</p>
      <button class="btn" data-smoke="restart" id="btn-restart">Sail Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('score');
var comboEl = document.getElementById('combo');
var warmthFill = document.getElementById('warmth-fill');
var titleScreen = document.getElementById('title-screen');
var gameoverScreen = document.getElementById('gameover-screen');
var scoreFinal = document.getElementById('score-final');
var goMsg = document.getElementById('go-msg');
var hint = document.getElementById('hint');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 360, H = 640, dpr = 1;
var state = 'title';
var score = 0, combo = 1, maxCombo = 1, warmth = 0, lives = 3;
var lane = 1, targetLane = 1, laneCount = 3, laneMargin = 0.08;
var boatY = 0, scrollSpd = 0, elapsed = 0, wind = 0, windTarget = 0, fogDensity = 0.55;
var entities = [], particles = [], waves = [];
var shakeT = 0, flashT = 0, hitPause = 0;
var audioCtx = null, lastSpawn = 0;
var touchStartX = 0, touchStartY = 0, touchActive = false;
var rafId = 0, dark = false;

function safe(fn, fb){ try { return fn(); } catch(e){ return fb; } }

function initAudio(){
  if(audioCtx) return;
  safe(function(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }, null);
}

function playTone(freq, dur, vol, type){
  if(!audioCtx) return;
  safe(function(){
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }, null);
}

function vibrate(ms){
  if(navigator.vibrate) safe(function(){ navigator.vibrate(ms); }, null);
}

function resize(){
  if(!canvas) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  var rect = canvas.getBoundingClientRect();
  W = Math.max(rect.width || 360, 1);
  H = Math.max(rect.height || 640, 1);
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  boatY = H * 0.78;
}

function laneX(l){
  var margin = W * (laneMargin + fogDensity * 0.04);
  var usable = W - margin * 2;
  var gap = usable / (laneCount - 1);
  return margin + l * gap;
}

function resetGame(){
  score = 0; combo = 1; maxCombo = 1; warmth = 0; lives = 3;
  lane = 1; targetLane = 1; laneCount = 3; laneMargin = 0.08;
  scrollSpd = 90; elapsed = 0; wind = 0; windTarget = 0; fogDensity = 0.55;
  entities = []; particles = []; lastSpawn = 0; shakeT = 0; flashT = 0; hitPause = 0;
  if(scoreEl) scoreEl.textContent = '0';
  if(comboEl) comboEl.textContent = '×1';
  if(warmthFill) warmthFill.style.width = '0%';
  initWaves();
}

function initWaves(){
  waves = [];
  for(var i = 0; i < 8; i++){
    waves.push({ y: Math.random(), phase: Math.random() * 6.28, amp: 4 + Math.random() * 6 });
  }
}

function startGame(){
  resetGame();
  state = 'playing';
  if(titleScreen) titleScreen.classList.add('hidden');
  if(gameoverScreen) gameoverScreen.classList.add('hidden');
  if(hint) hint.style.opacity = '0.7';
  initAudio();
  playTone(220, 0.15, 0.06, 'triangle');
}

function endGame(){
  state = 'gameover';
  if(gameoverScreen) gameoverScreen.classList.remove('hidden');
  if(scoreFinal) scoreFinal.textContent = String(score);
  if(goMsg){
    var msgs = [
      'You restored ' + Math.round(warmth * 100) + '% of the dawn.',
      'Best combo: ×' + maxCombo + '. The bay remembers.',
      warmth > 0.7 ? 'Golden hour briefly returned.' : 'The fog waits for another sailor.'
    ];
    goMsg.textContent = msgs[Math.min(2, Math.floor(warmth * 3))];
  }
  if(hint) hint.style.opacity = '0';
  playTone(110, 0.4, 0.07, 'sawtooth');
}

function spawnEntity(){
  var roll = Math.random();
  var type = roll < 0.42 ? 'token' : roll < 0.78 ? 'fog' : 'rock';
  var l = Math.floor(Math.random() * laneCount);
  var spd = scrollSpd * (0.85 + Math.random() * 0.3);
  entities.push({
    type: type, lane: l, y: -40,
    w: type === 'fog' ? 56 + Math.random() * 24 : type === 'rock' ? 28 : 22,
    h: type === 'fog' ? 36 + Math.random() * 20 : type === 'rock' ? 24 : 22,
    spd: spd, rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 2,
    collected: false
  });
}

function burst(x, y, col, n){
  for(var i = 0; i < (n || 12); i++){
    var a = Math.random() * 6.28, s = 40 + Math.random() * 120;
    particles.push({
      x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30,
      life: 0.4 + Math.random() * 0.4, col: col, r: 2 + Math.random() * 3
    });
  }
}

function collectToken(e){
  if(e.collected) return;
  e.collected = true;
  score += 10 * combo;
  combo = Math.min(combo + 1, 12);
  if(combo > maxCombo) maxCombo = combo;
  warmth = Math.min(1, warmth + 0.08);
  fogDensity = Math.max(0.25, fogDensity - 0.018);
  flashT = 0.12;
  if(scoreEl) scoreEl.textContent = String(score);
  if(comboEl) comboEl.textContent = '×' + combo;
  if(warmthFill) warmthFill.style.width = Math.round(warmth * 100) + '%';
  burst(laneX(e.lane), e.y, '#e8b040', 16);
  playTone(440 + combo * 20, 0.08, 0.07, 'sine');
  vibrate(12);
}

function takeHit(){
  lives--;
  combo = 1;
  if(comboEl) comboEl.textContent = '×1';
  warmth = Math.max(0, warmth - 0.06);
  fogDensity = Math.min(0.85, fogDensity + 0.04);
  if(warmthFill) warmthFill.style.width = Math.round(warmth * 100) + '%';
  shakeT = 0.25; hitPause = 0.08;
  playTone(90, 0.2, 0.09, 'square');
  vibrate(40);
  if(lives <= 0) endGame();
}

function switchLane(dir){
  if(state !== 'playing') return;
  var next = targetLane + dir;
  if(next >= 0 && next < laneCount){
    targetLane = next;
    playTone(180, 0.05, 0.03, 'triangle');
  }
}

function handleSwipe(dx, dy){
  if(Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if(Math.abs(dx) > Math.abs(dy)){
    switchLane(dx > 0 ? 1 : -1);
  }
}

function onPointerDown(e){
  if(e.target && e.target.closest && e.target.closest('button')) return;
  touchStartX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  touchStartY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  touchActive = true;
  if(e.preventDefault) e.preventDefault();
}

function onPointerUp(e){
  if(!touchActive) return;
  touchActive = false;
  var cx = e.clientX || (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : touchStartX);
  var cy = e.clientY || (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : touchStartY);
  handleSwipe(cx - touchStartX, cy - touchStartY);
  if(e.preventDefault) e.preventDefault();
}

function onKey(e){
  if(!e || !e.key) return;
  var k = e.key.toLowerCase();
  if(k === 'arrowleft' || k === 'a') switchLane(-1);
  if(k === 'arrowright' || k === 'd') switchLane(1);
}

function lerp(a, b, t){ return a + (b - a) * t; }

function lerpColor(t){
  var r = Math.round(lerp(140, 255, t));
  var g = Math.round(lerp(145, 210, t));
  var b = Math.round(lerp(155, 120, t));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function lerpSky(t){
  var top = dark
    ? 'rgb(' + Math.round(lerp(30, 60, t)) + ',' + Math.round(lerp(32, 45, t)) + ',' + Math.round(lerp(38, 35, t)) + ')'
    : 'rgb(' + Math.round(lerp(170, 255, t)) + ',' + Math.round(lerp(175, 220, t)) + ',' + Math.round(lerp(185, 160, t)) + ')';
  var bot = dark
    ? 'rgb(' + Math.round(lerp(22, 45, t)) + ',' + Math.round(lerp(24, 38, t)) + ',' + Math.round(lerp(30, 28, t)) + ')'
    : 'rgb(' + Math.round(lerp(150, 240, t)) + ',' + Math.round(lerp(155, 190, t)) + ',' + Math.round(lerp(165, 130, t)) + ')';
  return { top: top, bot: bot };
}

function drawBackground(t){
  if(!ctx) return;
  var sky = lerpSky(t);
  var grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, sky.top);
  grd.addColorStop(0.55, sky.bot);
  grd.addColorStop(1, lerpColor(t * 0.6));
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  var sunY = H * 0.18;
  var sunR = 28 + t * 18;
  if(t > 0.05){
    var sg = ctx.createRadialGradient(W * 0.72, sunY, 0, W * 0.72, sunY, sunR * 2.5);
    sg.addColorStop(0, 'rgba(255,' + Math.round(180 + t * 40) + ',80,' + (0.35 + t * 0.35) + ')');
    sg.addColorStop(0.5, 'rgba(255,160,60,' + (0.12 + t * 0.15) + ')');
    sg.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(W * 0.72, sunY, sunR * 2.5, 0, 6.28);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,' + Math.round(200 + t * 30) + ',100,' + (0.5 + t * 0.4) + ')';
    ctx.beginPath();
    ctx.arc(W * 0.72, sunY, sunR * 0.45, 0, 6.28);
    ctx.fill();
  }

  ctx.save();
  ctx.globalAlpha = 0.25 + (1 - t) * 0.35;
  for(var i = 0; i < waves.length; i++){
    var wv = waves[i];
    var baseY = H * (0.52 + wv.y * 0.35) + Math.sin(elapsed * 0.8 + wv.phase) * wv.amp;
    ctx.strokeStyle = dark ? 'rgba(120,130,140,0.4)' : 'rgba(90,100,110,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for(var x = 0; x <= W; x += 8){
      var yy = baseY + Math.sin(x * 0.02 + elapsed * 1.2 + wv.phase) * (3 + wv.amp * 0.5);
      if(x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawLanes(){
  if(!ctx) return;
  ctx.save();
  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 10]);
  for(var i = 0; i < laneCount; i++){
    var x = laneX(i);
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBoat(x, y){
  if(!ctx) return;
  var lean = (targetLane - lane) * 0.08 + wind * 0.015;
  ctx.save();
  ctx.translate(x + wind * 8, y);
  ctx.rotate(lean);

  ctx.fillStyle = dark ? '#3a3530' : '#4a4540';
  ctx.beginPath();
  ctx.ellipse(0, 8, 18, 7, 0, 0, 6.28);
  ctx.fill();

  ctx.strokeStyle = dark ? '#c8b8a0' : '#5a5048';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -2);
  ctx.lineTo(0, -38);
  ctx.stroke();

  var sailCol = 'rgba(' + Math.round(200 + warmth * 40) + ',' + Math.round(160 + warmth * 50) + ',' + Math.round(80 + warmth * 30) + ',0.85)';
  ctx.fillStyle = sailCol;
  ctx.beginPath();
  ctx.moveTo(0, -36);
  ctx.quadraticCurveTo(14 + wind * 2, -22, 10, -4);
  ctx.lineTo(0, -4);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(255,220,140,0.9)';
  ctx.beginPath();
  ctx.moveTo(-3, -34);
  ctx.lineTo(3, -34);
  ctx.lineTo(0, -40);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawFogBank(x, y, w, h, rot){
  if(!ctx) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 0.6);
  g.addColorStop(0, dark ? 'rgba(180,185,195,0.55)' : 'rgba(200,205,215,0.65)');
  g.addColorStop(0.6, dark ? 'rgba(140,145,155,0.35)' : 'rgba(170,175,185,0.4)');
  g.addColorStop(1, 'rgba(160,165,175,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, w * 0.5, h * 0.45, 0, 0, 6.28);
  ctx.fill();
  ctx.restore();
}

function drawToken(x, y, rot){
  if(!ctx) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, 14);
  g.addColorStop(0, '#fff4c0');
  g.addColorStop(0.4, '#e8b040');
  g.addColorStop(1, 'rgba(200,140,30,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  for(var i = 0; i < 6; i++){
    var a = i * 1.047 - 1.57;
    var px = Math.cos(a) * 10, py = Math.sin(a) * 10;
    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawRock(x, y, w){
  if(!ctx) return;
  ctx.fillStyle = dark ? '#4a4845' : '#6a6560';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.4, y + w * 0.2);
  ctx.lineTo(x - w * 0.2, y - w * 0.35);
  ctx.lineTo(x + w * 0.3, y - w * 0.25);
  ctx.lineTo(x + w * 0.4, y + w * 0.15);
  ctx.closePath();
  ctx.fill();
}

function drawFogOverlay(){
  if(!ctx) return;
  var alpha = fogDensity * (0.45 + (1 - warmth) * 0.35);
  ctx.fillStyle = dark ? 'rgba(30,32,38,' + alpha + ')' : 'rgba(200,205,210,' + alpha + ')';
  ctx.fillRect(0, 0, W, H);
}

function drawParticles(dt){
  if(!ctx) return;
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 80 * dt;
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawLives(){
  if(!ctx) return;
  for(var i = 0; i < 3; i++){
    ctx.fillStyle = i < lives ? '#c47a2c' : (dark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.1)');
    ctx.beginPath();
    ctx.arc(W - 20 - i * 16, H - Math.max(24, 16), 4, 0, 6.28);
    ctx.fill();
  }
}

function update(dt){
  if(state !== 'playing') return;
  if(hitPause > 0){ hitPause -= dt; return; }

  elapsed += dt;

  scrollSpd = 90 + elapsed * 2.2 + fogDensity * 40;
  fogDensity = Math.min(0.82, 0.55 + elapsed * 0.004 - warmth * 0.15);
  laneMargin = Math.min(0.18, 0.08 + elapsed * 0.0018 + fogDensity * 0.04);

  if(Math.random() < dt * 0.35){
    windTarget = (Math.random() - 0.5) * (1.2 + elapsed * 0.02);
  }
  wind = lerp(wind, windTarget, dt * 2);

  lane = lerp(lane, targetLane, Math.min(1, dt * 8));
  if(Math.abs(lane - targetLane) < 0.01) lane = targetLane;

  var spawnRate = Math.max(0.55, 1.4 - elapsed * 0.012);
  lastSpawn += dt;
  if(lastSpawn > spawnRate){
    lastSpawn = 0;
    spawnEntity();
    if(elapsed > 20 && Math.random() < 0.35) spawnEntity();
  }

  var boatX = laneX(lane) + wind * 6;
  var boatHitR = 16;

  for(var i = entities.length - 1; i >= 0; i--){
    var e = entities[i];
    e.y += e.spd * dt;
    e.rot += e.spin * dt;
    var ex = laneX(e.lane);

    if(e.type === 'token' && !e.collected){
      var dx = ex - boatX, dy = e.y - boatY;
      if(dx * dx + dy * dy < 900){
        collectToken(e);
        entities.splice(i, 1);
        continue;
      }
    }

    if(e.type !== 'token'){
      var hdx = ex - boatX, hdy = e.y - boatY;
      var hitDist = e.type === 'fog' ? 28 : 22;
      if(Math.abs(hdx) < hitDist && Math.abs(hdy) < hitDist){
        entities.splice(i, 1);
        takeHit();
        burst(ex, e.y, '#889098', 10);
        continue;
      }
    }

    if(e.y > H + 60){
      if(e.type === 'token' && !e.collected){
        combo = 1;
        if(comboEl) comboEl.textContent = '×1';
      }
      entities.splice(i, 1);
    }
  }

  if(elapsed > 55){
    score += Math.floor(dt * 5);
    if(scoreEl) scoreEl.textContent = String(score);
    if(elapsed > 60) endGame();
  }
}

function render(){
  if(!ctx){
    if(canvas){ canvas.style.background = '#888'; }
    return;
  }

  dark = safe(function(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }, false);

  var sx = shakeT > 0 ? (Math.random() - 0.5) * 8 * shakeT : 0;
  var sy = shakeT > 0 ? (Math.random() - 0.5) * 6 * shakeT : 0;
  if(shakeT > 0) shakeT -= 0.016;

  ctx.save();
  ctx.translate(sx, sy);
  drawBackground(warmth);
  drawLanes();

  for(var i = 0; i < entities.length; i++){
    var e = entities[i];
    var ex = laneX(e.lane);
    if(e.type === 'token') drawToken(ex, e.y, e.rot);
    else if(e.type === 'fog') drawFogBank(ex, e.y, e.w, e.h, e.rot);
    else drawRock(ex, e.y, e.w);
  }

  drawBoat(laneX(lane), boatY);
  drawParticles(0.016);
  drawLives();

  if(flashT > 0){
    ctx.fillStyle = 'rgba(255,200,100,' + (flashT * 2.5) + ')';
    ctx.fillRect(0, 0, W, H);
    flashT -= 0.016;
  }

  drawFogOverlay();

  if(state === 'playing' && Math.abs(wind) > 0.4){
    ctx.fillStyle = dark ? 'rgba(232,226,216,0.7)' : 'rgba(42,40,36,0.6)';
    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(wind > 0 ? 'WIND →' : '← WIND', W * 0.5, H * 0.12);
  }

  ctx.restore();
}

var lastTime = 0;
function loop(ts){
  rafId = requestAnimationFrame(loop);
  var dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
  lastTime = ts;
  update(dt);
  render();
}

function bindEvents(){
  if(btnStart) btnStart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
  if(btnRestart) btnRestart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);

  var targets = [canvas, document.getElementById('wrap')];
  for(var i = 0; i < targets.length; i++){
    var t = targets[i];
    if(!t) continue;
    t.addEventListener('touchstart', onPointerDown, { passive: false });
    t.addEventListener('touchend', onPointerUp, { passive: false });
    t.addEventListener('mousedown', onPointerDown);
    t.addEventListener('mouseup', onPointerUp);
  }

  if(window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if(mq.addEventListener) mq.addEventListener('change', render);
    else if(mq.addListener) mq.addListener(render);
  }
}

resize();
initWaves();
bindEvents();
render();
rafId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
