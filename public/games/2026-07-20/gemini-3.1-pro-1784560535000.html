<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trim</title>
<style>
  :root {
    --bg-color: #f8f9fa;
    --text-color: #212529;
    --bloat-color: #ffffff;
    --bloat-shadow: rgba(0,0,0,0.15);
    --essential-color: #ff4400;
    --dart-color: #212529;
    --grid-color: rgba(0,0,0,0.05);
    --overlay-bg: rgba(248, 249, 250, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #121212;
      --text-color: #f8f9fa;
      --bloat-color: #2a2a2a;
      --bloat-shadow: rgba(0,0,0,0.6);
      --essential-color: #ff5533;
      --dart-color: #f8f9fa;
      --grid-color: rgba(255,255,255,0.05);
      --overlay-bg: rgba(18, 18, 18, 0.85);
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background-color: var(--bg-color);
    color: var(--text-color); font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #gameCanvas {
    display: block; width: 100%; height: 100%;
  }
  #uiLayer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: var(--overlay-bg);
    pointer-events: none;
  }
  .hidden { display: none !important; }
  
  h1 { font-size: 4rem; font-weight: 800; letter-spacing: -3px; margin: 0 0 10px 0; pointer-events: none; }
  p { font-size: 1.1rem; opacity: 0.7; max-width: 80%; text-align: center; line-height: 1.5; margin-bottom: 40px; pointer-events: none; }
  
  button {
    pointer-events: auto;
    background: var(--text-color); color: var(--bg-color);
    border: none; padding: 18px 40px; font-size: 1.2rem;
    font-family: inherit; cursor: pointer; border-radius: 50px;
    text-transform: uppercase; letter-spacing: 2px;
    font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }
  
  #scoreDisplay {
    position: absolute; top: 20px; left: 20px; font-size: 2.5rem; font-weight: 800;
    pointer-events: none; transition: transform 0.1s;
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="uiLayer">
    <div id="scoreDisplay" class="hidden">0</div>
    
    <div id="startScreen" class="screen">
      <h1>TRIM</h1>
      <p>Flick to throw precision darts.<br>Trim the bloat.<br>Avoid the essential elements.</p>
      <button data-smoke="start" id="startBtn">START</button>
    </div>
    
    <div id="gameOverScreen" class="screen hidden">
      <h1>OVERWHELMED</h1>
      <p>Final Score: <span id="finalScore">0</span></p>
      <button data-smoke="restart" id="restartBtn">RESTART</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    function resize() {
      width = window.innerWidth || 320;
      height = window.innerHeight || 480;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();
    
    let state = 'start';
    let score = 0;
    let bloatLevel = 0.1;
    let bloatHeightPx = height * 0.1;
    let entities = [];
    let particles = [];
    let darts = [];
    
    let lastTime = performance.now();
    let spawnTimer = 0;
    let timeScale = 1.0;
    let hitPause = 0;
    let screenShake = 0;
    
    let dragStart = null;
    let dragCurrent = null;
    let isDragging = false;
    
    let audioCtx = null;
    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
    }
    
    function playSound(type) {
      if (!audioCtx) return;
      try {
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'shoot') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, t);
          osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t);
          osc.stop(t + 0.1);
        } else if (type === 'hit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(50, t + 0.05);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
          osc.start(t);
          osc.stop(t + 0.05);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, t);
          osc.frequency.linearRampToValueAtTime(50, t + 0.2);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.2);
        }
      } catch (e) {}
    }
    
    function getPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }
    
    function handleStart(e) {
      if (state !== 'playing') return;
      if (e.type === 'touchstart') e.preventDefault();
      initAudio();
      dragStart = getPos(e);
      dragCurrent = { ...dragStart };
      isDragging = true;
    }
    
    function handleMove(e) {
      if (!isDragging) return;
      if (e.type === 'touchmove') e.preventDefault();
      dragCurrent = getPos(e);
    }
    
    function handleEnd(e) {
      if (!isDragging) return;
      if (e.type === 'touchend') e.preventDefault();
      isDragging = false;
      
      const dx = dragCurrent.x - dragStart.x;
      const dy = dragCurrent.y - dragStart.y;
      const dist = Math.hypot(dx, dy);
      
      if (dist > 10) {
        const angle = Math.atan2(dy, dx);
        const speed = Math.max(1000, Math.min(dist * 15, 3000));
        darts.push({
          x: dragStart.x,
          y: dragStart.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          angle: angle
        });
        playSound('shoot');
      }
    }
    
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    canvas.addEventListener('touchend', handleEnd, {passive: false});
    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    
    function spawnEntity() {
      const isEssential = Math.random() < Math.min(0.4, 0.1 + score * 0.005);
      const radius = isEssential ? Math.max(15, 30 - score * 0.2) : Math.max(25, 45 - score * 0.15);
      const x = radius + Math.random() * (width - radius * 2);
      const y = -radius;
      const fallSpeed = 150 + score * 3 + Math.random() * 50;
      
      if (isEssential) {
        entities.push({
          type: 'essential',
          x, y, radius, fallSpeed,
          vx: (Math.random() - 0.5) * 100,
          phase: Math.random() * Math.PI * 2
        });
      } else {
        const points = [];
        const numPoints = 5 + Math.floor(Math.random() * 4);
        for (let i = 0; i < numPoints; i++) {
          const a = (i / numPoints) * Math.PI * 2;
          const r = radius * (0.6 + Math.random() * 0.4);
          points.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
        }
        entities.push({
          type: 'bloat',
          x, y, radius, fallSpeed, points,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 3
        });
      }
    }
    
    function spawnParticles(x, y, rot) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: x + (Math.random()-0.5)*20,
          y: y + (Math.random()-0.5)*20,
          vx: (Math.random()-0.5)*400,
          vy: (Math.random()-0.5)*400,
          rot: Math.random() * Math.PI,
          rotSpeed: (Math.random()-0.5)*15,
          size: 4 + Math.random() * 8,
          life: 0.3 + Math.random() * 0.3,
          maxLife: 0.6
        });
      }
    }
    
    function update(dt) {
      if (hitPause > 0) {
        hitPause -= dt;
        return;
      }
      
      const targetTimeScale = isDragging ? 0.15 : 1.0;
      timeScale += (targetTimeScale - timeScale) * 15 * dt;
      const scaledDt = dt * timeScale;
      
      if (screenShake > 0) {
        screenShake -= dt * 3;
        if (screenShake < 0) screenShake = 0;
      }
      
      spawnTimer -= scaledDt;
      if (spawnTimer <= 0) {
        spawnEntity();
        spawnTimer = Math.max(0.2, 1.2 - score * 0.015) + Math.random() * 0.3;
      }
      
      for (let i = darts.length - 1; i >= 0; i--) {
        let d = darts[i];
        d.x += d.vx * scaledDt;
        d.y += d.vy * scaledDt;
        if (d.x < -100 || d.x > width + 100 || d.y < -100 || d.y > height + 100) {
          darts.splice(i, 1);
        }
      }
      
      for (let i = entities.length - 1; i >= 0; i--) {
        let e = entities[i];
        e.y += e.fallSpeed * scaledDt;
        if (e.type === 'essential') {
          e.x += Math.sin(e.phase + performance.now() * 0.003) * e.vx * scaledDt;
          if (e.x < e.radius) e.x = e.radius;
          if (e.x > width - e.radius) e.x = width - e.radius;
        } else {
          e.rot += e.rotSpeed * scaledDt;
        }
        
        let hit = false;
        for (let j = darts.length - 1; j >= 0; j--) {
          let d = darts[j];
          const dist = Math.hypot(e.x - d.x, e.y - d.y);
          if (dist < e.radius + 10) {
            hit = true;
            darts.splice(j, 1);
            break;
          }
        }
        
        if (hit) {
          if (e.type === 'bloat') {
            score++;
            const scoreEl = document.getElementById('scoreDisplay');
            scoreEl.innerText = score;
            scoreEl.style.transform = 'scale(1.3)';
            setTimeout(() => { scoreEl.style.transform = 'scale(1)'; }, 50);
            
            bloatLevel = Math.max(0, bloatLevel - 0.015);
            playSound('hit');
            hitPause = 0.04;
            spawnParticles(e.x, e.y, e.rot);
            try { if (navigator.vibrate) navigator.vibrate(10); } catch(err){}
          } else {
            bloatLevel += 0.3;
            playSound('error');
            screenShake = 1.0;
            try { if (navigator.vibrate) navigator.vibrate(50); } catch(err){}
          }
          entities.splice(i, 1);
          continue;
        }
        
        if (e.y > height - bloatHeightPx + e.radius) {
          if (e.type === 'bloat') {
            bloatLevel += 0.1;
            screenShake = Math.max(screenShake, 0.2);
            try { if (navigator.vibrate) navigator.vibrate(15); } catch(err){}
          }
          entities.splice(i, 1);
        }
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * scaledDt;
        p.y += p.vy * scaledDt;
        p.rot += p.rotSpeed * scaledDt;
        p.life -= scaledDt;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
      
      const targetBloatHeight = bloatLevel * height;
      bloatHeightPx += (targetBloatHeight - bloatHeightPx) * 5 * dt;
      
      if (bloatLevel >= 1.0) {
        gameOver();
      }
    }
    
    function draw() {
      const style = getComputedStyle(document.body);
      const bgColor = style.getPropertyValue('--bg-color').trim();
      const bloatColor = style.getPropertyValue('--bloat-color').trim();
      const bloatShadow = style.getPropertyValue('--bloat-shadow').trim();
      const essentialColor = style.getPropertyValue('--essential-color').trim();
      const dartColor = style.getPropertyValue('--dart-color').trim();
      const gridColor = style.getPropertyValue('--grid-color').trim();

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, width, height);
      
      ctx.save();
      if (screenShake > 0) {
        const mag = screenShake * 25;
        ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
      }
      
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      const gridSize = 40;
      const offsetX = (performance.now() * 0.02) % gridSize;
      const offsetY = (performance.now() * 0.02) % gridSize;
      
      ctx.beginPath();
      for (let x = offsetX; x < width; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, height);
      }
      for (let y = offsetY; y < height; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(width, y);
      }
      ctx.stroke();
      
      if (bloatHeightPx > 0) {
        ctx.fillStyle = bloatColor;
        ctx.shadowColor = bloatShadow;
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = -5;
        ctx.beginPath();
        ctx.moveTo(0, height);
        const segments = Math.max(10, Math.ceil(width / 30));
        for (let i = 0; i <= segments; i++) {
          const px = (i / segments) * width;
          const py = height - bloatHeightPx + Math.sin(i * 1.5 + performance.now() * 0.005) * 12;
          ctx.lineTo(px, py);
        }
        ctx.lineTo(width, height);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
      }
      
      for (let e of entities) {
        if (e.type === 'bloat') {
          ctx.fillStyle = bloatColor;
          ctx.shadowColor = bloatShadow;
          ctx.shadowBlur = 15;
          ctx.shadowOffsetY = 5;
          ctx.beginPath();
          for (let i = 0; i < e.points.length; i++) {
            const p = e.points[i];
            const px = e.x + p.x * Math.cos(e.rot) - p.y * Math.sin(e.rot);
            const py = e.y + p.x * Math.sin(e.rot) + p.y * Math.cos(e.rot);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;
        } else {
          ctx.strokeStyle = essentialColor;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius - 2, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = essentialColor;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius * 0.35, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      ctx.fillStyle = bloatColor;
      for (let p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.moveTo(p.size, 0);
        ctx.lineTo(0, p.size);
        ctx.lineTo(-p.size, 0);
        ctx.lineTo(0, -p.size);
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1.0;
      
      ctx.strokeStyle = dartColor;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      for (let d of darts) {
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - Math.cos(d.angle) * 30, d.y - Math.sin(d.angle) * 30);
        ctx.stroke();
      }
      
      if (isDragging) {
        ctx.strokeStyle = dartColor;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(dragStart.x, dragStart.y);
        ctx.lineTo(dragCurrent.x, dragCurrent.y);
        ctx.stroke();
        ctx.setLineDash([]);
        
        const angle = Math.atan2(dragCurrent.y - dragStart.y, dragCurrent.x - dragStart.x);
        ctx.save();
        ctx.translate(dragStart.x, dragStart.y);
        ctx.rotate(angle);
        ctx.fillStyle = dartColor;
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(-6, 6);
        ctx.lineTo(-6, -6);
        ctx.fill();
        ctx.restore();
      }
      
      ctx.restore();
    }
    
    function startGame() {
      state = 'playing';
      score = 0;
      bloatLevel = 0.1;
      bloatHeightPx = height * 0.1;
      entities = [];
      particles = [];
      darts = [];
      spawnTimer = 0.5;
      timeScale = 1.0;
      hitPause = 0;
      screenShake = 0;
      isDragging = false;
      
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('scoreDisplay').classList.remove('hidden');
      document.getElementById('scoreDisplay').innerText = '0';
      
      initAudio();
    }
    
    function gameOver() {
      state = 'gameover';
      document.getElementById('gameOverScreen').classList.remove('hidden');
      document.getElementById('finalScore').innerText = score;
      document.getElementById('scoreDisplay').classList.add('hidden');
      isDragging = false;
    }
    
    function loop(time) {
      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;
      
      if (state === 'playing') {
        update(dt);
      }
      draw();
      
      requestAnimationFrame(loop);
    }
    
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    
    requestAnimationFrame(loop);
  </script>
</body>
</html>
