<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mist Helix</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8edf0;--fg:#1a2830;--muted:#5a6e78;--accent:#3d8b8b;
  --panel:rgba(255,255,255,.88);--border:rgba(26,40,48,.12);
  --glow:rgba(61,139,139,.35);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1619;--fg:#d8e4ea;--muted:#7a929e;--accent:#5ec4c4;
    --panel:rgba(18,28,32,.92);--border:rgba(216,228,234,.1);
    --glow:rgba(94,196,196,.25);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{display:block;width:100%;flex:1;min-height:0;touch-action:none;background:var(--bg)}
#hud{
  position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;gap:12px
}
#lives{display:flex;gap:6px;align-items:center;margin-top:4px}
.life{width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:.85;transition:opacity .3s,transform .3s}
.life.lost{opacity:.15;transform:scale(.7)}
.hud-block{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;line-height:1.45;color:var(--muted)}
.hud-block strong{display:block;font-size:18px;color:var(--fg);font-weight:600;letter-spacing:-.02em}
#progressWrap{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:16px;right:16px;pointer-events:none;z-index:2}
#progressLabel{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
#progressBar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
#progressFill{height:100%;width:0;background:linear-gradient(90deg,#4a90a4,#e8a838);border-radius:2px;transition:width .3s ease}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;z-index:10;pointer-events:none;transition:opacity .45s ease,visibility .45s
}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-bg{
  position:absolute;inset:0;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
.overlay-content{position:relative;text-align:center;max-width:340px;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.overlay h1{font-size:clamp(28px,8vw,42px);font-weight:300;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px}
.overlay .tagline{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.5}
.overlay .hint{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;color:var(--muted);
  margin-top:20px;line-height:1.6}
.btn{
  pointer-events:auto;min-height:48px;min-width:180px;padding:14px 32px;border:none;border-radius:999px;
  font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
  background:var(--accent);color:#fff;box-shadow:0 4px 24px var(--glow);transition:transform .15s,box-shadow .15s
}
.btn:active{transform:scale(.96)}
@media(prefers-color-scheme:light){.btn{color:#fff}}
#gameoverScreen .score-big{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:48px;font-weight:600;color:var(--fg);margin:12px 0 4px}
#gameoverScreen .sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.combo-flash{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  font-size:22px;color:var(--accent);opacity:0;pointer-events:none;z-index:5;transition:opacity .2s}
.combo-flash.show{opacity:1;animation:comboPop .5s ease}
@keyframes comboPop{0%{transform:translate(-50%,-50%) scale(.8);opacity:0}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-block"><span>Fragments</span><strong id="scoreVal">0</strong><div id="lives"></div></div>
    <div class="hud-block" style="text-align:right"><span>Time</span><strong id="timeVal">45</strong></div>
  </div>
  <div id="progressWrap">
    <div id="progressLabel">Painting concealed</div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>
  <div id="comboFlash" class="combo-flash"></div>
  <div id="titleScreen" class="overlay">
    <div class="overlay-bg"></div>
    <div class="overlay-content">
      <h1>Mist Helix</h1>
      <p class="tagline">Drift through summer haze. Gather encrypted helix fragments before they dissolve — each one peels back the painting beneath.</p>
      <button class="btn" data-smoke="start" id="startBtn">Begin Drift</button>
      <p class="hint">Drag to steer · Dodge crimson walls · 45 seconds</p>
    </div>
  </div>
  <div id="gameoverScreen" class="overlay hidden">
    <div class="overlay-bg"></div>
    <div class="overlay-content">
      <h1 id="endTitle">Drift Complete</h1>
      <div class="score-big" id="finalScore">0</div>
      <p class="sub" id="endSub">brushstrokes revealed</p>
      <button class="btn" data-smoke="restart" id="restartBtn">Drift Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('gameCanvas');
var ctx=canvas.getContext('2d');
if(!ctx){document.body.innerHTML='<p style="padding:24px">Canvas unavailable.</p>';return;}

var scoreEl=document.getElementById('scoreVal');
var timeEl=document.getElementById('timeVal');
var progressFill=document.getElementById('progressFill');
var progressLabel=document.getElementById('progressLabel');
var titleScreen=document.getElementById('titleScreen');
var gameoverScreen=document.getElementById('gameoverScreen');
var finalScoreEl=document.getElementById('finalScore');
var endTitleEl=document.getElementById('endTitle');
var endSubEl=document.getElementById('endSub');
var comboFlashEl=document.getElementById('comboFlash');
var livesEl=document.getElementById('lives');
var startBtn=document.getElementById('startBtn');
var restartBtn=document.getElementById('restartBtn');

var W=300,H=500,DPR=1;
var state='title';
var score=0,combo=0,comboTimer=0,timeLeft=45,health=3;
var elapsed=0,fogDensity=0.55,windStr=0;
var shakeT=0,hitFlash=0;
var targetX=0,targetY=0,hasTarget=false;
var keys={};
var audioCtx=null;

var player={x:0,y:0,vx:0,vy:0,r:14};
var fragments=[];
var obstacles=[];
var particles=[];
var trail=[];
var fogParticles=[];
var windLines=[];
var brushstrokes=[];
var revealedStrokes=0;
var TOTAL_STROKES=28;
var spawnTimer=0,obsTimer=0;
var lastTs=0;
var animId=0;

var PALETTE=['#e8a838','#4a90a4','#8fa882','#d4845a','#c9d6df','#b85c38','#6b9e8f','#f0c060'];

function isDark(){
  try{return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return false;}
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||300;
  H=Math.max(window.innerHeight-(0),200);
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  generatePainting();
  initFogParticles();
  if(state==='title')drawTitlePreview();
}

function generatePainting(){
  brushstrokes=[];
  var rng=mulberry32(42);
  for(var i=0;i<TOTAL_STROKES;i++){
    brushstrokes.push({
      x:rng()*W,
      y:rng()*H*0.85+H*0.05,
      angle:rng()*Math.PI*2,
      len:40+rng()*120,
      width:8+rng()*28,
      color:PALETTE[Math.floor(rng()*PALETTE.length)],
      alpha:0.35+rng()*0.45,
      order:i
    });
  }
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function initFogParticles(){
  fogParticles=[];
  windLines=[];
  var n=Math.floor(W*H/8000);
  for(var i=0;i<n;i++){
    fogParticles.push({x:Math.random()*W,y:Math.random()*H,s:2+Math.random()*5,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.2,a:0.08+Math.random()*0.12});
  }
  for(var j=0;j<12;j++){
    windLines.push({x:Math.random()*W,y:Math.random()*H,len:30+Math.random()*60,a:0.04+Math.random()*0.06});
  }
}

function updateLivesUI(){
  if(!livesEl)return;
  livesEl.innerHTML='';
  for(var i=0;i<3;i++){
    var d=document.createElement('span');
    d.className='life'+(i>=health?' lost':'');
    livesEl.appendChild(d);
  }
}

function drawPainting(revealCount){
  for(var i=0;i<brushstrokes.length;i++){
    if(i>=revealCount)break;
    var s=brushstrokes[i];
    ctx.save();
    ctx.globalAlpha=s.alpha;
    ctx.strokeStyle=s.color;
    ctx.lineWidth=s.width;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x+Math.cos(s.angle)*s.len,s.y+Math.sin(s.angle)*s.len);
    ctx.stroke();
    ctx.restore();
  }
}

function drawTitlePreview(){
  if(!ctx)return;
  var dark=isDark();
  ctx.fillStyle=dark?'#0f1619':'#e8edf0';
  ctx.fillRect(0,0,W,H);
  drawPainting(6);
  ctx.fillStyle=dark?'rgba(15,22,25,0.72)':'rgba(232,237,240,0.78)';
  ctx.fillRect(0,0,W,H);
  drawFogLayer(0.6,0);
}

function drawFogLayer(density,wind){
  var dark=isDark();
  var base=dark?'rgba(180,200,210,':'rgba(200,215,225,';
  for(var w=0;w<windLines.length;w++){
    var wl=windLines[w];
    ctx.strokeStyle=dark?'rgba(180,200,210,'+(wl.a*density)+')':'rgba(200,215,225,'+(wl.a*density)+')';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(wl.x,wl.y);
    ctx.lineTo(wl.x+wl.len+wind*8,wl.y+wind*2);
    ctx.stroke();
    wl.x+=wind*0.6+0.2;
    if(wl.x>W+60){wl.x=-60;wl.y=Math.random()*H;}
  }
  for(var i=0;i<fogParticles.length;i++){
    var p=fogParticles[i];
    p.x+=p.vx+wind*0.4;
    p.y+=p.vy+wind*0.15;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.beginPath();
    ctx.fillStyle=base+(p.a*density)+')';
    ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle=dark?'rgba(15,22,25,'+density*0.35+')':'rgba(232,237,240,'+density*0.4+')';
  ctx.fillRect(0,0,W,H);
}

function drawHelix(x,y,size,rot,alpha,urgency){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.globalAlpha=alpha;
  var pulse=1+Math.sin(Date.now()*0.008)*0.08;
  if(urgency>0.6)pulse+=Math.sin(Date.now()*0.02)*0.15;
  size*=pulse;
  var c1=isDark()?'#5ec4c4':'#3d8b8b';
  var c2=isDark()?'#8fd4d4':'#6aaaaa';
  ctx.lineWidth=2.5;
  for(var strand=0;strand<2;strand++){
    ctx.strokeStyle=strand===0?c1:c2;
    ctx.beginPath();
    for(var t=0;t<=1;t+=0.05){
      var py=(t-.5)*size*1.6;
      var px=Math.sin(t*Math.PI*3+strand*Math.PI)*size*0.35;
      if(t===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  for(var r=0;r<3;r++){
    var ty=(r/2-.5)*size*1.1;
    ctx.strokeStyle='rgba(255,255,255,0.35)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(-size*0.35,ty);
    ctx.lineTo(size*0.35,ty);
    ctx.stroke();
  }
  ctx.restore();
}

function drawObstacle(o){
  ctx.save();
  ctx.translate(o.x,o.y);
  ctx.rotate(o.rot);
  ctx.globalAlpha=0.85;
  var g=ctx.createLinearGradient(-o.w/2,0,o.w/2,0);
  g.addColorStop(0,'#8b2030');
  g.addColorStop(0.5,'#c94050');
  g.addColorStop(1,'#6b1825');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-o.w/2,-o.h/2);
  ctx.lineTo(o.w/2,-o.h/2*0.6);
  ctx.lineTo(o.w/2*0.8,o.h/2);
  ctx.lineTo(-o.w/2*0.7,o.h/2*0.8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(255,180,180,0.4)';
  ctx.lineWidth=1;
  ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.font='9px ui-monospace,monospace';
  ctx.textAlign='center';
  ctx.fillText('ENC',0,3);
  ctx.restore();
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y);
  var glow=isDark()?'#5ec4c4':'#3d8b8b';
  var grd=ctx.createRadialGradient(0,0,0,0,0,player.r*2.2);
  grd.addColorStop(0,glow);
  grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.35;
  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.arc(0,0,player.r*2.2,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle=isDark()?'#d8e4ea':'#fff';
  ctx.beginPath();
  ctx.arc(0,0,player.r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle=glow;
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.restore();
}

function spawnFragment(){
  var margin=40;
  var life=4.5-fogDensity*1.8;
  if(life<1.2)life=1.2;
  fragments.push({
    x:margin+Math.random()*(W-margin*2),
    y:margin+Math.random()*(H-margin*2),
    r:16+Math.random()*6,
    rot:Math.random()*Math.PI*2,
    life:life,maxLife:life,
    spin:(Math.random()-.5)*0.04
  });
}

function spawnObstacle(){
  var side=Math.floor(Math.random()*4);
  var o={w:28+Math.random()*20,h:22+Math.random()*16,rot:Math.random()*Math.PI*2,vx:0,vy:0};
  if(side===0){o.x=Math.random()*W;o.y=-30;o.vy=1.2+windStr;}
  else if(side===1){o.x=W+30;o.y=Math.random()*H;o.vx=-(1.2+windStr);}
  else if(side===2){o.x=Math.random()*W;o.y=H+30;o.vy=-(1.2+windStr);}
  else{o.x=-30;o.y=Math.random()*H;o.vx=1.2+windStr;}
  obstacles.push(o);
}

function burst(x,y,color,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2;
    var sp=1+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.4,color:color,r:1+Math.random()*2});
  }
}

function playTone(freq,dur,type){
  try{
    if(!audioCtx){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      audioCtx=new AC();
    }
    if(audioCtx.state==='suspended')audioCtx.resume().catch(function(){});
    var osc=audioCtx.createOscillator();
    var gain=audioCtx.createGain();
    osc.type=type||'sine';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.08,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function showCombo(text){
  comboFlashEl.textContent=text;
  comboFlashEl.classList.remove('show');
  void comboFlashEl.offsetWidth;
  comboFlashEl.classList.add('show');
}

function resetGame(){
  score=0;combo=0;comboTimer=0;timeLeft=45;health=3;
  elapsed=0;fogDensity=0.55;windStr=0;shakeT=0;hitFlash=0;
  revealedStrokes=0;spawnTimer=0;obsTimer=0;
  fragments=[];obstacles=[];particles=[];trail=[];
  player.x=W/2;player.y=H/2;
  player.vx=0;player.vy=0;
  targetX=W/2;targetY=H/2;hasTarget=false;
  scoreEl.textContent='0';
  timeEl.textContent='45';
  progressFill.style.width='0%';
  progressLabel.textContent='Painting concealed';
  updateLivesUI();
  generatePainting();
  initFogParticles();
  spawnFragment();
  spawnFragment();
}

function startGame(){
  resetGame();
  state='playing';
  titleScreen.classList.add('hidden');
  gameoverScreen.classList.add('hidden');
  lastTs=performance.now();
  if(animId)cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
}

function endGame(won){
  state='gameover';
  finalScoreEl.textContent=String(score);
  endTitleEl.textContent=won?'Painting Emerges':'Mist Claims All';
  endSubEl.textContent=revealedStrokes+' of '+TOTAL_STROKES+' brushstrokes revealed';
  gameoverScreen.classList.remove('hidden');
  if(animId)cancelAnimationFrame(animId);
  animId=requestAnimationFrame(drawGameOverBg);
}

function drawGameOverBg(){
  drawFrame(0.016);
  if(state==='gameover')animId=requestAnimationFrame(drawGameOverBg);
}

function update(dt){
  elapsed+=dt;
  var progress=Math.min(1,elapsed/45);
  fogDensity=0.55+progress*0.35;
  windStr=progress*2.2;

  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0;}

  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endGame(score>=12);return;}

  timeEl.textContent=String(Math.ceil(timeLeft));

  var ax=0,ay=0;
  if(keys['ArrowLeft']||keys['a'])ax-=1;
  if(keys['ArrowRight']||keys['d'])ax+=1;
  if(keys['ArrowUp']||keys['w'])ay-=1;
  if(keys['ArrowDown']||keys['s'])ay+=1;
  if(hasTarget){
    var dx=targetX-player.x,dy=targetY-player.y;
    var dist=Math.sqrt(dx*dx+dy*dy)||1;
    ax+=dx/dist;ay+=dy/dist;
  }
  ax+=windStr*0.12;
  var accel=320;
  player.vx+=ax*accel*dt;
  player.vy+=ay*accel*dt;
  player.vx*=0.88;
  player.vy*=0.88;
  player.x+=player.vx*dt;
  player.y+=player.vy*dt;
  var pad=player.r+4;
  if(player.x<pad){player.x=pad;player.vx*=-0.3;}
  if(player.x>W-pad){player.x=W-pad;player.vx*=-0.3;}
  if(player.y<pad){player.y=pad;player.vy*=-0.3;}
  if(player.y>H-pad){player.y=H-pad;player.vy*=-0.3;}

  trail.push({x:player.x,y:player.y,a:0.5});
  if(trail.length>18)trail.shift();
  for(var t=0;t<trail.length;t++)trail[t].a-=dt*1.2;

  spawnTimer-=dt;
  var spawnRate=0.9-fogDensity*0.35;
  if(spawnTimer<=0&&fragments.length<8){
    spawnFragment();
    spawnTimer=spawnRate+Math.random()*0.5;
  }

  obsTimer-=dt;
  var obsRate=2.8-fogDensity*0.8;
  if(obsTimer<=0){
    spawnObstacle();
    obsTimer=obsRate+Math.random()*1.2;
  }

  for(var i=fragments.length-1;i>=0;i--){
    var f=fragments[i];
    f.life-=dt*(1+fogDensity*0.6);
    f.rot+=f.spin;
    if(f.life<=0){fragments.splice(i,1);continue;}
    var fdx=player.x-f.x,fdy=player.y-f.y;
    if(fdx*fdx+fdy*fdy<(player.r+f.r)*(player.r+f.r)){
      fragments.splice(i,1);
      score++;
      combo++;
      comboTimer=1.8;
      var bonus=combo>=3?combo-2:0;
      if(bonus>0)score+=bonus;
      if(revealedStrokes<TOTAL_STROKES){
        revealedStrokes++;
        burst(W/2,H*0.5,brushstrokes[revealedStrokes-1].color,6);
      }
      scoreEl.textContent=String(score);
      progressFill.style.width=Math.round(revealedStrokes/TOTAL_STROKES*100)+'%';
      progressLabel.textContent='Brushstroke '+revealedStrokes+' of '+TOTAL_STROKES;
      burst(f.x,f.y,isDark()?'#5ec4c4':'#3d8b8b',14);
      playTone(440+combo*30,0.12,'sine');
      if(combo>=3)showCombo(combo+'× HELIX');
      try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
    }
  }

  for(var j=obstacles.length-1;j>=0;j--){
    var ob=obstacles[j];
    ob.x+=ob.vx*(1+windStr*0.15);
    ob.y+=ob.vy*(1+windStr*0.15);
    if(ob.x<-60||ob.x>W+60||ob.y<-60||ob.y>H+60){obstacles.splice(j,1);continue;}
    var hw=ob.w*0.45,hh=ob.h*0.45;
    if(Math.abs(player.x-ob.x)<hw+player.r&&Math.abs(player.y-ob.y)<hh+player.r){
      obstacles.splice(j,1);
      health--;
      updateLivesUI();
      shakeT=0.25;
      hitFlash=0.3;
      combo=0;comboTimer=0;
      burst(player.x,player.y,'#c94050',10);
      playTone(120,0.2,'square');
      try{navigator.vibrate&&navigator.vibrate([30,20,30]);}catch(e){}
      if(health<=0){endGame(false);return;}
    }
  }

  for(var k=particles.length-1;k>=0;k--){
    var pt=particles[k];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.life-=dt;
    pt.vx*=0.96;pt.vy*=0.96;
    if(pt.life<=0)particles.splice(k,1);
  }

  if(shakeT>0)shakeT-=dt;
  if(hitFlash>0)hitFlash-=dt;
}

function drawFrame(dt){
  var dark=isDark();
  ctx.save();
  var sx=0,sy=0;
  if(shakeT>0){sx=(Math.random()-.5)*8*shakeT*4;sy=(Math.random()-.5)*8*shakeT*4;}
  ctx.translate(sx,sy);

  ctx.fillStyle=dark?'#0f1619':'#e8edf0';
  ctx.fillRect(-10,-10,W+20,H+20);

  drawPainting(revealedStrokes);

  for(var ti=0;ti<trail.length;ti++){
    var tr=trail[ti];
    if(tr.a<=0)continue;
    ctx.globalAlpha=tr.a*0.35;
    ctx.fillStyle=isDark()?'#5ec4c4':'#3d8b8b';
    ctx.beginPath();
    ctx.arc(tr.x,tr.y,player.r*0.35*(ti/trail.length),0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  for(var i=0;i<fragments.length;i++){
    var f=fragments[i];
    var urg=1-f.life/f.maxLife;
    drawHelix(f.x,f.y,f.r,f.rot,f.life/f.maxLife*0.9,urg);
  }

  for(var j=0;j<obstacles.length;j++)drawObstacle(obstacles[j]);

  drawPlayer();

  for(var k=0;k<particles.length;k++){
    var pt=particles[k];
    ctx.globalAlpha=pt.life*2;
    ctx.fillStyle=pt.color;
    ctx.beginPath();
    ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  drawFogLayer(fogDensity,windStr);

  if(hitFlash>0){
    ctx.fillStyle='rgba(200,50,60,'+(hitFlash*0.25)+')';
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();
}

function loop(ts){
  if(state!=='playing')return;
  var dt=Math.min(0.05,(ts-lastTs)/1000||0.016);
  lastTs=ts;
  update(dt);
  drawFrame(dt);
  animId=requestAnimationFrame(loop);
}

function setTarget(cx,cy){
  targetX=cx;targetY=cy;hasTarget=true;
}

function onPointerDown(e){
  if(state!=='playing')return;
  e.preventDefault();
  var rect=canvas.getBoundingClientRect();
  setTarget(e.clientX-rect.left,e.clientY-rect.top);
}

function onPointerMove(e){
  if(state!=='playing')return;
  e.preventDefault();
  var rect=canvas.getBoundingClientRect();
  setTarget(e.clientX-rect.left,e.clientY-rect.top);
}

function onTouchStart(e){
  if(state!=='playing')return;
  e.preventDefault();
  if(e.touches&&e.touches[0]){
    var rect=canvas.getBoundingClientRect();
    setTarget(e.touches[0].clientX-rect.left,e.touches[0].clientY-rect.top);
  }
}

function onTouchMove(e){
  if(state!=='playing')return;
  e.preventDefault();
  if(e.touches&&e.touches[0]){
    var rect=canvas.getBoundingClientRect();
    setTarget(e.touches[0].clientX-rect.left,e.touches[0].clientY-rect.top);
  }
}

function onKeyDown(e){
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)>=0)e.preventDefault();
}
function onKeyUp(e){keys[e.key]=false;}

startBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
restartBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});

canvas.addEventListener('mousedown',onPointerDown);
canvas.addEventListener('mousemove',onPointerMove);
canvas.addEventListener('touchstart',onTouchStart,{passive:false});
canvas.addEventListener('touchmove',onTouchMove,{passive:false});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});

window.addEventListener('keydown',onKeyDown);
window.addEventListener('keyup',onKeyUp);
window.addEventListener('resize',resize);

try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
      if(state==='title')drawTitlePreview();
    });
  }
}catch(e){}

resize();
state='title';
drawTitlePreview();

})();
</script>
</body>
</html>
