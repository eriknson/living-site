<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>The Last Impression</title>
    <style>
        :root {
            --bg: #e8e0d5;
            --text: #222;
            --overlay: rgba(232, 224, 213, 0.85);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #2a2826;
                --text: #eee;
                --overlay: rgba(42, 40, 38, 0.85);
            }
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            width: 100dvw;
            height: 100dvh;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            pointer-events: none;
        }
        #game-canvas {
            pointer-events: auto;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .screen {
            pointer-events: none;
            background: var(--overlay);
            padding: 2.5rem 2rem;
            border-radius: 1.5rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-width: 85%;
            border: 1px solid rgba(128,128,128,0.2);
        }
        .screen button {
            pointer-events: auto;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: normal;
            letter-spacing: -0.03em;
            margin: 0 0 0.5rem 0;
        }
        p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin: 0 0 2rem 0;
        }
        .instructions {
            text-align: left;
            margin: 0 auto 2rem auto;
            display: inline-block;
            font-size: 0.85rem;
            line-height: 2;
        }
        button {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 1rem 2.5rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 2rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        #final-score {
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <canvas id="game-canvas"></canvas>
    
    <div id="ui-layer">
        <div id="title-screen" class="screen">
            <h1>The Last Impression</h1>
            <p>Sort the brushstrokes before the gallery closes.</p>
            <div class="instructions">
                <div><span style="color: #4a90e2; font-weight: bold;">←</span> Swipe Left for Blue</div>
                <div><span style="color: #e24a4a; font-weight: bold;">→</span> Swipe Right for Red</div>
                <div><span style="color: #e2c04a; font-weight: bold;">↓</span> Swipe Down for Yellow</div>
            </div>
            <br>
            <button data-smoke="start" id="start-btn">Start Painting</button>
        </div>
        
        <div id="game-over-screen" class="screen" style="display: none;">
            <h1>Gallery Closed</h1>
            <p>You sorted <span id="final-score">0</span> strokes.</p>
            <button data-smoke="restart" id="restart-btn">Paint Again</button>
        </div>
    </div>

    <script>
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d', { alpha: false });
        const gameCanvas = document.getElementById('game-canvas');
        const ctx = gameCanvas.getContext('2d');
        
        let width, height;
        let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        let state = 'title'; // title, playing, gameover
        let score = 0;
        let timeLeft = 60;
        let lastTime = 0;
        let shakeTime = 0;
        
        let currentStroke = null;
        let paintingStrokes = [];
        let flyingStrokes = [];
        let particles = [];
        let popups = [];
        
        // Audio
        let audioCtx = null;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {}

        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playCorrect() {
            playTone(400 + Math.random()*100, 'sine', 0.2, 0.1);
        }

        function playWrong() {
            playTone(150, 'sawtooth', 0.3, 0.1);
        }

        function vibrate(pattern) {
            try {
                if (navigator.vibrate) navigator.vibrate(pattern);
            } catch (e) {}
        }

        function generateLinenTexture(ctx, w, h) {
            let baseColor = isDark ? '#2a2826' : '#e8e0d5';
            let threadColor = isDark ? '#ffffff' : '#000000';
            
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, w, h);
            
            ctx.globalAlpha = isDark ? 0.03 : 0.05;
            ctx.fillStyle = threadColor;
            for (let i = 0; i < w; i += 4) {
                ctx.fillRect(i, 0, 1, h);
            }
            for (let i = 0; i < h; i += 4) {
                ctx.fillRect(0, i, w, 1);
            }
            ctx.globalAlpha = 1.0;
        }

        function createStrokeCanvas(color, length, thickness) {
            let canvas = document.createElement('canvas');
            canvas.width = length + thickness * 2;
            canvas.height = thickness * 2;
            let sCtx = canvas.getContext('2d');
            
            sCtx.translate(canvas.width / 2, canvas.height / 2);
            sCtx.globalAlpha = 0.85;
            
            let bristles = 7;
            for (let i = 0; i < bristles; i++) {
                let oy = (Math.random() - 0.5) * thickness;
                let ox = (Math.random() - 0.5) * length * 0.2;
                let l = length * (0.7 + Math.random() * 0.3);
                let t = thickness * (0.15 + Math.random() * 0.2);
                
                sCtx.beginPath();
                sCtx.lineCap = 'round';
                sCtx.lineWidth = t;
                sCtx.strokeStyle = color;
                sCtx.moveTo(-l/2 + ox, oy);
                sCtx.lineTo(l/2 + ox, oy);
                sCtx.stroke();
            }
            return canvas;
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            bgCanvas.width = width;
            bgCanvas.height = height;
            gameCanvas.width = width;
            gameCanvas.height = height;
            
            generateLinenTexture(bgCtx, width, height);
            
            paintingStrokes.forEach(s => {
                bgCtx.save();
                bgCtx.translate(s.x, s.y);
                bgCtx.rotate(s.angle);
                bgCtx.scale(s.scale, s.scale);
                bgCtx.drawImage(s.canvas, -s.canvas.width / 2, -s.canvas.height / 2);
                bgCtx.restore();
            });
        }

        window.addEventListener('resize', resize);
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                isDark = e.matches;
                resize();
            });
        }

        function spawnStroke() {
            let difficulty = Math.min(1, score / 40);
            let binIndex = Math.floor(Math.random() * 3);
            
            let baseHues = [210, 350, 45]; // Blue, Red, Yellow
            let maxShift = 35 * difficulty;
            let hueShift = (Math.random() * 2 - 1) * maxShift;
            let hue = (baseHues[binIndex] + hueShift + 360) % 360;
            
            let sat = 65 + Math.random() * 25;
            let lit = 45 + Math.random() * 20;
            let color = `hsl(${hue}, ${sat}%, ${lit}%)`;
            
            currentStroke = {
                bin: binIndex,
                color: color,
                canvas: createStrokeCanvas(color, 120, 40),
                x: width / 2,
                y: height / 2,
                angle: (Math.random() - 0.5) * Math.PI * 0.5,
                scale: 0,
                vx: 0,
                vy: 0
            };
        }

        function addStrokeToPainting(stroke) {
            let px, py;
            if (stroke.bin === 0) { // Blue -> Sky
                px = Math.random() * width;
                py = Math.random() * (height * 0.5);
            } else if (stroke.bin === 2) { // Yellow -> Sun/Field
                if (Math.random() > 0.5) {
                    px = width * 0.7 + (Math.random() - 0.5) * 120;
                    py = height * 0.3 + (Math.random() - 0.5) * 120;
                } else {
                    px = Math.random() * width;
                    py = height * 0.5 + Math.random() * (height * 0.5);
                }
            } else { // Red -> Sun edges/Flowers
                if (Math.random() > 0.5) {
                    px = width * 0.7 + (Math.random() - 0.5) * 150;
                    py = height * 0.3 + (Math.random() - 0.5) * 150;
                } else {
                    px = Math.random() * width;
                    py = height * 0.6 + Math.random() * (height * 0.4);
                }
            }
            
            let s = {
                canvas: stroke.canvas,
                x: px,
                y: py,
                angle: Math.random() * Math.PI,
                scale: 0.5 + Math.random() * 0.5
            };
            paintingStrokes.push(s);
            
            bgCtx.save();
            bgCtx.translate(s.x, s.y);
            bgCtx.rotate(s.angle);
            bgCtx.scale(s.scale, s.scale);
            bgCtx.drawImage(s.canvas, -s.canvas.width / 2, -s.canvas.height / 2);
            bgCtx.restore();
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: color
                });
            }
        }

        function spawnPopup(x, y, text, color) {
            popups.push({ x, y, text, color, life: 1 });
        }

        function swipe(dir) {
            if (!currentStroke) return;
            let stroke = currentStroke;
            stroke.isCorrect = (dir === stroke.bin);
            
            let targetX = width / 2;
            let targetY = height / 2;
            if (dir === 0) { targetX = 60; targetY = height / 2; }
            if (dir === 1) { targetX = width - 60; targetY = height / 2; }
            if (dir === 2) { targetX = width / 2; targetY = height - 60; }
            
            let dx = targetX - stroke.x;
            let dy = targetY - stroke.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 0) {
                stroke.vx = (dx / dist) * 30;
                stroke.vy = (dy / dist) * 30;
            }
            
            flyingStrokes.push(stroke);
            
            if (stroke.isCorrect) {
                score++;
                addStrokeToPainting(stroke);
                vibrate(10);
                playCorrect();
            } else {
                timeLeft -= 3;
                shakeTime = 15;
                vibrate([30, 40, 30]);
                playWrong();
                spawnPopup(width / 2, height / 2 - 50, "-3s", "#f44");
            }
            spawnStroke();
        }

        // Input Handling
        let touchStartX = 0;
        let touchStartY = 0;
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        window.addEventListener('pointerdown', e => {
            if (state !== 'playing') return;
            if (e.target.tagName === 'BUTTON') return;
            isDragging = true;
            touchStartX = e.clientX;
            touchStartY = e.clientY;
            dragOffsetX = 0;
            dragOffsetY = 0;
        });

        window.addEventListener('pointermove', e => {
            if (!isDragging || state !== 'playing') return;
            dragOffsetX = e.clientX - touchStartX;
            dragOffsetY = e.clientY - touchStartY;
        });

        window.addEventListener('pointerup', e => {
            if (!isDragging || state !== 'playing') return;
            isDragging = false;
            
            let dist = Math.hypot(dragOffsetX, dragOffsetY);
            if (dist > 30) {
                if (Math.abs(dragOffsetX) > Math.abs(dragOffsetY)) {
                    if (dragOffsetX < 0) swipe(0);
                    else swipe(1);
                } else {
                    if (dragOffsetY > 0) swipe(2);
                }
            }
            dragOffsetX = 0;
            dragOffsetY = 0;
        });

        window.addEventListener('keydown', e => {
            if (state !== 'playing') return;
            if (e.key === 'ArrowLeft') swipe(0);
            if (e.key === 'ArrowRight') swipe(1);
            if (e.key === 'ArrowDown') swipe(2);
        });

        // Prevent default touch behaviors
        document.addEventListener('touchstart', e => {
            if (e.target.tagName !== 'BUTTON') e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchmove', e => {
            e.preventDefault();
        }, { passive: false });

        function drawBin(ctx, x, y, color, label) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(0, 0, 42, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.15;
            ctx.beginPath();
            ctx.arc(0, 0, 34, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = isDark ? '#fff' : '#000';
            ctx.font = 'bold 22px ui-monospace, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 0, 2);
            
            ctx.restore();
        }

        function gameOver() {
            state = 'gameover';
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'block';
            ctx.clearRect(0, 0, width, height);
        }

        function start() {
            state = 'playing';
            score = 0;
            timeLeft = 60;
            paintingStrokes = [];
            flyingStrokes = [];
            particles = [];
            popups = [];
            
            generateLinenTexture(bgCtx, width, height);
            spawnStroke();
            lastTime = performance.now();
        }

        function loop(time) {
            requestAnimationFrame(loop);
            
            if (state !== 'playing') return;
            
            let dt = (time - lastTime) / 1000;
            lastTime = time;
            
            timeLeft -= dt;
            if (timeLeft <= 0) {
                timeLeft = 0;
                gameOver();
                return;
            }
            
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            
            if (shakeTime > 0) {
                let sx = (Math.random() - 0.5) * 10;
                let sy = (Math.random() - 0.5) * 10;
                ctx.translate(sx, sy);
                shakeTime--;
            }
            
            // Draw Bins
            drawBin(ctx, 60, height / 2, `hsl(210, 80%, 60%)`, '←');
            drawBin(ctx, width - 60, height / 2, `hsl(350, 80%, 60%)`, '→');
            drawBin(ctx, width / 2, height - 60, `hsl(45, 90%, 60%)`, '↓');
            
            // Update and Draw Flying Strokes
            for (let i = flyingStrokes.length - 1; i >= 0; i--) {
                let s = flyingStrokes[i];
                s.x += s.vx;
                s.y += s.vy;
                s.scale *= 0.85;
                
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.rotate(s.angle);
                ctx.scale(s.scale, s.scale);
                ctx.drawImage(s.canvas, -s.canvas.width / 2, -s.canvas.height / 2);
                ctx.restore();
                
                if (s.scale < 0.1 || s.x < -50 || s.x > width + 50 || s.y > height + 50) {
                    if (s.isCorrect) {
                        let bx = s.bin === 0 ? 60 : (s.bin === 1 ? width - 60 : width / 2);
                        let by = s.bin === 0 ? height / 2 : (s.bin === 1 ? height / 2 : height - 60);
                        spawnParticles(bx, by, s.color);
                    }
                    flyingStrokes.splice(i, 1);
                }
            }
            
            // Update and Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
                else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5 * p.life, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1.0;
            
            // Current Stroke
            if (currentStroke) {
                if (isDragging) {
                    currentStroke.x += (width / 2 + dragOffsetX - currentStroke.x) * 0.4;
                    currentStroke.y += (height / 2 + dragOffsetY - currentStroke.y) * 0.4;
                } else {
                    currentStroke.x += (width / 2 - currentStroke.x) * 0.2;
                    currentStroke.y += (height / 2 - currentStroke.y) * 0.2;
                }
                currentStroke.scale += (1 - currentStroke.scale) * 0.2;
                
                ctx.save();
                ctx.translate(currentStroke.x, currentStroke.y);
                ctx.rotate(currentStroke.angle);
                ctx.scale(currentStroke.scale, currentStroke.scale);
                ctx.drawImage(currentStroke.canvas, -currentStroke.canvas.width / 2, -currentStroke.canvas.height / 2);
                ctx.restore();
            }
            
            // Popups
            for (let i = popups.length - 1; i >= 0; i--) {
                let p = popups[i];
                p.y -= 1;
                p.life -= 0.02;
                if (p.life <= 0) popups.splice(i, 1);
                else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.font = 'bold 20px ui-monospace, monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.text, p.x, p.y);
                }
            }
            ctx.globalAlpha = 1.0;
            
            // UI Layer (Timer and Score)
            let barWidth = width - 40;
            ctx.fillStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
            ctx.fillRect(20, 20, barWidth, 6);
            
            let timeRatio = timeLeft / 60;
            ctx.fillStyle = timeLeft > 10 ? (isDark ? '#fff' : '#000') : '#f44';
            ctx.fillRect(20, 20, barWidth * timeRatio, 6);
            
            ctx.fillStyle = isDark ? '#fff' : '#000';
            ctx.font = 'bold 28px ui-monospace, monospace';
            ctx.textAlign = 'center';
            ctx.fillText(score, width / 2, 65);
            
            ctx.restore();
        }

        // Init
        resize();
        
        document.getElementById('start-btn').addEventListener('click', () => {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('title-screen').style.display = 'none';
            start();
        });
        
        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').style.display = 'none';
            start();
        });
        
        requestAnimationFrame(loop);
    </script>
</body>
</html>
