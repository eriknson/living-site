<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evacuation</title>
<style>
  :root {
    --bg: #f9f8f5;
    --fg: #1a1815;
    --accent: #d34522;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1815;
      --fg: #f9f8f5;
      --accent: #ff6b3d;
    }
  }
  body, html {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0; left: 0;
    z-index: 1;
    touch-action: none;
  }
  #ui {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
  }
  #menu, #gameover {
    pointer-events: auto;
    margin: auto;
    text-align: center;
    background: var(--bg);
    padding: 2.5rem;
    border-radius: 1.5rem;
    border: 1px solid color-mix(in srgb, var(--fg) 15%, transparent);
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    max-width: 80%;
  }
  @media (prefers-color-scheme: dark) {
    #menu, #gameover {
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
  }
  h1 {
    margin: 0 0 1rem 0;
    font-size: 2rem;
    letter-spacing: 0.1em;
  }
  p {
    margin: 0 0 1.5rem 0;
    line-height: 1.6;
    opacity: 0.8;
  }
  button {
    pointer-events: auto;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: bold;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 1rem 2.5rem;
    border-radius: 2rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s;
    box-shadow: 0 4px 15px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  button:active {
    transform: scale(0.95);
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    font-size: 1.5rem;
    font-weight: bold;
    pointer-events: none;
  }
  .hud-box {
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="hud" style="display:none;">
    <div class="hud-box">SAVED: <span id="score">000</span></div>
    <div class="hud-box">T-MINUS: <span id="time">60</span></div>
  </div>
  
  <div id="menu">
    <h1>EVACUATION</h1>
    <p>Pulse corridors through the fire.<br>Tap in rhythm to the beat.</p>
    <button data-smoke="start" id="startBtn">START</button>
  </div>
  
  <div id="gameover" style="display:none;">
    <h1>ROUTES SEALED</h1>
    <p>Nodes Secured: <span id="finalScore">0</span></p>
    <button data-smoke="restart" id="restartBtn">RESTART</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  
  let isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  // Game State
  let playing = false;
  let score = 0;
  let timeRemaining = 60;
  let bpm = 80;
  let currentBeat = 0;
  let lastMetronomeBeat = -1;
  let lastTime = 0;
  
  let currentRoute = null;
  let lastRouteEnd = null;
  let fires = [];
  let particles = [];
  
  // Audio State
  let audioCtx = null;
  const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
  
  function initAudio() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext && !audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    } catch (e) {
      console.warn("Audio not supported");
    }
  }

  function playTone(freq, type, dur, vol) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch(e){}
  }

  function playChime(isPerfect) {
    const freq = scale[Math.floor(Math.random() * scale.length)];
    playTone(freq, 'sine', 0.8, isPerfect ? 0.3 : 0.15);
    if (isPerfect) playTone(freq * 2, 'sine', 0.6, 0.1);
  }

  function playKick() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(100, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } catch(e){}
  }

  function playMiss() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(80, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 400;
      
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch(e){}
  }

  let bgCanvas, bgCtx;
  function generateBackground() {
    if (!bgCanvas) {
      bgCanvas = document.createElement('canvas');
      bgCtx = bgCanvas.getContext('2d');
    }
    bgCanvas.width = canvas.width;
    bgCanvas.height = canvas.height;
    
    bgCtx.fillStyle = isDarkMode ? '#1a1815' : '#f9f8f5';
    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
    
    bgCtx.strokeStyle = isDarkMode ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.04)';
    bgCtx.lineWidth = 1;
    
    const cx = bgCanvas.width / 2;
    const cy = bgCanvas.height / 2;
    
    for (let r = 50; r < Math.max(bgCanvas.width, bgCanvas.height); r += 40) {
      bgCtx.beginPath();
      for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.2) {
        const noise = Math.sin(a * 3) * 15;
        const x = cx + Math.cos(a) * (r + noise);
        const y = cy + Math.sin(a) * (r + noise);
        if (a === 0) bgCtx.moveTo(x, y);
        else bgCtx.lineTo(x, y);
      }
      bgCtx.stroke();
    }
  }

  function initFires() {
    fires = [];
    const numFires = 12;
    for(let i=0; i<numFires; i++) {
      const angle = (i/numFires) * Math.PI * 2;
      const dist = Math.min(canvas.width, canvas.height) * 0.6;
      fires.push({
        angle,
        dist,
        baseRadius: 60 + Math.random() * 40,
        growth: 0.8
      });
    }
  }

  function setScore(s) {
    score = s;
    document.getElementById('score').innerText = String(s).padStart(3, '0');
  }

  function setTime(t) {
    document.getElementById('time').innerText = Math.ceil(t);
  }

  function startGame() {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameover').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    
    playing = true;
    timeRemaining = 60;
    bpm = 80;
    currentBeat = 0;
    lastMetronomeBeat = -1;
    currentRoute = null;
    lastRouteEnd = null;
    particles = [];
    
    setScore(0);
    setTime(60);
    initFires();
    initAudio();
    generateBackground();
  }

  function endGame() {
    playing = false;
    document.getElementById('hud').style.display = 'none';
    document.getElementById('gameover').style.display = 'block';
    document.getElementById('finalScore').innerText = score;
  }

  function generateRoute(startBeat) {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const maxDist = Math.min(canvas.width, canvas.height) * 0.45;
    
    let startX = lastRouteEnd ? lastRouteEnd.x : cx;
    let startY = lastRouteEnd ? lastRouteEnd.y : cy;
    
    if (Math.hypot(startX - cx, startY - cy) > maxDist * 0.8) {
      startX = cx;
      startY = cy;
    }
    
    const angle = Math.random() * Math.PI * 2;
    const ex = cx + Math.cos(angle) * maxDist;
    const ey = cy + Math.sin(angle) * maxDist;
    
    const dx = ex - startX;
    const dy = ey - startY;
    
    const midX = startX + dx * 0.5;
    const midY = startY + dy * 0.5;
    const perpX = -dy * 0.3 * (Math.random() > 0.5 ? 1 : -1);
    const perpY = dx * 0.3 * (Math.random() > 0.5 ? 1 : -1);
    
    const ctrl1x = midX + perpX;
    const ctrl1y = midY + perpY;
    
    let patterns = [[1, 2, 3, 4], [1, 2, 3], [1, 2.5, 3, 4]];
    if (bpm > 100) patterns.push([1, 1.5, 2.5, 3.5, 4], [1, 1.5, 2, 3, 4]);
    if (bpm > 120) patterns.push([1, 2, 2.5, 3.5, 4], [0.5, 1.5, 2.5, 3.5, 4]);
    
    const beats = patterns[Math.floor(Math.random() * patterns.length)];
    const totalBeats = beats[beats.length-1];
    
    const nodes = beats.map(b => {
      const t = b / totalBeats;
      const x = Math.pow(1-t, 2)*startX + 2*(1-t)*t*ctrl1x + Math.pow(t, 2)*ex;
      const y = Math.pow(1-t, 2)*startY + 2*(1-t)*t*ctrl1y + Math.pow(t, 2)*ey;
      return { beatOffset: b, x, y, state: 0 };
    });
    
    currentRoute = { startX, startY, ex, ey, ctrl1x, ctrl1y, nodes, startBeatTime: startBeat, totalBeats };
    lastRouteEnd = { x: ex, y: ey };
  }

  function spawnParticles(x, y, type) {
    const color = type > 0 ? (isDarkMode ? '#4ae8c4' : '#006655') : '#ff3300';
    const count = type === 2 ? 15 : 8;
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12,
        life: 1.0,
        color
      });
    }
  }

  function update(time) {
    requestAnimationFrame(update);
    if (!lastTime) { lastTime = time; return; }
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;
    
    if (playing) {
      timeRemaining -= dt;
      setTime(Math.max(0, timeRemaining));
      
      if (timeRemaining <= 0) {
        endGame();
        return;
      }
      
      bpm = 80 + ((60 - timeRemaining) / 60) * 60; 
      const bps = bpm / 60;
      currentBeat += dt * bps;
      
      const beatInt = Math.floor(currentBeat);
      if (beatInt > lastMetronomeBeat) {
        lastMetronomeBeat = beatInt;
        playKick();
      }
      
      fires.forEach(f => {
        f.growth += dt * 0.03 * (bpm / 80);
      });
      
      if (!currentRoute) {
        generateRoute(Math.ceil(currentBeat));
      } else {
        const routeElapsedBeats = currentBeat - currentRoute.startBeatTime;
        
        currentRoute.nodes.forEach(node => {
          if (node.state === 0 && routeElapsedBeats > node.beatOffset + 0.25) {
            node.state = -1;
            playMiss();
            fires.forEach(f => f.growth = Math.min(3.0, f.growth + 0.08));
            navigator.vibrate?.(50);
          }
        });
        
        if (routeElapsedBeats > currentRoute.totalBeats + 0.5) {
          const hits = currentRoute.nodes.filter(n => n.state > 0).length;
          if (hits > 0) {
            setScore(score + hits);
            fires.forEach(f => f.growth = Math.max(0.5, f.growth - (hits * 0.04)));
          }
          currentRoute = null;
        }
      }
    }
    
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);
    
    const beatPulse = playing ? Math.max(0, 1 - (currentBeat % 1.0) * 4) * 0.05 : 0;
    
    ctx.globalCompositeOperation = isDarkMode ? 'screen' : 'multiply';
    fires.forEach(f => {
      const x = canvas.width/2 + Math.cos(f.angle) * f.dist;
      const y = canvas.height/2 + Math.sin(f.angle) * f.dist;
      const rad = f.baseRadius * (f.growth + beatPulse);
      if (rad <= 0) return;
      
      const grad = ctx.createRadialGradient(x,y,0, x,y,rad);
      if (isDarkMode) {
        grad.addColorStop(0, 'rgba(255, 80, 20, 0.5)');
        grad.addColorStop(0.5, 'rgba(255, 40, 0, 0.15)');
        grad.addColorStop(1, 'rgba(255, 40, 0, 0)');
      } else {
        grad.addColorStop(0, 'rgba(220, 50, 10, 0.6)');
        grad.addColorStop(0.5, 'rgba(200, 30, 10, 0.2)');
        grad.addColorStop(1, 'rgba(200, 30, 10, 0)');
      }
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x,y,rad, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';
    
    if (currentRoute) {
      ctx.strokeStyle = isDarkMode ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(currentRoute.startX, currentRoute.startY);
      ctx.quadraticCurveTo(currentRoute.ctrl1x, currentRoute.ctrl1y, currentRoute.ex, currentRoute.ey);
      ctx.stroke();
      
      const routeElapsedBeats = playing ? (currentBeat - currentRoute.startBeatTime) : 0;
      const t = Math.max(0, Math.min(1, routeElapsedBeats / currentRoute.totalBeats));
      
      if (t > 0) {
        ctx.strokeStyle = isDarkMode ? '#4ae8c4' : '#006655';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(currentRoute.startX, currentRoute.startY);
        for(let i=0.01; i<=t; i+=0.01) {
          const px = Math.pow(1-i, 2)*currentRoute.startX + 2*(1-i)*i*currentRoute.ctrl1x + Math.pow(i, 2)*currentRoute.ex;
          const py = Math.pow(1-i, 2)*currentRoute.startY + 2*(1-i)*i*currentRoute.ctrl1y + Math.pow(i, 2)*currentRoute.ey;
          ctx.lineTo(px, py);
        }
        ctx.stroke();
        
        const px = Math.pow(1-t, 2)*currentRoute.startX + 2*(1-t)*t*currentRoute.ctrl1x + Math.pow(t, 2)*currentRoute.ex;
        const py = Math.pow(1-t, 2)*currentRoute.startY + 2*(1-t)*t*currentRoute.ctrl1y + Math.pow(t, 2)*currentRoute.ey;
        ctx.fillStyle = isDarkMode ? '#fff' : '#000';
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, Math.PI*2);
        ctx.fill();
      }
      
      currentRoute.nodes.forEach(node => {
        const timeToNode = node.beatOffset - routeElapsedBeats;
        
        ctx.lineWidth = 2;
        if (node.state === 0) {
          ctx.strokeStyle = isDarkMode ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.5)';
          ctx.fillStyle = 'transparent';
          
          if (timeToNode > 0 && timeToNode < 2) {
            const ringRad = 12 + timeToNode * 35;
            ctx.beginPath();
            ctx.arc(node.x, node.y, ringRad, 0, Math.PI*2);
            ctx.stroke();
          }
        } else if (node.state === 1 || node.state === 2) {
          ctx.strokeStyle = isDarkMode ? '#4ae8c4' : '#006655';
          ctx.fillStyle = isDarkMode ? '#4ae8c4' : '#006655';
        } else if (node.state === -1) {
          ctx.strokeStyle = '#ff3300';
          ctx.fillStyle = '#ff3300';
        }
        
        ctx.beginPath();
        ctx.arc(node.x, node.y, 10, 0, Math.PI*2);
        if (node.state > 0) ctx.fill();
        else ctx.stroke();
      });
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.04;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;
  }

  function handleInput(e) {
    if (e.target && e.target.tagName === 'BUTTON') return;
    if (e.cancelable && e.type !== 'keydown') e.preventDefault();
    if (!playing || !currentRoute) return;
    
    const routeElapsedBeats = currentBeat - currentRoute.startBeatTime;
    const bps = bpm / 60;
    const hitWindowBeats = 0.15 * bps;
    const perfectWindowBeats = 0.05 * bps;
    
    let closestNode = null;
    let minDst = Infinity;
    
    currentRoute.nodes.forEach(n => {
      if (n.state === 0) {
        const dst = Math.abs(routeElapsedBeats - n.beatOffset);
        if (dst < minDst) {
          minDst = dst;
          closestNode = n;
        }
      }
    });
    
    if (closestNode) {
      if (minDst <= perfectWindowBeats) {
        closestNode.state = 2;
        playChime(true);
        spawnParticles(closestNode.x, closestNode.y, 2);
        navigator.vibrate?.(10);
      } else if (minDst <= hitWindowBeats) {
        closestNode.state = 1;
        playChime(false);
        spawnParticles(closestNode.x, closestNode.y, 1);
        navigator.vibrate?.(10);
      } else if (routeElapsedBeats > closestNode.beatOffset - 0.5) {
        closestNode.state = -1;
        playMiss();
        spawnParticles(closestNode.x, closestNode.y, -1);
        fires.forEach(f => f.growth = Math.min(3.0, f.growth + 0.1));
        navigator.vibrate?.([30, 30]);
      }
    }
  }

  window.addEventListener('pointerdown', handleInput, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat) handleInput(e);
  });
  
  window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    isDarkMode = e.matches;
    generateBackground();
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    generateBackground();
    if (!playing && !currentRoute) {
      initFires();
      draw();
    }
  }
  window.addEventListener('resize', resize);
  
  // Init
  resize();
  requestAnimationFrame(update);
</script>
</body>
</html>
