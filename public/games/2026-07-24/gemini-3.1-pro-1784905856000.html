<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Bay Clear</title>
    <style>
        :root {
            --bg-color: #0c1622;
            --text-color: #eee;
            --btn-bg: #eee;
            --btn-text: #111;
            --btn-shadow: #bbb;
            --panel-bg: rgba(15, 25, 35, 0.95);
            --panel-border: rgba(255,255,255,0.1);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #cbd8dd;
                --text-color: #111;
                --btn-bg: #222;
                --btn-text: #fff;
                --btn-shadow: #000;
                --panel-bg: rgba(240, 248, 255, 0.95);
                --panel-border: rgba(0,0,0,0.1);
            }
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 20px max(20px, env(safe-area-inset-left));
            display: none;
            flex-direction: column;
            gap: 15px;
            font-size: 24px;
            font-weight: bold;
            z-index: 5;
        }
        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .wind-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            opacity: 0.9;
        }
        .wind-arrow {
            width: 24px;
            height: 2px;
            background: currentColor;
            transform-origin: left center;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .wind-arrow::after {
            content: '';
            position: absolute;
            right: -2px;
            top: -5px;
            border-left: 7px solid currentColor;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }
        .clarity-container {
            height: 8px;
            background: rgba(128,128,128,0.3);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }
        #clarity-fill {
            height: 100%;
            width: 100%;
            background: #6bbbe8;
            transition: width 0.1s linear, background-color 0.3s;
        }
        #overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .screen-content {
            background: var(--panel-bg);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            text-align: center;
            pointer-events: auto;
            max-width: 80vw;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 2.2rem;
            letter-spacing: -1px;
        }
        p {
            margin: 0 0 25px 0;
            font-size: 1.1rem;
            opacity: 0.85;
            line-height: 1.4;
        }
        .hints {
            font-size: 0.9rem;
            opacity: 0.6;
            margin-bottom: 35px;
        }
        button {
            pointer-events: auto;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--btn-shadow);
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 var(--btn-shadow);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div class="ui-header">
                <div id="score-display">0</div>
                <div class="wind-indicator">
                    <span>WIND</span>
                    <div id="wind-arrow" class="wind-arrow"></div>
                </div>
            </div>
            <div class="clarity-container">
                <div id="clarity-fill"></div>
            </div>
        </div>
        <div id="overlay-layer">
            <div id="title-screen" class="screen">
                <div class="screen-content">
                    <h1>Bay Clear</h1>
                    <p>Flick smoke plumes off the cliff before they blanket the bay.</p>
                    <p class="hints">Dense plumes require two flicks.<br>Chain hits for blue sky.</p>
                    <button data-smoke="start" id="start-btn">START GAME</button>
                </div>
            </div>
            <div id="game-over-screen" class="screen" style="display: none;">
                <div class="screen-content">
                    <h1>Bay Blanketed</h1>
                    <p>Visibility Lost.<br>Score: <span id="final-score">0</span></p>
                    <button data-smoke="restart" id="restart-btn">PLAY AGAIN</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let lastTime = 0;
        let gameState = 'title'; // title, playing, gameover
        let score = 0;
        let visibility = 100;
        let gameTime = 0;
        
        let plumes = [];
        let particles = [];
        let swipeTrail = [];
        let fogLines = [];
        
        let pointerDown = false;
        let currentStrokeHits = new Set();
        let combo = 0;
        let flashTimer = 0;
        
        let windAngle = -Math.PI/2;
        let targetWindAngle = -Math.PI/2;
        let windTimer = 0;
        
        let spawnTimer = 0;
        let currentSpawnInterval = 1800;

        const colors = {
            light: {
                skyTop: '#8baebf',
                skyBot: '#cbd8dd',
                skyClear: '#6bbbe8',
                bridge: '#6b605d',
                smoke1: 'rgba(150, 150, 150, 0.7)',
                smoke2: 'rgba(100, 100, 100, 0.9)',
                particle1: '150,150,150',
                particle2: '100,100,100'
            },
            dark: {
                skyTop: '#0c1622',
                skyBot: '#1a2835',
                skyClear: '#1c4a6b',
                bridge: '#080808',
                smoke1: 'rgba(180, 180, 180, 0.6)',
                smoke2: 'rgba(220, 220, 220, 0.8)',
                particle1: '200,200,200',
                particle2: '220,220,220'
            }
        };

        let currentColors = colors.light;

        function updateTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                currentColors = colors.dark;
            } else {
                currentColors = colors.light;
            }
        }
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
        }
        updateTheme();

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Re-init fog lines to cover new area
            fogLines = [];
            for (let i = 0; i < 25; i++) {
                fogLines.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    len: 50 + Math.random() * 150,
                    speed: 15 + Math.random() * 40,
                    opacity: Math.random() * 0.1 + 0.02
                });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function vibrate(pattern) {
            if (navigator.vibrate) {
                try { navigator.vibrate(pattern); } catch (e) {}
            }
        }

        function interpolateColor(c1, c2, t) {
            if (t <= 0) return c1;
            if (t >= 1) return c2;
            const h2r = hex => parseInt(hex.slice(1, 3), 16);
            const h2g = hex => parseInt(hex.slice(3, 5), 16);
            const h2b = hex => parseInt(hex.slice(5, 7), 16);
            const r = Math.round(h2r(c1) * (1 - t) + h2r(c2) * t);
            const g = Math.round(h2g(c1) * (1 - t) + h2g(c2) * t);
            const b = Math.round(h2b(c1) * (1 - t) + h2b(c2) * t);
            return `rgb(${r},${g},${b})`;
        }

        function spawnPlume() {
            const isDense = Math.random() < (0.2 + Math.min(0.5, gameTime / 180));
            const radius = 45 + Math.random() * 40;
            const x = Math.random() * width;
            const y = height + radius + 20;
            
            let puffs = [];
            for(let i=0; i<4; i++) {
                puffs.push({
                    ox: (Math.random()-0.5)*radius*0.7,
                    oy: (Math.random()-0.5)*radius*0.7,
                    r: radius * (0.5 + Math.random()*0.5)
                });
            }
            
            plumes.push({
                id: Math.random().toString(),
                x, y,
                vx: (Math.random() - 0.5) * 40,
                vy: -30 - Math.random() * 40,
                radius,
                puffs,
                hp: isDense ? 2 : 1,
                maxHp: isDense ? 2 : 1,
                flashDamageTimer: 0,
                dead: false
            });
        }

        function createParticles(x, y, radius, density, count = 10) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 180 + 40;
                particles.push({
                    x: x + Math.cos(angle) * (Math.random() * radius * 0.6),
                    y: y + Math.sin(angle) * (Math.random() * radius * 0.6),
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 1.5 + 0.8,
                    size: Math.random() * 25 + 10,
                    density
                });
            }
        }

        function lineCircleIntersect(p1, p2, circle) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const lenSq = dx * dx + dy * dy;
            let t = 0;
            if (lenSq > 0) {
                t = ((circle.x - p1.x) * dx + (circle.y - p1.y) * dy) / lenSq;
                t = Math.max(0, Math.min(1, t));
            }
            const cx = p1.x + t * dx;
            const cy = p1.y + t * dy;
            const distSq = (circle.x - cx) * (circle.x - cx) + (circle.y - cy) * (circle.y - cy);
            return distSq <= circle.radius * circle.radius;
        }

        function checkCollisions(p1, p2, vx, vy, speed) {
            for (let plume of plumes) {
                if (currentStrokeHits.has(plume.id)) continue;
                
                if (lineCircleIntersect(p1, p2, plume)) {
                    currentStrokeHits.add(plume.id);
                    plume.hp--;
                    
                    if (plume.hp <= 0) {
                        plume.dead = true;
                        score += (10 * (1 + combo));
                        combo++;
                        visibility = Math.min(100, visibility + 4 + combo * 2);
                        createParticles(plume.x, plume.y, plume.radius, plume.maxHp, 15);
                        
                        if (combo >= 2) {
                            flashTimer = 0.6;
                            vibrate([15, 30, 15]);
                        } else {
                            vibrate(15);
                        }
                    } else {
                        plume.flashDamageTimer = 0.15;
                        const boost = Math.min(1600, 600 + speed * 12);
                        plume.vx += (vx / speed) * boost;
                        plume.vy += (vy / speed) * boost;
                        createParticles(plume.x, plume.y, plume.radius * 0.5, 1, 5);
                        vibrate(10);
                    }
                }
            }
        }

        function handlePointerMove(e) {
            if (gameState !== 'playing' || !pointerDown) return;
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (x === undefined || y === undefined) return;
            
            swipeTrail.push({x, y, time: performance.now()});
            
            if (swipeTrail.length >= 2) {
                const p1 = swipeTrail[swipeTrail.length - 2];
                const p2 = swipeTrail[swipeTrail.length - 1];
                const vx = p2.x - p1.x;
                const vy = p2.y - p1.y;
                const speed = Math.hypot(vx, vy);
                if (speed > 2) {
                    checkCollisions(p1, p2, vx, vy, speed);
                }
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'playing') return;
            pointerDown = true;
            currentStrokeHits.clear();
            swipeTrail = [{x: e.clientX, y: e.clientY, time: performance.now()}];
        });
        canvas.addEventListener('pointermove', handlePointerMove);
        canvas.addEventListener('pointerup', () => { pointerDown = false; combo = 0; });
        canvas.addEventListener('pointercancel', () => { pointerDown = false; combo = 0; });
        
        // Prevent default touch actions to avoid scrolling
        canvas.addEventListener('touchstart', (e) => e.preventDefault(), {passive: false});
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), {passive: false});

        function startGame() {
            gameState = 'playing';
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            
            score = 0;
            visibility = 100;
            gameTime = 0;
            plumes = [];
            particles = [];
            swipeTrail = [];
            spawnTimer = 500;
            currentSpawnInterval = 1600;
            combo = 0;
            flashTimer = 0;
            
            windAngle = -Math.PI/2;
            targetWindAngle = -Math.PI/2;
            windTimer = 0;
        }

        function gameOver() {
            gameState = 'gameover';
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('final-score').innerText = Math.floor(score);
            vibrate([50, 100, 50, 100, 200]);
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        function updateGame(dt) {
            gameTime += dt;
            spawnTimer -= dt * 1000;
            if (spawnTimer <= 0) {
                spawnPlume();
                spawnTimer = currentSpawnInterval;
                currentSpawnInterval = Math.max(350, currentSpawnInterval - 15);
            }
            
            windTimer += dt;
            if (windTimer >= 10) {
                windTimer = 0;
                targetWindAngle = -Math.PI/2 + (Math.random() - 0.5) * Math.PI * 0.85;
            }
            
            let diff = targetWindAngle - windAngle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            windAngle += diff * 0.5 * dt;
            
            const windArrow = document.getElementById('wind-arrow');
            if (windArrow) {
                windArrow.style.transform = `rotate(${windAngle}rad)`;
            }
            
            if (flashTimer > 0) flashTimer -= dt;
            
            visibility -= 1.0 * dt;
            
            const driftSpeed = 50 + Math.min(gameTime * 0.6, 70);
            
            for (let i = plumes.length - 1; i >= 0; i--) {
                let plume = plumes[i];
                if (plume.flashDamageTimer > 0) plume.flashDamageTimer -= dt;
                
                const targetVx = Math.cos(windAngle) * 90;
                const targetVy = Math.sin(windAngle) * 90 - driftSpeed;
                
                plume.vx += (targetVx - plume.vx) * 3 * dt;
                plume.vy += (targetVy - plume.vy) * 3 * dt;
                
                plume.x += plume.vx * dt;
                plume.y += plume.vy * dt;
                
                if (plume.x < plume.radius) {
                    plume.x = plume.radius;
                    plume.vx *= -0.5;
                } else if (plume.x > width - plume.radius) {
                    plume.x = width - plume.radius;
                    plume.vx *= -0.5;
                }
                
                if (plume.y > height + plume.radius + 50) {
                    plume.y = height + plume.radius + 50;
                    plume.vy = -Math.abs(plume.vy);
                }
                
                if (plume.y < -plume.radius) {
                    visibility -= plume.hp * 18;
                    plume.dead = true;
                    vibrate([20, 50, 20]);
                }
                
                if (plume.dead) plumes.splice(i, 1);
            }
            
            visibility = Math.max(0, Math.min(100, visibility));
            document.getElementById('score-display').innerText = Math.floor(score);
            document.getElementById('clarity-fill').style.width = visibility + '%';
            
            if (visibility < 30) {
                document.getElementById('clarity-fill').style.background = '#e74c3c';
            } else {
                document.getElementById('clarity-fill').style.background = '#6bbbe8';
            }
            
            if (visibility <= 0) gameOver();
        }

        function drawBackground(ctx) {
            let gradient = ctx.createLinearGradient(0, 0, 0, height);
            let skyTop = currentColors.skyTop;
            if (flashTimer > 0) {
                let t = Math.min(1, flashTimer / 0.6);
                skyTop = interpolateColor(currentColors.skyTop, currentColors.skyClear, t);
            }
            gradient.addColorStop(0, skyTop);
            gradient.addColorStop(1, currentColors.skyBot);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = currentColors.bridge;
            ctx.lineWidth = Math.max(3, width * 0.005);
            ctx.beginPath();
            let tw = width * 0.02, th = height * 0.4;
            let tx1 = width * 0.25, tx2 = width * 0.75;
            let ty = height * 0.45;
            
            ctx.moveTo(0, ty + th*0.5); ctx.lineTo(width, ty + th*0.5);
            ctx.moveTo(tx1, ty); ctx.lineTo(tx1, ty + th);
            ctx.moveTo(tx2, ty); ctx.lineTo(tx2, ty + th);
            
            ctx.moveTo(0, ty);
            ctx.quadraticCurveTo(tx1/2, ty + th*0.35, tx1, ty);
            ctx.quadraticCurveTo(width/2, ty + th*0.45, tx2, ty);
            ctx.quadraticCurveTo(width - (width-tx2)/2, ty + th*0.35, width, ty);
            ctx.stroke();
            
            ctx.fillStyle = currentColors.bridge;
            ctx.beginPath();
            ctx.moveTo(0, height); ctx.lineTo(0, height * 0.75);
            ctx.quadraticCurveTo(width * 0.2, height * 0.8, width * 0.4, height);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(width, height); ctx.lineTo(width, height * 0.7);
            ctx.quadraticCurveTo(width * 0.8, height * 0.75, width * 0.6, height);
            ctx.fill();
            
            ctx.strokeStyle = `rgba(255,255,255, ${currentColors === colors.dark ? 0.05 : 0.15})`;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            for (let f of fogLines) {
                ctx.globalAlpha = f.opacity;
                ctx.beginPath();
                ctx.moveTo(f.x, f.y);
                ctx.lineTo(f.x - Math.cos(windAngle)*f.len, f.y - Math.sin(windAngle)*f.len);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
            
            if (gameState === 'playing') {
                let alpha = 1 - (visibility / 100);
                alpha = Math.max(0, Math.min(0.7, alpha));
                if (alpha > 0) {
                    ctx.fillStyle = `rgba(${currentColors === colors.dark ? '0,0,0' : '80,90,100'}, ${alpha})`;
                    ctx.fillRect(0, 0, width, height);
                }
            }
        }

        function drawPlumes(ctx) {
            for (let plume of plumes) {
                let isFlashing = plume.flashDamageTimer > 0;
                let colorStr = isFlashing ? 'rgba(255,255,255,1)' : (plume.maxHp === 2 ? (plume.hp === 2 ? currentColors.smoke2 : currentColors.smoke1) : currentColors.smoke1);
                let colorZeroAlpha = colorStr.replace(/[\d.]+\)$/g, '0)');
                
                for (let puff of plume.puffs) {
                    let sizeMult = (plume.maxHp === 2 && plume.hp === 1) ? 0.75 : 1.0;
                    let pr = puff.r * sizeMult;
                    let px = plume.x + puff.ox * sizeMult;
                    let py = plume.y + puff.oy * sizeMult;
                    
                    let grad = ctx.createRadialGradient(px, py, 0, px, py, pr);
                    grad.addColorStop(0, colorStr);
                    grad.addColorStop(1, colorZeroAlpha);
                    
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(px, py, pr, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function updateAndDrawParticles(ctx, dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.life -= p.decay * dt;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vx *= 0.94; 
                p.vy *= 0.94;
                
                let alpha = p.life * (p.density === 2 ? 0.8 : 0.5);
                let rgb = p.density === 2 ? currentColors.particle2 : currentColors.particle1;
                
                ctx.fillStyle = `rgba(${rgb}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawSwipe(ctx) {
            const now = performance.now();
            swipeTrail = swipeTrail.filter(pt => now - pt.time < 200);
            
            if (swipeTrail.length < 2) return;
            
            ctx.beginPath();
            ctx.moveTo(swipeTrail[0].x, swipeTrail[0].y);
            for (let i = 1; i < swipeTrail.length; i++) {
                ctx.lineTo(swipeTrail[i].x, swipeTrail[i].y);
            }
            
            ctx.strokeStyle = `rgba(255, 255, 255, ${currentColors === colors.dark ? 0.7 : 0.5})`;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            
            ctx.strokeStyle = `rgba(255, 255, 255, 1)`;
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function gameLoop(time) {
            requestAnimationFrame(gameLoop);
            const dt = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;
            
            // Update fog lines always
            for (let f of fogLines) {
                f.x += Math.cos(windAngle) * f.speed * dt;
                f.y += Math.sin(windAngle) * f.speed * dt;
                if (f.x > width + f.len) f.x = -f.len;
                if (f.x < -f.len) f.x = width + f.len;
                if (f.y > height + f.len) f.y = -f.len;
                if (f.y < -f.len) f.y = height + f.len;
            }

            if (gameState === 'playing') {
                updateGame(dt);
            }
            
            drawBackground(ctx);
            drawPlumes(ctx);
            updateAndDrawParticles(ctx, dt);
            drawSwipe(ctx);
        }

        requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });

    </script>
</body>
</html>
