<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ship by Sunrise</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1218;--fg:#e8f0f5;--muted:#7a9aab;--accent:#ff6b35;--accent2:#ffb347;
  --wire:#3dd6c8;--wire-dim:#1a5c55;--hud-bg:rgba(8,16,22,.72);--btn-bg:#ff6b35;
  --btn-fg:#0a1218;--danger:#ff4757;--success:#2ed573;--panel:rgba(10,18,24,.88)
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a1218;--fg:#e8f0f5;--muted:#7a9aab;--accent:#ff6b35;--accent2:#ffb347;
    --wire:#3dd6c8;--wire-dim:#1a5c55;--hud-bg:rgba(8,16,22,.72);--btn-bg:#ff6b35;
    --btn-fg:#0a1218;--danger:#ff4757;--success:#2ed573;--panel:rgba(10,18,24,.88)
  }
  .hud-block{border-color:rgba(255,255,255,.08)}
  .overlay{background:linear-gradient(180deg,rgba(10,18,24,.55) 0%,rgba(10,18,24,.82) 100%)}
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f5efe6;--fg:#1a2830;--muted:#5a7080;--accent:#e85d04;--accent2:#f48c06;
    --wire:#0d9488;--wire-dim:#99d4cf;--hud-bg:rgba(245,239,230,.78);--btn-bg:#e85d04;
    --btn-fg:#fff;--danger:#d63031;--success:#00b894;--panel:rgba(255,252,247,.92)
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:max(12px,env(safe-area-inset-top)) 16px 8px;pointer-events:none;z-index:2;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;letter-spacing:.04em}
.hud-block{display:flex;flex-direction:column;gap:2px;background:var(--hud-bg);padding:8px 12px;border-radius:6px;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08)}
@media(prefers-color-scheme:light){.hud-block{border-color:rgba(0,0,0,.06)}}
.hud-label{color:var(--muted);font-size:9px;text-transform:uppercase}
.hud-value{font-size:15px;font-weight:600}
.combo-flash{animation:comboPop .35s ease}
@keyframes comboPop{0%{transform:scale(1)}50%{transform:scale(1.15);color:var(--accent2)}100%{transform:scale(1)}}
#deployZone{position:absolute;left:0;right:0;bottom:0;height:38%;display:flex;align-items:center;
  justify-content:center;gap:12px;padding:0 16px max(20px,env(safe-area-inset-bottom));z-index:3;pointer-events:none}
.deploy-btn{pointer-events:auto;min-width:88px;min-height:88px;padding:12px 16px;border:none;border-radius:12px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13px;font-weight:700;letter-spacing:.06em;
  cursor:pointer;transition:transform .08s,box-shadow .15s,opacity .2s;position:relative;overflow:hidden;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.deploy-btn:active{transform:scale(.94)}
.deploy-main{background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 4px 24px rgba(255,107,53,.35);
  min-width:120px;min-height:120px;font-size:15px;border:2px solid rgba(255,255,255,.25)}
.deploy-main.ready{animation:deployPulse .6s ease infinite}
.deploy-main.hit-flash{animation:hitFlash .25s ease}
@keyframes hitFlash{0%{transform:scale(1)}40%{transform:scale(1.08);filter:brightness(1.3)}100%{transform:scale(1)}}
@keyframes deployPulse{0%,100%{box-shadow:0 4px 24px rgba(255,107,53,.35)}50%{box-shadow:0 4px 40px rgba(255,179,71,.65)}}
.deploy-fake{background:var(--panel);color:var(--muted);border:2px solid var(--wire-dim);box-shadow:none;font-size:11px;
  min-width:72px;min-height:72px;opacity:.85}
.deploy-fake.warn{color:var(--danger);border-color:var(--danger)}
.beat-ring{position:absolute;pointer-events:none;border:3px solid var(--accent2);border-radius:50%;
  transform:translate(-50%,-50%);opacity:0;z-index:1}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;z-index:10;pointer-events:none;padding:24px;text-align:center;
  background:linear-gradient(180deg,rgba(10,18,24,.55) 0%,rgba(10,18,24,.82) 100%)}
@media(prefers-color-scheme:light){
  .overlay{background:linear-gradient(180deg,rgba(245,239,230,.5) 0%,rgba(245,239,230,.88) 100%)}
}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(28px,8vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.1;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.overlay h2{font-size:clamp(22px,6vw,32px);font-weight:700}
.overlay p{color:var(--muted);font-size:14px;max-width:280px;line-height:1.5;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace}
.overlay .sub{font-size:12px;margin-top:-8px}
.smoke-btn{pointer-events:auto;min-height:52px;min-width:180px;padding:14px 32px;border:none;border-radius:10px;
  background:var(--btn-bg);color:var(--btn-fg);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  font-size:15px;font-weight:700;letter-spacing:.08em;cursor:pointer;
  box-shadow:0 6px 28px rgba(255,107,53,.4);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.smoke-btn:active{transform:scale(.96)}
.feedback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  font-size:clamp(18px,5vw,28px);font-weight:800;pointer-events:none;z-index:5;opacity:0;transition:opacity .1s}
.feedback.show{opacity:1;animation:fbPop .5s ease forwards}
@keyframes fbPop{0%{opacity:1;transform:translate(-50%,-50%) scale(.8)}30%{transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.feedback.perfect{color:var(--success)}
.feedback.good{color:var(--accent2)}
.feedback.miss{color:var(--danger)}
.pipeline-bar{position:absolute;top:50%;left:16px;right:16px;height:4px;transform:translateY(-80px);
  background:var(--wire-dim);border-radius:2px;overflow:hidden;pointer-events:none;z-index:2;opacity:.6}
.pipeline-fill{height:100%;width:0;background:linear-gradient(90deg,var(--wire),var(--accent2));border-radius:2px;
  transition:width .3s ease}
.beat-marker{position:absolute;top:-6px;width:14px;height:14px;border-radius:50%;background:var(--accent);
  transform:translateX(-50%);box-shadow:0 0 12px var(--accent);transition:left .05s linear}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div class="hud" id="hud">
    <div class="hud-block"><span class="hud-label">Sunrise</span><span class="hud-value" id="timerDisplay">0:50</span></div>
    <div class="hud-block" style="align-items:center"><span class="hud-label">Shipped</span><span class="hud-value" id="scoreDisplay">0</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Combo</span><span class="hud-value" id="comboDisplay">×0</span></div>
  </div>
  <div class="pipeline-bar"><div class="pipeline-fill" id="pipelineFill"></div><div class="beat-marker" id="beatMarker"></div></div>
  <div id="deployZone">
    <div id="ringHost" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
    <button class="deploy-btn deploy-fake" id="fakeLeft" type="button" hidden>Rollback</button>
    <button class="deploy-btn deploy-main" id="deployBtn" type="button">DEPLOY</button>
    <button class="deploy-btn deploy-fake warn" id="fakeRight" type="button" hidden>Force Push</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <div class="overlay" id="titleOverlay">
    <h1>Ship by Sunrise</h1>
    <p>Tap DEPLOY on the beat. Each ship lights a window in the wireframe city before dawn breaks.</p>
    <p class="sub">Space · tap center button · avoid decoys</p>
    <button class="smoke-btn" data-smoke="start" type="button">Start Pipeline</button>
  </div>
  <div class="overlay hidden" id="gameoverOverlay">
    <h2 id="endTitle">Sunrise</h2>
    <p id="endMessage">You shipped 0 features.</p>
    <p class="sub" id="endStats"></p>
    <button class="smoke-btn" data-smoke="restart" type="button">Ship Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('gameCanvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var timerEl = document.getElementById('timerDisplay');
var scoreEl = document.getElementById('scoreDisplay');
var comboEl = document.getElementById('comboDisplay');
var pipelineFill = document.getElementById('pipelineFill');
var beatMarker = document.getElementById('beatMarker');
var deployBtn = document.getElementById('deployBtn');
var fakeLeft = document.getElementById('fakeLeft');
var fakeRight = document.getElementById('fakeRight');
var feedbackEl = document.getElementById('feedback');
var titleOverlay = document.getElementById('titleOverlay');
var gameoverOverlay = document.getElementById('gameoverOverlay');
var endTitle = document.getElementById('endTitle');
var endMessage = document.getElementById('endMessage');
var endStats = document.getElementById('endStats');
var startBtn = document.querySelector('[data-smoke="start"]');
var restartBtn = document.querySelector('[data-smoke="restart"]');
var ringHost = document.getElementById('ringHost');
var deployZone = document.getElementById('deployZone');

var W = 360, H = 640;
var state = 'title';
var timeLeft = 50;
var score = 0;
var combo = 0;
var maxCombo = 0;
var bpm = 76;
var beatInterval = 60000 / bpm;
var nextBeatTime = 0;
var lastBeatTime = 0;
var beatActive = false;
var hitWindowPerfect = 90;
var hitWindowGood = 180;
var misses = 0;
var windows = [];
var particles = [];
var pipelines = [];
var shake = 0;
var audioCtx = null;
var rafId = 0;
var lastFrame = 0;
var gameStartTime = 0;
var deployReady = false;
var fakeLevel = 0;
var cityOffset = 0;
var beatGeneration = 0;
var lateTimer = null;

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t){ return a + (b - a) * t; }

function initAudio(){
  if(audioCtx) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(typeof AC !== 'undefined') audioCtx = new AC();
  }catch(e){}
}

function playTone(freq, dur, type, vol){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function playKick(){ playTone(80, 0.12, 'sine', 0.15); }
function playSuccess(){ playTone(523, 0.08, 'triangle', 0.1); setTimeout(function(){ playTone(784, 0.12, 'triangle', 0.08); }, 60); }
function playMiss(){ playTone(180, 0.2, 'sawtooth', 0.06); }
function playFake(){ playTone(120, 0.25, 'square', 0.05); }

function resize(){
  if(!canvas) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildCity();
}

function isLight(){
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
}

function buildCity(){
  pipelines = [];
  windows = [];
  var cols = Math.floor(W / 28) + 2;
  for(var i = 0; i < cols; i++){
    var bw = 18 + Math.random() * 22;
    var bh = 60 + Math.random() * 120;
    var bx = i * 26 - 10 + Math.random() * 8;
    pipelines.push({x: bx, w: bw, h: bh, lit: false, windows: []});
    var rows = Math.floor(bh / 14);
    for(var r = 0; r < rows; r++){
      if(Math.random() > 0.35){
        pipelines[pipelines.length - 1].windows.push({
          x: bx + 4 + Math.random() * (bw - 10),
          y: H * 0.52 - bh + r * 14 + 4,
          w: 6 + Math.random() * 4,
          h: 8,
          lit: false,
          glow: 0
        });
      }
    }
  }
}

function spawnBeatRing(){
  if(!ringHost || !deployBtn) return;
  var ring = document.createElement('div');
  ring.className = 'beat-ring';
  var rect = deployBtn.getBoundingClientRect();
  var hostRect = ringHost.getBoundingClientRect();
  ring.style.left = (rect.left + rect.width / 2 - hostRect.left) + 'px';
  ring.style.top = (rect.top + rect.height / 2 - hostRect.top) + 'px';
  ring.style.width = '40px';
  ring.style.height = '40px';
  ring.style.marginLeft = '-20px';
  ring.style.marginTop = '-20px';
  ringHost.appendChild(ring);
  var start = performance.now();
  function animRing(now){
    var t = clamp((now - start) / 600, 0, 1);
    var size = 40 + t * 100;
    ring.style.width = size + 'px';
    ring.style.height = size + 'px';
    ring.style.marginLeft = (-size / 2) + 'px';
    ring.style.marginTop = (-size / 2) + 'px';
    ring.style.opacity = String(1 - t);
    if(t < 1) requestAnimationFrame(animRing);
    else if(ring.parentNode) ring.parentNode.removeChild(ring);
  }
  requestAnimationFrame(animRing);
}

function setDeployEnabled(on){
  deployBtn.disabled = !on;
  fakeLeft.disabled = !on;
  fakeRight.disabled = !on;
  if(deployZone) deployZone.style.opacity = on ? '1' : '0.35';
}

function resetGame(){
  setDeployEnabled(true);
  timeLeft = 50;
  score = 0;
  combo = 0;
  maxCombo = 0;
  bpm = 76;
  beatInterval = 60000 / bpm;
  misses = 0;
  fakeLevel = 0;
  particles = [];
  shake = 0;
  beatActive = false;
  deployReady = false;
  gameStartTime = performance.now();
  nextBeatTime = gameStartTime + 1200;
  lastBeatTime = gameStartTime + 1200 - beatInterval;
  buildCity();
  updateHUD();
  hideFakes();
  deployBtn.classList.remove('ready');
  pipelineFill.style.width = '0%';
}

function hideFakes(){
  fakeLeft.hidden = true;
  fakeRight.hidden = true;
}

function showFakes(){
  if(fakeLevel >= 1) fakeLeft.hidden = false;
  if(fakeLevel >= 2) fakeRight.hidden = false;
  if(fakeLevel >= 1){
    var fakes = ['Rollback', 'Revert', 'Skip CI', 'Hotfix?', 'Cancel'];
    fakeLeft.textContent = fakes[Math.floor(Math.random() * fakes.length)];
  }
  if(fakeLevel >= 2){
    var fakes2 = ['Force Push', 'YOLO', '--no-verify', 'Skip Tests', 'Delete Prod'];
    fakeRight.textContent = fakes2[Math.floor(Math.random() * fakes2.length)];
  }
}

function updateHUD(){
  var m = Math.floor(timeLeft / 60);
  var s = Math.floor(timeLeft % 60);
  timerEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;
  scoreEl.textContent = String(score);
  comboEl.textContent = '×' + combo;
  pipelineFill.style.width = clamp((score / 20) * 100, 0, 100) + '%';
}

function showFeedback(text, cls){
  feedbackEl.textContent = text;
  feedbackEl.className = 'feedback show ' + (cls || '');
  clearTimeout(showFeedback._t);
  showFeedback._t = setTimeout(function(){
    feedbackEl.className = 'feedback';
  }, 500);
}

function addWindow(){
  var candidates = [];
  for(var i = 0; i < pipelines.length; i++){
    var b = pipelines[i];
    for(var j = 0; j < b.windows.length; j++){
      if(!b.windows[j].lit) candidates.push(b.windows[j]);
    }
  }
  if(!candidates.length) return;
  var w = candidates[Math.floor(Math.random() * candidates.length)];
  w.lit = true;
  w.glow = 1;
  for(var p = 0; p < 8; p++){
    particles.push({
      x: w.x + w.w / 2,
      y: w.y + w.h / 2,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 1.2) * 4,
      life: 1,
      color: isLight() ? '#f48c06' : '#ffb347'
    });
  }
}

function clearLateTimer(){
  if(lateTimer){ clearTimeout(lateTimer); lateTimer = null; }
}

function onBeat(now){
  lastBeatTime = nextBeatTime;
  nextBeatTime += beatInterval;
  beatActive = true;
  deployReady = true;
  deployBtn.classList.add('ready');
  playKick();
  spawnBeatRing();
  beatGeneration++;
  var gen = beatGeneration;
  clearLateTimer();
  lateTimer = setTimeout(function(){
    if(state === 'playing' && beatActive && gen === beatGeneration){
      registerMiss('LATE');
    }
  }, hitWindowGood + 20);
  if(score >= 4 && fakeLevel < 1){ fakeLevel = 1; showFakes(); }
  if(score >= 10 && fakeLevel < 2){ fakeLevel = 2; showFakes(); }
  if(score > 0 && score % 6 === 0 && bpm < 128){
    bpm += 4;
    beatInterval = 60000 / bpm;
  }
}

function registerHit(quality){
  if(state !== 'playing' || !beatActive) return;
  var now = performance.now();
  var delta = Math.abs(now - lastBeatTime);
  if(delta > hitWindowGood){ return; }
  clearLateTimer();
  beatActive = false;
  deployReady = false;
  deployBtn.classList.remove('ready');
  score++;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  addWindow();
  playSuccess();
  if(typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(12);
  showFeedback(quality === 'perfect' ? 'SHIPPED!' : 'DEPLOYED', quality === 'perfect' ? 'perfect' : 'good');
  deployBtn.classList.remove('hit-flash');
  void deployBtn.offsetWidth;
  deployBtn.classList.add('hit-flash');
  comboEl.classList.remove('combo-flash');
  void comboEl.offsetWidth;
  comboEl.classList.add('combo-flash');
  updateHUD();
}

function registerMiss(reason){
  if(state !== 'playing') return;
  if(!beatActive && reason !== 'FAKE') return;
  clearLateTimer();
  beatActive = false;
  deployReady = false;
  deployBtn.classList.remove('ready');
  combo = 0;
  misses++;
  timeLeft = Math.max(0, timeLeft - (reason === 'FAKE' ? 4 : 2.5));
  shake = 8;
  playMiss();
  if(typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate([20, 30, 20]);
  showFeedback(reason === 'FAKE' ? 'WRONG BTN' : 'MISS', 'miss');
  updateHUD();
  if(timeLeft <= 0) endGame();
}

function onDeployTap(){
  if(state !== 'playing') return;
  initAudio();
  if(!beatActive){
    registerMiss('OFF');
    return;
  }
  var now = performance.now();
  var delta = Math.abs(now - lastBeatTime);
  if(delta <= hitWindowPerfect) registerHit('perfect');
  else if(delta <= hitWindowGood) registerHit('good');
  else registerMiss('OFF');
}

function onFakeTap(){
  if(state !== 'playing') return;
  initAudio();
  registerMiss('FAKE');
}

function endGame(){
  state = 'gameover';
  beatActive = false;
  deployReady = false;
  clearLateTimer();
  deployBtn.classList.remove('ready');
  setDeployEnabled(false);
  endTitle.textContent = score >= 15 ? 'Shipped by Sunrise' : score >= 8 ? 'Dawn Breaks' : 'Sunrise';
  endMessage.textContent = 'You shipped ' + score + ' feature' + (score === 1 ? '' : 's') + ' across the skyline.';
  endStats.textContent = 'Best combo ×' + maxCombo + ' · ' + misses + ' miss' + (misses === 1 ? '' : 'es') + ' · ' + Math.round(bpm) + ' BPM peak';
  gameoverOverlay.classList.remove('hidden');
}

function startGame(){
  initAudio();
  titleOverlay.classList.add('hidden');
  gameoverOverlay.classList.add('hidden');
  state = 'playing';
  resetGame();
}

function drawSky(t){
  if(!ctx) return;
  var light = isLight();
  var horizon = H * 0.48;
  var prog = clamp(1 - timeLeft / 50, 0, 1);
  var g = ctx.createLinearGradient(0, 0, 0, horizon);
  if(light){
    g.addColorStop(0, lerpColor('#87CEEB', '#ffd89b', prog));
    g.addColorStop(0.55, lerpColor('#b8dff5', '#ffb088', prog));
    g.addColorStop(1, lerpColor('#f5efe6', '#ff6b35', prog * 0.7));
  }else{
    g.addColorStop(0, lerpColor('#0a1628', '#1a2840', prog));
    g.addColorStop(0.5, lerpColor('#142838', '#3d2a1a', prog));
    g.addColorStop(1, lerpColor('#1a3040', '#ff6b35', prog * 0.5));
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizon);

  var sunY = horizon - 20 - prog * 60;
  var sunG = ctx.createRadialGradient(W * 0.72, sunY, 0, W * 0.72, sunY, 50 + prog * 30);
  sunG.addColorStop(0, 'rgba(255,200,100,' + (0.25 + prog * 0.45) + ')');
  sunG.addColorStop(1, 'rgba(255,107,53,0)');
  ctx.fillStyle = sunG;
  ctx.fillRect(0, 0, W, horizon);

  ctx.fillStyle = light ? 'rgba(200,220,230,0.35)' : 'rgba(100,160,180,0.12)';
  for(var f = 0; f < 3; f++){
    var fx = ((t * 0.015 + f * 120) % (W + 100)) - 50;
    var fy = 40 + f * 35;
    ctx.beginPath();
    ctx.ellipse(fx, fy, 40 + f * 10, 12, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function lerpColor(c1, c2, t){
  var a = hexToRgb(c1), b = hexToRgb(c2);
  var r = Math.round(lerp(a.r, b.r, t));
  var g = Math.round(lerp(a.g, b.g, t));
  var bl = Math.round(lerp(a.b, b.b, t));
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

function hexToRgb(h){
  var n = parseInt(h.slice(1), 16);
  return {r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255};
}

function drawCity(t){
  if(!ctx) return;
  var light = isLight();
  var wire = light ? '#0d9488' : '#3dd6c8';
  var wireDim = light ? 'rgba(13,148,136,0.25)' : 'rgba(61,214,200,0.15)';
  var baseY = H * 0.52;
  cityOffset = Math.sin(t * 0.0008) * 2;

  ctx.strokeStyle = wireDim;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  ctx.lineTo(W, baseY);
  ctx.stroke();

  for(var i = 0; i < pipelines.length; i++){
    var b = pipelines[i];
    var bx = b.x + cityOffset;
    var by = baseY - b.h;
    ctx.strokeStyle = b.lit ? wire : wireDim;
    ctx.lineWidth = b.lit ? 1.5 : 1;
    ctx.strokeRect(bx, by, b.w, b.h);
    if(b.lit){
      ctx.fillStyle = light ? 'rgba(13,148,136,0.08)' : 'rgba(61,214,200,0.06)';
      ctx.fillRect(bx, by, b.w, b.h);
    }
    for(var j = 0; j < b.windows.length; j++){
      var w = b.windows[j];
      if(w.glow > 0) w.glow = Math.max(0, w.glow - 0.008);
      if(w.lit){
        var alpha = 0.5 + w.glow * 0.5;
        ctx.fillStyle = light ? 'rgba(244,140,6,' + alpha + ')' : 'rgba(255,179,71,' + alpha + ')';
        ctx.shadowColor = light ? '#f48c06' : '#ffb347';
        ctx.shadowBlur = 6 + w.glow * 10;
      }else{
        ctx.fillStyle = light ? 'rgba(90,112,128,0.2)' : 'rgba(122,154,171,0.15)';
        ctx.shadowBlur = 0;
      }
      ctx.fillRect(w.x + cityOffset, w.y, w.w, w.h);
      ctx.shadowBlur = 0;
    }
  }

  var gridY = baseY + 20;
  ctx.strokeStyle = wireDim;
  ctx.lineWidth = 0.5;
  for(var gx = 0; gx < W; gx += 30){
    ctx.beginPath();
    ctx.moveTo(gx + cityOffset, baseY);
    ctx.lineTo(gx - 40 + cityOffset, H);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(0, gridY);
  ctx.lineTo(W, gridY);
  ctx.stroke();
}

function drawParticles(){
  if(!ctx) return;
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life -= 0.025;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function drawRooftop(){
  if(!ctx) return;
  var light = isLight();
  var y = H * 0.78;
  ctx.strokeStyle = light ? '#0d9488' : '#3dd6c8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(W, y);
  ctx.stroke();
  var nodes = 5;
  for(var n = 0; n < nodes; n++){
    var nx = (n + 0.5) * W / nodes;
    var active = (score % nodes) === n || (state === 'playing' && beatActive && n === Math.floor((performance.now() - gameStartTime) / beatInterval) % nodes);
    ctx.beginPath();
    ctx.arc(nx, y, active ? 7 : 4, 0, Math.PI * 2);
    ctx.fillStyle = active ? (light ? '#e85d04' : '#ff6b35') : (light ? 'rgba(13,148,136,0.3)' : 'rgba(61,214,200,0.25)');
    ctx.fill();
    if(active){
      ctx.strokeStyle = light ? '#f48c06' : '#ffb347';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(nx, y);
      ctx.lineTo(nx, y - 30 - Math.sin(performance.now() * 0.008) * 5);
      ctx.stroke();
    }
  }
}

function updateBeatMarker(now){
  if(state !== 'playing' || !beatMarker) return;
  var phase = clamp((now - lastBeatTime) / beatInterval, 0, 1);
  beatMarker.style.left = (phase * 100) + '%';
  beatMarker.style.opacity = beatActive ? '1' : '0.35';
}

function loop(now){
  rafId = requestAnimationFrame(loop);
  var dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;

  if(state === 'playing'){
    timeLeft -= dt;
    if(timeLeft <= 0){ timeLeft = 0; updateHUD(); endGame(); }
    else updateHUD();

    while(now >= nextBeatTime && state === 'playing'){
      onBeat(now);
    }
  }

  updateBeatMarker(now);

  var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  var sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  if(shake > 0) shake *= 0.85;

  if(ctx){
    ctx.save();
    ctx.translate(sx, sy);
    drawSky(now);
    drawCity(now);
    drawRooftop();
    drawParticles();
    ctx.restore();
  }
}

function bindEvents(){
  if(startBtn) startBtn.addEventListener('click', function(e){ e.preventDefault(); startGame(); });
  if(restartBtn) restartBtn.addEventListener('click', function(e){ e.preventDefault(); startGame(); });

  if(deployBtn){
    deployBtn.addEventListener('click', function(e){ e.preventDefault(); onDeployTap(); });
    deployBtn.addEventListener('touchend', function(e){ e.preventDefault(); }, {passive: false});
  }
  if(fakeLeft){
    fakeLeft.addEventListener('click', function(e){ e.preventDefault(); onFakeTap(); });
  }
  if(fakeRight){
    fakeRight.addEventListener('click', function(e){ e.preventDefault(); onFakeTap(); });
  }

  document.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'Enter'){
      e.preventDefault();
      if(state === 'title' && startBtn) startBtn.click();
      else if(state === 'gameover' && restartBtn) restartBtn.click();
      else if(state === 'playing') onDeployTap();
    }
  });

  canvas.addEventListener('touchstart', function(e){
    if(state === 'playing') e.preventDefault();
  }, {passive: false});

  window.addEventListener('resize', resize);
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){});
  }
}

resize();
bindEvents();
setDeployEnabled(false);
lastFrame = performance.now();
rafId = requestAnimationFrame(loop);

})();
</script>
