<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Spinner</title>
<style>
  :root {
    --bg: #e2e8f0;
    --text: #0f172a;
    --glass-bg: rgba(255, 255, 255, 0.6);
    --glass-border: rgba(255, 255, 255, 0.8);
    --term-green: #059669;
    --danger: #dc2626;
    --shadow: rgba(0, 0, 0, 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --text: #f8fafc;
      --glass-bg: rgba(30, 41, 59, 0.6);
      --glass-border: rgba(51, 65, 85, 0.8);
      --term-green: #10b981;
      --danger: #ef4444;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  body, html {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 40px 30px;
    box-shadow: 0 8px 32px var(--shadow);
    text-align: center;
    pointer-events: none;
    max-width: 80%;
  }
  .screen.active {
    display: flex;
  }
  h1 {
    margin: 0 0 10px 0;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  p {
    margin: 0 0 30px 0;
    font-size: 16px;
    opacity: 0.8;
    line-height: 1.5;
  }
  button {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 100px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
    pointer-events: auto;
    touch-action: manipulation;
  }
  button:active {
    transform: scale(0.95);
    opacity: 0.9;
  }
  .terminal-text {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    color: var(--term-green);
    font-weight: bold;
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui-layer">
    <div id="start-screen" class="screen active">
      <h1>Agent Spinner</h1>
      <p>Flick shortcut tiles into the dock in the correct order to spin up parallel agents.</p>
      <button data-smoke="start" id="start-btn">START</button>
    </div>
    <div id="game-over-screen" class="screen">
      <h1>Timeout</h1>
      <p>Tasks Shipped: <span id="final-score" class="terminal-text">0</span></p>
      <button data-smoke="restart" id="restart-btn">RESTART</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let width, height;
    let colors = {};

    function updateColors() {
      const style = getComputedStyle(document.body);
      colors = {
        bg: style.getPropertyValue('--bg').trim(),
        text: style.getPropertyValue('--text').trim(),
        glassBg: style.getPropertyValue('--glass-bg').trim(),
        glassBorder: style.getPropertyValue('--glass-border').trim(),
        termGreen: style.getPropertyValue('--term-green').trim(),
        danger: style.getPropertyValue('--danger').trim(),
      };
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
    updateColors();

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    const SYMBOLS = ['⚡', '🤖', '🚀', '🔍', '⚙️', '📦', '🔥', '💎', '🌐', '📱'];

    let state = 'start';
    let score = 0;
    let timeLeft = 0;
    let level = 0;

    let tiles = [];
    let particles = [];
    let logs = [];
    let sequence = [];
    let currentStep = 0;
    let slots = [];

    let lastTime = 0;
    let screenShake = 0;
    let animationFrameId = null;

    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreEl = document.getElementById('final-score');

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    function startGame() {
      state = 'playing';
      startScreen.classList.remove('active');
      gameOverScreen.classList.remove('active');
      score = 0;
      timeLeft = 30;
      level = 0;
      tiles = [];
      particles = [];
      logs = [];
      screenShake = 0;
      generateSequence();
      lastTime = performance.now();
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(loop);
    }

    function generateSequence() {
      level = Math.floor(score / 2);
      const numSlots = Math.min(3 + Math.floor(level / 2), 6);
      sequence = [];
      
      for (let i = 0; i < numSlots; i++) {
        sequence.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
      }
      currentStep = 0;
      
      const slotSize = Math.max(65 - level * 3, 40);
      const gap = 12;
      const totalWidth = numSlots * slotSize + (numSlots - 1) * gap;
      const startX = (width - totalWidth) / 2;
      const y = 140;
      
      slots = [];
      for (let i = 0; i < numSlots; i++) {
        slots.push({
          x: startX + i * (slotSize + gap) + slotSize / 2,
          y: y,
          size: slotSize,
          symbol: sequence[i]
        });
      }
      
      tiles = [];
      const numTiles = numSlots + 2 + Math.min(level, 4);
      
      const symbolsToSpawn = [...sequence];
      while (symbolsToSpawn.length < numTiles) {
        symbolsToSpawn.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
      }
      symbolsToSpawn.sort(() => Math.random() - 0.5);
      
      const tileRadius = slotSize * 0.45;
      
      for (let i = 0; i < numTiles; i++) {
        tiles.push({
          id: Math.random(),
          x: tileRadius + Math.random() * (width - tileRadius * 2),
          y: height - tileRadius - Math.random() * (height * 0.4),
          vx: (Math.random() - 0.5) * 100,
          vy: (Math.random() - 0.5) * 100,
          radius: tileRadius,
          symbol: symbolsToSpawn[i],
          isDragging: false,
          dragId: null,
          dragOffsetX: 0,
          dragOffsetY: 0,
          history: [],
          trail: []
        });
      }
    }

    const touches = new Map();

    function handleTouchStart(e) {
      if (state !== 'playing') return;
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        touches.set(t.identifier, { x: t.clientX, y: t.clientY });
        
        for (let j = tiles.length - 1; j >= 0; j--) {
          const tile = tiles[j];
          const dx = t.clientX - tile.x;
          const dy = t.clientY - tile.y;
          if (dx * dx + dy * dy <= tile.radius * tile.radius * 2.5) {
            tile.isDragging = true;
            tile.dragId = t.identifier;
            tile.dragOffsetX = tile.x - t.clientX;
            tile.dragOffsetY = tile.y - t.clientY;
            tile.vx = 0;
            tile.vy = 0;
            tile.history = [{ x: tile.x, y: tile.y, time: performance.now() }];
            tile.trail = [];
            tiles.push(tiles.splice(j, 1)[0]);
            break;
          }
        }
      }
    }

    function handleTouchMove(e) {
      if (state !== 'playing') return;
      e.preventDefault();
      const now = performance.now();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        touches.set(t.identifier, { x: t.clientX, y: t.clientY });
        
        for (const tile of tiles) {
          if (tile.isDragging && tile.dragId === t.identifier) {
            tile.x = t.clientX + tile.dragOffsetX;
            tile.y = t.clientY + tile.dragOffsetY;
            tile.history.push({ x: tile.x, y: tile.y, time: now });
            if (tile.history.length > 5) tile.history.shift();
          }
        }
      }
    }

    function handleTouchEnd(e) {
      if (state !== 'playing') return;
      const now = performance.now();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        touches.delete(t.identifier);
        
        for (const tile of tiles) {
          if (tile.isDragging && tile.dragId === t.identifier) {
            tile.isDragging = false;
            tile.dragId = null;
            
            if (tile.history.length > 1) {
              const oldest = tile.history[0];
              const dt = (now - oldest.time) / 1000;
              if (dt > 0) {
                tile.vx = (tile.x - oldest.x) / dt;
                tile.vy = (tile.y - oldest.y) / dt;
                
                const speed = Math.hypot(tile.vx, tile.vy);
                const maxSpeed = 4000;
                if (speed > maxSpeed) {
                  tile.vx = (tile.vx / speed) * maxSpeed;
                  tile.vy = (tile.vy / speed) * maxSpeed;
                }
              }
            }
          }
        }
      }
    }

    window.addEventListener('touchstart', handleTouchStart, { passive: false });
    window.addEventListener('touchmove', handleTouchMove, { passive: false });
    window.addEventListener('touchend', handleTouchEnd);
    window.addEventListener('touchcancel', handleTouchEnd);

    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      isMouseDown = true;
      handleTouchStart({ preventDefault: ()=>{}, changedTouches: [{ identifier: 'mouse', clientX: e.clientX, clientY: e.clientY }] });
    });
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      handleTouchMove({ preventDefault: ()=>{}, changedTouches: [{ identifier: 'mouse', clientX: e.clientX, clientY: e.clientY }] });
    });
    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;
      handleTouchEnd({ changedTouches: [{ identifier: 'mouse', clientX: e.clientX, clientY: e.clientY }] });
    });

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 300 + 50;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color,
          size: Math.random() * 5 + 2
        });
      }
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function loop(time) {
      if (state !== 'playing') return;
      const dt = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;
      update(dt);
      draw();
      animationFrameId = requestAnimationFrame(loop);
    }

    function update(dt) {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        state = 'gameover';
        finalScoreEl.textContent = score;
        gameOverScreen.classList.add('active');
        return;
      }
      
      if (screenShake > 0) {
        screenShake -= dt * 15;
        if (screenShake < 0) screenShake = 0;
      }
      
      const restitution = Math.min(0.5 + level * 0.08, 0.95);
      const frictionFactor = Math.pow(0.1, dt);
      
      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];
        if (!t.isDragging) {
          t.x += t.vx * dt;
          t.y += t.vy * dt;
          t.vx *= frictionFactor;
          t.vy *= frictionFactor;
          
          if (t.x - t.radius < 0) { t.x = t.radius; t.vx *= -restitution; }
          if (t.x + t.radius > width) { t.x = width - t.radius; t.vx *= -restitution; }
          if (t.y - t.radius < 0) { t.y = t.radius; t.vy *= -restitution; }
          if (t.y + t.radius > height) { t.y = height - t.radius; t.vy *= -restitution; }

          const speed = Math.hypot(t.vx, t.vy);
          if (speed > 100) {
            t.trail.push({x: t.x, y: t.y});
            if (t.trail.length > 8) t.trail.shift();
          } else {
            if (t.trail.length > 0) t.trail.shift();
          }
        }
      }
      
      for (let i = 0; i < tiles.length; i++) {
        for (let j = i + 1; j < tiles.length; j++) {
          const t1 = tiles[i];
          const t2 = tiles[j];
          const dx = t2.x - t1.x;
          const dy = t2.y - t1.y;
          const distSq = dx * dx + dy * dy;
          const minDist = t1.radius + t2.radius;
          
          if (distSq < minDist * minDist && distSq > 0) {
            const dist = Math.sqrt(distSq);
            const overlap = minDist - dist;
            const nx = dx / dist;
            const ny = dy / dist;
            
            const massRatio = 0.5;
            if (!t1.isDragging) { t1.x -= nx * overlap * massRatio; }
            if (!t2.isDragging) { t2.x += nx * overlap * massRatio; }
            if (!t1.isDragging) { t1.y -= ny * overlap * massRatio; }
            if (!t2.isDragging) { t2.y += ny * overlap * massRatio; }
            
            const rvx = t2.vx - t1.vx;
            const rvy = t2.vy - t1.vy;
            const velAlongNormal = rvx * nx + rvy * ny;
            
            if (velAlongNormal < 0) {
              const j_impulse = -(1 + restitution) * velAlongNormal;
              const impulse = j_impulse / 2;
              if (!t1.isDragging) { t1.vx -= impulse * nx; t1.vy -= impulse * ny; }
              if (!t2.isDragging) { t2.vx += impulse * nx; t2.vy += impulse * ny; }
            }
          }
        }
      }
      
      if (currentStep < slots.length) {
        const slot = slots[currentStep];
        const captureRadius = slot.size * 0.7;
        
        for (let i = tiles.length - 1; i >= 0; i--) {
          const t = tiles[i];
          if (t.isDragging) continue;
          
          const dx = t.x - slot.x;
          const dy = t.y - slot.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < captureRadius) {
            if (t.symbol === slot.symbol) {
              tiles.splice(i, 1);
              currentStep++;
              spawnParticles(slot.x, slot.y, colors.termGreen, 25);
              if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(40);
              
              if (currentStep >= slots.length) {
                score++;
                timeLeft += 4 + numSlots;
                logs.unshift(`> agent_chain_complete --id ${score} [OK]`);
                if (logs.length > 6) logs.pop();
                if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate([40, 40, 40]);
                setTimeout(generateSequence, 400);
              }
            } else {
              const speed = Math.max(Math.hypot(t.vx, t.vy), 800);
              const nx = dx / dist;
              const ny = dy / dist;
              t.vx = nx * speed * 1.2;
              t.vy = ny * speed * 1.2;
              spawnParticles(slot.x, slot.y, colors.danger, 15);
              timeLeft -= 2;
              screenShake = 8;
              if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(100);
            }
          }
        }
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, width, height);
      
      ctx.save();
      if (screenShake > 0) {
        const dx = (Math.random() - 0.5) * screenShake * 4;
        const dy = (Math.random() - 0.5) * screenShake * 4;
        ctx.translate(dx, dy);
      }
      
      ctx.font = '13px ui-monospace, "SFMono-Regular", Menlo, monospace';
      ctx.fillStyle = colors.termGreen;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      for (let i = 0; i < logs.length; i++) {
        ctx.globalAlpha = Math.max(0, 1 - (i * 0.15));
        ctx.fillText(logs[i], 20, 90 + i * 22);
      }
      ctx.globalAlpha = 1.0;
      
      ctx.font = 'bold 22px -apple-system, sans-serif';
      ctx.fillStyle = colors.text;
      ctx.textAlign = 'right';
      ctx.fillText(`Shipped: ${score}`, width - 20, 40);
      
      ctx.fillStyle = timeLeft < 5 ? colors.danger : colors.text;
      ctx.fillText(`Time: ${Math.ceil(timeLeft)}s`, width - 20, 70);
      
      for (let i = 0; i < slots.length; i++) {
        const slot = slots[i];
        const isCurrent = i === currentStep;
        const isFilled = i < currentStep;
        
        if (isFilled) {
          ctx.fillStyle = colors.glassBg;
          drawRoundRect(ctx, slot.x - slot.size/2, slot.y - slot.size/2, slot.size, slot.size, 12);
          ctx.fill();
          ctx.strokeStyle = colors.termGreen;
          ctx.lineWidth = 3;
          ctx.stroke();
          
          ctx.font = `${slot.size * 0.5}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(slot.symbol, slot.x, slot.y);
        } else {
          ctx.fillStyle = 'rgba(0,0,0,0.03)';
          drawRoundRect(ctx, slot.x - slot.size/2, slot.y - slot.size/2, slot.size, slot.size, 12);
          ctx.fill();
          ctx.strokeStyle = isCurrent ? colors.termGreen : colors.glassBorder;
          ctx.lineWidth = isCurrent ? 3 : 1;
          if (isCurrent) ctx.setLineDash([6, 4]);
          ctx.stroke();
          ctx.setLineDash([]);
          
          ctx.globalAlpha = 0.2;
          ctx.font = `${slot.size * 0.5}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(slot.symbol, slot.x, slot.y);
          ctx.globalAlpha = 1.0;
        }
      }
      
      for (const t of tiles) {
        if (t.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(t.trail[0].x, t.trail[0].y);
          for (let j = 1; j < t.trail.length; j++) {
            ctx.lineTo(t.trail[j].x, t.trail[j].y);
          }
          ctx.strokeStyle = colors.termGreen;
          ctx.globalAlpha = 0.4;
          ctx.lineWidth = t.radius * 0.6;
          ctx.lineCap = 'round';
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        }
      }

      for (const t of tiles) {
        ctx.save();
        ctx.translate(t.x, t.y);
        
        if (t.isDragging) {
          ctx.scale(1.15, 1.15);
          ctx.shadowColor = 'rgba(0,0,0,0.2)';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetY = 8;
        } else {
          ctx.shadowColor = 'rgba(0,0,0,0.1)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 2;
        }
        
        ctx.fillStyle = colors.glassBg;
        drawRoundRect(ctx, -t.radius, -t.radius, t.radius * 2, t.radius * 2, t.radius * 0.4);
        ctx.fill();
        ctx.strokeStyle = colors.glassBorder;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        ctx.shadowColor = 'transparent';
        
        ctx.font = `${t.radius * 1.1}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.symbol, 0, 0);
        
        ctx.restore();
      }

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;
      
      ctx.restore();
    }
    
    // Initial draw
    draw();
  </script>
</body>
</html>
