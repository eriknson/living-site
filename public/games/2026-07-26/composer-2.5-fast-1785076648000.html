<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Lanes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #e8eef2;
    --text: #1a2830;
    --muted: #5a6d78;
    --accent: #c47a3a;
    --panel: rgba(255,255,255,0.88);
    --panel-border: rgba(26,40,48,0.12);
    --btn-bg: #1a2830;
    --btn-text: #f4f8fa;
    --hud-bg: rgba(255,255,255,0.72);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1418;
      --text: #d8e4ea;
      --muted: #7a919c;
      --accent: #e8a060;
      --panel: rgba(18,26,32,0.92);
      --panel-border: rgba(216,228,234,0.1);
      --btn-bg: #d8e4ea;
      --btn-text: #0e1418;
      --hud-bg: rgba(18,26,32,0.78);
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
  }
  canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    touch-action: none;
  }
  .hud {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 2;
    gap: 8px;
  }
  .hud-pill {
    background: var(--hud-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    letter-spacing: 0.04em;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .hud-pill span { color: var(--accent); }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 3;
    transition: opacity 0.4s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    pointer-events: none;
  }
  .panel h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .panel p {
    font-size: 12px;
    line-height: 1.55;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .panel .score-big {
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .panel .score-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    min-width: 160px;
    padding: 12px 24px;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    pointer-events: auto;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.96); opacity: 0.85; }
  .combo-flash {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px;
    letter-spacing: 0.06em;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    transition: opacity 0.2s;
  }
  .combo-flash.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div class="hud" id="hud">
    <div class="hud-pill">score <span id="scoreVal">0</span></div>
    <div class="hud-pill">chain <span id="chainVal">×1</span></div>
    <div class="hud-pill">wind <span id="windVal">calm</span></div>
    <div class="hud-pill"><span id="timeVal">45</span>s</div>
  </div>
  <div class="combo-flash" id="comboFlash"></div>
  <div class="overlay" id="titleScreen">
    <div class="panel">
      <h1>Fog Lanes</h1>
      <p>Clear the mist over the bay. Each pocket you open lights the next shipping route — chain them before the fog rolls back in.</p>
      <button class="btn" data-smoke="start" id="startBtn">Set Sail</button>
    </div>
  </div>
  <div class="overlay hidden" id="gameOverScreen">
    <div class="panel">
      <h1>Harbor Closed</h1>
      <div class="score-big" id="finalScore">0</div>
      <div class="score-label">routes cleared</div>
      <p id="gameOverMsg">The mist won this round.</p>
      <button class="btn" data-smoke="restart" id="restartBtn">Try Again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('scoreVal');
  var chainEl = document.getElementById('chainVal');
  var windEl = document.getElementById('windVal');
  var timeEl = document.getElementById('timeVal');
  var titleScreen = document.getElementById('titleScreen');
  var gameOverScreen = document.getElementById('gameOverScreen');
  var finalScoreEl = document.getElementById('finalScore');
  var gameOverMsg = document.getElementById('gameOverMsg');
  var comboFlash = document.getElementById('comboFlash');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var hud = document.getElementById('hud');

  var W = 360, H = 640;
  var dpr = 1;
  var state = 'title';
  var score = 0;
  var chain = 0;
  var timeLeft = 45;
  var elapsed = 0;
  var windLevel = 0;
  var lastTs = 0;
  var animId = 0;
  var pockets = [];
  var nodes = [];
  var particles = [];
  var ripples = [];
  var routeProgress = [];
  var routeTargets = [];
  var activeIdx = 0;
  var hitStop = 0;
  var misses = 0;
  var maxMisses = 4;
  var dark = false;
  var audioCtx = null;

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  }

  dark = prefersDark();
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        dark = e.matches;
      });
    } catch (e) { /* ignore */ }
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    buildNodes();
  }

  function buildNodes() {
    nodes = [];
    var margin = Math.min(W, H) * 0.12;
    var waterTop = H * 0.38;
    var cols = 4;
    var positions = [
      { x: margin, y: waterTop + (H - waterTop) * 0.75 },
      { x: W * 0.32, y: waterTop + (H - waterTop) * 0.45 },
      { x: W * 0.55, y: waterTop + (H - waterTop) * 0.62 },
      { x: W * 0.78, y: waterTop + (H - waterTop) * 0.35 },
      { x: W - margin, y: waterTop + (H - waterTop) * 0.55 },
      { x: W * 0.42, y: waterTop + (H - waterTop) * 0.82 },
      { x: W * 0.68, y: waterTop + (H - waterTop) * 0.78 }
    ];
    for (var i = 0; i < positions.length; i++) {
      nodes.push({
        x: positions[i].x,
        y: positions[i].y,
        lit: false,
        pulse: 0
      });
    }
    routeProgress = [];
    routeTargets = [];
    for (var j = 0; j < nodes.length - 1; j++) {
      routeProgress.push(0);
      routeTargets.push(0);
    }
  }

  function windLabel() {
    if (windLevel < 0.25) return 'calm';
    if (windLevel < 0.5) return 'breeze';
    if (windLevel < 0.75) return 'gusty';
    return 'gale';
  }

  function pocketRadius() {
    var base = Math.min(W, H) * 0.09;
    return Math.max(base * (1 - windLevel * 0.45), base * 0.42);
  }

  function fogRegenRate() {
    return 0.08 + windLevel * 0.35;
  }

  function spawnPocket(idx) {
    if (!nodes[idx]) return;
    var n = nodes[idx];
    pockets.push({
      nodeIdx: idx,
      x: n.x,
      y: n.y,
      r: pocketRadius(),
      cleared: false,
      urgency: 0,
      active: idx === activeIdx,
      spawnTime: elapsed
    });
  }

  function resetPockets() {
    pockets = [];
    activeIdx = 0;
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].lit = false;
      nodes[i].pulse = 0;
    }
    for (var j = 0; j < routeProgress.length; j++) routeProgress[j] = 0;
    spawnPocket(0);
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, vol) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* ignore */ }
  }

  function vibrate(ms) {
    try {
      if (navigator.vibrate) navigator.vibrate(ms);
    } catch (e) { /* ignore */ }
  }

  function burst(x, y, col) {
    for (var i = 0; i < 14; i++) {
      var a = (Math.PI * 2 * i) / 14 + Math.random() * 0.3;
      var sp = 40 + Math.random() * 80;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.5 + Math.random() * 0.4,
        maxLife: 0.9,
        color: col || 'rgba(255,220,160,0.9)'
      });
    }
    ripples.push({ x: x, y: y, r: 0, maxR: pocketRadius() * 2.2, life: 0.6 });
  }

  function showCombo(text) {
    if (!comboFlash) return;
    comboFlash.textContent = text;
    comboFlash.classList.add('show');
    setTimeout(function () { comboFlash.classList.remove('show'); }, 600);
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (chainEl) chainEl.textContent = '×' + Math.max(1, chain);
    if (windEl) windEl.textContent = windLabel();
    if (timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
  }

  function startGame() {
    initAudio();
    state = 'playing';
    score = 0;
    chain = 0;
    timeLeft = 45;
    elapsed = 0;
    windLevel = 0;
    misses = 0;
    particles = [];
    ripples = [];
    lastTs = 0;
    if (titleScreen) titleScreen.classList.add('hidden');
    if (gameOverScreen) gameOverScreen.classList.add('hidden');
    if (hud) hud.style.opacity = '1';
    buildNodes();
    resetPockets();
    updateHUD();
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }

  function endGame(won) {
    state = 'over';
    if (animId) cancelAnimationFrame(animId);
    animId = 0;
    if (finalScoreEl) finalScoreEl.textContent = String(score);
    if (gameOverMsg) {
      gameOverMsg.textContent = won
        ? 'All lanes lit before the fog closed in.'
        : (misses >= maxMisses ? 'Too many pockets lost to the mist.' : 'Time\'s up — the harbor sleeps.');
    }
    if (gameOverScreen) gameOverScreen.classList.remove('hidden');
  }

  function clearPocket(p) {
    p.cleared = true;
    var ni = p.nodeIdx;
    if (nodes[ni]) {
      nodes[ni].lit = true;
      nodes[ni].pulse = 1;
    }
    if (ni > 0 && routeTargets[ni - 1] !== undefined) {
      routeTargets[ni - 1] = 1;
    }
    hitStop = 0.06;
    chain++;
    var pts = 10 * Math.max(1, chain);
    score += pts;
    burst(p.x, p.y, dark ? 'rgba(232,160,96,0.95)' : 'rgba(196,122,58,0.9)');
    playTone(220 + chain * 30, 0.15, 0.07);
    vibrate(12);
    if (chain >= 3 && chain % 3 === 0) showCombo('chain ×' + chain);

    activeIdx = ni + 1;
    if (activeIdx < nodes.length) {
      spawnPocket(activeIdx);
    } else {
      endGame(true);
      return;
    }
    updateHUD();
  }

  function missPocket(p) {
    chain = 0;
    misses++;
    playTone(90, 0.2, 0.05);
    vibrate(30);
    p.active = false;
    for (var i = pockets.length - 1; i >= 0; i--) {
      if (pockets[i].nodeIdx === p.nodeIdx) pockets.splice(i, 1);
    }
    updateHUD();
    if (misses >= maxMisses) {
      endGame(false);
    } else {
      spawnPocket(p.nodeIdx);
    }
  }

  function handleTap(clientX, clientY) {
    if (state !== 'playing' || !canvas) return;
    var rect = canvas.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    var hit = false;
    for (var i = pockets.length - 1; i >= 0; i--) {
      var p = pockets[i];
      if (!p.active || p.cleared) continue;
      var dx = x - p.x;
      var dy = y - p.y;
      if (dx * dx + dy * dy <= p.r * p.r * 1.1) {
        clearPocket(p);
        hit = true;
        break;
      }
    }
    if (!hit) {
      ripples.push({ x: x, y: y, r: 0, maxR: 30, life: 0.35 });
    }
  }

  function update(dt) {
    if (state !== 'playing') return;
    if (hitStop > 0) {
      hitStop -= dt;
      draw();
      if (state === 'playing') animId = requestAnimationFrame(loop);
      return;
    }
    elapsed += dt;
    timeLeft -= dt;
    windLevel = Math.min(1, elapsed / 42);
    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame(false);
      return;
    }

    for (var i = pockets.length - 1; i >= 0; i--) {
      var p = pockets[i];
      if (p.cleared) continue;
      if (p.active) {
        var shrink = 1 - windLevel * 0.35;
        p.r = pocketRadius() * shrink;
        var limit = Math.max(2.2, 4.5 - windLevel * 2.2);
        p.urgency = Math.min(1, (elapsed - p.spawnTime) / limit * fogRegenRate() * 3.5);
        if (p.urgency >= 1) missPocket(p);
      }
    }

    for (var ri = 0; ri < routeProgress.length; ri++) {
      if (routeProgress[ri] < routeTargets[ri]) {
        routeProgress[ri] = Math.min(routeTargets[ri], routeProgress[ri] + dt * 2.5);
      }
    }

    for (var n = 0; n < nodes.length; n++) {
      if (nodes[n].pulse > 0) nodes[n].pulse -= dt * 1.5;
    }

    for (var pi = particles.length - 1; pi >= 0; pi--) {
      var pt = particles[pi];
      pt.life -= dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 30 * dt;
      if (pt.life <= 0) particles.splice(pi, 1);
    }

    for (var ri = ripples.length - 1; ri >= 0; ri--) {
      var rp = ripples[ri];
      rp.life -= dt;
      rp.r += dt * rp.maxR * 2;
      if (rp.life <= 0) ripples.splice(ri, 1);
    }

    updateHUD();
  }

  function drawSky() {
    if (!ctx) return;
    var g = ctx.createLinearGradient(0, 0, 0, H * 0.55);
    if (dark) {
      g.addColorStop(0, '#1a2430');
      g.addColorStop(0.5, '#243038');
      g.addColorStop(1, '#2a3840');
    } else {
      g.addColorStop(0, '#b8ccd8');
      g.addColorStop(0.45, '#d4dfe8');
      g.addColorStop(1, '#e8eef2');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var sunY = H * 0.22;
    var sunG = ctx.createRadialGradient(W * 0.75, sunY, 0, W * 0.75, sunY, W * 0.35);
    if (dark) {
      sunG.addColorStop(0, 'rgba(232,160,96,0.25)');
      sunG.addColorStop(1, 'rgba(232,160,96,0)');
    } else {
      sunG.addColorStop(0, 'rgba(255,210,150,0.45)');
      sunG.addColorStop(1, 'rgba(255,210,150,0)');
    }
    ctx.fillStyle = sunG;
    ctx.fillRect(0, 0, W, H * 0.5);

    ctx.fillStyle = dark ? 'rgba(60,80,90,0.4)' : 'rgba(120,140,155,0.25)';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.32);
    ctx.lineTo(W * 0.2, H * 0.28);
    ctx.lineTo(W * 0.45, H * 0.31);
    ctx.lineTo(W * 0.7, H * 0.26);
    ctx.lineTo(W, H * 0.3);
    ctx.lineTo(W, H * 0.38);
    ctx.lineTo(0, H * 0.38);
    ctx.closePath();
    ctx.fill();
  }

  function drawWater() {
    if (!ctx) return;
    var waterTop = H * 0.38;
    var wg = ctx.createLinearGradient(0, waterTop, 0, H);
    if (dark) {
      wg.addColorStop(0, '#1e3038');
      wg.addColorStop(0.5, '#162830');
      wg.addColorStop(1, '#0e1c24');
    } else {
      wg.addColorStop(0, '#7aabb8');
      wg.addColorStop(0.4, '#5a94a4');
      wg.addColorStop(1, '#4a8494');
    }
    ctx.fillStyle = wg;
    ctx.fillRect(0, waterTop, W, H - waterTop);

    var t = elapsed * 0.8;
    ctx.globalAlpha = dark ? 0.08 : 0.12;
    ctx.strokeStyle = dark ? '#a0c8d8' : '#ffffff';
    ctx.lineWidth = 1;
    for (var w = 0; w < 6; w++) {
      ctx.beginPath();
      var wy = waterTop + 30 + w * ((H - waterTop) / 6);
      for (var x = 0; x <= W; x += 8) {
        var y = wy + Math.sin(x * 0.02 + t + w) * 4 + Math.sin(x * 0.008 - t * 0.5) * 2;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawRoutes() {
    if (!ctx || nodes.length < 2) return;
    for (var i = 0; i < nodes.length - 1; i++) {
      var a = nodes[i];
      var b = nodes[i + 1];
      var prog = routeProgress[i] || 0;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = dark ? 'rgba(100,130,145,0.35)' : 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.setLineDash([]);
      if (prog > 0) {
        var mx = a.x + (b.x - a.x) * prog;
        var my = a.y + (b.y - a.y) * prog;
        var lg = ctx.createLinearGradient(a.x, a.y, mx, my);
        lg.addColorStop(0, dark ? 'rgba(232,160,96,0.9)' : 'rgba(255,200,120,0.95)');
        lg.addColorStop(1, dark ? 'rgba(232,160,96,0.4)' : 'rgba(255,200,120,0.5)');
        ctx.strokeStyle = lg;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(mx, my);
        ctx.stroke();
      }
    }
  }

  function drawNodes() {
    if (!ctx) return;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var glow = n.lit ? 1 : (i === activeIdx ? 0.5 + Math.sin(elapsed * 4) * 0.3 : 0.15);
      if (n.pulse > 0) glow = Math.max(glow, n.pulse);

      ctx.beginPath();
      ctx.arc(n.x, n.y, 6 + glow * 4, 0, Math.PI * 2);
      var ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 10 + glow * 8);
      if (n.lit || i === activeIdx) {
        ng.addColorStop(0, dark ? '#e8a060' : '#ffc878');
        ng.addColorStop(0.5, dark ? 'rgba(232,160,96,0.5)' : 'rgba(255,200,120,0.4)');
        ng.addColorStop(1, 'rgba(255,200,120,0)');
      } else {
        ng.addColorStop(0, dark ? '#5a7080' : '#8aacb8');
        ng.addColorStop(1, 'rgba(138,172,184,0)');
      }
      ctx.fillStyle = ng;
      ctx.fill();

      ctx.fillStyle = n.lit
        ? (dark ? '#f0c890' : '#fff0d0')
        : (dark ? '#708898' : '#d0e8f0');
      ctx.beginPath();
      ctx.arc(n.x, n.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFogPocket(p) {
    if (!ctx || p.cleared) return;
    var opacity = 0.35 + p.urgency * 0.65;
    if (opacity <= 0.02) return;

    var fg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    if (dark) {
      fg.addColorStop(0, 'rgba(200,215,225,' + (0.15 * opacity) + ')');
      fg.addColorStop(0.4, 'rgba(160,180,195,' + (0.55 * opacity) + ')');
      fg.addColorStop(0.75, 'rgba(120,145,160,' + (0.35 * opacity) + ')');
      fg.addColorStop(1, 'rgba(100,130,145,0)');
    } else {
      fg.addColorStop(0, 'rgba(255,255,255,' + (0.2 * opacity) + ')');
      fg.addColorStop(0.35, 'rgba(240,248,252,' + (0.65 * opacity) + ')');
      fg.addColorStop(0.7, 'rgba(220,235,242,' + (0.4 * opacity) + ')');
      fg.addColorStop(1, 'rgba(200,220,230,0)');
    }
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    if (p.active) {
      var pulse = 0.6 + Math.sin(elapsed * 5) * 0.2;
      ctx.strokeStyle = dark
        ? 'rgba(232,160,96,' + (0.5 * pulse * opacity) + ')'
        : 'rgba(196,122,58,' + (0.55 * pulse * opacity) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1 - p.urgency * 0.35), 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = dark ? 'rgba(232,160,96,0.9)' : 'rgba(196,122,58,0.85)';
      ctx.font = '10px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('TAP', p.x, p.y + 3);
    }

    var wobble = Math.sin(elapsed * 2 + p.nodeIdx) * 3 * windLevel;
    ctx.globalAlpha = opacity * 0.25 * windLevel;
    ctx.fillStyle = dark ? '#8098a8' : '#e8f0f4';
    ctx.beginPath();
    ctx.ellipse(p.x + wobble, p.y - p.r * 0.3, p.r * 0.6, p.r * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawAmbientFog() {
    if (!ctx) return;
    var layers = 3;
    for (var l = 0; l < layers; l++) {
      var drift = Math.sin(elapsed * (0.3 + l * 0.1) + l * 2) * W * 0.05 * (0.3 + windLevel);
      var fy = H * (0.35 + l * 0.08);
      var fr = W * (0.4 + l * 0.1);
      var ag = ctx.createRadialGradient(W * 0.5 + drift, fy, 0, W * 0.5 + drift, fy, fr);
      var a = (0.06 + windLevel * 0.04) * (1 - l * 0.2);
      ag.addColorStop(0, dark ? 'rgba(140,160,175,' + a + ')' : 'rgba(255,255,255,' + (a * 1.5) + ')');
      ag.addColorStop(1, 'rgba(200,220,230,0)');
      ctx.fillStyle = ag;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawParticles() {
    if (!ctx) return;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (var r = 0; r < ripples.length; r++) {
      var rp = ripples[r];
      ctx.globalAlpha = Math.max(0, rp.life * 0.6);
      ctx.strokeStyle = dark ? 'rgba(160,200,220,0.6)' : 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    if (!ctx) return;
    drawSky();
    drawWater();
    drawRoutes();
    drawNodes();
    drawAmbientFog();
    for (var i = 0; i < pockets.length; i++) {
      drawFogPocket(pockets[i]);
    }
    drawParticles();
  }

  function drawIdle() {
    if (!ctx) return;
    drawSky();
    drawWater();
    drawAmbientFog();
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].lit = i < 2;
    }
    drawRoutes();
    routeProgress[0] = 0.6;
    drawNodes();
  }

  function loop(ts) {
    if (state !== 'playing') return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    update(dt);
    draw();
    if (state === 'playing') {
      animId = requestAnimationFrame(loop);
    }
  }

  function idleLoop() {
    if (state !== 'title' && state !== 'over') return;
    elapsed += 0.016;
    if (state === 'title') drawIdle();
    animId = requestAnimationFrame(idleLoop);
  }

  function onPointerDown(e) {
    try { e.preventDefault(); } catch (err) { /* ignore */ }
    var x, y;
    if (e.touches && e.touches.length) {
      x = e.touches[0].clientX;
      y = e.touches[0].clientY;
    } else {
      x = e.clientX;
      y = e.clientY;
    }
    handleTap(x, y);
  }

  if (canvas) {
    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('mousedown', onPointerDown);
  }

  if (startBtn) {
    startBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
  }

  if (restartBtn) {
    restartBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
  }

  window.addEventListener('resize', resize);

  resize();
  buildNodes();
  resetPockets();
  updateHUD();
  if (hud) hud.style.opacity = '0.5';
  drawIdle();
  animId = requestAnimationFrame(idleLoop);

})();
</script>
</body>
</html>
