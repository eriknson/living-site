<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gust Sort</title>
<style>
:root {
    --bg-overlay: rgba(255, 255, 255, 0.85);
    --text: #111;
    --card-bg: #fff;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg-overlay: rgba(0, 0, 0, 0.75);
        --text: #eee;
        --card-bg: #1e293b;
    }
}
body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background: #000;
    user-select: none; -webkit-user-select: none;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
}
#game-canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
}
#touch-area {
    position: absolute; top: 25%; left: 0;
    width: 100%; height: 75%;
    z-index: 10;
    touch-action: none;
}
#queue {
    position: absolute; bottom: 5vh; left: 50%;
    width: 80px; height: 60vh;
    transform: translateX(-50%);
    pointer-events: none; z-index: 5;
}
.card {
    position: absolute;
    width: min(14vh, 80px); height: min(14vh, 80px);
    left: 50%;
    margin-left: calc(min(14vh, 80px) / -2);
    transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.card-scale {
    width: 100%; height: 100%;
    transition: transform 0.2s ease;
}
.card-inner {
    width: 100%; height: 100%;
    border-radius: 20px;
    background: var(--card-bg);
    box-shadow: 0 8px 16px rgba(0,0,0,0.2), inset 0 2px 4px rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center;
    will-change: transform, opacity;
}
@media (prefers-color-scheme: dark) {
    .card-inner {
        box-shadow: 0 8px 16px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.1);
    }
}
#ui-layer {
    position: absolute; inset: 0; z-index: 100;
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
}
.screen-box {
    display: flex; flex-direction: column; align-items: center;
    background: var(--bg-overlay); padding: 40px; border-radius: 24px;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    pointer-events: none;
}
.screen-box > * {
    pointer-events: auto;
}
h1 { margin: 0 0 10px 0; color: var(--text); font-size: 32px; font-weight: 900; }
p { margin: 0 0 30px 0; color: var(--text); max-width: 260px; line-height: 1.5; font-family: sans-serif; }
button {
    padding: 16px 40px; font-size: 20px; font-weight: bold;
    font-family: inherit; border: none; border-radius: 12px;
    cursor: pointer; transition: transform 0.1s;
}
button:active { transform: scale(0.95); }
#start-btn { background: #f59e0b; color: white; box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4); }
#restart-btn { background: #ef4444; color: white; box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4); }

#hud {
    position: absolute; top: 6vh; width: 100%;
    text-align: center; pointer-events: none; z-index: 50; display: none;
}
#score-display {
    font-size: 56px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 2px rgba(0,0,0,0.15);
    text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes shake {
    0% { transform: translate(2px, 1px) rotate(0deg); }
    10% { transform: translate(-1px, -2px) rotate(-1deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    30% { transform: translate(0px, 2px) rotate(0deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    50% { transform: translate(-1px, 2px) rotate(-1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    70% { transform: translate(2px, 1px) rotate(-1deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    90% { transform: translate(2px, 2px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="touch-area"></div>
<div id="queue"></div>
<div id="hud"><div id="score-display">0</div></div>

<div id="ui-layer">
    <div id="start-screen" class="screen-box">
        <h1>GUST SORT</h1>
        <p>Swipe gusts in the direction they point to keep the balloon aloft!</p>
        <button data-smoke="start" id="start-btn">START</button>
    </div>
    <div id="game-over-screen" class="screen-box" style="display: none;">
        <h1>CRASHED!</h1>
        <p style="font-family: inherit; font-size: 24px; font-weight: bold; margin-bottom: 20px;">Score: <span id="final-score">0</span></p>
        <button data-smoke="restart" id="restart-btn">TRY AGAIN</button>
    </div>
</div>

<script>
window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const queueEl = document.getElementById('queue');
const scoreDisplay = document.getElementById('score-display');
const touchArea = document.getElementById('touch-area');

const GUST_TYPES = [
    { dir: 'LEFT', path: 'M19 12H5 M12 19l-7-7 7-7', color: '#f59e0b' },
    { dir: 'RIGHT', path: 'M5 12h14 M12 5l7 7-7 7', color: '#3b82f6' },
    { dir: 'UP', path: 'M12 19V5 M5 12l7-7 7 7', color: '#ef4444' },
    { dir: 'DOWN', path: 'M12 5v14 M19 12l-7 7-7-7', color: '#10b981' }
];

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    let dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
function playSound(type) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    
    if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'over') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
    }
}

let score = 0, gameOver = false, gameStarted = false;
let balloonTilt = 0, balloonAltitude = 50;
let cards = [], spawnInterval = 2000, spawnTimer = 0;
let lastTime = 0, gameLoopId;
let shakeTime = 0;

let bgClouds = [], fgClouds = [];
for(let i=0; i<6; i++) bgClouds.push({ x: Math.random()*2000, y: Math.random()*500, speed: 10+Math.random()*15, size: 0.5+Math.random() });
for(let i=0; i<3; i++) fgClouds.push({ x: Math.random()*2000, y: 300+Math.random()*300, speed: 30+Math.random()*20, size: 1.5+Math.random() });

function drawCanvas() {
    let t = performance.now();
    let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let theme = isDark ? {
        skyTop: '#001233', skyMid: '#002855', skyBot: '#00509d', sun: 'rgba(255,255,255,0.05)',
        hill1: '#001845', hill2: '#000c24', balloon: '#ff4d4d', basket: '#1a1a1a',
        bgCloud: 'rgba(255,255,255,0.08)', fgCloud: 'rgba(0,0,0,0.3)'
    } : {
        skyTop: '#ff5e00', skyMid: '#ffae00', skyBot: '#ffe066', sun: 'rgba(255,255,255,0.2)',
        hill1: '#cc5500', hill2: '#8b3a00', balloon: '#e63946', basket: '#5c3a21',
        bgCloud: 'rgba(255,255,255,0.25)', fgCloud: 'rgba(255,255,255,0.15)'
    };

    ctx.clearRect(0, 0, width, height);

    let grd = ctx.createLinearGradient(0, 0, 0, height);
    grd.addColorStop(0, theme.skyTop); grd.addColorStop(0.5, theme.skyMid); grd.addColorStop(1, theme.skyBot);
    ctx.fillStyle = grd; ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = theme.sun;
    ctx.beginPath(); ctx.arc(width/2, height*0.4, width*0.25, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(width/2, height*0.4, width*0.18, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = theme.bgCloud;
    bgClouds.forEach(c => {
        c.x -= c.speed * 0.016;
        if (c.x < -100) { c.x = width + 100; c.y = Math.random() * height * 0.5; }
        ctx.beginPath();
        ctx.arc(c.x, c.y, 30*c.size, 0, Math.PI*2);
        ctx.arc(c.x+25*c.size, c.y-10*c.size, 25*c.size, 0, Math.PI*2);
        ctx.arc(c.x+50*c.size, c.y, 20*c.size, 0, Math.PI*2);
        ctx.fill();
    });

    ctx.fillStyle = theme.hill1;
    ctx.beginPath(); ctx.moveTo(0, height);
    for(let x=0; x<=width+20; x+=20) ctx.lineTo(x, height*0.7 + Math.sin(x*0.003 + t*0.0005)*40);
    ctx.lineTo(width, height); ctx.fill();

    ctx.fillStyle = theme.hill2;
    ctx.beginPath(); ctx.moveTo(0, height);
    for(let x=0; x<=width+20; x+=20) ctx.lineTo(x, height*0.85 + Math.sin(x*0.005 + t*0.001 + 100)*30);
    ctx.lineTo(width, height); ctx.fill();

    ctx.save();
    let shakeX = shakeTime > 0 ? (Math.random()-0.5)*15 : 0;
    let shakeY = shakeTime > 0 ? (Math.random()-0.5)*15 : 0;
    let hoverY = gameStarted ? 0 : Math.sin(t*0.002)*10;
    let by = height*0.75 - (balloonAltitude/100)*(height*0.6) + hoverY;
    
    ctx.translate(width/2 + shakeX, by + shakeY);
    ctx.rotate(balloonTilt * Math.PI / 180);
    ctx.scale(1.5, 1.5);

    ctx.fillStyle = theme.basket; ctx.fillRect(-12, 45, 24, 16);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-12,45); ctx.lineTo(-20,10); ctx.moveTo(12,45); ctx.lineTo(20,10);
    ctx.moveTo(-4,45); ctx.lineTo(-8,10); ctx.moveTo(4,45); ctx.lineTo(8,10); ctx.stroke();

    if (gameStarted && Math.random() > 0.3) {
        ctx.fillStyle = '#ffb703'; ctx.beginPath();
        ctx.moveTo(0,40); ctx.lineTo(5,25+Math.random()*8); ctx.lineTo(-5,25+Math.random()*8); ctx.fill();
    }

    ctx.fillStyle = theme.balloon;
    ctx.beginPath(); ctx.moveTo(0,-60);
    ctx.bezierCurveTo(40,-60, 50,-5, 20,20); ctx.lineTo(-20,20);
    ctx.bezierCurveTo(-50,-5, -40,-60, 0,-60); ctx.fill();

    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.2)' : '#f1faee';
    ctx.beginPath(); ctx.moveTo(0,-60);
    ctx.bezierCurveTo(15,-60, 20,-5, 10,20); ctx.lineTo(-10,20);
    ctx.bezierCurveTo(-20,-5, -15,-60, 0,-60); ctx.fill();
    ctx.restore();

    ctx.fillStyle = theme.fgCloud;
    fgClouds.forEach(c => {
        c.x -= c.speed * 0.016;
        if (c.x < -200) { c.x = width + 200; c.y = height*0.5 + Math.random()*height*0.4; }
        ctx.beginPath();
        ctx.arc(c.x, c.y, 60*c.size, 0, Math.PI*2);
        ctx.arc(c.x+50*c.size, c.y-20*c.size, 50*c.size, 0, Math.PI*2);
        ctx.arc(c.x+100*c.size, c.y, 40*c.size, 0, Math.PI*2);
        ctx.fill();
    });
}

function updateCardsVisuals() {
    let cardSpacing = Math.min(window.innerHeight * 0.15, 90);
    cards.forEach((c, i) => {
        c.el.style.bottom = `${i * cardSpacing}px`;
        c.el.style.zIndex = 10 - i;
        c.el.style.opacity = i >= 5 ? 0 : 1;
        let scale = Math.max(0.7, 1 - (i * 0.08));
        c.el.querySelector('.card-scale').style.transform = `scale(${scale})`;
    });
}

function spawnCard() {
    let type = GUST_TYPES[Math.floor(Math.random() * GUST_TYPES.length)];
    let el = document.createElement('div'); el.className = 'card';
    el.innerHTML = `<div class="card-scale"><div class="card-inner"><svg width="60%" height="60%" viewBox="0 0 24 24" fill="none" stroke="${type.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="${type.path}"/></svg></div></div>`;
    queueEl.appendChild(el);
    cards.push({ type: type.dir, el: el });
    updateCardsVisuals();
}

function handleCorrectSort() {
    score++; scoreDisplay.innerText = score;
    scoreDisplay.style.transform = 'scale(1.3)';
    setTimeout(() => scoreDisplay.style.transform = 'scale(1)', 100);
    balloonTilt *= 0.6;
    if (Math.abs(balloonTilt) < 2) balloonTilt = 0;
    balloonAltitude = Math.min(100, balloonAltitude + 8);
    spawnInterval = Math.max(500, 2000 - score * 25);
    playSound('correct');
    if (navigator.vibrate) navigator.vibrate(20);
}

function handleWrongSort(type) {
    if (type === 'LEFT') balloonTilt -= 25;
    else if (type === 'RIGHT') balloonTilt += 25;
    else if (type === 'UP') balloonAltitude -= 20;
    else if (type === 'DOWN') { balloonAltitude -= 10; balloonTilt += (Math.random() > 0.5 ? 20 : -20); }
    
    shakeTime = 0.2;
    document.body.style.animation = 'none';
    void document.body.offsetWidth;
    document.body.style.animation = 'shake 0.2s cubic-bezier(.36,.07,.19,.97) both';
    playSound('wrong');
    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
}

function failBottomCard() {
    let failed = cards.shift(); handleWrongSort(failed.type);
    let inner = failed.el.querySelector('.card-inner');
    inner.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    inner.style.transform = `translate(0px, 100px) scale(0.5)`; inner.style.opacity = '0';
    setTimeout(() => failed.el.remove(), 300);
    updateCardsVisuals();
    if (cards.length === 0) { spawnCard(); spawnTimer = performance.now(); }
}

function processSwipe(dir) {
    let card = cards.shift();
    let isCorrect = (card.type === dir);
    let inner = card.el.querySelector('.card-inner');
    inner.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    
    let overX = currentX > 0 ? 300 : currentX < 0 ? -300 : 0;
    let overY = currentY > 0 ? 300 : currentY < 0 ? -300 : 0;
    if (dir === 'LEFT') { overX = -300; overY = currentY; }
    if (dir === 'RIGHT') { overX = 300; overY = currentY; }
    if (dir === 'UP') { overX = currentX; overY = -300; }
    if (dir === 'DOWN') { overX = currentX; overY = 300; }

    inner.style.transform = `translate(${overX}px, ${overY}px) rotate(${overX*0.1}deg)`;
    inner.style.opacity = '0';
    setTimeout(() => card.el.remove(), 300);
    
    if (isCorrect) handleCorrectSort(); else handleWrongSort(card.type);
    if (cards.length === 0) { spawnCard(); spawnTimer = performance.now(); }
    updateCardsVisuals();
}

let startX=0, startY=0, currentX=0, currentY=0, isDragging=false;
touchArea.addEventListener('pointerdown', e => {
    if (gameOver || !gameStarted || cards.length === 0) return;
    startX = e.clientX; startY = e.clientY; currentX = 0; currentY = 0; isDragging = true;
});
touchArea.addEventListener('pointermove', e => {
    if (!isDragging || cards.length === 0) return;
    currentX = e.clientX - startX; currentY = e.clientY - startY;
    let inner = cards[0].el.querySelector('.card-inner');
    inner.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${currentX*0.05}deg)`;
    
    if (Math.sqrt(currentX*currentX + currentY*currentY) > 60) {
        let angle = Math.atan2(currentY, currentX) * 180 / Math.PI;
        let dir = (angle > -45 && angle <= 45) ? 'RIGHT' : (angle > 45 && angle <= 135) ? 'DOWN' : (angle > 135 || angle <= -135) ? 'LEFT' : 'UP';
        isDragging = false; processSwipe(dir);
    }
});
let endDrag = () => {
    if (!isDragging || cards.length === 0) return;
    isDragging = false;
    let inner = cards[0].el.querySelector('.card-inner');
    inner.style.transition = 'transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    inner.style.transform = 'translate(0px, 0px) rotate(0deg)';
    setTimeout(() => { if (inner) inner.style.transition = ''; }, 200);
};
touchArea.addEventListener('pointerup', endDrag);
touchArea.addEventListener('pointercancel', endDrag);

window.addEventListener('keydown', e => {
    if (gameOver || !gameStarted || cards.length === 0) return;
    let dir = '';
    if (e.key === 'ArrowLeft') dir = 'LEFT'; if (e.key === 'ArrowRight') dir = 'RIGHT';
    if (e.key === 'ArrowUp') dir = 'UP'; if (e.key === 'ArrowDown') dir = 'DOWN';
    if (dir) {
        e.preventDefault();
        currentX = dir==='LEFT' ? -100 : dir==='RIGHT' ? 100 : 0;
        currentY = dir==='UP' ? -100 : dir==='DOWN' ? 100 : 0;
        processSwipe(dir); currentX = 0; currentY = 0;
    }
});

function gameLoop(time) {
    if (gameOver || !gameStarted) return;
    gameLoopId = requestAnimationFrame(gameLoop);
    
    let dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;
    
    balloonAltitude -= 4 * dt; 
    if (balloonTilt !== 0) {
        let tf = Math.abs(balloonTilt) / 60;
        balloonAltitude -= 15 * tf * dt;
        balloonTilt += Math.sign(balloonTilt) * 15 * tf * dt;
    }
    
    if (balloonTilt > 60 || balloonTilt < -60 || balloonAltitude <= 0) {
        endGame(); return;
    }
    balloonAltitude = Math.min(100, balloonAltitude);
    
    if (time - spawnTimer > spawnInterval) {
        spawnTimer = time;
        if (cards.length >= 5) failBottomCard();
        spawnCard();
    }
    if (shakeTime > 0) shakeTime -= dt;
    drawCanvas();
}

function idleLoop(t) {
    if (!gameStarted) { drawCanvas(); requestAnimationFrame(idleLoop); }
}

function startGame() {
    score = 0; gameOver = false; gameStarted = true;
    balloonTilt = 0; balloonAltitude = 50; spawnInterval = 2000;
    scoreDisplay.innerText = '0';
    queueEl.innerHTML = ''; cards = []; spawnCard();
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    
    lastTime = performance.now(); spawnTimer = lastTime;
    if (gameLoopId) cancelAnimationFrame(gameLoopId);
    gameLoopId = requestAnimationFrame(gameLoop);
}

function endGame() {
    gameOver = true; gameStarted = false;
    document.getElementById('hud').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'flex';
    document.getElementById('final-score').innerText = score;
    playSound('over');
    if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
    requestAnimationFrame(idleLoop);
}

document.getElementById('start-btn').addEventListener('click', () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); startGame(); });
document.getElementById('restart-btn').addEventListener('click', () => { startGame(); });

window.onload = () => { resize(); requestAnimationFrame(idleLoop); };
</script>
</body>
</html>
