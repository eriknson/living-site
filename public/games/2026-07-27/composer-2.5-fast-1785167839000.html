<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clear Current</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #e8e2d6;
    --text: #1c2a32;
    --muted: #5c6e78;
    --accent: #c96a3a;
    --accent2: #3a7a8c;
    --panel: rgba(255,252,246,0.92);
    --panel-border: rgba(28,42,50,0.1);
    --btn-bg: #1c2a32;
    --btn-text: #f6f2ea;
    --hud-bg: rgba(255,252,246,0.78);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a1e;
      --text: #d8e2e8;
      --muted: #7a909a;
      --accent: #e89058;
      --accent2: #5a9aaa;
      --panel: rgba(16,24,28,0.94);
      --panel-border: rgba(216,226,232,0.08);
      --btn-bg: #d8e2e8;
      --btn-text: #121a1e;
      --hud-bg: rgba(16,24,28,0.82);
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
  }
  canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    touch-action: none;
  }
  .hud {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    gap: 6px;
    pointer-events: none;
    z-index: 2;
    flex-wrap: wrap;
  }
  .hud-pill {
    background: var(--hud-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 10px;
    letter-spacing: 0.05em;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .hud-pill span { color: var(--accent); }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 3;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 26px 22px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    pointer-events: none;
  }
  .panel h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .panel .tag {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 12px;
  }
  .panel p {
    font-size: 11px;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .panel .score-big {
    font-size: 32px;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .panel .score-label {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    min-width: 168px;
    padding: 12px 22px;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    pointer-events: auto;
    transition: transform 0.14s ease, opacity 0.14s;
  }
  .btn:active { transform: scale(0.96); opacity: 0.88; }
  .toast {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%) scale(0.9);
    font-size: 18px;
    letter-spacing: 0.08em;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    transition: opacity 0.18s, transform 0.18s;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .lane-hint {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
    z-index: 2;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div class="hud" id="hud">
    <div class="hud-pill">gaps <span id="scoreVal">0</span></div>
    <div class="hud-pill">wind <span id="comboVal">×0</span></div>
    <div class="hud-pill"><span id="timeVal">30</span>s</div>
  </div>
  <div class="lane-hint" id="laneHint">← swipe lanes →</div>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="titleScreen">
    <div class="panel">
      <h1>Clear Current</h1>
      <div class="tag">bay · july · smoke line</div>
      <p>Slide your balloon through pockets of clear air as smoke bands drift across the map. Thread three gaps in a row — read the wind.</p>
      <button class="btn" data-smoke="start" id="startBtn">Launch Balloon</button>
    </div>
  </div>
  <div class="overlay hidden" id="gameOverScreen">
    <div class="panel">
      <h1>Lost in Haze</h1>
      <div class="score-big" id="finalScore">0</div>
      <div class="score-label">gaps threaded</div>
      <p id="gameOverMsg">The smoke swallowed your route.</p>
      <button class="btn" data-smoke="restart" id="restartBtn">Fly Again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('scoreVal');
  var comboEl = document.getElementById('comboVal');
  var timeEl = document.getElementById('timeVal');
  var titleScreen = document.getElementById('titleScreen');
  var gameOverScreen = document.getElementById('gameOverScreen');
  var finalScoreEl = document.getElementById('finalScore');
  var gameOverMsg = document.getElementById('gameOverMsg');
  var toastEl = document.getElementById('toast');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var hud = document.getElementById('hud');
  var laneHint = document.getElementById('laneHint');

  var LANES = 3;
  var W = 360, H = 640, dpr = 1;
  var state = 'title';
  var score = 0, combo = 0, bestCombo = 0;
  var timeLeft = 30, elapsed = 0, difficulty = 0;
  var lane = 1, laneFrom = 1, laneTo = 1, laneT = 1;
  var bands = [], particles = [], mapLines = [];
  var spawnTimer = 0, nextSpawn = 1.4;
  var lastTs = 0, animId = 0, hitStop = 0;
  var balloonY = 0, laneW = 0, laneX = [];
  var touchSX = 0, touchSY = 0, touchActive = false;
  var dark = false, audioCtx = null;
  var coastPts = [];

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  }
  dark = prefersDark();
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        dark = e.matches;
      });
    } catch (e) { /* ignore */ }
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rand(a, b) { return a + Math.random() * (b - a); }

  function layoutLanes() {
    var pad = W * 0.08;
    laneW = (W - pad * 2) / LANES;
    laneX = [];
    for (var i = 0; i < LANES; i++) laneX.push(pad + laneW * i + laneW * 0.5);
    balloonY = H * 0.74;
  }

  function buildMapLines() {
    mapLines = [];
    for (var i = 0; i < 7; i++) {
      mapLines.push({
        yBase: H * (0.12 + i * 0.11),
        amp: rand(8, 22),
        freq: rand(0.004, 0.009),
        phase: rand(0, Math.PI * 2),
        drift: rand(-0.2, 0.2)
      });
    }
    coastPts = [];
    for (var x = 0; x <= W; x += 6) {
      coastPts.push({
        x: x,
        y: H * 0.42 + Math.sin(x * 0.012) * 18 + Math.sin(x * 0.004 + 1) * 10
      });
    }
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layoutLanes();
    buildMapLines();
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, vol, type) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.07, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* ignore */ }
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ }
  }

  function showToast(txt) {
    if (!toastEl) return;
    toastEl.textContent = txt;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 700);
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) comboEl.textContent = '×' + combo;
    if (timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
  }

  function balloonX() {
    var a = laneX[laneFrom] || laneX[1];
    var b = laneX[laneTo] || laneX[1];
    var t = laneT * laneT * (3 - 2 * laneT);
    return a + (b - a) * t;
  }

  function moveLane(dir) {
    if (state !== 'playing') return;
    var next = clamp(lane + dir, 0, LANES - 1);
    if (next === lane) return;
    laneFrom = lane;
    laneTo = next;
    lane = next;
    laneT = 0;
    playTone(180 + next * 40, 0.06, 0.04, 'triangle');
    vibrate(8);
  }

  function clearLanesCount() {
    if (difficulty < 0.35) return rand(0.5, 0.85) < 0.55 ? 2 : 1;
    if (difficulty < 0.65) return rand(0.5, 0.85) < 0.35 ? 2 : 1;
    return rand(0.5, 0.85) < 0.18 ? 2 : 1;
  }

  function makeBand(mergeExtra) {
    var blocked = [true, true, true];
    var clears = clearLanesCount();
    var start = Math.floor(rand(0, LANES));
    for (var c = 0; c < clears; c++) {
      var idx = (start + c) % LANES;
      blocked[idx] = false;
    }
    if (mergeExtra) {
      for (var i = 0; i < LANES; i++) {
        if (!blocked[i] && Math.random() < 0.45) blocked[i] = true;
      }
      if (blocked[0] && blocked[1] && blocked[2]) blocked[1] = false;
    }
    var thick = 28 + difficulty * 18 + (mergeExtra ? 14 : 0);
    return {
      y: -thick - rand(0, 40),
      h: thick,
      blocked: blocked,
      drift: rand(-18, 18) * (0.4 + difficulty),
      driftOff: 0,
      passed: false,
      scored: false,
      merge: !!mergeExtra,
      alpha: 0.55 + rand(0, 0.25)
    };
  }

  function resetRun() {
    bands = [];
    particles = [];
    score = 0;
    combo = 0;
    bestCombo = 0;
    timeLeft = 30;
    elapsed = 0;
    difficulty = 0;
    lane = 1;
    laneFrom = 1;
    laneTo = 1;
    laneT = 1;
    spawnTimer = 0;
    nextSpawn = 2.0;
    hitStop = 0;
    lastTs = 0;
  }

  function startGame() {
    initAudio();
    state = 'playing';
    resetRun();
    if (titleScreen) titleScreen.classList.add('hidden');
    if (gameOverScreen) gameOverScreen.classList.add('hidden');
    if (hud) hud.style.opacity = '1';
    if (laneHint) laneHint.style.opacity = '0.85';
    updateHUD();
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }

  function endGame(reason) {
    state = 'over';
    if (animId) cancelAnimationFrame(animId);
    animId = 0;
    if (finalScoreEl) finalScoreEl.textContent = String(score);
    if (gameOverMsg) {
      if (reason === 'time') gameOverMsg.textContent = 'Sunset over the bay — you read the wind well.';
      else if (reason === 'merge') gameOverMsg.textContent = 'Smoke lanes merged and closed every gap.';
      else gameOverMsg.textContent = 'You drifted into the haze.';
    }
    if (gameOverScreen) gameOverScreen.classList.remove('hidden');
    if (laneHint) laneHint.style.opacity = '0';
    playTone(70, 0.35, 0.06, 'sawtooth');
    vibrate(40);
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < (n || 12); i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = rand(30, 110);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 20,
        life: rand(0.35, 0.7),
        max: 0.7,
        r: rand(1.5, 3.5),
        col: col
      });
    }
  }

  function passGap() {
    score++;
    combo++;
    if (combo > bestCombo) bestCombo = combo;
    var pts = combo >= 3 ? combo : 1;
    hitStop = 0.04;
    burst(balloonX(), balloonY, dark ? 'rgba(232,144,88,0.95)' : 'rgba(201,106,58,0.9)', 10);
    playTone(260 + combo * 22, 0.12, 0.06);
    vibrate(10);
    if (combo === 3) showToast('reading wind ×3');
    else if (combo === 5) showToast('clear run ×5');
    else if (combo >= 7 && combo % 2 === 1) showToast('thread ×' + combo);
    updateHUD();
  }

  function failGap() {
    combo = 0;
    updateHUD();
    endGame('smoke');
  }

  function spawnBand() {
    var merge = difficulty > 0.45 && Math.random() < 0.12 + difficulty * 0.08;
    bands.push(makeBand(merge));
    var gap = 1.35 - difficulty * 0.55;
    nextSpawn = clamp(gap + rand(-0.15, 0.15), 0.55, 1.6);
  }

  function update(dt) {
    if (state !== 'playing') return;
    if (hitStop > 0) {
      hitStop -= dt;
      return;
    }

    elapsed += dt;
    timeLeft -= dt;
    difficulty = clamp(elapsed / 28, 0, 1);

    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame('time');
      return;
    }
    if (state !== 'playing') return;

    if (laneT < 1) {
      laneT = Math.min(1, laneT + dt * 9);
    }

    spawnTimer += dt;
    if (spawnTimer >= nextSpawn) {
      spawnTimer = 0;
      spawnBand();
    }

    var baseSpeed = 95 + difficulty * 85;
    for (var i = bands.length - 1; i >= 0; i--) {
      var b = bands[i];
      b.y += baseSpeed * dt;
      b.driftOff += b.drift * dt;

      if (!b.scored && b.y + b.h >= balloonY - 8 && b.y <= balloonY + 8) {
        b.scored = true;
        var bx = balloonX();
        var laneIdx = 0;
        var bestD = 1e9;
        for (var li = 0; li < LANES; li++) {
          var d = Math.abs(bx - laneX[li]);
          if (d < bestD) { bestD = d; laneIdx = li; }
        }
        if (b.blocked[laneIdx]) {
          failGap();
          return;
        }
        passGap();
      }

      if (b.y > H + 60) bands.splice(i, 1);
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.life -= dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 40 * dt;
      if (pt.life <= 0) particles.splice(p, 1);
    }

    updateHUD();
  }

  function drawPaper() {
    if (!ctx) return;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    if (dark) {
      g.addColorStop(0, '#1a2830');
      g.addColorStop(0.45, '#162228');
      g.addColorStop(1, '#101820');
    } else {
      g.addColorStop(0, '#c8dce8');
      g.addColorStop(0.35, '#dce8ee');
      g.addColorStop(1, '#ebe4d8');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.globalAlpha = dark ? 0.04 : 0.06;
    for (var n = 0; n < 120; n++) {
      ctx.fillStyle = dark ? '#90a8b0' : '#8a9a90';
      ctx.fillRect((n * 47) % W, (n * 83) % H, 1.2, 1.2);
    }
    ctx.globalAlpha = 1;
  }

  function drawSunset() {
    if (!ctx) return;
    var sx = W * 0.78, sy = H * 0.16;
    var sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, W * 0.42);
    if (dark) {
      sg.addColorStop(0, 'rgba(232,144,88,0.22)');
      sg.addColorStop(0.4, 'rgba(200,120,70,0.08)');
      sg.addColorStop(1, 'rgba(200,120,70,0)');
    } else {
      sg.addColorStop(0, 'rgba(255,190,120,0.55)');
      sg.addColorStop(0.35, 'rgba(255,170,100,0.15)');
      sg.addColorStop(1, 'rgba(255,170,100,0)');
    }
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, H * 0.55);
  }

  function drawCoast() {
    if (!ctx || !coastPts.length) return;
    ctx.fillStyle = dark ? 'rgba(60,90,100,0.35)' : 'rgba(90,130,145,0.28)';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.38);
    for (var i = 0; i < coastPts.length; i++) ctx.lineTo(coastPts[i].x, coastPts[i].y);
    ctx.lineTo(W, H * 0.38);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = dark ? 'rgba(90,130,145,0.5)' : 'rgba(60,100,120,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(coastPts[0].x, coastPts[0].y);
    for (var j = 1; j < coastPts.length; j++) ctx.lineTo(coastPts[j].x, coastPts[j].y);
    ctx.stroke();
  }

  function drawIsobars() {
    if (!ctx) return;
    var t = elapsed * 0.15;
    for (var i = 0; i < mapLines.length; i++) {
      var ml = mapLines[i];
      ctx.beginPath();
      for (var x = 0; x <= W; x += 4) {
        var y = ml.yBase + Math.sin(x * ml.freq + ml.phase + t * ml.drift) * ml.amp;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = dark ? 'rgba(80,110,120,0.18)' : 'rgba(70,110,130,0.16)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawLaneGuides() {
    if (!ctx) return;
    var pad = W * 0.08;
    ctx.strokeStyle = dark ? 'rgba(120,150,160,0.12)' : 'rgba(80,120,140,0.1)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 8]);
    for (var i = 1; i < LANES; i++) {
      var lx = pad + laneW * i;
      ctx.beginPath();
      ctx.moveTo(lx, H * 0.08);
      ctx.lineTo(lx, H * 0.95);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function drawSmokeBand(b) {
    if (!ctx) return;
    var pad = W * 0.04;
    var drift = b.driftOff;

    for (var li = 0; li < LANES; li++) {
      if (!b.blocked[li]) continue;
      var cx = laneX[li] + drift * 0.3;
      var bw = laneW * 0.92;
      var bleed = 14 + difficulty * 8;

      var rg = ctx.createLinearGradient(cx - bw * 0.5, b.y, cx + bw * 0.5, b.y + b.h);
      var a = b.alpha;
      if (dark) {
        rg.addColorStop(0, 'rgba(70,85,80,0)');
        rg.addColorStop(0.2, 'rgba(90,105,98,' + (a * 0.5) + ')');
        rg.addColorStop(0.5, 'rgba(110,125,118,' + (a * 0.85) + ')');
        rg.addColorStop(0.8, 'rgba(90,105,98,' + (a * 0.5) + ')');
        rg.addColorStop(1, 'rgba(70,85,80,0)');
      } else {
        rg.addColorStop(0, 'rgba(140,155,148,0)');
        rg.addColorStop(0.2, 'rgba(160,175,168,' + (a * 0.45) + ')');
        rg.addColorStop(0.5, 'rgba(180,190,182,' + (a * 0.75) + ')');
        rg.addColorStop(0.8, 'rgba(160,175,168,' + (a * 0.45) + ')');
        rg.addColorStop(1, 'rgba(140,155,148,0)');
      }
      ctx.fillStyle = rg;
      ctx.fillRect(cx - bw * 0.5 - bleed, b.y - bleed * 0.3, bw + bleed * 2, b.h + bleed * 0.6);

      ctx.globalAlpha = a * 0.35;
      ctx.fillStyle = dark ? 'rgba(130,150,140,0.4)' : 'rgba(200,210,205,0.5)';
      ctx.beginPath();
      ctx.ellipse(cx + drift * 0.15, b.y + b.h * 0.5, bw * 0.35, b.h * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (b.merge) {
      ctx.fillStyle = dark ? 'rgba(232,144,88,0.15)' : 'rgba(201,106,58,0.12)';
      ctx.fillRect(pad, b.y, W - pad * 2, 2);
    }
  }

  function drawBalloon() {
    if (!ctx) return;
    var bx = balloonX();
    var by = balloonY;
    var sway = Math.sin(elapsed * 2.2) * 3;

    ctx.strokeStyle = dark ? 'rgba(180,200,210,0.5)' : 'rgba(80,110,130,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx, by + 14);
    ctx.lineTo(bx + sway * 0.3, by + 38);
    ctx.stroke();

    var bg = ctx.createRadialGradient(bx - 4, by - 6, 2, bx, by, 22);
    if (dark) {
      bg.addColorStop(0, '#f0c898');
      bg.addColorStop(0.55, '#e89058');
      bg.addColorStop(1, 'rgba(200,120,70,0.2)');
    } else {
      bg.addColorStop(0, '#ffe8c8');
      bg.addColorStop(0.55, '#e89858');
      bg.addColorStop(1, 'rgba(201,106,58,0.15)');
    }
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(bx + sway * 0.2, by, 16, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = dark ? 'rgba(232,144,88,0.8)' : 'rgba(201,106,58,0.7)';
    ctx.beginPath();
    ctx.moveTo(bx + sway * 0.2 - 5, by + 18);
    ctx.lineTo(bx + sway * 0.2 + 5, by + 18);
    ctx.lineTo(bx + sway * 0.2, by + 24);
    ctx.closePath();
    ctx.fill();

    if (combo >= 3) {
      ctx.globalAlpha = 0.25 + Math.sin(elapsed * 6) * 0.1;
      ctx.strokeStyle = dark ? '#e89058' : '#c96a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bx, by, 28 + combo * 0.8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles() {
    if (!ctx) return;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawScanLine() {
    if (!ctx || state !== 'playing') return;
    ctx.strokeStyle = dark ? 'rgba(232,144,88,0.35)' : 'rgba(201,106,58,0.3)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(W * 0.06, balloonY);
    ctx.lineTo(W * 0.94, balloonY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function draw() {
    if (!ctx) return;
    drawPaper();
    drawSunset();
    drawCoast();
    drawIsobars();
    drawLaneGuides();
    for (var i = 0; i < bands.length; i++) drawSmokeBand(bands[i]);
    drawScanLine();
    drawBalloon();
    drawParticles();

    if (state === 'playing' && timeLeft <= 5) {
      ctx.fillStyle = dark ? 'rgba(232,144,88,0.12)' : 'rgba(201,106,58,0.08)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawIdle() {
    if (!ctx) return;
    elapsed += 0.012;
    drawPaper();
    drawSunset();
    drawCoast();
    drawIsobars();
    drawLaneGuides();
    bands = [
      makeBand(false),
      makeBand(false)
    ];
    bands[0].y = H * 0.35;
    bands[1].y = H * 0.52;
    for (var i = 0; i < bands.length; i++) {
      bands[i].driftOff = Math.sin(elapsed + i) * 8;
      drawSmokeBand(bands[i]);
    }
    laneT = 1;
    lane = 1;
    laneFrom = 1;
    laneTo = 1;
    drawBalloon();
    bands = [];
  }

  function loop(ts) {
    if (state !== 'playing') return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    update(dt);
    draw();
    if (state === 'playing') animId = requestAnimationFrame(loop);
  }

  function idleLoop() {
    if (state !== 'title' && state !== 'over') return;
    drawIdle();
    animId = requestAnimationFrame(idleLoop);
  }

  function onTouchStart(e) {
    try { e.preventDefault(); } catch (err) { /* ignore */ }
    if (!e.touches || !e.touches.length) return;
    touchSX = e.touches[0].clientX;
    touchSY = e.touches[0].clientY;
    touchActive = true;
  }

  function onTouchEnd(e) {
    try { e.preventDefault(); } catch (err) { /* ignore */ }
    if (!touchActive || !e.changedTouches || !e.changedTouches.length) return;
    touchActive = false;
    var dx = e.changedTouches[0].clientX - touchSX;
    var dy = e.changedTouches[0].clientY - touchSY;
    if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      moveLane(dx > 0 ? 1 : -1);
    }
  }

  function onKeyDown(e) {
    if (!e || state !== 'playing') return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      moveLane(-1);
      try { e.preventDefault(); } catch (err) { /* ignore */ }
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      moveLane(1);
      try { e.preventDefault(); } catch (err) { /* ignore */ }
    }
  }

  if (canvas) {
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('mousedown', function (e) {
      try { e.preventDefault(); } catch (err) { /* ignore */ }
    });
  }

  window.addEventListener('keydown', onKeyDown);

  if (startBtn) {
    startBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
  }
  if (restartBtn) {
    restartBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
  }

  window.addEventListener('resize', resize);

  resize();
  updateHUD();
  if (hud) hud.style.opacity = '0.55';
  drawIdle();
  animId = requestAnimationFrame(idleLoop);

})();
</script>
</body>
</html>
