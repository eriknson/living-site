<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golden Hour Bay</title>
<style>
    :root {
        --ui-font: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    }
    body, html {
        margin: 0;
        padding: 0;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        background-color: #000;
        font-family: var(--ui-font);
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }
    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }
    #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }
    .screen {
        background: rgba(255, 255, 255, 0.9);
        padding: 2.5rem;
        border-radius: 1.5rem;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        pointer-events: auto;
        color: #222;
        transition: opacity 0.3s;
        max-width: 80%;
    }
    @media (prefers-color-scheme: dark) {
        .screen {
            background: rgba(30, 30, 30, 0.9);
            color: #eee;
        }
    }
    h1 { margin: 0 0 1rem 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
    p { margin: 0 0 2rem 0; font-size: 1rem; opacity: 0.8; line-height: 1.5; }
    button {
        font-family: var(--ui-font);
        background: #222;
        color: #fff;
        border: none;
        padding: 1rem 2.5rem;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 3rem;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        transition: transform 0.1s, background 0.2s;
    }
    @media (prefers-color-scheme: dark) {
        button {
            background: #eee;
            color: #222;
        }
    }
    button:active {
        transform: scale(0.95);
    }
    #hud {
        position: absolute;
        top: env(safe-area-inset-top, 2rem);
        left: 2rem;
        right: 2rem;
        display: flex;
        justify-content: space-between;
        font-size: 1.5rem;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    #combo-display {
        color: #ffdd66;
        opacity: 0;
        transition: opacity 0.2s, transform 0.1s;
    }
    #combo-display.active {
        opacity: 1;
        transform: scale(1.1);
    }
</style>
</head>
<body>
<div id="ui-layer">
    <div id="start-screen" class="screen">
        <h1>Golden Hour Bay</h1>
        <p>Flick the paper boat.<br>Collect the light.<br>Avoid the fog.</p>
        <button data-smoke="start">Start</button>
    </div>
    <div id="game-over-screen" class="screen" style="display: none;">
        <h1>Lost in the Fog</h1>
        <p>Score: <span id="final-score">0</span></p>
        <button data-smoke="restart">Restart</button>
    </div>
    <div id="hud" style="display: none;">
        <div id="score-display">0</div>
        <div id="combo-display">x1</div>
    </div>
</div>
<canvas id="game-canvas"></canvas>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const hud = document.getElementById('hud');
const scoreDisplay = document.getElementById('score-display');
const comboDisplay = document.getElementById('combo-display');
const finalScore = document.getElementById('final-score');
const startBtn = document.querySelector('[data-smoke="start"]');
const restartBtn = document.querySelector('[data-smoke="restart"]');

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    if (gameState === 'start') {
        actualRadius = Math.max(width, height) * 0.6;
        boat.x = width / 2;
        boat.y = height - 150;
        draw();
    }
}
window.addEventListener('resize', resize);

let colors = {};
function updateColors() {
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (isDark) {
        colors = {
            water: '#1e3b4d',
            fogOuter: '#0f171e',
            fogMid: '#18242f',
            fogInner: '#223343',
            light: '#ffdd66',
            boat: '#cccccc',
            boatShadow: '#000000',
            sunset: '#ff5555'
        };
    } else {
        colors = {
            water: '#e89a7a',
            fogOuter: '#c8d0d8',
            fogMid: '#d8e0e8',
            fogInner: '#e8f0f8',
            light: '#fff59d',
            boat: '#ffffff',
            boatShadow: '#884422',
            sunset: '#ff3333'
        };
    }
    if (gameState === 'start') draw();
}
if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
}

let gameState = 'start';
let gameTime = 0;
let lastTime = 0;
let score = 0;
let combo = 1;
let comboTimer = 0;
let initialRadius = 0;
let actualRadius = 0;
let bonusRadius = 0;
let fogDamage = 0;
let screenShake = 0;
let sunsetY = -100;

let boat = { x: 0, y: 0, vx: 0, vy: 0, angle: -Math.PI/2 };
let orbs = [];
let particles = [];
let trail = [];

let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let dragCurrX = 0, dragCurrY = 0;

function initGame() {
    score = 0;
    combo = 1;
    comboTimer = 0;
    gameTime = 0;
    fogDamage = 0;
    screenShake = 0;
    initialRadius = Math.max(width, height) * 0.6;
    actualRadius = initialRadius;
    bonusRadius = 0;
    sunsetY = -100;
    
    boat = {
        x: width / 2,
        y: height - 150,
        vx: 0,
        vy: 0,
        angle: -Math.PI/2
    };
    orbs = [];
    particles = [];
    trail = [];
    
    for(let i=0; i<6; i++) spawnOrb();
    updateScoreUI();
}

function spawnOrb() {
    let angle = Math.random() * Math.PI * 2;
    let r = Math.random() * (actualRadius - 40);
    orbs.push({
        x: width/2 + Math.cos(angle) * r,
        y: height/2 + Math.sin(angle) * r,
        radius: 6 + Math.random() * 4
    });
}

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 4 + 1;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            maxLife: 1.0,
            color: color,
            size: Math.random() * 3 + 1.5
        });
    }
}

function updateScoreUI() {
    scoreDisplay.innerText = score;
    if (combo > 1) {
        comboDisplay.innerText = 'x' + combo;
        comboDisplay.classList.add('active');
    } else {
        comboDisplay.classList.remove('active');
    }
}

function gameOver() {
    gameState = 'gameover';
    hud.style.display = 'none';
    gameOverScreen.style.display = 'block';
    finalScore.innerText = score;
    playSound('over');
    vibrate([50, 100, 50]);
}

function startGame() {
    initAudio();
    initGame();
    gameState = 'playing';
    startScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    hud.style.display = 'flex';
    lastTime = performance.now();
    requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        
        if (type === 'flick') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'collect') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'combo') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            osc.frequency.setValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'over') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    } catch(e) {}
}

function vibrate(pattern) {
    try {
        if (navigator.vibrate) navigator.vibrate(pattern);
    } catch(e) {}
}

canvas.addEventListener('pointerdown', (e) => {
    if (gameState !== 'playing') return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragCurrX = e.clientX;
    dragCurrY = e.clientY;
});

canvas.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    dragCurrX = e.clientX;
    dragCurrY = e.clientY;
});

canvas.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    let dx = dragCurrX - dragStartX;
    let dy = dragCurrY - dragStartY;
    let dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 10) {
        let power = Math.min(dist * 0.07, 22);
        let angle = Math.atan2(dy, dx);
        boat.vx += Math.cos(angle) * power;
        boat.vy += Math.sin(angle) * power;
        playSound('flick');
        vibrate(10);
        spawnParticles(boat.x, boat.y, colors.water, 6);
    }
});

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

function update(dt) {
    gameTime += dt;
    
    boat.x += boat.vx;
    boat.y += boat.vy;
    boat.vx *= 0.96;
    boat.vy *= 0.96;
    
    let windMag = 0.3 + gameTime * 0.00001;
    let windX = Math.sin(gameTime * 0.001) * windMag;
    let windY = Math.cos(gameTime * 0.0013) * windMag;
    boat.vx += windX;
    boat.vy += windY;
    
    if (boat.x < 15) { boat.x = 15; boat.vx *= -0.6; }
    if (boat.x > width - 15) { boat.x = width - 15; boat.vx *= -0.6; }
    if (boat.y < 15) { boat.y = 15; boat.vy *= -0.6; }
    if (boat.y > height - 15) { boat.y = height - 15; boat.vy *= -0.6; }
    
    if (Math.abs(boat.vx) > 0.5 || Math.abs(boat.vy) > 0.5) {
        boat.angle = Math.atan2(boat.vy, boat.vx);
    }
    
    if (Math.random() < 0.03 + gameTime * 0.000005) {
        spawnOrb();
    }
    
    for (let i = orbs.length - 1; i >= 0; i--) {
        let orb = orbs[i];
        orb.x += windX * 0.6;
        orb.y += windY * 0.6;
        
        let dx = boat.x - orb.x;
        let dy = boat.y - orb.y;
        if (dx*dx + dy*dy < 600) {
            score += 10 * combo;
            bonusRadius += 25;
            if (bonusRadius > 150) bonusRadius = 150;
            playSound('collect');
            vibrate(15);
            spawnParticles(orb.x, orb.y, colors.light, 12);
            orbs.splice(i, 1);
            updateScoreUI();
        }
    }
    
    sunsetY += dt * 0.12;
    if (sunsetY > height + 200) {
        sunsetY = -200;
    }
    
    let distToSunset = Math.abs(boat.y - sunsetY);
    if (distToSunset < 35 && (boat.vx*boat.vx + boat.vy*boat.vy) > 10) {
        comboTimer = 1200;
        combo++;
        score += combo;
        spawnParticles(boat.x, boat.y, colors.sunset, 2);
        if (combo % 5 === 0) {
            playSound('combo');
            vibrate([20, 20, 20]);
        }
        updateScoreUI();
    }
    
    if (comboTimer > 0) {
        comboTimer -= dt;
    } else {
        if (combo > 1) {
            combo = 1;
            updateScoreUI();
        }
    }
    
    if (gameTime % 2 < 1 && (Math.abs(boat.vx) > 2 || Math.abs(boat.vy) > 2)) {
        trail.push({x: boat.x, y: boat.y, life: 1.0});
    }
    for (let i = trail.length - 1; i >= 0; i--) {
        trail[i].life -= dt * 0.002;
        if (trail[i].life <= 0) trail.splice(i, 1);
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 0.002;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    let targetRadius = Math.max(70, initialRadius - gameTime * 0.0035);
    bonusRadius *= 0.995;
    actualRadius = targetRadius + bonusRadius;
    
    let dx = boat.x - width/2;
    let dy = boat.y - height/2;
    let distFromCenter = Math.sqrt(dx*dx + dy*dy);
    
    if (distFromCenter > actualRadius - 15) {
        fogDamage += dt;
        screenShake = 5;
        if (fogDamage > 1500) {
            gameOver();
        }
    } else {
        fogDamage = Math.max(0, fogDamage - dt * 2);
    }
}

function drawFogLayer(radius, color, shadowBlur, timeOffset, noiseScale) {
    ctx.beginPath();
    ctx.rect(0, 0, width, height);
    let points = 50;
    for (let i = points; i >= 0; i--) {
        let angle = (i / points) * Math.PI * 2;
        let noise = Math.sin(angle * 5 + gameTime * 0.001 + timeOffset) * noiseScale +
                    Math.cos(angle * 8 - gameTime * 0.0015 + timeOffset) * (noiseScale * 0.6);
        let r = Math.max(1, radius + noise);
        let x = width/2 + Math.cos(angle) * r;
        let y = height/2 + Math.sin(angle) * r;
        if (i === points) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.fillStyle = color;
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = shadowBlur;
    ctx.fill();
    ctx.shadowBlur = 0;
}

function draw() {
    ctx.save();
    if (screenShake > 0) {
        ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }
    
    ctx.fillStyle = colors.water;
    ctx.fillRect(0, 0, width, height);
    
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let i=0; i<15; i++) {
        let y = (gameTime * 0.03 + i * 80) % height;
        let x = Math.sin(y * 0.01 + gameTime * 0.002) * 60 + width/2;
        ctx.moveTo(x - 80, y);
        ctx.lineTo(x + 80, y);
    }
    ctx.stroke();
    
    if (sunsetY > -50 && sunsetY < height + 50) {
        ctx.fillStyle = colors.sunset;
        ctx.globalAlpha = 0.4;
        ctx.fillRect(0, sunsetY - 30, width, 60);
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, sunsetY - 1, width, 2);
    }
    
    if (trail.length > 0) {
        ctx.beginPath();
        for (let i = 0; i < trail.length; i++) {
            if (i === 0) ctx.moveTo(trail[i].x, trail[i].y);
            else ctx.lineTo(trail[i].x, trail[i].y);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 3;
        ctx.stroke();
    }
    
    orbs.forEach(orb => {
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI*2);
        ctx.fillStyle = colors.light;
        ctx.shadowColor = colors.light;
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;
    });
    
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;
    
    ctx.save();
    ctx.translate(boat.x, boat.y);
    ctx.rotate(boat.angle);
    ctx.shadowColor = colors.boatShadow;
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 6;
    
    ctx.fillStyle = colors.boat;
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-16, -14);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-16, 14);
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-16, 14);
    ctx.lineTo(-6, 0);
    ctx.fill();
    ctx.restore();
    
    drawFogLayer(actualRadius + 60, colors.fogOuter, 30, 0, 25);
    drawFogLayer(actualRadius + 25, colors.fogMid, 20, 100, 18);
    drawFogLayer(actualRadius, colors.fogInner, 15, 200, 12);
    
    if (isDragging) {
        ctx.beginPath();
        ctx.moveTo(boat.x, boat.y);
        let dx = dragCurrX - dragStartX;
        let dy = dragCurrY - dragStartY;
        ctx.lineTo(boat.x + dx, boat.y + dy);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 4;
        ctx.setLineDash([8, 8]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    
    if (fogDamage > 0) {
        ctx.fillStyle = `rgba(255, 0, 0, ${fogDamage / 3000})`;
        ctx.fillRect(0, 0, width, height);
    }
    
    ctx.restore();
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    if (dt > 50) dt = 50;
    
    if (gameState === 'playing') {
        update(dt);
        draw();
        requestAnimationFrame(loop);
    }
}

resize();
updateColors();

</script>
</body>
</html>
