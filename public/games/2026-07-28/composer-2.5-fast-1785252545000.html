<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whisper Filter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0e0a;
    --phosphor: #39ff7a;
    --phosphor-dim: #1a8f45;
    --phosphor-glow: rgba(57, 255, 122, 0.35);
    --noise: #ff6b3d;
    --noise2: #ffb347;
    --noise3: #ff4466;
    --signal-dim: #2a5c3a;
    --text: #39ff7a;
    --muted: #4a7a58;
    --panel: rgba(8, 14, 10, 0.94);
    --panel-border: rgba(57, 255, 122, 0.18);
    --btn-bg: #39ff7a;
    --btn-text: #0a0e0a;
    --hud-bg: rgba(8, 14, 10, 0.82);
    --flood: #ff4466;
    --scanline: rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e8ede8;
      --phosphor: #0a6b32;
      --phosphor-dim: #4a9a68;
      --phosphor-glow: rgba(10, 107, 50, 0.25);
      --noise: #c44a20;
      --noise2: #c47a20;
      --noise3: #c42040;
      --signal-dim: #8ab89a;
      --text: #0a4a28;
      --muted: #5a8a6a;
      --panel: rgba(240, 246, 240, 0.96);
      --panel-border: rgba(10, 107, 50, 0.2);
      --btn-bg: #0a6b32;
      --btn-text: #f0f6f0;
      --hud-bg: rgba(240, 246, 240, 0.88);
      --flood: #c42040;
      --scanline: rgba(255, 255, 255, 0.06);
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
  }
  canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    touch-action: none;
  }
  .hud {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    gap: 6px;
    pointer-events: none;
    z-index: 2;
    flex-wrap: wrap;
  }
  .hud-pill {
    background: var(--hud-bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 5px 9px;
    font-size: 10px;
    letter-spacing: 0.06em;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .hud-pill span { color: var(--phosphor); }
  .flood-bar-wrap {
    position: absolute;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 2;
  }
  .flood-label {
    font-size: 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .flood-track {
    height: 6px;
    background: rgba(57, 255, 122, 0.08);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    overflow: hidden;
  }
  .flood-fill {
    height: 100%;
    width: 0%;
    background: var(--flood);
    border-radius: 2px;
    transition: width 0.15s ease;
    box-shadow: 0 0 8px var(--flood);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 3;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 26px 22px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    pointer-events: none;
    box-shadow: 0 0 40px var(--phosphor-glow);
  }
  .panel h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: var(--phosphor);
    text-shadow: 0 0 12px var(--phosphor-glow);
  }
  .panel .tag {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .panel p {
    font-size: 11px;
    line-height: 1.65;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .panel .score-big {
    font-size: 32px;
    color: var(--phosphor);
    margin-bottom: 2px;
    text-shadow: 0 0 16px var(--phosphor-glow);
  }
  .panel .score-label {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    min-width: 168px;
    padding: 12px 22px;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    pointer-events: auto;
    transition: transform 0.14s ease, opacity 0.14s;
  }
  .btn:active { transform: scale(0.96); opacity: 0.88; }
  .toast {
    position: absolute;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%) scale(0.9);
    font-size: 14px;
    letter-spacing: 0.1em;
    color: var(--phosphor);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    transition: opacity 0.18s, transform 0.18s;
    text-shadow: 0 0 10px var(--phosphor-glow);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .tap-hint {
    position: absolute;
    bottom: max(36px, calc(env(safe-area-inset-bottom) + 24px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
    z-index: 2;
    opacity: 0.65;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div class="hud" id="hud">
    <div class="hud-pill">purged <span id="scoreVal">0</span></div>
    <div class="hud-pill">combo <span id="comboVal">×0</span></div>
    <div class="hud-pill">signal <span id="savedVal">0</span></div>
    <div class="hud-pill"><span id="timeVal">30</span>s</div>
  </div>
  <div class="flood-bar-wrap">
    <div class="flood-label">noise flood</div>
    <div class="flood-track"><div class="flood-fill" id="floodFill"></div></div>
  </div>
  <div class="tap-hint" id="tapHint">tap glitch glyphs — spare green lines</div>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="titleScreen">
    <div class="panel">
      <h1>Whisper Filter</h1>
      <div class="tag">summer · clear · batch #0428</div>
      <p>Corrupted glyphs flood the log stream. Tap noise before it drowns the signal. Don't touch green lines.</p>
      <button class="btn" data-smoke="start" id="startBtn" type="button">Begin Purge</button>
    </div>
  </div>
  <div class="overlay hidden" id="gameOverScreen">
    <div class="panel">
      <h1 id="goTitle">Batch Lost</h1>
      <div class="score-big" id="finalScore">0</div>
      <div class="score-label">glyphs purged</div>
      <p id="gameOverMsg">Signal drowned in static.</p>
      <button class="btn" data-smoke="restart" id="restartBtn" type="button">Filter Again</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('scoreVal');
  var comboEl = document.getElementById('comboVal');
  var savedEl = document.getElementById('savedVal');
  var timeEl = document.getElementById('timeVal');
  var floodFill = document.getElementById('floodFill');
  var titleScreen = document.getElementById('titleScreen');
  var gameOverScreen = document.getElementById('gameOverScreen');
  var finalScoreEl = document.getElementById('finalScore');
  var goTitle = document.getElementById('goTitle');
  var gameOverMsg = document.getElementById('gameOverMsg');
  var toastEl = document.getElementById('toast');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var tapHint = document.getElementById('tapHint');

  var W = 360, H = 640, dpr = 1;
  var state = 'title';
  var score = 0, combo = 0, bestCombo = 0, saved = 0;
  var timeLeft = 30, elapsed = 0, difficulty = 0;
  var flood = 0, maxFlood = 100;
  var scrollSpeed = 42;
  var lines = [], noises = [], particles = [];
  var spawnTimer = 0, noiseTimer = 0;
  var lastTs = 0, animId = 0, hitStop = 0, shake = 0;
  var flashRed = 0, flashGreen = 0;
  var dark = false, audioCtx = null;
  var lineH = 22, fontSize = 13, padX = 14;
  var hudBottom = 56;

  var SIGNAL_LINES = [
    '[INFO] gironde heat +40C — vintage stress rising',
    '[SIG]  fiction node online — open web chapter ready',
    '[WARN] logs stripped to whispers pre-model ingest',
    '[INFO] sf clear sky 16C — summer trace nominal',
    '[AUTH] prove human — blog gate requesting token',
    '[INFO] batch integrity check passed — 0x7f2a',
    '[SIG]  signal line preserved — whisper intact',
    '[INFO] shipping by sunrise — queue drained',
    '[WARN] noise ratio climbing — filter recommended',
    '[INFO] agent spawn from phone — lane sync ok',
    '[SIG]  one clean log dump — archive sealed',
    '[INFO] imagine 2026 — horizon clear'
  ];

  var NOISE_CHARS = ['▓', '░', '▒', '█', '◊', '◆', '▲', '▼', '▪', '▫', '×', '¿', 'Ø', '¤', '§'];
  var NOISE_TYPES = [
    { color: '#ff6b3d', label: 'static' },
    { color: '#ffb347', label: 'burst' },
    { color: '#ff4466', label: 'corrupt' },
    { color: '#ffaa22', label: 'ghost' }
  ];

  function prefersDark() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  }
  dark = prefersDark();
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        dark = e.matches;
      });
    } catch (e) { /* ignore */ }
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function palette() {
    if (dark) {
      return {
        bg: '#0a0e0a', phosphor: '#39ff7a', phosphorDim: '#1a8f45',
        glow: 'rgba(57,255,122,0.4)', signalDim: '#1e3d28',
        noise: ['#ff6b3d', '#ffb347', '#ff4466', '#ffaa22'],
        grid: 'rgba(57,255,122,0.04)', scan: 'rgba(0,0,0,0.08)',
        cursor: '#39ff7a', border: 'rgba(57,255,122,0.15)'
      };
    }
    return {
      bg: '#e8ede8', phosphor: '#0a6b32', phosphorDim: '#4a9a68',
      glow: 'rgba(10,107,50,0.3)', signalDim: '#c8dcc8',
      noise: ['#c44a20', '#c47a20', '#c42040', '#c48820'],
      grid: 'rgba(10,107,50,0.06)', scan: 'rgba(255,255,255,0.06)',
      cursor: '#0a6b32', border: 'rgba(10,107,50,0.2)'
    };
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lineH = Math.max(20, Math.floor(H * 0.034));
    fontSize = Math.max(11, Math.floor(lineH * 0.58));
    padX = Math.max(12, W * 0.04);
    hudBottom = Math.max(48, H * 0.08);
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, vol, type) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* ignore */ }
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ }
  }

  function showToast(txt) {
    if (!toastEl) return;
    toastEl.textContent = txt;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 650);
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (comboEl) comboEl.textContent = '×' + combo;
    if (savedEl) savedEl.textContent = String(saved);
    if (timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
    if (floodFill) floodFill.style.width = clamp(flood, 0, 100) + '%';
  }

  function spawnSignalLine() {
    lines.push({
      y: H + lineH,
      text: pick(SIGNAL_LINES),
      type: 'signal',
      alpha: 1,
      id: Math.random()
    });
  }

  function spawnNoise() {
    var typeCount = clamp(1 + Math.floor(difficulty * 3.5), 1, NOISE_TYPES.length);
    var nType = NOISE_TYPES[Math.floor(Math.random() * typeCount)];
    var glyphCount = Math.floor(rand(2, 4 + difficulty * 2));
    var glyphs = '';
    for (var i = 0; i < glyphCount; i++) glyphs += pick(NOISE_CHARS);
    var tw = glyphCount * fontSize * 0.62 + 16;
    var tx = rand(padX, W - padX - tw);
    var ty = H + rand(lineH, lineH * 2.5);
    noises.push({
      x: tx, y: ty, w: tw, h: lineH * 0.9,
      glyphs: glyphs,
      type: nType,
      alpha: 1,
      pulse: rand(0, Math.PI * 2),
      id: Math.random(),
      missed: false
    });
  }

  function burst(x, y, col) {
    for (var i = 0; i < 10; i++) {
      var ang = rand(0, Math.PI * 2);
      var spd = rand(40, 140);
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: rand(0.25, 0.55),
        maxLife: 0.55,
        color: col,
        size: rand(2, 4)
      });
    }
  }

  function addFlood(amount) {
    flood = clamp(flood + amount, 0, maxFlood);
    if (flood >= maxFlood) endGame(false);
  }

  function filterNoise(n, idx) {
    if (!n || n.dead) return;
    n.dead = true;
    score++;
    combo++;
    if (combo > bestCombo) bestCombo = combo;
    if (combo % 5 === 0) showToast('×' + combo + ' streak');
    burst(n.x + n.w * 0.5, n.y, n.type.color);
    hitStop = 0.04;
    flashGreen = 0.12;
    flood = clamp(flood - 1.5, 0, maxFlood);
    playTone(880 + combo * 20, 0.07, 0.05, 'square');
    vibrate(8);
    if (idx >= 0) noises.splice(idx, 1);
    updateHUD();
  }

  function punishSignal(l) {
    combo = 0;
    addFlood(12);
    shake = 6;
    flashRed = 0.2;
    playTone(120, 0.15, 0.08, 'sawtooth');
    vibrate(30);
    showToast('signal hit!');
    if (l) l.struck = true;
    updateHUD();
  }

  function hitTest(x, y) {
    var best = -1, bestD = Infinity;
    for (var i = noises.length - 1; i >= 0; i--) {
      var n = noises[i];
      if (n.dead) continue;
      var cx = n.x + n.w * 0.5, cy = n.y + n.h * 0.5;
      var dx = x - cx, dy = y - cy;
      var d = dx * dx + dy * dy;
      var hitR = Math.max(n.w, n.h) * 0.65;
      if (d < hitR * hitR && d < bestD) {
        bestD = d;
        best = i;
      }
    }
    if (best >= 0) {
      filterNoise(noises[best], best);
      return;
    }
    for (var j = lines.length - 1; j >= 0; j--) {
      var ln = lines[j];
      if (ln.type !== 'signal' || ln.struck) continue;
      if (x >= padX - 4 && x <= W - padX + 4 && y >= ln.y - 4 && y <= ln.y + lineH + 4) {
        punishSignal(ln);
        return;
      }
    }
  }

  function resetGame() {
    score = 0; combo = 0; bestCombo = 0; saved = 0;
    timeLeft = 30; elapsed = 0; difficulty = 0;
    flood = 0; scrollSpeed = 42;
    lines = []; noises = []; particles = [];
    spawnTimer = 0; noiseTimer = 0;
    hitStop = 0; shake = 0; flashRed = 0; flashGreen = 0;
    for (var i = 0; i < 6; i++) {
      var ln = pick(SIGNAL_LINES);
      lines.push({ y: H * 0.15 + i * lineH, text: ln, type: 'signal', alpha: 1, id: Math.random() });
    }
    updateHUD();
  }

  function startGame() {
    initAudio();
    resetGame();
    state = 'playing';
    if (titleScreen) titleScreen.classList.add('hidden');
    if (gameOverScreen) gameOverScreen.classList.add('hidden');
    if (tapHint) tapHint.style.opacity = '0.65';
    lastTs = 0;
    if (!animId) loop(0);
  }

  function endGame(won) {
    if (state !== 'playing') return;
    state = 'over';
    if (tapHint) tapHint.style.opacity = '0';
    if (gameOverScreen) gameOverScreen.classList.remove('hidden');
    if (finalScoreEl) finalScoreEl.textContent = String(score);
    if (goTitle) goTitle.textContent = won ? 'Batch Saved' : 'Batch Lost';
    if (gameOverMsg) {
      if (won) {
        gameOverMsg.textContent = saved + ' signal lines preserved. Log dump sealed clean.';
      } else if (flood >= maxFlood) {
        gameOverMsg.textContent = 'Noise flood overwhelmed the stream.';
      } else {
        gameOverMsg.textContent = 'Signal drowned in static.';
      }
    }
    playTone(won ? 660 : 180, won ? 0.2 : 0.25, 0.07, won ? 'square' : 'sawtooth');
    vibrate(won ? [20, 40, 20] : 50);
  }

  function update(dt) {
    if (state !== 'playing') return;
    if (hitStop > 0) { hitStop -= dt; return; }

    elapsed += dt;
    timeLeft -= dt;
    difficulty = clamp(elapsed / 30, 0, 1);
    scrollSpeed = 42 + difficulty * 55;

    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame(true);
      return;
    }

    flood = clamp(flood - dt * 0.8, 0, maxFlood);

    spawnTimer -= dt;
    var signalInterval = Math.max(0.55, 1.6 - difficulty * 0.9);
    if (spawnTimer <= 0) {
      spawnSignalLine();
      spawnTimer = signalInterval + rand(-0.1, 0.15);
    }

    noiseTimer -= dt;
    var noiseInterval = Math.max(0.35, 1.1 - difficulty * 0.65);
    if (noiseTimer <= 0) {
      spawnNoise();
      if (difficulty > 0.4 && Math.random() < difficulty * 0.5) spawnNoise();
      noiseTimer = noiseInterval + rand(-0.08, 0.12);
    }

    var i, ln, n;
    for (i = lines.length - 1; i >= 0; i--) {
      ln = lines[i];
      ln.y -= scrollSpeed * dt;
      if (ln.y < -lineH * 2) {
        lines.splice(i, 1);
      } else if (ln.type === 'signal' && !ln.counted && ln.y < lineH * 1.5) {
        ln.counted = true;
        saved++;
        playTone(520, 0.05, 0.03, 'sine');
        updateHUD();
      }
    }

    var floodZone = H - hudBottom;
    for (i = noises.length - 1; i >= 0; i--) {
      n = noises[i];
      n.y -= scrollSpeed * dt * (1 + (n.type.label === 'burst' ? 0.15 : 0));
      n.pulse += dt * 8;
      if (n.y < -lineH) {
        if (!n.dead && !n.missed) {
          n.missed = true;
          addFlood(5);
          combo = 0;
          updateHUD();
        }
        noises.splice(i, 1);
      } else if (!n.dead && n.y + n.h > floodZone) {
        addFlood(dt * (8 + difficulty * 12));
        n.alpha = 0.6 + Math.sin(n.pulse) * 0.2;
      }
    }

    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 120 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (flashRed > 0) flashRed -= dt;
    if (flashGreen > 0) flashGreen -= dt;
    if (shake > 0) shake -= dt * 18;

    updateHUD();
  }

  function drawScanlines(pal) {
    if (!ctx) return;
    ctx.save();
    ctx.globalAlpha = dark ? 0.06 : 0.04;
    ctx.fillStyle = dark ? '#000' : '#fff';
    for (var y = 0; y < H; y += 3) {
      ctx.fillRect(0, y, W, 1);
    }
    ctx.restore();
  }

  function drawTerminal(pal) {
    if (!ctx) return;
    var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    var sy = shake > 0 ? (Math.random() - 0.5) * shake * 0.5 : 0;
    ctx.save();
    ctx.translate(sx, sy);

    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = pal.grid;
    ctx.lineWidth = 1;
    var gridStep = 28;
    for (var gx = 0; gx < W; gx += gridStep) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    for (var gy = 0; gy < H; gy += gridStep) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }

    ctx.font = fontSize + 'px ui-monospace, Menlo, monospace';
    ctx.textBaseline = 'middle';

    var i, ln;
    for (i = 0; i < lines.length; i++) {
      ln = lines[i];
      if (ln.y < -lineH || ln.y > H + lineH) continue;
      ctx.globalAlpha = ln.struck ? 0.35 : ln.alpha;
      if (ln.struck) {
        ctx.fillStyle = pal.noise[2];
      } else {
        ctx.fillStyle = pal.phosphor;
      }
      ctx.shadowColor = pal.glow;
      ctx.shadowBlur = ln.struck ? 0 : 6;
      ctx.fillText(ln.text, padX, ln.y + lineH * 0.5);
      ctx.shadowBlur = 0;
    }

    for (i = 0; i < noises.length; i++) {
      var n = noises[i];
      if (n.dead || n.y < -lineH || n.y > H + lineH) continue;
      var pulse = 0.85 + Math.sin(n.pulse) * 0.15;
      ctx.globalAlpha = (n.alpha || 1) * pulse;

      ctx.fillStyle = dark ? 'rgba(255,60,40,0.12)' : 'rgba(196,40,30,0.1)';
      roundRect(ctx, n.x - 4, n.y - 2, n.w + 8, n.h + 4, 4);
      ctx.fill();

      ctx.strokeStyle = n.type.color;
      ctx.lineWidth = 1.5;
      roundRect(ctx, n.x - 4, n.y - 2, n.w + 8, n.h + 4, 4);
      ctx.stroke();

      ctx.fillStyle = n.type.color;
      ctx.shadowColor = n.type.color;
      ctx.shadowBlur = 8;
      ctx.fillText(n.glyphs, n.x, n.y + n.h * 0.5);
      ctx.shadowBlur = 0;
    }

    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }

    if (combo >= 3) {
      ctx.globalAlpha = 0.12 + combo * 0.015;
      ctx.fillStyle = pal.phosphor;
      ctx.fillRect(0, 0, W, 4);
    }

    ctx.globalAlpha = 0.35;
    ctx.fillStyle = pal.border;
    ctx.fillRect(0, H - hudBottom, W, 1);

    var cursorBlink = Math.floor(elapsed * 2.5) % 2 === 0;
    if (state === 'playing' && cursorBlink) {
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = pal.cursor;
      var cy = H - hudBottom - lineH * 1.2;
      if (cy > padX) ctx.fillRect(padX, cy, fontSize * 0.5, lineH * 0.7);
    }

    drawScanlines(pal);

    var vig = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.2, W * 0.5, H * 0.5, H * 0.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, dark ? 'rgba(0,0,0,0.45)' : 'rgba(0,0,0,0.12)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    if (flashRed > 0) {
      ctx.globalAlpha = flashRed * 0.35;
      ctx.fillStyle = '#ff2244';
      ctx.fillRect(0, 0, W, H);
    }
    if (flashGreen > 0) {
      ctx.globalAlpha = flashGreen * 0.2;
      ctx.fillStyle = pal.phosphor;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function drawFallback() {
    if (!ctx) return;
    var pal = palette();
    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = pal.phosphor;
    ctx.font = '14px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Whisper Filter', W * 0.5, H * 0.5);
    ctx.textAlign = 'left';
  }

  function loop(ts) {
    animId = requestAnimationFrame(loop);
    if (!ctx) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    update(dt);
    try {
      drawTerminal(palette());
    } catch (e) {
      drawFallback();
    }
  }

  function pointerDown(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (state !== 'playing' || !canvas) return;
    var rect = canvas.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX - rect.left;
      cy = e.touches[0].clientY - rect.top;
    } else {
      cx = e.clientX - rect.left;
      cy = e.clientY - rect.top;
    }
    hitTest(cx, cy);
  }

  function onKey(e) {
    if (!e) return;
    if (e.key === ' ' || e.key === 'Enter') {
      if (state === 'title' && startBtn) startBtn.click();
      else if (state === 'over' && restartBtn) restartBtn.click();
      if (e.preventDefault) e.preventDefault();
    }
  }

  if (startBtn) {
    startBtn.addEventListener('click', function (e) {
      if (e && e.stopPropagation) e.stopPropagation();
      startGame();
    });
  }
  if (restartBtn) {
    restartBtn.addEventListener('click', function (e) {
      if (e && e.stopPropagation) e.stopPropagation();
      startGame();
    });
  }

  if (canvas) {
    canvas.addEventListener('touchstart', pointerDown, { passive: false });
    canvas.addEventListener('mousedown', pointerDown);
  }
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);

  resize();
  drawTerminal(palette());
  animId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
