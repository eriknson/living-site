<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Agent</title>
<style>
  :root {
    --bg: #050a0f;
    --text: #fff;
    --primary: #00ffff;
    --danger: #ff003c;
    --warning: #ffff00;
    --overlay: rgba(5, 10, 15, 0.85);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e6eef5;
      --text: #111;
      --primary: #0055ff;
      --danger: #e60000;
      --warning: #cc6600;
      --overlay: rgba(230, 238, 245, 0.85);
    }
  }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg); color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden; touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  
  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: var(--overlay);
    transition: opacity 0.3s;
    pointer-events: none;
  }
  
  .hidden { opacity: 0 !important; pointer-events: none !important; }
  
  button {
    pointer-events: auto;
    background: transparent;
    color: var(--primary);
    border: 2px solid var(--primary);
    padding: 15px 40px;
    font-size: 24px;
    font-family: inherit;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    margin-top: 40px;
    transition: transform 0.1s, background 0.1s;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1);
  }
  @media (prefers-color-scheme: light) {
    button {
      box-shadow: 0 0 10px rgba(0, 85, 255, 0.2), inset 0 0 10px rgba(0, 85, 255, 0.1);
    }
  }
  button:active {
    background: rgba(0, 255, 255, 0.2);
    transform: scale(0.95);
  }
  @media (prefers-color-scheme: light) {
    button:active { background: rgba(0, 85, 255, 0.1); }
  }
  
  h1 {
    color: var(--primary);
    font-size: 48px;
    margin: 0 0 15px 0;
    text-align: center;
    letter-spacing: 2px;
  }
  @media (prefers-color-scheme: dark) {
    h1 { text-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
  }
  
  p {
    color: var(--text);
    opacity: 0.8;
    text-align: center;
    max-width: 80%;
    line-height: 1.6;
    font-size: 16px;
    margin: 0;
  }
  
  #hud {
    position: absolute; top: env(safe-area-inset-top, 20px); left: 20px; right: 20px;
    display: flex; justify-content: space-between;
    font-size: 20px; color: var(--primary); font-weight: bold;
    pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    #hud { text-shadow: 0 0 5px var(--primary); }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-layer">
  <div id="hud" class="hidden">
    <div id="score-display">SCORE: 0</div>
    <div id="lives-display">LIVES: ♥♥♥</div>
  </div>

  <div id="start-screen" class="screen">
    <h1>NEON AGENT</h1>
    <p>Hold to charge.<br>Release to deploy.<br>Swipe to switch lanes.</p>
    <button data-smoke="start" id="start-btn">START</button>
  </div>

  <div id="gameover-screen" class="screen hidden">
    <h1 style="color: var(--danger);">SYSTEM FAILURE</h1>
    <p id="final-score">SCORE: 0</p>
    <button data-smoke="restart" id="restart-btn">REBOOT</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    updateColors();
}
window.addEventListener('resize', resize);

// Colors
let C_BG, C_CYAN, C_RED, C_YELLOW, C_GRID, C_FOG;
const isLightMode = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;

function updateColors() {
    if (isLightMode()) {
        C_BG = '#e6eef5';
        C_CYAN = '#0055ff';
        C_RED = '#e60000';
        C_YELLOW = '#cc6600';
        C_GRID = 'rgba(0, 85, 255, 0.2)';
        C_FOG = 'rgba(255, 255, 255, 0.8)';
    } else {
        C_BG = '#050a0f';
        C_CYAN = '#00ffff';
        C_RED = '#ff003c';
        C_YELLOW = '#ffff00';
        C_GRID = 'rgba(0, 255, 255, 0.15)';
        C_FOG = 'rgba(0, 100, 150, 0.2)';
    }
}
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateColors);
resize();

// Game State
let state = 'start';
let score = 0;
let lives = 3;
let gameTime = 0;
let lastTime = performance.now();
let hitPause = 0;
let screenShake = 0;
let flash = 0;

// Entities
let player = { lane: 1, charge: 0, isCharging: false, recoil: 0 };
let agents = [];
let tasks = [];
let particles = [];
let stars = [];

for(let i=0; i<40; i++) {
    stars.push({
        x: Math.random(),
        y: Math.random() * 0.25,
        size: Math.random() * 2 + 1,
        alpha: Math.random()
    });
}

let nextSpawnTime = 0;

// DOM
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const hud = document.getElementById('hud');
const scoreDisplay = document.getElementById('score-display');
const livesDisplay = document.getElementById('lives-display');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');

startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
restartBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

function startGame() {
    state = 'playing';
    score = 0;
    lives = 3;
    gameTime = 0;
    player = { lane: 1, charge: 0, isCharging: false, recoil: 0 };
    agents = [];
    tasks = [];
    particles = [];
    nextSpawnTime = 1;
    hitPause = 0;
    screenShake = 0;
    flash = 0;
    lastTime = performance.now();
    
    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    updateHUD();
}

function gameOver() {
    state = 'gameover';
    hud.classList.add('hidden');
    gameoverScreen.classList.remove('hidden');
    document.getElementById('final-score').innerText = `SCORE: ${score}`;
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function updateHUD() {
    scoreDisplay.innerText = `SCORE: ${score}`;
    let livesStr = '';
    for(let i=0; i<lives; i++) livesStr += '♥';
    livesDisplay.innerText = `LIVES: ${livesStr}`;
}

const horizonYRatio = 0.25;
function getScreenPos(lane, p) {
    const horizonY = height * horizonYRatio;
    const bottomY = height;
    const curvedP = Math.pow(p, 1.5);
    const y = horizonY + curvedP * (bottomY - horizonY);
    
    const laneWidthBottom = width * 0.3;
    const laneWidthTop = width * 0.05;
    const currentLaneWidth = laneWidthTop + curvedP * (laneWidthBottom - laneWidthTop);
    
    const centerX = width / 2;
    const laneOffsets = [-1, 0, 1];
    const x = centerX + laneOffsets[lane] * currentLaneWidth;
    
    const scale = 0.1 + curvedP * 0.9;
    return { x, y, scale };
}

// Input
let touchId = null;
let startX = 0;

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state !== 'playing') return;
    if (touchId !== null) return;
    
    const touch = e.changedTouches[0];
    touchId = touch.identifier;
    startX = touch.clientX;
    
    player.isCharging = true;
    player.charge = 0;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (state !== 'playing') return;
    
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === touchId) {
            const dx = touch.clientX - startX;
            if (Math.abs(dx) > 40) {
                if (dx > 0 && player.lane < 2) { player.lane++; startX = touch.clientX; }
                if (dx < 0 && player.lane > 0) { player.lane--; startX = touch.clientX; }
            }
        }
    }
}, { passive: false });

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (state !== 'playing') return;
    
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === touchId) {
            touchId = null;
            if (player.isCharging) {
                fireAgent();
                player.isCharging = false;
                player.charge = 0;
            }
        }
    }
}, { passive: false });

canvas.addEventListener('touchcancel', e => {
    e.preventDefault();
    if (state !== 'playing') return;
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
            touchId = null;
            player.isCharging = false;
            player.charge = 0;
        }
    }
}, { passive: false });

// Mouse fallback
let isMouseDown = false;
let mouseStartX = 0;

canvas.addEventListener('mousedown', e => {
    if (state !== 'playing') return;
    isMouseDown = true;
    mouseStartX = e.clientX;
    player.isCharging = true;
    player.charge = 0;
});

window.addEventListener('mousemove', e => {
    if (state !== 'playing' || !isMouseDown) return;
    const dx = e.clientX - mouseStartX;
    if (Math.abs(dx) > 40) {
        if (dx > 0 && player.lane < 2) { player.lane++; mouseStartX = e.clientX; }
        if (dx < 0 && player.lane > 0) { player.lane--; mouseStartX = e.clientX; }
    }
});

window.addEventListener('mouseup', e => {
    if (state !== 'playing' || !isMouseDown) return;
    isMouseDown = false;
    if (player.isCharging) {
        fireAgent();
        player.isCharging = false;
        player.charge = 0;
    }
});

window.addEventListener('keydown', e => {
    if (state !== 'playing') return;
    if (e.key === 'ArrowLeft' && player.lane > 0) player.lane--;
    if (e.key === 'ArrowRight' && player.lane < 2) player.lane++;
    if (e.key === ' ' && !player.isCharging) {
        player.isCharging = true;
        player.charge = 0;
    }
});

window.addEventListener('keyup', e => {
    if (state !== 'playing') return;
    if (e.key === ' ') {
        fireAgent();
        player.isCharging = false;
        player.charge = 0;
    }
});

function fireAgent() {
    const power = Math.floor(1 + player.charge * 4); // 1 to 5
    agents.push({
        lane: player.lane,
        p: 1.0,
        dp: -1.2 - (power * 0.15),
        power: power
    });
    player.recoil = 10 + power * 5;
    if (navigator.vibrate) navigator.vibrate(20);
}

function spawnTask() {
    const isForking = Math.random() < 0.15 + Math.min(0.25, gameTime / 120);
    const lane = isForking ? 1 : Math.floor(Math.random() * 3);
    const maxHp = 1 + Math.floor(gameTime / 20);
    
    tasks.push({
        lane: lane,
        p: 0.0,
        dp: 0.25 + Math.min(0.3, gameTime * 0.008),
        hp: maxHp,
        maxHp: maxHp,
        isForking: isForking,
        forkP: 0.3 + Math.random() * 0.3
    });
}

function spawnParticles(lane, p, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            lane: lane,
            p: p,
            dp: (Math.random() - 0.5) * 0.8,
            xOffset: (Math.random() - 0.5) * 3,
            yOffset: (Math.random() - 0.5) * 3,
            life: 1.0,
            color: color
        });
    }
}

function update(dt) {
    if (state !== 'playing') return;
    
    gameTime += dt;
    
    if (screenShake > 0) screenShake -= dt;
    if (flash > 0) flash -= dt * 2;
    if (player.recoil > 0) {
        player.recoil -= dt * 150;
        if (player.recoil < 0) player.recoil = 0;
    }
    
    if (player.isCharging) {
        player.charge += dt * 1.5;
        if (player.charge > 1) player.charge = 1;
    }
    
    if (gameTime > nextSpawnTime) {
        spawnTask();
        const spawnRate = Math.max(0.35, 1.2 - gameTime * 0.015);
        nextSpawnTime = gameTime + spawnRate;
    }
    
    // Store previous positions for continuous collision detection
    agents.forEach(a => a.prevP = a.p);
    tasks.forEach(t => t.prevP = t.p);
    
    for (let i = agents.length - 1; i >= 0; i--) {
        let a = agents[i];
        a.p += a.dp * dt;
        if (a.p < 0) agents.splice(i, 1);
    }
    
    for (let i = tasks.length - 1; i >= 0; i--) {
        let t = tasks[i];
        t.p += t.dp * dt;
        
        if (t.isForking && t.p >= t.forkP) {
            tasks.splice(i, 1);
            tasks.push({ lane: 0, p: t.p, dp: t.dp, hp: t.hp, maxHp: t.maxHp, isForking: false });
            tasks.push({ lane: 2, p: t.p, dp: t.dp, hp: t.hp, maxHp: t.maxHp, isForking: false });
            spawnParticles(t.lane, t.p, C_YELLOW, 15);
            flash = 0.3;
            if (navigator.vibrate) navigator.vibrate(30);
            continue;
        }
        
        if (t.p > 1.0) {
            tasks.splice(i, 1);
            lives--;
            screenShake = 0.4;
            updateHUD();
            if (navigator.vibrate) navigator.vibrate(150);
            if (lives <= 0) gameOver();
            continue;
        }
    }
    
    // Collisions
    for (let i = agents.length - 1; i >= 0; i--) {
        let a = agents[i];
        for (let j = tasks.length - 1; j >= 0; j--) {
            let t = tasks[j];
            if (a.lane === t.lane && a.prevP >= t.prevP && a.p <= t.p) {
                t.hp -= a.power;
                agents.splice(i, 1);
                hitPause = 0.04;
                
                if (t.hp <= 0) {
                    tasks.splice(j, 1);
                    score += t.maxHp * 10;
                    updateHUD();
                    spawnParticles(t.lane, t.p, t.isForking ? C_YELLOW : C_RED, 20);
                } else {
                    spawnParticles(t.lane, t.p, C_CYAN, 8);
                }
                break;
            }
        }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.p += p.dp * dt;
        p.xOffset += p.dp * 3 * dt;
        p.yOffset += p.dp * 3 * dt;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawCube(x, y, size, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, size / 12);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const angle = (i * 60 + 30) * Math.PI / 180;
        const px = x + Math.cos(angle) * size;
        const py = y + Math.sin(angle) * size;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(30 * Math.PI/180) * size, y + Math.sin(30 * Math.PI/180) * size);
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(150 * Math.PI/180) * size, y + Math.sin(150 * Math.PI/180) * size);
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(270 * Math.PI/180) * size, y + Math.sin(270 * Math.PI/180) * size);
    ctx.stroke();
}

function drawAgentShape(x, y, size, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, size / 8);
    ctx.beginPath();
    ctx.moveTo(x, y - size); 
    ctx.lineTo(x - size*0.8, y + size*0.8); 
    ctx.lineTo(x + size*0.8, y + size*0.8); 
    ctx.closePath();
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(x, y - size);
    ctx.lineTo(x, y + size*0.2);
    ctx.lineTo(x - size*0.8, y + size*0.8);
    ctx.moveTo(x, y + size*0.2);
    ctx.lineTo(x + size*0.8, y + size*0.8);
    ctx.stroke();
}

function draw() {
    ctx.fillStyle = C_BG;
    ctx.fillRect(0, 0, width, height);
    
    ctx.save();
    if (screenShake > 0) {
        const amt = screenShake * 25;
        ctx.translate((Math.random()-0.5)*amt, (Math.random()-0.5)*amt);
    }
    
    const horizonY = height * horizonYRatio;
    
    // Stars
    ctx.fillStyle = isLightMode() ? '#88aacc' : '#fff';
    stars.forEach(s => {
        ctx.globalAlpha = s.alpha * (0.5 + 0.5 * Math.sin(gameTime * 2 + s.x * 10));
        ctx.fillRect(s.x * width, s.y * height, s.size, s.size);
    });
    ctx.globalAlpha = 1.0;
    
    // Grid Lines
    ctx.strokeStyle = C_GRID;
    ctx.lineWidth = 1.5;
    
    // Vertical Lane dividers
    ctx.beginPath();
    for (let i = 0; i <= 3; i++) {
        const offsets = [-1.5, -0.5, 0.5, 1.5];
        const off = offsets[i];
        const topW = width * 0.05;
        const botW = width * 0.3;
        ctx.moveTo(width/2 + off * topW, horizonY);
        ctx.lineTo(width/2 + off * botW, height);
    }
    ctx.stroke();
    
    // Horizontal moving grid
    const numLines = 8;
    for (let i = 0; i < numLines; i++) {
        let p = (i + (gameTime * 0.8) % 1) / numLines;
        const curvedP = Math.pow(p, 1.5);
        const y = horizonY + curvedP * (height - horizonY);
        
        const laneWidthBottom = width * 0.3;
        const laneWidthTop = width * 0.05;
        const currentLaneWidth = laneWidthTop + curvedP * (laneWidthBottom - laneWidthTop);
        
        ctx.beginPath();
        ctx.moveTo(width/2 - 1.5 * currentLaneWidth, y);
        ctx.lineTo(width/2 + 1.5 * currentLaneWidth, y);
        ctx.stroke();
    }
    
    // Fog
    const grad = ctx.createLinearGradient(0, horizonY - 40, 0, horizonY + 120);
    if (isLightMode()) {
        grad.addColorStop(0, 'rgba(230, 238, 245, 0)');
        grad.addColorStop(0.5, 'rgba(230, 238, 245, 0.9)');
        grad.addColorStop(1, 'rgba(230, 238, 245, 0)');
    } else {
        grad.addColorStop(0, 'rgba(5, 10, 15, 0)');
        grad.addColorStop(0.5, 'rgba(0, 100, 150, 0.3)');
        grad.addColorStop(1, 'rgba(5, 10, 15, 0)');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, horizonY - 40, width, 160);
    
    // Particles
    particles.forEach(p => {
        const pos = getScreenPos(p.lane, p.p);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        const size = 6 * pos.scale;
        ctx.fillRect(pos.x + p.xOffset * 60 * pos.scale, pos.y + p.yOffset * 60 * pos.scale, size, size);
    });
    ctx.globalAlpha = 1.0;
    
    // Tasks
    tasks.forEach(t => {
        const pos = getScreenPos(t.lane, t.p);
        const size = 35 * pos.scale;
        const color = t.isForking ? C_YELLOW : C_RED;
        
        if (!isLightMode()) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = color;
        }
        drawCube(pos.x, pos.y, size, color);
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = color;
        ctx.font = `bold ${Math.max(10, Math.floor(18 * pos.scale))}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.hp, pos.x, pos.y - size * 1.5);
    });
    
    // Agents
    agents.forEach(a => {
        const pos = getScreenPos(a.lane, a.p);
        const size = (18 + a.power * 4) * pos.scale;
        
        if (!isLightMode()) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = C_CYAN;
        }
        drawAgentShape(pos.x, pos.y, size, C_CYAN);
        ctx.shadowBlur = 0;
    });
    
    // Player
    if (state === 'playing') {
        const pos = getScreenPos(player.lane, 1.0);
        const size = 45;
        const drawY = pos.y + player.recoil;
        
        if (!isLightMode()) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = C_CYAN;
        }
        
        ctx.strokeStyle = C_CYAN;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(pos.x - size, drawY);
        ctx.lineTo(pos.x + size, drawY);
        ctx.lineTo(pos.x + size*0.5, drawY - size*0.5);
        ctx.lineTo(pos.x - size*0.5, drawY - size*0.5);
        ctx.closePath();
        ctx.stroke();
        
        if (player.charge > 0) {
            const cSize = size * 0.5 * player.charge;
            ctx.fillStyle = C_CYAN;
            ctx.beginPath();
            ctx.arc(pos.x, drawY - size*0.25, cSize, 0, Math.PI*2);
            ctx.fill();
        }
        
        ctx.shadowBlur = 0;
    }
    
    if (flash > 0) {
        ctx.fillStyle = isLightMode() ? `rgba(255, 255, 255, ${flash})` : `rgba(255, 255, 255, ${flash * 0.5})`;
        ctx.fillRect(0, 0, width, height);
    }
    
    ctx.restore();
}

requestAnimationFrame(function loop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.1) dt = 0.1;
    
    if (hitPause > 0) {
        hitPause -= dt;
    } else {
        update(dt);
    }
    draw();
    requestAnimationFrame(loop);
});
</script>
</body>
</html>
