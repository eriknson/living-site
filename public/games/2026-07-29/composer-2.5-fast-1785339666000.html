<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VERIFY — Circuit Agent</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0c1012;--pcb:#111820;--grid:#1a2830;--trace:#00e5c0;--trace2:#ffb020;
    --text:#c8d6dc;--muted:#6a8490;--accent:#00e5c0;--danger:#ff4466;--ok:#44ffaa;
    --overlay:rgba(8,12,16,.88);--btn-bg:#00e5c0;--btn-text:#061014;--hud-bg:rgba(12,16,18,.72);
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e4eaee;--pcb:#d0d8dc;--grid:#b8c4cc;--trace:#008870;--trace2:#c87800;
    --text:#1a2830;--muted:#5a7080;--accent:#008870;--danger:#cc2244;--ok:#008850;
    --overlay:rgba(228,234,238,.92);--btn-bg:#008870;--btn-text:#f4faf8;--hud-bg:rgba(228,234,238,.85);
  }
}
:root{
  --bg:#0c1012;--pcb:#111820;--grid:#1a2830;--trace:#00e5c0;--trace2:#ffb020;
  --text:#c8d6dc;--muted:#6a8490;--accent:#00e5c0;--danger:#ff4466;--ok:#44ffaa;
  --overlay:rgba(8,12,16,.88);--btn-bg:#00e5c0;--btn-text:#061014;--hud-bg:rgba(12,16,18,.72);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#game{flex:1;width:100%;touch-action:none;user-select:none;display:block;background:var(--pcb)}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hud-value{font-size:18px;font-weight:600;color:var(--accent);line-height:1.1}
#scan-bar-wrap{position:absolute;top:max(52px,env(safe-area-inset-top));left:16px;right:16px;height:4px;
  background:var(--grid);border-radius:2px;overflow:hidden;pointer-events:none;z-index:2}
#scan-bar{height:100%;width:0;background:var(--trace);border-radius:2px;transition:none}
#scan-label{position:absolute;top:max(58px,env(safe-area-inset-top));left:0;right:0;text-align:center;
  font-size:9px;letter-spacing:.15em;color:var(--muted);pointer-events:none;z-index:2}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--overlay);z-index:10;pointer-events:none;padding:24px;text-align:center;gap:16px}
.overlay.hidden{display:none}
.overlay-title{font-size:clamp(28px,8vw,42px);font-weight:700;letter-spacing:.08em;color:var(--accent);
  text-shadow:0 0 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.overlay-sub{font-size:clamp(12px,3.5vw,15px);color:var(--muted);max-width:320px;line-height:1.5}
.overlay-stats{font-size:13px;color:var(--text);margin-top:4px}
.btn{pointer-events:auto;min-height:48px;min-width:160px;padding:14px 32px;border:none;border-radius:4px;
  background:var(--btn-bg);color:var(--btn-text);font-family:inherit;font-size:14px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.96);opacity:.85}
#toast{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.1em;color:var(--muted);pointer-events:none;z-index:3;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Score</span><span class="hud-value" id="score">0</span></div>
    <div class="hud-block" style="align-items:center"><span class="hud-label">Window</span><span class="hud-value" id="window-ms">—</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Level</span><span class="hud-value" id="level">1</span></div>
  </div>
  <div id="scan-bar-wrap"><div id="scan-bar"></div></div>
  <div id="scan-label">AGENT SCAN INCOMING</div>
  <div id="toast"></div>
  <div id="title-screen" class="overlay">
    <div class="overlay-title">VERIFY</div>
    <div class="overlay-sub">Drag between glowing nodes to wire circuits before the agent scanner verifies your board. Each success unlocks another component.</div>
    <button class="btn" data-smoke="start" id="btn-start">Initialize</button>
  </div>
  <div id="gameover-screen" class="overlay hidden">
    <div class="overlay-title" style="color:var(--danger)">FAILED</div>
    <div class="overlay-sub" id="fail-reason">Verification window closed with open circuits.</div>
    <div class="overlay-stats">Score: <span id="final-score">0</span> · Level <span id="final-level">1</span></div>
    <button class="btn" data-smoke="restart" id="btn-restart">Reboot</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('game');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('score');
var levelEl = document.getElementById('level');
var windowMsEl = document.getElementById('window-ms');
var scanBar = document.getElementById('scan-bar');
var scanLabel = document.getElementById('scan-label');
var titleScreen = document.getElementById('title-screen');
var gameoverScreen = document.getElementById('gameover-screen');
var failReason = document.getElementById('fail-reason');
var finalScore = document.getElementById('final-score');
var finalLevel = document.getElementById('final-level');
var toast = document.getElementById('toast');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 300, H = 500, dpr = 1;
var state = 'title';
var score = 0, level = 1, combo = 0;
var nodes = [], wires = [], pairs = [];
var dragNode = null, dragX = 0, dragY = 0, pointerDown = false;
var kbSelect = null, kbHover = 0;
var scanProgress = 0, scanDuration = 4000, verifyWindow = 800;
var lastTime = 0, animId = 0, roundTime = 0;
var midSpawned = false;
var particles = [], flashAlpha = 0, shake = 0;
var audioCtx = null;

var COLORS = ['#00e5c0','#ffb020','#44aaff','#ff6688','#aaff44','#ff8844'];
var lightMode = false;

function isLight(){ try{return window.matchMedia && window.matchMedia('(prefers-color-scheme:light)').matches;}catch(e){return false;} }

function cssVar(name){
  try{ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }catch(e){ return '#00e5c0'; }
}

function resize(){
  if(!canvas) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 300;
  H = (window.innerHeight || 500) - 0;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr,0,0,dpr,0,0);
}

function initAudio(){
  try{
    if(!audioCtx && typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(!audioCtx && typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
  }catch(e){}
}

function beep(freq, dur, vol){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

function toastMsg(msg){
  if(!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function(){ toast.classList.remove('show'); }, 1800);
}

function rand(min,max){ return min + Math.random() * (max - min); }

function placeNodes(count){
  nodes = [];
  var pad = 48, gw = W - pad*2, gh = H - pad*2 - 40;
  var cols = Math.ceil(Math.sqrt(count));
  var rows = Math.ceil(count / cols);
  var idx = 0;
  for(var r=0;r<rows&&idx<count;r++){
    for(var c=0;c<cols&&idx<count;c++){
      var x = pad + (c+0.5)*(gw/cols) + rand(-12,12);
      var y = pad + 60 + (r+0.5)*(gh/rows) + rand(-12,12);
      x = Math.max(pad, Math.min(W-pad, x));
      y = Math.max(pad+40, Math.min(H-pad, y));
      nodes.push({id:idx,x:x,y:y,r:14, color:COLORS[idx%COLORS.length], pairId:-1, lit:false});
      idx++;
    }
  }
}

function spawnLevel(){
  pairs = [];
  wires = [];
  var pairCount = Math.min(2 + Math.floor((level-1)*0.8), 6);
  var nodeCount = pairCount * 2;
  placeNodes(nodeCount);
  for(var p=0;p<pairCount;p++){
    var a = p*2, b = p*2+1;
    var col = COLORS[p % COLORS.length];
    nodes[a].pairId = p; nodes[a].color = col;
    nodes[b].pairId = p; nodes[b].color = col;
    pairs.push({id:p, a:a, b:b, color:col, done:false});
  }
  scanDuration = Math.max(1800, 4500 - level*280);
  verifyWindow = Math.max(350, 900 - level*55);
  scanProgress = 0;
  midSpawned = false;
  if(windowMsEl) windowMsEl.textContent = Math.round(verifyWindow) + 'ms';
  if(levelEl) levelEl.textContent = String(level);
}

function nodeAt(x,y){
  for(var i=nodes.length-1;i>=0;i--){
    var n = nodes[i];
    var dx = x-n.x, dy = y-n.y;
    if(dx*dx+dy*dy <= (n.r+10)*(n.r+10)) return n;
  }
  return null;
}

function wireExists(a,b){
  for(var i=0;i<wires.length;i++){
    var w = wires[i];
    if((w.from===a&&w.to===b)||(w.from===b&&w.to===a)) return true;
  }
  return false;
}

function tryConnect(fromNode, toNode){
  if(!fromNode || !toNode || fromNode.id === toNode.id) return false;
  if(fromNode.pairId !== toNode.pairId || fromNode.pairId < 0) {
    flashAlpha = 0.5; beep(120,0.12,0.04); vibrate(30);
    return false;
  }
  if(wireExists(fromNode.id, toNode.id)) return false;
  wires.push({from:fromNode.id, to:toNode.id, color:fromNode.color, glow:1});
  var p = pairs[fromNode.pairId];
  if(p) p.done = true;
  beep(440 + level*20, 0.08, 0.07);
  spawnParticles((fromNode.x+toNode.x)/2, (fromNode.y+toNode.y)/2, fromNode.color, 8);
  return true;
}

function allPairsDone(){
  for(var i=0;i<pairs.length;i++) if(!pairs[i].done) return false;
  return pairs.length > 0;
}

function spawnParticles(x,y,col,n){
  for(var i=0;i<n;i++){
    particles.push({x:x,y:y,vx:rand(-3,3),vy:rand(-4,1),life:1,color:col,r:rand(2,4)});
  }
}

function addComponent(){
  level++;
  score += 10 * level + combo * 5;
  combo++;
  if(scoreEl) scoreEl.textContent = String(score);
  spawnLevel();
  toastMsg('COMPONENT UNLOCKED');
  beep(660,0.06,0.06); beep(880,0.1,0.05);
  vibrate(40);
}

function failVerify(reason){
  state = 'gameover';
  if(gameoverScreen) gameoverScreen.classList.remove('hidden');
  if(failReason) failReason.textContent = reason || 'Verification window closed with open circuits.';
  if(finalScore) finalScore.textContent = String(score);
  if(finalLevel) finalLevel.textContent = String(level);
  beep(80,0.3,0.08); vibrate([60,40,60]);
}

function passVerify(){
  score += 5 + pairs.length * 3;
  combo++;
  if(scoreEl) scoreEl.textContent = String(score);
  flashAlpha = 0.35;
  spawnParticles(W/2, H/2, cssVar('--ok')||'#44ffaa', 16);
  beep(523,0.05,0.05); beep(784,0.08,0.05);
  vibrate(20);
  addComponent();
}

function spawnMidPair(){
  if(midSpawned || level < 3) return;
  midSpawned = true;
  var pid = pairs.length;
  var col = COLORS[pid % COLORS.length];
  var ax = rand(40, W-40), ay = rand(80, H-60);
  var bx = rand(40, W-40), by = rand(80, H-60);
  var idA = nodes.length, idB = nodes.length + 1;
  nodes.push({id:idA,x:ax,y:ay,r:14,color:col,pairId:pid,lit:true});
  nodes.push({id:idB,x:bx,y:by,r:14,color:col,pairId:pid,lit:true});
  pairs.push({id:pid,a:idA,b:idB,color:col,done:false});
  toastMsg('MID-SCAN COMPONENT DROP');
  beep(200,0.06,0.05);
  spawnParticles(W/2, 40, col, 10);
}

function updateScan(dt){
  if(state !== 'playing') return;
  scanProgress += dt;
  var total = scanDuration;
  var pct = Math.min(1, scanProgress / total);
  if(scanBar) scanBar.style.width = (pct*100)+'%';

  if(!midSpawned && level >= 3 && scanProgress > total * 0.55) spawnMidPair();

  if(scanProgress >= total - verifyWindow && scanProgress < total){
    if(scanLabel) scanLabel.textContent = 'VERIFY NOW';
    if(scanLabel) scanLabel.style.color = cssVar('--danger')||'#ff4466';
  } else if(scanProgress < total - verifyWindow * 0.5){
    if(scanLabel){ scanLabel.textContent = 'AGENT SCAN INCOMING'; scanLabel.style.color = cssVar('--muted')||'#6a8490'; }
  }

  if(scanProgress >= total){
    if(allPairsDone()){
      passVerify();
    } else {
      var open = 0;
      for(var i=0;i<pairs.length;i++) if(!pairs[i].done) open++;
      failVerify(open + ' circuit' + (open!==1?'s':'') + ' still open at verification.');
    }
  }
}

function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt*0.002;
    if(p.life <= 0) particles.splice(i,1);
  }
  if(flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt*0.003);
  if(shake > 0) shake = Math.max(0, shake - dt*0.008);
}

function drawGrid(){
  if(!ctx) return;
  lightMode = isLight();
  var pcb = cssVar('--pcb')||'#111820';
  var grid = cssVar('--grid')||'#1a2830';
  ctx.fillStyle = pcb;
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = grid;
  ctx.lineWidth = 0.5;
  ctx.globalAlpha = 0.35;
  var step = 24;
  for(var x=0;x<W;x+=step){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
  for(var y=0;y<H;y+=step){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
  ctx.globalAlpha = 1;
  /* decorative traces */
  ctx.strokeStyle = grid;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.2;
  ctx.beginPath();ctx.moveTo(20,H-30);ctx.lineTo(W-20,H-30);ctx.lineTo(W-20,40);ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawWire(x1,y1,x2,y2,col,alpha,glow){
  if(!ctx) return;
  var mx = (x1+x2)/2, my = (y1+y2)/2 - Math.abs(x2-x1)*0.15;
  ctx.save();
  ctx.globalAlpha = alpha || 1;
  if(glow){
    ctx.strokeStyle = col;
    ctx.lineWidth = 8;
    ctx.globalAlpha = (alpha||1)*0.25;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();
    ctx.globalAlpha = alpha || 1;
  }
  ctx.strokeStyle = col;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();
  ctx.restore();
}

function drawComponent(n){
  if(!ctx) return;
  ctx.save();
  ctx.strokeStyle = n.color;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1;
  ctx.strokeRect(n.x-18,n.y-22,36,12);
  ctx.fillStyle = n.color;
  ctx.globalAlpha = 0.15;
  ctx.fillRect(n.x-18,n.y-22,36,12);
  ctx.restore();
}

function drawNode(n, pulse){
  if(!ctx) return;
  var r = n.r;
  var lit = n.lit || pulse || (kbSelect && kbSelect.id === n.id);
  drawComponent(n);
  ctx.save();
  if(lit){
    ctx.shadowColor = n.color;
    ctx.shadowBlur = 16;
  }
  ctx.fillStyle = cssVar('--pcb')||'#111820';
  ctx.beginPath();ctx.arc(n.x,n.y,r+4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle = n.color;
  ctx.lineWidth = lit ? 3 : 2;
  ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle = n.color;
  ctx.globalAlpha = lit ? 0.9 : 0.5;
  ctx.beginPath();ctx.arc(n.x,n.y,4,0,Math.PI*2);ctx.fill();
  if(kbSelect && kbSelect.id === n.id){
    ctx.strokeStyle = cssVar('--text')||'#c8d6dc';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();ctx.arc(n.x,n.y,r+7,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawScanner(){
  if(!ctx || state !== 'playing') return;
  var pct = Math.min(1, scanProgress / scanDuration);
  var sx = pct * W;
  var inWindow = scanProgress >= scanDuration - verifyWindow;
  ctx.save();
  ctx.globalAlpha = inWindow ? 0.55 : 0.25;
  var grad = ctx.createLinearGradient(sx-40,0,sx+40,0);
  var c = inWindow ? (cssVar('--danger')||'#ff4466') : (cssVar('--trace')||'#00e5c0');
  grad.addColorStop(0,'transparent');
  grad.addColorStop(0.5,c);
  grad.addColorStop(1,'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(sx-40,0,80,H);
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.globalAlpha = inWindow ? 0.9 : 0.5;
  ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
  ctx.restore();
}

function render(){
  if(!ctx){ return; }
  var ox = shake ? rand(-shake,shake) : 0;
  var oy = shake ? rand(-shake,shake) : 0;
  ctx.save();
  ctx.translate(ox,oy);
  drawGrid();
  drawScanner();

  for(var i=0;i<wires.length;i++){
    var w = wires[i];
    var a = nodes[w.from], b = nodes[w.to];
    if(a&&b) drawWire(a.x,a.y,b.x,b.y,w.color,1,true);
  }

  if(dragNode && pointerDown){
    drawWire(dragNode.x, dragNode.y, dragX, dragY, dragNode.color, 0.6, false);
  }

  var pulse = 0.5 + 0.5*Math.sin(Date.now()*0.005);
  for(var j=0;j<nodes.length;j++){
    var nd = nodes[j];
    var needsWire = false;
    if(nd.pairId >= 0 && pairs[nd.pairId] && !pairs[nd.pairId].done) needsWire = true;
    drawNode(nd, needsWire && pulse > 0.7);
  }

  for(var k=0;k<particles.length;k++){
    var p = particles[k];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha = 1;

  if(flashAlpha > 0){
    ctx.fillStyle = cssVar('--danger')||'#ff4466';
    ctx.globalAlpha = flashAlpha * 0.3;
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

function loop(t){
  var dt = lastTime ? Math.min(t - lastTime, 50) : 16;
  lastTime = t;
  if(state === 'playing'){
    roundTime += dt;
    updateScan(dt);
    if(roundTime > 55000){
      failVerify('Session timeout — agent revoked board access.');
    }
  }
  updateParticles(dt);
  render();
  animId = requestAnimationFrame(loop);
}

function getPos(e){
  var rect = canvas.getBoundingClientRect();
  var cx, cy;
  if(e.touches && e.touches.length){
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  return {x: cx - rect.left, y: cy - rect.top};
}

function onDown(e){
  if(state !== 'playing' || !canvas) return;
  e.preventDefault();
  var p = getPos(e);
  var n = nodeAt(p.x, p.y);
  if(n){ dragNode = n; dragX = p.x; dragY = p.y; pointerDown = true; n.lit = true; beep(300,0.04,0.03); }
}

function onMove(e){
  if(!pointerDown || state !== 'playing') return;
  e.preventDefault();
  var p = getPos(e);
  dragX = p.x; dragY = p.y;
}

function onUp(e){
  if(!pointerDown || state !== 'playing'){ pointerDown = false; dragNode = null; return; }
  e.preventDefault();
  var p = getPos(e);
  if(e.changedTouches && e.changedTouches.length){
    p.x = e.changedTouches[0].clientX - canvas.getBoundingClientRect().left;
    p.y = e.changedTouches[0].clientY - canvas.getBoundingClientRect().top;
  }
  var target = nodeAt(p.x, p.y);
  if(dragNode && target) tryConnect(dragNode, target);
  if(dragNode) dragNode.lit = false;
  pointerDown = false; dragNode = null;
}

function nextOpenNode(start){
  for(var i=0;i<pairs.length;i++){
    if(!pairs[i].done){
      var ids = [pairs[i].a, pairs[i].b];
      for(var j=0;j<ids.length;j++){
        if(ids[j] >= start) return nodes[ids[j]];
      }
      return nodes[ids[0]];
    }
  }
  return nodes[0] || null;
}

function onKeyDown(e){
  if(!e || state !== 'playing') return;
  var k = e.key;
  if(k === 'ArrowRight' || k === 'ArrowDown'){
    e.preventDefault();
    kbHover = (kbHover + 1) % Math.max(nodes.length, 1);
    kbSelect = nodes[kbHover];
    beep(280,0.03,0.02);
  } else if(k === 'ArrowLeft' || k === 'ArrowUp'){
    e.preventDefault();
    kbHover = (kbHover - 1 + nodes.length) % Math.max(nodes.length, 1);
    kbSelect = nodes[kbHover];
    beep(280,0.03,0.02);
  } else if(k === 'Enter' || k === ' '){
    if(kbSelect){
      e.preventDefault();
      if(dragNode && dragNode.id !== kbSelect.id){
        tryConnect(dragNode, kbSelect);
        dragNode = null; pointerDown = false;
        kbSelect = nextOpenNode(0);
        if(kbSelect) kbHover = kbSelect.id;
      } else {
        dragNode = kbSelect;
        dragX = kbSelect.x; dragY = kbSelect.y;
        pointerDown = true;
        beep(300,0.04,0.03);
      }
    }
  } else if(k >= '1' && k <= '9'){
    var idx = parseInt(k,10) - 1;
    if(nodes[idx]){
      kbHover = idx; kbSelect = nodes[idx];
      if(dragNode && dragNode.id !== kbSelect.id){
        tryConnect(dragNode, kbSelect);
        dragNode = null; pointerDown = false;
        kbSelect = nextOpenNode(0);
        if(kbSelect) kbHover = kbSelect.id;
      } else {
        dragNode = kbSelect; pointerDown = true; dragX = kbSelect.x; dragY = kbSelect.y;
      }
      beep(320,0.04,0.03);
    }
  }
}

function startGame(){
  initAudio();
  state = 'playing';
  score = 0; level = 1; combo = 0; roundTime = 0;
  particles = []; wires = []; kbSelect = null; kbHover = 0; dragNode = null;
  if(scoreEl) scoreEl.textContent = '0';
  if(titleScreen) titleScreen.classList.add('hidden');
  if(gameoverScreen) gameoverScreen.classList.add('hidden');
  spawnLevel();
  kbSelect = nextOpenNode(0);
  toastMsg('WIRE ALL PAIRS BEFORE SCAN');
}

function restartGame(){ startGame(); }

function bindEvents(){
  if(canvas){
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, {passive:false});
    canvas.addEventListener('touchmove', onMove, {passive:false});
    canvas.addEventListener('touchend', onUp, {passive:false});
    canvas.addEventListener('touchcancel', onUp, {passive:false});
  }
  if(btnStart) btnStart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
  if(btnRestart) btnRestart.addEventListener('click', function(e){ e.stopPropagation(); restartGame(); });
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', onKeyDown);
  try{
    if(window.matchMedia){
      window.matchMedia('(prefers-color-scheme:light)').addEventListener('change', function(){ render(); });
    }
  }catch(e){}
}

resize();
bindEvents();
render();
animId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
