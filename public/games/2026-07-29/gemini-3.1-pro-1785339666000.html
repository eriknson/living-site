<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Aftershock</title>
    <style>
        :root {
            --bg: #f4f1ea;
            --ink: #2c2c2c;
            --accent: #b22222;
            --ui-bg: rgba(244, 241, 234, 0.9);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --ink: #e0dcd3;
                --accent: #ff4444;
                --ui-bg: rgba(26, 26, 26, 0.9);
            }
        }
        body, html {
            margin: 0; padding: 0;
            width: 100dvw; height: 100dvh;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--ink);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--ui-bg);
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .hidden {
            opacity: 0;
        }
        h1, h2 {
            font-weight: 300;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        p {
            font-weight: 300;
            opacity: 0.7;
            margin-bottom: 2rem;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
        button {
            pointer-events: auto;
            background: transparent;
            border: 2px solid var(--ink);
            color: var(--ink);
            font-family: inherit;
            font-size: 1.5rem;
            padding: 1rem 2rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s;
        }
        button:active {
            background: var(--ink);
            color: var(--bg);
        }
        #hud {
            background: transparent;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.1em;
        }
        #lives-display {
            color: var(--accent);
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="title-screen" class="screen">
            <h1>AFTERSHOCK</h1>
            <p>Tap when sharp peaks cross the needle.<br>Ignore the smooth waves.</p>
            <button data-smoke="start" id="start-btn">BEGIN</button>
        </div>
        
        <div id="hud" class="screen hidden">
            <div style="position: absolute; top: 20px; left: 20px; text-align: left;">
                <div id="score-display">SCORE: 0</div>
                <div id="streak-display">STREAK: 0</div>
            </div>
            <div style="position: absolute; top: 20px; right: 20px; text-align: right;">
                <div id="lives-display">♥♥♥</div>
            </div>
        </div>
        
        <div id="game-over-screen" class="screen hidden">
            <h2>SILENCE</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button data-smoke="restart" id="restart-btn">RESTART</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgCanvas = document.createElement('canvas');
        
        let state = 'MENU';
        let time = 0;
        let lastTime = performance.now();
        let score = 0;
        let streak = 0;
        let lives = 3;
        let currentPhase = 0;
        let speed = 0;
        let escalationLevel = 0;
        let beatIntervalPhase = 0;
        let nextSpawnPhase = 0;
        let beatCount = 0;
        let peaks = [];
        let particles = [];
        let floatingTexts = [];
        let isCalm = false;
        let calmTime = 0;
        let calmRatio = 0;
        let screenShake = 0;
        
        let needleX = 0;
        let centerY = 0;
        
        let isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            isDarkMode = e.matches;
            generatePaperTexture();
        });
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let spd = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * spd;
                this.vy = Math.sin(angle) * spd;
                this.life = 1;
                this.decay = 0.02 + Math.random() * 0.03;
                this.color = color;
                this.size = Math.random() * 4 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.life = 1;
                this.vy = -1;
            }
            update() {
                this.y += this.vy;
                this.life -= 0.02;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.font = "bold 20px ui-monospace, 'SFMono-Regular', Menlo, monospace";
                ctx.textAlign = "center";
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1;
            }
        }
        
        function generatePaperTexture() {
            bgCanvas.width = canvas.width;
            bgCanvas.height = canvas.height;
            const bctx = bgCanvas.getContext('2d');
            bctx.fillStyle = isDarkMode ? '#1a1a1a' : '#f4f1ea';
            bctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            const imgData = bctx.getImageData(0, 0, bgCanvas.width, bgCanvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let noise = (Math.random() - 0.5) * 15;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
            }
            bctx.putImageData(imgData, 0, 0);
        }
        
        function resizeCanvas() {
            if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                generatePaperTexture();
                needleX = canvas.width * 0.25;
                centerY = canvas.height * 0.5;
                if (state === 'MENU') {
                    speed = canvas.width * 0.5 / 1000;
                }
            }
        }
        
        let audioCtx;
        let rumbleOsc, rumbleGain;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        function startRumble() {
            if (!audioCtx) return;
            if (!rumbleOsc) {
                rumbleOsc = audioCtx.createOscillator();
                rumbleGain = audioCtx.createGain();
                rumbleOsc.type = 'triangle';
                rumbleOsc.frequency.value = 40;
                rumbleOsc.connect(rumbleGain);
                rumbleGain.connect(audioCtx.destination);
                rumbleGain.gain.value = 0;
                rumbleOsc.start();
            }
        }
        
        function updateRumble() {
            if (rumbleGain && audioCtx) {
                let targetGain = (0.1 + escalationLevel * 0.05) * (1 - calmRatio);
                rumbleGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.1);
            }
        }
        
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'perfect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'good') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'miss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'calm') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 2.0);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 2.0);
                osc.start(now);
                osc.stop(now + 2.0);
            }
        }
        
        function getWaveY(worldX, t) {
            let y = 0;
            let baseNoiseAmp = 10;
            let noiseAmp = baseNoiseAmp + escalationLevel * 5;
            let calmMultiplier = 1 - calmRatio;
            noiseAmp *= calmMultiplier;
            
            y += Math.sin(worldX * 0.01 + t * 0.005) * noiseAmp;
            y += Math.sin(worldX * 0.023 - t * 0.003) * noiseAmp * 0.5;
            
            for (let peak of peaks) {
                let dx = worldX - peak.phase;
                if (Math.abs(dx) > 400) continue;
                
                if (peak.type === 'sharp') {
                    let width = 40;
                    let env = Math.exp(-(dx * dx) / (width * width));
                    y += env * -100 * calmMultiplier * peak.amplitude;
                } else if (peak.type === 'false') {
                    let width = 80;
                    let env = Math.exp(-(dx * dx) / (width * width));
                    y += env * Math.sin(dx * 0.1) * 40 * calmMultiplier * peak.amplitude;
                }
            }
            return y;
        }
        
        function updateSpawning() {
            while (currentPhase + canvas.width * 1.5 > nextSpawnPhase) {
                if (isCalm) {
                    nextSpawnPhase += beatIntervalPhase;
                    beatCount++;
                    continue;
                }
                
                let level = escalationLevel;
                let spawnSharp = false;
                let spawnFalse = false;
                
                if (level === 0) {
                    if (beatCount % 4 === 0) spawnSharp = true;
                } else if (level === 1) {
                    if (beatCount % 2 === 0) spawnSharp = true;
                } else if (level === 2) {
                    if (beatCount % 2 === 0) spawnSharp = true;
                    else if (beatCount % 4 === 1) spawnFalse = true;
                } else {
                    let r = Math.random();
                    if (beatCount % 2 === 0) {
                        spawnSharp = true;
                    } else {
                        if (r < 0.4) spawnSharp = true;
                        else if (r < 0.7) spawnFalse = true;
                    }
                }
                
                if (spawnSharp) {
                    peaks.push({ phase: nextSpawnPhase, type: 'sharp', hit: false, passed: false, amplitude: 1 });
                } else if (spawnFalse) {
                    peaks.push({ phase: nextSpawnPhase, type: 'false', hit: false, passed: false, amplitude: 1 });
                }
                
                nextSpawnPhase += beatIntervalPhase;
                beatCount++;
            }
        }
        
        function triggerCalm() {
            isCalm = true;
            calmTime = 3000;
            let goodWindowPhase = speed * 200;
            peaks = peaks.filter(p => p.phase <= currentPhase + goodWindowPhase);
            score += 500;
            floatingTexts.push(new FloatingText(canvas.width / 2, centerY - 100, "ZEN BONUS +500", isDarkMode ? '#e0dcd3' : '#2c2c2c'));
            playSound('calm');
            updateHUD();
        }
        
        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        function handleTap() {
            initAudio();
            
            let closest = null;
            let minPhaseDist = Infinity;
            
            for (let peak of peaks) {
                if (peak.type === 'sharp' && !peak.hit && !peak.passed) {
                    let dist = Math.abs(peak.phase - currentPhase);
                    if (dist < minPhaseDist) {
                        minPhaseDist = dist;
                        closest = peak;
                    }
                }
            }
            
            let perfectWindowPhase = speed * 100;
            let goodWindowPhase = speed * 200;
            
            if (closest && minPhaseDist < goodWindowPhase) {
                if (minPhaseDist < perfectWindowPhase) {
                    closest.hit = 'perfect';
                    streak++;
                    score += 100 + streak * 10;
                    spawnParticles(needleX, centerY + getWaveY(closest.phase, time), isDarkMode ? '#ff4444' : '#b22222', 20);
                    floatingTexts.push(new FloatingText(needleX, centerY - 50, "PERFECT", isDarkMode ? '#ff4444' : '#b22222'));
                    playSound('perfect');
                    if (navigator.vibrate) navigator.vibrate(20);
                } else {
                    closest.hit = 'good';
                    streak++;
                    score += 50 + streak * 5;
                    spawnParticles(needleX, centerY + getWaveY(closest.phase, time), isDarkMode ? '#ffaa44' : '#b26622', 10);
                    floatingTexts.push(new FloatingText(needleX, centerY - 50, "GOOD", isDarkMode ? '#ffaa44' : '#b26622'));
                    playSound('good');
                    if (navigator.vibrate) navigator.vibrate(10);
                }
                
                if (streak > 0 && streak % 10 === 0 && !isCalm) {
                    triggerCalm();
                }
            } else {
                streak = 0;
                lives--;
                playSound('miss');
                screenShake = 15;
                if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
                
                if (lives <= 0) {
                    gameOver();
                }
            }
            
            updateHUD();
        }
        
        function updateHUD() {
            document.getElementById('score-display').innerText = `SCORE: ${score}`;
            document.getElementById('streak-display').innerText = `STREAK: ${streak}`;
            let hearts = '';
            for (let i = 0; i < 3; i++) {
                hearts += i < lives ? '♥' : '♡';
            }
            document.getElementById('lives-display').innerText = hearts;
        }
        
        function gameOver() {
            state = 'GAMEOVER';
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            if (rumbleGain && audioCtx) rumbleGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        }
        
        function startGame() {
            initAudio();
            startRumble();
            
            state = 'PLAYING';
            lastTime = performance.now();
            score = 0;
            streak = 0;
            lives = 3;
            currentPhase = 0;
            escalationLevel = 0;
            speed = canvas.width * 0.5 / 1000;
            beatIntervalPhase = speed * 500;
            nextSpawnPhase = canvas.width;
            beatCount = 0;
            peaks = [];
            particles = [];
            floatingTexts = [];
            isCalm = false;
            calmTime = 0;
            calmRatio = 0;
            screenShake = 0;
            
            document.getElementById('title-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            updateHUD();
        }
        
        function updateGame(dt, now) {
            time += dt;
            
            escalationLevel = Math.floor(score / 1000);
            speed = canvas.width * (0.5 + escalationLevel * 0.05) / 1000;
            let beatIntervalMs = Math.max(250, 500 - escalationLevel * 30);
            beatIntervalPhase = speed * beatIntervalMs;
            
            currentPhase += speed * dt;
            
            if (isCalm) {
                calmTime -= dt;
                if (calmTime <= 0) isCalm = false;
                calmRatio = Math.min(1, calmRatio + dt * 0.005);
            } else {
                calmRatio = Math.max(0, calmRatio - dt * 0.005);
            }
            
            updateSpawning();
            updateRumble();
            
            let goodWindowPhase = speed * 200;
            for (let peak of peaks) {
                if (peak.type === 'sharp' && !peak.hit && !peak.passed) {
                    if (currentPhase - peak.phase > goodWindowPhase) {
                        peak.passed = true;
                        streak = 0;
                        lives--;
                        playSound('miss');
                        screenShake = 15;
                        if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
                        updateHUD();
                        
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                }
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update();
                if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }
            
            if (screenShake > 0) {
                screenShake -= dt * 0.05;
                if (screenShake < 0) screenShake = 0;
            }
        }
        
        function drawGame(now) {
            ctx.save();
            
            if (screenShake > 0) {
                let dx = (Math.random() - 0.5) * screenShake;
                let dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
            }
            
            ctx.beginPath();
            ctx.moveTo(needleX, 0);
            ctx.lineTo(needleX, canvas.height);
            ctx.strokeStyle = isDarkMode ? 'rgba(255, 68, 68, 0.3)' : 'rgba(178, 34, 34, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            let goodPx = speed * 200;
            let perfectPx = speed * 100;
            
            ctx.strokeStyle = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(needleX - goodPx, centerY - 20);
            ctx.lineTo(needleX - goodPx, centerY + 20);
            ctx.moveTo(needleX + goodPx, centerY - 20);
            ctx.lineTo(needleX + goodPx, centerY + 20);
            ctx.stroke();
            
            ctx.strokeStyle = isDarkMode ? 'rgba(255, 255, 255, 0.2)' : 'rgba(0, 0, 0, 0.2)';
            ctx.beginPath();
            ctx.moveTo(needleX - perfectPx, centerY - 10);
            ctx.lineTo(needleX - perfectPx, centerY + 10);
            ctx.moveTo(needleX + perfectPx, centerY - 10);
            ctx.lineTo(needleX + perfectPx, centerY + 10);
            ctx.stroke();
            
            ctx.beginPath();
            let step = 4;
            for (let x = 0; x <= canvas.width; x += step) {
                let worldX = currentPhase + (x - needleX);
                let y = centerY + getWaveY(worldX, time);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = isDarkMode ? '#e0dcd3' : '#2c2c2c';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.shadowColor = ctx.strokeStyle;
            ctx.shadowBlur = 4;
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            for (let peak of peaks) {
                let x = needleX + (peak.phase - currentPhase);
                if (x > -50 && x < canvas.width + 50) {
                    let y = centerY + getWaveY(peak.phase, time);
                    if (peak.type === 'sharp') {
                        if (peak.hit) {
                            ctx.beginPath();
                            ctx.arc(x, y, 5, 0, Math.PI * 2);
                            ctx.fillStyle = peak.hit === 'perfect' ? (isDarkMode ? '#ff4444' : '#b22222') : (isDarkMode ? '#ffaa44' : '#b26622');
                            ctx.fill();
                        } else if (!peak.passed) {
                            ctx.beginPath();
                            ctx.arc(x, y, 3, 0, Math.PI * 2);
                            ctx.fillStyle = isDarkMode ? '#e0dcd3' : '#2c2c2c';
                            ctx.fill();
                        }
                    }
                }
            }
            
            for (let p of particles) p.draw(ctx);
            for (let ft of floatingTexts) ft.draw(ctx);
            
            if (calmRatio > 0) {
                ctx.fillStyle = isDarkMode ? `rgba(255, 255, 255, ${calmRatio * 0.05})` : `rgba(255, 255, 255, ${calmRatio * 0.2})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            ctx.restore();
        }
        
        function gameLoop(now) {
            requestAnimationFrame(gameLoop);
            
            let dt = now - lastTime;
            lastTime = now;
            if (dt > 100) dt = 100;
            
            resizeCanvas();
            
            ctx.drawImage(bgCanvas, 0, 0);
            
            if (state === 'PLAYING') {
                updateGame(dt, now);
            } else if (state === 'MENU') {
                time += dt;
                currentPhase += speed * dt;
            }
            
            drawGame(now);
        }
        
        window.onload = () => {
            resizeCanvas();
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', startGame);
            
            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (state === 'PLAYING') handleTap();
            });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
            }, { passive: false });
            
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
