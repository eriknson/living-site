<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost Frequency 2026</title>
<style>
  :root {
    --bg: #0d0802;
    --fg: #ff8c00;
    --dim: #5c3300;
    --glow: 6px;
    --crt-line: rgba(0, 0, 0, 0.4);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0802;
      --fg: #ff8c00;
      --dim: #5c3300;
      --glow: 6px;
      --crt-line: rgba(0, 0, 0, 0.4);
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4ede4;
      --fg: #d95e00;
      --dim: #c7a17a;
      --glow: 0px;
      --crt-line: rgba(0, 0, 0, 0.05);
    }
  }
  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    overflow: hidden; touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: auto;
  }
  #crt {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      var(--crt-line) 2px,
      var(--crt-line) 4px
    );
  }
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; pointer-events: none;
  }
  .hidden { display: none !important; }
  
  .screen h1 {
    font-size: 2.2rem; margin: 0 0 15px 0;
    text-shadow: 0 0 var(--glow) var(--fg);
    text-transform: uppercase; letter-spacing: 2px; line-height: 1.2;
  }
  .screen p {
    font-size: 1rem; margin: 0 0 40px 0; max-width: 85%; line-height: 1.5;
    text-shadow: 0 0 calc(var(--glow)/2) var(--fg);
  }
  
  button {
    pointer-events: auto;
    background: var(--fg); color: var(--bg);
    border: none; padding: 18px 40px; font-size: 1.2rem;
    font-family: inherit; font-weight: bold; cursor: pointer;
    text-transform: uppercase; border-radius: 4px;
    box-shadow: 0 0 var(--glow) var(--fg);
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }
  
  #hud {
    position: absolute; top: 30px; left: 30px; right: 30px;
    display: flex; justify-content: space-between;
    font-size: 1.2rem; font-weight: bold; pointer-events: none;
    text-shadow: 0 0 var(--glow) var(--fg);
  }
  #message-box {
    position: absolute; bottom: 50px; left: 5%; width: 90%;
    text-align: center; font-size: 1.1rem; font-weight: bold;
    pointer-events: none;
    text-shadow: 0 0 var(--glow) var(--fg);
    min-height: 2.4rem;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="crt"></div>

<div id="ui-layer">
  <div id="hud" class="hidden">
    <div id="score-disp">DECODES: 0</div>
    <div id="time-disp">30.0s</div>
  </div>
  <div id="message-box" class="hidden"></div>
  
  <div id="title-screen" class="screen">
    <h1>Ghost Frequency<br>2026</h1>
    <p>Flick the dial to seek the signal.<br>Hold steady to decode before interference pulls you away.</p>
    <button data-smoke="start" id="start-btn">Tune In</button>
  </div>
  
  <div id="game-over-screen" class="screen hidden">
    <h1>SIGNAL LOST</h1>
    <p>Decodes: <span id="final-score">0</span></p>
    <button data-smoke="restart" id="restart-btn">Retune</button>
  </div>
</div>

<script>
// --- Configuration & State ---
const snippets = [
  "AI AGENT STRIKE ENTERS DAY 4",
  "ORBITAL DATACENTER LAUNCH SUCCESS",
  "CRYPTOGRAPHIC FOG BLANKETS SF",
  "NEURAL LINK FIRMWARE RECALLED",
  "SYNTHETIC SUMMER EXTENDED",
  "MARS COLONY PINGS AFTER SILENCE",
  "AUTONOMOUS TAXI FLEET GOES ROGUE",
  "DEEPSEA CABLES SEVERED BY DRONES",
  "AGI TIMELINE REVISED TO YESTERDAY",
  "QUANTUM DECRYPTION KEY LEAKED",
  "HACKER RADIO ON THE FRINGE DETECTED"
];

let gameState = 'title'; // 'title', 'playing', 'gameover'
let score = 0;
let timeLeft = 30;
let dialX = 500;
let targetX = 580;
let decodeProgress = 0;
let flashAlpha = 0;

// --- Colors & Theme ---
const colors = { bg: '#0d0802', fg: '#ff8c00', dim: '#5c3300' };
function updateColors() {
  const isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  if (isLight) {
    colors.bg = '#f4ede4'; colors.fg = '#d95e00'; colors.dim = '#c7a17a';
  } else {
    colors.bg = '#0d0802'; colors.fg = '#ff8c00'; colors.dim = '#5c3300';
  }
}
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateColors);
}
updateColors();

// --- Audio System ---
let audioCtx, masterGain, filterNode, oscNode, oscGain;
function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  try {
    audioCtx = new AudioContext();
    
    // Noise buffer
    let bufferSize = audioCtx.sampleRate * 2;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let output = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    let noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buffer;
    noiseNode.loop = true;
    
    filterNode = audioCtx.createBiquadFilter();
    filterNode.type = 'bandpass';
    noiseNode.connect(filterNode);
    
    // Sine tone
    oscNode = audioCtx.createOscillator();
    oscNode.type = 'sine';
    oscNode.frequency.value = 440;
    oscGain = audioCtx.createGain();
    oscGain.gain.value = 0;
    oscNode.connect(oscGain);
    
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    
    filterNode.connect(masterGain);
    oscGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);
    
    noiseNode.start();
    oscNode.start();
  } catch (e) {
    audioCtx = null;
    console.warn("Audio init failed", e);
  }
}

// --- Canvas & Rendering ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function wrap(x, m) {
  return ((x % m) + m) % m;
}

function draw(time) {
  // Clear
  ctx.fillStyle = colors.bg;
  ctx.fillRect(0, 0, w, h);
  
  let d = Math.abs(dialX - targetX);
  
  // Signal Bars
  let bars = 12;
  let signalStrength = Math.max(0, 1 - d / 35);
  let activeBars = Math.floor(signalStrength * bars);
  let barW = (w < 400) ? 12 : 16;
  let barGap = 4;
  let totalW = bars * (barW + barGap);
  let startX = w/2 - totalW/2;
  
  for (let i = 0; i < bars; i++) {
    ctx.fillStyle = i < activeBars ? colors.fg : colors.dim;
    ctx.fillRect(startX + i * (barW + barGap), h * 0.12, barW, 8);
  }
  
  // Directional hint if far away
  if (d > 35 && gameState === 'playing') {
    ctx.fillStyle = colors.dim;
    ctx.font = '16px ui-monospace, monospace';
    ctx.textAlign = 'center';
    if (targetX > dialX) {
      ctx.fillText("SIGNAL >>>", w - 60, h * 0.12 + 8);
    } else {
      ctx.fillText("<<< SIGNAL", 60, h * 0.12 + 8);
    }
  }
  
  // Oscilloscope
  let waveAmp = h * 0.12;
  let points = 100;
  let noiseLevel = Math.min(1, d / 40);
  let sLevel = 1 - Math.min(1, d / 15);
  
  ctx.beginPath();
  for (let i = 0; i <= points; i++) {
    let px = (i / points) * w;
    let sine = Math.sin(px * 0.05 - time/150) * waveAmp * sLevel;
    let noise = (Math.random() * 2 - 1) * waveAmp * noiseLevel;
    let py = h * 0.32 + sine + noise;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = colors.fg;
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Decode Progress
  if (decodeProgress > 0 && gameState === 'playing') {
    let bw = Math.min(260, w * 0.8), bh = 14;
    let bx = w/2 - bw/2, by = h * 0.50;
    ctx.strokeStyle = colors.dim;
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = colors.fg;
    ctx.fillRect(bx + 3, by + 3, (bw - 6) * decodeProgress, bh - 6);
    
    ctx.fillStyle = colors.fg;
    ctx.font = '14px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText("DECODING...", w/2, by - 12);
  }
  
  // Dial Line
  let dialY = h * 0.75;
  ctx.beginPath();
  ctx.moveTo(0, dialY);
  ctx.lineTo(w, dialY);
  ctx.strokeStyle = colors.fg;
  ctx.lineWidth = 1;
  ctx.stroke();
  
  // Dial Ticks
  let range = 25; // visible ticks
  let pixelsPerUnit = w / (range * 2);
  let startTick = Math.floor(dialX - range);
  let endTick = Math.ceil(dialX + range);
  
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = '15px ui-monospace, monospace';
  
  for (let i = startTick; i <= endTick; i++) {
    let x = w/2 + (i - dialX) * pixelsPerUnit;
    if (i % 10 === 0) {
      ctx.beginPath(); ctx.moveTo(x, dialY); ctx.lineTo(x, dialY + 20);
      ctx.strokeStyle = colors.fg; ctx.stroke();
      let mhz = 88.0 + wrap(i / 10, 20);
      ctx.fillStyle = colors.fg;
      ctx.fillText(mhz.toFixed(1), x, dialY + 28);
    } else if (i % 5 === 0) {
      ctx.beginPath(); ctx.moveTo(x, dialY); ctx.lineTo(x, dialY + 15);
      ctx.strokeStyle = colors.dim; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(x, dialY); ctx.lineTo(x, dialY + 8);
      ctx.strokeStyle = colors.dim; ctx.stroke();
    }
  }
  
  // Center Needle
  ctx.beginPath();
  ctx.moveTo(w/2, dialY - 20);
  ctx.lineTo(w/2, dialY + 50);
  ctx.strokeStyle = 'red';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Flash Overlay
  if (flashAlpha > 0) {
    ctx.fillStyle = colors.fg;
    ctx.globalAlpha = flashAlpha;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1.0;
  }
}

// --- Input Handling ---
let isTouching = false;
let touchHistory = [];
let velocity = 0;
let lastTouchX = 0;

function onPointerDown(e) {
  isTouching = true;
  lastTouchX = e.clientX;
  touchHistory = [{x: e.clientX, t: performance.now()}];
  velocity = 0;
  if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
}

function onPointerMove(e) {
  if (!isTouching) return;
  let dx = e.clientX - lastTouchX;
  dialX -= dx * 0.2;
  lastTouchX = e.clientX;
  
  let now = performance.now();
  touchHistory.push({x: e.clientX, t: now});
  if (touchHistory.length > 5) touchHistory.shift();
}

function onPointerUp(e) {
  if (!isTouching) return;
  isTouching = false;
  if (canvas.releasePointerCapture) canvas.releasePointerCapture(e.pointerId);
  
  let now = performance.now();
  let valid = touchHistory.filter(h => now - h.t < 100);
  if (valid.length > 1) {
    let first = valid[0];
    let last = valid[valid.length - 1];
    let dt = (last.t - first.t) / 1000;
    if (dt > 0) velocity = -(last.x - first.x) * 0.2 / dt;
  } else {
    velocity = 0;
  }
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);

const keys = {};
function handleKeyDown(e) {
  keys[e.key] = true;
  if (['ArrowLeft', 'ArrowRight', 'a', 'A', 'd', 'D'].includes(e.key)) e.preventDefault();
}
function handleKeyUp(e) {
  keys[e.key] = false;
}
document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

// --- Game Logic ---
function decodeSuccess() {
  score++;
  timeLeft += 10;
  
  let snippet = snippets[score % snippets.length];
  document.getElementById('message-box').innerText = snippet;
  
  flashAlpha = 1;
  try { if (navigator.vibrate) navigator.vibrate(50); } catch(e){}
  
  let dir = Math.random() > 0.5 ? 1 : -1;
  let dist = 50 + Math.random() * 50 + score * 5;
  targetX = dialX + dir * dist;
  decodeProgress = 0;
}

function gameOver() {
  gameState = 'gameover';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('message-box').classList.add('hidden');
  document.getElementById('game-over-screen').classList.remove('hidden');
  document.getElementById('final-score').innerText = score;
}

function update(dt, time) {
  if (flashAlpha > 0) {
    flashAlpha -= dt * 1.5;
    if (flashAlpha < 0) flashAlpha = 0;
  }

  if (gameState === 'playing') {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      gameOver();
    }
    document.getElementById('time-disp').innerText = timeLeft.toFixed(1) + 's';
    document.getElementById('score-disp').innerText = 'DECODES: ' + score;
    
    const dialSpeed = 80;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dialX -= dialSpeed * dt;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dialX += dialSpeed * dt;

    if (!isTouching) {
      dialX += velocity * dt;
      velocity *= Math.pow(0.05, dt);
      if (Math.abs(velocity) < 1) velocity = 0;
    }
    
    let d = Math.abs(dialX - targetX);
    
    // Interference drift
    let driftAmp = 10 + score * 2;
    let driftFreq = 1 + score * 0.15;
    let drift = (Math.sin(time/1000 * driftFreq) + Math.sin(time/1000 * driftFreq * 1.73)) * driftAmp;
    
    if (d < 25) {
      dialX += drift * dt;
    }
    
    // Decoding
    if (d <= 3.5) {
      decodeProgress += dt / 2.0; // 2 seconds to decode
      if (decodeProgress >= 1) decodeSuccess();
    } else {
      decodeProgress = Math.max(0, decodeProgress - dt * 2.0);
    }
  } else if (gameState === 'title') {
    // gentle drift in title screen
    dialX += dt * 5;
  }
  
  // Audio updates
  if (audioCtx && masterGain) {
    try {
      let now = audioCtx.currentTime;
      if (gameState === 'playing') {
        masterGain.gain.setTargetAtTime(0.3, now, 0.1);
      } else {
        masterGain.gain.setTargetAtTime(0, now, 0.1);
      }
      
      let d = Math.abs(dialX - targetX);
      let nLevel = Math.min(1, d / 40);
      let sLevel = 1 - Math.min(1, d / 15);
      
      let fFreq = 300 + Math.abs(dialX % 100) * 10;
      filterNode.frequency.setTargetAtTime(fFreq, now, 0.1);
      filterNode.Q.setTargetAtTime(1 + nLevel * 5, now, 0.1);
      
      oscNode.frequency.setTargetAtTime(440 + (dialX - targetX) * 4, now, 0.1);
      oscGain.gain.setTargetAtTime(sLevel * 0.4, now, 0.1);
    } catch(e) {}
  }
}

let lastTime = 0;
function gameLoop(time) {
  let dt = (time - lastTime) / 1000;
  lastTime = time;
  if (dt > 0.1) dt = 0.1;
  
  update(dt, time);
  draw(time);
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame((time) => {
  lastTime = time;
  requestAnimationFrame(gameLoop);
});

// --- Flow Control ---
function startGame() {
  gameState = 'playing';
  score = 0;
  timeLeft = 30;
  dialX = 500;
  targetX = dialX + (Math.random() > 0.5 ? 60 : -60);
  decodeProgress = 0;
  flashAlpha = 0;
  
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('message-box').classList.remove('hidden');
  
  document.getElementById('message-box').innerText = "SCANNING FREQUENCIES...";
}

document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  startGame();
});

document.getElementById('restart-btn').addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  startGame();
});
</script>
</body>
</html>
