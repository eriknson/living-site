<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trust Queue</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef7f0;
      --panel: rgba(238, 247, 240, 0.86);
      --ink: #0d2525;
      --muted: #52736f;
      --line: rgba(30, 100, 98, 0.24);
      --teal: #008f80;
      --mint: #0cc7aa;
      --amber: #c47500;
      --red: #d13d28;
      --shadow: rgba(3, 20, 20, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #031313;
        --panel: rgba(3, 19, 19, 0.80);
        --ink: #dffdf5;
        --muted: #8dbab2;
        --line: rgba(90, 255, 224, 0.20);
        --teal: #46efd7;
        --mint: #8affdf;
        --amber: #ffca66;
        --red: #ff6d57;
        --shadow: rgba(0, 0, 0, 0.42);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #game {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 220ms ease, transform 220ms ease, visibility 220ms ease;
    }
    .overlay.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .panel {
      width: min(520px, 100%);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px 24px 24px;
      background: var(--panel);
      box-shadow: 0 22px 70px var(--shadow);
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(16px);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font: 700 12px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 13vw, 72px);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }
    .lead {
      margin: 18px auto 22px;
      max-width: 34rem;
      color: var(--muted);
      font-size: clamp(15px, 3.8vw, 18px);
      line-height: 1.45;
    }
    .rules {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 0 22px;
      font: 700 12px/1.25 ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .rule {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 13px 10px;
      background: rgba(255, 255, 255, 0.06);
    }
    .rule b { display: block; font-size: 20px; margin-bottom: 5px; }
    .trusted { color: var(--teal); }
    .spoof { color: var(--red); }
    button {
      min-width: 190px;
      min-height: 50px;
      border: 0;
      border-radius: 999px;
      padding: 0 24px;
      color: #001514;
      background: var(--mint);
      box-shadow: 0 12px 34px rgba(0, 143, 128, 0.26);
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      font: 900 13px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    button:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 4px;
    }
    #resultStats {
      margin: 0 0 18px;
      color: var(--muted);
      font: 700 13px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace;
      white-space: pre-line;
    }
    #hint {
      position: absolute;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 2;
      transform: translateX(-50%);
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      font: 800 11px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: opacity 180ms ease;
    }
    #hint.show { opacity: 0.88; }
  </style>
</head>
<body>
  <main id="game" aria-label="Trust Queue game">
    <canvas id="stage"></canvas>

    <div id="title" class="overlay show" aria-live="polite">
      <section class="panel">
        <p class="eyebrow">summer fog link verifier</p>
        <h1>TRUST<br>QUEUE</h1>
        <p class="lead">Read the signature shapes before the link queue floods. Matching certificate and stamp shapes are trusted. Mismatches and broken stamps are spoofed.</p>
        <div class="rules" aria-hidden="true">
          <div class="rule trusted"><b>LEFT</b>TRUSTED MATCH</div>
          <div class="rule spoof"><b>RIGHT</b>SPOOFED LINK</div>
        </div>
        <button id="startBtn" data-smoke="start" type="button">Begin Sort</button>
      </section>
    </div>

    <div id="over" class="overlay" aria-live="polite">
      <section class="panel">
        <p class="eyebrow" id="overKicker">queue closed</p>
        <h1 id="overTitle">VERDICT<br>LOG</h1>
        <p id="resultStats"></p>
        <button id="restartBtn" data-smoke="restart" type="button">Restart Relay</button>
      </section>
    </div>

    <div id="hint">Swipe left trusted / right spoof</div>
  </main>

  <script>
  (function () {
    "use strict";

    var canvas = document.getElementById("stage");
    var ctx = canvas && canvas.getContext ? canvas.getContext("2d", { alpha: false }) : null;
    var title = document.getElementById("title");
    var over = document.getElementById("over");
    var hint = document.getElementById("hint");
    var startBtn = document.getElementById("startBtn");
    var restartBtn = document.getElementById("restartBtn");
    var overTitle = document.getElementById("overTitle");
    var overKicker = document.getElementById("overKicker");
    var resultStats = document.getElementById("resultStats");

    var W = 1;
    var H = 1;
    var DPR = 1;
    var mode = "title";
    var last = 0;
    var audio = null;
    var pointer = null;
    var idSeed = 1;
    var matchDark = typeof window.matchMedia === "function" ? window.matchMedia("(prefers-color-scheme: dark)") : null;

    var G = makeGame();
    var shapeNames = ["HEX", "TRI", "KEY", "BOX", "RING", "DIAM"];

    function makeGame() {
      return {
        time: 0,
        score: 0,
        sorted: 0,
        combo: 0,
        bestCombo: 0,
        pressure: 24,
        spawnTimer: 0,
        burstTimer: 8,
        round: 52,
        packets: [],
        particles: [],
        floats: [],
        shock: 0,
        slow: 0,
        flash: 0,
        won: false,
        lastVerdict: "",
        mistakes: 0
      };
    }

    function palette() {
      var dark = matchDark ? !!matchDark.matches : false;
      return dark ? {
        bg: "#031313", ink: "#dffdf5", muted: "#8dbab2", grid: "rgba(90,255,224,0.16)",
        panel: "rgba(10,44,44,0.70)", teal: "#46efd7", mint: "#8affdf", amber: "#ffca66",
        red: "#ff6d57", dim: "rgba(223,253,245,0.14)", fog: "rgba(170,215,204,0.09)"
      } : {
        bg: "#eef7f0", ink: "#0d2525", muted: "#52736f", grid: "rgba(30,100,98,0.17)",
        panel: "rgba(255,255,255,0.58)", teal: "#008f80", mint: "#0cc7aa", amber: "#c47500",
        red: "#d13d28", dim: "rgba(13,37,37,0.13)", fog: "rgba(255,255,255,0.32)"
      };
    }

    function resize() {
      W = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 390);
      H = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 844);
      DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
      if (canvas && ctx) {
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
    }

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function rand(a, b) { return a + Math.random() * (b - a); }
    function pick(n) { return Math.floor(Math.random() * n); }
    function ease(t) { return t * t * (3 - 2 * t); }

    function resetGame() {
      G = makeGame();
      idSeed += 100;
      spawnPacket(-80);
      spawnPacket(-210);
    }

    function startGame() {
      unlockAudio();
      resetGame();
      mode = "playing";
      if (title) title.classList.remove("show");
      if (over) over.classList.remove("show");
      if (hint) {
        hint.classList.add("show");
        window.setTimeout(function () { if (hint) hint.classList.remove("show"); }, 2500);
      }
      beep(720, 0.045, "sine", 0.045);
      beep(1080, 0.08, "triangle", 0.028);
    }

    function finish(won, reason) {
      if (mode !== "playing") return;
      mode = "over";
      G.won = !!won;
      G.shock = Math.max(G.shock, won ? 5 : 14);
      if (overKicker) overKicker.textContent = won ? "trusted links sealed" : "queue overflow";
      if (overTitle) overTitle.innerHTML = won ? "CHAIN<br>SEALED" : "QUEUE<br>BREACH";
      if (resultStats) {
        resultStats.textContent =
          reason + "\n" +
          "score " + G.score + "   sorted " + G.sorted + "\n" +
          "best combo x" + G.bestCombo + "   noise " + G.mistakes;
      }
      if (over) over.classList.add("show");
      if (hint) hint.classList.remove("show");
      beep(won ? 920 : 120, 0.16, won ? "triangle" : "sawtooth", won ? 0.05 : 0.035);
      buzz(won ? 18 : [45, 30, 45]);
    }

    function spawnPacket(y) {
      var trusted = Math.random() > 0.48;
      var base = pick(shapeNames.length);
      var stamp = trusted ? base : (base + 1 + pick(shapeNames.length - 1)) % shapeNames.length;
      var broken = !trusted && Math.random() < 0.32 + clamp(G.time / 120, 0, 0.20);
      if (broken) stamp = base;
      var age = Math.random() * 9;
      G.packets.push({
        id: idSeed++,
        xShift: rand(-14, 14),
        y: typeof y === "number" ? y : -90,
        speed: rand(74, 92) + G.time * 1.18 + G.sorted * 0.42,
        trusted: trusted,
        base: base,
        stamp: stamp,
        broken: broken,
        age: age,
        rot: rand(-0.08, 0.08),
        noise: clamp(G.sorted / 36 + G.time / 120, 0, 1),
        decoy: G.sorted > 7 && Math.random() < 0.28
      });
    }

    function frontPacket() {
      var best = null;
      for (var i = 0; i < G.packets.length; i++) {
        if (!best || G.packets[i].y > best.y) best = G.packets[i];
      }
      return best;
    }

    function submit(dir) {
      if (mode !== "playing") return;
      var p = frontPacket();
      if (!p) return;
      var correct = (dir < 0 && p.trusted) || (dir > 0 && !p.trusted);
      var px = W * 0.5 + p.xShift;
      var late = clamp((p.y - H * 0.42) / (H * 0.42), 0, 1);
      removePacket(p);
      if (correct) {
        var bonus = Math.floor(late * 16);
        G.combo += 1;
        G.bestCombo = Math.max(G.bestCombo, G.combo);
        G.sorted += 1;
        G.score += 12 + bonus + Math.min(28, G.combo * 3);
        G.pressure = clamp(G.pressure - 9 - Math.min(11, G.combo), 0, 100);
        G.lastVerdict = dir < 0 ? "trusted" : "spoof";
        burst(px, p.y, dir < 0 ? 0 : 1, correct, 22 + Math.min(28, G.combo * 2));
        floatText("+" + (12 + bonus) + "  SNAP", px, p.y - 34, dir < 0 ? -1 : 1, true);
        G.flash = 0.18;
        G.slow = Math.max(G.slow, 0.055);
        beep(dir < 0 ? 880 : 520, 0.045, "square", 0.028);
        beep(1320 + G.combo * 18, 0.055, "triangle", 0.018);
        buzz(8);
        if (G.combo > 0 && G.combo % 6 === 0) {
          G.pressure = clamp(G.pressure - 24, 0, 100);
          G.slow = 0.55;
          G.score += 55;
          floatText("CHAIN SEAL +55", W * 0.5, H * 0.34, 0, true);
          ring(W * 0.5, H * 0.54, 58, palette().mint);
          beep(980, 0.14, "sine", 0.04);
        }
      } else {
        G.combo = 0;
        G.mistakes += 1;
        G.pressure = clamp(G.pressure + 31, 0, 100);
        G.shock = 16;
        G.flash = 0.32;
        burst(px, p.y, dir < 0 ? 0 : 1, false, 34);
        floatText("BAD VERDICT", px, p.y - 28, dir < 0 ? -1 : 1, false);
        beep(132, 0.13, "sawtooth", 0.035);
        buzz([28, 18, 28]);
        if (G.pressure >= 100) finish(false, "A spoof packet poisoned the queue.");
      }
    }

    function removePacket(packet) {
      for (var i = G.packets.length - 1; i >= 0; i--) {
        if (G.packets[i].id === packet.id) {
          G.packets.splice(i, 1);
          return;
        }
      }
    }

    function update(dt) {
      if (mode === "playing") {
        var step = G.slow > 0 ? dt * 0.38 : dt;
        G.time += step;
        G.spawnTimer -= step;
        G.burstTimer -= step;
        var gap = Math.max(0.48, 1.32 - G.time * 0.012 - G.sorted * 0.006);
        if (G.spawnTimer <= 0) {
          spawnPacket(-86);
          G.spawnTimer = gap * rand(0.86, 1.14);
        }
        if (G.sorted > 9 && G.burstTimer <= 0) {
          spawnPacket(-125);
          spawnPacket(-220);
          floatText("BURST LINKS", W * 0.5, H * 0.22, 0, true);
          G.burstTimer = rand(8.5, 12.5);
          beep(360, 0.08, "triangle", 0.018);
        }
        for (var i = G.packets.length - 1; i >= 0; i--) {
          var p = G.packets[i];
          p.age += step;
          p.y += p.speed * step;
          if (p.y > H - Math.max(108, H * 0.13)) {
            G.packets.splice(i, 1);
            G.pressure = clamp(G.pressure + 38, 0, 100);
            G.combo = 0;
            G.mistakes += 1;
            G.shock = 18;
            floatText("QUEUE FLOOD", W * 0.5, H - 142, 0, false);
            beep(92, 0.18, "sawtooth", 0.04);
            if (G.pressure >= 100) finish(false, "The packet queue overflowed.");
          }
        }
        G.pressure = clamp(G.pressure + step * (1.35 + G.packets.length * 0.36 + Math.max(0, G.packets.length - 5) * 1.6), 0, 100);
        if (G.pressure >= 100) finish(false, "The packet queue overflowed.");
        if (G.time >= G.round) finish(true, "Long daylight held. Every trusted link shipped.");
        G.slow = Math.max(0, G.slow - dt);
        G.flash = Math.max(0, G.flash - dt);
      }
      G.shock = Math.max(0, G.shock - dt * 28);
      updateBits(G.particles, dt);
      updateFloats(dt);
    }

    function updateBits(list, dt) {
      for (var i = list.length - 1; i >= 0; i--) {
        var b = list[i];
        b.life -= dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.vx *= Math.pow(0.08, dt);
        b.vy += b.grav * dt;
        if (b.life <= 0) list.splice(i, 1);
      }
    }

    function updateFloats(dt) {
      for (var i = G.floats.length - 1; i >= 0; i--) {
        var f = G.floats[i];
        f.life -= dt;
        f.y -= 28 * dt;
        f.x += f.drift * dt;
        if (f.life <= 0) G.floats.splice(i, 1);
      }
    }

    function burst(x, y, side, good, count) {
      var pal = palette();
      var c = good ? (side ? pal.amber : pal.mint) : pal.red;
      for (var i = 0; i < count; i++) {
        var a = rand(-Math.PI, Math.PI);
        var s = rand(70, good ? 250 : 340);
        G.particles.push({
          x: x, y: y, vx: Math.cos(a) * s + (side ? 70 : -70), vy: Math.sin(a) * s,
          life: rand(0.28, 0.75), max: 0.75, size: rand(1.5, 4.5), color: c,
          grav: good ? 80 : 160
        });
      }
    }

    function ring(x, y, radius, color) {
      for (var i = 0; i < 46; i++) {
        var a = i / 46 * Math.PI * 2;
        G.particles.push({
          x: x + Math.cos(a) * radius * 0.25,
          y: y + Math.sin(a) * radius * 0.25,
          vx: Math.cos(a) * rand(110, 250),
          vy: Math.sin(a) * rand(110, 250),
          life: rand(0.38, 0.85),
          max: 0.85,
          size: rand(1.5, 3.2),
          color: color,
          grav: 20
        });
      }
    }

    function floatText(text, x, y, dir, good) {
      G.floats.push({ text: text, x: x, y: y, drift: dir * 28, life: 0.9, max: 0.9, good: good });
    }

    function draw() {
      if (!ctx) return;
      var pal = palette();
      var sx = G.shock > 0 ? rand(-G.shock, G.shock) * 0.35 : 0;
      var sy = G.shock > 0 ? rand(-G.shock, G.shock) * 0.35 : 0;
      ctx.save();
      ctx.translate(sx, sy);
      drawBackground(pal);
      drawBins(pal);
      drawPackets(pal);
      drawParticles(pal);
      drawHud(pal);
      if (mode === "title") drawAttract(pal);
      if (G.flash > 0) {
        ctx.fillStyle = G.lastVerdict === "trusted" ? "rgba(70,239,215," + (G.flash * 0.16) + ")" : "rgba(255,202,102," + (G.flash * 0.12) + ")";
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    function drawBackground(pal) {
      ctx.fillStyle = pal.bg;
      ctx.fillRect(0, 0, W, H);
      var top = ctx.createLinearGradient(0, 0, 0, H);
      top.addColorStop(0, pal.bg);
      top.addColorStop(0.54, pal.bg);
      top.addColorStop(1, pal.panel);
      ctx.fillStyle = top;
      ctx.fillRect(0, 0, W, H);

      var horizon = H * 0.18;
      ctx.strokeStyle = pal.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var i = 0; i < 15; i++) {
        var t = i / 14;
        var y = horizon + Math.pow(t, 1.85) * H * 0.72;
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
      }
      for (var j = -8; j <= 8; j++) {
        var x = W * 0.5 + j * W * 0.075;
        ctx.moveTo(W * 0.5, horizon);
        ctx.lineTo(x, H);
      }
      ctx.stroke();

      ctx.globalAlpha = 0.9;
      for (var k = 0; k < 5; k++) {
        var fy = horizon + 18 + k * 24 + Math.sin((G.time || performance.now() / 1000) * 0.7 + k) * 5;
        ctx.fillStyle = pal.fog;
        ctx.fillRect(0, fy, W, 10 + k * 3);
      }
      ctx.globalAlpha = 1;

      ctx.strokeStyle = pal.dim;
      ctx.lineWidth = 1;
      for (var c = 0; c < 24; c++) {
        var px = (c * 79 + (G.time * 18 % 79)) % (W + 90) - 45;
        ctx.beginPath();
        ctx.moveTo(px, 0);
        ctx.lineTo(px + 12, H);
        ctx.stroke();
      }
    }

    function drawBins(pal) {
      var bh = Math.max(104, H * 0.13);
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.04)";
      ctx.fillRect(0, H - bh, W, bh);
      ctx.strokeStyle = pal.dim;
      ctx.beginPath();
      ctx.moveTo(W * 0.5, H - bh + 8);
      ctx.lineTo(W * 0.5, H - 10);
      ctx.stroke();
      drawBin(0, H - bh, W * 0.5, bh, pal, true);
      drawBin(W * 0.5, H - bh, W * 0.5, bh, pal, false);
      ctx.restore();
    }

    function drawBin(x, y, w, h, pal, trusted) {
      var color = trusted ? pal.mint : pal.amber;
      ctx.save();
      ctx.fillStyle = trusted ? "rgba(70,239,215,0.07)" : "rgba(255,202,102,0.08)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 12, y + 12, w - 24, h - 24);
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      ctx.font = "900 12px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.textAlign = "center";
      ctx.fillText(trusted ? "< SWIPE LEFT" : "SWIPE RIGHT >", x + w * 0.5, y + 34);
      ctx.font = "900 22px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.fillText(trusted ? "TRUST" : "SPOOF", x + w * 0.5, y + h * 0.62);
      ctx.restore();
    }

    function drawPackets(pal) {
      var sorted = G.packets.slice().sort(function (a, b) { return a.y - b.y; });
      var front = frontPacket();
      for (var i = 0; i < sorted.length; i++) {
        drawPacket(sorted[i], pal, front && sorted[i].id === front.id);
      }
    }

    function drawPacket(p, pal, active) {
      var noise = mode === "playing" ? p.noise : 0.2;
      var x = W * 0.5 + p.xShift + Math.sin(p.age * 4.4) * noise * 7;
      var y = p.y;
      var cw = clamp(W * 0.54, 184, 260);
      var ch = 104;
      var pulse = active ? 1 + Math.sin(performance.now() / 95) * 0.025 : 0.96;
      var alpha = clamp((y + 120) / 180, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(p.rot + Math.sin(p.age * 3) * p.noise * 0.035);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = pal.panel;
      ctx.strokeStyle = active ? (p.decoy ? pal.amber : pal.mint) : pal.dim;
      ctx.lineWidth = active ? 2.4 : 1.2;
      rounded(-cw / 2, -ch / 2, cw, ch, 18);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = p.trusted ? pal.mint : pal.red;
      ctx.globalAlpha = active ? 0.72 : 0.38;
      ctx.beginPath();
      ctx.moveTo(-cw / 2 + 18, -ch / 2 + 26);
      ctx.lineTo(cw / 2 - 18, -ch / 2 + 26);
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.fillStyle = pal.muted;
      ctx.font = "800 10px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.textAlign = "center";
      ctx.fillText("CERT", -48, -29);
      ctx.fillText("STAMP", 48, -29);
      drawShape(p.base, -48, 8, 26, pal.mint, false, false);
      drawShape(p.stamp, 48, 8, 26, p.trusted && !p.decoy ? pal.mint : (p.decoy ? pal.mint : pal.amber), true, p.broken);

      ctx.font = "900 16px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.fillStyle = p.trusted ? pal.mint : pal.red;
      ctx.fillText(p.trusted ? "==" : "!=", 0, 14);

      if (G.sorted < 5 && active) {
        ctx.font = "800 10px ui-monospace, SFMono-Regular, Menlo, monospace";
        ctx.fillStyle = pal.ink;
        ctx.globalAlpha = 0.72;
        ctx.fillText(p.trusted ? "MATCH: TRUST LEFT" : "MISMATCH: SPOOF RIGHT", 0, 42);
        ctx.globalAlpha = 1;
      }
      if (noise > 0.18) drawPacketNoise(cw, ch, pal, noise);
      ctx.restore();
    }

    function drawPacketNoise(w, h, pal, amount) {
      ctx.save();
      ctx.globalAlpha = amount * 0.30;
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = 1;
      for (var i = 0; i < amount * 10; i++) {
        var x = rand(-w * 0.42, w * 0.42);
        var y = rand(-h * 0.30, h * 0.38);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + rand(-18, 18), y + rand(-8, 8));
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawShape(kind, x, y, r, color, filled, broken) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (kind === 0) {
        polygon(6, r, -Math.PI / 6);
      } else if (kind === 1) {
        polygon(3, r * 1.05, -Math.PI / 2);
      } else if (kind === 2) {
        ctx.arc(-7, -2, r * 0.32, 0, Math.PI * 2);
        ctx.moveTo(1, -2);
        ctx.lineTo(r * 0.85, -2);
        ctx.moveTo(r * 0.52, -2);
        ctx.lineTo(r * 0.52, 10);
        ctx.moveTo(r * 0.70, -2);
        ctx.lineTo(r * 0.70, 7);
      } else if (kind === 3) {
        ctx.rect(-r * 0.75, -r * 0.75, r * 1.5, r * 1.5);
      } else if (kind === 4) {
        ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2);
        ctx.moveTo(r * 0.38, 0);
        ctx.arc(0, 0, r * 0.38, 0, Math.PI * 2);
      } else {
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.78, 0);
        ctx.lineTo(0, r);
        ctx.lineTo(-r * 0.78, 0);
        ctx.closePath();
      }
      if (filled) {
        ctx.globalAlpha = 0.18;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.stroke();
      if (broken) {
        ctx.strokeStyle = palette().red;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-r * 0.9, r * 0.78);
        ctx.lineTo(r * 0.9, -r * 0.78);
        ctx.stroke();
      }
      ctx.restore();
    }

    function polygon(sides, r, start) {
      for (var i = 0; i <= sides; i++) {
        var a = start + i / sides * Math.PI * 2;
        var x = Math.cos(a) * r;
        var y = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
    }

    function rounded(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
    }

    function drawHud(pal) {
      var top = Math.max(16, 10 + (window.visualViewport ? Math.max(0, window.visualViewport.offsetTop) : 0));
      ctx.save();
      ctx.font = "900 12px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.textAlign = "left";
      ctx.fillStyle = pal.ink;
      ctx.fillText("SCORE " + G.score, 16, top + 18);
      ctx.fillStyle = pal.muted;
      ctx.fillText("COMBO x" + G.combo, 16, top + 38);
      ctx.textAlign = "right";
      var remain = Math.max(0, Math.ceil(G.round - G.time));
      ctx.fillText(mode === "playing" ? "DAYLIGHT " + remain : "LINK SORTER", W - 16, top + 18);
      ctx.fillText("SORTED " + G.sorted, W - 16, top + 38);

      var bw = Math.min(330, W - 32);
      var bx = (W - bw) / 2;
      var by = top + 56;
      ctx.fillStyle = pal.dim;
      rounded(bx, by, bw, 10, 8);
      ctx.fill();
      ctx.fillStyle = G.pressure > 70 ? pal.red : (G.pressure > 46 ? pal.amber : pal.mint);
      rounded(bx, by, bw * clamp(G.pressure / 100, 0, 1), 10, 8);
      ctx.fill();
      ctx.fillStyle = pal.muted;
      ctx.font = "800 10px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.textAlign = "center";
      ctx.fillText("QUEUE PRESSURE", W * 0.5, by + 27);

      var gateY = H * 0.56;
      ctx.strokeStyle = pal.grid;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([8, 12]);
      ctx.beginPath();
      ctx.moveTo(24, gateY);
      ctx.lineTo(W - 24, gateY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = pal.muted;
      ctx.fillText("VERDICT WINDOW", W * 0.5, gateY - 12);
      ctx.restore();
    }

    function drawParticles(pal) {
      for (var i = 0; i < G.particles.length; i++) {
        var b = G.particles[i];
        var a = clamp(b.life / b.max, 0, 1);
        ctx.globalAlpha = a;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - b.size / 2, b.y - b.size / 2, b.size, b.size);
      }
      ctx.globalAlpha = 1;
      ctx.font = "900 13px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.textAlign = "center";
      for (var j = 0; j < G.floats.length; j++) {
        var f = G.floats[j];
        ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
        ctx.fillStyle = f.good ? pal.mint : pal.red;
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
    }

    function drawAttract(pal) {
      ctx.save();
      var y = H * 0.54 + Math.sin(performance.now() / 520) * 7;
      var fake = { y: y, xShift: 0, age: performance.now() / 1000, rot: 0, noise: 0.18, trusted: true, base: 0, stamp: 0, broken: false, decoy: false };
      drawPacket(fake, pal, true);
      ctx.restore();
    }

    function unlockAudio() {
      if (audio) return;
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audio = new Ctx();
      } catch (e) {
        audio = null;
      }
    }

    function beep(freq, dur, type, gain) {
      if (!audio) return;
      try {
        if (audio.state === "suspended" && audio.resume) audio.resume();
        var now = audio.currentTime;
        var osc = audio.createOscillator();
        var g = audio.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain || 0.03), now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(g);
        g.connect(audio.destination);
        osc.start(now);
        osc.stop(now + dur + 0.03);
      } catch (e) {}
    }

    function buzz(pattern) {
      try {
        if (navigator && typeof navigator.vibrate === "function") navigator.vibrate(pattern);
      } catch (e) {}
    }

    function onPointerDown(e) {
      if (e && e.cancelable) e.preventDefault();
      pointer = { x: e.clientX || 0, y: e.clientY || 0, t: performance.now() };
      try {
        if (canvas && canvas.setPointerCapture && e.pointerId !== undefined) canvas.setPointerCapture(e.pointerId);
      } catch (err) {}
    }

    function onPointerUp(e) {
      if (e && e.cancelable) e.preventDefault();
      if (!pointer) return;
      var x = e.clientX || pointer.x;
      var y = e.clientY || pointer.y;
      var dx = x - pointer.x;
      var dy = y - pointer.y;
      pointer = null;
      if (mode !== "playing") return;
      if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy) * 0.65) {
        submit(dx < 0 ? -1 : 1);
      } else if (y > H * 0.28) {
        submit(x < W * 0.5 ? -1 : 1);
      }
    }

    function onPointerMove(e) {
      if (e && e.cancelable) e.preventDefault();
    }

    function onKey(e) {
      var key = e.key || "";
      if (key === "ArrowLeft" || key === "a" || key === "A") {
        if (e.preventDefault) e.preventDefault();
        submit(-1);
      } else if (key === "ArrowRight" || key === "d" || key === "D") {
        if (e.preventDefault) e.preventDefault();
        submit(1);
      } else if (key === " " || key === "Enter") {
        if (e.preventDefault) e.preventDefault();
        if (mode === "title") startGame();
        else if (mode === "over") startGame();
      }
    }

    function frame(t) {
      try {
        var dt = Math.min(0.033, Math.max(0.001, (t - last) / 1000 || 0.016));
        last = t;
        update(dt);
        draw();
      } catch (e) {
        mode = "over";
        if (over) over.classList.add("show");
      }
      window.requestAnimationFrame(frame);
    }

    if (startBtn) startBtn.addEventListener("click", function (e) { if (e) e.stopPropagation(); startGame(); });
    if (restartBtn) restartBtn.addEventListener("click", function (e) { if (e) e.stopPropagation(); startGame(); });
    if (canvas) {
      canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
      canvas.addEventListener("pointermove", onPointerMove, { passive: false });
      canvas.addEventListener("pointerup", onPointerUp, { passive: false });
      canvas.addEventListener("pointercancel", function () { pointer = null; }, { passive: false });
      canvas.addEventListener("touchstart", function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
      canvas.addEventListener("touchmove", function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
      canvas.addEventListener("touchend", function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
    }
    window.addEventListener("keydown", onKey);
    window.addEventListener("resize", resize);
    if (matchDark && matchDark.addEventListener) matchDark.addEventListener("change", draw);

    resize();
    draw();
    window.requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
