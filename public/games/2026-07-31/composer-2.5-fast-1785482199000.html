<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thermal Gate</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  :root {
    --bg: #0a0e0c;
    --fg: #8fd4a8;
    --fg-dim: #4a7a5a;
    --accent: #ff6b3d;
    --accent2: #3dcfff;
    --panel: rgba(10, 20, 14, 0.92);
    --border: rgba(143, 212, 168, 0.25);
    --scan: rgba(143, 212, 168, 0.03);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e8ece9;
      --fg: #1a3d2a;
      --fg-dim: #5a8a6a;
      --accent: #d44a1a;
      --accent2: #0077aa;
      --panel: rgba(232, 236, 233, 0.94);
      --border: rgba(26, 61, 42, 0.2);
      --scan: rgba(26, 61, 42, 0.04);
    }
  }
  body { background: var(--bg); color: var(--fg); }
  #wrap {
    position: fixed;
    inset: 0;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    z-index: 2;
  }
  #hud span { opacity: 0.85; }
  #hud .val { color: var(--accent2); font-weight: 600; }
  #game-area {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.35s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(8px);
  }
  .panel h1 {
    font-size: 18px;
    letter-spacing: 0.12em;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .panel .sub {
    font-size: 10px;
    color: var(--fg-dim);
    letter-spacing: 0.06em;
    margin-bottom: 18px;
    line-height: 1.6;
  }
  .panel p.hint {
    font-size: 10px;
    color: var(--fg-dim);
    line-height: 1.7;
    margin-bottom: 20px;
    text-align: left;
  }
  .panel p.hint em { color: var(--accent); font-style: normal; }
  .panel p.hint strong { color: var(--accent2); font-weight: 600; }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 160px;
    padding: 12px 28px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: 1px solid var(--fg);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  button[data-smoke]:active { transform: scale(0.97); }
  @media (prefers-color-scheme: dark) {
    button[data-smoke]:hover { background: var(--fg); color: var(--bg); }
  }
  @media (prefers-color-scheme: light) {
    button[data-smoke]:hover { background: var(--fg); color: var(--bg); }
  }
  .final-score {
    font-size: 28px;
    color: var(--accent2);
    margin: 8px 0 4px;
    font-weight: 700;
  }
  .combo-flash {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px;
    color: var(--accent);
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    letter-spacing: 0.1em;
  }
  .combo-flash.show {
    animation: comboPop 0.6s ease forwards;
  }
  @keyframes comboPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    30% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>score <span class="val" id="score">0</span></span>
    <span>wave <span class="val" id="wave">1</span></span>
    <span>lives <span class="val" id="lives">3</span></span>
    <span>time <span class="val" id="timer">45</span></span>
  </div>
  <div id="game-area">
    <canvas id="c"></canvas>
    <div class="combo-flash" id="comboFlash"></div>
    <div class="overlay" id="titleOverlay">
      <div class="panel">
        <h1>THERMAL GATE</h1>
        <div class="sub">clear summer night · bay perimeter scan</div>
        <p class="hint">
          Drag <em>hot decoys</em> into the glowing honeypot traps.<br>
          Let <strong>cool visitors</strong> slip through the center gap untouched.<br>
          Trap the fakes. Don't snare the real ones.
        </p>
        <button type="button" data-smoke="start" id="btnStart">Initialize Scan</button>
      </div>
    </div>
    <div class="overlay hidden" id="gameOverOverlay">
      <div class="panel">
        <h1>SCAN HALTED</h1>
        <div class="sub">perimeter breach logged</div>
        <div class="final-score" id="finalScore">0</div>
        <div class="sub" id="finalStats"></div>
        <p class="hint" style="text-align:center;margin-bottom:16px;" id="finalMsg"></p>
        <button type="button" data-smoke="restart" id="btnRestart">Reboot Scan</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var waveEl = document.getElementById('wave');
  var livesEl = document.getElementById('lives');
  var timerEl = document.getElementById('timer');
  var titleOverlay = document.getElementById('titleOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var finalScoreEl = document.getElementById('finalScore');
  var finalStatsEl = document.getElementById('finalStats');
  var finalMsgEl = document.getElementById('finalMsg');
  var comboFlashEl = document.getElementById('comboFlash');
  var btnStart = document.getElementById('btnStart');
  var btnRestart = document.getElementById('btnRestart');

  var W = 0, H = 0, hudH = 0;
  var state = 'title';
  var score = 0, lives = 3, wave = 1, combo = 0, maxCombo = 0;
  var timeLeft = 45;
  var visitors = [];
  var particles = [];
  var honeypots = [];
  var spawnTimer = 0;
  var spawnInterval = 1.8;
  var waveTimer = 0;
  var drag = null;
  var shake = 0;
  var flashAlpha = 0;
  var scanOffset = 0;
  var lastTs = 0;
  var trapped = 0;
  var breaches = 0;
  var falsePos = 0;
  var audioCtx = null;
  var isDark = true;

  function checkTheme() {
    try {
      isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { isDark = true; }
  }
  checkTheme();
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', checkTheme);
    } catch (e) { /* ignore */ }
  }

  function resize() {
    var area = document.getElementById('game-area');
    if (!area || !canvas) return;
    var rect = area.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildHoneypots();
  }

  function buildHoneypots() {
    honeypots = [
      { x: W * 0.12, y: H * 0.82, r: Math.min(W, H) * 0.11, shape: 0, pulse: 0 },
      { x: W * 0.88, y: H * 0.82, r: Math.min(W, H) * 0.11, shape: 1, pulse: Math.PI }
    ];
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* ignore */ }
  }

  function playSnap() {
    playTone(880, 0.08, 'square', 0.06);
    setTimeout(function () { playTone(1320, 0.06, 'sine', 0.05); }, 40);
  }

  function playBreach() {
    playTone(120, 0.25, 'sawtooth', 0.07);
  }

  function playPass() {
    playTone(520, 0.05, 'sine', 0.03);
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ }
  }

  function resetGame() {
    score = 0; lives = 3; wave = 1; combo = 0; maxCombo = 0;
    timeLeft = 45; visitors = []; particles = [];
    spawnTimer = 0; spawnInterval = 1.8; waveTimer = 0;
    drag = null; shake = 0; flashAlpha = 0;
    trapped = 0; breaches = 0; falsePos = 0;
    buildHoneypots();
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = String(score);
    waveEl.textContent = String(wave);
    livesEl.textContent = String(lives);
    timerEl.textContent = String(Math.ceil(Math.max(0, timeLeft)));
  }

  function showComboText(text) {
    comboFlashEl.textContent = text;
    comboFlashEl.classList.remove('show');
    void comboFlashEl.offsetWidth;
    comboFlashEl.classList.add('show');
  }

  function spawnVisitor() {
    var lanes = [0.22, 0.38, 0.54, 0.68];
    var lane = lanes[Math.floor(Math.random() * lanes.length)];
    var isDecoy = Math.random() < (0.55 + wave * 0.03);
    var baseSpeed = 55 + wave * 12 + Math.random() * 20;
    visitors.push({
      x: -30,
      y: H * lane,
      vx: baseSpeed,
      isDecoy: isDecoy,
      r: Math.min(W, H) * 0.035,
      wobble: Math.random() * Math.PI * 2,
      heat: isDecoy ? 0.85 + Math.random() * 0.15 : 0.25 + Math.random() * 0.2,
      dragging: false,
      snapAnim: 0,
      trapped: false
    });
  }

  function addParticles(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.4 + Math.random() * 0.4,
        maxLife: 0.6,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function pointInHoneypot(px, py, hp) {
    var dx = px - hp.x;
    var dy = py - hp.y;
    var shape = hp.shape % 3;
    if (shape === 0) {
      return dx * dx + dy * dy <= hp.r * hp.r;
    } else if (shape === 1) {
      return Math.abs(dx) <= hp.r * 1.1 && Math.abs(dy) <= hp.r * 0.75;
    } else {
      var ang = Math.atan2(dy, dx);
      var triR = hp.r * (0.7 + 0.3 * Math.cos(ang * 3));
      return dx * dx + dy * dy <= triR * triR;
    }
  }

  function drawHoneypot(hp, t) {
    var pulse = 0.7 + 0.3 * Math.sin(t * 3 + hp.pulse);
    var shape = hp.shape % 3;
    ctx.save();
    ctx.translate(hp.x, hp.y);

    var grd = ctx.createRadialGradient(0, 0, 0, 0, 0, hp.r * 1.4);
    if (isDark) {
      grd.addColorStop(0, 'rgba(255, 100, 40, ' + (0.35 * pulse) + ')');
      grd.addColorStop(0.5, 'rgba(255, 60, 20, ' + (0.15 * pulse) + ')');
      grd.addColorStop(1, 'rgba(255, 40, 10, 0)');
    } else {
      grd.addColorStop(0, 'rgba(200, 60, 20, ' + (0.3 * pulse) + ')');
      grd.addColorStop(1, 'rgba(200, 40, 10, 0)');
    }
    ctx.fillStyle = grd;
    ctx.beginPath();
    if (shape === 0) {
      ctx.arc(0, 0, hp.r * 1.3, 0, Math.PI * 2);
    } else if (shape === 1) {
      var rw = hp.r * 2.4, rh = hp.r * 1.7;
      if (ctx.roundRect) {
        ctx.roundRect(-hp.r * 1.2, -hp.r * 0.85, rw, rh, 8);
      } else {
        ctx.rect(-hp.r * 1.2, -hp.r * 0.85, rw, rh);
      }
    } else {
      for (var i = 0; i < 3; i++) {
        var a = -Math.PI / 2 + i * Math.PI * 2 / 3;
        var px = Math.cos(a) * hp.r * 1.2;
        var py = Math.sin(a) * hp.r * 1.2;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }
    ctx.fill();

    ctx.strokeStyle = isDark ? 'rgba(255, 120, 50, ' + (0.6 * pulse) + ')' : 'rgba(180, 50, 15, ' + (0.7 * pulse) + ')';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.lineDashOffset = -t * 30;
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.font = '9px ui-monospace, Menlo, monospace';
    ctx.fillStyle = isDark ? 'rgba(255,140,60,0.7)' : 'rgba(160,40,10,0.8)';
    ctx.textAlign = 'center';
    ctx.fillText('HONEYPOT', 0, hp.r * 0.2);
    ctx.restore();
  }

  function drawSilhouette(v, t) {
    if (v.snapAnim > 0) return;
    var bob = Math.sin(t * 4 + v.wobble) * 3;
    var x = v.x;
    var y = v.y + bob;
    var h = v.r * 2.8;
    var heat = v.heat + (v.isDecoy ? 0.1 * Math.sin(t * 8 + v.wobble) : 0);

    ctx.save();
    ctx.translate(x, y);

    var bodyGrd = ctx.createLinearGradient(0, -h, 0, h * 0.3);
    if (v.isDecoy) {
      if (isDark) {
        bodyGrd.addColorStop(0, 'rgba(255, 200, 80, ' + heat + ')');
        bodyGrd.addColorStop(0.5, 'rgba(255, 80, 30, ' + (heat * 0.8) + ')');
        bodyGrd.addColorStop(1, 'rgba(180, 20, 10, 0.6)');
      } else {
        bodyGrd.addColorStop(0, 'rgba(200, 80, 20, ' + heat + ')');
        bodyGrd.addColorStop(1, 'rgba(120, 30, 10, 0.7)');
      }
    } else {
      if (isDark) {
        bodyGrd.addColorStop(0, 'rgba(80, 220, 255, ' + (heat + 0.3) + ')');
        bodyGrd.addColorStop(0.5, 'rgba(40, 160, 200, ' + (heat + 0.2) + ')');
        bodyGrd.addColorStop(1, 'rgba(10, 60, 100, 0.5)');
      } else {
        bodyGrd.addColorStop(0, 'rgba(0, 120, 160, ' + (heat + 0.4) + ')');
        bodyGrd.addColorStop(1, 'rgba(0, 60, 90, 0.6)');
      }
    }

    ctx.fillStyle = bodyGrd;
    ctx.beginPath();
    ctx.ellipse(0, -h * 0.55, v.r * 0.55, v.r * 0.65, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-v.r * 0.7, -h * 0.15);
    ctx.lineTo(-v.r * 0.55, h * 0.35);
    ctx.lineTo(v.r * 0.55, h * 0.35);
    ctx.lineTo(v.r * 0.7, -h * 0.15);
    ctx.closePath();
    ctx.fill();

    if (v.isDecoy) {
      ctx.strokeStyle = isDark ? 'rgba(255, 60, 20, 0.8)' : 'rgba(180, 40, 10, 0.9)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(-v.r * 0.9, -h * 0.75, v.r * 1.8, h * 1.1);
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  function drawGapZone() {
    var gx = W * 0.38;
    var gw = W * 0.24;
    var gy = H * 0.12;
    var gh = H * 0.72;
    ctx.save();
    ctx.strokeStyle = isDark ? 'rgba(61, 207, 255, 0.15)' : 'rgba(0, 100, 140, 0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([8, 8]);
    ctx.strokeRect(gx, gy, gw, gh);
    ctx.setLineDash([]);
    ctx.font = '9px ui-monospace, Menlo, monospace';
    ctx.fillStyle = isDark ? 'rgba(61, 207, 255, 0.35)' : 'rgba(0, 100, 140, 0.45)';
    ctx.textAlign = 'center';
    ctx.fillText('CLEARANCE GAP', gx + gw / 2, gy - 6);
    ctx.restore();
  }

  function drawBackground(t) {
    ctx.fillStyle = isDark ? '#0a0e0c' : '#e8ece9';
    ctx.fillRect(0, 0, W, H);

    scanOffset = (scanOffset + 0.6) % 4;
    ctx.fillStyle = isDark ? 'rgba(143, 212, 168, 0.025)' : 'rgba(26, 61, 42, 0.035)';
    for (var sy = scanOffset; sy < H; sy += 4) {
      ctx.fillRect(0, sy, W, 1);
    }

    ctx.strokeStyle = isDark ? 'rgba(143, 212, 168, 0.06)' : 'rgba(26, 61, 42, 0.08)';
    ctx.lineWidth = 1;
    for (var i = 1; i < 4; i++) {
      var ly = H * (0.18 + i * 0.16);
      ctx.beginPath();
      ctx.moveTo(0, ly);
      ctx.lineTo(W, ly);
      ctx.stroke();
    }

    drawGapZone();
    honeypots.forEach(function (hp) { drawHoneypot(hp, t); });

    ctx.font = '10px ui-monospace, Menlo, monospace';
    ctx.fillStyle = isDark ? 'rgba(143, 212, 168, 0.2)' : 'rgba(26, 61, 42, 0.25)';
    ctx.textAlign = 'left';
    ctx.fillText('REC ● ' + formatTime(t), 10, H - 10);
    ctx.textAlign = 'right';
    ctx.fillText('CAM-07 BAY N', W - 10, H - 10);
  }

  function formatTime(t) {
    var s = Math.floor(t % 60);
    return '04:' + (s < 10 ? '0' : '') + s;
  }

  function drawParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 80 * dt;
      var a = p.life / p.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function trapVisitor(v, hp) {
    v.trapped = true;
    v.snapAnim = 0.35;
    v.x = hp.x;
    v.y = hp.y;
    trapped++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    var pts = 100 + combo * 25;
    score += pts;
    playSnap();
    vibrate(25);
    var col = isDark ? '#ff8040' : '#d44a1a';
    addParticles(hp.x, hp.y, col, 16);
    if (combo >= 3) showComboText('SNAP x' + combo + ' +' + pts);
    updateHUD();
  }

  function breach(msg) {
    lives--;
    combo = 0;
    breaches++;
    shake = 8;
    flashAlpha = 0.4;
    playBreach();
    vibrate(80);
    updateHUD();
    if (lives <= 0) endGame();
  }

  function falsePositive() {
    lives--;
    combo = 0;
    falsePos++;
    shake = 10;
    flashAlpha = 0.5;
    playBreach();
    vibrate(100);
    updateHUD();
    if (lives <= 0) endGame();
  }

  function genuinePass(v) {
    combo = 0;
    score += 25;
    playPass();
    addParticles(v.x, v.y, isDark ? '#3dcfff' : '#0077aa', 6);
    updateHUD();
  }

  function endGame() {
    state = 'gameover';
    gameOverOverlay.classList.remove('hidden');
    finalScoreEl.textContent = String(score);
    finalStatsEl.textContent = 'trapped ' + trapped + ' · breaches ' + breaches + ' · false +' + falsePos + ' · max combo ' + maxCombo;
    if (score >= 1500) finalMsgEl.textContent = 'Elite perimeter operator.';
    else if (score >= 800) finalMsgEl.textContent = 'Solid misdirection. The decoys never saw it coming.';
    else finalMsgEl.textContent = 'The honeypots hunger for more fakes.';
  }

  function advanceWave() {
    wave++;
    spawnInterval = Math.max(0.7, spawnInterval - 0.15);
    honeypots.forEach(function (hp) {
      hp.shape = (hp.shape + 1) % 3;
      hp.r = Math.min(W, H) * (0.1 + (wave % 3) * 0.008);
    });
    showComboText('WAVE ' + wave);
    updateHUD();
  }

  function update(dt, t) {
    if (state !== 'playing') return;

    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      updateHUD();
      endGame();
      return;
    }

    waveTimer += dt;
    if (waveTimer >= 12) {
      waveTimer = 0;
      advanceWave();
    }

    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnVisitor();
    }

    for (var i = visitors.length - 1; i >= 0; i--) {
      var v = visitors[i];
      if (v.trapped) {
        v.snapAnim -= dt;
        if (v.snapAnim <= 0) {
          visitors.splice(i, 1);
        }
        continue;
      }
      if (!v.dragging) {
        v.x += v.vx * dt;
      }

      if (v.x > W + 40) {
        if (v.isDecoy) {
          breach('decoy escaped');
        } else {
          var inGap = v.x > W * 0.35 && v.x < W * 0.65;
          if (inGap) genuinePass(v);
          else score += 10;
        }
        visitors.splice(i, 1);
        updateHUD();
      }
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 30);
    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 1.5);
  }

  function render(t) {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawBackground(t);
    visitors.forEach(function (v) { drawSilhouette(v, t); });
    drawParticles(0.016);

    if (flashAlpha > 0) {
      ctx.fillStyle = isDark ? 'rgba(255, 40, 20, ' + flashAlpha + ')' : 'rgba(200, 40, 10, ' + flashAlpha * 0.5 + ')';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt, ts / 1000);
    render(ts / 1000);
    requestAnimationFrame(loop);
  }

  function getPointer(e) {
    var rect = canvas.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX;
      cy = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length) {
      cx = e.changedTouches[0].clientX;
      cy = e.changedTouches[0].clientY;
    } else {
      cx = e.clientX;
      cy = e.clientY;
    }
    return { x: cx - rect.left, y: cy - rect.top };
  }

  function findVisitorAt(x, y) {
    for (var i = visitors.length - 1; i >= 0; i--) {
      var v = visitors[i];
      if (v.trapped || v.snapAnim > 0) continue;
      var dx = x - v.x;
      var dy = y - v.y;
      if (dx * dx + dy * dy <= (v.r * 2.5) * (v.r * 2.5)) return v;
    }
    return null;
  }

  function onPointerDown(e) {
    if (state !== 'playing') return;
    e.preventDefault();
    var p = getPointer(e);
    var v = findVisitorAt(p.x, p.y);
    if (v) {
      drag = { visitor: v, offsetX: p.x - v.x, offsetY: p.y - v.y };
      v.dragging = true;
    }
  }

  function onPointerMove(e) {
    if (!drag) return;
    e.preventDefault();
    var p = getPointer(e);
    drag.visitor.x = p.x - drag.offsetX;
    drag.visitor.y = p.y - drag.offsetY;
    drag.visitor.x = Math.max(20, Math.min(W - 20, drag.visitor.x));
    drag.visitor.y = Math.max(H * 0.12, Math.min(H * 0.92, drag.visitor.y));
  }

  function onPointerUp(e) {
    if (!drag) return;
    e.preventDefault();
    var v = drag.visitor;
    v.dragging = false;
    var caught = false;
    for (var i = 0; i < honeypots.length; i++) {
      if (pointInHoneypot(v.x, v.y, honeypots[i])) {
        if (v.isDecoy) {
          trapVisitor(v, honeypots[i]);
        } else {
          falsePositive();
          visitors.splice(visitors.indexOf(v), 1);
        }
        caught = true;
        break;
      }
    }
    drag = null;
  }

  function startGame() {
    initAudio();
    resetGame();
    state = 'playing';
    titleOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    spawnVisitor();
    spawnTimer = spawnInterval * 0.5;
    updateHUD();
  }

  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('mouseleave', onPointerUp);
  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('touchmove', onPointerMove, { passive: false });
  canvas.addEventListener('touchend', onPointerUp, { passive: false });
  canvas.addEventListener('touchcancel', onPointerUp, { passive: false });

  btnStart.addEventListener('click', function (e) {
    e.stopPropagation();
    startGame();
  });
  btnRestart.addEventListener('click', function (e) {
    e.stopPropagation();
    startGame();
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      if (state === 'title') { e.preventDefault(); startGame(); }
      else if (state === 'gameover') { e.preventDefault(); startGame(); }
      return;
    }
    if (state !== 'playing' || !drag) return;
    var step = 12;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      e.preventDefault();
      drag.visitor.x -= step;
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      e.preventDefault();
      drag.visitor.x += step;
    }
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      drag.visitor.y -= step;
    }
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      e.preventDefault();
      drag.visitor.y += step;
    }
    drag.visitor.x = Math.max(20, Math.min(W - 20, drag.visitor.x));
    drag.visitor.y = Math.max(H * 0.12, Math.min(H * 0.92, drag.visitor.y));
  });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
