<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark Matter Sweep</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1628;--bg2:#0d1f38;--phosphor:#39ff14;--phosphor-dim:#1a8f0a;
  --phosphor-glow:rgba(57,255,20,.35);--text:#b8e6b0;--muted:#5a8a52;
  --danger:#ff4444;--panel:rgba(10,22,40,.88);--border:rgba(57,255,20,.25);
  --overlay-bg:rgba(6,14,28,.82);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8f0f8;--bg2:#d4e4f4;--phosphor:#0a7a2e;--phosphor-dim:#065a20;
    --phosphor-glow:rgba(10,122,46,.2);--text:#1a3a28;--muted:#4a7a5a;
    --danger:#c02020;--panel:rgba(232,240,248,.92);--border:rgba(10,122,46,.2);
    --overlay-bg:rgba(220,232,244,.88);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;color:var(--text);touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#game{flex:1;width:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:2}
.hud-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud-val{color:var(--phosphor);font-size:13px;font-weight:600;text-shadow:0 0 8px var(--phosphor-glow)}
#spectrogram-wrap{margin-top:4px;height:28px;background:var(--bg2);border:1px solid var(--border);border-radius:2px;overflow:hidden;display:flex;gap:1px;padding:2px}
.spec-stripe{flex:1;background:var(--bg);border-radius:1px;position:relative;overflow:hidden;transition:background .3s}
.spec-stripe.filled{background:var(--phosphor-dim)}
.spec-stripe.filled::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 2px,var(--phosphor) 2px,var(--phosphor) 3px);opacity:.6;animation:specScroll 1.2s linear infinite}
@keyframes specScroll{from{transform:translateX(0)}to{transform:translateX(-6px)}}
#noise-bar{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;margin-top:2px}
#noise-fill{height:100%;width:0;background:var(--danger);transition:width .15s;border-radius:2px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--overlay-bg);z-index:10;pointer-events:none;transition:opacity .4s}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-title{font-size:clamp(18px,5vw,28px);color:var(--phosphor);text-shadow:0 0 20px var(--phosphor-glow);letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:1.4;padding:0 24px}
.overlay-sub{font-size:12px;color:var(--muted);text-align:center;max-width:320px;line-height:1.6;padding:0 20px}
.overlay-score{font-size:14px;color:var(--text);margin-top:-8px}
.btn{pointer-events:auto;min-width:180px;min-height:48px;padding:14px 28px;font-family:inherit;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--bg);background:var(--phosphor);border:1px solid var(--phosphor);border-radius:2px;cursor:pointer;box-shadow:0 0 24px var(--phosphor-glow);transition:transform .1s,box-shadow .1s}
.btn:active{transform:scale(.96)}
@media(prefers-color-scheme:light){.btn{color:#fff}}
#toast{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);font-size:11px;letter-spacing:.06em;color:var(--phosphor);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:5;text-shadow:0 0 10px var(--phosphor-glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-row"><span>Signal</span><span class="hud-val" id="score-val">0 / 8</span></div>
    <div class="hud-row"><span>Time</span><span class="hud-val" id="time-val">55</span></div>
    <div id="spectrogram-wrap"></div>
    <div id="noise-bar"><div id="noise-fill"></div></div>
  </div>
  <div id="toast"></div>
  <div id="overlay-title" class="overlay">
    <div class="overlay-title">Dark Matter Sweep</div>
    <div class="overlay-sub">Drag to aim your backyard detector at faint blips. Release to sample before porch lights and passing cars flood the sensor.</div>
    <button class="btn" data-smoke="start" id="btn-start">Begin Survey</button>
  </div>
  <div id="overlay-gameover" class="overlay hidden">
    <div class="overlay-title" id="go-title">Signal Lost</div>
    <div class="overlay-score" id="go-score"></div>
    <div class="overlay-sub" id="go-msg"></div>
    <button class="btn" data-smoke="restart" id="btn-restart">Scan Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var STRIPES = 8;
var ROUND_TIME = 55;
var CAPTURE_RADIUS = 42;
var MAX_NOISE = 100;

var canvas = document.getElementById('game');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var specWrap = document.getElementById('spectrogram-wrap');
var scoreVal = document.getElementById('score-val');
var timeVal = document.getElementById('time-val');
var noiseFill = document.getElementById('noise-fill');
var toastEl = document.getElementById('toast');
var overlayTitle = document.getElementById('overlay-title');
var overlayGO = document.getElementById('overlay-gameover');
var goTitle = document.getElementById('go-title');
var goScore = document.getElementById('go-score');
var goMsg = document.getElementById('go-msg');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 300, H = 400;
var state = 'title';
var score = 0;
var timeLeft = ROUND_TIME;
var noise = 0;
var level = 1;
var lastTs = 0;
var timerAcc = 0;
var toastTimer = 0;

var stars = [];
var blips = [];
var particles = [];
var drag = { active: false, sx: 0, sy: 0, ex: 0, ey: 0, charge: 0 };
var aimX = 0, aimY = 0;
var shake = 0;
var flashAlpha = 0;
var hitPause = 0;
var scanLineY = 0;
var audioCtx = null;

function initSpectrogram() {
  if (!specWrap) return;
  specWrap.innerHTML = '';
  for (var i = 0; i < STRIPES; i++) {
    var d = document.createElement('div');
    d.className = 'spec-stripe';
    d.dataset.idx = i;
    specWrap.appendChild(d);
  }
}

function fillStripe(idx) {
  if (!specWrap) return;
  var el = specWrap.children[idx];
  if (el) el.classList.add('filled');
}

function resetSpectrogram() {
  if (!specWrap) return;
  for (var i = 0; i < specWrap.children.length; i++) {
    specWrap.children[i].classList.remove('filled');
  }
}

function getColors() {
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (dark !== false && !window.matchMedia('(prefers-color-scheme: light)').matches) {
    return { bg: '#0a1628', bg2: '#0d1f38', phosphor: '#39ff14', phosphorDim: '#1a8f0a', glow: 'rgba(57,255,20,0.35)', danger: '#ff4444', noise: '#ffaa00', text: '#b8e6b0' };
  }
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    return { bg: '#e8f0f8', bg2: '#d4e4f4', phosphor: '#0a7a2e', phosphorDim: '#065a20', glow: 'rgba(10,122,46,0.25)', danger: '#c02020', noise: '#cc7700', text: '#1a3a28' };
  }
  return { bg: '#0a1628', bg2: '#0d1f38', phosphor: '#39ff14', phosphorDim: '#1a8f0a', glow: 'rgba(57,255,20,0.35)', danger: '#ff4444', noise: '#ffaa00', text: '#b8e6b0' };
}

function resize() {
  if (!canvas) return;
  W = window.innerWidth || 300;
  H = (window.innerHeight || 400) - 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  aimX = W * 0.5;
  aimY = H * 0.45;
  if (stars.length === 0) initStars();
}

function initStars() {
  stars = [];
  for (var i = 0; i < 120; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + 0.3, tw: Math.random() * Math.PI * 2, sp: 0.5 + Math.random() * 2 });
  }
}

function ensureAudio() {
  try {
    if (!audioCtx && typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if (!audioCtx && typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* ignore */ }
}

function playTone(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* ignore */ }
}

function vibrate(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ }
}

function showToast(msg) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = 1.5;
}

function spawnBlip(type) {
  var margin = 50;
  var x = margin + Math.random() * (W - margin * 2);
  var y = margin + Math.random() * (H - margin * 2 - 80);
  var life = type === 'signal' ? 4 + Math.random() * 3 : 2 + Math.random() * 2;
  blips.push({
    type: type,
    x: x, y: y,
    vx: (Math.random() - 0.5) * (type === 'signal' ? 8 : 30 + level * 8),
    vy: (Math.random() - 0.5) * (type === 'signal' ? 8 : 20 + level * 6),
    life: life,
    maxLife: life,
    pulse: Math.random() * Math.PI * 2,
    size: type === 'signal' ? 6 + Math.random() * 4 : 10 + Math.random() * 8,
    captured: false
  });
}

function spawnWave() {
  var signalCount = Math.max(1, 2 - Math.floor(level / 4));
  for (var i = 0; i < signalCount; i++) spawnBlip('signal');
  var noiseCount = Math.min(1 + Math.floor(level * 0.8), 6);
  for (var j = 0; j < noiseCount; j++) {
    spawnBlip(Math.random() > 0.5 ? 'noise_car' : 'noise_porch');
  }
}

function spawnParticles(x, y, col, n) {
  for (var i = 0; i < (n || 12); i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 120;
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.4, col: col });
  }
}

function dist(x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  return Math.sqrt(dx * dx + dy * dy);
}

function attemptSample() {
  if (state !== 'playing') return;
  var hitSignal = null;
  var hitNoise = null;
  var bestD = CAPTURE_RADIUS;

  for (var i = 0; i < blips.length; i++) {
    var b = blips[i];
    if (b.captured) continue;
    var d = dist(aimX, aimY, b.x, b.y);
    if (d < bestD) {
      bestD = d;
      hitSignal = b.type === 'signal' ? b : null;
      hitNoise = b.type !== 'signal' ? b : null;
    }
  }

  if (hitSignal && !hitNoise) {
    hitSignal.captured = true;
    score++;
    fillStripe(score - 1);
    spawnParticles(hitSignal.x, hitSignal.y, getColors().phosphor, 16);
    flashAlpha = 0.25;
    hitPause = 0.12;
    playTone(440 + score * 40, 0.15, 'sine', 0.1);
    vibrate(30);
    showToast('SIGNAL LOCKED — stripe ' + score + '/' + STRIPES);
    level++;
    blips = blips.filter(function(b) { return b.captured; });
    if (score >= STRIPES) endGame(true);
    else setTimeout(function() { if (state === 'playing') { blips = []; spawnWave(); } }, 700);
  } else if (hitNoise) {
    hitNoise.captured = true;
    noise += 22 + level * 2;
    shake = 8;
    spawnParticles(hitNoise.x, hitNoise.y, getColors().danger, 10);
    playTone(120, 0.25, 'sawtooth', 0.06);
    vibrate(80);
    showToast('FALSE POSITIVE — streetlight noise');
    if (noise >= MAX_NOISE) endGame(false);
  } else {
    noise += 8;
    playTone(200, 0.08, 'square', 0.04);
    showToast('EMPTY SAMPLE — aim tighter');
    if (noise >= MAX_NOISE) endGame(false);
  }
  updateHUD();
}

function updateHUD() {
  if (scoreVal) scoreVal.textContent = score + ' / ' + STRIPES;
  if (timeVal) timeVal.textContent = Math.ceil(timeLeft);
  if (noiseFill) noiseFill.style.width = Math.min(100, noise) + '%';
}

function startGame() {
  state = 'playing';
  score = 0;
  timeLeft = ROUND_TIME;
  noise = 0;
  level = 1;
  blips = [];
  particles = [];
  drag.active = false;
  drag.charge = 0;
  shake = 0;
  flashAlpha = 0;
  hitPause = 0;
  timerAcc = 0;
  resetSpectrogram();
  updateHUD();
  if (overlayTitle) overlayTitle.classList.add('hidden');
  if (overlayGO) overlayGO.classList.add('hidden');
  ensureAudio();
  spawnWave();
  showToast('Drag to aim · release to sample');
}

function endGame(won) {
  state = won ? 'win' : 'gameover';
  if (overlayGO) overlayGO.classList.remove('hidden');
  if (goTitle) goTitle.textContent = won ? 'Readout Complete' : 'Sensor Flooded';
  if (goScore) goScore.textContent = 'Captures: ' + score + ' / ' + STRIPES;
  if (goMsg) {
    goMsg.textContent = won
      ? 'The backyard array caught a faint dark-matter whisper. A bold read on a quiet July morning.'
      : 'Porch lights and passing cars drowned the signal. The fog offshore keeps its secrets.';
  }
  if (won) {
    playTone(523, 0.2, 'sine', 0.1);
    setTimeout(function() { playTone(659, 0.2, 'sine', 0.1); }, 150);
    setTimeout(function() { playTone(784, 0.3, 'sine', 0.1); }, 300);
    vibrate([30, 50, 30]);
  }
}

function pointerPos(e) {
  var rect = canvas.getBoundingClientRect();
  var cx, cy;
  if (e.touches && e.touches.length) {
    cx = e.touches[0].clientX - rect.left;
    cy = e.touches[0].clientY - rect.top;
  } else {
    cx = e.clientX - rect.left;
    cy = e.clientY - rect.top;
  }
  return { x: cx, y: cy };
}

function onPointerDown(e) {
  if (state !== 'playing') return;
  e.preventDefault();
  var p = pointerPos(e);
  drag.active = true;
  drag.sx = p.x;
  drag.sy = p.y;
  drag.ex = p.x;
  drag.ey = p.y;
  drag.charge = 0;
  ensureAudio();
}

function onPointerMove(e) {
  if (state !== 'playing') return;
  e.preventDefault();
  var p = pointerPos(e);
  if (drag.active) {
    drag.ex = p.x;
    drag.ey = p.y;
    aimX = p.x;
    aimY = p.y;
    drag.charge = Math.min(1, drag.charge + 0.02);
  }
}

function onPointerUp(e) {
  if (state !== 'playing') return;
  e.preventDefault();
  if (drag.active) {
    var p = pointerPos(e);
    aimX = p.x;
    aimY = p.y;
    drag.active = false;
    drag.charge = 0;
    attemptSample();
  }
}

var keys = {};
function onKeyDown(e) {
  keys[e.code] = true;
  if (state === 'playing' && (e.code === 'Space' || e.code === 'Enter')) {
    e.preventDefault();
    attemptSample();
  }
}
function onKeyUp(e) { keys[e.code] = false; }

function updateKeyboard(dt) {
  if (state !== 'playing') return;
  var spd = 200 * dt;
  if (keys['ArrowLeft'] || keys['KeyA']) aimX -= spd;
  if (keys['ArrowRight'] || keys['KeyD']) aimX += spd;
  if (keys['ArrowUp'] || keys['KeyW']) aimY -= spd;
  if (keys['ArrowDown'] || keys['KeyS']) aimY += spd;
  aimX = Math.max(20, Math.min(W - 20, aimX));
  aimY = Math.max(60, Math.min(H - 40, aimY));
}

function update(dt) {
  if (hitPause > 0) {
    hitPause -= dt;
    return;
  }

  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0 && toastEl) toastEl.classList.remove('show');
  }

  scanLineY += dt * 80;
  if (scanLineY > H) scanLineY = 0;

  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  if (state === 'playing') {
    timerAcc += dt;
    if (timerAcc >= 1) {
      timerAcc -= 1;
      timeLeft -= 1;
      noise += 0.5 + level * 0.15;
      updateHUD();
      if (timeLeft <= 0) endGame(score >= STRIPES);
      if (noise >= MAX_NOISE) endGame(false);
    }

    updateKeyboard(dt);

    for (var i = blips.length - 1; i >= 0; i--) {
      var b = blips[i];
      b.life -= dt;
      b.pulse += dt * (b.type === 'signal' ? 3 : 8);
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < 30 || b.x > W - 30) b.vx *= -1;
      if (b.y < 50 || b.y > H - 50) b.vy *= -1;
      if (b.life <= 0 && !b.captured) {
        if (b.type === 'signal') {
          noise += 12;
          showToast('Signal faded — sample faster');
          if (noise >= MAX_NOISE) endGame(false);
          updateHUD();
        }
        blips.splice(i, 1);
      }
    }

    if (blips.filter(function(b) { return b.type === 'signal' && !b.captured; }).length === 0 && score < STRIPES && state === 'playing') {
      blips = blips.filter(function(b) { return b.captured; });
      spawnWave();
    }
  }

  for (var j = particles.length - 1; j >= 0; j--) {
    var p = particles[j];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95;
    p.vy *= 0.95;
    if (p.life <= 0) particles.splice(j, 1);
  }

  if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 2);
}

function drawOscilloscopeWave(x, y, w, h, phase, col) {
  ctx.beginPath();
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.5;
  for (var i = 0; i <= w; i += 2) {
    var t = i / w;
    var v = Math.sin(t * 12 + phase) * 0.3 + Math.sin(t * 23 + phase * 1.7) * 0.15 + Math.sin(t * 5 + phase * 0.5) * 0.2;
    var py = y + h * 0.5 + v * h * 0.4;
    if (i === 0) ctx.moveTo(x + i, py);
    else ctx.lineTo(x + i, py);
  }
  ctx.stroke();
}

function render() {
  if (!ctx) return;
  var c = getColors();
  var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  var sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;

  ctx.save();
  ctx.translate(sx, sy);

  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, W, H);

  /* subtle grid */
  ctx.strokeStyle = c.phosphorDim;
  ctx.globalAlpha = 0.08;
  ctx.lineWidth = 1;
  for (var gx = 0; gx < W; gx += 40) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  for (var gy = 0; gy < H; gy += 40) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* stars */
  var t = performance.now() * 0.001;
  for (var si = 0; si < stars.length; si++) {
    var s = stars[si];
    var tw = 0.4 + 0.6 * Math.abs(Math.sin(t * s.sp + s.tw));
    ctx.globalAlpha = tw * 0.7;
    ctx.fillStyle = c.text;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* fog band at bottom — SF offshore fog */
  var fogGrad = ctx.createLinearGradient(0, H * 0.75, 0, H);
  fogGrad.addColorStop(0, 'rgba(100,130,160,0)');
  fogGrad.addColorStop(1, 'rgba(100,130,160,0.12)');
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, H * 0.75, W, H * 0.25);

  /* blips */
  for (var bi = 0; bi < blips.length; bi++) {
    var b = blips[bi];
    if (b.captured) continue;
    var alpha = Math.min(1, b.life / b.maxLife);
    var pulse = 0.6 + 0.4 * Math.sin(b.pulse);

    if (b.type === 'signal') {
      ctx.globalAlpha = alpha * pulse * 0.9;
      ctx.strokeStyle = c.phosphor;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = c.glow;
      ctx.shadowBlur = 12;
      var rs = b.size * pulse;
      ctx.beginPath();
      ctx.arc(b.x, b.y, rs, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(b.x - rs * 1.5, b.y);
      ctx.lineTo(b.x + rs * 1.5, b.y);
      ctx.moveTo(b.x, b.y - rs * 1.5);
      ctx.lineTo(b.x, b.y + rs * 1.5);
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (b.type === 'noise_car') {
      ctx.globalAlpha = alpha * 0.85;
      ctx.fillStyle = c.noise;
      ctx.shadowColor = 'rgba(255,170,0,0.4)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, b.size * 1.4 * pulse, b.size * 0.6, t * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.globalAlpha = alpha * (0.5 + 0.5 * Math.sin(b.pulse * 2));
      ctx.fillStyle = c.noise;
      ctx.shadowColor = 'rgba(255,100,50,0.3)';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.globalAlpha = 1;

  /* drag aim line */
  if (state === 'playing' && drag.active) {
    ctx.strokeStyle = c.phosphor;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(drag.sx, drag.sy);
    ctx.lineTo(drag.ex, drag.ey);
    ctx.stroke();
    ctx.setLineDash([]);

    var chargeH = 24;
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = c.bg2;
    ctx.fillRect(drag.ex - 30, drag.ey - chargeH - 10, 60, chargeH);
    ctx.strokeStyle = c.phosphor;
    ctx.strokeRect(drag.ex - 30, drag.ey - chargeH - 10, 60, chargeH);
    drawOscilloscopeWave(drag.ex - 28, drag.ey - chargeH - 8, 56, chargeH, t * 8, c.phosphor);
    ctx.globalAlpha = 1;
  }

  /* reticle at aim */
  if (state === 'playing') {
    ctx.strokeStyle = c.phosphor;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(aimX, aimY, CAPTURE_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(aimX, aimY, 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(aimX - 10, aimY); ctx.lineTo(aimX - 4, aimY);
    ctx.moveTo(aimX + 4, aimY); ctx.lineTo(aimX + 10, aimY);
    ctx.moveTo(aimX, aimY - 10); ctx.lineTo(aimX, aimY - 4);
    ctx.moveTo(aimX, aimY + 4); ctx.lineTo(aimX, aimY + 10);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* particles */
  for (var pi = 0; pi < particles.length; pi++) {
    var pt = particles[pi];
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.col;
    ctx.fillRect(pt.x - 1.5, pt.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  /* CRT scanline */
  ctx.globalAlpha = 0.04;
  ctx.fillStyle = c.phosphor;
  ctx.fillRect(0, scanLineY, W, 2);
  ctx.globalAlpha = 0.03;
  for (var sl = 0; sl < H; sl += 3) {
    ctx.fillRect(0, sl, W, 1);
  }
  ctx.globalAlpha = 1;

  /* vignette */
  var vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  if (flashAlpha > 0) {
    ctx.fillStyle = c.phosphor;
    ctx.globalAlpha = flashAlpha;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function setupEvents() {
  if (btnStart) btnStart.addEventListener('click', function(e) { e.stopPropagation(); startGame(); });
  if (btnRestart) btnRestart.addEventListener('click', function(e) { e.stopPropagation(); startGame(); });

  if (canvas) {
    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', function(e) { if (drag.active) onPointerUp(e); });
    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    canvas.addEventListener('touchend', onPointerUp, { passive: false });
    canvas.addEventListener('touchcancel', onPointerUp, { passive: false });
  }

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('resize', resize);
}

initSpectrogram();
resize();
setupEvents();
updateHUD();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
