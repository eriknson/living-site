<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawn Cargo</title>
<style>
  :root { 
    --text: #fff; 
    --btn-bg: #fff; 
    --btn-text: #111; 
    --bg-base: #000;
  }
  @media (prefers-color-scheme: dark) {
    :root { 
      --text: #fff; 
      --btn-bg: #fff; 
      --btn-text: #111; 
      --bg-base: #000;
    }
  }
  @media (prefers-color-scheme: light) {
    :root { 
      --text: #111; 
      --btn-bg: #111; 
      --btn-text: #fff; 
      --bg-base: #fff;
    }
  }
  
  body, html { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    overflow: hidden; 
    background: var(--bg-base); 
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; 
    touch-action: none; 
    user-select: none;
    -webkit-user-select: none;
  }
  
  #gameCanvas { 
    display: block; 
    width: 100dvw; 
    height: 100dvh; 
  }
  
  #ui-layer { 
    position: absolute; 
    top: 0; left: 0; 
    width: 100%; height: 100%; 
    pointer-events: none; 
    z-index: 10; 
    color: var(--text); 
  }
  
  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  
  h1 { font-size: 2.5rem; letter-spacing: 2px; margin-bottom: 0.5rem; text-transform: uppercase; }
  h2 { font-size: 2rem; margin-bottom: 0.5rem; text-transform: uppercase; }
  p { font-size: 0.95rem; opacity: 0.8; margin-bottom: 2rem; line-height: 1.5; max-width: 400px; }
  
  button { 
    pointer-events: auto; 
    background: var(--btn-bg); 
    color: var(--btn-text); 
    border: none; 
    padding: 1.2rem 2.5rem; 
    font-size: 1.1rem; 
    font-family: inherit; 
    font-weight: bold; 
    border-radius: 40px; 
    cursor: pointer; 
    text-transform: uppercase; 
    letter-spacing: 2px; 
    transition: transform 0.1s; 
    box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
  }
  button:active { transform: scale(0.95); }
  
  #screen-game {
    justify-content: flex-start;
    padding-top: env(safe-area-inset-top, 20px);
    display: none;
  }
  
  #top-hud { 
    display: flex; 
    justify-content: space-between; 
    width: 100%; 
    max-width: 600px;
    font-size: 1.2rem; 
    font-weight: bold; 
    align-items: center;
  }
  
  #wind-ui {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    opacity: 0.7;
    margin-top: 15px;
  }
  
  #wind-bar-container {
    width: 120px;
    height: 4px;
    background: rgba(127,127,127,0.4);
    border-radius: 2px;
    position: relative;
  }
  
  #wind-bar {
    position: absolute;
    height: 100%;
    background: var(--text);
    border-radius: 2px;
    top: 0;
    left: 50%;
    width: 0%;
    transition: width 0.1s, left 0.1s;
  }
  
  #center-hud { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    pointer-events: none;
  }
  
  #combo-text { 
    font-size: 2.5rem; 
    font-style: italic; 
    opacity: 0; 
    transition: opacity 0.2s, transform 0.1s; 
    transform: scale(0.8); 
    font-weight: 900;
    letter-spacing: -1px;
  }
  #combo-text.active { 
    opacity: 1; 
    transform: scale(1); 
  }
  
  .time-low { color: #ff4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  
  #screen-menu > *, #screen-gameover > * { pointer-events: none; }
  #screen-menu button, #screen-gameover button { pointer-events: auto; }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="ui-layer">
    <div id="screen-menu" class="screen">
      <h1>DAWN CARGO</h1>
      <p>Hold to lock angle & charge power.<br>Release to launch capsules into orbit.<br>Beware wind drift.</p>
      <button data-smoke="start">Begin Launch</button>
    </div>
    
    <div id="screen-game" class="screen">
      <div id="top-hud">
        <div id="hud-score">0</div>
        <div id="hud-time">60.0s</div>
      </div>
      <div id="wind-ui">
        <span>WIND DRIFT</span>
        <div id="wind-bar-container">
          <div id="wind-bar"></div>
        </div>
      </div>
      <div id="center-hud">
        <div id="combo-text">COMBO x2</div>
      </div>
    </div>
    
    <div id="screen-gameover" class="screen" style="display: none;">
      <h2>DAWN HAS BROKEN</h2>
      <p style="font-size: 1.2rem; margin-bottom: 2rem;">Final Score<br><span id="final-score" style="font-weight:900; font-size: 3rem;">0</span></p>
      <button data-smoke="restart">New Launch</button>
    </div>
  </div>

<script>
// --- Global Setup ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let W, H, dpr;
function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// --- Audio Engine ---
const audio = {
    ctx: null,
    init() {
        if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
        }
    },
    play(freq, type, duration, vol, slideFreq) {
        if (!this.ctx) return;
        try {
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, t + duration);
            
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + duration);
            
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            osc.start();
            osc.stop(t + duration);
        } catch(e) {}
    }
};

function vibrate(pattern) {
    if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
    }
}

// --- Game State ---
const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
let state = STATE.MENU;

let timeRemaining = 60;
let score = 0, displayScore = 0, combo = 0, wave = 1;

let isCharging = false;
let chargeStartTime = 0;
let lockedAngle = 0;
let currentSweepAngle = 0;

let wind = 0, targetWind = 0, windTimer = 0;

let particles = [], windParticles = [], capsules = [], slots = [], floatingTexts = [], trails = [];
let arcParams = { cx: 0, cy: 0, time: 0, speed: 0, ampX: 0, ampY: 0 };
let hitPause = 0, screenShake = 0;
let lastTime = 0;

// --- Colors ---
const palettes = {
    dark: {
        start: { top: [8, 11, 16], bot: [20, 28, 36] },
        end:   { top: [28, 42, 53], bot: [229, 107, 36] },
        sun: '#FFF2C8', text: '#FFFFFF', trail: '#E56B24'
    },
    light: {
        start: { top: [180, 190, 200], bot: [220, 225, 230] },
        end:   { top: [120, 170, 220], bot: [255, 220, 150] },
        sun: '#FFDD66', text: '#111111', trail: '#E56B24'
    }
};

function getTheme() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? palettes.light : palettes.dark;
}

function lerpColor(c1, c2, t) {
    const r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
    const g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
    const b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
    return `rgb(${r},${g},${b})`;
}

// --- Logic ---
function initGame() {
    timeRemaining = 60;
    score = 0; displayScore = 0; combo = 0; wave = 1;
    particles = []; capsules = []; trails = []; floatingTexts = [];
    
    windParticles = [];
    for(let i=0; i<50; i++) {
        windParticles.push({ x: Math.random() * W, y: Math.random() * H, speed: Math.random() * 0.5 + 0.5 });
    }
    
    startWave();
}

function startWave() {
    slots = [];
    const numSlots = Math.min(3 + Math.floor(wave / 2), 6);
    const A = Math.min(W, H * 0.8);
    const spacing = A * 0.15;
    const totalWidth = (numSlots - 1) * spacing;
    
    for(let i=0; i<numSlots; i++) {
        slots.push({ relX: -totalWidth/2 + i * spacing, relY: 0, filled: false, scale: 0 });
    }
    
    arcParams = {
        cx: W/2, cy: H * 0.2, time: 0,
        speed: wave * 0.001 + 0.001,
        ampX: A * 0.35, ampY: H * 0.03
    };
    targetWind = (Math.random() * 2 - 1) * 0.00015 * Math.min(wave/5, 1);
}

function handlePointerDown(e) {
    if(state !== STATE.PLAYING) return;
    if(e.target.tagName && e.target.tagName.toLowerCase() === 'button') return;
    if(e.cancelable) e.preventDefault();
    
    isCharging = true;
    chargeStartTime = performance.now();
    lockedAngle = currentSweepAngle;
}

function handlePointerUp(e) {
    if(state !== STATE.PLAYING) return;
    if(!isCharging) return;
    if(e.cancelable) e.preventDefault();
    
    isCharging = false;
    const charge = Math.abs(Math.sin((performance.now() - chargeStartTime) * 0.0025));
    const speed = H * 0.033 * charge;
    
    capsules.push({
        x: W / 2, y: H - 40,
        vx: Math.sin(lockedAngle) * speed,
        vy: -Math.cos(lockedAngle) * speed,
        lastX: W / 2, lastY: H - 40, age: 0
    });
    
    audio.play(150, 'triangle', 0.2, 0.1, 300);
    vibrate(15);
}

window.addEventListener('pointerdown', handlePointerDown, { passive: false });
window.addEventListener('pointerup', handlePointerUp, { passive: false });

function handleKeyDown(e) {
    if (e.code !== 'Space' && e.key !== ' ') return;
    if (e.repeat) return;
    e.preventDefault();
    handlePointerDown(e);
}

function handleKeyUp(e) {
    if (e.code !== 'Space' && e.key !== ' ') return;
    e.preventDefault();
    handlePointerUp(e);
}

document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

function update(dt) {
    if (hitPause > 0) { hitPause--; return; }
    if (screenShake > 0) screenShake--;
    
    const theme = getTheme();
    const isLight = theme === palettes.light;
    const A = Math.min(W, H * 0.8);
    const slotRadius = A * 0.05;
    const grav = H * 0.0005;
    
    if (state === STATE.PLAYING) {
        timeRemaining -= dt / 1000;
        if (timeRemaining <= 0) {
            timeRemaining = 0;
            gameOver();
        }
    }
    
    windTimer -= dt;
    if (windTimer <= 0) {
        windTimer = 3000;
        targetWind = (Math.random() * 2 - 1) * 0.00015 * Math.min(wave/5, 1);
    }
    wind += (targetWind - wind) * 0.02;
    
    windParticles.forEach(p => {
        p.x += wind * p.speed * 50000;
        if (p.x > W) p.x -= W;
        if (p.x < 0) p.x += W;
    });

    if (!isCharging) {
        currentSweepAngle = Math.sin(performance.now() * 0.002) * (Math.PI / 4);
    }
    
    arcParams.time += dt;
    arcParams.cx = W/2 + Math.sin(arcParams.time * arcParams.speed) * arcParams.ampX;
    arcParams.cy = H * 0.2 + Math.cos(arcParams.time * arcParams.speed * 1.3) * arcParams.ampY;
    
    for(let i = capsules.length - 1; i >= 0; i--) {
        let cap = capsules[i];
        cap.lastX = cap.x; cap.lastY = cap.y;
        cap.vx += wind * H;
        cap.vy += grav;
        cap.x += cap.vx; cap.y += cap.vy;
        cap.age++;
        
        if (cap.age % 2 === 0) trails.push({ x: cap.x, y: cap.y, age: 0, maxAge: 20 });
        
        let hit = false;
        if (Math.abs(cap.vy) < H * 0.015) {
            for(let s of slots) {
                if(s.filled) continue;
                let sx = arcParams.cx + s.relX;
                let sy = arcParams.cy + s.relY;
                
                for(let step=1; step<=3; step++) {
                    let cx = cap.lastX + (cap.x - cap.lastX) * (step/3);
                    let cy = cap.lastY + (cap.y - cap.lastY) * (step/3);
                    let dist = Math.hypot(sx - cx, sy - cy);
                    if (dist < slotRadius) {
                        hitSlot(s, sx, sy, dist < slotRadius * 0.3);
                        hit = true; break;
                    }
                }
                if(hit) break;
            }
        }
        
        if (hit) {
            capsules.splice(i, 1);
            continue;
        }
        
        if (cap.y > H + 50) {
            combo = 0; updateComboUI();
            capsules.splice(i, 1);
        }
    }
    
    for(let i = trails.length - 1; i >= 0; i--) {
        trails[i].age++;
        if(trails[i].age > trails[i].maxAge) trails.splice(i, 1);
    }
    
    for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.vx *= 0.92; p.vy *= 0.92;
        p.vy += grav * 0.5;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        if(p.age > p.maxAge) particles.splice(i, 1);
    }
    
    for(let i = floatingTexts.length - 1; i >= 0; i--) {
        let t = floatingTexts[i];
        t.y -= 0.8; t.age++;
        if(t.age > 60) floatingTexts.splice(i, 1);
    }
    
    if (state === STATE.PLAYING && slots.length > 0 && slots.every(s => s.filled)) {
        waveCleared();
    }
    
    if (displayScore < score) {
        displayScore += Math.max(1, Math.floor((score - displayScore) * 0.15));
    }
}

function hitSlot(s, sx, sy, isPerfect) {
    s.filled = true;
    combo++;
    let points = 100 * combo;
    if (isPerfect) points *= 2;
    score += points;
    
    hitPause = 3;
    screenShake = 6;
    
    for(let i=0; i<25; i++) {
        const ang = Math.random() * Math.PI * 2;
        const speed = Math.random() * W * 0.01 + 2;
        particles.push({
            x: sx, y: sy,
            vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
            age: 0, maxAge: 20 + Math.random() * 30
        });
    }
    
    floatingTexts.push({ text: isPerfect ? `PERFECT +${points}` : `+${points}`, x: sx, y: sy - 20, age: 0 });
    updateComboUI();
    audio.play(440 + Math.min(combo * 60, 1200), 'sine', 0.4, 0.3);
    vibrate([40, 40, 40]);
}

function waveCleared() {
    score += 1000 * wave;
    timeRemaining = Math.min(60, timeRemaining + 10);
    floatingTexts.push({ text: "WAVE CLEARED +10s", x: W/2, y: H*0.4, age: -20 });
    
    audio.play(600, 'square', 0.1, 0.1, 800);
    setTimeout(() => { audio.play(800, 'square', 0.2, 0.1, 1200); }, 100);
    
    wave++;
    slots = [];
    setTimeout(startWave, 1200);
}

function draw() {
    const theme = getTheme();
    const isLight = theme === palettes.light;
    const t = state === STATE.MENU ? 1 : Math.max(0, timeRemaining / 60);
    
    const colorTop = lerpColor(theme.end.top, theme.start.top, t);
    const colorBot = lerpColor(theme.end.bot, theme.start.bot, t);
    
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, colorTop);
    grad.addColorStop(1, colorBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    ctx.save();
    if (screenShake > 0) {
        ctx.translate((Math.random()-0.5)*12, (Math.random()-0.5)*12);
    }
    
    const sunRadius = Math.min(W, H) * 0.2;
    const sunY = H + sunRadius - ((1 - t) * H * 0.85);
    ctx.beginPath();
    ctx.arc(W/2, sunY, sunRadius, 0, Math.PI*2);
    ctx.fillStyle = theme.sun;
    ctx.shadowColor = theme.sun;
    ctx.shadowBlur = 60;
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = `rgba(${isLight ? '0,0,0' : '255,255,255'}, 0.15)`;
    windParticles.forEach(p => {
        ctx.fillRect(p.x, p.y, Math.abs(wind) * 100000 * p.speed + 4, 1);
    });
    
    const A = Math.min(W, H * 0.8);
    const slotRadius = A * 0.05;
    
    slots.forEach(s => {
        const sx = arcParams.cx + s.relX;
        const sy = arcParams.cy + s.relY;
        s.scale += (1 - s.scale) * 0.15;
        const r = slotRadius * s.scale;
        
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI*2);
        if (s.filled) {
            ctx.fillStyle = theme.text;
            ctx.fill();
        } else {
            ctx.strokeStyle = `rgba(${isLight ? '0,0,0' : '255,255,255'}, 0.4)`;
            ctx.lineWidth = 3;
            ctx.stroke();
        }
    });
    
    ctx.globalCompositeOperation = isLight ? 'multiply' : 'screen';
    trails.forEach(tr => {
        const op = 1 - (tr.age / tr.maxAge);
        ctx.fillStyle = theme.trail;
        ctx.globalAlpha = op;
        ctx.beginPath();
        ctx.arc(tr.x, tr.y, A * 0.015, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    
    ctx.fillStyle = theme.text;
    particles.forEach(p => {
        const op = 1 - (p.age / p.maxAge);
        ctx.globalAlpha = op;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    ctx.fillStyle = theme.text;
    capsules.forEach(cap => {
        ctx.beginPath();
        ctx.arc(cap.x, cap.y, A * 0.015, 0, Math.PI*2);
        ctx.fill();
    });
    
    const lx = W / 2;
    const ly = H - 40;
    
    ctx.beginPath();
    ctx.arc(lx, ly, 24, Math.PI, 0);
    ctx.fillStyle = theme.text;
    ctx.fill();
    
    const angle = isCharging ? lockedAngle : currentSweepAngle;
    const barrelLength = 50;
    const bx = lx + Math.sin(angle) * barrelLength;
    const by = ly - Math.cos(angle) * barrelLength;
    
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(bx, by);
    ctx.strokeStyle = theme.text;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.stroke();
    
    if (isCharging) {
        const charge = Math.abs(Math.sin((performance.now() - chargeStartTime) * 0.0025));
        const speed = H * 0.033 * charge;
        
        ctx.beginPath();
        let px = lx, py = ly;
        let pvx = Math.sin(angle) * speed;
        let pvy = -Math.cos(angle) * speed;
        const grav = H * 0.0005;
        
        ctx.moveTo(px, py);
        for(let i=0; i<45; i++) {
            pvx += wind * H;
            pvy += grav;
            px += pvx;
            py += pvy;
            if (i % 2 === 0) ctx.lineTo(px, py);
        }
        ctx.strokeStyle = `rgba(${isLight ? '0,0,0' : '255,255,255'}, 0.4)`;
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 8]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    
    ctx.font = 'bold 18px ui-monospace, monospace';
    ctx.textAlign = 'center';
    floatingTexts.forEach(t => {
        if (t.age < 0) return;
        const op = 1 - (t.age / 60);
        ctx.fillStyle = `rgba(${isLight ? '0,0,0' : '255,255,255'}, ${op})`;
        ctx.fillText(t.text, t.x, t.y);
    });
    
    ctx.restore();
}

function updateUI() {
    if (state === STATE.PLAYING) {
        document.getElementById('hud-score').innerText = displayScore;
        const timeEl = document.getElementById('hud-time');
        timeEl.innerText = `T-MINUS ${timeRemaining.toFixed(1)}s`;
        if (timeRemaining < 10) timeEl.classList.add('time-low');
        else timeEl.classList.remove('time-low');
        
        const windBar = document.getElementById('wind-bar');
        const maxW = 0.00015;
        let wPct = wind / maxW;
        wPct = Math.max(-1, Math.min(1, wPct));
        
        if (wPct < 0) {
            windBar.style.left = `${50 + wPct * 50}%`;
            windBar.style.width = `${-wPct * 50}%`;
        } else {
            windBar.style.left = `50%`;
            windBar.style.width = `${wPct * 50}%`;
        }
    }
}

function updateComboUI() {
    const el = document.getElementById('combo-text');
    if (combo > 1) {
        el.innerText = `COMBO x${combo}`;
        el.classList.add('active');
        el.style.transform = 'scale(1.3)';
        setTimeout(() => el.style.transform = 'scale(1)', 80);
    } else {
        el.classList.remove('active');
    }
}

function gameOver() {
    state = STATE.GAMEOVER;
    document.getElementById('screen-game').style.display = 'none';
    document.getElementById('screen-gameover').style.display = 'flex';
    document.getElementById('final-score').innerText = score;
    audio.play(200, 'sawtooth', 1, 0.2, 50);
}

document.querySelector('[data-smoke="start"]').addEventListener('click', (e) => {
    document.getElementById('screen-menu').style.display = 'none';
    document.getElementById('screen-game').style.display = 'flex';
    audio.init();
    initGame();
    state = STATE.PLAYING;
});

document.querySelector('[data-smoke="restart"]').addEventListener('click', (e) => {
    document.getElementById('screen-gameover').style.display = 'none';
    document.getElementById('screen-game').style.display = 'flex';
    initGame();
    state = STATE.PLAYING;
});

// --- Main Loop ---
function loop(timestamp) {
    requestAnimationFrame(loop);
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    if (dt > 100) return;
    
    update(dt);
    draw();
    updateUI();
}
requestAnimationFrame((t) => { lastTime = t; loop(t); });

</script>
</body>
</html>
