<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karl's Gap</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a2838;--water:#243848;--fog:rgba(180,190,200,.55);
  --warm:#e8a040;--warm-glow:rgba(232,160,64,.45);--text:#c8d4dc;--muted:#7a8a96;
  --panel:rgba(20,32,44,.88);--border:rgba(140,160,175,.25);--overlay:rgba(14,24,34,.84);
  --btn-bg:#d4882a;--btn-text:#1a1208;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a2838;--water:#243848;--warm:#e8a040;--warm-glow:rgba(232,160,64,.45);
    --text:#c8d4dc;--muted:#7a8a96;--panel:rgba(20,32,44,.88);--overlay:rgba(14,24,34,.84);
    --btn-bg:#d4882a;--btn-text:#1a1208;
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#b8c8d4;--water:#8aa4b4;--fog:rgba(220,228,235,.65);
    --warm:#c87818;--warm-glow:rgba(200,120,24,.35);--text:#1a2830;--muted:#4a5a68;
    --panel:rgba(240,246,250,.92);--border:rgba(80,100,120,.2);--overlay:rgba(200,214,224,.88);
    --btn-bg:#c87818;--btn-text:#fff;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;color:var(--text);touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#game{flex:1;width:100%;display:block;touch-action:none;cursor:pointer}
#hud{position:absolute;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 6px;display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:2}
.hud-row{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud-val{color:var(--warm);font-size:12px;font-weight:600}
.bar-wrap{height:5px;background:var(--panel);border:1px solid var(--border);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--warm),#f0c060);border-radius:2px;transition:width .12s}
.combo{font-size:10px;color:var(--muted);text-align:center;letter-spacing:.08em;min-height:14px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--overlay);z-index:10;pointer-events:none;transition:opacity .35s,visibility .35s}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-title{font-size:clamp(20px,6vw,32px);color:var(--warm);letter-spacing:.14em;text-transform:uppercase;text-align:center;line-height:1.35;padding:0 22px;text-shadow:0 0 24px var(--warm-glow)}
.overlay-sub{font-size:11px;color:var(--muted);text-align:center;max-width:300px;line-height:1.65;padding:0 18px}
.overlay-score{font-size:13px;color:var(--text)}
.btn{pointer-events:auto;min-width:190px;min-height:48px;padding:14px 26px;font-family:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--btn-text);background:var(--btn-bg);border:none;border-radius:3px;cursor:pointer;box-shadow:0 4px 20px var(--warm-glow);transition:transform .1s}
.btn:active{transform:scale(.96)}
#hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.08em;color:var(--muted);pointer-events:none;z-index:3;opacity:.7;transition:opacity .4s}
#hint.hide{opacity:0}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-row"><span>Warmth</span><span class="hud-val" id="warmth-val">100</span></div>
    <div class="bar-wrap"><div class="bar-fill" id="warmth-bar"></div></div>
    <div class="hud-row"><span>Gaps</span><span class="hud-val" id="gap-val">0</span><span>Time</span><span class="hud-val" id="time-val">50</span></div>
    <div class="combo" id="combo-val"></div>
  </div>
  <div id="hint">Hold to rise · Release to sink</div>
  <div id="overlay-title" class="overlay">
    <div class="overlay-title">Karl's Gap</div>
    <div class="overlay-sub">Pilot your buoy through the marine layer. Hold to rise toward sunlit warmth — release before the fog swallows you.</div>
    <button class="btn" data-smoke="start" id="btn-start">Cast Off</button>
  </div>
  <div id="overlay-gameover" class="overlay hidden">
    <div class="overlay-title" id="go-title">Swallowed</div>
    <div class="overlay-score" id="go-score"></div>
    <div class="overlay-sub" id="go-msg"></div>
    <button class="btn" data-smoke="restart" id="btn-restart">Dive Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var ROUND_TIME = 50;
var BUOY_X_RATIO = 0.28;
var GRAVITY = 520;
var LIFT = 780;
var MAX_VY = 340;
var SCROLL_BASE = 90;
var WARMTH_MAX = 100;
var WARMTH_DRAIN = 0.35;
var FOG_DRAIN = 28;
var ORB_WARMTH = 22;
var ORB_SCORE = 1;

var canvas = document.getElementById('game');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var warmthVal = document.getElementById('warmth-val');
var warmthBar = document.getElementById('warmth-bar');
var gapVal = document.getElementById('gap-val');
var timeVal = document.getElementById('time-val');
var comboVal = document.getElementById('combo-val');
var hintEl = document.getElementById('hint');
var overlayTitle = document.getElementById('overlay-title');
var overlayGO = document.getElementById('overlay-gameover');
var goTitle = document.getElementById('go-title');
var goScore = document.getElementById('go-score');
var goMsg = document.getElementById('go-msg');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 360, H = 640;
var state = 'title';
var holding = false;
var warmth = WARMTH_MAX;
var gaps = 0;
var combo = 0;
var comboTimer = 0;
var timeLeft = ROUND_TIME;
var scrollX = 0;
var scrollSpeed = SCROLL_BASE;
var difficulty = 0;
var buoy = { y: 0, vy: 0, r: 14, bob: 0 };
var segments = [];
var orbs = [];
var particles = [];
var ripples = [];
var fogOverlay = 0;
var shake = 0;
var hitPause = 0;
var flash = 0;
var lastTs = 0;
var timerAcc = 0;
var audioCtx = null;
var nextSegX = 0;
var segId = 0;

function isLight() {
  try {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  } catch (e) { return false; }
}

function palette() {
  var light = isLight();
  if (light) {
    return {
      sky: ['#9ab0c0', '#b0c4d0', '#c8d8e0'],
      water: ['#6a8898', '#7a98a8', '#8aa8b8'],
      fog: ['rgba(210,220,228,0.75)', 'rgba(195,208,218,0.82)', 'rgba(180,195,208,0.88)'],
      fogDense: 'rgba(160,175,190,0.92)',
      buoy: '#c87818', buoyLight: '#f0a840', buoyDark: '#8a5010',
      orb: '#e89028', orbCore: '#ffe8a0', rope: '#5a6878', text: '#1a2830'
    };
  }
  return {
    sky: ['#1a2838', '#243040', '#2e3a48'],
    water: ['#1e3040', '#243848', '#2a4050'],
    fog: ['rgba(140,155,170,0.55)', 'rgba(120,135,150,0.65)', 'rgba(100,115,130,0.75)'],
    fogDense: 'rgba(80,95,110,0.88)',
    buoy: '#d4882a', buoyLight: '#f0b050', buoyDark: '#8a5818',
    orb: '#e8a040', orbCore: '#ffe090', rope: '#607080', text: '#c8d4dc'
  };
}

function resize() {
  if (!canvas) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function ensureAudio() {
  if (audioCtx || typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
  try {
    var AC = typeof AudioContext !== 'undefined' ? AudioContext : webkitAudioContext;
    audioCtx = new AC();
  } catch (e) { audioCtx = null; }
}

function playTone(freq, dur, vol, type) {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function vibrate(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

function rand(a, b) { return a + Math.random() * (b - a); }

function makeSegment(x) {
  var t = difficulty;
  var gapH = Math.max(72, 130 - t * 18);
  var gapY = rand(H * 0.18, H * 0.72 - gapH);
  var fogW = rand(180, 280) + t * 20;
  var density = Math.min(0.92, 0.55 + t * 0.06);
  return {
    id: segId++,
    x: x,
    w: fogW,
    gapY: gapY,
    gapH: gapH,
    density: density,
    wobble: rand(0, Math.PI * 2),
    hasOrb: Math.random() > 0.15,
    orbTaken: false
  };
}

function initWorld() {
  segments = [];
  orbs = [];
  particles = [];
  ripples = [];
  scrollX = 0;
  scrollSpeed = SCROLL_BASE;
  difficulty = 0;
  nextSegX = W * 0.5;
  segId = 0;
  buoy.y = H * 0.5;
  buoy.vy = 0;
  buoy.bob = 0;
  fogOverlay = 0;
  var x = -100;
  while (x < W + 400) {
    var seg = makeSegment(x);
    segments.push(seg);
    if (seg.hasOrb) {
      orbs.push({
        segId: seg.id,
        x: x + seg.w * 0.55,
        y: seg.gapY + seg.gapH * 0.5,
        r: Math.max(8, 16 - difficulty * 1.2),
        pulse: rand(0, Math.PI * 2),
        taken: false
      });
    }
    x += seg.w * rand(0.55, 0.85);
  }
  nextSegX = x;
}

function spawnParticles(x, y, col, n) {
  for (var i = 0; i < n; i++) {
    particles.push({
      x: x, y: y,
      vx: rand(-80, 80), vy: rand(-100, 40),
      life: rand(0.3, 0.7), max: 0.7,
      r: rand(2, 5), col: col
    });
  }
}

function fogAtY(worldX, y) {
  for (var i = 0; i < segments.length; i++) {
    var s = segments[i];
    var sx = s.x - scrollX;
    if (worldX < sx || worldX > sx + s.w) continue;
    var wob = Math.sin(s.wobble + scrollX * 0.004) * 12;
    var topFog = s.gapY + wob;
    var botFog = s.gapY + s.gapH + wob;
    if (y < topFog || y > botFog) return s.density;
  }
  return 0;
}

function updateHUD() {
  if (warmthVal) warmthVal.textContent = Math.max(0, Math.ceil(warmth));
  if (warmthBar) warmthBar.style.width = Math.max(0, warmth / WARMTH_MAX * 100) + '%';
  if (gapVal) gapVal.textContent = gaps;
  if (timeVal) timeVal.textContent = Math.ceil(timeLeft);
  if (comboVal) {
    comboVal.textContent = combo > 1 ? combo + '× gap streak' : '';
  }
}

function startGame() {
  state = 'playing';
  warmth = WARMTH_MAX;
  gaps = 0;
  combo = 0;
  comboTimer = 0;
  timeLeft = ROUND_TIME;
  timerAcc = 0;
  holding = false;
  shake = 0;
  hitPause = 0;
  flash = 0;
  initWorld();
  updateHUD();
  if (overlayTitle) overlayTitle.classList.add('hidden');
  if (overlayGO) overlayGO.classList.add('hidden');
  if (hintEl) hintEl.classList.remove('hide');
  ensureAudio();
  playTone(220, 0.15, 0.05, 'triangle');
}

function endGame(won) {
  state = 'gameover';
  holding = false;
  if (hintEl) hintEl.classList.add('hide');
  if (overlayGO) overlayGO.classList.remove('hidden');
  if (goTitle) goTitle.textContent = won ? 'Sunbreak' : 'Swallowed';
  if (goScore) goScore.textContent = gaps + ' gap' + (gaps !== 1 ? 's' : '') + ' · ' + Math.ceil(ROUND_TIME - timeLeft) + 's';
  if (goMsg) {
    var msgs = won
      ? ['You rode the marine layer to a pocket of summer heat.', 'Thirteen degrees behind the fog — you found the sun.']
      : gaps >= 8 ? ['The bay remembers your route through the gaps.']
      : gaps >= 4 ? ['Almost clear — one more dive might break through.']
      : ['The marine layer closes. Try again at dawn.'];
    goMsg.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  }
  playTone(won ? 440 : 110, 0.4, 0.07, won ? 'sine' : 'sawtooth');
  vibrate(won ? [20, 40, 20] : 80);
}

function collectOrb(o) {
  if (o.taken) return;
  o.taken = true;
  gaps++;
  combo++;
  comboTimer = 3.5;
  warmth = Math.min(WARMTH_MAX, warmth + ORB_WARMTH);
  flash = 0.25;
  spawnParticles(o.x - scrollX, o.y, palette().orb, 16);
  playTone(520 + combo * 30, 0.12, 0.07, 'sine');
  vibrate(15);
  updateHUD();
}

function update(dt) {
  if (state !== 'playing') {
    buoy.bob += dt * 2;
    return;
  }
  if (hitPause > 0) { hitPause -= dt; return; }

  difficulty = Math.min(5, (ROUND_TIME - timeLeft) / 10 + gaps * 0.15);
  scrollSpeed = SCROLL_BASE + difficulty * 22;
  scrollX += scrollSpeed * dt;
  fogOverlay = Math.min(0.55, difficulty * 0.09);

  timerAcc += dt;
  if (timerAcc >= 1) {
    timerAcc -= 1;
    timeLeft -= 1;
    if (timeLeft <= 0) { endGame(true); return; }
  }

  warmth -= WARMTH_DRAIN * dt;
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 0;
  }

  if (holding) {
    buoy.vy -= LIFT * dt;
  } else {
    buoy.vy += GRAVITY * dt;
  }
  buoy.vy = Math.max(-MAX_VY, Math.min(MAX_VY, buoy.vy));
  buoy.y += buoy.vy * dt;
  buoy.bob += dt * 3;

  var margin = buoy.r + 4;
  if (buoy.y < margin) { buoy.y = margin; buoy.vy = Math.abs(buoy.vy) * 0.3; }
  if (buoy.y > H - margin) { buoy.y = H - margin; buoy.vy = -Math.abs(buoy.vy) * 0.3; }

  var bx = W * BUOY_X_RATIO;
  var worldBx = scrollX + bx;
  var fogD = fogAtY(worldBx, buoy.y);
  if (fogD > 0.5) {
    warmth -= FOG_DRAIN * fogD * dt;
    if (Math.random() < 0.08) {
      spawnParticles(bx + rand(-8, 8), buoy.y + rand(-8, 8), 'rgba(180,190,200,0.6)', 2);
    }
    if (fogD > 0.75 && Math.random() < dt * 3) shake = 3;
  }

  while (nextSegX - scrollX < W + 300) {
    var seg = makeSegment(nextSegX);
    segments.push(seg);
    if (seg.hasOrb) {
      orbs.push({
        segId: seg.id,
        x: nextSegX + seg.w * rand(0.4, 0.65),
        y: seg.gapY + seg.gapH * 0.5,
        r: Math.max(7, 15 - difficulty * 1.5),
        pulse: rand(0, Math.PI * 2),
        taken: false
      });
    }
    nextSegX += seg.w * rand(0.5, 0.8);
  }

  segments = segments.filter(function(s) { return s.x + s.w - scrollX > -120; });

  for (var i = 0; i < orbs.length; i++) {
    var o = orbs[i];
    if (o.taken) continue;
    o.pulse += dt * 4;
    o.r = Math.max(6, (15 - difficulty * 1.5) + Math.sin(o.pulse) * 1.5);
    var ox = o.x - scrollX;
    var dx = ox - bx;
    var dy = o.y - buoy.y;
    if (dx * dx + dy * dy < (o.r + buoy.r + 6) * (o.r + buoy.r + 6)) {
      collectOrb(o);
    }
  }
  orbs = orbs.filter(function(o) { return !o.taken && o.x - scrollX > -60; });

  for (var p = particles.length - 1; p >= 0; p--) {
    var pt = particles[p];
    pt.life -= dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 60 * dt;
    if (pt.life <= 0) particles.splice(p, 1);
  }

  if (Math.random() < dt * 0.4) {
    ripples.push({ x: rand(0, W), y: H - rand(5, 30), r: 0, max: rand(20, 50), life: 1 });
  }
  for (var r = ripples.length - 1; r >= 0; r--) {
    ripples[r].life -= dt * 0.6;
    ripples[r].r += dt * 30;
    if (ripples[r].life <= 0) ripples.splice(r, 1);
  }

  if (shake > 0) shake -= dt * 12;
  if (flash > 0) flash -= dt;

  if (warmth <= 0) endGame(false);
  updateHUD();
}

function drawSky(p) {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, p.sky[0]);
  g.addColorStop(0.45, p.sky[1]);
  g.addColorStop(1, p.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawWater(p) {
  var g = ctx.createLinearGradient(0, H * 0.55, 0, H);
  g.addColorStop(0, p.water[0]);
  g.addColorStop(0.5, p.water[1]);
  g.addColorStop(1, p.water[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.5, W, H * 0.5);

  ctx.save();
  ctx.globalAlpha = 0.25;
  for (var i = 0; i < ripples.length; i++) {
    var rp = ripples[i];
    ctx.strokeStyle = isLight() ? 'rgba(255,255,255,0.4)' : 'rgba(200,210,220,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.3, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawFogLayer(s, p, idx) {
  var sx = s.x - scrollX;
  if (sx + s.w < -20 || sx > W + 20) return;
  var wob = Math.sin(s.wobble + scrollX * 0.004) * 12;
  var top = s.gapY + wob;
  var bot = s.gapY + s.gapH + wob;
  var fogCol = p.fog[Math.min(idx % 3, 2)];
  var gapMid = (top + bot) * 0.5;

  ctx.save();
  var beam = ctx.createLinearGradient(sx, gapMid, sx + s.w, gapMid);
  beam.addColorStop(0, 'rgba(255,220,150,0)');
  beam.addColorStop(0.5, 'rgba(255,210,130,' + (0.08 + (1 - s.density) * 0.06) + ')');
  beam.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = beam;
  ctx.fillRect(sx, top, s.w, bot - top);

  ctx.globalAlpha = s.density;

  ctx.fillStyle = fogCol;
  ctx.beginPath();
  ctx.moveTo(sx, 0);
  ctx.lineTo(sx + s.w, 0);
  ctx.lineTo(sx + s.w, top - 8);
  for (var x = sx + s.w; x >= sx; x -= 8) {
    var ny = top + Math.sin((x + scrollX) * 0.02 + s.wobble) * 6;
    ctx.lineTo(x, ny);
  }
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(sx, H);
  ctx.lineTo(sx + s.w, H);
  ctx.lineTo(sx + s.w, bot + 8);
  for (var x2 = sx + s.w; x2 >= sx; x2 -= 8) {
    var ny2 = bot + Math.sin((x2 + scrollX) * 0.018 + s.wobble + 1) * 8;
    ctx.lineTo(x2, ny2);
  }
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawOrb(o, p) {
  if (o.taken) return;
  var ox = o.x - scrollX;
  if (ox < -40 || ox > W + 40) return;
  var r = o.r;
  var pulse = 1 + Math.sin(o.pulse) * 0.12;

  ctx.save();
  var glow = ctx.createRadialGradient(ox, o.y, 0, ox, o.y, r * 3 * pulse);
  glow.addColorStop(0, 'rgba(255,220,140,0.5)');
  glow.addColorStop(0.5, 'rgba(232,160,64,0.15)');
  glow.addColorStop(1, 'rgba(232,160,64,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(ox, o.y, r * 3 * pulse, 0, Math.PI * 2);
  ctx.fill();

  var og = ctx.createRadialGradient(ox - r * 0.2, o.y - r * 0.2, 0, ox, o.y, r * pulse);
  og.addColorStop(0, p.orbCore);
  og.addColorStop(0.6, p.orb);
  og.addColorStop(1, 'rgba(200,120,20,0.6)');
  ctx.fillStyle = og;
  ctx.beginPath();
  ctx.arc(ox, o.y, r * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBuoy(p) {
  var bx = W * BUOY_X_RATIO;
  var by = buoy.y + Math.sin(buoy.bob) * (state === 'title' ? 4 : 2);
  var r = buoy.r;

  ctx.save();
  ctx.strokeStyle = p.rope;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(bx, by - r - 4);
  ctx.quadraticCurveTo(bx + 6, by - r - 20, bx + 2, by - r - 36);
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(bx + 2, by + r * 0.85, r * 0.9, r * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();

  var bg = ctx.createRadialGradient(bx - 3, by - 3, 0, bx, by, r);
  bg.addColorStop(0, p.buoyLight);
  bg.addColorStop(0.55, p.buoy);
  bg.addColorStop(1, p.buoyDark);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(bx, by, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = p.buoyDark;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bx - r + 2, by);
  ctx.lineTo(bx + r - 2, by);
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.35;
  ctx.beginPath();
  ctx.arc(bx - 4, by - 5, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (state === 'playing' && holding) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = p.buoyLight;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(bx, by - r);
    ctx.lineTo(bx, by - r - 50);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var pt = particles[i];
    ctx.save();
    ctx.globalAlpha = pt.life / pt.max;
    ctx.fillStyle = pt.col;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawVignette() {
  if (fogOverlay <= 0 && state !== 'title') return;
  var alpha = state === 'title' ? 0.2 : fogOverlay;
  var g = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.15, W * 0.5, H * 0.5, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, isLight() ? 'rgba(160,175,190,' + alpha + ')' : 'rgba(20,30,40,' + alpha + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawFlash() {
  if (flash <= 0) return;
  ctx.fillStyle = 'rgba(255,220,140,' + (flash * 0.35) + ')';
  ctx.fillRect(0, 0, W, H);
}

function render() {
  if (!ctx) return;
  var p = palette();
  ctx.save();
  if (shake > 0) {
    ctx.translate(rand(-shake, shake), rand(-shake, shake));
  }

  drawSky(p);
  drawWater(p);

  for (var i = 0; i < segments.length; i++) drawFogLayer(segments[i], p, i);
  for (var j = 0; j < orbs.length; j++) drawOrb(orbs[j], p);
  drawBuoy(p);
  drawParticles();
  drawVignette();
  drawFlash();

  ctx.restore();
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.033, (ts - lastTs) / 1000);
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function setHold(v) {
  if (state !== 'playing') return;
  holding = v;
  if (v) playTone(180, 0.06, 0.03, 'triangle');
}

function onDown(e) {
  if (e && e.preventDefault) e.preventDefault();
  setHold(true);
  if (hintEl && state === 'playing') hintEl.classList.add('hide');
}

function onUp(e) {
  if (e && e.preventDefault) e.preventDefault();
  setHold(false);
}

function onKey(e) {
  if (!e) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    if (e.type === 'keydown') { e.preventDefault(); setHold(true); }
    else { e.preventDefault(); setHold(false); }
  }
}

if (btnStart) btnStart.addEventListener('click', function(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  startGame();
});
if (btnRestart) btnRestart.addEventListener('click', function(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  startGame();
});

if (canvas) {
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });
  canvas.addEventListener('touchcancel', onUp, { passive: false });
}
window.addEventListener('keydown', onKey);
window.addEventListener('keyup', onKey);
window.addEventListener('resize', resize);

resize();
initWorld();
updateHUD();
render();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
