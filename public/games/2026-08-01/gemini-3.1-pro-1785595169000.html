<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Swarm</title>
<style>
:root {
    --bg-color: #F4F4F0;
    --text-color: #2C2C2C;
    --node-color: #E0E0D8;
    --agent-color: #457B9D;
    --bug-color: #E63946;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg-color: #1A1A1A;
        --text-color: #F4F4F0;
        --node-color: #2A2A2A;
        --agent-color: #4EA8DE;
        --bug-color: #FF5964;
    }
}
body {
    margin: 0; padding: 0;
    background: var(--bg-color);
    color: var(--text-color);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    height: 100dvh; width: 100dvw;
}
canvas {
    display: block;
    width: 100%; height: 100%;
}
#hud {
    position: absolute; top: 0; left: 0; width: 100%;
    padding: 20px; box-sizing: border-box;
    display: flex; justify-content: space-between;
    pointer-events: none;
    font-size: 1.2rem; font-weight: bold;
    z-index: 5;
}
.hud-box {
    background: var(--bg-color);
    padding: 8px 16px;
    border: 2px solid var(--text-color);
    border-radius: 8px;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
}
.screen-container {
    position: absolute; inset: 0;
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
}
.screen {
    background: var(--bg-color);
    padding: 2rem;
    border: 2px solid var(--text-color);
    border-radius: 12px;
    text-align: center;
    pointer-events: none;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.1);
    max-width: 80%;
}
.screen h2 { margin: 0 0 1rem 0; font-size: 2rem; }
.screen p { margin: 0 0 1.5rem 0; line-height: 1.5; }
button {
    pointer-events: auto;
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: bold;
    padding: 1rem 2rem;
    background: var(--text-color);
    color: var(--bg-color);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s;
}
button:active { transform: scale(0.95); }
</style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud">
        <div class="hud-box">SCORE: <span id="score-val">0</span></div>
        <div class="hud-box">SYSTEM: <span id="lives-val">♥♥♥</span></div>
    </div>
    <div class="screen-container" id="title-container">
        <div class="screen">
            <h2>AGENT SWARM</h2>
            <p>Tap nodes to deploy agents.<br>Patch bugs before they corrupt the grid.<br>Don't let agents collide!</p>
            <button data-smoke="start">DEPLOY</button>
        </div>
    </div>
    <div class="screen-container" id="gameover-container" style="display:none;">
        <div class="screen">
            <h2>SYSTEM FAILURE</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button data-smoke="restart">REBOOT</button>
        </div>
    </div>

<script>
(function() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    let theme = getColors();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        theme = getColors();
    });

    function getColors() {
        const style = getComputedStyle(document.body);
        return {
            bg: style.getPropertyValue('--bg-color').trim(),
            text: style.getPropertyValue('--text-color').trim(),
            node: style.getPropertyValue('--node-color').trim(),
            agent: style.getPropertyValue('--agent-color').trim(),
            bug: style.getPropertyValue('--bug-color').trim(),
        };
    }

    // Audio
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'beat') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.1);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'spawn') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, t);
            osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
            gain.gain.setValueAtTime(0.05, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'patch') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, t);
            osc.frequency.setValueAtTime(800, t + 0.1);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.2);
            osc.start(t); osc.stop(t + 0.2);
        } else if (type === 'collision' || type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, t);
            osc.frequency.linearRampToValueAtTime(50, t + 0.2);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.2);
            osc.start(t); osc.stop(t + 0.2);
        } else if (type === 'bugSpawn') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, t);
            osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
            gain.gain.setValueAtTime(0.05, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, t);
            osc.frequency.exponentialRampToValueAtTime(50, t + 1);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.linearRampToValueAtTime(0, t + 1);
            osc.start(t); osc.stop(t + 1);
        }
    }

    // Game State
    let state = 'menu';
    let score = 0;
    let lives = 3;
    let nodes = [];
    let edges = [];
    let agents = [];
    let bugs = [];
    let particles = [];
    let floatingTexts = [];
    
    let cellSize = 0;
    let beatTimer = 0;
    const BEAT_INTERVAL = 500;
    let beatsSinceLastBug = 0;
    let currentBugInterval = 6;
    let currentBugTimer = 16;
    let bugsSpawnedTotal = 0;
    let shakeTime = 0;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const availableWidth = canvas.width - 40;
        const availableHeight = canvas.height - 150;
        cellSize = Math.min(availableWidth / 4, availableHeight / 4);
        const gridWidth = cellSize * 4;
        const gridHeight = cellSize * 4;
        const startX = (canvas.width - gridWidth) / 2;
        const startY = 100 + (availableHeight - gridHeight) / 2;
        
        nodes.forEach(n => {
            n.screenX = startX + n.gridX * cellSize;
            n.screenY = startY + n.gridY * cellSize;
        });
        
        agents.forEach(a => {
            a.x = a.currentNode.screenX;
            a.y = a.currentNode.screenY;
        });
    }
    window.addEventListener('resize', resize);

    function initGrid() {
        nodes = [];
        edges = [];
        for(let y=0; y<5; y++) {
            for(let x=0; x<5; x++) {
                nodes.push({ id: y*5+x, gridX: x, gridY: y, active: true, scale: 1 });
            }
        }
        for(let y=0; y<5; y++) {
            for(let x=0; x<5; x++) {
                if(x < 4) edges.push({ u: y*5+x, v: y*5+x+1 });
                if(y < 4) edges.push({ u: y*5+x, v: (y+1)*5+x });
            }
        }
        resize();
    }

    function updateHUD() {
        document.getElementById('score-val').innerText = score;
        document.getElementById('lives-val').innerText = '♥'.repeat(Math.max(0, lives));
    }

    function loseLife() {
        lives--;
        updateHUD();
        shakeTime = 300;
        if (lives <= 0 && state === 'playing') {
            state = 'gameover';
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-container').style.display = 'flex';
            playSound('gameover');
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
        }
    }

    function spawnBug() {
        const activeEmptyNodes = nodes.filter(n => 
            n.active && 
            !bugs.some(b => b.node.id === n.id) &&
            !agents.some(a => a.currentNode.id === n.id || a.nextNode.id === n.id)
        );
        if (activeEmptyNodes.length === 0) return;
        
        const node = activeEmptyNodes[Math.floor(Math.random() * activeEmptyNodes.length)];
        bugs.push({ node: node, timer: currentBugTimer, maxTimer: currentBugTimer });
        playSound('bugSpawn');
    }

    function getShortestPath(startNode, targetNode) {
        if (startNode === targetNode) return [startNode];
        const queue = [[startNode]];
        const visited = new Set([startNode.id]);
        
        while(queue.length > 0) {
            const path = queue.shift();
            const node = path[path.length - 1];
            
            const neighbors = [];
            edges.forEach(e => {
                if (e.u === node.id) neighbors.push(nodes.find(n => n.id === e.v));
                if (e.v === node.id) neighbors.push(nodes.find(n => n.id === e.u));
            });
            
            for (const neighbor of neighbors) {
                if (!neighbor || !neighbor.active) continue;
                if (neighbor.id === targetNode.id) return [...path, neighbor];
                if (!visited.has(neighbor.id)) {
                    visited.add(neighbor.id);
                    queue.push([...path, neighbor]);
                }
            }
        }
        return null;
    }

    function updateAgentPaths() {
        agents.forEach(agent => {
            let bestBug = null;
            let shortestPath = null;
            let minLen = Infinity;
            
            bugs.forEach(bug => {
                const path = getShortestPath(agent.currentNode, bug.node);
                if (path && path.length < minLen) {
                    minLen = path.length;
                    shortestPath = path;
                    bestBug = bug;
                }
            });
            
            if (shortestPath && shortestPath.length > 1) {
                agent.path = shortestPath;
                if (!agent.spawning) agent.nextNode = shortestPath[1];
            } else {
                agent.path = [agent.currentNode];
                if (!agent.spawning) agent.nextNode = agent.currentNode;
            }
        });
    }

    function spawnParticles(x, y, color) {
        for(let i=0; i<10; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 0.2 + 0.1;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 300 + Math.random() * 200,
                maxLife: 500,
                color: color,
                radius: Math.random() * 4 + 2
            });
        }
    }

    function onBeat() {
        // Snap agents and clear spawning flag
        agents.forEach(a => {
            a.currentNode = a.nextNode;
        });
        
        // Vertex Collisions
        const nodeOccupancy = {};
        agents.forEach(a => {
            if(!nodeOccupancy[a.currentNode.id]) nodeOccupancy[a.currentNode.id] = [];
            nodeOccupancy[a.currentNode.id].push(a);
        });
        
        let collisionOccurred = false;
        for (const id in nodeOccupancy) {
            if (nodeOccupancy[id].length > 1) {
                collisionOccurred = true;
                nodeOccupancy[id].forEach(a => a.dead = true);
                const n = nodes.find(n=>n.id==id);
                spawnParticles(n.screenX, n.screenY, theme.agent);
                playSound('collision');
            }
        }
        
        // Bug Patches
        agents.forEach(a => {
            if (a.dead) return;
            const bugIndex = bugs.findIndex(b => b.node.id === a.currentNode.id);
            if (bugIndex !== -1) {
                bugs.splice(bugIndex, 1);
                a.dead = true;
                score += 1;
                updateHUD();
                spawnParticles(a.currentNode.screenX, a.currentNode.screenY, theme.bug);
                floatingTexts.push({ x: a.currentNode.screenX, y: a.currentNode.screenY, text: '+1', color: theme.text, life: 1, maxLife: 1 });
                playSound('patch');
            }
        });
        
        agents = agents.filter(a => !a.dead);
        if (collisionOccurred) loseLife();
        
        // Clear spawning AFTER patches so they don't move this beat if they just spawned
        agents.forEach(a => a.spawning = false);
        
        // Update Bugs
        let nodeLost = false;
        for (let i = bugs.length - 1; i >= 0; i--) {
            bugs[i].timer--;
            if (bugs[i].timer <= 0) {
                const n = bugs[i].node;
                n.active = false;
                edges = edges.filter(e => e.u !== n.id && e.v !== n.id);
                spawnParticles(n.screenX, n.screenY, theme.text);
                bugs.splice(i, 1);
                nodeLost = true;
                playSound('error');
            }
        }
        
        if (nodeLost) {
            agents.forEach(a => {
                if (!a.currentNode.active) {
                    a.dead = true;
                    spawnParticles(a.currentNode.screenX, a.currentNode.screenY, theme.agent);
                }
            });
            agents = agents.filter(a => !a.dead);
            loseLife();
        }
        
        // Spawn new bugs
        beatsSinceLastBug++;
        if (beatsSinceLastBug >= currentBugInterval) {
            spawnBug();
            beatsSinceLastBug = 0;
            bugsSpawnedTotal++;
            if (bugsSpawnedTotal % 5 === 0 && currentBugInterval > 2) {
                currentBugInterval--;
            }
            if (bugsSpawnedTotal % 8 === 0 && currentBugTimer > 8) {
                currentBugTimer--;
            }
        }
        
        updateAgentPaths();
        
        // Edge Collisions
        for (let i = 0; i < agents.length; i++) {
            for (let j = i + 1; j < agents.length; j++) {
                const a = agents[i];
                const b = agents[j];
                if (a.currentNode.id === b.nextNode.id && a.nextNode.id === b.currentNode.id && a.currentNode.id !== a.nextNode.id) {
                    a.dead = true; b.dead = true;
                    const midX = (a.currentNode.screenX + a.nextNode.screenX) / 2;
                    const midY = (a.currentNode.screenY + a.nextNode.screenY) / 2;
                    spawnParticles(midX, midY, theme.agent);
                    playSound('collision');
                    loseLife();
                }
            }
        }
        agents = agents.filter(a => !a.dead);
        
        if (state === 'playing') playSound('beat');
        nodes.forEach(n => { if(n.active) n.scale = 1.2; });
    }

    function updateAnimations(dt) {
        const progress = Math.min(1, beatTimer / BEAT_INTERVAL);
        const ease = t => t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        const p = ease(progress);
        
        agents.forEach(a => {
            if (a.spawning) {
                a.x = a.currentNode.screenX;
                a.y = a.currentNode.screenY;
            } else {
                a.x = a.currentNode.screenX + (a.nextNode.screenX - a.currentNode.screenX) * p;
                a.y = a.currentNode.screenY + (a.nextNode.screenY - a.currentNode.screenY) * p;
                if (a.currentNode.id !== a.nextNode.id) {
                    a.angle = Math.atan2(a.nextNode.screenY - a.currentNode.screenY, a.nextNode.screenX - a.currentNode.screenX);
                }
            }
        });
        
        nodes.forEach(n => {
            if (n.scale > 1) n.scale = Math.max(1, n.scale - dt * 0.005);
        });

        for(let i=particles.length-1; i>=0; i--) {
            const p = particles[i];
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.life -= dt;
            if(p.life <= 0) particles.splice(i, 1);
        }

        for(let i=floatingTexts.length-1; i>=0; i--) {
            const ft = floatingTexts[i];
            ft.y -= dt * 0.05;
            ft.life -= dt * 0.001;
            if(ft.life <= 0) floatingTexts.splice(i, 1);
        }
    }

    function drawEdge(x1, y1, x2, y2, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        
        ctx.strokeStyle = color + '66';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x1 + 2, y1 + 2); ctx.lineTo(x2 + 2, y2 + 2); ctx.stroke();
    }

    function drawNode(x, y, radius, color, shadowColor) {
        ctx.save(); ctx.translate(x, y);
        ctx.shadowColor = shadowColor; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
        ctx.shadowColor = 'transparent'; ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
    }

    function drawBug(x, y, radius, color, shadowColor, timer, maxTimer) {
        ctx.save(); ctx.translate(x, y);
        const pulse = 1 + Math.sin(Date.now() / 150) * 0.05;
        ctx.scale(pulse, pulse);
        
        ctx.shadowColor = shadowColor; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
        ctx.fillStyle = color;
        
        ctx.beginPath();
        const spikes = 8;
        for(let i=0; i<spikes * 2; i++) {
            const r = i % 2 === 0 ? radius : radius * 0.5;
            const angle = (i / (spikes * 2)) * Math.PI * 2;
            const px = Math.cos(angle) * r; py = Math.sin(angle) * r;
            if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        
        ctx.shadowColor = 'transparent'; ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius * 0.5, -Math.PI/2, -Math.PI/2 + (timer / maxTimer) * Math.PI * 2);
        ctx.closePath(); ctx.fill();
        ctx.restore();
    }

    function drawAgent(x, y, angle, radius, color, shadowColor) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
        ctx.shadowColor = shadowColor; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(radius, 0); ctx.lineTo(-radius * 0.8, radius * 0.8);
        ctx.lineTo(-radius * 0.5, 0); ctx.lineTo(-radius * 0.8, -radius * 0.8);
        ctx.closePath(); ctx.fill();
        ctx.restore();
    }

    function draw() {
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        if (shakeTime > 0) {
            const mag = (shakeTime / 200) * 5;
            ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
            shakeTime -= 16;
        }
        
        edges.forEach(e => {
            const u = nodes.find(n => n.id === e.u);
            const v = nodes.find(n => n.id === e.v);
            if (u && v && u.active && v.active) {
                drawEdge(u.screenX, u.screenY, v.screenX, v.screenY, theme.edge);
            }
        });
        
        ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
        agents.forEach(a => {
            if (a.path && a.path.length > 1) {
                ctx.strokeStyle = theme.agent + '80';
                ctx.beginPath(); ctx.moveTo(a.x, a.y);
                for (let i = 1; i < a.path.length; i++) {
                    ctx.lineTo(a.path[i].screenX, a.path[i].screenY);
                }
                ctx.stroke();
            }
        });
        ctx.setLineDash([]);
        
        nodes.forEach(n => {
            if (n.active) drawNode(n.screenX, n.screenY, cellSize * 0.15 * n.scale, theme.node, theme.text + '40');
        });
        
        bugs.forEach(b => {
            drawBug(b.node.screenX, b.node.screenY, cellSize * 0.2, theme.bug, theme.text + '40', b.timer, b.maxTimer);
        });
        
        agents.forEach(a => {
            drawAgent(a.x, a.y, a.angle || 0, cellSize * 0.15, theme.agent, theme.text + '40');
        });
        
        particles.forEach(p => {
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life / p.maxLife;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * (p.life / p.maxLife), 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1;

        floatingTexts.forEach(ft => {
            if (ft.life > 0) {
                ctx.fillStyle = ft.color; ctx.globalAlpha = ft.life / ft.maxLife;
                ctx.font = 'bold 24px ui-monospace, monospace'; ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
            }
        });
        ctx.globalAlpha = 1;
        
        ctx.restore();
    }

    let lastTime = performance.now();
    function loop(time) {
        requestAnimationFrame(loop);
        const dt = time - lastTime;
        lastTime = time;
        
        if (state === 'playing') {
            beatTimer += dt;
            if (beatTimer >= BEAT_INTERVAL) {
                beatTimer -= BEAT_INTERVAL;
                onBeat();
            }
            updateAnimations(dt);
        }
        draw();
    }

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (state !== 'playing') return;
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        let closest = null; let minDist = Infinity;
        nodes.forEach(n => {
            if (!n.active) return;
            const dist = Math.hypot(n.screenX - x, n.screenY - y);
            if (dist < minDist) { minDist = dist; closest = n; }
        });
        
        if (closest && minDist < cellSize * 0.5) {
            const hasBug = bugs.some(b => b.node.id === closest.id);
            const hasAgent = agents.some(a => a.currentNode.id === closest.id || a.nextNode.id === closest.id);
            
            if (!hasBug && !hasAgent) {
                const agent = {
                    currentNode: closest, nextNode: closest,
                    x: closest.screenX, y: closest.screenY,
                    path: [closest], angle: 0, spawning: true
                };
                agents.push(agent);
                updateAgentPaths();
                spawnParticles(closest.screenX, closest.screenY, theme.agent);
                playSound('spawn');
                if (navigator.vibrate) navigator.vibrate(10);
            } else {
                playSound('error');
            }
        }
    });

    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    function startGame() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        state = 'playing'; score = 0; lives = 3;
        agents = []; bugs = []; particles = []; floatingTexts = [];
        beatsSinceLastBug = 0; currentBugInterval = 6; currentBugTimer = 16;
        bugsSpawnedTotal = 0; beatTimer = 0; shakeTime = 0;
        
        initGrid(); updateHUD();
        document.getElementById('title-container').style.display = 'none';
        document.getElementById('gameover-container').style.display = 'none';
        spawnBug();
    }

    document.querySelector('[data-smoke="start"]').addEventListener('click', startGame);
    document.querySelector('[data-smoke="restart"]').addEventListener('click', startGame);

    // Initial render
    initGrid();
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
