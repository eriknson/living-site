<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proof Dawn</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1c262c;--fog:rgba(130,148,162,.45);--text:#b8c8d4;--muted:#6a7a88;
  --neon:#00d4b8;--neon-dim:rgba(0,212,184,.35);--warm:#f0a030;--warm-dim:rgba(240,160,48,.3);
  --panel:rgba(22,32,40,.9);--border:rgba(120,140,155,.22);--overlay:rgba(16,24,30,.86);
  --btn-bg:#00a890;--btn-text:#0a1818;--danger:#e06050;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c262c;--fog:rgba(130,148,162,.45);--text:#b8c8d4;--muted:#6a7a88;
    --neon:#00d4b8;--neon-dim:rgba(0,212,184,.35);--warm:#f0a030;--warm-dim:rgba(240,160,48,.3);
    --panel:rgba(22,32,40,.9);--border:rgba(120,140,155,.22);--overlay:rgba(16,24,30,.86);
    --btn-bg:#00a890;--btn-text:#0a1818;--danger:#e06050;
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#b0c0cc;--fog:rgba(180,195,208,.55);--text:#1a2830;--muted:#4a5a68;
    --neon:#008870;--neon-dim:rgba(0,136,112,.28);--warm:#c87818;--warm-dim:rgba(200,120,24,.25);
    --panel:rgba(235,242,248,.92);--border:rgba(80,100,120,.18);--overlay:rgba(190,205,218,.88);
    --btn-bg:#008870;--btn-text:#fff;--danger:#c04030;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;color:var(--text);touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#game{flex:1;width:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 12px 6px;display:flex;gap:10px;pointer-events:none;z-index:2}
.hud-left{flex:1;display:flex;flex-direction:column;gap:4px}
.hud-row{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud-val{color:var(--warm);font-size:11px;font-weight:600}
.bar-wrap{height:4px;background:var(--panel);border:1px solid var(--border);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--warm),#f8c860);border-radius:1px;transition:width .15s}
#diagram-wrap{width:72px;height:72px;flex-shrink:0;border:1px solid var(--border);border-radius:4px;background:var(--panel);overflow:hidden}
#diagram{width:100%;height:100%;display:block}
.combo{font-size:9px;color:var(--neon);text-align:left;letter-spacing:.06em;min-height:12px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--overlay);z-index:10;pointer-events:none;transition:opacity .35s,visibility .35s}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-title{font-size:clamp(18px,5.5vw,28px);color:var(--neon);letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:1.3;padding:0 20px;text-shadow:0 0 20px var(--neon-dim)}
.overlay-sub{font-size:10px;color:var(--muted);text-align:center;max-width:280px;line-height:1.6;padding:0 16px}
.overlay-score{font-size:12px;color:var(--text)}
.btn{pointer-events:auto;min-width:180px;min-height:48px;padding:14px 24px;font-family:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--btn-text);background:var(--btn-bg);border:none;border-radius:3px;cursor:pointer;box-shadow:0 4px 18px var(--neon-dim);transition:transform .1s}
.btn:active{transform:scale(.96)}
#hint{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.08em;color:var(--muted);pointer-events:none;z-index:3;opacity:.75;transition:opacity .4s}
#hint.hide{opacity:0}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-left">
      <div class="hud-row"><span>Sun</span><span class="hud-val" id="temp-val">14°</span></div>
      <div class="bar-wrap"><div class="bar-fill" id="temp-bar"></div></div>
      <div class="hud-row"><span>Proof</span><span class="hud-val" id="proof-val">0 / 8</span><span>Score</span><span class="hud-val" id="score-val">0</span></div>
      <div class="combo" id="combo-val"></div>
    </div>
    <div id="diagram-wrap"><canvas id="diagram"></canvas></div>
  </div>
  <div id="hint">Swipe ← → to switch lanes</div>
  <div id="overlay-title" class="overlay">
    <div class="overlay-title">Proof Dawn</div>
    <div class="overlay-sub">Swipe between fog lanes on a clearing bay morning. Collect glowing proof tokens before the sun hits 28°.</div>
    <button class="btn" data-smoke="start" id="btn-start">Begin Proof</button>
  </div>
  <div id="overlay-gameover" class="overlay hidden">
    <div class="overlay-title" id="go-title">Sunrise</div>
    <div class="overlay-score" id="go-score"></div>
    <div class="overlay-sub" id="go-msg"></div>
    <button class="btn" data-smoke="restart" id="btn-restart">Try Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var PROOF_TOTAL = 8;
var TEMP_START = 14;
var TEMP_END = 28;
var ROUND_SEC = 55;
var LANES = 3;
var BASE_SPEED = 110;
var SWIPE_THRESH = 36;

var canvas = document.getElementById('game');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var dCanvas = document.getElementById('diagram');
var dCtx = dCanvas && dCanvas.getContext ? dCanvas.getContext('2d') : null;
var tempVal = document.getElementById('temp-val');
var tempBar = document.getElementById('temp-bar');
var proofVal = document.getElementById('proof-val');
var scoreVal = document.getElementById('score-val');
var comboVal = document.getElementById('combo-val');
var hintEl = document.getElementById('hint');
var overlayTitle = document.getElementById('overlay-title');
var overlayGO = document.getElementById('overlay-gameover');
var goTitle = document.getElementById('go-title');
var goScore = document.getElementById('go-score');
var goMsg = document.getElementById('go-msg');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 360, H = 640;
var state = 'title';
var lane = 1;
var targetLane = 1;
var laneT = 1;
var temp = TEMP_START;
var proof = 0;
var score = 0;
var combo = 0;
var comboTimer = 0;
var timeAcc = 0;
var difficulty = 0;
var fogDensity = 1;
var laneWidth = 1;
var scrollSpeed = BASE_SPEED;
var tokens = [];
var fogs = [];
var particles = [];
var collected = [];
var proofNodes = [];
var flash = 0;
var shake = 0;
var hitPause = 0;
var lastTs = 0;
var spawnAcc = 0;
var fogAcc = 0;
var audioCtx = null;
var touchStartX = 0;
var touchStartY = 0;
var swipeLocked = false;

function isLight() {
  try { return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches; }
  catch (e) { return false; }
}

function palette() {
  var light = isLight();
  if (light) return {
    sky: ['#98aab8','#a8bac8','#b8c8d4'],
    water: ['#7898a8','#88a8b8','#98b8c8'],
    fog: ['rgba(200,212,222,.7)','rgba(185,198,210,.78)','rgba(170,185,200,.85)'],
    fogWall: 'rgba(140,160,175,.92)',
    neon: '#008870', neonGlow: 'rgba(0,136,112,.55)', neonCore: '#60e8c8',
    warm: '#c87818', player: '#008870', danger: '#c04030'
  };
  return {
    sky: ['#1a2428','#222e34','#2a3840'],
    water: ['#1e3038','#243840','#2a4048'],
    fog: ['rgba(100,120,135,.55)','rgba(85,105,120,.62)','rgba(70,90,105,.7)'],
    fogWall: 'rgba(55,75,90,.88)',
    neon: '#00d4b8', neonGlow: 'rgba(0,212,184,.6)', neonCore: '#a0fff0',
    warm: '#f0a030', player: '#00d4b8', danger: '#e06050'
  };
}

function buildProofNodes() {
  proofNodes = [];
  var cx = 36, cy = 36, r = 24;
  for (var i = 0; i < PROOF_TOTAL; i++) {
    var a = (i / PROOF_TOTAL) * Math.PI * 2 - Math.PI / 2;
    proofNodes.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, lit: false, idx: i });
  }
}

function resize() {
  if (!canvas) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var rect = canvas.getBoundingClientRect();
  W = rect.width || window.innerWidth || 360;
  H = rect.height || window.innerHeight || 640;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  if (ctx) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  if (dCanvas && dCtx) {
    dCanvas.width = 72 * dpr;
    dCanvas.height = 72 * dpr;
    dCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}

function laneX(l) {
  var margin = W * 0.12 * (2 - laneWidth);
  var usable = W - margin * 2;
  return margin + (l + 0.5) * (usable / LANES);
}

function playerY() { return H - Math.max(72, H * 0.11); }

function playTone(freq, dur, vol) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function vibrate(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

function spawnToken() {
  var l = Math.floor(Math.random() * LANES);
  tokens.push({
    lane: l, y: -30, r: 14, spin: Math.random() * Math.PI * 2,
    spinSpd: (Math.random() - 0.5) * 4, pulse: Math.random() * Math.PI * 2,
    idx: proof + tokens.filter(function(t){ return !t.dead; }).length
  });
}

function spawnFog() {
  var l = Math.floor(Math.random() * LANES);
  fogs.push({ lane: l, y: -40, h: 50 + Math.random() * 30, wobble: Math.random() * Math.PI * 2 });
}

function addParticles(x, y, col, n) {
  for (var i = 0; i < (n || 8); i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 120;
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 0.4 + Math.random() * 0.4, col: col, sz: 2 + Math.random() * 3 });
  }
}

function resetGame() {
  lane = 1; targetLane = 1; laneT = 1;
  temp = TEMP_START; proof = 0; score = 0; combo = 0; comboTimer = 0;
  timeAcc = 0; difficulty = 0; fogDensity = 1; laneWidth = 1;
  scrollSpeed = BASE_SPEED; tokens = []; fogs = []; particles = [];
  collected = []; spawnAcc = 0; fogAcc = 0; flash = 0; shake = 0; hitPause = 0;
  buildProofNodes();
  updateHUD();
  drawDiagram();
}

function startGame() {
  resetGame();
  state = 'playing';
  overlayTitle.classList.add('hidden');
  overlayGO.classList.add('hidden');
  if (hintEl) setTimeout(function(){ hintEl.classList.add('hide'); }, 4000);
  playTone(440, 0.12, 0.05);
}

function endGame(won) {
  state = 'gameover';
  overlayGO.classList.remove('hidden');
  if (won) {
    goTitle.textContent = 'Proof Complete';
    goTitle.style.color = 'var(--neon)';
    goMsg.textContent = 'The diagram locked in before sunrise. Q.E.D.';
    playTone(660, 0.15, 0.07);
    playTone(880, 0.2, 0.05);
    vibrate(80);
  } else if (temp >= TEMP_END) {
    goTitle.textContent = 'Sun at 28°';
    goTitle.style.color = 'var(--warm)';
    goMsg.textContent = 'The bay cleared before you finished the proof.';
  } else {
    goTitle.textContent = 'Lost in Fog';
    goTitle.style.color = 'var(--danger)';
    goMsg.textContent = 'A fog bank swallowed your lane.';
  }
  goScore.textContent = 'Score: ' + score + ' · Proof: ' + proof + '/' + PROOF_TOTAL;
}

function switchLane(dir) {
  if (state !== 'playing') return;
  var nl = targetLane + dir;
  if (nl < 0 || nl >= LANES) return;
  targetLane = nl;
  playTone(280 + nl * 40, 0.06, 0.03);
  vibrate(12);
}

function collectToken(t, i) {
  t.dead = true;
  proof++;
  combo++;
  comboTimer = 2.5;
  var pts = 10 + combo * 5;
  score += pts;
  temp = Math.max(TEMP_START, temp - 0.8);
  if (proofNodes[proof - 1]) proofNodes[proof - 1].lit = true;
  collected.push({ from: proof - 1 });
  var px = laneX(t.lane), py = t.y;
  addParticles(px, py, palette().neon, 14);
  flash = 0.12;
  hitPause = 0.04;
  playTone(520 + proof * 40, 0.1, 0.06);
  playTone(780 + proof * 20, 0.08, 0.04);
  vibrate(25);
  if (proof >= PROOF_TOTAL) endGame(true);
  updateHUD();
  drawDiagram();
}

function hitFog() {
  shake = 0.3;
  flash = 0.2;
  combo = 0;
  playTone(120, 0.25, 0.08);
  vibrate(100);
  endGame(false);
}

function updateHUD() {
  if (tempVal) tempVal.textContent = Math.round(temp) + '°';
  if (tempBar) tempBar.style.width = ((temp - TEMP_START) / (TEMP_END - TEMP_START) * 100) + '%';
  if (proofVal) proofVal.textContent = proof + ' / ' + PROOF_TOTAL;
  if (scoreVal) scoreVal.textContent = '' + score;
  if (comboVal) comboVal.textContent = combo > 1 ? combo + '× chain' : '';
}

function drawDiagram() {
  if (!dCtx) return;
  var p = palette();
  dCtx.clearRect(0, 0, 72, 72);
  dCtx.fillStyle = isLight() ? 'rgba(235,242,248,.5)' : 'rgba(22,32,40,.5)';
  dCtx.fillRect(0, 0, 72, 72);

  for (var c = 0; c < collected.length; c++) {
    if (c === 0) continue;
    var a = proofNodes[c - 1], b = proofNodes[c];
    if (!a || !b) continue;
    dCtx.beginPath();
    dCtx.moveTo(a.x, a.y);
    dCtx.lineTo(b.x, b.y);
    dCtx.strokeStyle = p.neon;
    dCtx.lineWidth = 1.5;
    dCtx.shadowColor = p.neonGlow;
    dCtx.shadowBlur = 6;
    dCtx.stroke();
    dCtx.shadowBlur = 0;
  }
  if (proof >= PROOF_TOTAL && proofNodes.length > 1) {
    var last = proofNodes[proofNodes.length - 1], first = proofNodes[0];
    dCtx.beginPath();
    dCtx.moveTo(last.x, last.y);
    dCtx.lineTo(first.x, first.y);
    dCtx.strokeStyle = p.neon;
    dCtx.lineWidth = 1.5;
    dCtx.shadowColor = p.neonGlow;
    dCtx.shadowBlur = 8;
    dCtx.stroke();
    dCtx.shadowBlur = 0;
  }

  for (var i = 0; i < proofNodes.length; i++) {
    var n = proofNodes[i];
    dCtx.beginPath();
    dCtx.arc(n.x, n.y, n.lit ? 4 : 2.5, 0, Math.PI * 2);
    dCtx.fillStyle = n.lit ? p.neonCore : (isLight() ? '#8898a8' : '#4a5a68');
    if (n.lit) { dCtx.shadowColor = p.neonGlow; dCtx.shadowBlur = 8; }
    dCtx.fill();
    dCtx.shadowBlur = 0;
  }
}

function update(dt) {
  if (state !== 'playing') return;
  if (hitPause > 0) { hitPause -= dt; return; }

  timeAcc += dt;
  difficulty = Math.min(1, timeAcc / ROUND_SEC);
  fogDensity = Math.max(0.25, 1 - difficulty * 0.75);
  laneWidth = Math.max(0.65, 1 - difficulty * 0.35);
  scrollSpeed = BASE_SPEED + difficulty * 140;

  temp = TEMP_START + (TEMP_END - TEMP_START) * Math.min(1, timeAcc / ROUND_SEC);
  if (temp >= TEMP_END && proof < PROOF_TOTAL) { endGame(false); return; }

  laneT += (targetLane - laneT) * Math.min(1, dt * 14);
  if (Math.abs(laneT - targetLane) < 0.01) laneT = targetLane;
  lane = Math.round(laneT);

  spawnAcc += dt;
  var spawnInt = Math.max(0.55, 1.4 - difficulty * 0.8);
  if (spawnAcc >= spawnInt) {
    spawnAcc = 0;
    spawnToken();
    if (Math.random() < 0.35 + difficulty * 0.25) spawnToken();
  }

  fogAcc += dt;
  var fogInt = Math.max(1.6, 3.2 - difficulty * 1.2);
  if (fogAcc >= fogInt) { fogAcc = 0; spawnFog(); }
  if (proof >= 5 && spawnAcc > spawnInt * 0.5) { spawnAcc = spawnInt * 0.85; }

  var spd = scrollSpeed;
  var py = playerY();
  var px = laneX(laneT);
  var pr = 16;

  for (var ti = tokens.length - 1; ti >= 0; ti--) {
    var t = tokens[ti];
    if (t.dead) { tokens.splice(ti, 1); continue; }
    t.y += spd * dt;
    t.spin += t.spinSpd * dt;
    t.pulse += dt * 5;
    var tx = laneX(t.lane);
    if (Math.abs(t.lane - laneT) < 0.45 && Math.abs(t.y - py) < pr + t.r) collectToken(t, ti);
    if (t.y > H + 40) tokens.splice(ti, 1);
  }

  for (var fi = fogs.length - 1; fi >= 0; fi--) {
    var f = fogs[fi];
    f.y += spd * dt * 0.95;
    f.wobble += dt * 2;
    if (Math.abs(f.lane - laneT) < 0.45 && f.y + f.h > py - pr && f.y < py + pr) hitFog();
    if (f.y > H + 60) fogs.splice(fi, 1);
  }

  for (var pi = particles.length - 1; pi >= 0; pi--) {
    var p = particles[pi];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 180 * dt;
    if (p.life <= 0) particles.splice(pi, 1);
  }

  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
  if (flash > 0) flash -= dt;
  if (shake > 0) shake -= dt;
  updateHUD();
}

function drawBg(p, t) {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, p.sky[0]);
  g.addColorStop(0.45, p.sky[1]);
  g.addColorStop(1, p.water[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  var sunY = H * 0.18 + difficulty * H * 0.06;
  var sunR = 28 + difficulty * 12;
  var sg = ctx.createRadialGradient(W * 0.75, sunY, 0, W * 0.75, sunY, sunR * 3);
  sg.addColorStop(0, 'rgba(240,160,48,' + (0.15 + difficulty * 0.25) + ')');
  sg.addColorStop(1, 'rgba(240,160,48,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = fogDensity * 0.5;
  for (var i = 0; i < 5; i++) {
    var fy = (t * 12 + i * H * 0.22) % (H + 100) - 50;
    var fx = Math.sin(t * 0.3 + i) * W * 0.1 + W * 0.5;
    var fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, W * 0.35);
    fg.addColorStop(0, p.fog[1]);
    fg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, fy - W * 0.3, W, W * 0.6);
  }
  ctx.restore();
}

function drawLanes(p) {
  if (state === 'playing') {
    var hl = Math.round(laneT);
    var hx = laneX(hl);
    var hw = (W / LANES) * laneWidth * 0.92;
    ctx.fillStyle = isLight() ? 'rgba(0,136,112,.06)' : 'rgba(0,212,184,.07)';
    ctx.fillRect(hx - hw / 2, 0, hw, H);
  }
  for (var l = 0; l <= LANES; l++) {
    var x = laneX(l - 0.5);
    ctx.strokeStyle = l === 0 || l === LANES
      ? (isLight() ? 'rgba(80,100,120,.15)' : 'rgba(120,140,155,.12)')
      : (isLight() ? 'rgba(80,100,120,.08)' : 'rgba(120,140,155,.06)');
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawToken(t, p) {
  var x = laneX(t.lane), y = t.y;
  var pulse = 1 + Math.sin(t.pulse) * 0.12;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t.spin);
  ctx.scale(pulse, pulse);

  ctx.shadowColor = p.neonGlow;
  ctx.shadowBlur = 14;
  ctx.strokeStyle = p.neon;
  ctx.lineWidth = 2;
  ctx.beginPath();
  var sides = 6, r = t.r;
  for (var s = 0; s <= sides; s++) {
    var a = (s / sides) * Math.PI * 2;
    var px2 = Math.cos(a) * r, py2 = Math.sin(a) * r;
    if (s === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
  }
  ctx.stroke();

  ctx.fillStyle = p.neonCore;
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFog(f, p) {
  var x = laneX(f.lane), y = f.y;
  var w = (W / LANES) * laneWidth * 0.85;
  ctx.save();
  ctx.globalAlpha = 0.85;
  var fg = ctx.createLinearGradient(x - w / 2, y, x + w / 2, y + f.h);
  fg.addColorStop(0, p.fogWall);
  fg.addColorStop(0.5, p.fog[2]);
  fg.addColorStop(1, p.fogWall);
  ctx.fillStyle = fg;
  var wob = Math.sin(f.wobble) * 4;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y + f.h);
  ctx.quadraticCurveTo(x - w / 4 + wob, y + f.h / 2, x - w / 2, y);
  ctx.lineTo(x + w / 2, y);
  ctx.quadraticCurveTo(x + w / 4 - wob, y + f.h / 2, x + w / 2, y + f.h);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPlayer(px, py, p) {
  ctx.save();
  ctx.shadowColor = p.neonGlow;
  ctx.shadowBlur = 16;
  ctx.fillStyle = p.player;
  ctx.beginPath();
  ctx.moveTo(px, py - 18);
  ctx.lineTo(px - 14, py + 10);
  ctx.lineTo(px, py + 4);
  ctx.lineTo(px + 14, py + 10);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = p.neonCore;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(px, py - 2, 5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function render(t) {
  if (!ctx) return;
  var p = palette();
  var time = t / 1000;

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
  }

  drawBg(p, time);
  drawLanes(p);

  for (var fi = 0; fi < fogs.length; fi++) drawFog(fogs[fi], p);
  for (var ti = 0; ti < tokens.length; ti++) if (!tokens[ti].dead) drawToken(tokens[ti], p);

  var px = laneX(laneT), py = playerY();
  if (state === 'playing' || state === 'gameover') drawPlayer(px, py, p);

  for (var pi = 0; pi < particles.length; pi++) {
    var pt = particles[pi];
    ctx.globalAlpha = pt.life * 2.5;
    ctx.fillStyle = pt.col;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.sz, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (flash > 0) {
    ctx.fillStyle = isLight() ? 'rgba(255,255,255,' + flash * 0.4 + ')' : 'rgba(200,240,230,' + flash * 0.35 + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  if (state === 'playing') update(dt);
  render(ts);
  requestAnimationFrame(loop);
}

function onTouchStart(e) {
  if (e.cancelable) e.preventDefault();
  if (state !== 'playing') return;
  var t = e.changedTouches ? e.changedTouches[0] : e;
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  swipeLocked = false;
}

function onTouchEnd(e) {
  if (e.cancelable) e.preventDefault();
  if (state !== 'playing' || swipeLocked) return;
  var t = e.changedTouches ? e.changedTouches[0] : e;
  var dx = t.clientX - touchStartX;
  var dy = t.clientY - touchStartY;
  if (Math.abs(dx) > SWIPE_THRESH && Math.abs(dx) > Math.abs(dy)) {
    switchLane(dx > 0 ? 1 : -1);
    swipeLocked = true;
  }
}

function onKeyDown(e) {
  if (state === 'playing') {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') switchLane(-1);
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') switchLane(1);
  }
}

function onCenterTap(e) {
  if (state === 'title' || state === 'gameover') return;
  if (e.cancelable) e.preventDefault();
}

if (btnStart) btnStart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
if (btnRestart) btnRestart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

if (canvas) {
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('touchmove', function(e){ if (e.cancelable) e.preventDefault(); }, { passive: false });
  canvas.addEventListener('mousedown', function(e){
    touchStartX = e.clientX; touchStartY = e.clientY; swipeLocked = false;
  });
  canvas.addEventListener('mouseup', function(e){
    if (state !== 'playing') return;
    var dx = e.clientX - touchStartX;
    var dy = e.clientY - touchStartY;
    if (Math.abs(dx) > SWIPE_THRESH && Math.abs(dx) > Math.abs(dy)) switchLane(dx > 0 ? 1 : -1);
  });
  canvas.addEventListener('click', onCenterTap);
}

window.addEventListener('keydown', onKeyDown);
window.addEventListener('resize', resize);

buildProofNodes();
resize();
updateHUD();
drawDiagram();
if (ctx) {
  render(0);
  requestAnimationFrame(loop);
}

})();
</script>
</body>
</html>
