<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lemma Shards</title>
<style>
  :root {
    --bg: #f4f4f0;
    --fg: #1a2b22;
    --accent: #d32f2f;
    --success: #388e3c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111812;
      --fg: #e0e0e0;
      --accent: #ff5252;
      --success: #69f0ae;
    }
  }
  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background-color: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(244, 244, 240, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.3s;
  }
  @media (prefers-color-scheme: dark) {
    .screen {
      background: rgba(17, 24, 18, 0.85);
    }
  }
  .hidden { opacity: 0; pointer-events: none !important; }
  button {
    pointer-events: auto;
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 16px 32px;
    font-size: 24px;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 24px;
    text-transform: uppercase;
    font-weight: bold;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  }
  button:active {
    transform: translateY(4px);
    box-shadow: none;
  }
  h1 { font-size: 48px; margin: 0; text-align: center; }
  p { font-size: 18px; text-align: center; max-width: 80%; line-height: 1.5; margin-top: 16px; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="start-screen" class="screen">
      <h1>LEMMA</h1>
      <p>Flick matching shards into holes.<br>Sort broken fragments to repair.</p>
      <button data-smoke="start" id="btn-start">Start Proof</button>
    </div>
    <div id="game-over-screen" class="screen hidden">
      <h1>Q.E.D.</h1>
      <p>Score: <span id="final-score">0</span></p>
      <button data-smoke="restart" id="btn-restart">Recalculate</button>
    </div>
  </div>
  <script>
    const SYMBOLS = ['λ', 'Δ', 'Ω', 'Σ', 'π', 'Φ', 'Ψ', 'Γ'];
    let activeSymbols = [];
    
    let gameState = 'start';
    let score = 0;
    let time = 60;
    let level = 1;
    let lastTime = 0;
    
    let holes = [];
    let shards = [];
    let fragments = [];
    let particles = [];
    let popups = [];
    
    let shardSlots = [];
    let traySlots = [];
    
    let aimingShard = null;
    let draggedFragment = null;
    let pointer = { x: 0, y: 0, down: false };
    
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    let width, height;
    
    let fgColor, bgColor, accentColor, successColor;
    
    function initColors() {
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      fgColor = isDark ? '#e0e0e0' : '#1a2b22';
      bgColor = isDark ? '#111812' : '#f4f4f0';
      accentColor = isDark ? '#ff5252' : '#d32f2f';
      successColor = isDark ? '#69f0ae' : '#388e3c';
    }
    
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      setupSlots();
      if (gameState === 'start') draw();
    }
    
    function setupSlots() {
      const slotY = height * 0.72;
      const spacing = width / 4;
      
      if (shardSlots.length === 0) {
        shardSlots = [
          { x: spacing * 1, y: slotY, state: 'empty', shard: null },
          { x: spacing * 2, y: slotY, state: 'empty', shard: null },
          { x: spacing * 3, y: slotY, state: 'empty', shard: null }
        ];
      } else {
        shardSlots[0].x = spacing * 1; shardSlots[0].y = slotY;
        shardSlots[1].x = spacing * 2; shardSlots[1].y = slotY;
        shardSlots[2].x = spacing * 3; shardSlots[2].y = slotY;
      }
      
      const trayY = height * 0.9;
      const traySpacing = width / 4;
      if (traySlots.length === 0) {
        traySlots = [
          { x: traySpacing * 1, y: trayY, expected: 1, frag: null },
          { x: traySpacing * 2, y: trayY, expected: 2, frag: null },
          { x: traySpacing * 3, y: trayY, expected: 3, frag: null }
        ];
      } else {
        traySlots[0].x = traySpacing * 1; traySlots[0].y = trayY;
        traySlots[1].x = traySpacing * 2; traySlots[1].y = trayY;
        traySlots[2].x = traySpacing * 3; traySlots[2].y = trayY;
      }
    }
    
    function startGame() {
      initColors();
      score = 0;
      time = 60;
      level = 1;
      holes = [];
      shards = [];
      fragments = [];
      particles = [];
      popups = [];
      activeSymbols = SYMBOLS.slice(0, 2);
      
      setupSlots();
      
      for(let i=0; i<2; i++) spawnHole();
      
      shardSlots.forEach(slot => {
        slot.state = 'empty';
        spawnShard(slot);
      });
      
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-over-screen').classList.add('hidden');
      
      gameState = 'playing';
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }
    
    function gameOver() {
      gameState = 'gameover';
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over-screen').classList.remove('hidden');
    }
    
    function spawnHole() {
      let valid = false;
      let x, y, radius;
      for(let attempts=0; attempts<10; attempts++) {
        radius = Math.min(width, height) * 0.08;
        x = radius + Math.random() * (width - radius * 2);
        y = height * 0.15 + Math.random() * (height * 0.35);
        valid = true;
        for(let h of holes) {
          if (Math.hypot(h.x - x, h.y - y) < radius * 2.5) {
            valid = false; break;
          }
        }
        if (valid) break;
      }
      const symbol = activeSymbols[Math.floor(Math.random() * activeSymbols.length)];
      const maxLife = Math.max(6, 15 - level);
      holes.push({ x, y, radius, symbol, life: maxLife, maxLife, angle: Math.random() * Math.PI * 2 });
    }
    
    function spawnShard(slot) {
      if (slot.state !== 'empty') return;
      const radius = Math.min(width, height) * 0.06;
      let symbol;
      if (holes.length > 0 && Math.random() > 0.3) {
        symbol = holes[Math.floor(Math.random() * holes.length)].symbol;
      } else {
        symbol = activeSymbols[Math.floor(Math.random() * activeSymbols.length)];
      }
      
      const points = [];
      for(let i=0; i<6; i++) {
        let a = i * Math.PI / 3;
        let r = radius * (0.8 + Math.random() * 0.4);
        points.push({x: Math.cos(a)*r, y: Math.sin(a)*r});
      }
      
      const shard = { 
        x: slot.x, y: slot.y, radius, symbol, 
        vx: 0, vy: 0, state: 'idle', slot: slot,
        points, trail: [], angle: Math.random() * Math.PI * 2
      };
      shards.push(shard);
      slot.shard = shard;
      slot.state = 'filled';
    }
    
    function spawnFragments(x, y) {
      const radius = Math.min(width, height) * 0.04;
      for (let i = 1; i <= 3; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 100 + Math.random() * 200;
        const points = [];
        for(let j=0; j<3; j++) {
          let a = j * Math.PI * 2 / 3 + Math.random() * 0.5;
          let r = radius * (0.8 + Math.random() * 0.4);
          points.push({x: Math.cos(a)*r, y: Math.sin(a)*r});
        }
        fragments.push({
          x, y, radius, number: i,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          state: 'falling',
          angle: Math.random() * Math.PI * 2,
          omega: (Math.random() - 0.5) * 10,
          points
        });
      }
    }
    
    function spawnParticles(x, y, color) {
      for(let i=0; i<15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 150;
        particles.push({
          x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 0.5 + Math.random()*0.5, maxLife: 1, color
        });
      }
    }
    
    function spawnPopup(x, y, text, color) {
      popups.push({ x, y, text, color, life: 1, maxLife: 1 });
    }
    
    function loop(now) {
      if (gameState !== 'playing') return;
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt, now);
      draw(now);
      requestAnimationFrame(loop);
    }
    
    function update(dt, now) {
      time -= dt;
      if (time <= 0) {
        gameOver();
        return;
      }
      
      if (score > 5 && level === 1) { level = 2; activeSymbols = SYMBOLS.slice(0, 3); }
      if (score > 15 && level === 2) { level = 3; activeSymbols = SYMBOLS.slice(0, 4); }
      if (score > 30 && level === 3) { level = 4; activeSymbols = SYMBOLS.slice(0, 5); }
      
      const targetHoles = Math.min(5, level + 1);
      if (holes.length < targetHoles && Math.random() < 0.02) {
        spawnHole();
      }
      
      for (let i = holes.length - 1; i >= 0; i--) {
        let h = holes[i];
        h.life -= dt;
        h.angle += dt * 0.5;
        if (h.life <= 0) {
          time -= 5;
          spawnPopup(h.x, h.y, "-5s", accentColor);
          spawnParticles(h.x, h.y, accentColor);
          navigator.vibrate?.(200);
          holes.splice(i, 1);
        }
      }
      
      for (let i = shards.length - 1; i >= 0; i--) {
        let s = shards[i];
        if (s.state === 'flying') {
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          
          s.trail.push({x: s.x, y: s.y, life: 0.2});
          
          if (s.x < s.radius) { s.x = s.radius; s.vx *= -0.8; }
          if (s.x > width - s.radius) { s.x = width - s.radius; s.vx *= -0.8; }
          if (s.y < s.radius) { s.y = s.radius; s.vy *= -0.8; }
          
          if (s.y > height * 0.75 && s.vy > 0) {
            s.state = 'idle';
            s.vx = 0; s.vy = 0;
            s.trail = [];
          }
          
          let collided = false;
          for (let j = holes.length - 1; j >= 0; j--) {
            let h = holes[j];
            let dist = Math.hypot(s.x - h.x, s.y - h.y);
            if (dist < s.radius + h.radius) {
              if (s.symbol === h.symbol) {
                score++;
                time += 2;
                spawnPopup(h.x, h.y, "+2s", successColor);
                spawnParticles(h.x, h.y, successColor);
                navigator.vibrate?.(100);
                holes.splice(j, 1);
                
                s.slot.state = 'empty';
                spawnShard(s.slot);
                shards.splice(i, 1);
                collided = true;
                break;
              } else {
                spawnParticles(s.x, s.y, accentColor);
                spawnFragments(s.x, s.y);
                navigator.vibrate?.([50, 50, 50]);
                
                s.slot.state = 'broken';
                s.slot.shard = null;
                shards.splice(i, 1);
                collided = true;
                break;
              }
            }
          }
          if(collided) continue;
          
        } else if (s.state === 'idle' && s !== aimingShard) {
          s.x += (s.slot.x - s.x) * 10 * dt;
          s.y += (s.slot.y - s.y) * 10 * dt;
        }
        
        s.trail.forEach(t => t.life -= dt);
        s.trail = s.trail.filter(t => t.life > 0);
      }
      
      const floor = height * 0.82;
      for (let i = fragments.length - 1; i >= 0; i--) {
        let f = fragments[i];
        if (f.state === 'falling') {
          f.vy += 800 * dt;
          f.x += f.vx * dt;
          f.y += f.vy * dt;
          f.angle += f.omega * dt;
          
          if (f.x < f.radius) { f.x = f.radius; f.vx *= -0.8; }
          if (f.x > width - f.radius) { f.x = width - f.radius; f.vx *= -0.8; }
          
          if (f.y > floor - f.radius) {
            f.y = floor - f.radius;
            f.vy *= -0.4;
            f.vx *= 0.8;
            if (Math.abs(f.vy) < 20) f.vy = 0;
            if (Math.abs(f.vx) < 10) f.vx = 0;
          }
        }
        
        if (f.x < -50 || f.x > width + 50 || f.y > height + 50) {
          f.x = width / 2; f.y = height * 0.5; f.vx = 0; f.vy = 0; f.state = 'falling';
        }
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      
      for (let i = popups.length - 1; i >= 0; i--) {
        let p = popups[i];
        p.y -= 50 * dt;
        p.life -= dt;
        if (p.life <= 0) popups.splice(i, 1);
      }
    }
    
    function drawBackground() {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, width, height);
      
      ctx.strokeStyle = fgColor;
      ctx.globalAlpha = 0.05;
      ctx.lineWidth = 1;
      const gridSize = 40;
      ctx.beginPath();
      for(let x = 0; x < width; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, height);
      }
      for(let y = 0; y < height; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(width, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }
    
    function draw(now = 0) {
      drawBackground();
      
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      ctx.beginPath();
      ctx.moveTo(0, height * 0.82);
      ctx.lineTo(width, height * 0.82);
      ctx.strokeStyle = fgColor;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.2;
      ctx.stroke();
      ctx.globalAlpha = 1.0;
      
      let hoveredSlot = null;
      if (draggedFragment) {
        for (let i = 0; i < traySlots.length; i++) {
          let ts = traySlots[i];
          if (Math.hypot(draggedFragment.x - ts.x, draggedFragment.y - ts.y) < 40) {
            if (ts.frag === null && draggedFragment.number === ts.expected) {
              hoveredSlot = ts;
            }
          }
        }
      }
      
      traySlots.forEach(ts => {
        ctx.save();
        ctx.translate(ts.x, ts.y);
        
        if (ts === hoveredSlot) {
          ctx.fillStyle = successColor;
          ctx.globalAlpha = 0.2;
          ctx.fillRect(-25, -25, 50, 50);
          ctx.globalAlpha = 1.0;
        }
        
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = fgColor;
        ctx.lineWidth = 2;
        ctx.globalAlpha = ts.frag ? 0.2 : 0.5;
        ctx.strokeRect(-25, -25, 50, 50);
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = fgColor;
        ctx.font = '16px ui-monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ts.expected, 0, 0);
        ctx.restore();
      });
      
      holes.forEach(h => {
        ctx.save();
        ctx.translate(h.x, h.y);
        ctx.rotate(h.angle);
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(0, 0, h.radius, 0, Math.PI * 2);
        ctx.strokeStyle = fgColor;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.rotate(-h.angle);
        
        let pulse = h.life < 4 ? Math.sin(now / 100) * 2 : 0;
        ctx.beginPath();
        ctx.arc(0, 0, h.radius + 6 + pulse, -Math.PI/2, -Math.PI/2 + (h.life / h.maxLife) * Math.PI * 2);
        ctx.strokeStyle = h.life < 4 ? accentColor : fgColor;
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = fgColor;
        ctx.font = `bold ${h.radius}px ui-monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(h.symbol, 0, 2);
        ctx.restore();
      });
      
      shardSlots.forEach(slot => {
        if (slot.state === 'broken') {
          ctx.save();
          ctx.translate(slot.x, slot.y);
          ctx.beginPath();
          ctx.moveTo(-10, -10); ctx.lineTo(10, 10);
          ctx.moveTo(10, -10); ctx.lineTo(-10, 10);
          ctx.strokeStyle = accentColor;
          ctx.lineWidth = 3;
          ctx.globalAlpha = 0.5;
          ctx.stroke();
          ctx.restore();
        }
      });
      
      shards.forEach(s => {
        if (s.trail.length > 1) {
          ctx.beginPath();
          s.trail.forEach((t, idx) => {
            if (idx === 0) ctx.moveTo(t.x, t.y);
            else ctx.lineTo(t.x, t.y);
          });
          ctx.strokeStyle = fgColor;
          ctx.lineWidth = s.radius * 0.8;
          ctx.globalAlpha = 0.1;
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        }
        
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);
        ctx.beginPath();
        s.points.forEach((p, idx) => {
          if (idx === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.fillStyle = bgColor;
        ctx.fill();
        ctx.strokeStyle = fgColor;
        ctx.lineWidth = 3;
        ctx.stroke();
        
        ctx.rotate(-s.angle);
        ctx.fillStyle = fgColor;
        ctx.font = `bold ${s.radius}px ui-monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(s.symbol, 0, 2);
        ctx.restore();
      });
      
      if (aimingShard && pointer.down) {
        let dx = pointer.x - aimingShard.x;
        let dy = pointer.y - aimingShard.y;
        dx = -dx; dy = -dy;
        
        let dist = Math.hypot(dx, dy);
        if (dist > 20) {
          let maxDist = 150;
          let power = Math.min(dist, maxDist);
          let angle = Math.atan2(dy, dx);
          
          ctx.save();
          ctx.translate(aimingShard.x, aimingShard.y);
          ctx.rotate(angle);
          
          ctx.beginPath();
          ctx.moveTo(aimingShard.radius + 10, 0);
          ctx.lineTo(aimingShard.radius + 10 + power, 0);
          
          ctx.lineTo(aimingShard.radius + 10 + power - 10, -10);
          ctx.moveTo(aimingShard.radius + 10 + power, 0);
          ctx.lineTo(aimingShard.radius + 10 + power - 10, 10);
          
          ctx.strokeStyle = fgColor;
          ctx.lineWidth = 3;
          ctx.globalAlpha = 0.5;
          ctx.stroke();
          ctx.restore();
        }
      }
      
      fragments.forEach(f => {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);
        ctx.beginPath();
        f.points.forEach((p, idx) => {
          if (idx === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.fillStyle = bgColor;
        ctx.fill();
        ctx.strokeStyle = fgColor;
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.rotate(-f.angle);
        ctx.fillStyle = fgColor;
        ctx.font = `bold ${f.radius}px ui-monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.number, 0, 2);
        ctx.restore();
      });
      
      particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;
      
      popups.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.font = 'bold 24px ui-monospace';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
      });
      ctx.globalAlpha = 1.0;
      
      ctx.fillStyle = fgColor;
      ctx.font = '24px ui-monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`Score: ${score}`, 20, 20);
      
      ctx.textAlign = 'right';
      let tStr = Math.ceil(time).toString();
      ctx.fillStyle = time <= 10 ? accentColor : fgColor;
      ctx.fillText(`Time: ${tStr}s`, width - 20, 20);
    }
    
    function getPointerPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }
    
    function onPointerDown(e) {
      if (gameState !== 'playing') return;
      const pos = getPointerPos(e);
      pointer.x = pos.x; pointer.y = pos.y; pointer.down = true;
      
      for (let i = fragments.length - 1; i >= 0; i--) {
        let f = fragments[i];
        if (Math.hypot(f.x - pos.x, f.y - pos.y) < f.radius * 2) {
          draggedFragment = f;
          f.state = 'dragging';
          if (f.slotIndex !== undefined) {
            traySlots[f.slotIndex].frag = null;
            f.slotIndex = undefined;
          }
          return;
        }
      }
      
      for (let i = shards.length - 1; i >= 0; i--) {
        let s = shards[i];
        if (s.state === 'idle' && Math.hypot(s.x - pos.x, s.y - pos.y) < s.radius * 2) {
          aimingShard = s;
          return;
        }
      }
    }
    
    function onPointerMove(e) {
      if (!pointer.down) return;
      const pos = getPointerPos(e);
      pointer.x = pos.x; pointer.y = pos.y;
      
      if (draggedFragment) {
        draggedFragment.x = pos.x;
        draggedFragment.y = pos.y;
        draggedFragment.vx = 0;
        draggedFragment.vy = 0;
      }
    }
    
    function onPointerUp(e) {
      pointer.down = false;
      
      if (draggedFragment) {
        let snapped = false;
        for (let i = 0; i < traySlots.length; i++) {
          let ts = traySlots[i];
          if (Math.hypot(draggedFragment.x - ts.x, draggedFragment.y - ts.y) < 40) {
            if (ts.frag === null && draggedFragment.number === ts.expected) {
              draggedFragment.x = ts.x;
              draggedFragment.y = ts.y;
              draggedFragment.state = 'snapped';
              draggedFragment.slotIndex = i;
              draggedFragment.angle = 0;
              ts.frag = draggedFragment;
              snapped = true;
              navigator.vibrate?.(50);
              checkTrayComplete();
              break;
            }
          }
        }
        if (!snapped) {
          draggedFragment.state = 'falling';
        }
        draggedFragment = null;
      }
      
      if (aimingShard) {
        let dx = aimingShard.x - pointer.x;
        let dy = aimingShard.y - pointer.y;
        let dist = Math.hypot(dx, dy);
        
        if (dist > 20) {
          let maxDist = 150;
          let power = Math.min(dist, maxDist);
          let angle = Math.atan2(dy, dx);
          
          let speed = power * 12; 
          aimingShard.vx = Math.cos(angle) * speed;
          aimingShard.vy = Math.sin(angle) * speed;
          aimingShard.state = 'flying';
          navigator.vibrate?.(50);
        }
        aimingShard = null;
      }
    }
    
    function checkTrayComplete() {
      if (traySlots.every(ts => ts.frag !== null)) {
        traySlots.forEach(ts => {
          let idx = fragments.indexOf(ts.frag);
          if (idx > -1) fragments.splice(idx, 1);
          ts.frag = null;
        });
        
        let brokenSlot = shardSlots.find(s => s.state === 'broken');
        if (brokenSlot) {
          brokenSlot.state = 'empty';
          spawnShard(brokenSlot);
        }
        
        spawnParticles(width/2, height*0.9, successColor);
        navigator.vibrate?.(100);
      }
    }
    
    window.addEventListener('resize', resize);
    
    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      onPointerDown(e);
    }, { passive: false });
    
    window.addEventListener('pointermove', (e) => {
      if (pointer.down && e.target.tagName !== 'BUTTON') {
        e.preventDefault();
      }
      onPointerMove(e);
    }, { passive: false });
    
    window.addEventListener('pointerup', (e) => {
      onPointerUp(e);
    });
    
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);
    
    initColors();
    resize();
  </script>
</body>
</html>
