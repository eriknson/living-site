<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar Grid</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e6;--fg:#1a1814;--muted:#6b6458;--accent:#e8920a;--accent2:#d45a1a;
  --panel:rgba(255,252,245,.88);--border:rgba(26,24,20,.12);--glow:rgba(232,146,10,.35);
  --btn-bg:#1a1814;--btn-fg:#f5f0e6;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0c0b0a;--fg:#f0e8d8;--muted:#9a9080;--accent:#f0a820;--accent2:#ff7040;
    --panel:rgba(18,16,14,.92);--border:rgba(240,232,216,.1);--glow:rgba(240,168,32,.4);
    --btn-bg:#f0a820;--btn-fg:#0c0b0a;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#game{flex:1;width:100%;display:block;touch-action:none;user-select:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hud-val{font-size:18px;font-weight:600;color:var(--fg)}
#timer-bar{position:absolute;top:0;left:0;height:3px;background:var(--accent);transition:width .1s linear;z-index:3;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;pointer-events:none;z-index:10;transition:opacity .4s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:28px 24px;max-width:340px;width:90%;backdrop-filter:blur(12px);pointer-events:none}
.overlay h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px;color:var(--fg)}
.overlay p{font-size:12px;line-height:1.6;color:var(--muted);margin-bottom:20px}
.overlay .tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:160px;
  padding:12px 28px;border:none;border-radius:8px;background:var(--btn-bg);color:var(--btn-fg);
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;pointer-events:auto;transition:transform .15s ease,box-shadow .15s ease}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#combo-pop{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:700;
  color:var(--accent);opacity:0;pointer-events:none;z-index:5;transition:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="timer-bar" style="width:100%"></div>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Energy</span><span class="hud-val" id="score">0/25</span></div>
    <div class="hud-block" style="align-items:center"><span class="hud-label">Sunset</span><span class="hud-val" id="clock">60</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Combo</span><span class="hud-val" id="combo">×1</span></div>
  </div>
  <div id="combo-pop"></div>
  <div id="title-overlay" class="overlay">
    <div class="overlay-card">
      <div class="tag">Golden Hour · Clear Sky</div>
      <h1>Solar Grid</h1>
      <p>Drag the collector to catch falling photons. Light every tile on the block before sunset.</p>
      <button class="btn" data-smoke="start" id="btn-start">Flip the Switch</button>
    </div>
  </div>
  <div id="end-overlay" class="overlay hidden">
    <div class="overlay-card">
      <div class="tag" id="end-tag">Sunset</div>
      <h1 id="end-title">Block Powered</h1>
      <p id="end-msg">The skyline glows amber tonight.</p>
      <button class="btn" data-smoke="restart" id="btn-restart">Run Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas, ctx, W, H, dpr;
var state = 'title';
var collector = { x:0, y:0, w:80, h:24, targetX:0 };
var photons = [];
var shadows = [];
var particles = [];
var grid = [];
var GRID = 5;
var energy = 0;
var combo = 0;
var maxCombo = 0;
var comboTimer = 0;
var timeLeft = 60;
var elapsed = 0;
var sunAngle = 0;
var sunX = 0.5;
var fallSpeed = 1;
var spawnRate = 0.85;
var shadowRate = 0.16;
var lastSpawn = 0;
var lastShadow = 0;
var buildings = [];
var audioCtx = null;
var dragging = false;
var keys = {};
var rafId = 0;

function initCanvas(){
  canvas = document.getElementById('game');
  if(!canvas) return;
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
}

function resize(){
  if(!canvas) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight - 0;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  collector.y = H * 0.82;
  collector.w = Math.max(70, W * 0.22);
  collector.h = Math.max(20, H * 0.028);
  if(state === 'title') collector.x = W / 2;
  collector.targetX = collector.x;
  initBuildings();
  initGrid();
}

function initBuildings(){
  buildings = [];
  var count = Math.floor(W / 45) + 2;
  for(var i = 0; i < count; i++){
    var seed = i * 7 + 3;
    buildings.push({
      x: i * (W / count) + (seed % 10),
      w: W / count * (0.6 + (seed % 5) * 0.1),
      h: H * (0.08 + (seed % 7) * 0.025),
      floors: 2 + (seed % 6),
      seed: seed
    });
  }
}

function initGrid(){
  grid = [];
  for(var r = 0; r < GRID; r++){
    grid[r] = [];
    for(var c = 0; c < GRID; c++) grid[r][c] = 0;
  }
}

function litCount(){
  var n = 0;
  for(var r = 0; r < GRID; r++)
    for(var c = 0; c < GRID; c++)
      if(grid[r][c]) n++;
  return n;
}

function lightTile(){
  var unlit = [];
  for(var r = 0; r < GRID; r++)
    for(var c = 0; c < GRID; c++)
      if(!grid[r][c]) unlit.push({r:r,c:c});
  if(unlit.length === 0) return false;
  var pick = unlit[Math.floor(Math.random() * unlit.length)];
  grid[pick.r][pick.c] = 1;
  spawnBurst(gridX(pick.c) + gridSize()/2, gridY(pick.r) + gridSize()/2, '#f0a820', 8);
  playTone(440 + litCount() * 20, 0.08, 'sine');
  try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
  return true;
}

function gridSize(){ return Math.min(W * 0.72, 280) / GRID; }
function gridOX(){ return (W - gridSize() * GRID) / 2; }
function gridOY(){ return H * 0.52; }
function gridX(c){ return gridOX() + c * gridSize(); }
function gridY(r){ return gridOY() + r * gridSize(); }

function resetGame(){
  photons = []; shadows = []; particles = [];
  energy = 0; combo = 0; maxCombo = 0; comboTimer = 0;
  timeLeft = 60; elapsed = 0; sunAngle = 0; sunX = 0.5;
  fallSpeed = 1; spawnRate = 0.85; shadowRate = 0.16;
  lastSpawn = 0; lastShadow = 0;
  initGrid();
  collector.x = W / 2;
  collector.targetX = collector.x;
  updateHUD();
  document.getElementById('timer-bar').style.width = '100%';
}

function startGame(){
  resetGame();
  state = 'playing';
  document.getElementById('title-overlay').classList.add('hidden');
  document.getElementById('end-overlay').classList.add('hidden');
  initAudio();
}

function endGame(won){
  state = 'over';
  var tag = document.getElementById('end-tag');
  var title = document.getElementById('end-title');
  var msg = document.getElementById('end-msg');
  if(won){
    tag.textContent = 'Powered';
    title.textContent = 'Block Online';
    msg.textContent = 'All ' + (GRID*GRID) + ' tiles lit in ' + Math.floor(60 - timeLeft) + 's. Max combo ×' + maxCombo + '.';
    playTone(523, 0.15, 'sine');
    setTimeout(function(){ playTone(659, 0.15, 'sine'); }, 120);
    setTimeout(function(){ playTone(784, 0.2, 'sine'); }, 240);
  } else {
    tag.textContent = 'Sunset';
    title.textContent = 'Lights Out';
    msg.textContent = litCount() + '/' + (GRID*GRID) + ' tiles powered. Max combo ×' + maxCombo + '.';
    playTone(220, 0.3, 'triangle');
  }
  document.getElementById('end-overlay').classList.remove('hidden');
  try{ navigator.vibrate && navigator.vibrate(won ? [20,40,20] : 30); }catch(e){}
}

function initAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}

function playTone(freq, dur, type){
  if(!audioCtx) return;
  try{
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function spawnPhoton(){
  var margin = W * 0.08;
  var sx = sunX * W;
  var spread = sunAngle * W * 0.35;
  photons.push({
    x: sx + (Math.random() - 0.5) * spread,
    y: -10,
    vx: (Math.random() - 0.5) * sunAngle * 1.8,
    vy: 0,
    r: 5 + Math.random() * 3,
    life: 1,
    type: 'photon'
  });
}

function spawnShadow(){
  shadows.push({
    x: Math.random() * (W - 40) + 20,
    y: -20,
    w: 30 + Math.random() * 40,
    h: 12 + Math.random() * 8,
    vy: (1.2 + fallSpeed * 0.4) * (H / 700),
    rot: (Math.random() - 0.5) * 0.3
  });
}

function spawnBurst(x, y, color, n){
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var s = 1 + Math.random() * 3;
    particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color:color, r:2+Math.random()*2 });
  }
}

function updateHUD(){
  document.getElementById('score').textContent = litCount() + '/' + (GRID*GRID);
  document.getElementById('clock').textContent = Math.ceil(timeLeft);
  document.getElementById('combo').textContent = '×' + Math.max(1, combo);
}

function showComboPop(text){
  var el = document.getElementById('combo-pop');
  el.textContent = text;
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%,-50%) scale(1.2)';
  el.style.transition = 'none';
  requestAnimationFrame(function(){
    el.style.transition = 'opacity .6s ease, transform .6s ease';
    el.style.opacity = '0';
    el.style.transform = 'translate(-50%,-60%) scale(1)';
  });
}

function update(dt){
  if(state !== 'playing') return;

  elapsed += dt;
  timeLeft = Math.max(0, 60 - elapsed);
  document.getElementById('timer-bar').style.width = (timeLeft / 60 * 100) + '%';

  var prog = elapsed / 60;
  sunAngle = prog * 1.4;
  sunX = 0.5 + Math.sin(elapsed * 0.15) * 0.25 * prog;
  fallSpeed = 1 + prog * 2.2;
  spawnRate = 0.55 + prog * 0.7;
  shadowRate = 0.18 + prog * 0.45;

  if(comboTimer > 0){ comboTimer -= dt; if(comboTimer <= 0) combo = 0; }

  lastSpawn += dt;
  if(lastSpawn > 1 / spawnRate){ lastSpawn = 0; spawnPhoton(); }

  lastShadow += dt;
  if(lastShadow > 1 / shadowRate){ lastShadow = 0; spawnShadow(); }

  if(!dragging){
    if(keys['ArrowLeft']||keys['a']||keys['A']) collector.targetX -= 400 * dt;
    if(keys['ArrowRight']||keys['d']||keys['D']) collector.targetX += 400 * dt;
  }
  collector.targetX = Math.max(collector.w/2, Math.min(W - collector.w/2, collector.targetX));
  collector.x += (collector.targetX - collector.x) * Math.min(1, dt * 14);

  var spd = (2.5 + fallSpeed * 1.8) * (H / 700);
  for(var i = photons.length - 1; i >= 0; i--){
    var p = photons[i];
    p.vy += spd * dt * 60 * 0.016;
    p.x += p.vx * dt * 60;
    p.y += p.vy;

    var inShadow = false;
    for(var s = 0; s < shadows.length; s++){
      var sh = shadows[s];
      if(p.x > sh.x && p.x < sh.x + sh.w && p.y > sh.y && p.y < sh.y + sh.h){ inShadow = true; break; }
    }
    if(inShadow) p.life -= dt * 2;

    if(p.y > H + 20 || p.life <= 0){ photons.splice(i, 1); continue; }

    if(p.y + p.r > collector.y - collector.h/2 &&
       p.y - p.r < collector.y + collector.h/2 &&
       p.x > collector.x - collector.w/2 &&
       p.x < collector.x + collector.w/2){
      photons.splice(i, 1);
      combo++;
      comboTimer = 2.5;
      if(combo > maxCombo) maxCombo = combo;
      var mult = Math.min(combo, 10);
      energy += mult;
      spawnBurst(p.x, p.y, '#ffd060', 10);
      playTone(300 + combo * 30, 0.06, 'sine');
      if(combo >= 5 && combo % 5 === 0) showComboPop('×' + combo + '!');
      while(energy >= 2){
        energy -= 2;
        if(!lightTile()) break;
      }
      updateHUD();
      if(litCount() >= GRID * GRID){ endGame(true); return; }
    }
  }

  for(var j = shadows.length - 1; j >= 0; j--){
    var sh = shadows[j];
    sh.y += sh.vy * dt * 60;
    if(sh.y > H + 30) shadows.splice(j, 1);
    else if(sh.y + sh.h > collector.y - collector.h/2 &&
            sh.y < collector.y + collector.h/2 &&
            sh.x + sh.w > collector.x - collector.w/2 &&
            sh.x < collector.x + collector.w/2){
      shadows.splice(j, 1);
      combo = 0; comboTimer = 0;
      spawnBurst(collector.x, collector.y, '#555', 6);
      playTone(120, 0.12, 'sawtooth');
      try{ navigator.vibrate && navigator.vibrate(40); }catch(e){}
      updateHUD();
    }
  }

  for(var k = particles.length - 1; k >= 0; k--){
    var pt = particles[k];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05;
    pt.life -= dt * 2.5;
    if(pt.life <= 0) particles.splice(k, 1);
  }

  updateHUD();
  if(timeLeft <= 0) endGame(false);
}

function isDark(){
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function draw(){
  if(!ctx) return;
  var dark = isDark();
  var skyTop = dark ? '#0a0908' : '#e8dcc8';
  var skyBot = dark ? '#1a1410' : '#f5c878';
  var grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, skyTop);
  grad.addColorStop(0.55, dark ? '#2a1e14' : '#f0b860');
  grad.addColorStop(1, skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  drawSun(dark);
  drawBuildings(dark);
  drawGrid(dark);
  drawShadows(dark);
  drawPhotons();
  drawCollector(dark);
  drawParticles();

  if(state === 'title') drawTitlePreview(dark);
}

function drawSun(dark){
  var sx = sunX * W;
  var sy = H * 0.1;
  var prog = state === 'playing' ? elapsed / 60 : 0;
  var radius = 28 + prog * 8;
  var sunColor = dark ? '#f0a030' : '#ff9020';

  ctx.save();
  ctx.globalAlpha = 0.15 + prog * 0.1;
  ctx.shadowBlur = 60;
  ctx.shadowColor = sunColor;
  ctx.beginPath();
  ctx.arc(sx, sy, radius, 0, Math.PI * 2);
  ctx.fillStyle = sunColor;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  ctx.strokeStyle = sunColor;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(sx, sy, radius, 0, Math.PI * 2);
  ctx.stroke();

  for(var i = 0; i < 8; i++){
    var a = (i / 8) * Math.PI * 2 + elapsed * 0.2;
    ctx.beginPath();
    ctx.moveTo(sx + Math.cos(a) * (radius + 6), sy + Math.sin(a) * (radius + 6));
    ctx.lineTo(sx + Math.cos(a) * (radius + 14), sy + Math.sin(a) * (radius + 14));
    ctx.stroke();
  }
  ctx.restore();
}

function drawBuildings(dark){
  var baseY = gridOY() - 4;
  var lineCol = dark ? 'rgba(240,200,120,0.25)' : 'rgba(80,50,20,0.2)';
  var winLit = dark ? 'rgba(240,168,48,0.7)' : 'rgba(200,120,20,0.5)';
  var winOff = dark ? 'rgba(240,200,120,0.08)' : 'rgba(80,50,20,0.08)';

  for(var i = 0; i < buildings.length; i++){
    var b = buildings[i];
    var bx = b.x;
    var by = baseY - b.h;

    ctx.strokeStyle = lineCol;
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, b.w, b.h);

    var fw = b.w / (b.floors > 4 ? 3 : 2);
    var fh = b.h / b.floors;
    for(var f = 0; f < b.floors; f++){
      for(var w = 0; w < Math.floor(b.w / fw); w++){
        var lit = state === 'playing' && litCount() > 0 && ((b.seed + f * 3 + w * 11) % 10) < (litCount() / 25) * 8;
        ctx.fillStyle = lit ? winLit : winOff;
        ctx.fillRect(bx + w * fw + 2, by + f * fh + 2, fw - 4, fh - 4);
      }
    }
  }
}

function drawGrid(dark){
  var gs = gridSize();
  var ox = gridOX();
  var oy = gridOY();
  var lineCol = dark ? 'rgba(240,168,48,0.5)' : 'rgba(180,100,20,0.45)';
  var litCol = dark ? 'rgba(240,168,48,0.35)' : 'rgba(255,180,40,0.3)';
  var litCore = dark ? '#f0a820' : '#e8920a';

  ctx.strokeStyle = lineCol;
  ctx.lineWidth = 1;
  for(var r = 0; r < GRID; r++){
    for(var c = 0; c < GRID; c++){
      var x = ox + c * gs;
      var y = oy + r * gs;
      if(grid[r][c]){
        ctx.fillStyle = litCol;
        ctx.fillRect(x + 1, y + 1, gs - 2, gs - 2);
        ctx.shadowBlur = 12;
        ctx.shadowColor = litCore;
        ctx.fillStyle = litCore;
        ctx.globalAlpha = 0.6 + Math.sin(elapsed * 4 + r + c) * 0.2;
        ctx.beginPath();
        ctx.arc(x + gs/2, y + gs/2, gs * 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
      ctx.strokeRect(x, y, gs, gs);
    }
  }
}

function drawShadows(dark){
  for(var i = 0; i < shadows.length; i++){
    var sh = shadows[i];
    ctx.save();
    ctx.translate(sh.x + sh.w/2, sh.y + sh.h/2);
    ctx.rotate(sh.rot);
    ctx.fillStyle = dark ? 'rgba(0,0,0,0.55)' : 'rgba(30,20,10,0.35)';
    ctx.fillRect(-sh.w/2, -sh.h/2, sh.w, sh.h);
    ctx.strokeStyle = dark ? 'rgba(80,60,40,0.4)' : 'rgba(60,40,20,0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(-sh.w/2, -sh.h/2, sh.w, sh.h);
    ctx.restore();
  }
}

function drawPhotons(){
  for(var i = 0; i < photons.length; i++){
    var p = photons[i];
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#ffd040';
    ctx.fillStyle = '#ffe080';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f0a020';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
}

function drawCollector(dark){
  var cx = collector.x, cy = collector.y, cw = collector.w, ch = collector.h;
  var col = dark ? '#f0a820' : '#c87810';

  ctx.save();
  ctx.translate(cx, cy);

  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-cw/2, ch/2);
  ctx.quadraticCurveTo(0, -ch * 1.8, cw/2, ch/2);
  ctx.stroke();

  ctx.fillStyle = dark ? 'rgba(240,168,32,0.15)' : 'rgba(232,146,10,0.12)';
  ctx.beginPath();
  ctx.moveTo(-cw/2 + 4, ch/2 - 2);
  ctx.quadraticCurveTo(0, -ch * 1.4, cw/2 - 4, ch/2 - 2);
  ctx.closePath();
  ctx.fill();

  for(var i = -3; i <= 3; i++){
    ctx.beginPath();
    ctx.moveTo(i * (cw/8), ch/2 - 2);
    ctx.lineTo(i * (cw/8) * 0.6, -ch * 0.5);
    ctx.stroke();
  }

  ctx.fillStyle = col;
  ctx.fillRect(-4, ch/2, 8, 6);
  ctx.restore();
}

function drawParticles(){
  for(var i = 0; i < particles.length; i++){
    var pt = particles[i];
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r * pt.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTitlePreview(dark){
  ctx.fillStyle = dark ? 'rgba(12,11,10,0.3)' : 'rgba(245,240,230,0.25)';
  ctx.fillRect(0, H * 0.4, W, H * 0.6);
}

var lastTime = 0;
function loop(ts){
  var dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  update(dt);
  draw();
  rafId = requestAnimationFrame(loop);
}

function getPos(e){
  var rect = canvas.getBoundingClientRect();
  var t = e.touches && e.touches[0] ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

function onPointerDown(e){
  if(state !== 'playing') return;
  e.preventDefault();
  dragging = true;
  var p = getPos(e);
  collector.targetX = p.x;
}

function onPointerMove(e){
  if(!dragging || state !== 'playing') return;
  e.preventDefault();
  var p = getPos(e);
  collector.targetX = p.x;
}

function onPointerUp(e){
  dragging = false;
}

function onKeyDown(e){
  keys[e.key] = true;
}
function onKeyUp(e){
  keys[e.key] = false;
}

function onCenterTap(e){
  /* smoke test: tap center must not throw */
  e.preventDefault();
}

function setupEvents(){
  var btnStart = document.getElementById('btn-start');
  var btnRestart = document.getElementById('btn-restart');
  if(btnStart) btnStart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
  if(btnRestart) btnRestart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

  canvas.addEventListener('touchstart', onPointerDown, {passive:false});
  canvas.addEventListener('touchmove', onPointerMove, {passive:false});
  canvas.addEventListener('touchend', onPointerUp);
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('mouseleave', onPointerUp);

  canvas.addEventListener('touchstart', onCenterTap, {passive:false});

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
}

initCanvas();
setupEvents();
lastTime = performance.now();
rafId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
