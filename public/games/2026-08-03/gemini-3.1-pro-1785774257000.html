<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agent Sort</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #24292f;
      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(9, 105, 218, 0.2);
      --neon-cyan: #0969da;
      --neon-yellow: #bf8700;
      --neon-green: #1a7f37;
      --neon-orange: #bc4c00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #c9d1d9;
        --glass-bg: rgba(13, 17, 23, 0.6);
        --glass-border: rgba(88, 166, 255, 0.2);
        --neon-cyan: #58a6ff;
        --neon-yellow: #e3b341;
        --neon-green: #3fb950;
        --neon-orange: #f0883e;
      }
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100dvw;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none; /* Strict compliance: do not swallow clicks */
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.3s;
      z-index: 10;
    }
    .hidden {
      opacity: 0;
    }
    button {
      pointer-events: auto; /* Re-enable click only on button */
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 10px var(--glass-border), inset 0 0 10px var(--glass-border);
      transition: transform 0.1s, background 0.2s;
      z-index: 20;
    }
    button:active {
      transform: scale(0.95);
      background: var(--glass-border);
    }
    .title {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 10px var(--glass-border);
    }
    .subtitle {
      font-size: 1rem;
      margin-bottom: 2rem;
      opacity: 0.8;
      text-align: center;
      max-width: 80%;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="start-screen" class="screen">
      <div class="title">Agent Sort</div>
      <div class="subtitle">Flick agents into matching queues before sunrise.<br><br>Drag up to flick.</div>
      <button data-smoke="start" id="start-btn">Initialize Shift</button>
    </div>
    <div id="game-over-screen" class="screen hidden">
      <div class="title">Sunrise Reached</div>
      <div class="subtitle" id="final-score">Tasks Processed: 0</div>
      <button data-smoke="restart" id="restart-btn">Next Shift</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const fontStack = "ui-monospace, 'SFMono-Regular', Menlo, monospace";
    
    let w, h, lastTime = 0;
    let gameState = 'menu';
    let score = 0, timeLeft = 45, isGameOver = false;
    
    let lanes = [], tokens = [], queue = [], activeToken = null;
    let particles = [], floatingTexts = [], laneSwapTime = 0;
    
    // Audio Context (lazy loaded)
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = window.AudioContext ? new AudioContext() : (window.webkitAudioContext ? new webkitAudioContext() : null);
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    function playTone(freq, type, duration, vol) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // Theme Management
    let theme = {};
    function updateTheme() {
      const isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      theme = {
        bg: isLight ? '#ffffff' : '#0d1117',
        text: isLight ? '#24292f' : '#c9d1d9',
        glassBorder: isLight ? 'rgba(9, 105, 218, 0.2)' : 'rgba(88, 166, 255, 0.2)',
        cyan: isLight ? 'rgb(9, 105, 218)' : 'rgb(88, 166, 255)',
        yellow: isLight ? 'rgb(191, 135, 0)' : 'rgb(227, 179, 65)',
        orange: isLight ? 'rgb(188, 76, 0)' : 'rgb(240, 136, 62)',
        green: isLight ? 'rgb(26, 127, 55)' : 'rgb(63, 185, 80)'
      };
    }
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateTheme);
    }
    
    function alpha(rgbStr, a) {
      return rgbStr.replace('rgb', 'rgba').replace(')', `, ${a})`);
    }

    function resize() {
      w = document.body.clientWidth;
      h = document.body.clientHeight;
      canvas.width = w;
      canvas.height = h;
    }
    window.addEventListener('resize', resize);

    // Game Actions
    function startGame() {
      initAudio();
      score = 0; timeLeft = 45;
      gameState = 'playing'; isGameOver = false;
      tokens = []; queue = []; activeToken = null; particles = []; floatingTexts = [];
      laneSwapTime = performance.now() + 8000;
      
      lanes = [
        {x: 0, y: 80, width: 100, height: 70, active: true, color: 'cyan', shape: 'circle', flash: 0},
        {x: 0, y: 80, width: 100, height: 70, active: false, color: 'yellow', shape: 'triangle', flash: 0},
        {x: 0, y: 80, width: 100, height: 70, active: true, color: 'orange', shape: 'square', flash: 0}
      ];
      
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-over-screen').classList.add('hidden');
    }

    function endGame() {
      gameState = 'gameover'; isGameOver = true;
      document.getElementById('final-score').innerText = `Tasks Processed: ${score}`;
      document.getElementById('game-over-screen').classList.remove('hidden');
      if (activeToken) activeToken.isDragging = false;
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    // Input Handling
    let touchHistory = [];
    canvas.addEventListener('pointerdown', (e) => {
      if (gameState !== 'playing') return;
      e.preventDefault();
      if (!activeToken) return;
      
      let dx = e.clientX - activeToken.x;
      let dy = e.clientY - activeToken.y;
      if (Math.sqrt(dx*dx + dy*dy) < activeToken.radius * 3.5) {
        activeToken.isDragging = true;
        touchHistory = [{x: e.clientX, y: e.clientY, time: performance.now()}];
      }
    }, {passive: false});

    canvas.addEventListener('pointermove', (e) => {
      if (gameState !== 'playing') return;
      e.preventDefault();
      if (activeToken && activeToken.isDragging) {
        activeToken.x = e.clientX;
        activeToken.y = e.clientY;
        touchHistory.push({x: e.clientX, y: e.clientY, time: performance.now()});
        if (touchHistory.length > 6) touchHistory.shift();
      }
    }, {passive: false});

    function releaseToken() {
      if (gameState !== 'playing') return;
      if (activeToken && activeToken.isDragging) {
        activeToken.isDragging = false;
        let now = performance.now();
        touchHistory = touchHistory.filter(t => now - t.time < 120);
        
        if (touchHistory.length > 1) {
          let oldest = touchHistory[0];
          let newest = touchHistory[touchHistory.length - 1];
          let dt = newest.time - oldest.time;
          if (dt > 0) {
            let vx = (newest.x - oldest.x) / dt;
            let vy = (newest.y - oldest.y) / dt;
            
            if (vy < -0.4) {
              activeToken.vx = vx * 22; 
              activeToken.vy = vy * 22;
              tokens.push(activeToken);
              activeToken = null;
              playTone(300, 'sine', 0.05, 0.05);
              return;
            }
          }
        }
      }
    }
    canvas.addEventListener('pointerup', releaseToken);
    canvas.addEventListener('pointercancel', releaseToken);

    const keys = {};
    function handleKeyDown(e) {
      keys[e.code] = true;
      if (gameState !== 'playing') return;
      if ((e.code === 'Space' || e.code === 'ArrowUp') && activeToken && !activeToken.isDragging) {
        e.preventDefault();
        activeToken.vx = 0;
        activeToken.vy = -15;
        tokens.push(activeToken);
        activeToken = null;
        playTone(300, 'sine', 0.05, 0.05);
      }
    }
    function handleKeyUp(e) {
      keys[e.code] = false;
    }
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);

    // Game Logic
    function getLevel() {
      if (score < 10) return 1;
      if (score < 25) return 2;
      if (score < 45) return 3;
      if (score < 70) return 4;
      return 5;
    }

    function spawnParticles(x, y, color) {
      for (let i=0; i<12; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
          radius: Math.random() * 3 + 1, color: color,
          life: 1.0, decay: Math.random() * 0.05 + 0.02
        });
      }
    }

    function hit(tok, lane) {
      score++;
      timeLeft = Math.min(timeLeft + 1, 45);
      spawnParticles(tok.x, 150, theme[tok.color]);
      lane.flash = 1.0;
      if(navigator.vibrate) try{ navigator.vibrate(10); }catch(e){}
      playTone(600 + (score%10)*20, 'sine', 0.1, 0.08);
      floatingTexts.push({x: tok.x, y: 130, text: "+1", color: theme[tok.color], life: 1.0});
    }

    function miss(tok) {
      timeLeft -= 3;
      spawnParticles(tok.x, tok.y, theme.text);
      if(navigator.vibrate) try{ navigator.vibrate([30, 50, 30]); }catch(e){}
      playTone(150, 'sawtooth', 0.2, 0.1);
      floatingTexts.push({x: tok.x, y: tok.y - 20, text: "-3s", color: theme.orange, life: 1.0});
    }

    function update(dt, time) {
      if (gameState === 'playing') {
        let level = getLevel();
        let timeMulti = level >= 5 ? 1.4 : (level >= 4 ? 1.2 : 1.0);
        timeLeft -= (dt / 1000) * timeMulti;
        if (timeLeft <= 0 && !isGameOver) endGame();
        
        // Update Lanes
        let padding = 20, spacing = 15;
        let availableW = w - padding * 2;
        let targetLaneW = (availableW - spacing * 2) / 3;
        if (level >= 3) targetLaneW *= 0.85;
        if (level >= 5) targetLaneW *= 0.75;
        
        lanes.forEach((lane, i) => {
          lane.width += (targetLaneW - lane.width) * 0.1;
          let totalW = targetLaneW * 3 + spacing * 2;
          let startX = (w - totalW) / 2;
          let targetX = startX + i * (targetLaneW + spacing);
          if (level >= 3) targetX += Math.sin(time / 800 + i * 2) * (w * 0.08);
          lane.x += (targetX - lane.x) * 0.1;
        });
        
        if (level === 1) lanes[1].active = false;
        else if (level >= 2 && !lanes[1].active) {
          lanes[1].active = true;
          playTone(500, 'square', 0.2, 0.1);
        }
        
        if (level >= 4 && time > laneSwapTime) {
          laneSwapTime = time + 7000;
          let active = lanes.filter(l => l.active);
          if (active.length >= 2) {
            let a = Math.floor(Math.random() * active.length);
            let b = (a + 1 + Math.floor(Math.random() * (active.length - 1))) % active.length;
            let tc = active[a].color, ts = active[a].shape;
            active[a].color = active[b].color; active[a].shape = active[b].shape;
            active[b].color = tc; active[b].shape = ts;
            active[a].flash = 1.0; active[b].flash = 1.0;
            playTone(400, 'triangle', 0.1, 0.1);
            if(navigator.vibrate) try{ navigator.vibrate(20); }catch(e){}
          }
        }
        
        // Update Queue
        let activeLanes = lanes.filter(l => l.active);
        while (queue.length < 4) {
          let type = activeLanes[Math.floor(Math.random() * activeLanes.length)];
          queue.push({
            x: w/2, y: h + 100 + queue.length * 60,
            color: type.color, shape: type.shape,
            vx: 0, vy: 0, radius: 24, isDragging: false
          });
        }
        
        queue.forEach((tok, i) => {
          let targetY = h - 50 + i * 55;
          tok.y += (targetY - tok.y) * 0.15;
          tok.x += (w/2 - tok.x) * 0.15;
        });
        
        if (!activeToken && queue.length > 0) activeToken = queue.shift();
        if (activeToken && !activeToken.isDragging) {
          if (keys['ArrowLeft'] || keys['KeyA']) activeToken.x -= 8;
          if (keys['ArrowRight'] || keys['KeyD']) activeToken.x += 8;
          activeToken.x += (w/2 - activeToken.x) * 0.2;
          activeToken.y += (h - 140 - activeToken.y) * 0.2;
        }
        
        // Update Flying Tokens
        let laneBottom = 150;
        for (let i = tokens.length - 1; i >= 0; i--) {
          let tok = tokens[i];
          let prevY = tok.y;
          tok.x += tok.vx; tok.y += tok.vy;
          tok.vx *= 0.99; tok.vy *= 0.99;
          
          if (tok.x - tok.radius < 0) { tok.x = tok.radius; tok.vx *= -0.7; }
          if (tok.x + tok.radius > w) { tok.x = w - tok.radius; tok.vx *= -0.7; }
          if (tok.y - tok.radius < 40) { miss(tok); tokens.splice(i, 1); continue; }
          if (Math.abs(tok.vx) < 0.5 && Math.abs(tok.vy) < 0.5) { miss(tok); tokens.splice(i, 1); continue; }
          
          if (prevY >= laneBottom && tok.y < laneBottom) {
            let hitLane = lanes.find(l => l.active && tok.x > l.x && tok.x < l.x + l.width);
            if (hitLane) {
              if (hitLane.color === tok.color) hit(tok, hitLane);
              else miss(tok);
              tokens.splice(i, 1);
              continue;
            }
          }
        }
      }
      
      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= p.decay; });
      particles = particles.filter(p => p.life > 0);
      floatingTexts.forEach(ft => { ft.y -= 1; ft.life -= 0.02; });
      floatingTexts = floatingTexts.filter(ft => ft.life > 0);
    }

    function drawShape(x, y, shape, color, size, isFill) {
      ctx.beginPath();
      if (shape === 'circle') ctx.arc(x, y, size, 0, Math.PI*2);
      else if (shape === 'square') ctx.rect(x - size, y - size, size*2, size*2);
      else if (shape === 'triangle') {
        ctx.moveTo(x, y - size); ctx.lineTo(x + size, y + size); ctx.lineTo(x - size, y + size); ctx.closePath();
      } else if (shape === 'diamond') {
        ctx.moveTo(x, y - size); ctx.lineTo(x + size, y); ctx.lineTo(x, y + size); ctx.lineTo(x - size, y); ctx.closePath();
      }
      if (isFill) { ctx.fillStyle = color; ctx.fill(); }
      else { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); }
    }

    function draw() {
      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, w, h);
      
      ctx.strokeStyle = theme.glassBorder;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = (w/2)%40; x < w; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      for (let y = (h/2)%40; y < h; y += 40) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();
      
      if (gameState === 'playing') {
        let progress = 1 - (timeLeft / 45);
        if (progress > 0) {
          let grad = ctx.createLinearGradient(0, h, 0, h - h * progress * 0.6);
          grad.addColorStop(0, alpha(theme.orange, 0.2));
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }
      }
      
      lanes.forEach(lane => {
        let color = lane.active ? theme[lane.color] : theme.glassBorder;
        ctx.fillStyle = lane.active ? alpha(theme.text, 0.03) : 'transparent';
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(lane.x, lane.y, lane.width, lane.height, 8);
        else ctx.rect(lane.x, lane.y, lane.width, lane.height);
        ctx.fill();
        
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
        if (lane.active) drawShape(lane.x + lane.width/2, lane.y + lane.height/2, lane.shape, color, 12, true);
        
        if (lane.flash > 0) {
          ctx.fillStyle = alpha(color, lane.flash * 0.4);
          ctx.fill();
          lane.flash -= 0.05;
        }
      });
      
      [...queue, activeToken, ...tokens].forEach(tok => {
        if (!tok) return;
        ctx.shadowBlur = 10; ctx.shadowColor = theme[tok.color];
        ctx.fillStyle = theme.bg;
        ctx.beginPath(); ctx.arc(tok.x, tok.y, tok.radius, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = theme[tok.color]; ctx.lineWidth = 3; ctx.stroke();
        ctx.shadowBlur = 0;
        drawShape(tok.x, tok.y, tok.shape, theme[tok.color], 8, false);
      });
      
      particles.forEach(p => {
        ctx.fillStyle = alpha(p.color, Math.max(0, p.life));
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
      });
      
      ctx.font = `bold 22px ${fontStack}`;
      ctx.textAlign = "center";
      floatingTexts.forEach(ft => {
        ctx.fillStyle = alpha(ft.color, Math.max(0, ft.life));
        ctx.fillText(ft.text, ft.x, ft.y);
      });
      
      if (gameState === 'playing') {
        ctx.fillStyle = theme.text;
        ctx.font = `bold 16px ${fontStack}`;
        ctx.textAlign = "left";
        ctx.fillText(`PROCESSED: ${score}`, 20, 40);
        
        ctx.textAlign = "right";
        ctx.fillStyle = timeLeft < 10 ? theme.orange : theme.text;
        ctx.fillText(`SUNRISE: ${Math.ceil(timeLeft)}s`, w - 20, 40);
      }
    }

    function loop(time) {
      requestAnimationFrame(loop);
      try {
        let dt = time - lastTime;
        lastTime = time;
        if (dt > 100) dt = 16;
        update(dt, time);
        draw();
      } catch(e) {}
    }

    try {
      updateTheme();
      resize();
      requestAnimationFrame(loop);
    } catch(e) {}

  </script>
</body>
</html>
