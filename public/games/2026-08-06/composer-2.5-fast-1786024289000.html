<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fogline Run</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8eef2;--fg:#1a2830;--muted:#5a6d78;--accent:#d4882a;--accent2:#e8a84a;
  --panel:rgba(255,255,255,.88);--lane:rgba(26,40,48,.06);--hud:rgba(255,255,255,.72);
  --fog1:rgba(180,195,205,.55);--fog2:rgba(140,160,175,.45);--gold:#f0c040;
  --danger:#c44a3a;--success:#3a8a6a;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f161c;--fg:#dce8ef;--muted:#7a909c;--accent:#e8a040;--accent2:#f0c060;
    --panel:rgba(18,28,36,.92);--lane:rgba(220,232,239,.04);--hud:rgba(18,28,36,.78);
    --fog1:rgba(60,80,95,.65);--fog2:rgba(40,55,70,.55);--gold:#ffd060;
    --danger:#e06050;--success:#50b080;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{display:block;width:100%;flex:1;touch-action:none;user-select:none;-webkit-user-select:none}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none;z-index:2}
#hud{display:flex;justify-content:space-between;align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  font-size:clamp(11px,2.8vw,13px);letter-spacing:.04em;opacity:0;transition:opacity .35s}
#hud.on{opacity:1}
.hud-block{background:var(--hud);backdrop-filter:blur(8px);padding:8px 12px;border-radius:6px;line-height:1.35}
.hud-block span{display:block;font-size:.75em;color:var(--muted);text-transform:uppercase}
.hud-block strong{font-size:1.15em;color:var(--fg)}
#streak strong{color:var(--accent)}
#overlay{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.panel{text-align:center;max-width:340px;padding:28px 24px;background:var(--panel);backdrop-filter:blur(12px);
  border-radius:14px;border:1px solid rgba(128,148,160,.18);box-shadow:0 12px 40px rgba(0,0,0,.12);
  transform:translateY(8px);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.panel.on{opacity:1;transform:translateY(0);pointer-events:none}
.panel h1{font-size:clamp(1.4rem,5vw,1.75rem);font-weight:600;letter-spacing:-.02em;margin-bottom:6px;
  background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.panel .tagline{font-size:clamp(.78rem,2.5vw,.88rem);color:var(--muted);line-height:1.5;margin-bottom:20px}
.panel .hint{font-size:.72rem;color:var(--muted);margin-top:14px;line-height:1.45}
.btn{display:inline-block;min-width:160px;min-height:48px;padding:12px 28px;margin:4px;
  font-family:inherit;font-size:.9rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;background:linear-gradient(160deg,var(--accent2),var(--accent));border:none;border-radius:10px;
  cursor:pointer;pointer-events:auto;box-shadow:0 4px 16px rgba(212,136,42,.35);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.96);box-shadow:0 2px 8px rgba(212,136,42,.25)}
#restartBtn{display:none;background:linear-gradient(160deg,var(--success),#2a7060)}
#restartBtn.show{display:inline-block}
#startBtn.hide{display:none}
.score-big{font-size:clamp(2rem,8vw,2.6rem);font-weight:700;color:var(--accent);margin:8px 0 4px}
.score-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats{display:flex;gap:16px;justify-content:center;margin:16px 0 20px;font-size:.82rem}
.stats div{text-align:center}
.stats span{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
#swipeHint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .4s;
  pointer-events:none}
#swipeHint.on{opacity:.7}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="hud">
      <div class="hud-block"><span>Score</span><strong id="scoreVal">0</strong></div>
      <div class="hud-block" id="streak"><span>Streak</span><strong id="streakVal">×1</strong></div>
      <div class="hud-block"><span>Dawn</span><strong id="timeVal">60s</strong></div>
    </div>
    <div id="overlay">
      <div class="panel on" id="titlePanel">
        <h1>Fogline Run</h1>
        <p class="tagline">Slip between rooftop lanes. Catch sunrise tokens before the fog takes them.</p>
        <button class="btn" id="startBtn" data-smoke="start">Begin Run</button>
        <p class="hint">Swipe or tap screen edges · arrow keys · 60 seconds till dawn</p>
      </div>
      <div class="panel" id="endPanel">
        <p class="score-label">Final Score</p>
        <p class="score-big" id="finalScore">0</p>
        <div class="stats">
          <div><span>Tokens</span><strong id="finalTokens">0</strong></div>
          <div><span>Best Streak</span><strong id="finalBest">×1</strong></div>
          <div><span>Peak Mult</span><strong id="finalPeak">×1</strong></div>
        </div>
        <button class="btn" id="restartBtn" data-smoke="restart">Run Again</button>
      </div>
    </div>
    <div id="swipeHint">Swipe to switch lanes</div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('gameCanvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');
var titlePanel = document.getElementById('titlePanel');
var endPanel = document.getElementById('endPanel');
var hud = document.getElementById('hud');
var swipeHint = document.getElementById('swipeHint');
var scoreEl = document.getElementById('scoreVal');
var streakEl = document.getElementById('streakVal');
var timeEl = document.getElementById('timeVal');
var finalScoreEl = document.getElementById('finalScore');
var finalTokensEl = document.getElementById('finalTokens');
var finalBestEl = document.getElementById('finalBest');
var finalPeakEl = document.getElementById('finalPeak');

var W = 360, H = 640;
var dpr = 1;
var state = 'title';
var laneCount = 3;
var playerLane = 1;
var playerX = 0.5;
var playerTargetX = 0.5;
var score = 0;
var streak = 0;
var bestStreak = 0;
var peakMult = 1;
var tokensCaught = 0;
var timeLeft = 60;
var roundStart = 0;
var lastFrame = 0;
var obstacles = [];
var tokens = [];
var particles = [];
var floatTexts = [];
var fogLayers = [];
var flashAlpha = 0;
var spawnTimer = 0;
var tokenTimer = 0;
var nextId = 0;
var shake = 0;
var hitPause = 0;
var audioCtx = null;
var darkMode = false;

function cssVar(name){
  try{ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  catch(e){ return ''; }
}

function readTheme(){
  darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function initAudio(){
  try{
    if(typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
  }catch(e){ audioCtx = null; }
}

function playTone(freq, dur, vol, type){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function resize(){
  if(!canvas) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  var rect = canvas.getBoundingClientRect();
  W = Math.max(rect.width || 360, 280);
  H = Math.max(rect.height || 640, 400);
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function laneX(lane){
  var pad = W * 0.12;
  var usable = W - pad * 2;
  return pad + usable * (lane + 0.5) / laneCount;
}

function initFogLayers(){
  fogLayers = [];
  for(var i = 0; i < 5; i++){
    fogLayers.push({ y: Math.random() * H, speed: 8 + Math.random() * 18, alpha: 0.08 + Math.random() * 0.12, h: 40 + Math.random() * 80 });
  }
}

function resetGame(){
  playerLane = 1;
  playerX = laneX(1) / W;
  playerTargetX = playerX;
  score = 0;
  streak = 0;
  bestStreak = 0;
  peakMult = 1;
  tokensCaught = 0;
  timeLeft = 60;
  obstacles = [];
  tokens = [];
  particles = [];
  floatTexts = [];
  flashAlpha = 0;
  spawnTimer = 0;
  tokenTimer = 0.8;
  shake = 0;
  hitPause = 0;
  initFogLayers();
  updateHUD();
}

function difficulty(){
  var t = 1 - timeLeft / 60;
  return {
    fogSpeed: 140 + t * 220,
    spawnGap: Math.max(0.55, 1.4 - t * 0.75),
    tokenGap: Math.max(0.7, 1.8 - t * 0.9),
    fogWidth: 0.28 + t * 0.12
  };
}

function spawnObstacle(){
  var diff = difficulty();
  var pattern = Math.random();
  var blocked = [];
  if(pattern < 0.45){
    var open = Math.floor(Math.random() * laneCount);
    for(var i = 0; i < laneCount; i++) if(i !== open) blocked.push(i);
  } else if(pattern < 0.75){
    blocked = [Math.floor(Math.random() * laneCount)];
  } else {
    var a = Math.floor(Math.random() * laneCount);
    var b = (a + 1 + Math.floor(Math.random() * (laneCount - 1))) % laneCount;
    blocked = [a, b];
  }
  obstacles.push({
    id: nextId++,
    y: -80,
    blocked: blocked,
    h: 50 + Math.random() * 30,
    wobble: Math.random() * Math.PI * 2
  });
}

function spawnToken(){
  var lane = Math.floor(Math.random() * laneCount);
  tokens.push({
    id: nextId++,
    lane: lane,
    y: -40,
    life: 1,
    pulse: Math.random() * Math.PI * 2,
    missed: false
  });
}

function burst(x, y, col, n){
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 120;
    particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 40, life: 0.5 + Math.random()*0.4, col: col, r: 2 + Math.random()*3 });
  }
}

function switchLane(dir){
  if(state !== 'playing') return;
  var next = playerLane + dir;
  if(next < 0 || next >= laneCount) return;
  playerLane = next;
  playerTargetX = laneX(next) / W;
  playTone(220 + playerLane * 60, 0.06, 0.04, 'triangle');
}

function collectToken(tok){
  if(tok.collected) return;
  tok.collected = true;
  streak++;
  if(streak > bestStreak) bestStreak = streak;
  var mult = Math.min(10, 1 + Math.floor(streak / 3));
  if(mult > peakMult) peakMult = mult;
  var pts = 100 * mult;
  score += pts;
  tokensCaught++;
  var tx = laneX(tok.lane);
  burst(tx, tok.y, cssVar('--gold') || '#f0c040', 14);
  floatTexts.push({ x: tx, y: tok.y - 20, text: '+' + pts, life: 0.9, vy: -55 });
  if(streak % 3 === 0 && streak > 0){
    floatTexts.push({ x: W / 2, y: H * 0.35, text: 'DAWN ×' + mult, life: 1.1, vy: -25, big: true });
    flashAlpha = 0.18;
    hitPause = 0.04;
  } else flashAlpha = 0.08;
  playTone(440 + streak * 20, 0.12, 0.07, 'sine');
  playTone(660 + streak * 15, 0.08, 0.04, 'sine');
  vibrate(12);
  updateHUD();
}

function missToken(tok){
  if(tok.missed) return;
  tok.missed = true;
  streak = 0;
  floatTexts.push({ x: laneX(tok.lane), y: tok.y, text: 'slipped', life: 0.7, vy: -30 });
  playTone(120, 0.15, 0.05, 'sawtooth');
  vibrate(30);
  updateHUD();
}

function gameOver(reason){
  if(state !== 'playing') return;
  state = 'over';
  shake = 12;
  playTone(80, 0.4, 0.1, 'sawtooth');
  vibrate([40, 30, 60]);
  hud.classList.remove('on');
  swipeHint.classList.remove('on');
  titlePanel.classList.remove('on');
  endPanel.classList.add('on');
  restartBtn.classList.add('show');
  startBtn.classList.add('hide');
  finalScoreEl.textContent = score;
  finalTokensEl.textContent = tokensCaught;
  finalBestEl.textContent = '×' + bestStreak;
  finalPeakEl.textContent = '×' + peakMult;
}

function startGame(){
  resetGame();
  state = 'playing';
  roundStart = performance.now();
  lastFrame = roundStart;
  titlePanel.classList.remove('on');
  endPanel.classList.remove('on');
  restartBtn.classList.remove('show');
  startBtn.classList.add('hide');
  hud.classList.add('on');
  swipeHint.classList.add('on');
  setTimeout(function(){ swipeHint.classList.remove('on'); }, 3500);
  try{ if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){}
  playTone(330, 0.15, 0.06, 'sine');
}

function updateHUD(){
  if(scoreEl) scoreEl.textContent = score;
  if(streakEl) streakEl.textContent = '×' + Math.min(10, 1 + Math.floor(streak / 3));
  if(timeEl) timeEl.textContent = Math.ceil(timeLeft) + 's';
}

function update(dt){
  if(state === 'title'){
    for(var f = 0; f < fogLayers.length; f++){
      fogLayers[f].y += fogLayers[f].speed * dt * 0.3;
      if(fogLayers[f].y > H + 100) fogLayers[f].y = -100;
    }
    return;
  }
  if(state !== 'playing') return;
  if(hitPause > 0){ hitPause -= dt; return; }

  var diff = difficulty();
  timeLeft -= dt;
  if(timeLeft <= 0){
    timeLeft = 0;
    updateHUD();
    state = 'over';
    playTone(523, 0.2, 0.08, 'sine');
    playTone(784, 0.25, 0.06, 'sine');
    vibrate(20);
    hud.classList.remove('on');
    swipeHint.classList.remove('on');
    endPanel.classList.add('on');
    restartBtn.classList.add('show');
    finalScoreEl.textContent = score;
    finalTokensEl.textContent = tokensCaught;
    finalBestEl.textContent = '×' + bestStreak;
    finalPeakEl.textContent = '×' + peakMult;
    burst(W/2, H/2, cssVar('--gold') || '#f0c040', 30);
    return;
  }
  updateHUD();

  playerX += (playerTargetX - playerX) * Math.min(1, dt * 14);

  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnObstacle();
    spawnTimer = diff.spawnGap * (0.7 + Math.random() * 0.5);
  }
  tokenTimer -= dt;
  if(tokenTimer <= 0){
    spawnToken();
    tokenTimer = diff.tokenGap * (0.6 + Math.random() * 0.6);
  }

  var py = H * 0.82;
  var pw = W * 0.09;
  var px = playerX * W;

  for(var i = obstacles.length - 1; i >= 0; i--){
    var o = obstacles[i];
    o.y += diff.fogSpeed * dt;
    o.wobble += dt * 2;
    if(o.y > H + 100){ obstacles.splice(i, 1); continue; }
    if(o.blocked.indexOf(playerLane) >= 0){
      var ox = laneX(playerLane);
      var oy = o.y + o.h / 2;
      if(Math.abs(oy - py) < (o.h/2 + pw * 0.7) && Math.abs(ox - px) < pw * 1.1){
        gameOver('fog');
        return;
      }
    }
  }

  for(var j = tokens.length - 1; j >= 0; j--){
    var t = tokens[j];
    t.y += (diff.fogSpeed * 0.72) * dt;
    t.pulse += dt * 5;
    if(t.collected){ tokens.splice(j, 1); continue; }
    var tx = laneX(t.lane);
    if(!t.missed && Math.abs(t.y - py) < pw * 1.4 && t.lane === playerLane){
      collectToken(t);
      tokens.splice(j, 1);
      continue;
    }
    if(t.y > py + 30 && !t.missed && !t.collected){
      missToken(t);
    }
    if(t.y > H + 60 || (t.missed && t.life <= 0)){ tokens.splice(j, 1); continue; }
    if(t.missed) t.life -= dt * 1.5;
  }

  for(var k = particles.length - 1; k >= 0; k--){
    var p = particles[k];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 180 * dt;
    p.life -= dt;
    if(p.life <= 0) particles.splice(k, 1);
  }

  for(var ft = floatTexts.length - 1; ft >= 0; ft--){
    var f = floatTexts[ft];
    f.y += f.vy * dt;
    f.life -= dt;
    if(f.life <= 0) floatTexts.splice(ft, 1);
  }

  if(flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 0.9);

  for(var fl = 0; fl < fogLayers.length; fl++){
    fogLayers[fl].y += fogLayers[fl].speed * dt * (0.5 + (1 - timeLeft/60));
    if(fogLayers[fl].y > H + 100) fogLayers[fl].y = -100;
  }

  if(shake > 0) shake *= 0.88;
}

function drawBg(){
  var bg = cssVar('--bg') || '#e8eef2';
  var g = ctx.createLinearGradient(0, 0, 0, H);
  if(darkMode){
    g.addColorStop(0, '#1a2838');
    g.addColorStop(0.45, '#141e28');
    g.addColorStop(1, bg);
  } else {
    g.addColorStop(0, '#c8d8e8');
    g.addColorStop(0.35, '#dce8f0');
    g.addColorStop(1, bg);
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  var sunY = H * 0.08;
  var sunG = ctx.createRadialGradient(W * 0.72, sunY, 0, W * 0.72, sunY, W * 0.35);
  sunG.addColorStop(0, darkMode ? 'rgba(240,180,60,0.25)' : 'rgba(255,210,100,0.45)');
  sunG.addColorStop(0.4, darkMode ? 'rgba(200,140,40,0.08)' : 'rgba(255,190,80,0.15)');
  sunG.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sunG;
  ctx.fillRect(0, 0, W, H * 0.5);
}

function drawRunway(){
  var laneCol = cssVar('--lane') || 'rgba(0,0,0,0.05)';
  var pad = W * 0.12;
  for(var i = 0; i <= laneCount; i++){
    var x = pad + (W - pad * 2) * i / laneCount;
    ctx.strokeStyle = laneCol;
    ctx.lineWidth = i === 0 || i === laneCount ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(x, H * 0.15);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.fillStyle = darkMode ? 'rgba(30,45,55,0.5)' : 'rgba(200,210,220,0.35)';
  ctx.fillRect(pad, H * 0.15, W - pad * 2, H * 0.85);
  if(state === 'playing'){
    var laneW = (W - pad * 2) / laneCount;
    var hl = ctx.createLinearGradient(0, H * 0.15, 0, H);
    hl.addColorStop(0, darkMode ? 'rgba(232,160,64,0.06)' : 'rgba(240,180,80,0.12)');
    hl.addColorStop(1, darkMode ? 'rgba(232,160,64,0.02)' : 'rgba(240,180,80,0.04)');
    ctx.fillStyle = hl;
    ctx.fillRect(pad + playerLane * laneW, H * 0.15, laneW, H * 0.85);
  }
}

function drawFogLayers(){
  for(var i = 0; i < fogLayers.length; i++){
    var f = fogLayers[i];
    var fg = ctx.createLinearGradient(0, f.y, 0, f.y + f.h);
    var c1 = cssVar('--fog1') || 'rgba(180,195,205,0.5)';
    var c2 = cssVar('--fog2') || 'rgba(140,160,175,0.3)';
    fg.addColorStop(0, 'rgba(0,0,0,0)');
    fg.addColorStop(0.3, c1);
    fg.addColorStop(0.7, c2);
    fg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, f.y, W, f.h);
  }
}

function drawObstacles(){
  var diff = difficulty();
  for(var i = 0; i < obstacles.length; i++){
    var o = obstacles[i];
    var pad = W * 0.12;
    var laneW = (W - pad * 2) / laneCount;
    for(var b = 0; b < o.blocked.length; b++){
      var lane = o.blocked[b];
      var x = pad + lane * laneW;
      var wob = Math.sin(o.wobble) * 3;
      var fogG = ctx.createLinearGradient(x, o.y, x + laneW, o.y + o.h);
      fogG.addColorStop(0, darkMode ? 'rgba(70,90,105,0.85)' : 'rgba(150,170,185,0.75)');
      fogG.addColorStop(0.5, darkMode ? 'rgba(50,65,80,0.95)' : 'rgba(120,140,155,0.9)');
      fogG.addColorStop(1, darkMode ? 'rgba(35,48,60,0.7)' : 'rgba(100,120,135,0.6)');
      ctx.fillStyle = fogG;
      ctx.beginPath();
      var r = 8;
      var rx = x + 2, ry = o.y + wob, rw = laneW - 4, rh = o.h;
      ctx.moveTo(rx + r, ry);
      ctx.lineTo(rx + rw - r, ry);
      ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + r);
      ctx.lineTo(rx + rw, ry + rh - r);
      ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - r, ry + rh);
      ctx.lineTo(rx + r, ry + rh);
      ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - r);
      ctx.lineTo(rx, ry + r);
      ctx.quadraticCurveTo(rx, ry, rx + r, ry);
      ctx.closePath();
      ctx.fill();
    }
  }
}

function drawTokens(){
  var gold = cssVar('--gold') || '#f0c040';
  for(var i = 0; i < tokens.length; i++){
    var t = tokens[i];
    var x = laneX(t.lane);
    var pulse = 1 + Math.sin(t.pulse) * 0.15;
    var alpha = t.missed ? t.life : 1;
    if(alpha <= 0) continue;
    ctx.save();
    ctx.globalAlpha = alpha;
    var glow = ctx.createRadialGradient(x, t.y, 0, x, t.y, 22 * pulse);
    glow.addColorStop(0, darkMode ? 'rgba(255,210,80,0.5)' : 'rgba(255,220,100,0.6)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, t.y, 22 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = gold;
    ctx.beginPath();
    ctx.moveTo(x, t.y - 10 * pulse);
    ctx.lineTo(x + 8 * pulse, t.y + 6 * pulse);
    ctx.lineTo(x - 8 * pulse, t.y + 6 * pulse);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawPlayer(){
  var px = playerX * W;
  var py = H * 0.82;
  var r = W * 0.045;
  var accent = cssVar('--accent') || '#d4882a';
  var glow = ctx.createRadialGradient(px, py, 0, px, py, r * 2.5);
  glow.addColorStop(0, darkMode ? 'rgba(232,160,64,0.4)' : 'rgba(240,180,80,0.5)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(px, py, r * 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = accent;
  ctx.beginPath();
  ctx.arc(px, py, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = darkMode ? '#f0d090' : '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawParticles(){
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatTexts(){
  for(var i = 0; i < floatTexts.length; i++){
    var f = floatTexts[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = (f.big ? '600 15px' : '600 12px') + " ui-monospace, Menlo, monospace";
    ctx.textAlign = 'center';
    ctx.fillStyle = f.big ? (cssVar('--gold') || '#f0c040') : (cssVar('--accent') || '#d4882a');
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
}

function drawFlash(){
  if(flashAlpha <= 0) return;
  ctx.fillStyle = darkMode ? 'rgba(255,210,80,' + flashAlpha + ')' : 'rgba(255,220,120,' + flashAlpha + ')';
  ctx.fillRect(0, 0, W, H);
}

function draw(){
  if(!ctx) return;
  ctx.save();
  if(shake > 0.5){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  drawBg();
  drawRunway();
  drawFogLayers();
  if(state === 'playing' || state === 'over'){
    drawObstacles();
    drawTokens();
    drawPlayer();
    drawParticles();
    drawFloatTexts();
    drawFlash();
  }
  ctx.restore();
}

function loop(now){
  var dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

var touchStartX = 0, touchStartY = 0, touchActive = false;

function onTouchStart(e){
  if(!canvas) return;
  e.preventDefault();
  var t = e.touches && e.touches[0];
  if(!t) return;
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchActive = true;
}

function handlePointer(clientX, clientY, dx, dy){
  if(state !== 'playing' || !canvas) return;
  if(Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)){
    switchLane(dx > 0 ? 1 : -1);
    return;
  }
  if(Math.abs(dx) < 24 && Math.abs(dy) < 24){
    var rect = canvas.getBoundingClientRect();
    if(!rect.width) return;
    var relX = (clientX - rect.left) / rect.width;
    if(relX < 0.34) switchLane(-1);
    else if(relX > 0.66) switchLane(1);
  }
}

function onTouchEnd(e){
  if(!touchActive) return;
  e.preventDefault();
  touchActive = false;
  var t = e.changedTouches && e.changedTouches[0];
  if(!t) return;
  handlePointer(t.clientX, t.clientY, t.clientX - touchStartX, t.clientY - touchStartY);
}

function onMouseUp(e){
  if(!canvas) return;
  handlePointer(e.clientX, e.clientY, e.clientX - touchStartX, e.clientY - touchStartY);
}

function onKeyDown(e){
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') switchLane(-1);
  else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') switchLane(1);
}

if(canvas){
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });
  canvas.addEventListener('mousedown', function(e){
    touchStartX = e.clientX;
    touchStartY = e.clientY;
  });
  canvas.addEventListener('mouseup', onMouseUp);
}
window.addEventListener('keydown', onKeyDown);
window.addEventListener('resize', resize);

if(window.matchMedia){
  try{
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
      readTheme();
    });
  }catch(e){
    try{
      window.matchMedia('(prefers-color-scheme: dark)').addListener(readTheme);
    }catch(e2){}
  }
}

if(startBtn) startBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
if(restartBtn) restartBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

readTheme();
initAudio();
initFogLayers();
resize();
lastFrame = performance.now();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
