<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shipping Dreams</title>
<style>
:root {
  --bg: #e0e5ec;
  --text: #2a2d34;
  --card-bg: #ffffff;
  --accent-cool: #8d99ae;
  --accent-warm: #e09f3e;
  --accent-hot: #e36414;
  --accent-neutral: #adb5bd;
  --bin-bg: rgba(255, 255, 255, 0.5);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1c23;
    --text: #eef1f5;
    --card-bg: #2d3038;
    --accent-cool: #6c7a89;
    --accent-warm: #d98a2c;
    --accent-hot: #d05c11;
    --bin-bg: rgba(0, 0, 0, 0.3);
  }
}

body {
  margin: 0;
  padding: 0;
  width: 100dvw;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  user-select: none;
  touch-action: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  /* Fog background */
  background: radial-gradient(circle at 50% 0%, var(--bg), #c0c5cc);
}

@media (prefers-color-scheme: dark) {
  body {
    background: radial-gradient(circle at 50% 0%, var(--bg), #111216);
  }
}

#bg-glow {
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 50%;
  background: radial-gradient(ellipse at bottom, var(--accent-hot), transparent 70%);
  opacity: 0;
  transition: opacity 1s;
  pointer-events: none;
  z-index: 0;
}
#bg-glow.active {
  opacity: 0.3;
}

#game-container {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  max-width: 600px;
  left: 50%;
  transform: translateX(-50%);
  overflow: hidden;
}

/* Bins */
.bin {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  opacity: 0.3;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 1;
  font-size: 1.2rem;
  letter-spacing: 2px;
  pointer-events: none;
}
.bin.active {
  opacity: 1;
  transform: scale(1.1);
  text-shadow: 0 0 10px currentColor;
}
#bin-up {
  top: 15%; left: 0; right: 0; height: 40px;
  color: var(--accent-hot);
}
#bin-left {
  top: 0; bottom: 0; left: 20px; width: 40px;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  color: var(--accent-cool);
}
#bin-left.active { transform: rotate(180deg) scale(1.1); }

#bin-right {
  top: 0; bottom: 0; right: 20px; width: 40px;
  writing-mode: vertical-rl;
  color: var(--accent-warm);
}

/* Screens */
.screen {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 100;
  pointer-events: none;
  transition: opacity 0.3s;
}
.screen.hidden {
  opacity: 0;
  pointer-events: none;
}
.screen h1 { margin: 0 0 10px 0; font-size: 2rem; text-align: center; }
.screen p { margin: 5px 0; opacity: 0.8; text-align: center; }

button {
  pointer-events: auto;
  background: var(--accent-hot);
  color: #fff;
  border: none;
  padding: 16px 32px;
  border-radius: 24px;
  font-size: 1.2rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(227, 100, 20, 0.3);
  transition: transform 0.2s, box-shadow 0.2s;
  margin-top: 30px;
  text-transform: uppercase;
}
button:active {
  transform: scale(0.95);
}

/* HUD */
#hud {
  position: absolute;
  top: env(safe-area-inset-top, 20px);
  left: 20px; right: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 50;
  pointer-events: none;
}
#score {
  font-size: 2.5rem;
  font-weight: bold;
}
#time-bar-container {
  width: 100%; height: 6px;
  background: var(--bin-bg);
  border-radius: 3px;
  margin-top: 10px;
  overflow: hidden;
}
#time-bar {
  height: 100%; background: var(--text); width: 100%;
  transform-origin: left;
}

/* Cards */
#card-stack {
  position: absolute;
  top: 50%; left: 50%;
  width: 260px; height: 380px;
  margin-left: -130px; margin-top: -190px;
  perspective: 1000px;
  z-index: 10;
}
.card {
  position: absolute;
  width: 100%; height: 100%;
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 2rem; font-weight: bold;
  border: 4px solid var(--card-bg);
  transform-origin: center bottom;
  will-change: transform;
}
@media (prefers-color-scheme: dark) {
  .card { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
}
.card.color-cool { border-color: var(--accent-cool); color: var(--accent-cool); }
.card.color-warm { border-color: var(--accent-warm); color: var(--accent-warm); }
.card.color-hot { border-color: var(--accent-hot); color: var(--accent-hot); }
.card.color-neutral { border-color: var(--accent-neutral); color: var(--accent-neutral); }

.depth-0 { z-index: 3; transform: scale(1) translateY(0); opacity: 1; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.depth-1 { z-index: 2; transform: scale(0.95) translateY(20px); opacity: 0.8; transition: transform 0.3s; }
.depth-2 { z-index: 1; transform: scale(0.9) translateY(40px); opacity: 0.5; transition: transform 0.3s; }
.depth-hidden { display: none; }
.dragging { transition: none !important; }
.swiping-out { z-index: 4; }

/* Visual feedback overlay */
#flash-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 200;
  opacity: 0; transition: opacity 0.2s;
}
#flash-overlay.red { background: rgba(255, 0, 0, 0.2); opacity: 1; transition: none; }
#flash-overlay.white { background: rgba(255, 255, 255, 0.4); opacity: 1; transition: none; }

.particle {
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  pointer-events: none; z-index: 1000;
  animation: explode 0.6s cubic-bezier(0, .9, .57, 1) forwards;
}
@keyframes explode {
  0% { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
}
.particle.color-cool { background: var(--accent-cool); }
.particle.color-warm { background: var(--accent-warm); }
.particle.color-hot { background: var(--accent-hot); }
</style>
</head>
<body>

<div id="bg-glow"></div>

<div id="game-container">
  <div id="bin-up" class="bin">▲ SHIP ▲</div>
  <div id="bin-left" class="bin">◄ ARCHIVE</div>
  <div id="bin-right" class="bin">ITERATE ►</div>

  <div id="hud">
    <div id="score">0</div>
    <div id="time-bar-container"><div id="time-bar"></div></div>
  </div>

  <div id="card-stack"></div>

  <div id="flash-overlay"></div>

  <div id="title-screen" class="screen">
    <h1>SHIPPING DREAMS</h1>
    <p>Sort the commits before the fog clears.</p>
    <p style="margin-top:20px; font-size: 0.9em; color: var(--accent-cool);">◄ Archive</p>
    <p style="font-size: 0.9em; color: var(--accent-hot);">Ship ▲</p>
    <p style="font-size: 0.9em; color: var(--accent-warm);">Iterate ►</p>
    <button data-smoke="start" id="start-btn">Start Sorting</button>
  </div>

  <div id="game-over-screen" class="screen hidden">
    <h1>WINDOW CLOSED</h1>
    <p>Commits Shipped: <span id="final-score" style="font-weight:bold; color:var(--accent-hot);">0</span></p>
    <button data-smoke="restart" id="restart-btn">Try Again</button>
  </div>
</div>

<script>
const TYPES = ['ARCHIVE', 'ITERATE', 'SHIP'];
const COLORS = ['cool', 'warm', 'hot'];

let audioCtx = null;
function initAudio() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx && !audioCtx) audioCtx = new AudioCtx();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}

function playTone(freq, type, duration, vol=0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playCorrect() {
  playTone(600, 'sine', 0.1, 0.1);
  setTimeout(() => playTone(800, 'sine', 0.2, 0.1), 100);
}

function playIncorrect() {
  playTone(150, 'sawtooth', 0.2, 0.2);
}

function playReveal() {
  playTone(400, 'triangle', 0.1, 0.1);
  setTimeout(() => playTone(500, 'triangle', 0.1, 0.1), 100);
}

function spawnParticles(x, y, colorClass) {
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = `particle ${colorClass}`;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    document.body.appendChild(p);

    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 80 + 40;
    const dx = Math.cos(angle) * speed;
    const dy = Math.sin(angle) * speed;

    p.style.setProperty('--dx', `${dx}px`);
    p.style.setProperty('--dy', `${dy}px`);

    setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, 600);
  }
}

const app = {
  score: 0,
  streak: 0,
  timeLeft: 30,
  maxTime: 30,
  isPlaying: false,
  cards: [],
  lastTime: 0,
  animationFrame: null,
  
  startX: 0, startY: 0,
  isDragging: false,
  cardEl: null,
  touchTimer: null,
  
  init() {
    this.startBtn = document.getElementById('start-btn');
    this.restartBtn = document.getElementById('restart-btn');
    this.titleScreen = document.getElementById('title-screen');
    this.gameOverScreen = document.getElementById('game-over-screen');
    this.cardStack = document.getElementById('card-stack');
    this.scoreEl = document.getElementById('score');
    this.timeBar = document.getElementById('time-bar');
    this.flashOverlay = document.getElementById('flash-overlay');
    this.bgGlow = document.getElementById('bg-glow');

    this.startBtn.addEventListener('click', () => this.start());
    this.restartBtn.addEventListener('click', () => this.start());

    const container = document.getElementById('game-container');
    container.addEventListener('touchstart', this.onStart.bind(this), {passive: false});
    container.addEventListener('touchmove', this.onMove.bind(this), {passive: false});
    window.addEventListener('touchend', this.onEnd.bind(this));
    
    container.addEventListener('mousedown', this.onStart.bind(this));
    window.addEventListener('mousemove', this.onMove.bind(this));
    window.addEventListener('mouseup', this.onEnd.bind(this));
  },
  
  start() {
    initAudio();
    this.titleScreen.classList.add('hidden');
    this.gameOverScreen.classList.add('hidden');
    // small delay to let hidden class apply display block correctly?
    // It's opacity-based, so hidden immediately makes it invisible and pointer-events: none
    setTimeout(() => {
      this.titleScreen.style.display = 'none';
      this.gameOverScreen.style.display = 'none';
    }, 300);
    
    this.score = 0;
    this.streak = 0;
    this.timeLeft = this.maxTime;
    this.isPlaying = true;
    this.cards = [];
    this.bgGlow.classList.remove('active');
    this.updateHUD();
    
    this.cardStack.innerHTML = '';
    for(let i=0; i<5; i++) this.addCard();
    this.renderStack();
    
    this.lastTime = performance.now();
    if (this.animationFrame) cancelAnimationFrame(this.animationFrame);
    this.animationFrame = requestAnimationFrame(this.loop.bind(this));
  },
  
  loop(time) {
    if (!this.isPlaying) return;
    const dt = (time - this.lastTime) / 1000;
    this.lastTime = time;
    
    this.timeLeft -= dt;
    if (this.timeLeft <= 0) {
      this.timeLeft = 0;
      this.gameOver();
    } else {
      this.timeBar.style.width = `${(this.timeLeft / this.maxTime) * 100}%`;
      // Change color when low
      this.timeBar.style.background = this.timeLeft < 5 ? 'var(--accent-hot)' : 'var(--text)';
    }
    
    this.animationFrame = requestAnimationFrame(this.loop.bind(this));
  },
  
  gameOver() {
    this.isPlaying = false;
    cancelAnimationFrame(this.animationFrame);
    document.getElementById('final-score').textContent = this.score;
    this.gameOverScreen.style.display = 'flex';
    // Force reflow
    void this.gameOverScreen.offsetWidth;
    this.gameOverScreen.classList.remove('hidden');
    
    // Clear card
    if (this.cardEl && this.isDragging) {
      this.cardEl.classList.remove('dragging');
      this.cardEl.style.transform = '';
      this.isDragging = false;
    }
  },
  
  addCard() {
    const level = this.score < 10 ? 1 : this.score < 25 ? 2 : 3;
    const type = TYPES[Math.floor(Math.random() * TYPES.length)];
    let label = type;
    let color = type === 'ARCHIVE' ? 'cool' : type === 'ITERATE' ? 'warm' : 'hot';
    let isWildcard = false;
    
    if (level > 1 && Math.random() < 0.3) {
      color = COLORS[Math.floor(Math.random() * COLORS.length)];
    }
    
    if (level > 2 && Math.random() < 0.25) {
      isWildcard = true;
      label = '???';
      color = 'neutral';
    }
    
    this.cards.push({ 
      type, label, color, isWildcard, 
      trueLabel: type, 
      trueColor: type === 'ARCHIVE' ? 'cool' : type === 'ITERATE' ? 'warm' : 'hot' 
    });
  },
  
  renderStack() {
    const existing = Array.from(this.cardStack.children).filter(el => !el.classList.contains('swiping-out'));
    
    for(let i=0; i<3; i++) {
      let el = existing[i];
      if (!el) {
        el = document.createElement('div');
        this.cardStack.appendChild(el);
      }
      if (i < this.cards.length) {
        const c = this.cards[i];
        el.className = `card color-${c.color} depth-${i}`;
        el.textContent = c.label;
      } else {
        el.className = `card depth-hidden`;
      }
    }
  },
  
  onStart(e) {
    if (!this.isPlaying || this.isDragging) return;
    if (e.target.tagName && e.target.tagName.toLowerCase() === 'button') return;
    
    if (e.type === 'touchstart' && e.cancelable) {
      e.preventDefault();
    } else if (e.type === 'mousedown' && e.cancelable) {
      e.preventDefault();
    }
    
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    this.startX = clientX;
    this.startY = clientY;
    this.isDragging = true;
    
    const existing = Array.from(this.cardStack.children).filter(el => !el.classList.contains('swiping-out'));
    this.cardEl = existing[0];
    if (this.cardEl) {
      this.cardEl.classList.add('dragging');
    }
    
    if (this.cards[0] && this.cards[0].isWildcard) {
      this.touchTimer = setTimeout(() => this.revealWildcard(), 300);
    }
  },
  
  revealWildcard() {
    if (!this.isDragging || !this.cards[0] || !this.cards[0].isWildcard) return;
    this.cards[0].isWildcard = false;
    this.cards[0].label = this.cards[0].trueLabel;
    this.cards[0].color = this.cards[0].trueColor;
    
    if (this.cardEl) {
      this.cardEl.textContent = this.cards[0].label;
      this.cardEl.className = `card color-${this.cards[0].color} depth-0 dragging`;
    }
    playReveal();
    if (navigator.vibrate) try { navigator.vibrate(50); } catch(e){}
  },
  
  onMove(e) {
    if (!this.isDragging || !this.isPlaying || !this.cardEl) return;
    if (e.cancelable) e.preventDefault();
    
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const dx = clientX - this.startX;
    const dy = clientY - this.startY;
    
    if (this.touchTimer && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
      clearTimeout(this.touchTimer);
      this.touchTimer = null;
    }
    
    this.cardEl.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx * 0.05}deg)`;
    
    document.getElementById('bin-left').classList.toggle('active', dx < -50 && Math.abs(dx) > Math.abs(dy));
    document.getElementById('bin-right').classList.toggle('active', dx > 50 && Math.abs(dx) > Math.abs(dy));
    document.getElementById('bin-up').classList.toggle('active', dy < -50 && Math.abs(dy) > Math.abs(dx));
  },
  
  onEnd(e) {
    if (!this.isDragging) return;
    this.isDragging = false;
    
    if (this.touchTimer) {
      clearTimeout(this.touchTimer);
      this.touchTimer = null;
    }
    
    if (!this.cardEl) return;
    
    const styleTransform = this.cardEl.style.transform;
    const match = styleTransform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
    const dx = match ? parseFloat(match[1]) : 0;
    const dy = match ? parseFloat(match[2]) : 0;
    
    document.querySelectorAll('.bin').forEach(b => b.classList.remove('active'));
    
    const THRESHOLD = 80;
    let swipeDir = null;
    
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx < -THRESHOLD) swipeDir = 'LEFT';
      else if (dx > THRESHOLD) swipeDir = 'RIGHT';
    } else {
      if (dy < -THRESHOLD) swipeDir = 'UP';
    }
    
    if (swipeDir) {
      this.processSwipe(swipeDir, dx, dy);
    } else {
      this.cardEl.classList.remove('dragging');
      this.cardEl.style.transform = '';
    }
    
    this.cardEl = null;
  },
  
  processSwipe(dir, dx, dy) {
    const cardData = this.cards.shift();
    
    const outX = dir === 'LEFT' ? window.innerWidth * -1.5 : dir === 'RIGHT' ? window.innerWidth * 1.5 : dx;
    const outY = dir === 'UP' ? window.innerHeight * -1.5 : dy;
    
    const oldCard = this.cardEl;
    oldCard.classList.remove('dragging', 'depth-0');
    oldCard.classList.add('swiping-out');
    
    // Explicitly set transition for swiping out
    oldCard.style.transition = 'transform 0.4s ease-out, opacity 0.4s ease-out';
    oldCard.style.transform = `translate(${outX}px, ${outY}px) rotate(${dx * 0.1}deg)`;
    oldCard.style.opacity = '0';
    
    document.getElementById('game-container').appendChild(oldCard);
    
    setTimeout(() => {
      if (oldCard.parentNode) oldCard.parentNode.removeChild(oldCard);
    }, 400);
    
    let expectedDir = '';
    if (cardData.trueLabel === 'ARCHIVE') expectedDir = 'LEFT';
    if (cardData.trueLabel === 'ITERATE') expectedDir = 'RIGHT';
    if (cardData.trueLabel === 'SHIP') expectedDir = 'UP';
    
    if (dir === expectedDir) {
      this.score++;
      this.streak++;
      this.timeLeft = Math.min(this.maxTime, this.timeLeft + 1.5);
      playCorrect();
      this.updateHUD();
      if (navigator.vibrate) try { navigator.vibrate(20); } catch(e){}
      
      const rect = oldCard.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      spawnParticles(cx, cy, `color-${cardData.trueColor}`);
      
      if (this.streak > 0 && this.streak % 10 === 0) {
        // Sunrise reveal
        playTone(400, 'sine', 0.2, 0.1);
        setTimeout(() => playTone(600, 'sine', 0.4, 0.1), 200);
        this.flash('white');
        this.timeLeft = Math.min(this.maxTime, this.timeLeft + 5);
        this.bgGlow.classList.add('active');
      }
    } else {
      this.streak = 0;
      this.timeLeft -= 3;
      playIncorrect();
      this.flash('red');
      this.bgGlow.classList.remove('active');
      if (navigator.vibrate) try { navigator.vibrate([40, 40, 40]); } catch(e){}
    }
    
    this.addCard();
    this.renderStack();
  },
  
  flash(type) {
    this.flashOverlay.className = type;
    setTimeout(() => {
      this.flashOverlay.className = '';
    }, 200);
  },
  
  updateHUD() {
    this.scoreEl.textContent = this.score;
  }
};

window.onload = () => {
  app.init();
};
</script>

</body>
</html>
