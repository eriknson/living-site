<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Drift</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c0e;--fg:#e8eaed;--muted:#8b929a;--accent:#00e5c7;--accent2:#ffb347;
  --panel:rgba(12,14,18,.88);--border:rgba(255,255,255,.08);--danger:#ff5c5c;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a0c0e;--fg:#e8eaed;--muted:#8b929a;--accent:#00e5c7;--accent2:#ffb347;
    --panel:rgba(12,14,18,.88);--border:rgba(255,255,255,.08);--danger:#ff5c5c;
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e4e8ec;--fg:#1a1f24;--muted:#5a6470;--accent:#009688;--accent2:#e07b00;
    --panel:rgba(240,243,246,.92);--border:rgba(0,0,0,.08);--danger:#d93030;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:2}
.hud-block{display:flex;flex-direction:column;gap:4px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hud-val{font-size:18px;font-weight:600;line-height:1}
#ring-wrap{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  pointer-events:none;z-index:2}
#ring-canvas{display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:10;pointer-events:none;transition:opacity .35s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-bg{position:absolute;inset:0;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.overlay-content{position:relative;z-index:1;text-align:center;padding:24px;max-width:340px;pointer-events:none}
.overlay h1{font-size:clamp(22px,6vw,32px);font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.overlay p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:20px}
.overlay .hint{font-size:11px;color:var(--muted);margin-top:16px;opacity:.7}
.btn{pointer-events:auto;min-height:48px;min-width:160px;padding:14px 32px;border:none;border-radius:8px;
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;background:var(--accent);color:var(--bg);transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
#toast{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--muted);pointer-events:none;z-index:3;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Pings</span><span class="hud-val" id="score">0</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Dawn</span><span class="hud-val" id="timer">60</span></div>
  </div>
  <div id="ring-wrap"><canvas id="ring-canvas" width="72" height="72"></canvas></div>
  <div id="toast">Drag to steer · Arrow keys on desktop</div>

  <div class="overlay" id="title-screen">
    <div class="overlay-bg"></div>
    <div class="overlay-content">
      <h1>Signal Drift</h1>
      <p>Steer your drone through Karl the Fog. Snatch fading pings before they dissolve — fill the sunrise ring before dawn breaks.</p>
      <button class="btn" data-smoke="start" id="btn-start">Launch Drone</button>
      <p class="hint">Drag anywhere to steer · Dodge fog banks</p>
    </div>
  </div>

  <div class="overlay hidden" id="gameover-screen">
    <div class="overlay-bg"></div>
    <div class="overlay-content">
      <h1 id="go-title">Signal Lost</h1>
      <p id="go-msg">The fog swallowed your pings.</p>
      <button class="btn" data-smoke="restart" id="btn-restart">Try Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ringCanvas = document.getElementById('ring-canvas');
var ctx, ringCtx;
var W = 0, H = 0, dpr = 1;
var state = 'title';
var score = 0, targetScore = 10, timeLeft = 60, elapsed = 0;
var player = { x:0, y:0, tx:0, ty:0, r:10, vx:0, vy:0 };
var pings = [], fogBanks = [], particles = [];
var spawnTimer = 0, fogTimer = 0, difficulty = 0;
var keys = { up:false, down:false, left:false, right:false };
var audioCtx = null, shake = 0, hits = 0, maxHits = 5;
var toastEl = document.getElementById('toast');
var toastTimer = null;

function safeInitAudio(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }catch(e){}
}

function beep(freq, dur, vol){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx = canvas.getContext('2d');
  if(ctx) ctx.setTransform(dpr,0,0,dpr,0,0);
  player.x = player.tx = W * 0.5;
  player.y = player.ty = H * 0.65;
}

function resetGame(){
  score = 0; timeLeft = 60; elapsed = 0; difficulty = 0;
  spawnTimer = 0; fogTimer = 0; hits = 0; shake = 0;
  pings = []; fogBanks = []; particles = [];
  player.x = player.tx = W * 0.5;
  player.y = player.ty = H * 0.65;
  player.vx = player.vy = 0;
  updateHUD();
  drawRing();
}

function showToast(){
  toastEl.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 3500);
}

function startGame(){
  resetGame();
  state = 'playing';
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  showToast();
  safeInitAudio();
  beep(440, 0.15, 0.06);
}

function endGame(won){
  state = 'gameover';
  var title = document.getElementById('go-title');
  var msg = document.getElementById('go-msg');
  if(won){
    title.textContent = 'Sunrise Cleared';
    msg.textContent = 'All pings recovered. Shipped by dawn — ' + score + ' signals saved.';
    beep(660, 0.2, 0.1); beep(880, 0.3, 0.08);
    vibrate(80);
  } else if(hits >= maxHits){
    title.textContent = 'Drone Down';
    msg.textContent = 'Too many fog collisions. ' + score + '/' + targetScore + ' pings recovered.';
    beep(180, 0.4, 0.1);
  } else {
    title.textContent = 'Dawn Broke';
    msg.textContent = 'Time ran out. ' + score + '/' + targetScore + ' pings — the gray won.';
    beep(220, 0.35, 0.08);
  }
  document.getElementById('gameover-screen').classList.remove('hidden');
}

function updateHUD(){
  document.getElementById('score').textContent = score + '/' + targetScore;
  document.getElementById('timer').textContent = Math.ceil(timeLeft);
}

function drawRing(){
  ringCtx = ringCanvas.getContext('2d');
  if(!ringCtx) return;
  var s = 72, cx = s/2, cy = s/2, r = 28;
  ringCtx.clearRect(0,0,s,s);
  var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  ringCtx.beginPath(); ringCtx.arc(cx,cy,r,0,Math.PI*2);
  ringCtx.strokeStyle = isLight ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.12)';
  ringCtx.lineWidth = 4; ringCtx.stroke();
  var prog = Math.min(score / targetScore, 1);
  if(prog > 0){
    ringCtx.beginPath();
    ringCtx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2 + prog*Math.PI*2);
    var grad = ringCtx.createLinearGradient(0,0,s,s);
    grad.addColorStop(0, isLight ? '#009688' : '#00e5c7');
    grad.addColorStop(1, isLight ? '#e07b00' : '#ffb347');
    ringCtx.strokeStyle = grad; ringCtx.lineWidth = 4; ringCtx.lineCap = 'round'; ringCtx.stroke();
  }
  ringCtx.font = '600 11px ui-monospace, Menlo, monospace';
  ringCtx.fillStyle = isLight ? '#1a1f24' : '#e8eaed';
  ringCtx.textAlign = 'center'; ringCtx.textBaseline = 'middle';
  ringCtx.fillText(Math.round(prog*100)+'%', cx, cy);
}

function spawnPing(){
  var margin = 40;
  var x = margin + Math.random() * (W - margin*2);
  var y = margin + Math.random() * (H * 0.55);
  var colors = ['#00e5c7','#ffb347','#5eead4','#fbbf24','#34d399'];
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches){
    colors = ['#009688','#e07b00','#0d9488','#d97706','#059669'];
  }
  pings.push({
    x:x, y:y, r:14, life:1, maxLife:4 + Math.random()*2,
    color: colors[Math.floor(Math.random()*colors.length)],
    driftX:(Math.random()-0.5)*30, driftY:(Math.random()-0.5)*20,
    pulse: Math.random()*Math.PI*2
  });
}

function spawnFog(){
  var fromLeft = Math.random() > 0.5;
  var w = 60 + Math.random()*80 + difficulty*15;
  var h = 40 + Math.random()*60 + difficulty*10;
  fogBanks.push({
    x: fromLeft ? -w : W + w,
    y: H*0.15 + Math.random()*(H*0.65),
    w:w, h:h, vx: (fromLeft ? 1 : -1) * (30 + difficulty*8 + Math.random()*20),
    vy: (Math.random()-0.5)*10, alpha: 0.35 + Math.random()*0.25, rot: Math.random()*Math.PI
  });
}

function burst(x,y,color){
  for(var i=0;i<12;i++){
    var a = Math.random()*Math.PI*2, sp = 40+Math.random()*80;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color,r:2+Math.random()*3});
  }
}

function dist(ax,ay,bx,by){ var dx=ax-bx,dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }

function update(dt){
  if(state !== 'playing') return;
  elapsed += dt;
  difficulty = Math.min(elapsed / 45, 1);
  timeLeft -= dt;
  if(timeLeft <= 0){ timeLeft = 0; endGame(false); return; }

  var spd = 280;
  if(keys.left) player.tx -= spd*dt;
  if(keys.right) player.tx += spd*dt;
  if(keys.up) player.ty -= spd*dt;
  if(keys.down) player.ty += spd*dt;
  player.tx = Math.max(20, Math.min(W-20, player.tx));
  player.ty = Math.max(H*0.12, Math.min(H-30, player.ty));

  var follow = 8 + difficulty*4;
  player.vx += (player.tx - player.x) * follow * dt;
  player.vy += (player.ty - player.y) * follow * dt;
  player.vx *= 0.85; player.vy *= 0.85;
  player.x += player.vx * dt; player.y += player.vy * dt;

  spawnTimer -= dt;
  var spawnRate = Math.max(0.6, 1.8 - difficulty*1.0);
  if(spawnTimer <= 0){ spawnPing(); spawnTimer = spawnRate; }

  fogTimer -= dt;
  var fogRate = Math.max(1.2, 3.5 - difficulty*1.8);
  if(fogTimer <= 0){ spawnFog(); fogTimer = fogRate; }

  for(var i=pings.length-1;i>=0;i--){
    var p = pings[i];
    p.life -= dt / p.maxLife;
    p.x += p.driftX * dt * (1 + difficulty);
    p.y += p.driftY * dt * (1 + difficulty);
    p.driftX += (Math.random()-0.5)*20*dt;
    p.driftY += (Math.random()-0.5)*15*dt;
    p.pulse += dt * 4;
    if(p.life <= 0){ pings.splice(i,1); continue; }
    if(dist(player.x,player.y,p.x,p.y) < player.r + p.r * p.life){
      pings.splice(i,1);
      score++;
      burst(p.x,p.y,p.color);
      beep(520 + score*20, 0.08, 0.07);
      vibrate(15);
      updateHUD(); drawRing();
      if(score >= targetScore){ endGame(true); return; }
    }
  }

  for(var j=fogBanks.length-1;j>=0;j--){
    var f = fogBanks[j];
    f.x += f.vx*dt; f.y += f.vy*dt; f.rot += dt*0.3;
    if((f.vx > 0 && f.x > W+f.w) || (f.vx < 0 && f.x < -f.w*2)){ fogBanks.splice(j,1); continue; }
    if(rectCircle(f, player.x, player.y, player.r)){
      fogBanks.splice(j,1);
      hits++; shake = 0.3;
      beep(100, 0.2, 0.1); vibrate(40);
      burst(player.x, player.y, '#888');
      if(hits >= maxHits){ endGame(false); return; }
    }
  }

  for(var k=particles.length-1;k>=0;k--){
    var pt = particles[k];
    pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vx *= 0.92; pt.vy *= 0.92;
    pt.life -= dt*2;
    if(pt.life <= 0) particles.splice(k,1);
  }

  if(shake > 0) shake -= dt;
  updateHUD();
}

function rectCircle(f, cx, cy, cr){
  var rx = f.x - f.w/2, ry = f.y - f.h/2;
  var closestX = Math.max(rx, Math.min(cx, rx+f.w));
  var closestY = Math.max(ry, Math.min(cy, ry+f.h));
  return dist(cx,cy,closestX,closestY) < cr + 8;
}

function getColors(){
  var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  return light ? {
    bg1:'#d8dde3', bg2:'#b8c4ce', fog:'rgba(160,170,180,',
    drone:'#1a1f24', droneGlow:'rgba(0,150,136,.4)', grid:'rgba(0,0,0,.04)'
  } : {
    bg1:'#0a0c0e', bg2:'#141820', fog:'rgba(180,190,200,',
    drone:'#e8eaed', droneGlow:'rgba(0,229,199,.35)', grid:'rgba(255,255,255,.03)'
  };
}

function draw(){
  if(!ctx) return;
  var c = getColors();
  var sx = shake > 0 ? (Math.random()-0.5)*8*shake : 0;
  var sy = shake > 0 ? (Math.random()-0.5)*8*shake : 0;

  var grd = ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0, c.bg2); grd.addColorStop(1, c.bg1);
  ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

  var sunrise = score / targetScore;
  if(sunrise > 0 && state === 'playing'){
    var sg = ctx.createLinearGradient(0, H*0.55, 0, H);
    var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    sg.addColorStop(0, light ? 'rgba(255,180,80,0)' : 'rgba(255,140,60,0)');
    sg.addColorStop(0.5, light ? 'rgba(255,160,70,'+(sunrise*0.12)+')' : 'rgba(255,120,50,'+(sunrise*0.18)+')');
    sg.addColorStop(1, light ? 'rgba(255,200,120,'+(sunrise*0.25)+')' : 'rgba(255,160,80,'+(sunrise*0.3)+')');
    ctx.fillStyle = sg; ctx.fillRect(0, H*0.55, W, H*0.45);
  }

  ctx.strokeStyle = c.grid; ctx.lineWidth = 1;
  for(var gx=0;gx<W;gx+=40){ ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke(); }
  for(var gy=0;gy<H;gy+=40){ ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke(); }

  ctx.save();
  ctx.translate(sx, sy);

  var fogD = 0.3 + difficulty*0.35;
  for(var fi=0;fi<6;fi++){
    var fx = (Math.sin(elapsed*0.15+fi*1.7)*0.5+0.5)*W;
    var fy = (Math.cos(elapsed*0.12+fi*2.3)*0.5+0.5)*H*0.7;
    var fr = 80 + fi*40;
    var fg = ctx.createRadialGradient(fx,fy,0,fx,fy,fr);
    fg.addColorStop(0, c.fog + (0.08+fogD*0.06)+')');
    fg.addColorStop(1, c.fog + '0)');
    ctx.fillStyle = fg; ctx.fillRect(fx-fr,fy-fr,fr*2,fr*2);
  }

  for(var fb=0;fb<fogBanks.length;fb++){
    var fog = fogBanks[fb];
    ctx.save();
    ctx.translate(fog.x, fog.y);
    ctx.rotate(fog.rot);
    ctx.globalAlpha = fog.alpha;
    var fbGrd = ctx.createRadialGradient(0,0,0,0,0,fog.w*0.6);
    fbGrd.addColorStop(0, c.fog + '0.5)');
    fbGrd.addColorStop(1, c.fog + '0)');
    ctx.fillStyle = fbGrd;
    ctx.beginPath(); ctx.ellipse(0,0,fog.w*0.5,fog.h*0.5,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  for(var pi=0;pi<pings.length;pi++){
    var ping = pings[pi];
    var alpha = ping.life;
    var pr = ping.r * (0.85 + 0.15*Math.sin(ping.pulse));
    ctx.globalAlpha = alpha;
    ctx.shadowBlur = 20; ctx.shadowColor = ping.color;
    ctx.beginPath(); ctx.arc(ping.x, ping.y, pr*1.8, 0, Math.PI*2);
    ctx.fillStyle = ping.color.replace(')', ',0.15)').replace('rgb','rgba').replace('#', '');
    if(ping.color.charAt(0)==='#'){
      var hex = ping.color.slice(1);
      var r2=parseInt(hex.slice(0,2),16),g2=parseInt(hex.slice(2,4),16),b2=parseInt(hex.slice(4,6),16);
      ctx.fillStyle = 'rgba('+r2+','+g2+','+b2+','+(0.12*alpha)+')';
    }
    ctx.fill();
    ctx.shadowBlur = 12; ctx.shadowColor = ping.color;
    ctx.beginPath(); ctx.arc(ping.x, ping.y, pr, 0, Math.PI*2);
    ctx.fillStyle = ping.color; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = alpha * 0.6;
    ctx.strokeStyle = ping.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ping.x, ping.y, pr + 4, -Math.PI/2, -Math.PI/2 + ping.life*Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(ping.x, ping.y, pr*0.35, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.globalAlpha = alpha*0.8; ctx.fill();
    ctx.globalAlpha = 1;
  }

  for(var pt2=0;pt2<particles.length;pt2++){
    var part = particles[pt2];
    ctx.globalAlpha = part.life;
    ctx.fillStyle = part.color;
    ctx.beginPath(); ctx.arc(part.x, part.y, part.r*part.life, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.shadowBlur = 16; ctx.shadowColor = c.droneGlow;
  ctx.fillStyle = c.drone;
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - player.r - 4);
  ctx.lineTo(player.x - player.r, player.y + player.r*0.6);
  ctx.lineTo(player.x, player.y + player.r*0.2);
  ctx.lineTo(player.x + player.r, player.y + player.r*0.6);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = c.droneGlow; ctx.lineWidth = 2; ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r+6, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;

  if(hits > 0){
    ctx.font = '600 11px ui-monospace, Menlo, monospace';
    ctx.fillStyle = getColors().drone;
    ctx.globalAlpha = 0.7;
    ctx.textAlign = 'left';
    ctx.fillText('HULL ' + (maxHits-hits) + '/' + maxHits, 16, H - 24);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

var lastTime = 0;
function loop(ts){
  var dt = Math.min((ts - lastTime) / 1000, 0.05);
  if(!lastTime) dt = 0.016;
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function setTarget(x,y){
  if(state !== 'playing') return;
  player.tx = x; player.ty = y;
}

function onPointerDown(e){
  if(state !== 'playing') return;
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  setTarget(e.clientX - rect.left, e.clientY - rect.top);
}
function onPointerMove(e){
  if(state !== 'playing') return;
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  setTarget(e.clientX - rect.left, e.clientY - rect.top);
}

document.getElementById('btn-start').addEventListener('click', function(e){
  e.stopPropagation(); startGame();
});
document.getElementById('btn-restart').addEventListener('click', function(e){
  e.stopPropagation(); startGame();
});

canvas.addEventListener('pointerdown', onPointerDown, {passive:false});
canvas.addEventListener('pointermove', onPointerMove, {passive:false});
canvas.addEventListener('touchstart', function(e){ if(state==='playing') e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', function(e){ if(state==='playing') e.preventDefault(); }, {passive:false});

document.addEventListener('keydown', function(e){
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') keys.up=true;
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') keys.down=true;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=true;
});
document.addEventListener('keyup', function(e){
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') keys.down=false;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=false;
});

window.addEventListener('resize', function(){ resize(); drawRing(); });

resize();
drawRing();
draw();
requestAnimationFrame(loop);

})();
</script>
</body>
