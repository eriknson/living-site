<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canyon Escape</title>
<style>
  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background-color: #1a0f0c;
    color: #f0d8c0;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }
  #ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    background: rgba(26, 15, 12, 0.85);
    padding: 2rem;
    border-radius: 1rem;
    border: 1px solid #d96b27;
    text-align: center;
    pointer-events: auto;
  }
  .screen.active {
    display: flex;
  }
  h1 {
    margin: 0 0 1rem 0;
    color: #d96b27;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  p {
    margin: 0 0 2rem 0;
    line-height: 1.5;
    max-width: 300px;
  }
  button {
    background: #d96b27;
    color: #1a0f0c;
    border: none;
    padding: 1rem 2rem;
    font-size: 1.2rem;
    font-family: inherit;
    font-weight: bold;
    border-radius: 0.5rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s, background 0.2s;
    pointer-events: auto;
  }
  button:active {
    transform: scale(0.95);
  }
  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 1rem);
    left: env(safe-area-inset-left, 1rem);
    right: env(safe-area-inset-right, 1rem);
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: bold;
    pointer-events: none;
    text-shadow: 1px 1px 2px #000;
    z-index: 10;
  }
  .hidden { display: none !important; }
  
  @media (prefers-color-scheme: light) {
    body { background-color: #f4dcb8; color: #3a1f15; }
    .screen { background: rgba(244, 220, 184, 0.9); border-color: #b7410e; }
    h1 { color: #b7410e; }
    button { background: #b7410e; color: #f4dcb8; }
    #hud { text-shadow: 1px 1px 2px rgba(255,255,255,0.5); }
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud" class="hidden">
  <div id="distance">Dist: 0m</div>
  <div id="danger">Danger: 0m</div>
</div>
<div id="ui-layer">
  <div id="start-screen" class="screen active">
    <h1>Canyon Escape</h1>
    <p>Swipe L/R to switch lanes.<br>Flick UP to jump chasms.<br>Outrun the bulldozer.</p>
    <button data-smoke="start" id="start-btn">Start</button>
  </div>
  <div id="game-over-screen" class="screen">
    <h1 id="go-title">Game Over</h1>
    <p id="go-desc">The dust consumed you.</p>
    <button data-smoke="restart" id="restart-btn">Restart</button>
  </div>
</div>

<script>
let state = 'start';
let lastTime = 0;
let W, H;
let ctx;
let canvas;

let player = { x: 0, y: 0, z: 0, lane: 0, vy: 0, speed: 15, radius: 0.3 };
let bulldozer = { z: -15, speed: 14 };
let camera = { x: 0, y: 2.5, z: -5, shake: 0 };
let track = [];
let particles = [];

const GRAVITY = -40;
const JUMP_VELOCITY = 12;
const MAX_Z = 500;
const LANE_WIDTH = 1.2;
const FOV = 0.8;
let minLane = -1;
let maxLane = 1;

let audioCtx;

function isDarkMode() {
    if (window.matchMedia) {
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    return true;
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        let now = audioCtx.currentTime;
        if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'catch' || type === 'fall') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(500, now + 0.1);
            osc.frequency.setValueAtTime(600, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    } catch(e) {}
}

function vibrate(pattern) {
    if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch(e) {}
    }
}

function generateTrack() {
    track = [];
    let lastZ = 20;
    while (lastZ < MAX_Z - 20) {
        let gap = Math.random() * 10 + 10;
        lastZ += gap;
        
        let type = Math.random() < 0.4 ? 'chasm' : 'rock';
        let lane = Math.floor(Math.random() * 3) - 1;
        
        track.push({ z: lastZ, lane, type, length: type === 'chasm' ? 4 : 1 });
        
        if (Math.random() < 0.3) {
            let lane2 = Math.floor(Math.random() * 3) - 1;
            if (lane2 !== lane) {
                track.push({ z: lastZ, lane: lane2, type: 'rock', length: 1 });
            }
        }
    }
}

function createDust(x, y, z, count, isBulldozer = false) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * (isBulldozer ? 8 : 1),
            y: y + Math.random() * (isBulldozer ? 5 : 1),
            z: z + (Math.random() - 0.5) * 2,
            vx: (Math.random() - 0.5) * 2,
            vy: Math.random() * 2 + (isBulldozer ? 2 : 0),
            vz: (Math.random() - 0.5) * 2,
            size: Math.random() * 0.5 + 0.2,
            life: Math.random() * 0.5 + 0.5,
            maxLife: 1,
            color: isDarkMode() ? '#5a2a18' : '#d96b27'
        });
    }
}

function project(x, y, z, camX, camY, camZ) {
    const dz = z - camZ;
    if (dz <= 0.1) return null;
    const scale = FOV / dz;
    
    let shimmer = 0;
    if (y === 0 && dz > 10) {
        shimmer = Math.sin(dz * 0.5 + performance.now() * 0.01) * (dz - 10) * 0.002 * W;
    }
    
    const screenX = W/2 + (x - camX) * scale * W + shimmer;
    const screenY = H * 0.4 + (camY - y) * scale * W;
    return { x: screenX, y: screenY, scale };
}

function update(dt) {
    let progress = player.z / MAX_Z;
    let targetSpeed = 15 + progress * 15;
    player.speed += (targetSpeed - player.speed) * 2 * dt;
    bulldozer.speed = 14.5 + progress * 15.5;
    
    player.z += player.speed * dt;
    player.x += (player.lane * LANE_WIDTH - player.x) * 15 * dt;
    
    if (player.y > 0 || player.vy !== 0) {
        player.vy += GRAVITY * dt;
        player.y += player.vy * dt;
        if (player.y <= 0) {
            player.y = 0;
            player.vy = 0;
            createDust(player.x, player.y, player.z, 5);
            camera.shake = 0.2;
            playSound('hit'); // soft land sound
        }
    } else if (Math.random() < 0.3) {
        createDust(player.x, 0, player.z, 1);
    }
    
    bulldozer.z += bulldozer.speed * dt;
    for(let i=0; i<3; i++) {
        createDust((Math.random() - 0.5) * 10, Math.random() * 5, bulldozer.z + Math.random() * 2, 1, true);
    }
    
    let currentZ = player.z;
    for (let obs of track) {
        if (obs.z < currentZ + 1 && obs.z + (obs.length || 1) > currentZ - 1) {
            if (Math.abs(player.x - obs.lane * LANE_WIDTH) < LANE_WIDTH * 0.6) {
                if (obs.type === 'rock' && player.y < 0.5) {
                    player.speed *= 0.5;
                    camera.shake = 0.5;
                    createDust(player.x, player.y, player.z, 10);
                    playSound('hit');
                    vibrate(50);
                    obs.z = -1000; 
                } else if (obs.type === 'chasm' && player.y <= 0) {
                    state = 'gameover';
                    player.y = -2;
                    playSound('fall');
                    endGame(false);
                }
            }
        }
    }
    
    if (bulldozer.z > player.z - 1) {
        state = 'gameover';
        playSound('catch');
        endGame(false);
    }
    
    if (player.z >= MAX_Z) {
        state = 'win';
        playSound('win');
        endGame(true);
    }
    
    camera.z = player.z - 5;
    camera.x = player.x * 0.5;
    if (camera.shake > 0) {
        camera.shake -= dt;
        if (camera.shake < 0) camera.shake = 0;
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.z += p.vz * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    updateHUD();
}

function updateHUD() {
    let distLeft = Math.max(0, Math.floor(MAX_Z - player.z));
    let dangerDist = Math.max(0, Math.floor(player.z - bulldozer.z));
    document.getElementById('distance').innerText = `Dist: ${distLeft}m`;
    let dangerEl = document.getElementById('danger');
    dangerEl.innerText = `Danger: ${dangerDist}m`;
    if (dangerDist < 10) {
        dangerEl.style.color = '#ff3300';
        dangerEl.style.transform = `scale(${1 + Math.random()*0.2})`;
    } else {
        dangerEl.style.color = '';
        dangerEl.style.transform = 'none';
    }
}

function draw() {
    let dark = isDarkMode();
    ctx.fillStyle = dark ? '#1a0f0c' : '#f4dcb8';
    ctx.fillRect(0, 0, W, H);
    
    let horizonY = H * 0.4;
    
    // Sky
    ctx.fillStyle = dark ? '#3a1f15' : '#e6a87c';
    ctx.fillRect(0, 0, W, horizonY);
    
    // Sun
    ctx.fillStyle = dark ? '#f0d8c0' : '#fff';
    ctx.beginPath();
    ctx.arc(W/2, horizonY - 50, 30, 0, Math.PI*2);
    ctx.fill();
    
    // Heat shimmer horizon
    ctx.fillStyle = dark ? '#3a1f15' : '#e6a87c';
    ctx.beginPath();
    for (let x = 0; x <= W; x += 20) {
        let y = horizonY + Math.sin(x * 0.05 + performance.now() * 0.005) * 5;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, 0);
    ctx.lineTo(0, 0);
    ctx.fill();
    
    // Ground
    let gradient = ctx.createLinearGradient(0, horizonY, 0, H);
    if (dark) {
        gradient.addColorStop(0, '#1a0f0c');
        gradient.addColorStop(1, '#3a1a0f');
    } else {
        gradient.addColorStop(0, '#e6a87c');
        gradient.addColorStop(1, '#f4dcb8');
    }
    ctx.fillStyle = gradient;
    ctx.fillRect(0, horizonY, W, H - horizonY);
    
    ctx.save();
    let shakeX = (Math.random() - 0.5) * camera.shake * 20;
    let shakeY = (Math.random() - 0.5) * camera.shake * 20;
    ctx.translate(shakeX, shakeY);
    
    // Track lines
    ctx.strokeStyle = dark ? '#331a10' : '#d96b27';
    ctx.lineWidth = 2;
    for (let lane = minLane - 1; lane <= maxLane + 1; lane++) {
        let x = lane * LANE_WIDTH + LANE_WIDTH/2;
        let p1 = project(x, 0, player.z, camera.x, camera.y, camera.z);
        let p2 = project(x, 0, player.z + 100, camera.x, camera.y, camera.z);
        if (p1 && p2) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }
    }
    
    let renderList = [];
    
    let wallZ = Math.floor(camera.z / 10) * 10;
    for (let z = wallZ; z <= camera.z + 100; z += 10) {
        renderList.push({ type: 'wallL', z: z });
        renderList.push({ type: 'wallR', z: z });
    }
    
    for (let obs of track) {
        if (obs.z > camera.z && obs.z < camera.z + 100) {
            renderList.push({ type: obs.type, obj: obs, z: obs.z });
        }
    }
    
    renderList.push({ type: 'player', obj: player, z: player.z });
    renderList.push({ type: 'bulldozer', obj: bulldozer, z: bulldozer.z });
    
    for (let p of particles) {
        if (p.z > camera.z) {
            renderList.push({ type: 'particle', obj: p, z: p.z });
        }
    }
    
    renderList.sort((a, b) => b.z - a.z);
    
    for (let item of renderList) {
        if (item.type === 'wallL' || item.type === 'wallR') {
            let z = item.z;
            let sign = item.type === 'wallL' ? -1 : 1;
            let p1 = project(sign * 3, 0, z, camera.x, camera.y, camera.z);
            let p2 = project(sign * 3, 8, z, camera.x, camera.y, camera.z);
            let p3 = project(sign * 3, 8, z+10, camera.x, camera.y, camera.z);
            let p4 = project(sign * 3, 0, z+10, camera.x, camera.y, camera.z);
            if (p1 && p2 && p3 && p4) {
                ctx.fillStyle = (Math.abs(z)/10)%2===0 ? (dark ? '#4a1a08' : '#b7410e') : (dark ? '#3a1005' : '#8b320a');
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
                ctx.fill();
            }
            continue;
        }
        
        let p = project(item.obj.x !== undefined ? item.obj.x : (item.obj.lane * LANE_WIDTH), item.obj.y || 0, item.z, camera.x, camera.y, camera.z);
        if (!p) continue;
        
        if (item.type === 'chasm') {
            let pEnd = project(item.obj.lane * LANE_WIDTH, 0, item.z + item.obj.length, camera.x, camera.y, camera.z);
            if (pEnd) {
                ctx.fillStyle = dark ? '#0a0503' : '#3a1f15';
                let w1 = LANE_WIDTH * p.scale * W * 0.95;
                let w2 = LANE_WIDTH * pEnd.scale * W * 0.95;
                ctx.beginPath();
                ctx.moveTo(p.x - w1/2, p.y);
                ctx.lineTo(p.x + w1/2, p.y);
                ctx.lineTo(pEnd.x + w2/2, pEnd.y);
                ctx.lineTo(pEnd.x - w2/2, pEnd.y);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.moveTo(p.x - w1/2, p.y);
                ctx.lineTo(p.x - w1/2 + 5, p.y + 20 * p.scale);
                ctx.lineTo(pEnd.x - w2/2 + 5, pEnd.y + 20 * pEnd.scale);
                ctx.lineTo(pEnd.x - w2/2, pEnd.y);
                ctx.fill();
            }
        } else if (item.type === 'rock') {
            let size = 0.5 * p.scale * W;
            ctx.fillStyle = dark ? '#5a2a18' : '#8b320a';
            ctx.fillRect(p.x - size/2, p.y - size, size, size);
            ctx.fillStyle = '#d96b27';
            ctx.fillRect(p.x - size/2, p.y - size, size, size*0.2);
        } else if (item.type === 'player') {
            let size = player.radius * p.scale * W;
            ctx.fillStyle = '#00d8ff';
            ctx.beginPath();
            ctx.arc(p.x, p.y - size, size, 0, Math.PI*2);
            ctx.fill();
            
            let rollAngle = (player.z % (Math.PI * 2 * player.radius)) / player.radius;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(p.x, p.y - size, size, rollAngle, rollAngle + Math.PI);
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(p.x, p.y + (player.y * p.scale * W), size, size*0.3, 0, 0, Math.PI*2);
            ctx.fill();
        } else if (item.type === 'bulldozer') {
            let pLeft = project(-4, 0, item.z, camera.x, camera.y, camera.z);
            let pRight = project(4, 0, item.z, camera.x, camera.y, camera.z);
            if (pLeft && pRight) {
                ctx.fillStyle = '#0a0503';
                ctx.beginPath();
                ctx.moveTo(pLeft.x, pLeft.y);
                ctx.lineTo(pRight.x, pRight.y);
                ctx.lineTo(pRight.x, pRight.y - 500 * pRight.scale);
                ctx.lineTo(pLeft.x, pLeft.y - 500 * pLeft.scale);
                ctx.fill();
                
                let pEye1 = project(-1, 2, item.z, camera.x, camera.y, camera.z);
                let pEye2 = project(1, 2, item.z, camera.x, camera.y, camera.z);
                if (pEye1 && pEye2) {
                    ctx.fillStyle = '#ff3300';
                    ctx.shadowColor = '#ff3300';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(pEye1.x, pEye1.y, 10 * pEye1.scale * W, 0, Math.PI*2);
                    ctx.arc(pEye2.x, pEye2.y, 10 * pEye2.scale * W, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        } else if (item.type === 'particle') {
            let size = item.obj.size * p.scale * W;
            ctx.fillStyle = item.obj.color;
            ctx.globalAlpha = item.obj.life / item.obj.maxLife;
            ctx.beginPath();
            ctx.arc(p.x, p.y - size, size, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
    
    ctx.restore();
    
    let dangerDist = player.z - bulldozer.z;
    if (dangerDist < 15 && state === 'playing') {
        let alpha = 1 - (dangerDist / 15);
        let grad = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.8);
        grad.addColorStop(0, 'rgba(255, 0, 0, 0)');
        grad.addColorStop(1, `rgba(255, 0, 0, ${alpha * 0.5})`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
    }
}

function startGame() {
    initAudio();
    document.getElementById('start-screen').classList.remove('active');
    document.getElementById('game-over-screen').classList.remove('active');
    document.getElementById('hud').classList.remove('hidden');
    
    player = { x: 0, y: 0, z: 0, lane: 0, vy: 0, speed: 15, radius: 0.3 };
    bulldozer = { z: -15, speed: 14 };
    camera = { x: 0, y: 2.5, z: -5, shake: 0 };
    particles = [];
    
    generateTrack();
    
    state = 'playing';
    lastTime = performance.now();
}

function endGame(win) {
    state = win ? 'win' : 'gameover';
    document.getElementById('hud').classList.add('hidden');
    let goScreen = document.getElementById('game-over-screen');
    goScreen.classList.add('active');
    document.getElementById('go-title').innerText = win ? 'CANYON CLEARED' : 'GAME OVER';
    document.getElementById('go-desc').innerText = win ? 'You outran the dust.' : 'The dust consumed you.';
    vibrate(win ? [50, 50, 50, 50, 100] : [200, 100, 200]);
}

function loop(time) {
    requestAnimationFrame(loop);
    let dt = (time - lastTime) / 1000;
    lastTime = time;
    if (dt > 0.1) dt = 0.1;
    
    if (state === 'playing') {
        update(dt);
    }
    draw();
}

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}

window.addEventListener('resize', resize);

let startX = 0, startY = 0;
window.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
}, {passive: false});

window.addEventListener('touchmove', e => {
    if (state === 'playing') e.preventDefault();
}, {passive: false});

window.addEventListener('touchend', e => {
    if (state !== 'playing') return;
    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;
    let dx = endX - startX;
    let dy = endY - startY;
    
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        if (dx > 0 && player.lane < maxLane) {
            player.lane++;
            playSound('jump');
        } else if (dx < 0 && player.lane > minLane) {
            player.lane--;
            playSound('jump');
        }
    } else if (Math.abs(dy) > Math.abs(dx) && dy < -30) {
        if (player.y === 0) {
            player.vy = JUMP_VELOCITY;
            playSound('jump');
        }
    }
});

window.addEventListener('keydown', e => {
    if (state !== 'playing') return;
    if (e.key === 'ArrowLeft' && player.lane > minLane) {
        player.lane--;
        playSound('jump');
    } else if (e.key === 'ArrowRight' && player.lane < maxLane) {
        player.lane++;
        playSound('jump');
    } else if (e.key === 'ArrowUp' && player.y === 0) {
        player.vy = JUMP_VELOCITY;
        playSound('jump');
    }
});

window.onload = () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resize();
    draw();
    
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
    
    requestAnimationFrame(loop);
};
</script>
</body>
</html>
