<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deploy Dawn</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #e8edf2;
    --fg: #1a2332;
    --muted: #5a6a7a;
    --accent: #00c8b4;
    --accent-dim: #008f80;
    --danger: #e04545;
    --panel: rgba(255,255,255,0.88);
    --panel-border: rgba(26,35,50,0.12);
    --fog-tint: rgba(180,200,220,0.5);
    --bar-bg: rgba(26,35,50,0.1);
    --bar-fill: #00c8b4;
    --bar-fog: #7a8fa8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1219;
      --fg: #d8e4f0;
      --muted: #7a8fa8;
      --accent: #00f0d8;
      --accent-dim: #00a898;
      --danger: #ff5555;
      --panel: rgba(12,18,25,0.92);
      --panel-border: rgba(216,228,240,0.1);
      --fog-tint: rgba(40,60,80,0.6);
      --bar-bg: rgba(216,228,240,0.08);
      --bar-fill: #00f0d8;
      --bar-fog: #4a6078;
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    padding: max(10px, env(safe-area-inset-top)) 16px 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
    z-index: 2;
    pointer-events: none;
  }
  .hud-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hud-value {
    font-size: 18px;
    font-weight: 600;
    color: var(--fg);
  }
  .bar-wrap {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bar-track {
    flex: 1;
    height: 8px;
    background: var(--bar-bg);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    transition: width 0.15s ease-out;
  }
  #bar-deploy { background: var(--bar-fill); box-shadow: 0 0 8px var(--accent-dim); }
  #bar-fog { background: var(--bar-fog); }
  #canvas-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  .overlay.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    pointer-events: auto;
  }
  h1 {
    font-size: clamp(22px, 6vw, 28px);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    color: var(--fg);
  }
  .subtitle {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .hint kbd {
    display: inline-block;
    padding: 2px 6px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    font-size: 10px;
    background: var(--bar-bg);
  }
  button {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--accent);
    color: #0a1418;
    transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
    pointer-events: auto;
  }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .score-final {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    margin: 8px 0 4px;
  }
  .result-msg {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .result-msg.win { color: var(--accent-dim); }
  .result-msg.lose { color: var(--danger); }
  #flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.08s;
  }
  #flash.good { background: rgba(0,200,180,0.25); opacity: 1; }
  #flash.bad { background: rgba(224,69,69,0.3); opacity: 1; }
  #flash.win-flash { background: rgba(0,240,216,0.35); opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>
      <div class="hud-label">Shipped</div>
      <div class="hud-value" id="score-display">0</div>
    </div>
    <div style="text-align:right">
      <div class="hud-label">Combo</div>
      <div class="hud-value" id="combo-display">×1</div>
    </div>
    <div class="bar-wrap">
      <div class="bar-row">
        <span class="hud-label" style="min-width:52px">Deploy</span>
        <div class="bar-track"><div class="bar-fill" id="bar-deploy"></div></div>
      </div>
      <div class="bar-row">
        <span class="hud-label" style="min-width:52px">Fog</span>
        <div class="bar-track"><div class="bar-fill" id="bar-fog"></div></div>
      </div>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game"></canvas>
    <div id="flash"></div>
    <div id="title-overlay" class="overlay">
      <div class="panel">
        <h1>Deploy Dawn</h1>
        <p class="subtitle">Catch build shipments through the pre-dawn fog before the pipeline stalls.</p>
        <p class="hint">Swipe <kbd>←</kbd> <kbd>→</kbd> or drag to switch lanes.<br>Collect glowing cargo · dodge decoys &amp; failed builds.</p>
        <button type="button" data-smoke="start" id="btn-start">Begin Deploy</button>
      </div>
    </div>
    <div id="gameover-overlay" class="overlay hidden">
      <div class="panel">
        <h1 id="go-title">Pipeline Stalled</h1>
        <div class="score-final" id="go-score">0</div>
        <p class="result-msg" id="go-msg">The fog swallowed the horizon.</p>
        <button type="button" data-smoke="restart" id="btn-restart">Deploy Again</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var flashEl = document.getElementById('flash');
  var titleOverlay = document.getElementById('title-overlay');
  var gameoverOverlay = document.getElementById('gameover-overlay');
  var btnStart = document.getElementById('btn-start');
  var btnRestart = document.getElementById('btn-restart');
  var scoreDisplay = document.getElementById('score-display');
  var comboDisplay = document.getElementById('combo-display');
  var barDeploy = document.getElementById('bar-deploy');
  var barFog = document.getElementById('bar-fog');
  var goTitle = document.getElementById('go-title');
  var goScore = document.getElementById('go-score');
  var goMsg = document.getElementById('go-msg');

  var STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2, WIN: 3 };
  var state = STATE.TITLE;
  var W = 360, H = 640;
  var dpr = 1;
  var laneCount = 3;
  var playerLane = 1;
  var playerY = 0;
  var laneW = W / laneCount;

  var progress = 0;
  var fogLevel = 0;
  var score = 0;
  var combo = 0;
  var maxCombo = 0;
  var misses = 0;
  var maxMisses = 6;
  var elapsed = 0;
  var spawnTimer = 0;
  var spawnInterval = 1.1;
  var baseSpeed = 140;
  var speed = baseSpeed;
  var decoyChance = 0;
  var entities = [];
  var particles = [];
  var laneLines = [];
  var shakeT = 0;
  var hitPause = 0;
  var targetLane = 1;
  var laneAnim = 1;
  var lastTime = 0;
  var animId = 0;
  var audioCtx = null;

  var darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* silent */ }
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* */ }
  }

  function resize() {
    if (!canvas || !ctx) return;
    var wrap = document.getElementById('canvas-wrap');
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(280, Math.floor(rect.width));
    H = Math.max(200, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    laneW = W / laneCount;
    playerY = H - laneW * 0.55;
    laneLines = [];
    for (var i = 1; i < laneCount; i++) laneLines.push(i * laneW);
  }

  function resetGame() {
    progress = 0;
    fogLevel = 0.08;
    score = 0;
    combo = 0;
    maxCombo = 0;
    misses = 0;
    elapsed = 0;
    spawnTimer = 0;
    spawnInterval = 1.1;
    speed = baseSpeed;
    decoyChance = 0.08;
    entities = [];
    particles = [];
    playerLane = 1;
    targetLane = 1;
    laneAnim = 1;
    shakeT = 0;
    hitPause = 0;
    updateHUD();
  }

  function updateHUD() {
    if (scoreDisplay) scoreDisplay.textContent = String(score);
    if (comboDisplay) comboDisplay.textContent = '×' + Math.max(1, combo);
    if (barDeploy) barDeploy.style.width = Math.min(100, progress * 100) + '%';
    if (barFog) barFog.style.width = Math.min(100, fogLevel * 100) + '%';
  }

  function flash(cls) {
    if (!flashEl) return;
    flashEl.className = cls || '';
    setTimeout(function () { if (flashEl) flashEl.className = ''; }, 80);
  }

  function spawnEntity() {
    var lane = Math.floor(Math.random() * laneCount);
    var roll = Math.random();
    var type;
    if (roll < decoyChance * 0.5) type = 'bad';
    else if (roll < decoyChance) type = 'decoy';
    else type = 'good';
    entities.push({
      lane: lane,
      y: -laneW * 0.4,
      type: type,
      wobble: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 2,
      collected: false
    });
  }

  function spawnParticles(x, y, color, n) {
    for (var i = 0; i < (n || 8); i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 30,
        life: 0.4 + Math.random() * 0.3,
        maxLife: 0.7,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function laneX(lane) {
    return lane * laneW + laneW * 0.5;
  }

  function moveLane(dir) {
    if (state !== STATE.PLAYING) return;
    var next = playerLane + dir;
    if (next >= 0 && next < laneCount) {
      targetLane = next;
      playerLane = next;
      playTone(220 + next * 60, 0.06, 'square', 0.04);
    }
  }

  function endGame(won) {
    state = won ? STATE.WIN : STATE.GAMEOVER;
    if (gameoverOverlay) gameoverOverlay.classList.remove('hidden');
    if (goTitle) goTitle.textContent = won ? 'Shipped!' : 'Pipeline Stalled';
    if (goScore) goScore.textContent = String(score);
    if (goMsg) {
      goMsg.textContent = won
        ? 'Deploy window closed — all builds live.'
        : (fogLevel >= 1 ? 'The fog swallowed the horizon.' : 'Too many packages missed.');
      goMsg.className = 'result-msg ' + (won ? 'win' : 'lose');
    }
    if (won) {
      playTone(523, 0.15, 'sine', 0.1);
      setTimeout(function () { playTone(659, 0.15, 'sine', 0.1); }, 120);
      setTimeout(function () { playTone(784, 0.25, 'sine', 0.1); }, 240);
      flash('win-flash');
      vibrate([30, 20, 50]);
    } else {
      playTone(150, 0.3, 'sawtooth', 0.06);
      vibrate(80);
    }
  }

  function startGame() {
    initAudio();
    resetGame();
    state = STATE.PLAYING;
    if (titleOverlay) titleOverlay.classList.add('hidden');
    if (gameoverOverlay) gameoverOverlay.classList.add('hidden');
    lastTime = performance.now();
    playTone(330, 0.1, 'sine', 0.06);
  }

  function collectGood(ex) {
    ex.collected = true;
    var bonus = 1 + Math.floor(combo / 5);
    progress = Math.min(1, progress + 0.055 * bonus);
    score += 10 * bonus;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    spawnParticles(laneX(ex.lane), ex.y, darkMode ? '#00f0d8' : '#00a890', 10);
    playTone(440 + combo * 8, 0.08, 'sine', 0.07);
    if (combo % 5 === 0) vibrate(15);
    flash('good');
    if (progress >= 1) endGame(true);
    updateHUD();
  }

  function hitBad(ex) {
    ex.collected = true;
    combo = 0;
    progress = Math.max(0, progress - 0.08);
    fogLevel = Math.min(1, fogLevel + 0.06);
    misses++;
    shakeT = 0.2;
    hitPause = 0.06;
    spawnParticles(laneX(ex.lane), ex.y, '#e04545', 12);
    playTone(100, 0.15, 'sawtooth', 0.07);
    vibrate(40);
    flash('bad');
    if (misses >= maxMisses) endGame(false);
    updateHUD();
  }

  function missGood() {
    combo = 0;
    misses++;
    fogLevel = Math.min(1, fogLevel + 0.04);
    playTone(180, 0.1, 'triangle', 0.04);
    if (misses >= maxMisses) endGame(false);
    updateHUD();
  }

  function update(dt) {
    if (state !== STATE.PLAYING) return;
    if (hitPause > 0) { hitPause -= dt; return; }

    elapsed += dt;
    fogLevel = Math.min(1, fogLevel + dt * 0.012);
    speed = baseSpeed + elapsed * 4;
    spawnInterval = Math.max(0.35, 1.1 - elapsed * 0.012);
    decoyChance = Math.min(0.35, 0.08 + elapsed * 0.004);

    if (fogLevel >= 1) { endGame(false); return; }

    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer -= spawnInterval;
      spawnEntity();
      if (Math.random() < 0.25 + elapsed * 0.005) spawnEntity();
    }

    laneAnim += (targetLane - laneAnim) * Math.min(1, dt * 14);

    var px = laneX(laneAnim);
    var py = playerY;
    var catchR = laneW * 0.32;

    for (var i = entities.length - 1; i >= 0; i--) {
      var e = entities[i];
      e.y += speed * dt;
      e.wobble += dt * 3;
      if (e.collected) { entities.splice(i, 1); continue; }

      var ex = laneX(e.lane);
      var dy = Math.abs(e.y - py);
      var dx = Math.abs(ex - px);
      if (dy < catchR && dx < laneW * 0.38) {
        if (e.type === 'good') collectGood(e);
        else hitBad(e);
        entities.splice(i, 1);
        continue;
      }
      if (e.y > H + laneW) {
        if (e.type === 'good') missGood();
        entities.splice(i, 1);
      }
    }

    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
      if (p.life <= 0) particles.splice(j, 1);
    }

    if (shakeT > 0) shakeT -= dt;
    updateHUD();
  }

  function drawPixelRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  }

  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    if (darkMode) {
      g.addColorStop(0, '#060a10');
      g.addColorStop(0.5, '#0c1520');
      g.addColorStop(1, '#101c28');
    } else {
      g.addColorStop(0, '#b8c8d8');
      g.addColorStop(0.5, '#c8d8e8');
      g.addColorStop(1, '#d0dfe8');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* horizon glow */
    var hg = ctx.createLinearGradient(0, H * 0.55, 0, H);
    hg.addColorStop(0, 'rgba(0,0,0,0)');
    hg.addColorStop(1, darkMode ? 'rgba(0,180,160,0.08)' : 'rgba(0,140,120,0.12)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, H * 0.55, W, H * 0.45);

    /* lane dividers */
    ctx.strokeStyle = darkMode ? 'rgba(120,150,180,0.15)' : 'rgba(80,110,140,0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    for (var i = 0; i < laneLines.length; i++) {
      ctx.beginPath();
      ctx.moveTo(laneLines[i], 0);
      ctx.lineTo(laneLines[i], H);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function drawFog() {
    var alpha = fogLevel * 0.65;
    var fg = ctx.createLinearGradient(0, 0, 0, H);
    fg.addColorStop(0, darkMode ? 'rgba(20,35,50,' + (alpha * 0.3) + ')' : 'rgba(200,215,230,' + (alpha * 0.4) + ')');
    fg.addColorStop(0.6, darkMode ? 'rgba(15,25,35,' + (alpha * 0.5) + ')' : 'rgba(180,200,215,' + (alpha * 0.55) + ')');
    fg.addColorStop(1, darkMode ? 'rgba(10,18,25,' + alpha + ')' : 'rgba(160,180,200,' + alpha + ')');
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, W, H);

    /* drifting fog wisps */
    var t = elapsed * 0.3;
    ctx.globalAlpha = fogLevel * 0.25;
    for (var i = 0; i < 5; i++) {
      var wx = ((Math.sin(t + i * 1.7) * 0.5 + 0.5) * W);
      var wy = H * 0.2 + i * H * 0.12 + Math.sin(t * 0.7 + i) * 20;
      var wr = laneW * (1.2 + Math.sin(t + i) * 0.3);
      var wg = ctx.createRadialGradient(wx, wy, 0, wx, wy, wr);
      wg.addColorStop(0, darkMode ? 'rgba(180,200,220,0.15)' : 'rgba(255,255,255,0.35)');
      wg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = wg;
      ctx.fillRect(wx - wr, wy - wr, wr * 2, wr * 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawEntity(e) {
    var x = laneX(e.lane);
    var y = e.y;
    var s = laneW * 0.28;
    var bob = Math.sin(e.wobble) * 3;

    ctx.save();
    ctx.translate(x, y + bob);

    if (e.type === 'good') {
      var pulse = 0.7 + Math.sin(e.wobble * 2) * 0.3;
      var col = darkMode ? '#00f0d8' : '#00b8a0';
      /* neon trail */
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = col;
      ctx.fillRect(-s * 0.3, -s * 1.8, s * 0.6, s * 1.2);
      ctx.globalAlpha = 1;
      /* crate body pixel style */
      drawPixelRect(-s, -s, s * 2, s * 2, darkMode ? '#0a2830' : '#084038');
      drawPixelRect(-s + 3, -s + 3, s * 2 - 6, s * 2 - 6, col);
      drawPixelRect(-s + 6, -s + 6, s * 2 - 12, s * 2 - 12, darkMode ? '#062018' : '#063028');
      /* glow core */
      ctx.shadowColor = col;
      ctx.shadowBlur = 12 * pulse;
      drawPixelRect(-s * 0.3, -s * 0.3, s * 0.6, s * 0.6, '#ffffff');
      ctx.shadowBlur = 0;
      /* bracket marks */
      ctx.fillStyle = col;
      ctx.globalAlpha = pulse;
      ctx.fillRect(-s + 2, -s + 2, 4, 4);
      ctx.fillRect(s - 6, -s + 2, 4, 4);
      ctx.fillRect(-s + 2, s - 6, 4, 4);
      ctx.fillRect(s - 6, s - 6, 4, 4);
      ctx.globalAlpha = 1;
    } else if (e.type === 'decoy') {
      /* looks similar but wrong hue — amber tint, dimmer glow */
      var dcol = darkMode ? '#809898' : '#688880';
      var fake = darkMode ? '#60a0a0' : '#509888';
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = fake;
      ctx.fillRect(-s * 0.3, -s * 1.5, s * 0.6, s);
      ctx.globalAlpha = 1;
      drawPixelRect(-s, -s, s * 2, s * 2, darkMode ? '#1a2028' : '#304038');
      drawPixelRect(-s + 3, -s + 3, s * 2 - 6, s * 2 - 6, dcol);
      drawPixelRect(-s + 6, -s + 6, s * 2 - 12, s * 2 - 12, darkMode ? '#121820' : '#203028');
      ctx.fillStyle = fake;
      ctx.globalAlpha = 0.5 + Math.sin(e.wobble) * 0.2;
      ctx.fillRect(-s * 0.25, -s * 0.25, s * 0.5, s * 0.5);
      ctx.globalAlpha = 1;
      /* X mark hint at high fog */
      if (fogLevel > 0.5) {
        ctx.strokeStyle = 'rgba(224,69,69,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-s * 0.4, -s * 0.4);
        ctx.lineTo(s * 0.4, s * 0.4);
        ctx.moveTo(s * 0.4, -s * 0.4);
        ctx.lineTo(-s * 0.4, s * 0.4);
        ctx.stroke();
      }
    } else {
      /* failed build — red, cracked */
      var rcol = '#e04545';
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = rcol;
      ctx.fillRect(-s * 0.4, -s * 1.6, s * 0.8, s);
      ctx.globalAlpha = 1;
      drawPixelRect(-s, -s, s * 2, s * 2, '#401818');
      drawPixelRect(-s + 3, -s + 3, s * 2 - 6, s * 2 - 6, rcol);
      ctx.strokeStyle = '#802020';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-s * 0.5, 0);
      ctx.lineTo(s * 0.5, s * 0.3);
      ctx.moveTo(0, -s * 0.5);
      ctx.lineTo(s * 0.2, s * 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer() {
    var x = laneX(laneAnim);
    var y = playerY;
    var s = laneW * 0.34;

    ctx.save();
    ctx.translate(x, y);

    /* ship body */
    var hull = darkMode ? '#1a3040' : '#2a5060';
    var trim = darkMode ? '#00f0d8' : '#00a890';
    ctx.fillStyle = hull;
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.9);
    ctx.lineTo(s * 0.7, s * 0.5);
    ctx.lineTo(s * 0.35, s * 0.7);
    ctx.lineTo(-s * 0.35, s * 0.7);
    ctx.lineTo(-s * 0.7, s * 0.5);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = trim;
    ctx.lineWidth = 2;
    ctx.stroke();

    /* cockpit glow */
    ctx.shadowColor = trim;
    ctx.shadowBlur = 8;
    ctx.fillStyle = trim;
    ctx.fillRect(-s * 0.15, -s * 0.3, s * 0.3, s * 0.25);
    ctx.shadowBlur = 0;

    /* engine trail */
    var et = Math.sin(elapsed * 12) * 0.5 + 0.5;
    ctx.globalAlpha = 0.4 + et * 0.3;
    ctx.fillStyle = trim;
    ctx.fillRect(-s * 0.12, s * 0.65, s * 0.24, s * 0.2 + et * 6);
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    if (!ctx) return;
    ctx.save();
    var sx = 0, sy = 0;
    if (shakeT > 0) {
      sx = (Math.random() - 0.5) * 6 * (shakeT / 0.2);
      sy = (Math.random() - 0.5) * 6 * (shakeT / 0.2);
    }
    ctx.translate(sx, sy);

    drawBackground();
    for (var i = 0; i < entities.length; i++) drawEntity(entities[i]);
    if (state === STATE.PLAYING || state === STATE.GAMEOVER || state === STATE.WIN) drawPlayer();
    drawParticles();
    drawFog();
    ctx.restore();
  }

  function loop(now) {
    animId = requestAnimationFrame(loop);
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
  }

  /* Touch swipe */
  var touchStartX = 0;
  var touchStartY = 0;
  var touchMoved = false;

  function onTouchStart(e) {
    if (!e.touches || !e.touches.length) return;
    e.preventDefault();
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMoved = false;
  }

  function onTouchMove(e) {
    e.preventDefault();
  }

  function onTouchEnd(e) {
    e.preventDefault();
    if (!e.changedTouches || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
      moveLane(dx > 0 ? 1 : -1);
      touchMoved = true;
    }
  }

  function onKeyDown(e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { moveLane(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { moveLane(1); e.preventDefault(); }
  }

  /* Title screen tap center shouldn't crash */
  function onCanvasPointer(e) {
    if (state !== STATE.PLAYING) return;
    e.preventDefault();
  }

  if (btnStart) btnStart.addEventListener('click', function (e) { e.stopPropagation(); startGame(); });
  if (btnRestart) btnRestart.addEventListener('click', function (e) { e.stopPropagation(); startGame(); });

  if (canvas) {
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('mousedown', function (e) {
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      touchMoved = false;
    });
    canvas.addEventListener('mouseup', function (e) {
      var dx = e.clientX - touchStartX;
      var dy = e.clientY - touchStartY;
      if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
    });
    canvas.addEventListener('pointerdown', onCanvasPointer);
  }

  document.addEventListener('keydown', onKeyDown);

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (ev) {
      darkMode = ev.matches;
    });
  }

  window.addEventListener('resize', resize);

  resize();
  render();
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
