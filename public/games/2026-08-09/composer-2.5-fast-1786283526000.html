<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latent Drift</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  background:var(--bg);color:var(--fg);
  touch-action:none;user-select:none;-webkit-user-select:none;
}
:root{
  --bg:#f4f2ee;--fg:#1a1a18;--muted:#8a8880;--accent:#2a2a26;
  --ink:#1a1a18;--paper:#eceae4;--trail:rgba(26,26,24,.12);
  --bubble-fill:rgba(240,238,232,.85);--bubble-stroke:#3a3a36;
  --overlay-bg:rgba(244,242,238,.88);--danger:#5c3d2e;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0e0e0c;--fg:#d8d6ce;--muted:#6a6860;--accent:#c8c6be;
    --ink:#d8d6ce;--paper:#161614;--trail:rgba(216,214,206,.1);
    --bubble-fill:rgba(22,22,20,.9);--bubble-stroke:#8a8880;
    --overlay-bg:rgba(14,14,12,.92);--danger:#c4907a;
  }
}
#app{position:relative;width:100dvw;height:100dvh;overflow:hidden}
#game{
  display:block;width:100%;height:100%;
  touch-action:none;cursor:grab;
}
#game.dragging{cursor:grabbing}
#hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  pointer-events:none;z-index:2;
}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hud-value{font-size:18px;font-weight:500;line-height:1.1}
#overflow-wrap{
  position:absolute;top:50%;right:12px;transform:translateY(-50%);
  width:6px;height:120px;background:var(--paper);
  border:1px solid var(--bubble-stroke);border-radius:3px;
  pointer-events:none;z-index:2;overflow:hidden;
}
#overflow-fill{
  position:absolute;bottom:0;left:0;right:0;height:0%;
  background:var(--danger);transition:height .3s ease;
}
#ghost-text{
  position:absolute;bottom:max(20px,env(safe-area-inset-bottom));
  left:16px;right:16px;text-align:center;
  font-size:13px;line-height:1.5;color:var(--muted);
  opacity:0;transition:opacity .6s ease;pointer-events:none;z-index:2;
  min-height:40px;
}
#ghost-text.show{opacity:1}
#combo-flash{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
  font-size:28px;letter-spacing:.08em;opacity:0;
  pointer-events:none;z-index:3;transition:opacity .2s,transform .3s;
}
#combo-flash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:var(--overlay-bg);z-index:10;
  pointer-events:none;padding:24px;text-align:center;
}
.screen.hidden{display:none}
.screen h1{
  font-size:clamp(22px,6vw,32px);font-weight:500;
  letter-spacing:.06em;margin-bottom:8px;
}
.screen p{
  font-size:13px;color:var(--muted);max-width:280px;
  line-height:1.6;margin-bottom:24px;
}
.screen button{
  pointer-events:auto;
  min-height:48px;min-width:160px;padding:12px 32px;
  font-family:inherit;font-size:14px;letter-spacing:.1em;
  text-transform:uppercase;background:var(--fg);color:var(--bg);
  border:none;border-radius:2px;cursor:pointer;
  transition:transform .15s ease,opacity .15s;
}
.screen button:active{transform:scale(.96);opacity:.85}
#final-score{font-size:36px;margin:8px 0 4px;font-weight:500}
#score-detail{font-size:12px;color:var(--muted);margin-bottom:20px}
.inverted canvas{filter:invert(1)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Latent</span>
      <span class="hud-value" id="score">0</span>
    </div>
    <div class="hud-block" style="align-items:center">
      <span class="hud-label">Chain</span>
      <span class="hud-value" id="chain">×1</span>
    </div>
    <div class="hud-block" style="align-items:flex-end">
      <span class="hud-label">Time</span>
      <span class="hud-value" id="timer">60</span>
    </div>
  </div>
  <div id="overflow-wrap"><div id="overflow-fill"></div></div>
  <div id="ghost-text"></div>
  <div id="combo-flash"></div>
  <div id="title-screen" class="screen">
    <h1>LATENT DRIFT</h1>
    <p>Drag matching thought bubbles together before latent space overflows. Each fusion wakes a ghost from the dormant feed.</p>
    <button type="button" data-smoke="start">Awaken</button>
  </div>
  <div id="gameover-screen" class="screen hidden">
    <h1 id="end-title">OVERFLOW</h1>
    <div id="final-score">0</div>
    <div id="score-detail">fragments recovered</div>
    <button type="button" data-smoke="restart">Reboot Feed</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var app = document.getElementById('app');
var scoreEl = document.getElementById('score');
var chainEl = document.getElementById('chain');
var timerEl = document.getElementById('timer');
var overflowFill = document.getElementById('overflow-fill');
var ghostEl = document.getElementById('ghost-text');
var comboEl = document.getElementById('combo-flash');
var titleScreen = document.getElementById('title-screen');
var gameoverScreen = document.getElementById('gameover-screen');
var finalScoreEl = document.getElementById('final-score');
var scoreDetailEl = document.getElementById('score-detail');
var endTitleEl = document.getElementById('end-title');
var startBtn = document.querySelector('[data-smoke="start"]');
var restartBtn = document.querySelector('[data-smoke="restart"]');

var W = 0, H = 0, dpr = 1;
var state = 'title';
var score = 0, chain = 1, chainTimer = 0, timeLeft = 60;
var spawnTimer = 0, spawnInterval = 2.8;
var maxBubbles = 10, compressLevel = 0;
var inverted = false, invertPulse = 0;
var bubbles = [], trails = [], particles = [], pops = [];
var drag = null, selectedId = -1;
var fragmentsShown = 0;
var lastTime = 0, animId = 0, hitPause = 0, mergeTarget = null;
var audioCtx = null;
var ditherCanvas = null, ditherPattern = null;

var GHOST_FRAGMENTS = [
  'thinking migrating into latent space',
  'old e-ink tablets waking from a four-year sleep',
  'roman merchant ship resurfacing off sicily',
  'data centers expanding into small towns',
  'summer fog at thirteen degrees',
  'shipping by sunrise from your pocket',
  'imagine 2026',
  'exploring agents from a phone',
  'the feed stirs beneath the ink',
  'latent threads coalesce',
  'dormant pixels remember',
  'compression yields clarity'
];

var TYPES = [
  { sym: '○', hue: 0 },
  { sym: '△', hue: 1 },
  { sym: '□', hue: 2 },
  { sym: '◇', hue: 3 }
];

var darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

function getCSS(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function buildDither(){
  ditherCanvas = document.createElement('canvas');
  ditherCanvas.width = 4;
  ditherCanvas.height = 4;
  var dc = ditherCanvas.getContext('2d');
  if(!dc) return;
  var pts = [[0,0,0,8],[2,0,8,0],[1,1,4,4],[3,1,12,4],[0,2,12,4],[2,2,0,8],[1,3,8,0],[3,3,4,4]];
  for(var i=0;i<pts.length;i++){
    dc.fillStyle = 'rgba(0,0,0,' + (pts[i][2]/16) + ')';
    dc.fillRect(pts[i][0], pts[i][1], 1, 1);
  }
  ditherPattern = ctx.createPattern(ditherCanvas, 'repeat');
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildDither();
}
window.addEventListener('resize', resize);
resize();

function playTone(freq, dur, vol){
  try{
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){
  if(navigator.vibrate) navigator.vibrate(ms);
}

function rand(a,b){ return a + Math.random() * (b - a); }
function dist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }

function margin(){
  return 40 + compressLevel * 8;
}

function spawnBubble(){
  if(bubbles.length >= maxBubbles + 2) return null;
  var m = margin();
  var side = Math.floor(Math.random() * 4);
  var x, y, r = rand(22, 28);
  if(side === 0){ x = rand(m, W-m); y = -r; }
  else if(side === 1){ x = W+r; y = rand(m, H-m); }
  else if(side === 2){ x = rand(m, W-m); y = H+r; }
  else { x = -r; y = rand(m, H-m); }
  var type = Math.floor(Math.random() * TYPES.length);
  var b = {
    id: Date.now() + Math.random(),
    x: x, y: y,
    vx: 0, vy: 0,
    radius: r,
    type: type,
    level: 1,
    pulse: Math.random() * Math.PI * 2,
    spawnT: 0
  };
  var cx = W/2, cy = H/2;
  var ang = Math.atan2(cy - y, cx - x);
  var spd = rand(18, 32);
  b.vx = Math.cos(ang) * spd;
  b.vy = Math.sin(ang) * spd;
  bubbles.push(b);
  return b;
}

function showGhost(text){
  ghostEl.textContent = '"' + text + '"';
  ghostEl.classList.add('show');
  clearTimeout(showGhost._t);
  showGhost._t = setTimeout(function(){ ghostEl.classList.remove('show'); }, 3200);
}

function showCombo(n){
  if(n < 2) return;
  comboEl.textContent = 'epiphany ×' + n;
  comboEl.classList.add('show');
  clearTimeout(showCombo._t);
  showCombo._t = setTimeout(function(){ comboEl.classList.remove('show'); }, 700);
}

function addTrail(x, y){
  trails.push({ x: x, y: y, life: 1, r: rand(3, 8) });
  if(trails.length > 80) trails.shift();
}

function addParticles(x, y, n){
  for(var i=0;i<n;i++){
    particles.push({
      x: x, y: y,
      vx: rand(-80, 80), vy: rand(-80, 80),
      life: rand(0.4, 0.9), r: rand(2, 5)
    });
  }
}

function mergeBubbles(a, b){
  if(a.type !== b.type) return false;
  var nx = (a.x + b.x) / 2;
  var ny = (a.y + b.y) / 2;
  var nr = Math.min(Math.sqrt(a.radius*a.radius + b.radius*b.radius) * 0.85, 72);
  var nl = a.level + b.level;
  var idxA = bubbles.indexOf(a);
  var idxB = bubbles.indexOf(b);
  if(idxA < 0 || idxB < 0) return false;

  bubbles.splice(Math.max(idxA, idxB), 1);
  bubbles.splice(Math.min(idxA, idxB), 1);

  var merged = {
    id: Date.now() + Math.random(),
    x: nx, y: ny, vx: 0, vy: 0,
    radius: nr, type: a.type, level: nl,
    pulse: 0, spawnT: 0.3
  };
  bubbles.push(merged);

  pops.push({ x: nx, y: ny, r: nr, life: 1 });

  chainTimer = 2.0;
  chain = Math.min(chain + 1, 8);
  var pts = Math.floor(nl * 15 * chain);
  score += pts;
  scoreEl.textContent = score;
  chainEl.textContent = '×' + chain;

  fragmentsShown++;
  var frag = GHOST_FRAGMENTS[(fragmentsShown - 1) % GHOST_FRAGMENTS.length];
  showGhost(frag);
  showCombo(chain);

  playTone(220 + nl * 40 + chain * 20, 0.15, 0.07);
  vibrate(12);
  addParticles(nx, ny, 12 + nl * 2);
  hitPause = Math.min(0.08, 0.03 + nl * 0.01);
  mergeTarget = null;

  if(nl >= 4){
    compressLevel = Math.min(compressLevel + 1, 5);
    spawnInterval = Math.max(0.9, spawnInterval - 0.15);
    if(compressLevel % 2 === 0){
      inverted = !inverted;
      app.classList.toggle('inverted', inverted);
      invertPulse = 0.5;
    }
  }
  return true;
}

function pickBubble(x, y){
  for(var i = bubbles.length - 1; i >= 0; i--){
    var b = bubbles[i];
    if(dist({x:x,y:y}, b) < b.radius + 8) return b;
  }
  return null;
}

function updateBubbles(dt){
  var m = margin();
  var damp = 0.985;
  var repulse = 120;

  for(var i=0;i<bubbles.length;i++){
    var b = bubbles[i];
    if(drag && drag.bubble === b){
      b.x += (drag.x - b.x) * 0.35;
      b.y += (drag.y - b.y) * 0.35;
      b.vx = 0; b.vy = 0;
      addTrail(b.x, b.y);
      continue;
    }
    b.vx *= damp; b.vy *= damp;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.pulse += dt * 2;

    if(b.x < m + b.radius){ b.x = m + b.radius; b.vx = Math.abs(b.vx)*0.5; }
    if(b.x > W - m - b.radius){ b.x = W - m - b.radius; b.vx = -Math.abs(b.vx)*0.5; }
    if(b.y < m + 60 + b.radius){ b.y = m + 60 + b.radius; b.vy = Math.abs(b.vy)*0.5; }
    if(b.y > H - m - b.radius){ b.y = H - m - b.radius; b.vy = -Math.abs(b.vy)*0.5; }

    for(var j=i+1;j<bubbles.length;j++){
      var o = bubbles[j];
      if(drag && (drag.bubble === o)) continue;
      var d = dist(b, o);
      var minD = b.radius + o.radius;
      if(d < minD && d > 0.1){
        var overlap = (minD - d) / d * 0.5;
        var nx = (o.x - b.x) / d;
        var ny = (o.y - b.y) / d;
        b.x -= nx * overlap * repulse * dt;
        b.y -= ny * overlap * repulse * dt;
        o.x += nx * overlap * repulse * dt;
        o.y += ny * overlap * repulse * dt;
      }
    }
    if(b.spawnT > 0) b.spawnT -= dt;
  }
}

function findMergePartner(b){
  if(!b) return null;
  var best = null, bestD = Infinity;
  for(var i=0;i<bubbles.length;i++){
    var o = bubbles[i];
    if(o === b || o.type !== b.type) continue;
    var d = dist(b, o);
    if(d < b.radius + o.radius + 6 && d < bestD){
      best = o;
      bestD = d;
    }
  }
  return best;
}

function checkMergeOnRelease(b){
  var partner = findMergePartner(b);
  if(partner) mergeBubbles(b, partner);
}

function updateTrails(dt){
  for(var i=trails.length-1;i>=0;i--){
    trails[i].life -= dt * 0.8;
    if(trails[i].life <= 0) trails.splice(i, 1);
  }
  for(var j=particles.length-1;j>=0;j--){
    var p = particles[j];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    if(p.life <= 0) particles.splice(j, 1);
  }
  for(var k=pops.length-1;k>=0;k--){
    pops[k].life -= dt * 1.5;
    pops[k].r += dt * 30;
    if(pops[k].life <= 0) pops.splice(k, 1);
  }
}

function drawEinkBg(){
  var bg = getCSS('--bg');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if(ditherPattern){
    ctx.save();
    ctx.globalAlpha = darkMode ? 0.04 : 0.06;
    ctx.fillStyle = ditherPattern;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  var m = margin();
  ctx.strokeStyle = getCSS('--bubble-stroke');
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.strokeRect(m, m + 50, W - m*2, H - m*2 - 50);
  ctx.setLineDash([]);

  ctx.fillStyle = getCSS('--muted');
  ctx.font = '10px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.35;
  ctx.fillText('LATENT SPACE', W/2, m + 30);
  ctx.globalAlpha = 1;
}

function drawBubble(b, isDragged, isTarget){
  var fg = getCSS('--fg');
  var fill = getCSS('--bubble-fill');
  var stroke = getCSS('--bubble-stroke');
  var pulse = 1 + Math.sin(b.pulse) * 0.03;

  ctx.save();
  ctx.translate(b.x, b.y);

  if(isTarget){
    ctx.beginPath();
    ctx.arc(0, 0, b.radius * pulse + 8, 0, Math.PI * 2);
    ctx.strokeStyle = getCSS('--fg');
    ctx.globalAlpha = 0.25 + Math.sin(b.pulse * 3) * 0.1;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  if(b.spawnT > 0){
    ctx.globalAlpha = 1 - b.spawnT / 0.3;
    ctx.scale(0.5 + (1 - b.spawnT/0.3) * 0.5, 0.5 + (1 - b.spawnT/0.3) * 0.5);
  }

  var r = b.radius * pulse;

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = isDragged ? 2.5 : 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(-r*0.25, -r*0.25, r*0.55, 0, Math.PI*2);
  ctx.fillStyle = getCSS('--trail');
  ctx.fill();

  ctx.fillStyle = fg;
  ctx.font = (r * 0.7) + 'px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(TYPES[b.type].sym, 0, 1);

  if(b.level > 1){
    ctx.font = '9px ui-monospace, Menlo, monospace';
    ctx.fillStyle = getCSS('--muted');
    ctx.fillText('L' + b.level, 0, r - 6);
  }

  ctx.restore();
}

function drawTrails(){
  var trailCol = getCSS('--trail');
  for(var i=0;i<trails.length;i++){
    var t = trails[i];
    ctx.globalAlpha = t.life * 0.5;
    ctx.fillStyle = trailCol;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r * t.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  var fg = getCSS('--fg');
  for(var j=0;j<particles.length;j++){
    var p = particles[j];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(var k=0;k<pops.length;k++){
    var pop = pops[k];
    ctx.globalAlpha = pop.life * 0.4;
    ctx.strokeStyle = getCSS('--fg');
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(pop.x, pop.y, pop.r, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function draw(){
  drawEinkBg();
  drawTrails();
  for(var i=0;i<bubbles.length;i++){
    var isD = drag && drag.bubble === bubbles[i];
    var isT = mergeTarget === bubbles[i];
    drawBubble(bubbles[i], isD, isT);
  }
  if(invertPulse > 0){
    ctx.fillStyle = 'rgba(128,128,128,' + (invertPulse * 0.15) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function updateHUD(){
  var pct = Math.min(100, (bubbles.length / maxBubbles) * 100);
  overflowFill.style.height = pct + '%';
  timerEl.textContent = Math.ceil(timeLeft);
}

function checkOverflow(){
  if(bubbles.length > maxBubbles){
    endGame(false);
  }
}

function endGame(won){
  state = 'over';
  endTitleEl.textContent = won ? 'COMPRESSED' : 'OVERFLOW';
  finalScoreEl.textContent = score;
  scoreDetailEl.textContent = fragmentsShown + ' ghost fragments · peak chain ×' + chain;
  gameoverScreen.classList.remove('hidden');
  canvas.classList.remove('dragging');
  drag = null;
  mergeTarget = null;
  if(won) playTone(440, 0.3, 0.05);
}

function resetGame(){
  bubbles = []; trails = []; particles = []; pops = [];
  score = 0; chain = 1; chainTimer = 0; timeLeft = 60;
  spawnTimer = 0; spawnInterval = 2.8;
  compressLevel = 0; inverted = false; invertPulse = 0;
  fragmentsShown = 0; drag = null; selectedId = -1; hitPause = 0; mergeTarget = null;
  app.classList.remove('inverted');
  scoreEl.textContent = '0';
  chainEl.textContent = '×1';
  timerEl.textContent = '60';
  overflowFill.style.height = '0%';
  ghostEl.classList.remove('show');
  comboEl.classList.remove('show');
  gameoverScreen.classList.add('hidden');
}

function startGame(){
  resetGame();
  state = 'play';
  titleScreen.classList.add('hidden');
  for(var i=0;i<3;i++) spawnBubble();
  lastTime = performance.now();
  if(animId) cancelAnimationFrame(animId);
  loop(lastTime);
}

function loop(now){
  if(state !== 'play') return;
  var dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if(hitPause > 0){
    hitPause -= dt;
    draw();
    animId = requestAnimationFrame(loop);
    return;
  }

  timeLeft -= dt;
  if(timeLeft <= 0){
    timeLeft = 0;
    endGame(true);
    draw();
    return;
  }

  if(chainTimer > 0){
    chainTimer -= dt;
    if(chainTimer <= 0) chain = 1;
  }
  chainEl.textContent = '×' + chain;

  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnBubble();
    spawnTimer = spawnInterval * rand(0.7, 1.3);
    var elapsed = 60 - timeLeft;
    if(elapsed > 15) spawnInterval = Math.max(1.0, 2.8 - elapsed * 0.025);
    if(elapsed > 35) spawnInterval = Math.max(0.7, spawnInterval - 0.01);
  }

  updateBubbles(dt);
  updateTrails(dt);
  if(invertPulse > 0) invertPulse -= dt;
  updateHUD();
  checkOverflow();
  draw();

  animId = requestAnimationFrame(loop);
}

function pointerPos(e){
  var rect = canvas.getBoundingClientRect();
  var cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  var cy = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  return { x: cx - rect.left, y: cy - rect.top };
}

function onDown(e){
  if(state !== 'play') return;
  e.preventDefault();
  var p = pointerPos(e);
  var b = pickBubble(p.x, p.y);
  if(b){
    drag = { bubble: b, x: p.x, y: p.y };
    selectedId = b.id;
    canvas.classList.add('dragging');
  }
}

function onMove(e){
  if(state !== 'play' || !drag) return;
  e.preventDefault();
  var p = pointerPos(e);
  drag.x = p.x;
  drag.y = p.y;
  drag.bubble.x = p.x;
  drag.bubble.y = p.y;
  mergeTarget = findMergePartner(drag.bubble);
  if(mergeTarget && dist(drag.bubble, mergeTarget) < drag.bubble.radius + mergeTarget.radius - 2){
    mergeBubbles(drag.bubble, mergeTarget);
    drag = null;
    canvas.classList.remove('dragging');
  }
}

function onUp(e){
  if(state !== 'play') return;
  e.preventDefault();
  if(drag){
    checkMergeOnRelease(drag.bubble);
    drag = null;
    canvas.classList.remove('dragging');
  }
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onUp, { passive: false });
canvas.addEventListener('touchcancel', onUp, { passive: false });

document.addEventListener('keydown', function(e){
  if(state !== 'play') return;
  var sel = null;
  for(var i=0;i<bubbles.length;i++){
    if(bubbles[i].id === selectedId){ sel = bubbles[i]; break; }
  }
  if(!sel && bubbles.length) sel = bubbles[0];
  if(!sel) return;
  selectedId = sel.id;
  var step = 8;
  if(e.key === 'ArrowLeft'){ sel.x -= step; sel.vx = 0; e.preventDefault(); }
  else if(e.key === 'ArrowRight'){ sel.x += step; sel.vx = 0; e.preventDefault(); }
  else if(e.key === 'ArrowUp'){ sel.y -= step; sel.vy = 0; e.preventDefault(); }
  else if(e.key === 'ArrowDown'){ sel.y += step; sel.vy = 0; e.preventDefault(); }
  else if(e.key === ' ' || e.key === 'Enter'){
    checkMergeOnRelease(sel);
    e.preventDefault();
  }
});

startBtn.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

restartBtn.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

draw();

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
    darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
    draw();
  });
}

})();
</script>
</body>
</html>
