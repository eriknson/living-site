<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Golden Fog</title>
  <style>
    :root {
      --bg-top: #87CEEB;
      --bg-bottom: #FFA07A;
      --text: #333;
      --btn-bg: #fff;
      --btn-text: #333;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-top: #001f3f;
        --bg-bottom: #d2691e;
        --text: #eee;
        --btn-bg: #222;
        --btn-text: #eee;
      }
    }
    body {
      margin: 0;
      padding: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      color: var(--text);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: none;
    }
    @media (prefers-color-scheme: dark) {
      .screen {
        background: rgba(0,0,0,0.2);
      }
    }
    .hidden {
      opacity: 0;
      pointer-events: none !important;
    }
    button {
      pointer-events: auto;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      font-family: inherit;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: transform 0.1s, box-shadow 0.1s;
      margin-top: 20px;
    }
    button:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .title {
      font-size: 2.8rem;
      margin-bottom: 10px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 2px 4px rgba(255,255,255,0.5);
      letter-spacing: 1px;
    }
    @media (prefers-color-scheme: dark) {
      .title {
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
    }
    .subtitle {
      font-size: 1rem;
      margin-bottom: 20px;
      text-align: center;
      max-width: 80%;
      line-height: 1.5;
      opacity: 0.9;
    }
    #hud {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      left: env(safe-area-inset-left, 20px);
      right: env(safe-area-inset-right, 20px);
      display: flex;
      justify-content: space-between;
      font-size: 1.5rem;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(255,255,255,0.8);
    }
    @media (prefers-color-scheme: dark) {
      #hud {
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      }
    }
    #multiplierDisplay {
      transition: transform 0.1s;
    }
    .bump {
      transform: scale(1.4);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="ui-layer">
    <div id="hud" class="hidden">
      <div id="scoreDisplay">0</div>
      <div id="multiplierDisplay">x1</div>
    </div>

    <div id="startScreen" class="screen">
      <div class="title">GOLDEN FOG</div>
      <div class="subtitle">Swipe left/right to navigate the shifting channels.<br>Collect silver light. Avoid the fog banks.</div>
      <button data-smoke="start" id="startBtn">Set Sail</button>
    </div>

    <div id="gameOverScreen" class="screen hidden">
      <div class="title">LOST IN FOG</div>
      <div class="subtitle" id="finalScore">Score: 0</div>
      <button data-smoke="restart" id="restartBtn">Sail Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let state = 'start';
    let score = 0;
    let multiplier = 1;
    let combo = 0;
    let time = 0;
    let entities = [];
    let particles = [];
    let floatingTexts = [];
    let ambientFog = [];
    let currentLane = 1;
    let boatX = 0;
    let boatY = 0;
    let boatTilt = 0;
    let spawnTimer = 0;
    let lastTime = performance.now();
    let width, height;

    let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        isDark = e.matches;
      });
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      if (state === 'start') {
        boatX = width / 2;
      }
      boatY = height * 0.8;
      
      ambientFog = [];
      for(let i=0; i<20; i++) {
        ambientFog.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: 50 + Math.random() * 100,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5
        });
      }
    }
    window.addEventListener('resize', resize);
    resize();

    function vibrate(pattern) {
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    function getLaneX(lane, y, t) {
      const screenCenter = width / 2;
      const laneW = width * 0.28; 
      const maxOffset = width * 0.15;
      const offset = Math.sin(y * 0.003 - t * 0.002) * maxOffset;
      return screenCenter + (lane - 1) * laneW + offset;
    }

    function spawnRow() {
      const r = Math.random();
      let fogLanes = [];
      let lightLane = -1;

      const laneW = width * 0.28;
      const fogRadius = Math.min(laneW * 0.4, 60);
      const lightRadius = Math.min(laneW * 0.15, 20);
      const difficulty = Math.min(time / 60000, 1);
      
      if (r < 0.1 + difficulty * 0.2) {
        const empty = Math.floor(Math.random() * 3);
        lightLane = empty;
        for (let i=0; i<3; i++) if (i !== empty) fogLanes.push(i);
      } else if (r < 0.4 + difficulty * 0.2) {
        const fog = Math.floor(Math.random() * 3);
        let light = Math.floor(Math.random() * 3);
        while (light === fog) light = Math.floor(Math.random() * 3);
        fogLanes.push(fog);
        lightLane = light;
      } else if (r < 0.8) {
        fogLanes.push(Math.floor(Math.random() * 3));
      } else {
        lightLane = Math.floor(Math.random() * 3);
      }

      fogLanes.forEach(l => {
        entities.push({ type: 'fog', lane: l, y: -100, radius: fogRadius });
      });
      if (lightLane !== -1) {
        entities.push({ type: 'light', lane: lightLane, y: -100, radius: lightRadius, collected: false });
      }
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 1,
          color: color
        });
      }
    }

    function updateHUD() {
      document.getElementById('scoreDisplay').innerText = score;
      const multEl = document.getElementById('multiplierDisplay');
      multEl.innerText = `x${multiplier}`;
      if (multiplier > 1) {
        multEl.style.color = '#FFD700';
      } else {
        multEl.style.color = 'inherit';
      }
    }

    function collectLight(e) {
      spawnParticles(e.x, e.y, '#FFD700');
      vibrate(20);
      combo++;
      if (combo > 0 && combo % 3 === 0) {
        multiplier++;
        const multEl = document.getElementById('multiplierDisplay');
        multEl.classList.add('bump');
        setTimeout(() => multEl.classList.remove('bump'), 150);
      }
      const points = 10 * multiplier;
      score += points;
      updateHUD();
      
      floatingTexts.push({
        x: e.x,
        y: e.y,
        text: `+${points}`,
        life: 1
      });
    }

    function gameOver() {
      state = 'gameover';
      vibrate([50, 50, 100]);
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.remove('hidden');
      document.getElementById('finalScore').innerText = `Score: ${score}`;
    }

    function startGame() {
      state = 'playing';
      score = 0;
      multiplier = 1;
      combo = 0;
      time = 0;
      entities = [];
      particles = [];
      floatingTexts = [];
      currentLane = 1;
      boatX = getLaneX(currentLane, boatY, 0);
      spawnTimer = height * 0.2;
      
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      updateHUD();
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    let touchStartX = 0;
    canvas.addEventListener('touchstart', e => {
      if (state !== 'playing') return;
      e.preventDefault();
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      if (state !== 'playing') return;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      if (state !== 'playing') return;
      e.preventDefault();
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(dx) > 30) {
        if (dx > 0 && currentLane < 2) currentLane++;
        else if (dx < 0 && currentLane > 0) currentLane--;
      }
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (state !== 'playing') return;
      if (e.key === 'ArrowLeft' && currentLane > 0) currentLane--;
      else if (e.key === 'ArrowRight' && currentLane < 2) currentLane++;
    });

    function update(dt) {
      time += dt * 1000;
      
      ambientFog.forEach(f => {
        f.x += f.vx * dt * 60;
        f.y += f.vy * dt * 60;
        if (f.x < -f.radius) f.x = width + f.radius;
        if (f.x > width + f.radius) f.x = -f.radius;
        if (f.y < -f.radius) f.y = height + f.radius;
        if (f.y > height + f.radius) f.y = -f.radius;
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.life -= 0.02 * dt * 60;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 50 * dt;
        ft.life -= 1 * dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
      
      if (state === 'playing') {
        const speed = Math.min(height * 0.4 + time * 0.02, height * 1.2);
        
        const targetX = getLaneX(currentLane, boatY, time);
        const dx = targetX - boatX;
        boatX += dx * 12 * dt;
        boatTilt = dx * 0.015;
        
        spawnTimer -= speed * dt;
        if (spawnTimer <= 0) {
          spawnRow();
          spawnTimer = height * 0.35;
        }
        
        for (let i = entities.length - 1; i >= 0; i--) {
          let e = entities[i];
          e.y += speed * dt;
          e.x = getLaneX(e.lane, e.y, time);
          
          if (e.y > height + 100) {
            if (e.type === 'light' && !e.collected) {
              combo = 0;
              multiplier = 1;
              updateHUD();
            }
            entities.splice(i, 1);
            continue;
          }
          
          if (!e.collected) {
            const dist = Math.hypot(e.x - boatX, e.y - boatY);
            if (e.type === 'fog') {
              if (dist < e.radius + 15) gameOver();
            } else if (e.type === 'light') {
              if (dist < e.radius + 20) {
                e.collected = true;
                collectLight(e);
              }
            }
          }
        }
      } else {
        const targetX = getLaneX(currentLane, boatY, time);
        boatX = targetX;
        boatTilt = Math.sin(time * 0.002) * 0.05;
      }
    }

    function drawLanes(ctx, t) {
      ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.setLineDash([10, 10]);
      for (let l = 0; l < 3; l++) {
        ctx.beginPath();
        for (let y = 0; y <= height; y += 40) {
          const x = getLaneX(l, y, t);
          if (y === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawBoat(ctx, x, y, tilt) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);
      
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.moveTo(0, 15);
      ctx.lineTo(-15, 35);
      ctx.lineTo(15, 35);
      ctx.fill();

      ctx.fillStyle = isDark ? '#222' : '#444';
      ctx.beginPath();
      ctx.moveTo(0, 20);
      ctx.lineTo(12, -10);
      ctx.lineTo(-12, -10);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = isDark ? '#555' : '#888';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(0, -40);
      ctx.stroke();

      ctx.fillStyle = '#f8f8f8';
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.moveTo(0, -38);
      ctx.lineTo(18, -10);
      ctx.lineTo(0, -10);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawFog(ctx, x, y, radius) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = isDark ? 'rgba(160, 170, 180, 0.7)' : 'rgba(240, 240, 240, 0.9)';
      ctx.shadowBlur = 15;
      ctx.shadowColor = isDark ? 'rgba(160, 170, 180, 0.5)' : 'rgba(255, 255, 255, 0.8)';
      
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.arc(-radius*0.4, -radius*0.2, radius*0.7, 0, Math.PI * 2);
      ctx.arc(radius*0.3, -radius*0.3, radius*0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawLight(ctx, x, y, radius, t) {
      ctx.save();
      ctx.translate(x, y);
      const pulse = 1 + Math.sin(t * 0.005) * 0.1;
      
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#fff';
      
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath();
      ctx.arc(0, 0, radius * pulse, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.5 * pulse, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      
      if (multiplier > 1) {
        const intensity = Math.min((multiplier - 1) * 0.08, 0.4);
        ctx.fillStyle = `rgba(255, 215, 0, ${intensity})`;
        ctx.globalCompositeOperation = 'overlay';
        ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'source-over';
      }
      
      ctx.fillStyle = isDark ? 'rgba(200, 200, 220, 0.05)' : 'rgba(255, 255, 255, 0.1)';
      ambientFog.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      
      drawLanes(ctx, time);
      
      entities.forEach(e => {
        if (e.type === 'light' && !e.collected) drawLight(ctx, e.x, e.y, e.radius, time);
      });
      
      entities.forEach(e => {
        if (e.type === 'fog') drawFog(ctx, e.x, e.y, e.radius);
      });
      
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      
      drawBoat(ctx, boatX, boatY, boatTilt);
      
      ctx.font = 'bold 20px ui-monospace, monospace';
      ctx.textAlign = 'center';
      floatingTexts.forEach(ft => {
        ctx.globalAlpha = Math.max(ft.life, 0);
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 3;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = '#FFD700';
        ctx.fillText(ft.text, ft.x, ft.y);
      });
      ctx.globalAlpha = 1;
    }

    function loop(now) {
      requestAnimationFrame(loop);
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      update(Math.min(dt, 0.1));
      draw();
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
