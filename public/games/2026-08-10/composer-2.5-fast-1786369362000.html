<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Names</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1218;--fg:#d4e4ec;--muted:#5a7a8a;--accent:#4ecdc4;--accent2:#7eb8c4;
  --fog:rgba(180,200,210,.55);--ui-bg:rgba(10,18,24,.88);--line:#3a5a6a;
  --btn-bg:#1a2830;--btn-fg:#d4e4ec;--btn-border:#3a5a6a;
  --glow:rgba(78,205,196,.35);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8eef2;--fg:#1a2830;--muted:#5a7080;--accent:#2a8a82;--accent2:#3a7a8a;
    --fog:rgba(200,210,220,.65);--ui-bg:rgba(232,238,242,.92);--line:#9ab0bc;
    --btn-bg:#fff;--btn-fg:#1a2830;--btn-border:#9ab0bc;--glow:rgba(42,138,130,.25);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hud-value{font-size:20px;font-weight:600;line-height:1;color:var(--fg)}
#combo{position:absolute;top:max(56px,calc(env(safe-area-inset-top)+44px));left:50%;transform:translateX(-50%);
  font-size:13px;color:var(--accent);opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
#combo.show{opacity:1}
#ping-bar-wrap{position:absolute;bottom:max(80px,calc(env(safe-area-inset-bottom)+64px));left:50%;
  transform:translateX(-50%);width:120px;height:3px;background:var(--line);border-radius:2px;
  pointer-events:none;z-index:2;opacity:.7}
#ping-bar{height:100%;width:100%;background:var(--accent);border-radius:2px;transform-origin:left;transform:scaleX(1)}
#hint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;
  font-size:11px;color:var(--muted);letter-spacing:.06em;pointer-events:none;z-index:2;opacity:.8}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--ui-bg);z-index:10;pointer-events:none;transition:opacity .4s}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-inner{text-align:center;padding:24px;max-width:340px;pointer-events:none}
.overlay h1{font-size:clamp(28px,8vw,42px);font-weight:600;letter-spacing:-.02em;margin-bottom:6px;color:var(--fg)}
.overlay .sub{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:28px}
.overlay p{font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:24px}
.overlay .score-final{font-size:36px;color:var(--accent);margin:8px 0 4px}
.overlay .score-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:20px}
.btn-smoke{pointer-events:auto;min-width:180px;min-height:48px;padding:14px 32px;
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:var(--btn-bg);color:var(--btn-fg);border:1.5px solid var(--btn-border);border-radius:4px;
  cursor:pointer;transition:background .15s,border-color .15s,transform .1s;z-index:11}
.btn-smoke:active{transform:scale(.97)}
.btn-smoke:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#restart-btn{display:none;margin-top:8px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Names</span><span class="hud-value" id="score">0</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Time</span><span class="hud-value" id="time">60</span></div>
  </div>
  <div id="combo"></div>
  <div id="ping-bar-wrap"><div id="ping-bar"></div></div>
  <div id="hint">drag to steer · tap to ping</div>
  <div class="overlay" id="title-overlay">
    <div class="overlay-inner">
      <h1>Fog Names</h1>
      <div class="sub">bay sonar · summer fog</div>
      <p>Steer your skiff through the mist. Tap to ping sonar — grab whimsical boat names before the fog swallows them again.</p>
      <button class="btn-smoke" data-smoke="start" id="start-btn">Cast Off</button>
    </div>
  </div>
  <div class="overlay hidden" id="gameover-overlay">
    <div class="overlay-inner">
      <h1>Harbor Closed</h1>
      <div class="sub">the mist reclaims all</div>
      <div class="score-final" id="final-score">0</div>
      <div class="score-label">names collected</div>
      <button class="btn-smoke" data-smoke="restart" id="restart-btn">Drift Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('score');
var timeEl = document.getElementById('time');
var comboEl = document.getElementById('combo');
var pingBar = document.getElementById('ping-bar');
var hintEl = document.getElementById('hint');
var titleOverlay = document.getElementById('title-overlay');
var gameoverOverlay = document.getElementById('gameover-overlay');
var finalScoreEl = document.getElementById('final-score');
var restartBtn = document.getElementById('restart-btn');
var startBtn = document.getElementById('start-btn');

var W = 300, H = 500, dpr = 1;
var state = 'title';
var score = 0, combo = 0, maxCombo = 0, timeLeft = 60;
var lastTs = 0, gameTime = 0;
var skiff = { x: 150, y: 250, angle: 0, vx: 0, vy: 0, targetX: 150 };
var waypoints = [];
var pings = [];
var particles = [];
var fogParticles = [];
var ripples = [];
var current = { x: 0, y: 0, angle: 0, strength: 0.15 };
var pingCooldown = 0, pingMaxCd = 1.2;
var revealDuration = 4.5;
var spawnTimer = 0;
var touchStart = null, isDragging = false;
var audioCtx = null;
var animId = 0;
var shakeT = 0;
var missedReveal = false;

var BOAT_NAMES = [
  'Sea Cucumber','Unpaid Intern','Fog Index','Knot Funny','Bay Watch Later',
  'Sonar Bloom','Mist Opportunity','Hull Yeah','Anchors Aweigh Pay','Draft Pick',
  'Buoy Once Said','Port Authority Issues','Starboard to Starboard','Keel Me Later',
  'Stern But Fair','Bow Movement','Tide Pod','Harbor Freight Feelings','Nautical By Nature',
  'Reef Madness','Squall Me Maybe','Liquid Asset','Draft Dodger','Wake Me Up',
  'Channel Surfer','Dock Around','Pier Pressure','Marina Del Ray Of Light',
  'Wharf Rat Race','Schooner Or Later','Catamaran Band','Jibber Jabber',
  'Mainsail Event','Rudder Than You Think','Compass Rose Colored','Latitude Adjustment',
  'Longitude Story Short','Barnacle Bill','Seagull Manager','Albatross Around',
  'Pelican Brief','Cormorant Couture','Kraken Open','Neptune Net Worth',
  'Poseidon Pickle','Trident Gum','Scurvy Dog Days','Crow Nest Egg',
  'Galley Proof','Bilge Pump It Up','Fathom Line','Depth Perception'
];

function rand(a,b){ return a + Math.random()*(b-a); }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function dist(x1,y1,x2,y2){ var dx=x2-x1,dy=y2-y1; return Math.sqrt(dx*dx+dy*dy); }
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }
function lerp(a,b,t){ return a+(b-a)*t; }

function getColors(){
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(dark !== undefined && !window.matchMedia('(prefers-color-scheme: dark)').matches){
    return { line:'#2a4858', accent:'#2a8a82', fog:'rgba(200,210,220,0.72)', bg:'#e8eef2',
      skiff:'#1a2830', text:'#1a2830', ping:'rgba(42,138,130,0.5)', grid:'rgba(42,72,88,0.15)' };
  }
  return { line:'#5a8a9a', accent:'#4ecdc4', fog:'rgba(140,170,185,0.62)', bg:'#0a1218',
    skiff:'#d4e4ec', text:'#d4e4ec', ping:'rgba(78,205,196,0.45)', grid:'rgba(90,130,150,0.12)' };
}

function resize(){
  if(!canvas) return;
  dpr = Math.min(window.devicePixelRatio||1, 2);
  var rect = canvas.getBoundingClientRect();
  W = rect.width || window.innerWidth;
  H = rect.height || window.innerHeight;
  if(W < 10) W = window.innerWidth || 300;
  if(H < 10) H = window.innerHeight || 500;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function initAudio(){
  try{
    if(typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
  }catch(e){ audioCtx = null; }
}

function playTone(freq, dur, type, vol){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol||0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function playPing(){
  playTone(880, 0.15, 'sine', 0.06);
  setTimeout(function(){ playTone(660, 0.2, 'sine', 0.04); }, 60);
}

function playCollect(){
  playTone(523, 0.1, 'triangle', 0.07);
  setTimeout(function(){ playTone(784, 0.12, 'triangle', 0.06); }, 80);
}

function playGameOver(){
  playTone(220, 0.4, 'sine', 0.05);
  setTimeout(function(){ playTone(165, 0.5, 'sine', 0.04); }, 200);
}

function initFog(){
  fogParticles = [];
  var n = Math.floor((W*H)/800);
  for(var i=0;i<n;i++){
    fogParticles.push({
      x: rand(0,W), y: rand(0,H), r: rand(20,80), vx: rand(-8,8), vy: rand(-5,5),
      a: rand(0.05,0.25), phase: rand(0,Math.PI*2)
    });
  }
}

function spawnWaypoint(){
  var margin = 50;
  var usedNames = {};
  waypoints.forEach(function(w){ usedNames[w.name]=1; });
  var name = pick(BOAT_NAMES);
  var tries = 0;
  while(usedNames[name] && tries<20){ name = pick(BOAT_NAMES); tries++; }
  var wx, wy, ok, attempt;
  for(attempt=0;attempt<30;attempt++){
    wx = rand(margin, W-margin);
    wy = rand(margin, H-margin);
    ok = true;
    for(var i=0;i<waypoints.length;i++){
      if(dist(wx,wy,waypoints[i].x,waypoints[i].y) < 80){ ok=false; break; }
    }
    if(dist(wx,wy,skiff.x,skiff.y) < 60) ok = false;
    if(ok) break;
  }
  waypoints.push({
    x: wx, y: wy, name: name, revealed: false, revealT: 0, collected: false,
    pulse: rand(0,Math.PI*2), bob: rand(0,Math.PI*2)
  });
}

function resetGame(){
  score = 0; combo = 0; maxCombo = 0; timeLeft = 60; gameTime = 0;
  skiff = { x: W/2, y: H*0.55, angle: 0, vx: 0, vy: 0, targetX: W/2 };
  waypoints = []; pings = []; particles = []; ripples = [];
  pingCooldown = 0; pingMaxCd = 1.2; revealDuration = 4.5;
  current = { x: 0, y: 0, angle: rand(0,Math.PI*2), strength: 0.15 };
  spawnTimer = 0;
  initFog();
  for(var i=0;i<4;i++) spawnWaypoint();
  if(scoreEl) scoreEl.textContent = '0';
  if(timeEl) timeEl.textContent = '60';
  if(comboEl){ comboEl.textContent=''; comboEl.classList.remove('show'); }
  if(hintEl) hintEl.style.opacity = '0.8';
}

function startGame(){
  resetGame();
  state = 'playing';
  if(titleOverlay) titleOverlay.classList.add('hidden');
  if(gameoverOverlay) gameoverOverlay.classList.add('hidden');
  if(restartBtn) restartBtn.style.display = 'none';
  initAudio();
  if(navigator.vibrate) try{ navigator.vibrate(20); }catch(e){}
}

function endGame(){
  state = 'gameover';
  if(finalScoreEl) finalScoreEl.textContent = String(score);
  if(gameoverOverlay) gameoverOverlay.classList.remove('hidden');
  if(restartBtn) restartBtn.style.display = 'inline-block';
  if(hintEl) hintEl.style.opacity = '0';
  playGameOver();
  if(navigator.vibrate) try{ navigator.vibrate([30,50,30]); }catch(e){}
}

function firePing(x, y){
  if(state !== 'playing' || pingCooldown > 0) return;
  pingCooldown = pingMaxCd;
  playPing();
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}

  pings.push({ x: x, y: y, r: 0, maxR: Math.min(W,H)*0.38, life: 0.6, age: 0 });
  ripples.push({ x: x, y: y, r: 0, maxR: 120, life: 1.2, age: 0 });

  waypoints.forEach(function(w){
    if(w.collected) return;
    if(dist(x,y,w.x,w.y) < Math.min(W,H)*0.38){
      w.revealed = true;
      w.revealT = revealDuration;
    }
  });

  for(var i=0;i<12;i++){
    particles.push({
      x: x, y: y, vx: rand(-60,60), vy: rand(-60,60),
      life: rand(0.3,0.7), age: 0, r: rand(1,3), type: 'ping'
    });
  }
}

function collectWaypoint(w){
  w.collected = true;
  score++;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  if(scoreEl) scoreEl.textContent = String(score);
  playCollect();
  shakeT = 0.12;
  if(navigator.vibrate) try{ navigator.vibrate(25); }catch(e){}
  if(combo >= 2 && comboEl){
    comboEl.textContent = combo + '× streak';
    comboEl.classList.add('show');
    setTimeout(function(){ comboEl.classList.remove('show'); }, 1200);
  }
  for(var i=0;i<16;i++){
    particles.push({
      x: w.x, y: w.y, vx: rand(-80,80), vy: rand(-80,80),
      life: rand(0.4,0.9), age: 0, r: rand(2,4), type: 'collect'
    });
  }
  ripples.push({ x: w.x, y: w.y, r: 0, maxR: 60, life: 0.8, age: 0 });
  setTimeout(function(){ spawnWaypoint(); }, 300);
}

function update(dt){
  if(state !== 'playing') return;

  gameTime += dt;
  timeLeft = Math.max(0, 60 - gameTime);
  if(timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
  if(timeLeft <= 0){ endGame(); return; }

  var escalation = Math.min(gameTime / 60, 1);
  current.angle += dt * (0.3 + escalation * 0.5);
  current.strength = 0.15 + escalation * 0.35;
  current.x = Math.cos(current.angle) * current.strength;
  current.y = Math.sin(current.angle) * current.strength * 0.6;

  pingMaxCd = Math.max(0.45, 1.2 - escalation * 0.75);
  revealDuration = Math.max(2.2, 4.5 - escalation * 2.3);

  if(pingCooldown > 0) pingCooldown -= dt;
  if(pingBar){
    var pct = pingCooldown > 0 ? 1 - pingCooldown/pingMaxCd : 1;
    pingBar.style.transform = 'scaleX(' + pct + ')';
  }

  skiff.targetX = clamp(skiff.targetX, 30, W-30);
  skiff.x = lerp(skiff.x, skiff.targetX, Math.min(1, dt*4));
  skiff.y = H * 0.55 + Math.sin(gameTime * 1.2) * 4;
  skiff.vx = lerp(skiff.vx, current.x * 40, dt * 2);
  skiff.vy = lerp(skiff.vy, current.y * 25, dt * 2);
  skiff.x += skiff.vx * dt;
  skiff.y += skiff.vy * dt;
  skiff.x = clamp(skiff.x, 25, W-25);
  skiff.y = clamp(skiff.y, H*0.3, H*0.75);
  skiff.angle = Math.atan2(skiff.vy, skiff.vx + 0.01);

  spawnTimer += dt;
  var activeCount = waypoints.filter(function(w){ return !w.collected; }).length;
  if(spawnTimer > 2.5 && activeCount < 3 + Math.floor(escalation*2)){
    spawnWaypoint();
    spawnTimer = 0;
  }

  missedReveal = false;
  waypoints.forEach(function(w){
    if(w.collected) return;
    w.pulse += dt * 3;
    w.bob += dt * 2;
    if(w.revealed){
      w.revealT -= dt;
      if(w.revealT <= 0){
        w.revealed = false;
        if(!w.collected) missedReveal = true;
      }
      if(dist(skiff.x, skiff.y, w.x, w.y) < 28){
        collectWaypoint(w);
      }
    }
  });
  if(missedReveal) combo = 0;

  waypoints = waypoints.filter(function(w){ return !w.collected; });

  if(shakeT > 0) shakeT -= dt;

  pings.forEach(function(p){
    p.age += dt;
    p.r = (p.age/p.life) * p.maxR;
  });
  pings = pings.filter(function(p){ return p.age < p.life; });

  ripples.forEach(function(r){
    r.age += dt;
    r.r = (r.age/r.life) * r.maxR;
  });
  ripples = ripples.filter(function(r){ return r.age < r.life; });

  particles.forEach(function(p){
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
  });
  particles = particles.filter(function(p){ return p.age < p.life; });

  var fogDensity = 0.55 + escalation * 0.35;
  fogParticles.forEach(function(f){
    f.x += f.vx * dt * fogDensity;
    f.y += f.vy * dt * fogDensity;
    f.phase += dt;
    if(f.x < -f.r) f.x = W + f.r;
    if(f.x > W + f.r) f.x = -f.r;
    if(f.y < -f.r) f.y = H + f.r;
    if(f.y > H + f.r) f.y = -f.r;
  });
}

function drawGrid(c){
  ctx.strokeStyle = c.grid;
  ctx.lineWidth = 0.5;
  var step = 40;
  for(var x=0;x<W;x+=step){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for(var y=0;y<H;y+=step){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
}

function drawSkiff(c){
  ctx.save();
  ctx.translate(skiff.x, skiff.y);
  ctx.rotate(skiff.angle + Math.PI/2);
  ctx.strokeStyle = c.skiff;
  ctx.lineWidth = 1.5;
  ctx.fillStyle = c.bg;
  ctx.beginPath();
  ctx.moveTo(0,-16);
  ctx.lineTo(8,10);
  ctx.lineTo(4,14);
  ctx.lineTo(-4,14);
  ctx.lineTo(-8,10);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,-16);
  ctx.lineTo(0,-24);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0,-24,2,0,Math.PI*2);
  ctx.fillStyle = c.accent;
  ctx.fill();
  ctx.restore();
}

function drawWaypoint(w, c){
  if(!w.revealed) return;
  var alpha = clamp(w.revealT / revealDuration, 0, 1);
  var bobY = Math.sin(w.bob) * 3;
  var pulse = 1 + Math.sin(w.pulse) * 0.08;

  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.strokeStyle = c.accent;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(w.x, w.y + bobY, 22 * pulse, 0, Math.PI*2);
  ctx.stroke();

  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(w.x, w.y + bobY);
  ctx.lineTo(skiff.x, skiff.y);
  ctx.strokeStyle = c.line;
  ctx.globalAlpha = alpha * 0.4;
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.globalAlpha = alpha;
  ctx.fillStyle = c.text;
  ctx.font = '11px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  var displayName = w.name.length > 18 ? w.name.slice(0,16)+'…' : w.name;
  ctx.fillText(displayName, w.x, w.y + bobY - 28);

  ctx.beginPath();
  ctx.arc(w.x, w.y + bobY, 4, 0, Math.PI*2);
  ctx.fillStyle = c.accent;
  ctx.fill();
  ctx.restore();
}

function drawFog(c, escalation){
  ctx.fillStyle = c.fog;
  fogParticles.forEach(function(f){
    var a = f.a * (0.7 + escalation * 0.5) * (0.7 + Math.sin(f.phase)*0.3);
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  var grad = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.1,W/2,H/2,Math.max(W,H)*0.7);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,c.fog);
  ctx.fillStyle = grad;
  ctx.globalAlpha = 0.35 + escalation * 0.25;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 1;
}

function drawPings(c){
  pings.forEach(function(p){
    var alpha = 1 - p.age/p.life;
    ctx.strokeStyle = c.accent;
    ctx.globalAlpha = alpha * 0.7;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = c.ping;
    ctx.globalAlpha = alpha * 0.15;
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawRipples(c){
  ripples.forEach(function(r){
    var alpha = 1 - r.age/r.life;
    ctx.strokeStyle = c.accent;
    ctx.globalAlpha = alpha * 0.5;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function drawParticles(c){
  particles.forEach(function(p){
    var alpha = 1 - p.age/p.life;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.type === 'collect' ? c.accent : c.line;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawCurrent(c){
  if(state !== 'playing') return;
  var cx = W - 36, cy = H - 36;
  var len = 18;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(current.angle);
  ctx.strokeStyle = c.muted || c.line;
  ctx.globalAlpha = 0.6;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-len*0.3, 0);
  ctx.lineTo(len, 0);
  ctx.lineTo(len-5, -4);
  ctx.moveTo(len, 0);
  ctx.lineTo(len-5, 4);
  ctx.stroke();
  ctx.globalAlpha = 0.5;
  ctx.font = '8px ui-monospace, Menlo, monospace';
  ctx.fillStyle = c.muted || c.line;
  ctx.textAlign = 'center';
  ctx.fillText('DRIFT', 0, 14);
  ctx.restore();
}

function render(){
  if(!ctx) return;
  var c = getColors();
  c.muted = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? '#5a7a8a' : '#5a7080';
  var escalation = state === 'playing' ? Math.min(gameTime/60,1) : 0;

  ctx.save();
  if(shakeT > 0){
    ctx.translate(rand(-3,3)*shakeT*8, rand(-3,3)*shakeT*8);
  }

  ctx.fillStyle = c.bg;
  ctx.fillRect(0,0,W,H);

  drawGrid(c);

  if(state === 'playing' || state === 'gameover'){
    waypoints.forEach(function(w){ drawWaypoint(w, c); });
    drawPings(c);
    drawRipples(c);
    drawSkiff(c);
    drawParticles(c);
    drawFog(c, escalation);
    drawCurrent(c);
  } else {
    drawFog(c, 0.3);
    drawSkiff(c);
  }
  ctx.restore();
}

function loop(ts){
  if(!lastTs) lastTs = ts;
  var dt = Math.min((ts - lastTs)/1000, 0.05);
  lastTs = ts;
  update(dt);
  render();
  animId = requestAnimationFrame(loop);
}

function pointerDown(e){
  if(state !== 'playing') return;
  e.preventDefault();
  var pt = getPoint(e);
  touchStart = { x: pt.x, y: pt.y, t: performance.now() };
  isDragging = false;
  skiff.targetX = pt.x;
}

function pointerMove(e){
  if(state !== 'playing' || !touchStart) return;
  e.preventDefault();
  var pt = getPoint(e);
  if(dist(pt.x, pt.y, touchStart.x, touchStart.y) > 12) isDragging = true;
  skiff.targetX = pt.x;
}

function pointerUp(e){
  if(state !== 'playing') return;
  e.preventDefault();
  if(touchStart){
    var pt = getPoint(e);
    var moved = dist(pt.x, pt.y, touchStart.x, touchStart.y);
    var elapsed = performance.now() - touchStart.t;
    if(!isDragging && moved < 20 && elapsed < 350){
      firePing(pt.x, pt.y);
    }
  }
  touchStart = null;
  isDragging = false;
}

function getPoint(e){
  var rect = canvas.getBoundingClientRect();
  var cx, cy;
  if(e.changedTouches && e.changedTouches.length){
    cx = e.changedTouches[0].clientX;
    cy = e.changedTouches[0].clientY;
  } else if(e.touches && e.touches.length){
    cx = e.touches[0].clientX;
    cy = e.touches[0].clientY;
  } else {
    cx = e.clientX;
    cy = e.clientY;
  }
  return { x: cx - rect.left, y: cy - rect.top };
}

function onKey(e){
  if(state === 'title' && (e.code === 'Space' || e.code === 'Enter')){
    e.preventDefault();
    startGame();
    return;
  }
  if(state === 'gameover' && (e.code === 'Space' || e.code === 'Enter')){
    e.preventDefault();
    startGame();
    return;
  }
  if(state !== 'playing') return;
  if(e.code === 'Space'){
    e.preventDefault();
    firePing(skiff.x, skiff.y - 80);
  }
  if(e.code === 'ArrowLeft') skiff.targetX -= 30;
  if(e.code === 'ArrowRight') skiff.targetX += 30;
}

if(startBtn){
  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });
}
if(restartBtn){
  restartBtn.addEventListener('click', function(e){
    e.stopPropagation();
    startGame();
  });
}

if(canvas){
  canvas.addEventListener('touchstart', pointerDown, {passive:false});
  canvas.addEventListener('touchmove', pointerMove, {passive:false});
  canvas.addEventListener('touchend', pointerUp, {passive:false});
  canvas.addEventListener('mousedown', pointerDown);
  canvas.addEventListener('mousemove', function(e){ if(touchStart) pointerMove(e); });
  canvas.addEventListener('mouseup', pointerUp);
}

window.addEventListener('keydown', onKey);
window.addEventListener('resize', function(){ resize(); initFog(); });

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
}

resize();
initFog();
skiff.x = W/2;
skiff.y = H*0.55;
skiff.targetX = W/2;
render();
animId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
