<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karl the Fog</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8eef2;--fg:#1a2830;--muted:#5a6d78;--accent:#c45c3e;
  --panel:rgba(255,255,255,.88);--shadow:rgba(26,40,48,.12);
  --hud-bg:rgba(255,255,255,.72);--bridge:#8a9aa4;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1619;--fg:#dce8ee;--muted:#7a919c;--accent:#e07a5a;
    --panel:rgba(18,28,34,.92);--shadow:rgba(0,0,0,.35);
    --hud-bg:rgba(18,28,34,.78);--bridge:#5a6d78;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;display:block;touch-action:none;user-select:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-pill{background:var(--hud-bg);backdrop-filter:blur(8px);padding:6px 12px;border-radius:6px;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hud-pill span{color:var(--fg);font-size:15px;font-weight:600;letter-spacing:0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;z-index:3;transition:opacity .4s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.panel{background:var(--panel);backdrop-filter:blur(12px);border-radius:16px;padding:28px 32px;
  max-width:min(340px,90vw);text-align:center;box-shadow:0 8px 32px var(--shadow)}
.panel h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px;line-height:1.2}
.panel .sub{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:20px}
.panel .score-display{font-size:36px;font-weight:700;color:var(--accent);margin:8px 0 4px}
.panel .best{font-size:11px;color:var(--muted);margin-bottom:20px}
.btn{pointer-events:auto;min-height:48px;min-width:160px;padding:14px 28px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:600;letter-spacing:.04em;
  cursor:pointer;touch-action:manipulation;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.96);opacity:.9}
.hint{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-size:11px;color:var(--muted);pointer-events:none;z-index:2;
  opacity:1;transition:opacity .3s}
.hint.hidden{opacity:0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-pill">Gap <span id="scoreVal">0</span></div>
    <div class="hud-pill">Combo <span id="comboVal">×1</span></div>
  </div>
  <div class="hint" id="hint">Hold to rise · Release to sink</div>
  <div class="overlay" id="titleOverlay">
    <div class="panel">
      <h1>Karl the Fog</h1>
      <p class="sub">Thread your drone through drifting fog banks above the SF hills. Each clean gap — a stolen glimpse of the bridge.</p>
      <button class="btn" data-smoke="start" id="startBtn">Launch Drone</button>
    </div>
  </div>
  <div class="overlay hidden" id="overOverlay">
    <div class="panel">
      <h1>Swallowed</h1>
      <p class="sub">The gray took you.</p>
      <div class="score-display" id="finalScore">0</div>
      <p class="best" id="finalCombo">Best combo: ×1</p>
      <button class="btn" data-smoke="restart" id="restartBtn">Try Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('canvas');
var ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('scoreVal');
var comboEl=document.getElementById('comboVal');
var titleOverlay=document.getElementById('titleOverlay');
var overOverlay=document.getElementById('overOverlay');
var hintEl=document.getElementById('hint');
var finalScoreEl=document.getElementById('finalScore');
var finalComboEl=document.getElementById('finalCombo');
var startBtn=document.getElementById('startBtn');
var restartBtn=document.getElementById('restartBtn');

var W=0,H=0,dpr=1;
var state='title';
var score=0,combo=1,maxCombo=1,gapsPassed=0;
var elapsed=0,difficulty=0;
var holding=false;
var drone={x:0,y:0,vy:0,r:8};
var fogBanks=[];
var particles=[];
var bridgeFlash=0;
var glimpseText=0;
var shakeT=0;
var hitPause=0;
var audioCtx=null;

var DARK=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;

var PAL={
  skyTop:DARK?'#1a2830':'#b8ccd8',
  skyBot:DARK?'#0f1619':'#dce8ee',
  hill1:DARK?'#1e2d35':'#6a8a96',
  hill2:DARK?'#162228':'#4d7078',
  hill3:DARK?'#0f181e':'#3a5a64',
  fog:DARK?'rgba(180,195,205,':'rgba(140,160,175,',
  drone:DARK?'#e07a5a':'#c45c3e',
  droneGlow:DARK?'rgba(224,122,90,0.4)':'rgba(196,92,62,0.35)',
  bridge:DARK?'#5a7080':'#7a9098'
};

function initAudio(){
  try{
    if(typeof AudioContext!=='undefined') audioCtx=new AudioContext();
    else if(typeof webkitAudioContext!=='undefined') audioCtx=new webkitAudioContext();
  }catch(e){audioCtx=null;}
}

function playTone(freq,dur,type,vol){
  if(!audioCtx)return;
  try{
    if(audioCtx.state==='suspended') audioCtx.resume();
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type=type||'sine';
    o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.08,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.15));
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+(dur||0.15));
  }catch(e){}
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drone.x=W*0.22;
  if(state==='title'||state==='over') drone.y=H*0.45;
}

function resetGame(){
  score=0;combo=1;maxCombo=1;gapsPassed=0;elapsed=0;difficulty=0;
  holding=false;drone.y=H*0.45;drone.vy=0;
  fogBanks=[];particles=[];bridgeFlash=0;glimpseText=0;shakeT=0;hitPause=0;
  scoreEl.textContent='0';comboEl.textContent='×1';
  ensureFogBanks();
}

function ensureFogBanks(){
  var maxX=-Infinity;
  for(var i=0;i<fogBanks.length;i++) if(fogBanks[i].x>maxX) maxX=fogBanks[i].x;
  if(maxX===-Infinity) maxX=W*0.5;
  while(maxX<W+180){
    maxX+=getBankSpacing();
    addFogBank(maxX);
  }
}

function getBankSpacing(){
  return Math.max(120,200-difficulty*8)+Math.random()*60;
}

function getGapSize(){
  return Math.max(70,140-difficulty*6);
}

function addFogBank(x){
  var gapH=getGapSize();
  var minY=H*0.12+gapH*0.5;
  var maxY=H*0.72-gapH*0.5;
  var gapY=minY+Math.random()*(maxY-minY);
  fogBanks.push({
    x:x,gapY:gapY,gapH:gapH,
    topH:gapY-gapH*0.5,
    botY:gapY+gapH*0.5,
    w:55+Math.random()*25,
    speed:1.8+difficulty*0.12+Math.random()*0.3,
    opacity:0.55+Math.min(0.35,difficulty*0.02),
    passed:false
  });
}

function spawnParticles(x,y,col,n){
  for(var i=0;i<(n||8);i++){
    particles.push({
      x:x,y:y,
      vx:(Math.random()-0.5)*4,
      vy:(Math.random()-0.5)*4,
      life:1,
      col:col||PAL.drone,
      r:2+Math.random()*3
    });
  }
}

function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,PAL.skyTop);
  g.addColorStop(1,PAL.skyBot);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

function drawHills(){
  var base=H*0.78;
  ctx.save();
  // far hill
  ctx.fillStyle=PAL.hill1;
  ctx.globalAlpha=0.5;
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(var i=0;i<=W;i+=4){
    ctx.lineTo(i,base-Math.sin(i*0.004+1)*35-Math.sin(i*0.009)*18);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  // mid hill
  ctx.fillStyle=PAL.hill2;
  ctx.globalAlpha=0.65;
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(var j=0;j<=W;j+=4){
    ctx.lineTo(j,base+20-Math.sin(j*0.006+0.5)*50-Math.sin(j*0.012+2)*22);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  // near hill
  ctx.fillStyle=PAL.hill3;
  ctx.globalAlpha=0.85;
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(var k=0;k<=W;k+=4){
    ctx.lineTo(k,base+55-Math.sin(k*0.005+3)*40-Math.sin(k*0.015)*15);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawBridge(glimpse){
  if(glimpse<=0)return;
  var alpha=Math.min(0.7,glimpse)*0.55;
  var bx=W*0.5,bby=H*0.58;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=PAL.bridge;
  ctx.lineWidth=2;
  ctx.lineCap='round';
  // towers
  ctx.beginPath();
  ctx.moveTo(bx-80,bby);ctx.lineTo(bx-80,bby-55);
  ctx.moveTo(bx+80,bby);ctx.lineTo(bx+80,bby-55);
  ctx.stroke();
  // cables
  ctx.lineWidth=1.5;
  ctx.beginPath();
  for(var i=-3;i<=3;i++){
    var tx=bx+i*22;
    ctx.moveTo(tx,bby-55);
    ctx.quadraticCurveTo(tx,bby-10,bx,bby+5);
  }
  ctx.stroke();
  // deck
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(bx-100,bby);ctx.lineTo(bx+100,bby);
  ctx.stroke();
  ctx.restore();
}

function drawFogBank(b){
  var topH=Math.max(0,b.topH);
  var botY=b.botY;
  var op=b.opacity;
  // top fog
  if(topH>2){
    var gt=ctx.createLinearGradient(b.x,0,b.x+ b.w,topH);
    gt.addColorStop(0,PAL.fog+(op*0.6)+')');
    gt.addColorStop(1,PAL.fog+(op)+')');
    ctx.fillStyle=gt;
    ctx.beginPath();
    ctx.moveTo(b.x,0);
    for(var i=0;i<=b.w;i+=3){
      var fx=b.x+i;
      var fy=topH+Math.sin(fx*0.05+elapsed*0.002)*6+Math.sin(fx*0.12)*3;
      ctx.lineTo(fx,fy);
    }
    ctx.lineTo(b.x+b.w,0);ctx.closePath();ctx.fill();
  }
  // bottom fog
  if(botY<H-2){
    var gb=ctx.createLinearGradient(b.x,botY,b.x+b.w,H);
    gb.addColorStop(0,PAL.fog+(op)+')');
    gb.addColorStop(1,PAL.fog+(op*0.7)+')');
    ctx.fillStyle=gb;
    ctx.beginPath();
    ctx.moveTo(b.x,botY);
    for(var j=0;j<=b.w;j+=3){
      var fx2=b.x+j;
      var fy2=botY+Math.sin(fx2*0.06+elapsed*0.002+1)*5;
      ctx.lineTo(fx2,fy2);
    }
    ctx.lineTo(b.x+b.w,H);ctx.lineTo(b.x,H);ctx.closePath();ctx.fill();
  }
}

function drawDrone(){
  var x=drone.x,y=drone.y;
  // glow
  ctx.save();
  var gr=ctx.createRadialGradient(x,y,0,x,y,drone.r*2.5);
  gr.addColorStop(0,PAL.droneGlow);
  gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr;
  ctx.beginPath();ctx.arc(x,y,drone.r*2.5,0,Math.PI*2);ctx.fill();
  // body
  ctx.fillStyle=PAL.drone;
  ctx.beginPath();
  ctx.ellipse(x,y,drone.r*1.1,drone.r*0.85,0,0,Math.PI*2);
  ctx.fill();
  // propellers
  ctx.strokeStyle=DARK?'#dce8ee':'#1a2830';
  ctx.lineWidth=1.5;
  ctx.globalAlpha=0.6+Math.sin(elapsed*0.02)*0.3;
  ctx.beginPath();
  ctx.moveTo(x-drone.r*1.8,y-drone.r*0.5);ctx.lineTo(x+drone.r*1.8,y-drone.r*0.5);
  ctx.moveTo(x,y-drone.r*1.5);ctx.lineTo(x,y+drone.r*0.3);
  ctx.stroke();
  ctx.restore();
  // light
  ctx.fillStyle='#fff';
  ctx.globalAlpha=0.9;
  ctx.beginPath();ctx.arc(x+drone.r*0.4,y-drone.r*0.2,2,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

function drawParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=0.025;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life*0.8;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function checkCollision(b){
  var dx=drone.x-b.x;
  if(dx<-10||dx>b.w+10)return false;
  if(dx>=-10&&dx<=b.w+10){
    if(drone.y-drone.r*0.7<b.topH)return true;
    if(drone.y+drone.r*0.7>b.botY)return true;
  }
  return false;
}

function updatePlaying(dt){
  if(hitPause>0){hitPause-=dt;return;}
  elapsed+=dt;
  difficulty=Math.min(30,elapsed*0.008);
  var rise=holding?-2.8:1.6;
  drone.vy+=(rise-drone.vy)*0.12;
  drone.y+=drone.vy;
  var pad=drone.r+4;
  if(drone.y<pad){drone.y=pad;drone.vy=0;}
  if(drone.y>H*0.76-pad){drone.y=H*0.76-pad;drone.vy=0;}

  for(var i=fogBanks.length-1;i>=0;i--){
    var b=fogBanks[i];
    b.x-=b.speed;
    if(!b.passed&&b.x+b.w<drone.x){
      b.passed=true;
      gapsPassed++;
      combo=Math.min(20,combo+1);
      if(combo>maxCombo) maxCombo=combo;
      score+=10*combo;
      scoreEl.textContent=score;
      comboEl.textContent='×'+combo;
      bridgeFlash=1;
      glimpseText=1;
      hitPause=60;
      spawnParticles(drone.x,drone.y,'#8ab0c0',10);
      playTone(440+combo*20,0.1,'sine',0.06);
      try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
    }
    if(checkCollision(b)){
      gameOver();
      return;
    }
    if(b.x+b.w<-60) fogBanks.splice(i,1);
  }
  ensureFogBanks();
  if(bridgeFlash>0) bridgeFlash-=dt*0.003;
  if(glimpseText>0) glimpseText-=dt*0.004;
  if(shakeT>0) shakeT-=dt;
}

function gameOver(){
  state='over';
  shakeT=400;
  hintEl.classList.add('hidden');
  overOverlay.classList.remove('hidden');
  finalScoreEl.textContent=score;
  finalComboEl.textContent='Best combo: ×'+maxCombo+' · '+gapsPassed+' gaps';
  playTone(120,0.3,'sawtooth',0.05);
  try{navigator.vibrate&&navigator.vibrate([30,20,50]);}catch(e){}
}

function startGame(){
  state='playing';
  titleOverlay.classList.add('hidden');
  overOverlay.classList.add('hidden');
  hintEl.classList.remove('hidden');
  resetGame();
  playTone(330,0.12,'sine',0.05);
}

function render(){
  ctx.save();
  if(shakeT>0){
    ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6);
  }
  drawSky();
  drawBridge(bridgeFlash);
  drawHills();
  for(var i=0;i<fogBanks.length;i++) drawFogBank(fogBanks[i]);
  drawParticles();
  drawDrone();
  if(glimpseText>0){
    ctx.save();
    ctx.globalAlpha=Math.min(1,glimpseText)*0.85;
    ctx.fillStyle=PAL.fg;
    ctx.font='600 13px ui-monospace,Menlo,monospace';
    ctx.textAlign='center';
    ctx.fillText('glimpse of the bridge',W*0.5,H*0.38);
    ctx.restore();
  }
  ctx.restore();
}

var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(t-lastT,50);
  lastT=t;
  if(state==='playing') updatePlaying(dt);
  else if(state==='title'){
    elapsed+=dt;
    drone.y=H*0.45+Math.sin(elapsed*0.002)*12;
    for(var t=0;t<fogBanks.length;t++) fogBanks[t].x-=0.4;
    if(!fogBanks.length||fogBanks[fogBanks.length-1].x<W*0.7){
      ensureFogBanks();
    }
    for(var u=fogBanks.length-1;u>=0;u--){
      if(fogBanks[u].x+fogBanks[u].w<-40) fogBanks.splice(u,1);
    }
  }
  render();
}

function setHold(v,e){
  if(e){e.preventDefault();}
  if(state==='playing') holding=v;
}

canvas.addEventListener('pointerdown',function(e){
  if(state==='playing'){setHold(true,e);canvas.setPointerCapture(e.pointerId);}
});
canvas.addEventListener('pointerup',function(e){setHold(false,e);});
canvas.addEventListener('pointercancel',function(e){setHold(false,e);});
canvas.addEventListener('pointerleave',function(e){if(!e.buttons)setHold(false,e);});

canvas.addEventListener('touchstart',function(e){if(state==='playing')e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove',function(e){if(state==='playing')e.preventDefault();},{passive:false});

window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(state==='playing') holding=true;
  }
});
window.addEventListener('keyup',function(e){
  if(e.code==='Space'||e.code==='ArrowUp') holding=false;
});

startBtn.addEventListener('click',function(e){
  e.stopPropagation();
  initAudio();
  startGame();
});
restartBtn.addEventListener('click',function(e){
  e.stopPropagation();
  startGame();
});

window.addEventListener('resize',resize);
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){
    DARK=window.matchMedia('(prefers-color-scheme:dark)').matches;
    PAL.skyTop=DARK?'#1a2830':'#b8ccd8';
    PAL.skyBot=DARK?'#0f1619':'#dce8ee';
    PAL.hill1=DARK?'#1e2d35':'#6a8a96';
    PAL.hill2=DARK?'#162228':'#4d7078';
    PAL.hill3=DARK?'#0f181e':'#3a5a64';
    PAL.fog=DARK?'rgba(180,195,205,':'rgba(140,160,175,';
    PAL.drone=DARK?'#e07a5a':'#c45c3e';
    PAL.droneGlow=DARK?'rgba(224,122,90,0.4)':'rgba(196,92,62,0.35)';
    PAL.bridge=DARK?'#5a7080':'#7a9098';
  });
}

resize();
ensureFogBanks();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
