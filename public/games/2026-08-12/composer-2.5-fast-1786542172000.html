<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Buffer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c1014;--fg:#e4e8ec;--muted:#7a8894;--accent:#d4a054;
  --panel:rgba(12,16,20,.92);--shadow:rgba(0,0,0,.45);--hud:rgba(8,12,16,.78);
  --btn-fg:#0c1014;--line:#2a3440;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0c1014;--fg:#e4e8ec;--muted:#7a8894;--accent:#d4a054;
    --panel:rgba(12,16,20,.92);--shadow:rgba(0,0,0,.45);--hud:rgba(8,12,16,.78);
    --btn-fg:#0c1014;--line:#2a3440;
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#d8dde2;--fg:#141c24;--muted:#5a6878;--accent:#b87828;
    --panel:rgba(240,244,248,.94);--shadow:rgba(20,28,36,.18);--hud:rgba(232,236,240,.85);
    --btn-fg:#f8fafc;--line:#b8c4d0;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;display:block;touch-action:none;user-select:none;background:#080a0c}
#hud{position:absolute;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 6px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;gap:8px}
.hud-pill{background:var(--hud);backdrop-filter:blur(6px);padding:5px 10px;border-radius:4px;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line)}
.hud-pill span{color:var(--fg);font-size:14px;font-weight:600;letter-spacing:0;display:block;margin-top:2px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;z-index:4;transition:opacity .35s ease,visibility .35s}
.overlay.hidden{opacity:0;visibility:hidden}
.panel{background:var(--panel);backdrop-filter:blur(10px);border-radius:14px;padding:26px 28px;
  max-width:min(360px,92vw);text-align:center;box-shadow:0 10px 40px var(--shadow);border:1px solid var(--line)}
.panel h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px;line-height:1.25}
.panel .sub{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:18px}
.panel .score-big{font-size:38px;font-weight:700;color:var(--accent);margin:6px 0 4px}
.panel .meta{font-size:10px;color:var(--muted);margin-bottom:18px;letter-spacing:.04em}
.btn{pointer-events:auto;min-height:48px;min-width:168px;padding:14px 26px;border:none;border-radius:8px;
  background:var(--accent);color:var(--btn-fg);font:inherit;font-size:13px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;touch-action:manipulation;
  transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.96);opacity:.88}
.hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-size:10px;color:var(--muted);pointer-events:none;z-index:2;
  letter-spacing:.06em;text-transform:uppercase;transition:opacity .25s}
.hint.hidden{opacity:0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-pill">Catch <span id="scoreVal">0</span></div>
    <div class="hud-pill">Round <span id="roundVal">1</span></div>
    <div class="hud-pill">Window <span id="windowVal">—</span></div>
  </div>
  <div class="hint" id="hint">Hold to track · Release at totality</div>
  <div class="overlay" id="titleOverlay">
    <div class="panel">
      <h1>Shadow Buffer</h1>
      <p class="sub">Grainy eclipse cam. Hold to lock the moon's shadow. Release the instant totality hits — before the feed glitches.</p>
      <button class="btn" data-smoke="start" id="startBtn">Open Feed</button>
    </div>
  </div>
  <div class="overlay hidden" id="overOverlay">
    <div class="panel">
      <h1 id="overTitle">Signal Lost</h1>
      <p class="sub" id="overSub">Buffer corrupted.</p>
      <div class="score-big" id="finalScore">0</div>
      <p class="meta" id="finalMeta">0 perfect releases</p>
      <button class="btn" data-smoke="restart" id="restartBtn">Reconnect</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('canvas');
var ctx=canvas&&canvas.getContext?canvas.getContext('2d'):null;
var scoreEl=document.getElementById('scoreVal');
var roundEl=document.getElementById('roundVal');
var windowEl=document.getElementById('windowVal');
var titleOverlay=document.getElementById('titleOverlay');
var overOverlay=document.getElementById('overOverlay');
var hintEl=document.getElementById('hint');
var finalScoreEl=document.getElementById('finalScore');
var finalMetaEl=document.getElementById('finalMeta');
var overTitleEl=document.getElementById('overTitle');
var overSubEl=document.getElementById('overSub');
var startBtn=document.getElementById('startBtn');
var restartBtn=document.getElementById('restartBtn');

var W=320,H=480,dpr=1;
var state='title';
var score=0,round=1,bestStreak=0;
var holding=false;
var pointerX=0.5;
var reticleX=0.5;
var phase=0;
var phaseSpeed=0.085;
var shadowX=0.15;
var shadowSpeed=0.12;
var track=1;
var totalityCenter=0.72;
var totalityHalf=0.09;
var roundDuration=9;
var elapsed=0;
var clouds=[];
var grain=[];
var particles=[];
var flashT=0;
var shakeT=0;
var hitPause=0;
var feedbackT=0;
var feedbackText='';
var feedbackGood=false;
var glitchT=0;
var coronaT=0;
var audioCtx=null;
var rafId=0;
var lastTs=0;

var DARK=!(window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches);

function initAudio(){
  try{
    if(typeof AudioContext!=='undefined') audioCtx=new AudioContext();
    else if(typeof webkitAudioContext!=='undefined') audioCtx=new webkitAudioContext();
  }catch(e){audioCtx=null;}
}

function tone(freq,dur,type,vol){
  if(!audioCtx)return;
  try{
    if(audioCtx.state==='suspended') audioCtx.resume();
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type=type||'sine';
    o.frequency.value=freq;
    var t=audioCtx.currentTime;
    g.gain.setValueAtTime(vol||0.06,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.12));
    o.connect(g);g.connect(audioCtx.destination);
    o.start(t);o.stop(t+(dur||0.12)+0.02);
  }catch(e){}
}

function vibrate(ms){
  try{if(navigator.vibrate) navigator.vibrate(ms);}catch(e){}
}

function resize(){
  if(!canvas||!ctx)return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||320;H=window.innerHeight||480;
  canvas.width=Math.max(1,Math.floor(W*dpr));
  canvas.height=Math.max(1,Math.floor(H*dpr));
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  initClouds();
  initGrain();
}

function initClouds(){
  clouds=[];
  var n=3+Math.floor(round*0.4);
  for(var i=0;i<n;i++){
    clouds.push({
      x:Math.random()*1.4-0.2,
      y:0.08+Math.random()*0.55,
      w:0.18+Math.random()*0.28,
      h:0.06+Math.random()*0.12,
      spd:0.015+Math.random()*0.025+round*0.003,
      alpha:0.25+Math.random()*0.35
    });
  }
}

function initGrain(){
  grain=[];
  for(var i=0;i<120;i++){
    grain.push({x:Math.random(),y:Math.random(),a:Math.random()*0.35});
  }
}

function totalityWindowMs(){
  return Math.max(180,720-round*85);
}

function updateHud(){
  if(scoreEl) scoreEl.textContent=String(score);
  if(roundEl) roundEl.textContent=String(round);
  if(windowEl) windowEl.textContent=(totalityWindowMs()/1000).toFixed(1)+'s';
}

function resetRound(){
  phase=0;
  elapsed=0;
  shadowX=0.12+Math.random()*0.06;
  shadowSpeed=0.1+round*0.012+Math.random()*0.02;
  totalityCenter=0.68+Math.random()*0.08;
  totalityHalf=(totalityWindowMs()/1000)/roundDuration*0.5;
  track=1;
  holding=false;
  pointerX=0.5;
  reticleX=shadowX;
  feedbackT=0;
  glitchT=0;
  coronaT=0;
  initClouds();
  updateHud();
}

function resetGame(){
  score=0;round=1;bestStreak=0;
  resetRound();
}

function startGame(){
  initAudio();
  resetGame();
  state='playing';
  if(titleOverlay) titleOverlay.classList.add('hidden');
  if(overOverlay) overOverlay.classList.add('hidden');
  if(hintEl) hintEl.classList.remove('hidden');
  lastTs=0;
}

function endGame(reason,sub){
  state='over';
  if(hintEl) hintEl.classList.add('hidden');
  if(overOverlay) overOverlay.classList.remove('hidden');
  if(overTitleEl) overTitleEl.textContent=reason||'Signal Lost';
  if(overSubEl) overSubEl.textContent=sub||'Buffer corrupted.';
  if(finalScoreEl) finalScoreEl.textContent=String(score);
  if(finalMetaEl) finalMetaEl.textContent=score+' catch'+(score===1?'':'es')+' · round '+round;
  tone(110,0.35,'sawtooth',0.04);
  vibrate([30,40,30]);
}

function spawnParticles(x,y,col,n){
  for(var i=0;i<(n||12);i++){
    var a=Math.random()*Math.PI*2;
    var sp=1.5+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5+Math.random()*0.4,r:1+Math.random()*2,c:col});
  }
}

function cloudCoverAt(x,y){
  var cover=0;
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i];
    if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h) cover=Math.max(cover,c.alpha);
  }
  return cover;
}

function inTotality(){
  return phase>=totalityCenter-totalityHalf&&phase<=totalityCenter+totalityHalf;
}

function pastTotality(){
  return phase>totalityCenter+totalityHalf;
}

function onRelease(){
  if(state!=='playing'||feedbackT>0)return;
  holding=false;
  if(inTotality()){
    var mid=totalityCenter;
    var dist=Math.abs(phase-mid)/totalityHalf;
    var precision=Math.max(0,1-dist);
    var pts=Math.round(100+precision*400);
    score++;
    if(score>bestStreak) bestStreak=score;
    feedbackGood=true;
    feedbackText=precision>0.85?'PERFECT TOTALITY':precision>0.5?'CLEAN RELEASE':'EDGE CATCH';
    feedbackT=1.2;
    coronaT=1.5;
    flashT=0.4;
    shakeT=0.15;
    tone(440+precision*220,0.2,'sine',0.08);
    tone(660+precision*110,0.35,'triangle',0.05);
    vibrate(18);
    spawnParticles(W*0.5,H*0.38,'#f0c060',20);
    round++;
    setTimeout(function(){
      if(state==='playing') resetRound();
    },900);
  }else if(phase<totalityCenter-totalityHalf){
    feedbackGood=false;
    feedbackText='TOO EARLY';
    failRound('Early Release','You let go before totality.');
  }else{
    feedbackGood=false;
    feedbackText='GLITCH';
    failRound('Buffer Glitch','Held through the totality window.');
  }
}

function failRound(title,sub){
  glitchT=1.2;
  feedbackT=0.8;
  flashT=0.2;
  shakeT=0.35;
  tone(80,0.4,'square',0.05);
  vibrate([50,30,80]);
  setTimeout(function(){ endGame(title,sub); },700);
}

function setHold(on){
  if(state!=='playing'||feedbackT>0.3)return;
  holding=on;
  if(on&&audioCtx&&audioCtx.state==='suspended'){try{audioCtx.resume();}catch(e){}}
}

function pointerPos(e){
  var r=canvas.getBoundingClientRect();
  var cx=e.clientX!=null?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:W*0.5);
  return Math.max(0.05,Math.min(0.95,(cx-r.left)/Math.max(1,r.width)));
}

function onPointerDown(e){
  if(state!=='playing')return;
  e.preventDefault();
  pointerX=pointerPos(e);
  reticleX=pointerX;
  setHold(true);
}

function onPointerMove(e){
  if(state!=='playing')return;
  e.preventDefault();
  pointerX=pointerPos(e);
  if(holding) reticleX=pointerX;
}

function onPointerUp(e){
  if(state!=='playing')return;
  e.preventDefault();
  if(holding) onRelease();
  else setHold(false);
}

function onKeyDown(e){
  if(e.code==='Space'){
    e.preventDefault();
    if(state==='title') return;
    if(state==='over') return;
    if(!holding) setHold(true);
  }
}

function onKeyUp(e){
  if(e.code==='Space'){
    e.preventDefault();
    if(holding) onRelease();
  }
}

function update(dt){
  if(hitPause>0){hitPause-=dt;return;}
  if(state!=='playing')return;

  elapsed+=dt;
  phase=Math.min(1,elapsed/roundDuration);
  shadowX+=shadowSpeed*dt;
  if(shadowX>0.88) shadowSpeed*=-1;
  if(shadowX<0.08) shadowSpeed*=-1;

  for(var i=0;i<clouds.length;i++){
    clouds[i].x+=clouds[i].spd*dt;
    if(clouds[i].x>1.15) clouds[i].x=-clouds[i].w-0.1;
  }

  if(holding){
    var diff=Math.abs(reticleX-shadowX);
    var cover=cloudCoverAt(reticleX,0.38);
    var align=Math.max(0,1-diff*3.5)*(1-cover*0.85);
    track-=dt*(0.35+(1-align)*1.8+round*0.04);
    if(track<=0){
      holding=false;
      failRound('Tracking Lost','Shadow lock broken before totality.');
    }
  }else if(phase<totalityCenter-totalityHalf*0.5){
    track-=dt*0.55;
    if(track<=0&&phase>0.15){
      failRound('No Lock','Hold to track the shadow.');
    }
  }

  if(holding&&pastTotality()){
    onRelease();
  }

  if(phase>=1&&!feedbackT){
    if(!inTotality()||holding) failRound('Feed Timeout','Totality passed uncaught.');
  }

  for(var p=particles.length-1;p>=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.08;pt.life-=dt;
    if(pt.life<=0) particles.splice(p,1);
  }

  if(flashT>0) flashT-=dt;
  if(shakeT>0) shakeT-=dt;
  if(feedbackT>0) feedbackT-=dt;
  if(glitchT>0) glitchT-=dt;
  if(coronaT>0) coronaT-=dt;
}

function drawSun(cx,cy,r,totalityAmt){
  var g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  if(totalityAmt>0.5){
    g.addColorStop(0,'#fff8e8');
    g.addColorStop(0.15,'#f0d080');
    g.addColorStop(0.4,'#c88830');
    g.addColorStop(1,'rgba(200,120,40,0)');
  }else{
    g.addColorStop(0,'#fffaf0');
    g.addColorStop(0.3,'#f0c860');
    g.addColorStop(0.7,'#d89020');
    g.addColorStop(1,'rgba(210,130,30,0.15)');
  }
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
}

function drawMoonShadow(cx,cy,r){
  var mx=cx+(shadowX-0.5)*r*1.6;
  var my=cy;
  ctx.fillStyle='rgba(6,8,12,0.92)';
  ctx.beginPath();ctx.arc(mx,my,r*0.98,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.beginPath();ctx.arc(mx,my,r*0.88,0,Math.PI*2);ctx.fill();
}

function drawCorona(cx,cy,r,intensity){
  if(intensity<=0)return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<8;i++){
    var a=(i/8)*Math.PI*2+elapsed*0.4;
    var len=r*(1.2+Math.sin(elapsed*3+i)*0.15)*intensity;
    ctx.strokeStyle='rgba(240,200,120,'+(0.15*intensity)+')';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r*0.9,cy+Math.sin(a)*r*0.9);
    ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);
    ctx.stroke();
  }
  var cg=ctx.createRadialGradient(cx,cy,r*0.5,cx,cy,r*2.2);
  cg.addColorStop(0,'rgba(255,240,200,'+(0.35*intensity)+')');
  cg.addColorStop(0.5,'rgba(240,180,80,'+(0.12*intensity)+')');
  cg.addColorStop(1,'rgba(240,180,80,0)');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.arc(cx,cy,r*2.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function draw(){
  if(!ctx)return;
  var sx=shakeT>0?(Math.random()-0.5)*shakeT*12:0;
  var sy=shakeT>0?(Math.random()-0.5)*shakeT*8:0;
  ctx.save();
  ctx.translate(sx,sy);

  var skyTop=DARK?'#141a20':'#8898a4';
  var skyBot=DARK?'#0a0e12':'#b8c4cc';
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,skyTop);g.addColorStop(1,skyBot);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  var feedY=H*0.12,feedH=H*0.52,feedX=W*0.06,feedW=W*0.88;
  ctx.fillStyle=DARK?'#06080a':'#1a2028';
  ctx.fillRect(feedX-4,feedY-4,feedW+8,feedH+8);

  var totAmt=inTotality()?1:Math.max(0,1-Math.abs(phase-totalityCenter)/(totalityHalf*2));
  var cx=feedX+feedW*0.5,cy=feedY+feedH*0.48,sr=Math.min(feedW,feedH)*0.28;

  drawSun(cx,cy,sr,totAmt);
  drawMoonShadow(cx,cy,sr);
  if(coronaT>0||totAmt>0.3) drawCorona(cx,cy,sr,Math.max(coronaT*0.8,totAmt*0.6));

  ctx.save();
  ctx.beginPath();ctx.rect(feedX,feedY,feedW,feedH);ctx.clip();
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i];
    var px=feedX+c.x*feedW,py=feedY+c.y*feedH;
    var pw=c.w*feedW,ph=c.h*feedH;
    var cg=ctx.createRadialGradient(px+pw*0.5,py+ph*0.5,0,px+pw*0.5,py+ph*0.5,pw*0.55);
    cg.addColorStop(0,'rgba(200,210,220,'+(c.alpha*0.9)+')');
    cg.addColorStop(1,'rgba(200,210,220,0)');
    ctx.fillStyle=cg;
    ctx.fillRect(px,py,pw,ph);
  }
  ctx.restore();

  ctx.strokeStyle=DARK?'rgba(80,90,100,0.5)':'rgba(60,70,80,0.35)';
  ctx.lineWidth=1;
  ctx.strokeRect(feedX,feedY,feedW,feedH);

  for(var gi=0;gi<grain.length;gi++){
    var gr=grain[gi];
    ctx.fillStyle='rgba(255,255,255,'+(gr.a*(DARK?0.08:0.12))+')';
    ctx.fillRect(feedX+gr.x*feedW,feedY+gr.y*feedH,1.5,1.5);
  }

  ctx.fillStyle=DARK?'rgba(0,0,0,0.12)':'rgba(0,0,0,0.06)';
  for(var sy2=feedY;sy2<feedY+feedH;sy2+=3){
    ctx.fillRect(feedX,sy2,feedW,1);
  }

  if(glitchT>0){
    ctx.fillStyle='rgba(255,60,40,'+(glitchT*0.25)+')';
    for(var gl=0;gl<6;gl++){
      var gy=feedY+Math.random()*feedH;
      ctx.fillRect(feedX,gy,feedW,2+Math.random()*8);
    }
  }

  if(state==='playing'){
    var rx=feedX+reticleX*feedW,ry=feedY+feedH*0.48;
    ctx.strokeStyle=holding?'rgba(212,160,84,0.95)':'rgba(212,160,84,0.35)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(rx,ry,18,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rx-10,ry);ctx.lineTo(rx+10,ry);
    ctx.moveTo(rx,ry-10);ctx.lineTo(rx,ry+10);
    ctx.stroke();
    if(holding){
      ctx.fillStyle='rgba(212,160,84,0.15)';
      ctx.beginPath();ctx.arc(rx,ry,14,0,Math.PI*2);ctx.fill();
    }
  }

  var barX=feedX,barY=feedY+feedH+14,barW=feedW,barH=6;
  ctx.fillStyle=DARK?'rgba(40,48,56,0.8)':'rgba(180,190,200,0.8)';
  ctx.fillRect(barX,barY,barW,barH);
  var fillW=barW*phase;
  ctx.fillStyle='rgba(212,160,84,0.85)';
  ctx.fillRect(barX,barY,fillW,barH);
  var tStart=(totalityCenter-totalityHalf)*barW;
  var tW=totalityHalf*2*barW;
  ctx.fillStyle='rgba(240,200,120,0.55)';
  ctx.fillRect(barX+tStart,barY-2,tW,barH+4);

  var trackX=feedX,trackY=barY+16,trackW=barW,trackH=5;
  ctx.fillStyle=DARK?'rgba(40,48,56,0.6)':'rgba(180,190,200,0.6)';
  ctx.fillRect(trackX,trackY,trackW,trackH);
  ctx.fillStyle=track>0.35?'rgba(100,180,140,0.9)':'rgba(220,80,60,0.9)';
  ctx.fillRect(trackX,trackY,trackW*Math.max(0,track),trackH);

  ctx.fillStyle=DARK?'#9aa8b4':'#3a4854';
  ctx.font='10px ui-monospace,Menlo,monospace';
  ctx.textAlign='left';
  var rem=Math.max(0,roundDuration-elapsed);
  ctx.fillText('T-'+rem.toFixed(1)+'s',barX,barY-6);
  ctx.textAlign='right';
  ctx.fillText('LIVE · CAM 04',barX+barW,barY-6);

  ctx.textAlign='center';
  ctx.fillStyle=DARK?'#c8d0d8':'#2a3844';
  ctx.font='11px ui-monospace,Menlo,monospace';
  var phasePct=Math.round(phase*100);
  ctx.fillText('ECLIPSE '+phasePct+'%',W*0.5,feedY+feedH+52);

  var nearTot=phase>totalityCenter-totalityHalf*2.5&&phase<totalityCenter+totalityHalf;
  if(nearTot&&state==='playing'&&feedbackT<=0){
    var pulse=0.5+Math.sin(elapsed*8)*0.5;
    ctx.font='bold 13px ui-monospace,Menlo,monospace';
    ctx.fillStyle='rgba(240,200,100,'+(0.5+pulse*0.5)+')';
    ctx.fillText(holding?'RELEASE NOW':'LOCK ON',W*0.5,H*0.78);
  }

  if(feedbackT>0){
    ctx.font='bold 16px ui-monospace,Menlo,monospace';
    ctx.fillStyle=feedbackGood?'rgba(240,200,100,'+feedbackT+')':'rgba(240,90,70,'+feedbackT+')';
    ctx.fillText(feedbackText,W*0.5,H*0.82);
  }

  for(var pi=0;pi<particles.length;pi++){
    var p=particles[pi];
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  if(flashT>0){
    ctx.fillStyle=feedbackGood?'rgba(255,240,200,'+(flashT*0.35)+')':'rgba(255,60,40,'+(flashT*0.2)+')';
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();
}

function loop(ts){
  rafId=0;
  if(!lastTs) lastTs=ts;
  var dt=Math.min(0.05,(ts-lastTs)/1000);
  lastTs=ts;
  update(dt);
  draw();
  rafId=requestAnimationFrame(loop);
}

function bindEvents(){
  if(startBtn) startBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
  if(restartBtn) restartBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
  if(canvas){
    canvas.addEventListener('mousedown',onPointerDown);
    canvas.addEventListener('mousemove',onPointerMove);
    window.addEventListener('mouseup',onPointerUp);
    canvas.addEventListener('touchstart',onPointerDown,{passive:false});
    canvas.addEventListener('touchmove',onPointerMove,{passive:false});
    canvas.addEventListener('touchend',onPointerUp,{passive:false});
    canvas.addEventListener('touchcancel',onPointerUp,{passive:false});
  }
  window.addEventListener('keydown',onKeyDown);
  window.addEventListener('keyup',onKeyUp);
  window.addEventListener('resize',resize);
  if(window.matchMedia){
    var mq=window.matchMedia('(prefers-color-scheme: light)');
    if(mq.addEventListener) mq.addEventListener('change',function(){DARK=!mq.matches;});
    else if(mq.addListener) mq.addListener(function(){DARK=!mq.matches;});
  }
}

resize();
updateHud();
draw();
bindEvents();
rafId=requestAnimationFrame(loop);

})();
</script>
</body>
</html>
