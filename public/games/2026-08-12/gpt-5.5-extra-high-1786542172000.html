<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shortcut Sunrise</title>
<style>
:root{
  color-scheme: dark light;
  --bg:#07110d;--ink:#eef9ef;--muted:#9bb3a6;--panel:rgba(6,18,12,.76);
  --line:rgba(130,255,174,.24);--hot:#ffb84a;--good:#72f2a1;--bad:#ff6b4a;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#07110d;--ink:#eef9ef;--muted:#9bb3a6;--panel:rgba(6,18,12,.76);--line:rgba(130,255,174,.24);--hot:#ffb84a;--good:#72f2a1;--bad:#ff6b4a}
  .card{background:linear-gradient(180deg,var(--panel),rgba(4,13,9,.82));box-shadow:0 26px 90px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.08)}
  .tips div{background:rgba(127,255,165,.06)}
  button{color:#06110b}
}
@media (prefers-color-scheme: light){
  :root{--bg:#edf4ec;--ink:#102019;--muted:#52675d;--panel:rgba(248,253,247,.76);--line:rgba(11,96,58,.22);--hot:#c77416;--good:#178f52;--bad:#c44224}
}
*{box-sizing:border-box}
html,body{margin:0;width:100dvw;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100dvw;height:100dvh;display:block;touch-action:none;background:var(--bg)}
.hud{position:fixed;inset:env(safe-area-inset-top) 0 auto 0;padding:14px 16px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none;z-index:2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pill{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);border-radius:18px;padding:9px 11px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.pill b{display:block;font-size:20px;line-height:1;color:var(--ink);letter-spacing:-.05em}
.pill span{display:block;margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
#score{text-align:left}#clock{text-align:center}#glitch{text-align:right}
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:22px;z-index:5;pointer-events:none;transition:opacity .28s ease,visibility .28s ease}
.screen.hidden{opacity:0;visibility:hidden}
.card{width:min(420px,calc(100dvw - 32px));border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),rgba(4,13,9,.82));border-radius:30px;padding:28px 24px;text-align:center;box-shadow:0 26px 90px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.08)}
@media (prefers-color-scheme: light){.card{background:linear-gradient(180deg,var(--panel),rgba(238,248,238,.88));box-shadow:0 26px 90px rgba(54,78,63,.2),inset 0 1px rgba(255,255,255,.8)}}
.kicker{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--good)}
h1{margin:12px 0 10px;font-size:clamp(36px,11vw,58px);line-height:.9;letter-spacing:-.08em}
p{margin:0 auto 18px;max-width:29em;color:var(--muted);font-size:15px;line-height:1.45}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 22px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}
.tips div{border:1px solid var(--line);border-radius:14px;padding:9px 6px;background:rgba(127,255,165,.06)}
button{appearance:none;border:0;border-radius:999px;min-height:48px;padding:0 22px;font:800 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#06110b;background:var(--good);box-shadow:0 10px 32px rgba(53,222,116,.32);cursor:pointer;pointer-events:auto}
button:focus-visible{outline:3px solid var(--hot);outline-offset:4px}
#overText{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
</style>
</head>
<body>
<canvas id="game" aria-label="Shortcut Sunrise game area"></canvas>
<div class="hud" aria-hidden="true">
  <div class="pill" id="score"><b>0</b><span>score</span></div>
  <div class="pill" id="clock"><b>45</b><span>to sunrise</span></div>
  <div class="pill" id="glitch"><b>0/6</b><span>glitches</span></div>
</div>
<section class="screen" id="title">
  <div class="card">
    <div class="kicker">overcast august // phone tray online</div>
    <h1>Shortcut Sunrise</h1>
    <p>Drag agent tiles from the tray into matching build slots. Keep three lanes running before daylight hits the terminal.</p>
    <div class="tips"><div>DRAG TILE</div><div>MATCH SLOT</div><div>SHIP LANES</div></div>
    <button data-smoke="start" id="startBtn" type="button">Start Build</button>
  </div>
</section>
<section class="screen hidden" id="over">
  <div class="card">
    <div class="kicker" id="overKicker">sunrise report</div>
    <h1 id="overTitle">Shipped</h1>
    <p id="overText">0 builds completed.</p>
    <button data-smoke="restart" id="restartBtn" type="button">Run Again</button>
  </div>
</section>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas && canvas.getContext ? canvas.getContext("2d", { alpha:false }) : null;
  const startBtn = document.getElementById("startBtn");
  const restartBtn = document.getElementById("restartBtn");
  const title = document.getElementById("title");
  const over = document.getElementById("over");
  const scoreEl = document.querySelector("#score b");
  const clockEl = document.querySelector("#clock b");
  const glitchEl = document.querySelector("#glitch b");
  const overTitle = document.getElementById("overTitle");
  const overText = document.getElementById("overText");
  const overKicker = document.getElementById("overKicker");
  if (!canvas || !ctx || !startBtn || !restartBtn) return;

  let W = 1, H = 1, DPR = 1, last = 0, state = "title", timeLeft = 45, elapsed = 0;
  let score = 0, builds = 0, glitches = 0, combo = 1, spawnClock = 0, shake = 0, dragging = null;
  let lanes = [], tokens = [], particles = [], fog = [], stars = [];
  let audio = null;
  const agents = [
    {id:"ios", label:"IOS", color:"#61dfff"},
    {id:"cli", label:"CLI", color:"#72f2a1"},
    {id:"ci", label:"CI", color:"#ffd166"},
    {id:"fix", label:"FIX", color:"#ff8a5b"},
    {id:"net", label:"NET", color:"#58d6a4"}
  ];
  const names = ["dawn patch","fog relay","eclipse cam","rescue ping","feed trimmer","shortcut rig","terminal bloom","agent braid"];

  function lightMode(){
    try { return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches; }
    catch(e){ return false; }
  }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function rnd(a,b){ return a + Math.random() * (b-a); }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
  function resize(){
    DPR = clamp(window.devicePixelRatio || 1, 1, 2);
    W = Math.max(1, window.innerWidth || 320);
    H = Math.max(1, window.innerHeight || 568);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layoutLanes();
    layoutTokens();
  }
  function layoutLanes(){
    const trayTop = H - Math.max(118, H * .19);
    const top = Math.max(94, H * .15);
    const gap = 11;
    const laneH = Math.max(82, (trayTop - top - gap*2) / 3);
    for (let i=0;i<3;i++){
      const old = lanes[i] || {};
      lanes[i] = Object.assign(old, {x:16, y:top+i*(laneH+gap), w:W-32, h:laneH, idx:i});
      if (!lanes[i].job) lanes[i].job = makeJob(i);
    }
  }
  function layoutTokens(){
    const baseY = H - 76;
    const size = clamp(W / 5.8, 54, 72);
    tokens.forEach((t,i) => {
      if (t.held) return;
      const gap = Math.min(12, Math.max(6, (W - tokens.length*size) / (tokens.length+1)));
      t.w = size; t.h = 56;
      t.x = gap + i * (size + gap);
      t.y = baseY + Math.sin((elapsed+i)*1.7)*2;
    });
  }
  function unlocked(){
    const n = elapsed > 28 ? 5 : elapsed > 15 ? 4 : 3;
    return agents.slice(0,n);
  }
  function makeJob(i){
    const pool = unlocked();
    const count = elapsed > 18 ? 3 : 2;
    const slots = [];
    for (let s=0;s<count;s++) slots.push({need:pick(pool).id, filled:null, pulse:rnd(0,9)});
    return {name:pick(names), slots, progress:0, duration:clamp(6 - elapsed*.055 - builds*.04, 2.65, 6), running:false, doneFlash:0};
  }
  function agentById(id){ return agents.find(a => a.id === id) || agents[0]; }
  function slotRects(lane){
    const count = lane.job.slots.length;
    const maxW = Math.min(74, (lane.w - 124) / count);
    const sw = Math.max(46, maxW);
    const total = sw*count + 8*(count-1);
    const start = lane.x + lane.w - total - 16;
    const y = lane.y + lane.h - 50;
    return lane.job.slots.map((s,i)=>({x:start+i*(sw+8), y, w:sw, h:36, slot:s, lane}));
  }
  function spawnToken(force){
    if (!force && tokens.length >= 6) return;
    const pool = unlocked();
    const need = lanes.flatMap(l => l.job && !l.job.running ? l.job.slots.filter(s=>!s.filled).map(s=>s.need) : []);
    const id = need.length && Math.random() < .72 ? pick(need) : pick(pool).id;
    tokens.push({id:Math.random().toString(36).slice(2), type:id, ttl:rnd(7.5,10), x:0,y:0,w:60,h:56, born:elapsed});
    layoutTokens();
  }
  function reset(){
    state = "playing"; timeLeft = 45; elapsed = 0; score = 0; builds = 0; glitches = 0; combo = 1; spawnClock = 0; shake = 0; dragging = null;
    lanes = []; tokens = []; particles = []; fog = []; stars = [];
    layoutLanes();
    for (let i=0;i<5;i++) spawnToken(true);
    for (let i=0;i<26;i++) fog.push({x:rnd(0,W),y:rnd(80,H-120),r:rnd(24,86),v:rnd(.08,.28),a:rnd(.035,.09)});
    for (let i=0;i<70;i++) stars.push({x:rnd(0,W),y:rnd(0,H),s:rnd(.4,1.7),p:rnd(0,6.28)});
    title.classList.add("hidden"); over.classList.add("hidden");
    updateHud();
    beep("start");
  }
  function endGame(reason){
    if (state !== "playing") return;
    state = "over"; dragging = null;
    overTitle.textContent = reason === "glitch" ? "Glitched" : "Shipped";
    overKicker.textContent = reason === "glitch" ? "buffer collapsed" : "sunrise report";
    overText.textContent = builds + " builds completed. Score " + score + ".";
    over.classList.remove("hidden");
    beep(reason === "glitch" ? "bad" : "done");
  }
  function updateHud(){
    if (scoreEl) scoreEl.textContent = String(score);
    if (clockEl) clockEl.textContent = String(Math.max(0, Math.ceil(timeLeft)));
    if (glitchEl) glitchEl.textContent = glitches + "/6";
  }
  function getPoint(e){
    const r = canvas.getBoundingClientRect();
    return {x:(e.clientX || 0) - r.left, y:(e.clientY || 0) - r.top};
  }
  function onDown(e){
    if (e.cancelable) e.preventDefault();
    if (state !== "playing") return;
    const p = getPoint(e);
    for (let i=tokens.length-1;i>=0;i--){
      const t = tokens[i];
      if (p.x>=t.x && p.x<=t.x+t.w && p.y>=t.y && p.y<=t.y+t.h){
        tokens.splice(i,1);
        dragging = Object.assign(t,{held:true,dx:p.x-t.x,dy:p.y-t.y});
        try { canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); } catch(err) {}
        beep("grab");
        return;
      }
    }
  }
  function onMove(e){
    if (e.cancelable) e.preventDefault();
    if (!dragging) return;
    const p = getPoint(e);
    dragging.x = p.x - dragging.dx;
    dragging.y = p.y - dragging.dy;
  }
  function onUp(e){
    if (e.cancelable) e.preventDefault();
    if (!dragging) return;
    dropAt(getPoint(e));
  }
  function dropAt(p){
    let landed = null;
    lanes.forEach(l => slotRects(l).forEach(r => {
      if (!r.slot.filled && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h) landed = r;
    }));
    if (landed && landed.slot.need === dragging.type) {
      landed.slot.filled = {type:dragging.type};
      score += 5 * combo;
      burst(p.x,p.y,agentById(dragging.type).color,16);
      beep("ok");
      if (landed.lane.job.slots.every(s=>s.filled)) landed.lane.job.running = true;
    } else {
      const inLane = lanes.some(l => p.x>=l.x && p.x<=l.x+l.w && p.y>=l.y && p.y<=l.y+l.h);
      if (inLane) miss(p.x,p.y);
      else tokens.push(Object.assign(dragging,{held:false,ttl:Math.max(3,dragging.ttl)}));
    }
    dragging = null;
    while (tokens.length < 4) spawnToken(true);
    layoutTokens();
    updateHud();
  }
  function returnDrag(){
    if (!dragging) return;
    tokens.push(Object.assign(dragging,{held:false,ttl:Math.max(3,dragging.ttl)}));
    dragging = null;
    layoutTokens();
  }
  function miss(x,y){
    glitches++; combo = 1; shake = 12;
    burst(x,y,"#ff6b4a",18);
    try { navigator.vibrate && navigator.vibrate(35); } catch(e){}
    beep("bad");
    if (glitches >= 6) endGame("glitch");
  }
  function burst(x,y,color,n){
    for (let i=0;i<n;i++) particles.push({x,y,vx:rnd(-2.4,2.4),vy:rnd(-3,1.6),life:rnd(.35,.8),max:1,color,r:rnd(2,5)});
  }
  function audioCtx(){
    if (audio) return audio;
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      audio = new C();
      return audio;
    } catch(e){ return null; }
  }
  function beep(kind){
    const a = audioCtx();
    if (!a) return;
    try {
      if (a.state === "suspended") a.resume && a.resume();
      const o = a.createOscillator(), g = a.createGain();
      const now = a.currentTime;
      const hz = kind==="bad" ? 92 : kind==="done" ? 520 : kind==="ok" ? 392 : kind==="start" ? 262 : 210;
      o.type = kind==="bad" ? "sawtooth" : "triangle";
      o.frequency.setValueAtTime(hz, now);
      if (kind==="ok") o.frequency.exponentialRampToValueAtTime(hz*1.5, now+.08);
      g.gain.setValueAtTime(.0001, now);
      g.gain.exponentialRampToValueAtTime(kind==="bad"?.075:.045, now+.015);
      g.gain.exponentialRampToValueAtTime(.0001, now+.16);
      o.connect(g); g.connect(a.destination); o.start(now); o.stop(now+.18);
    } catch(e){}
  }
  function update(dt){
    if (state === "playing"){
      elapsed += dt; timeLeft -= dt; spawnClock -= dt;
      if (timeLeft <= 0) endGame("time");
      const targetSpawn = clamp(1.2 - elapsed*.012, .58, 1.2);
      if (spawnClock <= 0){ spawnToken(false); spawnClock = targetSpawn; }
      tokens = tokens.filter(t => {
        t.ttl -= dt;
        if (t.ttl <= 0){ burst(t.x+t.w/2,t.y+t.h/2,"#8aa99a",5); return false; }
        return true;
      });
      while (tokens.length < 3) spawnToken(true);
      lanes.forEach((l,i) => {
        const j = l.job;
        if (j.running){
          j.progress += dt / j.duration;
          if (j.progress >= 1){
            builds++; combo = Math.min(5, combo+1);
            score += 35 * combo;
            j.doneFlash = .28;
            burst(l.x+l.w*.2,l.y+l.h*.5,"#72f2a1",28);
            l.job = makeJob(i);
            beep("done");
          }
        }
        if (l.job.doneFlash) l.job.doneFlash -= dt;
      });
      layoutTokens();
      updateHud();
    }
    particles.forEach(p => { p.life -= dt; p.x += p.vx*60*dt; p.y += p.vy*60*dt; p.vy += 4*dt; });
    particles = particles.filter(p => p.life > 0);
    fog.forEach(f => { f.x += f.v*60*dt; if (f.x-f.r>W) f.x = -f.r; });
    shake = Math.max(0, shake - 42*dt);
  }
  function drawRoundRect(x,y,w,h,r){
    r = Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function fillRound(x,y,w,h,r,fill,stroke){
    drawRoundRect(x,y,w,h,r); ctx.fillStyle = fill; ctx.fill(); if (stroke){ctx.strokeStyle=stroke;ctx.stroke();}
  }
  function draw(){
    const light = lightMode();
    const bg = light ? "#edf4ec" : "#07110d";
    ctx.save();
    const sx = shake ? rnd(-shake,shake) : 0, sy = shake ? rnd(-shake,shake) : 0;
    ctx.translate(sx,sy);
    ctx.fillStyle = bg; ctx.fillRect(-20,-20,W+40,H+40);
    const g = ctx.createRadialGradient(W*.5,H*.08,10,W*.5,H*.1,Math.max(W,H)*.85);
    g.addColorStop(0, light ? "rgba(255,184,74,.28)" : "rgba(28,255,124,.18)");
    g.addColorStop(.52, light ? "rgba(115,214,146,.13)" : "rgba(18,120,66,.14)");
    g.addColorStop(1, bg);
    ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);
    drawStars(light);
    drawLanes(light);
    drawTray(light);
    tokens.forEach(drawToken);
    if (dragging) drawToken(dragging, true);
    drawFog(light);
    drawParticles();
    drawScanlines(light);
    if (state === "title") drawAttract(light);
    ctx.restore();
  }
  function drawStars(light){
    ctx.save(); ctx.globalAlpha = light ? .16 : .38; ctx.fillStyle = light ? "#476558" : "#b6ffd0";
    stars.forEach(s => { ctx.globalAlpha = (light?.08:.22) + Math.sin(elapsed+s.p)*.08; ctx.fillRect(s.x,s.y,s.s,s.s); });
    ctx.restore();
  }
  function drawLanes(light){
    lanes.forEach((l,i) => {
      const j = l.job, run = j.running;
      fillRound(l.x,l.y,l.w,l.h,24, light ? "rgba(255,255,255,.62)" : "rgba(2,14,8,.62)", light ? "rgba(15,95,60,.18)" : "rgba(133,255,174,.2)");
      ctx.fillStyle = light ? "#102019" : "#eef9ef";
      ctx.font = "700 13px ui-monospace,Menlo,monospace";
      ctx.fillText("LANE 0" + (i+1), l.x+18, l.y+28);
      ctx.fillStyle = light ? "#587064" : "#9bb3a6";
      ctx.font = "12px ui-monospace,Menlo,monospace";
      ctx.fillText(j.name, l.x+18, l.y+48);
      const barX = l.x+18, barY = l.y+l.h-24, barW = Math.min(170,l.w*.43);
      fillRound(barX,barY,barW,7,4, light ? "rgba(30,80,55,.12)" : "rgba(120,255,170,.12)");
      if (run){
        fillRound(barX,barY,barW*j.progress,7,4,"#72f2a1");
        ctx.fillStyle = light ? "#178f52" : "#72f2a1";
        ctx.fillText("RUNNING", barX, barY-8);
      } else {
        ctx.fillStyle = light ? "#7a6550" : "#ffca75";
        ctx.fillText("NEEDS", barX, barY-8);
      }
      slotRects(l).forEach(r => drawSlot(r, light));
    });
  }
  function drawSlot(r, light){
    const a = agentById(r.slot.need);
    const filled = r.slot.filled;
    fillRound(r.x,r.y,r.w,r.h,12, filled ? a.color : (light ? "rgba(16,32,25,.06)" : "rgba(255,255,255,.045)"), filled ? "rgba(0,0,0,.18)" : a.color);
    ctx.fillStyle = filled ? "#07110d" : a.color;
    ctx.font = "800 12px ui-monospace,Menlo,monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(a.label, r.x+r.w/2, r.y+r.h/2+1);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }
  function drawTray(light){
    const y = H - Math.max(108,H*.17);
    const grad = ctx.createLinearGradient(0,y,0,H);
    grad.addColorStop(0, light ? "rgba(237,244,236,0)" : "rgba(7,17,13,0)");
    grad.addColorStop(.35, light ? "rgba(234,244,236,.88)" : "rgba(3,12,8,.9)");
    grad.addColorStop(1, light ? "#eaf4ec" : "#030905");
    ctx.fillStyle = grad; ctx.fillRect(0,y,W,H-y);
    ctx.strokeStyle = light ? "rgba(10,92,55,.2)" : "rgba(115,242,161,.22)";
    ctx.beginPath(); ctx.moveTo(18,y+16); ctx.lineTo(W-18,y+16); ctx.stroke();
    ctx.fillStyle = light ? "#52675d" : "#9bb3a6";
    ctx.font = "700 10px ui-monospace,Menlo,monospace";
    ctx.fillText("SHORTCUT TRAY", 18, y+38);
  }
  function drawToken(t, lifted){
    const a = agentById(t.type);
    const x=t.x, y=t.y, w=t.w, h=t.h;
    ctx.save();
    ctx.globalAlpha = clamp(t.ttl/1.5, .25, 1);
    ctx.shadowColor = a.color; ctx.shadowBlur = lifted ? 26 : 10;
    fillRound(x,y,w,h,18,a.color,"rgba(255,255,255,.32)");
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#06110b";
    ctx.font = "900 17px ui-monospace,Menlo,monospace";
    ctx.textAlign = "center"; ctx.fillText(a.label, x+w/2, y+31);
    ctx.font = "700 8px ui-monospace,Menlo,monospace";
    ctx.globalAlpha *= .68;
    ctx.fillText("AGENT", x+w/2, y+45);
    ctx.textAlign = "left";
    ctx.restore();
  }
  function drawFog(light){
    ctx.save(); ctx.globalCompositeOperation = light ? "multiply" : "screen";
    fog.forEach(f => {
      ctx.globalAlpha = f.a;
      const g = ctx.createRadialGradient(f.x,f.y,2,f.x,f.y,f.r);
      g.addColorStop(0, light ? "rgba(96,120,108,.42)" : "rgba(126,202,168,.38)");
      g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }
  function drawParticles(){
    particles.forEach(p => {
      ctx.globalAlpha = clamp(p.life/.7,0,1); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  function drawScanlines(light){
    ctx.save(); ctx.globalAlpha = light ? .05 : .08; ctx.fillStyle = light ? "#0f3d28" : "#a8ffc4";
    for (let y=0;y<H;y+=4) ctx.fillRect(0,y,W,1);
    ctx.restore();
  }
  function drawAttract(light){
    ctx.save(); ctx.globalAlpha = .28; ctx.strokeStyle = light ? "#178f52" : "#72f2a1"; ctx.lineWidth = 1;
    for(let i=0;i<5;i++){ const y = H*.58 + Math.sin(elapsed*1.8+i)*18 + i*13; ctx.beginPath(); ctx.moveTo(W*.18,y); ctx.bezierCurveTo(W*.35,y-28,W*.62,y+32,W*.82,y-8); ctx.stroke(); }
    ctx.restore();
  }
  function frame(t){
    const now = (t || 0) / 1000;
    const dt = clamp(now - last || 0, 0, .033);
    last = now;
    update(dt); draw();
    window.requestAnimationFrame(frame);
  }
  startBtn.addEventListener("click", reset);
  restartBtn.addEventListener("click", reset);
  canvas.addEventListener("pointerdown", onDown, {passive:false});
  window.addEventListener("pointermove", onMove, {passive:false});
  window.addEventListener("pointerup", onUp, {passive:false});
  window.addEventListener("pointercancel", onUp, {passive:false});
  window.addEventListener("resize", resize);
  window.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && state !== "playing") { e.preventDefault(); reset(); }
    if (state !== "playing") return;
    if (!dragging && /^[1-6]$/.test(e.key)){
      const idx = Number(e.key) - 1;
      if (tokens[idx]){
        e.preventDefault();
        const t = tokens.splice(idx,1)[0];
        dragging = Object.assign(t,{held:true,dx:t.w/2,dy:t.h/2,x:W/2-t.w/2,y:H*.55-t.h/2});
        beep("grab");
      }
      return;
    }
    if (!dragging) return;
    const step = e.shiftKey ? 28 : 14;
    if (e.key === "Escape"){ e.preventDefault(); returnDrag(); return; }
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); dropAt({x:dragging.x+dragging.w/2,y:dragging.y+dragging.h/2}); return; }
    if (e.key === "ArrowLeft"){ e.preventDefault(); dragging.x -= step; }
    if (e.key === "ArrowRight"){ e.preventDefault(); dragging.x += step; }
    if (e.key === "ArrowUp"){ e.preventDefault(); dragging.y -= step; }
    if (e.key === "ArrowDown"){ e.preventDefault(); dragging.y += step; }
  });
  resize();
  for (let i=0;i<3;i++) lanes[i] && (lanes[i].job = makeJob(i));
  for (let i=0;i<4;i++) spawnToken(true);
  updateHud();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
