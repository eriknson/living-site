<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deserialization Ghosts</title>
  <style>
    :root {
      --bg: #0a0304;
      --fg: #ff2050;
      --fg-dim: #501020;
      --text: #ff2050;
      --font: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f0f1;
        --fg: #d01030;
        --fg-dim: #e0b0b8;
        --text: #d01030;
      }
    }
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100dvw; height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .screen {
      text-align: center;
      background: var(--bg);
      padding: 2rem;
      border: 1px solid var(--fg);
      box-shadow: 0 0 20px var(--fg-dim);
      pointer-events: none;
      max-width: 90%;
    }
    .hidden { display: none !important; }
    h1 { margin: 0 0 1rem 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
    p { margin: 0 0 1.5rem 0; font-size: 0.9rem; line-height: 1.4; color: var(--text); }
    .muted { color: var(--fg-dim); }
    button {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--fg);
      padding: 1rem 2rem;
      font-family: var(--font);
      font-size: 1.2rem;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      pointer-events: auto;
      outline: none;
    }
    button:active {
      background: var(--fg);
      color: var(--bg);
    }
    #hud {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: bold;
      pointer-events: none;
      z-index: 5;
      text-shadow: 0 0 5px var(--bg);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-layer">
    <div id="hud" class="hidden">
      <div>TIME: <span id="time-left">30.0</span></div>
      <div>DEFUSED: <span id="score">0</span></div>
    </div>
    <div id="start-screen" class="screen">
      <h1>DESERIALIZATION<br>GHOSTS</h1>
      <p>Sever the ruby execution chains.</p>
      <p>Swipe to slash the true path before execution completes.<br><span class="muted">Avoid dormant decoy branches ending in NULL.</span></p>
      <button data-smoke="start">INITIALIZE</button>
    </div>
    <div id="game-over-screen" class="screen hidden">
      <h1>LOOP COMPLETED</h1>
      <p>Chains Defused: <span id="final-score">0</span></p>
      <button data-smoke="restart">REBOOT</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const btnStart = document.querySelector('[data-smoke="start"]');
    const btnRestart = document.querySelector('[data-smoke="restart"]');
    const scoreEl = document.getElementById('score');
    const timeLeftEl = document.getElementById('time-left');
    const finalScoreEl = document.getElementById('final-score');

    let gameState = 'START';
    let chains = [];
    let particles = [];
    let trail = [];
    let lastTime = null;
    let timeLeft = 30;
    let score = 0;
    let timeElapsed = 0;
    let spawnTimer = 0;
    let globalGlitch = 0;
    let hitPause = 0;
    let width = window.innerWidth;
    let height = window.innerHeight;
    let isPointerDown = false;

    // Theme & Colors
    let colors = {};
    function updateColors() {
      const rootStyle = getComputedStyle(document.documentElement);
      colors = {
        bg: rootStyle.getPropertyValue('--bg').trim(),
        fg: rootStyle.getPropertyValue('--fg').trim(),
        fgDim: rootStyle.getPropertyValue('--fg-dim').trim()
      };
    }
    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    if (mediaQuery.addEventListener) {
      mediaQuery.addEventListener('change', updateColors);
    } else {
      mediaQuery.addListener(updateColors);
    }
    updateColors();

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Audio Fallback
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioContext ? new AudioContext() : null;

    function playTone(freq, type, duration, vol=0.1) {
      if (!audioCtx || audioCtx.state === 'suspended') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function sfxDefuse() { playTone(880, 'square', 0.1, 0.05); setTimeout(() => playTone(1760, 'square', 0.2, 0.05), 50); }
    function sfxPenalty() { playTone(150, 'sawtooth', 0.3, 0.1); setTimeout(() => playTone(100, 'sawtooth', 0.4, 0.1), 100); }

    // Input Handling
    function getPointerPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function handlePointerDown(e) {
      if (gameState !== 'PLAY') return;
      isPointerDown = true;
      trail = [];
      const pos = getPointerPos(e);
      trail.push({ x: pos.x, y: pos.y, age: 0 });
    }

    function handlePointerMove(e) {
      if (gameState !== 'PLAY' || !isPointerDown) return;
      const pos = getPointerPos(e);
      trail.push({ x: pos.x, y: pos.y, age: 0 });
    }

    function handlePointerUp() { isPointerDown = false; }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', (e) => { e.preventDefault(); handlePointerMove(e); });
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e); }, {passive: false});
    window.addEventListener('touchend', handlePointerUp);
    window.addEventListener('touchcancel', handlePointerUp);

    // Math
    function lineIntersect(p1, p2, p3, p4) {
      const denom = (p4.y - p3.y)*(p2.x - p1.x) - (p4.x - p3.x)*(p2.y - p1.y);
      if (denom === 0) return false;
      const ua = ((p4.x - p3.x)*(p1.y - p3.y) - (p4.y - p3.y)*(p1.x - p3.x)) / denom;
      const ub = ((p2.x - p1.x)*(p1.y - p3.y) - (p2.y - p1.y)*(p1.x - p3.x)) / denom;
      if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
        return { x: p1.x + ua * (p2.x - p1.x), y: p1.y + ua * (p2.y - p1.y) };
      }
      return false;
    }

    // Game Logic
    function createChain(difficulty) {
      const padding = 60;
      const isHorizontal = Math.random() > 0.5;
      let startX, startY, endX, endY;

      if (isHorizontal) {
        startX = padding; endX = width - padding;
        if (Math.random() > 0.5) [startX, endX] = [endX, startX];
        startY = padding + Math.random() * (height - 2*padding);
        endY = padding + Math.random() * (height - 2*padding);
      } else {
        startY = padding; endY = height - padding;
        if (Math.random() > 0.5) [startY, endY] = [endY, startY];
        startX = padding + Math.random() * (width - 2*padding);
        endX = padding + Math.random() * (width - 2*padding);
      }

      const nodes = [];
      const edges = [];
      const numTrueNodes = Math.floor(3 + difficulty * 3);
      
      for (let i = 0; i < numTrueNodes; i++) {
        const t = i / (numTrueNodes - 1);
        let nx = startX + (endX - startX) * t;
        let ny = startY + (endY - startY) * t;
        if (i > 0 && i < numTrueNodes - 1) {
          nx += (Math.random() - 0.5) * 120;
          ny += (Math.random() - 0.5) * 120;
        }
        nx = Math.max(padding, Math.min(width - padding, nx));
        ny = Math.max(padding, Math.min(height - padding, ny));
        
        nodes.push({ x: nx, y: ny, type: i === 0 ? 'RECV' : (i === numTrueNodes - 1 ? 'EXEC' : 'TRUE') });
        if (i > 0) edges.push({ n1: nodes[i-1], n2: nodes[i], isTrue: true });
      }

      const numDecoys = Math.floor(1 + difficulty * 4);
      for (let i = 0; i < numDecoys; i++) {
        const branchIdx = Math.floor(Math.random() * (numTrueNodes - 1));
        let currParent = nodes[branchIdx];
        const branchLength = Math.random() > 0.5 ? 1 : 2;
        let angle = Math.random() * Math.PI * 2;
        
        for (let j = 0; j < branchLength; j++) {
          angle += (Math.random() - 0.5) * 1.5;
          const dist = 60 + Math.random() * 50;
          let nx = currParent.x + Math.cos(angle) * dist;
          let ny = currParent.y + Math.sin(angle) * dist;
          nx = Math.max(padding, Math.min(width - padding, nx));
          ny = Math.max(padding, Math.min(height - padding, ny));
          
          const decoyNode = { x: nx, y: ny, type: j === branchLength - 1 ? 'NULL' : 'DECOY' };
          nodes.push(decoyNode);
          edges.push({ n1: currParent, n2: decoyNode, isTrue: false });
          currParent = decoyNode;
        }
      }

      return {
        nodes, edges,
        payload: { edgeIdx: 0, progress: 0, speed: 100 + difficulty * 200 }
      };
    }

    function spawnParticles(x, y, count, color) {
      for(let i=0; i<count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 400,
          vy: (Math.random() - 0.5) * 400,
          life: 1.0,
          color
        });
      }
    }

    function triggerPenalty(x, y) {
      timeLeft = Math.max(0, timeLeft - 3);
      globalGlitch = 1.0;
      hitPause = 0.1;
      spawnParticles(x, y, 20, colors.fg);
      sfxPenalty();
      try { if (navigator.vibrate) navigator.vibrate(200); } catch(e){}
    }

    function defuseChain(chain) {
      score++;
      scoreEl.innerText = score;
      hitPause = 0.05;
      chain.nodes.forEach(n => spawnParticles(n.x, n.y, 5, colors.fgDim));
      sfxDefuse();
      try { if (navigator.vibrate) navigator.vibrate(50); } catch(e){}
    }

    function startGame() {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(()=>{});
      }
      gameState = 'PLAY';
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      hud.classList.remove('hidden');
      
      chains = [];
      particles = [];
      trail = [];
      timeLeft = 30;
      score = 0;
      timeElapsed = 0;
      spawnTimer = 0;
      globalGlitch = 0;
      hitPause = 0;
      scoreEl.innerText = score;
      timeLeftEl.innerText = timeLeft.toFixed(1);
    }

    function endGame() {
      gameState = 'OVER';
      hud.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');
      finalScoreEl.innerText = score;
    }

    btnStart.addEventListener('click', startGame);
    btnRestart.addEventListener('click', startGame);

    function update(dt) {
      if (hitPause > 0) {
        hitPause -= dt;
        return;
      }

      timeElapsed += dt;
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        endGame();
      }
      timeLeftEl.innerText = timeLeft.toFixed(1);

      if (globalGlitch > 0) globalGlitch -= dt * 2;

      trail.forEach(p => p.age += dt);
      trail = trail.filter(p => p.age < 0.15);

      for (let i = 0; i < trail.length - 1; i++) {
        const p1 = trail[i];
        const p2 = trail[i+1];
        
        for (let c = chains.length - 1; c >= 0; c--) {
          const chain = chains[c];
          const trueEdges = chain.edges.filter(e => e.isTrue);
          let hitTrue = false;
          let hitDecoys = [];
          
          for (let e = chain.edges.length - 1; e >= 0; e--) {
            const edge = chain.edges[e];
            const int = lineIntersect(p1, p2, edge.n1, edge.n2);
            if (int) {
              if (edge.isTrue) {
                const trueIdx = trueEdges.indexOf(edge);
                if (trueIdx >= chain.payload.edgeIdx) {
                  hitTrue = true;
                  break;
                }
              } else {
                hitDecoys.push({ edgeIdx: e, int });
              }
            }
          }
          
          if (hitTrue) {
            defuseChain(chain);
            chains.splice(c, 1);
          } else if (hitDecoys.length > 0) {
            hitDecoys.forEach(decoy => {
              triggerPenalty(decoy.int.x, decoy.int.y);
              chain.edges.splice(decoy.edgeIdx, 1);
            });
          }
        }
      }

      for (let c = chains.length - 1; c >= 0; c--) {
        const chain = chains[c];
        const trueEdges = chain.edges.filter(e => e.isTrue);
        const currentEdge = trueEdges[chain.payload.edgeIdx];
        if (currentEdge) {
          const dx = currentEdge.n2.x - currentEdge.n1.x;
          const dy = currentEdge.n2.y - currentEdge.n1.y;
          const len = Math.hypot(dx, dy);
          const progressDelta = (chain.payload.speed * dt) / len;
          chain.payload.progress += progressDelta;
          
          if (chain.payload.progress >= 1.0) {
            chain.payload.progress = 0;
            chain.payload.edgeIdx++;
            if (chain.payload.edgeIdx >= trueEdges.length) {
              triggerPenalty(currentEdge.n2.x, currentEdge.n2.y);
              chains.splice(c, 1);
            }
          }
        }
      }

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        const difficulty = Math.min(1.0, timeElapsed / 30.0);
        chains.push(createChain(difficulty));
        spawnTimer = 2.0 - difficulty * 1.0;
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, width, height);

      const time = performance.now() / 1000;
      
      // Grid
      ctx.strokeStyle = colors.fgDim;
      ctx.globalAlpha = 0.08;
      ctx.lineWidth = 1;
      const gridSize = 40;
      const offsetX = (time * 10) % gridSize;
      const offsetY = (time * 10) % gridSize;
      ctx.beginPath();
      for(let x = offsetX; x < width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
      for(let y = offsetY; y < height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
      ctx.stroke();
      ctx.globalAlpha = 1.0;

      ctx.save();
      if (globalGlitch > 0) {
        const intensity = globalGlitch * 20;
        ctx.translate((Math.random() - 0.5) * intensity, (Math.random() - 0.5) * intensity);
        ctx.fillStyle = colors.fgDim;
        for(let i=0; i<3; i++) {
          ctx.fillRect(Math.random()*width, Math.random()*height, Math.random()*200, Math.random()*5);
        }
      }

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      chains.forEach(chain => {
        ctx.lineWidth = 2;
        ctx.strokeStyle = colors.fgDim;
        ctx.beginPath();
        chain.edges.forEach(edge => {
          ctx.moveTo(edge.n1.x, edge.n1.y);
          ctx.lineTo(edge.n2.x, edge.n2.y);
        });
        ctx.stroke();

        const trueEdges = chain.edges.filter(e => e.isTrue);
        const currEdge = trueEdges[chain.payload.edgeIdx];
        if (currEdge) {
          const p = chain.payload.progress;
          const px = currEdge.n1.x + (currEdge.n2.x - currEdge.n1.x) * p;
          const py = currEdge.n1.y + (currEdge.n2.y - currEdge.n1.y) * p;
          
          ctx.globalAlpha = 0.3;
          ctx.fillStyle = colors.fg;
          ctx.beginPath();
          ctx.arc(px, py, 15 + Math.sin(time * 20) * 3, 0, Math.PI*2);
          ctx.fill();
          ctx.globalAlpha = 1.0;
          
          ctx.fillRect(px - 5, py - 5, 10, 10);
        }

        chain.nodes.forEach(n => {
          if (n.type === 'RECV' || n.type === 'EXEC') {
            ctx.fillStyle = colors.bg;
            ctx.strokeStyle = colors.fg;
            ctx.lineWidth = 1;
            ctx.fillRect(n.x - 24, n.y - 12, 48, 24);
            ctx.strokeRect(n.x - 24, n.y - 12, 48, 24);
            ctx.fillStyle = colors.fg;
            ctx.font = 'bold 10px var(--font)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(n.type, n.x, n.y);
          } else if (n.type === 'NULL') {
            ctx.fillStyle = colors.fgDim;
            ctx.font = 'bold 10px var(--font)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('[NULL]', n.x, n.y);
          } else {
            ctx.fillStyle = colors.bg;
            ctx.strokeStyle = colors.fgDim;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(n.x, n.y - 4);
            ctx.lineTo(n.x + 4, n.y);
            ctx.lineTo(n.x, n.y + 4);
            ctx.lineTo(n.x - 4, n.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        });
      });

      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      });
      ctx.globalAlpha = 1.0;

      if (trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for(let i=1; i<trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
        ctx.strokeStyle = colors.fg;
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      ctx.restore();
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;
      
      if (gameState === 'PLAY') {
        update(dt);
      } else {
        if (globalGlitch > 0) globalGlitch -= dt * 2;
      }
      updateParticles(dt);
      draw();
      
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
