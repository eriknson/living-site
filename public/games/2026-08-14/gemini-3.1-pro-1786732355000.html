<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Agent Deploy</title>
    <style>
        :root {
            --bg-color: #0a192f;
            --text-color: #ffffff;
            --glass-bg: rgba(10, 25, 47, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --btn-bg: #00ffff;
            --btn-text: #000000;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #e6f0fa;
                --text-color: #000000;
                --glass-bg: rgba(255, 255, 255, 0.85);
                --glass-border: rgba(0, 0, 0, 0.1);
                --btn-bg: #0055ff;
                --btn-text: #ffffff;
            }
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            color: var(--text-color);
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .screen {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            border: 1px solid var(--glass-border);
            max-width: 80%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .screen h1 {
            margin-top: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }
        .screen p {
            font-size: 0.9rem;
            line-height: 1.4;
            opacity: 0.8;
        }
        button {
            pointer-events: auto;
            font-family: inherit;
            font-size: 1.1rem;
            padding: 1rem 2rem;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            text-transform: uppercase;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        @media (prefers-color-scheme: light) {
            #hud {
                text-shadow: 0 2px 4px rgba(255,255,255,0.8);
            }
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="hud" style="display: none;">
        <div id="score-display">DEPLOYED: 0</div>
        <div id="time-display">30.0</div>
    </div>
    <div id="ui-layer">
        <div id="menu-screen" class="screen">
            <h1>AGENT DEPLOY</h1>
            <p>Draw a continuous path from the phone to the terminal.</p>
            <p>Pass through all shortcut gates. Don't hit the walls.</p>
            <button data-smoke="start" id="start-btn">DEPLOY</button>
        </div>
        <div id="gameover-screen" class="screen" style="display: none;">
            <h1>CONNECTION LOST</h1>
            <p>Successful Deployments: <span id="final-score">0</span></p>
            <button data-smoke="restart" id="restart-btn">REBOOT</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        let state = 'MENU';
        let score = 0;
        let timeLeft = 30;
        let level = 1;
        let path = [];
        let isDrawing = false;
        let currentTargetIndex = 0;
        let shakeAmount = 0;

        let startNode = { x: 0, y: 0, radius: 30 };
        let endNode = { x: 0, y: 0, radius: 30 };
        let gates = [];
        let decoys = [];
        let particles = [];
        let fogCircles = [];
        let isDarkMode = true;

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'start') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.5, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'collect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.5, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'success') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function playHaptic(pattern) {
            if (navigator.vibrate) {
                try { navigator.vibrate(pattern); } catch (e) {}
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            startNode.x = canvas.width / 2;
            startNode.y = canvas.height - 120;
            endNode.x = canvas.width / 2;
            endNode.y = Math.max(100, canvas.height * 0.15);
            if (fogCircles.length === 0) initFog();
        }
        window.addEventListener('resize', resize);

        function initFog() {
            fogCircles = [];
            for (let i = 0; i < 5; i++) {
                fogCircles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: 200 + Math.random() * 300,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5
                });
            }
        }

        function generateLevel(lvl) {
            gates = [];
            decoys = [];
            currentTargetIndex = 0;
            path = [];
            isDrawing = false;

            let numGates = Math.min(4, Math.floor((lvl + 1) / 2));
            let numDecoys = Math.max(0, Math.floor((lvl - 2) / 2));
            let isRotating = lvl >= 2;

            let availableHeight = startNode.y - endNode.y - 100;
            let spacing = availableHeight / (numGates + 1);

            for (let i = 0; i < numGates; i++) {
                let cy = startNode.y - spacing * (i + 1);
                let cx = canvas.width / 2 + (Math.random() * 80 - 40);
                let angle = isRotating ? (Math.random() * Math.PI/2 - Math.PI/4) : 0;
                let speed = isRotating ? (Math.random() > 0.5 ? 1 : -1) * (0.5 + lvl * 0.15) : 0;

                gates.push({
                    x: cx, y: cy,
                    width: 80, height: 80,
                    angle: angle, speed: speed,
                    collected: false
                });
            }

            for (let i = 0; i < numDecoys; i++) {
                let cy = startNode.y - spacing * (Math.random() * numGates + 0.5);
                let cx = canvas.width / 2 + (Math.random() > 0.5 ? 1 : -1) * (70 + Math.random() * 40);
                decoys.push({
                    x: cx, y: cy,
                    width: 40, height: 40,
                    angle: Math.random() * Math.PI,
                    speed: (Math.random() > 0.5 ? 1 : -1) * (1 + lvl * 0.2)
                });
            }
        }

        function rotatePoint(cx, cy, x, y, angle) {
            let cos = Math.cos(angle);
            let sin = Math.sin(angle);
            return { x: cx + x * cos - y * sin, y: cy + x * sin + y * cos };
        }

        function getGateWalls(gate) {
            let hw = gate.width / 2;
            let hh = gate.height / 2;
            return [
                { p1: rotatePoint(gate.x, gate.y, -hw, -hh, gate.angle), p2: rotatePoint(gate.x, gate.y, -hw, hh, gate.angle) },
                { p1: rotatePoint(gate.x, gate.y, hw, -hh, gate.angle), p2: rotatePoint(gate.x, gate.y, hw, hh, gate.angle) }
            ];
        }

        function getDecoyWalls(decoy) {
            let hw = decoy.width / 2;
            let hh = decoy.height / 2;
            let c1 = rotatePoint(decoy.x, decoy.y, -hw, -hh, decoy.angle);
            let c2 = rotatePoint(decoy.x, decoy.y, hw, -hh, decoy.angle);
            let c3 = rotatePoint(decoy.x, decoy.y, hw, hh, decoy.angle);
            let c4 = rotatePoint(decoy.x, decoy.y, -hw, hh, decoy.angle);
            return [
                { p1: c1, p2: c2 }, { p1: c2, p2: c3 },
                { p1: c3, p2: c4 }, { p1: c4, p2: c1 }
            ];
        }

        function lineIntersect(p1, p2, p3, p4) {
            const denom = (p4.y - p3.y)*(p2.x - p1.x) - (p4.x - p3.x)*(p2.y - p1.y);
            if (denom === 0) return false;
            const ua = ((p4.x - p3.x)*(p1.y - p3.y) - (p4.y - p3.y)*(p1.x - p3.x)) / denom;
            const ub = ((p2.x - p1.x)*(p1.y - p3.y) - (p2.y - p1.y)*(p1.x - p3.x)) / denom;
            return (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1);
        }

        function pointToSegmentDist(p, v, w) {
            let l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 4 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: 1.0, color: color
                });
            }
        }

        function breakPath() {
            isDrawing = false;
            if (path.length > 0) {
                let p = path[path.length - 1];
                spawnParticles(p.x, p.y, isDarkMode ? '#ff3333' : '#ff0000');
            }
            path = [];
            currentTargetIndex = 0;
            for (let g of gates) g.collected = false;
            playSound('fail');
            playHaptic([50, 50, 50]);
            shakeAmount = 15;
        }

        function completeLevel() {
            isDrawing = false;
            score++;
            spawnParticles(endNode.x, endNode.y, isDarkMode ? '#00ff00' : '#00aa00');
            playSound('success');
            playHaptic([100]);
            path = [];
            level++;
            timeLeft = Math.min(30, timeLeft + 2);
            generateLevel(level);
        }

        function checkCollisions() {
            if (path.length < 2) return;
            let p1 = path[path.length - 2];
            let p2 = path[path.length - 1];

            for (let gate of gates) {
                let walls = getGateWalls(gate);
                for (let wall of walls) {
                    if (lineIntersect(p1, p2, wall.p1, wall.p2)) {
                        breakPath();
                        return;
                    }
                }
            }
            for (let decoy of decoys) {
                let walls = getDecoyWalls(decoy);
                for (let wall of walls) {
                    if (lineIntersect(p1, p2, wall.p1, wall.p2)) {
                        breakPath();
                        return;
                    }
                }
            }

            if (currentTargetIndex < gates.length) {
                let targetGate = gates[currentTargetIndex];
                let dist = pointToSegmentDist({x: targetGate.x, y: targetGate.y}, p1, p2);
                if (dist < 25) {
                    targetGate.collected = true;
                    currentTargetIndex++;
                    playSound('collect');
                    playHaptic(50);
                }
            } else {
                let dist = pointToSegmentDist({x: endNode.x, y: endNode.y}, p1, p2);
                if (dist < endNode.radius) {
                    completeLevel();
                }
            }
        }

        function getPointerPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (state !== 'PLAYING') return;
            let pos = getPointerPos(e);
            let dist = Math.hypot(pos.x - startNode.x, pos.y - startNode.y);
            if (dist < 60) {
                isDrawing = true;
                path = [pos];
                playHaptic(10);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || state !== 'PLAYING') return;
            e.preventDefault();
            let pos = getPointerPos(e);
            path.push(pos);
            checkCollisions();
        });

        canvas.addEventListener('pointerup', (e) => {
            if (!isDrawing || state !== 'PLAYING') return;
            isDrawing = false;
            if (path.length > 0) {
                let p = path[path.length - 1];
                if (currentTargetIndex < gates.length || Math.hypot(p.x - endNode.x, p.y - endNode.y) > endNode.radius) {
                    breakPath();
                }
            }
        });
        canvas.addEventListener('pointercancel', () => {
            if (isDrawing) breakPath();
        });

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio();
            playSound('start');
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            state = 'PLAYING';
            score = 0;
            timeLeft = 30;
            level = 1;
            generateLevel(level);
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            playSound('start');
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            state = 'PLAYING';
            score = 0;
            timeLeft = 30;
            level = 1;
            generateLevel(level);
        });

        let lastTime = performance.now();
        function loop(time) {
            let dt = (time - lastTime) / 1000;
            lastTime = time;
            if (dt > 0.1) dt = 0.1;

            update(dt);
            draw();

            requestAnimationFrame(loop);
        }

        function update(dt) {
            if (state === 'PLAYING') {
                timeLeft -= dt;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    state = 'GAMEOVER';
                    document.getElementById('gameover-screen').style.display = 'block';
                    document.getElementById('hud').style.display = 'none';
                    document.getElementById('final-score').innerText = score;
                    isDrawing = false;
                    playSound('fail');
                }

                for (let g of gates) g.angle += g.speed * dt;
                for (let d of decoys) d.angle += d.speed * dt;
            }
        }

        function drawFog() {
            ctx.fillStyle = isDarkMode ? '#0a192f' : '#e6f0fa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let f of fogCircles) {
                f.x += f.vx; f.y += f.vy;
                if (f.x < -f.r) f.x = canvas.width + f.r;
                if (f.x > canvas.width + f.r) f.x = -f.r;
                if (f.y < -f.r) f.y = canvas.height + f.r;
                if (f.y > canvas.height + f.r) f.y = -f.r;

                let grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
                if (isDarkMode) {
                    grad.addColorStop(0, 'rgba(23, 42, 69, 0.6)');
                    grad.addColorStop(1, 'rgba(23, 42, 69, 0)');
                } else {
                    grad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                }
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawNodes() {
            ctx.save();
            ctx.translate(startNode.x, startNode.y);
            ctx.fillStyle = isDarkMode ? '#112240' : '#ffffff';
            ctx.strokeStyle = isDarkMode ? '#00ffff' : '#0055ff';
            ctx.lineWidth = 2;
            
            // Fallback for older browsers without roundRect
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(-25, -40, 50, 80, 10);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.fillRect(-25, -40, 50, 80);
                ctx.strokeRect(-25, -40, 50, 80);
            }
            
            ctx.fillStyle = isDarkMode ? '#0a192f' : '#e6f0fa';
            ctx.fillRect(-20, -30, 40, 60);
            if (!isDrawing && state === 'PLAYING') {
                let t = Date.now() / 200;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 15 + Math.sin(t) * 5;
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.translate(endNode.x, endNode.y);
            ctx.fillStyle = isDarkMode ? '#112240' : '#ffffff';
            ctx.strokeStyle = (currentTargetIndex >= gates.length) ? (isDarkMode ? '#00ff00' : '#00aa00') : (isDarkMode ? '#444' : '#aaa');
            ctx.lineWidth = 2;
            
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(-35, -25, 70, 50, 6);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.fillRect(-35, -25, 70, 50);
                ctx.strokeRect(-35, -25, 70, 50);
            }
            
            ctx.fillStyle = ctx.strokeStyle;
            ctx.font = '14px monospace';
            ctx.fillText('>_', -25, 5);
            if (currentTargetIndex >= gates.length && state === 'PLAYING') {
                let t = Date.now() / 200;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 15 + Math.sin(t) * 5;
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawGate(gate, isTarget) {
            ctx.save();
            ctx.translate(gate.x, gate.y);
            ctx.rotate(gate.angle);

            let hw = gate.width / 2;
            let hh = gate.height / 2;

            ctx.fillStyle = isDarkMode ? 'rgba(255, 255, 255, 0.05)' : 'rgba(255, 255, 255, 0.5)';
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(-hw, -hh, gate.width, gate.height, 16);
                ctx.fill();
            } else {
                ctx.fillRect(-hw, -hh, gate.width, gate.height);
            }

            ctx.strokeStyle = isDarkMode ? 'rgba(255, 255, 255, 0.9)' : 'rgba(0, 0, 0, 0.6)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-hw, -hh); ctx.lineTo(-hw, hh); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(hw, -hh); ctx.lineTo(hw, hh); ctx.stroke();

            ctx.strokeStyle = isDarkMode ? 'rgba(255, 255, 255, 0.2)' : 'rgba(0, 0, 0, 0.1)';
            ctx.setLineDash([6, 6]);
            ctx.beginPath(); ctx.moveTo(-hw, -hh); ctx.lineTo(hw, -hh); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-hw, hh); ctx.lineTo(hw, hh); ctx.stroke();
            ctx.setLineDash([]);

            if (!gate.collected) {
                ctx.fillStyle = isTarget ? (isDarkMode ? '#00ffff' : '#0055ff') : (isDarkMode ? 'rgba(0, 255, 255, 0.3)' : 'rgba(0, 85, 255, 0.3)');
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                if (isTarget) {
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
            ctx.restore();
        }

        function drawDecoy(decoy) {
            ctx.save();
            ctx.translate(decoy.x, decoy.y);
            ctx.rotate(decoy.angle);

            let hw = decoy.width / 2;
            let hh = decoy.height / 2;

            ctx.fillStyle = isDarkMode ? 'rgba(255, 50, 50, 0.15)' : 'rgba(255, 0, 0, 0.15)';
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(-hw, -hh, decoy.width, decoy.height, 8);
                ctx.fill();
            } else {
                ctx.fillRect(-hw, -hh, decoy.width, decoy.height);
            }

            ctx.strokeStyle = isDarkMode ? 'rgba(255, 50, 50, 0.8)' : 'rgba(255, 0, 0, 0.6)';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-10, -10); ctx.lineTo(10, 10);
            ctx.moveTo(10, -10); ctx.lineTo(-10, 10);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        function draw() {
            isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            drawFog();

            if (shakeAmount > 0) {
                ctx.save();
                ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
                shakeAmount *= 0.9;
                if (shakeAmount < 0.5) shakeAmount = 0;
            }

            drawNodes();

            for (let i = 0; i < gates.length; i++) drawGate(gates[i], i === currentTargetIndex);
            for (let d of decoys) drawDecoy(d);

            if (path.length > 0) {
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                ctx.strokeStyle = isDarkMode ? '#00ffff' : '#0055ff';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 12;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.032;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            if (shakeAmount > 0) ctx.restore();

            if (state === 'PLAYING') {
                document.getElementById('score-display').innerText = `DEPLOYED: ${score}`;
                document.getElementById('time-display').innerText = timeLeft.toFixed(1);
            }
        }

        resize();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
