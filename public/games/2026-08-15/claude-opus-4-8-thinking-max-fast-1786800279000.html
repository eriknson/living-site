<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe7d6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<title>Ship by Sunrise</title>
<style>
  :root{
    --bg:#efe7d6; --fg:#23201b; --muted:#6f675a;
    --accent:#0e7c86; --accent2:#c97f1a; --ship:#2f7d33;
    --hazard:#d1492f; --gate:#245f9e; --card:#fbf7ee; --line:#d8cdb8;
    --shadow:rgba(60,50,30,0.22);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181d; --fg:#f2ede2; --muted:#a49b8b;
      --accent:#2fd4c9; --accent2:#f7b955; --ship:#3ad07a;
      --hazard:#ff6f57; --gate:#6fb3ff; --card:#20242b; --line:#2c313a;
      --shadow:rgba(0,0,0,0.45);
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--fg);
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    position:fixed; inset:0;
  }
  #game{
    position:fixed; inset:0; display:block;
    width:100dvw; height:100dvh;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .hud{
    position:fixed; top:0; left:0; right:0;
    padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px);
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:12px; pointer-events:none; z-index:5;
  }
  .stat{ display:flex; flex-direction:column; gap:3px; }
  .stat .label{ font-size:10px; letter-spacing:2px; color:var(--muted); font-weight:700; }
  .stat .val{ font-size:22px; font-weight:800; letter-spacing:1px; font-variant-numeric:tabular-nums; }
  .center{ align-items:center; flex:1; max-width:220px; }
  .center .val{ font-size:16px; }
  .bar{ width:150px; max-width:44vw; height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:2px; }
  .bar i{ display:block; height:100%; width:100%; background:var(--accent); border-radius:99px; transition:width .18s linear, background .4s linear; }
  #combo{
    display:none; margin-top:4px; font-size:13px; font-weight:800; letter-spacing:1px;
    color:var(--accent); align-self:flex-start;
  }
  .right{ align-items:flex-end; }
  .mute{
    pointer-events:auto; width:44px; height:44px; min-width:44px; border-radius:14px;
    border:1.5px solid var(--line); background:var(--card); color:var(--fg);
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-family:inherit;
  }
  .mute.off{ color:var(--muted); }
  .mute:active{ transform:scale(.94); }
  .overlay{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; z-index:10; pointer-events:none;
    transition:opacity .45s ease; opacity:1;
    padding:0 24px calc(env(safe-area-inset-bottom) + 24px);
  }
  .overlay.title-ov{ justify-content:flex-start; padding-top:min(16vh, 120px); }
  .overlay.over-ov{ justify-content:center; }
  .overlay.hide{ opacity:0; visibility:hidden; }
  .panel{ pointer-events:none; text-align:center; max-width:440px; width:100%; }
  h1{
    font-size:clamp(38px, 13vw, 74px); line-height:.92; margin:0 0 14px;
    letter-spacing:2px; font-weight:900;
  }
  h1 .accent{ color:var(--accent); }
  .sub{ color:var(--fg); opacity:.86; font-size:clamp(13px,3.6vw,15px); line-height:1.55; margin:0 auto 22px; max-width:340px; }
  .sub b{ color:var(--accent); font-weight:800; }
  .tiny{ color:var(--muted); font-size:12px; margin:16px auto 0; letter-spacing:.5px; max-width:300px; line-height:1.5; }
  .btn{
    pointer-events:auto; cursor:pointer; font-family:inherit;
    font-size:18px; font-weight:800; letter-spacing:1.5px;
    min-height:56px; padding:0 34px; border-radius:18px; border:none;
    background:var(--accent); color:#fff;
    box-shadow:0 8px 0 var(--shadow), 0 12px 22px rgba(0,0,0,.18);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  @media (prefers-color-scheme: dark){ .btn{ color:#08221f; } }
  .btn:active{ transform:translateY(5px); box-shadow:0 3px 0 var(--shadow), 0 6px 12px rgba(0,0,0,.18); }
  .btn:focus-visible{ outline:3px solid var(--accent2); outline-offset:3px; }
  .over-ov .panel{ background:var(--card); border:1.5px solid var(--line); border-radius:26px; padding:30px 26px 30px; box-shadow:0 20px 50px rgba(0,0,0,.28); }
  h2{ font-size:clamp(26px,8vw,40px); margin:8px 0 4px; letter-spacing:3px; font-weight:900; }
  .sun{ width:54px; height:54px; border-radius:50%; margin:0 auto 6px; background:var(--accent2); box-shadow:0 0 34px var(--accent2); }
  .results{ margin:14px 0 22px; }
  .results .big{ font-size:clamp(46px,15vw,68px); font-weight:900; color:var(--accent); line-height:1; font-variant-numeric:tabular-nums; }
  .results .rlabel{ font-size:11px; letter-spacing:3px; color:var(--muted); margin-top:2px; font-weight:700; }
  .results .rrow{ display:flex; justify-content:center; gap:22px; margin-top:16px; font-size:13px; color:var(--fg); opacity:.85; letter-spacing:.5px; }
  .results .rrow b{ color:var(--accent2); }
  .results .msg{ margin-top:16px; font-size:13px; color:var(--muted); line-height:1.5; letter-spacing:.3px; }
  .nokey{ display:none; }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud" id="hud">
    <div class="stat">
      <span class="label">SCORE</span>
      <span class="val" id="score">0</span>
      <span id="combo">x2</span>
    </div>
    <div class="stat center">
      <span class="label">SUNRISE IN</span>
      <span class="val" id="clock">0:42</span>
      <div class="bar"><i id="barfill"></i></div>
    </div>
    <div class="stat right">
      <button class="mute" id="mute" aria-label="Toggle sound">&#9834;</button>
    </div>
  </div>

  <div class="overlay title-ov" id="title">
    <div class="panel">
      <h1>SHIP&nbsp;BY<br><span class="accent">SUNRISE</span></h1>
      <p class="sub">Drag from your <b>phone</b>, thread every <b>CI gate</b>, and reach the spinning <b>agent</b>. One stroke &mdash; don&rsquo;t cross, don&rsquo;t lift.</p>
      <button class="btn" data-smoke="start" id="startBtn">&#9654;&nbsp; DEPLOY</button>
      <p class="tiny">Ship as many features as you can before the sun comes up.</p>
    </div>
  </div>

  <div class="overlay over-ov hide" id="over">
    <div class="panel">
      <div class="sun"></div>
      <h2>SUNRISE</h2>
      <div class="results" id="results"></div>
      <button class="btn" data-smoke="restart" id="restartBtn">&#8635;&nbsp; PLAY AGAIN</button>
    </div>
  </div>

<script>
(function(){
"use strict";

var canvas = document.getElementById('game');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;

// Graceful fallback if 2D canvas is unavailable — never throw.
if(!ctx){
  try{
    var t=document.getElementById('title');
    if(t){ var p=t.querySelector('.sub'); if(p) p.textContent='This browser cannot render the game canvas.'; }
  }catch(e){}
  return;
}

var byId = function(id){ return document.getElementById(id); };
var hudScore = byId('score'), hudClock = byId('clock'), barfill = byId('barfill');
var comboEl = byId('combo');
var titleEl = byId('title'), overEl = byId('over'), resultsEl = byId('results');
var startBtn = byId('startBtn'), restartBtn = byId('restartBtn'), muteBtn = byId('mute');

// ---------- viewport / scaling ----------
var cssW = window.innerWidth, cssH = window.innerHeight, S = Math.min(cssW, cssH), dpr = 1;
var TAU = Math.PI * 2;

var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function darkMode(){ return mq ? !!mq.matches : false; }

// ---------- color helpers ----------
function hx(h){
  h = (''+h).replace('#','');
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
}
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rgba(hex,al){ var c=hx(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')'; }
function mix(c1,c2,t){
  var a=hx(c1), b=hx(c2);
  return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';
}

var PAL = {
  light:{
    bg:'#efe7d6', ink:'#23201b', muted:'#6f675a', accent:'#0e7c86', accent2:'#c97f1a',
    ship:'#2f7d33', hazard:'#d1492f', gate:'#245f9e', card:'#fbf7ee', line:'#d8cdb8',
    tiles:['#cfe4d2','#f2d7bb','#cdddef','#efe1ad','#f0c9bd','#d7e0c2'],
    shadow:'rgba(70,55,30,0.20)', scrim:'#efe7d6', scrimA:0.32, glow:'#c97f1a'
  },
  dark:{
    bg:'#16181d', ink:'#f2ede2', muted:'#a49b8b', accent:'#2fd4c9', accent2:'#f7b955',
    ship:'#3ad07a', hazard:'#ff6f57', gate:'#6fb3ff', card:'#232830', line:'#2c313a',
    tiles:['#26362e','#3a2f26','#243040','#3a3524','#3d2b27','#2f3626'],
    shadow:'rgba(0,0,0,0.42)', scrim:'#0c0e12', scrimA:0.40, glow:'#f7b955'
  }
};
var TH = PAL.light;
function refreshTheme(){ TH = darkMode() ? PAL.dark : PAL.light; }
refreshTheme();

// ---------- geometry ----------
function segSeg(a,b,c,d){
  var s1x=b.x-a.x, s1y=b.y-a.y, s2x=d.x-c.x, s2y=d.y-c.y;
  var den = (-s2x*s1y + s1x*s2y);
  if(Math.abs(den) < 1e-9) return false;
  var s = (-s1y*(a.x-c.x) + s1x*(a.y-c.y)) / den;
  var t = ( s2x*(a.y-c.y) - s2y*(a.x-c.x)) / den;
  return s>0 && s<1 && t>0 && t<1;
}
function distSeg(px,py,ax,ay,bx,by){
  var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  var t = l2 ? ((px-ax)*dx+(py-ay)*dy)/l2 : 0;
  t = clamp(t,0,1);
  var cx=ax+t*dx, cy=ay+t*dy;
  return Math.hypot(px-cx, py-cy);
}
function chaikin(pts, it){
  for(var k=0;k<it;k++){
    var out=[pts[0]];
    for(var i=0;i<pts.length-1;i++){
      var p=pts[i], q=pts[i+1];
      out.push({x:p.x*0.75+q.x*0.25, y:p.y*0.75+q.y*0.25});
      out.push({x:p.x*0.25+q.x*0.75, y:p.y*0.25+q.y*0.75});
    }
    out.push(pts[pts.length-1]);
    pts=out;
  }
  return pts;
}
function cumLen(pts){
  var c=[0];
  for(var i=1;i<pts.length;i++) c[i]=c[i-1]+Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
  return c;
}
function alongPts(pts,cum,frac){
  var total=cum[cum.length-1]||1, target=frac*total;
  for(var i=1;i<pts.length;i++){
    if(cum[i]>=target){
      var seg=cum[i]-cum[i-1]||1, t=(target-cum[i-1])/seg;
      return {x:lerp(pts[i-1].x,pts[i].x,t), y:lerp(pts[i-1].y,pts[i].y,t)};
    }
  }
  var L=pts[pts.length-1]; return {x:L.x, y:L.y};
}
function spread(n,a,b){
  if(n<=1) return [(a+b)/2];
  var out=[]; for(var i=0;i<n;i++) out.push(a+(b-a)*i/(n-1)); return out;
}
function rnd(a,b){ return a+Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------- game state ----------
var game = { state:'title', roundLen:42, timeLeft:42, score:0, combo:1, bestCombo:1, ships:0, level:0 };
var stroke = { active:false, pts:[], passed:0, startT:0, penX:0, penY:0, ghost:[], ghostT:0 };
var phone=null, node=null, gates=[], hazards=[], decoys=[], spine=[], spineCum=[], spineTotal=1;
var bonusGate=null, bonusPending=null;
var particles=[], floats=[], shipAnim=null;
var shakeT=0, time=0, lastTick=-1;
var kbPen=null, keys={};

function distToSpine(px,py){
  var m=1e9;
  for(var i=1;i<spine.length;i++){
    var d=distSeg(px,py, spine[i-1].x,spine[i-1].y, spine[i].x,spine[i].y);
    if(d<m) m=d;
  }
  return m;
}
function spineAt(f){
  var target=f*spineTotal;
  for(var i=1;i<spine.length;i++){
    if(spineCum[i]>=target){
      var seg=spineCum[i]-spineCum[i-1]||1, t=(target-spineCum[i-1])/seg;
      return {x:lerp(spine[i-1].x,spine[i].x,t), y:lerp(spine[i-1].y,spine[i].y,t)};
    }
  }
  var L=spine[spine.length-1]; return {x:L.x, y:L.y};
}
function spineTangent(f){
  var a=spineAt(clamp(f-0.02,0,1)), b=spineAt(clamp(f+0.02,0,1));
  var dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1;
  return {x:dx/l, y:dy/l};
}

// ---------- level generation (guaranteed-solvable spine) ----------
function buildLevel(){
  var L=game.level;
  var mSide=Math.max(cssW*0.11, 42);
  var mTop=Math.max(cssH*0.17, 96);
  var mBot=Math.max(cssH*0.085, 60);

  phone = { x:cssW*0.5, y:cssH-mBot-0.02*cssH, r:0.075*S };

  var nR=0.058*S;
  node = { x:rnd(mSide+nR, cssW-mSide-nR), y:rnd(mTop+nR, cssH*0.42), r:nR,
           spin:rnd(0,TAU), spinSpd:1.1+0.16*L };

  // control points, strictly decreasing y so the spine never self-intersects
  var ctrl=[{x:phone.x,y:phone.y}];
  var midCount = 1 + (L>=3?1:0);
  for(var i=0;i<midCount;i++){
    var fy=(i+1)/(midCount+1);
    var yy=lerp(phone.y, node.y, fy) + rnd(-0.03,0.03)*cssH;
    var xx=clamp(rnd(mSide, cssW-mSide), mSide, cssW-mSide);
    ctrl.push({x:xx, y:clamp(yy, node.y+nR, phone.y-nR)});
  }
  ctrl.push({x:node.x,y:node.y});
  ctrl.sort(function(a,b){ return b.y-a.y; });
  ctrl[0]={x:phone.x,y:phone.y};
  ctrl[ctrl.length-1]={x:node.x,y:node.y};
  spine=chaikin(ctrl,3);
  spineCum=cumLen(spine); spineTotal=spineCum[spineCum.length-1]||1;

  // gates on the spine
  var gateCount=clamp(1+Math.floor(L/2), 1, 4);
  var halfGap=clamp(0.125*S - 0.006*S*L, 0.072*S, 0.14*S);
  var postR=0.02*S;
  gates=[];
  var fracs=spread(gateCount, 0.24, 0.80);
  for(var gi=0; gi<fracs.length; gi++){
    var pt=spineAt(fracs[gi]), tg=spineTangent(fracs[gi]);
    var perp={x:-tg.y, y:tg.x};
    gates.push({ x:pt.x, y:pt.y, ang:Math.atan2(perp.y,perp.x), g:halfGap, postR:postR, passed:false, req:true });
  }

  // hazards off the spine ("merge conflicts")
  hazards=[];
  var hzCount=clamp(L-1, 0, 3);
  var hzR=0.05*S;
  for(var h=0; h<hzCount; h++){
    for(var tr=0; tr<50; tr++){
      var x=rnd(mSide+hzR, cssW-mSide-hzR), y=rnd(mTop+hzR, phone.y-0.13*cssH);
      var dts=distToSpine(x,y);
      var moving=(L>=4);
      var need=hzR + (moving?0.13*S:0.075*S);
      if(dts<need) continue;
      if(Math.hypot(x-node.x,y-node.y)<node.r+hzR+0.03*S) continue;
      if(Math.hypot(x-phone.x,y-phone.y)<phone.r+hzR+0.03*S) continue;
      var bad=false;
      for(var q=0;q<hazards.length;q++){ if(Math.hypot(hazards[q].x-x,hazards[q].y-y)<hzR*2+0.02*S){ bad=true; break; } }
      if(bad) continue;
      var mv=null;
      if(moving){
        var amp=Math.min(0.055*S, dts-hzR-0.07*S);
        if(amp>0.012*S){ var ax=Math.random()<0.5; mv={ax:ax?1:0, ay:ax?0:1, amp:amp, ph:rnd(0,TAU), spd:rnd(0.6,1.05)}; }
      }
      hazards.push({x:x,y:y,bx:x,by:y,r:hzR,mv:mv});
      break;
    }
  }

  // decoy / fork agents (late game)
  decoys=[];
  var dcCount = L>=8?2:(L>=5?1:0);
  var dcR=0.055*S;
  for(var d=0; d<dcCount; d++){
    for(var tr2=0; tr2<50; tr2++){
      var dx2=rnd(mSide+dcR, cssW-mSide-dcR), dy2=rnd(mTop+dcR, cssH*0.5);
      if(distToSpine(dx2,dy2)<dcR+0.09*S) continue;
      if(Math.hypot(dx2-node.x,dy2-node.y)<0.2*S) continue;
      var bad2=false;
      for(var q2=0;q2<decoys.length;q2++){ if(Math.hypot(decoys[q2].x-dx2,decoys[q2].y-dy2)<dcR*2+0.02*S){ bad2=true; break; } }
      for(var q3=0;q3<hazards.length;q3++){ if(Math.hypot(hazards[q3].x-dx2,hazards[q3].y-dy2)<dcR+hazards[q3].r+0.02*S){ bad2=true; break; } }
      if(bad2) continue;
      decoys.push({x:dx2,y:dy2,r:dcR,spin:rnd(0,TAU)});
      break;
    }
  }

  // bonus "hotfix" gate that pops mid-draw
  bonusGate=null; bonusPending=null;
  if(L>=6){
    var f=clamp((fracs[fracs.length-1]+0.92)/2, 0.55, 0.9);
    var bp=spineAt(f), btg=spineTangent(f), bperp={x:-btg.y,y:btg.x};
    var okB=true;
    for(var gg=0; gg<gates.length; gg++){ if(Math.hypot(gates[gg].x-bp.x, gates[gg].y-bp.y) < 0.15*S){ okB=false; break; } }
    if(okB) bonusPending={ x:bp.x, y:bp.y, ang:Math.atan2(bperp.y,bperp.x), g:halfGap*1.18, postR:postR, passed:false, req:false, bonus:true, pop:0 };
  }

  resetStroke();
}
function resetStroke(){
  stroke.active=false; stroke.pts=[]; stroke.passed=0;
  for(var i=0;i<gates.length;i++) gates[i].passed=false;
  if(bonusGate) bonusGate.passed=false;
  kbPen=null;
}

// ---------- stroke input ----------
function tryStart(x,y){
  if(game.state!=='playing') return false;
  if(Math.hypot(x-phone.x, y-phone.y) > phone.r*1.25) return false;
  stroke.active=true;
  stroke.pts=[{x:phone.x,y:phone.y}];
  stroke.passed=0;
  stroke.startT=now();
  stroke.penX=x; stroke.penY=y;
  for(var i=0;i<gates.length;i++) gates[i].passed=false;
  if(bonusGate) bonusGate.passed=false;
  sfx('pen'); vib(6);
  extend(x,y);
  return true;
}
function extend(x,y){
  if(!stroke.active) return;
  var last=stroke.pts[stroke.pts.length-1];
  if(Math.hypot(x-last.x, y-last.y) < 0.008*S){ stroke.penX=x; stroke.penY=y; return; }
  var a=last, b={x:x,y:y};

  // self-crossing (skip adjacent segment)
  for(var i=0;i<stroke.pts.length-2;i++){
    if(segSeg(a,b, stroke.pts[i], stroke.pts[i+1])){ failStroke('CROSSED', (a.x+b.x)/2, (a.y+b.y)/2); return; }
  }
  // hazards
  for(var h=0; h<hazards.length; h++){
    if(distSeg(hazards[h].x,hazards[h].y, a.x,a.y, b.x,b.y) < hazards[h].r){ failStroke('CONFLICT', hazards[h].x, hazards[h].y); return; }
  }
  // gates (posts fail, doorway crossing passes)
  var all = bonusGate ? gates.concat([bonusGate]) : gates;
  for(var gi=0; gi<all.length; gi++){
    var g=all[gi];
    var perp={x:Math.cos(g.ang), y:Math.sin(g.ang)};
    var p1={x:g.x+perp.x*g.g, y:g.y+perp.y*g.g};
    var p2={x:g.x-perp.x*g.g, y:g.y-perp.y*g.g};
    if(distSeg(p1.x,p1.y, a.x,a.y, b.x,b.y) < g.postR || distSeg(p2.x,p2.y, a.x,a.y, b.x,b.y) < g.postR){
      failStroke('HIT GATE', (a.x+b.x)/2, (a.y+b.y)/2); return;
    }
    if(!g.passed && segSeg(a,b, p1, p2)){ g.passed=true; onGatePass(g); }
  }
  // decoys (wrong agent)
  for(var dc=0; dc<decoys.length; dc++){
    if(Math.hypot(b.x-decoys[dc].x, b.y-decoys[dc].y) < decoys[dc].r){ failStroke('WRONG AGENT', decoys[dc].x, decoys[dc].y); return; }
  }

  stroke.pts.push(b);
  if(stroke.pts.length>700) stroke.pts.shift();
  stroke.penX=x; stroke.penY=y;

  // reached the target?
  if(Math.hypot(b.x-node.x, b.y-node.y) < node.r){
    var missing=false;
    for(var m=0;m<gates.length;m++){ if(!gates[m].passed){ missing=true; break; } }
    if(missing) failStroke('MISSED GATE', node.x, node.y);
    else completeDeploy();
  }
}
function onGatePass(g){
  if(g.req) stroke.passed++;
  sfx('gate', stroke.passed);
  sparkle(g.x, g.y, g.bonus?TH.accent2:TH.gate);
  vib(8);
  if(g.req && stroke.passed===1 && bonusPending && !bonusGate){
    bonusGate=bonusPending; bonusGate.pop=0.001;
    floatText(bonusGate.x, bonusGate.y-0.06*S, 'HOTFIX', TH.accent2);
    sfx('pop');
  }
  if(g.bonus){ game.score+=60; floatText(g.x, g.y-0.05*S, '+60', TH.accent2); updateHUD(); }
}
function failStroke(reason, x, y){
  if(!stroke.active) return;
  stroke.active=false;
  stroke.ghost=stroke.pts.slice();
  stroke.ghostT=0.4;
  stroke.pts=[];
  game.combo=1; updateHUD();
  shards(x,y);
  floatText(x, y-0.04*S, reason, TH.hazard);
  shakeT=0.32; sfx('fail'); vib([12,40,12]);
  for(var i=0;i<gates.length;i++) gates[i].passed=false;
  if(bonusGate) bonusGate.passed=false;
  kbPen=null;
}
function endStroke(){
  if(!stroke.active) return;
  stroke.active=false;
  stroke.pts=[];
  for(var i=0;i<gates.length;i++) gates[i].passed=false;
  if(bonusGate) bonusGate.passed=false;
  kbPen=null;
}
function completeDeploy(){
  stroke.active=false;
  var gateBonus = gates.length*25 + (bonusGate && bonusGate.passed ? 60 : 0);
  var dt=(now()-stroke.startT)/1000;
  var speedBonus = dt<2.6?60:(dt<4?30:0);
  var gained=Math.round((100+gateBonus+speedBonus)*game.combo);
  game.score+=gained; game.ships++;
  if(game.combo>game.bestCombo) game.bestCombo=game.combo;

  game.state='shipping';
  var pts=stroke.pts.slice();
  shipAnim={ pts:pts, cum:cumLen(pts), dur:0.72, t:0 };
  confetti(node.x, node.y);
  floatText(node.x, node.y-0.09*S, '+'+gained+(game.combo>1?'  x'+game.combo:''), TH.ship);
  sfx('ship', game.combo); vib([10,26,60]);
  game.combo=Math.min(game.combo+1, 9);
  updateHUD();
}
function nextLevel(){
  game.level++;
  buildLevel();
  shipAnim=null;
  game.state='playing';
}

// ---------- flow ----------
function startGame(){
  initAudio(); resumeAudio();
  refreshTheme();
  game.state='playing';
  game.score=0; game.combo=1; game.bestCombo=1; game.ships=0; game.level=0;
  game.timeLeft=game.roundLen;
  particles.length=0; floats.length=0; shakeT=0; lastTick=-1;
  shipAnim=null; stroke.ghost=[]; stroke.ghostT=0;
  buildLevel();
  titleEl.classList.add('hide');
  overEl.classList.add('hide');
  updateHUD();
}
function gameOver(){
  game.state='gameover';
  endStroke();
  sfx('dawn'); vib(30);
  var goal=6;
  var msg = game.ships>=goal ? 'Shipped before sunrise. Beautiful work.'
          : (game.ships>0 ? 'The sun caught you mid-deploy.' : 'Dawn broke first &mdash; try again.');
  resultsEl.innerHTML =
    '<div class="big">'+game.score+'</div>'+
    '<div class="rlabel">SCORE</div>'+
    '<div class="rrow"><span><b>'+game.ships+'</b> shipped</span><span>best <b>x'+game.bestCombo+'</b></span></div>'+
    '<div class="msg">'+msg+'</div>';
  overEl.classList.remove('hide');
  updateHUD();
}
function updateHUD(){
  hudScore.textContent = game.score;
  var t=Math.max(0, game.timeLeft), s=Math.ceil(t);
  hudClock.textContent = Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);
  var f=clamp(game.timeLeft/game.roundLen, 0, 1);
  barfill.style.width=(f*100)+'%';
  barfill.style.background = f>0.35 ? mix(TH.accent2, TH.gate, (f-0.35)/0.65) : mix(TH.hazard, TH.accent2, f/0.35);
  if(game.combo>1){ comboEl.style.display='block'; comboEl.textContent='x'+game.combo; }
  else comboEl.style.display='none';
}

// ---------- audio ----------
var AC=null, master=null, muted=false;
function initAudio(){
  if(AC) return;
  try{
    var A=window.AudioContext||window.webkitAudioContext;
    if(!A) return;
    AC=new A();
    master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
  }catch(e){ AC=null; }
}
function resumeAudio(){ try{ if(AC && AC.resume) AC.resume(); }catch(e){} }
function beep(freq,dur,type,vol,when){
  if(!AC || muted) return;
  try{
    var t=when||AC.currentTime;
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol||0.2, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function sfx(name,n){
  if(!AC || muted) return;
  var t=AC.currentTime;
  if(name==='pen'){ beep(300,0.08,'sine',0.12); }
  else if(name==='gate'){ beep(500+(n||1)*95, 0.14,'triangle',0.16); }
  else if(name==='pop'){ beep(720,0.1,'sine',0.14); beep(1080,0.09,'sine',0.08,t+0.04); }
  else if(name==='ship'){ [0,4,7,12].forEach(function(s,i){ beep(440*Math.pow(2,s/12),0.5,'triangle',0.15,t+i*0.05); }); }
  else if(name==='fail'){ beep(190,0.2,'sawtooth',0.12); beep(120,0.24,'sine',0.09,t+0.02); }
  else if(name==='dawn'){ [0,7,12,16].forEach(function(s,i){ beep(330*Math.pow(2,s/12),0.9,'sine',0.13,t+i*0.09); }); }
  else if(name==='tick'){ beep(900,0.05,'square',0.06); }
}
function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function now(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }

// ---------- particles / floats ----------
function sparkle(x,y,col){
  for(var i=0;i<7;i++){ var a=Math.random()*TAU, sp=rnd(0.05,0.18)*S;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:rnd(0.3,0.6),size:rnd(0.006,0.014)*S,rot:0,vr:0,col:col,shape:'spark',g:0}); }
}
function shards(x,y){
  for(var i=0;i<11;i++){ var a=Math.random()*TAU, sp=rnd(0.1,0.32)*S;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:rnd(0.3,0.6),size:rnd(0.01,0.02)*S,rot:Math.random()*TAU,vr:rnd(-6,6),col:TH.hazard,shape:'rect',g:0.6*S}); }
}
function confetti(x,y){
  var cols=[TH.ship,TH.accent,TH.accent2,TH.gate];
  for(var i=0;i<28;i++){ var a=-Math.PI/2+rnd(-1.1,1.1), sp=rnd(0.2,0.58)*S;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.08*S,life:0,max:rnd(0.6,1.15),size:rnd(0.012,0.024)*S,rot:Math.random()*TAU,vr:rnd(-9,9),col:pick(cols),shape:'rect',g:0.95*S}); }
}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.life+=dt;
    if(p.life>=p.max){ particles.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; p.vx*=0.985;
  }
  if(particles.length>280) particles.splice(0, particles.length-280);
}
function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i], a=1-p.life/p.max;
    ctx.save(); ctx.globalAlpha=clamp(a,0,1); ctx.translate(p.x,p.y);
    if(p.shape==='rect'){ ctx.rotate(p.rot); ctx.fillStyle=p.col; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); }
    else { ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(0,0,p.size*a,0,TAU); ctx.fill(); }
    ctx.restore();
  }
}
function floatText(x,y,text,col){ floats.push({x:x,y:y,text:text,col:col,life:0,max:1.0,vy:-0.05*S}); }
function updateFloats(dt){
  for(var i=floats.length-1;i>=0;i--){ var f=floats[i]; f.life+=dt; f.y+=f.vy*dt; if(f.life>=f.max) floats.splice(i,1); }
}
function drawFloats(){
  for(var i=0;i<floats.length;i++){
    var f=floats[i], a=1-f.life/f.max;
    ctx.save(); ctx.globalAlpha=clamp(a,0,1); ctx.fillStyle=f.col;
    ctx.font='800 '+(0.045*S)+'px ui-monospace,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.text, f.x, f.y); ctx.restore();
  }
}

// ---------- drawing primitives ----------
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  if(ctx.roundRect){ try{ ctx.roundRect(x,y,w,h,r); return; }catch(e){} }
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function withShadow(dx,dy,blur,fn){
  ctx.save();
  ctx.shadowColor=TH.shadow; ctx.shadowOffsetX=dx; ctx.shadowOffsetY=dy; ctx.shadowBlur=blur;
  fn(); ctx.restore();
}
function glowDot(x,y,r,col){
  ctx.save();
  var g=ctx.createRadialGradient(x,y,0,x,y,r*2.6);
  g.addColorStop(0, rgba(col,0.85)); g.addColorStop(1, rgba(col,0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*2.6,0,TAU); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,r*0.5,0,TAU); ctx.fill();
  ctx.restore();
}

// ---------- collage / texture cache ----------
var collage=document.createElement('canvas');
var noisePat=null;
function buildNoise(){
  try{
    var nc=document.createElement('canvas'); nc.width=nc.height=90;
    var nx=nc.getContext('2d'); if(!nx) return;
    var img=nx.createImageData(90,90);
    for(var i=0;i<img.data.length;i+=4){ var v=180+Math.random()*70; img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=255; }
    nx.putImageData(img,0,0);
    noisePat=ctx.createPattern(nc,'repeat');
  }catch(e){ noisePat=null; }
}
function paperTile(c,x,y,w,h,color,rot,kind,ink){
  c.save();
  c.translate(x+w/2, y+h/2); c.rotate(rot);
  c.shadowColor='rgba(0,0,0,0.16)'; c.shadowBlur=w*0.08; c.shadowOffsetY=h*0.05;
  c.fillStyle=color;
  roundRectOn(c,-w/2,-h/2,w,h,Math.min(w,h)*0.16); c.fill();
  c.shadowColor='transparent';
  // top highlight strip
  c.fillStyle='rgba(255,255,255,0.10)';
  roundRectOn(c,-w/2,-h/2,w,h*0.34,Math.min(w,h)*0.16); c.fill();
  // faint content glyphs
  c.strokeStyle=rgba(ink,0.16); c.fillStyle=rgba(ink,0.14); c.lineWidth=Math.max(1.4,w*0.02);
  var pad=w*0.16;
  if(kind===0){ // bar chart
    var bw=(w-pad*2)/4;
    for(var b=0;b<4;b++){ var bh=(h-pad*2)*[0.4,0.7,0.5,0.9][b]; c.fillRect(-w/2+pad+b*bw+bw*0.15, h/2-pad-bh, bw*0.6, bh); }
  } else if(kind===1){ // clock
    c.beginPath(); c.arc(0,0,Math.min(w,h)*0.26,0,TAU); c.stroke();
    c.beginPath(); c.moveTo(0,0); c.lineTo(0,-Math.min(w,h)*0.17); c.moveTo(0,0); c.lineTo(Math.min(w,h)*0.12,0.02); c.stroke();
  } else if(kind===2){ // list lines
    for(var l=0;l<3;l++){ var yy=-h*0.16+l*h*0.18; c.beginPath(); c.arc(-w/2+pad,yy,w*0.03,0,TAU); c.fill(); c.beginPath(); c.moveTo(-w/2+pad+w*0.1,yy); c.lineTo(w/2-pad,yy); c.stroke(); }
  } else if(kind===3){ // weather blob
    c.beginPath(); c.arc(-w*0.06,0,Math.min(w,h)*0.16,0,TAU); c.arc(w*0.08,-h*0.04,Math.min(w,h)*0.12,0,TAU); c.fill();
  } else { // app grid dots
    for(var gx=0;gx<3;gx++) for(var gy=0;gy<3;gy++){ c.beginPath(); c.arc(-w*0.22+gx*w*0.22, -h*0.22+gy*h*0.22, w*0.035,0,TAU); c.fill(); }
  }
  c.restore();
}
function roundRectOn(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2); c.beginPath();
  if(c.roundRect){ try{ c.roundRect(x,y,w,h,r); return; }catch(e){} }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function buildCollage(){
  collage.width=Math.max(1,Math.round(cssW*dpr));
  collage.height=Math.max(1,Math.round(cssH*dpr));
  var c=collage.getContext('2d'); if(!c) return;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,cssW,cssH);
  var rng=mulberry(20260815);
  var tiles=TH.tiles, ink=TH.ink;
  var n=11;
  for(var i=0;i<n;i++){
    var w=(0.16+rng()*0.2)*cssW;
    var h=w*(0.62+rng()*0.5);
    var x=(0.02+rng()*0.96)*cssW - w/2;
    var y=(0.04+rng()*0.94)*cssH - h/2;
    var rot=(rng()*2-1)*0.06;
    paperTile(c, x, y, w, h, tiles[i%tiles.length], rot, i%5, ink);
  }
}

// ---------- element drawing ----------
function drawPhone(p, active){
  var w=p.r*1.7, h=p.r*2.15;
  ctx.save(); ctx.translate(p.x,p.y);
  var pulse=0.5+0.5*Math.sin(time*3);
  ctx.strokeStyle=rgba(TH.accent, active?0.75:0.22+0.18*pulse);
  ctx.lineWidth=p.r*0.14;
  rr(-w/2-p.r*0.14, -h/2-p.r*0.14, w+p.r*0.28, h+p.r*0.28, p.r*0.5); ctx.stroke();
  withShadow(0, S*0.012, S*0.02, function(){ ctx.fillStyle=TH.card; rr(-w/2,-h/2,w,h,p.r*0.4); ctx.fill(); });
  ctx.fillStyle=rgba(TH.accent,0.14); rr(-w*0.36,-h*0.36,w*0.72,h*0.54,p.r*0.18); ctx.fill();
  ctx.strokeStyle=TH.accent; ctx.lineWidth=p.r*0.17; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(0,h*0.06); ctx.lineTo(0,-h*0.14);
  ctx.moveTo(-w*0.15,-h*0.02); ctx.lineTo(0,-h*0.16); ctx.lineTo(w*0.15,-h*0.02); ctx.stroke();
  ctx.strokeStyle=rgba(TH.ink,0.45); ctx.lineWidth=p.r*0.1;
  ctx.beginPath(); ctx.moveTo(-w*0.13,h*0.3); ctx.lineTo(w*0.13,h*0.3); ctx.stroke();
  ctx.restore();
}
function drawNode(n, decoy){
  ctx.save(); ctx.translate(n.x,n.y);
  if(!decoy){
    var pulse=0.5+0.5*Math.sin(time*3);
    ctx.beginPath(); ctx.arc(0,0,n.r*(1.24+0.12*pulse),0,TAU);
    ctx.fillStyle=rgba(TH.accent, 0.10+0.06*pulse); ctx.fill();
  }
  var dashes=10, spin=n.spin*(decoy?0.4:1);
  for(var i=0;i<dashes;i++){
    var ang=spin+i/dashes*TAU, r1=n.r*1.03, r2=n.r*1.16;
    ctx.strokeStyle= decoy?rgba(TH.muted,0.5):rgba(TH.accent,0.8);
    ctx.lineWidth=n.r*0.07; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(Math.cos(ang)*r1, Math.sin(ang)*r1); ctx.lineTo(Math.cos(ang)*r2, Math.sin(ang)*r2); ctx.stroke();
  }
  withShadow(0, S*0.01, S*0.016, function(){ ctx.fillStyle=TH.card; ctx.beginPath(); ctx.arc(0,0,n.r,0,TAU); ctx.fill(); });
  ctx.lineWidth=n.r*0.12; ctx.strokeStyle= decoy?rgba(TH.muted,0.7):TH.accent;
  ctx.beginPath(); ctx.arc(0,0,n.r*0.9,0,TAU); ctx.stroke();
  ctx.strokeStyle=TH.ink; ctx.fillStyle=TH.ink; ctx.lineCap='round';
  if(decoy){
    ctx.lineWidth=n.r*0.09;
    ctx.beginPath(); ctx.moveTo(-n.r*0.36,-n.r*0.04); ctx.lineTo(-n.r*0.1,-n.r*0.04);
    ctx.moveTo(n.r*0.1,-n.r*0.04); ctx.lineTo(n.r*0.36,-n.r*0.04); ctx.stroke();
    ctx.font='800 '+(n.r*0.5)+'px ui-monospace,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=rgba(TH.muted,0.9); ctx.fillText('z', n.r*0.42, -n.r*0.38);
  } else {
    var eye=n.r*0.15;
    ctx.beginPath(); ctx.arc(-n.r*0.24,-n.r*0.04,eye,0,TAU); ctx.arc(n.r*0.24,-n.r*0.04,eye,0,TAU); ctx.fill();
    ctx.lineWidth=n.r*0.08;
    ctx.beginPath(); ctx.arc(0,n.r*0.04,n.r*0.3,0.16*Math.PI,0.84*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-n.r*0.62); ctx.lineTo(0,-n.r*0.86); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,-n.r*0.92,n.r*0.09,0,TAU); ctx.fillStyle=TH.accent; ctx.fill();
  }
  ctx.restore();
}
function drawPost(x,y,g){
  var s=g.postR*2.5;
  ctx.save(); ctx.translate(x,y);
  withShadow(0, S*0.007, S*0.012, function(){ ctx.fillStyle=TH.card; rr(-s/2,-s/2,s,s,s*0.3); ctx.fill(); });
  var col=g.passed?TH.ship:(g.bonus?TH.accent2:TH.gate);
  ctx.strokeStyle=col; ctx.lineWidth=s*0.12; rr(-s/2,-s/2,s,s,s*0.3); ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=s*0.15; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(-s*0.2,0); ctx.lineTo(-s*0.02,s*0.17); ctx.lineTo(s*0.23,-s*0.19); ctx.stroke();
  ctx.restore();
}
function drawGate(g){
  var perp={x:Math.cos(g.ang), y:Math.sin(g.ang)};
  var p1={x:g.x+perp.x*g.g, y:g.y+perp.y*g.g};
  var p2={x:g.x-perp.x*g.g, y:g.y-perp.y*g.g};
  var scale = g.pop!=null && g.pop<0.25 ? clamp(g.pop/0.25,0.2,1) : 1;
  var col=g.passed?TH.ship:(g.bonus?TH.accent2:TH.gate);
  ctx.save();
  if(scale<1){ ctx.translate(g.x,g.y); ctx.scale(scale,scale); ctx.translate(-g.x,-g.y); }
  ctx.strokeStyle=rgba(col,0.4); ctx.lineWidth=S*0.009; ctx.setLineDash([S*0.02,S*0.018]);
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); ctx.setLineDash([]);
  drawPost(p1.x,p1.y,g); drawPost(p2.x,p2.y,g);
  ctx.restore();
}
function drawHazard(h){
  var s=h.r*1.9;
  ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(Math.sin(time*1.6+h.x)*0.04);
  withShadow(0, S*0.01, S*0.016, function(){ ctx.fillStyle=TH.hazard; rr(-s/2,-s/2,s,s,s*0.24); ctx.fill(); });
  ctx.save(); rr(-s/2,-s/2,s,s,s*0.24); ctx.clip();
  ctx.strokeStyle='rgba(0,0,0,0.14)'; ctx.lineWidth=s*0.13;
  for(var i=-2;i<3;i++){ ctx.beginPath(); ctx.moveTo(-s/2+i*s*0.42,-s/2); ctx.lineTo(-s/2+i*s*0.42+s,s/2); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle='#fff'; ctx.font='800 '+(s*0.5)+'px ui-monospace,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('!', 0, s*0.02);
  ctx.restore();
}
function strokePoly(pts){
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();
}
function drawPathStroke(){
  var pts=stroke.pts;
  if(pts.length>1){
    ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=rgba(TH.accent,0.22); ctx.lineWidth=0.032*S; strokePoly(pts);
    ctx.strokeStyle=TH.accent; ctx.lineWidth=0.015*S; strokePoly(pts);
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=0.005*S; strokePoly(pts);
    ctx.restore();
  }
  if(stroke.active && pts.length){ var tip=pts[pts.length-1]; glowDot(tip.x,tip.y,0.019*S,TH.accent); }
}
function drawPartial(pts,cum,frac,style,width){
  if(pts.length<2) return;
  var total=cum[cum.length-1]||1, target=frac*total;
  ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=style; ctx.lineWidth=width;
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++){
    if(cum[i]<=target){ ctx.lineTo(pts[i].x,pts[i].y); }
    else { var seg=cum[i]-cum[i-1]||1, t=(target-cum[i-1])/seg; ctx.lineTo(lerp(pts[i-1].x,pts[i].x,t), lerp(pts[i-1].y,pts[i].y,t)); break; }
  }
  ctx.stroke(); ctx.restore();
}
function drawShip(){
  if(!shipAnim) return;
  var p=clamp(shipAnim.t/shipAnim.dur,0,1);
  drawPartial(shipAnim.pts, shipAnim.cum, 1, rgba(TH.ship,0.95), 0.016*S);
  var K=6;
  for(var i=0;i<K;i++){
    var off=i/(K*1.5);
    var f=clamp(p*1.4-off,0,1);
    if(f<=0) continue;
    var pos=alongPts(shipAnim.pts, shipAnim.cum, f);
    ctx.save(); ctx.translate(pos.x,pos.y); ctx.rotate(Math.sin(shipAnim.t*22+i)*0.4);
    ctx.fillStyle= i%2? TH.accent2 : TH.ship;
    var sz=0.02*S; rr(-sz/2,-sz/2,sz,sz,sz*0.3); ctx.fill();
    ctx.restore();
  }
}

// ---------- title demo ----------
var demo={};
function buildDemo(){
  // Keep the teaching demo in a band safely below the title panel. The panel is
  // taller (relative to height) in landscape, so push the band lower there.
  var portrait = cssH >= cssW;
  var topB = portrait ? 0.52 : 0.66;
  var botB = portrait ? 0.84 : 0.90;
  var cx = cssW*0.5;
  var ny = cssH*topB, py = cssH*botB, gy = (ny+py)*0.5;
  var nx = cx + 0.11*S, gx = cx - 0.12*S;
  demo.phone={x:cx, y:py, r:0.07*S};
  demo.node={x:nx, y:ny, r:0.055*S, spin:0};
  var ang=Math.atan2(ny-gy, nx-gx)+Math.PI/2;
  demo.gate={x:gx,y:gy,ang:ang,g:0.1*S,postR:0.018*S,passed:false};
  var ctrl=[{x:cx,y:py},{x:gx,y:gy},{x:nx,y:ny}];
  demo.path=chaikin(ctrl,3);
  demo.cum=cumLen(demo.path);
  demo.t=0;
}
function updateDemo(dt){
  demo.t+=dt;
  if(demo.node) demo.node.spin=time*1.4;
  if(demo.gate){ var ph=demo.t%3.0; demo.gate.passed = ph>0.9 && ph<2.6; }
}
function drawDemo(){
  if(!demo.path) return;
  drawGate(demo.gate);
  drawNode(demo.node,false);
  drawPhone(demo.phone,false);
  var ph=demo.t%3.0;
  var rev=clamp(ph/1.7,0,1);
  var alpha = ph>2.4 ? clamp(1-(ph-2.4)/0.6,0,1) : 1;
  ctx.save(); ctx.globalAlpha=alpha;
  drawPartial(demo.path, demo.cum, rev, rgba(TH.accent,0.9), 0.013*S);
  var head=alongPts(demo.path, demo.cum, rev);
  glowDot(head.x,head.y,0.016*S,TH.accent);
  ctx.restore();
}

// ---------- background ----------
function drawHorizon(prog){
  var h=cssH*(0.1+0.16*prog);
  var g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0, rgba(TH.glow, 0.08+0.34*prog));
  g.addColorStop(1, rgba(TH.glow, 0));
  ctx.fillStyle=g; ctx.fillRect(0,0,cssW,h);
  if(prog>0.25){
    var sr=S*0.06*prog, sy=cssH*0.045 + (1-prog)*cssH*0.06;
    ctx.save(); ctx.globalAlpha=0.55*prog;
    var sg=ctx.createRadialGradient(cssW*0.5,sy,0,cssW*0.5,sy,sr*2.4);
    sg.addColorStop(0, rgba(TH.glow,0.9)); sg.addColorStop(1, rgba(TH.glow,0));
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(cssW*0.5,sy,sr*2.4,0,TAU); ctx.fill();
    ctx.restore();
  }
}
function drawBackground(){
  ctx.fillStyle=TH.bg; ctx.fillRect(0,0,cssW,cssH);
  if(collage.width>1) ctx.drawImage(collage,0,0,cssW,cssH);
  if(noisePat){ ctx.save(); ctx.globalAlpha=darkMode()?0.05:0.06; ctx.fillStyle=noisePat; ctx.fillRect(0,0,cssW,cssH); ctx.restore(); }
  var playing=(game.state==='playing'||game.state==='shipping');
  var sa = playing ? TH.scrimA : TH.scrimA*0.45;
  ctx.fillStyle=rgba(TH.scrim, sa); ctx.fillRect(0,0,cssW,cssH);
  var prog = game.state==='playing' ? 1-clamp(game.timeLeft/game.roundLen,0,1)
           : (game.state==='gameover' ? 1 : 0.12);
  drawHorizon(prog);
}

// ---------- render ----------
function drawField(){
  var i;
  for(i=0;i<hazards.length;i++) drawHazard(hazards[i]);
  for(i=0;i<gates.length;i++) drawGate(gates[i]);
  if(bonusGate) drawGate(bonusGate);
  for(i=0;i<decoys.length;i++) drawNode(decoys[i], true);
  if(stroke.ghostT>0 && stroke.ghost.length>1){
    ctx.save(); ctx.globalAlpha=clamp(stroke.ghostT/0.4,0,1);
    drawPartial(stroke.ghost, cumLen(stroke.ghost), 1, rgba(TH.hazard,0.9), 0.015*S);
    ctx.restore();
  }
  if(game.state==='shipping') drawShip();
  else drawPathStroke();
  drawNode(node, false);
  drawPhone(phone, stroke.active);
  drawParticles();
  drawFloats();
}
function render(){
  ctx.save();
  if(shakeT>0){ var m=shakeT*S*0.03; ctx.translate((Math.random()*2-1)*m,(Math.random()*2-1)*m); }
  drawBackground();
  if(game.state==='title'){ drawDemo(); }
  else { drawField(); }
  ctx.restore();
}

// ---------- update ----------
function updateEntities(dt){
  if(node) node.spin+=node.spinSpd*dt;
  for(var i=0;i<decoys.length;i++) decoys[i].spin+=1.0*dt;
  for(var h=0;h<hazards.length;h++){
    var hz=hazards[h];
    if(hz.mv){ var o=Math.sin(time*hz.mv.spd+hz.mv.ph)*hz.mv.amp; hz.x=hz.bx+hz.mv.ax*o; hz.y=hz.by+hz.mv.ay*o; }
  }
  if(bonusGate && bonusGate.pop!=null && bonusGate.pop<1) bonusGate.pop+=dt;
}
function updateKb(dt){
  if(!stroke.active || !kbPen) return;
  var dx=0, dy=0;
  if(keys['arrowup']||keys['w']) dy-=1;
  if(keys['arrowdown']||keys['s']) dy+=1;
  if(keys['arrowleft']||keys['a']) dx-=1;
  if(keys['arrowright']||keys['d']) dx+=1;
  if(dx===0 && dy===0) return;
  var l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
  var sp=0.55*S*dt;
  kbPen.x=clamp(kbPen.x+dx*sp, 0, cssW);
  kbPen.y=clamp(kbPen.y+dy*sp, 0, cssH);
  extend(kbPen.x, kbPen.y);
}
function update(dt){
  time+=dt;
  if(game.state==='playing'){
    game.timeLeft-=dt;
    if(game.timeLeft<=5 && game.timeLeft>0){ var cs=Math.ceil(game.timeLeft); if(cs!==lastTick){ lastTick=cs; sfx('tick'); } }
    if(game.timeLeft<=0){ game.timeLeft=0; gameOver(); }
    else { updateEntities(dt); updateKb(dt); updateHUD(); }
  } else if(game.state==='shipping'){
    updateEntities(dt);
    if(shipAnim){ shipAnim.t+=dt; if(shipAnim.t>=shipAnim.dur) nextLevel(); }
  } else if(game.state==='title'){
    updateDemo(dt);
  } else if(game.state==='gameover'){
    updateEntities(dt);
  }
  updateParticles(dt); updateFloats(dt);
  if(shakeT>0) shakeT-=dt;
  if(stroke.ghostT>0) stroke.ghostT-=dt;
}

// ---------- main loop ----------
var last=now();
function frame(){
  var n=now(); var dt=(n-last)/1000; last=n;
  if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  try{ update(dt); render(); }catch(e){ /* never let a frame throw */ }
  requestAnimationFrame(frame);
}

// ---------- resize ----------
var resizeTimer=null;
function doResize(){
  cssW=window.innerWidth; cssH=window.innerHeight; S=Math.min(cssW,cssH);
  dpr=Math.min(window.devicePixelRatio||1, 2.5);
  canvas.width=Math.round(cssW*dpr); canvas.height=Math.round(cssH*dpr);
  canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildCollage(); buildDemo();
  if(game.state==='playing'||game.state==='shipping'||game.state==='gameover') buildLevel();
}
function onResize(){ if(resizeTimer) clearTimeout(resizeTimer); resizeTimer=setTimeout(doResize,120); }

// ---------- input ----------
function canvasPos(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
canvas.addEventListener('pointerdown', function(e){
  if(e.isPrimary===false) return;
  initAudio(); resumeAudio();
  if(game.state==='playing'){
    var p=canvasPos(e);
    if(tryStart(p.x,p.y)){ try{ canvas.setPointerCapture(e.pointerId); }catch(_){} }
  }
  if(e.cancelable) e.preventDefault();
}, {passive:false});
canvas.addEventListener('pointermove', function(e){
  if(game.state==='playing' && stroke.active){ var p=canvasPos(e); extend(p.x,p.y); }
  if(e.cancelable) e.preventDefault();
}, {passive:false});
canvas.addEventListener('pointerup', function(e){
  if(stroke.active) endStroke();
  if(e.cancelable) e.preventDefault();
}, {passive:false});
canvas.addEventListener('pointercancel', function(){ if(stroke.active) endStroke(); }, {passive:false});
canvas.addEventListener('touchstart', function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});

var MOVE_KEYS={arrowup:1,arrowdown:1,arrowleft:1,arrowright:1,w:1,a:1,s:1,d:1};
window.addEventListener('keydown', function(e){
  var k=(e.key||'').toLowerCase();
  if(game.state==='title' && (k==='enter'||k===' ')){ e.preventDefault(); startGame(); return; }
  if(game.state==='gameover' && (k==='enter'||k===' ')){ e.preventDefault(); startGame(); return; }
  if(game.state==='playing'){
    if(MOVE_KEYS[k]){
      keys[k]=true; e.preventDefault();
      if(!stroke.active){ if(tryStart(phone.x,phone.y)) kbPen={x:phone.x,y:phone.y}; }
    } else if(k==='escape'){ if(stroke.active) endStroke(); }
  }
});
window.addEventListener('keyup', function(e){ var k=(e.key||'').toLowerCase(); if(MOVE_KEYS[k]) keys[k]=false; });

startBtn.addEventListener('click', function(){ startGame(); });
restartBtn.addEventListener('click', function(){ startGame(); });
muteBtn.addEventListener('click', function(){
  muted=!muted;
  muteBtn.innerHTML = muted ? '&#9835;' : '&#9834;';
  muteBtn.classList.toggle('off', muted);
  if(!muted){ initAudio(); resumeAudio(); }
});

if(mq){
  var onScheme=function(){ refreshTheme(); buildCollage(); updateHUD(); };
  if(mq.addEventListener) mq.addEventListener('change', onScheme);
  else if(mq.addListener) mq.addListener(onScheme);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

// ---------- boot ----------
doResize();
buildNoise();
buildDemo();
updateHUD();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
