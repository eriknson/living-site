<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commit Sort</title>
<style>
  :root {
    --bg: #F1E9D2;
    --fg: #005f00;
    --bin-bg: #E3D8BC;
    --accent: #008800;
    --error: #880000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1814;
      --fg: #4AF626;
      --bin-bg: #2a2620;
      --accent: #6BFF4A;
      --error: #FF4A4A;
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100dvh;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden; touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  #gameCanvas {
    display: block; width: 100%; height: 100%; touch-action: none;
  }
  #scanlines {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.05));
    background-size: 100% 4px;
    pointer-events: none; z-index: 5;
  }
  #uiLayer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column; z-index: 10;
  }
  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(241, 233, 210, 0.95);
    transition: opacity 0.3s; pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    .screen { background: rgba(26, 24, 20, 0.95); }
  }
  .hidden { opacity: 0; }
  button {
    pointer-events: auto;
    background: var(--bg); color: var(--fg);
    border: 2px solid var(--fg); padding: 15px 30px;
    font-size: 1.2rem; font-family: inherit; cursor: pointer;
    text-transform: uppercase; font-weight: bold;
    box-shadow: 4px 4px 0 var(--fg);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active {
    transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--fg);
  }
  #hud {
    position: absolute; top: 0; left: 0; width: 100%; padding: 10px 20px;
    box-sizing: border-box; display: flex; justify-content: space-between;
    font-size: 1.2rem; font-weight: bold; z-index: 2;
  }
  #timerBarContainer {
    position: absolute; top: 40px; left: 20px; right: 20px; height: 14px;
    border: 2px solid var(--fg); padding: 2px; box-sizing: border-box;
    z-index: 2;
  }
  #timerBar {
    height: 100%; background: var(--fg); width: 100%;
  }
  .panel {
    text-align: center; max-width: 300px; margin-bottom: 30px; line-height: 1.6;
    background: var(--bg); padding: 15px; border: 2px solid var(--fg);
    box-shadow: 4px 4px 0 var(--fg);
  }
  h1 {
    font-size: 3rem; margin-bottom: 10px; text-align: center;
    text-shadow: 2px 2px 0 var(--bg), -2px -2px 0 var(--bg); letter-spacing: -2px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="scanlines"></div>
<div id="uiLayer">
  <div id="hud" class="hidden">
    <div>VOTES: <span id="scoreDisplay">0 / 800</span> <span id="comboDisplay" style="color: var(--accent); margin-left: 10px; font-size: 0.9em;"></span></div>
    <div id="timeDisplay">60s</div>
  </div>
  <div id="timerBarContainer" class="hidden"><div id="timerBar"></div></div>

  <div id="startScreen" class="screen">
    <h1>COMMIT<br>SORT</h1>
    <div class="panel">
      Sort the packages before the vote ends.<br><br>
      <span style="opacity: 0.8; font-size: 0.9em;">
      Drag LEFT for NON-FREE<br>
      Drag RIGHT for AI-CONTRIB<br>
      Leave CENTER for CONTRIB<br>
      Flick DOWN to drop fast
      </span>
    </div>
    <button data-smoke="start" id="startBtn">Start Vote</button>
  </div>

  <div id="gameOverScreen" class="screen hidden">
    <h1 id="gameOverTitle">VOTE PASSED</h1>
    <div id="gameOverMsg" class="panel">
      Harmonious merge achieved!<br><br>Final Score: 1000
    </div>
    <button data-smoke="restart" id="restartBtn">Revote</button>
  </div>
</div>
<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  const binHeight = 120;
  
  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    let dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  const TYPES = {
    'non-free': { label: 'NON-FREE', glyphs: ['©', '$', '™', '🔒'] },
    'contrib': { label: 'CONTRIB', glyphs: ['❤', '☺', '★', '⚒'] },
    'ai-contrib': { label: 'AI-CONTRIB', glyphs: ['⚡', '⚙', '∞', '⚗'] }
  };

  let packages = [];
  let particles = [];
  let mergeParticles = [];
  let bgTexts = [];
  let spawnTimer = 0;
  let gameTime = 60;
  let timeLeft = 60;
  let score = 0;
  let combo = 0;
  const THRESHOLD = 800;
  let gameState = 'start';
  let lastTime = performance.now();
  let shakeTime = 0;

  function initBgTexts() {
    let phrases = [
      "where does machine intelligence belong?",
      "automated research loops",
      "karl the fog rolling",
      "open-source communities debating",
      "tectonic tremors rippling",
      "shipping by sunrise"
    ];
    for (let i = 0; i < 6; i++) {
      bgTexts.push({
        x: Math.random() * width,
        y: Math.random() * height,
        text: phrases[Math.floor(Math.random() * phrases.length)],
        speed: Math.random() * 0.5 + 0.1
      });
    }
  }
  initBgTexts();

  class Package {
    constructor() {
      this.id = Math.random();
      let types = ['non-free', 'contrib', 'ai-contrib'];
      this.type = types[Math.floor(Math.random() * types.length)];
      this.lane = 1; 
      this.y = -100;
      
      let progress = 1 - (timeLeft / gameTime);
      this.speed = (height * 0.15) * (1 + progress * 0.5) * (1/60); 
      
      this.isDragging = false;
      this.dragX = 0;
      this.fastDrop = false;
      this.visualX = this.lane * (width / 3) + (width / 6);
      
      let tInfo = TYPES[this.type];
      this.glyph = tInfo.glyphs[Math.floor(Math.random() * tInfo.glyphs.length)];
      this.label = tInfo.label;
      
      this.isDual = progress > 0.3 && Math.random() < progress * 0.6;
      if (this.isDual) {
        let otherTypes = types.filter(t => t !== this.type);
        let otherType = otherTypes[Math.floor(Math.random() * otherTypes.length)];
        this.secondaryGlyph = TYPES[otherType].glyphs[0];
        this.secondaryLabel = TYPES[otherType].label;
      }
    }
    
    update(dt) {
      if (this.fastDrop) {
        this.y += this.speed * 4 * (dt / 16);
      } else {
        this.y += this.speed * (dt / 16);
      }
      
      let targetX = this.isDragging ? this.dragX : this.lane * (width / 3) + (width / 6);
      this.visualX += (targetX - this.visualX) * (1 - Math.pow(0.5, dt/16));
    }
    
    draw(ctx) {
      ctx.save();
      ctx.translate(this.visualX, this.y);
      
      let scale = this.isDragging ? 1.05 : 1.0;
      ctx.scale(scale, scale);
      
      let style = getComputedStyle(document.body);
      let fg = style.getPropertyValue('--fg').trim();
      let bg = style.getPropertyValue('--bg').trim();
      
      ctx.fillStyle = bg;
      ctx.strokeStyle = fg;
      ctx.lineWidth = 2;
      
      let pw = Math.min(width / 3 - 20, 120);
      let ph = 80;
      
      ctx.fillRect(-pw/2, -ph/2, pw, ph);
      ctx.strokeRect(-pw/2, -ph/2, pw, ph);
      
      ctx.beginPath();
      ctx.moveTo(-pw/2, -ph/2 + 20);
      ctx.lineTo(pw/2, -ph/2 + 20);
      ctx.stroke();
      
      ctx.fillStyle = fg;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      if (this.isDual) {
        ctx.font = '24px monospace';
        ctx.fillText(this.glyph, -15, 5);
        ctx.globalAlpha = 0.4;
        ctx.fillText(this.secondaryGlyph, 15, 5);
        ctx.globalAlpha = 1.0;
        
        ctx.font = '12px monospace';
        if (Math.random() < 0.1) {
          ctx.fillText(this.secondaryLabel, 0, 28);
        } else {
          ctx.fillText(this.label, 0, 28);
        }
      } else {
        ctx.font = '32px monospace';
        ctx.fillText(this.glyph, 0, 5);
        ctx.font = '12px monospace';
        ctx.fillText(this.label, 0, 28);
      }
      
      ctx.restore();
    }
  }

  function spawnParticles(x, y, type) {
    let count = type === 'correct' ? 15 : 25;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 1) * 10 - 2,
        life: 1.0,
        type: type,
        glyph: type === 'correct' ? '+' : ['?', '!', 'x'][Math.floor(Math.random()*3)]
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx * (dt/16);
      p.y += p.vy * (dt/16);
      p.vy += 0.5 * (dt/16); 
      p.life -= 0.02 * (dt/16);
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles(ctx) {
    let style = getComputedStyle(document.body);
    let fg = style.getPropertyValue('--fg').trim();
    let error = style.getPropertyValue('--error').trim();
    
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 18px monospace';
    
    for (let p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.type === 'correct' ? fg : error;
      ctx.fillText(p.glyph, p.x, p.y);
    }
    ctx.restore();
  }

  function triggerMergeAnimation() {
    for (let i = 0; i < 150; i++) {
      mergeParticles.push({
        x: Math.random() * width,
        y: height + Math.random() * 300,
        vx: 0,
        vy: -Math.random() * 6 - 2,
        glyph: ['✓', 'merge', 'ok', '❤', '++'][Math.floor(Math.random()*5)],
        life: 1.0
      });
    }
  }

  function drawMergeAnimation(ctx, dt) {
    let style = getComputedStyle(document.body);
    let fg = style.getPropertyValue('--fg').trim();
    ctx.save();
    ctx.fillStyle = fg;
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px monospace';
    for (let p of mergeParticles) {
      p.y += p.vy * (dt/16);
      p.life -= 0.003 * (dt/16);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillText(p.glyph, p.x, p.y);
    }
    ctx.restore();
  }

  function drawBackground(ctx, dt) {
    let style = getComputedStyle(document.body);
    let fg = style.getPropertyValue('--fg').trim();
    
    ctx.save();
    
    ctx.fillStyle = fg;
    ctx.globalAlpha = 0.05;
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    for (let t of bgTexts) {
      t.y -= t.speed * (dt/16);
      if (t.y < -20) {
        t.y = height + 20;
        t.x = Math.random() * width;
      }
      ctx.fillText(t.text, t.x, t.y);
    }
    
    ctx.strokeStyle = fg;
    ctx.globalAlpha = 0.1;
    ctx.lineWidth = 1;
    let w3 = width / 3;
    ctx.beginPath();
    ctx.moveTo(w3, 0);
    ctx.lineTo(w3, height - binHeight);
    ctx.moveTo(w3 * 2, 0);
    ctx.lineTo(w3 * 2, height - binHeight);
    ctx.stroke();
    
    ctx.restore();
  }

  function drawBins(ctx) {
    let style = getComputedStyle(document.body);
    let fg = style.getPropertyValue('--fg').trim();
    let binBg = style.getPropertyValue('--bin-bg').trim();
    
    ctx.save();
    ctx.translate(0, height - binHeight);
    
    let w3 = width / 3;
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = binBg;
      ctx.fillRect(i * w3, 0, w3, binHeight);
      
      ctx.strokeStyle = fg;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(i * w3, 0);
      ctx.lineTo(i * w3, binHeight);
      ctx.lineTo(i * w3 + w3, binHeight);
      ctx.lineTo(i * w3 + w3, 0);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.setLineDash([5, 5]);
      ctx.moveTo(i * w3, 0);
      ctx.lineTo(i * w3 + w3, 0);
      ctx.stroke();
      ctx.setLineDash([]);
      
      ctx.fillStyle = fg;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 16px monospace';
      
      let label = i === 0 ? 'NON-FREE' : i === 1 ? 'CONTRIB' : 'AI-CONTRIB';
      ctx.fillText(label, i * w3 + w3/2, binHeight / 2 - 10);
      
      ctx.font = '12px monospace';
      ctx.globalAlpha = 0.6;
      let hint = i === 0 ? '< LEFT' : i === 1 ? 'CENTER' : 'RIGHT >';
      ctx.fillText(hint, i * w3 + w3/2, binHeight / 2 + 15);
      ctx.globalAlpha = 1.0;
    }
    ctx.restore();
  }

  let activeTouch = null;
  let touchHistory = [];

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (gameState !== 'playing') return;
    
    let touchedPkg = null;
    for (let i = packages.length - 1; i >= 0; i--) {
      let p = packages[i];
      let px = p.isDragging ? p.dragX : p.visualX;
      if (Math.abs(e.clientX - px) < 80 && Math.abs(e.clientY - p.y) < 80) {
        touchedPkg = p;
        break;
      }
    }
    
    if (!touchedPkg && packages.length > 0) {
      touchedPkg = packages.reduce((lowest, p) => p.y > lowest.y ? p : lowest, packages[0]);
    }
    
    if (touchedPkg) {
      touchedPkg.isDragging = true;
      touchedPkg.dragX = touchedPkg.visualX;
      activeTouch = {
        id: e.pointerId,
        pkg: touchedPkg,
        offsetX: touchedPkg.dragX - e.clientX
      };
      touchHistory = [{ y: e.clientY, time: performance.now() }];
    }
  }, { passive: false });

  canvas.addEventListener('pointermove', (e) => {
    e.preventDefault();
    if (gameState !== 'playing' || !activeTouch || activeTouch.id !== e.pointerId) return;
    
    activeTouch.pkg.dragX = e.clientX + activeTouch.offsetX;
    
    touchHistory.push({ y: e.clientY, time: performance.now() });
    if (touchHistory.length > 5) touchHistory.shift();
  }, { passive: false });

  function handlePointerUp(e) {
    e.preventDefault();
    if (activeTouch && activeTouch.id === e.pointerId) {
      let p = activeTouch.pkg;
      p.isDragging = false;
      
      let laneWidth = width / 3;
      if (p.dragX < laneWidth) p.lane = 0;
      else if (p.dragX < laneWidth * 2) p.lane = 1;
      else p.lane = 2;
      
      if (touchHistory.length > 1) {
        let first = touchHistory[0];
        let last = touchHistory[touchHistory.length - 1];
        let dy = last.y - first.y;
        let dt = last.time - first.time;
        if (dt > 0 && dy / dt > 0.8) { 
          p.fastDrop = true;
        }
      }
      
      activeTouch = null;
    }
  }

  canvas.addEventListener('pointerup', handlePointerUp, { passive: false });
  canvas.addEventListener('pointercancel', handlePointerUp, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (gameState !== 'playing') return;
    let lowest = packages.reduce((l, p) => (!l || p.y > l.y) ? p : l, null);
    if (!lowest) return;
    
    if (e.key === 'ArrowLeft') {
      if (lowest.lane > 0) lowest.lane--;
    } else if (e.key === 'ArrowRight') {
      if (lowest.lane < 2) lowest.lane++;
    } else if (e.key === 'ArrowDown') {
      lowest.fastDrop = true;
    }
  });

  function loop(time) {
    let dt = time - lastTime;
    lastTime = time;
    if (dt > 100) dt = 16;
    
    ctx.clearRect(0, 0, width, height);
    
    drawBackground(ctx, dt);
    
    if (shakeTime > 0) {
      ctx.save();
      ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
      shakeTime--;
    }
    
    if (gameState === 'playing') {
      timeLeft -= dt / 1000;
      if (timeLeft <= 0) {
        timeLeft = 0;
        endGame();
      }
      
      spawnTimer -= dt;
      let progress = 1 - (timeLeft / gameTime);
      let currentSpawnInterval = 1500 - progress * 1000;
      if (spawnTimer <= 0) {
        packages.push(new Package());
        spawnTimer = currentSpawnInterval;
      }
      
      for (let i = packages.length - 1; i >= 0; i--) {
        packages[i].update(dt);
        
        let p = packages[i];
        let ph = 80;
        if (p.y + ph/2 >= height - binHeight) {
          let finalLane = p.lane;
          if (p.isDragging) {
            let laneWidth = width / 3;
            if (p.dragX < laneWidth) finalLane = 0;
            else if (p.dragX < laneWidth * 2) finalLane = 1;
            else finalLane = 2;
            if (activeTouch && activeTouch.pkg === p) activeTouch = null;
          }
          
          let targetLane = p.type === 'non-free' ? 0 : p.type === 'contrib' ? 1 : 2;
          
          if (finalLane === targetLane) {
            combo++;
            let multiplier = 1 + Math.floor(combo / 5);
            score += 20 * multiplier;
            spawnParticles(finalLane * (width/3) + width/6, height - binHeight, 'correct');
            if (navigator.vibrate) navigator.vibrate(15);
          } else {
            combo = 0;
            score -= 10;
            shakeTime = 10;
            spawnParticles(finalLane * (width/3) + width/6, height - binHeight, 'incorrect');
            if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
          }
          
          packages.splice(i, 1);
        } else if (p.y > height) {
          packages.splice(i, 1);
        }
      }
      
      updateParticles(dt);
      
      document.getElementById('scoreDisplay').innerText = `${score} / ${THRESHOLD}`;
      let comboStr = combo > 2 ? `${combo}x COMBO!` : '';
      document.getElementById('comboDisplay').innerText = comboStr;
      document.getElementById('timeDisplay').innerText = `${Math.ceil(timeLeft)}s`;
      document.getElementById('timerBar').style.width = `${(timeLeft / gameTime) * 100}%`;
    }
    
    if (gameState === 'playing' || gameState === 'gameover') {
      drawBins(ctx);
      for (let p of packages) p.draw(ctx);
      drawParticles(ctx);
    }
    
    if (gameState === 'gameover' && score >= THRESHOLD) {
      drawMergeAnimation(ctx, dt);
    }
    
    if (shakeTime > 0) {
      ctx.restore();
    }
    
    requestAnimationFrame(loop);
  }

  function startGame() {
    gameState = 'playing';
    score = 0;
    combo = 0;
    timeLeft = gameTime;
    packages = [];
    particles = [];
    mergeParticles = [];
    spawnTimer = 0;
    activeTouch = null;
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('timerBarContainer').classList.remove('hidden');
  }

  function endGame() {
    gameState = 'gameover';
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('timerBarContainer').classList.add('hidden');
    
    let screen = document.getElementById('gameOverScreen');
    screen.classList.remove('hidden');
    
    let title = document.getElementById('gameOverTitle');
    let msg = document.getElementById('gameOverMsg');
    
    if (score >= THRESHOLD) {
      title.innerText = 'VOTE PASSED';
      msg.innerHTML = `Harmonious merge achieved!<br><br>Final Score: ${score}`;
      triggerMergeAnimation();
    } else {
      title.innerText = 'VOTE FAILED';
      msg.innerHTML = `The community rejected the packages.<br><br>Score: ${score} / ${THRESHOLD}`;
    }
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
