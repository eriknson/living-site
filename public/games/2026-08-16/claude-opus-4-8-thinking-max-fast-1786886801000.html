<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#04120d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef4f1" media="(prefers-color-scheme: light)">
<title>COLDWIRE — agent pipeline</title>
<style>
  :root{
    --bg0:#04120d; --bg1:#08201a;
    --text:#cdefe4; --muted:#7fae9f;
    --panel:rgba(6,26,20,0.55);
    --panel-solid:rgba(6,24,19,0.86);
    --line:rgba(96,228,182,0.28);
    --line-soft:rgba(96,228,182,0.14);
    --accent:#3df0c6;
    --amber:#ffb85a;
    --good:#5fe39a; --warn:#ffb85a; --bad:#ff5d6c;
    --shadow:rgba(61,240,198,0.35);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg0:#eef4f1; --bg1:#e0ebe7;
      --text:#123f37; --muted:#4f7d70;
      --panel:rgba(255,255,255,0.62);
      --panel-solid:rgba(248,252,250,0.92);
      --line:rgba(15,120,100,0.30);
      --line-soft:rgba(15,120,100,0.16);
      --accent:#0e9c86;
      --amber:#b96a12;
      --good:#178a4e; --warn:#b96a12; --bad:#d83b4c;
      --shadow:rgba(14,156,134,0.22);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; width:100%; overflow:hidden; background:var(--bg0); color:var(--text);
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;}
  #app{position:fixed; inset:0; width:100dvw; height:100dvh; overflow:hidden; touch-action:none;}
  canvas#game{position:absolute; inset:0; width:100%; height:100%; display:block;
    touch-action:none; user-select:none; -webkit-user-select:none;}

  /* ---------- HUD ---------- */
  #hud{position:absolute; top:0; left:0; right:0; z-index:5; pointer-events:none;
    padding:max(10px,env(safe-area-inset-top)) 14px 8px;
    display:flex; flex-direction:column; gap:8px;}
  .hudrow{display:flex; align-items:flex-start; gap:10px; justify-content:space-between; width:100%;}
  .stat{display:flex; flex-direction:column; line-height:1;}
  .stat .k{font-size:10px; letter-spacing:.18em; color:var(--muted); text-transform:uppercase; margin-bottom:4px;}
  .stat .v{font-size:22px; font-weight:600; letter-spacing:.02em; font-variant-numeric:tabular-nums;}
  #combo{color:var(--amber); font-size:12px; margin-top:3px; height:12px; opacity:0; transition:opacity .18s;}
  #hud .mid{display:flex; gap:16px; align-items:flex-start; justify-content:center;}
  #muteBtn{pointer-events:auto; width:44px; height:44px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    color:var(--text); cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font-size:16px; transition:transform .1s, border-color .2s;}
  #muteBtn:active{transform:scale(.92);}
  #barWrap{width:100%; pointer-events:none;}
  #barTrack{height:4px; border-radius:4px; background:var(--line-soft); overflow:hidden;}
  #barFill{height:100%; width:100%; border-radius:4px; background:var(--good);
    transition:background-color .25s; transform-origin:left center;}

  /* ---------- Overlays ---------- */
  .overlay{position:absolute; inset:0; z-index:20; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; gap:0;
    background:radial-gradient(120% 90% at 50% 42%, transparent 40%, rgba(2,10,8,0.55) 100%);
    transition:opacity .35s ease;}
  @media (prefers-color-scheme: light){
    .overlay{background:radial-gradient(120% 90% at 50% 42%, transparent 40%, rgba(190,210,204,0.55) 100%);}
  }
  .overlay.hidden{opacity:0; pointer-events:none !important; visibility:hidden;}
  .card{pointer-events:none; display:flex; flex-direction:column; align-items:center; max-width:440px; width:100%;}
  .kicker{font-size:11px; letter-spacing:.42em; color:var(--accent); text-transform:uppercase; margin-bottom:14px;}
  .title{font-size:clamp(40px,15vw,78px); font-weight:700; letter-spacing:.02em; margin:0; line-height:.92;
    text-shadow:0 0 30px var(--shadow);}
  .title .dim{color:var(--muted); font-weight:600;}
  .tag{font-size:13px; color:var(--muted); margin-top:16px; line-height:1.55; max-width:19em;}
  .tag b{color:var(--text); font-weight:600;}
  .hint{font-size:11px; color:var(--muted); margin-top:18px; letter-spacing:.08em; opacity:.85;}
  .btn{pointer-events:auto; margin-top:26px; min-height:54px; min-width:210px;
    padding:0 30px; border-radius:14px; cursor:pointer;
    font-family:inherit; font-size:16px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--bg0); background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 78%, #000 22%));
    border:1px solid var(--accent);
    box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 10px 34px -8px var(--shadow), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .12s ease, box-shadow .2s ease, filter .2s;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(2px) scale(.985);}
  .btn:focus-visible{outline:2px solid var(--text); outline-offset:3px;}
  .btn.ghost{color:var(--text); background:var(--panel); border:1px solid var(--line);
    box-shadow:none; letter-spacing:.14em;}

  /* game-over card specifics */
  #over .reason{font-size:15px; color:var(--text); margin-bottom:6px; min-height:1.2em;}
  #over .big{font-size:clamp(52px,20vw,96px); font-weight:700; line-height:.9; margin:6px 0 2px;
    font-variant-numeric:tabular-nums; text-shadow:0 0 26px var(--shadow);}
  #over .biglabel{font-size:11px; letter-spacing:.36em; color:var(--muted); text-transform:uppercase;}
  #over .stats{display:flex; gap:22px; margin-top:20px; justify-content:center; flex-wrap:wrap;}
  #over .stats .s{display:flex; flex-direction:column; align-items:center; gap:5px;}
  #over .stats .s .sv{font-size:20px; font-weight:600; font-variant-numeric:tabular-nums;}
  #over .stats .s .sk{font-size:9px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase;}
  #over .best{margin-top:16px; font-size:12px; color:var(--amber); letter-spacing:.06em; min-height:1em;}

  .fadeup{opacity:0; transform:translateY(10px); animation:fadeup .5s ease forwards;}
  @keyframes fadeup{to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .overlay,.btn,.fadeup,#muteBtn,#barFill{transition:none; animation:none;}
  }
  .nocanvas{max-width:420px; font-size:14px; color:var(--text); line-height:1.6;}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" aria-hidden="true">
    <div class="hudrow">
      <div class="stat">
        <span class="k">score</span>
        <span class="v" id="scoreV">0</span>
        <span id="combo">CHAIN ×2</span>
      </div>
      <div class="mid">
        <div class="stat" style="align-items:center">
          <span class="k">shipped</span>
          <span class="v" id="pipesV">0</span>
        </div>
        <div class="stat" style="align-items:center">
          <span class="k">nodes</span>
          <span class="v" id="nodesV">0</span>
        </div>
      </div>
      <button id="muteBtn" aria-label="Toggle sound">♪</button>
    </div>
    <div id="barWrap"><div id="barTrack"><div id="barFill"></div></div></div>
  </div>

  <!-- TITLE -->
  <div class="overlay" id="title">
    <div class="card">
      <div class="kicker fadeup">// coldwire</div>
      <h1 class="title fadeup" style="animation-delay:.05s">COLD<span class="dim">WIRE</span></h1>
      <p class="tag fadeup" style="animation-delay:.12s">
        Drag one unbroken wire through the pipeline —
        <b>trigger → actions → ship</b>. Feed each node before the
        signal fades. <b>Never cross your own line.</b>
      </p>
      <button class="btn fadeup" style="animation-delay:.18s" data-smoke="start" id="startBtn" aria-label="Start game">Connect</button>
      <div class="hint fadeup" style="animation-delay:.24s">press &amp; drag &nbsp;·&nbsp; keyboard: WASD / arrows</div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="over">
    <div class="card">
      <div class="reason" id="overReason">—</div>
      <div class="big" id="overScore">0</div>
      <div class="biglabel">score</div>
      <div class="stats">
        <div class="s"><span class="sv" id="overPipes">0</span><span class="sk">pipelines</span></div>
        <div class="s"><span class="sv" id="overNodes">0</span><span class="sk">nodes</span></div>
        <div class="s"><span class="sv" id="overTime">0s</span><span class="sk">uptime</span></div>
      </div>
      <div class="best" id="overBest"></div>
      <button class="btn" data-smoke="restart" id="restartBtn" aria-label="Play again">Rewire</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============================ helpers ============================ */
  var TAU = Math.PI * 2;
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function rand(a,b){ return a+Math.random()*(b-a); }
  function mm(q){ try{ return window.matchMedia && window.matchMedia(q).matches; }catch(e){ return false; } }
  function nowMs(){ return (window.performance && performance.now)? performance.now() : Date.now(); }
  function segDist2(px,py,ax,ay,bx,by){
    var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
    var t = l2>0 ? ((px-ax)*dx+(py-ay)*dy)/l2 : 0;
    t = t<0?0:(t>1?1:t);
    var cx=ax+t*dx, cy=ay+t*dy, ex=px-cx, ey=py-cy;
    return ex*ex+ey*ey;
  }
  function hexA(hex,a){
    // #rrggbb -> rgba
    if(hex.charAt(0)!=='#'||hex.length<7) return hex;
    var r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }
  var REDUCED = mm('(prefers-reduced-motion: reduce)');

  /* ============================ theme ============================ */
  var THEME_DARK = {
    bg0:'#04120d', bg1:'#0a2019',
    grid:'rgba(84,214,170,0.06)', grid2:'rgba(96,232,186,0.11)',
    fog:'#96d6c8', fogA:0.05,
    dash:'#78d2ba',
    wire:'#3df0c6', wireHot:'#c9fff0', wireGlow:'rgba(61,240,198,0.30)',
    head:'#eafff9', headGlow:'rgba(180,255,240,0.6)',
    shortcut:'#57b6ff', action:'#5fe39a', cli:'#ffb85a',
    hazard:'#ff5d6c',
    text:'#cdefe4', dim:'#7fae9f',
    good:'#5fe39a', warn:'#ffb85a', bad:'#ff5d6c',
    flashHit:'#ffffff', flashBad:'#ff5d6c', flashCli:'#ffd79a'
  };
  var THEME_LIGHT = {
    bg0:'#eef4f1', bg1:'#dde9e4',
    grid:'rgba(15,120,100,0.09)', grid2:'rgba(15,130,110,0.17)',
    fog:'#78a096', fogA:0.06,
    dash:'#147864',
    wire:'#0e9c86', wireHot:'#0a5f52', wireGlow:'rgba(14,156,134,0.22)',
    head:'#0b3b32', headGlow:'rgba(14,120,100,0.4)',
    shortcut:'#1f77c9', action:'#178a4e', cli:'#c0761b',
    hazard:'#d83b4c',
    text:'#123f37', dim:'#4f7d70',
    good:'#178a4e', warn:'#b96a12', bad:'#d83b4c',
    flashHit:'#ffffff', flashBad:'#d83b4c', flashCli:'#e8b878'
  };
  var DARK = mm('(prefers-color-scheme: dark)') || !mm('(prefers-color-scheme: light)');
  function TH(){ return DARK ? THEME_DARK : THEME_LIGHT; }
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function(e){ DARK = e.matches; };
    if(mq.addEventListener) mq.addEventListener('change', onScheme);
    else if(mq.addListener) mq.addListener(onScheme);
  }catch(e){}

  /* ============================ canvas ============================ */
  var canvas = document.getElementById('game');
  var ctx = null;
  try{ ctx = canvas.getContext('2d'); }catch(e){ ctx = null; }
  var app = document.getElementById('app');

  if(!ctx){
    // graceful fallback: no crash, buttons still exist
    var t = document.getElementById('title');
    if(t){ var c=t.querySelector('.card'); if(c){ var d=document.createElement('div'); d.className='nocanvas';
      d.textContent='Canvas 2D is unavailable in this browser, so the game can\u2019t render.'; c.insertBefore(d, c.children[3]||null);} }
  }

  var DPR=1, W=0, H=0;
  var arena = {x:0,y:0,w:0,h:0};
  var S = {}; // scaled sizes

  function computeSizes(){
    var u = Math.min(arena.w, arena.h);
    S.unit = u;
    S.nodeR   = clamp(u*0.062, 22, 44);
    S.headR   = Math.max(5, u*0.013);
    S.hitR    = Math.max(7, u*0.016);
    S.safeGap = u*0.10;
    S.minPush = Math.max(2, u*0.006);
    S.speed0  = u*1.7;
    S.offset  = u*0.075;            // touch head lift above finger
    S.hazR    = Math.max(9, u*0.030);
    S.spawnInset = S.nodeR + u*0.02;
  }
  function resize(){
    if(!ctx) return;
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = app.clientWidth || window.innerWidth;
    H = app.clientHeight || window.innerHeight;
    canvas.width  = Math.max(1, Math.round(W*DPR));
    canvas.height = Math.max(1, Math.round(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
    var hud = document.getElementById('hud');
    var top = 66;
    try{ var r=hud.getBoundingClientRect(); top = Math.max(58, r.height + 20); }catch(e){}
    var padX = Math.max(8, W*0.03), padB = Math.max(10, H*0.02);
    arena.x = padX; arena.y = top;
    arena.w = W - padX*2; arena.h = H - top - padB;
    computeSizes();
    // keep head + nodes inside after rotate
    if(G.head){ G.head.x=clamp(G.head.x, arena.x+S.headR, arena.x+arena.w-S.headR);
                G.head.y=clamp(G.head.y, arena.y+S.headR, arena.y+arena.h-S.headR); }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });

  /* ============================ audio ============================ */
  var AC=null, master=null, muted=false;
  function initAudio(){
    if(AC || muted) return;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      AC = new Ctx();
      master = AC.createGain(); master.gain.value=0.85; master.connect(AC.destination);
    }catch(e){ AC=null; }
  }
  function resumeAudio(){ try{ if(AC && AC.state==='suspended') AC.resume(); }catch(e){} }
  function tone(freq, dur, type, vol, slideTo){
    if(!AC || muted || !master) return;
    try{
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine'; o.frequency.value=freq;
      var t0=AC.currentTime;
      if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
      g.gain.value=0; g.gain.linearRampToValueAtTime((vol||0.2), t0+0.008);
      g.gain.exponentialRampToValueAtTime(0.0007, t0+dur);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
    }catch(e){}
  }
  function noise(dur, vol){
    if(!AC || muted || !master) return;
    try{
      var n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
      var src=AC.createBufferSource(); src.buffer=buf;
      var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=0.8;
      var g=AC.createGain(); g.gain.value=vol||0.3;
      src.connect(f); f.connect(g); g.connect(master); src.start();
    }catch(e){}
  }
  function sConnect(combo){ tone(520+Math.min(combo,8)*60, 0.14, 'triangle', 0.16, 720+Math.min(combo,8)*90); }
  function sShip(){ tone(392,0.16,'triangle',0.16,523); setTimeout(function(){tone(659,0.22,'triangle',0.16,784);},70); setTimeout(function(){tone(988,0.3,'sine',0.12);},150); }
  function sShort(){ tone(300,0.1,'sine',0.13,440); }
  function sCrash(){ noise(0.4,0.35); tone(180,0.4,'sawtooth',0.14,60); }
  function sFade(){ tone(300,0.5,'sine',0.12,120); }
  function vibe(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

  /* ============================ input ============================ */
  var pointer = { active:false, x:0, y:0, tx:0, ty:0, type:'mouse' };
  var dragging = false;
  var keys = {};
  var usingKeys = false;

  function toCanvas(clientX, clientY){
    var r = canvas.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  }
  function setPointer(e){
    var p = toCanvas(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y;
    pointer.type = e.pointerType || 'mouse';
    var off = (pointer.type==='touch') ? S.offset : 0;
    pointer.tx = p.x;
    pointer.ty = p.y - off;
    pointer.active = true;
    usingKeys = false;
  }
  canvas.addEventListener('pointerdown', function(e){
    if(e.isPrimary===false) return;
    dragging = true;
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    setPointer(e);
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  window.addEventListener('pointermove', function(e){
    if(!dragging) return;
    setPointer(e);
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  function endPointer(){ dragging=false; pointer.active=false; }
  window.addEventListener('pointerup', function(e){ if(dragging){ endPointer(); } });
  window.addEventListener('pointercancel', function(){ endPointer(); });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  var KEYMAP = {ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'};
  window.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===' '){
      if(state==='title'){ e.preventDefault(); startGame(); return; }
      if(state==='over'){ e.preventDefault(); startGame(); return; }
    }
    var k = KEYMAP[e.key];
    if(k){ keys[k]=true; usingKeys=true; pointer.active=false; if(e.cancelable) e.preventDefault(); }
  });
  window.addEventListener('keyup', function(e){ var k=KEYMAP[e.key]; if(k) keys[k]=false; });

  /* ============================ game state ============================ */
  var state = 'title'; // title | playing | over
  var T = 0;           // global clock (s)
  var sessionBest = 0;

  var G = {
    head:{x:0,y:0}, trail:[], trailLen:0,
    signal:1, grace:0,
    score:0, nodes:0, pipelines:0,
    combo:1, lastConnect:-99,
    queue:[], genPipes:0, actionsLeft:0,
    cur:null, nxt:null,
    hazards:[], particles:[], rings:[], floats:[],
    shake:0, shakeX:0, shakeY:0,
    flash:0, flashColor:'#fff',
    hitStop:0, banner:null,
    startClock:0, dead:false, firstShipDone:false
  };

  function actionsForPipe(p){ return clamp(2 + Math.floor(p/2), 2, 6); }
  function decayRate(){ return Math.min(0.42, 0.145 + G.pipelines*0.028); }
  function comboWindow(){ return Math.max(1.4, 2.5 - G.pipelines*0.09); }
  function maxLen(){ return S.unit * Math.min(1.95, 1.05 + G.pipelines*0.05); }
  function headSpeed(){ return S.speed0 * Math.min(1.5, 1 + G.pipelines*0.03); }
  function hazTargetCount(){ return G.pipelines<1 ? 0 : Math.min(5, G.pipelines); }

  function ensureQueue(){
    while(G.queue.length < 4){
      var need = actionsForPipe(G.genPipes);
      for(var i=0;i<need;i++) G.queue.push('action');
      G.queue.push('cli');
      G.queue.push('shortcut');
      G.genPipes++;
    }
  }
  function nearTrail(x,y,rad){
    var r2=rad*rad, tr=G.trail;
    for(var i=1;i<tr.length;i++){
      if(segDist2(x,y,tr[i-1].x,tr[i-1].y,tr[i].x,tr[i].y) < r2) return true;
    }
    return false;
  }
  function nearHaz(x,y,rad){
    for(var i=0;i<G.hazards.length;i++){
      var h=G.hazards[i], dx=h.x-x, dy=h.y-y;
      if(dx*dx+dy*dy < rad*rad) return true;
    }
    return false;
  }
  function spawnPos(){
    var x0=arena.x+S.spawnInset, x1=arena.x+arena.w-S.spawnInset;
    var y0=arena.y+S.spawnInset, y1=arena.y+arena.h-S.spawnInset - (S.offset*0.6);
    var minFromHead = S.unit*0.30, minSep = S.unit*0.24;
    var fx=(x0+x1)/2, fy=(y0+y1)/2;
    for(var i=0;i<48;i++){
      var relax = i>32;
      var x=rand(x0,x1), y=rand(y0,y1);
      var dh=Math.hypot(x-G.head.x, y-G.head.y);
      if(dh < minFromHead) continue;
      if(G.cur && Math.hypot(x-G.cur.x,y-G.cur.y) < minSep) continue;
      if(!relax && nearTrail(x,y, S.unit*0.055)) continue;
      if(!relax && nearHaz(x,y, S.unit*0.10)) continue;
      return {x:x,y:y};
    }
    return {x:fx,y:fy};
  }
  function makeNode(type){
    var p=spawnPos();
    return { type:type, x:p.x, y:p.y, r:S.nodeR, born:T, seed:rand(0,TAU) };
  }

  function resetGame(){
    G.head.x = arena.x + arena.w*0.5;
    G.head.y = arena.y + arena.h*0.62;
    G.trail = [{x:G.head.x, y:G.head.y}];
    G.trailLen = 0;
    G.signal = 1; G.grace = 1.0;
    G.score=0; G.nodes=0; G.pipelines=0;
    G.combo=1; G.lastConnect=-99;
    G.queue=[]; G.genPipes=0;
    ensureQueue();
    G.cur = makeNode(G.queue.shift());
    G.nxt = makeNode(G.queue.shift());
    G.hazards=[]; G.particles=[]; G.rings=[]; G.floats=[];
    G.shake=0; G.shakeX=0; G.shakeY=0; G.flash=0; G.hitStop=0; G.banner=null;
    G.startClock=T; G.dead=false; G.firstShipDone=false;
  }

  /* ============================ effects ============================ */
  function addParticles(x,y,color,n,spd,life){
    if(REDUCED) n=Math.min(n,6);
    for(var i=0;i<n;i++){
      if(G.particles.length>220) break;
      var a=rand(0,TAU), s=rand(spd*0.3,spd);
      G.particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        life:life||0.6, max:life||0.6, color:color, r:rand(1.2,2.8)});
    }
  }
  function addRing(x,y,r0,r1,color,life){
    if(REDUCED && G.rings.length>3) return;
    G.rings.push({x:x,y:y,r:r0,r1:r1,life:life||0.5,max:life||0.5,color:color});
  }
  function addFloat(x,y,text,color){
    G.floats.push({x:x,y:y,text:text,color:color,life:0.9,max:0.9});
  }
  function addBanner(text,sub,color){
    G.banner={text:text,sub:sub||'',color:color,life:1.6,max:1.6};
  }
  function shakeAdd(v){ if(REDUCED) v*=0.3; G.shake=Math.max(G.shake,v); }
  function flashAdd(v,color){ if(REDUCED) v*=0.4; G.flash=Math.max(G.flash,v); G.flashColor=color; }

  function updateEffects(dt){
    var i;
    for(i=G.particles.length-1;i>=0;i--){
      var p=G.particles[i];
      p.life-=dt; if(p.life<=0){ G.particles.splice(i,1); continue; }
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.vy+=S.unit*0.12*dt;
    }
    for(i=G.rings.length-1;i>=0;i--){
      var rg=G.rings[i]; rg.life-=dt; if(rg.life<=0){ G.rings.splice(i,1); }
    }
    for(i=G.floats.length-1;i>=0;i--){
      var f=G.floats[i]; f.life-=dt; f.y-=S.unit*0.10*dt; if(f.life<=0){ G.floats.splice(i,1); }
    }
    if(G.banner){ G.banner.life-=dt; if(G.banner.life<=0) G.banner=null; }
    if(G.shake>0){ G.shake=Math.max(0,G.shake-dt*2.4);
      var m=G.shake*S.unit*0.05; G.shakeX=rand(-m,m); G.shakeY=rand(-m,m); }
    else { G.shakeX=0; G.shakeY=0; }
    if(G.flash>0) G.flash=Math.max(0,G.flash-dt*2.2);
  }

  /* ============================ update ============================ */
  function moveHead(dt){
    var tx, ty, moving=false;
    if(pointer.active){
      tx=clamp(pointer.tx, arena.x+S.headR, arena.x+arena.w-S.headR);
      ty=clamp(pointer.ty, arena.y+S.headR, arena.y+arena.h-S.headR);
      var dx=tx-G.head.x, dy=ty-G.head.y, d=Math.hypot(dx,dy);
      if(d>0.001){
        var step=Math.min(headSpeed()*dt, d);
        G.head.x+=dx/d*step; G.head.y+=dy/d*step; moving = step>0.01;
      }
    } else if(usingKeys){
      var vx=(keys.r?1:0)-(keys.l?1:0), vy=(keys.d?1:0)-(keys.u?1:0);
      if(vx||vy){
        var m=Math.hypot(vx,vy); vx/=m; vy/=m;
        G.head.x+=vx*headSpeed()*dt; G.head.y+=vy*headSpeed()*dt; moving=true;
      }
    }
    G.head.x=clamp(G.head.x, arena.x+S.headR, arena.x+arena.w-S.headR);
    G.head.y=clamp(G.head.y, arena.y+S.headR, arena.y+arena.h-S.headR);
    return moving;
  }
  function recordTrail(){
    var tr=G.trail, last=tr[tr.length-1];
    var dx=G.head.x-last.x, dy=G.head.y-last.y, d=Math.hypot(dx,dy);
    if(d>=S.minPush){
      tr.push({x:G.head.x,y:G.head.y});
      G.trailLen+=d;
      var ml=maxLen();
      while(G.trailLen>ml && tr.length>2){
        var a=tr[0], b=tr[1];
        G.trailLen-=Math.hypot(b.x-a.x,b.y-a.y);
        tr.shift();
      }
    }
  }
  function checkSelfCollision(){
    var tr=G.trail, n=tr.length;
    if(n<4) return false;
    var acc=0, hr2=S.hitR*S.hitR, gap=S.safeGap;
    for(var i=n-1;i>0;i--){
      var ax=tr[i].x, ay=tr[i].y, bx=tr[i-1].x, by=tr[i-1].y;
      if(acc>gap){
        if(segDist2(G.head.x,G.head.y,ax,ay,bx,by) < hr2){ return true; }
      }
      acc+=Math.hypot(ax-bx,ay-by);
    }
    return false;
  }

  function connect(node){
    var th=TH();
    var c=node.type;
    if(T-G.lastConnect < comboWindow()) G.combo=Math.min(9,G.combo+1); else G.combo=1;
    G.lastConnect=T;
    var col = c==='shortcut'?th.shortcut : c==='cli'?th.cli : th.action;
    var pts=0;
    G.nodes++;
    if(c==='action'){
      pts = 10*G.combo;
      G.signal=Math.min(1, G.signal+0.34);
      addParticles(node.x,node.y,col,14,S.unit*1.6,0.55);
      addRing(node.x,node.y,node.r*0.6,node.r*1.9,col,0.5);
      sConnect(G.combo); vibe(12);
      G.hitStop=Math.max(G.hitStop,0.03);
      shakeAdd(0.35);
    } else if(c==='shortcut'){
      pts = 8*G.combo;
      G.signal=Math.min(1, G.signal+0.30);
      addParticles(node.x,node.y,col,12,S.unit*1.5,0.5);
      addRing(node.x,node.y,node.r*0.6,node.r*1.8,col,0.5);
      sShort(); vibe(10);
      G.hitStop=Math.max(G.hitStop,0.03);
      shakeAdd(0.3);
    } else { // cli => pipeline shipped
      pts = 60*G.combo + Math.floor(G.signal*40);
      G.signal=1;
      G.pipelines++;
      addParticles(node.x,node.y,col,34,S.unit*2.4,0.8);
      addParticles(node.x,node.y,th.wireHot,18,S.unit*1.8,0.7);
      addRing(node.x,node.y,node.r*0.6,node.r*3.4,col,0.7);
      addRing(node.x,node.y,node.r*0.6,node.r*2.4,th.wireHot,0.6);
      flashAdd(0.5, th.flashCli);
      shakeAdd(0.9); G.hitStop=Math.max(G.hitStop,0.07);
      sShip();
      if(!G.firstShipDone){ G.firstShipDone=true; addBanner('PIPELINE ONLINE','first ship — signal green',th.cli); vibe([16,40,16,40,50]); }
      else { addBanner('SHIPPED ×'+G.pipelines, '', th.cli); vibe([12,30,40]); }
      syncHazards();
    }
    G.score+=pts;
    addFloat(node.x, node.y-node.r*0.9, '+'+pts, col);
    // advance
    G.cur=G.nxt;
    ensureQueue();
    G.nxt=makeNode(G.queue.shift());
  }

  function syncHazards(){
    var want=hazTargetCount();
    while(G.hazards.length<want){
      var p, tries=0;
      do{ p={x:rand(arena.x+S.hazR,arena.x+arena.w-S.hazR), y:rand(arena.y+S.hazR,arena.y+arena.h-S.hazR)}; tries++; }
      while(tries<30 && Math.hypot(p.x-G.head.x,p.y-G.head.y) < S.unit*0.36);
      var a=rand(0,TAU), sp=S.unit*(0.10+0.028*G.pipelines);
      sp=Math.min(sp, S.unit*0.34);
      G.hazards.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:S.hazR,seed:rand(0,TAU),born:T});
      addRing(p.x,p.y,S.hazR*0.5,S.hazR*3,TH().hazard,0.6);
    }
  }
  function updateHazards(dt){
    for(var i=0;i<G.hazards.length;i++){
      var h=G.hazards[i];
      h.x+=h.vx*dt; h.y+=h.vy*dt;
      if(h.x<arena.x+h.r){ h.x=arena.x+h.r; h.vx=Math.abs(h.vx); }
      if(h.x>arena.x+arena.w-h.r){ h.x=arena.x+arena.w-h.r; h.vx=-Math.abs(h.vx); }
      if(h.y<arena.y+h.r){ h.y=arena.y+h.r; h.vy=Math.abs(h.vy); }
      if(h.y>arena.y+arena.h-h.r){ h.y=arena.y+arena.h-h.r; h.vy=-Math.abs(h.vy); }
    }
  }
  function checkHazards(){
    var rr=(S.hitR+S.hazR*0.82);
    rr*=rr;
    for(var i=0;i<G.hazards.length;i++){
      var h=G.hazards[i], dx=h.x-G.head.x, dy=h.y-G.head.y;
      if(dx*dx+dy*dy<rr){ return true; }
    }
    return false;
  }

  function gameOver(reason, kind){
    if(state!=='playing') return;
    state='over'; G.dead=true;
    var th=TH();
    if(kind==='crash'){
      addParticles(G.head.x,G.head.y,th.bad,40,S.unit*3.2,0.9);
      addParticles(G.head.x,G.head.y,th.wireHot,16,S.unit*2,0.7);
      addRing(G.head.x,G.head.y,S.headR,S.unit*0.5,th.bad,0.7);
      flashAdd(0.6, th.flashBad); shakeAdd(1.4);
      sCrash(); vibe([40,60,120]);
    } else {
      addParticles(G.head.x,G.head.y,th.warn,14,S.unit*1.4,0.7);
      flashAdd(0.3, th.flashBad); shakeAdd(0.5);
      sFade(); vibe([20,40]);
    }
    if(G.score>sessionBest) sessionBest=G.score;
    showOver(reason);
  }

  function update(dt){
    T += dt;
    if(state!=='playing'){ updateEffects(dt); return; }
    if(G.hitStop>0){ G.hitStop-=dt; updateEffects(dt); return; }

    if(G.grace>0) G.grace-=dt;
    var moved = moveHead(dt);
    if(moved && G.grace>0) G.grace=0; // start decay once you move
    recordTrail();

    if(checkSelfCollision()){ gameOver('Crossed wires. Short circuit.', 'crash'); updateEffects(dt); return; }

    updateHazards(dt);
    if(checkHazards()){ gameOver('A merge conflict hit the wire.', 'crash'); updateEffects(dt); return; }

    // connect?
    if(G.cur){
      var dx=G.cur.x-G.head.x, dy=G.cur.y-G.head.y, rr=G.cur.r*0.86;
      if(dx*dx+dy*dy < rr*rr){ connect(G.cur); }
    }

    if(G.grace<=0){ G.signal -= decayRate()*dt; }
    if(G.signal<=0){ G.signal=0; gameOver('The signal faded out.', 'fade'); updateEffects(dt); return; }

    if(G.combo>1 && T-G.lastConnect>comboWindow()) G.combo=1;

    updateEffects(dt);
  }

  /* ============================ render ============================ */
  function glow(color,blur){ ctx.shadowColor=color; ctx.shadowBlur=blur*(DARK?1:0.55); }
  function noGlow(){ ctx.shadowBlur=0; }
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawBackground(){
    var th=TH();
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, th.bg0); g.addColorStop(1, th.bg1);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // fog wisps
    ctx.save();
    for(var i=0;i<4;i++){
      var fx=(W*0.5) + Math.sin(T*0.06+i*1.7)*W*0.42;
      var fy=(H*0.5) + Math.cos(T*0.05+i*2.3)*H*0.42;
      var fr=S.unit*(0.7+0.25*Math.sin(T*0.1+i));
      var rg=ctx.createRadialGradient(fx,fy,0,fx,fy,fr);
      rg.addColorStop(0, hexA(th.fog, th.fogA));
      rg.addColorStop(1, hexA(th.fog, 0));
      ctx.fillStyle=rg; ctx.fillRect(fx-fr,fy-fr,fr*2,fr*2);
    }
    ctx.restore();

    // grid inside arena
    var step=Math.max(26, S.unit*0.11);
    var ox=(T*6)% step, oy=(T*4)%step;
    ctx.lineWidth=1;
    ctx.strokeStyle=th.grid;
    ctx.beginPath();
    for(var x=arena.x-ox; x<=arena.x+arena.w; x+=step){ ctx.moveTo(x,arena.y); ctx.lineTo(x,arena.y+arena.h); }
    for(var y=arena.y-oy; y<=arena.y+arena.h; y+=step){ ctx.moveTo(arena.x,y); ctx.lineTo(arena.x+arena.w,y); }
    ctx.stroke();
    // brighter major lines
    ctx.strokeStyle=th.grid2;
    ctx.beginPath();
    var big=step*4;
    for(var x2=arena.x-((T*6)%big); x2<=arena.x+arena.w; x2+=big){ ctx.moveTo(x2,arena.y); ctx.lineTo(x2,arena.y+arena.h); }
    for(var y2=arena.y-((T*4)%big); y2<=arena.y+arena.h; y2+=big){ ctx.moveTo(arena.x,y2); ctx.lineTo(arena.x+arena.w,y2); }
    ctx.stroke();

    // faint "nested dashboards" in corners
    ctx.save();
    ctx.globalAlpha=DARK?0.5:0.4;
    drawDashPanel(arena.x+6, arena.y+6, S.unit*0.34, S.unit*0.2);
    drawDashPanel(arena.x+arena.w-6-S.unit*0.3, arena.y+arena.h-6-S.unit*0.22, S.unit*0.3, S.unit*0.22);
    ctx.restore();

    // arena border
    ctx.strokeStyle=th.grid2; ctx.lineWidth=1.5;
    rr(arena.x,arena.y,arena.w,arena.h, Math.min(18,S.unit*0.04)); ctx.stroke();
  }
  function drawDashPanel(x,y,w,h){
    var th=TH();
    ctx.strokeStyle=hexA(th.dash,0.5); ctx.lineWidth=1;
    rr(x,y,w,h,6); ctx.stroke();
    ctx.strokeStyle=hexA(th.dash,0.35);
    ctx.beginPath(); ctx.moveTo(x+6,y+h*0.34); ctx.lineTo(x+w-6,y+h*0.34); ctx.stroke();
    var rows=3;
    for(var i=0;i<rows;i++){
      var yy=y+h*0.5+i*(h*0.16);
      var ww=(w-12)*(0.4+0.5*((Math.sin(T*0.7+i)+1)/2));
      ctx.beginPath(); ctx.moveTo(x+6,yy); ctx.lineTo(x+6+ww,yy); ctx.stroke();
    }
    // blinking cursor
    if(Math.sin(T*4)>0){ ctx.fillStyle=hexA(th.dash,0.6); ctx.fillRect(x+w-10,y+6,4,6); }
  }

  function drawTrail(){
    var tr=G.trail; if(tr.length<2) return;
    var th=TH(); var sig=clamp(G.signal,0.12,1);
    ctx.lineJoin='round'; ctx.lineCap='round';
    var n=tr.length, i;
    // glow underlay
    ctx.strokeStyle=th.wireGlow; ctx.lineWidth=S.headR*3.0;
    glow(th.wire, 16);
    ctx.beginPath(); ctx.moveTo(tr[0].x,tr[0].y);
    for(i=1;i<n;i++) ctx.lineTo(tr[i].x,tr[i].y);
    ctx.stroke();
    noGlow();
    // core gradient (tail dim -> head hot)
    var tail=tr[0], head=tr[n-1];
    var grad=ctx.createLinearGradient(tail.x,tail.y,head.x,head.y);
    grad.addColorStop(0, hexA(th.wire,0.02));
    grad.addColorStop(0.45, hexA(th.wire, 0.55*sig));
    grad.addColorStop(1, hexA(th.wireHot, 0.98*sig));
    ctx.strokeStyle=grad; ctx.lineWidth=S.headR*1.15;
    ctx.beginPath(); ctx.moveTo(tr[0].x,tr[0].y);
    for(i=1;i<n;i++) ctx.lineTo(tr[i].x,tr[i].y);
    ctx.stroke();
    // flowing data dashes
    ctx.setLineDash([S.unit*0.018, S.unit*0.05]);
    ctx.lineDashOffset = -(T*S.unit*0.9)%100000;
    ctx.strokeStyle=hexA(th.wireHot, 0.55*sig); ctx.lineWidth=S.headR*0.5;
    ctx.beginPath(); ctx.moveTo(tr[0].x,tr[0].y);
    for(i=1;i<n;i++) ctx.lineTo(tr[i].x,tr[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function nodeShape(type,x,y,r){
    if(type==='action'){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.closePath(); }
    else if(type==='cli'){ rr(x-r*1.15,y-r*0.82, r*2.3, r*1.64, r*0.34); }
    else { rr(x-r*0.9,y-r*0.9, r*1.8, r*1.8, r*0.42); }
  }
  function drawGlyph(type,x,y,r,col){
    noGlow();
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=Math.max(1.5,r*0.09);
    ctx.lineJoin='round'; ctx.lineCap='round';
    if(type==='shortcut'){
      // lightning bolt
      var k=r*0.62;
      ctx.beginPath();
      ctx.moveTo(x+0.12*k, y-0.62*k);
      ctx.lineTo(x-0.34*k, y+0.06*k);
      ctx.lineTo(x-0.02*k, y+0.06*k);
      ctx.lineTo(x-0.12*k, y+0.62*k);
      ctx.lineTo(x+0.36*k, y-0.14*k);
      ctx.lineTo(x+0.04*k, y-0.14*k);
      ctx.closePath(); ctx.fill();
    } else if(type==='action'){
      // spinner arc + play triangle
      var k2=r*0.6;
      ctx.beginPath(); ctx.arc(x,y,k2, -0.4+T*2.4, 1.9+T*2.4); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x-0.22*r, y-0.30*r);
      ctx.lineTo(x+0.30*r, y);
      ctx.lineTo(x-0.22*r, y+0.30*r);
      ctx.closePath(); ctx.fill();
    } else { // cli: >_
      var k3=r*0.5;
      ctx.beginPath();
      ctx.moveTo(x-0.5*r, y-0.34*r);
      ctx.lineTo(x-0.5*r+0.5*k3, y);
      ctx.lineTo(x-0.5*r, y+0.34*r);
      ctx.stroke();
      // underscore blink
      if(Math.sin(T*5)>-0.3){ ctx.beginPath(); ctx.moveTo(x+0.06*r,y+0.34*r); ctx.lineTo(x+0.5*r,y+0.34*r); ctx.stroke(); }
    }
  }
  function drawNode(n, isCur){
    var th=TH();
    var col = n.type==='shortcut'?th.shortcut : n.type==='cli'?th.cli : th.action;
    var pulse = isCur ? (0.5+0.5*Math.sin(T*4+n.seed)) : 0;
    var r = n.r*(isCur? (1+0.05*pulse) : 0.8);
    ctx.save();
    if(isCur){
      // rotating dashed halo
      ctx.globalAlpha=0.6;
      ctx.strokeStyle=hexA(col,0.7); ctx.lineWidth=2;
      ctx.setLineDash([r*0.5, r*0.5]); ctx.lineDashOffset=-T*r*1.2;
      glow(col,14);
      ctx.beginPath(); ctx.arc(n.x,n.y,r*1.55,0,TAU); ctx.stroke();
      ctx.setLineDash([]); noGlow();
      ctx.globalAlpha=0.18+0.14*pulse;
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(n.x,n.y,r*1.5,0,TAU); ctx.fill();
    }
    ctx.globalAlpha= isCur?1:0.5;
    glow(col, isCur?14:5);
    ctx.fillStyle=hexA(col, DARK?0.16:0.14);
    ctx.strokeStyle=col; ctx.lineWidth=isCur?2.4:1.8;
    nodeShape(n.type,n.x,n.y,r); ctx.fill(); ctx.stroke();
    noGlow();
    drawGlyph(n.type,n.x,n.y,r,col);
    ctx.restore();

    if(isCur && !G.firstShipDone){
      ctx.save();
      ctx.globalAlpha=0.8;
      ctx.fillStyle=th.dim; ctx.font='600 '+Math.round(S.unit*0.032)+'px ui-monospace,monospace';
      ctx.textAlign='center'; ctx.textBaseline='top';
      var label = n.type==='cli'?'SHIP':(n.type==='shortcut'?'TRIGGER':'ACTION');
      ctx.fillText(label, n.x, n.y+r*1.7);
      ctx.restore();
    }
  }

  function drawGuide(){
    if(!G.cur) return;
    var th=TH();
    ctx.save();
    ctx.globalAlpha=0.28;
    ctx.strokeStyle=hexA(th.wire,0.5); ctx.lineWidth=1.4;
    ctx.setLineDash([3, S.unit*0.03]); ctx.lineDashOffset=-T*S.unit*0.4;
    ctx.beginPath(); ctx.moveTo(G.head.x,G.head.y); ctx.lineTo(G.cur.x,G.cur.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawHazards(){
    var th=TH();
    for(var i=0;i<G.hazards.length;i++){
      var h=G.hazards[i];
      var pl=0.5+0.5*Math.sin(T*6+h.seed);
      ctx.save();
      ctx.translate(h.x,h.y); ctx.rotate(T*1.4+h.seed);
      glow(th.hazard, 14);
      ctx.strokeStyle=th.hazard; ctx.fillStyle=hexA(th.hazard, DARK?0.18:0.14);
      ctx.lineWidth=2;
      // jagged warning shape
      var spikes=4, R=h.r*(1+0.06*pl);
      ctx.beginPath();
      for(var s=0;s<spikes*2;s++){
        var ang=(s/(spikes*2))*TAU;
        var rad=(s%2===0)? R : R*0.5;
        var px=Math.cos(ang)*rad, py=Math.sin(ang)*rad;
        if(s===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      noGlow();
      // exclamation
      ctx.rotate(-(T*1.4+h.seed));
      ctx.fillStyle=th.hazard;
      ctx.fillRect(-h.r*0.08, -h.r*0.42, h.r*0.16, h.r*0.48);
      ctx.beginPath(); ctx.arc(0, h.r*0.34, h.r*0.11, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  function drawHead(){
    var th=TH();
    var sig=clamp(G.signal,0,1);
    var ringCol = sig>0.5?th.good : sig>0.25?th.warn : th.bad;
    var hx=G.head.x, hy=G.head.y, r=S.headR;
    // charge ring
    ctx.save();
    ctx.lineCap='round';
    ctx.strokeStyle=hexA(ringCol,0.25); ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hx,hy,r*2.4,0,TAU); ctx.stroke();
    glow(ringCol,10);
    ctx.strokeStyle=ringCol; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hx,hy,r*2.4, -Math.PI/2, -Math.PI/2 + sig*TAU); ctx.stroke();
    noGlow();
    // idle prompt pulse when not moving & playing
    if(state==='playing' && !pointer.active && !usingKeys){
      var pp=0.5+0.5*Math.sin(T*5);
      ctx.globalAlpha=0.4*pp; ctx.strokeStyle=th.head; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(hx,hy, r*3.2+pp*r, 0, TAU); ctx.stroke();
      ctx.globalAlpha=1;
    }
    // head core
    glow(th.head, 18);
    ctx.fillStyle=th.head;
    ctx.beginPath(); ctx.arc(hx,hy,r,0,TAU); ctx.fill();
    ctx.globalAlpha=0.6; ctx.beginPath(); ctx.arc(hx,hy,r*0.5,0,TAU); ctx.fillStyle=th.wireHot; ctx.fill();
    noGlow();
    ctx.restore();
  }

  function drawParticles(){
    for(var i=0;i<G.particles.length;i++){
      var p=G.particles[i], a=clamp(p.life/p.max,0,1);
      ctx.globalAlpha=a;
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.4+a*0.8),0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
    for(var j=0;j<G.rings.length;j++){
      var rg=G.rings[j], t=1-rg.life/rg.max;
      ctx.globalAlpha=(1-t)*0.9;
      ctx.strokeStyle=rg.color; ctx.lineWidth=2.5*(1-t)+0.6;
      ctx.beginPath(); ctx.arc(rg.x,rg.y, lerp(rg.r,rg.r1,t), 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  function drawFloats(){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var i=0;i<G.floats.length;i++){
      var f=G.floats[i], a=clamp(f.life/f.max,0,1);
      ctx.globalAlpha=a;
      ctx.fillStyle=f.color;
      ctx.font='700 '+Math.round(S.unit*0.042)+'px ui-monospace,monospace';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha=1;
  }
  function drawBanner(){
    if(!G.banner) return;
    var b=G.banner, th=TH();
    var t=1-b.life/b.max;
    var a = t<0.15 ? t/0.15 : (t>0.75 ? (1-t)/0.25 : 1);
    a=clamp(a,0,1);
    var sc = 0.9+0.15*(t<0.2?t/0.2:1);
    ctx.save();
    ctx.globalAlpha=a;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    var cx=W/2, cy=arena.y+arena.h*0.34;
    glow(b.color,20);
    ctx.fillStyle=b.color;
    ctx.font='700 '+Math.round(S.unit*0.085*sc)+'px ui-monospace,monospace';
    ctx.fillText(b.text, cx, cy);
    noGlow();
    if(b.sub){
      ctx.globalAlpha=a*0.85;
      ctx.fillStyle=th.dim;
      ctx.font='600 '+Math.round(S.unit*0.03)+'px ui-monospace,monospace';
      ctx.fillText(b.sub, cx, cy+S.unit*0.07);
    }
    ctx.restore();
  }
  function drawFlash(){
    if(G.flash<=0) return;
    ctx.save();
    ctx.globalAlpha=clamp(G.flash,0,1)*0.7;
    ctx.fillStyle=G.flashColor;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  /* --- title demo wire --- */
  var demoNodes=null;
  function buildDemo(){
    var cx=arena.x+arena.w*0.5, cy=arena.y+arena.h*0.52, rr=S.unit*0.26;
    demoNodes=[
      {type:'shortcut', x:cx-rr, y:cy+rr*0.6},
      {type:'action',   x:cx-rr*0.2, y:cy-rr*0.7},
      {type:'action',   x:cx+rr*0.6, y:cy+rr*0.2},
      {type:'cli',      x:cx+rr*1.05, y:cy-rr*0.5}
    ];
  }
  function drawTitleScene(){
    var th=TH();
    if(!demoNodes) buildDemo();
    // animated wire threading demo nodes
    var loop=(T*0.28)%1.6;
    var seg=Math.min(1, loop/1.3); // 0..1 progress across 3 links then pause
    var pts=[demoNodes[0]];
    for(var i=1;i<demoNodes.length;i++) pts.push(demoNodes[i]);
    // draw partial polyline based on seg
    var total=pts.length-1;
    var prog=seg*total;
    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    glow(th.wire,14); ctx.strokeStyle=hexA(th.wire,0.85); ctx.lineWidth=S.headR*1.1;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    var hx=pts[0].x, hy=pts[0].y;
    for(var k=0;k<total;k++){
      var f=clamp(prog-k,0,1);
      var a=pts[k], b=pts[k+1];
      var x=lerp(a.x,b.x,f), y=lerp(a.y,b.y,f);
      ctx.lineTo(x,y); hx=x; hy=y;
      if(f<1) break;
    }
    ctx.stroke(); noGlow();
    ctx.restore();
    // nodes
    for(var n=0;n<demoNodes.length;n++){
      var reached = prog >= n-0.02;
      drawNodeStatic(demoNodes[n], reached);
    }
    // moving head
    glow(th.head,16); ctx.fillStyle=th.head;
    ctx.beginPath(); ctx.arc(hx,hy,S.headR,0,TAU); ctx.fill(); noGlow();
  }
  function drawNodeStatic(n, on){
    var th=TH();
    var col=n.type==='shortcut'?th.shortcut:n.type==='cli'?th.cli:th.action;
    var r=n.r*0.82;
    ctx.save();
    ctx.globalAlpha=on?1:0.45;
    glow(col,on?12:4);
    ctx.fillStyle=hexA(col,DARK?0.16:0.14); ctx.strokeStyle=col; ctx.lineWidth=2;
    nodeShape(n.type,n.x,n.y,r); ctx.fill(); ctx.stroke(); noGlow();
    drawGlyph(n.type,n.x,n.y,r,col);
    ctx.restore();
  }

  function render(){
    if(!ctx) return;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawBackground();

    ctx.save();
    ctx.translate(G.shakeX,G.shakeY);

    if(state==='title'){
      drawTitleScene();
    } else {
      drawGuide();
      drawTrail();
      if(G.nxt) drawNode(G.nxt,false);
      if(G.cur) drawNode(G.cur,true);
      drawHazards();
      drawParticles();
      if(state==='playing' || state==='over') drawHead();
      drawFloats();
      drawBanner();
    }
    ctx.restore();

    if(state==='over'){
      ctx.save();
      ctx.globalAlpha=0.46;
      ctx.fillStyle=TH().bg0;
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }

    drawFlash();
  }

  /* ============================ HUD / overlays ============================ */
  var elScore=document.getElementById('scoreV');
  var elPipes=document.getElementById('pipesV');
  var elNodes=document.getElementById('nodesV');
  var elCombo=document.getElementById('combo');
  var elBar=document.getElementById('barFill');
  var titleEl=document.getElementById('title');
  var overEl=document.getElementById('over');

  function updateHUD(){
    elScore.textContent = G.score;
    elPipes.textContent = G.pipelines;
    elNodes.textContent = G.nodes;
    if(G.combo>1){ elCombo.style.opacity='1'; elCombo.textContent='CHAIN ×'+G.combo; }
    else elCombo.style.opacity='0';
    var sig=clamp(G.signal,0,1);
    elBar.style.transform='scaleX('+sig+')';
    var th=TH();
    elBar.style.background = sig>0.5?th.good : sig>0.25?th.warn : th.bad;
  }

  function showOver(reason){
    document.getElementById('overReason').textContent=reason;
    document.getElementById('overScore').textContent=G.score;
    document.getElementById('overPipes').textContent=G.pipelines;
    document.getElementById('overNodes').textContent=G.nodes;
    var up=Math.max(0, T-G.startClock);
    document.getElementById('overTime').textContent=up.toFixed(1)+'s';
    var bestEl=document.getElementById('overBest');
    if(G.score>0 && G.score>=sessionBest){ bestEl.textContent='◆ new session best'; }
    else if(sessionBest>0){ bestEl.textContent='best this session · '+sessionBest; }
    else bestEl.textContent='';
    // restyle button label based on progress
    var rb=document.getElementById('restartBtn');
    rb.textContent = G.pipelines>0 ? 'Rewire' : 'Try again';
    overEl.classList.remove('hidden');
  }

  function startGame(){
    initAudio(); resumeAudio();
    resize();
    resetGame();
    state='playing';
    titleEl.classList.add('hidden');
    overEl.classList.add('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', function(e){ e.preventDefault(); startGame(); });
  document.getElementById('restartBtn').addEventListener('click', function(e){ e.preventDefault(); startGame(); });
  document.getElementById('muteBtn').addEventListener('click', function(e){
    e.preventDefault();
    muted=!muted;
    this.textContent = muted ? '♩' : '♪';
    this.style.opacity = muted ? '0.5':'1';
    if(!muted){ initAudio(); resumeAudio(); }
  });

  /* ============================ main loop ============================ */
  var last=nowMs();
  function frame(t){
    try{
      var dt=(t-last)/1000; last=t;
      if(!(dt>0)) dt=0.016;
      if(dt>0.05) dt=0.05; // clamp big gaps
      update(dt);
      render();
      updateHUD();
    }catch(err){
      if(window.console && console.error) console.error(err);
    }
    requestAnimationFrame(frame);
  }

  document.addEventListener('visibilitychange', function(){ last=nowMs(); });

  // boot
  resize();
  // make sure sizes are valid even before first play (title demo)
  resetGame();
  state='title';
  requestAnimationFrame(function(tt){ last=tt; requestAnimationFrame(frame); });

})();
</script>
</body>
</html>
