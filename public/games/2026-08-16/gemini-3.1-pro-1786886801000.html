<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gulch Surge</title>
<style>
  :root {
    --bg: #d0e0d0;
    --text: #1a2e1a;
    --btn-bg: #1a2e1a;
    --btn-text: #ffffff;
    --overlay: rgba(220, 240, 220, 0.85);
    --glass: rgba(0, 0, 0, 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a2e1a;
      --text: #ffffff;
      --btn-bg: #ffffff;
      --btn-text: #1a2e1a;
      --overlay: rgba(20, 40, 20, 0.8);
      --glass: rgba(255, 255, 255, 0.1);
    }
  }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game-container {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    background: var(--bg);
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #rain-canvas {
    pointer-events: none;
    z-index: 10;
  }
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: grid;
    place-items: center;
    z-index: 20;
  }
  .screen {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--overlay);
    padding: 2.5rem 2rem;
    border-radius: 1.5rem;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--glass);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .hidden {
    opacity: 0;
    visibility: hidden;
    transform: scale(0.95);
    pointer-events: none !important;
  }
  h1 {
    margin: 0 0 1rem 0;
    font-size: 2rem;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  p {
    margin: 0 0 2rem 0;
    line-height: 1.6;
    max-width: 260px;
    font-size: 1rem;
    opacity: 0.9;
  }
  button {
    pointer-events: auto;
    appearance: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    padding: 1.2rem 2.5rem;
    font-size: 1.2rem;
    font-family: inherit;
    font-weight: bold;
    border-radius: 3rem;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active {
    transform: scale(0.95);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 2rem);
    left: env(safe-area-inset-left, 2rem);
    font-size: 1.5rem;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(255,255,255,0.8);
    z-index: 15;
    margin: 1rem;
  }
  @media (prefers-color-scheme: dark) {
    #hud {
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <canvas id="rain-canvas"></canvas>
  <div id="hud">0m</div>
  <div id="ui-layer">
    <div id="start-screen" class="screen">
      <h1>Gulch Surge</h1>
      <p>Swipe left/right to switch channels.<br>Stay ahead of the flash flood.</p>
      <button data-smoke="start" id="btn-start">Start Run</button>
    </div>
    <div id="game-over-screen" class="screen hidden">
      <h1>Swept Away</h1>
      <p id="final-score">Distance: 0m</p>
      <button data-smoke="restart" id="btn-restart">Play Again</button>
    </div>
  </div>
</div>
<script>
(function() {
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const rainCanvas = document.getElementById('rain-canvas');
  const rainCtx = rainCanvas.getContext('2d');
  const uiStart = document.getElementById('start-screen');
  const uiGameOver = document.getElementById('game-over-screen');
  const btnStart = document.getElementById('btn-start');
  const btnRestart = document.getElementById('btn-restart');
  const hud = document.getElementById('hud');
  const finalScore = document.getElementById('final-score');

  let width, height;
  let isLightMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
      isLightMode = e.matches;
    });
  }

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    rainCanvas.width = width;
    rainCanvas.height = height;
  }
  window.addEventListener('resize', resize);
  resize();

  const colors = {
    dark: {
      water: '#1e331e',
      waterDark: '#122212',
      waterLight: '#2d4c2d',
      foam: '#8b9a8b',
      leaf: '#ffd700',
      leafDark: '#ccaa00',
      rock: '#555555',
      log: '#4A3018',
      rain: 'rgba(255, 255, 255, 0.15)'
    },
    light: {
      water: '#6b8e6b',
      waterDark: '#4a6b4a',
      waterLight: '#8cb38c',
      foam: '#e0eee0',
      leaf: '#ffaa00',
      leafDark: '#cc8800',
      rock: '#777777',
      log: '#6b4423',
      rain: 'rgba(0, 0, 0, 0.15)'
    }
  };

  function C() {
    return isLightMode ? colors.light : colors.dark;
  }

  let state = 'START'; 
  let lastTime = performance.now();
  let time = 0;
  let distance = 0;
  let speed = 0;
  let baseSpeed = 0;
  let lanes = 3;
  let laneWidth = 0;
  let player = { lane: 1, x: 0, y: 0, targetX: 0, width: 24, height: 48, angle: 0, wake: [] };
  let floodY = 0;
  let obstacles = [];
  let particles = [];
  let raindrops = [];
  let cameraShake = 0;

  function initGame() {
    distance = 0;
    baseSpeed = height * 0.008; 
    speed = baseSpeed;
    player.lane = 1;
    laneWidth = Math.min(width / 3, 160);
    player.x = width / 2;
    player.targetX = width / 2;
    player.y = height * 0.75;
    player.wake = [];
    player.angle = 0;
    floodY = height + 200;
    obstacles = [];
    particles = [];
    cameraShake = 0;
    state = 'PLAYING';
    uiStart.classList.add('hidden');
    uiGameOver.classList.add('hidden');
    
    raindrops = [];
    for(let i=0; i<80; i++) {
      raindrops.push({
        x: Math.random() * width,
        y: Math.random() * height,
        l: Math.random() * 20 + 10,
        xs: -2 + Math.random() * -2,
        ys: 15 + Math.random() * 10
      });
    }
    
    lastTime = performance.now();
  }

  function gameOver() {
    state = 'GAMEOVER';
    uiGameOver.classList.remove('hidden');
    finalScore.innerText = `Distance: ${Math.floor(distance)}m`;
    if (navigator.vibrate) {
      try { navigator.vibrate([200, 50, 200]); } catch(e) {}
    }
  }

  let touchStartX = 0;
  let touchStartY = 0;

  window.addEventListener('touchstart', e => {
    if (e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: false });

  window.addEventListener('touchmove', e => {
    if (e.target.tagName === 'BUTTON') return;
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('touchend', e => {
    if (e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    if (state !== 'PLAYING') return;
    
    let touchEndX = e.changedTouches[0].clientX;
    let dx = touchEndX - touchStartX;
    
    if (Math.abs(dx) > 30) {
      if (dx > 0 && player.lane < lanes - 1) {
        player.lane++;
      } else if (dx < 0 && player.lane > 0) {
        player.lane--;
      }
    }
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (state !== 'PLAYING') return;
    if (e.key === 'ArrowLeft' || e.key === 'a') {
      if (player.lane > 0) player.lane--;
    } else if (e.key === 'ArrowRight' || e.key === 'd') {
      if (player.lane < lanes - 1) player.lane++;
    }
  });

  btnStart.addEventListener('click', initGame);
  btnRestart.addEventListener('click', initGame);

  function getCurveOffset(y, t) {
    return Math.sin(y * 0.004 - t * 0.002) * (width * 0.15);
  }

  function spawnObstacle() {
    let rate = 0.015 + (distance * 0.00005);
    if (Math.random() < rate) {
      let type = Math.random() > 0.4 ? 'rock' : 'log';
      let lane = Math.floor(Math.random() * lanes);
      let obs = {
        type: type,
        lane: lane,
        y: -100,
        width: type === 'rock' ? 40 + Math.random()*20 : laneWidth * 0.7,
        height: type === 'rock' ? 40 + Math.random()*20 : 30 + Math.random()*10,
        angle: Math.random() * Math.PI * 2,
        rotSpeed: type === 'log' ? (Math.random() - 0.5) * 0.02 : 0
      };
      
      let overlapping = obstacles.filter(o => Math.abs(o.y - obs.y) < 150);
      if (overlapping.length < lanes - 1) {
        let sameLane = overlapping.some(o => o.lane === obs.lane && Math.abs(o.y - obs.y) < 100);
        if (!sameLane) {
          obstacles.push(obs);
        }
      }
    }
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12,
        life: 1,
        color: color,
        size: Math.random() * 5 + 2
      });
    }
  }

  function update(dt) {
    time += dt;
    speed = baseSpeed + (distance * 0.001);
    distance += speed * 0.01;
    hud.innerText = `${Math.floor(distance)}m`;
    
    let centerX = width / 2;
    let laneOffsetX = (player.lane - 1) * laneWidth;
    player.targetX = centerX + laneOffsetX;
    
    let dx = player.targetX - player.x;
    player.x += dx * 0.15;
    player.angle = dx * 0.02;
    
    if (time % 100 < 20) {
      player.wake.push({ x: player.x, y: player.y, life: 1 });
    }
    for (let i = player.wake.length - 1; i >= 0; i--) {
      player.wake[i].y += speed * 0.5;
      player.wake[i].life -= 0.02;
      if (player.wake[i].life <= 0) player.wake.splice(i, 1);
    }
    
    spawnObstacle();
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.y += speed;
      obs.angle += obs.rotSpeed;
      
      let curve = getCurveOffset(player.y, time);
      let obsCurve = getCurveOffset(obs.y, time);
      
      let px = player.x + curve;
      let py = player.y;
      let ox = centerX + (obs.lane - 1) * laneWidth + obsCurve;
      let oy = obs.y;
      
      let hitDistX = obs.width/2 + player.width/3;
      let hitDistY = obs.height/2 + player.height/3;
      
      if (Math.abs(px - ox) < hitDistX && Math.abs(py - oy) < hitDistY) {
        spawnParticles(px, py, C().foam, 25);
        obstacles.splice(i, 1);
        cameraShake = 25;
        floodY -= height * 0.25; 
        if (navigator.vibrate) {
          try { navigator.vibrate(50); } catch(e) {}
        }
        continue;
      }
      
      if (obs.y > height + 100) {
        obstacles.splice(i, 1);
      }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy + speed * 0.5;
      p.life -= 0.03;
      if (p.life <= 0) particles.splice(i, 1);
    }
    
    let targetFloodY = height + 150 - (distance * 1.0);
    floodY += (targetFloodY - floodY) * 0.002;
    
    if (floodY <= player.y + player.height/2) {
      gameOver();
    }
    
    if (cameraShake > 0) cameraShake *= 0.8;
    if (cameraShake < 0.5) cameraShake = 0;
  }

  function draw() {
    const c = C();
    
    ctx.fillStyle = c.water;
    ctx.fillRect(0, 0, width, height);
    
    ctx.save();
    if (cameraShake > 0) {
      ctx.translate((Math.random() - 0.5) * cameraShake, (Math.random() - 0.5) * cameraShake);
    }
    
    ctx.lineWidth = 2;
    ctx.strokeStyle = c.waterLight;
    ctx.setLineDash([30, 30]);
    ctx.lineDashOffset = -time * 0.2;
    ctx.beginPath();
    for (let i = 1; i < lanes; i++) {
      let lx = width/2 + (i - lanes/2) * laneWidth;
      for (let y = 0; y <= height + 50; y += 50) {
        let curve = getCurveOffset(y, time);
        if (y === 0) ctx.moveTo(lx + curve, y);
        else ctx.lineTo(lx + curve, y);
      }
    }
    ctx.stroke();
    ctx.setLineDash([]);
    
    ctx.fillStyle = c.foam;
    player.wake.forEach(w => {
      let curve = getCurveOffset(w.y, time);
      ctx.globalAlpha = w.life * 0.4;
      ctx.beginPath();
      ctx.arc(w.x + curve, w.y, (1 - w.life) * 18, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    obstacles.forEach(obs => {
      let curve = getCurveOffset(obs.y, time);
      let ox = width/2 + (obs.lane - 1) * laneWidth + curve;
      
      ctx.save();
      ctx.translate(ox, obs.y);
      
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 10, obs.width/2, obs.height/2, 0, 0, Math.PI*2);
      ctx.fill();
      
      ctx.rotate(obs.angle);
      
      if (obs.type === 'rock') {
        ctx.fillStyle = c.rock;
        ctx.beginPath();
        ctx.arc(0, 0, obs.width/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(-obs.width/6, -obs.width/6, obs.width/4, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = c.log;
        ctx.fillRect(-obs.width/2, -obs.height/2, obs.width, obs.height);
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-obs.width/2 + 5, -5);
        ctx.lineTo(obs.width/2 - 5, -5);
        ctx.moveTo(-obs.width/2 + 10, 5);
        ctx.lineTo(obs.width/2 - 10, 5);
        ctx.stroke();
      }
      ctx.restore();
    });
    
    let pCurve = getCurveOffset(player.y, time);
    ctx.save();
    ctx.translate(player.x + pCurve, player.y);
    
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 15, player.width/2, player.height/2, 0, 0, Math.PI*2);
    ctx.fill();
    
    ctx.rotate(player.angle);
    
    ctx.fillStyle = c.leaf;
    ctx.beginPath();
    ctx.moveTo(0, -player.height/2);
    ctx.bezierCurveTo(player.width/2, -player.height/4, player.width/2, player.height/4, 0, player.height/2);
    ctx.bezierCurveTo(-player.width/2, player.height/4, -player.width/2, -player.height/4, 0, -player.height/2);
    ctx.fill();
    
    ctx.strokeStyle = c.leafDark;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -player.height/2 + 5);
    ctx.lineTo(0, player.height/2 - 5);
    ctx.stroke();
    
    ctx.restore();
    
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    let floodGrad = ctx.createLinearGradient(0, floodY, 0, height);
    floodGrad.addColorStop(0, c.waterDark);
    floodGrad.addColorStop(1, '#000000');
    
    ctx.fillStyle = floodGrad;
    ctx.beginPath();
    ctx.moveTo(0, height);
    ctx.lineTo(0, floodY + 20);
    for (let x = 0; x <= width; x += 20) {
      let waveY = floodY + 20 + Math.sin(x * 0.04 + time * 0.012) * 10;
      ctx.lineTo(x, waveY);
    }
    ctx.lineTo(width, height);
    ctx.fill();
    
    ctx.fillStyle = c.foam;
    ctx.beginPath();
    ctx.moveTo(0, floodY + 25);
    ctx.lineTo(0, floodY);
    for (let x = 0; x <= width; x += 20) {
      let waveY = floodY + Math.sin(x * 0.05 + time * 0.01) * 15 + Math.cos(x * 0.02 - time * 0.005) * 10;
      ctx.lineTo(x, waveY);
    }
    ctx.lineTo(width, floodY + 25);
    ctx.fill();
    
    let distToPlayer = player.y - floodY;
    if (distToPlayer < 250) {
      let alpha = 1 - (distToPlayer / 250);
      if (alpha < 0) alpha = 0;
      if (alpha > 0.7) alpha = 0.7;
      
      let grad = ctx.createRadialGradient(width/2, height/2, height*0.2, width/2, height/2, height*0.8);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, `rgba(0,0,0,${alpha})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
    }
    
    ctx.restore();
    
    rainCtx.clearRect(0, 0, width, height);
    rainCtx.strokeStyle = c.rain;
    rainCtx.lineWidth = 1.5;
    rainCtx.beginPath();
    raindrops.forEach(r => {
      rainCtx.moveTo(r.x, r.y);
      rainCtx.lineTo(r.x + r.xs * r.l * 0.1, r.y + r.ys * r.l * 0.1);
      
      r.x += r.xs;
      r.y += r.ys;
      
      if (r.y > height + 50) {
        r.y = -50;
        r.x = Math.random() * width;
      }
      if (r.x < -50) {
        r.x = width + 50;
      }
    });
    rainCtx.stroke();
  }

  function loop(timestamp) {
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    
    if (dt > 50) dt = 16;
    
    if (state === 'PLAYING') {
      update(dt);
    } else if (state === 'START') {
      time += dt;
    }
    
    if (state === 'PLAYING' || state === 'START') {
      draw();
    }
    
    requestAnimationFrame(loop);
  }

  draw();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
