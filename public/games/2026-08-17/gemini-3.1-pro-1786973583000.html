<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Agent Sorter</title>
  <style>
    :root {
      --term-green: #00ff41;
      --bg-dark: #020617;
    }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg-dark);
      color: var(--term-green);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }
    canvas {
      display: block; width: 100%; height: 100%;
    }
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(2, 6, 23, 0.90);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .hidden { opacity: 0; display: none !important; }
    
    h1 {
      font-size: 2rem; margin-bottom: 1rem; text-transform: uppercase;
      letter-spacing: 2px; text-shadow: 0 0 10px var(--term-green);
      text-align: center;
    }
    .instructions {
      font-size: 0.9rem; max-width: 320px; text-align: center; margin-bottom: 2rem;
      line-height: 1.6; color: #a0a0a0; padding: 0 1rem;
    }
    .key { color: #fff; background: rgba(0, 255, 65, 0.15); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--term-green); }
    
    button {
      pointer-events: auto; /* explicit opt-in for clicks */
      z-index: 20;
      background: rgba(0, 255, 65, 0.1);
      border: 2px solid var(--term-green);
      color: var(--term-green);
      font-family: inherit; font-size: 1.2rem; font-weight: bold;
      padding: 14px 28px;
      cursor: pointer;
      text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.2), inset 0 0 10px rgba(0, 255, 65, 0.1);
      transition: all 0.1s;
    }
    button:active {
      background: var(--term-green); color: #000;
      box-shadow: 0 0 25px rgba(0, 255, 65, 0.5);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --term-green: #00ff41;
        --bg-dark: #020617;
      }
      body, html {
        background: var(--bg-dark);
        color: var(--term-green);
      }
      .screen {
        background: rgba(2, 6, 23, 0.90);
      }
      .instructions {
        color: #a0a0a0;
      }
      .key {
        color: #fff;
        background: rgba(0, 255, 65, 0.15);
      }
      button {
        background: rgba(0, 255, 65, 0.1);
        border-color: var(--term-green);
        color: var(--term-green);
      }
      button:active {
        background: var(--term-green);
        color: #000;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>
  
  <div id="ui-layer">
    <div id="title-screen" class="screen">
      <h1>Sunrise Ship</h1>
      <div class="instructions">
        Sort active Agent Tasks into the correct workflow lanes before sunrise.<br><br>
        Chain <span class="key">PLAN</span> ➔ <span class="key">EXEC</span> ➔ <span class="key">COMP</span> ➔ <span class="key">SHIP</span> for a combo extension.<br><br>
        <strong>Drag L/R</strong> to route<br>
        <strong>Swipe Down</strong> to fast drop<br>
        <strong>Swipe Up</strong> to hold task
      </div>
      <button data-smoke="start" id="start-btn">Initialize Run</button>
    </div>
    
    <div id="game-over-screen" class="screen hidden">
      <h1>Session Terminated</h1>
      <div id="final-score" style="font-size: 3.5rem; font-weight: bold; margin: 1rem 0; color: var(--term-green); text-shadow: 0 0 15px var(--term-green);">0</div>
      <div id="final-stats" class="instructions" style="color: #fff; font-size: 1.1rem; margin-bottom: 2rem;"></div>
      <button data-smoke="restart" id="restart-btn">Reboot System</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const titleScreen = document.getElementById('title-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalScoreEl = document.getElementById('final-score');
    const finalStatsEl = document.getElementById('final-stats');

    let playing = false;
    let score = 0;
    let time = 60;
    let lastTime = 0;
    let reqId = null;
    let workflowsCompleted = 0;

    const COLS = 4;
    const COL_NAMES = ['PLAN', 'EXEC', 'COMP', 'SHIP'];
    const COL_COLORS = ['#00ffff', '#ffff00', '#ff9900', '#00ff00'];
    const COL_RGB = ['0,255,255', '255,255,0', '255,153,0', '0,255,0'];
    const ICONS = ['📝', '⚙️', '⚖️', '🚀'];

    const TASKS = [
      ['SPEC', 'ARCH', 'UML', 'REQS'],
      ['CODE', 'REFACT', 'API', 'DB'],
      ['TEST', 'REVIEW', 'DIFF', 'LINT'],
      ['PROD', 'MERGE', 'TAG', 'PUSH']
    ];

    let W, H, colWidth;
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      colWidth = W / COLS;
    }
    window.addEventListener('resize', resize);
    resize();

    let activeCard = null;
    let holdCard = null;
    let queue = [];
    let holdLocked = false;
    let currentStreak = 0; 
    let particles = [];
    let shakeTime = 0;
    let receivers = [0, 0, 0, 0];

    // Audio wrapper
    let audioCtx = null;
    function initAudio() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      try { audioCtx = new AudioContextClass(); } catch(e) {}
    }

    function playSound(type) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        
        if (type === 'move') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'sort') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(100, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'combo') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch (e) {}
    }

    class Card {
      constructor() {
        this.type = Math.floor(Math.random() * 4);
        this.text = TASKS[this.type][Math.floor(Math.random() * TASKS[this.type].length)];
        this.isGlitch = false;
        this.col = Math.random() > 0.5 ? 1 : 2; 
        this.y = -100;
        this.w = colWidth * 0.8;
        this.visualX = (this.col * colWidth) + (colWidth - this.w) / 2;
        this.h = 60;
        this.fastDrop = false;
        
        let speedMult = 1 + (60 - Math.max(0, time)) / 60 * 2;
        this.speed = (H / 4) * speedMult; 
        
        if (time < 45 && Math.random() < 0.15) {
          this.isGlitch = true;
          this.glitchTimer = 0;
          this.displayType = Math.floor(Math.random() * 4);
        } else {
          this.displayType = this.type;
        }
      }
      
      update(dt) {
        if (this.isGlitch) {
          this.glitchTimer += dt;
          if (this.glitchTimer > 0.15) {
            this.glitchTimer = 0;
            if (this.y < H * 0.5) {
              this.displayType = Math.floor(Math.random() * 4);
              const chars = "10!@#$*&";
              this.text = Array(4).fill(0).map(() => chars[Math.floor(Math.random()*chars.length)]).join('');
            } else {
              this.displayType = this.type;
              this.text = TASKS[this.type][Math.floor(Math.random() * TASKS[this.type].length)];
            }
          }
        }
        
        if (this.fastDrop) {
          this.y += (H * 2.5) * dt;
        } else {
          this.y += this.speed * dt;
        }
        
        let targetX = (this.col * colWidth) + (colWidth - this.w) / 2;
        if (!isDragging) {
          this.visualX += (targetX - this.visualX) * 20 * dt;
        }
      }
      
      draw(ctx) {
        ctx.save();
        ctx.translate(this.visualX, this.y);
        const color = COL_COLORS[this.displayType];
        
        ctx.fillStyle = color + '22';
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.fillRect(0, 0, this.w, this.h);
        ctx.strokeRect(0, 0, this.w, this.h);
        
        if (this.isGlitch && this.y < H * 0.5) {
          ctx.fillStyle = '#fff';
          ctx.fillRect(Math.random()*this.w, Math.random()*this.h, 15, 3);
        }
        
        ctx.beginPath();
        ctx.moveTo(0, 20);
        ctx.lineTo(this.w, 20);
        ctx.stroke();
        
        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 10px ui-monospace, monospace';
        ctx.fillText(COL_NAMES[this.displayType], 4, 10);
        
        ctx.textAlign = 'right';
        ctx.fillText(ICONS[this.displayType], this.w - 4, 10);
        
        ctx.textAlign = 'center';
        ctx.font = 'bold 16px ui-monospace, monospace';
        ctx.fillText(this.text, this.w / 2, 40);
        
        ctx.restore();
      }
    }

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let cardStartX = 0;

    function triggerHold() {
      if (holdLocked || !playing) return;
      
      const oldActive = activeCard;
      if (holdCard === null) {
        holdCard = activeCard;
        activeCard = queue.shift();
        queue.push(new Card());
      } else {
        activeCard = holdCard;
        holdCard = oldActive;
      }
      
      holdCard.isGlitch = false;
      holdCard.displayType = holdCard.type;
      holdCard.text = TASKS[holdCard.type][0]; // stable text
      
      activeCard.y = -100;
      activeCard.col = 1;
      activeCard.w = colWidth * 0.8;
      activeCard.visualX = (activeCard.col * colWidth) + (colWidth - activeCard.w) / 2;
      activeCard.fastDrop = false;
      
      holdLocked = true;
      playSound('move');
    }

    function handleInputStart(x, y) {
      if (!playing) return false;
      if (x < W/3 && y > 50 && y < 150) {
        triggerHold();
        return true;
      }
      if (!activeCard) return false;
      isDragging = true;
      dragStartX = x;
      dragStartY = y;
      cardStartX = activeCard.visualX;
      return true;
    }

    function handleInputMove(x, y) {
      if (!playing || !activeCard || !isDragging) return;
      const deltaX = x - dragStartX;
      const deltaY = y - dragStartY;
      
      activeCard.visualX = cardStartX + deltaX;
      const centerVisualX = activeCard.visualX + activeCard.w / 2;
      let newCol = Math.floor(centerVisualX / colWidth);
      newCol = Math.max(0, Math.min(3, newCol));
      
      if (newCol !== activeCard.col) {
        activeCard.col = newCol;
        playSound('move');
        if (navigator.vibrate) try { navigator.vibrate(10); } catch(e){}
      }
      
      if (deltaY > 80 && Math.abs(deltaY) > Math.abs(deltaX)) {
        activeCard.fastDrop = true;
        isDragging = false;
      }
      if (deltaY < -60 && Math.abs(deltaY) > Math.abs(deltaX)) {
        triggerHold();
        isDragging = false;
      }
    }

    window.addEventListener('touchstart', e => {
      if(e.target.tagName === 'BUTTON') return;
      initAudio();
      if(handleInputStart(e.touches[0].clientX, e.touches[0].clientY)) {
        e.preventDefault(); 
      }
    }, {passive: false});

    window.addEventListener('touchmove', e => {
      if (isDragging) e.preventDefault();
      handleInputMove(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: false});

    window.addEventListener('touchend', () => isDragging = false);

    window.addEventListener('mousedown', e => {
      if(e.target.tagName === 'BUTTON') return;
      initAudio();
      handleInputStart(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', e => {
      if (isDragging) handleInputMove(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => isDragging = false);
    
    window.addEventListener('keydown', e => {
      if (!playing || !activeCard) return;
      if (e.key === 'ArrowLeft') {
        activeCard.col = Math.max(0, activeCard.col - 1);
        playSound('move');
      } else if (e.key === 'ArrowRight') {
        activeCard.col = Math.min(3, activeCard.col + 1);
        playSound('move');
      } else if (e.key === 'ArrowDown') {
        activeCard.fastDrop = true;
      } else if (e.key === 'ArrowUp') {
        triggerHold();
      }
    });

    function spawnParticles(x, y, color, count, text = null) {
      const chars = "01!<>{}*";
      for (let i=0; i<count; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 350,
          vy: (Math.random() - 1) * 350 - 50,
          life: 0.6 + Math.random() * 0.6,
          color: color,
          char: text || chars[Math.floor(Math.random() * chars.length)]
        });
      }
    }

    function processSort(card) {
      const isCorrect = (card.col === card.type);
      const xCenter = card.visualX + card.w / 2;
      const yCenter = card.y + card.h / 2;
      
      receivers[card.col] = 1.0; 
      
      if (isCorrect) {
        score += 10;
        playSound('sort');
        spawnParticles(xCenter, yCenter, COL_COLORS[card.type], 15);
        if (navigator.vibrate) try { navigator.vibrate(20); } catch(e){}
        
        if (card.type === currentStreak) {
          currentStreak++;
          if (currentStreak === 4) {
            score += 100;
            time += 3;
            currentStreak = 0;
            workflowsCompleted++;
            playSound('combo');
            if (navigator.vibrate) try { navigator.vibrate([30, 50, 30]); } catch(e){}
            for(let i=0; i<4; i++) {
              spawnParticles(colWidth * i + colWidth/2, H - 40, COL_COLORS[i], 20, '★');
            }
          }
        } else if (card.type === 0) {
          currentStreak = 1;
        } else {
          currentStreak = 0;
        }
      } else {
        score = Math.max(0, score - 10);
        currentStreak = 0;
        shakeTime = 0.3;
        playSound('error');
        spawnParticles(xCenter, yCenter, '#ff0000', 25);
        if (navigator.vibrate) try { navigator.vibrate(100); } catch(e){}
      }
      
      activeCard = queue.shift();
      queue.push(new Card());
      holdLocked = false;
    }

    function startGame() {
      playing = true;
      score = 0;
      time = 60;
      currentStreak = 0;
      workflowsCompleted = 0;
      queue = [new Card(), new Card(), new Card()];
      activeCard = new Card();
      holdCard = null;
      holdLocked = false;
      particles = [];
      receivers = [0, 0, 0, 0];
      
      titleScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      
      lastTime = performance.now();
      if (reqId) cancelAnimationFrame(reqId);
      reqId = requestAnimationFrame(loop);
    }

    function endGame() {
      playing = false;
      finalScoreEl.innerText = Math.floor(score);
      finalStatsEl.innerHTML = `Workflows Shipped: <span style="color:var(--term-green)">${workflowsCompleted}</span>`;
      gameOverScreen.classList.remove('hidden');
    }

    startBtn.addEventListener('click', () => {
      initAudio();
      startGame();
    });
    restartBtn.addEventListener('click', () => {
      startGame();
    });

    function loop(now) {
      if (!playing) return;
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      
      update(dt);
      draw();
      
      if (playing) {
        reqId = requestAnimationFrame(loop);
      }
    }

    function update(dt) {
      time -= dt;
      if (time <= 0) {
        endGame();
        return;
      }
      
      if (shakeTime > 0) shakeTime -= dt;
      for(let i=0; i<4; i++) {
        if (receivers[i] > 0) receivers[i] = Math.max(0, receivers[i] - dt * 2.5);
      }
      
      if (activeCard) {
        activeCard.update(dt);
        const receiverY = H - 80;
        if (activeCard.y + activeCard.h > receiverY) {
          processSort(activeCard);
        }
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 800 * dt; 
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      const progress = 1 - Math.max(0, time) / 60;
      const topR = Math.floor(2 + progress * 24);
      const topG = Math.floor(6 + progress * 26);
      const topB = Math.floor(23 + progress * 30);
      const botR = Math.floor(10 + progress * 34);
      const botG = Math.floor(31 + progress * 27);
      const botB = Math.floor(22 + progress * 18);
      
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, `rgb(${topR}, ${topG}, ${topB})`);
      grad.addColorStop(1, `rgb(${botR}, ${botG}, ${botB})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      
      ctx.save();
      if (shakeTime > 0) {
        const mag = shakeTime * 20;
        ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
      }
      
      ctx.strokeStyle = '#00ff411a';
      ctx.lineWidth = 1;
      for (let i = 1; i < COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * colWidth, 0);
        ctx.lineTo(i * colWidth, H);
        ctx.stroke();
      }
      
      const receiverY = H - 80;
      for (let i = 0; i < COLS; i++) {
        const cx = i * colWidth + colWidth / 2;
        const isTarget = activeCard && activeCard.col === i;
        
        ctx.fillStyle = isTarget ? COL_COLORS[i] + '33' : COL_COLORS[i] + '11';
        ctx.fillRect(i * colWidth, receiverY, colWidth, H - receiverY);
        
        if (receivers[i] > 0) {
          ctx.fillStyle = `rgba(${COL_RGB[i]}, ${receivers[i] * 0.6})`;
          ctx.fillRect(i * colWidth, receiverY, colWidth, H - receiverY);
        }
        
        ctx.strokeStyle = COL_COLORS[i] + (isTarget ? 'ff' : '66');
        ctx.lineWidth = isTarget ? 3 : 1;
        ctx.beginPath();
        ctx.moveTo(i * colWidth, receiverY);
        ctx.lineTo((i+1) * colWidth, receiverY);
        ctx.stroke();
        
        ctx.fillStyle = COL_COLORS[i];
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 12px ui-monospace, monospace';
        ctx.fillText(`[${COL_NAMES[i]}]`, cx, receiverY + 40);
      }
      
      // Draw UI integrated into background
      ctx.textAlign = 'center';
      ctx.fillStyle = '#00ff4166';
      ctx.font = '10px ui-monospace, monospace';
      ctx.fillText('HOLD (↑)', colWidth / 2, 70);
      
      const hBox = 40;
      ctx.strokeStyle = holdLocked ? '#555' : '#00ff4166';
      ctx.strokeRect(colWidth/2 - hBox/2, 85, hBox, hBox);
      if (holdCard) {
        ctx.fillStyle = COL_COLORS[holdCard.displayType];
        ctx.fillText(holdCard.text.substring(0,4), colWidth/2, 85 + hBox/2);
      }
      
      ctx.fillStyle = '#00ff4166';
      ctx.fillText('NEXT', 3 * colWidth + colWidth/2, 70);
      for (let i=0; i<Math.min(2, queue.length); i++) {
        const qCard = queue[i];
        const qy = 85 + i * (hBox + 10);
        ctx.strokeStyle = '#00ff4144';
        ctx.strokeRect(3 * colWidth + colWidth/2 - hBox/2, qy, hBox, hBox);
        ctx.fillStyle = COL_COLORS[qCard.displayType];
        ctx.fillText(qCard.text.substring(0,4), 3 * colWidth + colWidth/2, qy + hBox/2);
      }
      
      if (activeCard) {
        activeCard.draw(ctx);
      }
      
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillText(p.char, p.x, p.y);
      }
      ctx.globalAlpha = 1.0;
      
      ctx.restore(); 
      
      // Top Bar Overlay
      ctx.fillStyle = 'rgba(2, 6, 23, 0.95)';
      ctx.fillRect(0, 0, W, 45);
      ctx.strokeStyle = '#00ff4144';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 45); ctx.lineTo(W, 45); ctx.stroke();
      
      ctx.textBaseline = 'middle';
      ctx.fillStyle = time <= 10 ? '#ff0041' : '#00ff41';
      ctx.font = 'bold 18px ui-monospace, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(time.toFixed(1) + 's', 15, 23);
      
      ctx.textAlign = 'right';
      ctx.fillStyle = '#00ff41';
      ctx.fillText(Math.floor(score) + ' PTS', W - 15, 23);
      
      // Streak UI
      const boxW = 20;
      const gap = 12;
      const totalW = 4 * boxW + 3 * gap;
      let startX = (W - totalW) / 2;
      const streakY = receiverY - 30;
      
      ctx.textAlign = 'center';
      for (let i = 0; i < 4; i++) {
        const isCompleted = (i < currentStreak);
        const isActiveTarget = (i === currentStreak);
        
        ctx.fillStyle = isCompleted ? COL_COLORS[i] : (isActiveTarget ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.5)');
        ctx.strokeStyle = isActiveTarget ? '#fff' : (isCompleted ? COL_COLORS[i] : '#333');
        ctx.lineWidth = isActiveTarget ? 2 : 1;
        ctx.fillRect(startX, streakY - boxW/2, boxW, boxW);
        ctx.strokeRect(startX, streakY - boxW/2, boxW, boxW);
        
        ctx.fillStyle = isCompleted ? '#000' : (isActiveTarget ? '#fff' : '#555');
        ctx.font = 'bold 12px monospace';
        ctx.fillText(COL_NAMES[i][0], startX + boxW/2, streakY + 1);
        
        if (i < 3) {
          ctx.fillStyle = (i < currentStreak - 1) ? COL_COLORS[i] : '#333';
          ctx.fillRect(startX + boxW + 2, streakY - 1, gap - 4, 2);
        }
        startX += boxW + gap;
      }
    }
  </script>
</body>
