<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Pulse</title>
<style>
  :root {
    --bg: #050508;
    --fg: #e2e8f0;
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.15);
    --accent: #22d3ee;
    --accent-hit: #4ade80;
    --accent-miss: #ef4444;
    --font: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc;
      --fg: #0f172a;
      --glass: rgba(0, 0, 0, 0.05);
      --glass-border: rgba(0, 0, 0, 0.15);
      --accent: #0284c7;
      --accent-hit: #16a34a;
      --accent-miss: #dc2626;
    }
  }
  
  * { box-sizing: border-box; }
  
  body, html {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
    user-select: none;
    touch-action: none;
    -webkit-user-select: none;
  }
  
  #game-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  
  .panel {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 2.5rem;
    border-radius: 16px;
    text-align: center;
    pointer-events: auto;
    max-width: 90%;
  }
  
  h1 { 
    margin: 0 0 1rem 0; 
    font-weight: normal; 
    font-size: 1.8rem; 
    text-transform: uppercase; 
    letter-spacing: 4px; 
    color: var(--accent); 
  }
  
  p { 
    margin: 0 0 2rem 0; 
    opacity: 0.8; 
    font-size: 1rem; 
    line-height: 1.5;
  }
  
  button {
    background: var(--glass);
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 1rem 2rem;
    font-family: var(--font);
    font-size: 1.1rem;
    cursor: pointer;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.2s;
    pointer-events: auto;
    box-shadow: 0 0 15px rgba(34, 211, 238, 0.1);
  }
  
  button:hover, button:active {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 25px rgba(34, 211, 238, 0.4);
  }
  
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: calc(env(safe-area-inset-top, 10px) + 1rem) 1rem 1rem 1rem;
    display: flex;
    justify-content: space-between;
    z-index: 5;
    pointer-events: none;
    font-size: 1rem;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  
  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="hud" class="hidden">
  <div id="score-disp">SCORE: 0</div>
  <div id="combo-disp">COMBO: 0</div>
  <div id="health-disp">HP: 100%</div>
</div>

<div id="menu" class="ui-layer">
  <div class="panel">
    <h1>Agent Pulse</h1>
    <p>Tap LEFT or RIGHT screen<br>to deploy agents to the beat.<br><br>Beware of fading ghost tasks.</p>
    <button data-smoke="start" id="start-btn">Initialize</button>
  </div>
</div>

<div id="game-over" class="ui-layer hidden">
  <div class="panel">
    <h1>Connection Lost</h1>
    <p id="final-score">Score: 0</p>
    <button data-smoke="restart" id="restart-btn">Reboot Sequence</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  
  let hitLineY = 0;
  let noteSpeed = 0;
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    hitLineY = canvas.height * 0.75; // 75% down
    noteSpeed = canvas.height * 0.6; // px per second
  }
  window.addEventListener('resize', resize);
  resize();

  let colors = {};
  function updateColors() {
    const style = getComputedStyle(document.documentElement);
    colors = {
      bg: style.getPropertyValue('--bg').trim(),
      fg: style.getPropertyValue('--fg').trim(),
      accent: style.getPropertyValue('--accent').trim(),
      accentHit: style.getPropertyValue('--accent-hit').trim(),
      accentMiss: style.getPropertyValue('--accent-miss').trim(),
      glass: style.getPropertyValue('--glass').trim(),
      glassBorder: style.getPropertyValue('--glass-border').trim(),
      font: style.getPropertyValue('--font').trim()
    };
  }
  const colorMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
  if (colorMediaQuery.addEventListener) {
    colorMediaQuery.addEventListener('change', updateColors);
  } else if (colorMediaQuery.addListener) {
    colorMediaQuery.addListener(updateColors);
  }
  updateColors();

  // Audio Context Fallback
  let audioCtx = null;
  function getAudioContext() {
    if (audioCtx) return audioCtx;
    const AC = window.AudioContext || window.webkitAudioContext;
    try {
      if (AC) {
        audioCtx = new AC();
        return audioCtx;
      }
    } catch (e) {
      console.warn("Web Audio API error", e);
    }
    
    // Fallback Mock
    let mockStartTime = performance.now() / 1000;
    audioCtx = {
      get currentTime() { return (performance.now() / 1000) - mockStartTime; },
      state: 'running',
      resume: () => { mockStartTime = (performance.now() / 1000) - (audioCtx.currentTime || 0); audioCtx.state = 'running'; return Promise.resolve(); },
      suspend: () => { audioCtx.state = 'suspended'; return Promise.resolve(); },
      createOscillator: () => ({ connect: () => {}, start: () => {}, stop: () => {}, type: 'sine', frequency: { setValueAtTime: () => {}, exponentialRampToValueAtTime: () => {}, linearRampToValueAtTime: () => {} } }),
      createGain: () => ({ connect: () => {}, gain: { setValueAtTime: () => {}, exponentialRampToValueAtTime: () => {}, linearRampToValueAtTime: () => {} } }),
      createBuffer: (c, s, r) => ({ getChannelData: () => new Float32Array(s) }),
      createBufferSource: () => ({ buffer: null, connect: () => {}, start: () => {}, stop: () => {} }),
      createBiquadFilter: () => ({ connect: () => {}, type: 'lowpass', frequency: { value: 0 } }),
      destination: {},
      sampleRate: 44100
    };
    return audioCtx;
  }

  // Synthesizers
  function playKick(time) {
    if (!audioCtx || !audioCtx.createOscillator) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.frequency.setValueAtTime(120, time);
    osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.4);
    
    gain.gain.setValueAtTime(0.8, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.4);
    
    osc.start(time);
    osc.stop(time + 0.4);
  }

  function playSnare(time) {
    if (!audioCtx || !audioCtx.createBuffer) return;
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.15);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 1000;
    
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.8, time);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
    
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    
    noise.start(time);
  }

  function playHihat(time) {
    if (!audioCtx || !audioCtx.createBuffer) return;
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.05);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 5000;
    
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.2, time);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
    
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    
    noise.start(time);
  }

  function playHit(time) {
    if (!audioCtx || !audioCtx.createOscillator) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.frequency.setValueAtTime(880, time);
    osc.frequency.exponentialRampToValueAtTime(440, time + 0.1);
    
    gain.gain.setValueAtTime(0.3, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
    
    osc.start(time);
    osc.stop(time + 0.1);
  }

  function playMiss(time) {
    if (!audioCtx || !audioCtx.createOscillator) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.linearRampToValueAtTime(100, time + 0.2);
    
    gain.gain.setValueAtTime(0.4, time);
    gain.gain.linearRampToValueAtTime(0.01, time + 0.2);
    
    osc.start(time);
    osc.stop(time + 0.2);
  }

  function playShipSound(time) {
    if (!audioCtx || !audioCtx.createOscillator) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.frequency.setValueAtTime(300, time);
    osc.frequency.exponentialRampToValueAtTime(1200, time + 0.5);
    
    gain.gain.setValueAtTime(0.2, time);
    gain.gain.linearRampToValueAtTime(0.01, time + 0.5);
    
    osc.start(time);
    osc.stop(time + 0.5);
  }

  // Game State
  let isPlaying = false;
  let startTime = 0;
  let notes = [];
  let nextAudioNoteIndex = 0;
  let lastCheckedMissIndex = 0;
  
  let score = 0;
  let combo = 0;
  let perfectChain = 0;
  let health = 100;
  
  let particles = [];
  let agentWindows = [];
  let ships = [];
  let laneFlash = [0, 0];
  
  const textOpts = ['deploy-prod', 'npm install', 'docker build', 'pytest --cov', 'terraform', 'agent_init()'];

  function generateLevel() {
    notes = [];
    let t = 1.0; 
    let currentBpm = 110;
    let currentLevel = 0;
    
    for (let bar = 0; bar < 150; bar++) {
      if (bar > 0 && bar % 8 === 0) {
        currentBpm += 6;
        currentLevel++;
      }
      let beatLength = 60 / currentBpm;
      let stepLength = beatLength / 4;
      
      for (let step = 0; step < 16; step++) {
        let isPlayable = false;
        let isGhost = false;
        
        if (currentLevel === 0) {
          if (step % 4 === 0) isPlayable = true;
        } else if (currentLevel === 1) {
          if (step % 4 === 0 || step === 6 || step === 14) isPlayable = true;
        } else if (currentLevel >= 2) {
          if (step % 4 === 0 || step === 6 || step === 14) isPlayable = true;
          if (Math.random() < 0.25) isPlayable = true;
        }
        
        if (currentLevel >= 3 && isPlayable && Math.random() < 0.35) {
          isGhost = true;
        }
        
        let isKick = step % 4 === 0;
        let isSnare = step === 4 || step === 12;
        let isHihat = step % 2 === 0;
        
        let text = textOpts[Math.floor(Math.random() * textOpts.length)];
        
        notes.push({
          time: t,
          playable: isPlayable,
          ghost: isGhost,
          kick: isKick,
          snare: isSnare,
          hihat: isHihat,
          lane: Math.random() < 0.5 ? 0 : 1,
          hit: false,
          missed: false,
          text: text
        });
        
        t += stepLength;
      }
    }
  }

  function scheduleAudio() {
    if (!isPlaying || !audioCtx) return;
    const songTime = audioCtx.currentTime - startTime;
    const lookaheadWindow = 0.2; 
    
    while (nextAudioNoteIndex < notes.length && notes[nextAudioNoteIndex].time < songTime + lookaheadWindow) {
      const note = notes[nextAudioNoteIndex];
      const absoluteTime = startTime + note.time;
      
      if (note.kick) playKick(absoluteTime);
      if (note.snare) playSnare(absoluteTime);
      if (note.hihat) playHihat(absoluteTime);
      
      nextAudioNoteIndex++;
    }
  }

  function updateHUD() {
    document.getElementById('score-disp').innerText = 'SCORE: ' + score;
    document.getElementById('combo-disp').innerText = 'COMBO: ' + combo;
    document.getElementById('health-disp').innerText = 'HP: ' + Math.floor(health) + '%';
  }

  function checkGameOver() {
    if (health <= 0 && isPlaying) {
      isPlaying = false;
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('game-over').classList.remove('hidden');
      document.getElementById('final-score').innerText = 'Final Score: ' + score;
    }
  }

  function launchShip() {
    ships.push({
      x: -50,
      y: hitLineY - 150 - Math.random() * (canvas.height * 0.4),
      speed: canvas.width * 0.4,
      life: 5.0
    });
    // Clear clutter
    agentWindows = [];
    playShipSound(audioCtx.currentTime);
  }

  function spawnAgentWindow(lane) {
    const laneWidth = canvas.width / 2;
    const isLeft = lane === 0;
    
    const maxW = Math.min(160, laneWidth * 0.8);
    const minW = Math.min(100, laneWidth * 0.5);
    const w = minW + Math.random() * (maxW - minW);
    const h = 50 + Math.random() * 40;
    
    const x = isLeft ? 10 + Math.random() * (laneWidth - w - 20) : laneWidth + 10 + Math.random() * (laneWidth - w - 20);
    const y = 50 + Math.random() * (canvas.height * 0.6);
    
    agentWindows.push({
      x, y, width: w, height: h,
      text: textOpts[Math.floor(Math.random() * textOpts.length)],
      life: 2.0, maxLife: 2.0
    });
  }

  function spawnHitEffect(lane, y, grade) {
    const laneWidth = canvas.width / 2;
    const x = lane * laneWidth + laneWidth / 2;
    
    particles.push({
      x, y, text: grade,
      life: 0.6, maxLife: 0.6, vy: -100, isText: true
    });
    
    for (let i = 0; i < 8; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 200,
        vy: (Math.random() - 0.5) * 200,
        life: 0.2 + Math.random() * 0.3, maxLife: 0.5,
        isText: false,
        color: grade === 'MISS' ? 'accentMiss' : 'accentHit'
      });
    }
    
    if (grade === 'PERFECT' || grade === 'GOOD') {
      spawnAgentWindow(lane);
    }
  }

  function processTap(x, y) {
    if (!isPlaying) return;
    
    const lane = x < canvas.width / 2 ? 0 : 1;
    laneFlash[lane] = 1.0;
    
    const songTime = audioCtx.currentTime - startTime;
    const hitWindow = 0.18; // 180ms
    
    let closestNote = null;
    let minDiff = Infinity;
    
    for (let i = lastCheckedMissIndex; i < notes.length; i++) {
      const note = notes[i];
      if (note.time > songTime + hitWindow) break;
      
      if (note.playable && note.lane === lane && !note.hit && !note.missed) {
        const diff = Math.abs(note.time - songTime);
        if (diff <= hitWindow && diff < minDiff) {
          minDiff = diff;
          closestNote = note;
        }
      }
    }
    
    if (closestNote) {
      closestNote.hit = true;
      playHit(audioCtx.currentTime);
      
      let grade = 'GOOD';
      let pts = 50;
      if (minDiff < 0.06) {
        grade = 'PERFECT';
        pts = 100;
      }
      
      combo++;
      score += pts * (1 + Math.floor(combo / 10));
      health = Math.min(100, health + 1);
      
      if (grade === 'PERFECT') {
        perfectChain++;
        if (perfectChain > 0 && perfectChain % 10 === 0) launchShip();
      } else {
        perfectChain = 0;
      }
      
      spawnHitEffect(lane, hitLineY, grade);
      if (navigator.vibrate) try { navigator.vibrate(20); } catch(e){}
      updateHUD();
    } else {
      // Spam tap punishment
      combo = 0;
      perfectChain = 0;
      health -= 2;
      updateHUD();
      checkGameOver();
    }
  }

  function handleTapEvent(e) {
    if (!isPlaying) return;
    e.preventDefault();
    if (e.type === 'touchstart') {
      for (let i = 0; i < e.changedTouches.length; i++) {
        processTap(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
      }
    } else if (e.type === 'mousedown') {
      processTap(e.clientX, e.clientY);
    }
  }

  canvas.addEventListener('touchstart', handleTapEvent, {passive: false});
  canvas.addEventListener('mousedown', handleTapEvent);

  window.addEventListener('keydown', e => {
    if (!isPlaying) return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      processTap(canvas.width * 0.25, hitLineY);
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      processTap(canvas.width * 0.75, hitLineY);
    }
  });

  function updateGame(dt) {
    const songTime = audioCtx.currentTime - startTime;
    const hitWindow = 0.18;
    
    while (lastCheckedMissIndex < notes.length) {
      const note = notes[lastCheckedMissIndex];
      if (note.time < songTime - hitWindow) {
        if (note.playable && !note.hit && !note.missed) {
          note.missed = true;
          combo = 0;
          perfectChain = 0;
          health -= 5;
          updateHUD();
          spawnHitEffect(note.lane, hitLineY, 'MISS');
          if (navigator.vibrate) try { navigator.vibrate(50); } catch(e){}
          checkGameOver();
        }
        lastCheckedMissIndex++;
      } else {
        break;
      }
    }
  }

  function draw(dt) {
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const timeSec = performance.now() / 1000;
    const songTime = isPlaying && audioCtx ? (audioCtx.currentTime - startTime) : 0;
    const laneWidth = canvas.width / 2;
    
    // Background Grid
    const gridY = (timeSec * 30) % 100;
    ctx.strokeStyle = colors.glass;
    ctx.lineWidth = 1;
    for (let y = gridY; y < canvas.height; y += 100) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
    for (let x = (canvas.width/2) % 100; x < canvas.width; x += 100) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let x = (canvas.width/2) % 100; x > 0; x -= 100) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    
    // Divider
    ctx.beginPath();
    ctx.moveTo(laneWidth, 0);
    ctx.lineTo(laneWidth, canvas.height);
    ctx.strokeStyle = colors.glassBorder;
    ctx.stroke();
    
    // Targets
    for (let lane = 0; lane < 2; lane++) {
      const x = lane * laneWidth + laneWidth / 2;
      ctx.beginPath();
      ctx.arc(x, hitLineY, 35, 0, Math.PI*2);
      ctx.strokeStyle = colors.glassBorder;
      ctx.lineWidth = 3;
      ctx.stroke();
      
      if (laneFlash[lane] > 0) {
        ctx.save();
        ctx.globalAlpha = laneFlash[lane] * 0.4;
        ctx.fillStyle = colors.accent;
        ctx.beginPath(); ctx.arc(x, hitLineY, 35, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        laneFlash[lane] = Math.max(0, laneFlash[lane] - dt * 5);
      }
    }
    
    // Background Agent Windows
    for (let i = agentWindows.length - 1; i >= 0; i--) {
      const win = agentWindows[i];
      win.life -= dt;
      if (win.life <= 0) { agentWindows.splice(i, 1); continue; }
      
      const alpha = (win.life / win.maxLife) * 0.4;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = colors.glass;
      ctx.strokeStyle = colors.glassBorder;
      ctx.fillRect(win.x, win.y, win.width, win.height);
      ctx.strokeRect(win.x, win.y, win.width, win.height);
      
      ctx.fillStyle = colors.accent;
      ctx.font = '10px ' + colors.font;
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('> ' + win.text, win.x + 5, win.y + 5);
      ctx.fillText('STATUS: RUNNING', win.x + 5, win.y + 20);
      ctx.restore();
    }
    
    // Notes
    if (isPlaying) {
      for (let i = 0; i < notes.length; i++) {
        const note = notes[i];
        if (!note.playable || note.hit) continue;
        
        const diff = note.time - songTime;
        const noteY = hitLineY - diff * noteSpeed;
        
        if (noteY < -100 || noteY > canvas.height + 100) continue;
        
        let alpha = 1.0;
        if (note.ghost && diff < 0.7) {
          alpha = Math.max(0, diff / 0.7);
        }
        if (note.missed) alpha = 0.3;
        
        const nW = Math.min(140, laneWidth * 0.85);
        const nH = 36;
        const nX = note.lane * laneWidth + laneWidth / 2 - nW / 2;
        
        ctx.save();
        ctx.globalAlpha = alpha;
        
        if (note.missed) {
          ctx.strokeStyle = colors.accentMiss;
          ctx.fillStyle = colors.bg;
        } else {
          ctx.strokeStyle = colors.accent;
          ctx.fillStyle = colors.bg;
          ctx.shadowBlur = 10;
          ctx.shadowColor = colors.accent;
        }
        
        if (note.ghost) ctx.setLineDash([6, 4]);
        
        ctx.fillRect(nX, noteY - nH/2, nW, nH);
        ctx.lineWidth = 2;
        ctx.strokeRect(nX, noteY - nH/2, nW, nH);
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = note.missed ? colors.accentMiss : colors.accent;
        ctx.font = 'bold 13px ' + colors.font;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(`{ ${note.text} }`, nX + nW/2, noteY);
        
        ctx.restore();
      }
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += (p.vx || 0) * dt;
      p.y += (p.vy || 0) * dt;
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      if (p.isText) {
        ctx.fillStyle = p.text === 'MISS' ? colors.accentMiss : colors.accentHit;
        ctx.font = 'bold 22px ' + colors.font;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.text, p.x, p.y);
      } else {
        ctx.fillStyle = colors[p.color];
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
    
    // Ships
    for (let i = ships.length - 1; i >= 0; i--) {
      const ship = ships[i];
      ship.x += ship.speed * dt;
      ship.life -= dt;
      if (ship.life <= 0 || ship.x > canvas.width + 100) { ships.splice(i, 1); continue; }
      
      ctx.save();
      ctx.fillStyle = colors.accentHit;
      ctx.font = 'bold 24px ' + colors.font;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowBlur = 10;
      ctx.shadowColor = colors.accentHit;
      ctx.fillText('>====[ CLR ]====>', ship.x, ship.y);
      ctx.restore();
    }
  }

  let lastTime = performance.now();
  function loop(time) {
    const dt = Math.min(0.1, (time - lastTime) / 1000); // cap dt at 0.1s
    lastTime = time;
    
    if (isPlaying) {
      scheduleAudio();
      updateGame(dt);
    }
    draw(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function initGame() {
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('game-over').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    const ctxObj = getAudioContext();
    if (ctxObj.state === 'suspended') {
      ctxObj.resume();
    }
    
    score = 0;
    combo = 0;
    perfectChain = 0;
    health = 100;
    particles = [];
    agentWindows = [];
    ships = [];
    laneFlash = [0, 0];
    
    generateLevel();
    updateHUD();
    
    startTime = ctxObj.currentTime + 1.5; 
    nextAudioNoteIndex = 0;
    lastCheckedMissIndex = 0;
    
    isPlaying = true;
  }

  document.getElementById('start-btn').addEventListener('click', initGame);
  document.getElementById('restart-btn').addEventListener('click', initGame);

</script>
</body>
</html>
