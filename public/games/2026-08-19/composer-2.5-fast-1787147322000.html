<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karl the Fog</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #e8edf0;
    --text: #2a3540;
    --muted: #6b7d8a;
    --accent: #c47a3a;
    --panel: rgba(255,255,255,0.88);
    --panel-border: rgba(42,53,64,0.12);
    --btn-bg: #2a3540;
    --btn-text: #f4f6f8;
    --btn-hover: #3d4f5f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a2229;
      --text: #d8e0e6;
      --muted: #8fa3b0;
      --accent: #e8a05a;
      --panel: rgba(26,34,41,0.92);
      --panel-border: rgba(216,224,230,0.1);
      --btn-bg: #d8e0e6;
      --btn-text: #1a2229;
      --btn-hover: #b8c8d4;
    }
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    width: 100dvw;
    height: 100dvh;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: max(12px, env(safe-area-inset-top)) 16px 8px;
    pointer-events: none;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: clamp(11px, 2.8vw, 14px);
    letter-spacing: 0.04em;
  }
  #hud .stat { color: var(--muted); }
  #hud .stat span { color: var(--text); font-weight: 600; }
  #hud .combo { color: var(--accent); font-weight: 700; opacity: 0; transition: opacity 0.2s; }
  #hud .combo.show { opacity: 1; }
  #progress-track {
    position: absolute;
    top: max(44px, calc(env(safe-area-inset-top) + 32px));
    left: 16px; right: 16px;
    height: 3px;
    background: var(--panel-border);
    border-radius: 2px;
    z-index: 10;
    pointer-events: none;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  #canvas-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: clamp(24px, 6vw, 40px);
    max-width: 340px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    pointer-events: none;
  }
  .panel h1 {
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    line-height: 1.2;
  }
  .panel .subtitle {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: clamp(10px, 2.5vw, 12px);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 16px;
  }
  .panel p {
    font-size: clamp(13px, 3.5vw, 15px);
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .panel .score-display {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: clamp(28px, 8vw, 40px);
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .panel .score-label {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 20px;
  }
  .panel .mosaic-bar {
    height: 6px;
    background: var(--panel-border);
    border-radius: 3px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .panel .mosaic-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    transition: width 0.5s ease;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 160px;
    padding: 14px 32px;
    border: none;
    border-radius: 999px;
    background: var(--btn-bg);
    color: var(--btn-text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button[data-smoke]:hover { background: var(--btn-hover); }
  button[data-smoke]:active { transform: scale(0.96); }
  #hint {
    position: absolute;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #hint.show { opacity: 0.7; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat">time <span id="time-val">60</span>s</div>
    <div class="stat">tiles <span id="tiles-val">0</span>/<span id="tiles-max">16</span></div>
    <div class="combo" id="combo-display">×2</div>
  </div>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="canvas-wrap">
    <canvas id="game"></canvas>
    <div id="hint">tap the glowing breach</div>
  </div>
  <div class="overlay" id="title-screen">
    <div class="panel">
      <div class="subtitle">summer dusk · sf bay</div>
      <h1>Karl the Fog</h1>
      <p>Tap brief clearings before the fog seals. Each breach reveals a rooftop garden and builds the skyline mosaic.</p>
      <button data-smoke="start" type="button">Clear the Fog</button>
    </div>
  </div>
  <div class="overlay hidden" id="gameover-screen">
    <div class="panel">
      <div class="subtitle">fog returns</div>
      <h1>Skyline Complete</h1>
      <div class="score-display" id="final-score">0</div>
      <div class="score-label">gardens revealed</div>
      <div class="mosaic-bar"><div class="mosaic-fill" id="mosaic-fill"></div></div>
      <p id="final-msg">The city remembers what you uncovered.</p>
      <button data-smoke="restart" type="button">One More Dusk</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var TOTAL_TILES = 16;
  var SESSION_SEC = 60;
  var state = 'title';
  var timeLeft = SESSION_SEC;
  var tilesRevealed = 0;
  var combo = 0;
  var comboTimer = 0;
  var lastTime = 0;
  var hitPause = 0;
  var shake = 0;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var dpr = 1;
  var W = 0, H = 0;
  var skylineH = 0;

  var fogLayers = [];
  var breaches = [];
  var particles = [];
  var revealedTiles = [];
  var gardenSpots = [];
  var nextBreachAt = 0;
  var breachIdCounter = 0;
  var difficulty = 0;

  var audioCtx = null;
  var darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

  var BUILDINGS = [
    { w: 0.07, h: 0.55, garden: true },
    { w: 0.05, h: 0.38, garden: false },
    { w: 0.06, h: 0.72, garden: true },
    { w: 0.04, h: 0.45, garden: false },
    { w: 0.08, h: 0.62, garden: true },
    { w: 0.05, h: 0.50, garden: false },
    { w: 0.06, h: 0.80, garden: true },
    { w: 0.04, h: 0.35, garden: false },
    { w: 0.07, h: 0.58, garden: true },
    { w: 0.05, h: 0.42, garden: false },
    { w: 0.06, h: 0.68, garden: true },
    { w: 0.05, h: 0.48, garden: false },
    { w: 0.07, h: 0.75, garden: true },
    { w: 0.04, h: 0.32, garden: false },
    { w: 0.06, h: 0.55, garden: true },
    { w: 0.05, h: 0.40, garden: false }
  ];

  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { /* noop */ }
  }

  function playTone(freq, dur, vol, type) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* noop */ }
  }

  function playClear() {
    playTone(440 + combo * 30, 0.25, 0.1, 'sine');
    playTone(660 + combo * 20, 0.15, 0.06, 'triangle');
  }

  function playMiss() {
    playTone(180, 0.3, 0.06, 'sawtooth');
  }

  function playDouble() {
    playTone(520, 0.12, 0.08, 'sine');
    setTimeout(function () { playTone(780, 0.15, 0.08, 'sine'); }, 80);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    skylineH = H * 0.22;
  }

  function resetGame() {
    timeLeft = SESSION_SEC;
    tilesRevealed = 0;
    combo = 0;
    comboTimer = 0;
    hitPause = 0;
    shake = 0;
    difficulty = 0;
    breaches = [];
    particles = [];
    revealedTiles = [];
    gardenSpots = [];
    nextBreachAt = 0.8;
    breachIdCounter = 0;
    initFogLayers();
    initSkylineTiles();
    updateHUD();
    document.getElementById('hint').classList.add('show');
    setTimeout(function () {
      document.getElementById('hint').classList.remove('show');
    }, 4000);
  }

  function initFogLayers() {
    fogLayers = [];
    var count = 5;
    for (var i = 0; i < count; i++) {
      fogLayers.push({
        y: (i / count) * H * 0.7,
        speed: 0.015 + i * 0.008,
        phase: Math.random() * Math.PI * 2,
        opacity: 0.12 + i * 0.06,
        scale: 0.8 + i * 0.15,
        offset: Math.random() * 1000
      });
    }
  }

  function initSkylineTiles() {
    revealedTiles = new Array(TOTAL_TILES);
    for (var i = 0; i < TOTAL_TILES; i++) revealedTiles[i] = false;
  }

  function spawnBreach() {
    if (tilesRevealed >= TOTAL_TILES) return;
    var margin = 50;
    var playTop = H * 0.08;
    var playBottom = H - skylineH - margin;
    var x = margin + Math.random() * (W - margin * 2);
    var y = playTop + Math.random() * (playBottom - playTop);
    var baseWindow = Math.max(1.2, 3.5 - difficulty * 0.35);
    var needsDouble = difficulty > 4 && Math.random() < Math.min(0.6, (difficulty - 4) * 0.12);
    var radius = 36 + Math.random() * 16;
    breaches.push({
      id: ++breachIdCounter,
      x: x, y: y,
      radius: radius,
      life: baseWindow,
      maxLife: baseWindow,
      pulse: 0,
      double: needsDouble,
      tapsNeeded: needsDouble ? 2 : 1,
      tapsDone: 0,
      sealed: false
    });
  }

  function spawnParticles(x, y, count, color) {
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 1 + Math.random() * 3;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 0.6 + Math.random() * 0.5,
        maxLife: 1,
        size: 2 + Math.random() * 3,
        color: color
      });
    }
  }

  function revealTile(x, y) {
    if (tilesRevealed >= TOTAL_TILES) return;
    var idx = tilesRevealed;
    revealedTiles[idx] = true;
    tilesRevealed++;
    var b = BUILDINGS[idx % BUILDINGS.length];
    gardenSpots.push({ x: x, y: y, idx: idx, b: b, age: 0 });
    combo++;
    comboTimer = 3;
    hitPause = 0.08;
    shake = 4;
    spawnParticles(x, y, 18, darkMode ? '#7ab892' : '#5a8f6a');
    spawnParticles(x, y, 8, darkMode ? '#d8e0e6' : '#c5d0d8');
    playClear();
    if (navigator.vibrate) navigator.vibrate(12);
    updateHUD();
    if (tilesRevealed >= TOTAL_TILES) {
      endGame(true);
    }
  }

  function handleBreachTap(bx, by) {
    for (var i = breaches.length - 1; i >= 0; i--) {
      var b = breaches[i];
      if (b.sealed) continue;
      var dx = bx - b.x;
      var dy = by - b.y;
      if (dx * dx + dy * dy <= (b.radius + 20) * (b.radius + 20)) {
        b.tapsDone++;
        b.pulse = 1;
        if (b.tapsDone >= b.tapsNeeded) {
          revealTile(b.x, b.y);
          breaches.splice(i, 1);
        } else {
          playDouble();
          if (navigator.vibrate) navigator.vibrate(8);
        }
        return true;
      }
    }
    return false;
  }

  function updateHUD() {
    document.getElementById('time-val').textContent = Math.ceil(timeLeft);
    document.getElementById('tiles-val').textContent = tilesRevealed;
    document.getElementById('tiles-max').textContent = TOTAL_TILES;
    document.getElementById('progress-fill').style.width = (tilesRevealed / TOTAL_TILES * 100) + '%';
    var cd = document.getElementById('combo-display');
    if (combo > 1) {
      cd.textContent = '×' + combo;
      cd.classList.add('show');
    } else {
      cd.classList.remove('show');
    }
  }

  function endGame(complete) {
    if (state === 'gameover') return;
    state = 'gameover';
    document.getElementById('gameover-screen').classList.remove('hidden');
    document.getElementById('final-score').textContent = tilesRevealed;
    document.getElementById('mosaic-fill').style.width = (tilesRevealed / TOTAL_TILES * 100) + '%';
    var msg = complete
      ? 'Every rooftop garden blooms beneath the fog.'
      : tilesRevealed >= TOTAL_TILES * 0.75
        ? 'The fog almost won. Almost.'
        : 'Karl rolls back in. Try again at dusk.';
    document.getElementById('final-msg').textContent = msg;
    playTone(330, 0.5, 0.06, 'sine');
    playTone(220, 0.8, 0.04, 'sine');
  }

  function startGame() {
    state = 'playing';
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    resetGame();
    initAudio();
    lastTime = performance.now();
  }

  function getPointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX;
      cy = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length) {
      cx = e.changedTouches[0].clientX;
      cy = e.changedTouches[0].clientY;
    } else {
      cx = e.clientX;
      cy = e.clientY;
    }
    return { x: cx - rect.left, y: cy - rect.top };
  }

  function onPointerDown(e) {
    if (state !== 'playing') return;
    e.preventDefault();
    var pos = getPointerPos(e);
    if (!handleBreachTap(pos.x, pos.y)) {
      combo = 0;
      comboTimer = 0;
      updateHUD();
    }
  }

  function drawSky(wt) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    if (darkMode) {
      g.addColorStop(0, '#1e2830');
      g.addColorStop(0.5, '#243038');
      g.addColorStop(0.85, '#2a3540');
      g.addColorStop(1, '#1a2229');
    } else {
      g.addColorStop(0, '#b8c8d4');
      g.addColorStop(0.4, '#c5d0d8');
      g.addColorStop(0.75, '#d4c4b0');
      g.addColorStop(1, '#c47a3a');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var sunY = H * 0.35;
    var sunX = W * 0.75;
    var sunG = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 80);
    sunG.addColorStop(0, darkMode ? 'rgba(232,160,90,0.25)' : 'rgba(196,122,58,0.35)');
    sunG.addColorStop(1, 'rgba(196,122,58,0)');
    ctx.fillStyle = sunG;
    ctx.fillRect(0, 0, W, H);
  }

  function drawSkyline(wt) {
    var baseY = H - skylineH * 0.15;
    var tileW = W / TOTAL_TILES;
    var buildingColor = darkMode ? '#3d4f5f' : '#5a6d7d';
    var litColor = darkMode ? '#6b8a9a' : '#7a8f9f';
    var gardenColor = darkMode ? '#4a7a5a' : '#5a8f6a';
    var gardenLit = darkMode ? '#7ab892' : '#8fc4a0';

    for (var i = 0; i < TOTAL_TILES; i++) {
      var b = BUILDINGS[i];
      var bx = i * tileW + tileW * 0.1;
      var bw = tileW * b.w * 3;
      var bh = skylineH * b.h;
      var by = baseY - bh;

      if (revealedTiles[i]) {
        ctx.fillStyle = litColor;
      } else {
        ctx.fillStyle = buildingColor;
        ctx.globalAlpha = 0.35;
      }
      ctx.fillRect(bx, by, bw, bh + skylineH * 0.15);
      ctx.globalAlpha = 1;

      if (revealedTiles[i] && b.garden) {
        var gx = bx + bw * 0.15;
        var gy = by - 4;
        var gw = bw * 0.7;
        ctx.fillStyle = gardenLit;
        ctx.fillRect(gx, gy, gw, 6);
        ctx.fillStyle = gardenColor;
        for (var t = 0; t < 3; t++) {
          ctx.beginPath();
          ctx.arc(gx + gw * (0.2 + t * 0.3), gy - 2, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (revealedTiles[i]) {
        var winCount = Math.floor(bh / 14);
        ctx.fillStyle = darkMode ? 'rgba(232,160,90,0.5)' : 'rgba(255,220,160,0.6)';
        for (var w = 0; w < winCount; w++) {
          if (Math.sin(i * 7 + w * 3 + wt * 0.5) > 0.2) {
            ctx.fillRect(bx + bw * 0.25, by + 8 + w * 14, bw * 0.2, 4);
            ctx.fillRect(bx + bw * 0.55, by + 8 + w * 14, bw * 0.2, 4);
          }
        }
      }
    }
  }

  function drawGardenSpots(wt) {
    for (var i = 0; i < gardenSpots.length; i++) {
      var g = gardenSpots[i];
      g.age += 0.016;
      var alpha = Math.max(0, 1 - g.age / 2);
      if (alpha <= 0) continue;
      var gr = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, 30 + g.age * 10);
      gr.addColorStop(0, darkMode
        ? 'rgba(122,184,146,' + (alpha * 0.4) + ')'
        : 'rgba(90,143,106,' + (alpha * 0.5) + ')');
      gr.addColorStop(1, 'rgba(90,143,106,0)');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(g.x, g.y, 30 + g.age * 10, 0, Math.PI * 2);
      ctx.fill();
    }
    gardenSpots = gardenSpots.filter(function (g) { return g.age < 2; });
  }

  function drawFog(wt) {
    for (var i = 0; i < fogLayers.length; i++) {
      var f = fogLayers[i];
      f.phase += f.speed * 0.016;
      var scrollX = Math.sin(wt * f.speed + f.phase) * W * 0.3;
      var blobs = 6;
      for (var b = 0; b < blobs; b++) {
        var bx = ((b / blobs) * W * 1.5 + scrollX + f.offset) % (W * 1.5) - W * 0.25;
        var by = f.y + Math.sin(wt * 0.3 + b + f.phase) * 30;
        var br = W * 0.25 * f.scale;
        var fg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
        var base = darkMode ? '180,195,205' : '168,184,196';
        fg.addColorStop(0, 'rgba(' + base + ',' + f.opacity + ')');
        fg.addColorStop(0.5, 'rgba(' + base + ',' + (f.opacity * 0.6) + ')');
        fg.addColorStop(1, 'rgba(' + base + ',0)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    var topFog = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    topFog.addColorStop(0, darkMode ? 'rgba(180,195,205,0.15)' : 'rgba(197,208,216,0.2)');
    topFog.addColorStop(1, 'rgba(197,208,216,0)');
    ctx.fillStyle = topFog;
    ctx.fillRect(0, 0, W, H * 0.5);
  }

  function drawBreaches(wt) {
    for (var i = breaches.length - 1; i >= 0; i--) {
      var b = breaches[i];
      b.life -= 0.016;
      b.pulse = Math.max(0, b.pulse - 0.05);
      if (b.life <= 0) {
        b.sealed = true;
        playMiss();
        combo = 0;
        comboTimer = 0;
        updateHUD();
        spawnParticles(b.x, b.y, 6, darkMode ? '#6b7d8a' : '#8fa3b0');
        breaches.splice(i, 1);
        continue;
      }

      var progress = b.life / b.maxLife;
      var urgency = 1 - progress;
      var pulseR = b.radius + Math.sin(wt * 6) * 4 + b.pulse * 12;
      var alpha = 0.5 + urgency * 0.4;

      var glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, pulseR * 1.8);
      glow.addColorStop(0, darkMode
        ? 'rgba(232,160,90,' + (alpha * 0.6) + ')'
        : 'rgba(196,122,58,' + (alpha * 0.5) + ')');
      glow.addColorStop(0.6, 'rgba(196,122,58,0)');
      glow.addColorStop(1, 'rgba(196,122,58,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(b.x, b.y, pulseR * 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = darkMode
        ? 'rgba(232,160,90,' + alpha + ')'
        : 'rgba(196,122,58,' + alpha + ')';
      ctx.lineWidth = 2 + urgency * 2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, pulseR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = darkMode ? 'rgba(216,224,230,0.9)' : 'rgba(42,53,64,0.85)';
      ctx.font = '11px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (b.double && b.tapsDone < b.tapsNeeded) {
        ctx.fillText('×2', b.x, b.y);
      } else {
        ctx.fillText('●', b.x, b.y);
      }

      var arcStart = -Math.PI / 2;
      var arcEnd = arcStart + progress * Math.PI * 2;
      ctx.strokeStyle = darkMode ? 'rgba(122,184,146,0.8)' : 'rgba(90,143,106,0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(b.x, b.y, pulseR + 6, arcStart, arcEnd);
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.life -= 0.016;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      var a = p.life / p.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawVignette() {
    var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, darkMode ? 'rgba(0,0,0,0.35)' : 'rgba(42,53,64,0.12)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function update(dt) {
    if (state !== 'playing') return;

    if (hitPause > 0) {
      hitPause -= dt;
      return;
    }

    timeLeft -= dt;
    difficulty = (SESSION_SEC - timeLeft) / SESSION_SEC * 10;

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) { combo = 0; updateHUD(); }
    }

    nextBreachAt -= dt;
    if (nextBreachAt <= 0 && tilesRevealed < TOTAL_TILES) {
      spawnBreach();
      var interval = Math.max(0.8, 2.8 - difficulty * 0.22);
      if (difficulty > 5 && Math.random() < 0.35) {
        setTimeout(function () {
          if (state === 'playing' && tilesRevealed < TOTAL_TILES) spawnBreach();
        }, 300 + Math.random() * 400);
      }
      nextBreachAt = interval;
    }

    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame(tilesRevealed >= TOTAL_TILES);
    }
    updateHUD();
  }

  function render(wt) {
    ctx.save();
    if (shake > 0) {
      shake -= 0.5;
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawSky(wt);
    drawSkyline(wt);
    drawGardenSpots(wt);
    drawFog(wt);
    drawBreaches(wt);
    drawParticles();
    drawVignette();
    ctx.restore();
  }

  function loop(now) {
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    var wt = now * 0.001;

    if (state === 'playing') update(dt);
    if (state === 'playing' || state === 'gameover' || state === 'title') {
      render(wt);
    }
    requestAnimationFrame(loop);
  }

  document.querySelector('[data-smoke="start"]').addEventListener('click', function () {
    startGame();
  });

  document.querySelector('[data-smoke="restart"]').addEventListener('click', function () {
    startGame();
  });

  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('mousedown', onPointerDown);

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === 'title') startGame();
      else if (state === 'gameover') startGame();
    }
  });

  window.addEventListener('resize', function () {
    resize();
    if (state === 'title') initFogLayers();
  });

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      darkMode = e.matches;
    });
  }

  resize();
  initFogLayers();
  initSkylineTiles();
  state = 'title';
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
