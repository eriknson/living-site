<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shipped by Sunrise</title>
  <style>
    :root {
      --bg-night: #151921;
      --card-bg: #2d3139;
      --text: #e9ecef;
      --text-muted: #adb5bd;
      --shadow-color: rgba(0, 0, 0, 0.5);
      --kw-color: #e76f51;
      --str-color: #2a9d8f;
      --com-color: #6c757d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-night: #151921;
        --card-bg: #2d3139;
        --text: #e9ecef;
        --text-muted: #adb5bd;
        --shadow-color: rgba(0, 0, 0, 0.5);
        --kw-color: #e76f51;
        --str-color: #2a9d8f;
        --com-color: #6c757d;
      }
      .screen-container { background: rgba(21, 25, 33, 0.9); }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-night: #e9ecef;
        --card-bg: #ffffff;
        --text: #212529;
        --text-muted: #6c757d;
        --shadow-color: rgba(0, 0, 0, 0.1);
        --kw-color: #d00000;
        --str-color: #008000;
        --com-color: #adb5bd;
      }
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-night);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      user-select: none;
      -webkit-user-select: none;
      color: var(--text);
      touch-action: none;
    }

    #sky-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .sky-night {
      position: absolute; inset: 0;
      background: linear-gradient(to top, #151921, #0d1117);
    }
    @media (prefers-color-scheme: light) {
      .sky-night {
        background: linear-gradient(to top, #b0b8c4, #e2e6ea);
      }
    }

    .sky-dawn {
      position: absolute; inset: 0;
      background: linear-gradient(to top, #e76f51, #f4a261, transparent);
      opacity: 0;
      mix-blend-mode: screen;
      z-index: 2;
    }

    #sun {
      position: absolute;
      bottom: -60vh;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 100vw;
      border-radius: 50%;
      background: radial-gradient(circle, #ffb703 0%, #fb8500 50%, #e76f51 100%);
      filter: blur(20px);
      opacity: 0.8;
      z-index: 1;
    }

    .stars {
      position: absolute; inset: 0; z-index: 1;
      background-image:
        radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 50px 160px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 160px 120px, #fff, rgba(0,0,0,0));
      background-repeat: repeat; background-size: 200px 200px;
    }

    .fog {
      position: absolute; bottom: 0; left: 0; right: 0; height: 40vh;
      background: linear-gradient(to top, rgba(255,255,255,0.1), transparent);
      z-index: 3;
    }
    @media (prefers-color-scheme: light) {
      .fog { background: linear-gradient(to top, rgba(255,255,255,0.6), transparent); }
      .stars { display: none; }
    }

    .window-frame {
      position: absolute; inset: 0;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
      border: 20px solid #1a1a1a;
      pointer-events: none; z-index: 5;
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: light) {
      .window-frame {
        border-color: #f8f9fa;
        box-shadow: inset 0 0 100px rgba(0,0,0,0.2);
      }
    }

    #game-ui {
      position: absolute; inset: 0; z-index: 10; display: none;
    }

    .score-bar-container {
      position: absolute;
      top: max(30px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      width: 80%; max-width: 400px; height: 12px;
      background: rgba(0,0,0,0.3); border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
    }

    #score-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #f4a261, #e76f51, #e9c46a);
      transition: width 0.3s ease;
    }

    #card-stack {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 80%; max-width: 320px; height: 60%; max-height: 400px;
      perspective: 1000px;
    }

    .card {
      position: absolute; inset: 0;
      background: var(--card-bg); border-radius: 12px;
      box-shadow: 0 10px 20px var(--shadow-color), inset 0 2px 0 rgba(255,255,255,0.05);
      display: flex; flex-direction: column;
      padding: 24px; box-sizing: border-box; touch-action: none;
      border: 1px solid rgba(150,150,150,0.1);
    }

    .card-label {
      font-weight: 800; font-size: 14px; margin-bottom: 16px;
      text-align: center; color: var(--text-muted);
      min-height: 20px; letter-spacing: 1px;
    }

    .card-code {
      flex-grow: 1; margin: 0; font-size: 14px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-all; overflow: hidden;
      color: var(--text);
    }

    .hint {
      position: absolute; font-weight: bold; color: #adb5bd;
      opacity: 0.1; transition: opacity 0.2s ease;
      pointer-events: none; font-size: 20px; letter-spacing: 2px;
    }
    #hint-left { left: 20px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
    #hint-right { right: 20px; top: 50%; transform: translateY(-50%) rotate(90deg); }
    #hint-top { top: max(60px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); }

    /* Syntax Highlighting */
    .tok-com, .tok-com * { color: var(--com-color) !important; font-style: italic; }
    .tok-str, .tok-str * { color: var(--str-color) !important; }
    .tok-kw { color: var(--kw-color); font-weight: bold; }

    /* Screens */
    .screen-container {
      position: absolute; inset: 0; z-index: 20;
      pointer-events: none; /* Required by prompt to not intercept clicks */
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(21, 25, 33, 0.9);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    }
    @media (prefers-color-scheme: light) {
      .screen-container { background: rgba(248, 249, 250, 0.9); }
    }

    .screen-content {
      pointer-events: none; display: flex; flex-direction: column;
      align-items: center; padding: 20px; text-align: center;
    }

    button {
      pointer-events: auto; /* Required by prompt: make button clickable */
      background: #e76f51; color: #fff; border: none;
      padding: 16px 32px; font-size: 18px; font-weight: bold; font-family: inherit;
      border-radius: 8px; margin-top: 32px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(231, 111, 81, 0.3);
      transition: transform 0.1s, box-shadow 0.1s;
      animation: pulse 2s infinite;
    }
    button:active {
      transform: scale(0.95);
      box-shadow: 0 2px 6px rgba(231, 111, 81, 0.3);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(231, 111, 81, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(231, 111, 81, 0); }
      100% { box-shadow: 0 0 0 0 rgba(231, 111, 81, 0); }
    }

    h1 { margin: 0 0 16px 0; font-size: 32px; color: var(--text); }
    p { margin: 0 0 8px 0; color: var(--text-muted); font-size: 14px; line-height: 1.5; }

    .shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }
  </style>
</head>
<body>

  <div id="sky-container">
    <div class="sky-night"></div>
    <div class="stars" id="stars"></div>
    <div id="sun"></div>
    <div class="sky-dawn" id="dawn-layer"></div>
    <div class="fog"></div>
  </div>
  
  <div class="window-frame"></div>

  <div id="game">
  <div id="game-ui">
    <div class="score-bar-container"><div id="score-fill"></div></div>
    <div class="hint" id="hint-left">SHIP</div>
    <div class="hint" id="hint-right">ITERATE</div>
    <div class="hint" id="hint-top">ARCHIVE</div>
    <div id="card-stack"></div>
  </div>
  </div>

  <div id="start-screen" class="screen-container">
    <div class="screen-content">
      <h1>SHIPPED BY SUNRISE</h1>
      <p>Clear the queue before dawn.</p>
      <div style="background: var(--card-bg); padding: 16px; border-radius: 8px; margin-top: 16px; box-shadow: 0 4px 12px var(--shadow-color);">
        <p style="color: var(--text);"><strong>← Swipe Left</strong> to SHIP (clean)</p>
        <p style="color: var(--text);"><strong>Swipe Right →</strong> to ITERATE (bugs)</p>
        <p style="color: var(--text);"><strong>↑ Swipe Up</strong> to ARCHIVE (stale)</p>
      </div>
      <p style="margin-top: 16px; font-size: 12px; color: #e76f51; font-weight: bold;">Beware of decoy labels. The code is the truth.</p>
      <button data-smoke="start" onclick="startGame()">START SHIFT</button>
    </div>
  </div>

  <div id="gameover-screen" class="screen-container" style="display: none;">
    <div class="screen-content">
      <h1 id="gameover-title"></h1>
      <p id="gameover-desc"></p>
      <button data-smoke="restart" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const shipSnippets = [
      "export const setup = () => {\n  return init();\n};",
      "const config = {\n  theme: 'dark',\n  retries: 3\n};",
      "import { memo } from 'react';\nexport default memo(MyComp);",
      "// Coverage: 100%\nfunction calculate(a, b) {\n  return a + b;\n}",
      "app.get('/health', (req, res) => {\n  res.send('OK');\n});",
      "export class Agent {\n  constructor(id) {\n    this.id = id;\n  }\n}",
      "function isEmail(str) {\n  return str.includes('@');\n}",
      "import { logger } from './utils';\nlogger.info('Started');",
      "const items = data.map(x => x.id);\nreturn items;",
      "// Tested in production\nexport const VERSION = '1.0';"
    ];

    const iterateSnippets = [
      "function process() {\n  // TODO: handle edge cases\n  return true;\n}",
      "const data = getData('/api');\nconsole.log(data); // bug",
      "// FIXME: memory leak\nlisteners.push(cb);",
      "let user = null;\nconsole.log(user.name);",
      "while (true) {\n  doWork(); // missing break\n}",
      "function calc() {\n  return; \n  doStuff();\n}",
      "try {\n  risky();\n} catch (e) {\n  // ignore for now\n}",
      "// Random crash here\ninitWebGL();",
      "const x = arr[10];\n// arr only has 5 items",
      "function auth() {\n  return true; // bypass auth\n}"
    ];

    const archiveSnippets = [
      "// Deprecated in v2\nfunction oldAuth() { ... }",
      "/* \nfunction unused() {\n  return 42;\n}\n*/",
      "const LEGACY_KEY = '123';\n// no longer used",
      "// WONTFIX - Issue #412\nif (ie11) { polyfill(); }",
      "// Removed. Use new API.\n// get('/old-api')",
      "const STALE_FLAG = false;",
      "// console.log('debug');",
      "function _oldHelper() {\n  return null;\n}",
      "// 2021 code\nvar gulp = require('gulp');",
      "<!-- <div class=\"old\"></div> -->"
    ];

    let gameState = 'start';
    let score = 0;
    let startTime = 0;
    let gameDuration = 45000;
    let animationFrameId;
    let currentCards = [];
    let isAnimating = false;
    let audioCtx;

    document.addEventListener('touchmove', function(e) {
      if (gameState === 'playing' && e.cancelable) e.preventDefault();
    }, { passive: false });

    function initAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.setValueAtTime(600, t + 0.1);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.linearRampToValueAtTime(100, t + 0.2);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
      } else if (type === 'win') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.setValueAtTime(500, t + 0.1);
        osc.frequency.setValueAtTime(600, t + 0.2);
        osc.frequency.setValueAtTime(800, t + 0.3);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.6);
        osc.start(t); osc.stop(t + 0.6);
      }
    }

    function vibrate(pattern) {
      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    function startGame() {
      gameState = 'playing';
      score = 0;
      isAnimating = false;
      startTime = performance.now();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('gameover-screen').style.display = 'none';
      document.getElementById('game-ui').style.display = 'block';
      updateScore();
      currentCards = [generateCard(0), generateCard(0), generateCard(0)];
      renderCards();
      initAudio();
      gameLoop();
    }

    function gameLoop() {
      if (gameState !== 'playing') return;
      const elapsed = performance.now() - startTime;
      const progress = Math.min(elapsed / gameDuration, 1);
      
      updateBackground(progress);

      if (progress >= 1) {
        endGame(false);
        return;
      }
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function updateBackground(progress) {
      const sun = document.getElementById('sun');
      sun.style.bottom = `${-60 + progress * 100}vh`;
      document.getElementById('dawn-layer').style.opacity = progress;
      document.getElementById('stars').style.opacity = 1 - progress * 2;
    }

    function endGame(won) {
      gameState = 'gameover';
      cancelAnimationFrame(animationFrameId);
      document.getElementById('game-ui').style.display = 'none';
      const overScreen = document.getElementById('gameover-screen');
      overScreen.style.display = 'flex';
      document.getElementById('gameover-title').innerText = won ? 'SHIFT COMPLETE' : 'SUNRISE REACHED';
      document.getElementById('gameover-desc').innerText = won ? 'You cleared the queue before dawn.' : 'The queue is still full.';
      if (won) playSound('win');
      else playSound('wrong');
    }

    function generateCard(currentScore) {
      let stage = 1;
      if (currentScore >= 5) stage = 2;
      if (currentScore >= 10) stage = 3;

      const types = ['ship', 'iterate', 'archive'];
      const type = types[Math.floor(Math.random() * types.length)];
      let snippetList = type === 'ship' ? shipSnippets : type === 'iterate' ? iterateSnippets : archiveSnippets;
      let code = snippetList[Math.floor(Math.random() * snippetList.length)];

      if (stage >= 2) {
        const pad1 = ["import { utils } from './lib';", "const DEBUG = false;", "// autogenerated block"];
        const pad2 = ["// end of file", "export default {};", ""];
        code = pad1[Math.floor(Math.random() * pad1.length)] + "\n\n" + code;
        if (stage === 3) code += "\n\n" + pad2[Math.floor(Math.random() * pad2.length)];
      }

      let label = "";
      if (stage === 1) {
        if (type === 'ship') label = "[READY]";
        if (type === 'iterate') label = "[BUG]";
        if (type === 'archive') label = "[STALE]";
      } else if (stage === 2) {
        if (Math.random() > 0.5) {
          if (type === 'ship') label = "[LGTM]";
          if (type === 'iterate') label = "[WIP]";
          if (type === 'archive') label = "[OLD]";
        }
      } else if (stage === 3) {
        const allLabels = ["[READY]", "[BUG]", "[STALE]", "[LGTM]", "[WIP]", "[OLD]", "[SHIP IT]", "[DEPRECATED]"];
        label = allLabels[Math.floor(Math.random() * allLabels.length)];
      }
      return { type, code, label };
    }

    function highlight(code) {
      let html = code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
      html = html.replace(/(\/\/.*|\/\*[\s\S]*?\*\/|&lt;!--[\s\S]*?--&gt;)/g, '<span class="tok-com">$1</span>');
      html = html.replace(/('[^']*'|"[^"]*")/g, '<span class="tok-str">$1</span>');
      html = html.replace(/\b(function|const|let|var|return|export|import|class|if|while|for|try|catch|new|await|async|default)\b/g, '<span class="tok-kw">$1</span>');
      return html;
    }

    function renderCards() {
      const stack = document.getElementById('card-stack');
      stack.innerHTML = '';
      for (let i = currentCards.length - 1; i >= 0; i--) {
        const data = currentCards[i];
        const el = document.createElement('div');
        el.className = 'card';
        el.style.zIndex = 10 - i;
        el.style.transform = `scale(${1 - i * 0.05}) translateY(${i * 20}px)`;
        el.style.opacity = 1 - i * 0.2;

        const labelEl = document.createElement('div');
        labelEl.className = 'card-label';
        labelEl.innerText = data.label;

        const codeEl = document.createElement('pre');
        codeEl.className = 'card-code';
        codeEl.innerHTML = highlight(data.code);

        el.appendChild(labelEl);
        el.appendChild(codeEl);
        stack.appendChild(el);

        if (i === 0) attachDragEvents(el, data.type);
      }
    }

    function attachDragEvents(cardEl, expectedType) {
      let isDragging = false;
      let startX = 0, startY = 0;
      let curX = 0, curY = 0;

      function onDown(e) {
        if (e.button !== 0 && e.type.startsWith('mouse')) return;
        if (isAnimating) return;
        isDragging = true;
        startX = e.clientX; startY = e.clientY;
        cardEl.style.transition = 'none';
        cardEl.setPointerCapture(e.pointerId);
      }

      function onMove(e) {
        if (!isDragging || isAnimating) return;
        curX = e.clientX - startX; curY = e.clientY - startY;
        cardEl.style.transform = `translate(${curX}px, ${curY}px) rotate(${curX * 0.05}deg)`;
        
        document.getElementById('hint-left').style.opacity = curX < -60 ? 0.8 : 0.1;
        document.getElementById('hint-right').style.opacity = curX > 60 ? 0.8 : 0.1;
        document.getElementById('hint-top').style.opacity = (curY < -60 && Math.abs(curX) < 60) ? 0.8 : 0.1;
      }

      function onUp(e) {
        if (!isDragging || isAnimating) return;
        isDragging = false;
        cardEl.style.transition = 'transform 0.3s ease, opacity 0.3s ease';

        let swipedDir = null;
        if (curX < -80) swipedDir = 'left';
        else if (curX > 80) swipedDir = 'right';
        else if (curY < -80 && Math.abs(curX) < 80) swipedDir = 'top';

        document.getElementById('hint-left').style.opacity = 0.1;
        document.getElementById('hint-right').style.opacity = 0.1;
        document.getElementById('hint-top').style.opacity = 0.1;

        if (swipedDir) {
          handleSwipe(swipedDir, expectedType);
        } else {
          cardEl.style.transform = `translate(0px, 0px) rotate(0deg)`;
        }
      }

      cardEl.addEventListener('pointerdown', onDown);
      cardEl.addEventListener('pointermove', onMove);
      cardEl.addEventListener('pointerup', onUp);
      cardEl.addEventListener('pointercancel', onUp);
    }

    function spawnFeedback(text, color) {
      const el = document.createElement('div');
      el.innerText = text;
      el.style.position = 'absolute';
      el.style.left = '50%'; el.style.top = '40%';
      el.style.color = color;
      el.style.fontWeight = 'bold'; el.style.fontSize = '32px';
      el.style.pointerEvents = 'none'; el.style.zIndex = '100';
      el.style.transition = 'transform 0.5s ease-out, opacity 0.5s ease-out';
      el.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(el);

      requestAnimationFrame(() => {
        el.style.transform = 'translate(-50%, -100px)';
        el.style.opacity = '0';
      });
      setTimeout(() => el.remove(), 500);
    }

    function handleSwipe(dir, expectedType) {
      if (isAnimating) return;
      isAnimating = true;

      const cardEl = document.querySelector('.card:last-child');
      if (cardEl) {
        cardEl.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
        if (dir === 'left') cardEl.style.transform = `translate(-300px, 0px) rotate(-15deg)`;
        if (dir === 'right') cardEl.style.transform = `translate(300px, 0px) rotate(15deg)`;
        if (dir === 'top') cardEl.style.transform = `translate(0px, -300px) rotate(0deg)`;
        cardEl.style.opacity = 0;
      }

      let choice = '';
      if (dir === 'left') choice = 'ship';
      if (dir === 'right') choice = 'iterate';
      if (dir === 'top') choice = 'archive';

      if (choice === expectedType) {
        score += 1;
        vibrate(50); playSound('correct');
        spawnFeedback('+1', '#2a9d8f');
      } else {
        score = Math.max(0, score - 5);
        vibrate([50, 50, 50]); playSound('wrong');
        document.getElementById('game-ui').classList.add('shake');
        setTimeout(() => document.getElementById('game-ui').classList.remove('shake'), 300);
        spawnFeedback('ERROR', '#e76f51');
      }

      updateScore();

      if (score >= 15) {
        setTimeout(() => endGame(true), 200);
        return;
      }

      setTimeout(() => {
        currentCards.shift();
        currentCards.push(generateCard(score));
        renderCards();
        isAnimating = false;
      }, 200);
    }

    function updateScore() {
      const pct = Math.min((score / 15) * 100, 100);
      document.getElementById('score-fill').style.width = `${pct}%`;
    }

    window.addEventListener('keydown', (e) => {
      if (gameState !== 'playing' || isAnimating || !currentCards.length) return;
      let dir = null;
      if (e.key === 'ArrowLeft') dir = 'left';
      if (e.key === 'ArrowRight') dir = 'right';
      if (e.key === 'ArrowUp') dir = 'top';
      if (dir) handleSwipe(dir, currentCards[0].type);
    });
  </script>
</body>
</html>
