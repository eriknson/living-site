<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Prove You're Human — a wobble CAPTCHA</title>
<style>
  :root{
    --paper:#f4f0e6;
    --ink:#151210;
    --soft:rgba(21,18,16,.55);
    --ok:#0f8a4d;
    --bad:#d63a2c;
    --edge:#151210;
    --panel:rgba(244,240,230,.9);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0e0e10;
      --ink:#efece3;
      --soft:rgba(239,236,227,.5);
      --ok:#37c07d;
      --bad:#ff5c4c;
      --edge:#efece3;
      --panel:rgba(14,14,16,.9);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100dvh;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent;
  }
  #app{position:fixed; inset:0; width:100dvw; height:100dvh; overflow:hidden;}
  canvas#game{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none;}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; left:0; right:0;
    top:calc(env(safe-area-inset-top,0px) + 10px);
    padding:0 max(12px, env(safe-area-inset-left)) 0 max(12px, env(safe-area-inset-right));
    display:flex; flex-direction:column; gap:8px;
    pointer-events:none; z-index:5;
    transition:opacity .25s;
  }
  #hud.hide{opacity:0}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:13px; font-weight:700; letter-spacing:.1em;}
  #gates{opacity:.85}
  #badge{color:var(--ok); font-weight:800; letter-spacing:.12em; opacity:0; transition:opacity .3s; margin-left:8px}
  #badge.on{opacity:1}
  #meter{position:relative; height:22px; border:2px solid var(--edge); border-radius:3px; overflow:hidden; background:var(--paper);}
  #meterFill{position:absolute; left:0; top:0; bottom:0; width:100%; background:var(--ok);
    transition:width .09s linear, background .2s;}
  #meterTxt{position:absolute; left:9px; top:0; line-height:22px; font-size:11px; font-weight:800;
    letter-spacing:.14em; color:var(--ink); text-shadow:0 0 3px var(--paper),0 0 3px var(--paper);}
  #meter.low #meterFill{background:var(--bad)}
  #meter.low{animation:meterflash .5s steps(2,jump-none) infinite}
  @keyframes meterflash{50%{box-shadow:inset 0 0 0 2px var(--bad)}}

  /* ---------- Overlays ---------- */
  .overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px; pointer-events:none; z-index:10; text-align:center;}
  .overlay.hide{display:none}
  .card{
    max-width:min(430px,92vw);
    width:100%;
    background:var(--panel);
    border:3px solid var(--edge);
    border-radius:6px;
    padding:26px 22px 22px;
    box-shadow:8px 8px 0 var(--edge);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    position:relative;
  }
  .card::before{
    content:""; position:absolute; inset:5px; border:1.5px dashed var(--soft); border-radius:4px; pointer-events:none;
  }
  .tag{font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--soft); font-weight:700; margin-bottom:14px;}
  h1.distort, h2.distort{
    margin:0 0 12px; line-height:.96; font-weight:900;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    letter-spacing:-.01em;
    transform:skewX(-4deg);
    text-shadow:3px 3px 0 var(--soft);
  }
  h1.distort{font-size:clamp(34px,10vw,52px)}
  h2.distort{font-size:clamp(26px,8vw,40px)}
  .lede{margin:0 auto 20px; max-width:34ch; font-size:14px; line-height:1.5; color:var(--ink); opacity:.92}
  .lede b{color:var(--ink)}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin:0 auto 20px; max-width:300px;
    font-size:13px; text-align:left;}
  .stats .k{color:var(--soft); letter-spacing:.08em}
  .stats .v{font-weight:800; text-align:right}
  .hint{margin-top:14px; font-size:11px; letter-spacing:.14em; color:var(--soft); text-transform:uppercase}

  .btn{
    pointer-events:auto;
    font-family:inherit; font-size:16px; font-weight:800; letter-spacing:.02em;
    color:var(--paper); background:var(--ink);
    border:3px solid var(--edge); border-radius:4px;
    padding:14px 22px; min-height:52px; min-width:180px;
    cursor:pointer; user-select:none;
    box-shadow:4px 4px 0 var(--edge);
    display:inline-flex; align-items:center; justify-content:center; gap:12px;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .btn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--edge)}
  .btn:focus-visible{outline:3px solid var(--ok); outline-offset:3px}
  .btn.check{color:var(--ink); background:var(--paper);}
  .btn.check .box{
    width:26px; height:26px; border:3px solid var(--edge); border-radius:4px; flex:0 0 auto;
    position:relative; background:transparent;
  }
  .btn.check .box::after{
    content:"✓"; position:absolute; inset:-6px 0 0; font-size:26px; font-weight:900; color:var(--ok);
    display:flex; align-items:center; justify-content:center; opacity:0; transform:rotate(-12deg) scale(.4);
    transition:opacity .12s, transform .16s cubic-bezier(.2,1.6,.5,1);
  }
  .btn.check:hover .box::after,.btn.check:active .box::after,.btn.check:focus-visible .box::after{opacity:1; transform:rotate(-8deg) scale(1)}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hide">
    <div class="row">
      <span id="score">SCORE 0</span>
      <span><span id="gates">GATES 00</span><span id="badge">✓ VERIFIED</span></span>
    </div>
    <div id="meter"><div id="meterFill"></div><span id="meterTxt">HUMANITY 100%</span></div>
  </div>

  <div id="title" class="overlay">
    <div class="card">
      <div class="tag">reClickha&trade; · human check</div>
      <h1 class="distort">PROVE YOU'RE<br>HUMAN</h1>
      <p class="lede">Drag a <b>wobbly</b> line up through each gate.<br>Straight lines are bots — <b>you're not</b>. Stay shaky.</p>
      <button class="btn check" data-smoke="start" aria-label="Start game"><span class="box"></span>I'm not a robot</button>
      <div class="hint">drag &nbsp;·&nbsp; ← → keys &nbsp;·&nbsp; keep it jittery</div>
    </div>
  </div>

  <div id="over" class="overlay hide">
    <div class="card">
      <div class="tag" id="overTag">verification failed</div>
      <h2 class="distort" id="overTitle">BOT DETECTED</h2>
      <p class="lede" id="overMsg">Your line went too straight.</p>
      <div class="stats" id="stats"></div>
      <button class="btn" data-smoke="restart" aria-label="Play again">↺ Verify again</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var MONO = "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";

/* ---------- DOM ---------- */
var app      = document.getElementById('app');
var canvas   = document.getElementById('game');
var ctx      = canvas.getContext('2d');
var hud      = document.getElementById('hud');
var elScore  = document.getElementById('score');
var elGates  = document.getElementById('gates');
var elBadge  = document.getElementById('badge');
var meter    = document.getElementById('meter');
var meterFill= document.getElementById('meterFill');
var meterTxt = document.getElementById('meterTxt');
var elTitle  = document.getElementById('title');
var elOver   = document.getElementById('over');
var overTag  = document.getElementById('overTag');
var overTitle= document.getElementById('overTitle');
var overMsg  = document.getElementById('overMsg');
var elStats  = document.getElementById('stats');
var btnStart = elTitle.querySelector('[data-smoke="start"]');
var btnRestart = elOver.querySelector('[data-smoke="restart"]');

/* ---------- helpers ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a + Math.random()*(b-a); }
function jitter(seed,i){ var x=Math.sin(seed*127.1 + i*311.7)*43758.5453; return (x-Math.floor(x))*2-1; }

/* ---------- theme ---------- */
var TH = { paper:'#f4f0e6', ink:'#151210', soft:'rgba(0,0,0,.5)', ok:'#0f8a4d', bad:'#d63a2c' };
function readTheme(){
  try{
    var cs=getComputedStyle(document.documentElement);
    function g(n,f){ var v=cs.getPropertyValue(n); return (v&&v.trim())||f; }
    TH.paper=g('--paper',TH.paper);
    TH.ink  =g('--ink',TH.ink);
    TH.soft =g('--soft',TH.soft);
    TH.ok   =g('--ok',TH.ok);
    TH.bad  =g('--bad',TH.bad);
  }catch(e){}
}

/* ---------- state ---------- */
var S = {
  mode:'title',            // title | playing | dying | over
  W:0, H:0, PAD:16, penY:0, dpr:1,
  penX:0, targetX:0, vxSmooth:0, samples:[], wobble:0, needCur:120, wobbleNorm:0,
  hum:100,
  trail:[], gates:[], particles:[], popups:[],
  score:0, gatesVerified:0, gatesSpawned:0, perfectStreak:0, gid:0, lastGapX:0,
  elapsed:0, graceT:1.1, dieT:0, slowmo:0, shake:0, bgScroll:0, warnT:0,
  verifiedBadge:false, failReason:'bot',
  keyDir:0, pointerDown:false,
  bg:null
};

/* ---------- audio ---------- */
var Sound = {
  ctx:null, master:null,
  init:function(){
    try{
      if(this.ctx){ if(this.ctx.state==='suspended'){ this.ctx.resume(); } return; }
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx=null; }
  },
  tone:function(freq,dur,type,delay,vol,glide){
    if(!this.ctx) return;
    try{
      var t=this.ctx.currentTime+(delay||0);
      var o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
      if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(1,glide), t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.5, t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  },
  blip:function(perfect){
    if(!this.ctx) return;
    this.tone(660,0.09,'triangle',0,0.55);
    this.tone(990,0.12,'triangle',0.05,0.5);
    if(perfect) this.tone(1320,0.14,'triangle',0.11,0.5);
  },
  buzz:function(){
    if(!this.ctx) return;
    this.tone(190,0.3,'sawtooth',0,0.5,70);
    try{
      var len=Math.floor(this.ctx.sampleRate*0.16);
      var b=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      var d=b.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      var s=this.ctx.createBufferSource(); s.buffer=b;
      var g=this.ctx.createGain(); g.gain.value=0.22;
      s.connect(g); g.connect(this.master); s.start();
    }catch(e){}
  },
  win:function(){
    if(!this.ctx) return;
    var n=[523,659,784,1047];
    for(var i=0;i<n.length;i++) this.tone(n[i],0.16,'triangle',i*0.07,0.5);
  },
  warn:function(){ if(!this.ctx) return; this.tone(1500,0.05,'square',0,0.13); }
};
function vibe(p){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(p); }catch(e){} }

/* ---------- sizing ---------- */
function resize(){
  var w=Math.max(1, Math.floor(app.clientWidth||window.innerWidth||360));
  var h=Math.max(1, Math.floor(app.clientHeight||window.innerHeight||640));
  S.W=w; S.H=h;
  S.PAD=Math.max(14, w*0.045);
  S.penY=Math.round(h*0.62);
  S.dpr=Math.min(window.devicePixelRatio||1, 2.5);
  canvas.width=Math.floor(w*S.dpr);
  canvas.height=Math.floor(h*S.dpr);
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  if(ctx) ctx.setTransform(S.dpr,0,0,S.dpr,0,0);
  buildBG();
}

/* ---------- background (zine texture) ---------- */
function buildBG(){
  var w=S.W, h=S.H;
  if(w<2||h<2){ S.bg=null; return; }
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var g=c.getContext('2d');
  if(!g){ S.bg=null; return; }
  g.fillStyle=TH.paper; g.fillRect(0,0,w,h);
  // halftone dots
  g.fillStyle=TH.soft;
  var step=17;
  for(var y=0;y<h+step;y+=step){
    var off=((y/step)|0)%2 ? step/2 : 0;
    for(var x=-step;x<w+step;x+=step){
      var r=0.5+0.9*(0.5+0.5*Math.sin(x*0.06+y*0.05));
      g.globalAlpha=0.10;
      g.beginPath(); g.arc(x+off, y, r, 0, 6.2832); g.fill();
    }
  }
  g.globalAlpha=1;
  // faint scribbled watermarks
  var words=['HUMAN?','VERIFY','NOT A ROBOT','01001010','ARE YOU REAL','PROVE IT','CAPTCHA','◍','☑'];
  g.textAlign='center'; g.fillStyle=TH.soft;
  var wi=0;
  for(var yy=54;yy<h+90;yy+=118){
    var xoff=((yy/118)|0)%2 ? 70 : 0;
    for(var xx=-40;xx<w+150;xx+=196){
      g.save();
      g.globalAlpha=0.055;
      g.translate(xx+xoff, yy);
      g.rotate(Math.sin(xx*0.021+yy*0.017)*0.35);
      g.font='800 '+(14+((wi*5)%9))+'px '+MONO;
      g.fillText(words[wi%words.length], 0, 0);
      g.restore();
      wi++;
    }
  }
  g.globalAlpha=1;
  S.bg=c;
}

/* ---------- difficulty ---------- */
function difficulty(){
  var g=S.gatesVerified;
  var playW=Math.max(60, S.W-2*S.PAD);
  var speed=Math.min(118+g*7.5, 330);
  var gapFrac=Math.max(0.50 - g*0.028, 0.19);
  var gapW=clamp(playW*gapFrac, 56, playW*0.6);
  var tBetween=Math.max(2.15 - g*0.09, 1.0);
  var spacing=speed*tBetween;
  var maxStep=Math.min(playW*(0.20+g*0.03), playW*0.72);
  var need=Math.min(96+g*7, 172);
  var drain=Math.min(50+g*3.2, 92);
  var honey= g>=3 ? Math.min(0.14+(g-3)*0.03, 0.42) : 0;
  return { speed:speed, gapW:gapW, spacing:spacing, maxStep:maxStep, need:need, drain:drain, honey:honey };
}

/* ---------- gates ---------- */
function spawnGate(atY){
  var d=difficulty();
  var playW=Math.max(60, S.W-2*S.PAD);
  var honey = (S.gatesSpawned>2 && Math.random()<d.honey);
  var gapW = honey ? Math.min(d.gapW*1.7, playW*0.7) : d.gapW;   // honeypots are invitingly wide
  var prev = (S.lastGapX==null) ? S.W/2 : S.lastGapX;
  var gx = prev + rnd(-d.maxStep, d.maxStep);
  gx = clamp(gx, S.PAD + gapW/2, S.W - S.PAD - gapW/2);
  S.lastGapX = gx;
  S.gates.push({ id:S.gid++, y:atY, gx:gx, gapW:gapW, honey:honey, seed:Math.random()*1000, checked:false, result:null, flashT:0 });
  S.gatesSpawned++;
  return d.spacing;
}
function seedGates(){
  S.gates.length=0; S.gid=0; S.gatesSpawned=0; S.lastGapX=S.W/2;
  var d=difficulty();
  var y=S.penY - d.spacing;
  var count=0;
  while(count<10 && y>-S.H*0.7){ var sp=spawnGate(y); y-=sp; count++; }
}
function ensureGates(){
  var topY=Infinity;
  for(var i=0;i<S.gates.length;i++) if(S.gates[i].y<topY) topY=S.gates[i].y;
  if(topY===Infinity) topY=S.penY;
  var guard=0;
  while(topY > -S.H*0.25 && guard<24){
    var d=difficulty();
    spawnGate(topY - d.spacing);
    topY -= d.spacing;
    guard++;
  }
}

/* ---------- effects ---------- */
function popup(x,y,text,col,size){
  S.popups.push({ x:x, y:y, text:text, col:col, size:size, life:0.95, max:0.95, vy:-42 });
}
function bigPopup(text,col){
  S.popups.push({ x:S.W/2, y:S.H*0.42, text:text, col:col, size:Math.min(S.W*0.10,46), life:1.5, max:1.5, vy:-14 });
}
function burst(x,y,col,n,tick){
  n=n||14;
  for(var i=0;i<n;i++){
    var a=Math.random()*6.2832, sp=rnd(60,240);
    S.particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-70, life:rnd(0.45,0.95), max:0.95,
      col:col, size:rnd(2,5), tick: !!tick && Math.random()<0.45 });
  }
}

/* ---------- run control ---------- */
function resetRun(){
  S.score=0; S.gatesVerified=0; S.perfectStreak=0;
  S.trail.length=0; S.particles.length=0; S.popups.length=0; S.samples.length=0;
  S.penX=S.W/2; S.targetX=S.W/2; S.vxSmooth=0; S.wobble=0; S.hum=100;
  S.elapsed=0; S.graceT=1.1; S.slowmo=0; S.dieT=0; S.shake=0; S.warnT=0;
  S.verifiedBadge=false; S.failReason='bot'; S.keyDir=0;
  seedGates();
}
function startRun(){
  resetRun();
  S.mode='playing';
  elTitle.classList.add('hide');
  elOver.classList.add('hide');
  hud.classList.remove('hide');
  elBadge.classList.remove('on');
  Sound.init();
}
function failRun(reason, gate){
  if(S.mode!=='playing') return;
  S.mode='dying'; S.dieT=0.55; S.failReason=reason;
  S.shake=Math.max(S.shake, 22);
  if(gate){ gate.result='bad'; gate.flashT=0.6; }
  var msg = reason==='wall' ? 'MISSED THE GATE'
          : reason==='trap' ? 'BOT TRAP!'
          : 'BOT DETECTED';
  popup(S.penX, S.penY-22, msg, TH.bad, 26);
  burst(S.penX, S.penY, TH.bad, 20, false);
  Sound.buzz();
  vibe([40,30,70]);
}
function verifyGate(gate){
  gate.checked=true; gate.result='ok'; gate.flashT=0.55;
  S.gatesVerified++;
  var humanity=S.hum;
  var off=Math.abs(S.penX-gate.gx), half=gate.gapW/2;
  var perfect = humanity>=70 && off < half*0.5;
  if(perfect) S.perfectStreak++; else S.perfectStreak=0;
  var pts=100 + Math.round(humanity);
  if(perfect) pts += 150 + S.perfectStreak*25;
  S.score += pts;
  S.hum = Math.min(100, S.hum + 14);
  popup(gate.gx, S.penY-30, perfect ? ('PERFECT'+(S.perfectStreak>1?' ×'+S.perfectStreak:'')) : 'VERIFIED', TH.ok, perfect?32:24);
  burst(gate.gx, S.penY, TH.ok, perfect?18:13, true);
  S.shake=Math.max(S.shake, perfect?8:4);
  Sound.blip(perfect);
  vibe(perfect?[10,22,12]:12);
  if(S.gatesVerified===5 && S.elapsed<=30 && !S.verifiedBadge){
    S.verifiedBadge=true; S.slowmo=0.75; S.score+=500;
    bigPopup('✓ VERIFIED HUMAN', TH.ok);
    elBadge.classList.add('on');
    Sound.win();
    vibe([12,40,12,40,20]);
  }
}
function checkGate(gate, live){
  gate.checked=true;
  var off=Math.abs(S.penX-gate.gx), half=gate.gapW/2, inGap=off<=half;
  if(!live){
    gate.result='ok'; gate.flashT=0.4;
    if(inGap) burst(gate.gx, S.penY, TH.ok, 6, true);
    return;
  }
  if(!inGap){ failRun('wall', gate); return; }
  if(gate.honey && S.wobble < S.needCur){ failRun('trap', gate); return; } // coasting straight = instant flag
  verifyGate(gate);
}

function showOver(){
  S.mode='over';
  var titles = { bot:'BOT DETECTED', wall:'MISSED A GATE', trap:'HONEYPOT!' };
  var msgs = {
    bot:'Your signature went too straight. Bots do that.',
    wall:'You drifted outside the gap. Steady the shake.',
    trap:'A straight shot through a bot trap. Sneaky.'
  };
  overTag.textContent = S.verifiedBadge ? 'human verified · then flagged' : 'verification failed';
  overTitle.textContent = (S.failReason==='bot'?'🤖 ':'') + (titles[S.failReason]||'BOT DETECTED');
  overTitle.style.color = TH.bad;
  overMsg.textContent = msgs[S.failReason]||msgs.bot;
  var best = S.verifiedBadge ? 'YES ✓' : 'no';
  elStats.innerHTML =
    '<div class="k">SCORE</div><div class="v">'+S.score+'</div>'+
    '<div class="k">GATES PASSED</div><div class="v">'+S.gatesVerified+'</div>'+
    '<div class="k">5-IN-30 BADGE</div><div class="v">'+best+'</div>';
  elOver.classList.remove('hide');
  hud.classList.add('hide');
}

/* ---------- input ---------- */
function setTargetFromEvent(e){
  var rect=canvas.getBoundingClientRect();
  var x=(e.clientX!=null?e.clientX:0)-rect.left;
  S.targetX=clamp(x, S.PAD, S.W-S.PAD);
}
canvas.addEventListener('pointerdown', function(e){
  try{
    e.preventDefault();
    Sound.init();
    if(S.mode==='playing'){ S.pointerDown=true; setTargetFromEvent(e); }
  }catch(_){}
}, {passive:false});
canvas.addEventListener('pointermove', function(e){
  try{ if(S.mode==='playing'){ setTargetFromEvent(e); } }catch(_){}
}, {passive:false});
window.addEventListener('pointerup', function(){ S.pointerDown=false; }, {passive:true});
window.addEventListener('pointercancel', function(){ S.pointerDown=false; }, {passive:true});

window.addEventListener('keydown', function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){ S.keyDir=-1; e.preventDefault(); }
  else if(k==='ArrowRight'||k==='d'||k==='D'){ S.keyDir=1; e.preventDefault(); }
  else if(k===' '||k==='Enter'){
    if(S.mode==='title'){ e.preventDefault(); startRun(); }
    else if(S.mode==='over'){ e.preventDefault(); startRun(); }
  }
}, {passive:false});
window.addEventListener('keyup', function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){ if(S.keyDir<0) S.keyDir=0; }
  else if(k==='ArrowRight'||k==='d'||k==='D'){ if(S.keyDir>0) S.keyDir=0; }
}, {passive:true});

btnStart.addEventListener('click', function(e){ e.preventDefault(); Sound.init(); startRun(); });
btnRestart.addEventListener('click', function(e){ e.preventDefault(); Sound.init(); startRun(); });

/* ---------- world step ---------- */
function stepWorld(dt, live){
  var d=difficulty();
  S.needCur=d.need;
  var scroll=d.speed*dt;
  S.elapsed += dt;

  // control -> targetX
  if(live){
    if(S.keyDir!==0){ S.targetX=clamp(S.targetX + S.keyDir*580*dt, S.PAD, S.W-S.PAD); }
  } else if(S.mode==='title'){
    // attract: auto-wobble toward nearest approaching gate
    var tg=null, bestd=1e9;
    for(var i=0;i<S.gates.length;i++){
      var gg=S.gates[i];
      if(gg.y<=S.penY+30){ var dd=S.penY-gg.y; if(dd<bestd){bestd=dd; tg=gg;} }
    }
    var cx = tg?tg.gx:S.W/2, cw = tg?tg.gapW:120;
    S.targetX = clamp(cx + Math.sin(S.elapsed*6.5)*cw*0.30 + Math.sin(S.elapsed*2.7)*9, S.PAD, S.W-S.PAD);
  }
  // (dying): leave targetX as-is so pen settles

  // pen follow
  var prevX=S.penX;
  S.penX += (S.targetX-S.penX)*(1-Math.exp(-16*dt));
  S.penX = clamp(S.penX, S.PAD, S.W-S.PAD);

  // velocity + wobble (std-dev of horizontal velocity over a rolling window)
  var vx=(S.penX-prevX)/Math.max(dt,1e-4);
  S.vxSmooth += (vx-S.vxSmooth)*(1-Math.exp(-32*dt));
  S.samples.push({ t:S.elapsed, v:S.vxSmooth });
  while(S.samples.length>2 && (S.elapsed - S.samples[0].t) > 0.6) S.samples.shift();
  var m=0, n=S.samples.length;
  for(var a=0;a<n;a++) m+=S.samples[a].v; m/= (n||1);
  var vs=0; for(var b=0;b<n;b++){ var dv=S.samples[b].v-m; vs+=dv*dv; }
  S.wobble=Math.sqrt(vs/(n||1));
  S.wobbleNorm = S.wobble / d.need;

  // humanity
  if(live){
    if(S.graceT>0){ S.graceT-=dt; }
    else{
      if(S.wobble>=d.need) S.hum=Math.min(100, S.hum + 78*dt);
      else S.hum=Math.max(0, S.hum - d.drain*dt);
      if(S.hum<28){ S.warnT-=dt; if(S.warnT<=0){ Sound.warn(); S.warnT=0.45; } }
      if(S.hum<=0){ failRun('bot', null); }
    }
  }

  // trail
  for(var t=0;t<S.trail.length;t++) S.trail[t].y += scroll;
  S.trail.push({ x:S.penX, y:S.penY });
  while(S.trail.length && S.trail[0].y > S.H+24) S.trail.shift();
  if(S.trail.length>800) S.trail.splice(0, S.trail.length-800);

  // gates
  for(var gi=S.gates.length-1; gi>=0; gi--){
    var g=S.gates[gi];
    g.y += scroll;
    if(g.flashT>0) g.flashT=Math.max(0, g.flashT-dt);
    if(!g.checked && g.y>=S.penY) checkGate(g, live);
    if(g.y>S.H+90) S.gates.splice(gi,1);
  }
  ensureGates();

  // bg parallax
  S.bgScroll += scroll*0.35;
  if(S.bgScroll>1e7) S.bgScroll=S.bgScroll%S.H;
}

function updateEffects(dt){
  var i;
  for(i=S.particles.length-1;i>=0;i--){
    var p=S.particles[i];
    p.vy += 540*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.life -= dt;
    if(p.life<=0) S.particles.splice(i,1);
  }
  for(i=S.popups.length-1;i>=0;i--){
    var q=S.popups[i];
    q.y += q.vy*dt; q.vy *= (1-1.5*dt);
    q.life -= dt;
    if(q.life<=0) S.popups.splice(i,1);
  }
  // decay gate flashes only when the world isn't stepping (over / frozen)
  if(S.mode==='over'){
    for(i=0;i<S.gates.length;i++){ if(S.gates[i].flashT>0) S.gates[i].flashT=Math.max(0,S.gates[i].flashT-dt); }
  }
  S.shake *= Math.exp(-dt*9);
  if(S.shake<0.3) S.shake=0;
}

/* ---------- render ---------- */
function roughRectPath(x,y,w,h,seed){
  var j=1.7, p=function(i){ return jitter(seed,i)*j; };
  ctx.beginPath();
  ctx.moveTo(x+p(1), y+p(2));
  ctx.lineTo(x+w+p(3), y+p(4));
  ctx.lineTo(x+w+p(5), y+h+p(6));
  ctx.lineTo(x+p(7), y+h+p(8));
  ctx.closePath();
}
function drawBar(x,y,w,h,seed,edge){
  if(w<=1) return;
  ctx.save();
  ctx.fillStyle=TH.paper; ctx.globalAlpha=0.85; ctx.fillRect(x,y,w,h); ctx.globalAlpha=1;
  // hatch
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.strokeStyle=edge; ctx.globalAlpha=0.4; ctx.lineWidth=1.4;
  for(var i=-h; i<w+h; i+=12){ ctx.beginPath(); ctx.moveTo(x+i, y+h); ctx.lineTo(x+i+h, y); ctx.stroke(); }
  ctx.restore();
  // rough border
  ctx.strokeStyle=edge; ctx.globalAlpha=1; ctx.lineWidth=2.6; ctx.lineJoin='round';
  roughRectPath(x,y,w,h,seed); ctx.stroke();
  ctx.restore();
}
function dot(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); }

function drawGate(g){
  var half=g.gapW/2, GH=Math.max(20, S.H*0.028);
  var y=g.y, top=y-GH/2;
  if(top>S.H+40 || y<-60) return;
  var edge = g.flashT>0 ? (g.result==='bad'?TH.bad:TH.ok) : TH.ink;

  drawBar(S.PAD, top, (g.gx-half)-S.PAD, GH, g.seed, edge);
  drawBar(g.gx+half, top, (S.W-S.PAD)-(g.gx+half), GH, g.seed+7, edge);

  ctx.fillStyle=edge;
  dot(g.gx-half, y, 4.2); dot(g.gx+half, y, 4.2);

  // honeypot: a wide, inviting gap with a tempting straight guide — but it scans hard
  if(g.honey){
    ctx.save();
    ctx.strokeStyle=TH.bad; ctx.globalAlpha=0.55; ctx.lineWidth=2.4; ctx.setLineDash([7,7]);
    ctx.beginPath(); ctx.moveTo(g.gx, y-Math.min(170,S.penY*0.4)); ctx.lineTo(g.gx, y+4); ctx.stroke();
    ctx.setLineDash([]);
    // scanning brackets around the gap
    ctx.globalAlpha=0.8; ctx.lineWidth=2.4;
    var bx=g.gx-half+3, bx2=g.gx+half-3, by=y-GH*0.7, by2=y+GH*0.7, bl=10;
    ctx.beginPath();
    ctx.moveTo(bx+bl,by); ctx.lineTo(bx,by); ctx.lineTo(bx,by+bl);
    ctx.moveTo(bx2-bl,by); ctx.lineTo(bx2,by); ctx.lineTo(bx2,by+bl);
    ctx.moveTo(bx+bl,by2); ctx.lineTo(bx,by2); ctx.lineTo(bx,by2-bl);
    ctx.moveTo(bx2-bl,by2); ctx.lineTo(bx2,by2); ctx.lineTo(bx2,by2-bl);
    ctx.stroke();
    ctx.globalAlpha=0.9; ctx.fillStyle=TH.bad; ctx.textAlign='center'; ctx.font='800 12px '+MONO;
    ctx.fillText('⚠ BOT TRAP · wobble hard', g.gx, y-Math.min(178,S.penY*0.4+8));
    ctx.restore();
  }

  if(g.flashT>0){
    ctx.save();
    ctx.globalAlpha=0.16*(g.flashT/0.6);
    ctx.fillStyle=edge; ctx.fillRect(0, top-3, S.W, GH+6);
    ctx.restore();
    if(g.result==='ok'){
      ctx.save(); ctx.globalAlpha=Math.min(1,g.flashT*2.2);
      ctx.fillStyle=TH.ok; ctx.textAlign='center'; ctx.font='900 '+(GH*0.9)+'px '+MONO;
      ctx.fillText('✓', g.gx, y+GH*0.32);
      ctx.restore();
    }
  }
}

function drawTrail(){
  if(S.trail.length<2) return;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=TH.ink;
  ctx.globalAlpha=0.12; ctx.lineWidth=9;
  ctx.beginPath(); ctx.moveTo(S.trail[0].x,S.trail[0].y);
  for(var i=1;i<S.trail.length;i++) ctx.lineTo(S.trail[i].x,S.trail[i].y);
  ctx.stroke();
  ctx.globalAlpha=1; ctx.lineWidth=4.5;
  ctx.beginPath(); ctx.moveTo(S.trail[0].x,S.trail[0].y);
  for(var j=1;j<S.trail.length;j++) ctx.lineTo(S.trail[j].x,S.trail[j].y);
  ctx.stroke();
}

function drawPen(){
  var x=S.penX, y=S.penY;
  var low = (S.mode==='playing' && S.hum<35);
  if(low){
    ctx.save();
    ctx.strokeStyle=TH.bad; ctx.lineWidth=2;
    ctx.globalAlpha=0.5+0.3*Math.sin(S.elapsed*18);
    ctx.beginPath(); ctx.arc(x,y,16+3*Math.sin(S.elapsed*12),0,6.2832); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = low?TH.bad:TH.ink;
  ctx.beginPath(); ctx.moveTo(x, y-13); ctx.lineTo(x-6, y+4); ctx.lineTo(x+6, y+4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y+3, 3.2, 0, 6.2832); ctx.fill();
}

function drawParticles(){
  for(var i=0;i<S.particles.length;i++){
    var p=S.particles[i];
    var aa=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=aa; ctx.fillStyle=p.col;
    if(p.tick){
      ctx.textAlign='center'; ctx.font='900 '+(9+p.size*2)+'px '+MONO;
      ctx.fillText('✓', p.x, p.y);
    }else{
      ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    }
  }
  ctx.globalAlpha=1;
}
function drawPopups(){
  ctx.textAlign='center'; ctx.lineJoin='round';
  for(var i=0;i<S.popups.length;i++){
    var q=S.popups[i];
    var aa=clamp(q.life/q.max,0,1);
    var s=1 + (1-aa)*0.25;
    ctx.save();
    ctx.globalAlpha=aa;
    ctx.font='900 '+(q.size*s)+'px '+MONO;
    ctx.lineWidth=5; ctx.strokeStyle=TH.paper; ctx.strokeText(q.text, q.x, q.y);
    ctx.fillStyle=q.col; ctx.fillText(q.text, q.x, q.y);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawGraceHint(){
  if(S.mode==='playing' && S.graceT>0){
    ctx.save();
    ctx.globalAlpha=clamp(S.graceT,0,1)*0.9;
    ctx.fillStyle=TH.ink; ctx.textAlign='center'; ctx.font='800 15px '+MONO;
    ctx.fillText('~ wiggle to stay human ~', S.W/2, S.penY+64);
    ctx.restore();
  }
}

function render(){
  if(!ctx) return;
  ctx.setTransform(S.dpr,0,0,S.dpr,0,0);
  // shake
  if(S.shake>0){
    var sx=(Math.random()*2-1)*S.shake, sy=(Math.random()*2-1)*S.shake;
    ctx.translate(sx,sy);
  }
  // background
  if(S.bg){
    var off=((S.bgScroll%S.H)+S.H)%S.H;
    ctx.drawImage(S.bg, 0, off);
    ctx.drawImage(S.bg, 0, off-S.H);
  }else{
    ctx.fillStyle=TH.paper; ctx.fillRect(0,0,S.W,S.H);
  }
  // side margins (subtle guides)
  ctx.save();
  ctx.strokeStyle=TH.soft; ctx.globalAlpha=0.4; ctx.lineWidth=1.5; ctx.setLineDash([2,6]);
  ctx.beginPath(); ctx.moveTo(S.PAD,0); ctx.lineTo(S.PAD,S.H);
  ctx.moveTo(S.W-S.PAD,0); ctx.lineTo(S.W-S.PAD,S.H); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();

  for(var i=0;i<S.gates.length;i++) drawGate(S.gates[i]);
  drawTrail();
  drawPen();
  drawParticles();
  drawGraceHint();
  drawPopups();

  // dim veil while dying so overlay reads well
  if(S.mode==='dying'){
    ctx.save();
    ctx.globalAlpha=clamp(1-(S.dieT/0.55),0,1)*0.25;
    ctx.fillStyle=TH.bad; ctx.fillRect(0,0,S.W,S.H);
    ctx.restore();
  }
}

/* ---------- HUD ---------- */
function updateHUD(){
  elScore.textContent='SCORE '+S.score;
  var gtxt='GATES '+(S.gatesVerified<10?'0':'')+S.gatesVerified;
  if(S.perfectStreak>1) gtxt+='  ✦×'+S.perfectStreak;
  elGates.textContent=gtxt;
  var h=Math.round(S.hum);
  meterFill.style.width=h+'%';
  meterTxt.textContent='HUMANITY '+h+'%';
  if(S.hum<35) meter.classList.add('low'); else meter.classList.remove('low');
}

/* ---------- main loop ---------- */
var last=0;
function frame(now){
  if(!last) last=now;
  var rdt=(now-last)/1000; last=now;
  if(rdt>0.05) rdt=0.05; if(rdt<0) rdt=0;
  try{
    var dt=rdt;
    if(S.mode==='playing' && S.slowmo>0){ S.slowmo-=rdt; dt=rdt*0.32; }
    if(S.mode==='dying'){ dt=rdt*0.28; S.dieT-=rdt; }

    if(S.mode==='title')      stepWorld(dt, false);
    else if(S.mode==='playing') stepWorld(dt, true);
    else if(S.mode==='dying')   stepWorld(dt, false);
    // 'over' => world frozen

    updateEffects(rdt);
    render();
    updateHUD();

    if(S.mode==='dying' && S.dieT<=0) showOver();
  }catch(e){ /* never let a frame crash the page */ }
  requestAnimationFrame(frame);
}

/* ---------- init ---------- */
function init(){
  try{
    readTheme();
    resize();
    if(!ctx){
      overTag.textContent='canvas unavailable';
      return;
    }
    resetRun();
    S.mode='title';
    elTitle.classList.remove('hide');
    elOver.classList.add('hide');
    hud.classList.add('hide');

    window.addEventListener('resize', resize, {passive:true});
    window.addEventListener('orientationchange', function(){ setTimeout(resize,120); }, {passive:true});
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    if(mq){
      var onTheme=function(){ readTheme(); buildBG(); };
      if(mq.addEventListener) mq.addEventListener('change', onTheme);
      else if(mq.addListener) mq.addListener(onTheme);
    }
  }catch(e){}
  requestAnimationFrame(frame);
}
init();

})();
</script>
</body>
