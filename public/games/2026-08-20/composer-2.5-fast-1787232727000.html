<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slop Flick</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#b4c5d4;--bg2:#9aafc0;--chrome:#e4ecf2;--chrome-border:#8fa3b3;
  --text:#2d4455;--muted:#5a7285;--accent:#3d7a6a;--accent2:#c45c3e;
  --article:#1a3344;--hud-bg:rgba(228,236,242,.88);--shadow:rgba(45,68,85,.18);
  --btn-bg:#2d4455;--btn-text:#e4ecf2;--danger:#b84a3a;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1e2f3c;--bg2:#162530;--chrome:#2a3d4d;--chrome-border:#3d5568;
    --text:#c5d4de;--muted:#8aa0b0;--accent:#5cb89a;--accent2:#e07a55;
    --article:#d8e6ef;--hud-bg:rgba(42,61,77,.92);--shadow:rgba(0,0,0,.35);
    --btn-bg:#5cb89a;--btn-text:#162530;--danger:#e07a55;
  }
}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{
  font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
  height:100dvh;width:100dvw;
}
#wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;width:100%}
#chrome{
  flex-shrink:0;height:44px;background:var(--chrome);border-bottom:1px solid var(--chrome-border);
  display:flex;align-items:center;padding:0 12px;gap:8px;z-index:2;
}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.r{background:#e07060}.dot.y{background:#d4a840}.dot.g{background:#6aab72}
#url{
  flex:1;height:28px;background:var(--bg);border:1px solid var(--chrome-border);border-radius:6px;
  font-size:11px;color:var(--muted);display:flex;align-items:center;padding:0 10px;overflow:hidden;white-space:nowrap;
}
#game-area{flex:1;position:relative;min-height:0;overflow:hidden}
#c{
  display:block;width:100%;height:100%;touch-action:none;
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
}
#hud{
  position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;
  pointer-events:none;z-index:3;gap:8px;
}
.chip{
  background:var(--hud-bg);backdrop-filter:blur(6px);padding:6px 10px;border-radius:6px;
  font-size:11px;letter-spacing:.03em;border:1px solid var(--chrome-border);
  box-shadow:0 2px 8px var(--shadow);
}
.chip b{color:var(--accent)}
#clarity-bar-wrap{
  position:absolute;bottom:12px;left:12px;right:12px;pointer-events:none;z-index:3;
}
#clarity-label{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
#clarity-track{height:6px;background:var(--chrome-border);border-radius:3px;overflow:hidden}
#clarity-fill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .15s ease}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;z-index:10;padding:24px;text-align:center;
  background:linear-gradient(180deg,rgba(180,197,212,.82),rgba(154,175,192,.88));
}
@media(prefers-color-scheme:dark){
  .overlay{background:linear-gradient(180deg,rgba(30,47,60,.88),rgba(22,37,48,.92))}
}
.overlay h1{
  font-size:clamp(22px,6vw,32px);font-weight:700;letter-spacing:-.02em;margin-bottom:8px;
  color:var(--text);line-height:1.15;
}
.overlay p{font-size:clamp(12px,3.2vw,14px);color:var(--muted);max-width:320px;line-height:1.5;margin-bottom:20px}
.overlay .hint{font-size:11px;color:var(--muted);margin-top:16px;opacity:.8}
.btn{
  pointer-events:auto;min-height:48px;min-width:160px;padding:12px 28px;
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.04em;
  border:none;border-radius:8px;cursor:pointer;
  background:var(--btn-bg);color:var(--btn-text);
  box-shadow:0 4px 16px var(--shadow);transition:transform .12s ease,opacity .12s ease;
}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#overlay-go{display:none}
#overlay-go .result{font-size:clamp(18px,5vw,24px);margin-bottom:6px;color:var(--accent)}
#overlay-go .result.lose{color:var(--danger)}
#overlay-go .score-line{font-size:13px;color:var(--muted);margin-bottom:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <div id="chrome">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <div id="url">https://quiet-bay.news/the-page-beneath</div>
  </div>
  <div id="game-area">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="chip">TIME <b id="time-val">45</b>s</div>
      <div class="chip">CLEARED <b id="cleared-val">0</b></div>
      <div class="chip">COMBO <b id="combo-val">×1</b></div>
    </div>
    <div id="clarity-bar-wrap">
      <div id="clarity-label">Article clarity</div>
      <div id="clarity-track"><div id="clarity-fill"></div></div>
    </div>
    <div id="overlay-title" class="overlay">
      <h1>Slop Flick</h1>
      <p>Flick banner ads and cookie modals off the page before they bury the article. Reveal the headline in under 45 seconds.</p>
      <button class="btn" data-smoke="start" id="btn-start">Clear the Page</button>
      <p class="hint">Swipe or drag slop off-screen · Arrow keys on desktop</p>
    </div>
    <div id="overlay-go" class="overlay">
      <div class="result" id="go-result">Article Restored</div>
      <div class="score-line" id="go-score"></div>
      <button class="btn" data-smoke="restart" id="btn-restart">Flick Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('c');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var timeVal = document.getElementById('time-val');
var clearedVal = document.getElementById('cleared-val');
var comboVal = document.getElementById('combo-val');
var clarityFill = document.getElementById('clarity-fill');
var overlayTitle = document.getElementById('overlay-title');
var overlayGo = document.getElementById('overlay-go');
var goResult = document.getElementById('go-result');
var goScore = document.getElementById('go-score');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 360, H = 640;
var state = 'title';
var slops = [];
var particles = [];
var spawnTimer = 0;
var elapsed = 0;
var timeLeft = 45;
var cleared = 0;
var combo = 0;
var maxCombo = 0;
var comboTimer = 0;
var clarity = 0;
var coverage = 1;
var shake = 0;
var flickTrail = [];
var audioCtx = null;
var dark = false;

var ARTICLE = {
  headline: 'The Browser Sheds Its Slop, Layer by Layer',
  sub: 'On an overcast summer dusk at thirteen degrees, clarity finally wins.',
  body: 'Side repos stay quiet. Agents wait. But the page beneath — one clean headline — was always there.'
};

var SLOP_TYPES = [
  { kind:'cookie', label:'We use cookies', sub:'Accept All', w:200, h:90, color:'#e8ddd0', accent:'#c45c3e' },
  { kind:'banner', label:'50% OFF NOW', sub:'Limited time!!!', w:240, h:52, color:'#f0c878', accent:'#b84a3a' },
  { kind:'newsletter', label:'Subscribe!', sub:'Don\'t miss out', w:180, h:100, color:'#d0dce8', accent:'#3d7a6a' },
  { kind:'video', label:'▶ Auto-play ad', sub:'Watch 30s to continue', w:220, h:70, color:'#ccd8e4', accent:'#5a7285' },
  { kind:'survey', label:'Rate your visit', sub:'★★★★★', w:170, h:80, color:'#e0e8ee', accent:'#4a6274' },
  { kind:'chat', label:'Hi! Need help?', sub:'Chat with us →', w:160, h:72, color:'#d8e4ec', accent:'#3d7a6a' }
];

var pointer = { active:false, id:-1, sx:0, sy:0, x:0, y:0, t:0, history:[] };

function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function updateTheme(){
  dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function resize(){
  if(!canvas) return;
  var area = document.getElementById('game-area');
  if(!area) return;
  var r = area.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.floor(r.width));
  H = Math.max(1, Math.floor(r.height));
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initAudio(){
  try{
    if(!audioCtx && window.AudioContext) audioCtx = new AudioContext();
    else if(!audioCtx && window.webkitAudioContext) audioCtx = new webkitAudioContext();
  }catch(e){ audioCtx = null; }
}

function playTone(freq, dur, vol, type){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(vol || 0.08, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur + 0.05);
  }catch(e){}
}

function playFlickSound(){ playTone(420 + Math.random()*80, 0.12, 0.06, 'triangle'); }
function playSplitSound(){ playTone(280, 0.08, 0.05, 'square'); }
function playWinSound(){
  [523,659,784,1047].forEach(function(f,i){
    setTimeout(function(){ playTone(f, 0.2, 0.07, 'sine'); }, i * 90);
  });
}
function playLoseSound(){ playTone(180, 0.35, 0.07, 'sawtooth'); }

function rand(a,b){ return a + Math.random() * (b - a); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

function makeSlop(type, x, y, vx, vy, scale){
  scale = scale || 1;
  var t = type || SLOP_TYPES[Math.floor(Math.random() * SLOP_TYPES.length)];
  return {
    x: x != null ? x : rand(20, W - t.w * scale - 20),
    y: y != null ? y : -t.h * scale - rand(0, 80),
    w: t.w * scale, h: t.h * scale,
    vx: vx || rand(-15, 15), vy: vy || rand(40, 70),
    rot: rand(-0.08, 0.08), vr: rand(-0.5, 0.5),
    kind: t.kind, label: t.label, sub: t.sub,
    color: t.color, accent: t.accent,
    scale: scale, life: 1, offscreen: false, id: Math.random()
  };
}

function spawnSlop(intensity){
  var count = intensity > 0.6 ? 2 : 1;
  for(var i = 0; i < count; i++){
    var typeIdx = Math.min(SLOP_TYPES.length - 1, Math.floor(intensity * SLOP_TYPES.length * 1.2));
    var t = SLOP_TYPES[Math.floor(rand(0, typeIdx + 1))];
    var fallSpeed = 45 + intensity * 90;
    slops.push(makeSlop(t, null, null, rand(-20, 20), fallSpeed, intensity > 0.5 ? rand(0.75, 1) : 1));
  }
}

function splitSlop(s){
  if(s.scale < 0.45) return false;
  playSplitSound();
  var newScale = s.scale * 0.55;
  var t = SLOP_TYPES.find(function(x){ return x.kind === s.kind; }) || SLOP_TYPES[0];
  for(var i = 0; i < 2; i++){
    slops.push(makeSlop(t, s.x + rand(0, s.w * 0.3), s.y + rand(0, s.h * 0.3),
      s.vx + rand(-80, 80), s.vy + rand(-60, 40), newScale));
  }
  return true;
}

function addParticles(x, y, col, n){
  for(var i = 0; i < (n || 8); i++){
    particles.push({
      x:x, y:y,
      vx: rand(-120, 120), vy: rand(-140, 40),
      life: rand(0.3, 0.7), col: col || css('--accent')
    });
  }
}

function hitTestSlop(px, py){
  for(var i = slops.length - 1; i >= 0; i--){
    var s = slops[i];
    if(!s.offscreen && px >= s.x && px <= s.x + s.w && py >= s.y && py <= s.y + s.h) return s;
  }
  return null;
}

function flickSlop(s, vx, vy){
  var speed = Math.sqrt(vx*vx + vy*vy);
  s.vx = vx * 0.85;
  s.vy = vy * 0.85;
  s.vr = vx * 0.008;
  s.life = 1;
  if(speed > 480 && splitSlop(s)){
    var idx = slops.indexOf(s);
    if(idx >= 0) slops.splice(idx, 1);
    return;
  }
  addParticles(s.x + s.w/2, s.y + s.h/2, s.accent, Math.min(14, Math.floor(speed/60)));
  playFlickSound();
  if(typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(8);
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  comboTimer = 2;
  cleared++;
}

function pushNearestSlop(dir){
  if(state !== 'playing' || slops.length === 0) return;
  var cx = W/2, cy = H/2, best = null, bestD = Infinity;
  for(var i = 0; i < slops.length; i++){
    var s = slops[i];
    if(s.offscreen) continue;
    var dx = (s.x + s.w/2) - cx, dy = (s.y + s.h/2) - cy;
    var d = dx*dx + dy*dy;
    if(d < bestD){ bestD = d; best = s; }
  }
  if(!best) return;
  var force = 650;
  var vx = dir === 'left' ? -force : dir === 'right' ? force : 0;
  var vy = dir === 'up' ? -force : dir === 'down' ? force * 0.3 : -force * 0.5;
  flickSlop(best, vx, vy);
}

function calcCoverage(){
  var gridW = 12, gridH = 16;
  var cellW = W / gridW, cellH = H / gridH;
  var covered = 0, total = gridW * gridH;
  for(var gy = 0; gy < gridH; gy++){
    for(var gx = 0; gx < gridW; gx++){
      var cx = (gx + 0.5) * cellW, cy = (gy + 0.5) * cellH;
      for(var i = 0; i < slops.length; i++){
        var s = slops[i];
        if(s.offscreen) continue;
        if(cx >= s.x && cx <= s.x + s.w && cy >= s.y && cy <= s.y + s.h){ covered++; break; }
      }
    }
  }
  return covered / total;
}

function resetGame(){
  slops = []; particles = []; flickTrail = [];
  spawnTimer = 0; elapsed = 0; timeLeft = 45;
  cleared = 0; combo = 0; maxCombo = 0; comboTimer = 0;
  clarity = 0; coverage = 0; shake = 0;
  if(timeVal) timeVal.textContent = '45';
  if(clearedVal) clearedVal.textContent = '0';
  if(comboVal) comboVal.textContent = '×1';
  if(clarityFill) clarityFill.style.width = '0%';
}

function startGame(){
  resetGame();
  state = 'playing';
  if(overlayTitle) overlayTitle.classList.add('hidden');
  if(overlayGo) overlayGo.style.display = 'none';
  initAudio();
  spawnSlop(0);
}

function endGame(won){
  if(state !== 'playing') return;
  state = 'over';
  if(won) playWinSound(); else playLoseSound();
  if(typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(won ? [20,40,20] : [40,20,40]);
  if(goResult){
    goResult.textContent = won ? 'Article Restored' : 'Page Drowned';
    goResult.className = 'result' + (won ? '' : ' lose');
  }
  if(goScore){
    var pct = Math.round(clarity * 100);
    goScore.textContent = 'Clarity ' + pct + '% · ' + cleared + ' slop cleared · Best combo ×' + maxCombo;
  }
  if(overlayGo) overlayGo.style.display = 'flex';
}

function onPointerDown(e){
  if(state !== 'playing') return;
  e.preventDefault();
  initAudio();
  var rect = canvas.getBoundingClientRect();
  pointer.active = true;
  pointer.id = e.pointerId != null ? e.pointerId : 0;
  pointer.sx = pointer.x = e.clientX - rect.left;
  pointer.sy = pointer.y = e.clientY - rect.top;
  pointer.t = performance.now();
  pointer.history = [{x:pointer.x, y:pointer.y, t:pointer.t}];
  try{ if(canvas.setPointerCapture && e.pointerId != null) canvas.setPointerCapture(e.pointerId); }catch(err){}
}

function onPointerMove(e){
  if(!pointer.active) return;
  if(e.pointerId != null && e.pointerId !== pointer.id) return;
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  pointer.x = e.clientX - rect.left;
  pointer.y = e.clientY - rect.top;
  var now = performance.now();
  pointer.history.push({x:pointer.x, y:pointer.y, t:now});
  if(pointer.history.length > 8) pointer.history.shift();
  flickTrail.push({x:pointer.x, y:pointer.y, life:0.15});
}

function onPointerUp(e){
  if(!pointer.active) return;
  if(e.pointerId != null && e.pointerId !== pointer.id) return;
  e.preventDefault();
  pointer.active = false;
  var rect = canvas.getBoundingClientRect();
  var ex = e.clientX - rect.left, ey = e.clientY - rect.top;
  var now = performance.now();
  var hist = pointer.history;
  var dt = Math.max(16, now - (hist.length > 1 ? hist[0].t : pointer.t));
  var dx = ex - (hist.length > 1 ? hist[0].x : pointer.sx);
  var dy = ey - (hist.length > 1 ? hist[0].y : pointer.sy);
  var vx = (dx / dt) * 1000, vy = (dy / dt) * 1000;
  var speed = Math.sqrt(vx*vx + vy*vy);
  var hit = hitTestSlop(ex, ey);
  if(!hit && speed > 100){
    hit = hitTestSlop(pointer.sx, pointer.sy);
  }
  if(hit && speed > 180){
    flickSlop(hit, vx, vy);
    shake = Math.min(6, speed / 120);
  } else if(hit && speed <= 180){
    hit.vx += dx * 2; hit.vy += dy * 2;
  }
  try{ if(canvas.releasePointerCapture && e.pointerId != null) canvas.releasePointerCapture(e.pointerId); }catch(err){}
}

function update(dt){
  if(state !== 'playing') return;
  elapsed += dt;
  timeLeft = Math.max(0, 45 - elapsed);
  if(timeVal) timeVal.textContent = String(Math.ceil(timeLeft));

  if(comboTimer > 0){
    comboTimer -= dt;
    if(comboTimer <= 0) combo = 0;
  }
  if(comboVal) comboVal.textContent = '×' + Math.max(1, combo);

  var intensity = clamp(elapsed / 45, 0, 1);
  spawnTimer += dt;
  var interval = 1.4 - intensity * 0.9;
  if(spawnTimer >= interval){
    spawnTimer = 0;
    spawnSlop(intensity);
  }

  for(var i = slops.length - 1; i >= 0; i--){
    var s = slops[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.rot += s.vr * dt;
    s.vx *= (1 - 0.8 * dt);
    s.vy += 120 * dt;
    s.vr *= (1 - 2 * dt);
    if(s.y > H + 40 || s.x < -s.w - 40 || s.x > W + 40 || s.y < -s.h - 60){
      if(!s.offscreen && (s.y > H + 40 || s.x < -s.w - 40 || s.x > W + 40)){
        s.offscreen = true;
      }
      if(s.y > H + 100 || s.x < -s.w - 80 || s.x > W + 80) slops.splice(i, 1);
    }
  }

  coverage = calcCoverage();
  clarity = clamp(1 - coverage, 0, 1);
  if(clarityFill) clarityFill.style.width = Math.round(clarity * 100) + '%';

  for(var p = particles.length - 1; p >= 0; p--){
    var pt = particles[p];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vy += 200 * dt; pt.life -= dt;
    if(pt.life <= 0) particles.splice(p, 1);
  }

  for(var t = flickTrail.length - 1; t >= 0; t--){
    flickTrail[t].life -= dt;
    if(flickTrail[t].life <= 0) flickTrail.splice(t, 1);
  }

  if(shake > 0) shake = Math.max(0, shake - dt * 20);

  if(clarity >= 0.82 && cleared >= 12) endGame(true);
  else if(coverage >= 0.78 || timeLeft <= 0) endGame(false);
}

function roundRect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawArticle(){
  var alpha = 0.15 + clarity * 0.85;
  var textCol = css('--article');
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = textCol;
  ctx.textAlign = 'center';
  ctx.font = '600 ' + clamp(W * 0.055, 16, 24) + 'px ui-monospace, Menlo, monospace';
  wrapText(ARTICLE.headline, W/2, H * 0.38, W * 0.82, clamp(W * 0.065, 20, 28));
  ctx.globalAlpha = alpha * 0.7;
  ctx.font = '400 ' + clamp(W * 0.032, 11, 14) + 'px ui-monospace, Menlo, monospace';
  wrapText(ARTICLE.sub, W/2, H * 0.58, W * 0.78, clamp(W * 0.042, 15, 20));
  ctx.globalAlpha = alpha * 0.5;
  ctx.font = '400 ' + clamp(W * 0.028, 10, 12) + 'px ui-monospace, Menlo, monospace';
  wrapText(ARTICLE.body, W/2, H * 0.72, W * 0.75, clamp(W * 0.038, 14, 18));
  ctx.restore();
}

function wrapText(text, x, y, maxW, lineH){
  var words = text.split(' '), line = '', ly = y;
  for(var i = 0; i < words.length; i++){
    var test = line + words[i] + ' ';
    if(ctx.measureText(test).width > maxW && line){ ctx.fillText(line.trim(), x, ly); line = words[i] + ' '; ly += lineH; }
    else line = test;
  }
  if(line) ctx.fillText(line.trim(), x, ly);
}

function drawSlop(s){
  ctx.save();
  ctx.translate(s.x + s.w/2, s.y + s.h/2);
  ctx.rotate(s.rot);
  var x = -s.w/2, y = -s.h/2;
  roundRect(x, y, s.w, s.h, 6);
  ctx.fillStyle = dark ? shade(s.color, -30) : s.color;
  ctx.fill();
  ctx.strokeStyle = css('--chrome-border');
  ctx.lineWidth = 1;
  ctx.stroke();
  if(s.kind === 'cookie'){
    roundRect(x+8, y+8, s.w-16, 14, 3);
    ctx.fillStyle = s.accent; ctx.fill();
  }
  ctx.fillStyle = css('--text');
  ctx.textAlign = 'left';
  ctx.font = '600 ' + clamp(s.w * 0.09, 9, 13) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText(s.label, x + 10, y + (s.kind === 'cookie' ? 38 : 28));
  ctx.globalAlpha = 0.75;
  ctx.font = '400 ' + clamp(s.w * 0.07, 8, 11) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText(s.sub, x + 10, y + (s.kind === 'cookie' ? 56 : 46));
  ctx.restore();
}

function shade(hex, amt){
  try{
    var n = parseInt(hex.replace('#',''), 16);
    var r = clamp(((n>>16)&255)+amt, 0, 255);
    var g = clamp(((n>>8)&255)+amt, 0, 255);
    var b = clamp((n&255)+amt, 0, 255);
    return 'rgb('+r+','+g+','+b+')';
  }catch(e){ return hex; }
}

function draw(){
  if(!ctx) return;
  updateTheme();
  var sx = shake ? (Math.random()-0.5)*shake : 0;
  var sy = shake ? (Math.random()-0.5)*shake : 0;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.clearRect(-10,-10,W+20,H+20);

  var bg1 = css('--bg2'), bg2 = css('--bg');
  var grd = ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0, bg1); grd.addColorStop(1, bg2);
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,W,H);

  drawArticle();

  for(var i = 0; i < slops.length; i++) drawSlop(slops[i]);

  for(var j = 0; j < particles.length; j++){
    var pt = particles[j];
    ctx.globalAlpha = pt.life * 2;
    ctx.fillStyle = pt.col;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if(flickTrail.length > 1 && state === 'playing'){
    ctx.strokeStyle = css('--accent');
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.moveTo(flickTrail[0].x, flickTrail[0].y);
    for(var k = 1; k < flickTrail.length; k++) ctx.lineTo(flickTrail[k].x, flickTrail[k].y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if(state === 'title'){
    ctx.fillStyle = dark ? 'rgba(22,37,48,0.3)' : 'rgba(180,197,212,0.25)';
    ctx.fillRect(0,0,W,H);
  }

  if(state === 'playing' && coverage > 0.45){
    var flood = clamp((coverage - 0.45) / 0.35, 0, 0.55);
    ctx.fillStyle = dark ? 'rgba(184,74,58,' + flood + ')' : 'rgba(196,92,62,' + flood * 0.7 + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

var lastT = 0;
function loop(t){
  var dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function onKey(e){
  if(state === 'playing'){
    var k = e.key;
    if(k === 'ArrowLeft' || k === 'a') pushNearestSlop('left');
    else if(k === 'ArrowRight' || k === 'd') pushNearestSlop('right');
    else if(k === 'ArrowUp' || k === 'w') pushNearestSlop('up');
    else if(k === 'ArrowDown' || k === 's') pushNearestSlop('down');
  }
}

if(btnStart) btnStart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
if(btnRestart) btnRestart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

if(canvas){
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
}

window.addEventListener('keydown', onKey);
window.addEventListener('resize', resize);
if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ updateTheme(); });

document.body.addEventListener('click', function(){ /* safe center tap */ });
document.body.addEventListener('touchstart', function(){ /* safe center tap */ }, {passive:true});

resize();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
