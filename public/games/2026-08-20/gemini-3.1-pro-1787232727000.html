<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Sync</title>
<style>
/* Reset and Base */
* { box-sizing: border-box; }
:root {
  --bg: #050505;
  --surface: #111111;
  --primary: #00f0ff;
  --secondary: #ff3c00;
  --text: #e0e0e0;
  --text-muted: #555555;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050505;
    --surface: #111111;
    --primary: #00f0ff;
    --secondary: #ff3c00;
    --text: #e0e0e0;
    --text-muted: #555555;
  }
  #header { border-bottom-color: #222222; }
  .card { background: #111111; }
  .slot.filled { background: #111111; }
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f5f5;
    --surface: #e0e0e0;
    --primary: #008899;
    --secondary: #cc3300;
    --text: #111111;
    --text-muted: #888888;
  }
}
body {
  margin: 0; padding: 0;
  width: 100dvw; height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

/* Screens */
.screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column;
}
.screen.hidden { display: none; }
.centered { align-items: center; justify-content: center; padding: 24px; }

/* Typography */
.logo { font-size: 36px; font-weight: bold; color: var(--primary); margin-bottom: 16px; text-shadow: 0 0 10px rgba(0,240,255,0.3); letter-spacing: 2px;}
.subtitle { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 48px; line-height: 1.6; max-width: 300px; }
.title { font-size: 32px; font-weight: bold; color: var(--secondary); margin-bottom: 16px; text-shadow: 0 0 10px rgba(255,60,0,0.3); letter-spacing: 2px;}
.score { font-size: 18px; margin-bottom: 48px; color: var(--text); }

/* Buttons */
.btn {
  background: transparent;
  border: 2px solid var(--primary);
  color: var(--primary);
  padding: 16px 32px;
  font-size: 16px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
  text-transform: uppercase;
  border-radius: 4px;
  touch-action: manipulation;
  transition: all 0.1s;
}
.btn:active { background: var(--primary); color: var(--bg); }
.btn.danger { border-color: var(--secondary); color: var(--secondary); }
.btn.danger:active { background: var(--secondary); color: var(--bg); }

/* Game UI */
#header {
  height: 70px; flex-shrink: 0;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  position: relative;
  border-bottom: 1px solid var(--surface);
}
#timer-bar { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: var(--surface); }
#timer-fill { height: 100%; width: 100%; background: var(--primary); transform-origin: left; transition: background-color 0.3s; }
#preview-info { font-size: 14px; font-weight: bold; color: var(--primary); letter-spacing: 2px;}
#slots { display: none; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 0 10px;}
.slot {
  width: 36px; height: 36px;
  border: 1px dashed var(--text-muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text-muted); border-radius: 4px;
}
.slot.filled { border: 1px solid var(--primary); color: var(--primary); background: var(--surface); }

/* Layout Transitions */
#preview-container {
  flex: 1; display: flex; align-items: center; justify-content: center;
  transition: flex 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
#preview-container.closed { flex: 0; }
#grid-container {
  flex: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
  transition: flex 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
#grid-container.open { flex: 1; overflow-y: auto; touch-action: pan-y; }

/* Grid */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
  gap: 8px; width: 100%; max-width: 500px;
  margin: auto; align-content: start;
}

/* Cards */
.card {
  aspect-ratio: 3/4;
  border: 2px solid var(--text-muted);
  background: var(--surface);
  border-radius: 6px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  cursor: pointer;
  transition: transform 0.1s, border-color 0.2s, color 0.2s;
}
.card:active { transform: scale(0.95); }
.card.ship { border-color: var(--primary); color: var(--primary); }
.card.iterate { border-color: var(--secondary); color: var(--secondary); }
.card.used { opacity: 0.2; pointer-events: none; transform: scale(0.9); }

.card .icon { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; width: 24px; height: 24px; }
.card .icon div { background: currentColor; opacity: 0.15; }
.card .icon div.on { opacity: 1; }
.card .name { font-size: 12px; font-weight: bold; }

/* Preview Pair */
#preview-pair { display: flex; gap: 40px; transition: opacity 0.15s, transform 0.15s; }
#preview-pair.hidden { opacity: 0; transform: scale(0.9); }
.preview-card-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.card-label { font-size: 12px; font-weight: bold; letter-spacing: 1px; }
.card-label.primary { color: var(--primary); text-shadow: 0 0 5px rgba(0,240,255,0.5); }
.card-label.secondary { color: var(--secondary); text-shadow: 0 0 5px rgba(255,60,0,0.5); }
#preview-pair .card { width: 80px; height: 106px; cursor: default; }
#preview-pair .card:active { transform: none; }

/* Animations */
.particle { position: absolute; width: 6px; height: 6px; pointer-events: none; z-index: 100; border-radius: 50%; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-10px); }
  40%, 80% { transform: translateX(10px); }
}
.shake { animation: shake 0.3s ease-in-out; }
</style>
</head>
<body>

<div id="screen-start" class="screen centered">
  <div class="logo">AGENT SYNC</div>
  <div class="subtitle">Memorize the SHIP sequence.<br>Ignore the ITERATE decoys.<br>Tap targets before window closes.</div>
  <button data-smoke="start" id="btn-start" class="btn">INITIATE</button>
</div>

<div id="game" class="screen hidden">
  <div id="header">
    <div id="timer-bar"><div id="timer-fill" style="transform: scaleX(0);"></div></div>
    <div id="preview-info">PHASE 1: OBSERVE</div>
    <div id="slots"></div>
  </div>

  <div id="preview-container">
    <div id="preview-pair" class="hidden">
      <div class="preview-card-wrap">
        <div class="card-label" id="label-left">SHIP</div>
        <div id="card-left-container"></div>
      </div>
      <div class="preview-card-wrap">
        <div class="card-label" id="label-right">ITERATE</div>
        <div id="card-right-container"></div>
      </div>
    </div>
  </div>

  <div id="grid-container">
    <div id="grid"></div>
  </div>
</div>

<div id="screen-gameover" class="screen centered hidden">
  <div class="title" id="gameover-title">SYNC FAILED</div>
  <div class="score">ROUNDS CLEARED: <span id="final-score">0</span></div>
  <button data-smoke="restart" id="btn-restart" class="btn danger">REBOOT</button>
</div>

<script>
// --- Constants & Data ---
const MODULES = [
  { name: 'SYS', pattern: [1,1,1, 0,1,0, 0,1,0] },
  { name: 'NET', pattern: [1,0,1, 1,1,1, 1,0,1] },
  { name: 'API', pattern: [0,1,0, 1,0,1, 1,1,1] },
  { name: 'SQL', pattern: [1,1,1, 1,0,0, 1,1,1] },
  { name: 'CSS', pattern: [0,1,1, 1,0,0, 0,1,1] },
  { name: 'DOM', pattern: [1,1,0, 1,0,1, 1,1,0] },
  { name: 'BIN', pattern: [1,1,0, 1,1,0, 1,1,1] },
  { name: 'HEX', pattern: [1,0,1, 0,1,0, 1,0,1] },
  { name: 'AST', pattern: [1,1,1, 0,1,0, 1,1,1] },
  { name: 'TCP', pattern: [1,1,1, 0,1,0, 0,0,0] },
  { name: 'UDP', pattern: [1,0,1, 1,0,1, 1,1,1] },
  { name: 'TLS', pattern: [0,1,0, 1,1,1, 0,1,0] },
  { name: 'SSH', pattern: [1,0,0, 1,1,1, 0,0,1] },
  { name: 'FTP', pattern: [1,1,1, 1,0,0, 1,0,0] },
  { name: 'WEB', pattern: [1,0,1, 1,1,1, 0,1,0] },
  { name: 'LOG', pattern: [1,0,0, 1,0,0, 1,1,1] },
  { name: 'MEM', pattern: [1,1,1, 1,0,1, 1,0,1] },
  { name: 'CPU', pattern: [1,1,1, 1,0,1, 1,1,1] },
  { name: 'GPU', pattern: [1,1,1, 1,0,0, 1,1,1] },
  { name: 'RAM', pattern: [1,1,0, 1,0,1, 1,0,1] },
  { name: 'I/O', pattern: [1,0,1, 0,0,0, 1,0,1] },
  { name: 'GUI', pattern: [1,1,1, 0,0,1, 1,1,1] },
  { name: 'CLI', pattern: [0,0,0, 0,0,0, 1,1,1] },
  { name: 'ENV', pattern: [1,1,1, 1,1,0, 1,1,1] },
  { name: 'PID', pattern: [1,1,1, 1,1,1, 1,0,0] },
  { name: 'UID', pattern: [1,0,1, 1,0,1, 1,1,1] },
  { name: 'MAC', pattern: [1,0,1, 1,1,1, 1,0,1] },
  { name: 'IPX', pattern: [1,0,1, 0,1,0, 1,0,1] },
  { name: 'DNS', pattern: [1,1,0, 1,0,1, 1,1,0] },
  { name: 'NTP', pattern: [1,1,1, 0,1,0, 0,1,0] },
  { name: 'BGP', pattern: [1,1,0, 1,1,1, 1,1,0] }
];

// --- State ---
let state = 'INIT';
let round = 1;
let sequence = [];
let previewPairs = [];
let gridCards = [];
let currentStep = 0;
let recallStep = 0;
let previewTimer = null;
let recallStartTime = 0;
let recallDuration = 0;
let animationFrame = null;

// --- Audio & Haptics ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
try { if (AudioContext) audioCtx = new AudioContext(); } catch(e){}

function playSound(type) {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(1600, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'success') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.setValueAtTime(600, now + 0.1);
      osc.frequency.setValueAtTime(800, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }
  } catch(e){}
}

function vibrate(pattern) {
  if (navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch(e){}
  }
}

// --- Utils ---
function shuffle(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.backgroundColor = color;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    document.body.appendChild(p);

    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 60 + 20;
    const tx = Math.cos(angle) * speed;
    const ty = Math.sin(angle) * speed;

    p.animate([
      { transform: `translate(-50%, -50%) scale(1)`, opacity: 1 },
      { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
    ], {
      duration: 400 + Math.random() * 300,
      easing: 'cubic-bezier(0, .9, .57, 1)'
    }).onfinish = () => p.remove();
  }
}

// --- DOM Generators ---
function createCardElement(module, type) {
  const el = document.createElement('div');
  el.className = `card ${type}`;
  el.dataset.id = module.name;

  const icon = document.createElement('div');
  icon.className = 'icon';
  module.pattern.forEach(bit => {
    const px = document.createElement('div');
    if (bit) px.className = 'on';
    icon.appendChild(px);
  });

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = module.name;

  el.appendChild(icon);
  el.appendChild(name);
  return el;
}

function renderSlots(count) {
  const c = document.getElementById('slots');
  c.innerHTML = '';
  for(let i=0; i<count; i++) {
    const s = document.createElement('div');
    s.className = 'slot';
    s.textContent = '?';
    s.dataset.index = i;
    c.appendChild(s);
  }
}

// --- Game Logic ---
function handleKeyDown(e) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (state === 'INIT' || state === 'GAME_OVER') startGame();
    return;
  }
  if (state === 'RECALL') {
    const num = parseInt(e.key, 10);
    if (num >= 1 && num <= 9) {
      const cards = document.querySelectorAll('#grid .card:not(.used)');
      const el = cards[num - 1];
      if (el) onCardTap(el.dataset.id, el);
    }
  }
}

function handleKeyUp(e) {
  if (e.key === ' ') e.preventDefault();
}

function init() {
  document.getElementById('btn-start').addEventListener('click', (e) => {
    e.preventDefault();
    if (state === 'INIT') startGame();
  });
  document.getElementById('btn-restart').addEventListener('click', (e) => {
    e.preventDefault();
    if (state === 'GAME_OVER') startGame();
  });
  document.addEventListener('keydown', handleKeyDown);
  document.addEventListener('keyup', handleKeyUp);
}

function showScreen(id) {
  ['screen-start', 'game', 'screen-gameover'].forEach(s => {
    document.getElementById(s).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

function startGame() {
  round = 1;
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  startRound();
}

function startRound() {
  state = 'PREVIEW';
  currentStep = 0;
  recallStep = 0;
  showScreen('game');

  // Reset Layout
  document.getElementById('preview-container').classList.remove('closed');
  document.getElementById('grid-container').classList.remove('open');
  document.getElementById('timer-fill').style.transform = 'scaleX(0)';
  document.getElementById('grid').innerHTML = '';
  
  document.getElementById('preview-info').style.display = 'block';
  document.getElementById('slots').style.display = 'none';
  document.getElementById('preview-pair').classList.add('hidden');

  let seqLength = Math.min(3 + Math.floor((round - 1) / 2), 7);
  let decoysCount = Math.min(2 + (round - 1) * 2, 10);

  let available = shuffle([...MODULES]);
  sequence = [];
  let iterateDecoys = [];
  let extraDecoys = [];

  for(let i=0; i<seqLength; i++) sequence.push(available.pop());
  for(let i=0; i<seqLength; i++) iterateDecoys.push(available.pop());
  for(let i=0; i<decoysCount; i++) extraDecoys.push(available.pop());

  gridCards = shuffle([...sequence, ...iterateDecoys, ...extraDecoys]);

  previewPairs = [];
  for(let i=0; i<seqLength; i++) {
    previewPairs.push({
      ship: sequence[i],
      iterate: iterateDecoys[i],
      shipLeft: Math.random() > 0.5
    });
  }

  setTimeout(() => showNextPreviewPair(), 500);
}

function showNextPreviewPair() {
  if (state !== 'PREVIEW') return;
  if (currentStep >= sequence.length) {
    startRecallPhase();
    return;
  }

  const pair = previewPairs[currentStep];
  const pairEl = document.getElementById('preview-pair');
  const infoEl = document.getElementById('preview-info');

  infoEl.textContent = `STEP ${currentStep + 1} / ${sequence.length}`;

  const leftC = document.getElementById('card-left-container');
  const rightC = document.getElementById('card-right-container');
  leftC.innerHTML = ''; rightC.innerHTML = '';

  const labelLeft = document.getElementById('label-left');
  const labelRight = document.getElementById('label-right');

  if (pair.shipLeft) {
    leftC.appendChild(createCardElement(pair.ship, 'ship'));
    labelLeft.className = 'card-label primary';
    labelLeft.textContent = 'SHIP';
    
    rightC.appendChild(createCardElement(pair.iterate, 'iterate'));
    labelRight.className = 'card-label secondary';
    labelRight.textContent = 'ITERATE';
  } else {
    leftC.appendChild(createCardElement(pair.iterate, 'iterate'));
    labelLeft.className = 'card-label secondary';
    labelLeft.textContent = 'ITERATE';
    
    rightC.appendChild(createCardElement(pair.ship, 'ship'));
    labelRight.className = 'card-label primary';
    labelRight.textContent = 'SHIP';
  }

  pairEl.classList.remove('hidden');

  let showDuration = Math.max(1500 - (round * 150), 600);
  
  previewTimer = setTimeout(() => {
    pairEl.classList.add('hidden');
    previewTimer = setTimeout(() => {
      currentStep++;
      showNextPreviewPair();
    }, 200);
  }, showDuration);
}

function startRecallPhase() {
  state = 'RECALL';
  
  // UI Swap
  document.getElementById('preview-container').classList.add('closed');
  document.getElementById('grid-container').classList.add('open');
  document.getElementById('preview-info').style.display = 'none';
  document.getElementById('slots').style.display = 'flex';
  
  renderSlots(sequence.length);

  // Populate Grid
  const gridEl = document.getElementById('grid');
  gridCards.forEach(mod => {
    const el = createCardElement(mod, '');
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      onCardTap(mod.name, el);
    });
    gridEl.appendChild(el);
  });

  recallDuration = Math.max(10000 - (round * 400), 4000);
  recallStartTime = performance.now();
  
  document.getElementById('timer-fill').style.backgroundColor = 'var(--primary)';
  requestAnimationFrame(updateTimer);
}

function updateTimer(now) {
  if (state !== 'RECALL') return;
  
  let elapsed = now - recallStartTime;
  let remaining = recallDuration - elapsed;

  if (remaining <= 0) {
    gameOver('TIMEOUT');
    return;
  }

  let pct = remaining / recallDuration;
  const fill = document.getElementById('timer-fill');
  fill.style.transform = `scaleX(${pct})`;
  
  if (pct < 0.25) {
    fill.style.backgroundColor = 'var(--secondary)';
  }
  
  animationFrame = requestAnimationFrame(updateTimer);
}

function onCardTap(cardId, el) {
  if (state !== 'RECALL' || el.classList.contains('used')) return;

  let expected = sequence[recallStep].name;
  if (cardId === expected) {
    // Correct
    const rect = el.getBoundingClientRect();
    spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2, 'var(--primary)');
    
    el.classList.add('used');
    
    const slot = document.querySelector(`.slot[data-index="${recallStep}"]`);
    if(slot) {
      slot.classList.add('filled');
      slot.textContent = cardId;
    }
    
    recallStep++;
    vibrate([20]);
    playSound('correct');

    if (recallStep >= sequence.length) {
      state = 'SUCCESS';
      playSound('success');
      document.getElementById('timer-fill').style.transform = `scaleX(1)`;
      document.getElementById('timer-fill').style.backgroundColor = 'var(--primary)';
      
      setTimeout(() => {
        round++;
        startRound();
      }, 1200);
    }
  } else {
    // Wrong
    const rect = el.getBoundingClientRect();
    spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2, 'var(--secondary)');
    gameOver('CORRUPTED SEQUENCE');
  }
}

function gameOver(reason) {
  state = 'GAME_OVER';
  if (animationFrame) cancelAnimationFrame(animationFrame);
  if (previewTimer) clearTimeout(previewTimer);

  playSound('wrong');
  vibrate([50, 50, 50]);

  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 300);

  setTimeout(() => {
    showScreen('screen-gameover');
    document.getElementById('gameover-title').textContent = reason || "SYNC FAILED";
    document.getElementById('final-score').textContent = round - 1;
  }, 500);
}

// Boot
window.onload = () => {
  init();
};
</script>
</body>
</html>
