<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>LATENT — trace the light</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%}
  :root{
    --bg0:#0e0f13; --bg1:#070709; --fg:#f3eee4; --dim:#9a938a;
    --accent:#ffc165; --accent2:#65efd3; --danger:#ff6150;
    --panel:rgba(15,16,20,0.60); --line:rgba(255,244,228,0.16);
    --btn:#f4ede0; --btnfg:#111214; --scrim:rgba(4,4,6,0.46);
  }
  @media (prefers-color-scheme:light){
    :root{
      --bg0:#efece4; --bg1:#dbd6cc; --fg:#241f1a; --dim:#6b645b;
      --accent:#c2701a; --accent2:#0c8e7f; --danger:#c53a29;
      --panel:rgba(255,252,246,0.72); --line:rgba(40,34,28,0.16);
      --btn:#201c17; --btnfg:#f4efe6; --scrim:rgba(226,221,211,0.42);
    }
  }
  body{
    background:var(--bg1); color:var(--fg);
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    overflow:hidden; overscroll-behavior:none; position:fixed; inset:0;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:none;
  }
  #stage{position:fixed; inset:0; width:100dvw; height:100dvh; overflow:hidden}
  canvas#game{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}

  #hud{
    position:absolute; top:0; left:0; right:0; z-index:5; pointer-events:none;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;
    opacity:0; transition:opacity .35s ease;
  }
  #hud.on{opacity:1}
  .hrow{display:flex; justify-content:space-between; align-items:flex-start}
  .hlbl{color:var(--dim); font-size:9px; letter-spacing:.26em; display:block; margin-bottom:3px}
  .hleft,.hright{min-width:74px}
  .hmid{text-align:center; flex:1}
  .hright{text-align:right}
  #seq{font-size:15px; letter-spacing:.12em}
  #score{font-size:22px; letter-spacing:.04em}
  #combo{font-size:12px; color:var(--accent2); letter-spacing:.1em; margin-left:4px}
  .lives{letter-spacing:.18em; color:var(--accent); font-size:15px}
  .lives .off{color:var(--dim); opacity:.4}
  #prompt{
    margin-top:12px; text-align:center; font-size:11px; letter-spacing:.46em;
    color:var(--dim); text-transform:uppercase; min-height:15px; transition:color .2s ease;
  }
  #prompt.ok{color:var(--accent2)} #prompt.bad{color:var(--danger)} #prompt.info{color:var(--accent)}

  #caption{
    position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    text-align:center; font-size:9px; letter-spacing:.36em; color:var(--dim);
    opacity:.55; z-index:4; pointer-events:none; text-transform:uppercase;
  }
  #mute{
    position:absolute; right:calc(env(safe-area-inset-right,0px) + 14px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px); z-index:6;
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--fg); font-size:15px; pointer-events:auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #mute:active{transform:scale(.94)}

  .overlay{
    position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:24px; opacity:0; visibility:hidden; transition:opacity .45s ease;
    pointer-events:none; background:var(--scrim);
  }
  .overlay.show{opacity:1; visibility:visible}
  .card{
    width:min(92vw,430px); background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:32px 28px calc(28px + env(safe-area-inset-bottom,0px));
    text-align:center; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    pointer-events:none; box-shadow:0 26px 70px rgba(0,0,0,.42);
  }
  .title{font-size:clamp(36px,12vw,52px); letter-spacing:.30em; margin:0 0 8px; font-weight:600}
  .tag{font-size:11px; letter-spacing:.28em; color:var(--dim); text-transform:uppercase; margin-bottom:24px}
  .how{font-size:13px; line-height:2.0; opacity:.92; margin:0 auto 4px; text-align:left; display:inline-block}
  .how .n{color:var(--accent); margin-right:8px}
  .how b{color:var(--accent2); font-weight:600}
  .btn{
    pointer-events:auto; margin-top:24px; width:100%; min-height:56px; border:none;
    border-radius:13px; background:var(--btn); color:var(--btnfg); font-family:inherit;
    font-size:16px; letter-spacing:.26em; text-transform:uppercase; cursor:pointer;
    transition:transform .09s ease, filter .2s ease;
  }
  .btn:active{transform:scale(.97)} .btn:hover{filter:brightness(1.06)}
  .ovtitle{font-size:24px; letter-spacing:.24em; margin-bottom:6px; text-transform:uppercase}
  .ovsub{font-size:10px; letter-spacing:.28em; color:var(--dim); text-transform:uppercase; margin-bottom:20px}
  .stat{display:flex; justify-content:space-between; align-items:baseline; padding:11px 3px; border-bottom:1px solid var(--line)}
  .stat .k{color:var(--dim); font-size:10px; letter-spacing:.24em}
  .stat .v{font-size:16px; letter-spacing:.08em}
  .stat .v.big{font-size:30px}
  .note{font-size:10px; letter-spacing:.2em; color:var(--dim); margin-top:16px; opacity:.8}
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>

  <div id="hud">
    <div class="hrow">
      <div class="hleft"><span class="hlbl">SEQ</span><span id="seq">3</span></div>
      <div class="hmid"><span class="hlbl">SCORE</span><span id="score">0</span><span id="combo"></span></div>
      <div class="hright"><span class="hlbl">FILM</span><span id="lives" class="lives"></span></div>
    </div>
    <div id="prompt"></div>
  </div>

  <div id="caption">SF · 14°C · FOG · AUG 21</div>
  <button id="mute" aria-label="toggle sound">&#9834;</button>

  <div class="overlay show" id="title">
    <div class="card">
      <div class="title">LATENT</div>
      <div class="tag">trace the light before it fades</div>
      <div class="how">
        <div><span class="n">1</span>A path <b>flashes</b> for a heartbeat.</div>
        <div><span class="n">2</span>Redraw it from memory — <b>drag the dots</b>.</div>
        <div><span class="n">3</span>Each round adds a step. <b>3 exposures</b>.</div>
      </div>
      <button class="btn" data-smoke="start" id="start">START &#9655;</button>
    </div>
  </div>

  <div class="overlay" id="over">
    <div class="card">
      <div class="ovtitle" id="ovtitle">OUT OF FILM</div>
      <div class="ovsub" id="ovsub">the fog took the rest</div>
      <div class="stat"><span class="k">LONGEST TRACE</span><span class="v big" id="ovseq">0</span></div>
      <div class="stat"><span class="k">SCORE</span><span class="v" id="ovscore">0</span></div>
      <div class="stat"><span class="k">SESSION BEST</span><span class="v" id="ovbest">0</span></div>
      <button class="btn" data-smoke="restart" id="restart">AGAIN &#9655;</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------- tiny helpers ---------- */
  var R = Math.random;
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function rnd(a,b){ return a+(b-a)*R(); }
  function rint(a,b){ return Math.floor(rnd(a,b+1)); }
  function pick(arr){ return arr[(R()*arr.length)|0]; }
  function d2(ax,ay,bx,by){ var dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
  var now = (window.performance && performance.now) ? function(){return performance.now();} : function(){return Date.now();};

  /* ---------- DOM ---------- */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext ? canvas.getContext('2d') : null;
  var hud = document.getElementById('hud');
  var seqEl = document.getElementById('seq');
  var scoreEl = document.getElementById('score');
  var comboEl = document.getElementById('combo');
  var livesEl = document.getElementById('lives');
  var promptEl = document.getElementById('prompt');
  var titleOv = document.getElementById('title');
  var overOv = document.getElementById('over');
  var startBtn = document.getElementById('start');
  var restartBtn = document.getElementById('restart');
  var muteBtn = document.getElementById('mute');
  var ovseq = document.getElementById('ovseq');
  var ovscore = document.getElementById('ovscore');
  var ovbest = document.getElementById('ovbest');
  var ovtitle = document.getElementById('ovtitle');
  var ovsub = document.getElementById('ovsub');

  /* If 2D is somehow unavailable, degrade without throwing. */
  if(!ctx){
    if(startBtn){ startBtn.textContent = 'UNAVAILABLE'; startBtn.disabled = true; }
    return;
  }

  /* ---------- theme ---------- */
  var dark = true, COL = null;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function makeTheme(d){
    return d ? {
      bg0:'#12131a', bg1:'#07070a',
      dot:'rgba(255,244,228,0.10)', dotHi:'rgba(255,244,228,0.20)',
      start:'#ffce74', trail:'#ffc165', trailHot:'#fff5e2',
      player:'#63efd2', playerHot:'#d9fff6', danger:'#ff6150',
      ghost:'rgba(255,193,101,0.5)', vignette:'rgba(0,0,0,0.72)',
      flash:'#fff5e6', glowT:'rgba(255,193,101,0.9)', glowP:'rgba(99,239,210,0.9)',
      text:'#f3eee4'
    } : {
      bg0:'#f1eee6', bg1:'#d8d3c8',
      dot:'rgba(40,34,28,0.16)', dotHi:'rgba(40,34,28,0.30)',
      start:'#b4640f', trail:'#c86f16', trailHot:'#ffcf8f',
      player:'#0c8e7f', playerHot:'#63d8c6', danger:'#c53a29',
      ghost:'rgba(180,100,15,0.55)', vignette:'rgba(70,58,44,0.34)',
      flash:'#fffaf0', glowT:'rgba(200,111,22,0.6)', glowP:'rgba(12,142,127,0.55)',
      text:'#241f1a'
    };
  }
  function applyTheme(){
    dark = mq ? mq.matches : true;
    COL = makeTheme(dark);
    buildVignette();
  }
  if(mq){
    if(mq.addEventListener) mq.addEventListener('change', applyTheme);
    else if(mq.addListener) mq.addListener(applyTheme);
  }

  /* ---------- audio (guarded) ---------- */
  var AC=null, master=null, noiseBuf=null, muted=false;
  var SCALE=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
  function initAudio(){
    if(AC) return;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      AC = new Ctx();
      master = AC.createGain(); master.gain.value = 0.85; master.connect(AC.destination);
      var len = Math.floor(AC.sampleRate*0.5);
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for(var i=0;i<len;i++) d[i] = R()*2-1;
    }catch(e){ AC=null; }
  }
  function resumeAudio(){ try{ if(AC && AC.state==='suspended') AC.resume(); }catch(e){} }
  function tone(freq,dur,type,gain,when){
    if(!AC || muted) return;
    try{
      var t0 = when || AC.currentTime;
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.linearRampToValueAtTime(gain,t0+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03);
    }catch(e){}
  }
  function noise(dur,gain,freq,q){
    if(!AC || muted || !noiseBuf) return;
    try{
      var t0=AC.currentTime;
      var s=AC.createBufferSource(); s.buffer=noiseBuf;
      var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200; f.Q.value=q||1;
      var g=AC.createGain(); g.gain.setValueAtTime(gain,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+dur+0.03);
    }catch(e){}
  }
  function noteFor(n){ // ascending across octaves
    var i=(n-1)%SCALE.length, oct=Math.floor((n-1)/SCALE.length);
    return SCALE[i]*Math.pow(2,oct);
  }
  function sfxShutter(){ noise(0.05,0.4,3200,1.2); tone(1400,0.03,'square',0.05); }
  function sfxReveal(i){ tone(noteFor(i+1)*1.5,0.12,'triangle',0.09); }
  function sfxPluck(n){ tone(noteFor(n),0.18,'triangle',0.16); tone(noteFor(n)*2,0.10,'sine',0.05); }
  function sfxSuccess(){
    if(!AC||muted) return;
    var base=AC.currentTime, ch=[0,2,4,7,11];
    for(var i=0;i<ch.length;i++){ var s=ch[i]; tone(261.63*Math.pow(2,s/12),0.3,'triangle',0.13,base+i*0.055); }
    tone(1046,0.5,'sine',0.05,base+0.05);
  }
  function sfxMiss(){
    if(!AC||muted) return;
    try{
      var t0=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(240,t0); o.frequency.exponentialRampToValueAtTime(66,t0+0.45);
      g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(0.2,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.5);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.53);
    }catch(e){}
    noise(0.3,0.18,320,0.7);
  }
  function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

  /* ---------- layout / grid ---------- */
  var W=0,H=0,DPR=1;
  var PADX=20, TOPSAFE=108, BOTSAFE=100;
  var cols=4, rows=6, nodes=[], rect={x:0,y:0,w:1,h:1}, spacing=80, captureR=36, nodeR=4;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    if(W<1) W=1; if(H<1) H=1;
    canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    computeLayout();
    buildVignette();
  }
  function chooseGrid(){
    var availW = W-2*PADX, availH = H-TOPSAFE-BOTSAFE;
    var target = Math.max(76, Math.min(W,H)/5.2);
    cols = clamp(Math.round(availW/target),3,6);
    rows = clamp(Math.round(availH/target),4,8);
  }
  function computeLayout(){
    rect = { x:PADX, y:TOPSAFE, w:W-2*PADX, h:Math.max(60,H-TOPSAFE-BOTSAFE) };
    nodes = [];
    for(var gy=0; gy<rows; gy++){
      for(var gx=0; gx<cols; gx++){
        nodes.push({
          gx:gx, gy:gy, i:gy*cols+gx,
          x: rect.x + rect.w*(gx+0.5)/cols,
          y: rect.y + rect.h*(gy+0.5)/rows
        });
      }
    }
    spacing = Math.min(rect.w/cols, rect.h/rows);
    captureR = spacing*0.46;
    nodeR = clamp(spacing*0.055,3,6);
  }
  function neighbors(gx,gy){
    var out=[];
    for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
      if(dx===0&&dy===0) continue;
      var nx=gx+dx, ny=gy+dy;
      if(nx>=0&&nx<cols&&ny>=0&&ny<rows) out.push([nx,ny]);
    }
    return out;
  }
  function segIntersect(ax,ay,bx,by,cx,cy,dx,dy){
    function ccw(px,py,qx,qy,rx,ry){ return (ry-py)*(qx-px) > (qy-py)*(rx-px); }
    return ccw(ax,ay,cx,cy,dx,dy)!==ccw(bx,by,cx,cy,dx,dy) &&
           ccw(ax,ay,bx,by,cx,cy)!==ccw(ax,ay,bx,by,dx,dy);
  }
  // self-avoiding king-walk; avoids self-crossing so shapes stay legible
  function genPath(len){
    var maxLen = Math.max(4, Math.floor(cols*rows*0.62));
    len = clamp(len, 2, maxLen);
    for(var att=0; att<400; att++){
      var sx=rint(0,cols-1), sy=rint(0,rows-1);
      var path=[[sx,sy]], seen={}; seen[sy*cols+sx]=1;
      var ok=true;
      for(var k=1;k<len;k++){
        var cur=path[k-1];
        var nb = neighbors(cur[0],cur[1]).filter(function(n){ return !seen[n[1]*cols+n[0]]; });
        // drop moves that cross an existing segment
        nb = nb.filter(function(n){
          var ax=cur[0], ay=cur[1], bx=n[0], by=n[1];
          for(var s=0;s<path.length-1;s++){
            var p=path[s], q=path[s+1];
            if(p[0]===ax&&p[1]===ay) continue;
            if(q[0]===ax&&q[1]===ay) continue;
            if(segIntersect(ax,ay,bx,by,p[0],p[1],q[0],q[1])) return false;
          }
          return true;
        });
        if(!nb.length){ ok=false; break; }
        var nx = pick(nb);
        path.push(nx); seen[nx[1]*cols+nx[0]]=1;
      }
      if(ok && path.length===len) return path.map(function(p){ return p[1]*cols+p[0]; });
    }
    // fallback: snake
    var p=[], x=0,y=0,dir=1;
    for(var m=0;m<len;m++){
      p.push(y*cols+x); x+=dir;
      if(x<0||x>=cols){ x=clamp(x,0,cols-1); y=Math.min(y+1,rows-1); dir*=-1; }
    }
    return p.slice(0,len);
  }

  /* ---------- vignette + grain caches ---------- */
  var vig=null;
  function buildVignette(){
    if(!COL) return;
    vig = document.createElement('canvas');
    vig.width = Math.max(1,Math.round(W)); vig.height = Math.max(1,Math.round(H));
    var g = vig.getContext('2d');
    var grd = g.createRadialGradient(W/2,H*0.44,Math.min(W,H)*0.18, W/2,H*0.52,Math.max(W,H)*0.78);
    grd.addColorStop(0,'rgba(0,0,0,0)');
    grd.addColorStop(0.7,'rgba(0,0,0,0)');
    grd.addColorStop(1,COL.vignette);
    g.fillStyle=grd; g.fillRect(0,0,W,H);
  }
  var grainPats=[];
  function buildGrain(){
    grainPats=[];
    var size=128;
    for(var k=0;k<6;k++){
      var c=document.createElement('canvas'); c.width=size; c.height=size;
      var g=c.getContext('2d');
      var img=g.createImageData(size,size), d=img.data;
      for(var p=0;p<size*size;p++){
        var white = R()<0.5?255:0;
        var a = R()<0.55 ? (R()*255)|0 : 0;
        d[p*4]=white; d[p*4+1]=white; d[p*4+2]=white; d[p*4+3]=a;
      }
      g.putImageData(img,0,0);
      var pat = ctx.createPattern(c,'repeat');
      if(pat) grainPats.push(pat);
    }
  }

  /* ---------- particles ---------- */
  var parts=[];
  function spawn(x,y,col,count,spd,life){
    for(var i=0;i<count;i++){
      if(parts.length>240) break;
      var a=rnd(0,Math.PI*2), s=rnd(spd*0.3,spd);
      parts.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
        life:rnd(life*0.6,life), max:life, r:rnd(1.6,3.4), col:col, grav:rnd(0.002,0.02) });
    }
  }
  function updateParts(dt){
    var f=dt*0.06;
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.x+=p.vx*f; p.y+=p.vy*f; p.vy+=p.grav*dt; p.vx*=0.985; p.vy*=0.985;
      p.life-=dt;
      if(p.life<=0) parts.splice(i,1);
    }
  }
  function drawParts(){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(var i=0;i<parts.length;i++){
      var p=parts[i], a=clamp(p.life/p.max,0,1);
      ctx.globalAlpha=a; ctx.fillStyle=p.col;
      ctx.shadowColor=p.col; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- game state ---------- */
  var S={MENU:0,REVEAL:1,RECALL:2,RESULT:3,OVER:4};
  var state=S.MENU;
  var MAXLIVES=3;
  var level=1, score=0, lives=MAXLIVES, combo=0, best=0, bestScore=0;
  var path=[], captured=[];
  var phase='draw', tmr=0, revealT=0, litReported=0, trailAlpha=1;
  var revealStep=380, holdTime=900, dissolveTime=400;
  var traceTimer=0, traceMax=1;
  var resultTimer=0, resultOk=false, failNode=-1;
  var freeze=0, flash=0, shake=0, grainLevel=0.1, pulse=0;
  var ptr={down:false,x:0,y:0};
  var cursor={gx:0,gy:0}, usingKeyboard=false;

  function cfg(L){
    return {
      revealStep: Math.max(155, 430 - L*22),
      holdTime:   Math.max(300, 1000 - L*70),
      dissolveTime: Math.max(260, 430 - L*12),
      traceMax:   2600 + (L+2)*640 - L*40,
      grain:      clamp(0.10 + L*0.013, 0.10, 0.27)
    };
  }

  function setPrompt(txt,kind){
    promptEl.textContent = txt||'';
    promptEl.className = kind||'';
  }
  function livesStr(){
    var s='';
    for(var i=0;i<MAXLIVES;i++) s += (i<lives) ? '<span>&#9670;</span>' : '<span class="off">&#9670;</span>';
    return s;
  }
  function refreshHUD(){
    seqEl.textContent = (state===S.MENU?0:(level+2));
    scoreEl.textContent = score;
    comboEl.textContent = combo>1 ? ('\u00d7'+combo) : '';
    livesEl.innerHTML = livesStr();
  }

  function startLevel(){
    var len = level+2;
    path = genPath(len);
    captured = [];
    revealT=0; litReported=0; trailAlpha=1; tmr=0; phase='draw';
    var c=cfg(level);
    revealStep=c.revealStep; holdTime=c.holdTime; dissolveTime=c.dissolveTime;
    traceMax=c.traceMax; traceTimer=c.traceMax; grainLevel=c.grain;
    state=S.REVEAL;
    var s=nodes[path[0]]; if(s) cursor={gx:s.gx,gy:s.gy};
    setPrompt('memorize','info');
    refreshHUD();
  }
  function beginRecall(){
    state=S.RECALL; captured=[]; traceTimer=traceMax; ptr.down=false;
    var s=nodes[path[0]]; if(s) cursor={gx:s.gx,gy:s.gy};
    setPrompt('trace it','');
  }
  function onNodeLit(i){
    var n=nodes[path[i]]; if(!n) return;
    flash = Math.min(1.25, flash + (i===0?0.85:0.42));
    shake = Math.max(shake, i===0?5:2.4);
    spawn(n.x,n.y,COL.trail,6,3.5,520);
    sfxReveal(i); if(i===0) sfxShutter();
    vibrate(i===0?14:5);
  }
  function captureNode(i){
    captured.push(i);
    var n=nodes[i];
    spawn(n.x,n.y,COL.player,8,4,480);
    flash=Math.min(1,flash+0.10); shake=Math.max(shake,2.5);
    score += Math.round(9*(1+combo*0.5));
    sfxPluck(captured.length); vibrate(7);
    refreshHUD();
    if(captured.length===path.length) succeed();
  }
  function succeed(){
    state=S.RESULT; resultOk=true; resultTimer=680;
    var timeBonus=Math.round(clamp(traceTimer/traceMax,0,1)*45*level);
    var lenBonus=path.length*10;
    score += lenBonus+timeBonus;
    combo++; best=Math.max(best,path.length); bestScore=Math.max(bestScore,score);
    freeze=90; flash=Math.min(1.2,flash+0.7); shake=6;
    var last=nodes[path[path.length-1]];
    if(last) spawn(last.x,last.y,COL.player,26,7,760);
    if(last) spawn(last.x,last.y,COL.trail,14,5,700);
    sfxSuccess(); vibrate([12,26,12]);
    setPrompt('developed','ok');
    refreshHUD();
  }
  function fail(reason,wrong){
    if(state!==S.RECALL) return;
    state=S.RESULT; resultOk=false; resultTimer=1350; failNode=(wrong===undefined?-1:wrong);
    combo=0; lives--;
    freeze=110; shake=15; flash=Math.min(1,flash+0.22);
    var fx = (failNode>=0 && nodes[failNode]) ? nodes[failNode] : {x:W/2,y:rect.y+rect.h/2};
    spawn(fx.x,fx.y,COL.danger,22,6,760);
    sfxMiss(); vibrate([30,40,60]);
    setPrompt(reason==='timeout'?'faded out':'misread','bad');
    refreshHUD();
  }
  function afterResult(){
    if(resultOk){ level++; startLevel(); }
    else{ if(lives<=0){ gameOver(); } else { startLevel(); } }
  }
  function gameOver(){
    state=S.OVER;
    bestScore=Math.max(bestScore,score);
    ovseq.textContent = best;
    ovscore.textContent = score;
    ovbest.textContent = bestScore;
    if(best>=8){ ovtitle.textContent='SHARP EYE'; ovsub.textContent='the light remembered you'; }
    else if(best>=5){ ovtitle.textContent='DEVELOPED'; ovsub.textContent='a steady hand in the fog'; }
    else { ovtitle.textContent='OUT OF FILM'; ovsub.textContent='the fog took the rest'; }
    overOv.classList.add('show');
    setPrompt('','');
  }

  function startGame(){
    initAudio(); resumeAudio();
    chooseGrid(); computeLayout();
    level=1; score=0; lives=MAXLIVES; combo=0; best=0;
    parts.length=0; flash=0; shake=0;
    titleOv.classList.remove('show');
    overOv.classList.remove('show');
    startLevel();
  }

  /* ---------- input ---------- */
  function localXY(e){
    var r=canvas.getBoundingClientRect();
    return { x:(e.clientX-r.left), y:(e.clientY-r.top) };
  }
  function classify(i){
    if(state!==S.RECALL || freeze>0) return;
    if(i===path[captured.length]) captureNode(i);
    else if(captured.indexOf(i)<0) fail('wrong',i);
  }
  function attemptAt(x,y){
    if(state!==S.RECALL || freeze>0) return;
    var best=-1, bd=captureR*captureR;
    for(var k=0;k<nodes.length;k++){
      var n=nodes[k], dd=d2(x,y,n.x,n.y);
      if(dd<=bd){ bd=dd; best=n.i; }
    }
    if(best>=0) classify(best);
  }
  function onDown(e){
    try{
      resumeAudio();
      if(state===S.RECALL){
        var p=localXY(e); ptr.down=true; ptr.x=p.x; ptr.y=p.y; usingKeyboard=false;
        attemptAt(p.x,p.y);
      }
      if(e.cancelable) e.preventDefault();
    }catch(err){}
  }
  function onMove(e){
    try{
      if(ptr.down && state===S.RECALL){
        var p=localXY(e); ptr.x=p.x; ptr.y=p.y;
        attemptAt(p.x,p.y);
        if(e.cancelable) e.preventDefault();
      }
    }catch(err){}
  }
  function onUp(e){
    try{ ptr.down=false; if(e && e.cancelable) e.preventDefault(); }catch(err){}
  }
  canvas.addEventListener('pointerdown', onDown, {passive:false});
  canvas.addEventListener('pointermove', onMove, {passive:false});
  window.addEventListener('pointerup', onUp, {passive:false});
  window.addEventListener('pointercancel', onUp, {passive:false});

  window.addEventListener('keydown', function(e){
    try{
      var k=e.key;
      if(k==='Enter'||k===' '||k==='Spacebar'){
        if(state===S.MENU){ startGame(); e.preventDefault(); return; }
        if(state===S.OVER){ startGame(); e.preventDefault(); return; }
        if(state===S.RECALL){ usingKeyboard=true; classify(cursor.gy*cols+cursor.gx); e.preventDefault(); return; }
      }
      if(k==='m'||k==='M'){ toggleMute(); return; }
      if(state===S.RECALL){
        var moved=true;
        if(k==='ArrowUp') cursor.gy=clamp(cursor.gy-1,0,rows-1);
        else if(k==='ArrowDown') cursor.gy=clamp(cursor.gy+1,0,rows-1);
        else if(k==='ArrowLeft') cursor.gx=clamp(cursor.gx-1,0,cols-1);
        else if(k==='ArrowRight') cursor.gx=clamp(cursor.gx+1,0,cols-1);
        else moved=false;
        if(moved){ usingKeyboard=true; e.preventDefault(); }
      }
    }catch(err){}
  });

  function toggleMute(){
    muted=!muted;
    muteBtn.innerHTML = muted ? '&#9788;' : '&#9834;';
    muteBtn.style.opacity = muted ? '0.5' : '1';
  }

  startBtn.addEventListener('click', function(e){ e.preventDefault(); startGame(); });
  restartBtn.addEventListener('click', function(e){ e.preventDefault(); startGame(); });
  muteBtn.addEventListener('click', function(e){ e.preventDefault(); initAudio(); resumeAudio(); toggleMute(); });

  /* ---------- ambient menu demo ---------- */
  var amb={path:[],count:0,partial:null,revealT:0,phase:'draw',alpha:1,t:0,step:250,hold:1100,diss:820,gapT:650};
  function ambNew(){
    amb.path=genPath(rint(3,6)); amb.count=0; amb.partial=null; amb.revealT=0;
    amb.phase='draw'; amb.alpha=1; amb.t=0;
    var s=nodes[amb.path[0]]; if(s) flash=Math.min(1,flash+0.2);
  }
  function updateMenu(dt){
    amb.t+=dt;
    if(!amb.path.length){ ambNew(); return; }
    if(amb.phase==='draw'){
      amb.revealT += dt/amb.step;
      amb.count=Math.min(amb.path.length, Math.floor(amb.revealT)+1);
      var seg=Math.floor(amb.revealT), fr=amb.revealT-seg;
      amb.partial=null;
      if(seg+1<amb.path.length){
        var a=nodes[amb.path[seg]], b=nodes[amb.path[seg+1]];
        if(a&&b) amb.partial={x:lerp(a.x,b.x,fr),y:lerp(a.y,b.y,fr)};
      }
      if(amb.revealT>=amb.path.length-1){ amb.count=amb.path.length; amb.partial=null; amb.phase='hold'; amb.t=0; flash=Math.min(1,flash+0.22); }
    } else if(amb.phase==='hold'){ if(amb.t>amb.hold){ amb.phase='dissolve'; amb.t=0; } }
    else if(amb.phase==='dissolve'){ amb.alpha=clamp(1-amb.t/amb.diss,0,1); if(amb.t>amb.diss){ amb.phase='gap'; amb.t=0; amb.alpha=1; } }
    else { if(amb.t>amb.gapT) ambNew(); }
  }

  /* ---------- update ---------- */
  function update(dt){
    pulse += dt*0.006;
    flash = Math.max(0, flash - flash*Math.min(1,dt*0.010) - dt*0.0006);
    shake = Math.max(0, shake - dt*0.03);
    updateParts(dt);

    if(state===S.MENU){ updateMenu(dt); return; }
    if(state===S.REVEAL){
      if(freeze>0){ freeze=Math.max(0,freeze-dt); return; }
      if(phase==='draw'){
        revealT += dt/revealStep;
        var target=Math.min(path.length, Math.floor(revealT)+1);
        while(litReported<target){ onNodeLit(litReported); litReported++; }
        if(revealT>=path.length-1){ revealT=path.length-1; litReported=path.length; phase='hold'; tmr=holdTime; }
      } else if(phase==='hold'){ tmr-=dt; if(tmr<=0){ phase='dissolve'; tmr=dissolveTime; } }
      else if(phase==='dissolve'){ tmr-=dt; trailAlpha=clamp(tmr/dissolveTime,0,1); if(tmr<=0){ trailAlpha=0; beginRecall(); } }
      return;
    }
    if(state===S.RECALL){
      if(freeze>0){ freeze=Math.max(0,freeze-dt); return; }
      traceTimer-=dt;
      if(traceTimer<=0) fail('timeout');
      return;
    }
    if(state===S.RESULT){
      if(freeze>0){ freeze=Math.max(0,freeze-dt); return; }
      resultTimer-=dt;
      if(resultTimer<=0) afterResult();
      return;
    }
  }

  /* ---------- render ---------- */
  function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill(); }
  function strokeTrail(P, lw, col, hot, glow, alpha){
    if(P.length<1) return;
    ctx.save();
    ctx.globalAlpha=alpha; ctx.lineJoin='round'; ctx.lineCap='round';
    if(P.length>=2){
      ctx.shadowColor=glow; ctx.shadowBlur=lw*2.4;
      ctx.strokeStyle=col; ctx.lineWidth=lw;
      ctx.beginPath(); ctx.moveTo(P[0].x,P[0].y);
      for(var i=1;i<P.length;i++) ctx.lineTo(P[i].x,P[i].y);
      ctx.stroke();
      ctx.shadowBlur=lw*0.8; ctx.strokeStyle=hot; ctx.lineWidth=Math.max(1.5,lw*0.4);
      ctx.stroke();
    }
    ctx.restore();
  }
  function litNode(n,col,hot,alpha){
    if(!n) return;
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.shadowColor=col; ctx.shadowBlur=spacing*0.30;
    ctx.fillStyle=col; circle(n.x,n.y,spacing*0.095);
    ctx.shadowBlur=spacing*0.10; ctx.fillStyle=hot; circle(n.x,n.y,spacing*0.045);
    ctx.restore();
  }
  function drawBackground(){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,COL.bg0); g.addColorStop(1,COL.bg1);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  function drawDots(){
    ctx.save();
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      var b=1+0.14*Math.sin(pulse*1.3 + i*0.6);
      ctx.fillStyle=COL.dot;
      circle(n.x,n.y,nodeR*b);
    }
    ctx.restore();
  }
  function drawStartMarker(alpha){
    if(!path.length) return;
    var s=nodes[path[0]]; if(!s) return;
    var r=spacing*0.17*(1+0.08*Math.sin(pulse*2.2));
    ctx.save(); ctx.globalAlpha=alpha===undefined?0.95:alpha;
    ctx.strokeStyle=COL.start; ctx.lineWidth=2.5; ctx.shadowColor=COL.start; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(s.x,s.y,r,0,6.283); ctx.stroke();
    ctx.fillStyle=COL.start; ctx.shadowBlur=8; circle(s.x,s.y,nodeR*1.25);
    ctx.restore();
  }
  function drawCursor(){
    if(!usingKeyboard || state!==S.RECALL) return;
    var n=nodes[cursor.gy*cols+cursor.gx]; if(!n) return;
    var r=spacing*0.22, x=n.x, y=n.y, L=r*0.5;
    ctx.save(); ctx.strokeStyle=COL.player; ctx.lineWidth=2; ctx.globalAlpha=0.85;
    var cs=[[-1,-1],[1,-1],[-1,1],[1,1]];
    for(var i=0;i<4;i++){
      var sx=cs[i][0], sy=cs[i][1];
      ctx.beginPath();
      ctx.moveTo(x+sx*r, y+sy*r - sy*L); ctx.lineTo(x+sx*r, y+sy*r); ctx.lineTo(x+sx*r - sx*L, y+sy*r);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawTimerBar(){
    if(state!==S.RECALL) return;
    var frac=clamp(traceTimer/traceMax,0,1);
    var y=rect.y+rect.h+16, x0=rect.x, w=rect.w;
    ctx.save();
    ctx.globalAlpha=0.22; ctx.fillStyle=COL.text; ctx.fillRect(x0,y,w,3);
    ctx.globalAlpha=0.92; ctx.fillStyle = frac>0.28?COL.player:COL.danger;
    ctx.fillRect(x0,y,w*frac,3);
    ctx.restore();
  }
  function pathPoints(pIdx,count){
    var a=[]; for(var i=0;i<count;i++){ var n=nodes[pIdx[i]]; if(n) a.push(n); } return a;
  }
  function drawReveal(){
    var full = phase!=='draw', count, partial=null;
    if(full){ count=path.length; }
    else{
      var seg=Math.floor(revealT), fr=revealT-seg;
      count=Math.min(path.length, seg+1);
      if(seg+1<path.length){
        var a=nodes[path[seg]], b=nodes[path[seg+1]];
        if(a&&b) partial={x:lerp(a.x,b.x,fr),y:lerp(a.y,b.y,fr)};
      }
    }
    var P=pathPoints(path,count); if(partial) P.push(partial);
    strokeTrail(P, spacing*0.10, COL.trail, COL.trailHot, COL.glowT, trailAlpha);
    for(var i=0;i<count;i++) litNode(nodes[path[i]], COL.trail, COL.trailHot, trailAlpha);
    drawStartMarker(Math.max(0.4,trailAlpha));
  }
  function drawRecall(){
    drawStartMarker();
    var P=pathPoints(captured,captured.length);
    if(ptr.down && P.length>0) P.push({x:ptr.x,y:ptr.y});
    strokeTrail(P, spacing*0.10, COL.player, COL.playerHot, COL.glowP, 1);
    for(var i=0;i<captured.length;i++) litNode(nodes[captured[i]], COL.player, COL.playerHot, 1);
    drawCursor();
  }
  function drawResult(){
    drawStartMarker();
    if(resultOk){
      var P=pathPoints(path,path.length);
      strokeTrail(P, spacing*0.11, COL.player, COL.playerHot, COL.glowP, 1);
      for(var i=0;i<path.length;i++) litNode(nodes[path[i]], COL.player, COL.playerHot, 1);
    } else {
      var Pg=pathPoints(path,path.length);
      strokeTrail(Pg, spacing*0.10, COL.trail, COL.trailHot, COL.glowT, 0.55);
      for(var j=0;j<path.length;j++) litNode(nodes[path[j]], COL.trail, COL.trailHot, 0.5);
      if(captured.length){
        var Q=pathPoints(captured,captured.length);
        strokeTrail(Q, spacing*0.085, COL.player, COL.playerHot, COL.glowP, 0.5);
      }
      if(failNode>=0 && nodes[failNode]){
        var wob=1+0.12*Math.sin(pulse*8);
        ctx.save(); ctx.globalAlpha=0.9;
        litNode(nodes[failNode], COL.danger, '#ffffff', 1);
        ctx.strokeStyle=COL.danger; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.arc(nodes[failNode].x,nodes[failNode].y,spacing*0.2*wob,0,6.283); ctx.stroke();
        ctx.restore();
      }
    }
  }
  function drawMenu(){
    if(!amb.path.length) return;
    var P=pathPoints(amb.path,amb.count); if(amb.partial) P.push(amb.partial);
    strokeTrail(P, spacing*0.09, COL.trail, COL.trailHot, COL.glowT, amb.alpha*0.8);
    for(var i=0;i<amb.count;i++) litNode(nodes[amb.path[i]], COL.trail, COL.trailHot, amb.alpha*0.8);
    if(amb.path[0]!==undefined){
      var s=nodes[amb.path[0]];
      if(s){ ctx.save(); ctx.globalAlpha=amb.alpha*0.7; ctx.strokeStyle=COL.start; ctx.lineWidth=2; ctx.shadowColor=COL.start; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(s.x,s.y,spacing*0.15,0,6.283); ctx.stroke(); ctx.restore(); }
    }
  }
  function drawFlash(){
    if(flash<=0.002) return;
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=clamp(flash,0,1);
    ctx.fillStyle=COL.flash; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  function drawVignette(){ if(vig) ctx.drawImage(vig,0,0,W,H); }
  function drawGrain(){
    var a = (state===S.MENU) ? 0.09 : grainLevel;
    if(a<=0 || !grainPats.length) return;
    var pat = grainPats[(frameCount>>1)%grainPats.length];
    ctx.save();
    ctx.globalAlpha=a; ctx.imageSmoothingEnabled=false;
    var ox=(R()*64)|0, oy=(R()*64)|0;
    ctx.translate(-ox,-oy);
    ctx.fillStyle=pat; ctx.fillRect(0,0,W+ox+2,H+oy+2);
    ctx.restore();
  }

  var frameCount=0;
  var SMOKE = false;
  try{ SMOKE = /(?:\?|&)smoke\b/.test(location.search); }catch(e){}
  function exposeSmoke(){
    if(!SMOKE) return;
    try{
      var n=[]; for(var i=0;i<nodes.length;i++) n.push({x:nodes[i].x,y:nodes[i].y});
      window.__L = { state:state, cols:cols, rows:rows, path:path.slice(), captured:captured.slice(),
        nodes:n, lives:lives, level:level, score:score, phase:phase };
    }catch(e){}
  }
  function render(){
    frameCount++;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawBackground();
    ctx.save();
    if(shake>0.1) ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
    drawDots();
    if(state===S.MENU) drawMenu();
    else if(state===S.REVEAL) drawReveal();
    else if(state===S.RECALL) drawRecall();
    else if(state===S.RESULT) drawResult();
    else if(state===S.OVER) drawResult();
    drawParts();
    ctx.restore();
    drawTimerBar();
    drawFlash();
    drawVignette();
    drawGrain();
    hud.classList.toggle('on', state===S.REVEAL||state===S.RECALL||state===S.RESULT);
    exposeSmoke();
  }

  /* ---------- loop ---------- */
  var last=now();
  function loop(){
    var t=now(), dt=t-last; last=t;
    if(dt>50) dt=50; if(dt<0) dt=0;
    try{ update(dt); render(); }catch(err){ /* never let one frame crash the game */ }
    requestAnimationFrame(loop);
  }

  /* ---------- boot ---------- */
  function boot(){
    applyTheme();
    resize();
    buildGrain();
    chooseGrid();
    computeLayout();
    buildVignette();
    ambNew();
    refreshHUD();
    render();
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });
  if(window.visualViewport && window.visualViewport.addEventListener){
    window.visualViewport.addEventListener('resize', resize);
  }
  boot();
})();
</script>
</body>
