<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Orbits</title>
<style>
  :root {
    --bg: #f4f4f5;
    --text: #18181b;
    --primary: #3b82f6;
    --danger: #ef4444;
    --surface: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --text: #f4f4f5;
      --primary: #60a5fa;
      --danger: #f87171;
      --surface: #27272a;
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    touch-action: none;
  }
  #ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    background: var(--surface);
    padding: 2.5rem;
    border-radius: 1.5rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    text-align: center;
    border: 1px solid rgba(128,128,128,0.2);
    max-width: 80%;
  }
  @media (prefers-color-scheme: dark) {
    .screen {
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
  }
  .screen.active {
    display: flex;
  }
  h1 { margin: 0 0 1rem 0; font-size: 1.8rem; letter-spacing: -0.5px; }
  p { margin: 0 0 2rem 0; font-size: 1rem; opacity: 0.8; max-width: 280px; line-height: 1.5; }
  button {
    pointer-events: auto;
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 1.2rem 2.5rem;
    font-size: 1.2rem;
    font-family: inherit;
    border-radius: 0.75rem;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.1s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  button:active {
    transform: scale(0.95);
  }
  #hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 2rem;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: bold;
    pointer-events: none;
    display: none;
    text-transform: uppercase;
    letter-spacing: 1px;
    z-index: 5;
  }
  #hud.active {
    display: flex;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div id="scoreDisplay">LEDGER: 0</div>
  <div id="livesDisplay">AGENTS: 3</div>
</div>
<div id="ui-layer">
  <div id="startScreen" class="screen active">
    <h1>Agent Orbits</h1>
    <p>Flick idle agents into task orbits before they expire. Chain 3 to merge.</p>
    <button data-smoke="start" id="startBtn">Start</button>
  </div>
  <div id="gameOverScreen" class="screen">
    <h1>System Halted</h1>
    <p id="finalScore">LEDGER: 0</p>
    <button data-smoke="restart" id="restartBtn">Restart</button>
  </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const hud = document.getElementById('hud');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const finalScore = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

let width, height;
let dpr = window.devicePixelRatio || 1;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  if (state === 'MENU') {
    initOrbits();
    draw();
  }
}
window.addEventListener('resize', resize);

function getColors() {
  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  return {
    bg: isDark ? '#18181b' : '#f4f4f5',
    text: isDark ? '#f4f4f5' : '#18181b',
    orbit: isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)',
    grid: isDark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)',
    agentColors: ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#ec4899'], // Red, Orange, Green, Blue, Pink (no purple)
    shadow: isDark ? 'rgba(0,0,0,0.8)' : 'rgba(0,0,0,0.2)'
  };
}

let state = 'MENU';
let score = 0;
let lives = 3;
let time = 0;
let lastTime = 0;
let spawnTimer = 0;
let spawnInterval = 2000;

let agents = [];
let orbits = [];
let particles = [];
let gravityWells = [];

let pointer = { x: 0, y: 0, isDown: false, id: null };
let draggedAgent = null;
let pointerHistory = [];

function initOrbits() {
  orbits = [];
  const cx = width / 2;
  const cy = height * 0.35;
  
  // Create responsive orbits based on screen size
  let baseR = Math.min(width, height) * 0.25;
  
  orbits.push({ x: cx, y: cy, r: baseR, speed: 0.001, agents: [], angle: 0, state: 'NORMAL' });
  orbits.push({ x: cx, y: cy, r: baseR * 1.6, speed: -0.0008, agents: [], angle: 0, state: 'NORMAL' });
  
  if (height > width) {
    orbits.push({ x: cx, y: cy - baseR * 1.8, r: baseR * 0.8, speed: 0.0015, agents: [], angle: 0, state: 'NORMAL' });
  } else {
    orbits.push({ x: cx - baseR * 2, y: cy, r: baseR * 0.8, speed: 0.0015, agents: [], angle: 0, state: 'NORMAL' });
    orbits.push({ x: cx + baseR * 2, y: cy, r: baseR * 0.8, speed: -0.0015, agents: [], angle: 0, state: 'NORMAL' });
  }
}

function startGame() {
  state = 'PLAYING';
  score = 0;
  lives = 3;
  time = 0;
  spawnTimer = 2000; // Spawn first agent immediately
  spawnInterval = 2000;
  agents = [];
  particles = [];
  gravityWells = [];
  initOrbits();
  updateHUD();
  
  startScreen.classList.remove('active');
  gameOverScreen.classList.remove('active');
  hud.classList.add('active');
  
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function gameOver() {
  state = 'GAMEOVER';
  hud.classList.remove('active');
  gameOverScreen.classList.add('active');
  finalScore.textContent = `LEDGER: ${score}`;
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

function handlePointerDown(e) {
  if (state !== 'PLAYING') return;
  if (pointer.isDown) return;
  pointer.isDown = true;
  pointer.id = e.pointerId;
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  pointerHistory = [{ x: pointer.x, y: pointer.y, t: performance.now() }];
  
  for (let i = agents.length - 1; i >= 0; i--) {
    let a = agents[i];
    if (a.state === 'SPAWNED') {
      let dx = pointer.x - a.x;
      let dy = pointer.y - a.y;
      if (dx*dx + dy*dy < a.size * a.size * 6) { // Generous hit area
        draggedAgent = a;
        a.state = 'DRAGGING';
        if (navigator.vibrate) navigator.vibrate(10);
        break;
      }
    }
  }
}

function handlePointerMove(e) {
  if (!pointer.isDown || e.pointerId !== pointer.id) return;
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  pointerHistory.push({ x: pointer.x, y: pointer.y, t: performance.now() });
  if (pointerHistory.length > 8) pointerHistory.shift();
  
  if (draggedAgent) {
    draggedAgent.x = pointer.x;
    draggedAgent.y = pointer.y;
  }
}

function handlePointerUp(e) {
  if (!pointer.isDown || e.pointerId !== pointer.id) return;
  pointer.isDown = false;
  
  if (draggedAgent) {
    let now = performance.now();
    let validHistory = pointerHistory.filter(p => now - p.t < 150);
    if (validHistory.length > 1) {
      let first = validHistory[0];
      let last = validHistory[validHistory.length - 1];
      let dt = Math.max(1, last.t - first.t);
      draggedAgent.vx = (last.x - first.x) / dt * 20;
      draggedAgent.vy = (last.y - first.y) / dt * 20;
    } else {
      draggedAgent.vx = 0;
      draggedAgent.vy = 0;
    }
    
    let speed = Math.hypot(draggedAgent.vx, draggedAgent.vy);
    let maxSpeed = 40;
    if (speed > maxSpeed) {
      draggedAgent.vx = (draggedAgent.vx / speed) * maxSpeed;
      draggedAgent.vy = (draggedAgent.vy / speed) * maxSpeed;
    }
    
    draggedAgent.state = 'FLICKED';
    draggedAgent = null;
  }
}

canvas.addEventListener('pointerdown', handlePointerDown);
canvas.addEventListener('pointermove', handlePointerMove);
canvas.addEventListener('pointerup', handlePointerUp);
canvas.addEventListener('pointercancel', e => {
  if (e.pointerId === pointer.id) {
    pointer.isDown = false;
    if (draggedAgent) {
      draggedAgent.state = 'SPAWNED';
      draggedAgent = null;
    }
  }
});

function spawnAgent() {
  const colors = getColors().agentColors;
  const color = colors[Math.floor(Math.random() * colors.length)];
  const size = Math.min(width, height) * 0.06;
  const margin = size * 2;
  const x = margin + Math.random() * (width - margin * 2);
  const y = height - size * 1.5 - Math.random() * (height * 0.1);
  
  agents.push({
    x, y, vx: 0, vy: 0, size, color,
    state: 'SPAWNED',
    idleTimer: 0,
    maxIdle: Math.max(2500, 6000 - time * 0.04) + Math.random() * 1000,
    orbit: null,
    orbitAngle: 0
  });
}

function createParticles(x, y, color, count = 15) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = Math.random() * 0.8 + 0.2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 500 + Math.random() * 500,
      maxLife: 1000,
      color
    });
  }
}

function loseLife() {
  lives--;
  updateHUD();
  if (navigator.vibrate) navigator.vibrate(100);
  if (lives <= 0) {
    gameOver();
  }
}

function updateHUD() {
  scoreDisplay.textContent = `LEDGER: ${score}`;
  livesDisplay.textContent = `AGENTS: ${lives}`;
}

function checkMerge(orbit) {
  if (orbit.agents.length >= 3 && orbit.state !== 'MERGING') {
    orbit.state = 'MERGING';
    orbit.mergeTimer = 0;
    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
  }
}

function update(dt) {
  if (state !== 'PLAYING') return;
  
  time += dt;
  spawnTimer += dt;
  
  spawnInterval = Math.max(700, 2000 - time * 0.025);
  
  if (spawnTimer > spawnInterval) {
    spawnTimer = 0;
    spawnAgent();
  }
  
  orbits.forEach(o => {
    o.angle += o.speed * dt;
    
    if (o.state === 'MERGING') {
      o.mergeTimer += dt;
      let progress = o.mergeTimer / 400;
      if (progress >= 1) {
        score += 100 * o.agents.length;
        updateHUD();
        if (navigator.vibrate) navigator.vibrate(100);
        
        o.agents.forEach(a => {
          createParticles(o.x, o.y, a.color, 25);
          let idx = agents.indexOf(a);
          if (idx !== -1) agents.splice(idx, 1);
        });
        o.agents = [];
        o.state = 'NORMAL';
      } else {
        let easeIn = progress * progress * progress;
        o.agents.forEach(a => {
          let currentR = o.r * (1 - easeIn);
          a.x = o.x + Math.cos(a.orbitAngle + o.angle) * currentR;
          a.y = o.y + Math.sin(a.orbitAngle + o.angle) * currentR;
        });
      }
    }
  });
  
  if (score > 300 && Math.random() < 0.002) {
    gravityWells.push({
      x: width * 0.1 + Math.random() * width * 0.8,
      y: height * 0.2 + Math.random() * height * 0.5,
      r: width * 0.1,
      life: 6000
    });
  }
  for (let i = gravityWells.length - 1; i >= 0; i--) {
    let gw = gravityWells[i];
    gw.life -= dt;
    if (gw.life <= 0) gravityWells.splice(i, 1);
  }
  
  for (let i = agents.length - 1; i >= 0; i--) {
    let a = agents[i];
    
    if (a.state === 'SPAWNED') {
      a.idleTimer += dt;
      if (a.idleTimer > a.maxIdle) {
        createParticles(a.x, a.y, a.color);
        agents.splice(i, 1);
        loseLife();
      }
    } else if (a.state === 'FLICKED') {
      a.x += a.vx * dt * 0.06;
      a.y += a.vy * dt * 0.06;
      a.vx *= 0.985;
      a.vy *= 0.985;
      
      gravityWells.forEach(gw => {
        let dx = gw.x - a.x;
        let dy = gw.y - a.y;
        let distSq = dx*dx + dy*dy;
        if (distSq < gw.r * gw.r * 6) {
          let dist = Math.sqrt(distSq);
          let force = (gw.r * 2.5 - dist) / (gw.r * 2.5) * 0.8;
          a.vx += (dx / dist) * force * dt;
          a.vy += (dy / dist) * force * dt;
          
          if (dist < gw.r * 0.3) {
            createParticles(a.x, a.y, a.color);
            agents.splice(i, 1);
            loseLife();
            return;
          }
        }
      });
      
      let snapped = false;
      for (let o of orbits) {
        if (o.state === 'MERGING') continue;
        let dx = a.x - o.x;
        let dy = a.y - o.y;
        let dist = Math.hypot(dx, dy);
        if (Math.abs(dist - o.r) < a.size * 1.5) {
          a.state = 'ORBITING';
          a.orbit = o;
          a.orbitAngle = Math.atan2(dy, dx) - o.angle;
          o.agents.push(a);
          snapped = true;
          if (navigator.vibrate) navigator.vibrate(20);
          checkMerge(o);
          break;
        }
      }
      
      if (!snapped) {
        if (a.x < -a.size || a.x > width + a.size || a.y < -a.size || a.y > height + a.size) {
          agents.splice(i, 1);
          loseLife();
        } else if (Math.hypot(a.vx, a.vy) < 0.2) {
          a.state = 'SPAWNED';
          a.idleTimer = 0;
          a.maxIdle = 3000;
        }
      }
    } else if (a.state === 'ORBITING') {
      if (a.orbit.state !== 'MERGING') {
        a.x = a.orbit.x + Math.cos(a.orbitAngle + a.orbit.angle) * a.orbit.r;
        a.y = a.orbit.y + Math.sin(a.orbitAngle + a.orbit.angle) * a.orbit.r;
      }
    }
  }
  
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawRoundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawGrid(ctx, colors) {
  ctx.strokeStyle = colors.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  let step = Math.min(width, height) * 0.1;
  for (let x = 0; x < width; x += step) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
  }
  for (let y = 0; y < height; y += step) {
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
  }
  ctx.stroke();
}

function draw() {
  const colors = getColors();
  
  ctx.fillStyle = colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  drawGrid(ctx, colors);
  
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 8]);
  orbits.forEach(o => {
    ctx.strokeStyle = colors.orbit;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.setLineDash([]);
  
  gravityWells.forEach(gw => {
    let alpha = Math.min(1, gw.life / 1000);
    ctx.strokeStyle = colors.text;
    ctx.lineWidth = 2;
    ctx.globalAlpha = alpha * 0.4;
    
    let ringProgress = (time % 1500) / 1500;
    for (let i = 0; i < 3; i++) {
      let r = gw.r * ((ringProgress + i/3) % 1);
      ctx.beginPath();
      ctx.arc(gw.x, gw.y, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
  
  if (draggedAgent) {
    ctx.strokeStyle = colors.orbit;
    ctx.lineWidth = 4;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(draggedAgent.x, draggedAgent.y);
    
    let now = performance.now();
    let validHistory = pointerHistory.filter(p => now - p.t < 150);
    if (validHistory.length > 1) {
      let first = validHistory[0];
      let last = validHistory[validHistory.length - 1];
      let dt = Math.max(1, last.t - first.t);
      let vx = (last.x - first.x) / dt * 20;
      let vy = (last.y - first.y) / dt * 20;
      ctx.lineTo(draggedAgent.x + vx * 15, draggedAgent.y + vy * 15);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }
  
  ctx.shadowColor = colors.shadow;
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 6;
  
  agents.forEach(a => {
    ctx.fillStyle = a.color;
    
    let scale = 1;
    if (a.state === 'SPAWNED' && a.idleTimer > a.maxIdle * 0.7) {
      scale = 1 + Math.sin(time * 0.03) * 0.1;
      if (Math.sin(time * 0.05) > 0) ctx.fillStyle = colors.agentColors[0]; // Flash red
    }
    
    let s = a.size * scale;
    
    ctx.save();
    ctx.translate(a.x, a.y);
    
    drawRoundedRect(ctx, -s, -s, s*2, s*2, s*0.4);
    ctx.fill();
    
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(0, 0, s*0.4, 0, Math.PI * 2);
    ctx.fill();
    
    if (a.state === 'SPAWNED') {
      let progress = a.idleTimer / a.maxIdle;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      if (progress > 0.7) ctx.strokeStyle = colors.agentColors[0];
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, s*0.4, -Math.PI/2, -Math.PI/2 + progress * Math.PI * 2);
      ctx.stroke();
    }
    
    ctx.restore();
  });
  
  ctx.shadowColor = 'transparent';
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, width * 0.015, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // Fog overlay at bottom
  let gradient = ctx.createLinearGradient(0, height * 0.7, 0, height);
  if (colors.bg === '#18181b') {
    gradient.addColorStop(0, 'rgba(24,24,27,0)');
    gradient.addColorStop(1, 'rgba(24,24,27,0.8)');
  } else {
    gradient.addColorStop(0, 'rgba(244,244,245,0)');
    gradient.addColorStop(1, 'rgba(244,244,245,0.8)');
  }
  ctx.fillStyle = gradient;
  ctx.fillRect(0, height * 0.7, width, height * 0.3);
}

function loop(now) {
  if (state === 'PLAYING') {
    requestAnimationFrame(loop);
  }
  let dt = now - lastTime;
  lastTime = now;
  if (dt > 100) dt = 16;
  
  update(dt);
  draw();
}

resize();
</script>
</body>
</html>
