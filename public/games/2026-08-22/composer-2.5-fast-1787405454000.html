<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Z80 Pulse</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8e4d4;--fg:#8a5a00;--fg-dim:#a08040;--trace:#c8c0a8;--trace-glow:#c87800;
  --panel:rgba(232,228,212,.94);--scan:rgba(255,255,255,.08);--btn-bg:#f0ead8;
  --btn-border:#8a5a00;--danger:#cc3300;--ok:#448800;--hud-bg:rgba(255,255,255,.7);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a0c08;--fg:#ffb000;--fg-dim:#996a00;--trace:#3d4a2a;--trace-glow:#ffb000;
    --panel:rgba(10,12,8,.92);--scan:rgba(0,0,0,.12);--btn-bg:#1a1400;--btn-border:#ffb000;
    --danger:#ff4400;--ok:#66ff00;--hud-bg:rgba(0,0,0,.55);
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8e4d4;--fg:#8a5a00;--fg-dim:#a08040;--trace:#c8c0a8;--trace-glow:#c87800;
    --panel:rgba(232,228,212,.94);--scan:rgba(255,255,255,.08);--btn-bg:#f0ead8;
    --btn-border:#8a5a00;--danger:#cc3300;--ok:#448800;--hud-bg:rgba(255,255,255,.7);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{flex:1;width:100%;display:block;touch-action:none;background:var(--bg)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
  background:var(--hud-bg);font-size:11px;letter-spacing:.08em;min-height:44px;flex-shrink:0}
#hud span{opacity:.85}
#register{display:flex;gap:4px;align-items:center}
.bit{width:14px;height:22px;border:1px solid var(--fg-dim);border-radius:2px;
  background:var(--bg);transition:background .15s,box-shadow .15s}
.bit.on{background:var(--fg);box-shadow:0 0 8px var(--trace-glow)}
#cycleBar{flex:1;max-width:120px;height:6px;background:var(--trace);margin:0 10px;border-radius:3px;overflow:hidden}
#cycleFill{height:100%;width:100%;background:var(--fg);transform-origin:left;transition:none}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:var(--panel);pointer-events:none;z-index:10;
  padding:24px;text-align:center}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(22px,6vw,32px);letter-spacing:.2em;font-weight:400}
.overlay h2{font-size:clamp(18px,5vw,26px);letter-spacing:.15em;font-weight:400}
.overlay p{font-size:12px;color:var(--fg-dim);max-width:280px;line-height:1.6}
.overlay .score{font-size:28px;color:var(--fg);margin:4px 0}
.overlay .hint{font-size:10px;opacity:.7;margin-top:8px}
.btn{pointer-events:auto;min-width:180px;min-height:48px;padding:12px 28px;
  font-family:inherit;font-size:13px;letter-spacing:.15em;background:var(--btn-bg);
  color:var(--fg);border:2px solid var(--btn-border);border-radius:4px;cursor:pointer;
  transition:background .15s,transform .1s}
.btn:active{transform:scale(.97);background:var(--fg);color:var(--bg)}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,var(--scan) 2px,var(--scan) 4px);
  opacity:.45}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}
@media(prefers-color-scheme:light){#vignette{background:radial-gradient(ellipse at center,transparent 60%,rgba(80,60,20,.15) 100%)}}
#swipeHint{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);font-size:10px;
  color:var(--fg-dim);letter-spacing:.1em;pointer-events:none;z-index:6;opacity:0;transition:opacity .4s}
#swipeHint.show{opacity:.7}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="speedLabel">CLK 1.0×</span>
    <div id="register" aria-label="register bits"></div>
    <div id="cycleBar"><div id="cycleFill"></div></div>
    <span id="healthLabel">ERR 0/3</span>
  </div>
  <canvas id="gameCanvas"></canvas>
</div>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="swipeHint">← SWIPE TO ROUTE →</div>

<div id="titleScreen" class="overlay">
  <h1>Z80 PULSE</h1>
  <p>Route power through corroded PCB traces before each clock cycle expires. Swipe at junctions to keep the chip alive.</p>
  <p class="hint">Swipe left / right · Arrow keys on desktop</p>
  <button class="btn" data-smoke="start" id="btnStart">INITIALIZE</button>
</div>

<div id="gameoverScreen" class="overlay hidden">
  <h2>CHIP HALTED</h2>
  <p>Register filled</p>
  <div class="score" id="finalScore">0</div>
  <p id="finalBits">00000000</p>
  <button class="btn" data-smoke="restart" id="btnRestart">REBOOT</button>
</div>

<script>
(function(){
'use strict';

var canvas = document.getElementById('gameCanvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var registerEl = document.getElementById('register');
var cycleFill = document.getElementById('cycleFill');
var speedLabel = document.getElementById('speedLabel');
var healthLabel = document.getElementById('healthLabel');
var titleScreen = document.getElementById('titleScreen');
var gameoverScreen = document.getElementById('gameoverScreen');
var finalScore = document.getElementById('finalScore');
var finalBits = document.getElementById('finalBits');
var swipeHint = document.getElementById('swipeHint');
var btnStart = document.getElementById('btnStart');
var btnRestart = document.getElementById('btnRestart');

var STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2 };
var state = STATE.TITLE;
var W = 0, H = 0, laneCount = 4;
var lanes = [];
var pulse = { lane: 1, y: 0, x: 0, trail: [] };
var junctions = [];
var particles = [];
var registerBits = 0;
var score = 0;
var errors = 0;
var maxErrors = 3;
var clockSpeed = 1;
var baseSpeed = 140;
var gameTime = 0;
var cycleTimer = 0;
var cycleDuration = 2.8;
var traceWidth = 14;
var minTraceWidth = 5;
var lastSpeedDouble = 0;
var animId = 0;
var lastTs = 0;
var pendingSwipe = 0;
var flashLane = -1;
var flashTimer = 0;
var audioCtx = null;
var darkMode = true;

function initRegisterUI(){
  if (!registerEl) return;
  registerEl.innerHTML = '';
  for (var i = 7; i >= 0; i--) {
    var b = document.createElement('div');
    b.className = 'bit';
    b.dataset.bit = i;
    registerEl.appendChild(b);
  }
}

function updateRegisterUI(){
  if (!registerEl) return;
  var bits = registerEl.querySelectorAll('.bit');
  for (var i = 0; i < bits.length; i++) {
    var idx = 7 - i;
    bits[i].classList.toggle('on', (registerBits >> idx) & 1);
  }
}

function updateHUD(){
  if (speedLabel) speedLabel.textContent = 'CLK ' + clockSpeed.toFixed(1) + '×';
  if (healthLabel) healthLabel.textContent = 'ERR ' + errors + '/' + maxErrors;
  if (cycleFill) {
    var pct = Math.max(0, Math.min(1, cycleTimer / cycleDuration));
    cycleFill.style.transform = 'scaleX(' + pct + ')';
    cycleFill.style.background = pct < 0.25 ? 'var(--danger)' : 'var(--fg)';
  }
}

function getColors(){
  darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? false : true;
  if (darkMode) {
    return { bg:'#0a0c08', trace:'#2a3320', traceActive:'#4a5a30', glow:'#ffb000',
      pulse:'#ffcc44', danger:'#ff4400', hint:'#664400', junction:'#ffb000' };
  }
  return { bg:'#e8e4d4', trace:'#b8b0a0', traceActive:'#a09880', glow:'#c87800',
    pulse:'#a86000', danger:'#cc3300', hint:'#907040', junction:'#8a5a00' };
}

function resize(){
  if (!canvas) return;
  var rect = canvas.getBoundingClientRect();
  W = Math.floor(rect.width) || 360;
  H = Math.floor(rect.height) || 500;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  if (ctx) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  lanes = [];
  var margin = W * 0.12;
  var usable = W - margin * 2;
  for (var i = 0; i < laneCount; i++) {
    lanes.push(margin + (usable / (laneCount - 1)) * i);
  }
}

function ensureAudio(){
  if (audioCtx) return audioCtx;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch(e){}
  return audioCtx;
}

function beep(freq, dur, vol){
  var ac = ensureAudio();
  if (!ac) return;
  try {
    if (ac.state === 'suspended') ac.resume();
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.06;
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + dur);
  } catch(e){}
}

function vibrate(ms){
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}

function spawnJunction(y, forceFrom){
  var fromLane = typeof forceFrom === 'number' ? forceFrom : Math.floor(Math.random() * laneCount);
  var toLane = fromLane;
  while (toLane === fromLane) toLane = Math.floor(Math.random() * laneCount);
  junctions.push({
    y: y,
    fromLane: fromLane,
    toLane: toLane,
    goLeft: toLane < fromLane,
    resolved: false,
    flashTime: 0.8,
    hintAlpha: 1
  });
  flashLane = toLane;
  flashTimer = 0.65;
}

function scrollWorld(dy){
  pulse.y -= dy;
  for (var i = 0; i < junctions.length; i++) junctions[i].y -= dy;
  for (var t = 0; t < pulse.trail.length; t++) pulse.trail[t].y -= dy;
  for (var p = 0; p < particles.length; p++) particles[p].y -= dy;
}

function ensureJunctions(){
  var furthest = pulse.y + H * 0.85;
  for (var i = 0; i < junctions.length; i++) {
    if (junctions[i].y > furthest) furthest = junctions[i].y;
  }
  while (junctions.length < 5 && furthest < pulse.y + H * 1.1) {
    furthest += H * 0.22 + Math.random() * H * 0.08;
    spawnJunction(furthest, pulse.lane);
  }
  for (var j = junctions.length - 1; j >= 0; j--) {
    if (junctions[j].y < pulse.y - H * 0.3) junctions.splice(j, 1);
  }
}

function resetGame(){
  registerBits = 0;
  score = 0;
  errors = 0;
  clockSpeed = 1;
  gameTime = 0;
  cycleDuration = 2.8;
  cycleTimer = cycleDuration;
  traceWidth = 14;
  lastSpeedDouble = 0;
  pendingSwipe = 0;
  junctions = [];
  particles = [];
  pulse = { lane: Math.floor(laneCount / 2), y: H * 0.55, x: 0, trail: [] };
  junctions = [];
  spawnJunction(pulse.y + H * 0.18, pulse.lane);
  spawnJunction(pulse.y + H * 0.38);
  spawnJunction(pulse.y + H * 0.58);
  ensureJunctions();
  pulse.x = lanes[pulse.lane] || W / 2;
  updateRegisterUI();
  updateHUD();
  if (swipeHint) swipeHint.classList.add('show');
}

function startGame(){
  state = STATE.PLAYING;
  if (titleScreen) titleScreen.classList.add('hidden');
  if (gameoverScreen) gameoverScreen.classList.add('hidden');
  resetGame();
  ensureAudio();
  lastTs = performance.now();
  beep(440, 0.08, 0.05);
}

function endGame(){
  state = STATE.GAMEOVER;
  if (gameoverScreen) gameoverScreen.classList.remove('hidden');
  if (swipeHint) swipeHint.classList.remove('show');
  if (finalScore) finalScore.textContent = String(score);
  if (finalBits) {
    var s = registerBits.toString(2);
    while (s.length < 8) s = '0' + s;
    finalBits.textContent = s;
  }
  beep(110, 0.4, 0.08);
  vibrate(120);
}

function addBit(){
  registerBits = ((registerBits << 1) | 1) & 0xFF;
  score++;
  updateRegisterUI();
  beep(660 + score * 20, 0.06, 0.05);
  vibrate(15);
  for (var i = 0; i < 8; i++) {
    particles.push({
      x: pulse.x + (Math.random() - 0.5) * 30,
      y: pulse.y,
      vx: (Math.random() - 0.5) * 80,
      vy: -60 - Math.random() * 80,
      life: 0.5 + Math.random() * 0.3,
      maxLife: 0.8
    });
  }
}

function failCycle(){
  errors++;
  updateHUD();
  beep(150, 0.2, 0.1);
  vibrate(80);
  for (var i = 0; i < 12; i++) {
    particles.push({
      x: pulse.x + (Math.random() - 0.5) * 40,
      y: pulse.y,
      vx: (Math.random() - 0.5) * 120,
      vy: (Math.random() - 0.5) * 120,
      life: 0.4,
      maxLife: 0.4,
      danger: true
    });
  }
  if (errors >= maxErrors) endGame();
  else cycleTimer = cycleDuration;
}

function handleSwipe(dir){
  if (state !== STATE.PLAYING) return;
  pendingSwipe = dir;
  if (swipeHint) swipeHint.classList.remove('show');
}

function resolveJunction(j){
  if (j.resolved) return;
  j.resolved = true;
  var correct = (pendingSwipe === -1 && j.goLeft) || (pendingSwipe === 1 && !j.goLeft);
  if (pendingSwipe === 0) correct = false;
  pendingSwipe = 0;
  if (correct) {
    pulse.lane = j.toLane;
    addBit();
    cycleTimer = cycleDuration;
  } else {
    failCycle();
  }
}

function update(dt){
  if (state !== STATE.PLAYING) return;

  gameTime += dt;
  cycleTimer -= dt;
  if (flashTimer > 0) flashTimer -= dt;

  if (gameTime - lastSpeedDouble >= 10) {
    lastSpeedDouble += 10;
    clockSpeed *= 2;
    traceWidth = Math.max(minTraceWidth, traceWidth - 2);
    cycleDuration = Math.max(1.1, cycleDuration - 0.25);
    beep(880, 0.05, 0.04);
  }

  if (cycleTimer <= 0) {
    failCycle();
    if (state !== STATE.PLAYING) return;
  }

  var ramp = gameTime < 4 ? 0.55 : 1;
  var speed = baseSpeed * clockSpeed * ramp;
  pulse.y += speed * dt;
  var targetX = lanes[pulse.lane] || pulse.x;
  pulse.x += (targetX - pulse.x) * Math.min(1, dt * 14);
  pulse.trail.push({ x: pulse.x, y: pulse.y, life: 0.35 });
  if (pulse.trail.length > 24) pulse.trail.shift();

  if (pulse.y > H * 0.72) scrollWorld(pulse.y - H * 0.72);

  for (var i = 0; i < junctions.length; i++) {
    var j = junctions[i];
    j.flashTime -= dt;
    j.hintAlpha = Math.max(0, j.hintAlpha - dt * 0.35);
    if (!j.resolved && pulse.y >= j.y - 10 && pulse.y <= j.y + 10 && j.fromLane === pulse.lane) {
      resolveJunction(j);
    } else if (!j.resolved && pulse.y > j.y + 16 && j.fromLane === pulse.lane) {
      resolveJunction(j);
    }
  }
  ensureJunctions();

  for (var p = particles.length - 1; p >= 0; p--) {
    particles[p].life -= dt;
    particles[p].x += particles[p].vx * dt;
    particles[p].y += particles[p].vy * dt;
    particles[p].vy += 200 * dt;
    if (particles[p].life <= 0) particles.splice(p, 1);
  }

  for (var t = pulse.trail.length - 1; t >= 0; t--) {
    pulse.trail[t].life -= dt;
    if (pulse.trail[t].life <= 0) pulse.trail.splice(t, 1);
  }

  updateHUD();
}

function drawTrace(x1, y1, x2, y2, w, col, glow){
  if (!ctx) return;
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  if (glow) {
    ctx.shadowColor = glow;
    ctx.shadowBlur = 8;
  }
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function drawJunction(j, c){
  if (!ctx) return;
  var y = j.y;
  var xFrom = lanes[j.fromLane];
  var xTo = lanes[j.toLane];
  var w = traceWidth;
  var midY = y - 20;

  drawTrace(xFrom, y - 50, xFrom, midY, w, c.trace, null);
  drawTrace(xFrom, midY, xTo, y, w, j.resolved ? c.traceActive : c.trace, null);

  if (!j.resolved && j.flashTime > 0) {
    var alpha = 0.3 + 0.5 * Math.sin(j.flashTime * 12);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawTrace(xFrom, midY, xTo, y, w + 2, c.glow, c.glow);
    ctx.restore();
  }

  ctx.save();
  ctx.fillStyle = j.resolved ? c.glow : c.junction;
  ctx.beginPath();
  ctx.arc(xFrom, midY, w * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (!j.resolved && j.hintAlpha > 0 && j.fromLane === pulse.lane && j.y > pulse.y - 20 && j.y < pulse.y + H * 0.35) {
    ctx.save();
    ctx.globalAlpha = j.hintAlpha * 0.85;
    ctx.fillStyle = c.glow;
    ctx.font = 'bold 16px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(j.goLeft ? '◀' : '▶', xFrom, midY - 14);
    ctx.restore();
  }
}

function draw(){
  if (!ctx) return;
  var c = getColors();
  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, W, H);

  var gridAlpha = darkMode ? 0.04 : 0.06;
  ctx.strokeStyle = darkMode ? 'rgba(255,176,0,' + gridAlpha + ')' : 'rgba(100,70,0,' + gridAlpha + ')';
  ctx.lineWidth = 1;
  for (var gx = 0; gx < W; gx += 24) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  for (var gy = 0; gy < H; gy += 24) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }

  for (var li = 0; li < laneCount; li++) {
    var lx = lanes[li];
    var isTarget = flashTimer > 0 && flashLane === li;
    drawTrace(lx, 0, lx, H, isTarget ? traceWidth + 1 : traceWidth * 0.5,
      isTarget ? c.traceActive : c.trace, isTarget ? c.glow : null);
  }

  for (var ji = 0; ji < junctions.length; ji++) {
    drawJunction(junctions[ji], c);
  }

  for (var ti = 0; ti < pulse.trail.length; ti++) {
    var tr = pulse.trail[ti];
    var a = tr.life / 0.3;
    ctx.save();
    ctx.globalAlpha = a * 0.6;
    ctx.fillStyle = c.pulse;
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, traceWidth * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  var px = pulse.x;
  var py = pulse.y;
  ctx.save();
  ctx.shadowColor = c.glow;
  ctx.shadowBlur = 16;
  ctx.fillStyle = c.pulse;
  ctx.beginPath();
  ctx.arc(px, py, traceWidth * 0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = darkMode ? '#fff8dc' : '#fff';
  ctx.beginPath();
  ctx.arc(px, py, traceWidth * 0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  for (var pi = 0; pi < particles.length; pi++) {
    var pt = particles[pi];
    var pa = pt.life / pt.maxLife;
    ctx.save();
    ctx.globalAlpha = pa;
    ctx.fillStyle = pt.danger ? c.danger : c.glow;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    ctx.restore();
  }

  if (state === STATE.PLAYING && cycleTimer / cycleDuration < 0.2) {
    ctx.save();
    ctx.globalAlpha = 0.15 + 0.1 * Math.sin(gameTime * 20);
    ctx.fillStyle = c.danger;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

function loop(ts){
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  update(dt);
  draw();
  animId = requestAnimationFrame(loop);
}

var touchStartX = 0, touchStartY = 0;

function onTouchStart(e){
  if (e.cancelable) e.preventDefault();
  if (!e.touches || !e.touches[0]) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}

function onTouchEnd(e){
  if (e.cancelable) e.preventDefault();
  if (!e.changedTouches || !e.changedTouches[0]) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
    handleSwipe(dx < 0 ? -1 : 1);
  }
}

function onKeyDown(e){
  if (state !== STATE.PLAYING) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleSwipe(-1);
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleSwipe(1);
}

function bindEvents(){
  if (btnStart) btnStart.addEventListener('click', startGame);
  if (btnRestart) btnRestart.addEventListener('click', startGame);
  window.addEventListener('resize', resize);
  var swipeTarget = canvas || document.body;
  swipeTarget.addEventListener('touchstart', onTouchStart, { passive: false });
  swipeTarget.addEventListener('touchend', onTouchEnd, { passive: false });
  document.addEventListener('keydown', onKeyDown);
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) mq.addEventListener('change', function(){ draw(); });
    else if (mq.addListener) mq.addListener(function(){ draw(); });
  }
}

initRegisterUI();
updateRegisterUI();
resize();
bindEvents();
draw();
lastTs = performance.now();
animId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
