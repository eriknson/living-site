<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunrise Commit</title>
<style>
  :root {
    --bg: #050505;
    --text: #f0f0f0;
    --primary: #ff5500;
    --secondary: #00ffff;
    --bridge: #ff0033;
    --gold: #ffcc00;
    --error: #ff0000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #050505;
      --text: #f0f0f0;
      --primary: #ff5500;
      --secondary: #00ffff;
      --bridge: #ff0033;
      --gold: #ffcc00;
      --error: #ff0000;
    }
    .screen {
      background: rgba(5, 5, 5, 0.8);
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5f5;
      --text: #111;
      --primary: #ff6600;
      --secondary: #0066cc;
      --bridge: #cc0000;
      --gold: #e6b800;
      --error: #cc0000;
    }
  }
  body, html {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    background-color: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(5, 5, 5, 0.8);
    transition: opacity 0.3s;
  }
  @media (prefers-color-scheme: light) {
    .screen {
      background: rgba(245, 245, 245, 0.85);
    }
  }
  .hidden {
    opacity: 0;
    pointer-events: none !important;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-align: center;
    color: var(--primary);
    text-shadow: 0 0 15px var(--primary);
    margin-top: -10vh;
  }
  p {
    font-size: 1.1rem;
    margin-bottom: 3rem;
    text-align: center;
    max-width: 85%;
    line-height: 1.6;
    color: var(--text);
  }
  button {
    pointer-events: auto;
    background: var(--bg);
    color: var(--text);
    border: 2px solid var(--primary);
    padding: 18px 40px;
    font-size: 1.3rem;
    font-family: inherit;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(255, 85, 0, 0.4), inset 0 0 10px rgba(255, 85, 0, 0.2);
    transition: all 0.1s;
  }
  button:active {
    background: var(--primary);
    color: var(--bg);
    transform: scale(0.95);
  }
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: bold;
    pointer-events: none;
    z-index: 5;
  }
  .hud-val {
    color: var(--gold);
    text-shadow: 0 0 8px var(--gold);
  }
  #combo {
    font-size: 1.4rem;
    transition: all 0.2s;
  }
  #lives {
    color: var(--error);
    text-shadow: 0 0 8px var(--error);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="hud" class="hidden">
    <div>SCORE <span id="scoreVal" class="hud-val">0</span></div>
    <div id="combo">COMBO <span id="comboVal" class="hud-val">x1</span></div>
    <div id="lives">♥♥♥</div>
  </div>

  <div id="ui-layer">
    <div id="startScreen" class="screen">
      <h1>Sunrise Commit</h1>
      <p>Tap on the beat to stack surgical commits.<br>Don't let the timeline break before sunrise.</p>
      <button data-smoke="start" id="startBtn">Initialize</button>
    </div>
    
    <div id="gameOverScreen" class="screen hidden">
      <h1>Build Failed</h1>
      <p>Final Score: <span id="finalScore" class="hud-val">0</span></p>
      <button data-smoke="restart" id="restartBtn">Rebuild</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const hud = document.getElementById('hud');
const scoreVal = document.getElementById('scoreVal');
const comboVal = document.getElementById('comboVal');
const livesVal = document.getElementById('lives');
const finalScore = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// Audio Context
let audioCtx = null;
let nextBeatTime = 0;
let bpm = 100;
let beatInterval = 60 / bpm;
let isPlaying = false;

// Game State
let score = 0;
let combo = 1;
let lives = 3;
let blocks = [];
let stack = [];
let particles = [];
let lastTime = 0;
let sunriseProgress = 0; 
let totalBeats = 0;
let flashAlpha = 0;
let animationFrameId = null;

// Theme colors
let colors = {
    bg: '#050505',
    primary: '#ff5500',
    secondary: '#00ffff',
    bridge: '#ff0033',
    gold: '#ffcc00',
    error: '#ff0000',
    text: '#f0f0f0'
};

function updateColors() {
    const root = getComputedStyle(document.documentElement);
    colors.bg = root.getPropertyValue('--bg').trim();
    colors.primary = root.getPropertyValue('--primary').trim();
    colors.secondary = root.getPropertyValue('--secondary').trim();
    colors.bridge = root.getPropertyValue('--bridge').trim();
    colors.gold = root.getPropertyValue('--gold').trim();
    colors.error = root.getPropertyValue('--error').trim();
    colors.text = root.getPropertyValue('--text').trim();
    if (!isPlaying) draw(0); // Redraw if theme changes while idle
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateColors);
updateColors();

function initAudio() {
    if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            try {
                audioCtx = new AudioContext();
            } catch (e) {
                console.warn("AudioContext not supported");
            }
        }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
}

function playKick(time) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
        
        gain.gain.setValueAtTime(0.6, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
        
        osc.start(time);
        osc.stop(time + 0.5);
    } catch (e) {}
}

function playHit(perfect) {
    if (!audioCtx) return;
    try {
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = perfect ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(perfect ? 880 : 440, t);
        if (perfect) {
            osc.frequency.setValueAtTime(880, t);
            osc.frequency.exponentialRampToValueAtTime(1760, t + 0.1);
        }
        
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        
        osc.start(t);
        osc.stop(t + 0.2);
    } catch (e) {}
}

function playMiss() {
    if (!audioCtx) return;
    try {
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, t);
        osc.frequency.exponentialRampToValueAtTime(55, t + 0.3);
        
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        
        osc.start(t);
        osc.stop(t + 0.3);
    } catch (e) {}
}

function startGame() {
    initAudio();
    isPlaying = true;
    score = 0;
    combo = 1;
    lives = 3;
    bpm = 100;
    beatInterval = 60 / bpm;
    blocks = [];
    stack = [];
    particles = [];
    sunriseProgress = 0;
    totalBeats = 0;
    flashAlpha = 0;
    
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    
    updateHUD();
    
    if (audioCtx) {
        nextBeatTime = audioCtx.currentTime + 1;
    } else {
        nextBeatTime = performance.now() / 1000 + 1;
    }
    
    lastTime = performance.now();
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    animationFrameId = requestAnimationFrame(loop);
}

function gameOver() {
    isPlaying = false;
    hud.classList.add('hidden');
    gameOverScreen.classList.remove('hidden');
    finalScore.innerText = score;
    if (navigator.vibrate) {
        try { navigator.vibrate([200, 100, 200]); } catch(e){}
    }
}

function updateHUD() {
    scoreVal.innerText = score;
    comboVal.innerText = 'x' + combo;
    livesVal.innerText = '♥'.repeat(Math.max(0, lives));
    
    if (combo >= 10) {
        comboVal.style.color = colors.gold;
        comboVal.style.textShadow = `0 0 15px ${colors.gold}`;
        comboVal.style.transform = 'scale(1.2)';
    } else if (combo >= 5) {
        comboVal.style.color = colors.primary;
        comboVal.style.textShadow = `0 0 10px ${colors.primary}`;
        comboVal.style.transform = 'scale(1.1)';
    } else {
        comboVal.style.color = colors.secondary;
        comboVal.style.textShadow = `0 0 5px ${colors.secondary}`;
        comboVal.style.transform = 'scale(1)';
    }
}

function handleInput(e) {
    if (!isPlaying) return;
    if (e.type === 'touchstart') e.preventDefault();
    
    let targetBlock = null;
    for (let i = 0; i < blocks.length; i++) {
        if (!blocks[i].hit && !blocks[i].missed) {
            targetBlock = blocks[i];
            break;
        }
    }
    
    if (targetBlock) {
        const now = audioCtx ? audioCtx.currentTime : performance.now() / 1000;
        const timeDiff = targetBlock.targetTime - now;
        const absDiff = Math.abs(timeDiff);
        
        // Timing windows
        if (absDiff <= 0.12) {
            // Perfect
            targetBlock.hit = true;
            score += 100 * combo;
            combo++;
            playHit(true);
            createParticles(targetBlock.y, colors.gold);
            pushToStack(targetBlock, colors.gold);
            flashAlpha = 0.15;
            if (navigator.vibrate) { try { navigator.vibrate(20); } catch(e){} }
        } else if (absDiff <= 0.25) {
            // Good
            targetBlock.hit = true;
            score += 50 * combo;
            playHit(false);
            createParticles(targetBlock.y, colors.secondary);
            pushToStack(targetBlock, colors.secondary);
            if (navigator.vibrate) { try { navigator.vibrate(10); } catch(e){} }
        } else if (absDiff <= 0.4) {
            // Miss
            targetBlock.missed = true;
            combo = 1;
            lives--;
            playMiss();
            createParticles(targetBlock.y, colors.error);
            flashAlpha = 0.3;
            if (navigator.vibrate) { try { navigator.vibrate(50); } catch(e){} }
            if (lives <= 0) gameOver();
        }
        updateHUD();
    }
}

window.addEventListener('touchstart', handleInput, {passive: false});
window.addEventListener('mousedown', handleInput);
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && isPlaying) {
        e.preventDefault();
        handleInput(e);
    }
});

startBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
});
restartBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
});

function pushToStack(block, color) {
    stack.unshift({
        text: block.text,
        hash: block.hash,
        color: color,
        offset: 0
    });
    if (stack.length > 8) stack.pop();
    
    for (let i = 0; i < stack.length; i++) {
        stack[i].targetOffset = i * 45;
    }
}

function createParticles(y, color) {
    for (let i = 0; i < 20; i++) {
        particles.push({
            x: width / 2 + (Math.random() - 0.5) * 160,
            y: y + (Math.random() - 0.5) * 40,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12 - 2,
            life: 1 + Math.random() * 0.5,
            color: color
        });
    }
}

const commitTypes = ['feat', 'fix', 'chore', 'refactor', 'docs', 'style', 'test', 'perf'];

function loop(timestamp) {
    if (!isPlaying) return;
    
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
    lastTime = timestamp;
    
    const now = audioCtx ? audioCtx.currentTime : timestamp / 1000;
    
    if (now >= nextBeatTime - 0.1) {
        playKick(nextBeatTime);
        
        const targetTime = nextBeatTime + beatInterval * 2;
        blocks.push({
            spawnTime: nextBeatTime,
            targetTime: targetTime,
            text: commitTypes[Math.floor(Math.random() * commitTypes.length)],
            hash: Math.random().toString(16).substring(2, 6),
            hit: false,
            missed: false,
            y: -50
        });
        
        nextBeatTime += beatInterval;
        totalBeats++;
        
        if (totalBeats % 10 === 0) {
            bpm += 3;
            beatInterval = 60 / bpm;
        }
        
        sunriseProgress = Math.min(1, totalBeats / 120); 
    }
    
    update(now, dt);
    draw(now);
    
    animationFrameId = requestAnimationFrame(loop);
}

function update(now, dt) {
    const targetY = height * 0.75;
    
    for (let i = blocks.length - 1; i >= 0; i--) {
        let b = blocks[i];
        const timeAlive = now - b.spawnTime;
        const totalTravelTime = b.targetTime - b.spawnTime;
        
        if (timeAlive >= 0) {
            b.y = (timeAlive / totalTravelTime) * targetY;
        }
        
        if (!b.hit && !b.missed && now > b.targetTime + 0.25) {
            b.missed = true;
            combo = 1;
            lives--;
            playMiss();
            createParticles(b.y, colors.error);
            flashAlpha = 0.3;
            if (navigator.vibrate) { try { navigator.vibrate(50); } catch(e){} }
            updateHUD();
            if (lives <= 0) gameOver();
        }
        
        if (b.hit || b.missed) {
            blocks.splice(i, 1);
        }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    for (let i = 0; i < stack.length; i++) {
        if (stack[i].offset === undefined) stack[i].offset = stack[i].targetOffset;
        stack[i].offset += (stack[i].targetOffset - stack[i].offset) * 15 * dt;
    }
    
    if (flashAlpha > 0) {
        flashAlpha -= dt;
        if (flashAlpha < 0) flashAlpha = 0;
    }
}

function draw(now) {
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, width, height);
    
    // Sunrise
    const sunRadius = Math.min(width, height) * 0.35;
    const sunCenterX = width / 2;
    const sunCenterY = height * 0.75;
    const currentSunY = sunCenterY + sunRadius * (1 - sunriseProgress);
    
    ctx.save();
    ctx.beginPath();
    ctx.arc(sunCenterX, currentSunY, sunRadius, Math.PI, 0);
    ctx.clip();
    
    ctx.strokeStyle = colors.primary;
    ctx.lineWidth = 2;
    for (let y = currentSunY - sunRadius; y < currentSunY; y += 12) {
        ctx.beginPath();
        ctx.moveTo(sunCenterX - sunRadius, y);
        ctx.lineTo(sunCenterX + sunRadius, y);
        ctx.stroke();
    }
    ctx.restore();
    
    // Bridge
    ctx.strokeStyle = colors.bridge;
    ctx.lineWidth = 2;
    const bridgeY = height * 0.65;
    
    // Left Tower
    ctx.beginPath();
    ctx.moveTo(width * 0.2, bridgeY + 50);
    ctx.lineTo(width * 0.2, bridgeY - 120);
    ctx.lineTo(width * 0.2 + 20, bridgeY - 120);
    ctx.lineTo(width * 0.2 + 20, bridgeY + 50);
    ctx.moveTo(width * 0.2, bridgeY - 80);
    ctx.lineTo(width * 0.2 + 20, bridgeY - 80);
    ctx.moveTo(width * 0.2, bridgeY - 40);
    ctx.lineTo(width * 0.2 + 20, bridgeY - 40);
    ctx.stroke();

    // Right Tower
    ctx.beginPath();
    ctx.moveTo(width * 0.8 - 20, bridgeY + 50);
    ctx.lineTo(width * 0.8 - 20, bridgeY - 120);
    ctx.lineTo(width * 0.8, bridgeY - 120);
    ctx.lineTo(width * 0.8, bridgeY + 50);
    ctx.moveTo(width * 0.8 - 20, bridgeY - 80);
    ctx.lineTo(width * 0.8, bridgeY - 80);
    ctx.moveTo(width * 0.8 - 20, bridgeY - 40);
    ctx.lineTo(width * 0.8, bridgeY - 40);
    ctx.stroke();
    
    // Main Cable
    ctx.beginPath();
    ctx.moveTo(0, bridgeY - 40);
    ctx.quadraticCurveTo(width * 0.1, bridgeY + 10, width * 0.2 + 10, bridgeY - 120);
    ctx.quadraticCurveTo(width * 0.5, bridgeY + 80, width * 0.8 - 10, bridgeY - 120);
    ctx.quadraticCurveTo(width * 0.9, bridgeY + 10, width, bridgeY - 40);
    ctx.stroke();
    
    // Suspenders
    ctx.beginPath();
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.4;
    for (let x = 15; x < width; x += 15) {
        if (x > width * 0.2 && x < width * 0.2 + 20) continue;
        if (x > width * 0.8 - 20 && x < width * 0.8) continue;
        
        let h, k, a;
        if (x < width * 0.2 + 10) {
            h = 0; k = bridgeY - 40;
            a = (bridgeY - 120 - k) / Math.pow(width * 0.2 + 10 - h, 2);
        } else if (x < width * 0.8 - 10) {
            h = width * 0.5; k = bridgeY + 30; 
            a = (bridgeY - 120 - k) / Math.pow(width * 0.2 + 10 - h, 2);
        } else {
            h = width; k = bridgeY - 40;
            a = (bridgeY - 120 - k) / Math.pow(width * 0.8 - 10 - h, 2);
        }
        let cableY = a * Math.pow(x - h, 2) + k;
        if (cableY < bridgeY) {
            ctx.moveTo(x, cableY);
            ctx.lineTo(x, bridgeY);
        }
    }
    ctx.stroke();
    ctx.globalAlpha = 1.0;
    
    // Deck
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, bridgeY);
    ctx.lineTo(width, bridgeY);
    ctx.stroke();
    
    // Water
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, bridgeY + 2, width, height - bridgeY);
    
    ctx.strokeStyle = colors.secondary;
    ctx.lineWidth = 1;
    const time = now || 0;
    for (let i = 0; i < 6; i++) {
        const yOffset = ((time * 0.4 + i * 0.16) % 1) * (height - bridgeY);
        const y = bridgeY + 2 + yOffset;
        const alpha = 1 - (yOffset / (height - bridgeY));
        ctx.globalAlpha = alpha * 0.6;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
    }
    ctx.globalAlpha = 1.0;

    // Flash Effect
    if (flashAlpha > 0) {
        ctx.fillStyle = colors.gold;
        ctx.globalAlpha = flashAlpha;
        ctx.fillRect(0, 0, width, height);
        ctx.globalAlpha = 1.0;
    }
    
    // Timeline
    const targetY = height * 0.75;
    ctx.strokeStyle = colors.secondary;
    ctx.globalAlpha = 0.2;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(width / 2, 0);
    ctx.lineTo(width / 2, height);
    ctx.stroke();
    ctx.globalAlpha = 1.0;
    
    // Target Zone
    const bw = 180;
    const bh = 40;
    const beatPhase = (now && isPlaying) ? (now % beatInterval) / beatInterval : 0;
    const pulse = isPlaying ? 1 + Math.sin(beatPhase * Math.PI) * 0.05 : 1;
    
    ctx.save();
    ctx.translate(width / 2, targetY);
    ctx.scale(pulse, pulse);
    
    ctx.strokeStyle = colors.text;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.strokeRect(-bw / 2 - 6, -bh / 2 - 6, bw + 12, bh + 12);
    ctx.setLineDash([]);
    ctx.restore();
    
    // Stack
    for (let i = 0; i < stack.length; i++) {
        const s = stack[i];
        const sy = targetY + 30 + s.offset;
        const bx = width / 2 - bw / 2;
        const by = sy - bh / 2;
        
        ctx.fillStyle = colors.bg;
        ctx.fillRect(bx, by, bw, bh);
        
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bw, bh);
        
        ctx.fillStyle = s.color;
        ctx.fillRect(bx, by, 45, bh);
        
        ctx.fillStyle = colors.bg;
        ctx.font = 'bold 14px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(s.hash, bx + 22.5, sy);
        
        ctx.fillStyle = s.color;
        ctx.font = '16px ui-monospace, monospace';
        ctx.textAlign = 'left';
        ctx.fillText(s.text, bx + 55, sy);
    }
    
    // Blocks
    for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        if (b.y > -bh) {
            const bx = width / 2 - bw / 2;
            const by = b.y - bh / 2;
            
            ctx.fillStyle = colors.bg;
            ctx.fillRect(bx, by, bw, bh);
            
            ctx.strokeStyle = colors.secondary;
            ctx.lineWidth = 2;
            ctx.strokeRect(bx, by, bw, bh);
            
            ctx.fillStyle = colors.secondary;
            ctx.fillRect(bx, by, 45, bh);
            
            ctx.fillStyle = colors.bg;
            ctx.font = 'bold 14px ui-monospace, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.hash, bx + 22.5, b.y);
            
            ctx.fillStyle = colors.text;
            ctx.font = '16px ui-monospace, monospace';
            ctx.textAlign = 'left';
            ctx.fillText(b.text, bx + 55, b.y);
        }
    }
    
    // Particles
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
    }
    ctx.globalAlpha = 1.0;
    
    // Sunrise Progress Bar
    if (isPlaying) {
        const barWidth = width * 0.8;
        const barHeight = 4;
        const barX = width * 0.1;
        const barY = 60;
        
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(barX, barY, barWidth, barHeight);
        
        ctx.fillStyle = colors.primary;
        ctx.fillRect(barX, barY, barWidth * sunriseProgress, barHeight);
    }
}

// Initial render
draw(0);
</script>
</body>
</html>
