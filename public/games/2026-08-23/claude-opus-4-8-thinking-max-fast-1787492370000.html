<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>FOGLINE — thread the buoys</title>
<style>
  :root{
    --bg:#c3d0d6; --ink:#1d2c33; --muted:#4a5b63; --card:rgba(244,248,249,.72);
    --edge:rgba(29,44,51,.16); --btn:#16323d; --btnink:#f2f7f7; --accent:#1f9d68;
    --shadow:0 10px 30px rgba(20,40,50,.22);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1a22; --ink:#e4eef1; --muted:#9fb3bd; --card:rgba(16,30,38,.62);
      --edge:rgba(220,235,240,.16); --btn:#e7efee; --btnink:#0f2129; --accent:#39c98c;
      --shadow:0 14px 40px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;}
  body{position:fixed;inset:0;width:100dvw;height:100dvh;overflow:hidden;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
  #stage{position:absolute;inset:0;width:100dvw;height:100dvh;}
  canvas#game{position:absolute;inset:0;width:100dvw;height:100dvh;display:block;
    touch-action:none;user-select:none;}

  /* HUD */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 14px;}
  .hudrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .chip{background:var(--card);border:1px solid var(--edge);border-radius:12px;
    padding:7px 11px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    box-shadow:var(--shadow);line-height:1;}
  .lbl{font-size:9px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
  #score{font-size:22px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;}
  #right{text-align:right;}
  #hull{display:flex;gap:6px;justify-content:flex-end;margin-top:2px;}
  .pip{width:12px;height:12px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 2px var(--edge) inset;transition:transform .18s, opacity .18s, background .2s;}
  .pip.dead{background:transparent;opacity:.4;transform:scale(.7);}
  #knots{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums;}

  /* Overlays */
  .overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:24px;pointer-events:none;text-align:center;}
  .overlay.hide{display:none;}
  .panel{pointer-events:none;max-width:440px;width:100%;}
  .kicker{font-size:11px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;}
  h1{margin:0;font-size:clamp(44px,15vw,86px);letter-spacing:.02em;line-height:.92;font-weight:800;}
  .rule{width:64px;height:2px;background:var(--ink);opacity:.5;margin:18px auto;}
  .sub{font-size:14px;line-height:1.55;color:var(--muted);max-width:330px;margin:0 auto 22px;}
  .sub b{color:var(--ink);font-weight:700;}
  .btn{pointer-events:auto;cursor:pointer;font:inherit;font-size:16px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--btnink);background:var(--btn);
    border:none;border-radius:14px;padding:16px 30px;min-height:54px;min-width:200px;
    box-shadow:var(--shadow);transition:transform .12s ease, filter .12s ease;
    touch-action:manipulation;}
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(2px) scale(.985);}
  .hint{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-top:20px;text-transform:uppercase;}
  #over .panel{background:var(--card);border:1px solid var(--edge);border-radius:22px;
    padding:26px 22px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);box-shadow:var(--shadow);}
  .statgrid{display:flex;gap:14px;justify-content:center;margin:6px 0 20px;flex-wrap:wrap;}
  .stat .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:4px;}
  #gotitle{font-size:13px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  #verdict{font-size:22px;font-weight:800;margin-bottom:16px;letter-spacing:.02em;}
  @media (max-height:560px){ h1{font-size:clamp(34px,11vh,60px);} .sub{margin-bottom:14px;} .rule{margin:12px auto;} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud" aria-hidden="true">
    <div class="hudrow">
      <div class="chip">
        <div class="lbl">Score</div>
        <div id="score">0</div>
        <div id="knots">0.0 kn</div>
      </div>
      <div class="chip" id="right">
        <div class="lbl">Hull</div>
        <div id="hull"></div>
      </div>
    </div>
  </div>

  <div id="title" class="overlay">
    <div class="panel">
      <div class="kicker">San Francisco Bay · fog holding</div>
      <h1>FOGLINE</h1>
      <div class="rule"></div>
      <p class="sub">Sail the dinghy through the fog. <b>Swipe or tap left / right</b> to tack and thread the gap between the buoys. The mist keeps closing in.</p>
      <button class="btn" data-smoke="start" id="startBtn" aria-label="Cast off and start sailing">Cast off</button>
      <div class="hint">swipe · tap sides · ← → keys</div>
    </div>
  </div>

  <div id="over" class="overlay hide">
    <div class="panel">
      <div id="gotitle">Run aground</div>
      <div id="verdict">Fog wins this time</div>
      <div class="statgrid">
        <div class="stat"><div class="n" id="fScore">0</div><div class="l">Score</div></div>
        <div class="stat"><div class="n" id="fDist">0</div><div class="l">Meters</div></div>
        <div class="stat"><div class="n" id="fBest">0</div><div class="l">Best</div></div>
      </div>
      <button class="btn" data-smoke="restart" id="restartBtn" aria-label="Sail again">Sail again</button>
      <div class="hint">or press space</div>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
  // ---------- tiny utils ----------
  var clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
  var lerp=function(a,b,t){return a+(b-a)*t;};
  var smooth=function(t){t=clamp(t,0,1);return t*t*(3-2*t);};
  var easeIO=function(t){t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
  var rand=function(a,b){return a+Math.random()*(b-a);};
  var randi=function(a,b){return Math.floor(rand(a,b+1));};
  var pick=function(a){return a[(Math.random()*a.length)|0];};
  var now=function(){return (typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();};

  // ---------- palette (mirrors CSS, used for canvas) ----------
  function makePalette(dark){
    return dark ? {
      dark:true,
      skyTop:"#0a141b", skyBot:"#0f2530",
      waterTop:"#12303b", waterMid:"#0e2833", waterBot:"#081820",
      highlight:"rgba(150,205,215,0.10)",
      fog:"238,246,247", fogAlpha:0.92,
      foam:"#e9f3f4",
      rock:"#243139", rockLip:"#33454d",
      green:"#39c98c", greenDk:"#1c6f52",
      red:"#f0675c", redDk:"#8c352f",
      hull:"#eee7d4", hullDk:"#b9a67f", sail:"#f6f2e7", mast:"#5c5240",
      gold:"#f4c774", channel:"rgba(180,225,230,0.10)",
      bridge:"170,74,50", light:"#ffe6a8"
    } : {
      dark:false,
      skyTop:"#d3dde1", skyBot:"#b4c6cd",
      waterTop:"#a9bcc4", waterMid:"#92a8b1", waterBot:"#7a929c",
      highlight:"rgba(255,255,255,0.28)",
      fog:"248,251,251", fogAlpha:0.9,
      foam:"#ffffff",
      rock:"#5c6f77", rockLip:"#e9f2f3",
      green:"#178a5c", greenDk:"#0c5738",
      red:"#d24a44", redDk:"#8f2b27",
      hull:"#33424b", hullDk:"#20313a", sail:"#fbfdfd", mast:"#4a3f2f",
      gold:"#c98a2e", channel:"rgba(255,255,255,0.20)",
      bridge:"150,60,42", light:"#ffcf7a"
    };
  }
  var prefDark = false;
  try{ prefDark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }catch(e){}
  var PAL = makePalette(prefDark);
  try{
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onmq=function(e){ PAL = makePalette(e.matches); };
    if(mq.addEventListener) mq.addEventListener("change",onmq);
    else if(mq.addListener) mq.addListener(onmq);
  }catch(e){}

  // ---------- canvas ----------
  var canvas=document.getElementById("game");
  var ctx=canvas.getContext("2d");
  var W=0,H=0,DPR=1, boatY=0, chX=0, chW=0;
  function layout(){
    W=canvas.clientWidth||window.innerWidth||360;
    H=canvas.clientHeight||window.innerHeight||640;
    DPR=Math.min(window.devicePixelRatio||1,2);
    var longest=Math.max(W,H)*DPR;           // keep backing store fast on big/software canvases
    if(longest>1700) DPR*=1700/longest;
    if(DPR<1) DPR=1;
    canvas.width=Math.max(1,Math.round(W*DPR));
    canvas.height=Math.max(1,Math.round(H*DPR));
    if(ctx.setTransform) ctx.setTransform(DPR,0,0,DPR,0,0);
    boatY=H*0.765;
    chW=Math.min(W*0.86, 560);
    chX=(W-chW)/2;
  }
  window.addEventListener("resize",layout);
  window.addEventListener("orientationchange",function(){ setTimeout(layout,120); });
  layout();

  var boatW=function(){return clamp(chW*0.115,26,54);};
  var buoyR=function(){return clamp(chW*0.036,10,20);};
  var nxToX=function(nx){return chX+nx*chW;};

  // ---------- audio (lazy, guarded) ----------
  var AC=null, master=null, audioOn=true;
  function initAudio(){
    if(AC) return;
    try{
      var C=window.AudioContext||window.webkitAudioContext;
      if(!C) return;
      AC=new C();
      master=AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);
    }catch(e){ AC=null; }
  }
  function tone(freq,dur,type,vol,slideTo,delay){
    if(!AC||!audioOn) return;
    try{
      var t=AC.currentTime+(delay||0);
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  }
  function noiseBurst(dur,vol,lp){
    if(!AC||!audioOn) return;
    try{
      var n=Math.floor(AC.sampleRate*dur);
      var buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
      var src=AC.createBufferSource(); src.buffer=buf;
      var f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=lp||900;
      var g=AC.createGain(); g.gain.value=vol||0.2;
      src.connect(f); f.connect(g); g.connect(master); src.start();
    }catch(e){}
  }
  function sBell(combo){ var base=560+Math.min(combo,14)*34; tone(base,0.5,"triangle",0.16); tone(base*1.5,0.4,"sine",0.06,null,0.02); }
  function sPerfect(){ tone(720,0.5,"triangle",0.16); tone(1080,0.45,"sine",0.10,null,0.05); tone(1440,0.4,"sine",0.05,null,0.1); }
  function sTack(){ noiseBurst(0.14,0.10,1600); tone(240,0.1,"sine",0.05); }
  function sCrash(){ noiseBurst(0.4,0.32,500); tone(90,0.5,"sawtooth",0.14,50); }
  function sHorn(){ tone(118,1.4,"sine",0.20,104); tone(150,1.4,"sine",0.10,132); }
  function sLift(){ tone(392,0.6,"sine",0.10,784); tone(587,0.7,"sine",0.07,null,0.08); }
  function sClick(){ tone(360,0.08,"square",0.06,520); }
  function vibe(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  // ---------- game state ----------
  var S={};
  function resetState(mode){
    S={
      mode:mode||"title",     // title | play | over
      t:0, clock:0,
      dist:0, score:0,
      hull:3, maxHull:3,
      combo:0, bestCombo:0,
      invuln:0,
      // boat
      lane:2, boatNx:0.5, boatVis:0.5, heel:0, luff:0, bob:0,
      // wind
      wind:0, windTarget:0, gust:0, gustTimer:rand(2,4), gustDir:1,
      hornTimer:rand(7,13),
      // spawning (pre-seed so the first buoys arrive promptly)
      spawnAcc:300, gates:[], particles:[], floats:[],
      // fx
      shake:0, hitStop:0, flash:0, flashCol:"255,90,80",
      clarity:0, clarityGlow:0,
      lastLiftCombo:0,
      // camera scroll for water texture
      scroll:0,
      fogHorizon: H*0.32
    };
    S.laneCount=5;
  }
  resetState("title");
  var bestScore=0; // session-only, not persisted

  // difficulty [0..1+]
  function diff(){ return clamp(S.dist/620, 0, 1); }
  function speedNow(){
    var d=diff();
    var base=lerp(196,432,d) + Math.max(0,S.dist-620)*0.05;
    if(S.clarity>0) base*=0.84;
    return base;
  }
  function gapHalfNow(){ return lerp(0.24,0.135,diff()); }
  function reactionNow(){ return lerp(1.7,0.66,diff()); }
  function spacingNow(){ return lerp(352,300,diff()); }
  function windAmpNow(){ return lerp(0.0,0.055,diff()); }

  var LANEX=function(i){ return i/(S.laneCount-1); };

  // ---------- spawning gates ----------
  function spawnGate(harmless){
    var d=diff();
    var lc=S.laneCount;
    var center=randi(0,lc-1);
    // avoid center-lane too often at very start so idle boats still meet danger
    if(S.gates.length===0 && S.mode==="play"){ center=2; }
    var startCenter=center;
    var willDrift = (!harmless) && Math.random() < lerp(0.0,0.62,d);
    if(willDrift){
      var dir = center<=0?1:(center>=lc-1?-1:(Math.random()<0.5?-1:1));
      startCenter = clamp(center - dir, 0, lc-1);
    }
    S.gates.push({
      y:-70,
      spawnY:-70,
      cFrom:LANEX(startCenter),
      cTo:LANEX(center),
      half:gapHalfNow(),
      curC:LANEX(startCenter),
      curHalf:gapHalfNow(),
      bob:rand(0,6.28),
      done:false, harmless:!!harmless, res:""
    });
  }

  // ---------- particles ----------
  function addP(x,y,vx,vy,life,size,col,type){
    if(S.particles.length>260) S.particles.shift();
    S.particles.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,size:size,col:col,type:type||"foam",rot:rand(0,6.28)});
  }
  function burstSpray(x,y,dir,n,col){
    for(var i=0;i<n;i++){
      addP(x,y, dir*rand(20,120)+rand(-30,30), rand(-140,-30), rand(0.3,0.7), rand(1.5,3.6), col||PAL.foam, "spray");
    }
  }
  function burstSplash(x,y){
    for(var i=0;i<20;i++){
      var a=rand(0,Math.PI*2), sp=rand(40,260);
      addP(x,y, Math.cos(a)*sp, Math.sin(a)*sp-60, rand(0.35,0.8), rand(2,5), PAL.foam, "spray");
    }
  }
  function burstSpark(x,y,col){
    for(var i=0;i<14;i++){
      var a=rand(0,Math.PI*2), sp=rand(30,170);
      addP(x,y, Math.cos(a)*sp, Math.sin(a)*sp, rand(0.4,0.9), rand(1.5,3.2), col||PAL.gold, "spark");
    }
  }
  function addFloat(x,y,text,col,big){
    S.floats.push({x:x,y:y,text:text,col:col||PAL.foam,life:1.1,max:1.1,big:!!big});
  }

  // ---------- input ----------
  function tack(dir){
    if(S.mode!=="play") return;
    var nl=clamp(S.lane+dir,0,S.laneCount-1);
    if(nl!==S.lane){
      S.lane=nl; S.luff=1; S.heel += dir*0.5;
      var bx=nxToX(S.boatVis);
      burstSpray(bx - dir*boatW()*0.3, boatY+boatW()*0.28, -dir, 7, PAL.foam);
      sTack(); vibe(8);
    }
  }
  // pointer/swipe
  var ptr={active:false,id:null,x0:0,y0:0,t0:0,moved:false};
  var SWIPE=24;
  function onDown(e){
    initAudio();
    var p=point(e);
    ptr.active=true; ptr.id=(e.pointerId!=null?e.pointerId:0);
    ptr.x0=p.x; ptr.y0=p.y; ptr.t0=now(); ptr.moved=false;
    if(e.cancelable) e.preventDefault();
  }
  function onMove(e){
    if(!ptr.active) return;
    var p=point(e), dx=p.x-ptr.x0, dy=p.y-ptr.y0;
    if(!ptr.moved && Math.abs(dx)>SWIPE && Math.abs(dx)>Math.abs(dy)*0.7){
      tack(dx>0?1:-1); ptr.moved=true;
    }
    if(e.cancelable) e.preventDefault();
  }
  function onUp(e){
    if(!ptr.active) return;
    ptr.active=false;
    var p=point(e), dx=p.x-ptr.x0, dy=p.y-ptr.y0, dt=now()-ptr.t0;
    if(!ptr.moved && Math.abs(dx)<12 && Math.abs(dy)<16 && dt<420){
      // tap: side zones
      if(p.x < W*0.4) tack(-1);
      else if(p.x > W*0.6) tack(1);
    }
    if(e.cancelable) e.preventDefault();
  }
  function point(e){
    var r=canvas.getBoundingClientRect();
    var cx = (e.clientX!=null)?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:0);
    var cy = (e.clientY!=null)?e.clientY:(e.touches&&e.touches[0]?e.touches[0].clientY:0);
    return {x:cx-r.left, y:cy-r.top};
  }
  if(window.PointerEvent){
    canvas.addEventListener("pointerdown",onDown,{passive:false});
    canvas.addEventListener("pointermove",onMove,{passive:false});
    window.addEventListener("pointerup",onUp,{passive:false});
    window.addEventListener("pointercancel",function(){ptr.active=false;});
  }else{
    canvas.addEventListener("touchstart",onDown,{passive:false});
    canvas.addEventListener("touchmove",onMove,{passive:false});
    window.addEventListener("touchend",onUp,{passive:false});
    canvas.addEventListener("mousedown",onDown,{passive:false});
    window.addEventListener("mousemove",onMove,{passive:false});
    window.addEventListener("mouseup",onUp,{passive:false});
  }
  // keyboard
  window.addEventListener("keydown",function(e){
    var k=e.key;
    if(k==="ArrowLeft"||k==="a"||k==="A"){ if(!e.repeat) tack(-1); e.preventDefault(); }
    else if(k==="ArrowRight"||k==="d"||k==="D"){ if(!e.repeat) tack(1); e.preventDefault(); }
    else if(k===" "||k==="Enter"){
      if(S.mode==="title"){ startGame(); e.preventDefault(); }
      else if(S.mode==="over"){ startGame(); e.preventDefault(); }
    }
  });

  // ---------- flow ----------
  var elTitle=document.getElementById("title");
  var elOver=document.getElementById("over");
  var elScore=document.getElementById("score");
  var elKnots=document.getElementById("knots");
  var elHull=document.getElementById("hull");
  var elFScore=document.getElementById("fScore");
  var elFDist=document.getElementById("fDist");
  var elFBest=document.getElementById("fBest");
  var elVerdict=document.getElementById("verdict");

  function buildHull(){
    elHull.innerHTML="";
    for(var i=0;i<S.maxHull;i++){
      var d=document.createElement("div");
      d.className="pip"+(i<S.hull?"":" dead");
      elHull.appendChild(d);
    }
  }
  function syncHull(){
    var pips=elHull.children;
    for(var i=0;i<pips.length;i++){
      if(i<S.hull) pips[i].className="pip";
      else pips[i].className="pip dead";
    }
  }
  function startGame(){
    initAudio();
    if(AC && AC.state==="suspended"){ try{AC.resume();}catch(e){} }
    resetState("play");
    // seed a little visual scene
    S.gates=[]; S.particles=[]; S.floats=[];
    elTitle.classList.add("hide");
    elOver.classList.add("hide");
    buildHull();
    elScore.textContent="0"; elKnots.textContent="0.0 kn";
    sClick();
  }
  function gameOver(){
    S.mode="over";
    S.shake=Math.max(S.shake,16);
    if(S.score>bestScore) bestScore=S.score;
    elFScore.textContent=Math.floor(S.score);
    elFDist.textContent=Math.floor(S.dist);
    elFBest.textContent=Math.floor(bestScore);
    var v = S.score>=bestScore && S.score>0 ? "New best line!" :
            (S.bestCombo>=8 ? "Fine seamanship" : "Fog wins this time");
    elVerdict.textContent=v;
    elOver.classList.remove("hide");
    sHorn(); vibe([30,40,60]);
  }
  document.getElementById("startBtn").addEventListener("click",function(e){ e.preventDefault(); startGame(); });
  document.getElementById("restartBtn").addEventListener("click",function(e){ e.preventDefault(); startGame(); });

  // ---------- update ----------
  function update(dt){
    S.clock+=dt;
    var moving = (S.mode==="play"||S.mode==="title");
    var spd = (S.mode==="play")?speedNow():150;
    S.scroll += spd*dt;

    // fog horizon eases toward target
    var targetHorizon;
    if(S.mode==="play"){
      var react=reactionNow();
      if(S.clarity>0) react*=1.9;
      targetHorizon = clamp(boatY - react*spd, H*0.10, boatY-70);
    }else{
      targetHorizon = H*0.30;
    }
    S.fogHorizon += (targetHorizon - S.fogHorizon)*(1-Math.exp(-dt/0.5));

    // clarity timer
    if(S.clarity>0){ S.clarity-=dt; if(S.clarity<0) S.clarity=0; }
    S.clarityGlow += (( S.clarity>0?1:0 ) - S.clarityGlow)*(1-Math.exp(-dt/0.35));

    // wind + gusts
    if(S.mode==="play"){
      S.gustTimer-=dt;
      if(S.gustTimer<=0){
        S.gustDir = Math.random()<0.5?-1:1;
        S.gust = S.gustDir * windAmpNow() * rand(0.7,1.2);
        S.gustTimer = rand(2.4,4.6) - diff()*1.4;
        // gust streak fx
        if(Math.abs(S.gust)>0.02){ noiseBurst(0.5,0.05,700); }
      }
      S.gust *= Math.exp(-dt/0.9);
      var baseWind = Math.sin(S.clock*0.6)*windAmpNow()*0.3;
      S.windTarget = clamp(baseWind + S.gust, -0.075, 0.075);
      // distant foghorn ambiance
      S.hornTimer-=dt;
      if(S.hornTimer<=0){ S.hornTimer=rand(13,21); tone(104,1.3,"sine",0.06,96); tone(139,1.2,"sine",0.03,131,0.05); }
    }else{
      S.windTarget = Math.sin(S.clock*0.5)*0.01;
    }
    S.wind += (S.windTarget - S.wind)*(1-Math.exp(-dt/0.25));

    // boat lateral (lane ease + wind offset)
    if(S.mode!=="play"){ S.lane = (S.laneCount-1)/2; }
    var targetNx = LANEX(S.lane);
    S.boatNx += (targetNx - S.boatNx)*(1-Math.exp(-dt/0.085));
    var effX = clamp(S.boatNx + S.wind, 0.02, 0.98);
    S.boatVis = effX;
    // heel toward motion + wind, decay
    var targetHeel = (targetNx - S.boatNx)*6 + S.wind*3.4;
    S.heel += (targetHeel - S.heel)*(1-Math.exp(-dt/0.12));
    S.luff *= Math.exp(-dt/0.16);
    S.bob = Math.sin(S.clock*2.3)*1.0 + Math.sin(S.clock*1.1)*1.4;

    // invuln
    if(S.invuln>0){ S.invuln-=dt; if(S.invuln<0)S.invuln=0; }

    // spawn gates
    if(moving){
      S.spawnAcc += spd*dt;
      var spacing = (S.mode==="play")?spacingNow():360;
      if(S.spawnAcc>=spacing){
        S.spawnAcc -= spacing;
        spawnGate(S.mode!=="play");
      }
    }

    // move + resolve gates
    for(var i=S.gates.length-1;i>=0;i--){
      var g=S.gates[i];
      g.y += spd*dt;
      var prog=easeIO(clamp((g.y - g.spawnY)/(boatY - g.spawnY),0,1));
      g.curC = lerp(g.cFrom, g.cTo, prog);
      g.curHalf = g.half;
      // resolve when crossing boat line
      if(!g.done && g.y>=boatY){
        g.done=true;
        if(S.mode==="play" && !g.harmless){
          var dxc = Math.abs(effX - g.curC);
          var boatHalfNx = (boatW()*0.42)/chW;
          if(dxc <= g.curHalf - boatHalfNx){
            // clean thread
            S.combo++;
            if(S.combo>S.bestCombo) S.bestCombo=S.combo;
            var perfect = dxc < g.curHalf*0.34;
            var gain = 10 + S.combo*3 + (perfect?15:0);
            S.score += gain;
            var gx=nxToX(g.curC);
            if(perfect){
              addFloat(gx, boatY-40, "PERFECT +"+gain, PAL.gold, true);
              burstSpark(gx, boatY, PAL.gold); sPerfect(); vibe(14);
            }else{
              addFloat(gx, boatY-36, "+"+gain, PAL.foam, false);
              burstSpark(gx, boatY, PAL.foam); sBell(S.combo); vibe(8);
            }
            if(S.combo>0 && S.combo%5===0 && S.combo!==S.lastLiftCombo){
              S.lastLiftCombo=S.combo; S.clarity=2.4;
              addFloat(W/2, boatY-90, "THE FOG LIFTS", PAL.gold, true);
              sLift(); vibe([12,30,12]);
            }
          }else{
            // crash into buoy/rocks
            if(S.invuln<=0){
              S.hull--; S.combo=0; syncHull();
              S.shake=Math.max(S.shake,14); S.hitStop=0.09; S.invuln=1.15;
              S.flash=1; S.flashCol="240,100,90";
              var hitX = effX < g.curC ? nxToX(g.curC-g.curHalf) : nxToX(g.curC+g.curHalf);
              burstSplash(hitX, boatY); sCrash(); vibe([20,30,40]);
              if(S.hull<=0){ gameOver(); }
            }
          }
        }
      }
      if(g.y>H+90) S.gates.splice(i,1);
    }

    // scoring distance
    if(S.mode==="play"){
      S.dist += spd*dt*0.05;
      S.score += spd*dt*0.05*(S.clarity>0?1.5:1);
    }

    // boat wake
    if(moving){
      var bx=nxToX(S.boatVis), by=boatY+boatW()*0.34;
      var rate = spd*dt*0.05;
      if(Math.random()<rate*0.9+0.35){
        addP(bx+rand(-3,3), by, rand(-16,16), spd*rand(0.18,0.30)+30, rand(0.35,0.7), rand(2,4.2), PAL.foam, "wake");
      }
      if(spd>320 && Math.random()<0.4){
        burstSpray(bx+rand(-boatW()*0.4,boatW()*0.4), by-6, Math.random()<.5?-1:1, 1, PAL.foam);
      }
    }

    // particles
    for(var p=S.particles.length-1;p>=0;p--){
      var q=S.particles[p];
      q.life-=dt; if(q.life<=0){ S.particles.splice(p,1); continue; }
      q.x+=q.vx*dt; q.y+=q.vy*dt;
      if(q.type==="spark"){ q.vy+=140*dt; q.vx*=Math.pow(0.12,dt); }
      else if(q.type==="spray"){ q.vy+=260*dt; q.vx*=Math.pow(0.5,dt); }
      else { q.vy+=20*dt; q.vx*=Math.pow(0.4,dt); }
    }
    // floats
    for(var f=S.floats.length-1;f>=0;f--){
      var fl=S.floats[f]; fl.life-=dt; fl.y-=26*dt; if(fl.life<=0) S.floats.splice(f,1);
    }

    // fx decays
    if(S.shake>0){ S.shake*=Math.exp(-dt/0.16); if(S.shake<0.4)S.shake=0; }
    if(S.flash>0){ S.flash-=dt*2.2; if(S.flash<0)S.flash=0; }

    // HUD
    if(S.mode==="play"){
      elScore.textContent=Math.floor(S.score);
      elKnots.textContent=(spd/26).toFixed(1)+" kn";
    }
  }

  // ---------- render ----------
  var grain=null;
  function makeGrain(){
    try{
      var g=document.createElement("canvas"); g.width=110; g.height=110;
      var gc=g.getContext("2d");
      var img=gc.createImageData(110,110), dd=img.data;
      for(var i=0;i<dd.length;i+=4){
        var v=200+Math.floor(Math.random()*55);
        dd[i]=v;dd[i+1]=v;dd[i+2]=v; dd[i+3]=Math.floor(Math.random()*26);
      }
      gc.putImageData(img,0,0); grain=g;
    }catch(e){ grain=null; }
  }
  makeGrain();

  var fogSprite=null;
  function makeFog(){
    try{
      var c=document.createElement("canvas"); c.width=256; c.height=256;
      var g=c.getContext("2d");
      var rg=g.createRadialGradient(128,128,0,128,128,128);
      rg.addColorStop(0,"rgba(255,255,255,0.92)");
      rg.addColorStop(0.5,"rgba(255,255,255,0.42)");
      rg.addColorStop(1,"rgba(255,255,255,0)");
      g.fillStyle=rg; g.fillRect(0,0,256,256);
      fogSprite=c;
    }catch(e){ fogSprite=null; }
  }
  makeFog();

  function drawWaterHighlights(){
    ctx.save();
    ctx.globalAlpha=1;
    var rows=14;
    for(var r=0;r<rows;r++){
      var yy=((S.scroll*0.5 + r*(H/rows)) % (H+40)) ;
      var y = (yy) - 20;
      var t = r/rows;
      ctx.globalAlpha=0.05+0.05*Math.sin(S.clock*0.8+r);
      ctx.strokeStyle=PAL.highlight;
      ctx.lineWidth=1.2;
      ctx.beginPath();
      var segs=6;
      for(var sx=0;sx<=segs;sx++){
        var xx=chX-20 + (chW+40)*(sx/segs);
        var oy=y + Math.sin(S.clock*1.3 + sx*0.9 + r)*3;
        if(sx===0) ctx.moveTo(xx,oy); else ctx.lineTo(xx,oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBackdrop(){
    // sky/water vertical gradient
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,PAL.skyTop);
    g.addColorStop(0.34,PAL.skyBot);
    g.addColorStop(0.36,PAL.waterTop);
    g.addColorStop(0.7,PAL.waterMid);
    g.addColorStop(1,PAL.waterBot);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // faint distant bridge towers (Golden Gate hint) near horizon
    ctx.save();
    ctx.globalAlpha=0.10 + 0.05*S.clarityGlow;
    ctx.fillStyle="rgb("+PAL.bridge+")";
    var horizonY=H*0.30;
    var t1=chX+chW*0.30, t2=chX+chW*0.70, tw=Math.max(8,chW*0.03);
    [t1,t2].forEach(function(tx){
      ctx.beginPath();
      ctx.moveTo(tx-tw, horizonY);
      ctx.lineTo(tx-tw*0.55, horizonY-H*0.14);
      ctx.lineTo(tx+tw*0.55, horizonY-H*0.14);
      ctx.lineTo(tx+tw, horizonY);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(tx-tw*0.55, horizonY-H*0.10, tw*1.1, 4);
      ctx.fillRect(tx-tw*0.4, horizonY-H*0.075, tw*0.8, 3);
    });
    // suspension curve
    ctx.strokeStyle="rgb("+PAL.bridge+")"; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(t1-tw, horizonY-H*0.02);
    ctx.quadraticCurveTo((t1+t2)/2, horizonY-H*0.16, t2+tw, horizonY-H*0.02);
    ctx.stroke();
    ctx.restore();

    drawWaterHighlights();
  }

  function drawGate(g){
    var emerge = clamp((g.y - (S.fogHorizon-30))/70, 0, 1);
    if(emerge<=0.01) return;
    ctx.save();
    ctx.globalAlpha = emerge;
    var cx=nxToX(g.curC);
    var leftX = nxToX(clamp(g.curC-g.curHalf,0,1));
    var rightX= nxToX(clamp(g.curC+g.curHalf,0,1));
    var y=g.y;
    var r=buoyR();

    // channel calm-water highlight (the safe gap)
    var cg=ctx.createLinearGradient(leftX,0,rightX,0);
    cg.addColorStop(0,"rgba(255,255,255,0)");
    cg.addColorStop(0.5,PAL.channel);
    cg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=cg;
    ctx.fillRect(leftX, y-r*2.2, rightX-leftX, r*4.4);

    // danger water outside the buoys (rocks/whitewater)
    drawDanger(chX, leftX-r*0.6, y, r);
    drawDanger(rightX+r*0.6, chX+chW, y, r);

    // buoys (green left, red right)
    var bobY = Math.sin(S.clock*2.0 + g.bob)*2.2;
    drawBuoy(leftX, y+bobY, r, PAL.green, PAL.greenDk, true);
    drawBuoy(rightX, y+bobY*0.9, r, PAL.red, PAL.redDk, false);
    ctx.restore();
  }

  function drawDanger(x0,x1,y,r){
    if(x1-x0<=1) return;
    ctx.save();
    // choppy rock band
    ctx.fillStyle=PAL.rock;
    ctx.globalAlpha*=0.9;
    ctx.beginPath();
    ctx.moveTo(x0, y-r*0.5);
    var n=Math.max(2,Math.floor((x1-x0)/14));
    for(var i=0;i<=n;i++){
      var xx=lerp(x0,x1,i/n);
      var yy=y - r*0.5 - Math.abs(Math.sin(xx*0.13+S.clock*1.4))*r*0.7;
      ctx.lineTo(xx,yy);
    }
    ctx.lineTo(x1, y+r*0.9);
    ctx.lineTo(x0, y+r*0.9);
    ctx.closePath(); ctx.fill();
    // foam lip
    ctx.globalAlpha*=0.8;
    ctx.strokeStyle=PAL.rockLip; ctx.lineWidth=2;
    ctx.beginPath();
    for(var j=0;j<=n;j++){
      var xj=lerp(x0,x1,j/n);
      var yj=y - r*0.5 - Math.abs(Math.sin(xj*0.13+S.clock*1.4))*r*0.7;
      if(j===0) ctx.moveTo(xj,yj); else ctx.lineTo(xj,yj);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawBuoy(x,y,r,col,dk,isGreen){
    ctx.save();
    // reflection
    ctx.globalAlpha*=0.5;
    var rg=ctx.createLinearGradient(0,y+r,0,y+r*3);
    rg.addColorStop(0,col); rg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.ellipse(x,y+r*1.9,r*0.7,r*1.5,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha/=0.5;

    // body
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.ellipse(x,y,r,r*1.15,0,0,Math.PI*2); ctx.fill();
    // shading
    ctx.fillStyle=dk; ctx.globalAlpha*=0.5;
    ctx.beginPath(); ctx.ellipse(x+r*0.25,y+r*0.1,r*0.8,r*1.0,0,-0.2,Math.PI); ctx.fill();
    ctx.globalAlpha/=0.5;
    // stripe
    ctx.fillStyle=PAL.foam; ctx.globalAlpha*=0.85;
    ctx.fillRect(x-r*0.85,y-r*0.18,r*1.7,r*0.34);
    ctx.globalAlpha/=0.85;
    // topmark + light
    ctx.fillStyle=dk;
    ctx.fillRect(x-r*0.12,y-r*1.9,r*0.24,r*0.9);
    ctx.beginPath();
    if(isGreen){ // cone up
      ctx.moveTo(x-r*0.5,y-r*1.7); ctx.lineTo(x+r*0.5,y-r*1.7); ctx.lineTo(x,y-r*2.5); ctx.closePath();
    }else{ // can/square
      ctx.rect(x-r*0.45,y-r*2.4,r*0.9,r*0.8);
    }
    ctx.fillStyle=col; ctx.fill();
    // glint
    ctx.fillStyle=PAL.foam; ctx.globalAlpha*=0.7;
    ctx.beginPath(); ctx.ellipse(x-r*0.35,y-r*0.45,r*0.22,r*0.3,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawWake(){
    for(var i=0;i<S.particles.length;i++){
      var q=S.particles[i];
      if(q.type!=="wake") continue;
      var a=q.life/q.max;
      ctx.globalAlpha=a*0.5;
      ctx.fillStyle=q.col;
      ctx.beginPath(); ctx.arc(q.x,q.y,q.size*(0.6+a*0.8),0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  function drawParticlesTop(){
    for(var i=0;i<S.particles.length;i++){
      var q=S.particles[i];
      if(q.type==="wake") continue;
      var a=q.life/q.max;
      ctx.globalAlpha=clamp(a,0,1);
      if(q.type==="spark"){
        ctx.fillStyle=q.col;
        ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot+q.life*8);
        ctx.fillRect(-q.size/2,-q.size/2,q.size,q.size); ctx.restore();
      }else{
        ctx.fillStyle=q.col;
        ctx.beginPath(); ctx.arc(q.x,q.y,q.size*(0.5+a*0.6),0,Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }

  function drawBoat(){
    var bx=nxToX(S.boatVis);
    var by=boatY + S.bob;
    var bw=boatW();
    var invBlink = (S.invuln>0 && (Math.floor(S.clock*18)%2===0));
    ctx.save();
    ctx.translate(bx,by);
    ctx.rotate(clamp(S.heel*0.05,-0.28,0.28));
    if(invBlink) ctx.globalAlpha=0.4;

    // hull shadow on water
    ctx.save();
    ctx.globalAlpha*=0.25; ctx.fillStyle="#000";
    ctx.beginPath(); ctx.ellipse(0,bw*0.5,bw*0.62,bw*0.28,0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // wake V
    ctx.strokeStyle=PAL.foam; ctx.globalAlpha*=0.5; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-bw*0.1,bw*0.35); ctx.lineTo(-bw*0.9,bw*1.3);
    ctx.moveTo(bw*0.1,bw*0.35); ctx.lineTo(bw*0.9,bw*1.3);
    ctx.stroke();
    ctx.globalAlpha/= 0.5;

    // hull (leaf/dinghy shape)
    var hg=ctx.createLinearGradient(-bw*0.5,0,bw*0.5,0);
    hg.addColorStop(0,PAL.hullDk); hg.addColorStop(0.5,PAL.hull); hg.addColorStop(1,PAL.hullDk);
    ctx.fillStyle=hg;
    ctx.beginPath();
    ctx.moveTo(0,-bw*0.62);
    ctx.quadraticCurveTo(bw*0.5,-bw*0.1, bw*0.36,bw*0.5);
    ctx.quadraticCurveTo(0,bw*0.7, -bw*0.36,bw*0.5);
    ctx.quadraticCurveTo(-bw*0.5,-bw*0.1, 0,-bw*0.62);
    ctx.closePath(); ctx.fill();
    // inner deck
    ctx.fillStyle=PAL.hullDk; ctx.globalAlpha*=0.55;
    ctx.beginPath();
    ctx.moveTo(0,-bw*0.42);
    ctx.quadraticCurveTo(bw*0.28,-bw*0.05, bw*0.2,bw*0.4);
    ctx.quadraticCurveTo(0,bw*0.5, -bw*0.2,bw*0.4);
    ctx.quadraticCurveTo(-bw*0.28,-bw*0.05, 0,-bw*0.42);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha/=0.55;

    // rig geometry: sail swings to the lee side, driven by heel/wind (+ luff flutter)
    var mastTop=-bw*1.52, mastBot=-bw*0.24;
    var trim = clamp(S.heel*0.5 + S.wind*3.2, -1, 1);
    var flutter = Math.sin(S.clock*22)*0.14*S.luff;
    var minT=0.52;
    var st = (trim>=0? Math.max(trim,minT): Math.min(trim,-minT)) + flutter;
    var clewX=st*bw*1.32, clewY=-bw*0.56;

    // mast
    ctx.strokeStyle=PAL.mast; ctx.lineWidth=Math.max(1.6,bw*0.055);
    ctx.beginPath(); ctx.moveTo(0,mastBot); ctx.lineTo(0,mastTop); ctx.stroke();
    // boom
    ctx.lineWidth=Math.max(1.3,bw*0.04);
    ctx.beginPath(); ctx.moveTo(0,mastBot); ctx.lineTo(clewX,clewY); ctx.stroke();

    // mainsail (triangle head->tack->clew, billowed leech)
    ctx.fillStyle=PAL.sail;
    ctx.beginPath();
    ctx.moveTo(0,mastTop);
    ctx.lineTo(0,mastBot);
    ctx.quadraticCurveTo(clewX*1.12,(mastBot+clewY)/2, clewX,clewY);
    ctx.quadraticCurveTo(clewX*1.2,(mastTop+clewY)/2, 0,mastTop);
    ctx.closePath(); ctx.fill();
    // sail shading (lee curve) + batten seam
    ctx.save();
    ctx.fillStyle=PAL.hullDk; ctx.globalAlpha*=0.16;
    ctx.beginPath();
    ctx.moveTo(0,mastTop); ctx.lineTo(0,mastBot);
    ctx.quadraticCurveTo(clewX*0.45,(mastBot+clewY)/2, clewX,clewY);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.strokeStyle=PAL.hullDk; ctx.save(); ctx.globalAlpha*=0.28; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,-bw*0.9); ctx.lineTo(clewX*0.86,-bw*0.78); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-bw*1.24); ctx.lineTo(clewX*0.55,-bw*1.12); ctx.stroke();
    ctx.restore();

    // masthead pennant (fluttering, points downwind)
    var pd = st>=0?1:-1;
    ctx.fillStyle = S.clarity>0?PAL.gold:PAL.red;
    ctx.beginPath();
    ctx.moveTo(0,mastTop);
    ctx.lineTo(pd*bw*(0.34+0.06*Math.sin(S.clock*16)), mastTop+bw*0.10);
    ctx.lineTo(0,mastTop+bw*0.22);
    ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  function drawFog(){
    // drifting soft banks (parallax) — cheap pre-rendered sprite blits
    if(fogSprite){
      ctx.save();
      var tint = PAL.dark?0.85:1.0;
      var banks=[
        {y:H*0.16, r:W*0.52, sp:0.05, a:0.15},
        {y:H*0.48, r:W*0.66, sp:0.09, a:0.12},
        {y:H*0.80, r:W*0.80, sp:0.14, a:0.09}
      ];
      for(var b=0;b<banks.length;b++){
        var bk=banks[b], span=W+bk.r*2;
        for(var i=0;i<3;i++){
          var base=i*(span/3) + b*90;
          var cx=(((base - S.scroll*bk.sp)%span)+span)%span - bk.r;
          var a=bk.a*tint*(0.65+0.35*Math.sin(S.clock*0.5+i*2+b));
          ctx.globalAlpha=clamp(a,0,0.3);
          ctx.drawImage(fogSprite, cx-bk.r, bk.y-bk.r, bk.r*2, bk.r*2);
        }
      }
      ctx.restore();
    }

    // top fog wall hiding upcoming track (down to fogHorizon)
    var fh=S.fogHorizon;
    var dense=PAL.fogAlpha*(1 - 0.35*S.clarityGlow);
    var g=ctx.createLinearGradient(0,0,0,fh+120);
    g.addColorStop(0,"rgba("+PAL.fog+","+dense+")");
    g.addColorStop(clamp((fh)/(fh+120),0,1),"rgba("+PAL.fog+","+(dense*0.92)+")");
    g.addColorStop(1,"rgba("+PAL.fog+",0)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,fh+122);

    // subtle bottom haze
    var g2=ctx.createLinearGradient(0,H,0,H*0.8);
    g2.addColorStop(0,"rgba("+PAL.fog+",0.10)");
    g2.addColorStop(1,"rgba("+PAL.fog+",0)");
    ctx.fillStyle=g2; ctx.fillRect(0,H*0.8,W,H*0.2);
  }

  function drawGust(){
    if(Math.abs(S.wind)<0.02) return;
    ctx.save();
    ctx.globalAlpha=clamp(Math.abs(S.wind)*3.2,0,0.28);
    ctx.strokeStyle=PAL.foam; ctx.lineWidth=1.4;
    var dir=S.wind>0?1:-1;
    for(var i=0;i<8;i++){
      var yy=((S.scroll*0.9 + i*(H/8)) % (H+20)) -10;
      var xx=(i*137 % W);
      ctx.beginPath();
      ctx.moveTo(xx,yy); ctx.lineTo(xx+dir*36, yy+8);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFloats(){
    ctx.save();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(var i=0;i<S.floats.length;i++){
      var fl=S.floats[i];
      var a=clamp(fl.life/fl.max,0,1);
      ctx.globalAlpha=a;
      ctx.font=(fl.big?"800 ":"700 ")+(fl.big?24:16)+"px ui-monospace,Menlo,monospace";
      ctx.lineWidth=4; ctx.strokeStyle="rgba(0,0,0,0.28)";
      ctx.strokeText(fl.text,fl.x,fl.y);
      ctx.fillStyle=fl.col;
      ctx.fillText(fl.text,fl.x,fl.y);
    }
    ctx.restore();
  }

  function drawComboBadge(){
    if(S.mode!=="play"||S.combo<2) return;
    var bx=nxToX(S.boatVis), by=boatY+boatW()*1.5;
    ctx.save();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="800 15px ui-monospace,Menlo,monospace";
    var pulse=1+0.06*Math.sin(S.clock*8);
    ctx.globalAlpha=0.9;
    ctx.fillStyle=S.clarity>0?PAL.gold:PAL.foam;
    ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.lineWidth=3;
    var tx="x"+S.combo;
    ctx.save(); ctx.translate(bx,by); ctx.scale(pulse,pulse);
    ctx.strokeText(tx,0,0); ctx.fillText(tx,0,0);
    ctx.restore();
    ctx.restore();
  }

  function drawVignette(){
    var rg=ctx.createRadialGradient(W/2,H*0.5,H*0.3,W/2,H*0.5,H*0.85);
    rg.addColorStop(0,"rgba(0,0,0,0)");
    rg.addColorStop(1, PAL.dark?"rgba(0,0,0,0.42)":"rgba(30,50,60,0.20)");
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    if(S.clarityGlow>0.02){
      ctx.save(); ctx.globalAlpha=S.clarityGlow*0.16;
      var gg=ctx.createRadialGradient(W/2,boatY,10,W/2,boatY,H*0.6);
      gg.addColorStop(0,PAL.gold); gg.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=gg; ctx.fillRect(0,0,W,H); ctx.restore();
    }
  }

  function drawGrain(){
    if(!grain) return;
    ctx.save(); ctx.globalAlpha=PAL.dark?0.05:0.06;
    var s=110;
    for(var y=0;y<H;y+=s){ for(var x=0;x<W;x+=s){ ctx.drawImage(grain,x,y); } }
    ctx.restore();
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(S.shake>0){ ctx.translate(rand(-S.shake,S.shake), rand(-S.shake,S.shake)); }

    drawBackdrop();

    // gates behind boat
    for(var i=0;i<S.gates.length;i++) drawGate(S.gates[i]);

    drawWake();
    drawBoat();
    drawParticlesTop();
    drawComboBadge();

    drawFog();
    drawGust();

    drawFloats();
    drawVignette();

    ctx.restore();

    // hit flash (screen)
    if(S.flash>0){
      ctx.save(); ctx.globalAlpha=clamp(S.flash*0.5,0,0.5);
      ctx.fillStyle="rgb("+S.flashCol+")"; ctx.fillRect(0,0,W,H); ctx.restore();
    }
    drawGrain();
  }

  // ---------- main loop ----------
  var last=now();
  function frame(){
    var t=now();
    var dt=(t-last)/1000; last=t;
    if(dt>0.1) dt=0.1;   // cap huge jumps but keep real-time pacing at low fps (collisions are position-based)
    if(dt<0) dt=0;
    try{
      if(S.hitStop>0){ S.hitStop-=dt; render(); }
      else { update(dt); render(); }
    }catch(err){
      // never let one frame kill the loop
    }
    requestAnimationFrame(frame);
  }
  // build initial HUD hull and kick loop
  buildHull();
  requestAnimationFrame(frame);
})();
</script>
</body>
