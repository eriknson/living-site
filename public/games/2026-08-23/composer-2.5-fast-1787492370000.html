<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wrong Skyline Stamp</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8e4dc;--surface:#f5f2eb;--ink:#1a1a18;--muted:#6b6860;
  --foil:#c4a035;--foil-light:#e8d078;--accent:#2d6a4f;
  --danger:#b5453a;--belt:#3d3a36;--overlay:rgba(245,242,235,.92);
  --shadow:rgba(0,0,0,.12);--medal:#d4af37;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#121110;--surface:#1c1b19;--ink:#eceae4;--muted:#8a8680;
    --foil:#a89048;--foil-light:#c9b060;--accent:#52b788;
    --danger:#e07060;--belt:#2a2826;--overlay:rgba(18,17,16,.94);
    --shadow:rgba(0,0,0,.45);--medal:#b8962e;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);flex-shrink:0;z-index:2}
header span{color:var(--ink);font-size:13px}
#stage-wrap{flex:1;position:relative;min-height:0}
#gameCanvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;z-index:10;transition:opacity .35s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-card{background:var(--overlay);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--shadow);border-radius:16px;padding:28px 24px;max-width:340px;width:88%;
  text-align:center;pointer-events:auto;box-shadow:0 8px 32px var(--shadow)}
.overlay h1{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:6px}
.overlay .sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:20px}
.overlay .hint{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;
  color:var(--muted);letter-spacing:.04em;margin-bottom:16px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:160px;
  padding:12px 28px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
  background:var(--accent);color:#fff;letter-spacing:.02em;pointer-events:auto;
  transition:transform .15s ease,opacity .15s ease}
.btn:active{transform:scale(.96)}
.btn-foil{background:linear-gradient(145deg,var(--foil-light),var(--foil));color:var(--ink)}
#gameOverCard .score-big{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  font-size:36px;color:var(--foil);margin:8px 0 4px}
#gameOverCard .score-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:18px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>STAMPS <span id="hudStamps">0</span></div>
    <div>COMBO <span id="hudCombo">×1</span></div>
    <div>TIME <span id="hudTime">—</span></div>
  </header>
  <div id="stage-wrap">
    <canvas id="gameCanvas"></canvas>
    <div id="titleOverlay" class="overlay">
      <div class="overlay-card">
        <h1>Wrong Skyline</h1>
        <p class="sub">Trace the correct stadium silhouette before the press fires. The reference keeps lying.</p>
        <p class="hint">DRAG ALONG THE MEDAL OUTLINE · MATCH THE TRUE CITY</p>
        <button class="btn btn-foil" data-smoke="start" id="startBtn">Begin Shift</button>
      </div>
    </div>
    <div id="gameOverOverlay" class="overlay hidden">
      <div class="overlay-card" id="gameOverCard">
        <h1>Press Jammed</h1>
        <p class="score-label">Stamps landed</p>
        <div class="score-big" id="finalScore">0</div>
        <p class="sub" id="failReason">Time expired.</p>
        <button class="btn btn-foil" data-smoke="restart" id="restartBtn">Next Shift</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('gameCanvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var titleOverlay = document.getElementById('titleOverlay');
var gameOverOverlay = document.getElementById('gameOverOverlay');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');
var hudStamps = document.getElementById('hudStamps');
var hudCombo = document.getElementById('hudCombo');
var hudTime = document.getElementById('hudTime');
var finalScore = document.getElementById('finalScore');
var failReason = document.getElementById('failReason');

var W = 360, H = 640;
var dpr = 1;
var state = 'title';
var stamps = 0, combo = 1, bestCombo = 1;
var round = 0;
var timeLeft = 0, maxTime = 0;
var targetIdx = 0, decoyIdx = 0;
var refIdx = 0, refSwapTimer = 0, refSwapInterval = 1.8;
var sparks = [];
var fogPhase = 0;
var traceProgress = 0;
var isTracing = false;
var tracePoints = [];
var particles = [];
var shake = 0;
var conveyorOffset = 0;
var pressY = 0, pressTarget = 0;
var medalY = 0;
var flashCorrect = 0;
var roundResult = null;
var resultTimer = 0;
var audioCtx = null;
var lastFrame = 0;
var animId = 0;

var CITIES = [
  { name:'San Francisco', short:'SF', color:'#4a7c8c' },
  { name:'New York', short:'NYC', color:'#5c6b7a' },
  { name:'Chicago', short:'CHI', color:'#6b5c4a' },
  { name:'London', short:'LDN', color:'#4a5c6b' },
  { name:'Tokyo', short:'TYO', color:'#7a4a4a' }
];

function skylinePoints(id){
  var pts;
  if(id===0){
    pts=[[.08,.82],[.12,.82],[.14,.55],[.17,.55],[.19,.82],[.22,.82],[.24,.38],[.26,.38],[.28,.82],
      [.32,.82],[.34,.62],[.36,.62],[.38,.82],[.42,.82],[.44,.48],[.46,.48],[.48,.82],[.52,.82],
      [.54,.58],[.58,.58],[.60,.82],[.72,.82],[.74,.65],[.78,.65],[.80,.82],[.92,.82]];
  }else if(id===1){
    pts=[[.08,.82],[.12,.82],[.14,.62],[.16,.62],[.18,.82],[.22,.82],[.24,.45],[.26,.45],[.28,.82],
      [.32,.82],[.34,.55],[.36,.55],[.38,.82],[.42,.82],[.44,.30],[.46,.30],[.48,.82],[.52,.82],
      [.54,.50],[.58,.50],[.60,.82],[.68,.82],[.70,.58],[.74,.58],[.76,.82],[.92,.82]];
  }else if(id===2){
    pts=[[.08,.82],[.14,.82],[.16,.55],[.18,.55],[.20,.82],[.28,.82],[.30,.28],[.32,.28],[.34,.82],
      [.42,.82],[.44,.52],[.48,.52],[.50,.82],[.58,.82],[.60,.48],[.62,.48],[.64,.82],[.72,.82],
      [.74,.60],[.78,.60],[.80,.82],[.92,.82]];
  }else if(id===3){
    pts=[[.08,.82],[.16,.82],[.18,.58],[.20,.58],[.22,.82],[.30,.82],[.32,.35],[.34,.35],[.36,.82],
      [.44,.82],[.46,.52],[.50,.52],[.52,.82],[.60,.82],[.62,.42],[.66,.42],[.68,.82],[.76,.82],
      [.78,.62],[.82,.62],[.84,.82],[.92,.82]];
  }else{
    pts=[[.08,.82],[.18,.82],[.20,.55],[.22,.55],[.24,.82],[.32,.82],[.34,.40],[.36,.40],[.38,.82],
      [.46,.82],[.48,.62],[.52,.62],[.54,.82],[.62,.82],[.64,.32],[.66,.32],[.68,.82],[.76,.82],
      [.78,.55],[.82,.55],[.84,.82],[.92,.82]];
  }
  return pts;
}

function getCSS(name){
  try{return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}catch(e){return '';}
}

function resize(){
  if(!canvas)return;
  var wrap = document.getElementById('stage-wrap');
  if(!wrap)return;
  var rect = wrap.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio||1,2);
  W = Math.max(rect.width,1);
  H = Math.max(rect.height,1);
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  if(ctx)ctx.setTransform(dpr,0,0,dpr,0,0);
}

function ensureAudio(){
  if(audioCtx)return audioCtx;
  try{
    var AC = window.AudioContext||window.webkitAudioContext;
    if(AC)audioCtx=new AC();
  }catch(e){}
  return audioCtx;
}

function playTone(freq,dur,type,vol){
  var ac=ensureAudio();
  if(!ac)return;
  try{
    if(ac.state==='suspended')ac.resume();
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.08,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+(dur||0.15));
    o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+(dur||0.15));
  }catch(e){}
}

function playStamp(success){
  if(success){
    playTone(880,0.08,'sine',0.1);
    setTimeout(function(){playTone(1320,0.12,'sine',0.08);},60);
  }else{
    playTone(120,0.25,'square',0.06);
  }
  try{navigator.vibrate&&navigator.vibrate(success?[12,30,12]:[40]);}catch(e){}
}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function pickTarget(){
  targetIdx = randInt(0,CITIES.length-1);
  do{decoyIdx=randInt(0,CITIES.length-1);}while(decoyIdx===targetIdx);
  refIdx = targetIdx;
  flashCorrect = 2.2;
}

function pickWrongRef(){
  var wrong;
  do{wrong=randInt(0,CITIES.length-1);}while(wrong===targetIdx);
  refIdx = wrong;
}

function startRound(){
  round++;
  pickTarget();
  traceProgress = 0;
  tracePoints = [];
  isTracing = false;
  roundResult = null;
  resultTimer = 0;
  maxTime = Math.max(4.5, 9 - round*0.45);
  timeLeft = maxTime;
  refSwapInterval = Math.max(0.55, 1.8 - round*0.12);
  refSwapTimer = refSwapInterval * 0.35;
  sparks = [];
  pressY = -H*0.15;
  pressTarget = H*0.38;
  medalY = H*0.52;
  conveyorOffset = 0;
}

function startGame(){
  state = 'playing';
  stamps = 0; combo = 1; bestCombo = 1; round = 0;
  titleOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  updateHUD();
  startRound();
}

function endGame(reason){
  state = 'over';
  finalScore.textContent = String(stamps);
  failReason.textContent = reason||'Time expired.';
  gameOverOverlay.classList.remove('hidden');
}

function updateHUD(){
  if(hudStamps)hudStamps.textContent=String(stamps);
  if(hudCombo)hudCombo.textContent='×'+combo;
  if(hudTime)hudTime.textContent=state==='playing'?timeLeft.toFixed(1):'—';
}

function spawnParticles(x,y,count,color){
  for(var i=0;i<count;i++){
    particles.push({
      x:x,y:y,
      vx:(Math.random()-0.5)*6,
      vy:(Math.random()-0.5)*6-2,
      life:0.5+Math.random()*0.4,
      maxLife:0.9,
      color:color||getCSS('--foil-light')||'#e8d078',
      size:2+Math.random()*3
    });
  }
}

function pathToScreen(pts,cx,cy,pw,ph){
  var out=[];
  for(var i=0;i<pts.length;i++){
    out.push([cx+(pts[i][0]-0.5)*pw, cy+(pts[i][1]-0.65)*ph]);
  }
  return out;
}

function dist(a,b){var dx=a[0]-b[0],dy=a[1]-b[1];return Math.sqrt(dx*dx+dy*dy);}

function samplePath(screenPts,samples){
  if(screenPts.length<2)return [];
  var segs=[],total=0;
  for(var i=0;i<screenPts.length-1;i++){
    var d=dist(screenPts[i],screenPts[i+1]);
    segs.push(d);total+=d;
  }
  var result=[],acc=0,si=0,segProg=0;
  for(var s=0;s<samples;s++){
    var t=(s/(samples-1))*total;
    while(si<segs.length-1&&acc+segs[si]<t){acc+=segs[si];si++;}
    segProg=segs[si]>0?(t-acc)/segs[si]:0;
    var p1=screenPts[si],p2=screenPts[Math.min(si+1,screenPts.length-1)];
    result.push([p1[0]+(p2[0]-p1[0])*segProg,p1[1]+(p2[1]-p1[1])*segProg]);
  }
  return result;
}

var pathSamples = [];
var hitMask = [];

function rebuildPathCache(){
  var pw=W*0.78,ph=H*0.14;
  var cx=W*0.5,cy=medalY;
  var screenPts=pathToScreen(skylinePoints(targetIdx),cx,cy,pw,ph);
  pathSamples=samplePath(screenPts,80);
  hitMask=new Array(pathSamples.length);
  for(var i=0;i<hitMask.length;i++)hitMask[i]=false;
}

function evaluateTrace(){
  if(pathSamples.length===0)return 0;
  var tol=Math.max(18,28-round);
  for(var i=0;i<tracePoints.length;i++){
    var tp=tracePoints[i];
    for(var j=0;j<pathSamples.length;j++){
      if(!hitMask[j]&&dist(tp,pathSamples[j])<tol){
        hitMask[j]=true;
        if(Math.random()<0.35){
          sparks.push({x:pathSamples[j][0],y:pathSamples[j][1],life:0.35,max:0.35,r:3+Math.random()*2});
        }
      }
    }
  }
  var hits=0;
  for(var k=0;k<hitMask.length;k++)if(hitMask[k])hits++;
  return hits/hitMask.length;
}

function getPointerPos(e){
  if(!canvas)return{x:0,y:0};
  var rect=canvas.getBoundingClientRect();
  var cx,cy;
  if(e.touches&&e.touches.length>0){
    cx=e.touches[0].clientX;cy=e.touches[0].clientY;
  }else{
    cx=e.clientX;cy=e.clientY;
  }
  return{x:cx-rect.left,y:cy-rect.top};
}

function onPointerDown(e){
  if(state!=='playing'||roundResult)return;
  try{e.preventDefault();}catch(ex){}
  isTracing=true;
  tracePoints=[];
  var p=getPointerPos(e);
  tracePoints.push([p.x,p.y]);
  ensureAudio();
}

function onPointerMove(e){
  if(!isTracing||state!=='playing'||roundResult)return;
  try{e.preventDefault();}catch(ex){}
  var p=getPointerPos(e);
  var last=tracePoints[tracePoints.length-1];
  if(!last||dist(last,[p.x,p.y])>3){
    tracePoints.push([p.x,p.y]);
    traceProgress=evaluateTrace();
  }
}

function onPointerUp(e){
  if(!isTracing)return;
  try{e.preventDefault();}catch(ex){}
  isTracing=false;
  if(state==='playing'&&!roundResult){
    traceProgress=evaluateTrace();
    if(traceProgress>=0.72){
      succeedStamp();
    }
  }
}

function succeedStamp(){
  roundResult='success';
  resultTimer=0.9;
  stamps++;
  combo++;
  if(combo>bestCombo)bestCombo=combo;
  shake=8;
  playStamp(true);
  spawnParticles(W*0.5,medalY,24,getCSS('--foil-light'));
  updateHUD();
}

function failStamp(reason){
  roundResult='fail';
  resultTimer=0.6;
  combo=1;
  playStamp(false);
  shake=12;
  setTimeout(function(){
    endGame(reason);
  },700);
}

function update(dt){
  if(state!=='playing')return;

  conveyorOffset=(conveyorOffset+dt*40)%60;

  if(roundResult==='success'){
    resultTimer-=dt;
    pressY+=(pressTarget-pressY)*Math.min(1,dt*8);
    if(resultTimer<=0){
      startRound();
    }
    updateParticles(dt);
    if(shake>0)shake*=0.85;
    return;
  }
  if(roundResult==='fail'){
    resultTimer-=dt;
    updateParticles(dt);
    return;
  }

  timeLeft-=dt;
  if(hudTime)hudTime.textContent=Math.max(0,timeLeft).toFixed(1);

  if(flashCorrect>0)flashCorrect-=dt;

  refSwapTimer-=dt;
  if(refSwapTimer<=0){
    refSwapTimer=refSwapInterval;
    if(Math.random()<0.72+round*0.03){
      pickWrongRef();
      playTone(220,0.04,'square',0.025);
    }else{
      refIdx=targetIdx;
    }
  }

  fogPhase+=dt*0.4;

  pressY+=(pressTarget-pressY)*Math.min(1,dt*1.5);

  if(isTracing){
    traceProgress=evaluateTrace();
    if(traceProgress>=0.72){
      isTracing=false;
      succeedStamp();
    }
  }

  if(timeLeft<=0){
    failStamp('The press fired before your trace was complete.');
    return;
  }

  var urgency=1-timeLeft/maxTime;
  if(urgency>0.85&&traceProgress<0.72){
    failStamp('Stamp landed off-center — wrong skyline.');
    return;
  }

  for(var si=sparks.length-1;si>=0;si--){
    sparks[si].life-=dt;
    sparks[si].r*=0.96;
    if(sparks[si].life<=0)sparks.splice(si,1);
  }
  updateParticles(dt);
  if(shake>0)shake*=0.85;
}

function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.life-=dt;
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=dt*12;
    if(p.life<=0)particles.splice(i,1);
  }
}

function drawSkyline(pts,cx,cy,pw,ph,color,lineW,alpha){
  if(!ctx)return;
  ctx.save();
  ctx.globalAlpha=alpha!=null?alpha:1;
  ctx.strokeStyle=color||getCSS('--ink');
  ctx.lineWidth=lineW||2;
  ctx.lineJoin='round';
  ctx.lineCap='round';
  ctx.beginPath();
  for(var i=0;i<pts.length;i++){
    var x=cx+(pts[i][0]-0.5)*pw;
    var y=cy+(pts[i][1]-0.65)*ph;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawMedal(cx,cy,r){
  if(!ctx)return;
  var foil=getCSS('--foil')||'#c4a035';
  var foilLight=getCSS('--foil-light')||'#e8d078';
  var grad=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,0,cx,cy,r);
  grad.addColorStop(0,foilLight);
  grad.addColorStop(0.7,foil);
  grad.addColorStop(1,'#8a7020');
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.3)';
  ctx.shadowBlur=16;
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,0.25)';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.restore();
}

function drawConveyor(y){
  if(!ctx)return;
  var belt=getCSS('--belt')||'#3d3a36';
  ctx.fillStyle=belt;
  ctx.fillRect(0,y,W,H-y);
  ctx.strokeStyle='rgba(255,255,255,0.06)';
  ctx.lineWidth=1;
  for(var x=-60+conveyorOffset;x<W+60;x+=30){
    ctx.beginPath();
    ctx.moveTo(x,y+8);
    ctx.lineTo(x+15,y+H-y-8);
    ctx.stroke();
  }
}

function drawReferencePanel(){
  var panelH=H*0.17;
  var bg=getCSS('--surface')||'#f5f2eb';
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,panelH+20);
  ctx.strokeStyle=getCSS('--muted')||'#6b6860';
  ctx.globalAlpha=0.2;
  ctx.beginPath();
  ctx.moveTo(0,panelH+20);ctx.lineTo(W,panelH+20);
  ctx.stroke();
  ctx.globalAlpha=1;

  var showCorrect=flashCorrect>0||(refIdx===targetIdx);
  var displayIdx=flashCorrect>0?targetIdx:refIdx;
  var labelColor=showCorrect?(getCSS('--accent')||'#2d6a4f'):(getCSS('--danger')||'#b5453a');
  var label=flashCorrect>0?'MEMORIZE':(showCorrect?'REFERENCE':'⚠ WRONG CITY');

  ctx.font='600 10px ui-monospace,Menlo,monospace';
  ctx.fillStyle=getCSS('--muted')||'#6b6860';
  ctx.textAlign='left';
  ctx.fillText('REFERENCE CARD',14,22);

  ctx.fillStyle=labelColor;
  ctx.textAlign='right';
  ctx.fillText(label,W-14,22);

  var blurAmt=Math.min(3,round*0.35);
  if(flashCorrect<=0&&refIdx!==targetIdx){
    ctx.save();
    ctx.filter=blurAmt>0.5?'blur('+blurAmt+'px)':'none';
  }

  drawSkyline(
    skylinePoints(displayIdx),
    W*0.5,panelH*0.55,
    W*0.72,panelH*0.9,
    CITIES[displayIdx].color,
    2.5,
    flashCorrect>0?1:0.85
  );

  if(flashCorrect<=0&&refIdx!==targetIdx)ctx.restore();

  ctx.font='11px ui-monospace,Menlo,monospace';
  ctx.fillStyle=getCSS('--ink')||'#1a1a18';
  ctx.textAlign='center';
  ctx.fillText(CITIES[displayIdx].name.toUpperCase(),W*0.5,panelH+14);

  if(flashCorrect<=0&&round>=3){
    ctx.save();
    ctx.globalAlpha=0.18+Math.sin(fogPhase*2)*0.04;
    drawSkyline(
      skylinePoints(decoyIdx),
      W*0.5+Math.sin(fogPhase)*8,panelH*0.55,
      W*0.72,panelH*0.9,
      CITIES[decoyIdx].color,1.5,1
    );
    ctx.restore();
  }
}

function drawFog(){
  if(!ctx)return;
  var bands=5;
  for(var b=0;b<bands;b++){
    var y=H*0.12+b*(H*0.14)+Math.sin(fogPhase+b*1.3)*12;
    var g=ctx.createLinearGradient(0,y-30,0,y+30);
    g.addColorStop(0,'rgba(180,190,200,0)');
    g.addColorStop(0.5,'rgba(180,190,200,'+(0.04+b*0.012)+')');
    g.addColorStop(1,'rgba(180,190,200,0)');
    ctx.fillStyle=g;
    ctx.fillRect(0,y-30,W,60);
  }
}

function drawDecoyMedal(){
  if(round<2||roundResult||flashCorrect>0)return;
  var pw=W*0.78,ph=H*0.14;
  ctx.save();
  ctx.globalAlpha=0.14+round*0.025;
  ctx.translate(Math.sin(fogPhase*1.5)*6,0);
  drawSkyline(skylinePoints(decoyIdx),W*0.5,medalY,pw,ph,getCSS('--muted')||'#6b6860',1.2,1);
  ctx.restore();
}

function drawPress(){
  var px=W*0.5, py=pressY;
  var pw=W*0.55, ph=H*0.07;
  ctx.fillStyle=getCSS('--muted')||'#6b6860';
  ctx.globalAlpha=0.5;
  ctx.fillRect(px-pw*0.5,py, pw,ph);
  ctx.globalAlpha=1;
  ctx.fillStyle=getCSS('--ink')||'#1a1a18';
  ctx.fillRect(px-pw*0.4,py+ph, pw*0.8,ph*0.35);
  ctx.font='9px ui-monospace,Menlo,monospace';
  ctx.fillStyle=getCSS('--surface')||'#f5f2eb';
  ctx.textAlign='center';
  ctx.fillText('STAMP PRESS',px,py+ph*0.65);
}

function drawTraceProgress(){
  var barW=W*0.6, barH=4, bx=(W-barW)/2, by=H*0.44;
  ctx.fillStyle=getCSS('--muted')||'#6b6860';
  ctx.globalAlpha=0.2;
  ctx.fillRect(bx,by,barW,barH);
  ctx.globalAlpha=1;
  var col=getCSS('--accent')||'#2d6a4f';
  if(traceProgress>0.5)col=getCSS('--foil')||'#c4a035';
  ctx.fillStyle=col;
  ctx.fillRect(bx,by,barW*Math.min(1,traceProgress),barH);
  ctx.font='9px ui-monospace,Menlo,monospace';
  ctx.fillStyle=getCSS('--muted')||'#6b6860';
  ctx.textAlign='center';
  ctx.fillText('TRACE '+Math.round(traceProgress*100)+'%',W*0.5,by-6);
}

function drawTraceStroke(){
  if(tracePoints.length<2||!ctx)return;
  ctx.save();
  ctx.strokeStyle=getCSS('--accent')||'#2d6a4f';
  ctx.lineWidth=4;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.globalAlpha=0.7;
  ctx.beginPath();
  ctx.moveTo(tracePoints[0][0],tracePoints[0][1]);
  for(var i=1;i<tracePoints.length;i++){
    ctx.lineTo(tracePoints[i][0],tracePoints[i][1]);
  }
  ctx.stroke();
  ctx.restore();
}

function drawGhostPath(){
  if(roundResult||!ctx)return;
  var pw=W*0.78,ph=H*0.14;
  var cx=W*0.5;
  ctx.save();
  ctx.globalAlpha=0.12+Math.sin(Date.now()*0.004)*0.04;
  drawSkyline(skylinePoints(targetIdx),cx,medalY,pw,ph,getCSS('--ink'),1.5,1);
  ctx.restore();
}

function draw(){
  if(!ctx){
    if(canvas){
      canvas.style.background=getCSS('--bg')||'#e8e4dc';
    }
    return;
  }

  var sx=shake>0?(Math.random()-0.5)*shake:0;
  var sy=shake>0?(Math.random()-0.5)*shake:0;
  ctx.save();
  ctx.translate(sx,sy);

  ctx.fillStyle=getCSS('--bg')||'#e8e4dc';
  ctx.fillRect(-10,-10,W+20,H+20);

  if(state==='title'||state==='over'){
    drawConveyor(H*0.65);
    drawMedal(W*0.5,H*0.5,Math.min(W,H)*0.22);
    drawSkyline(skylinePoints(0),W*0.5,H*0.5,W*0.5,H*0.08,getCSS('--ink'),2,0.3);
    ctx.restore();
    return;
  }

  drawReferencePanel();
  drawFog();
  drawConveyor(H*0.72);
  drawPress();
  drawMedal(W*0.5,medalY,Math.min(W,H)*0.24);

  rebuildPathCache();
  drawDecoyMedal();
  drawGhostPath();
  drawSkyline(
    skylinePoints(targetIdx),
    W*0.5,medalY,
    W*0.78,H*0.14,
    getCSS('--ink')||'#1a1a18',
    2.5,1
  );

  drawTraceStroke();
  drawTraceProgress();

  for(var s=0;s<sparks.length;s++){
    var sp=sparks[s];
    ctx.globalAlpha=sp.life/sp.max;
    ctx.fillStyle=getCSS('--foil-light')||'#e8d078';
    ctx.beginPath();
    ctx.arc(sp.x,sp.y,sp.r,0,Math.PI*2);
    ctx.fill();
  }

  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  if(roundResult==='success'){
    ctx.font='600 14px ui-monospace,Menlo,monospace';
    ctx.fillStyle=getCSS('--foil')||'#c4a035';
    ctx.textAlign='center';
    ctx.fillText('PERFECT STAMP',W*0.5,H*0.62);
  }

  ctx.font='10px ui-monospace,Menlo,monospace';
  ctx.fillStyle=getCSS('--muted')||'#6b6860';
  ctx.textAlign='center';
  var hint=flashCorrect>0
    ?'Memorize '+CITIES[targetIdx].name+' — then trace from memory'
    :('Round '+round+' · Drag along the embossed medal outline');
  ctx.fillText(hint,W*0.5,H*0.88);

  ctx.restore();
}

function loop(ts){
  if(!lastFrame)lastFrame=ts;
  var dt=Math.min(0.05,(ts-lastFrame)/1000);
  lastFrame=ts;
  update(dt);
  draw();
  animId=requestAnimationFrame(loop);
}

function bindEvents(){
  if(startBtn){
    startBtn.addEventListener('click',function(e){
      try{e.preventDefault();}catch(ex){}
      startGame();
    });
  }
  if(restartBtn){
    restartBtn.addEventListener('click',function(e){
      try{e.preventDefault();}catch(ex){}
      startGame();
    });
  }
  if(canvas){
    canvas.addEventListener('pointerdown',onPointerDown);
    canvas.addEventListener('pointermove',onPointerMove);
    canvas.addEventListener('pointerup',onPointerUp);
    canvas.addEventListener('pointercancel',onPointerUp);
    canvas.addEventListener('mousedown',onPointerDown);
    canvas.addEventListener('mousemove',onPointerMove);
    canvas.addEventListener('mouseup',onPointerUp);
    canvas.addEventListener('mouseleave',onPointerUp);
    canvas.addEventListener('touchstart',onPointerDown,{passive:false});
    canvas.addEventListener('touchmove',onPointerMove,{passive:false});
    canvas.addEventListener('touchend',onPointerUp,{passive:false});
    canvas.addEventListener('touchcancel',onPointerUp,{passive:false});
  }
  window.addEventListener('keydown',function(e){
    if(e.code==='Enter'||e.code==='Space'){
      try{e.preventDefault();}catch(ex){}
      if(state==='title')startGame();
      else if(state==='over')startGame();
    }
  });
  window.addEventListener('keyup',function(){});
  window.addEventListener('resize',resize);
}

function init(){
  resize();
  bindEvents();
  draw();
  animId=requestAnimationFrame(loop);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}

})();
</script>
</body>
</html>
