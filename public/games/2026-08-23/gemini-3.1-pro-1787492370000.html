<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peace Path</title>
<style>
  :root {
      --bg: #F3EFE6;
      --text: #2B2824;
      --accent: #CC0000;
      --start: #3465A4;
      --btn-bg: #2B2824;
      --btn-text: #F3EFE6;
  }
  @media (prefers-color-scheme: dark) {
      :root {
          --bg: #1F1D1B;
          --text: #E3DFD5;
          --accent: #EF2929;
          --start: #729FCF;
          --btn-bg: #E3DFD5;
          --btn-text: #1F1D1B;
      }
  }
  body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      overflow: hidden; touch-action: none; user-select: none;
      display: flex; justify-content: center;
  }
  #game-container {
      position: relative; width: 100%; max-width: 600px; height: 100dvh;
  }
  canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
  }
  .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      padding: 20px; box-sizing: border-box;
      z-index: 10;
  }
  .hidden { display: none !important; }
  h1 { font-size: 42px; font-weight: bold; margin-bottom: 10px; letter-spacing: -2px; text-shadow: 0 0 10px var(--bg), 0 0 20px var(--bg); }
  h2 { font-size: 28px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 10px var(--bg), 0 0 20px var(--bg); }
  p { margin-bottom: 30px; font-size: 16px; opacity: 0.95; max-width: 300px; line-height: 1.5; font-weight: bold; text-shadow: 0 0 5px var(--bg), 0 0 10px var(--bg); }
  button {
      pointer-events: auto; background: var(--btn-bg); color: var(--btn-text);
      border: none; padding: 18px 36px; font-size: 18px; font-family: inherit;
      border-radius: 8px; cursor: pointer; text-transform: uppercase;
      font-weight: bold; letter-spacing: 1px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active { transform: translateY(6px); box-shadow: none; }
  #hud {
      position: absolute; top: env(safe-area-inset-top, 10px); left: 0; width: 100%;
      padding: 20px; box-sizing: border-box; display: flex;
      justify-content: space-between; pointer-events: none;
      font-size: 20px; font-weight: bold; z-index: 5;
      text-shadow: 0 0 5px var(--bg), 0 0 10px var(--bg);
  }
</style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>
    <div id="hud" class="hidden">
        <div id="hud-level">LVL 1</div>
        <div id="hud-time">20s</div>
    </div>
    <div id="ui-title" class="overlay">
        <h1>Peace Path</h1>
        <p>Drag to draw.<br>Release to commit.<br><br>Rogue agents will pull your line off course. Release before they force you to crash.</p>
        <button id="btn-start" data-smoke="start">Start</button>
    </div>
    <div id="ui-over" class="overlay hidden">
        <h2 id="over-reason">Treaty Broken</h2>
        <p id="over-score">You reached Level 1</p>
        <button id="btn-restart" data-smoke="restart">Play Again</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
let rect, dpr, cellSize, cols = 11, rows, startX, startY, endX, endY;
let isInitialized = false;

let state = 'TITLE'; 
let level = 1;
let time = 20.0;
let hasStartedMoving = false;
let isHolding = false;
let touchPos = { x: 0, y: 0 };
let lastFrameTime = 0;

let path = [];
let agents = [];
let obstacles = [];

let playerMoveTimer = 0;
const playerMoveInterval = 100;
let agentSpeed = 300;

let isDark = false;
let c_bg, c_ink, c_start, c_end, c_obs, c_danger, c_obs_bg;

function updateColors() {
    isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    c_bg = isDark ? '#1F1D1B' : '#F3EFE6';
    c_ink = isDark ? '#E3DFD5' : '#2B2824';
    c_start = isDark ? '#729FCF' : '#3465A4';
    c_end = isDark ? '#EF2929' : '#CC0000';
    c_obs = isDark ? '#383531' : '#D3CFC6';
    c_danger = isDark ? '#EF2929' : '#CC0000';
    c_obs_bg = isDark ? '#25221F' : '#EAE6DD';
}
if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
}
updateColors();

function vibrate(pattern) {
    if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch(e){}
    }
}

function resize() {
    rect = canvas.parentElement.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    cellSize = rect.width / cols;
    let newRows = Math.floor(rect.height / cellSize);
    
    if (!isInitialized) {
        rows = newRows;
        startY = rows - 2;
        startX = Math.floor(cols / 2);
        endY = 1;
        endX = Math.floor(cols / 2);
        isInitialized = true;
    }
}
window.addEventListener('resize', resize);
resize();

function getCenter(gx, gy) {
    return {
        x: gx * cellSize + cellSize / 2 + (Math.random()-0.5)*cellSize*0.2,
        y: gy * cellSize + cellSize / 2 + (Math.random()-0.5)*cellSize*0.2
    };
}

function isSafeZone(gx, gy) {
    if (Math.abs(gx - startX) <= 1 && Math.abs(gy - startY) <= 1) return true;
    if (Math.abs(gx - endX) <= 1 && Math.abs(gy - endY) <= 1) return true;
    return false;
}

function hasPathBFS() {
    let q = [{x: startX, y: startY}];
    let visited = Array(cols).fill(0).map(() => Array(rows).fill(false));
    visited[startX][startY] = true;
    
    let dirs = [ {dx:1, dy:0}, {dx:-1, dy:0}, {dx:0, dy:1}, {dx:0, dy:-1} ];
    while(q.length > 0) {
        let curr = q.shift();
        if (curr.x === endX && curr.y === endY) return true;
        
        for (let d of dirs) {
            let nx = curr.x + d.dx;
            let ny = curr.y + d.dy;
            if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && !visited[nx][ny]) {
                if (!obstacles.some(o => o.x === nx && o.y === ny)) {
                    visited[nx][ny] = true;
                    q.push({x: nx, y: ny});
                }
            }
        }
    }
    return false;
}

function generateLevel() {
    path = [];
    agents = [];
    obstacles = [];
    
    let obsCount = Math.min(25, 3 + level * 2);
    let attempts = 0;
    while (obstacles.length < obsCount && attempts < 100) {
        attempts++;
        let x = Math.floor(Math.random() * cols);
        let y = Math.floor(Math.random() * (rows - 4)) + 2; 
        if (isSafeZone(x, y) || obstacles.some(o => o.x === x && o.y === y)) continue;
        
        obstacles.push({x, y});
        if (!hasPathBFS()) obstacles.pop();
    }
    
    let agCount = 1 + Math.floor(level / 2);
    let dirs = [ {dx:1, dy:0}, {dx:-1, dy:0}, {dx:0, dy:1}, {dx:0, dy:-1} ];
    for (let i = 0; i < agCount; i++) {
        let ax, ay, valid = false;
        while (!valid) {
            ax = Math.floor(Math.random() * cols);
            ay = Math.floor(Math.random() * (rows - 4)) + 2;
            if (!isSafeZone(ax, ay) && !obstacles.some(o => o.x === ax && o.y === ay) && !agents.some(a => a.x === ax && a.y === ay)) {
                valid = true;
            }
        }
        let dir = dirs[Math.floor(Math.random() * dirs.length)];
        agents.push({x: ax, y: ay, dx: dir.dx, dy: dir.dy, timer: 0});
    }
    
    path.push({
        gridX: startX, gridY: startY,
        sx: getCenter(startX, startY).x,
        sy: getCenter(startX, startY).y
    });
    
    playerMoveTimer = 0;
    isHolding = false;
    hasStartedMoving = false;
    agentSpeed = Math.max(120, 350 - level * 20);
}

function winLevel() {
    vibrate(100);
    level++;
    time += 8.0;
    if (time > 30) time = 30;
    generateLevel();
    updateHUD();
}

function gameOver(reason) {
    vibrate([50, 50, 50]);
    state = 'OVER';
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('ui-over').classList.remove('hidden');
    document.getElementById('over-reason').innerText = reason;
    document.getElementById('over-score').innerText = `You reached Level ${level}`;
}

function startGame() {
    state = 'PLAY';
    level = 1;
    time = 20.0;
    generateLevel();
    document.getElementById('ui-title').classList.add('hidden');
    document.getElementById('ui-over').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    updateHUD();
    lastFrameTime = performance.now();
    requestAnimationFrame(loop);
}

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

function updateHUD() {
    document.getElementById('hud-level').innerText = `LVL ${level}`;
    document.getElementById('hud-time').innerText = Math.ceil(time) + 's';
}

function updateTouch(e) {
    if (state !== 'PLAY') return;
    let clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
    let clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
    if (clientX !== undefined) {
        touchPos = { x: clientX - rect.left, y: clientY - rect.top };
    }
}

function handlePointerDown(e) {
    if (e.target.tagName === 'BUTTON') return;
    if (state === 'PLAY') {
        isHolding = true;
        hasStartedMoving = true;
        updateTouch(e);
        playerMoveTimer = playerMoveInterval;
    }
}

function handlePointerUp(e) {
    if (e.touches && e.touches.length > 0) return;
    isHolding = false;
}

window.addEventListener('touchstart', handlePointerDown, {passive: false});
window.addEventListener('touchmove', e => {
    if (state === 'PLAY' && isHolding) { updateTouch(e); e.preventDefault(); }
}, {passive: false});
window.addEventListener('touchend', handlePointerUp);
window.addEventListener('touchcancel', handlePointerUp);

window.addEventListener('mousedown', handlePointerDown);
window.addEventListener('mousemove', e => { if (state === 'PLAY' && isHolding) updateTouch(e); });
window.addEventListener('mouseup', handlePointerUp);
window.addEventListener('mouseleave', handlePointerUp);
window.addEventListener('blur', handlePointerUp);

function getCrashReason(gx, gy) {
    if (gx < 0 || gx >= cols || gy < 0 || gy >= rows) return "WALL";
    if (obstacles.some(o => o.x === gx && o.y === gy)) return "OBSTACLE";
    if (path.some(p => p.gridX === gx && p.gridY === gy)) return "OWN PATH";
    if (agents.some(a => a.x === gx && a.y === gy)) return "AGENT";
    return null;
}

function addToPath(gx, gy) {
    path.push({
        gridX: gx, gridY: gy,
        sx: getCenter(gx, gy).x,
        sy: getCenter(gx, gy).y
    });
    if (gx === endX && gy === endY) winLevel();
}

function updatePlayer(dt) {
    if (!isHolding) return;
    
    playerMoveTimer += dt;
    if (playerMoveTimer >= playerMoveInterval) {
        playerMoveTimer = 0;
        
        let targetGridX = Math.floor(touchPos.x / cellSize);
        let targetGridY = Math.floor(touchPos.y / cellSize);
        
        let tip = path[path.length - 1];
        
        let hijackedBy = null;
        let minD = Infinity;
        for (let a of agents) {
            let d = Math.abs(a.x - tip.gridX) + Math.abs(a.y - tip.gridY);
            if (d <= 3 && d < minD) {
                minD = d;
                hijackedBy = a;
            }
        }
        
        let stepX = 0, stepY = 0;
        let isHijacked = false;
        
        if (hijackedBy) {
            isHijacked = true;
            let dx = hijackedBy.x - tip.gridX;
            let dy = hijackedBy.y - tip.gridY;
            if (Math.abs(dx) > Math.abs(dy)) stepX = Math.sign(dx);
            else stepY = Math.sign(dy);
            if (stepX === 0 && stepY === 0) stepX = 1; 
        } else {
            let dx = targetGridX - tip.gridX;
            let dy = targetGridY - tip.gridY;
            let absDx = Math.abs(dx);
            let absDy = Math.abs(dy);
            
            if (absDx === 0 && absDy === 0) return;
            if (absDx > absDy) stepX = Math.sign(dx);
            else if (absDy > absDx) stepY = Math.sign(dy);
            else stepX = Math.sign(dx);
        }
        
        if (stepX !== 0 || stepY !== 0) {
            let nextX = tip.gridX + stepX;
            let nextY = tip.gridY + stepY;
            let crash = getCrashReason(nextX, nextY);
            
            if (isHijacked) {
                if (crash) gameOver(crash + " COLLISION!");
                else { addToPath(nextX, nextY); vibrate(15); }
            } else {
                if (crash) {
                    let altX = 0, altY = 0;
                    let dx = targetGridX - tip.gridX;
                    let dy = targetGridY - tip.gridY;
                    if (stepX !== 0 && dy !== 0) altY = Math.sign(dy);
                    else if (stepY !== 0 && dx !== 0) altX = Math.sign(dx);
                    
                    if (altX !== 0 || altY !== 0) {
                        let altNextX = tip.gridX + altX;
                        let altNextY = tip.gridY + altY;
                        if (!getCrashReason(altNextX, altNextY)) {
                            addToPath(altNextX, altNextY);
                        }
                    }
                } else {
                    addToPath(nextX, nextY);
                }
            }
        }
    }
}

function isAgentBlocked(gx, gy) {
    if (gx < 0 || gx >= cols || gy < 0 || gy >= rows) return true;
    if (obstacles.some(o => o.x === gx && o.y === gy)) return true;
    if (isSafeZone(gx, gy)) return true;
    let maxIdx = isHolding ? path.length - 1 : path.length;
    for (let i = 0; i < maxIdx; i++) {
        if (path[i].gridX === gx && path[i].gridY === gy) return true;
    }
    return false;
}

function updateAgents(dt) {
    for (let a of agents) {
        a.timer += dt;
        if (a.timer >= agentSpeed) {
            a.timer -= agentSpeed;
            
            let nextX = a.x + a.dx;
            let nextY = a.y + a.dy;
            
            if (isAgentBlocked(nextX, nextY)) {
                let dirs = [ {dx:1, dy:0}, {dx:-1, dy:0}, {dx:0, dy:1}, {dx:0, dy:-1} ];
                let valid = dirs.filter(d => !isAgentBlocked(a.x + d.dx, a.y + d.dy));
                if (valid.length > 0) {
                    let pick = valid[Math.floor(Math.random() * valid.length)];
                    a.dx = pick.dx;
                    a.dy = pick.dy;
                }
            } else {
                a.x = nextX;
                a.y = nextY;
            }
            
            let tip = path[path.length - 1];
            if (a.x === tip.gridX && a.y === tip.gridY) {
                gameOver("AGENT CAUGHT YOU");
                return;
            }
        }
    }
}

function drawSeal(gx, gy, color) {
    ctx.fillStyle = color;
    let cx = gx * cellSize + cellSize/2;
    let cy = gy * cellSize + cellSize/2;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
        let ang = (i / 16) * Math.PI * 2;
        let r = cellSize * 0.4 + (i%2===0 ? cellSize*0.06 : 0);
        ctx.lineTo(cx + Math.cos(ang)*r, cy + Math.sin(ang)*r);
    }
    ctx.fill();
    ctx.strokeStyle = c_bg;
    ctx.lineWidth = Math.max(2, cellSize * 0.05);
    ctx.beginPath();
    ctx.arc(cx, cy, cellSize * 0.25, 0, Math.PI*2);
    ctx.stroke();
}

function draw() {
    ctx.save();
    ctx.scale(dpr, dpr);
    
    ctx.fillStyle = c_bg;
    ctx.fillRect(0, 0, rect.width, rect.height);
    
    // Draw obstacles (Crosshatch)
    for (let o of obstacles) {
        let ox = o.x * cellSize;
        let oy = o.y * cellSize;
        ctx.fillStyle = c_obs_bg;
        ctx.fillRect(ox + 2, oy + 2, cellSize - 4, cellSize - 4);
        ctx.strokeStyle = c_obs;
        ctx.lineWidth = 2;
        ctx.lineCap = 'butt';
        ctx.beginPath();
        for (let i = 0; i < cellSize; i += 6) {
            ctx.moveTo(ox + i, oy);
            ctx.lineTo(ox, oy + i);
            ctx.moveTo(ox + cellSize, oy + i);
            ctx.lineTo(ox + i, oy + cellSize);
        }
        ctx.stroke();
    }
    
    drawSeal(startX, startY, c_start);
    drawSeal(endX, endY, c_end);
    
    if (path.length > 0) {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        ctx.strokeStyle = isDark ? 'rgba(227,223,213,0.15)' : 'rgba(43,40,36,0.15)';
        ctx.lineWidth = cellSize * 0.5;
        ctx.beginPath();
        ctx.moveTo(path[0].sx, path[0].sy);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].sx, path[i].sy);
        ctx.stroke();

        ctx.strokeStyle = c_ink;
        ctx.lineWidth = cellSize * 0.25;
        ctx.beginPath();
        ctx.moveTo(path[0].sx, path[0].sy);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].sx, path[i].sy);
        ctx.stroke();
        
        let tip = path[path.length - 1];
        let hijackedBy = null;
        if (state === 'PLAY') {
            let minD = Infinity;
            for (let a of agents) {
                let d = Math.abs(a.x - tip.gridX) + Math.abs(a.y - tip.gridY);
                if (d <= 3 && d < minD) {
                    minD = d; hijackedBy = a;
                }
            }
        }
        
        if (hijackedBy && isHolding) {
            ctx.strokeStyle = c_danger;
            ctx.lineWidth = Math.max(2, cellSize * 0.08);
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(tip.sx, tip.sy);
            ctx.lineTo(hijackedBy.x * cellSize + cellSize/2, hijackedBy.y * cellSize + cellSize/2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = c_danger;
        } else {
            ctx.fillStyle = c_ink;
        }
        
        let pulse = isHolding ? (Math.sin(Date.now() / 80) * 0.15 + 1) : 1;
        ctx.beginPath();
        ctx.arc(tip.sx, tip.sy, cellSize * 0.2 * pulse, 0, Math.PI*2);
        ctx.fill();
    }
    
    ctx.fillStyle = c_danger;
    ctx.strokeStyle = c_danger;
    for (let a of agents) {
        let cx = a.x * cellSize + cellSize/2 + (Math.random()-0.5) * cellSize * 0.1;
        let cy = a.y * cellSize + cellSize/2 + (Math.random()-0.5) * cellSize * 0.1;
        
        ctx.beginPath();
        ctx.arc(cx, cy, cellSize * 0.25, 0, Math.PI*2);
        ctx.fill();
        
        ctx.lineWidth = 2;
        for (let j = 0; j < 5; j++) {
            let ang = Math.random() * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(ang) * cellSize * 0.45, cy + Math.sin(ang) * cellSize * 0.45);
            ctx.stroke();
        }
    }
    
    ctx.restore();
}

function loop(now) {
    if (state === 'PLAY') {
        let dt = now - lastFrameTime;
        lastFrameTime = now;
        if (dt > 100) dt = 100;
        
        if (hasStartedMoving) {
            time -= dt / 1000;
            if (time <= 0) gameOver("TIME'S UP!");
        }
        
        updatePlayer(dt);
        if (hasStartedMoving) updateAgents(dt);
        
        draw();
        updateHUD();
        requestAnimationFrame(loop);
    } else {
        draw(); // One last draw
    }
}

// Initial decorative background
generateLevel();
draw();

</script>
</body>
</html>
