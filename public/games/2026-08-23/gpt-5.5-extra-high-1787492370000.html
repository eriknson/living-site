<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phosphor Decompile</title>
<style>
:root{
  color-scheme:dark light;
  --bg:#050b08;
  --ink:#dcffe9;
  --muted:#83b899;
  --grid:rgba(74,255,145,.13);
  --panel:rgba(5,17,11,.78);
  --edge:rgba(110,255,170,.38);
  --good:#48ff94;
  --good2:#98ffbf;
  --amber:#ffd166;
  --bad:#ff654f;
  --shadow:rgba(0,0,0,.42);
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#edf5ea;
    --ink:#102419;
    --muted:#53705e;
    --grid:rgba(5,122,64,.14);
    --panel:rgba(246,255,246,.82);
    --edge:rgba(5,122,64,.34);
    --good:#067d43;
    --good2:#17a45c;
    --amber:#a85c00;
    --bad:#c63f30;
    --shadow:rgba(23,54,31,.18);
  }
}
*{box-sizing:border-box}
html,body{margin:0;width:100dvw;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:relative;width:100dvw;height:100dvh;min-height:100dvh;overflow:hidden;background:
  radial-gradient(circle at 50% 27%, rgba(72,255,148,.17), transparent 31%),
  linear-gradient(180deg, rgba(255,209,102,.05), transparent 28%),
  var(--bg);
  user-select:none;-webkit-user-select:none}
canvas{display:block;width:100dvw;height:100dvh;touch-action:none}
#hud{position:absolute;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#hud strong{display:block;margin-top:5px;color:var(--ink);font-size:18px;letter-spacing:.03em}
.pill{min-width:78px;padding:10px 12px;border:1px solid var(--edge);border-radius:16px;background:color-mix(in srgb,var(--panel) 84%,transparent);box-shadow:0 14px 40px var(--shadow);backdrop-filter:blur(12px)}
.pill:nth-child(2){text-align:center}.pill:nth-child(3){text-align:right}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.overlay.hidden{opacity:0;transform:scale(.985);visibility:hidden}
.card{width:min(430px,calc(100dvw - 36px));padding:24px 22px 22px;border:1px solid var(--edge);border-radius:28px;background:var(--panel);box-shadow:0 28px 90px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.04);backdrop-filter:blur(18px);text-align:left;pointer-events:none}
.kicker{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--good);margin-bottom:12px}
h1{margin:0 0 10px;font-size:clamp(34px,10vw,58px);line-height:.92;letter-spacing:-.07em}
p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.45}
.brief{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 20px;font:12px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.brief span{border:1px solid var(--edge);border-radius:14px;padding:10px;background:rgba(72,255,148,.05)}
button{appearance:none;border:0;border-radius:999px;min-height:52px;min-width:160px;padding:0 22px;background:var(--good);color:var(--bg);font:800 14px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 10px 34px rgba(72,255,148,.28);cursor:pointer;pointer-events:auto}
button:focus-visible{outline:3px solid var(--amber);outline-offset:4px}
#over .card{text-align:center}
#verdict{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--amber);letter-spacing:.16em;text-transform:uppercase}
#finalScore{font:46px/1 ui-monospace,SFMono-Regular,Menlo,monospace;margin:6px 0 12px;color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Phosphor Decompile game area"></canvas>
  <div id="hud" aria-live="polite">
    <div class="pill">Layer<strong id="layerText">0/6</strong></div>
    <div class="pill">Time<strong id="timeText">50.0</strong></div>
    <div class="pill">Score<strong id="scoreText">0</strong></div>
  </div>
  <section id="title" class="overlay">
    <div class="card">
      <div class="kicker">Overcast chip lab // 13 C</div>
      <h1>Phosphor Decompile</h1>
      <p>Tap the code fragment that matches the lit socket. Correct fits peel back the chip. Wrong fits burn the clock.</p>
      <div class="brief">
        <span>Tap cards</span><span>Match socket</span><span>Decoys multiply</span><span>Beat the bleed</span>
      </div>
      <button data-smoke="start" id="startBtn" type="button">Begin Decompile</button>
    </div>
  </section>
  <section id="over" class="overlay hidden">
    <div class="card">
      <div id="verdict">Signal Lost</div>
      <div id="finalScore">0</div>
      <p id="overCopy">The glass fogged before the final layer unlocked.</p>
      <button data-smoke="restart" id="restartBtn" type="button">Run Again</button>
    </div>
  </section>
</div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas&&canvas.getContext?canvas.getContext("2d"):null;
const title=$("title"),over=$("over"),startBtn=$("startBtn"),restartBtn=$("restartBtn");
const layerText=$("layerText"),timeText=$("timeText"),scoreText=$("scoreText"),verdict=$("verdict"),finalScore=$("finalScore"),overCopy=$("overCopy");
let W=1,H=1,DPR=1,last=performance.now(),state="title",audio=null;
let level=0,slotIndex=0,score=0,combo=0,timeLeft=50,bleed=1,shake=0,cascade=0,won=false,selected=0;
let slots=[],frags=[],particles=[],fog=0,flash=0;
const levels=[
  ["INIT","CLOCK","PORT"],
  ["STACK","TRACE","TOKEN"],
  ["CACHE","VECTOR","PATCH","GATE"],
  ["KERNEL","MIRROR","SIGNAL","BRIDGE"],
  ["SHARD","ROUTE","MASK","ANCHOR","UNROLL"],
  ["CHIPSET","DECODE","VERIFY","UPLINK","SUNRISE"]
];
const decoys=["1NIT","CL0CK","P0RT","STAK","TR4CE","T0KEN","C4CHE","VECT0R","PATCH?","G8TE","KERNAL","M1RROR","SIGMA","BR1DGE","MASK?","ANCH0R","UNR0LL","DECOY","VERIFY?","UPL1NK"];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()||"#fff"}
function resize(){
  const r=canvas.getBoundingClientRect();
  W=Math.max(1,r.width);H=Math.max(1,r.height);DPR=clamp(window.devicePixelRatio||1,1,2);
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  if(ctx)ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function makeLevel(){
  const codes=levels[level]||levels[levels.length-1];
  slotIndex=0;cascade=0;selected=0;slots=codes.map((code,i)=>({code,i,filled:false,pulse:0}));
  const pool=codes.map(code=>({code,decoy:false,used:false,spin:(level>1?Math.random()*1.2-.6:0)}));
  const need=Math.min(3,Math.max(0,level));
  const used=new Set(codes);
  for(let i=0;i<decoys.length&&pool.length<codes.length+need;i++){
    const code=decoys[(i+level*3)%decoys.length];
    if(!used.has(code)){used.add(code);pool.push({code,decoy:true,used:false,spin:(Math.random()*1.8-.9)})}
  }
  frags=shuffle(pool);
  layout();
}
function layout(){
  if(!slots.length&&!frags.length)return;
  const cx=W/2,cy=H*.36,rad=Math.min(W,H)*.205;
  slots.forEach((s,i)=>{
    const n=slots.length,ang=-Math.PI/2+(i-(n-1)/2)*(Math.PI/(Math.max(4,n)-1));
    s.w=clamp(W*.31,92,132);s.h=42;s.x=cx+Math.cos(ang)*rad-s.w/2;s.y=cy+Math.sin(ang)*rad-s.h/2;
  });
  const cols=W>540?3:2,gap=10,rows=Math.ceil(frags.length/cols);
  const cardW=Math.min(150,(W-28-gap*(cols-1))/cols),cardH=46;
  const totalW=cardW*cols+gap*(cols-1),startX=(W-totalW)/2;
  const totalH=rows*cardH+gap*(rows-1),startY=Math.min(H-cardH-22,H*.66+(H*.31-totalH)/2);
  frags.forEach((f,i)=>{
    const col=i%cols,row=Math.floor(i/cols);
    f.w=cardW;f.h=cardH;f.x=startX+col*(cardW+gap);f.y=startY+row*(cardH+gap);
  });
}
function initAudio(){
  if(audio)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)audio=new AC();
  }catch(e){audio=null}
}
function tone(freq,dur,type,gain){
  try{
    if(!audio)return;
    const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain||.045,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}
function vibe(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function setScreen(next){
  state=next;
  title.classList.toggle("hidden",next!=="title");
  over.classList.toggle("hidden",next!=="over");
}
function startGame(){
  initAudio();level=0;score=0;combo=0;timeLeft=50;bleed=1;shake=0;won=false;particles=[];flash=0;makeLevel();setScreen("play");tone(220,.08,"triangle",.035);tone(440,.11,"triangle",.025);updateHud();
}
function endGame(ok){
  won=!!ok;setScreen("over");vibe(ok?35:70);tone(ok?660:130,.16,ok?"triangle":"sawtooth",.045);
  verdict.textContent=ok?"Chip Reconstructed":"Signal Lost";
  finalScore.textContent=String(Math.max(0,Math.round(score)));
  overCopy.textContent=ok?"Every layer peeled clean before the countdown collapsed.":"The glass fogged before the final layer unlocked.";
}
function updateHud(){
  layerText.textContent=(state==="title"?"0":Math.min(level+1,levels.length))+"/"+levels.length;
  timeText.textContent=Math.max(0,timeLeft).toFixed(1);
  scoreText.textContent=String(Math.max(0,Math.round(score)));
}
function activeFragCount(){return frags.filter(f=>!f.used).length}
function pick(f){
  if(state!=="play"||cascade>0||!f||f.used||!slots[slotIndex])return;
  const target=slots[slotIndex];
  if(f.code===target.code){
    f.used=true;target.filled=true;target.pulse=1;combo++;score+=90+level*25+combo*18+Math.ceil(timeLeft*.35);flash=.18;
    burst(target.x+target.w/2,target.y+target.h/2,css("--good"),18+combo*2);
    tone(330+combo*35,.055,"triangle",.035);vibe(12);slotIndex++;
    if(slotIndex>=slots.length){
      cascade=1.08;score+=260+level*85+combo*30;burst(W/2,H*.36,css("--amber"),54);tone(660,.12,"triangle",.04);
    }
  }else{
    combo=0;timeLeft-=2.7+level*.55;shake=.25;flash=.12;score=Math.max(0,score-35);
    burst(f.x+f.w/2,f.y+f.h/2,css("--bad"),14);tone(95,.12,"sawtooth",.035);vibe(35);
    f.spin+=Math.random()>.5?.7:-.7;
  }
  selected=clamp(selected,0,Math.max(0,activeFragCount()-1));updateHud();
}
function burst(x,y,color,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=40+Math.random()*170;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.45,max:.7,color,r:1+Math.random()*3});
  }
}
function cardAt(x,y){
  for(let i=frags.length-1;i>=0;i--){const f=frags[i];if(!f.used&&x>=f.x&&x<=f.x+f.w&&y>=f.y&&y<=f.y+f.h)return f}
  return null;
}
function pointer(e){
  if(e&&e.cancelable)e.preventDefault();
  if(state!=="play")return;
  const r=canvas.getBoundingClientRect(),x=(e.clientX||0)-r.left,y=(e.clientY||0)-r.top;
  const f=cardAt(x,y);
  if(f)pick(f);
}
function key(e){
  if(state!=="play")return;
  const live=frags.filter(f=>!f.used);
  if(!live.length)return;
  if(["ArrowRight","ArrowDown"].includes(e.key)){e.preventDefault();selected=(selected+1)%live.length}
  else if(["ArrowLeft","ArrowUp"].includes(e.key)){e.preventDefault();selected=(selected+live.length-1)%live.length}
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();pick(live[selected%live.length])}
}
function update(dt){
  fog+=dt*.18;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);
  particles=particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;return p.life>0});
  if(state!=="play")return;
  bleed=1+level*.08+(combo>4?.12:0);timeLeft-=dt*bleed;
  frags.forEach((f,i)=>{if(level>2&&!f.used)f.spin+=Math.sin(fog*2+i)*dt*.18});
  slots.forEach(s=>s.pulse=Math.max(0,s.pulse-dt*1.9));
  if(cascade>0){
    cascade-=dt;
    if(cascade<=0){
      level++;
      if(level>=levels.length)endGame(true);else makeLevel();
    }
  }
  if(timeLeft<=0&&state==="play")endGame(false);
  updateHud();
}
function drawBg(t){
  const bg=css("--bg"),grid=css("--grid"),good=css("--good");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*.32,20,W/2,H*.32,Math.max(W,H)*.62);
  g.addColorStop(0,flash>0?"rgba(255,209,102,.22)":"rgba(72,255,148,.13)");
  g.addColorStop(.58,"rgba(72,255,148,.025)");g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=grid;ctx.lineWidth=1;
  const step=28,off=(t*.018)%step;
  for(let x=-step+off;x<W+step;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=-step+off;y<H+step;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(let i=0;i<7;i++){
    const y=(Math.sin(fog+i)*.5+.5)*H*.72+H*.1;
    const grad=ctx.createLinearGradient(0,y-28,W,y+28);
    grad.addColorStop(0,"rgba(255,255,255,0)");grad.addColorStop(.5,"rgba(140,190,165,.045)");grad.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=grad;ctx.fillRect(0,y-22,W,44);
  }
  ctx.fillStyle=good;ctx.globalAlpha=.07;
  for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
  ctx.globalAlpha=1;
}
function drawChip(){
  const cx=W/2,cy=H*.36,size=clamp(Math.min(W,H)*.31,132,210),good=css("--good"),edge=css("--edge"),ink=css("--ink"),muted=css("--muted");
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*10*shake,(Math.random()-.5)*10*shake);
  ctx.shadowColor="rgba(72,255,148,.28)";ctx.shadowBlur=28;
  ctx.strokeStyle=edge;ctx.lineWidth=2;rr(ctx,cx-size/2,cy-size/2,size,size,22);ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle="rgba(72,255,148,.045)";rr(ctx,cx-size/2,cy-size/2,size,size,22);ctx.fill();
  for(let i=0;i<10;i++){
    const p=-size/2+i*size/9;
    ctx.strokeStyle="rgba(72,255,148,.12)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx-size/2,cy+p);ctx.lineTo(cx+size/2,cy+p);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+p,cy-size/2);ctx.lineTo(cx+p,cy+size/2);ctx.stroke();
  }
  const r=size*.23+cascade*28;
  ctx.strokeStyle=cascade>0?css("--amber"):good;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=ink;ctx.font="700 13px ui-monospace,Menlo,monospace";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(cascade>0?"PEELING":"LAYER "+(level+1),cx,cy-5);
  ctx.fillStyle=muted;ctx.font="11px ui-monospace,Menlo,monospace";ctx.fillText("FOG BUS ACTIVE",cx,cy+16);
  slots.forEach((s,i)=>{
    const active=i===slotIndex&&cascade<=0&&!s.filled;
    ctx.shadowBlur=active?18:0;ctx.shadowColor=good;
    ctx.fillStyle=s.filled?"rgba(72,255,148,.2)":active?"rgba(72,255,148,.13)":"rgba(0,0,0,.18)";
    ctx.strokeStyle=s.filled?good:active?css("--amber"):edge;ctx.lineWidth=active?2.5:1.4;
    rr(ctx,s.x,s.y,s.w,s.h,13);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    if(s.pulse>0){ctx.globalAlpha=s.pulse*.8;ctx.strokeStyle=good;ctx.lineWidth=3;rr(ctx,s.x-5*s.pulse,s.y-5*s.pulse,s.w+10*s.pulse,s.h+10*s.pulse,15);ctx.stroke();ctx.globalAlpha=1}
    ctx.fillStyle=s.filled?good:active?ink:muted;ctx.font="800 12px ui-monospace,Menlo,monospace";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(s.code,s.x+s.w/2,s.y+s.h/2);
  });
  ctx.restore();
}
function drawFragments(){
  const live=frags.filter(f=>!f.used),sel=live[selected%Math.max(1,live.length)];
  frags.forEach(f=>{
    if(f.used)return;
    const isSel=f===sel&&state==="play";
    ctx.save();ctx.translate(f.x+f.w/2,f.y+f.h/2);ctx.rotate(f.spin||0);
    ctx.shadowColor=isSel?"rgba(255,209,102,.42)":"rgba(72,255,148,.18)";ctx.shadowBlur=isSel?20:10;
    ctx.fillStyle=f.decoy?"rgba(255,101,79,.075)":"rgba(72,255,148,.095)";
    ctx.strokeStyle=isSel?css("--amber"):(f.decoy&&level>1?css("--bad"):css("--edge"));ctx.lineWidth=isSel?2.5:1.3;
    rr(ctx,-f.w/2,-f.h/2,f.w,f.h,15);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle=css("--ink");ctx.font="800 13px ui-monospace,Menlo,monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(f.code,0,1);
    ctx.restore();
  });
  if(state==="play"&&slots[slotIndex]){
    ctx.fillStyle=css("--muted");ctx.font="12px ui-monospace,Menlo,monospace";ctx.textAlign="center";
    ctx.fillText("Tap fragment for socket: "+slots[slotIndex].code,W/2,H*.62);
  }
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawIdleText(){
  if(state==="play")return;
  ctx.fillStyle=css("--muted");ctx.font="12px ui-monospace,Menlo,monospace";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("reverse-engineer unfamiliar code before the clock bleeds out",W/2,H*.84);
}
function render(t){
  if(!ctx)return;
  drawBg(t);drawChip();drawFragments();drawParticles();drawIdleText();
}
function loop(t){
  const dt=clamp((t-last)/1000,0,.05);last=t;update(dt);render(t);requestAnimationFrame(loop);
}
if(startBtn)startBtn.addEventListener("click",startGame);
if(restartBtn)restartBtn.addEventListener("click",startGame);
if(canvas){canvas.addEventListener("pointerdown",pointer,{passive:false})}
window.addEventListener("resize",resize);
window.addEventListener("keydown",key);
try{const mq=matchMedia("(prefers-color-scheme: dark)");if(mq&&mq.addEventListener)mq.addEventListener("change",()=>render(performance.now()))}catch(e){}
resize();makeLevel();setScreen("title");updateHud();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
