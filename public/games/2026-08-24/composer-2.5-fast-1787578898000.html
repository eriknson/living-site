<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backdoor Reel</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f0a;--surface:#111811;--ink:#b8ffb8;--muted:#4a7a4a;
  --phosphor:#39ff14;--dim:#1a3a1a;--danger:#ff4444;--warn:#ffaa00;
  --overlay:rgba(10,15,10,.88);--card:#141f14;--border:#2a4a2a;
  --btn-bg:#1a4a1a;--btn-ink:#b8ffb8;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#dce8dc;--surface:#c8d8c8;--ink:#0a2a0a;--muted:#3a6a3a;
    --phosphor:#1a8a1a;--dim:#a8c8a8;--danger:#cc2222;--warn:#aa7700;
    --overlay:rgba(220,232,220,.92);--card:#e8f0e8;--border:#8ab88a;
    --btn-bg:#2a6a2a;--btn-ink:#f0fff0;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);flex-shrink:0;border-bottom:1px solid var(--border);z-index:5}
header span{color:var(--phosphor);font-size:12px}
#stage{flex:1;position:relative;min-height:0}
#cv{display:block;width:100%;height:100%;touch-action:none;background:#000}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;z-index:10;transition:opacity .4s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.card{background:var(--overlay);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:14px;padding:26px 22px;max-width:340px;width:90%;
  text-align:center;pointer-events:auto}
.overlay h1{font-size:20px;font-weight:700;letter-spacing:.04em;line-height:1.25;margin-bottom:8px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;color:var(--phosphor)}
.overlay .sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:18px}
.overlay .hint{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:9px;
  color:var(--muted);letter-spacing:.06em;margin-bottom:16px;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:170px;
  padding:12px 24px;border:1px solid var(--phosphor);border-radius:8px;font-size:14px;font-weight:600;
  cursor:pointer;background:var(--btn-bg);color:var(--btn-ink);letter-spacing:.06em;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;pointer-events:auto;
  transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:scale(.95)}
.score-big{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:32px;
  color:var(--phosphor);margin:6px 0}
.score-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
#hudBar{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;display:flex;gap:8px;
  pointer-events:none;z-index:4}
.bar-wrap{flex:1;height:4px;background:var(--dim);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--phosphor);border-radius:2px;transition:width .2s}
.bar-fill.danger{background:var(--danger)}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  font-size:14px;color:var(--phosphor);opacity:0;pointer-events:none;z-index:8;letter-spacing:.1em;
  text-shadow:0 0 12px var(--phosphor);transition:opacity .15s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>FRAMES <span id="hClean">0</span>/30</div>
    <div>BREACH <span id="hBreach">0</span>/3</div>
    <div>TIME <span id="hTime">60</span></div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hudBar">
      <div class="bar-wrap"><div class="bar-fill" id="progBar" style="width:0%"></div></div>
    </div>
    <div id="toast"></div>
    <div id="titleOv" class="overlay">
      <div class="card">
        <h1>BACKDOOR REEL</h1>
        <p class="sub">Scrub the corrupted traffic-cam feed. Tap to freeze glitches before backdoor code loads.</p>
        <p class="hint">DRAG → SCRUB FRAMES · TAP → LOCK GLITCH<br>30 CLEAN FRAMES · 3 BREACHES MAX</p>
        <button class="btn" data-smoke="start" id="startBtn">LOAD REEL</button>
      </div>
    </div>
    <div id="endOv" class="overlay hidden">
      <div class="card">
        <h1 id="endTitle">REEL SECURED</h1>
        <p class="score-lbl">Frames patched</p>
        <div class="score-big" id="endScore">0</div>
        <p class="sub" id="endMsg">Backdoor contained.</p>
        <button class="btn" data-smoke="restart" id="restartBtn">REWIND REEL</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var cv=document.getElementById('cv');
var ctx=cv&&cv.getContext?cv.getContext('2d'):null;
var titleOv=document.getElementById('titleOv');
var endOv=document.getElementById('endOv');
var startBtn=document.getElementById('startBtn');
var restartBtn=document.getElementById('restartBtn');
var hClean=document.getElementById('hClean');
var hBreach=document.getElementById('hBreach');
var hTime=document.getElementById('hTime');
var progBar=document.getElementById('progBar');
var endTitle=document.getElementById('endTitle');
var endScore=document.getElementById('endScore');
var endMsg=document.getElementById('endMsg');
var toastEl=document.getElementById('toast');

var W=360,H=640,dpr=1;
var state='title';
var frameIdx=0,cleanCount=0,breachCount=0,timeLeft=60;
var reelLen=55;
var frames=[];
var glitchActive=false,glitchTimer=0,glitchMax=0,currentGlitchType=0;
var decoyFlash=0,decoyTimer=0;
var dragStartX=0,dragStartIdx=0,isDragging=false,ptrDown=false,ptrMoved=false;
var ptrDownX=0,ptrDownY=0,ptrDownT=0;
var particles=[],scanPhase=0,shakeAmt=0,flashCol=0;
var combo=0,bestCombo=0;
var scrollAcc=0,scrollRate=1.05,vhsWobble=0,hitPause=0;
var audioCtx=null,lastT=0,animId=0;
var isDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;

var PHOS=isDark?'#39ff14':'#1a8a1a';
var PHOS2=isDark?'#b8ffb8':'#0a4a0a';
var SKY=isDark?'#0a120a':'#b0c8b0';
var ROAD=isDark?'#0d180d':'#809080';
var LANE=isDark?'#1a3a1a':'#607060';
var FOG=isDark?'rgba(20,40,20,':'rgba(180,200,180,';
var HEX=['0xB4CK','D00R','LOAD','INJECT','ROOT','CAM04','PWN3D','SHELL','EXEC','0xFF'];

function seeded(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}

function initAudio(){
  try{if(!audioCtx&&window.AudioContext)audioCtx=new AudioContext();}catch(e){}
}

function beep(freq,dur,vol){
  if(!audioCtx)return;
  try{
    var o=audioCtx.createOscillator(),g=audioCtx.createOscillator?audioCtx.createGain():null;
    if(!g)return;
    o.type='square';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.08,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.08));
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+(dur||0.08));
  }catch(e){}
}

function showToast(txt){
  if(!toastEl)return;
  toastEl.textContent=txt;toastEl.classList.add('show');
  setTimeout(function(){toastEl.classList.remove('show');},600);
}

function buildFrames(){
  frames=[];
  var realGlitches=0;
  for(var i=0;i<reelLen;i++){
    var f={idx:i,cars:[],fog:seeded(i*3)*0.4+0.1,decoyDone:false};
    var nc=Math.floor(seeded(i*7)*3)+1;
    for(var c=0;c<nc;c++){
      f.cars.push({x:seeded(i*11+c*3),lane:Math.floor(seeded(i*13+c)*3),spd:seeded(i*17+c)*0.3+0.1});
    }
    var prog=i/reelLen;
    var glitchChance=0.28+prog*0.42;
    f.hasGlitch=seeded(i*23)>1-glitchChance;
    if(f.hasGlitch)realGlitches++;
    f.isDecoy=!f.hasGlitch&&seeded(i*29)>0.78-prog*0.12;
    f.glitchType=Math.floor(seeded(i*31)*4);
    f.patched=false;f.skipped=false;
    frames.push(f);
  }
  if(realGlitches<32){
    for(var j=0;j<reelLen&&realGlitches<32;j++){
      if(!frames[j].hasGlitch&&!frames[j].isDecoy){
        frames[j].hasGlitch=true;realGlitches++;
      }
    }
  }
}

function resize(){
  if(!cv)return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  var r=cv.parentElement?cv.parentElement.getBoundingClientRect():{width:360,height:640};
  W=Math.max(1,Math.floor(r.width));
  H=Math.max(1,Math.floor(r.height));
  cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
  cv.style.width=W+'px';cv.style.height=H+'px';
  if(ctx){ctx.setTransform(dpr,0,0,dpr,0,0);}
}

function drawScene(f,t,glitchAmt){
  if(!ctx)return;
  var gA=glitchAmt||0;
  ctx.fillStyle=SKY;ctx.fillRect(0,0,W,H);
  var fogY=H*0.15;
  for(var fi=0;fi<4;fi++){
    var fa=f.fog*(0.6+fi*0.1);
    ctx.fillStyle=FOG+fa+')';
    ctx.fillRect(0,fogY+fi*H*0.06,W,H*0.12);
  }
  ctx.fillStyle=isDark?'#0a1a0a':'#708070';
  ctx.fillRect(0,H*0.38,W,H*0.62);
  ctx.fillStyle=ROAD;ctx.fillRect(0,H*0.42,W,H*0.58);
  for(var ln=0;ln<3;ln++){
    var ly=H*(0.52+ln*0.14);
    ctx.strokeStyle=LANE;ctx.lineWidth=1;ctx.setLineDash([12,18]);
    ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly);ctx.stroke();
    ctx.setLineDash([]);
  }
  if(f.cars){
    for(var ci=0;ci<f.cars.length;ci++){
      var car=f.cars[ci];
      var cx=((car.x+t*car.spd*0.15) %1.3-0.15)*W;
      var cy=H*(0.48+car.lane*0.14);
      ctx.fillStyle=isDark?'#1a4a1a':'#506050';
      ctx.fillRect(cx,cy,W*0.08,H*0.05);
      ctx.fillStyle=PHOS;ctx.globalAlpha=0.3;
      ctx.fillRect(cx+W*0.01,cy+H*0.01,W*0.06,H*0.015);
      ctx.globalAlpha=1;
    }
  }
  ctx.font='10px ui-monospace,monospace';ctx.fillStyle=PHOS2;ctx.globalAlpha=0.7;
  ctx.fillText('CAM-04 · HWY-101 · SF',8,16);
  var d=new Date(2026,7,24,19,42,Math.floor(t*10)%60);
  ctx.fillText(d.toISOString().slice(0,19).replace('T',' '),8,28);
  ctx.globalAlpha=1;
  ctx.strokeStyle=PHOS;ctx.lineWidth=2;ctx.strokeRect(2,2,W-4,H-4);
  if(gA>0)drawGlitch(gA,f);
}

function drawGlitch(amt,f){
  if(!ctx||amt<=0)return;
  var gt=f?f.glitchType:0;
  ctx.globalAlpha=amt;
  if(gt===0||gt===2){
    for(var b=0;b<Math.floor(amt*8)+2;b++){
      var bx=seeded(b*17+frameIdx)*W,by=seeded(b*23+frameIdx)*H;
      var bw=seeded(b*31+frameIdx)*W*0.3+10,bh=seeded(b*37+frameIdx)*8+3;
      ctx.fillStyle=Math.random()>0.5?PHOS:'#000';
      ctx.fillRect(bx,by,bw,bh);
    }
  }
  if(gt===1||gt===3){
    ctx.font='11px ui-monospace,monospace';ctx.fillStyle=PHOS;
    for(var h=0;h<4;h++){
      ctx.fillText(HEX[(frameIdx+h)%HEX.length],seeded(h*7)*W*0.7,H*0.55+h*18);
    }
  }
  if(amt>0.5){
    ctx.fillStyle=isDark?'rgba(57,255,20,0.15)':'rgba(26,138,26,0.2)';
    ctx.fillRect(0,H*0.7,W,H*0.3);
    ctx.font='bold 13px ui-monospace,monospace';ctx.fillStyle=PHOS;
    ctx.fillText('>> BACKDOOR LOADING <<',W*0.12,H*0.82);
    var barW=W*0.7,barX=W*0.15;
    ctx.strokeStyle=PHOS;ctx.strokeRect(barX,H*0.86,barW,8);
    ctx.fillRect(barX,H*0.86,barW*(1-amt+0.1),8);
  }
  ctx.globalAlpha=1;
  if(amt>0.3){
    ctx.strokeStyle=PHOS;ctx.lineWidth=1;
    for(var s=0;s<5;s++){
      var sy=seeded(s*41+frameIdx*0.1)*H;
      ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy+(seeded(s)*20-10));ctx.stroke();
    }
  }
}

function drawScanlines(){
  if(!ctx)return;
  ctx.globalAlpha=isDark?0.12:0.08;
  ctx.fillStyle='#000';
  for(var y=0;y<H;y+=3){ctx.fillRect(0,y,W,1);}
  ctx.globalAlpha=1;
  scanPhase+=0.02;
  ctx.globalAlpha=0.04;
  ctx.fillStyle=PHOS;
  ctx.fillRect(0,(scanPhase*H*0.3)%H,W,2);
  ctx.globalAlpha=1;
}

function drawParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life-=0.02;
    if(p.life<=0){particles.splice(i,1);continue;}
    if(!ctx)continue;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    ctx.fillRect(p.x,p.y,p.sz,p.sz);
    ctx.globalAlpha=1;
  }
}

function spawnParticles(x,y,col,n){
  for(var i=0;i<(n||8);i++){
    particles.push({x:x,y:y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,
      life:1,col:col||PHOS,sz:Math.random()*3+1});
  }
}

function drawReelStrip(){
  if(!ctx||state!=='playing')return;
  var stripH=14,stripY=H-stripH-22,cellW=Math.min(6,(W-20)/reelLen);
  var startX=(W-reelLen*cellW)*0.5;
  for(var i=0;i<reelLen;i++){
    var fr=frames[i],x=startX+i*cellW;
    if(fr.patched)ctx.fillStyle=PHOS;
    else if(fr.hasGlitch&&fr.skipped)ctx.fillStyle=isDark?'#662222':'#aa4444';
    else if(fr.hasGlitch)ctx.fillStyle=isDark?'#335533':'#558855';
    else if(i===frameIdx)ctx.fillStyle=PHOS2;
    else ctx.fillStyle=isDark?'#1a2a1a':'#809080';
    ctx.fillRect(x,stripY,cellW-1,stripH);
  }
  ctx.strokeStyle=PHOS;ctx.lineWidth=1;
  ctx.strokeRect(startX+frameIdx*cellW-1,stripY-2,cellW+1,stripH+4);
}

function drawHUD(){
  if(!ctx||state!=='playing')return;
  var f=frames[frameIdx];
  if(!f)return;
  drawReelStrip();
  ctx.font='10px ui-monospace,monospace';ctx.fillStyle=PHOS2;
  ctx.textAlign='right';ctx.fillText('FRAME '+(frameIdx+1)+'/'+reelLen,W-8,H-8);
  ctx.textAlign='left';
  if(glitchActive){
    ctx.fillStyle=PHOS;ctx.globalAlpha=0.5+Math.sin(Date.now()*0.02)*0.3;
    ctx.fillText('[ TAP TO LOCK ]',8,H-8);
    ctx.globalAlpha=1;
  }else{
    ctx.fillStyle=isDark?'#4a7a4a':'#3a6a3a';
    ctx.fillText('[ DRAG TO SCRUB ]',8,H-8);
  }
  if(flashCol!==0){
    ctx.fillStyle=flashCol>0?'rgba(57,255,20,0.25)':'rgba(255,68,68,0.25)';
    ctx.fillRect(0,0,W,H);flashCol*=0.85;
    if(Math.abs(flashCol)<0.01)flashCol=0;
  }
}

function render(){
  if(!ctx){requestAnimationFrame(render);return;}
  vhsWobble+=0.03;
  var sx=(shakeAmt>0?(Math.random()-0.5)*shakeAmt:0)+Math.sin(vhsWobble)*1.2;
  var sy=shakeAmt>0?(Math.random()-0.5)*shakeAmt:0;
  ctx.save();ctx.translate(sx,sy);
  ctx.clearRect(-10,-10,W+20,H+20);
  var f=frames[frameIdx]||frames[0];
  var gAmt=0;
  if(glitchActive&&glitchMax>0)gAmt=1-glitchTimer/glitchMax;
  if(decoyFlash>0)gAmt=decoyFlash*0.6;
  if(f)drawScene(f,frameIdx*0.1,gAmt);
  drawScanlines();drawHUD();drawParticles();
  ctx.restore();
}

function armGlitchForFrame(idx){
  var f=frames[idx];
  if(!f||f.patched||f.skipped||!f.hasGlitch)return;
  glitchActive=true;
  var prog=idx/reelLen;
  glitchMax=Math.max(0.45,1.7-prog*1.0);
  glitchTimer=glitchMax;
  currentGlitchType=f.glitchType;
  beep(220,0.06,0.06);
}

function enterFrame(idx){
  if(idx<0||idx>=reelLen)return;
  var prev=frameIdx;
  if(prev!==idx){
    var pf=frames[prev];
    if(pf&&pf.hasGlitch&&!pf.patched&&!pf.skipped)onBreach('Skipped glitch');
  }
  frameIdx=idx;glitchActive=false;decoyFlash=0;
  var f=frames[frameIdx];
  if(f&&f.hasGlitch&&!f.patched&&!f.skipped)armGlitchForFrame(frameIdx);
  else if(f&&f.isDecoy&&!f.decoyDone){
    decoyFlash=0.85;decoyTimer=0.4;f.decoyDone=true;
    beep(330,0.03,0.03);
  }
}

function updateGlitch(dt){
  var f=frames[frameIdx];
  if(!f)return;
  if(decoyFlash>0){
    decoyTimer-=dt;
    decoyFlash=Math.max(0,decoyTimer/0.4);
    if(decoyTimer<=0)decoyFlash=0;
  }
  if(glitchActive&&!f.patched&&!f.skipped){
    glitchTimer-=dt;
    if(glitchTimer<=0){
      glitchActive=false;
      onBreach('Backdoor loaded');
    }
  }
}

function onPatch(){
  var f=frames[frameIdx];
  if(!f)return;
  if(decoyFlash>0.3){
    onFalseAlarm();return;
  }
  if(!glitchActive||!f.hasGlitch||f.patched)return;
  glitchActive=false;f.patched=true;
  cleanCount++;combo++;
  if(combo>bestCombo)bestCombo=combo;
  hClean.textContent=cleanCount;
  progBar.style.width=(cleanCount/30*100)+'%';
  spawnParticles(W*0.5,H*0.5,PHOS,16);
  flashCol=1;hitPause=0.06;beep(880,0.08,0.1);beep(1100,0.06,0.06);
  navigator.vibrate&&navigator.vibrate(20);
  showToast('LOCKED ×'+combo);
  scrollRate=Math.max(0.55,scrollRate-0.02);
  if(cleanCount>=30)endGame(true);
}

function onFalseAlarm(){
  combo=0;breachCount++;
  hBreach.textContent=breachCount;
  progBar.classList.add('danger');
  shakeAmt=8;flashCol=-1;
  beep(110,0.15,0.1);
  navigator.vibrate&&navigator.vibrate([30,20,30]);
  showToast('DECOY — FALSE LOCK');
  decoyFlash=0;decoyTimer=0;
  if(breachCount>=3)endGame(false);
}

function onBreach(reason){
  var f=frames[frameIdx];
  if(f&&!f.patched&&!f.skipped){f.skipped=true;}
  glitchActive=false;combo=0;breachCount++;
  hBreach.textContent=breachCount;
  progBar.classList.add('danger');
  shakeAmt=12;flashCol=-1;
  beep(80,0.2,0.12);
  navigator.vibrate&&navigator.vibrate(50);
  showToast('BREACH');
  if(breachCount>=3)endGame(false);
}

function checkEndOfReel(){
  if(frameIdx<reelLen-1)return;
  var pending=0;
  for(var i=0;i<reelLen;i++){
    var fr=frames[i];
    if(fr.hasGlitch&&!fr.patched&&!fr.skipped)pending++;
  }
  if(pending===0){
    endGame(cleanCount>=30);
  }
}

function advanceFrame(dir){
  var next=Math.max(0,Math.min(reelLen-1,frameIdx+(dir||1)));
  if(next!==frameIdx)enterFrame(next);
  checkEndOfReel();
}

function endGame(won){
  state='over';
  endOv.classList.remove('hidden');
  endTitle.textContent=won?'REEL SECURED':'REEL CORRUPTED';
  endScore.textContent=cleanCount;
  endMsg.textContent=won?'Backdoor contained. '+bestCombo+' best combo.':
    (breachCount>=3?'Too many breaches.':'Time expired.');
  beep(won?660:150,0.2,0.08);
}

function startGame(){
  initAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  buildFrames();
  frameIdx=0;cleanCount=0;breachCount=0;timeLeft=60;combo=0;bestCombo=0;
  glitchActive=false;decoyFlash=0;particles=[];shakeAmt=0;flashCol=0;
  scrollAcc=0;scrollRate=1.05;hitPause=0;
  hClean.textContent='0';hBreach.textContent='0';hTime.textContent='60';
  progBar.style.width='0%';progBar.classList.remove('danger');
  titleOv.classList.add('hidden');endOv.classList.add('hidden');
  state='playing';lastT=performance.now();
  enterFrame(0);
}

function gameLoop(t){
  var dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
  if(hitPause>0){hitPause-=dt;render();animId=requestAnimationFrame(gameLoop);return;}
  if(state==='playing'){
    timeLeft-=dt;
    hTime.textContent=Math.max(0,Math.ceil(timeLeft));
    if(timeLeft<=0)endGame(cleanCount>=25);
    updateGlitch(dt);
    if(shakeAmt>0)shakeAmt*=0.85;
    if(!isDragging&&frameIdx<reelLen-1){
      scrollAcc+=dt;
      if(scrollAcc>=scrollRate){
        scrollAcc-=scrollRate;
        advanceFrame(1);
      }
    }
  }
  render();
  animId=requestAnimationFrame(gameLoop);
}

function ptrPos(e){
  if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}

function onDown(e){
  if(state!=='playing')return;
  e.preventDefault();
  var p=ptrPos(e);
  ptrDown=true;ptrMoved=false;isDragging=false;
  ptrDownX=p.x;ptrDownY=p.y;ptrDownT=Date.now();
  dragStartX=p.x;dragStartIdx=frameIdx;
}

function onMove(e){
  if(!ptrDown||state!=='playing')return;
  e.preventDefault();
  var p=ptrPos(e);
  var dx=p.x-ptrDownX,dy=p.y-ptrDownY;
  if(Math.abs(dx)>8||Math.abs(dy)>8)ptrMoved=true;
  if(Math.abs(p.x-dragStartX)>12){
    isDragging=true;
    var delta=Math.round((p.x-dragStartX)/(W*0.08));
    var newIdx=Math.max(0,Math.min(reelLen-1,dragStartIdx+delta));
    if(newIdx!==frameIdx)enterFrame(newIdx);
  }
}

function onUp(e){
  if(!ptrDown)return;
  e.preventDefault();
  var p=ptrPos(e);
  var dx=p.x-ptrDownX,dy=p.y-ptrDownY;
  var dist=Math.sqrt(dx*dx+dy*dy);
  var elapsed=Date.now()-ptrDownT;
  if(state==='playing'&&!isDragging&&dist<18&&elapsed<350){
    onPatch();
  }
  ptrDown=false;isDragging=false;ptrMoved=false;
}

function onKey(e){
  if(state==='title'&&(e.key===' '||e.key==='Enter')){startGame();return;}
  if(state==='over'&&(e.key===' '||e.key==='Enter')){startGame();return;}
  if(state!=='playing')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();onPatch();}
  if(e.key==='ArrowRight')advanceFrame(1);
  if(e.key==='ArrowLeft')advanceFrame(-1);
}

if(startBtn)startBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
if(restartBtn)restartBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
if(cv){
  cv.addEventListener('mousedown',onDown);cv.addEventListener('mousemove',onMove);
  cv.addEventListener('mouseup',onUp);cv.addEventListener('mouseleave',onUp);
  cv.addEventListener('touchstart',onDown,{passive:false});
  cv.addEventListener('touchmove',onMove,{passive:false});
  cv.addEventListener('touchend',onUp,{passive:false});
}
window.addEventListener('keydown',onKey);
window.addEventListener('resize',resize);

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(e){
    isDark=e.matches;PHOS=isDark?'#39ff14':'#1a8a1a';PHOS2=isDark?'#b8ffb8':'#0a4a0a';
    SKY=isDark?'#0a120a':'#b0c8b0';ROAD=isDark?'#0d180d':'#809080';
    LANE=isDark?'#1a3a1a':'#607060';
    FOG=isDark?'rgba(20,40,20,':'rgba(180,200,180,';
  });
}

resize();
render();
animId=requestAnimationFrame(gameLoop);
})();
</script>
</body>
