<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agent Nodes</title>
  <style>
    :root {
      --bg: #e2e8f0;
      --fg: #0f172a;
      --accent: #10b981;
      --dead: #ef4444;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --accent: #00ff88;
        --dead: #ff4d4d;
      }
    }

    body {
      margin: 0;
      padding: 0;
      width: 100dvw;
      height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .screen {
      pointer-events: auto;
      background: rgba(226, 232, 240, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
      padding: 20px;
    }

    @media (prefers-color-scheme: dark) {
      .screen {
        background: rgba(15, 23, 42, 0.85);
      }
    }

    .active {
      display: flex;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    h1 {
      font-weight: 400;
      font-size: 2.2rem;
      letter-spacing: 0.15em;
      margin: 0 0 20px 0;
      text-transform: uppercase;
    }

    p {
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      opacity: 0.8;
      max-width: 300px;
      line-height: 1.6;
      margin: 0 0 40px 0;
    }

    button {
      pointer-events: auto;
      position: relative;
      z-index: 101;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--fg);
      padding: 16px 40px;
      font-size: 1rem;
      font-family: inherit;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    button:hover, button:active {
      background: var(--fg);
      color: var(--bg);
    }

    #hud {
      position: absolute;
      top: 16px; left: 0; width: 100%;
      padding: 0 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      font-weight: bold;
      color: var(--fg);
      z-index: 50;
      pointer-events: none;
    }

    #score { margin-bottom: 8px; }
    #status { color: var(--accent); height: 1.2em; transition: color 0.2s; }

    #timer-bar-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 6px;
      background: rgba(0,0,0,0.1);
      z-index: 50;
      pointer-events: none;
    }

    @media (prefers-color-scheme: dark) {
      #timer-bar-container { background: rgba(255,255,255,0.1); }
    }

    #timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transform-origin: left;
      will-change: transform;
    }
  </style>
</head>
<body>

  <canvas id="game"></canvas>

  <div id="hud" style="display:none;">
    <div id="score">WAVE 1 &bull; 0</div>
    <div id="status"></div>
  </div>

  <div id="timer-bar-container" style="display:none;">
    <div id="timer-bar"></div>
  </div>

  <div id="ui">
    <div id="title-screen" class="screen active">
      <h1>Agent Nodes</h1>
      <p>Draw one unbroken line linking dormant nodes.<br><br>Lift only when every node pulses green.<br>Avoid dead nodes.</p>
      <button data-smoke="start" id="start-btn">Start Circuit</button>
    </div>

    <div id="game-over-screen" class="screen">
      <h1>Circuit Broken</h1>
      <p id="game-over-reason">Lifted too early.</p>
      <p style="margin-bottom: 20px;">Nodes Connected: <span id="final-score" style="font-weight: bold; font-size: 1.2rem;">0</span></p>
      <button data-smoke="restart" id="restart-btn">Restart Circuit</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let width, height, dpr;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    const palette = {
      bg: '#0f172a',
      bgDark: '#020617',
      nodeGood: '#00b4d8',
      nodeGoodConnected: '#00ff88',
      nodeDead: '#ff4d4d',
      line: '#00b4d8',
      lineCore: '#ffffff',
      isLight: false
    };

    function updatePalette() {
      const isLight = !(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      palette.isLight = isLight;
      if (isLight) {
        palette.bg = '#f8fafc';
        palette.bgDark = '#e2e8f0';
        palette.nodeGood = '#3b82f6';
        palette.nodeGoodConnected = '#10b981';
        palette.nodeDead = '#ef4444';
        palette.line = '#3b82f6';
        palette.lineCore = '#ffffff';
      } else {
        palette.bg = '#0f172a';
        palette.bgDark = '#020617';
        palette.nodeGood = '#00b4d8';
        palette.nodeGoodConnected = '#00ff88';
        palette.nodeDead = '#ff4d4d';
        palette.line = '#00b4d8';
        palette.lineCore = '#ffffff';
      }
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updatePalette);
    updatePalette();

    let audioCtx = null;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    } catch(e) {}

    function playTone(freq, type, duration, vol=0.1) {
      if (!audioCtx || audioCtx.state === 'suspended') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    document.body.addEventListener('pointerdown', () => {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(()=>{});
      }
    }, { once: true });

    let state = 'title'; // title, playing, success_pause, gameover
    let wave = 1;
    let totalScore = 0;
    let nodes = [];
    let currentPath = [];
    let isDrawing = false;
    let inputPos = { x: 0, y: 0 };
    let inputActive = false;
    let timeRemaining = 0;
    let waveTimeTotal = 1;
    let lastTime = performance.now();
    let particles = [];
    let connectedCount = 0;

    class Node {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.type = type;
        this.radius = type === 'good' ? 24 : 20;
        this.connected = false;
        this.pulse = 0;
        this.spawnAnim = 0;
      }
      
      update(dt) {
        if (this.spawnAnim < 1) this.spawnAnim = Math.min(1, this.spawnAnim + dt * 3);
        let speedMult = 1 + wave * 0.15;
        this.x += this.vx * speedMult * dt * 60;
        this.y += this.vy * speedMult * dt * 60;
        
        if (this.x < this.radius) { this.x = this.radius; this.vx = Math.abs(this.vx); }
        if (this.x > width - this.radius) { this.x = width - this.radius; this.vx = -Math.abs(this.vx); }
        if (this.y < this.radius) { this.y = this.radius; this.vy = Math.abs(this.vy); }
        if (this.y > height - this.radius) { this.y = height - this.radius; this.vy = -Math.abs(this.vy); }
        
        if (this.connected) this.pulse += dt * 5;
      }
      
      draw(ctx) {
        let scale = this.spawnAnim;
        if (this.type === 'good' && this.connected) {
          scale *= 1 + Math.sin(this.pulse) * 0.1;
        }
        
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(scale, scale);
        
        if (this.type === 'good') {
          if (this.connected) {
            ctx.fillStyle = palette.nodeGoodConnected;
            if (!palette.isLight) {
              ctx.shadowColor = palette.nodeGoodConnected;
              ctx.shadowBlur = 15;
            }
            ctx.beginPath();
            ctx.arc(0, 0, this.radius - 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = palette.nodeGoodConnected;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            ctx.strokeStyle = palette.nodeGood;
            if (!palette.isLight) {
              ctx.shadowColor = palette.nodeGood;
              ctx.shadowBlur = 10;
            }
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(0, 0, this.radius - 8, 0, Math.PI * 2);
            ctx.setLineDash([4, 6]);
            ctx.save();
            ctx.rotate(performance.now() * 0.001);
            ctx.stroke();
            ctx.restore();
            ctx.setLineDash([]);
          }
        } else if (this.type === 'dead') {
          ctx.strokeStyle = palette.nodeDead;
          if (!palette.isLight) {
            ctx.shadowColor = palette.nodeDead;
            ctx.shadowBlur = 10;
          }
          ctx.lineWidth = 3;
          
          ctx.save();
          ctx.rotate(-performance.now() * 0.002);
          ctx.beginPath();
          let spikes = 8;
          for(let i=0; i<spikes * 2; i++) {
            let r = i % 2 === 0 ? this.radius : this.radius - 8;
            let a = (i / (spikes * 2)) * Math.PI * 2;
            if (i===0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
            else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
          }
          ctx.closePath();
          ctx.stroke();
          
          ctx.beginPath();
          ctx.arc(0,0, this.radius - 12, 0, Math.PI*2);
          ctx.fillStyle = palette.nodeDead;
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }
    }

    function createParticles(x, y, color, count=12) {
      for(let i=0; i<count; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 400,
          vy: (Math.random() - 0.5) * 400,
          life: 1.0,
          color: color
        });
      }
    }

    function initTitleNodes() {
      nodes = [];
      for(let i=0; i<15; i++) {
        let n = new Node(Math.random() * width, Math.random() * height, Math.random() > 0.3 ? 'good' : 'dead');
        n.spawnAnim = 1;
        if (n.type === 'good' && Math.random() > 0.5) n.connected = true;
        nodes.push(n);
      }
    }
    initTitleNodes();

    function startWave(w) {
      wave = w;
      document.getElementById('score').innerHTML = `WAVE ${wave} &bull; ${totalScore}`;
      document.getElementById('status').innerText = "";
      nodes = [];
      currentPath = [];
      isDrawing = false;
      connectedCount = 0;
      particles = [];
      
      let numGood = Math.min(3 + Math.floor((wave - 1) * 0.8), 12);
      let numDead = wave === 1 ? 0 : Math.floor(wave * 0.6);
      
      for(let i=0; i<numGood + numDead; i++) {
        let type = i < numGood ? 'good' : 'dead';
        let x, y, overlap;
        let attempts = 0;
        let radius = type === 'good' ? 24 : 20;
        do {
          overlap = false;
          x = radius + Math.random() * (width - radius * 2);
          y = radius + 80 + Math.random() * (height - radius * 2 - 120);
          for(let n of nodes) {
            if (Math.hypot(n.x - x, n.y - y) < n.radius + radius + 15) {
              overlap = true; break;
            }
          }
          attempts++;
        } while(overlap && attempts < 50);
        nodes.push(new Node(x, y, type));
      }
      
      waveTimeTotal = 5 + numGood * 1.2;
      timeRemaining = waveTimeTotal;
      state = 'playing';
    }

    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      let A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
      let dot = A * C + B * D;
      let len_sq = C * C + D * D;
      let param = -1;
      if (len_sq !== 0) param = dot / len_sq;
      let xx, yy;
      if (param < 0) { xx = x1; yy = y1; }
      else if (param > 1) { xx = x2; yy = y2; }
      else { xx = x1 + param * C; yy = y1 + param * D; }
      let dx = px - xx, dy = py - yy;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function handleNodeTouch(n) {
      if (n.type === 'good' && !n.connected) {
        n.connected = true;
        connectedCount++;
        totalScore += 10;
        document.getElementById('score').innerHTML = `WAVE ${wave} &bull; ${totalScore}`;
        n.pulse = 0;
        createParticles(n.x, n.y, palette.nodeGoodConnected);
        if (navigator.vibrate) navigator.vibrate(15);
        playTone(600 + connectedCount * 100, 'sine', 0.2, 0.1);
        return false;
      } else if (n.type === 'dead') {
        createParticles(n.x, n.y, palette.nodeDead, 30);
        loseGame('Severed by dead node.');
        return true; // game over
      }
      return false;
    }

    function checkContinuousCollisions() {
      if (!isDrawing || currentPath.length < 1) return;
      
      let fullPath = [...currentPath];
      if (inputActive) fullPath.push(inputPos);
      
      for(let n of nodes) {
        if (fullPath.length === 1) {
          if (Math.hypot(n.x - fullPath[0].x, n.y - fullPath[0].y) < n.radius) {
            if (handleNodeTouch(n)) return;
          }
        } else {
          for(let i = 0; i < fullPath.length - 1; i++) {
            if (pointToSegmentDistance(n.x, n.y, fullPath[i].x, fullPath[i].y, fullPath[i+1].x, fullPath[i+1].y) < n.radius) {
              if (handleNodeTouch(n)) return;
              break;
            }
          }
        }
      }
    }

    function winWave() {
      state = 'success_pause';
      if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
      playTone(1200, 'square', 0.1, 0.05);
      setTimeout(() => playTone(1600, 'sine', 0.3, 0.05), 100);
      for(let n of nodes) { if (n.type === 'good') n.pulse = Math.PI/2; }
      setTimeout(() => startWave(wave + 1), 500);
    }

    function loseGame(reason) {
      state = 'gameover';
      inputActive = false;
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
      playTone(150, 'sawtooth', 0.6, 0.2);
      
      document.getElementById('hud').style.display = 'none';
      document.getElementById('timer-bar-container').style.display = 'none';
      document.getElementById('game-over-screen').classList.add('active');
      document.getElementById('game-over-reason').innerText = reason;
      document.getElementById('final-score').innerText = totalScore.toString();
    }

    function onDown(e) {
      if (e.type === 'touchstart' && e.cancelable) e.preventDefault();
      if (state !== 'playing') return;
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let clientY = e.touches ? e.touches[0].clientY : e.clientY;
      inputActive = true;
      isDrawing = true;
      currentPath = [{x: clientX, y: clientY}];
      inputPos.x = clientX;
      inputPos.y = clientY;
      playTone(400, 'sine', 0.1, 0.05);
      checkContinuousCollisions();
    }

    function onMove(e) {
      if (e.type === 'touchmove' && e.cancelable) e.preventDefault();
      if (state !== 'playing') return;
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let clientY = e.touches ? e.touches[0].clientY : e.clientY;
      inputPos.x = clientX;
      inputPos.y = clientY;
      
      if (isDrawing && currentPath.length > 0) {
        let lastP = currentPath[currentPath.length - 1];
        if (Math.hypot(clientX - lastP.x, clientY - lastP.y) > 8) {
          currentPath.push({x: clientX, y: clientY});
        }
      }
    }

    function onUp(e) {
      if (state !== 'playing') return;
      inputActive = false;
      if (isDrawing) {
        isDrawing = false;
        let allGoodConnected = nodes.filter(n => n.type === 'good').every(n => n.connected);
        if (allGoodConnected) {
          winWave();
        } else {
          loseGame('Lifted before completing circuit.');
        }
      }
    }

    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove, {passive: false});
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, {passive: false});
    window.addEventListener('touchmove', onMove, {passive: false});
    window.addEventListener('touchend', onUp, {passive: false});
    window.addEventListener('touchcancel', onUp, {passive: false});

    const keyHeld = { Space: false };

    function handleKeyDown(e) {
      if (state === 'title' && (e.code === 'Space' || e.code === 'Enter')) {
        e.preventDefault();
        document.getElementById('start-btn').click();
        return;
      }
      if (state === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
        e.preventDefault();
        document.getElementById('restart-btn').click();
        return;
      }
      if (state !== 'playing') return;

      const speed = 14;
      let moved = false;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { inputPos.x = Math.max(0, inputPos.x - speed); moved = true; }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { inputPos.x = Math.min(width, inputPos.x + speed); moved = true; }
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') { inputPos.y = Math.max(0, inputPos.y - speed); moved = true; }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { inputPos.y = Math.min(height, inputPos.y + speed); moved = true; }

      if (moved) {
        e.preventDefault();
        if (isDrawing && currentPath.length > 0) {
          let lastP = currentPath[currentPath.length - 1];
          if (Math.hypot(inputPos.x - lastP.x, inputPos.y - lastP.y) > 8) {
            currentPath.push({ x: inputPos.x, y: inputPos.y });
          }
        }
        checkContinuousCollisions();
        return;
      }

      if (e.code === 'Space' && !keyHeld.Space) {
        e.preventDefault();
        keyHeld.Space = true;
        if (!isDrawing) {
          if (!inputPos.x && !inputPos.y) { inputPos.x = width / 2; inputPos.y = height / 2; }
          onDown({ clientX: inputPos.x, clientY: inputPos.y });
        }
      }
    }

    function handleKeyUp(e) {
      if (e.code === 'Space') {
        keyHeld.Space = false;
        if (state === 'playing' && isDrawing) {
          e.preventDefault();
          onUp(e);
        }
      }
    }

    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('title-screen').classList.remove('active');
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('timer-bar-container').style.display = 'block';
      totalScore = 0;
      startWave(1);
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      document.getElementById('game-over-screen').classList.remove('active');
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('timer-bar-container').style.display = 'block';
      totalScore = 0;
      startWave(1);
    });

    function drawPath() {
      if (currentPath.length < 1) return;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(currentPath[0].x, currentPath[0].y);
      for(let i=1; i<currentPath.length; i++) ctx.lineTo(currentPath[i].x, currentPath[i].y);
      if (inputActive && state === 'playing') ctx.lineTo(inputPos.x, inputPos.y);
      
      ctx.strokeStyle = palette.line;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (!palette.isLight) {
        ctx.shadowColor = palette.line;
        ctx.shadowBlur = 15;
      }
      ctx.stroke();
      
      ctx.strokeStyle = palette.lineCore;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 0;
      ctx.stroke();
      ctx.restore();
    }

    function update(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (state === 'playing') {
        timeRemaining -= dt;
        if (timeRemaining <= 0) {
          loseGame('Circuit timed out.');
          return;
        }
        
        let bar = document.getElementById('timer-bar');
        bar.style.transform = `scaleX(${Math.max(0, timeRemaining / waveTimeTotal)})`;
        if (timeRemaining < waveTimeTotal * 0.3) {
          bar.style.background = palette.nodeDead;
        } else {
          bar.style.background = palette.nodeGoodConnected;
        }

        let allGoodConnected = nodes.filter(n => n.type === 'good').every(n => n.connected);
        let statusEl = document.getElementById('status');
        if (allGoodConnected && isDrawing) {
          palette.lineCore = (Math.floor(performance.now() / 100) % 2 === 0) ? palette.nodeGoodConnected : '#ffffff';
          statusEl.innerText = "ALL CONNECTED - LIFT FINGER";
          statusEl.style.color = palette.nodeGoodConnected;
        } else {
          palette.lineCore = '#ffffff';
          statusEl.innerText = "";
        }
        
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            let dx = nodes[i].x - nodes[j].x;
            let dy = nodes[i].y - nodes[j].y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist === 0) { nodes[i].x += 0.1; dx = 0.1; dist = 0.1; }
            
            if (dist < 200) {
              let force = (200 - dist) * 0.0005;
              nodes[i].vx += (dx / dist) * force;
              nodes[i].vy += (dy / dist) * force;
              nodes[j].vx -= (dx / dist) * force;
              nodes[j].vy -= (dy / dist) * force;
            }
            
            let minDist = nodes[i].radius + nodes[j].radius + 5;
            if (dist < minDist) {
              let nx = dx / dist, ny = dy / dist;
              let force = (minDist - dist) * 0.5;
              nodes[i].x += nx * force; nodes[i].y += ny * force;
              nodes[j].x -= nx * force; nodes[j].y -= ny * force;
              let p = 2 * (nodes[i].vx * nx + nodes[i].vy * ny - nodes[j].vx * nx - nodes[j].vy * ny) / 2;
              nodes[i].vx -= p * nx; nodes[i].vy -= p * ny;
              nodes[j].vx += p * nx; nodes[j].vy += p * ny;
            }
          }
          nodes[i].vx *= 0.99; nodes[i].vy *= 0.99;
          let speed = Math.hypot(nodes[i].vx, nodes[i].vy);
          let minSpeed = 0.5 + wave * 0.1;
          if (speed < minSpeed) {
            if (speed === 0) { nodes[i].vx = minSpeed; nodes[i].vy = 0; }
            else { nodes[i].vx = (nodes[i].vx / speed) * minSpeed; nodes[i].vy = (nodes[i].vy / speed) * minSpeed; }
          }
        }
        
        for(let n of nodes) n.update(dt);
        if (isDrawing) checkContinuousCollisions();
      } else if (state === 'success_pause') {
        for(let n of nodes) {
          n.vx *= 0.95; n.vy *= 0.95;
          n.update(dt);
        }
      } else if (state === 'title' || state === 'gameover') {
        for(let n of nodes) {
          n.x += n.vx * dt * 30; n.y += n.vy * dt * 30;
          if (n.x < n.radius) { n.x = n.radius; n.vx *= -1; }
          if (n.x > width - n.radius) { n.x = width - n.radius; n.vx *= -1; }
          if (n.y < n.radius) { n.y = n.radius; n.vy *= -1; }
          if (n.y > height - n.radius) { n.y = height - n.radius; n.vy *= -1; }
        }
      }
    }

    function draw() {
      let cx = width/2, cy = height/2;
      let grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(width, height));
      grad.addColorStop(0, palette.bg);
      grad.addColorStop(1, palette.bgDark);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
      
      for(let n of nodes) n.draw(ctx);
      if (currentPath.length > 0) drawPath();
      
      for(let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;
    }

    function loop(time) {
      let dt = (time - lastTime) / 1000;
      lastTime = time;
      if (dt > 0.1) dt = 0.1;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
