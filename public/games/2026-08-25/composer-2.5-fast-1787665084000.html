<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vault Breach</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8eaed;--fg:#1a1d21;--muted:#5c6370;--panel:rgba(255,255,255,.92);
  --lane-a:#c47a00;--lane-b:#007a8a;--lane-c:#b33a2e;
  --amber:#e8a020;--terminal:#2a3038;--fog:rgba(180,190,200,.35);
  --border:rgba(0,0,0,.08);--shadow:rgba(0,0,0,.12);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1216;--fg:#e4e8ec;--muted:#8b939e;--panel:rgba(18,22,28,.94);
    --terminal:#06080c;--fog:rgba(40,48,58,.55);
    --border:rgba(255,255,255,.08);--shadow:rgba(0,0,0,.45);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);line-height:1.5}
.hud-block strong{display:block;font-size:22px;color:var(--fg);letter-spacing:0;text-transform:none;font-weight:600}
#combo{color:var(--amber);opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;pointer-events:none;z-index:10;transition:opacity .35s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px 24px;
  max-width:340px;width:100%;text-align:center;box-shadow:0 12px 40px var(--shadow);pointer-events:none}
.panel h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.panel .sub{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:20px}
.panel p{font-size:14px;color:var(--muted);line-height:1.55;margin-bottom:20px}
.panel .score-final{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:36px;
  font-weight:600;color:var(--fg);margin:8px 0 4px}
.panel .score-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:160px;
  padding:12px 28px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
  pointer-events:auto;touch-action:manipulation;transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:scale(.97)}
.btn-start{background:var(--amber);color:#1a1200;box-shadow:0 4px 16px rgba(232,160,32,.35)}
.btn-restart{background:var(--fg);color:var(--bg);box-shadow:0 4px 16px var(--shadow)}
@media(prefers-color-scheme:dark){.btn-start{color:#0f0a00}}
.lanes-hint{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.lane-dot{width:10px;height:10px;border-radius:50%}
#breach-flash{position:absolute;inset:0;background:rgba(232,160,32,.25);opacity:0;pointer-events:none;
  z-index:5;transition:opacity .08s}
#breach-flash.on{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-block">Score<strong id="scoreVal">0</strong></div>
    <div class="hud-block" style="text-align:center">Time<strong id="timeVal">60</strong></div>
    <div class="hud-block" style="text-align:right">Integrity<strong id="lifeVal">●●●</strong>
      <span id="combo" style="display:block;font-size:10px;margin-top:2px">×1 COMBO</span></div>
  </div>
  <div id="breach-flash"></div>
  <div id="titleOverlay" class="overlay">
    <div class="panel">
      <h1>Vault Breach</h1>
      <div class="sub">Containment Protocol · SF-15°</div>
      <div class="lanes-hint">
        <span class="lane-dot" style="background:var(--lane-a)"></span>
        <span class="lane-dot" style="background:var(--lane-b)"></span>
        <span class="lane-dot" style="background:var(--lane-c)"></span>
      </div>
      <p>Swipe left or right to switch containment lanes. Seal each classified shard before it spills over the edge.</p>
      <button class="btn btn-start" data-smoke="start" id="startBtn">Engage Locks</button>
    </div>
  </div>
  <div id="gameOverOverlay" class="overlay hidden">
    <div class="panel">
      <h1>Breach Contained</h1>
      <div class="sub">Session sealed</div>
      <div class="score-final" id="finalScore">0</div>
      <div class="score-label">Fragments secured</div>
      <p id="endMsg">The vault holds—for now.</p>
      <button class="btn btn-restart" data-smoke="restart" id="restartBtn">Re-engage</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var titleOverlay = document.getElementById('titleOverlay');
var gameOverOverlay = document.getElementById('gameOverOverlay');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');
var scoreEl = document.getElementById('scoreVal');
var timeEl = document.getElementById('timeVal');
var lifeEl = document.getElementById('lifeVal');
var comboEl = document.getElementById('combo');
var finalScoreEl = document.getElementById('finalScore');
var endMsgEl = document.getElementById('endMsg');
var breachFlash = document.getElementById('breach-flash');

var W = 360, H = 640;
var dpr = 1;
var state = 'title';
var score = 0, lives = 3, combo = 0, maxCombo = 0;
var timeLeft = 60;
var playerLane = 1;
var displayLane = 1;
var shards = [];
var particles = [];
var lockCascades = [];
var scorePops = [];
var spawnTimer = 0;
var spawnInterval = 1.4;
var fallSpeed = 90;
var elapsed = 0;
var lastTs = 0;
var animId = 0;
var audioCtx = null;
var darkMode = false;
var shake = 0;
var fogOffset = 0;

var LANES = [
  { id: 0, color: '#c47a00', label: 'KEY', name: 'KEYS' },
  { id: 1, color: '#007a8a', label: 'LOG', name: 'LOGS' },
  { id: 2, color: '#b33a2e', label: 'DOC', name: 'DOCS' }
];

var SHARD_TYPES = [
  { lane: 0, glyph: '⬡', label: 'KEY' },
  { lane: 1, glyph: '▤', label: 'LOG' },
  { lane: 2, glyph: '▣', label: 'DOC' }
];

function isDark(){
  try{
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }catch(e){ return false; }
}

function getColors(){
  darkMode = isDark();
  return {
    bg: darkMode ? '#0f1216' : '#e8eaed',
    fog: darkMode ? 'rgba(40,48,58,0.6)' : 'rgba(180,190,200,0.4)',
    grid: darkMode ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)',
    laneLine: darkMode ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)',
    terminal: darkMode ? '#06080c' : '#2a3038',
    amber: '#e8a020',
    text: darkMode ? '#e4e8ec' : '#1a1d21',
    muted: darkMode ? '#6b7380' : '#8a9099',
    skyline: darkMode ? '#141820' : '#b8c0c8'
  };
}

function initAudio(){
  if(audioCtx) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }catch(e){}
}

function playLockClick(pitch, vol){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(pitch || 880, t);
    osc.frequency.exponentialRampToValueAtTime((pitch || 880) * 0.5, t + 0.06);
    gain.gain.setValueAtTime((vol || 0.08) * (0.5 + combo * 0.05), t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.12);
  }catch(e){}
}

function playBreach(){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.linearRampToValueAtTime(60, t + 0.25);
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.35);
  }catch(e){}
}

function resize(){
  if(!canvas) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function laneX(lane){
  var pad = W * 0.06;
  var laneW = (W - pad * 2) / 3;
  return pad + lane * laneW + laneW * 0.5;
}

function laneWidth(){
  return (W - W * 0.12) / 3;
}

function gateY(){
  return H * 0.82;
}

function resetGame(){
  score = 0; lives = 3; combo = 0; maxCombo = 0;
  timeLeft = 60; playerLane = 1; displayLane = 1;
  shards = []; particles = []; lockCascades = []; scorePops = [];
  spawnTimer = 0; spawnInterval = 1.4; fallSpeed = 90; elapsed = 0; shake = 0; fogOffset = 0;
  updateHUD();
}

function updateHUD(){
  if(scoreEl) scoreEl.textContent = String(score);
  if(timeEl) timeEl.textContent = String(Math.ceil(Math.max(0, timeLeft)));
  if(lifeEl){
    var s = '';
    for(var i = 0; i < 3; i++) s += i < lives ? '●' : '○';
    lifeEl.textContent = s;
  }
  if(comboEl){
    if(combo > 1){
      comboEl.textContent = '×' + combo + ' CASCADE';
      comboEl.classList.add('on');
    } else {
      comboEl.classList.remove('on');
    }
  }
}

function spawnShard(){
  var typeIdx = Math.floor(Math.random() * SHARD_TYPES.length);
  if(elapsed > 15 && Math.random() < 0.25) typeIdx = Math.floor(Math.random() * SHARD_TYPES.length);
  if(elapsed > 30 && Math.random() < 0.2){
    typeIdx = Math.floor(Math.random() * SHARD_TYPES.length);
  }
  var st = SHARD_TYPES[typeIdx];
  var lane = st.lane;
  if(elapsed > 20 && Math.random() < 0.15){
    lane = Math.floor(Math.random() * 3);
  }
  shards.push({
    lane: lane,
    x: laneX(lane),
    y: -40,
    type: st,
    wobble: Math.random() * Math.PI * 2,
    sealed: false,
    resolved: false,
    speed: fallSpeed * (0.85 + Math.random() * 0.3)
  });
}

function addParticles(x, y, color, n){
  for(var i = 0; i < (n || 12); i++){
    var ang = Math.random() * Math.PI * 2;
    var spd = 40 + Math.random() * 120;
    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 30,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.6,
      color: color,
      size: 2 + Math.random() * 3
    });
  }
}

function triggerLockCascade(x, y){
  lockCascades.push({ x: x, y: y, r: 8, life: 0.5, maxLife: 0.5 });
  playLockClick(880 + combo * 40, 0.1);
  try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
  var count = Math.min(3 + combo, 8);
  for(var i = 0; i < count; i++){
    setTimeout(function(j){
      playLockClick(660 + j * 80, 0.06);
    }, i * 45, i);
  }
}

function sealShard(shard){
  shard.sealed = true;
  shard.resolved = true;
  shard.sealTimer = 0.5;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  var pts = 10 + combo * 5;
  score += pts;
  scorePops.push({ x: shard.x, y: shard.y - 20, text: '+' + pts, life: 0.9 });
  triggerLockCascade(shard.x, shard.y);
  addParticles(shard.x, shard.y, LANES[shard.lane].color, 14);
  updateHUD();
}

function breachShard(shard){
  shard.resolved = true;
  combo = 0;
  lives--;
  shake = 8;
  playBreach();
  try{ navigator.vibrate && navigator.vibrate([30, 20, 50]); }catch(e){}
  if(breachFlash){
    breachFlash.classList.add('on');
    setTimeout(function(){ breachFlash.classList.remove('on'); }, 120);
  }
  addParticles(shard.x, shard.y, '#e8a020', 8);
  updateHUD();
  if(lives <= 0) endGame(false);
}

function endGame(won){
  state = 'gameover';
  if(finalScoreEl) finalScoreEl.textContent = String(score);
  if(endMsgEl){
    if(won) endMsgEl.textContent = 'All fragments sealed. Vault integrity restored.';
    else if(lives <= 0) endMsgEl.textContent = 'Classified data spilled into the fog.';
    else endMsgEl.textContent = 'Shift ended. The overcast holds.';
  }
  if(gameOverOverlay) gameOverOverlay.classList.remove('hidden');
  if(titleOverlay) titleOverlay.classList.add('hidden');
}

function startGame(){
  resetGame();
  state = 'playing';
  if(titleOverlay) titleOverlay.classList.add('hidden');
  if(gameOverOverlay) gameOverOverlay.classList.add('hidden');
  initAudio();
  lastTs = performance.now();
}

function setLane(dir){
  if(state !== 'playing') return;
  var prev = playerLane;
  playerLane = Math.max(0, Math.min(2, playerLane + dir));
  if(playerLane !== prev){
    try{ navigator.vibrate && navigator.vibrate(4); }catch(e){}
  }
}

var touchStartX = 0, touchStartY = 0, touchActive = false;

function onTouchStart(e){
  if(!e.touches || !e.touches.length) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchActive = true;
  if(e.cancelable) e.preventDefault();
}

function onTouchMove(e){
  if(e.cancelable) e.preventDefault();
}

function onTouchEnd(e){
  if(!touchActive) return;
  touchActive = false;
  var t = (e.changedTouches && e.changedTouches[0]) || null;
  if(!t) return;
  var dx = t.clientX - touchStartX;
  var dy = t.clientY - touchStartY;
  if(Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.2){
    setLane(dx > 0 ? 1 : -1);
  }
  if(e.cancelable) e.preventDefault();
}

function onKeyDown(e){
  if(!e) return;
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setLane(-1);
  if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setLane(1);
}

function drawSkyline(c){
  var baseY = H * 0.72;
  ctx.fillStyle = c.skyline;
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  var pts = [0.05,0.12,0.18,0.28,0.35,0.42,0.52,0.58,0.65,0.72,0.78,0.85,0.92,1];
  var heights = [0.04,0.09,0.06,0.14,0.08,0.11,0.18,0.07,0.12,0.05,0.10,0.08,0.06,0.03];
  for(var i = 0; i < pts.length; i++){
    var px = W * pts[i];
    var py = baseY - H * heights[i];
    ctx.lineTo(px, py);
  }
  ctx.lineTo(W, baseY);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = c.fog;
  ctx.fillRect(0, baseY - H * 0.02 + Math.sin(fogOffset) * 4, W, H * 0.35);
}

function drawLanes(c){
  var pad = W * 0.06;
  var laneW = (W - pad * 2) / 3;
  var top = H * 0.12;
  var bottom = H * 0.88;

  ctx.fillStyle = c.terminal;
  ctx.globalAlpha = 0.35;
  ctx.fillRect(pad, top, W - pad * 2, bottom - top);
  ctx.globalAlpha = 1;

  for(var i = 0; i <= 3; i++){
    var x = pad + i * laneW;
    ctx.strokeStyle = c.laneLine;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x, bottom);
    ctx.stroke();
  }

  for(var j = 0; j < 3; j++){
    var lx = laneX(j);
    ctx.fillStyle = c.muted;
    ctx.font = '600 10px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(LANES[j].name, lx, top - 8);
  }
}

function drawGate(c){
  var gy = gateY();
  var lw = laneWidth() * 0.7;
  var dl = Math.round(displayLane);
  for(var i = 0; i < 3; i++){
    var x = laneX(i);
    var active = i === dl;
    ctx.strokeStyle = LANES[i].color;
    ctx.lineWidth = active ? 3 : 1;
    ctx.globalAlpha = active ? 1 : 0.25;
    ctx.beginPath();
    roundRect(ctx, x - lw/2, gy - 14, lw, 28, 6);
    ctx.stroke();
    if(active){
      ctx.fillStyle = LANES[i].color;
      ctx.globalAlpha = 0.15;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if(active){
      ctx.fillStyle = c.amber;
      ctx.font = '700 9px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('◉ LOCK', x, gy + 42);
    }
  }
}

function roundRect(c, x, y, w, h, r){
  if(c.roundRect){
    c.beginPath();
    c.roundRect(x, y, w, h, r);
    return;
  }
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawShard(shard, c){
  if(shard.sealed){
    ctx.globalAlpha = Math.max(0, 1 - (0.5 - shard.sealTimer) * 4);
    if(shard.sealTimer <= 0) return;
  }
  var col = LANES[shard.lane].color;
  var size = 28;

  ctx.save();
  ctx.translate(shard.x + Math.sin(shard.wobble) * 2, shard.y);
  ctx.fillStyle = darkMode ? 'rgba(0,0,0,0.4)' : 'rgba(0,0,0,0.12)';
  roundRect(ctx, -size/2 + 2, 4, size, size, 5);
  ctx.fill();

  ctx.fillStyle = col;
  ctx.globalAlpha = 0.9;
  roundRect(ctx, -size/2, 0, size, size, 5);
  ctx.fill();

  ctx.fillStyle = darkMode ? '#fff' : '#1a1d21';
  ctx.globalAlpha = 0.9;
  ctx.font = '600 11px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(shard.type.label, 0, size/2);

  ctx.strokeStyle = c.amber;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.6 + Math.sin(shard.wobble * 2) * 0.2;
  ctx.beginPath();
  ctx.moveTo(-size/2 + 4, -4);
  ctx.lineTo(size/2 - 4, -4);
  ctx.stroke();

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawParticles(){
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= 0.016;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * 0.016;
    p.y += p.vy * 0.016;
    p.vy += 120 * 0.016;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawCascades(c){
  for(var i = lockCascades.length - 1; i >= 0; i--){
    var lc = lockCascades[i];
    lc.life -= 0.016;
    lc.r += 80 * 0.016;
    if(lc.life <= 0){ lockCascades.splice(i, 1); continue; }
    ctx.strokeStyle = c.amber;
    ctx.lineWidth = 2;
    ctx.globalAlpha = (lc.life / lc.maxLife) * 0.6;
    ctx.beginPath();
    ctx.arc(lc.x, lc.y, lc.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawScorePops(c){
  for(var i = scorePops.length - 1; i >= 0; i--){
    var sp = scorePops[i];
    sp.life -= 0.016;
    sp.y -= 28 * 0.016;
    if(sp.life <= 0){ scorePops.splice(i, 1); continue; }
    ctx.globalAlpha = sp.life;
    ctx.fillStyle = c.amber;
    ctx.font = '700 14px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(sp.text, sp.x, sp.y);
  }
  ctx.globalAlpha = 1;
}

function drawScanlines(c){
  ctx.fillStyle = darkMode ? 'rgba(255,255,255,0.015)' : 'rgba(0,0,0,0.02)';
  for(var y = 0; y < H; y += 4){
    ctx.fillRect(0, y, W, 1);
  }
}

function render(){
  if(!ctx) return;
  var c = getColors();
  ctx.save();
  if(shake > 0.5){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.88;
  }
  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, W, H);
  drawSkyline(c);
  drawLanes(c);

  for(var i = 0; i < shards.length; i++){
    drawShard(shards[i], c);
  }
  drawGate(c);
  drawCascades(c);
  drawParticles();
  drawScorePops(c);
  drawScanlines(c);

  if(state === 'playing'){
    ctx.fillStyle = c.amber;
    ctx.font = '600 10px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'left';
    ctx.globalAlpha = 0.7;
    ctx.fillText('BREACH ALERT · CONTAIN', 16, H * 0.95);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function update(dt){
  if(state !== 'playing') return;

  elapsed += dt;
  fogOffset += dt * 0.8;
  displayLane += (playerLane - displayLane) * Math.min(1, dt * 14);
  timeLeft -= dt;
  if(timeLeft <= 0){
    timeLeft = 0;
    updateHUD();
    endGame(true);
    return;
  }

  spawnTimer += dt;
  var difficulty = Math.min(elapsed / 55, 1);
  spawnInterval = Math.max(0.45, 1.4 - difficulty * 0.9);
  fallSpeed = 90 + difficulty * 110;

  if(spawnTimer >= spawnInterval){
    spawnTimer = 0;
    spawnShard();
    if(elapsed > 25 && Math.random() < 0.3) spawnShard();
  }

  for(var i = shards.length - 1; i >= 0; i--){
    var s = shards[i];
    if(s.sealed){
      s.sealTimer = (s.sealTimer || 0.5) - dt;
      if(s.sealTimer <= 0){ shards.splice(i, 1); continue; }
      continue;
    }
    s.y += s.speed * dt;
    s.wobble += dt * 4;
    s.x = laneX(s.lane) + Math.sin(s.wobble) * 3;

    if(s.y >= gateY() && !s.resolved){
      if(s.lane === playerLane) sealShard(s);
      else breachShard(s);
    }
    if(s.y > H + 50 && !s.resolved){
      breachShard(s);
    }
  }

  updateHUD();
}

function loop(ts){
  if(!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  update(dt);
  render();
  animId = requestAnimationFrame(loop);
}

function boot(){
  resize();
  render();
  if(startBtn) startBtn.addEventListener('click', startGame);
  if(restartBtn) restartBtn.addEventListener('click', startGame);
  window.addEventListener('resize', function(){ resize(); render(); });
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('mousedown', function(e){
    touchStartX = e.clientX;
    touchStartY = e.clientY;
    touchActive = true;
  });
  canvas.addEventListener('mouseup', function(e){
    if(!touchActive) return;
    touchActive = false;
    var dx = e.clientX - touchStartX;
    var dy = e.clientY - touchStartY;
    if(Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy)) setLane(dx > 0 ? 1 : -1);
  });
  window.addEventListener('keydown', onKeyDown);
  if(window.matchMedia){
    try{
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ render(); });
    }catch(e){}
  }
  animId = requestAnimationFrame(loop);
}

if(canvas && ctx){
  boot();
} else {
  document.body.innerHTML = '<p style="padding:24px;font-family:monospace">Canvas unavailable.</p>';
}
})();
</script>
</body>
</html>
