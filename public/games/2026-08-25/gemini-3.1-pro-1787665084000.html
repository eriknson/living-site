<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REDACTED</title>
<style>
    :root {
        --bg-color: #f4f1ea;
        --text-color: #111111;
        --node-bg: #ffffff;
        --node-bg-alt: #e8e8e8;
        --path-color: rgba(211, 47, 47, 0.8);
        --path-fill: rgba(211, 47, 47, 0.3);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --node-bg: #2a2a2a;
            --node-bg-alt: #333333;
            --path-color: rgba(255, 82, 82, 0.8);
            --path-fill: rgba(255, 82, 82, 0.3);
        }
    }
    body, html {
        margin: 0; padding: 0;
        width: 100vw; height: 100dvh;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    canvas {
        display: block;
        width: 100%; height: 100%;
    }
    #ui-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        pointer-events: none;
    }
    .screen {
        background: var(--bg-color);
        padding: 2rem;
        border: 4px solid var(--text-color);
        text-align: center;
        box-shadow: 8px 8px 0px var(--text-color);
        max-width: 80%;
        pointer-events: none;
    }
    .screen * {
        pointer-events: none;
    }
    h1 {
        margin-top: 0;
        font-size: 2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    p {
        font-size: 1rem;
        line-height: 1.4;
        margin-bottom: 2rem;
    }
    button {
        pointer-events: auto !important;
        font-family: inherit;
        font-size: 1.2rem;
        font-weight: bold;
        background: var(--text-color);
        color: var(--bg-color);
        border: none;
        padding: 1rem 2rem;
        cursor: pointer;
        text-transform: uppercase;
        transition: transform 0.1s;
    }
    button:active {
        transform: translate(4px, 4px);
    }
</style>
</head>
<body>

<div id="ui-layer">
    <div id="menu" class="screen">
        <h1>REDACTED</h1>
        <p>Find the leaked signals before the board rejects you.<br><br>Drag to connect letters.</p>
        <button data-smoke="start" id="start-btn">START</button>
    </div>
    <div id="gameover" class="screen" style="display: none;">
        <h1>ACCESS REVOKED</h1>
        <p>Signals recovered: <span id="score-display">0</span></p>
        <button data-smoke="restart" id="restart-btn">RESTART</button>
    </div>
</div>
<canvas id="game-canvas"></canvas>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const offscreenCanvas = document.createElement('canvas');
const offscreenCtx = offscreenCanvas.getContext('2d', { alpha: false });

let gameState = 'MENU';
let score = 0;
let levelIndex = 0;
let currentLevel = null;
let targetWord = "";
let nodes = [];
let cellSize = 0;
let timeLeft = 0;
let lastTime = 0;
let glitchTimer = 0;
const glitchDuration = 0.5;
let shakeTimer = 0;

let isDragging = false;
let currentPath = [];
let pointerPos = {x: 0, y: 0};

let colors = {};

const WORDS = [
    "VAULT", "BREACH", "AGENT", "HOURS", "PUZZLE", "NIGHT", "SUMMER", "TRIAL", "SHIP",
    "AUGUST", "QUIET", "COLD", "CODE", "LEAK", "SECRET", "SYSTEM", "DATA",
    "ERROR", "GLITCH", "ACCESS", "DENIED", "FILE", "SHADOW", "TRACE", "TRACK",
    "WIRE", "SIGNAL", "LOCK", "DOOR", "GATE", "WALL", "CELL", "CORE", "NODE",
    "NETWORK", "ARCHIVE", "CONTROL", "MONITOR", "COMMAND", "PROGRAM", "ENCRYPT"
];

const LEVELS = [
    { cols: 6, rows: 8, wordLen: 4, density: 0.3, time: 30 },
    { cols: 6, rows: 7, wordLen: 4, density: 0.4, time: 25 },
    { cols: 5, rows: 7, wordLen: 5, density: 0.5, time: 20 },
    { cols: 5, rows: 6, wordLen: 5, density: 0.6, time: 18 },
    { cols: 4, rows: 6, wordLen: 6, density: 0.7, time: 15 },
    { cols: 4, rows: 5, wordLen: 6, density: 0.8, time: 12 },
    { cols: 4, rows: 4, wordLen: 7, density: 1.0, time: 10 },
];

const FONTS = [
    'ui-monospace, monospace',
    'Georgia, serif',
    'Arial, sans-serif',
    'Courier New, monospace'
];

class Node {
    constructor(c, r, letter) {
        this.c = c;
        this.r = r;
        this.letter = letter;
        this.x = 0;
        this.y = 0;
        this.w = 0;
        this.h = 0;
        this.angle = (Math.random() - 0.5) * 0.2;
        this.font = FONTS[Math.floor(Math.random() * FONTS.length)];
    }
}

function getCSSVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function updateColors() {
    colors.bg = getCSSVar('--bg-color');
    colors.text = getCSSVar('--text-color');
    colors.nodeBg = getCSSVar('--node-bg');
    colors.nodeBgAlt = getCSSVar('--node-bg-alt');
    colors.path = getCSSVar('--path-color');
    colors.pathFill = getCSSVar('--path-fill');
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    offscreenCanvas.width = canvas.width;
    offscreenCanvas.height = canvas.height;
    updateColors();
    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        layoutGrid();
        if (gameState === 'GAMEOVER') draw();
    } else if (gameState === 'MENU') {
        drawMenuBg();
    }
}

function layoutGrid() {
    if (!currentLevel) return;
    let maxCols = 6;
    let maxRows = 8;
    let W = canvas.width * 0.9;
    let H = Math.max(100, canvas.height - 120);
    cellSize = Math.max(10, Math.min(W / maxCols, H / maxRows));
    
    let gridWidth = currentLevel.cols * cellSize;
    let gridHeight = currentLevel.rows * cellSize;
    let startX = (canvas.width - gridWidth) / 2;
    let startY = 100 + (H - gridHeight) / 2;
    
    for (let node of nodes) {
        node.w = cellSize * 0.85;
        node.h = cellSize * 0.85;
        node.x = startX + node.c * cellSize + cellSize / 2;
        node.y = startY + node.r * cellSize + cellSize / 2;
    }
}

function generateGrid(level) {
    let wordsOfLength = WORDS.filter(w => w.length === level.wordLen);
    if (wordsOfLength.length === 0) wordsOfLength = WORDS;
    targetWord = wordsOfLength[Math.floor(Math.random() * wordsOfLength.length)];
    
    let placed = false;
    let attempts = 0;
    
    while (!placed && attempts < 200) {
        attempts++;
        let grid = Array(level.cols).fill(0).map(() => Array(level.rows).fill(null));
        
        let c = Math.floor(Math.random() * level.cols);
        let r = Math.floor(Math.random() * level.rows);
        grid[c][r] = targetWord[0];
        
        let valid = true;
        for (let i = 1; i < targetWord.length; i++) {
            let neighbors = [];
            for (let dc = -1; dc <= 1; dc++) {
                for (let dr = -1; dr <= 1; dr++) {
                    if (dc === 0 && dr === 0) continue;
                    let nc = c + dc;
                    let nr = r + dr;
                    if (nc >= 0 && nc < level.cols && nr >= 0 && nr < level.rows && grid[nc][nr] === null) {
                        neighbors.push({c: nc, r: nr});
                    }
                }
            }
            if (neighbors.length === 0) {
                valid = false;
                break;
            }
            let next = neighbors[Math.floor(Math.random() * neighbors.length)];
            c = next.c;
            r = next.r;
            grid[c][r] = targetWord[i];
        }
        
        if (valid) {
            placed = true;
            nodes = [];
            for (let i = 0; i < level.cols; i++) {
                for (let j = 0; j < level.rows; j++) {
                    if (grid[i][j] !== null) {
                        nodes.push(new Node(i, j, grid[i][j]));
                    } else {
                        if (Math.random() < level.density) {
                            let randomLetter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                            nodes.push(new Node(i, j, randomLetter));
                        }
                    }
                }
            }
        }
    }
    
    if (!placed) {
        targetWord = "ERR";
        nodes = [new Node(0,0,'E'), new Node(1,0,'R'), new Node(2,0,'R')];
    }
    
    layoutGrid();
}

function startGame() {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameover').style.display = 'none';
    document.getElementById('ui-layer').style.display = 'none';
    gameState = 'PLAYING';
    score = 0;
    levelIndex = 0;
    currentLevel = LEVELS[0];
    generateGrid(currentLevel);
    timeLeft = currentLevel.time;
    lastTime = performance.now();
    requestAnimationFrame(loop);
}

function gameOver() {
    gameState = 'GAMEOVER';
    document.getElementById('gameover').style.display = 'block';
    document.getElementById('ui-layer').style.display = 'flex';
    document.getElementById('score-display').innerText = score;
    if (navigator.vibrate) {
        try { navigator.vibrate([100, 50, 100, 50, 200]); } catch(e){}
    }
}

function triggerGlitch() {
    glitchTimer = glitchDuration;
    offscreenCtx.drawImage(canvas, 0, 0);
    
    levelIndex++;
    if (levelIndex >= LEVELS.length) {
        let last = LEVELS[LEVELS.length - 1];
        currentLevel = { ...last, wordLen: Math.min(8, last.wordLen + Math.floor(Math.random() * 2)) };
    } else {
        currentLevel = LEVELS[levelIndex];
    }
    generateGrid(currentLevel);
    timeLeft = currentLevel.time;
    currentPath = [];
}

function getHoveredNode(x, y) {
    for (let node of nodes) {
        let dx = x - node.x;
        let dy = y - node.y;
        if (dx*dx + dy*dy < (node.w/2)*(node.w/2)) {
            return node;
        }
    }
    return null;
}

function onPointerDown(e) {
    if (gameState !== 'PLAYING' || glitchTimer > 0) return;
    isDragging = true;
    pointerPos.x = e.clientX;
    pointerPos.y = e.clientY;
    let node = getHoveredNode(e.clientX, e.clientY);
    if (node) {
        currentPath = [node];
        if (navigator.vibrate) {
            try { navigator.vibrate(10); } catch(e){}
        }
    }
}

function onPointerMove(e) {
    if (!isDragging || gameState !== 'PLAYING' || glitchTimer > 0) return;
    pointerPos.x = e.clientX;
    pointerPos.y = e.clientY;
    
    if (currentPath.length > 0) {
        let node = getHoveredNode(e.clientX, e.clientY);
        if (node && !currentPath.includes(node)) {
            let lastNode = currentPath[currentPath.length - 1];
            let dc = Math.abs(node.c - lastNode.c);
            let dr = Math.abs(node.r - lastNode.r);
            if (dc <= 1 && dr <= 1) {
                currentPath.push(node);
                if (navigator.vibrate) {
                    try { navigator.vibrate(10); } catch(e){}
                }
            }
        }
    }
}

function onPointerUp(e) {
    if (!isDragging) return;
    isDragging = false;
    if (currentPath.length > 0) {
        let word = currentPath.map(n => n.letter).join('');
        if (word === targetWord) {
            score++;
            if (navigator.vibrate) {
                try { navigator.vibrate([30, 50, 30]); } catch(e){}
            }
            triggerGlitch();
        } else {
            if (navigator.vibrate) {
                try { navigator.vibrate(50); } catch(e){}
            }
            shakeTimer = 0.2;
        }
    }
    currentPath = [];
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('touchstart', e => e.preventDefault(), {passive: false});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        updateColors();
        if (gameState === 'MENU') drawMenuBg();
    });
} catch(e) {}

function drawMenuBg() {
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = colors.text;
    for(let i=0; i<5; i++) {
        ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*200+50, Math.random()*20+10);
    }
}

function draw() {
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    if (shakeTimer > 0) {
        ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
    }
    
    if (glitchTimer > 0) {
        let t = glitchTimer / glitchDuration;
        let slices = 15;
        for (let i = 0; i < slices; i++) {
            let sy = (i / slices) * canvas.height;
            let sh = canvas.height / slices;
            let dx = (Math.random() - 0.5) * 60 * t;
            ctx.drawImage(offscreenCanvas, 0, sy, canvas.width, sh, dx, sy, canvas.width, sh);
        }
        if (Math.random() < 0.2) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.globalCompositeOperation = 'difference';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';
        }
        ctx.restore();
        return;
    }
    
    let gridWidth = currentLevel.cols * cellSize;
    let gridHeight = currentLevel.rows * cellSize;
    let startX = (canvas.width - gridWidth) / 2;
    let startY = 100 + (Math.max(100, canvas.height - 120) - gridHeight) / 2;
    
    let safeZoneY = 90;
    ctx.fillStyle = colors.text;
    ctx.fillRect(0, safeZoneY, canvas.width, Math.max(0, startY - 10 - safeZoneY));
    ctx.fillRect(0, startY + gridHeight + 10, canvas.width, canvas.height - (startY + gridHeight + 10));
    ctx.fillRect(0, startY - 10, startX - 10, gridHeight + 20);
    ctx.fillRect(startX + gridWidth + 10, startY - 10, canvas.width - (startX + gridWidth + 10), gridHeight + 20);
    
    ctx.fillStyle = colors.text;
    ctx.font = 'bold 24px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("TARGET: " + targetWord, canvas.width / 2, 40);
    
    ctx.font = '16px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillText("RECOVERED: " + score, 20, 40);
    
    let timeRatio = Math.max(0, timeLeft / currentLevel.time);
    let textWidth = ctx.measureText("TARGET: " + targetWord).width;
    let barStartX = canvas.width / 2 - textWidth / 2;
    let barWidth = textWidth * (1 - timeRatio);
    ctx.fillRect(barStartX - 5, 25, barWidth + 10, 30);
    
    for (let node of nodes) {
        ctx.save();
        ctx.translate(node.x, node.y);
        ctx.rotate(node.angle);
        
        ctx.fillStyle = (node.c + node.r) % 2 === 0 ? colors.nodeBg : colors.nodeBgAlt;
        ctx.fillRect(-node.w/2, -node.h/2, node.w, node.h);
        
        ctx.strokeStyle = colors.text;
        ctx.lineWidth = 2;
        ctx.strokeRect(-node.w/2, -node.h/2, node.w, node.h);
        
        ctx.fillStyle = colors.text;
        ctx.font = `bold ${node.h * 0.6}px ${node.font}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(node.letter, 0, 0);
        
        ctx.restore();
    }
    
    if (currentPath.length > 0) {
        for (let node of currentPath) {
            ctx.fillStyle = colors.pathFill;
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.w/2, 0, Math.PI*2);
            ctx.fill();
        }
        
        ctx.beginPath();
        ctx.moveTo(currentPath[0].x, currentPath[0].y);
        for (let i = 1; i < currentPath.length; i++) {
            ctx.lineTo(currentPath[i].x, currentPath[i].y);
        }
        if (isDragging) {
            ctx.lineTo(pointerPos.x, pointerPos.y);
        }
        ctx.strokeStyle = colors.path;
        ctx.lineWidth = cellSize * 0.15;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
    }
    
    ctx.restore();
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    
    if (gameState === 'PLAYING') {
        if (glitchTimer > 0) {
            glitchTimer -= dt;
        } else {
            timeLeft -= dt;
            if (timeLeft <= 0) {
                gameOver();
            }
        }
        if (shakeTimer > 0) {
            shakeTimer -= dt;
        }
        draw();
    }
    
    requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
