<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karl's Ferry</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#d8dce2;--fg:#141820;--muted:#5a6472;--panel:rgba(255,255,255,.94);
  --water:#1a2838;--fog:rgba(200,210,220,.55);--neon:#00c8b4;--neon2:#ffb020;
  --border:rgba(0,0,0,.1);--shadow:rgba(0,0,0,.14);--hud-bg:rgba(255,255,255,.6);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a0e14;--fg:#e8ecf0;--muted:#889098;--panel:rgba(14,18,24,.96);
    --water:#060a10;--fog:rgba(30,38,48,.65);--neon:#00e8cc;--neon2:#ffc840;
    --border:rgba(255,255,255,.08);--shadow:rgba(0,0,0,.55);--hud-bg:rgba(10,14,20,.7);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;display:block;touch-action:none;background:var(--water)}
#hud{position:absolute;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 6px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.45;
  background:var(--hud-bg);padding:6px 10px;border-radius:8px;backdrop-filter:blur(8px)}
.hud-block strong{display:block;font-size:20px;color:var(--fg);letter-spacing:0;text-transform:none;font-weight:600}
#combo{color:var(--neon2);opacity:0;transition:opacity .18s;font-size:9px;margin-top:1px}
#combo.on{opacity:1}
#fog-bar-wrap{position:absolute;top:max(52px,env(safe-area-inset-top));left:14px;right:14px;
  height:4px;background:rgba(128,140,150,.25);border-radius:2px;pointer-events:none;z-index:2;overflow:hidden}
#fog-bar{height:100%;width:100%;background:linear-gradient(90deg,var(--neon),var(--neon2));
  transform-origin:left center;transform:scaleX(1);transition:transform .15s ease;border-radius:2px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:20px;pointer-events:none;z-index:10;transition:opacity .4s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 22px 22px;
  max-width:340px;width:100%;text-align:center;box-shadow:0 16px 48px var(--shadow);pointer-events:none}
.panel h1{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-bottom:4px}
.panel .sub{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:18px}
.panel p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:18px}
.panel .score-final{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:38px;
  font-weight:600;color:var(--fg);margin:6px 0 2px}
.panel .score-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:16px}
.neon-strip{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.neon-dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:168px;
  padding:12px 28px;border:none;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;
  pointer-events:auto;touch-action:manipulation;transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:scale(.97)}
.btn-start{background:var(--neon);color:#041410;box-shadow:0 4px 20px rgba(0,200,180,.4)}
.btn-restart{background:var(--fg);color:var(--bg);box-shadow:0 4px 16px var(--shadow)}
@media(prefers-color-scheme:dark){.btn-start{color:#001a16}}
#flash{position:absolute;inset:0;background:rgba(0,232,204,.22);opacity:0;pointer-events:none;z-index:5;transition:opacity .07s}
#flash.on{opacity:1}
#swipe-hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:.7;pointer-events:none;z-index:2}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-block">Pings<strong id="scoreVal">0</strong></div>
    <div class="hud-block" style="text-align:center">Time<strong id="timeVal">45</strong></div>
    <div class="hud-block" style="text-align:right">Hull<strong id="lifeVal">●●●</strong>
      <span id="combo">×1 streak</span></div>
  </div>
  <div id="fog-bar-wrap"><div id="fog-bar"></div></div>
  <div id="flash"></div>
  <div id="swipe-hint">← swipe lanes →</div>
  <div id="titleOverlay" class="overlay">
    <div class="panel">
      <h1>Karl's Ferry</h1>
      <div class="sub">Late-summer dusk · SF Bay</div>
      <div class="neon-strip">
        <span class="neon-dot" style="background:var(--neon);color:var(--neon)"></span>
        <span class="neon-dot" style="background:var(--neon2);color:var(--neon2)"></span>
        <span class="neon-dot" style="background:var(--neon);color:var(--neon)"></span>
      </div>
      <p>Swipe between lanes. Collect visibility pings before Karl seals the route. Dodge ghost buoys drifting in the fog.</p>
      <button class="btn btn-start" data-smoke="start" id="startBtn">Cast Off</button>
    </div>
  </div>
  <div id="gameOverOverlay" class="overlay hidden">
    <div class="panel">
      <h1 id="endTitle">Fogged In</h1>
      <div class="sub" id="endSub">Route sealed</div>
      <div class="score-final" id="finalScore">0</div>
      <div class="score-label">visibility pings</div>
      <p id="endMsg">The skyline vanishes beneath Karl.</p>
      <button class="btn btn-restart" data-smoke="restart" id="restartBtn">Try Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var titleOverlay = document.getElementById('titleOverlay');
var gameOverOverlay = document.getElementById('gameOverOverlay');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');
var scoreEl = document.getElementById('scoreVal');
var timeEl = document.getElementById('timeVal');
var lifeEl = document.getElementById('lifeVal');
var comboEl = document.getElementById('combo');
var finalScoreEl = document.getElementById('finalScore');
var endMsgEl = document.getElementById('endMsg');
var endTitleEl = document.getElementById('endTitle');
var endSubEl = document.getElementById('endSub');
var flashEl = document.getElementById('flash');
var fogBarEl = document.getElementById('fog-bar');
var swipeHint = document.getElementById('swipe-hint');

var W = 360, H = 640, dpr = 1;
var state = 'title';
var score = 0, lives = 3, combo = 0, maxCombo = 0;
var timeLeft = 45, elapsed = 0;
var playerLane = 1, displayLane = 1;
var laneWidth = 0, laneCenters = [0,0,0];
var ferryY = 0;
var scrollSpeed = 110;
var fogFront = 0.18;
var fogTarget = 0.18;
var laneNarrow = 0;
var pings = [], buoys = [], particles = [], pierLights = [], scorePops = [];
var spawnPingT = 0, spawnBuoyT = 0;
var pingInterval = 1.1, buoyInterval = 2.8;
var skylineReveal = 0;
var shake = 0, hitPause = 0;
var lastTs = 0, animId = 0;
var audioCtx = null;
var touchStartX = 0, touchStartY = 0, touchActive = false;
var darkMode = false;

var SKYLINE = [
  {x:.08,h:.42,w:.06},{x:.14,h:.55,w:.04},{x:.19,h:.38,w:.05},{x:.25,h:.62,w:.07},
  {x:.33,h:.48,w:.05},{x:.39,h:.72,w:.06},{x:.46,h:.44,w:.04},{x:.52,h:.58,w:.08},
  {x:.61,h:.36,w:.05},{x:.67,h:.52,w:.06},{x:.74,h:.68,w:.05},{x:.81,h:.46,w:.07},
  {x:.88,h:.56,w:.04},{x:.93,h:.40,w:.05}
];

function isDark(){
  try{ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  catch(e){ return false; }
}

function resize(){
  if(!canvas) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  var rect = canvas.getBoundingClientRect();
  W = Math.max(rect.width || 360, 280);
  H = Math.max(rect.height || 640, 400);
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ferryY = H * 0.82;
  updateLanes();
}

function updateLanes(){
  var margin = W * (0.06 + laneNarrow * 0.04);
  var usable = W - margin * 2;
  laneWidth = usable / 3;
  for(var i = 0; i < 3; i++) laneCenters[i] = margin + laneWidth * (i + 0.5);
}

function initAudio(){
  if(audioCtx) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }catch(e){}
}

function tone(freq, dur, type, vol){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol || 0.08, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }catch(e){}
}

function playPingSound(c){
  tone(520 + c * 40, 0.12, 'sine', 0.1);
  tone(780 + c * 30, 0.08, 'triangle', 0.05);
}

function playHitSound(){
  tone(120, 0.25, 'sawtooth', 0.12);
  tone(80, 0.3, 'square', 0.06);
}

function playLaneSound(){
  tone(280, 0.06, 'sine', 0.04);
}

function playWinSound(){
  tone(440, 0.15, 'sine', 0.08);
  setTimeout(function(){ tone(554, 0.15, 'sine', 0.08); }, 100);
  setTimeout(function(){ tone(660, 0.25, 'sine', 0.1); }, 200);
}

function vibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function resetGame(){
  score = 0; lives = 3; combo = 0; maxCombo = 0;
  timeLeft = 45; elapsed = 0;
  playerLane = 1; displayLane = 1;
  scrollSpeed = 110; fogFront = 0.18; fogTarget = 0.18;
  laneNarrow = 0; skylineReveal = 0;
  pings = []; buoys = []; particles = []; scorePops = [];
  spawnPingT = 0.5; spawnBuoyT = 2;
  pingInterval = 1.1; buoyInterval = 2.8;
  shake = 0; hitPause = 0;
  initPierLights();
  updateHUD();
  updateFogBar();
}

function initPierLights(){
  pierLights = [];
  for(var i = 0; i < 12; i++){
    pierLights.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.7,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() > 0.5 ? 'neon' : 'neon2',
      size: 2 + Math.random() * 3
    });
  }
}

function startGame(){
  resetGame();
  state = 'playing';
  if(titleOverlay) titleOverlay.classList.add('hidden');
  if(gameOverOverlay) gameOverOverlay.classList.add('hidden');
  if(swipeHint) swipeHint.style.opacity = '0.5';
  initAudio();
  lastTs = 0;
  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

function endGame(won){
  state = 'over';
  if(swipeHint) swipeHint.style.opacity = '0';
  if(finalScoreEl) finalScoreEl.textContent = String(score);
  if(endTitleEl) endTitleEl.textContent = won ? 'Skyline Clear' : 'Fogged In';
  if(endSubEl) endSubEl.textContent = won ? 'Route open · 45s' : 'Route sealed';
  if(endMsgEl){
    if(won) endMsgEl.textContent = 'You peeled back the fog — Twin Peaks gleam through Karl.';
    else if(lives <= 0) endMsgEl.textContent = 'Ghost buoys tore the hull. Karl swallows the bay.';
    else endMsgEl.textContent = 'The fog wall sealed shut. Another slice lost to Karl.';
  }
  if(gameOverOverlay) gameOverOverlay.classList.remove('hidden');
  if(won) playWinSound();
}

function updateHUD(){
  if(scoreEl) scoreEl.textContent = String(score);
  if(timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
  if(lifeEl){
    var s = '';
    for(var i = 0; i < 3; i++) s += i < lives ? '●' : '○';
    lifeEl.textContent = s;
  }
  if(comboEl){
    if(combo >= 2){ comboEl.textContent = '×' + combo + ' streak'; comboEl.classList.add('on'); }
    else comboEl.classList.remove('on');
  }
}

function updateFogBar(){
  if(!fogBarEl) return;
  var vis = 1 - fogFront;
  fogBarEl.style.transform = 'scaleX(' + Math.max(0.05, vis).toFixed(3) + ')';
}

function switchLane(dir){
  if(state !== 'playing') return;
  var next = playerLane + dir;
  if(next < 0 || next > 2) return;
  playerLane = next;
  playLaneSound();
  vibrate(8);
  spawnParticles(laneCenters[playerLane], ferryY - 20, darkMode ? '#00e8cc' : '#00c8b4', 6);
}

function spawnPing(){
  var lane = Math.floor(Math.random() * 3);
  pings.push({
    lane: lane, y: -30,
    pulse: Math.random() * Math.PI * 2,
    collected: false
  });
}

function spawnBuoy(){
  var lane = Math.floor(Math.random() * 3);
  buoys.push({
    lane: lane, y: -40,
    drift: (Math.random() - 0.5) * 0.3,
    wobble: Math.random() * Math.PI * 2,
    hit: false
  });
}

function spawnParticles(x, y, col, n){
  for(var i = 0; i < n; i++){
    var ang = Math.random() * Math.PI * 2;
    var spd = 40 + Math.random() * 80;
    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 30,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.8, color: col, size: 2 + Math.random() * 3
    });
  }
}

function addScorePop(x, y, txt){
  scorePops.push({x: x, y: y, text: txt, life: 0.8});
}

function collectPing(p){
  if(p.collected) return;
  p.collected = true;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  var pts = 10 + Math.min(combo, 10) * 3;
  score += pts;
  fogTarget = Math.max(0.08, fogTarget - 0.025);
  skylineReveal = Math.min(1, skylineReveal + 0.04);
  playPingSound(combo);
  vibrate(12);
  if(flashEl){ flashEl.classList.add('on'); setTimeout(function(){ flashEl.classList.remove('on'); }, 70); }
  spawnParticles(laneCenters[p.lane], p.y, darkMode ? '#ffc840' : '#ffb020', 10);
  addScorePop(laneCenters[p.lane], p.y, '+' + pts);
  updateHUD();
}

function hitBuoy(b){
  if(b.hit) return;
  b.hit = true;
  combo = 0;
  lives--;
  fogTarget = Math.min(0.55, fogTarget + 0.06);
  shake = 12;
  hitPause = 0.08;
  playHitSound();
  vibrate(40);
  spawnParticles(laneCenters[b.lane], b.y, '#cc4444', 12);
  updateHUD();
  if(lives <= 0) endGame(false);
}

function update(dt){
  if(state !== 'playing' || hitPause > 0){
    hitPause = Math.max(0, hitPause - dt);
    return;
  }

  elapsed += dt;
  timeLeft -= dt;
  if(timeLeft <= 0){ timeLeft = 0; updateHUD(); endGame(true); return; }

  laneNarrow = Math.min(0.6, elapsed / 45 * 0.5);
  updateLanes();

  displayLane += (playerLane - displayLane) * Math.min(1, dt * 14);

  scrollSpeed = 110 + elapsed * 2.5;
  fogFront += (fogTarget - fogFront) * Math.min(1, dt * 2);
  fogTarget = Math.min(0.52, fogTarget + dt * 0.012);
  fogTarget = Math.max(fogFront - 0.01, fogTarget);

  spawnPingT -= dt;
  if(spawnPingT <= 0){
    spawnPing();
    spawnPingT = pingInterval * (0.7 + Math.random() * 0.6);
    pingInterval = Math.max(0.55, 1.1 - elapsed * 0.012);
  }

  spawnBuoyT -= dt;
  if(spawnBuoyT <= 0){
    spawnBuoy();
    spawnBuoyT = buoyInterval * (0.6 + Math.random() * 0.8);
    buoyInterval = Math.max(1.2, 2.8 - elapsed * 0.025);
  }

  var ferryX = laneCenters[0] + (laneCenters[2] - laneCenters[0]) * (displayLane / 2);
  var hitR = laneWidth * 0.22;

  for(var i = pings.length - 1; i >= 0; i--){
    var p = pings[i];
    p.y += scrollSpeed * dt;
    p.pulse += dt * 5;
    if(!p.collected && Math.abs(p.y - ferryY) < 28 && p.lane === playerLane){
      collectPing(p);
    }
    if(p.y > H + 40) pings.splice(i, 1);
  }

  for(var j = buoys.length - 1; j >= 0; j--){
    var b = buoys[j];
    b.y += scrollSpeed * dt * 0.95;
    b.wobble += dt * 3;
    b.lane = Math.max(0, Math.min(2, b.lane + b.drift * dt));
    if(!b.hit && Math.abs(b.y - ferryY) < 32){
      var bx = laneCenters[0] + (laneCenters[2] - laneCenters[0]) * (b.lane / 2);
      if(Math.abs(bx - ferryX) < hitR + 8) hitBuoy(b);
    }
    if(b.y > H + 50) buoys.splice(j, 1);
  }

  if(fogFront > 0.48){
    endGame(false);
    return;
  }

  for(var k = particles.length - 1; k >= 0; k--){
    var pt = particles[k];
    pt.life -= dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 120 * dt;
    if(pt.life <= 0) particles.splice(k, 1);
  }

  for(var s = scorePops.length - 1; s >= 0; s--){
    scorePops[s].life -= dt;
    scorePops[s].y -= 40 * dt;
    if(scorePops[s].life <= 0) scorePops.splice(s, 1);
  }

  for(var l = 0; l < pierLights.length; l++){
    pierLights[l].y += scrollSpeed * dt * 0.3;
    if(pierLights[l].y > H) pierLights[l].y = -20;
  }

  shake = Math.max(0, shake - dt * 30);
  updateHUD();
  updateFogBar();
}

function drawSkyline(reveal){
  if(!ctx) return;
  var baseY = H * 0.28;
  var alpha = reveal * (darkMode ? 0.55 : 0.45);
  ctx.save();
  for(var i = 0; i < SKYLINE.length; i++){
    var b = SKYLINE[i];
    if(b.x > reveal + 0.05) continue;
    var bx = b.x * W;
    var bh = b.h * H * 0.22;
    var bw = b.w * W;
    var grad = ctx.createLinearGradient(bx, baseY - bh, bx, baseY);
    grad.addColorStop(0, darkMode ? 'rgba(180,190,200,' + alpha + ')' : 'rgba(80,90,100,' + alpha + ')');
    grad.addColorStop(1, darkMode ? 'rgba(60,70,80,' + (alpha * 0.5) + ')' : 'rgba(120,130,140,' + (alpha * 0.4) + ')');
    ctx.fillStyle = grad;
    ctx.fillRect(bx - bw / 2, baseY - bh, bw, bh);
  }
  ctx.restore();
}

function drawWater(){
  if(!ctx) return;
  var grad = ctx.createLinearGradient(0, H * 0.3, 0, H);
  grad.addColorStop(0, darkMode ? '#0c1420' : '#1e3048');
  grad.addColorStop(1, darkMode ? '#040810' : '#0e1828');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H * 0.25, W, H);
}

function drawLanes(){
  if(!ctx) return;
  ctx.save();
  ctx.strokeStyle = darkMode ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.setLineDash([8, 16]);
  for(var i = 1; i < 3; i++){
    var x = laneCenters[0] + (laneCenters[2] - laneCenters[0]) * (i / 3);
    ctx.beginPath();
    ctx.moveTo(x, H * 0.2);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function drawFog(){
  if(!ctx) return;
  var fogY = H * fogFront;
  var grad = ctx.createLinearGradient(0, 0, 0, fogY + H * 0.15);
  grad.addColorStop(0, darkMode ? 'rgba(8,12,18,0.95)' : 'rgba(180,190,200,0.92)');
  grad.addColorStop(0.6, darkMode ? 'rgba(20,28,38,0.7)' : 'rgba(200,210,220,0.65)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, fogY + H * 0.2);

  if(fogFront > 0.32 && state === 'playing'){
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(elapsed * 4) * 0.1;
    ctx.fillStyle = darkMode ? 'rgba(255,80,60,0.15)' : 'rgba(200,60,40,0.12)';
    ctx.fillRect(0, fogY - 4, W, 8);
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = 0.15 + Math.sin(elapsed * 0.8) * 0.05;
  ctx.fillStyle = darkMode ? '#889098' : '#b0bcc8';
  for(var i = 0; i < 6; i++){
    var fx = (Math.sin(elapsed * 0.3 + i * 1.2) * 0.5 + 0.5) * W;
    var fy = fogY * (0.3 + i * 0.12);
    ctx.beginPath();
    ctx.ellipse(fx, fy, W * 0.35, 30 + i * 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPierLights(){
  if(!ctx) return;
  for(var i = 0; i < pierLights.length; i++){
    var pl = pierLights[i];
    var flicker = 0.6 + Math.sin(elapsed * 2 + pl.phase) * 0.4;
    var col = pl.color === 'neon'
      ? (darkMode ? 'rgba(0,232,204,' + flicker + ')' : 'rgba(0,200,180,' + flicker + ')')
      : (darkMode ? 'rgba(255,200,64,' + flicker + ')' : 'rgba(255,176,32,' + flicker + ')');
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = 12;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(pl.x, pl.y, pl.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPing(p){
  if(!ctx || p.collected) return;
  var x = laneCenters[0] + (laneCenters[2] - laneCenters[0]) * (p.lane / 2);
  var pulse = 1 + Math.sin(p.pulse) * 0.15;
  var r = 10 * pulse;
  ctx.save();
  ctx.shadowColor = darkMode ? '#00e8cc' : '#00c8b4';
  ctx.shadowBlur = 16;
  ctx.strokeStyle = darkMode ? 'rgba(0,232,204,0.9)' : 'rgba(0,200,180,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, p.y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = darkMode ? 'rgba(0,232,204,0.25)' : 'rgba(0,200,180,0.2)';
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = darkMode ? '#00e8cc' : '#00c8b4';
  ctx.beginPath();
  ctx.arc(x, p.y, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBuoy(b){
  if(!ctx) return;
  var x = laneCenters[0] + (laneCenters[2] - laneCenters[0]) * (b.lane / 2);
  var wob = Math.sin(b.wobble) * 3;
  ctx.save();
  ctx.globalAlpha = b.hit ? 0.3 : 0.75;
  ctx.fillStyle = darkMode ? 'rgba(160,170,180,0.5)' : 'rgba(140,150,160,0.55)';
  ctx.beginPath();
  ctx.ellipse(x + wob, b.y, 14, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = darkMode ? 'rgba(200,210,220,0.4)' : 'rgba(100,110,120,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = darkMode ? 'rgba(220,230,240,0.6)' : 'rgba(80,90,100,0.7)';
  ctx.beginPath();
  ctx.arc(x + wob, b.y - 14, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFerry(){
  if(!ctx) return;
  var x = laneCenters[0] + (laneCenters[2] - laneCenters[0]) * (displayLane / 2);
  var y = ferryY;
  ctx.save();
  ctx.translate(x, y);
  var bob = Math.sin(elapsed * 4) * 2;
  ctx.translate(0, bob);

  ctx.fillStyle = darkMode ? '#1a2430' : '#2a3848';
  ctx.beginPath();
  ctx.moveTo(-22, 4);
  ctx.lineTo(22, 4);
  ctx.lineTo(16, 16);
  ctx.lineTo(-16, 16);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = darkMode ? '#243040' : '#3a4a5a';
  ctx.fillRect(-8, -8, 16, 12);

  ctx.fillStyle = darkMode ? '#ffc840' : '#ffb020';
  ctx.shadowColor = darkMode ? '#ffc840' : '#ffb020';
  ctx.shadowBlur = 8;
  ctx.fillRect(-3, -14, 6, 6);
  ctx.shadowBlur = 0;

  ctx.strokeStyle = darkMode ? 'rgba(0,232,204,0.6)' : 'rgba(0,200,180,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, 16);
  ctx.lineTo(0, 24);
  ctx.stroke();

  ctx.restore();
}

function drawParticles(){
  if(!ctx) return;
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawScorePops(){
  if(!ctx) return;
  ctx.font = '600 14px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  for(var i = 0; i < scorePops.length; i++){
    var sp = scorePops[i];
    ctx.globalAlpha = sp.life / 0.8;
    ctx.fillStyle = darkMode ? '#ffc840' : '#ffb020';
    ctx.fillText(sp.text, sp.x, sp.y);
  }
  ctx.globalAlpha = 1;
}

function draw(){
  if(!ctx) return;
  darkMode = isDark();
  ctx.save();
  if(shake > 0){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  ctx.fillStyle = darkMode ? '#060a10' : '#142030';
  ctx.fillRect(0, 0, W, H);

  drawSkyline(skylineReveal);
  drawWater();
  drawLanes();
  drawPierLights();

  for(var i = 0; i < pings.length; i++) drawPing(pings[i]);
  for(var j = 0; j < buoys.length; j++) drawBuoy(buoys[j]);

  drawFerry();
  drawParticles();
  drawScorePops();
  drawFog();

  ctx.restore();
}

function loop(ts){
  if(!lastTs) lastTs = ts;
  var dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  if(state === 'playing') update(dt);
  draw();
  animId = requestAnimationFrame(loop);
}

function handleSwipe(dx){
  if(Math.abs(dx) < 24) return;
  switchLane(dx > 0 ? 1 : -1);
}

function onTouchStart(e){
  if(!e.touches || !e.touches.length) return;
  touchActive = true;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  if(e.cancelable) e.preventDefault();
}

function onTouchEnd(e){
  if(!touchActive) return;
  touchActive = false;
  var t = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
  if(!t) return;
  var dx = t.clientX - touchStartX;
  var dy = t.clientY - touchStartY;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) >= 24){
    handleSwipe(dx);
  } else if(Math.abs(dx) < 24 && Math.abs(dy) < 24 && state === 'playing'){
    var rect = canvas ? canvas.getBoundingClientRect() : null;
    if(rect){
      var relX = (t.clientX - rect.left) / rect.width;
      if(relX < 0.33) switchLane(-1);
      else if(relX > 0.67) switchLane(1);
    }
  }
  if(e.cancelable) e.preventDefault();
}

function onKeyDown(e){
  if(!e || !e.key) return;
  var k = e.key;
  if(k === 'ArrowLeft' || k === 'a' || k === 'A') switchLane(-1);
  else if(k === 'ArrowRight' || k === 'd' || k === 'D') switchLane(1);
}

function bindEvents(){
  if(startBtn) startBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
  if(restartBtn) restartBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', onKeyDown);
  if(canvas){
    canvas.addEventListener('touchstart', onTouchStart, {passive: false});
    canvas.addEventListener('touchend', onTouchEnd, {passive: false});
    canvas.addEventListener('touchmove', function(e){ if(e.cancelable) e.preventDefault(); }, {passive: false});
    canvas.addEventListener('mousedown', function(e){
      touchStartX = e.clientX; touchStartY = e.clientY; touchActive = true;
    });
    canvas.addEventListener('mouseup', function(e){
      if(!touchActive) return;
      touchActive = false;
      var dx = e.clientX - touchStartX;
      var dy = e.clientY - touchStartY;
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) >= 24) handleSwipe(dx);
      else if(Math.abs(dx) < 24 && Math.abs(dy) < 24 && state === 'playing'){
        var rect = canvas.getBoundingClientRect();
        var relX = (e.clientX - rect.left) / rect.width;
        if(relX < 0.33) switchLane(-1);
        else if(relX > 0.67) switchLane(1);
      }
    });
  }
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if(mq && mq.addEventListener) mq.addEventListener('change', function(){ darkMode = isDark(); });
  }catch(e){}
}

function init(){
  darkMode = isDark();
  resize();
  initPierLights();
  bindEvents();
  draw();
  animId = requestAnimationFrame(function(ts){ lastTs = ts; loop(ts); });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
</body>
</html>
