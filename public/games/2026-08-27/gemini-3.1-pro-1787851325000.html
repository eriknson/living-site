<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broadcast Director</title>
<style>
:root {
    --bg: #f4f4f5;
    --fg: #18181b;
    --accent: #ef4444; /* Broadcast Red */
    --grid-bg: #ffffff;
    --cell-border: #d4d4d8;
    --cell-filled: #18181b;
    --cell-filled-fg: #ffffff;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #09090b;
        --fg: #f4f4f5;
        --accent: #ef4444;
        --grid-bg: #18181b;
        --cell-border: #3f3f46;
        --cell-filled: #f4f4f5;
        --cell-filled-fg: #09090b;
    }
}

html, body {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.scanlines {
    position: fixed;
    top: 0; left: 0; width: 100dvw; height: 100dvh;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 999;
}
@media (prefers-color-scheme: dark) {
    .scanlines {
        background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0) 50%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.05));
    }
}

.screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 100;
}

h1 {
    font-family: 'Times New Roman', Times, serif;
    font-size: 3rem;
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: -1px;
    line-height: 1.1;
    text-transform: uppercase;
}

p {
    text-align: center;
    max-width: 80%;
    line-height: 1.6;
    font-size: 1rem;
}

button {
    appearance: none;
    background: var(--bg);
    color: var(--accent);
    border: 2px solid var(--accent);
    padding: 15px 30px;
    font-size: 1.2rem;
    font-family: ui-monospace, monospace;
    font-weight: bold;
    cursor: pointer;
    margin-top: 30px;
    text-transform: uppercase;
    transition: all 0.1s;
    box-shadow: 4px 4px 0 var(--accent);
}
button:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--accent);
}

.hud {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 10%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 5%;
    box-sizing: border-box;
    font-size: 1rem;
    font-weight: bold;
    border-bottom: 2px solid var(--cell-border);
    z-index: 10;
}
#time-display { color: var(--accent); }

.video-feed {
    position: absolute;
    top: 12%; left: 5%; right: 5%; height: 43%;
    background: #111;
    border: 2px solid var(--cell-border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow: hidden;
}

.smpte-bars {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to right, 
        #c0c0c0 14.28%, #c0c000 14.28% 28.56%, #00c0c0 28.56% 42.84%, 
        #00c000 42.84% 57.12%, #ff8800 57.12% 71.4%, #c00000 71.4% 85.68%, #0000c0 85.68%);
    z-index: 0;
    opacity: 0.15;
}
@media (prefers-color-scheme: dark) { .smpte-bars { opacity: 0.3; } }

.live-bug {
    position: absolute;
    top: 15px; right: 15px;
    background: var(--accent);
    color: #fff;
    padding: 4px 10px;
    font-weight: bold;
    font-size: 1rem;
    border-radius: 4px;
    animation: blink 1s infinite;
    z-index: 2;
}
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

.director-call {
    font-family: 'Times New Roman', Times, serif;
    font-size: 2.5rem;
    color: #fff;
    text-align: center;
    padding: 0 20px;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    z-index: 2;
}

.lower-third {
    position: absolute;
    bottom: 5%; left: 5%; right: 5%; height: 35%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 12px;
}

.cell {
    background: var(--grid-bg);
    border: 2px solid var(--cell-border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--fg);
    position: relative;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--cell-border);
    transition: transform 0.1s, box-shadow 0.1s;
}
.cell:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--cell-border);
}

.cell.required {
    border-color: var(--accent);
    box-shadow: 0 4px 0 var(--accent);
}
.cell.required:active { box-shadow: 0 0 0 var(--accent); }

.cell.required::after {
    content: '';
    position: absolute;
    top: -6px; left: -6px; right: -6px; bottom: -6px;
    border: 3px solid var(--accent);
    border-radius: 8px;
    transform: scale(var(--approach-scale, 1.5));
    opacity: var(--approach-opacity, 0);
    pointer-events: none;
}

.cell.filled {
    background: var(--cell-filled);
    color: var(--cell-filled-fg);
    border-color: var(--cell-filled);
    box-shadow: 0 4px 0 rgba(0,0,0,0.5);
}
.cell.filled:active { box-shadow: 0 0 0 rgba(0,0,0,0.5); }

.cell.blocked {
    background: repeating-linear-gradient(45deg, var(--cell-border), var(--cell-border) 10px, var(--bg) 10px, var(--bg) 20px);
    color: transparent;
    border-color: var(--cell-border);
    cursor: not-allowed;
}
.cell.blocked::before {
    content: 'ERR';
    position: absolute;
    background: var(--fg);
    color: var(--bg);
    padding: 2px 4px;
    font-size: 0.7rem;
    transform: rotate(-10deg);
}

.shake { animation: shake 0.2s; }
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
}

.squeezeback .video-feed {
    transform: scale(0.92) translateY(-4%);
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
}
.squeezeback .director-call {
    color: var(--accent);
    transform: scale(1.1);
}
</style>
</head>
<body>

<div class="scanlines"></div>

<div id="game-container">
    <div class="hud">
        <div id="time-display">T-MINUS 60.0s</div>
        <div id="score-display">SEGMENTS: 0</div>
        <div id="strikes-display">ERRORS: 0/3</div>
    </div>
    
    <div class="video-feed" id="video-feed">
        <div class="smpte-bars"></div>
        <div class="live-bug">LIVE</div>
        <div class="director-call" id="director-call">STANDBY...</div>
    </div>
    
    <div class="lower-third" id="grid"></div>
</div>

<div id="title-screen" class="screen">
    <h1>BROADCAST<br>DIRECTOR</h1>
    <p>
        Rebuild the lower-third on the beat.<br><br>
        Watch the pulse. Tap the highlighted cells to place graphics.<br>
        3 errors and you're off the air.
    </p>
    <button data-smoke="start" id="btn-start">GO LIVE</button>
</div>

<div id="game-over-screen" class="screen" style="display: none;">
    <h1 id="go-title">OFF AIR</h1>
    <p id="go-score">Segments completed: 0</p>
    <button data-smoke="restart" id="btn-restart">RESTART BROADCAST</button>
</div>

<script>
const DIRECTOR_CALLS = [
    "CUE GRAPHICS!", "LOWER THIRD, GO!", "BRING UP THE NAME!", 
    "STANDBY TICKER...", "SQUEEZEBACK READY!", "GUEST INFO, NOW!", 
    "UPDATE THE BUG!", "ROLL B-ROLL!"
];
const GRAPHIC_TEXTS = ["LIVE", "BREAKING", "EXCLUSIVE", "GUEST", "WEATHER", "SPORTS", "TICKER", "UPDATE", "ALERT", "NAME"];

let audioCtx;
let isPlaying = false;
let isTransitioning = false;
let startTime = 0;
let tempo = 100;
let nextBeatTime = 0;
let beatCount = 0;
let gameTime = 60;
let score = 0;
let strikes = 0;
let lastTime = performance.now();
let lastBeatInt = -1;

let grid = [];
let requiredCells = [];
let filledCells = [];

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playKick(time, isDownbeat) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.3);
    gain.gain.setValueAtTime(0.8, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
    osc.start(time);
    osc.stop(time + 0.3);
    
    let bassOsc = audioCtx.createOscillator();
    let bassGain = audioCtx.createGain();
    bassOsc.type = 'triangle';
    bassOsc.frequency.value = isDownbeat ? 55 : 65;
    bassOsc.connect(bassGain);
    bassGain.connect(audioCtx.destination);
    bassGain.gain.setValueAtTime(0.4, time);
    bassGain.gain.exponentialRampToValueAtTime(0.01, time + 0.4);
    bassOsc.start(time);
    bassOsc.stop(time + 0.4);
}

function playHat(time) {
    if (!audioCtx) return;
    let bufferSize = audioCtx.sampleRate * 0.05; 
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    let noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    let filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 7000;
    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(time);
}

function playBlip(time, freq, type = 'sine') {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0.5, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.1);
}

function startGame() {
    initAudio();
    isPlaying = true;
    isTransitioning = false;
    tempo = 100;
    startTime = audioCtx.currentTime + 0.1;
    nextBeatTime = startTime;
    beatCount = 0;
    gameTime = 60;
    score = 0;
    strikes = 0;
    lastTime = performance.now();
    lastBeatInt = -1;
    
    updateHUD();
    generateLayout();
    requestAnimationFrame(loop);
}

function updateHUD() {
    document.getElementById('score-display').textContent = 'SEGMENTS: ' + score;
    document.getElementById('strikes-display').textContent = 'ERRORS: ' + strikes + '/3';
}

function generateLayout() {
    grid = new Array(8).fill('empty');
    filledCells = [];
    
    let numRequired = 2 + Math.floor(score / 3);
    if (numRequired > 6) numRequired = 6;
    
    let available = [0,1,2,3,4,5,6,7];
    available.sort(() => Math.random() - 0.5);
    requiredCells = available.slice(0, numRequired);
    
    requiredCells.forEach(idx => { grid[idx] = 'required'; });
    
    if (score >= 4) {
        let numBlocked = Math.floor((score - 2) / 3);
        if (numBlocked > 3) numBlocked = 3;
        let remaining = available.slice(numRequired);
        for (let i = 0; i < numBlocked; i++) {
            grid[remaining[i]] = 'blocked';
        }
    }
    
    renderGrid();
    document.getElementById('director-call').textContent = DIRECTOR_CALLS[Math.floor(Math.random() * DIRECTOR_CALLS.length)];
}

let lastTapTime = 0;
function renderGrid() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    
    for (let i = 0; i < 8; i++) {
        let cell = document.createElement('div');
        cell.className = 'cell ' + grid[i];
        cell.id = 'cell-' + i;
        
        cell.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            let now = performance.now();
            if (now - lastTapTime < 50) return;
            lastTapTime = now;
            onCellTap(i);
        });
        
        gridEl.appendChild(cell);
    }
}

function onCellTap(cellIndex) {
    if (!isPlaying || isTransitioning) return;
    
    let currentAudioTime = audioCtx.currentTime;
    let exactBeat = (currentAudioTime - startTime) * (tempo / 60);
    let nearestBeat = Math.round(exactBeat);
    let error = Math.abs(exactBeat - nearestBeat);
    
    if (error <= 0.3) {
        handleHit(cellIndex);
    } else {
        handleMiss();
    }
}

function handleHit(cellIndex) {
    if (grid[cellIndex] === 'filled') return;
    if (grid[cellIndex] !== 'required') {
        handleMiss();
        return;
    }
    
    grid[cellIndex] = 'filled';
    filledCells.push(cellIndex);
    
    let cellEl = document.getElementById('cell-' + cellIndex);
    cellEl.className = 'cell filled';
    cellEl.textContent = GRAPHIC_TEXTS[Math.floor(Math.random() * GRAPHIC_TEXTS.length)];
    
    playBlip(audioCtx.currentTime, 800 + filledCells.length * 100);
    if (navigator.vibrate) navigator.vibrate(20);
    
    if (filledCells.length === requiredCells.length) {
        completeLayout();
    }
}

function handleMiss() {
    playBlip(audioCtx.currentTime, 150, 'sawtooth');
    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
    
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 200);
    
    strikes++;
    updateHUD();
    if (strikes >= 3) {
        gameOver(false);
    }
}

function completeLayout() {
    score++;
    updateHUD();
    isTransitioning = true;
    
    document.body.classList.add('squeezeback');
    playBlip(audioCtx.currentTime, 400, 'square');
    playBlip(audioCtx.currentTime + 0.1, 600, 'square');
    
    setTimeout(() => {
        document.body.classList.remove('squeezeback');
        
        let currentAudioTime = audioCtx.currentTime;
        let exactBeat = (currentAudioTime - startTime) * (tempo / 60);
        tempo += 3; // Escalate
        startTime = currentAudioTime - exactBeat / (tempo / 60);
        
        let currentBeatInt = Math.floor(exactBeat);
        nextBeatTime = startTime + ((currentBeatInt + 1) * 60 / tempo);
        beatCount = currentBeatInt + 1;
        
        generateLayout();
        isTransitioning = false;
    }, 400);
}

function updateVisuals(exactBeat) {
    let distance = Math.ceil(exactBeat) - exactBeat;
    let scale = 1 + distance * 0.5;
    let opacity = 1 - distance;
    
    if (distance > 0.9) {
        scale = 1;
        opacity = 0;
    }
    
    document.documentElement.style.setProperty('--approach-scale', scale);
    document.documentElement.style.setProperty('--approach-opacity', opacity);
    
    let currentBeatInt = Math.floor(exactBeat);
    if (currentBeatInt !== lastBeatInt) {
        lastBeatInt = currentBeatInt;
        let feed = document.getElementById('video-feed');
        feed.style.borderColor = 'var(--accent)';
        setTimeout(() => {
            if (feed) feed.style.borderColor = 'var(--cell-border)';
        }, 100);
    }
    
    if (gameTime > 0) {
        document.getElementById('time-display').textContent = 'T-MINUS ' + gameTime.toFixed(1) + 's';
    }
}

function loop(timestamp) {
    if (!isPlaying) return;
    
    if (audioCtx) {
        if (nextBeatTime < audioCtx.currentTime - 0.5) {
            let currentAudioTime = audioCtx.currentTime;
            let exactBeat = (currentAudioTime - startTime) * (tempo / 60);
            let currentBeatInt = Math.floor(exactBeat);
            nextBeatTime = startTime + ((currentBeatInt + 1) * 60 / tempo);
            beatCount = currentBeatInt + 1;
        }
        
        while (nextBeatTime < audioCtx.currentTime + 0.1) {
            let isDownbeat = (beatCount % 4 === 0);
            playKick(nextBeatTime, isDownbeat);
            playHat(nextBeatTime + (30 / tempo));
            
            nextBeatTime += 60 / tempo;
            beatCount++;
        }
        
        let currentAudioTime = audioCtx.currentTime;
        let exactBeat = (currentAudioTime - startTime) * (tempo / 60);
        updateVisuals(exactBeat);
    }
    
    let dt = (timestamp - lastTime) / 1000;
    if (lastTime === 0) dt = 0;
    lastTime = timestamp;
    
    gameTime -= dt;
    if (gameTime <= 0) {
        gameOver(true);
    } else {
        requestAnimationFrame(loop);
    }
}

function gameOver(isWin) {
    isPlaying = false;
    document.getElementById('game-over-screen').style.display = 'flex';
    
    if (isWin) {
        document.getElementById('go-title').textContent = 'COMMERCIAL BREAK';
        document.getElementById('go-score').textContent = 'Great broadcast. Segments: ' + score;
    } else {
        document.getElementById('go-title').textContent = 'OFF AIR';
        document.getElementById('go-score').textContent = 'Too many errors. Segments: ' + score;
    }
}

document.getElementById('btn-start').addEventListener('click', () => {
    document.getElementById('title-screen').style.display = 'none';
    startGame();
});

document.getElementById('btn-restart').addEventListener('click', () => {
    document.getElementById('game-over-screen').style.display = 'none';
    startGame();
});
</script>
</body>
</html>
