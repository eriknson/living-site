<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Courier</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  :root {
    --ui-bg: rgba(248, 250, 252, 0.92);
    --ui-text: #1e293b;
    --ui-muted: #64748b;
    --ui-accent: #ea580c;
    --ui-border: rgba(30, 41, 59, 0.12);
    --btn-bg: #0f172a;
    --btn-text: #f8fafc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ui-bg: rgba(15, 23, 42, 0.92);
      --ui-text: #e2e8f0;
      --ui-muted: #94a3b8;
      --ui-accent: #fb923c;
      --ui-border: rgba(226, 232, 240, 0.1);
      --btn-bg: #f1f5f9;
      --btn-text: #0f172a;
    }
  }
  #app {
    position: fixed;
    inset: 0;
    width: 100dvw;
    height: 100dvh;
    background: #94a3b8;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 1.5rem;
    text-align: center;
    z-index: 2;
  }
  .overlay.hidden { display: none; }
  .panel {
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    border-radius: 12px;
    padding: 1.75rem 1.5rem;
    max-width: 22rem;
    width: 100%;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ui-text);
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-size: 0.75rem;
    color: var(--ui-muted);
    line-height: 1.5;
    margin-bottom: 1.25rem;
  }
  .manifest-preview {
    font-size: 0.7rem;
    color: var(--ui-accent);
    margin-bottom: 1rem;
    min-height: 1.2em;
    letter-spacing: 0.02em;
  }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 44px;
    min-width: 140px;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--btn-text);
    font: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button[data-smoke]:active { transform: scale(0.96); }
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: max(0.75rem, env(safe-area-inset-top)) 1rem 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 3;
    font-size: 0.7rem;
    color: var(--ui-text);
    text-shadow: 0 1px 8px rgba(0,0,0,0.25);
  }
  #hud.hidden { display: none; }
  .hud-block { display: flex; flex-direction: column; gap: 0.15rem; }
  .hud-label { color: var(--ui-muted); font-size: 0.6rem; letter-spacing: 0.08em; }
  .hud-value { font-size: 0.85rem; font-weight: 600; }
  #manifestHud {
    position: absolute;
    bottom: max(1rem, env(safe-area-inset-bottom));
    left: 1rem;
    right: 1rem;
    text-align: center;
    pointer-events: none;
    z-index: 3;
    font-size: 0.65rem;
    color: var(--ui-text);
    opacity: 0.85;
    text-shadow: 0 1px 6px rgba(0,0,0,0.3);
    letter-spacing: 0.03em;
    line-height: 1.4;
  }
  #manifestHud.hidden { display: none; }
  .score-big {
    font-size: 2rem;
    font-weight: 600;
    color: var(--ui-text);
    margin: 0.5rem 0;
  }
  .stat-row {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin: 0.75rem 0 1rem;
    font-size: 0.7rem;
    color: var(--ui-muted);
  }
  .stat-row span { color: var(--ui-text); }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div class="hud-block">
      <span class="hud-label">SIGNALS</span>
      <span class="hud-value" id="scoreVal">0</span>
    </div>
    <div class="hud-block" style="align-items:center">
      <span class="hud-label">COMBO</span>
      <span class="hud-value" id="comboVal">×1</span>
    </div>
    <div class="hud-block" style="align-items:center">
      <span class="hud-label">VISIBILITY</span>
      <span class="hud-value" id="visVal">100%</span>
    </div>
    <div class="hud-block" style="align-items:flex-end">
      <span class="hud-label">TIME</span>
      <span class="hud-value" id="timeVal">50</span>
    </div>
  </div>
  <div id="manifestHud" class="hidden"></div>
  <div id="titleOverlay" class="overlay">
    <div class="panel">
      <h1>FOG COURIER</h1>
      <p class="subtitle">Pilot through layered summer fog. Swipe up or down to switch altitude lanes. Collect signal fragments before visibility drops to zero.</p>
      <p class="manifest-preview" id="titleManifest">manifest: awaiting first run</p>
      <button type="button" data-smoke="start">LAUNCH DRONE</button>
    </div>
  </div>
  <div id="gameOverOverlay" class="overlay hidden">
    <div class="panel">
      <h1>MANIFEST SEALED</h1>
      <p class="subtitle">The fog claimed the corridor.</p>
      <div class="score-big" id="finalScore">0</div>
      <div class="stat-row">
        <div>COMBO <span id="finalCombo">0</span></div>
        <div>LANES <span id="finalLanes">4</span></div>
      </div>
      <p class="manifest-preview" id="finalManifest"></p>
      <button type="button" data-smoke="restart">FLY AGAIN</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var MANIFEST_LINES = [
    'shipping by sunrise — bay route delta',
    'agent wake confirmed pre-dawn shortcut',
    'signal fragment recovered lane seven',
    'courier drone holding seventeen knots fog',
    'manifest line assembled whisper intact',
    'barrier lake echo — delivery pending',
    'twenty-seven billion pulses humming clear',
    'robotic touch verified — keys aligned'
  ];

  var FRAG_WORDS = [
    'sunrise', 'signal', 'whisper', 'agent', 'fog', 'lane',
    'delta', 'courier', 'manifest', 'pulse', 'echo', 'drift',
    'horizon', 'beacon', 'packet', 'route', 'clear', 'hold'
  ];

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud');
  var manifestHud = document.getElementById('manifestHud');
  var titleOverlay = document.getElementById('titleOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var scoreVal = document.getElementById('scoreVal');
  var comboVal = document.getElementById('comboVal');
  var visVal = document.getElementById('visVal');
  var timeVal = document.getElementById('timeVal');
  var finalScore = document.getElementById('finalScore');
  var finalCombo = document.getElementById('finalCombo');
  var finalLanes = document.getElementById('finalLanes');
  var finalManifest = document.getElementById('finalManifest');
  var titleManifest = document.getElementById('titleManifest');

  var W = 360, H = 640;
  var state = 'title';
  var dpr = 1;
  var laneCount = 4;
  var activeLanes = 4;
  var droneLane = 1;
  var droneY = 0;
  var droneTargetY = 0;
  var droneX = 0;
  var timeLeft = 50;
  var score = 0;
  var combo = 0;
  var maxCombo = 0;
  var visibility = 1;
  var elapsed = 0;
  var spawnTimer = 0;
  var fogPhase = 0;
  var manifestLine = '';
  var manifestWords = [];
  var fragments = [];
  var obstacles = [];
  var particles = [];
  var ripples = [];
  var shake = 0;
  var lanePulse = 0;
  var toastText = '';
  var toastTimer = 0;
  var lastTs = 0;
  var audioCtx = null;

  var touchStartY = 0;
  var touchActive = false;
  var keys = {};

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function clamp(v, a, b) {
    return v < a ? a : v > b ? b : v;
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function laneY(lane, lanes) {
    var margin = H * 0.14;
    var usable = H - margin * 2;
    var step = usable / (lanes - 1);
    return margin + lane * step;
  }

  function activeLaneBounds() {
    var half = (laneCount - activeLanes) / 2;
    return { min: Math.floor(half), max: laneCount - 1 - Math.floor(half) };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    droneX = W * 0.22;
    updateDroneTarget(true);
  }

  function updateDroneTarget(instant) {
    var bounds = activeLaneBounds();
    droneLane = clamp(droneLane, bounds.min, bounds.max);
    droneTargetY = laneY(droneLane, laneCount);
    if (instant) droneY = droneTargetY;
  }

  function pickManifestLine() {
    return MANIFEST_LINES[Math.floor(Math.random() * MANIFEST_LINES.length)];
  }

  function initAudio() {
    try {
      if (!audioCtx && typeof AudioContext !== 'undefined') {
        audioCtx = new AudioContext();
      } else if (!audioCtx && typeof webkitAudioContext !== 'undefined') {
        audioCtx = new webkitAudioContext();
      }
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, vol, type) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(vol || 0.08, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur + 0.02);
    } catch (e) { /* silent */ }
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* */ }
  }

  function resetGame() {
    laneCount = 4;
    activeLanes = 4;
    droneLane = 1;
    timeLeft = 50;
    score = 0;
    combo = 0;
    maxCombo = 0;
    visibility = 1;
    elapsed = 0;
    spawnTimer = 0;
    fogPhase = 0;
    manifestLine = pickManifestLine();
    manifestWords = [];
    fragments = [];
    obstacles = [];
    particles = [];
    ripples = [];
    shake = 0;
    lanePulse = 0;
    toastText = '';
    toastTimer = 0;
    updateDroneTarget(true);
    updateHud();
    manifestHud.textContent = 'manifest: ' + manifestLine.split('—')[0].trim() + '…';
    manifestHud.classList.remove('hidden');
  }

  function startGame() {
    initAudio();
    resetGame();
    state = 'playing';
    titleOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    hud.classList.remove('hidden');
    lastTs = performance.now();
  }

  function endGame() {
    state = 'gameover';
    hud.classList.add('hidden');
    manifestHud.classList.add('hidden');
    finalScore.textContent = String(score);
    finalCombo.textContent = String(maxCombo);
    finalLanes.textContent = String(activeLanes);
    var assembled = manifestWords.length ? manifestWords.join(' ') : '(no fragments)';
    finalManifest.textContent = manifestLine.split('—')[0].trim() + ' — ' + assembled;
    titleManifest.textContent = 'last manifest: ' + assembled;
    gameOverOverlay.classList.remove('hidden');
    playTone(180, 0.5, 0.06, 'triangle');
  }

  function spawnFragment() {
    var bounds = activeLaneBounds();
    var lane = Math.floor(rand(bounds.min, bounds.max + 0.999));
    var word = FRAG_WORDS[Math.floor(Math.random() * FRAG_WORDS.length)];
    fragments.push({
      x: W + 30,
      lane: lane,
      y: laneY(lane, laneCount),
      word: word,
      r: 14,
      spin: rand(0, Math.PI * 2),
      glow: rand(0.6, 1)
    });
  }

  function spawnObstacle() {
    var bounds = activeLaneBounds();
    var lane = Math.floor(rand(bounds.min, bounds.max + 0.999));
    obstacles.push({
      x: W + 40,
      lane: lane,
      y: laneY(lane, laneCount),
      w: rand(36, 52),
      h: rand(18, 28),
      speed: rand(1.1, 1.6)
    });
  }

  function addParticles(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      particles.push({
        x: x, y: y,
        vx: rand(-2.5, 2.5),
        vy: rand(-2.5, 2.5),
        life: rand(0.4, 0.9),
        maxLife: 0.9,
        color: color,
        size: rand(2, 5)
      });
    }
  }

  function collectFragment(f, idx) {
    fragments.splice(idx, 1);
    score += 10 + combo * 2;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    manifestWords.push(f.word);
    if (manifestWords.length > 6) manifestWords.shift();
    addParticles(f.x, f.y, '#fb923c', 14);
    ripples.push({ x: f.x, y: f.y, r: 8, life: 0.6 });
    shake = 0.15;
    playTone(520 + combo * 20, 0.12, 0.07, 'sine');
    vibrate(12);
    updateHud();
  }

  function hitObstacle() {
    combo = 0;
    visibility = Math.max(0, visibility - 0.08);
    shake = 0.35;
    addParticles(droneX, droneY, '#64748b', 10);
    playTone(120, 0.2, 0.08, 'sawtooth');
    vibrate(30);
    if (visibility <= 0) endGame();
  }

  function updateHud() {
    scoreVal.textContent = String(score);
    comboVal.textContent = combo > 1 ? '×' + combo : '—';
    visVal.textContent = Math.round(visibility * 100) + '%';
    timeVal.textContent = String(Math.ceil(timeLeft));
    manifestHud.textContent = manifestWords.length
      ? 'manifest: ' + manifestWords.join(' · ')
      : 'manifest: ' + manifestLine.split('—')[0].trim() + '…';
  }

  function changeLane(dir) {
    if (state !== 'playing') return;
    var bounds = activeLaneBounds();
    var next = droneLane + dir;
    if (next >= bounds.min && next <= bounds.max) {
      droneLane = next;
      updateDroneTarget(false);
      playTone(280 + droneLane * 40, 0.06, 0.04, 'triangle');
      ripples.push({ x: droneX - 10, y: droneY, r: 6, life: 0.35 });
    }
  }

  function update(dt) {
    if (state !== 'playing') return;

    elapsed += dt;
    fogPhase += dt * 0.7;
    timeLeft -= dt;
    visibility = clamp(visibility - dt * 0.012, 0, 1);

    var targetActive = Math.max(1, 4 - Math.floor(elapsed / 12));
    if (targetActive !== activeLanes) {
      activeLanes = targetActive;
      updateDroneTarget(false);
      lanePulse = 1;
      toastText = activeLanes === 1 ? 'SINGLE CORRIDOR' : activeLanes + ' LANES OPEN';
      toastTimer = 1.6;
      playTone(160 + activeLanes * 30, 0.18, 0.05, 'square');
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnFragment();
      if (Math.random() < 0.35 + elapsed * 0.008) spawnObstacle();
      spawnTimer = Math.max(0.55, 1.4 - elapsed * 0.015);
    }

    droneY = lerp(droneY, droneTargetY, 1 - Math.pow(0.001, dt));

    var scrollSpeed = 130 + elapsed * 8;
    var i;
    for (i = fragments.length - 1; i >= 0; i--) {
      var f = fragments[i];
      f.x -= scrollSpeed * dt;
      f.spin += dt * 2;
      f.y = laneY(f.lane, laneCount);
      if (f.x < -40) { fragments.splice(i, 1); combo = 0; continue; }
      var dx = f.x - droneX;
      var dy = f.y - droneY;
      if (dx * dx + dy * dy < (f.r + 16) * (f.r + 16)) collectFragment(f, i);
    }

    for (i = obstacles.length - 1; i >= 0; i--) {
      var o = obstacles[i];
      o.x -= scrollSpeed * o.speed * dt;
      o.y = laneY(o.lane, laneCount);
      if (o.x < -60) { obstacles.splice(i, 1); continue; }
      if (Math.abs(o.x - droneX) < o.w * 0.5 + 14 && Math.abs(o.y - droneY) < o.h * 0.5 + 10) {
        obstacles.splice(i, 1);
        hitObstacle();
      }
    }

    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 20 * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (i = ripples.length - 1; i >= 0; i--) {
      ripples[i].life -= dt;
      ripples[i].r += 80 * dt;
      if (ripples[i].life <= 0) ripples.splice(i, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 1.8);
    if (lanePulse > 0) lanePulse = Math.max(0, lanePulse - dt * 0.8);
    if (toastTimer > 0) toastTimer = Math.max(0, toastTimer - dt);
    updateHud();

    if (timeLeft <= 0 || visibility <= 0) endGame();
  }

  function isDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function drawBackground(t) {
    var dark = isDark();
    var skyTop = dark ? '#1e293b' : '#8fa4b8';
    var skyMid = dark ? '#334155' : '#a8bccf';
    var skyLow = dark ? '#475569' : '#c4d4e0';
    var horizon = dark ? '#7c2d12' : '#fbbf24';
    var horizonGlow = dark ? 'rgba(251,146,60,0.25)' : 'rgba(251,191,36,0.45)';

    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, skyTop);
    grd.addColorStop(0.55, skyMid);
    grd.addColorStop(0.82, skyLow);
    grd.addColorStop(1, horizonGlow);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = 0.35;
    var hg = ctx.createLinearGradient(0, H * 0.78, 0, H);
    hg.addColorStop(0, 'rgba(251,146,60,0)');
    hg.addColorStop(1, horizon);
    ctx.fillStyle = hg;
    ctx.fillRect(0, H * 0.72, W, H * 0.28);
    ctx.restore();

    ctx.strokeStyle = dark ? 'rgba(148,163,184,0.08)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    for (var i = 0; i < 6; i++) {
      var yy = H * 0.2 + i * H * 0.12 + Math.sin(t * 0.3 + i) * 4;
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.lineTo(W, yy + 8);
      ctx.stroke();
    }
  }

  function drawLanes(t) {
    var bounds = activeLaneBounds();
    var margin = H * 0.14;
    var usable = H - margin * 2;

    for (var lane = 0; lane < laneCount; lane++) {
      var y = laneY(lane, laneCount);
      var active = lane >= bounds.min && lane <= bounds.max;
      var laneW = W * (active ? lerp(0.92, 0.38, 1 - activeLanes / laneCount) : 0.15);
      var cx = W * 0.5;
      var left = cx - laneW * 0.5;

      ctx.save();
      if (!active) {
        ctx.fillStyle = isDark() ? 'rgba(15,23,42,0.55)' : 'rgba(71,85,105,0.35)';
        ctx.fillRect(0, y - usable / (laneCount * 2.2), W, usable / (laneCount * 1.1));
        ctx.fillStyle = isDark() ? 'rgba(148,163,184,0.15)' : 'rgba(255,255,255,0.2)';
        ctx.font = '10px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('FOG LOCK', cx, y + 4);
      } else {
        ctx.strokeStyle = isDark() ? 'rgba(148,163,184,0.2)' : 'rgba(255,255,255,0.35)';
        ctx.setLineDash([6, 10]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(left + laneW, y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    }

    if (lanePulse > 0) {
      ctx.fillStyle = isDark() ? 'rgba(251,146,60,0.08)' : 'rgba(251,191,36,0.12)';
      var pb = activeLaneBounds();
      var topY = laneY(pb.min, laneCount) - usable / (laneCount * 2.2);
      var botY = laneY(pb.max, laneCount) + usable / (laneCount * 2.2);
      ctx.fillRect(0, topY, W, botY - topY);
    }

    ctx.strokeStyle = isDark() ? 'rgba(251,146,60,0.35)' : 'rgba(234,88,12,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(droneX, margin * 0.5);
    ctx.lineTo(droneX, H - margin * 0.5);
    ctx.stroke();
  }

  function drawFragments(t) {
    fragments.forEach(function (f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.spin);
      var g = ctx.createRadialGradient(0, 0, 0, 0, 0, f.r * 2);
      g.addColorStop(0, 'rgba(251,146,60,' + (0.7 * f.glow) + ')');
      g.addColorStop(0.5, 'rgba(251,191,36,0.35)');
      g.addColorStop(1, 'rgba(251,146,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, f.r * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = isDark() ? '#fff7ed' : '#1e293b';
      ctx.font = '9px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(f.word, 0, 0);
      ctx.restore();
    });
  }

  function drawObstacles() {
    obstacles.forEach(function (o) {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.fillStyle = isDark() ? 'rgba(51,65,85,0.85)' : 'rgba(100,116,139,0.75)';
      ctx.strokeStyle = isDark() ? 'rgba(148,163,184,0.4)' : 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1.5;
      roundRect(-o.w / 2, -o.h / 2, o.w, o.h, 6);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawDrone(t) {
    ctx.save();
    ctx.translate(droneX, droneY);
    var bob = Math.sin(t * 6) * 2;
    ctx.translate(0, bob);

    ctx.fillStyle = isDark() ? '#e2e8f0' : '#0f172a';
    ctx.strokeStyle = isDark() ? '#fb923c' : '#ea580c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-10, -10);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-10, 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = isDark() ? 'rgba(251,146,60,0.8)' : 'rgba(234,88,12,0.85)';
    ctx.beginPath();
    ctx.arc(-2, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 0.35 + Math.sin(t * 10) * 0.15;
    ctx.strokeStyle = '#fb923c';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(-24 - Math.sin(t * 14) * 4, 0);
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles() {
    particles.forEach(function (p) {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawRipples() {
    ripples.forEach(function (r) {
      ctx.strokeStyle = 'rgba(251,146,60,' + (r.life * 0.6) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
    });
  }

  function drawFog(t) {
    var thick = 1 - visibility;
    if (thick <= 0.01) return;

    ctx.save();
    var bands = 5;
    for (var b = 0; b < bands; b++) {
      var phase = fogPhase + b * 1.3;
      var yBase = H * (0.08 + b * 0.16) + Math.sin(phase) * 18;
      var alpha = thick * (0.12 + b * 0.04);
      var fogGrd = ctx.createLinearGradient(0, yBase - 40, 0, yBase + 80);
      fogGrd.addColorStop(0, 'rgba(148,163,184,0)');
      fogGrd.addColorStop(0.5, isDark() ? 'rgba(100,116,139,' + alpha + ')' : 'rgba(203,213,225,' + alpha + ')');
      fogGrd.addColorStop(1, 'rgba(148,163,184,0)');
      ctx.fillStyle = fogGrd;
      ctx.fillRect(0, yBase - 50, W, 130);
    }

    var edgeAlpha = thick * 0.55;
    var leftGrd = ctx.createLinearGradient(0, 0, W * 0.35, 0);
    leftGrd.addColorStop(0, isDark() ? 'rgba(15,23,42,' + edgeAlpha + ')' : 'rgba(148,163,184,' + edgeAlpha + ')');
    leftGrd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = leftGrd;
    ctx.fillRect(0, 0, W * 0.4, H);

    var rightGrd = ctx.createLinearGradient(W, 0, W * 0.65, 0);
    rightGrd.addColorStop(0, isDark() ? 'rgba(15,23,42,' + edgeAlpha + ')' : 'rgba(148,163,184,' + edgeAlpha + ')');
    rightGrd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rightGrd;
    ctx.fillRect(W * 0.6, 0, W * 0.4, H);

    if (thick > 0.5) {
      ctx.fillStyle = isDark() ? 'rgba(15,23,42,' + ((thick - 0.5) * 0.8) + ')' : 'rgba(148,163,184,' + ((thick - 0.5) * 0.6) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  function drawHints(t) {
    if (elapsed > 5 || state !== 'playing') return;
    var alpha = 0.55 * (1 - elapsed / 5);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = isDark() ? '#e2e8f0' : '#0f172a';
    ctx.font = '11px ui-monospace, monospace';
    ctx.textAlign = 'center';
    var cx = W * 0.62;
    ctx.fillText('▲ swipe up', cx, H * 0.38 + Math.sin(t * 4) * 3);
    ctx.fillText('▼ swipe down', cx, H * 0.62 + Math.sin(t * 4 + 1) * 3);
    ctx.restore();
  }

  function drawToast() {
    if (toastTimer <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, toastTimer);
    ctx.fillStyle = isDark() ? 'rgba(15,23,42,0.75)' : 'rgba(248,250,252,0.85)';
    roundRect(W * 0.5 - 90, H * 0.12, 180, 28, 6);
    ctx.fill();
    ctx.fillStyle = isDark() ? '#fb923c' : '#ea580c';
    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(toastText, W * 0.5, H * 0.12 + 14);
    ctx.restore();
  }

  function drawVignette() {
    var v = 1 - visibility;
    if (v < 0.2) return;
    var g = ctx.createRadialGradient(W * 0.5, H * 0.45, H * 0.2, W * 0.5, H * 0.45, H * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, isDark() ? 'rgba(0,0,0,' + (v * 0.45) + ')' : 'rgba(30,41,59,' + (v * 0.25) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function render(t) {
    ctx.save();
    if (shake > 0) {
      ctx.translate(rand(-shake, shake) * 8, rand(-shake, shake) * 8);
    }

    drawBackground(t);
    drawLanes(t);
    drawObstacles();
    drawFragments(t);
    drawRipples();
    drawDrone(t);
    drawParticles();
    drawFog(t);
    drawHints(t);
    drawToast();
    drawVignette();
    ctx.restore();

    if (state === 'title') {
      drawBackground(t);
      drawFog(t * 0.3);
    }
  }

  function loop(ts) {
    var dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
    lastTs = ts;
    update(dt);
    render(ts / 1000);
    requestAnimationFrame(loop);
  }

  function onTouchStart(e) {
    if (state !== 'playing') return;
    e.preventDefault();
    var t = e.changedTouches ? e.changedTouches[0] : e;
    touchStartY = t.clientY;
    touchActive = true;
  }

  function onTouchEnd(e) {
    if (state !== 'playing' || !touchActive) return;
    e.preventDefault();
    touchActive = false;
    var t = e.changedTouches ? e.changedTouches[0] : e;
    var dy = t.clientY - touchStartY;
    if (Math.abs(dy) > 28) changeLane(dy < 0 ? -1 : 1);
  }

  function onKeyDown(e) {
    keys[e.code] = true;
    if (state === 'playing') {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') changeLane(-1);
      if (e.code === 'ArrowDown' || e.code === 'KeyS') changeLane(1);
    }
  }

  function onKeyUp(e) {
    keys[e.code] = false;
  }

  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });
  canvas.addEventListener('mousedown', function (e) {
    if (state !== 'playing') return;
    touchStartY = e.clientY;
    touchActive = true;
  });
  canvas.addEventListener('mouseup', function (e) {
    if (!touchActive) return;
    touchActive = false;
    var dy = e.clientY - touchStartY;
    if (Math.abs(dy) > 28) changeLane(dy < 0 ? -1 : 1);
  });

  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);

  document.querySelector('[data-smoke="start"]').addEventListener('click', function () {
    startGame();
  });

  document.querySelector('[data-smoke="restart"]').addEventListener('click', function () {
    startGame();
  });

  window.addEventListener('resize', resize);
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { /* redraw */ });
  }

  resize();
  manifestLine = pickManifestLine();
  titleManifest.textContent = 'manifest: ' + manifestLine.split('—')[0].trim() + '…';
  lastTs = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
