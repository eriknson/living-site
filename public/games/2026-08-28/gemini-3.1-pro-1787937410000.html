<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barrier Lake</title>
<style>
  :root {
    --bg: #e0e5ec;
    --text: #1a1a1a;
    --accent: #4a90e2;
    --ui-bg: rgba(224, 229, 236, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c20;
      --text: #f0f0f0;
      --accent: #50e3c2;
      --ui-bg: rgba(26, 28, 32, 0.85);
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100dvw; height: 100dvh;
    overflow: hidden; background: var(--bg); color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none; touch-action: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block; width: 100%; height: 100%;
  }
  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: var(--ui-bg); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .screen > * {
    pointer-events: none;
  }
  .hidden { opacity: 0; pointer-events: none !important; }
  button {
    pointer-events: auto !important;
    padding: 16px 32px; font-size: 1.2rem; font-family: inherit;
    background: var(--text); color: var(--bg); border: none; border-radius: 0;
    cursor: pointer; margin-top: 32px; text-transform: uppercase;
    font-weight: bold; letter-spacing: 0.1em;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.96); }
  button:hover { opacity: 0.9; }
  h1 {
    font-size: 3rem; margin: 0; letter-spacing: 0.15em; text-align: center;
    font-weight: 800; text-transform: uppercase;
  }
  p {
    margin: 24px; text-align: center; max-width: 320px; line-height: 1.6;
    font-size: 1rem; opacity: 0.8;
  }
  #hud {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  #score { 
    position: absolute; top: 24px; right: 24px; font-size: 2rem; font-weight: 800; 
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop 0.2s ease-out; }
  #water-gauge-container {
    position: absolute; top: 24px; left: 24px; width: 12px; height: calc(100% - 120px);
    background: rgba(0,0,0,0.1); border-radius: 6px; overflow: hidden;
    border: 2px solid var(--text);
  }
  #water-gauge {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
    background: var(--accent); transition: height 0.1s linear, background-color 0.3s;
  }
  #dam-health {
    position: absolute; bottom: 24px; left: 0; width: 100%;
    display: flex; justify-content: center; gap: 16px;
  }
  .crack {
    width: 20px; height: 20px; border: 2px solid var(--text); 
    background: var(--text); transform: rotate(45deg);
    transition: background 0.3s, transform 0.3s, opacity 0.3s;
  }
  .crack.broken { background: transparent; transform: rotate(45deg) scale(0.8); opacity: 0.3; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div id="score">0</div>
    <div id="water-gauge-container">
      <div id="water-gauge"></div>
    </div>
    <div id="dam-health">
      <div class="crack"></div><div class="crack"></div><div class="crack"></div>
    </div>
  </div>
  <div id="title-screen" class="screen">
    <h1>BARRIER<br>LAKE</h1>
    <p>Flick outward to skip stones.<br>Skips lower the water.<br>Misses crack the dam.</p>
    <button data-smoke="start">Start</button>
  </div>
  <div id="game-over-screen" class="screen hidden">
    <h1 id="go-title">DAM BROKEN</h1>
    <p style="font-size: 1.5rem; margin: 10px 0; font-weight: bold;">Score: <span id="go-score">0</span></p>
    <button data-smoke="restart">Restart</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// Audio
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!AudioContext) return;
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, type, duration, vol) {
  if (!audioCtx) return;
  try {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function playSkipSound(skips) {
  const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
  let note = notes[Math.min(skips, notes.length - 1)];
  playTone(note, 'sine', 0.4, 0.1);
}
function playSinkSound() {
  playTone(100, 'square', 0.3, 0.1);
}

// Game state
let state = 'title';
let score = 0;
let waterLevel = 50;
let damHealth = 3;
let stones = [];
let ripples = [];
let particles = [];
let lastTime = performance.now();
let gameTime = 0;
let lastFlickTime = 0;
let screenShake = 0;

// Input state
let touchStart = null;
let touchCurrent = null;

// Constants
const GRAVITY_BASE = 800;
const WATER_RISE_RATE_BASE = 4;
const MAX_WATER_RISE_RATE = 15;
const STONE_RADIUS = 8;
const MIN_SKIP_SPEED = 300;
const MAX_SKIP_ANGLE = Math.PI / 3;
const RIPPLE_COLORS = [
  '#ffffff', '#e0e5ec', '#4a90e2', '#50e3c2', 
  '#7ed321', '#f8e71c', '#f5a623', '#d0021b'
];

// Elements
const uiTitle = document.getElementById('title-screen');
const uiGameOver = document.getElementById('game-over-screen');
const uiHud = document.getElementById('hud');
const elScore = document.getElementById('score');
const elWaterGauge = document.getElementById('water-gauge');
const elGoScore = document.getElementById('go-score');
const elGoTitle = document.getElementById('go-title');
const btnStart = document.querySelector('[data-smoke="start"]');
const btnRestart = document.querySelector('[data-smoke="restart"]');
const cracks = document.querySelectorAll('.crack');

btnStart.addEventListener('click', (e) => { e.stopPropagation(); initAudio(); startGame(); });
btnRestart.addEventListener('click', (e) => { e.stopPropagation(); initAudio(); startGame(); });

function startGame() {
  state = 'playing';
  score = 0;
  waterLevel = 20;
  damHealth = 3;
  stones = [];
  ripples = [];
  particles = [];
  gameTime = 0;
  lastTime = performance.now();
  lastFlickTime = 0;
  screenShake = 0;
  
  uiTitle.classList.add('hidden');
  uiGameOver.classList.add('hidden');
  uiHud.classList.remove('hidden');
  
  updateHUD();
  requestAnimationFrame(loop);
}

function gameOver(reason) {
  state = 'gameover';
  uiHud.classList.add('hidden');
  uiGameOver.classList.remove('hidden');
  elGoScore.textContent = score;
  elGoTitle.textContent = reason === 'water' ? 'OVERFLOW' : 'DAM BROKEN';
  if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch(e) {} }
}

// Input handling
function getPos(e) {
  if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function handleStart(e) {
  if (e.cancelable) e.preventDefault();
  if (state !== 'playing') return;
  touchStart = getPos(e);
  touchCurrent = { ...touchStart };
}

function handleMove(e) {
  if (state !== 'playing' || !touchStart) return;
  if (e.cancelable) e.preventDefault();
  touchCurrent = getPos(e);
}

function handleEnd(e) {
  if (state !== 'playing' || !touchStart) return;
  if (e.cancelable) e.preventDefault();
  
  let now = performance.now();
  if (now - lastFlickTime < 300) {
    touchStart = null; touchCurrent = null;
    return;
  }
  
  let dx = touchCurrent.x - touchStart.x;
  let dy = touchCurrent.y - touchStart.y;
  
  if (dy < -20) {
    launchStone(dx, dy);
    lastFlickTime = now;
  }
  
  touchStart = null;
  touchCurrent = null;
}

canvas.addEventListener('touchstart', handleStart, {passive: false});
canvas.addEventListener('touchmove', handleMove, {passive: false});
canvas.addEventListener('touchend', handleEnd, {passive: false});
canvas.addEventListener('mousedown', handleStart);
window.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

function launchStone(dx, dy) {
  const powerMultiplier = 6;
  let vx = dx * powerMultiplier;
  let vy = dy * powerMultiplier;
  let speed = Math.hypot(vx, vy);
  let vz = Math.min(400, speed * 0.2 + 100);
  
  stones.push({
    x: width / 2,
    y: height - 50,
    z: 20,
    vx: vx,
    vy: vy,
    vz: vz,
    skips: 0,
    dead: false,
    trail: []
  });
}

function spawnRipple(x, y, skips) {
  let colorIndex = Math.min(skips, RIPPLE_COLORS.length - 1);
  ripples.push({
    x: x, y: y, radius: 0, maxRadius: 30 + skips * 15,
    life: 1, color: RIPPLE_COLORS[colorIndex]
  });
  if (navigator.vibrate) { try { navigator.vibrate(20 + skips * 10); } catch(e) {} }
}

function spawnSplash(x, y) {
  for (let i = 0; i < 15; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = Math.random() * 150 + 50;
    particles.push({
      x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, color: '#ffffff'
    });
  }
  if (navigator.vibrate) { try { navigator.vibrate(100); } catch(e) {} }
}

function updateHUD() {
  elScore.textContent = score;
  elWaterGauge.style.height = waterLevel + '%';
  if (waterLevel > 80) elWaterGauge.style.backgroundColor = '#d0021b';
  else if (waterLevel > 50) elWaterGauge.style.backgroundColor = '#f5a623';
  else elWaterGauge.style.backgroundColor = 'var(--accent)';
  
  cracks.forEach((c, i) => {
    if (i < damHealth) c.classList.remove('broken');
    else c.classList.add('broken');
  });
}

function update(dt) {
  let currentGravity = GRAVITY_BASE + gameTime * 15;
  let waterRiseRate = Math.min(MAX_WATER_RISE_RATE, WATER_RISE_RATE_BASE + gameTime * 0.15);
  
  waterLevel += waterRiseRate * dt;
  if (waterLevel >= 100) { gameOver('water'); return; }
  
  for (let i = stones.length - 1; i >= 0; i--) {
    let s = stones[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.z += s.vz * dt;
    s.vz -= currentGravity * dt;
    
    s.trail.push({x: s.x, y: s.y, z: s.z});
    if (s.trail.length > 12) s.trail.shift();
    
    if (s.y < 180 || s.x < -100 || s.x > width + 100) {
      s.dead = true;
    }
    
    if (s.z <= 0 && s.vz < 0) {
      let speedH = Math.hypot(s.vx, s.vy);
      let impactAngle = Math.atan2(-s.vz, speedH);
      
      if (speedH > MIN_SKIP_SPEED && impactAngle < MAX_SKIP_ANGLE) {
        s.z = 0;
        s.vz = Math.abs(s.vz) * 0.6 + 60;
        s.vx *= 0.85;
        s.vy *= 0.85;
        s.skips++;
        
        spawnRipple(s.x, s.y, s.skips);
        playSkipSound(s.skips);
        
        waterLevel = Math.max(0, waterLevel - (1.5 + s.skips * 0.5));
        
        let oldScore = score;
        score += s.skips;
        if (score > oldScore) {
          elScore.classList.remove('pop');
          void elScore.offsetWidth;
          elScore.classList.add('pop');
        }
      } else {
        s.dead = true;
        spawnSplash(s.x, s.y);
        playSinkSound();
        damHealth--;
        screenShake = 15;
        if (damHealth <= 0) { gameOver('dam'); return; }
      }
    }
  }
  
  stones = stones.filter(s => !s.dead);
  
  for (let i = ripples.length - 1; i >= 0; i--) {
    let r = ripples[i];
    r.radius += (r.maxRadius - r.radius) * 6 * dt;
    r.life -= dt * 1.2;
    if (r.life <= 0) ripples.splice(i, 1);
  }
  
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  if (screenShake > 0) {
    screenShake -= dt * 60;
    if (screenShake < 0) screenShake = 0;
  }
  
  updateHUD();
}

function drawMountains(isDark) {
  for (let i = 0; i < 3; i++) {
    let yBase = 100 + i * 40;
    if (isDark) {
      let val = 30 + i * 10;
      ctx.fillStyle = `rgb(${val},${val},${val+5})`;
    } else {
      let val = 200 - i * 20;
      ctx.fillStyle = `rgb(${val},${val},${val+10})`;
    }
    ctx.beginPath();
    ctx.moveTo(0, 180);
    ctx.lineTo(0, yBase);
    let seed = i * 12345;
    for (let x = 0; x <= width + 50; x += 50) {
      seed = (seed * 9301 + 49297) % 233280;
      let rnd = seed / 233280;
      let y = yBase - rnd * 60;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(width, 180);
    ctx.fill();
  }
}

function draw() {
  ctx.save();
  if (screenShake > 0) {
    let dx = (Math.random() - 0.5) * screenShake;
    let dy = (Math.random() - 0.5) * screenShake;
    ctx.translate(dx, dy);
  }
  
  let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  // Sky
  ctx.fillStyle = isDark ? '#1a1c20' : '#e0e5ec';
  ctx.fillRect(0, 0, width, 180);
  
  // Mountains
  drawMountains(isDark);
  
  // Water
  let r1, g1, b1, r2, g2, b2;
  if (isDark) {
    r1 = 32; g1 = 36; b1 = 40; r2 = 60; g2 = 20; b2 = 20;
  } else {
    r1 = 208; g1 = 216; b1 = 224; r2 = 220; g2 = 150; b2 = 150;
  }
  let dangerRatio = Math.max(0, (waterLevel - 50) / 50);
  let r = Math.floor(r1 + (r2 - r1) * dangerRatio);
  let g = Math.floor(g1 + (g2 - g1) * dangerRatio);
  let b = Math.floor(b1 + (b2 - b1) * dangerRatio);
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 180, width, height - 180);
  
  // Waves
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
  ctx.lineWidth = 2;
  let waveOffset = (gameTime * 20) % 100;
  for (let y = 200; y < height; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= width; x += 50) {
      let waveY = y + Math.sin((x + waveOffset + y * 10) * 0.05) * 5;
      ctx.lineTo(x, waveY);
    }
    ctx.stroke();
  }
  
  // Ripples
  for (let rp of ripples) {
    ctx.globalAlpha = rp.life;
    ctx.strokeStyle = rp.color;
    for (let i = 0; i < 3; i++) {
      let rad = Math.max(0, rp.radius - i * 6);
      if (rad > 0) {
        ctx.lineWidth = 3 - i;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rad, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
  
  // Stones
  for (let s of stones) {
    // Trail
    if (s.trail.length > 1) {
      ctx.beginPath();
      for (let i = 0; i < s.trail.length; i++) {
        let p = s.trail[i];
        if (i === 0) ctx.moveTo(p.x, p.y - p.z);
        else ctx.lineTo(p.x, p.y - p.z);
      }
      ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    let shadowScale = Math.max(0.2, 1 - s.z / 200);
    ctx.ellipse(s.x, s.y, STONE_RADIUS * shadowScale, STONE_RADIUS * 0.5 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Stone
    ctx.fillStyle = isDark ? '#ddd' : '#333';
    ctx.beginPath();
    ctx.arc(s.x, s.y - s.z, STONE_RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Particles
  ctx.fillStyle = '#fff';
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // Ready stone
  let now = performance.now();
  if (state === 'playing' && now - lastFlickTime > 300 && !touchStart) {
    ctx.fillStyle = isDark ? '#ddd' : '#333';
    ctx.beginPath();
    ctx.arc(width / 2, height - 50, STONE_RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Input arrow
  if (touchStart && touchCurrent) {
    let dx = touchCurrent.x - touchStart.x;
    let dy = touchCurrent.y - touchStart.y;
    
    if (dy < -10) {
      let startX = width / 2;
      let startY = height - 50;
      
      let dist = Math.hypot(dx, dy);
      let maxDist = 150;
      let scale = dist > maxDist ? maxDist / dist : 1;
      let adx = dx * scale;
      let ady = dy * scale;
      
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(startX + adx, startY + ady);
      
      let speed = dist * 6;
      if (speed < MIN_SKIP_SPEED) {
        ctx.strokeStyle = 'rgba(208, 2, 27, 0.6)';
      } else {
        ctx.strokeStyle = isDark ? 'rgba(80, 227, 194, 0.6)' : 'rgba(74, 144, 226, 0.6)';
      }
      
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();
      
      let angle = Math.atan2(ady, adx);
      ctx.beginPath();
      ctx.moveTo(startX + adx, startY + ady);
      ctx.lineTo(startX + adx - 15 * Math.cos(angle - Math.PI/6), startY + ady - 15 * Math.sin(angle - Math.PI/6));
      ctx.lineTo(startX + adx - 15 * Math.cos(angle + Math.PI/6), startY + ady - 15 * Math.sin(angle + Math.PI/6));
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fill();
    }
  }
  
  ctx.restore();
}

function loop(time) {
  if (state !== 'playing') return;
  let dt = (time - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = time;
  gameTime += dt;
  
  update(dt);
  draw();
  
  if (state === 'playing') {
    requestAnimationFrame(loop);
  }
}

// Initial draw
draw();
</script>
</body>
</html>
