<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>POLYGLOT — flick each token home</title>
<style>
  :root{
    /* Light blueprint (default) */
    --ink:#0e2942;
    --ink-dim:#4a6f8f;
    --bg:#e9f1fb;
    --bg2:#dde9f7;
    --chasm:#cad9ec;
    --panel:rgba(255,255,255,0.80);
    --panel-solid:#f4f8fe;
    --edge:#bcd0e8;
    --line:rgba(24,74,128,0.12);
    --line-strong:rgba(24,74,128,0.22);
    --accent:#0b83b0;
    --good:#0a9d6c;
    --bad:#d43a4a;
    --gold:#c68a12;
    --btn-ink:#f4f8fe;
    --scrim:rgba(223,235,249,0.62);
  }
  @media (prefers-color-scheme: dark){
    :root{
      /* Dark blueprint */
      --ink:#dcefff;
      --ink-dim:#8fb4d4;
      --bg:#071829;
      --bg2:#0a2137;
      --chasm:#04101d;
      --panel:rgba(9,29,48,0.82);
      --panel-solid:#0b2338;
      --edge:#1b4262;
      --line:rgba(120,190,255,0.10);
      --line-strong:rgba(120,190,255,0.20);
      --accent:#3ad2ff;
      --good:#39e3a4;
      --bad:#ff5d6b;
      --gold:#ffce4d;
      --btn-ink:#04121f;
      --scrim:rgba(4,13,24,0.60);
    }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    overflow:hidden;
    position:fixed;
    inset:0;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    touch-action:none;
  }
  #wrap{
    position:relative;
    width:100dvw;
    height:100dvh;
    overflow:hidden;
  }
  #game{
    position:absolute;
    inset:0;
    display:block;
    width:100dvw;
    height:100dvh;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ---- HUD ---- */
  #hud{
    position:absolute;
    top:0; left:0; right:0;
    padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 8px calc(env(safe-area-inset-left,0px) + 12px);
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    pointer-events:none;
    z-index:5;
    font-variant-numeric:tabular-nums;
  }
  .hud-col{ display:flex; flex-direction:column; gap:4px; }
  .hud-col.right{ align-items:flex-end; }
  .lbl{ font-size:9px; letter-spacing:.22em; color:var(--ink-dim); text-transform:uppercase; }
  .val{ font-size:20px; font-weight:700; line-height:1; letter-spacing:.01em; }
  #scoreV{ color:var(--ink); }
  #best{ font-size:10px; color:var(--ink-dim); letter-spacing:.06em; }
  .lives{ display:flex; gap:5px; margin-top:2px; }
  .life{
    width:11px; height:11px; border-radius:2px;
    background:var(--good);
    box-shadow:0 0 8px color-mix(in srgb,var(--good) 60%, transparent);
    transition:transform .18s ease, opacity .3s ease, background .3s ease;
  }
  .life.lost{ background:var(--edge); box-shadow:none; opacity:.35; transform:scale(.7); }

  /* center HUD: timer + wind + combo */
  #centerHud{
    position:absolute;
    top:calc(env(safe-area-inset-top,0px) + 10px);
    left:50%; transform:translateX(-50%);
    width:min(46vw,240px);
    display:flex; flex-direction:column; align-items:center; gap:5px;
    pointer-events:none; z-index:5;
  }
  #timeBarWrap{
    width:100%; height:7px; border-radius:4px;
    background:var(--line-strong);
    overflow:hidden;
    border:1px solid var(--edge);
  }
  #timeBar{
    height:100%; width:100%;
    background:var(--accent);
    transform-origin:left center;
    transition:background .3s ease;
  }
  #windRow{ display:flex; align-items:center; gap:6px; height:14px; opacity:0; transition:opacity .3s ease; }
  #windRow.on{ opacity:1; }
  #windTxt{ font-size:9px; letter-spacing:.14em; color:var(--ink-dim); text-transform:uppercase; }
  #comboTag{
    font-size:11px; letter-spacing:.05em; color:var(--gold);
    opacity:0; transform:translateY(-2px); transition:opacity .2s ease, transform .2s ease;
    font-weight:700;
  }
  #comboTag.on{ opacity:1; transform:translateY(0); }

  #mute{
    pointer-events:auto;
    width:44px; height:44px; min-width:44px;
    border-radius:10px;
    border:1px solid var(--edge);
    background:var(--panel);
    color:var(--ink);
    font-size:17px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    margin-top:2px;
  }
  #mute:active{ transform:scale(.92); }

  /* ---- Overlays ---- */
  .overlay{
    position:absolute; inset:0; z-index:20;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:24px;
    pointer-events:none; /* clicks pass through except on .btn */
    transition:opacity .32s ease;
  }
  .overlay.hidden{ opacity:0; visibility:hidden; }
  #over{ background:var(--scrim); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .card{
    max-width:340px; width:100%;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .title-big{
    font-size:clamp(38px,13vw,60px);
    font-weight:800; letter-spacing:.04em; line-height:.92;
    margin:0; color:var(--ink);
  }
  .title-big .dot{ color:var(--accent); }
  .tagline{ font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--ink-dim); margin:0; }
  .howto{
    font-size:13px; line-height:1.7; color:var(--ink); opacity:.9;
    margin:2px 0 2px; max-width:300px;
  }
  .howto b{ color:var(--accent); font-weight:700; }
  .legend{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:2px 0 6px; }
  .legend .chip{
    display:flex; align-items:center; gap:6px;
    font-size:10px; letter-spacing:.08em; color:var(--ink-dim);
    border:1px solid var(--edge); border-radius:999px; padding:4px 9px 4px 6px;
  }
  .legend .sw{ width:12px; height:12px; border-radius:3px; }
  .btn{
    pointer-events:auto;
    -webkit-appearance:none; appearance:none;
    cursor:pointer;
    font-family:inherit; font-weight:800;
    font-size:16px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--btn-ink);
    background:var(--accent);
    border:none; border-radius:13px;
    padding:16px 30px; min-height:54px; min-width:190px;
    box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 34%, transparent);
    transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
    touch-action:manipulation;
  }
  .btn:hover{ filter:brightness(1.06); }
  .btn:active{ transform:translateY(2px) scale(.985); box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%, transparent); }
  .btn.ghost{
    background:transparent; color:var(--ink);
    border:1px solid var(--edge);
    box-shadow:none; font-size:12px; min-height:44px; min-width:120px;
    letter-spacing:.16em;
  }
  .hint-key{ font-size:10px; color:var(--ink-dim); letter-spacing:.12em; margin-top:2px; }

  /* game over specifics */
  #over .go-title{ font-size:clamp(30px,10vw,46px); font-weight:800; letter-spacing:.04em; margin:0; }
  #over .stat-row{ display:flex; gap:26px; justify-content:center; margin:4px 0 4px; }
  #over .stat{ display:flex; flex-direction:column; gap:3px; }
  #over .stat .k{ font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); }
  #over .stat .v{ font-size:26px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
  #newbest{ font-size:12px; letter-spacing:.18em; color:var(--gold); text-transform:uppercase; height:14px; }
  .verdict{ font-size:12px; color:var(--ink-dim); letter-spacing:.05em; max-width:300px; line-height:1.6; }

  .fadein{ animation:fadeUp .4s ease both; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-col left">
      <span class="lbl">Score</span>
      <span class="val" id="scoreV">0</span>
      <span id="best">BEST 0</span>
    </div>
    <div class="hud-col right">
      <button id="mute" aria-label="Toggle sound">♪</button>
      <div class="lives" id="lives" aria-label="lives"></div>
    </div>
  </div>
  <div id="centerHud">
    <div id="timeBarWrap"><div id="timeBar"></div></div>
    <div id="windRow"><span id="windTxt">WIND</span></div>
    <div id="comboTag"></div>
  </div>

  <!-- Title -->
  <div class="overlay" id="title">
    <div class="card">
      <h1 class="title-big">POLY<span class="dot">·</span>GLOT</h1>
      <p class="tagline">flick each token home</p>
      <p class="howto">A block of code appears. <b>Swipe outward</b> to flick it across the chasm onto the <b>island of its language</b>. Match the color. Mismatches shatter.</p>
      <div class="legend" id="legend"></div>
      <button class="btn" data-smoke="start" id="startBtn">Start</button>
      <div class="hint-key">desktop · ← → aim · ↑ ↓ power · space to launch</div>
    </div>
  </div>

  <!-- Game over -->
  <div class="overlay hidden" id="over">
    <div class="card">
      <h2 class="go-title" id="goTitle">SEGFAULT</h2>
      <div id="newbest"></div>
      <div class="stat-row">
        <div class="stat"><span class="k">Score</span><span class="v" id="finalScore">0</span></div>
        <div class="stat"><span class="k">Best</span><span class="v" id="finalBest">0</span></div>
      </div>
      <div class="stat-row" style="gap:26px;">
        <div class="stat"><span class="k">Compiled</span><span class="v" id="finalLands">0</span></div>
        <div class="stat"><span class="k">Bridges</span><span class="v" id="finalBridges">0</span></div>
      </div>
      <p class="verdict" id="verdict"></p>
      <button class="btn" data-smoke="restart" id="restartBtn">Play Again</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
  /* =========================================================================
     POLYGLOT — flick language blocks onto their runtime island.
     Pure Canvas 2D + Web Audio. No external libraries. No persistence.
     ========================================================================= */

  var TAU = Math.PI * 2;
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function rand(a,b){ return a+Math.random()*(b-a); }
  function randi(a,b){ return Math.floor(rand(a,b+1)); }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
  function hypot(x,y){ return Math.sqrt(x*x+y*y); }
  function easeOut(t){ return 1-Math.pow(1-t,3); }
  function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

  // ---- Language definitions -------------------------------------------------
  var LANGS = {
    py: { code:"PY", name:"Python",     runtime:"interpreted", c1:"#4b8dc4", c2:"#ffd43b", ink:"#ffffff", icon:"python" },
    go: { code:"GO", name:"Go",         runtime:"compiled",    c1:"#22c7e6", c2:"#8ff0ff", ink:"#04222b", icon:"gopher" },
    rs: { code:"RS", name:"Rust",       runtime:"native",      c1:"#e0663a", c2:"#ffb089", ink:"#ffffff", icon:"gear" },
    js: { code:"JS", name:"JavaScript", runtime:"V8",          c1:"#f7df1e", c2:"#fff08a", ink:"#1a1a1a", icon:"js" },
    rb: { code:"RB", name:"Ruby",       runtime:"YARV",        c1:"#d5352b", c2:"#ff8378", ink:"#ffffff", icon:"gem" }
  };
  var LANG_KEYS = ["py","go","rs","js","rb"];

  // ---- DOM ------------------------------------------------------------------
  var wrap   = document.getElementById("wrap");
  var canvas = document.getElementById("game");
  var ctx    = canvas.getContext ? canvas.getContext("2d") : null;
  var scoreV = document.getElementById("scoreV");
  var bestEl = document.getElementById("best");
  var livesEl= document.getElementById("lives");
  var timeBar= document.getElementById("timeBar");
  var windRow= document.getElementById("windRow");
  var windTxt= document.getElementById("windTxt");
  var comboTag=document.getElementById("comboTag");
  var titleEl= document.getElementById("title");
  var overEl = document.getElementById("over");
  var muteBtn= document.getElementById("mute");
  var legendEl=document.getElementById("legend");

  // Build legend chips (title screen clarity)
  try{
    for(var li=0; li<LANG_KEYS.length; li++){
      var L = LANGS[LANG_KEYS[li]];
      var chip = document.createElement("span");
      chip.className = "chip";
      var sw = document.createElement("span");
      sw.className = "sw"; sw.style.background = L.c1;
      var tx = document.createElement("span");
      tx.textContent = L.code + " " + L.name;
      chip.appendChild(sw); chip.appendChild(tx);
      legendEl.appendChild(chip);
    }
  }catch(e){}

  // ---- Global sizing --------------------------------------------------------
  var W=360, H=720, DPR=1;
  function resize(){
    try{
      var w = wrap.clientWidth || window.innerWidth || 360;
      var h = wrap.clientHeight || window.innerHeight || 720;
      W=w; H=h;
      DPR = Math.min(window.devicePixelRatio||1, 2.5);
      if(canvas){
        canvas.width = Math.max(1,Math.round(w*DPR));
        canvas.height= Math.max(1,Math.round(h*DPR));
        canvas.style.width = w+"px";
        canvas.style.height= h+"px";
        if(ctx) ctx.setTransform(DPR,0,0,DPR,0,0);
      }
      layout();
    }catch(e){}
  }

  // ---- Palette (theme aware) ------------------------------------------------
  var PAL = {};
  function readPalette(){
    var dark = false;
    try{ dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }catch(e){}
    if(dark){
      PAL = {
        dark:true,
        bg:"#071829", bg2:"#0a2137", chasm:"#03101d",
        ink:"#dcefff", inkDim:"#8fb4d4",
        line:"rgba(120,190,255,0.10)", lineStrong:"rgba(120,190,255,0.20)",
        panel:"#0b2338", edge:"#1b4262",
        accent:"#3ad2ff", good:"#39e3a4", bad:"#ff5d6b", gold:"#ffce4d",
        islandTop:"#0e2c46", islandFace:"#0b2438"
      };
    }else{
      PAL = {
        dark:false,
        bg:"#e9f1fb", bg2:"#dde9f7", chasm:"#cad9ec",
        ink:"#0e2942", inkDim:"#4a6f8f",
        line:"rgba(24,74,128,0.12)", lineStrong:"rgba(24,74,128,0.22)",
        panel:"#f4f8fe", edge:"#bcd0e8",
        accent:"#0b83b0", good:"#0a9d6c", bad:"#d43a4a", gold:"#c68a12",
        islandTop:"#ffffff", islandFace:"#eaf1fb"
      };
    }
  }
  readPalette();
  try{
    var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if(mq){
      var onScheme = function(){ readPalette(); };
      if(mq.addEventListener) mq.addEventListener("change", onScheme);
      else if(mq.addListener) mq.addListener(onScheme);
    }
  }catch(e){}

  var REDUCE = false;
  try{ REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }catch(e){}

  // ---- Audio ----------------------------------------------------------------
  var AC = null, masterGain=null, muted=false;
  function initAudio(){
    if(AC) return;
    try{
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if(!Ctor) return;
      AC = new Ctor();
      masterGain = AC.createGain();
      masterGain.gain.value = 0.9;
      masterGain.connect(AC.destination);
    }catch(e){ AC=null; }
  }
  function resumeAudio(){ try{ if(AC && AC.state==="suspended") AC.resume(); }catch(e){} }
  function tone(freq, dur, type, gain, sweepTo, delay){
    if(!AC || muted || !masterGain) return;
    try{
      var t0 = AC.currentTime + (delay||0);
      var o = AC.createOscillator();
      var g = AC.createGain();
      o.type = type||"sine";
      o.frequency.setValueAtTime(freq, t0);
      if(sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,sweepTo), t0+dur);
      var pk = (gain==null?0.18:gain);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(pk, t0+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0+dur+0.02);
    }catch(e){}
  }
  function noise(dur, gain, hp){
    if(!AC || muted || !masterGain) return;
    try{
      var n = Math.floor(AC.sampleRate*dur);
      var buf = AC.createBuffer(1,n,AC.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<n;i++){ d[i] = (Math.random()*2-1)*(1-i/n); }
      var src = AC.createBufferSource(); src.buffer=buf;
      var g = AC.createGain(); g.gain.value = gain==null?0.2:gain;
      var f = AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp||600;
      src.connect(f); f.connect(g); g.connect(masterGain);
      src.start();
    }catch(e){}
  }
  var SND = {
    launch:function(){ tone(520,0.16,"triangle",0.14,150); },
    land:function(combo){ var base=440*Math.pow(1.0595,Math.min(combo,14)); tone(base,0.16,"sine",0.16); tone(base*1.5,0.14,"sine",0.08,null,0.02); },
    perfect:function(){ tone(660,0.12,"sine",0.16); tone(990,0.16,"sine",0.12,null,0.05); tone(1320,0.2,"sine",0.09,null,0.1); },
    shatter:function(){ noise(0.3,0.28,900); tone(150,0.28,"sawtooth",0.14,60); },
    chasm:function(){ tone(300,0.5,"sine",0.14,70); },
    bridge:function(){ var s=[523,659,784,1046,1318]; for(var i=0;i<s.length;i++) tone(s[i],0.35,"triangle",0.14,null,i*0.07); },
    level:function(){ tone(400,0.1,"square",0.1); tone(600,0.12,"square",0.1,null,0.08); },
    over:function(){ tone(330,0.3,"sine",0.16,120); tone(220,0.5,"sine",0.14,80,0.12); },
    ui:function(){ tone(700,0.07,"triangle",0.1,500); }
  };
  function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

  function setMuted(m){
    muted = m;
    muteBtn.textContent = muted ? "✕" : "♪";
    muteBtn.style.opacity = muted ? "0.5" : "1";
  }

  // ---- Game state -----------------------------------------------------------
  var STATE_TITLE="title", STATE_PLAY="play", STATE_OVER="over";
  var state = STATE_TITLE;

  var game = null;      // active round data
  var best = 0;
  var launcher = { x:0, y:0 };

  function defaultRound(){
    return {
      score:0, displayScore:0,
      lives:3, maxLives:3,
      timeLeft:20, timeMax:26,
      level:1, lands:0, landsThisLevel:0, bridges:0,
      combo:0, bestCombo:0,
      spans:0,                 // bridge progress 0..3 (perfects)
      boostT:0,                // 2x window seconds
      wind:0, windMax:0,
      islands:[],
      block:null,
      shots:0
    };
  }

  // Difficulty parameters from level
  function levelParams(lv){
    var count = clamp(2 + Math.floor(lv/2), 2, 4);       // 1:2 2:3 3:3 4:4 ...
    var drift = lv>=2 ? Math.min(0.020 + (lv-2)*0.013, 0.11) : 0;    // relative to W
    var driftSpd = 0.6 + lv*0.09;
    var wind = lv>=2 ? Math.min((lv-1)*0.20, 1.5) : 0;              // wind magnitude
    var weight = Math.max(0,(lv-2))*0.45;                           // heavier blocks
    var narrow = Math.min((lv-1)*0.030, 0.34);
    return { count:count, drift:drift, driftSpd:driftSpd, wind:wind, weight:weight, narrow:narrow };
  }

  // Physics constants scale with viewport height (resolution independent)
  function phys(){
    return {
      g: 3.35 * H,
      minSpeed: 0.85 * H,
      maxSpeed: 2.35 * H,
      maxDrag: clamp(Math.min(W,H)*0.42, 130, 340),
      windAccel: 0.60 * H
    };
  }
  function weightFactor(w){ return 1/(1 + w*0.16); }  // heavier -> less launch speed

  // ---- Islands --------------------------------------------------------------
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function islandWidth(lv){
    var p = levelParams(lv);
    return clamp(Math.min(W, H*0.9)*0.205, 66, 140) * (1 - p.narrow);
  }
  function makeIslands(lv){
    var p = levelParams(lv);
    var chosen = shuffle(LANG_KEYS.slice()).slice(0, p.count);
    var n = chosen.length;

    var wBase = islandWidth(lv);
    // Centered "field": full width on portrait phones, clustered on wide desktop.
    var fieldW = Math.min(W, H*0.78);
    var fieldL = (W - fieldW)/2;
    var half = wBase/2;
    var pad = fieldW*0.03;
    var safeMin = (fieldL + half + pad)/W;
    var safeMax = (fieldL + fieldW - half - pad)/W;
    if(safeMin >= safeMax){ var m=0.5; safeMin=m-0.001; safeMax=m+0.001; }

    // distinct y rows, shuffled so height doesn't correlate with x
    var rows=[];
    for(var r=0;r<n;r++){ rows.push( lerp(0.22, 0.50, n===1?0.5:(r/(n-1))) ); }
    shuffle(rows);

    var list = [];
    for(var k=0;k<n;k++){
      var frac = n===1 ? 0.5 : (k/(n-1));
      var rx = lerp(safeMin, safeMax, frac);
      var jit = (safeMax-safeMin)*0.05;
      rx = clamp(rx + rand(-jit,jit), safeMin, safeMax);
      var ry = clamp(rows[k] + rand(-0.02,0.02) - (lv>=5? rand(0,0.05):0), 0.16, 0.54);
      var amp = Math.min(p.drift, rx-safeMin, safeMax-rx);
      list.push({
        lang: chosen[k],
        rx: rx, ry: ry, baseRx: rx, w: wBase,
        driftAmp: amp*(0.8+Math.random()*0.4),
        driftSpd: p.driftSpd * (0.8+Math.random()*0.5),
        phase: rand(0,TAU),
        glow:0, land:0, x:0, y:0
      });
    }
    return list;
  }

  function islandX(isl, t){
    var x = isl.baseRx*W + Math.sin(t*isl.driftSpd + isl.phase) * isl.driftAmp * W;
    var half = isl.w/2;
    return clamp(x, half+4, W-half-4);
  }
  function islandY(isl){ return isl.ry * H; }
  function islandHeight(){ return clamp(H*0.022, 14, 26); }

  // ---- Block ----------------------------------------------------------------
  function newBlock(){
    if(!game) return;
    var langs = game.islands.map(function(i){ return i.lang; });
    var lang = pick(langs);
    var p = levelParams(game.level);
    game.wind = p.wind>0 ? rand(-1,1)*p.wind : 0;
    game.windMax = p.wind;
    game.block = {
      lang: lang,
      x: launcher.x, y: launcher.y,
      vx:0, vy:0, prevX:launcher.x, prevY:launcher.y,
      rot:0, rotSpd:0,
      state:"ready",         // ready | flight | done
      scale:0,               // spawn pop
      weight: p.weight,
      trail:[]
    };
    updateWindHud();
  }

  // ---- Input ----------------------------------------------------------------
  var input = {
    aiming:false, sx:0, sy:0, cx:0, cy:0, pid:null,
    angle:-Math.PI*0.5, power:0.6,   // keyboard aim defaults (straight up)
    keyL:false, keyR:false, keyU:false, keyD:false,
    everAimed:false
  };

  function ptFromEvent(e){
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function computeAim(){
    var ph = phys();
    var dir, power;
    if(input.aiming){
      var dx = input.cx - input.sx, dy = input.cy - input.sy;
      var dist = hypot(dx,dy);
      power = clamp(dist/ph.maxDrag, 0, 1);
      if(dist>0.0001){ dir = { x:dx/dist, y:dy/dist }; }
      else { dir = { x:Math.cos(input.angle), y:Math.sin(input.angle) }; }
    }else{
      dir = { x:Math.cos(input.angle), y:Math.sin(input.angle) };
      power = input.power;
    }
    var wf = game && game.block ? weightFactor(game.block.weight) : 1;
    var speed = (ph.minSpeed + power*(ph.maxSpeed-ph.minSpeed)) * wf;
    return { dir:dir, power:power, vx:dir.x*speed, vy:dir.y*speed };
  }

  function canAim(){ return state===STATE_PLAY && game && game.block && game.block.state==="ready" && hitStop<=0; }

  function onDown(e){
    try{
      if(state===STATE_PLAY){ resumeAudio(); }
      if(!canAim()) return;
      e.preventDefault();
      var p = ptFromEvent(e);
      input.aiming=true; input.everAimed=true;
      input.sx=p.x; input.sy=p.y; input.cx=p.x; input.cy=p.y; input.pid=e.pointerId;
      if(canvas.setPointerCapture && e.pointerId!=null){ try{ canvas.setPointerCapture(e.pointerId); }catch(_){} }
    }catch(err){}
  }
  function onMove(e){
    try{
      if(!input.aiming) return;
      if(input.pid!=null && e.pointerId!=null && e.pointerId!==input.pid) return;
      e.preventDefault();
      var p = ptFromEvent(e);
      input.cx=p.x; input.cy=p.y;
      // update keyboard angle/power to mirror drag (so a following space works)
      var a = computeAim();
      input.angle = Math.atan2(a.dir.y, a.dir.x);
      input.power = a.power;
    }catch(err){}
  }
  function onUp(e){
    try{
      if(!input.aiming) return;
      if(input.pid!=null && e.pointerId!=null && e.pointerId!==input.pid) return;
      e.preventDefault();
      input.aiming=false; input.pid=null;
      var a = computeAim();
      if(a.power>=0.07 && canAimAtRelease()){ launch(a); }
    }catch(err){}
  }
  function canAimAtRelease(){ return state===STATE_PLAY && game && game.block && game.block.state==="ready" && hitStop<=0; }

  function launch(a){
    var b = game.block;
    b.vx = a.vx; b.vy = a.vy;
    b.state="flight";
    b.rotSpd = (a.vx>=0?1:-1) * rand(6,10) * (0.6+a.power);
    b.prevX=b.x; b.prevY=b.y;
    b.trail.length=0;
    game.shots++;
    SND.launch();
    buzz(8);
    // squash on launch
    b.scale=1.18;
    input.everAimed=false;
  }

  // pointer listeners
  if(canvas){
    canvas.addEventListener("pointerdown", onDown, {passive:false});
    canvas.addEventListener("pointermove", onMove, {passive:false});
    canvas.addEventListener("pointerup", onUp, {passive:false});
    canvas.addEventListener("pointercancel", function(e){ try{ input.aiming=false; input.pid=null; }catch(_){}} , {passive:false});
    // block context menu / gesture zoom
    canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }

  // keyboard
  window.addEventListener("keydown", function(e){
    try{
      var k = e.key;
      if(state===STATE_TITLE){
        if(k===" "||k==="Enter"){ e.preventDefault(); startGame(); }
        return;
      }
      if(state===STATE_OVER){
        if(k===" "||k==="Enter"){ e.preventDefault(); startGame(); }
        return;
      }
      if(state===STATE_PLAY){
        if(k==="ArrowLeft"){ input.keyL=true; e.preventDefault(); }
        else if(k==="ArrowRight"){ input.keyR=true; e.preventDefault(); }
        else if(k==="ArrowUp"){ input.keyU=true; e.preventDefault(); }
        else if(k==="ArrowDown"){ input.keyD=true; e.preventDefault(); }
        else if(k===" "||k==="Enter"){
          e.preventDefault();
          if(canAim()){ var a=computeAim(); if(a.power>=0.07) launch(a); }
        }
        else if(k==="m"||k==="M"){ setMuted(!muted); SND.ui(); }
      }
    }catch(err){}
  });
  window.addEventListener("keyup", function(e){
    try{
      var k=e.key;
      if(k==="ArrowLeft") input.keyL=false;
      else if(k==="ArrowRight") input.keyR=false;
      else if(k==="ArrowUp") input.keyU=false;
      else if(k==="ArrowDown") input.keyD=false;
    }catch(err){}
  });

  muteBtn.addEventListener("click", function(e){ e.preventDefault(); initAudio(); resumeAudio(); setMuted(!muted); if(!muted) SND.ui(); });

  // ---- Effects: particles, popups, banners, shake, hitstop ------------------
  var particles = [];
  var popups = [];
  var banner = null;      // {text, sub, t, life, color}
  var levelBanner = null; // {text, t, life}
  var shake = 0;
  var hitStop = 0;
  var zoomPunch = 0;
  var flash = 0, flashColor = "#ffffff";
  var celebrateT = 0;
  var parade = [];        // dancing blocks on bridge

  function addParticle(pp){ if(particles.length<520) particles.push(pp); }
  function burst(x,y,color,n,spd,opts){
    opts = opts||{};
    for(var i=0;i<n;i++){
      var a = rand(0,TAU);
      var s = rand(spd*0.3, spd);
      addParticle({
        x:x, y:y,
        vx:Math.cos(a)*s + (opts.vx||0),
        vy:Math.sin(a)*s + (opts.vy||0),
        life:rand(opts.lifeMin||0.4, opts.lifeMax||0.9),
        maxLife:1, size:rand(opts.sizeMin||2, opts.sizeMax||5),
        color:color, grav:opts.grav==null?900:opts.grav,
        shape:opts.shape||"spark", rot:rand(0,TAU), vr:rand(-8,8),
        drag:opts.drag||0.98
      });
      particles[particles.length-1].maxLife = particles[particles.length-1].life;
    }
  }
  function addPopup(x,y,text,color,size){
    popups.push({ x:x, y:y, text:text, color:color, size:size||16, life:0.95, maxLife:0.95, vy:-46 });
  }

  // ---- Scoring / resolution -------------------------------------------------
  function comboMult(){ return 1 + Math.min(game.combo,18)*0.12; }
  function levelMult(){ return 1 + (game.level-1)*0.08; }
  function boostMult(){ return game.boostT>0 ? 2 : 1; }

  function addTime(dt){ game.timeLeft = clamp(game.timeLeft + dt, 0, game.timeMax); }

  function resolveLanding(isl, offset){
    var b = game.block;
    var correct = (isl.lang === b.lang);
    var lx = islandX(isl, gTime), ly = islandY(isl);
    if(correct){
      var perfect = Math.abs(offset) < 0.24;
      game.combo++;
      game.lands++; game.landsThisLevel++;
      if(game.combo>game.bestCombo) game.bestCombo=game.combo;
      isl.land = 1; isl.glow = 1;

      var base = perfect ? 250 : 120;
      var gained = Math.round(base * comboMult() * levelMult() * boostMult());
      game.score += gained;

      var col = perfect ? PAL.gold : LANGS[isl.lang].c1;
      addPopup(lx, ly - islandHeight() - 14, "+"+gained, col, perfect?22:17);

      if(perfect){
        SND.perfect(); buzz([10,20,10]);
        addPopup(lx, ly - islandHeight() - 40, "PERFECT", PAL.gold, 15);
        burst(b.x, b.y, PAL.gold, 26, 460, {sizeMin:2,sizeMax:5,grav:700});
        burst(b.x, b.y, LANGS[isl.lang].c2, 14, 360, {sizeMin:2,sizeMax:4,grav:500});
        addTime(2.8);
        game.spans++;
        hitStop = Math.max(hitStop, 0.07);
        zoomPunch = Math.max(zoomPunch, 0.5);
        if(game.spans>=3){ triggerBridge(); }
      }else{
        SND.land(game.combo); buzz(9);
        burst(b.x, b.y, LANGS[isl.lang].c1, 16, 340, {sizeMin:2,sizeMax:4,grav:700});
        addTime(2.0);
        hitStop = Math.max(hitStop, 0.045);
      }
      shake = Math.max(shake, perfect?7:3.5);

      // level progression
      if(game.landsThisLevel >= (3 + Math.floor(game.level/2))){
        levelUp();
      }
      b.state="done";
      // brief settle then next block
      scheduleNext(0.16);
    }else{
      // mismatch -> shatter, lose a life
      shatter(b, isl);
    }
  }

  function shatter(b, isl){
    game.combo=0; game.spans=0;
    game.lives--;
    updateLives();
    SND.shatter(); buzz([30,25,40]);
    var col = LANGS[b.lang].c1;
    burst(b.x, b.y, col, 30, 520, {sizeMin:3,sizeMax:8,grav:1400,shape:"shard",lifeMin:0.5,lifeMax:1.1});
    burst(b.x, b.y, "#ffffff", 10, 300, {sizeMin:2,sizeMax:4,grav:900});
    addPopup(b.x, b.y-20, isl? "WRONG RUNTIME":"−1", PAL.bad, 16);
    shake = Math.max(shake, 12);
    hitStop = Math.max(hitStop, 0.09);
    flash = Math.max(flash, 0.5); flashColor = PAL.bad;
    b.state="done";
    if(game.lives<=0){ scheduleGameOver(0.25); }
    else scheduleNext(0.28);
  }

  function chasmMiss(b){
    game.combo=0; game.spans=0;
    SND.chasm(); buzz(20);
    addPopup(b.x, Math.min(b.y, H-40), "LOST TO VOID", PAL.inkDim, 14);
    addTime(-1.8);
    shake = Math.max(shake, 4);
    b.state="done";
    if(game.timeLeft<=0){ scheduleGameOver(0.2); }
    else scheduleNext(0.18);
  }

  var nextTimer=-1, overTimer=-1;
  function scheduleNext(delay){ nextTimer = delay; }
  function scheduleGameOver(delay){ overTimer = delay; }

  function levelUp(){
    game.level++;
    game.landsThisLevel=0;
    game.islands = makeIslands(game.level);
    if(!banner){ levelBanner = { text:"LEVEL "+game.level, t:0, life:1.5 }; }
    SND.level();
    // gentle flash
    flash = Math.max(flash, 0.22); flashColor = PAL.accent;
  }

  function triggerBridge(){
    game.spans=0;
    game.bridges++;
    game.boostT = Math.max(game.boostT, 6.5);
    var bonus = 600 * game.level;
    game.score += bonus;
    game.combo += 2;
    addTime(2.4);
    banner = { text:"CROSS·LANGUAGE BRIDGE", sub:"2× COMPILE BOOST  ·  +"+bonus, t:0, life:2.2, color:PAL.gold };
    SND.bridge(); buzz([12,30,12,30,80]);
    celebrateT = 2.0;
    flash = Math.max(flash, 0.6); flashColor = PAL.gold;
    shake = Math.max(shake, 14);
    zoomPunch = Math.max(zoomPunch, 1.0);
    // confetti of language chips
    for(var i=0;i<70;i++){
      var lk = pick(LANG_KEYS);
      addParticle({
        x:rand(0,W), y:rand(-40,H*0.3),
        vx:rand(-80,80), vy:rand(40,180),
        life:rand(1.2,2.2), maxLife:2.2, size:rand(6,12),
        color:LANGS[lk].c1, grav:260, shape:"confetti",
        rot:rand(0,TAU), vr:rand(-10,10), drag:0.995
      });
    }
    // parade of dancing blocks across the bridge
    parade.length=0;
    for(var j=0;j<5;j++){
      parade.push({ lang:pick(LANG_KEYS), t:-j*0.16, y0:0 });
    }
  }

  // ---- Update ---------------------------------------------------------------
  var gTime = 0;   // gameplay clock for drift
  function update(dt){
    // banners/effects advance regardless of hitstop (visual continuity)
    gTimeVisual += dt;

    // decay visual effects
    if(shake>0){ shake = Math.max(0, shake - dt*38); }
    if(flash>0){ flash = Math.max(0, flash - dt*2.2); }
    if(zoomPunch>0){ zoomPunch = Math.max(0, zoomPunch - dt*3.2); }
    if(celebrateT>0){ celebrateT = Math.max(0, celebrateT - dt); }

    if(levelBanner){ levelBanner.t += dt; if(levelBanner.t>=levelBanner.life) levelBanner=null; }
    if(banner){ banner.t += dt; if(banner.t>=banner.life) banner=null; }

    // particles
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.life -= dt;
      if(p.life<=0){ particles.splice(i,1); continue; }
      p.vy += (p.grav||0)*dt;
      p.vx *= (p.drag||1); p.vy *= (p.drag||1);
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.rot += (p.vr||0)*dt;
    }
    // popups
    for(var j=popups.length-1;j>=0;j--){
      var q=popups[j];
      q.life -= dt; if(q.life<=0){ popups.splice(j,1); continue; }
      q.y += q.vy*dt; q.vy *= 0.92;
    }
    // parade
    if(parade.length){
      for(var pp=0; pp<parade.length; pp++){ parade[pp].t += dt*0.9; }
      if(celebrateT<=0 && (!banner)) parade.length=0;
    }

    if(state!==STATE_PLAY || !game){ return; }

    // hit-stop freezes gameplay physics only
    if(hitStop>0){ hitStop = Math.max(0, hitStop-dt); }
    else {
      gTime += dt;

      // timer + boost (clock drains faster at higher levels)
      game.boostT = Math.max(0, game.boostT - dt);
      game.timeLeft -= dt * (1 + (game.level-1)*0.11);
      if(game.timeLeft<=0){ game.timeLeft=0; if(overTimer<0) scheduleGameOver(0.05); }

      // keyboard aim adjust
      var aimSpeed = 1.6*dt;
      if(input.keyL){ input.angle -= aimSpeed; input.everAimed=true; }
      if(input.keyR){ input.angle += aimSpeed; input.everAimed=true; }
      if(input.keyU){ input.power = clamp(input.power + dt*0.9, 0, 1); input.everAimed=true; }
      if(input.keyD){ input.power = clamp(input.power - dt*0.9, 0, 1); input.everAimed=true; }
      // keep angle within an upward-ish arc for sanity
      // (allow full range but nudge default)
      var minA = -Math.PI*0.96, maxA = -Math.PI*0.04;
      if(input.angle<minA) input.angle=minA;
      if(input.angle>maxA) input.angle=maxA;

      // islands glow decay
      for(var k=0;k<game.islands.length;k++){
        var isl=game.islands[k];
        if(isl.glow>0) isl.glow=Math.max(0,isl.glow-dt*2.2);
        if(isl.land>0) isl.land=Math.max(0,isl.land-dt*1.6);
      }

      // block physics
      var b=game.block;
      if(b){
        if(b.state==="ready"){
          b.scale = lerp(b.scale, 1, Math.min(1,dt*12));
          b.x = launcher.x; b.y = launcher.y;
        }else if(b.state==="flight"){
          b.scale = lerp(b.scale, 1, Math.min(1,dt*8));
          var ph = phys();
          var steps = Math.max(1, Math.ceil(dt/0.004));
          var h = dt/steps;
          for(var st=0; st<steps; st++){
            b.prevX=b.x; b.prevY=b.y;
            b.vy += ph.g*h;
            b.vx += game.wind*ph.windAccel*h;
            b.x  += b.vx*h;
            b.y  += b.vy*h;
            b.rot += b.rotSpd*h;
            // record trail occasionally
            if(checkLanding(b)) break;
            if(b.state!=="flight") break;
          }
          if(b.state==="flight"){
            // trail
            b.trail.push({x:b.x,y:b.y});
            if(b.trail.length>14) b.trail.shift();
            // offscreen -> chasm
            if(b.y > H + H*0.12 || b.x < -W*0.2 || b.x > W*1.2){
              chasmMiss(b);
            }
          }
        }
      }
    }

    // deferred scheduling (respect real time, not hitstop)
    if(nextTimer>=0){
      nextTimer -= dt;
      if(nextTimer<0){ nextTimer=-1; if(state===STATE_PLAY && game && game.lives>0 && game.timeLeft>0){ newBlock(); } }
    }
    if(overTimer>=0){
      overTimer -= dt;
      if(overTimer<0){ overTimer=-1; endGame(); }
    }

    syncHud();
  }

  function checkLanding(b){
    if(!game) return false;
    var ih = islandHeight();
    var hs = blockHalf();
    for(var k=0;k<game.islands.length;k++){
      var isl = game.islands[k];
      var ix = islandX(isl, gTime), iy = islandY(isl);
      var top = iy - ih/2;
      var left = ix - isl.w/2, right = ix + isl.w/2;
      var pad = hs*0.4;
      // must be descending and cross the top surface within x-range
      if(b.vy>0){
        var bottomPrev = b.prevY + hs;
        var bottomNow  = b.y + hs;
        if(bottomPrev <= top+2 && bottomNow >= top && b.x>left+pad && b.x<right-pad){
          // land!
          b.y = top - hs;
          b.vx=0; b.vy=0;
          var offset = (b.x - ix)/(isl.w/2);
          resolveLanding(isl, offset);
          return true;
        }
      }
    }
    return false;
  }

  function blockHalf(){ return clamp(H*0.030, 15, 30); }

  // ---- HUD sync -------------------------------------------------------------
  var lifeNodes = [];
  function buildLives(){
    livesEl.innerHTML="";
    lifeNodes=[];
    for(var i=0;i<game.maxLives;i++){
      var d=document.createElement("div");
      d.className="life";
      livesEl.appendChild(d);
      lifeNodes.push(d);
    }
  }
  function updateLives(){
    for(var i=0;i<lifeNodes.length;i++){
      if(i < game.lives) lifeNodes[i].classList.remove("lost");
      else lifeNodes[i].classList.add("lost");
    }
  }
  function updateWindHud(){
    if(!game) return;
    if(game.windMax>0){
      windRow.classList.add("on");
      var dir = game.wind>=0 ? "→" : "←";
      var mag = Math.min(3, Math.round(Math.abs(game.wind)/Math.max(0.001,game.windMax)*3 + 0.5));
      var bars=""; for(var i=0;i<3;i++){ bars += i<mag ? "▮":"▯"; }
      windTxt.textContent = "WIND "+dir+" "+bars;
      windTxt.style.color = Math.abs(game.wind)>game.windMax*0.6 ? PAL.bad : "";
    }else{
      windRow.classList.remove("on");
    }
  }
  function syncHud(){
    // eased score
    game.displayScore = game.displayScore + (game.score-game.displayScore)*0.2;
    if(Math.abs(game.score-game.displayScore)<1) game.displayScore=game.score;
    scoreV.textContent = Math.round(game.displayScore).toLocaleString();
    bestEl.textContent = "BEST "+Math.max(best,game.score).toLocaleString();

    // time bar
    var frac = clamp(game.timeLeft/game.timeMax,0,1);
    timeBar.style.transform = "scaleX("+frac+")";
    var tcol = frac>0.4 ? PAL.accent : (frac>0.2? PAL.gold : PAL.bad);
    timeBar.style.background = tcol;

    // combo tag
    if(game.combo>=2 || game.boostT>0){
      comboTag.classList.add("on");
      var txt = "";
      if(game.combo>=2) txt += "COMBO ×"+game.combo;
      if(game.boostT>0) txt += (txt?"  ":"")+"⚡2× "+game.boostT.toFixed(1)+"s";
      comboTag.textContent = txt;
      comboTag.style.color = game.boostT>0 ? PAL.gold : PAL.accent;
    }else{
      comboTag.classList.remove("on");
    }
  }

  // ---- Drawing helpers ------------------------------------------------------
  function roundRect(x,y,w,h,r){
    r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function luminance(hex){
    try{
      var c = hex.replace("#","");
      if(c.length===3){ c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2]; }
      var r=parseInt(c.substr(0,2),16)/255, g=parseInt(c.substr(2,2),16)/255, b=parseInt(c.substr(4,2),16)/255;
      return 0.2126*r+0.7152*g+0.0722*b;
    }catch(e){ return 0.5; }
  }
  function inkOn(hex){ return luminance(hex)>0.6 ? "#12202c" : "#ffffff"; }

  // draw a small language icon centered in box (size s)
  function drawIcon(kind, cx, cy, s, L){
    ctx.save();
    ctx.translate(cx,cy);
    if(kind==="python"){
      var u=s*0.5;
      ctx.fillStyle="#3f76ab";
      roundRect(-u,-u,u,u,u*0.28); ctx.fill();
      ctx.fillStyle="#ffd43b";
      roundRect(0,0,u,u,u*0.28); ctx.fill();
      ctx.fillStyle="#ffffff";
      ctx.beginPath(); ctx.arc(-u*0.5,-u*0.5,u*0.14,0,TAU); ctx.fill();
      ctx.fillStyle="#3f76ab";
      ctx.beginPath(); ctx.arc(u*0.5,u*0.5,u*0.14,0,TAU); ctx.fill();
    }else if(kind==="gopher"){
      ctx.fillStyle=L.c1;
      roundRect(-s*0.5,-s*0.5,s,s,s*0.3); ctx.fill();
      ctx.fillStyle="#ffffff";
      ctx.beginPath(); ctx.arc(-s*0.20,-s*0.12,s*0.16,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(s*0.20,-s*0.12,s*0.16,0,TAU); ctx.fill();
      ctx.fillStyle="#0a2b34";
      ctx.beginPath(); ctx.arc(-s*0.20,-s*0.12,s*0.07,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(s*0.20,-s*0.12,s*0.07,0,TAU); ctx.fill();
      ctx.fillStyle="#ffffff";
      roundRect(-s*0.10,s*0.12,s*0.20,s*0.14,2); ctx.fill();
    }else if(kind==="gear"){
      ctx.fillStyle=L.c1;
      var teeth=8, ro=s*0.5, ri=s*0.34;
      ctx.beginPath();
      for(var i=0;i<teeth;i++){
        var a0=(i/teeth)*TAU, a1=((i+0.5)/teeth)*TAU;
        ctx.lineTo(Math.cos(a0)*ro, Math.sin(a0)*ro);
        ctx.lineTo(Math.cos(a1)*ro, Math.sin(a1)*ro);
        var a2=((i+0.5)/teeth)*TAU, a3=((i+1)/teeth)*TAU;
        ctx.lineTo(Math.cos(a2)*ri, Math.sin(a2)*ri);
        ctx.lineTo(Math.cos(a3)*ri, Math.sin(a3)*ri);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle=L.ink==="#ffffff"?"#7a2f16":"#ffffff";
      ctx.beginPath(); ctx.arc(0,0,s*0.16,0,TAU); ctx.fill();
    }else if(kind==="js"){
      ctx.fillStyle=L.c1;
      roundRect(-s*0.5,-s*0.5,s,s,s*0.18); ctx.fill();
      ctx.fillStyle="#1a1a1a";
      ctx.font="700 "+(s*0.5)+"px ui-monospace,monospace";
      ctx.textAlign="right"; ctx.textBaseline="alphabetic";
      ctx.fillText("JS", s*0.42, s*0.38);
    }else if(kind==="gem"){
      ctx.fillStyle=L.c1;
      ctx.beginPath();
      ctx.moveTo(0,-s*0.5);
      ctx.lineTo(s*0.5,-s*0.1);
      ctx.lineTo(0,s*0.5);
      ctx.lineTo(-s*0.5,-s*0.1);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,0.55)"; ctx.lineWidth=Math.max(1,s*0.04);
      ctx.beginPath();
      ctx.moveTo(-s*0.5,-s*0.1); ctx.lineTo(s*0.5,-s*0.1);
      ctx.moveTo(0,-s*0.5); ctx.lineTo(0,s*0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBlock(b, x, y, size, alpha, ghost){
    var L = LANGS[b.lang];
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(b.rot||0);
    var sc = b.scale||1;
    // squash-stretch based on velocity when in flight
    ctx.scale(sc, (2-sc));
    ctx.globalAlpha = alpha==null?1:alpha;
    var s=size;
    // shadow/glow
    if(!ghost){
      ctx.shadowColor = L.c1;
      ctx.shadowBlur = 14;
    }
    // body
    ctx.fillStyle = L.c1;
    roundRect(-s/2,-s/2,s,s,s*0.22); ctx.fill();
    ctx.shadowBlur=0;
    // inner face
    ctx.fillStyle = ghost? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.14)";
    roundRect(-s/2+s*0.08,-s/2+s*0.08,s-s*0.16,s*0.34,s*0.12); ctx.fill();
    // code label
    ctx.fillStyle = inkOn(L.c1);
    ctx.font = "800 "+(s*0.42)+"px ui-monospace,monospace";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(L.code, 0, s*0.04);
    ctx.restore();
  }

  // ---- Render ---------------------------------------------------------------
  function drawBackground(){
    // base
    ctx.fillStyle = PAL.bg;
    ctx.fillRect(0,0,W,H);

    // chasm band (lower area) — subtly darker
    var chTop = H*0.60;
    ctx.fillStyle = PAL.chasm;
    ctx.globalAlpha = PAL.dark?0.5:0.45;
    ctx.fillRect(0, chTop, W, H-chTop);
    ctx.globalAlpha = 1;

    // blueprint grid
    var grid = clamp(Math.round(W/12), 26, 44);
    ctx.lineWidth = 1;
    ctx.strokeStyle = PAL.line;
    ctx.beginPath();
    for(var gx=0; gx<=W; gx+=grid){ ctx.moveTo(gx+0.5,0); ctx.lineTo(gx+0.5,H); }
    for(var gy=0; gy<=H; gy+=grid){ ctx.moveTo(0,gy+0.5); ctx.lineTo(W,gy+0.5); }
    ctx.stroke();
    // stronger every 4th
    ctx.strokeStyle = PAL.lineStrong;
    ctx.beginPath();
    for(var gx2=0; gx2<=W; gx2+=grid*4){ ctx.moveTo(gx2+0.5,0); ctx.lineTo(gx2+0.5,H); }
    for(var gy2=0; gy2<=H; gy2+=grid*4){ ctx.moveTo(0,gy2+0.5); ctx.lineTo(W,gy2+0.5); }
    ctx.stroke();

    // faint concentric guide circles (blueprint compass) around launcher
    ctx.strokeStyle = PAL.line;
    ctx.globalAlpha = 0.6;
    for(var r=grid*2; r<H; r+=grid*3){
      ctx.beginPath();
      ctx.arc(W*0.5, H*0.86, r, Math.PI*1.08, Math.PI*1.92);
      ctx.stroke();
    }
    ctx.globalAlpha=1;

    // wind streaks (when windy)
    if(state===STATE_PLAY && game && game.windMax>0 && Math.abs(game.wind)>0.05){
      ctx.strokeStyle = PAL.lineStrong;
      ctx.globalAlpha = 0.5;
      var dir = game.wind>=0?1:-1;
      for(var wsi=0; wsi<10; wsi++){
        var wy = ((gTimeVisual*40*dir*Math.abs(game.wind)) % H + wsi*(H/10) + H) % H;
        var wl = 14 + Math.abs(game.wind)*20;
        ctx.beginPath();
        ctx.moveTo((wsi*W/10), wy);
        ctx.lineTo((wsi*W/10)+wl*dir, wy);
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    // title block (engineering drawing) bottom-left corner
    drawTitleBlock();
  }

  function drawTitleBlock(){
    var pad = 12 + safeLeft();
    var bx = pad, by = H - 34 - safeBottom();
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = PAL.lineStrong;
    ctx.lineWidth=1;
    ctx.font = "9px ui-monospace,monospace";
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillStyle = PAL.inkDim;
    if(state===STATE_PLAY && game){
      ctx.fillText("PROJECT · POLYGLOT", bx, by);
      ctx.fillText("LEVEL "+game.level+" / RUNTIME BRIDGE", bx, by+12);
    }else{
      ctx.fillText("PROJECT · POLYGLOT", bx, by);
      ctx.fillText("REV 2026.08 / CROSS-COMPILE", bx, by+12);
    }
    ctx.globalAlpha=1;
  }

  function safeBottom(){ return 0; }
  function safeLeft(){ return 0; }

  function drawIsland(isl){
    var x = islandX(isl, gTime), y = islandY(isl);
    var L = LANGS[isl.lang];
    var ih = islandHeight();
    var w = isl.w;
    var isBlock = game && game.block && game.block.lang===isl.lang && game.block.state==="ready";

    ctx.save();
    ctx.translate(x,y);

    // hanging blueprint roots (floating island)
    ctx.strokeStyle = PAL.line;
    ctx.lineWidth=1;
    ctx.beginPath();
    for(var ri=-1; ri<=1; ri++){
      var rx = ri*(w*0.32);
      ctx.moveTo(rx, ih/2);
      ctx.lineTo(rx*0.5, ih/2 + 26 + Math.abs(ri)*8);
    }
    ctx.stroke();
    // little tick at root ends
    ctx.fillStyle=PAL.line;

    // slab body
    var glow = isl.glow;
    if(glow>0 || isBlock){
      ctx.shadowColor = L.c1;
      ctx.shadowBlur = 18*(Math.max(glow, isBlock?0.5:0));
    }
    ctx.fillStyle = PAL.islandFace;
    roundRect(-w/2, -ih/2, w, ih, 6); ctx.fill();
    ctx.shadowBlur=0;

    // colored top surface (landing strip)
    ctx.fillStyle = L.c1;
    ctx.globalAlpha = 0.95;
    roundRect(-w/2, -ih/2, w, ih*0.42, 5); ctx.fill();
    ctx.globalAlpha=1;

    // center "perfect" tick marks
    ctx.strokeStyle = "rgba(255,255,255,"+(PAL.dark?0.5:0.6)+")";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,-ih/2); ctx.lineTo(0,-ih/2+ih*0.42);
    ctx.stroke();

    // border
    ctx.strokeStyle = isBlock ? L.c1 : PAL.edge;
    ctx.lineWidth = isBlock? 2 : 1;
    roundRect(-w/2, -ih/2, w, ih, 6); ctx.stroke();

    ctx.restore();

    // label below slab: icon + code + name
    ctx.save();
    ctx.translate(x, y);
    var iconS = clamp(ih*1.0, 16, 24);
    drawIcon(L.icon, -w/2 + iconS*0.7 + 4, ih/2 + 16, iconS, L);
    ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillStyle = L.c1;
    ctx.font = "800 "+(clamp(ih*0.8,12,17))+"px ui-monospace,monospace";
    ctx.fillText(L.code, -w/2 + iconS + 10, ih/2 + 14);
    ctx.fillStyle = PAL.inkDim;
    ctx.font = "9px ui-monospace,monospace";
    ctx.fillText(L.name.toLowerCase(), -w/2 + iconS + 10, ih/2 + 26);
    ctx.restore();

    // "landed" ring pulse
    if(isl.land>0){
      ctx.save();
      ctx.translate(x,y);
      ctx.globalAlpha = isl.land*0.8;
      ctx.strokeStyle = L.c1;
      ctx.lineWidth = 2;
      var rr = (1-isl.land)*w*0.7 + 8;
      roundRect(-rr/2,-ih/2-4,rr,ih+8, 8); ctx.stroke();
      ctx.restore();
    }
  }

  function drawLauncher(){
    var x=launcher.x, y=launcher.y;
    var base = clamp(H*0.05, 26, 46);
    ctx.save();
    // pad
    ctx.fillStyle = PAL.islandFace;
    ctx.strokeStyle = PAL.edge;
    ctx.lineWidth=1;
    roundRect(x-base, y+blockHalf()*0.7, base*2, base*0.7, 8); ctx.fill();
    roundRect(x-base, y+blockHalf()*0.7, base*2, base*0.7, 8); ctx.stroke();
    // "stdin ▸" label
    ctx.fillStyle=PAL.inkDim;
    ctx.font="9px ui-monospace,monospace";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("stdin ▸", x, y+blockHalf()*0.7 + base*0.35);
    ctx.restore();
  }

  // Pure projectile simulation shared by preview + tests.
  function simulateShot(vx, vy){
    var ph = phys();
    var ih = islandHeight(), hs = blockHalf();
    var x = launcher.x, y = launcher.y, ppy = y;
    var pts = [];
    var hitIdx = -1, landX = x, landY = y;
    var h = 1/120, t = 0, maxT = 2.4;
    var wind = game ? game.wind : 0;
    while(t < maxT){
      ppy = y;
      vy += ph.g*h;
      vx += wind*ph.windAccel*h;
      x += vx*h; y += vy*h; t += h;
      if(vy>0 && game){
        for(var k=0;k<game.islands.length;k++){
          var isl=game.islands[k];
          var ix=islandX(isl,gTime), iy=islandY(isl);
          var top=iy-ih/2, left=ix-isl.w/2, right=ix+isl.w/2, pad=hs*0.4;
          if((ppy+hs)<=top+2 && (y+hs)>=top && x>left+pad && x<right-pad){
            hitIdx=k; landX=x; landY=top; t=maxT+1; break;
          }
        }
      }
      if(t>maxT) break;
      if(y>H+40 || x<-40 || x>W+40){ landX=x; landY=Math.min(y,H); break; }
      pts.push({x:x,y:y});
    }
    return { pts:pts, hitIdx:hitIdx, landX:landX, landY:landY,
             hitLang: (hitIdx>=0 && game) ? game.islands[hitIdx].lang : null };
  }

  function drawAimAndTrajectory(){
    if(!canAim()) return;
    var b=game.block;
    var a=computeAim();
    var res = simulateShot(a.vx, a.vy);
    var pts = res.pts;
    var hitType = res.hitIdx>=0 ? (res.hitLang===b.lang ? "good" : "bad") : "void";
    var hit = { x:res.landX, y:res.landY };
    var sx=launcher.x, sy=launcher.y;

    // Aim assist ramps down: full landing prediction for onboarding (L1-2),
    // then arc-only so the player must judge drift & wind themselves.
    var assist = game.level <= 2;
    var arcLen = assist ? pts.length : Math.floor(pts.length*0.62);

    // draw dotted arc
    var col = assist ? (hitType==="good"?PAL.good : hitType==="bad"?PAL.bad : PAL.inkDim) : PAL.accent;
    ctx.save();
    var step = Math.max(1, Math.floor(pts.length/26));
    for(var i=0;i<arcLen;i+=step){
      var t = i/pts.length;
      ctx.globalAlpha = (1-t)*0.7 + 0.1;
      ctx.fillStyle = col;
      var r = lerp(3.4, 1.4, t);
      ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha=1;

    // landing marker (only while assist is on)
    if(assist && hit){
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.arc(hit.x, hit.y, 10, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hit.x-6,hit.y); ctx.lineTo(hit.x+6,hit.y);
      ctx.moveTo(hit.x,hit.y-6); ctx.lineTo(hit.x,hit.y+6); ctx.stroke();
      ctx.globalAlpha=1;
    }

    // aim arrow from launcher
    var alen = 26 + a.power*40;
    ctx.strokeStyle = PAL.accent; ctx.lineWidth=2; ctx.globalAlpha=0.85;
    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.lineTo(sx+a.dir.x*alen, sy+a.dir.y*alen);
    ctx.stroke();
    // power ring
    ctx.globalAlpha=0.5;
    ctx.beginPath(); ctx.arc(sx,sy, 14+a.power*8, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function drawBridge(){
    if(!game) return;
    // draw progress bridge across the chasm (spans of perfects)
    var y = H*0.72;
    var x0 = W*0.10, x1 = W*0.90;
    var total = 3;
    ctx.save();
    for(var s=0;s<total;s++){
      var sx = lerp(x0,x1, s/total);
      var ex = lerp(x0,x1, (s+1)/total);
      var filled = s < game.spans;
      var celebrating = celebrateT>0;
      ctx.lineWidth = filled? 4 : 2;
      ctx.strokeStyle = filled ? PAL.gold : PAL.line;
      ctx.globalAlpha = filled ? (celebrating?1:0.85) : 0.5;
      if(filled && celebrating){ ctx.shadowColor=PAL.gold; ctx.shadowBlur=16; }
      var sag = 16;
      ctx.beginPath();
      ctx.moveTo(sx,y);
      ctx.quadraticCurveTo((sx+ex)/2, y+sag, ex, y);
      ctx.stroke();
      ctx.shadowBlur=0;
      // pylon
      ctx.globalAlpha = filled?0.8:0.4;
      ctx.beginPath(); ctx.moveTo(sx,y); ctx.lineTo(sx,y+22); ctx.stroke();
      if(s===total-1){ ctx.beginPath(); ctx.moveTo(ex,y); ctx.lineTo(ex,y+22); ctx.stroke(); }
    }
    ctx.globalAlpha=1;
    ctx.restore();

    // parade blocks (celebration)
    if(parade.length){
      for(var pi=0; pi<parade.length; pi++){
        var pr=parade[pi];
        if(pr.t<0) continue;
        var tt = pr.t % 1.6 / 1.6;
        var bx = lerp(x0, x1, tt);
        var hop = Math.abs(Math.sin(pr.t*7))* -18;
        var fake={ lang:pr.lang, rot:Math.sin(pr.t*6)*0.3, scale:1 };
        drawBlock(fake, bx, y-14+hop, blockHalf()*1.2, 1, false);
      }
    }
  }

  function drawParticles(){
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      var a = clamp(p.life/p.maxLife,0,1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      if(p.shape==="confetti"){
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        ctx.restore();
      }else if(p.shape==="shard"){
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.moveTo(0,-p.size); ctx.lineTo(p.size*0.7,p.size*0.6); ctx.lineTo(-p.size*0.6,p.size*0.5);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }else{
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,TAU); ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }

  function drawPopups(){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(var i=0;i<popups.length;i++){
      var q=popups[i];
      var a = clamp(q.life/q.maxLife,0,1);
      ctx.globalAlpha = a;
      ctx.fillStyle = q.color;
      ctx.font="800 "+q.size+"px ui-monospace,monospace";
      ctx.fillText(q.text, clamp(q.x, 46, W-46), Math.max(q.y, 66));
    }
    ctx.globalAlpha=1;
  }

  function drawBanner(){
    if(!banner) return;
    var t = banner.t/banner.life;
    var appear = easeOut(clamp(banner.t/0.3,0,1));
    var fade = t>0.8 ? (1-(t-0.8)/0.2) : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(W/2, H*0.32);
    var sc = lerp(0.7,1,appear);
    ctx.scale(sc,sc);
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle = banner.color||PAL.gold;
    ctx.shadowColor = banner.color||PAL.gold; ctx.shadowBlur=20;
    ctx.font="800 "+clamp(W*0.064,18,27)+"px ui-monospace,monospace";
    ctx.fillText(banner.text, 0, 0);
    ctx.shadowBlur=0;
    if(banner.sub){
      ctx.fillStyle = PAL.ink;
      ctx.font="700 "+clamp(W*0.038,12,16)+"px ui-monospace,monospace";
      ctx.fillText(banner.sub, 0, clamp(W*0.075,20,30)*0.9);
    }
    ctx.restore();
  }

  function drawLevelBanner(){
    if(!levelBanner) return;
    var t=levelBanner.t/levelBanner.life;
    var appear=easeOut(clamp(levelBanner.t/0.25,0,1));
    var fade = t>0.7?(1-(t-0.7)/0.3):1;
    ctx.save();
    ctx.globalAlpha=fade*0.9;
    ctx.translate(W/2, H*0.44);
    ctx.scale(lerp(0.8,1,appear),lerp(0.8,1,appear));
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle=PAL.accent;
    ctx.font="800 "+clamp(W*0.06,18,26)+"px ui-monospace,monospace";
    ctx.fillText(levelBanner.text,0,0);
    ctx.restore();
  }

  // Title-screen demo arc (teaches the mechanic)
  var demoT=0;
  function drawTitleDemo(){
    demoT += 0.016;
    var cycle = 2.6;
    var tt = (demoT % cycle)/cycle;
    var startX=W*0.30, startY=H*0.90;
    var endX=W*0.68, endY=H*0.80;
    // simple parabola (kept in the lower band, clear of the title card)
    var x = lerp(startX,endX,tt);
    var peak = -70;
    var y = lerp(startY,endY,tt) + peak*Math.sin(tt*Math.PI);
    // ghost island target
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle=PAL.line;
    ctx.setLineDash([4,5]);
    ctx.beginPath();
    for(var s=0;s<=1;s+=0.05){
      var xx=lerp(startX,endX,s);
      var yy=lerp(startY,endY,s)+peak*Math.sin(s*Math.PI);
      if(s===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    // demo block
    var demoBlock={lang:"go", rot:tt*6, scale:1};
    ctx.globalAlpha = tt<0.95?1:(1-(tt-0.95)/0.05);
    drawBlock(demoBlock, x, y, blockHalf()*1.1, ctx.globalAlpha, false);
    ctx.globalAlpha=1;
  }

  var gTimeVisual = 0;
  function render(){
    if(!ctx) return;
    ctx.setTransform(DPR,0,0,DPR,0,0);

    // camera (shake + zoom punch) — respect reduced-motion
    var zp = 1 + (REDUCE?0:zoomPunch*0.03);
    var sxk = REDUCE?0:(Math.random()*2-1)*shake;
    var syk = REDUCE?0:(Math.random()*2-1)*shake;
    ctx.save();
    ctx.translate(W/2, H/2);
    ctx.scale(zp,zp);
    ctx.translate(-W/2 + sxk, -H/2 + syk);

    drawBackground();

    if(state===STATE_TITLE){
      drawTitleDemo();
    }

    if(game){
      drawBridge();
      for(var i=0;i<game.islands.length;i++){ drawIsland(game.islands[i]); }
      drawLauncher();
      // trajectory + aim
      if(state===STATE_PLAY) drawAimAndTrajectory();
      // block
      var b=game.block;
      if(b && b.state!=="done"){
        // trail
        if(b.state==="flight"){
          for(var ti=0;ti<b.trail.length;ti++){
            var tp=b.trail[ti];
            ctx.globalAlpha = (ti/b.trail.length)*0.35;
            ctx.fillStyle = LANGS[b.lang].c1;
            var tr = blockHalf()*(0.3 + ti/b.trail.length*0.5);
            ctx.beginPath(); ctx.arc(tp.x,tp.y,tr,0,TAU); ctx.fill();
          }
          ctx.globalAlpha=1;
        }
        drawBlock(b, b.x, b.y, blockHalf()*2, 1, false);
      }
    }

    drawParticles();
    drawBridgeCelebrationRings();
    drawPopups();
    drawLevelBanner();
    drawBanner();

    ctx.restore();

    // full-screen flash (outside camera)
    if(flash>0){
      ctx.globalAlpha = clamp(flash,0,1)*(REDUCE?0.2:0.5);
      ctx.fillStyle = flashColor;
      ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=1;
    }

    // boost vignette
    if(game && game.boostT>0){
      var pulse = 0.15 + 0.1*Math.sin(gTimeVisual*8);
      ctx.strokeStyle = PAL.gold;
      ctx.globalAlpha = pulse;
      ctx.lineWidth = 6;
      ctx.strokeRect(3,3,W-6,H-6);
      ctx.globalAlpha=1;
    }
  }

  function drawBridgeCelebrationRings(){
    if(celebrateT<=0) return;
    var t = 1-(celebrateT/2.0);
    ctx.save();
    ctx.globalAlpha = (1-t)*0.4;
    ctx.strokeStyle = PAL.gold;
    ctx.lineWidth=3;
    for(var i=0;i<3;i++){
      var rr = (t*Math.max(W,H))*(0.4+i*0.3);
      ctx.beginPath(); ctx.arc(W/2, H*0.4, rr, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }

  // ---- Main loop ------------------------------------------------------------
  var lastT = 0, rafId=0;
  function frame(now){
    rafId = requestAnimationFrame(frame);
    try{
      if(!lastT) lastT=now;
      var dt = (now-lastT)/1000;
      lastT=now;
      if(dt>0.05) dt=0.05;  // clamp
      if(dt<0) dt=0;
      update(dt);
      render();
    }catch(e){
      // Never let a frame throw an uncaught error (would fail smoke).
    }
  }

  // ---- Flow: start / end ----------------------------------------------------
  function layout(){
    launcher.x = W*0.5;
    launcher.y = H*0.845;
    if(game && game.islands){
      // widths depend on size; recompute w for current level
      var iw = islandWidth(game.level);
      for(var i=0;i<game.islands.length;i++){
        game.islands[i].w = iw;
      }
    }
  }

  function startGame(){
    initAudio(); resumeAudio();
    game = defaultRound();
    state = STATE_PLAY;
    gTime=0;
    nextTimer=-1; overTimer=-1;
    particles.length=0; popups.length=0; parade.length=0;
    banner=null; levelBanner=null; celebrateT=0; shake=0; flash=0; zoomPunch=0;
    input.aiming=false; input.pid=null; input.angle=-Math.PI*0.5; input.power=0.6;
    layout();
    game.islands = makeIslands(1);
    buildLives(); updateLives();
    newBlock();
    // reveal
    titleEl.classList.add("hidden");
    overEl.classList.add("hidden");
    syncHud();
    SND.ui();
  }

  function endGame(){
    state = STATE_OVER;
    if(game.score>best) { best=game.score; showNewBest(true); } else showNewBest(false);
    SND.over(); buzz([40,30,60]);
    // fill game over card
    document.getElementById("finalScore").textContent = game.score.toLocaleString();
    document.getElementById("finalBest").textContent = best.toLocaleString();
    document.getElementById("finalLands").textContent = game.lands;
    document.getElementById("finalBridges").textContent = game.bridges;
    document.getElementById("goTitle").textContent = game.lives<=0 ? "SEGFAULT" : "TIMEOUT";
    document.getElementById("verdict").textContent = verdictFor(game);
    overEl.classList.remove("hidden");
    // re-trigger fade animation
    var card = overEl.querySelector(".card");
    if(card){ card.classList.remove("fadein"); void card.offsetWidth; card.classList.add("fadein"); }
  }
  function showNewBest(v){
    var el=document.getElementById("newbest");
    el.textContent = v? "◆ NEW BEST ◆":"";
  }
  function verdictFor(g){
    if(g.bridges>=3) return "polyglot architect — the runtimes bow to you.";
    if(g.bridges>=1) return "cross-compiled clean. bridges hold under load.";
    if(g.lands>=12) return "solid interpreter. ship it.";
    if(g.lands>=5) return "compiles, with warnings.";
    return "syntax error. try again — swipe outward to flick.";
  }

  // buttons
  document.getElementById("startBtn").addEventListener("click", function(e){ e.preventDefault(); startGame(); });
  document.getElementById("restartBtn").addEventListener("click", function(e){ e.preventDefault(); startGame(); });

  // ---- Boot -----------------------------------------------------------------
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function(){ setTimeout(resize,60); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden){ lastT=0; } });

  setMuted(false);
  resize();
  bestEl.textContent = "BEST 0";
  rafId = requestAnimationFrame(frame);

})();
</script>
</body>
</html>
