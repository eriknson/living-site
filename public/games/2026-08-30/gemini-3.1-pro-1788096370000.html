<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lighthouse</title>
<style>
:root {
  --ui-font: ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
body {
  margin: 0;
  overflow: hidden;
  background-color: #111;
  font-family: var(--ui-font);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  color: #fff;
}
canvas {
  display: block;
  width: 100dvw;
  height: 100dvh;
}
#ui-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100dvw;
  height: 100dvh;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}
.panel {
  background: rgba(10, 15, 20, 0.85);
  padding: 2rem;
  border-radius: 8px;
  text-align: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  pointer-events: auto;
  border: 1px solid rgba(255, 255, 255, 0.1);
  max-width: 80%;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
@media (prefers-color-scheme: light) {
  .panel {
    background: rgba(240, 245, 250, 0.85);
    color: #111;
    border: 1px solid rgba(0, 0, 0, 0.1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }
}
h1 {
  margin: 0 0 1rem 0;
  font-size: 2rem;
  letter-spacing: 2px;
  text-transform: uppercase;
}
p {
  font-size: 1rem;
  margin: 0 0 2rem 0;
  line-height: 1.5;
  color: inherit;
  opacity: 0.8;
}
button {
  background: #fff;
  color: #000;
  border: none;
  padding: 1rem 2rem;
  font-size: 1.2rem;
  font-family: inherit;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  text-transform: uppercase;
  transition: transform 0.1s, opacity 0.2s;
}
@media (prefers-color-scheme: light) {
  button {
    background: #111;
    color: #fff;
  }
}
button:active {
  transform: scale(0.95);
}
#hud {
  position: absolute;
  top: 1.5rem;
  left: 1.5rem;
  right: 1.5rem;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  font-weight: bold;
  font-size: 1.2rem;
  color: rgba(255, 255, 255, 0.9);
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  z-index: 5;
}
.hidden {
  display: none !important;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="streak">Streak: 0</div>
</div>
<div id="ui-layer">
  <div id="start-screen" class="panel">
    <h1>Echoes</h1>
    <p>Hold to sweep the beam.<br>Release when the lit buoy is in the beam.<br>Don't let the sign fade.</p>
    <button data-smoke="start" id="btn-start">Start</button>
  </div>
  <div id="game-over-screen" class="panel hidden">
    <h1>Faded</h1>
    <p>Score: <span id="final-score">0</span></p>
    <button data-smoke="restart" id="btn-restart">Restart</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

const startBtn = document.getElementById('btn-start');
const restartBtn = document.getElementById('btn-restart');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const hud = document.getElementById('hud');
const scoreEl = document.getElementById('score');
const streakEl = document.getElementById('streak');
const finalScoreEl = document.getElementById('final-score');

let state = 'menu';
let score = 0;
let streak = 0;
let timer = 1.0;
let lastTime = 0;
let W = window.innerWidth;
let H = window.innerHeight;
let palette = {};

const WORD = "ECHOES";
let litLetters = 0;

let isHolding = false;
let flashIntensity = 0;
let lastHitCorrect = true;

const BEAM_MIN = -Math.PI / 2 - 0.7;
const BEAM_MAX = -Math.PI / 2 + 0.7;
let beamAngle = -Math.PI / 2;
let beamDir = 1;
let beamSpeed = 1.5;
let beamWidth = 0.35;
let fogLevel = 0.0;

let buoys = [];
let waveTimeout = null;

function updatePalette() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (dark) {
    palette = {
      skyTop: '#0d1522', skyBot: '#5a3122',
      waterTop: '#17222b', waterBot: '#0d1318',
      signOff: '#040608', signOn: '#ffb380',
      beam: 'rgba(255, 230, 160, ',
      buoyCorrect: '#ff6b52', buoyFalse: '#334c5e'
    };
  } else {
    palette = {
      skyTop: '#8ca6b8', skyBot: '#d9a67e',
      waterTop: '#6b8a99', waterBot: '#3d5866',
      signOff: '#2c3e4a', signOn: '#ffecdb',
      beam: 'rgba(255, 255, 220, ',
      buoyCorrect: '#ff4d3d', buoyFalse: '#8daebf'
    };
  }
}
updatePalette();
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updatePalette);
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

function spawnBuoys(fog) {
  buoys = [];
  let count = Math.floor(3 + fog * 5);
  let correctIdx = Math.floor(Math.random() * count);
  for(let i=0; i<count; i++) {
    let a = BEAM_MIN + 0.1 + Math.random() * (BEAM_MAX - BEAM_MIN - 0.2);
    let dist = H * 0.2 + Math.random() * (H * 0.3);
    let driftSpeed = (Math.random() - 0.5) * (0.1 + fog * 0.2);
    buoys.push({
      id: i, angle: a, dist: dist,
      x: W/2 + Math.cos(a) * dist,
      y: H*0.95 + Math.sin(a) * dist,
      type: i === correctIdx ? 'correct' : 'false',
      phase: Math.random() * Math.PI * 2,
      driftSpeed: driftSpeed, hit: false
    });
  }
}

function resetGame() {
  score = 0; streak = 0; timer = 1.0; fogLevel = 0.0;
  litLetters = 0; beamSpeed = 1.5; beamWidth = 0.35;
  beamAngle = -Math.PI / 2; beamDir = 1; isHolding = false;
  flashIntensity = 0; lastHitCorrect = true;
  updateHud();
  if (waveTimeout) clearTimeout(waveTimeout);
  spawnBuoys(fogLevel);
}

function gameOver() {
  state = 'gameover';
  hud.classList.add('hidden');
  gameOverScreen.classList.remove('hidden');
  finalScoreEl.innerText = score;
  isHolding = false;
}

function updateHud() {
  scoreEl.innerText = score;
  streakEl.innerText = `Streak: ${streak}`;
}

function checkHit() {
  flashIntensity = 1.0;
  let hitCorrect = false;
  for(let b of buoys) {
    if (b.hit) continue;
    let adiff = Math.abs(b.angle - beamAngle);
    if (adiff < beamWidth / 2) {
      if (b.type === 'correct') {
        hitCorrect = true;
        b.hit = true;
      }
    }
  }
  
  lastHitCorrect = hitCorrect;
  
  if (hitCorrect) {
    score += 10 + litLetters * 5;
    streak += 1;
    timer = Math.min(1.0, timer + 0.3);
    if (streak > 0 && streak % 3 === 0) {
      if (litLetters < WORD.length) { litLetters++; }
      else { score += 50; }
    }
    if (typeof navigator !== 'undefined' && navigator.vibrate) {
      try { navigator.vibrate(50); } catch(e){}
    }
    
    fogLevel = Math.min(1.0, fogLevel + 0.05);
    beamSpeed = 1.5 + fogLevel * 1.5;
    beamWidth = Math.max(0.1, 0.35 - fogLevel * 0.2);
    
    if (waveTimeout) clearTimeout(waveTimeout);
    waveTimeout = setTimeout(() => {
      if(state === 'playing') spawnBuoys(fogLevel);
    }, 150);
  } else {
    streak = 0;
    timer -= 0.15;
    if (typeof navigator !== 'undefined' && navigator.vibrate) {
      try { navigator.vibrate([20, 50, 20]); } catch(e){}
    }
  }
  updateHud();
}

function onPointerDown(e) {
  if (state !== 'playing') return;
  isHolding = true;
}

function onPointerUp(e) {
  if (state !== 'playing' || !isHolding) return;
  isHolding = false;
  checkHit();
}

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  if (state === 'playing') e.preventDefault();
  onPointerDown(e);
}, {passive: false});

window.addEventListener('pointerup', (e) => {
  if (e.target.closest('button')) return;
  if (state === 'playing') e.preventDefault();
  onPointerUp(e);
}, {passive: false});

startBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  startScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  resetGame();
  state = 'playing';
});

restartBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  gameOverScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  resetGame();
  state = 'playing';
});

function draw() {
  // Background Sky
  let gSky = ctx.createLinearGradient(0, 0, 0, H * 0.4);
  gSky.addColorStop(0, palette.skyTop);
  gSky.addColorStop(1, palette.skyBot);
  ctx.fillStyle = gSky;
  ctx.fillRect(0, 0, W, H * 0.4);
  
  // Watercolor sky blobs
  ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.beginPath(); ctx.arc(W*0.2, H*0.1, W*0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W*0.8, H*0.2, W*0.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.beginPath(); ctx.arc(W*0.5, H*0.3, W*0.3, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  
  // Water
  let gWater = ctx.createLinearGradient(0, H * 0.4, 0, H);
  gWater.addColorStop(0, palette.waterTop);
  gWater.addColorStop(1, palette.waterBot);
  ctx.fillStyle = gWater;
  ctx.fillRect(0, H * 0.4, W, H * 0.6);
  
  // Water ripples
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 2;
  let timeMs = performance.now();
  for(let i=0; i<10; i++) {
    let y = H * 0.45 + (i * H * 0.05);
    let wave = Math.sin(timeMs * 0.001 + i) * (5 + i);
    ctx.beginPath();
    ctx.moveTo(0, y + wave);
    ctx.lineTo(W, y + wave);
    ctx.stroke();
  }

  // Horizon Sign
  ctx.save();
  ctx.translate(W/2, H * 0.38);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.font = `bold ${Math.min(W * 0.15, 80)}px ui-monospace, monospace`;
  let signAlpha = Math.max(0.05, timer);
  let letterSpacing = Math.min(W * 0.12, 60);
  let startX = - (WORD.length - 1) * letterSpacing / 2;
  for(let i=0; i<WORD.length; i++) {
    let isLit = i < litLetters;
    ctx.fillStyle = isLit ? palette.signOn : palette.signOff;
    ctx.globalAlpha = isLit ? 1.0 : signAlpha;
    if (isLit) {
      ctx.shadowColor = palette.signOn;
      ctx.shadowBlur = 20;
    } else {
      ctx.shadowBlur = 0;
    }
    ctx.fillText(WORD[i], startX + i * letterSpacing, 0);
  }
  ctx.restore();

  // Buoys
  for(let b of buoys) {
    if (b.hit) continue;
    let bob = Math.sin(b.phase) * 4;
    let bx = b.x;
    let by = b.y + bob;
    let distRatio = (by - H*0.4) / (H*0.55);
    let size = 3 + distRatio * 8;
    
    ctx.fillStyle = b.type === 'correct' ? palette.buoyCorrect : palette.buoyFalse;
    ctx.beginPath();
    ctx.moveTo(bx, by - size);
    ctx.lineTo(bx - size, by + size);
    ctx.lineTo(bx + size, by + size);
    ctx.fill();
    
    if (b.type === 'correct') {
      let pulse = (Math.sin(timeMs * 0.005) + 1) / 2;
      ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + pulse * 0.6})`;
      ctx.beginPath();
      ctx.arc(bx, by - size, size/2, 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(bx, by + size + 2, size, size/3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Fog overlay
  if (fogLevel > 0) {
    ctx.fillStyle = palette.skyBot;
    ctx.globalAlpha = fogLevel * 0.5;
    ctx.fillRect(0, H * 0.4, W, H * 0.6);
    ctx.globalAlpha = 1.0;
  }
  
  // Lighthouse Beam
  let lx = W/2;
  let ly = H * 0.95;
  if (isHolding || flashIntensity > 0) {
    let a1 = beamAngle - beamWidth/2;
    let a2 = beamAngle + beamWidth/2;
    let rayLen = H;
    let p1x = lx + Math.cos(a1) * rayLen;
    let p1y = ly + Math.sin(a1) * rayLen;
    let p2x = lx + Math.cos(a2) * rayLen;
    let p2y = ly + Math.sin(a2) * rayLen;
    let g = ctx.createLinearGradient(lx, ly, lx + Math.cos(beamAngle)*rayLen, ly + Math.sin(beamAngle)*rayLen);
    let alpha = isHolding ? 0.6 : (flashIntensity * 0.8);
    g.addColorStop(0, palette.beam + alpha + ')');
    g.addColorStop(1, palette.beam + '0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(p1x, p1y);
    ctx.lineTo(p2x, p2y);
    ctx.fill();
  }
  
  // Lighthouse Base
  ctx.fillStyle = '#05080a';
  ctx.beginPath();
  ctx.moveTo(lx - 25, H);
  ctx.lineTo(lx - 12, ly - 20);
  ctx.lineTo(lx + 12, ly - 20);
  ctx.lineTo(lx + 25, H);
  ctx.fill();
  ctx.fillStyle = (isHolding || flashIntensity > 0) ? palette.beam + '1)' : '#1a2a36';
  ctx.beginPath();
  ctx.arc(lx, ly - 20, 8, Math.PI, 0);
  ctx.fill();
  
  // Flash Overlay
  if (flashIntensity > 0) {
    if (lastHitCorrect) {
      ctx.fillStyle = `rgba(255, 255, 255, ${flashIntensity * 0.4})`;
    } else {
      ctx.fillStyle = `rgba(255, 0, 0, ${flashIntensity * 0.2})`;
    }
    ctx.fillRect(0, 0, W, H);
  }
}

function update(dt) {
  if (state === 'playing') {
    timer -= (0.04 + fogLevel * 0.06) * dt; 
    if (timer <= 0) {
      gameOver();
      return;
    }
  } else {
    timer = 1.0;
  }
  
  if (isHolding || state !== 'playing') {
    let speed = state === 'playing' ? beamSpeed : 0.5;
    beamAngle += beamDir * speed * dt;
    if (beamAngle > BEAM_MAX) {
      beamAngle = BEAM_MAX;
      beamDir = -1;
    } else if (beamAngle < BEAM_MIN) {
      beamAngle = BEAM_MIN;
      beamDir = 1;
    }
  }
  
  buoys.forEach(b => {
    b.phase += dt * 3;
    b.angle += b.driftSpeed * dt;
    if (b.angle < BEAM_MIN) { b.angle = BEAM_MIN; b.driftSpeed *= -1; }
    if (b.angle > BEAM_MAX) { b.angle = BEAM_MAX; b.driftSpeed *= -1; }
    b.x = W/2 + Math.cos(b.angle) * b.dist;
    b.y = H*0.95 + Math.sin(b.angle) * b.dist;
  });
  
  if (flashIntensity > 0) {
    flashIntensity -= dt * 3;
    if (flashIntensity < 0) flashIntensity = 0;
  }
}

function loop(time) {
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = time;
  let dt = (time - lastTime) / 1000;
  lastTime = time;
  if (dt > 0.1) dt = 0.1;
  
  update(dt);
  draw();
}

spawnBuoys(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
