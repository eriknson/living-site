<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Low Flyover</title>
<style>
  :root {
    --bg: #bdc3c7;
    --accent: #e65a41; 
    --text: #2c3e50;
    --silhouette: #2c3e50; 
    --plane: #fdfbf7; 
    --window: #1a252f;
    --ui-bg: rgba(189, 195, 199, 0.85);
    --sky-top: #a6b5c0;
    --sky-bot: #d6dbdf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e272e;
      --accent: #ff7961;
      --text: #d2dae2;
      --silhouette: #0f1418;
      --plane: #ecf0f1;
      --window: #000000;
      --ui-bg: rgba(30, 39, 46, 0.85);
      --sky-top: #151b20;
      --sky-bot: #2c3e50;
    }
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 20px);
    left: 0;
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: bold;
    pointer-events: none;
    z-index: 10;
  }

  .hud-hidden {
    display: none !important;
  }

  .hud-box {
    background: var(--silhouette);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
  }

  .multiplier {
    color: #fff;
    transition: transform 0.1s;
  }

  @keyframes popAnim {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  .multiplier.pop {
    animation: popAnim 0.3s ease-out;
    background: var(--accent);
    border-color: #fff;
  }

  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
  }

  .screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--ui-bg);
    transition: opacity 0.3s;
    pointer-events: none; 
  }

  .screen.hidden {
    opacity: 0;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-align: center;
  }

  p {
    font-size: 1.1rem;
    margin-bottom: 2rem;
    text-align: center;
    max-width: 80%;
    line-height: 1.5;
  }

  button {
    pointer-events: auto;
    appearance: none;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 15px 40px;
    font-size: 1.5rem;
    font-family: inherit;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  button:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 rgba(0,0,0,0.2);
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>
  
  <div id="hud" class="hud-hidden">
    <div class="hud-box">SCORE:&nbsp;<span id="score-val">0</span></div>
    <div class="hud-box multiplier" id="mult-container">MULTI:&nbsp;x<span id="mult-val">1</span></div>
  </div>

  <div id="ui-layer">
    <div id="start-screen" class="screen">
      <h1>Low Flyover</h1>
      <p>Hold to dive. Release to climb.<br><br>Thread the center of the stadium lights to build your combo.</p>
      <button data-smoke="start">Takeoff</button>
    </div>
    
    <div id="game-over-screen" class="screen hidden">
      <h1>Grounded</h1>
      <p>Score: <span id="final-score">0</span><br>Best: <span id="best-score">0</span></p>
      <button data-smoke="restart">Fly Again</button>
    </div>
  </div>
</div>

<script>
window.addEventListener('error', function(e) {
  console.error("Caught error:", e.message);
});

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const btnStart = document.querySelector('[data-smoke="start"]');
const btnRestart = document.querySelector('[data-smoke="restart"]');

let w, h, s, pr;
let state = 'START';
let lastTime = performance.now();
let timeScale = 1;
let frames = 0;
let shakeTime = 0;

let score = 0, bestScore = 0, multiplier = 1;
let lastScore = -1, lastMult = -1;
let speed = 5;
let distTraveled = 0, nextTowerDist = 0;

let plane = {x: 0, y: 0, vy: 0};
let isHolding = false;
let towers = [];
let particles = [];
let clouds = [];

let windTimer = 0, maxWind = 0;

// Audio
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!AudioContextClass) return;
  if (!audioCtx) {
    try { audioCtx = new AudioContextClass(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    try { audioCtx.resume(); } catch(e){}
  }
}

function playTone(freq, type, duration, vol) {
  if (!audioCtx) return;
  try {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

function playCheer() {
  if (!audioCtx) return;
  try {
    let bufferSize = audioCtx.sampleRate * 1.5;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    let noiseSource = audioCtx.createBufferSource();
    noiseSource.buffer = buffer;
    let filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(300, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1.5);
    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
    noiseSource.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noiseSource.start();
  } catch(e){}
}

function playCrash() {
  if (!audioCtx) return;
  try {
    playTone(100, 'sawtooth', 0.5, 0.5);
    let noise = audioCtx.createBufferSource();
    let buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for(let i=0; i<data.length; i++) data[i] = Math.random()*2-1;
    noise.buffer = buffer;
    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    noise.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  } catch(e){}
}

function playPerfect() {
  playTone(523.25, 'sine', 0.1, 0.2); 
  setTimeout(() => playTone(659.25, 'sine', 0.2, 0.2), 100); 
  playCheer();
}

function playGood() {
  playTone(440, 'sine', 0.1, 0.15);
}

// Game Core
function resize() {
  let dpr = window.devicePixelRatio || 1;
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  
  s = h / 800;
  pr = h * 0.02;
  plane.x = w * 0.3;
}
window.addEventListener('resize', resize);
resize();

for(let i=0; i<8; i++) {
  clouds.push({
    x: Math.random() * w,
    y: Math.random() * h * 0.6,
    size: 0.5 + Math.random(),
    speed: 0.2 + Math.random() * 0.5
  });
}

function getCSSVar(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

function updateHUD(force = false) {
  if (force || score !== lastScore) {
    document.getElementById('score-val').innerText = score;
    lastScore = score;
  }
  if (force || multiplier !== lastMult) {
    document.getElementById('mult-val').innerText = multiplier;
    lastMult = multiplier;
    if (multiplier === 1) {
       document.getElementById('mult-container').classList.remove('pop');
    }
  }
}

function startGame() {
  initAudio();
  resize(); 
  
  plane.y = h * 0.5;
  plane.vy = 0;
  score = 0;
  multiplier = 1;
  frames = 0;
  shakeTime = 0;
  speed = Math.max(4, w * 0.005);
  
  towers = [];
  particles = [];
  distTraveled = 0;
  nextTowerDist = w * 0.8;
  windTimer = 0;
  
  isHolding = false;
  state = 'PLAYING';
  
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hud-hidden');
  updateHUD(true);
}

btnStart.addEventListener('click', startGame);
btnRestart.addEventListener('click', startGame);

function down(e) {
  if (e.type === 'touchstart') e.preventDefault();
  if (state === 'PLAYING') isHolding = true;
}
function up(e) {
  if (e.type === 'touchend') e.preventDefault();
  if (state === 'PLAYING') isHolding = false;
}
canvas.addEventListener('mousedown', down);
canvas.addEventListener('touchstart', down, {passive: false});
window.addEventListener('mouseup', up);
window.addEventListener('touchend', up, {passive: false});

function keyDown(e) {
  if (e.code === 'Space' || e.code === 'ArrowDown') {
    if (state === 'PLAYING') {
      e.preventDefault();
      isHolding = true;
    }
  }
}
function keyUp(e) {
  if (e.code === 'Space' || e.code === 'ArrowDown') {
    if (state === 'PLAYING') {
      e.preventDefault();
      isHolding = false;
    }
  }
}
window.addEventListener('keydown', keyDown);
window.addEventListener('keyup', keyUp);

function gameOver() {
  if (state === 'GAMEOVER') return;
  state = 'GAMEOVER';
  playCrash();
  shakeTime = 20;
  
  try { if (navigator.vibrate) navigator.vibrate([50, 50, 100]); } catch(e){}
  
  if (score > bestScore) bestScore = score;
  
  setTimeout(() => {
    document.getElementById('final-score').innerText = score;
    document.getElementById('best-score').innerText = bestScore;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hud-hidden');
  }, 1000);
}

function spawnTower() {
  let minGap = h * 0.2;
  let maxGap = h * 0.4;
  let gapProgress = Math.min(1, score / 1000);
  let currentGap = maxGap - (maxGap - minGap) * gapProgress;
  
  let towerW = Math.max(w * 0.1, 40);
  let margin = h * 0.1;
  let gapTop = margin + Math.random() * (h - currentGap - margin * 2);
  let gapBottom = gapTop + currentGap;
  
  towers.push({
    x: w,
    w: towerW,
    gapTop: gapTop,
    gapBottom: gapBottom,
    passed: false
  });
}

function showFeedback(x, y, text, isPerfect) {
  let col = isPerfect ? getCSSVar('--accent') : '#ffffff';
  particles.push({
    x: x,
    y: y - 20,
    vx: 0,
    vy: -1,
    life: 60,
    type: 'text',
    text: text,
    color: col
  });
  
  if (isPerfect) {
    const mc = document.getElementById('mult-container');
    mc.classList.remove('pop');
    void mc.offsetWidth; 
    mc.classList.add('pop');
  }
}

function updateClouds() {
  let currentSpeed = state === 'PLAYING' ? speed : 2;
  clouds.forEach(c => {
    c.x -= c.speed * currentSpeed * 0.2 * timeScale;
    if(c.x < -100) {
      c.x = w + 100;
      c.y = Math.random() * h * 0.6;
    }
  });
}

function update() {
  let climbAcc = -0.4 * s;
  let diveAcc = 0.6 * s;
  let drag = 0.95;
  
  let windForce = 0;
  if (windTimer > 0) {
    windTimer -= timeScale;
    windForce = maxWind * Math.sin((frames % 100) * 0.1);
    
    if (Math.random() < 0.1) {
      particles.push({
        x: w + 50,
        y: Math.random() * h,
        vx: -speed * 1.5,
        vy: windForce * 5,
        life: 100,
        type: 'wind'
      });
    }
  } else if (score > 150 && Math.random() < 0.002) {
    windTimer = 120 + Math.random() * 60;
    maxWind = (Math.random() > 0.5 ? 1 : -1) * (0.8 * s);
  }
  
  if (isHolding) {
    plane.vy += diveAcc * timeScale;
  } else {
    plane.vy += climbAcc * timeScale;
  }
  plane.vy += windForce * timeScale;
  
  plane.vy *= Math.pow(drag, timeScale);
  plane.y += plane.vy * timeScale;
  
  if (frames % 3 === 0) {
    particles.push({
      x: plane.x - pr * 1.8,
      y: plane.y,
      vx: -speed * 0.5,
      vy: (Math.random() - 0.5) * 2,
      life: 30,
      type: 'exhaust'
    });
  }

  let currentSpeed = speed * timeScale;
  towers.forEach(t => {
    t.x -= currentSpeed;
    
    if (!t.passed && plane.x > t.x + t.w / 2) {
      t.passed = true;
      let gapCenter = (t.gapTop + t.gapBottom) / 2;
      let gapSize = t.gapBottom - t.gapTop;
      let distFromCenter = Math.abs(plane.y - gapCenter);
      
      let isPerfect = distFromCenter < gapSize * 0.15;
      
      if (isPerfect) {
        multiplier++;
        score += 10 * multiplier;
        playPerfect();
      } else {
        multiplier = 1;
        score += 10;
        playGood();
      }
      
      showFeedback(t.x + t.w/2, gapCenter, isPerfect ? "PERFECT" : "GOOD", isPerfect);
      updateHUD();
    }
  });
  
  distTraveled += currentSpeed;
  if (distTraveled > nextTowerDist) {
    spawnTower();
    distTraveled = 0;
    nextTowerDist = Math.max(w * 0.45, nextTowerDist * 0.98);
    speed = Math.min(speed * 1.01, w * 0.015);
  }
  
  towers = towers.filter(t => t.x + t.w > -100);
  particles = particles.filter(p => p.life > 0);
  
  updateClouds();
  
  if (plane.y - pr < 0 || plane.y + pr > h) gameOver();
  
  for (let t of towers) {
    let cx = Math.max(t.x, Math.min(plane.x, t.x + t.w));
    
    let cyTop = Math.max(0, Math.min(plane.y, t.gapTop));
    let dxTop = plane.x - cx;
    let dyTop = plane.y - cyTop;
    if (dxTop * dxTop + dyTop * dyTop < pr * pr) gameOver();
    
    let cyBot = Math.max(t.gapBottom, Math.min(plane.y, h));
    let dxBot = plane.x - cx;
    let dyBot = plane.y - cyBot;
    if (dxBot * dxBot + dyBot * dyBot < pr * pr) gameOver();
  }
  
  particles.forEach(p => {
    p.x += p.vx * timeScale;
    p.y += p.vy * timeScale;
    p.life -= timeScale;
    if (p.type === 'wind') p.vy *= 0.9;
  });
}

function drawBackground() {
  let skyTop = getCSSVar('--sky-top');
  let skyBot = getCSSVar('--sky-bot');
  let grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, skyTop);
  grad.addColorStop(1, skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 40 * c.size, 0, Math.PI*2);
    ctx.arc(c.x + 30*c.size, c.y - 15*c.size, 30*c.size, 0, Math.PI*2);
    ctx.arc(c.x + 60*c.size, c.y + 10*c.size, 35*c.size, 0, Math.PI*2);
    ctx.fill();
  });
  
  let colSil = getCSSVar('--silhouette');
  ctx.fillStyle = colSil;
  
  let offset = (frames * speed * 0.2);
  ctx.beginPath();
  ctx.moveTo(0, h);
  for(let i=-50; i<=w+50; i+=25) {
    let worldX = i + offset;
    let ht = 30 + Math.sin(worldX * 0.05) * 15 + Math.cos(worldX * 0.11) * 8;
    ctx.lineTo(i, h - ht);
  }
  ctx.lineTo(w, h);
  ctx.fill();
}

function draw() {
  ctx.save();
  if (shakeTime > 0) {
    let dx = (Math.random() - 0.5) * 8 * (shakeTime/20);
    let dy = (Math.random() - 0.5) * 8 * (shakeTime/20);
    ctx.translate(dx, dy);
    shakeTime -= timeScale;
  }

  drawBackground();
  
  let colSil = getCSSVar('--silhouette');
  let colAcc = getCSSVar('--accent');
  let colPlane = getCSSVar('--plane');
  let colWin = getCSSVar('--window');
  
  towers.forEach(t => {
    ctx.fillStyle = colSil;
    ctx.fillRect(t.x, 0, t.w, t.gapTop);
    
    ctx.strokeStyle = colSil;
    ctx.lineWidth = 3;
    ctx.beginPath();
    let trussH = h - t.gapBottom;
    let steps = Math.ceil(trussH / (t.w * 1.2));
    let stepH = trussH / steps;
    for(let i=0; i<steps; i++) {
      let y0 = t.gapBottom + i*stepH;
      let y1 = t.gapBottom + (i+1)*stepH;
      ctx.moveTo(t.x, y0);
      ctx.lineTo(t.x + t.w, y1);
      ctx.moveTo(t.x + t.w, y0);
      ctx.lineTo(t.x, y1);
    }
    ctx.stroke();
    
    ctx.fillRect(t.x, t.gapBottom, 4, trussH);
    ctx.fillRect(t.x + t.w - 4, t.gapBottom, 4, trussH);
    
    let rackW = t.w * 1.4;
    let rackX = t.x - (rackW - t.w) / 2;
    let rackH = pr * 1.5;
    ctx.fillStyle = colSil;
    ctx.fillRect(rackX, t.gapBottom, rackW, rackH);
    
    ctx.fillStyle = colPlane; 
    for(let i=0; i<4; i++) {
      ctx.beginPath();
      ctx.arc(rackX + rackW * (i+0.5)/4, t.gapBottom + rackH/2, pr*0.4, 0, Math.PI*2);
      ctx.fill();
    }
    
    let cy = (t.gapTop + t.gapBottom) / 2;
    ctx.strokeStyle = colAcc;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(t.x, cy);
    ctx.lineTo(t.x + t.w, cy);
    ctx.stroke();
    ctx.globalAlpha = 1.0;
    ctx.setLineDash([]);
  });
  
  particles.forEach(p => {
    if (p.type === 'exhaust') {
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, p.life/30)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (30 - p.life) * 0.15, 0, Math.PI*2);
      ctx.fill();
    } else if (p.type === 'wind') {
      ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, p.life/100 * 0.4)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - 30, p.y - p.vy * 3);
      ctx.stroke();
    } else if (p.type === 'text') {
      ctx.fillStyle = p.color || colAcc;
      ctx.globalAlpha = Math.max(0, p.life/60);
      ctx.font = `bold ${Math.floor(Math.max(16, h*0.035))}px ui-monospace, monospace`;
      ctx.textAlign = "center";
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1.0;
    }
  });
  
  ctx.save();
  ctx.translate(plane.x, plane.y);
  let pitch = Math.max(-0.5, Math.min(0.5, plane.vy * 0.05));
  ctx.rotate(pitch);
  
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 4;
  
  let L = pr * 1.8;
  let H = pr * 0.8;
  
  ctx.fillStyle = colPlane;
  ctx.beginPath();
  ctx.moveTo(L, 0);
  ctx.bezierCurveTo(L, -H, -L*0.5, -H, -L, -H*0.5);
  ctx.lineTo(-L*1.2, 0);
  ctx.bezierCurveTo(-L*0.5, H, L, H, L, 0);
  ctx.fill();
  
  ctx.shadowColor = 'transparent'; 
  
  ctx.beginPath();
  ctx.moveTo(-L*0.8, -H*0.4);
  ctx.lineTo(-L*1.2, -H*2.5);
  ctx.lineTo(-L*0.5, -H*2.5);
  ctx.lineTo(-L*0.2, -H*0.4);
  ctx.fill();
  
  ctx.fillStyle = colAcc;
  ctx.beginPath();
  ctx.moveTo(-L, 0);
  ctx.lineTo(L*0.8, 0);
  ctx.lineTo(L*0.7, H*0.3);
  ctx.lineTo(-L*0.9, H*0.3);
  ctx.fill();
  
  ctx.fillStyle = colWin;
  for(let i=0; i<4; i++) {
    ctx.beginPath();
    ctx.arc(L*0.3 - i*pr*0.5, -H*0.2, pr*0.15, 0, Math.PI*2);
    ctx.fill();
  }
  
  ctx.restore();
  ctx.restore();
}

function loop(time) {
  requestAnimationFrame(loop);
  let dt = time - lastTime;
  lastTime = time;
  if (dt > 50) dt = 16.66;
  timeScale = dt / 16.666;
  
  if (state === 'START') {
    updateClouds();
    drawBackground();
  } else if (state === 'PLAYING') {
    frames++;
    update();
    draw();
  } else if (state === 'GAMEOVER') {
    if (plane.y < h - pr) {
      plane.vy += 0.8 * timeScale;
      plane.y += plane.vy * timeScale;
      plane.x += speed * timeScale * 0.5; 
    }
    draw();
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
