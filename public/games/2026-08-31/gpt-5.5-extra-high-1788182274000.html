<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Provenance Panic</title>
  <style>
    :root{
      color-scheme: light;
      --bg:#e9f0e6;
      --panel:rgba(249,252,246,.86);
      --ink:#172018;
      --muted:#59665a;
      --grid:rgba(32,80,47,.13);
      --good:#008f52;
      --hot:#d56a00;
      --cyan:#007d8a;
      --bad:#cf2f21;
      --shadow:0 24px 80px rgba(28,46,31,.22);
    }
    @media (prefers-color-scheme: dark){
      :root{
        color-scheme: dark;
        --bg:#020604;
        --panel:rgba(4,14,9,.84);
        --ink:#d7ffe5;
        --muted:#76a886;
        --grid:rgba(62,255,139,.13);
        --good:#34f28a;
        --hot:#ffb343;
        --cyan:#53d7de;
        --bad:#ff5b48;
        --shadow:0 24px 90px rgba(0,0,0,.62);
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
    body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #game{
      position:fixed;inset:0;width:100dvw;height:100dvh;overflow:hidden;
      background:
        radial-gradient(circle at 50% -10%, rgba(0,143,82,.24), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,.18), transparent 28%),
        var(--bg);
      user-select:none;-webkit-user-select:none;touch-action:none;
    }
    canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    .hud{
      position:absolute;left:env(safe-area-inset-left);right:env(safe-area-inset-right);
      top:env(safe-area-inset-top);display:grid;grid-template-columns:1fr auto 1fr;gap:10px;
      padding:14px 16px 0;z-index:4;pointer-events:none;
      font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
      font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    }
    .hud strong{display:block;color:var(--ink);font-size:20px;letter-spacing:.02em;line-height:1.05}
    .hud .center{text-align:center}
    .hud .right{text-align:right}
    .bar{height:5px;margin-top:6px;border-radius:99px;background:rgba(128,128,128,.18);overflow:hidden}
    .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--good),var(--hot),var(--bad));border-radius:99px}
    .screen{
      position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:26px;
      background:linear-gradient(180deg, rgba(2,6,4,.18), rgba(2,6,4,.03));
      opacity:0;transform:translateY(8px);transition:opacity .28s ease,transform .28s ease;
      pointer-events:none;
    }
    .screen.active{opacity:1;transform:none}
    .card{
      width:min(520px,92dvw);border:1px solid rgba(127,157,132,.34);border-radius:28px;
      background:var(--panel);box-shadow:var(--shadow);padding:28px 24px;text-align:center;
      backdrop-filter:blur(14px);
    }
    h1{margin:0 0 10px;font-size:clamp(36px,12dvw,68px);line-height:.88;letter-spacing:-.08em}
    h2{margin:0 0 8px;font-size:clamp(28px,9dvw,48px);line-height:.95;letter-spacing:-.06em}
    p{margin:10px auto 0;max-width:34em;color:var(--muted);font-size:15px;line-height:1.55}
    .rule{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 22px;
      font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12px;
      letter-spacing:.04em;text-transform:uppercase;
    }
    .rule span{border:1px solid rgba(127,157,132,.3);border-radius:16px;padding:12px;color:var(--ink);background:rgba(127,157,132,.08)}
    button{
      min-width:180px;min-height:48px;border:0;border-radius:999px;padding:14px 22px;
      background:var(--ink);color:var(--bg);font:700 14px ui-monospace,"SFMono-Regular",Menlo,monospace;
      letter-spacing:.08em;text-transform:uppercase;box-shadow:0 14px 34px rgba(0,0,0,.24);
      cursor:pointer;pointer-events:auto;touch-action:manipulation;
    }
    button:active{transform:translateY(1px) scale(.99)}
    .hidden{display:none}
    .flash{position:absolute;inset:0;z-index:6;background:rgba(255,91,72,.16);opacity:0;pointer-events:none}
    .flash.hit{animation:hit .18s ease}
    @keyframes hit{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
  </style>
</head>
<body>
  <main id="game" aria-label="Provenance Panic game">
    <canvas id="arena"></canvas>
    <div class="hud" aria-hidden="true">
      <div>Score<strong id="score">0</strong></div>
      <div class="center">Deadline<strong id="time">45</strong></div>
      <div class="right">Corrupt<strong id="corrupt">0%</strong><div class="bar"><div id="corruptFill" class="fill"></div></div></div>
    </div>
    <div id="title" class="screen active">
      <section class="card">
        <h1>Provenance Panic</h1>
        <p>The compiler wants ownership notes before sunrise. Swipe each floating fragment into the right bin before the overcast build window closes.</p>
        <div class="rule"><span>Left: yours</span><span>Right: machine's</span></div>
        <button id="startBtn" data-smoke="start" type="button">Start Build</button>
      </section>
    </div>
    <div id="over" class="screen hidden">
      <section class="card">
        <h2 id="overTitle">Build Corrupted</h2>
        <p id="overText">The audit log dissolved into green static.</p>
        <div class="rule"><span id="finalScore">Score 0</span><span id="finalStreak">Best x0</span></div>
        <button id="restartBtn" data-smoke="restart" type="button">Restart Build</button>
      </section>
    </div>
    <div id="flash" class="flash"></div>
  </main>
  <script>
  (()=>{"use strict";
    const $=id=>document.getElementById(id);
    const canvas=$("arena"), game=$("game"), ctx=canvas&&canvas.getContext?canvas.getContext("2d"):null;
    const ui={score:$("score"),time:$("time"),corrupt:$("corrupt"),fill:$("corruptFill"),title:$("title"),over:$("over"),overTitle:$("overTitle"),overText:$("overText"),finalScore:$("finalScore"),finalStreak:$("finalStreak"),flash:$("flash"),start:$("startBtn"),restart:$("restartBtn")};
    if(!canvas||!ctx||!game||!ui.start||!ui.restart) return;
    let W=1,H=1,DPR=1,last=0,raf=0,audio=null;
    const reduced=()=>window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const isDark=()=>window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const rnd=(a,b)=>a+Math.random()*(b-a);
    const pick=a=>a[(Math.random()*a.length)|0];
    const human=[
      "if (sunrise) ship(notes);","// TODO: forgive hack","coffee = await refill();",
      "renameThingBecauseItHurts()","catch (e) { breathe(); }","let fog = bay.mood ?? 'gray';",
      "commit('small honest fix')","owner = 'me, at 02:13'","for (const doubt of review)"
    ];
    const machine=[
      "optimize({confidence:1})","/* generated helper */","vector = normalize(tokens);",
      "return synth(prompt, policy);","model.infer({temp:0})","autoPatch.apply(diff)",
      "while(queue.length) reconcile();","hash = trustGraph.verify(txn)","emitCanonicalBoilerplate()"
    ];
    const ghosts=["stadium flyover","freezer fault","billions balanced","fog horizon","last august light","phone agent"];
    const state={mode:"title",score:0,combo:0,best:0,blurCombo:0,corrupt:0,clock:45,shake:0,slow:0,card:null,next:null,particles:[],logs:[],stars:[],drag:null,wrongSide:null};
    function resize(){
      DPR=clamp(window.devicePixelRatio||1,1,2);
      W=Math.max(1,Math.floor(window.innerWidth));H=Math.max(1,Math.floor(window.innerHeight));
      canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);
      state.stars=Array.from({length:Math.min(90,Math.floor(W*H/8500))},()=>({x:Math.random()*W,y:Math.random()*H,a:rnd(.06,.28),s:rnd(.3,1.4)}));
    }
    function cue(type){
      try{
        const AC=window.AudioContext||window.webkitAudioContext;if(!AC) return;
        audio=audio||new AC(); if(audio.state==="suspended") audio.resume().catch(()=>{});
        const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;
        o.type=type==="bad"?"sawtooth":"triangle";o.frequency.setValueAtTime(type==="bad"?90:type==="bonus"?660:420,now);
        o.frequency.exponentialRampToValueAtTime(type==="bad"?44:type==="bonus"?990:620,now+.1);
        g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.04,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+.16);
        o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.18);
      }catch(e){}
    }
    function buzz(ms){try{if(navigator.vibrate) navigator.vibrate(ms)}catch(e){}}
    function show(el){el.classList.remove("hidden");requestAnimationFrame(()=>el.classList.add("active"))}
    function hide(el){el.classList.remove("active");setTimeout(()=>el.classList.add("hidden"),280)}
    function updateHud(){
      ui.score.textContent=String(state.score);ui.time.textContent=String(Math.max(0,Math.ceil(state.clock)));
      ui.corrupt.textContent=Math.round(state.corrupt)+"%";ui.fill.style.width=clamp(state.corrupt,0,100)+"%";
    }
    function makeCard(){
      const owner=Math.random()<.5?"human":"machine", level=state.score;
      const hard=level>7&&Math.random()<clamp(.2+level*.018,.2,.68);
      const merged=level>13&&Math.random()<clamp((level-10)*.018,.05,.48);
      const blur=hard||Math.random()<clamp(level*.012,.04,.32);
      const source=owner==="human"?human:machine, other=owner==="human"?machine:human;
      let lines=[pick(source)];
      if(merged){lines.push(pick(other));if(Math.random()<.65) lines.push("trace: "+pick(ghosts))}
      else if(Math.random()<.38) lines.push("trace: "+pick(owner==="human"?["hesitation","rename","scratchpad","messy diff"]:["token-lattice","policy echo","canonical","batch id"]));
      return {owner,lines,blur,merged,x:W/2,y:H*.3,rot:rnd(-.035,.035),life:0,limit:clamp(3.2-state.score*.035,1.16,3.2),vx:0,vy:0,out:false,good:null};
    }
    function spawn(){state.card=state.next||makeCard();state.next=makeCard();state.card.x=W/2;state.card.y=H*.32;state.card.life=0;state.card.out=false;state.card.vx=0;state.card.vy=0}
    function reset(){
      state.mode="play";state.score=0;state.combo=0;state.best=0;state.blurCombo=0;state.corrupt=0;state.clock=45;state.shake=0;state.slow=0;state.particles.length=0;state.logs.length=0;state.next=makeCard();spawn();updateHud();hide(ui.title);hide(ui.over);
    }
    function end(reason){
      if(state.mode!=="play") return;state.mode="over";state.card=null;state.shake=10;
      ui.overTitle.textContent=reason==="time"?"Deadline Missed":"Build Corrupted";
      ui.overText.textContent=reason==="time"?"The last fragments froze in the fog.":"The ownership ledger dissolved into green static.";
      ui.finalScore.textContent="Score "+state.score;ui.finalStreak.textContent="Best x"+state.best;updateHud();show(ui.over);cue("bad");buzz(80);
    }
    function logLine(txt,bad){state.logs.unshift({txt,bad,t:1});state.logs=state.logs.slice(0,7)}
    function burst(x,y,color,n){
      if(reduced()) return;
      for(let i=0;i<n;i++) state.particles.push({x,y,vx:rnd(-160,160),vy:rnd(-190,80),r:rnd(1.5,4),life:rnd(.32,.75),color});
    }
    function judge(side){
      const c=state.card;if(state.mode!=="play"||!c||c.out) return;
      c.out=true;c.vx=(side==="left"?-1:1)*rnd(720,900);c.vy=rnd(-70,70);c.good=(side==="left"&&c.owner==="human")||(side==="right"&&c.owner==="machine");
      if(c.good){
        state.score+=1+Math.floor(state.combo/5);state.combo++;state.best=Math.max(state.best,state.combo);
        if(c.blur){state.blurCombo++;}else state.blurCombo=0;
        if(state.blurCombo>=3){state.slow=.9;state.corrupt=Math.max(0,state.corrupt-9);state.blurCombo=0;burst(c.x,c.y,"#ffb343",28);logLine("BLUR STREAK: audit window widened",false);cue("bonus")}
        else {burst(c.x,c.y,"#34f28a",18);cue("good");}
      }else{
        state.corrupt+=c.merged?22:16;state.combo=0;state.blurCombo=0;state.shake=12;state.wrongSide=side;burst(c.x,c.y,"#ff5b48",24);logLine("MIS-SORT: "+(c.owner==="human"?"human":"machine")+" fragment corrupted",true);cue("bad");buzz(45);ui.flash.classList.remove("hit");void ui.flash.offsetWidth;ui.flash.classList.add("hit");
      }
      updateHud();setTimeout(()=>{if(state.mode==="play"){spawn()}},160);
      if(state.corrupt>=100) setTimeout(()=>end("corrupt"),220);
    }
    function point(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
    function down(e){if(e.cancelable) e.preventDefault();const p=point(e);state.drag={x:p.x,y:p.y,dx:0,dy:0}}
    function move(e){if(e.cancelable) e.preventDefault();if(!state.drag) return;const p=point(e);state.drag.dx=p.x-state.drag.x;state.drag.dy=p.y-state.drag.y}
    function up(e){if(e.cancelable) e.preventDefault();if(!state.drag) return;const d=state.drag;state.drag=null;if(state.mode!=="play") return;if(Math.abs(d.dx)>42&&Math.abs(d.dx)>Math.abs(d.dy)*1.1) judge(d.dx<0?"left":"right")}
    canvas.addEventListener("pointerdown",down,{passive:false});canvas.addEventListener("pointermove",move,{passive:false});canvas.addEventListener("pointerup",up,{passive:false});canvas.addEventListener("pointercancel",up,{passive:false});
    window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a") judge("left"); if(e.key==="ArrowRight"||e.key==="d") judge("right"); if((e.key==="Enter"||e.key===" ")&&state.mode==="title") reset();});
    ui.start.addEventListener("click",e=>{e.preventDefault();reset()});ui.restart.addEventListener("click",e=>{e.preventDefault();reset()});
    window.addEventListener("resize",resize,{passive:true});resize();updateHud();
    function bg(t){
      ctx.clearRect(0,0,W,H);
      const dark=isDark();
      ctx.fillStyle=dark?"#020604":"#e9f0e6";ctx.fillRect(0,0,W,H);
      ctx.save();ctx.globalAlpha=dark ? .9 : .7;
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,dark?"rgba(0,95,48,.23)":"rgba(0,143,82,.18)");g.addColorStop(.55,"rgba(0,0,0,0)");g.addColorStop(1,dark?"rgba(213,106,0,.08)":"rgba(213,106,0,.12)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--grid")||"rgba(62,255,139,.12)";ctx.lineWidth=1;
      const grid=34;ctx.beginPath();for(let x=(t*.018)%grid;x<W;x+=grid){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=(t*.026)%grid;y<H;y+=grid){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
      for(const s of state.stars){ctx.globalAlpha=s.a*(.55+.45*Math.sin(t*.002+s.x));ctx.fillStyle=dark?"#34f28a":"#007d8a";ctx.fillRect(s.x,s.y,s.s,s.s)}
      ctx.restore();
      ctx.save();ctx.font="12px ui-monospace,Menlo,monospace";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.globalAlpha=.8;ctx.fillStyle=dark?"rgba(52,242,138,.16)":"rgba(0,143,82,.16)";
      roundRect(14,H*.57,Math.max(92,W*.25),58,18);ctx.fill();roundRect(W-Math.max(92,W*.25)-14,H*.57,Math.max(92,W*.25),58,18);ctx.fill();
      ctx.globalAlpha=1;ctx.fillStyle=dark?"#34f28a":"#008f52";ctx.fillText("YOURS",14+Math.max(92,W*.25)/2,H*.57+29);ctx.fillStyle=dark?"#53d7de":"#007d8a";ctx.fillText("MACHINE'S",W-14-Math.max(92,W*.25)/2,H*.57+29);ctx.restore();
    }
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
    function card(c,t){
      let dx=0,dy=0;if(state.drag){dx=state.drag.dx*.45;dy=state.drag.dy*.15}
      const x=c.x+dx,y=c.y+dy,w=Math.min(W*.82,430),h=154+(c.lines.length-1)*24;
      const tilt=c.rot+dx*.0009;
      ctx.save();ctx.translate(x,y);ctx.rotate(tilt);
      ctx.shadowColor="rgba(0,0,0,.26)";ctx.shadowBlur=30;ctx.shadowOffsetY=18;
      const dark=isDark();
      ctx.fillStyle=dark?"rgba(3,16,9,.94)":"rgba(250,253,247,.94)";
      roundRect(-w/2,-h/2,w,h,22);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.shadowColor="transparent";
      ctx.strokeStyle=c.good===false?"#ff5b48":c.good===true?"#34f28a":"rgba(127,157,132,.38)";ctx.lineWidth=2;roundRect(-w/2,-h/2,w,h,22);ctx.stroke();
      const pct=1-c.life/c.limit;ctx.fillStyle=c.life/c.limit>.76?"#ff5b48":"#ffb343";roundRect(-w/2+18,-h/2+16,(w-36)*clamp(pct,0,1),4,2);ctx.fill();
      ctx.font="11px ui-monospace,Menlo,monospace";ctx.textAlign="left";ctx.textBaseline="top";ctx.fillStyle="#76a886";
      ctx.fillText(c.merged?"MERGED FRAGMENT":"FRAGMENT", -w/2+22, -h/2+29);
      ctx.textAlign="right";ctx.fillText(c.blur?"BLURRED":"CLEAR", w/2-22, -h/2+29);
      ctx.font=(c.blur?"700 ":"600 ")+"18px ui-monospace,Menlo,monospace";ctx.textAlign="left";ctx.textBaseline="middle";
      for(let i=0;i<c.lines.length;i++){
        let txt=trimLine(c.lines[i],w);if(c.blur&&i===0) txt=glitch(txt,t);
        ctx.fillStyle=i===0?(dark?"#d7ffe5":"#172018"):(dark?"#76a886":"#59665a");
        ctx.fillText(txt,-w/2+22,-h/2+72+i*28);
      }
      if(c.blur){ctx.globalAlpha=.12;ctx.fillStyle="#34f28a";for(let i=0;i<8;i++)ctx.fillRect(rnd(-w/2,w/2),rnd(-h/2,h/2),rnd(18,80),1);ctx.globalAlpha=1}
      ctx.restore();
    }
    function glitch(txt,t){
      const chars="{}[]<>/01_";let out="";
      for(let i=0;i<txt.length;i++) out+=Math.random()<.12+Math.sin(t*.01+i)*.04?chars[(Math.random()*chars.length)|0]:txt[i];
      return out;
    }
    function trimLine(txt,w){const max=Math.max(18,Math.floor((w-50)/10));return txt.length>max?txt.slice(0,max-3)+"...":txt}
    function drawLogs(dt){
      ctx.save();ctx.font="12px ui-monospace,Menlo,monospace";ctx.textAlign="left";ctx.textBaseline="bottom";
      for(let i=state.logs.length-1;i>=0;i--){const l=state.logs[i];l.t-=dt*.18;ctx.globalAlpha=clamp(l.t,0,1)*.75;ctx.fillStyle=l.bad?"#ff5b48":"#34f28a";ctx.fillText("> "+l.txt,18,H-18-(state.logs.length-1-i)*18)}
      state.logs=state.logs.filter(l=>l.t>0);ctx.restore();
    }
    function particles(dt){
      for(const p of state.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt}
      state.particles=state.particles.filter(p=>p.life>0);
      ctx.save();for(const p of state.particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.restore();
    }
    function frame(ts){
      const dt=Math.min(.033,(ts-last||16)/1000);last=ts;
      ctx.setTransform(DPR,0,0,DPR,0,0);
      let sx=0,sy=0;if(state.shake>0){state.shake=Math.max(0,state.shake-dt*28);sx=rnd(-state.shake,state.shake);sy=rnd(-state.shake,state.shake)}
      bg(ts);
      ctx.save();ctx.translate(sx,sy);
      if(state.mode==="play"){
        const rate=state.slow > 0 ? .48 : 1;state.slow=Math.max(0,state.slow-dt);
        state.clock-=dt*rate;if(state.clock<=0) end("time");
        const c=state.card;if(c){c.life+=dt*rate;if(!c.out&&c.life>c.limit){state.corrupt+=12;state.combo=0;state.blurCombo=0;state.shake=8;logLine("TIMEOUT: fragment condensed into static",true);burst(c.x,c.y,"#ff5b48",18);cue("bad");buzz(35);updateHud();spawn()}else{if(c.out){c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vx*dt*.00025}else{c.y=H*.32+Math.sin(ts*.003)*7}card(c,ts)}}
        if(state.corrupt>=100) end("corrupt");updateHud();
      }else{
        ctx.save();ctx.globalAlpha=.7;ctx.font="13px ui-monospace,Menlo,monospace";ctx.textAlign="center";ctx.fillStyle=isDark()?"#76a886":"#59665a";ctx.fillText("swipe left for yours, right for machine's",W/2,H*.74);ctx.restore();
      }
      particles(dt);drawLogs(dt);
      ctx.restore();
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
    window.addEventListener("beforeunload",()=>{if(raf) cancelAnimationFrame(raf)});
  })();
  </script>
</body>
</html>
