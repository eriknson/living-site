<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Before Dawn</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#c8d4dc;--bg2:#b0bec8;--text:#1a2830;--text-dim:#4a5a64;
  --ui-bg:rgba(255,252,248,.88);--ui-border:rgba(26,40,48,.12);
  --accent:#d4782a;--accent2:#e8a040;--danger:#8b3a3a;
  --fog:rgba(180,195,210,.55);--glow:#ffb84d;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0e1620;--bg2:#162028;--text:#e8eef2;--text-dim:#8a9aa8;
    --ui-bg:rgba(14,22,32,.92);--ui-border:rgba(232,238,242,.1);
    --accent:#e89040;--accent2:#ffc860;--danger:#c06060;
    --fog:rgba(30,45,60,.7);--glow:#ffb84d;
  }
}
html,body{width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1rem;padding:1.5rem;
  transition:opacity .4s ease,visibility .4s}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none!important}
#title-screen{background:linear-gradient(180deg,transparent 40%,var(--bg) 100%)}
.title-main{font-size:clamp(1.6rem,6vw,2.4rem);letter-spacing:.08em;font-weight:300;
  text-transform:uppercase;color:var(--text)}
.title-sub{font-size:clamp(.75rem,3vw,.9rem);color:var(--text-dim);text-align:center;
  max-width:20rem;line-height:1.5}
.btn{pointer-events:auto;min-height:48px;min-width:160px;padding:.75rem 2rem;
  border:1px solid var(--ui-border);border-radius:2px;background:var(--ui-bg);
  color:var(--text);font-family:inherit;font-size:.85rem;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;transition:transform .15s,background .15s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent}
.btn-primary:active{background:var(--accent2)}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top))
  max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));
  display:flex;justify-content:space-between;align-items:flex-start;
  font-size:clamp(.7rem,2.8vw,.85rem);opacity:0;transition:opacity .3s}
#hud.visible{opacity:1}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:.65rem;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase}
.hud-val{font-size:1.1rem;color:var(--accent)}
#hint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-size:.7rem;color:var(--text-dim);letter-spacing:.06em;
  opacity:0;transition:opacity .5s}
#hint.visible{opacity:.7}
#toast{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) scale(.8);
  font-size:clamp(.9rem,4vw,1.2rem);letter-spacing:.15em;color:var(--accent2);
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-shadow:0 0 20px var(--glow)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#gameover-screen{background:rgba(0,0,0,.35)}
@media(prefers-color-scheme:light){#gameover-screen{background:rgba(200,212,220,.5)}}
.go-card{background:var(--ui-bg);border:1px solid var(--ui-border);padding:2rem;
  border-radius:4px;text-align:center;max-width:90vw;pointer-events:none}
.go-score{font-size:2.5rem;color:var(--accent);margin:.5rem 0}
.go-detail{font-size:.75rem;color:var(--text-dim);margin-bottom:1.5rem;line-height:1.6}
.go-card .btn{pointer-events:auto}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="title-screen" class="screen">
      <div class="title-main">Before Dawn</div>
      <div class="title-sub">Steer your lantern through the September fog. Hold to slow time and aim. Release to dash and scoop agent sparks before they fade.</div>
      <button class="btn btn-primary" data-smoke="start">Light the Lantern</button>
    </div>
    <div id="hud">
      <div class="hud-block"><span class="hud-label">Sparks</span><span class="hud-val" id="score">0</span></div>
      <div class="hud-block" style="align-items:center"><span class="hud-label">Fog</span><span class="hud-val" id="fog-lvl">I</span></div>
      <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Time</span><span class="hud-val" id="timer">60</span></div>
    </div>
    <div id="hint">HOLD to slow · DRAG to aim · RELEASE to dash</div>
    <div id="toast"></div>
    <div id="gameover-screen" class="screen hidden">
      <div class="go-card">
        <div class="title-main" style="font-size:1.2rem">Fog Claims the Night</div>
        <div class="go-score" id="final-score">0</div>
        <div class="go-detail" id="go-detail">sparks collected</div>
        <button class="btn btn-primary" data-smoke="restart">Try Again</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var titleEl=document.getElementById('title-screen');
var goEl=document.getElementById('gameover-screen');
var hudEl=document.getElementById('hud');
var hintEl=document.getElementById('hint');
var toastEl=document.getElementById('toast');
var scoreEl=document.getElementById('score');
var timerEl=document.getElementById('timer');
var fogEl=document.getElementById('fog-lvl');
var finalEl=document.getElementById('final-score');
var detailEl=document.getElementById('go-detail');

var W=300,H=500,DPR=1;
var state='title';
var score=0,combo=0,bestCombo=0,timeLeft=60,elapsed=0;
var player={x:150,y:250,r:14,ax:0,ay:0,vx:0,vy:0,dashing:false,dashT:0};
var sparks=[],obstacles=[],particles=[],fogP=[];
var input={down:false,tx:150,ty:250,wasDown:false};
var timeScale=1,slowActive=false;
var spawnT=0,obsT=0,fogLevel=0;
var audioCtx=null,audioReady=false;
var lastTs=0,toastT=0;
var dashCollect=0;
var hits=0;
var MAX_HITS=3;
var hitPause=0;
var trail=[];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
window.addEventListener('resize',resize);

function initAudio(){
  if(audioReady)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    audioCtx=new AC();
    audioReady=true;
  }catch(e){}
}

function playChime(freq,dur,vol){
  if(!audioCtx)return;
  try{
    if(audioCtx.state==='suspended')audioCtx.resume();
    var t=audioCtx.currentTime;
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type='sine';o.frequency.setValueAtTime(freq,t);
    o.frequency.exponentialRampToValueAtTime(freq*1.5,t+dur*.3);
    g.gain.setValueAtTime(vol||.08,t);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(t);o.stop(t+dur);
  }catch(e){}
}

function playDash(){
  playChime(180,.15,.04);
}

function playCollect(n){
  var f=440+n*40;
  playChime(f,.12,.07+n*.01);
  if(typeof navigator.vibrate==='function'){
    try{navigator.vibrate(12);}catch(e){}
  }
}

function playShip(){
  playChime(523,.1,.1);
  setTimeout(function(){playChime(659,.1,.1);},80);
  setTimeout(function(){playChime(784,.2,.12);},160);
  if(typeof navigator.vibrate==='function'){
    try{navigator.vibrate([20,30,40]);}catch(e){}
  }
}

function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  toastT=1.8;
}

function fogLabel(l){
  return['I','II','III','IV','V'][Math.min(4,l)]||'V';
}

function resetGame(){
  score=0;combo=0;bestCombo=0;timeLeft=60;elapsed=0;fogLevel=0;
  hits=0;spawnT=0;obsT=0;dashCollect=0;hitPause=0;trail=[];
  player.x=W*.5;player.y=H*.5;
  player.vx=0;player.vy=0;player.dashing=false;player.dashT=0;
  input.tx=player.x;input.ty=player.y;
  sparks=[];obstacles=[];particles=[];
  initFogParticles();
  updateHUD();
}

function initFogParticles(){
  fogP=[];
  for(var i=0;i<60;i++){
    fogP.push({
      x:Math.random()*W,y:Math.random()*H,
      r:20+Math.random()*60,
      vx:(Math.random()-.5)*8,
      vy:(Math.random()-.5)*5,
      a:.08+Math.random()*.12
    });
  }
}

function startGame(){
  initAudio();
  resetGame();
  state='playing';
  titleEl.classList.add('hidden');
  goEl.classList.add('hidden');
  hudEl.classList.add('visible');
  hintEl.classList.add('visible');
  setTimeout(function(){hintEl.classList.remove('visible');},4000);
}

function endGame(){
  state='gameover';
  hudEl.classList.remove('visible');
  hintEl.classList.remove('visible');
  finalEl.textContent=score;
  detailEl.textContent=score+' sparks · best combo ×'+bestCombo+
    (hits>=MAX_HITS?' · fog consumed you':' · dawn broke');
  goEl.classList.remove('hidden');
}

function updateHUD(){
  scoreEl.textContent=score;
  timerEl.textContent=Math.ceil(timeLeft);
  fogEl.textContent=fogLabel(fogLevel);
}

function spawnSpark(){
  var margin=40;
  var angle=Math.random()*Math.PI*2;
  var dist=80+Math.random()*(120+fogLevel*30);
  sparks.push({
    x:Math.max(margin,Math.min(W-margin,player.x+Math.cos(angle)*dist)),
    y:Math.max(margin,Math.min(H-margin,player.y+Math.sin(angle)*dist)),
    life:5+Math.random()*3-fogLevel*.3,
    maxLife:8,r:5+Math.random()*3,pulse:Math.random()*Math.PI*2
  });
}

function spawnObstacle(){
  var side=Math.floor(Math.random()*4);
  var o={r:18+Math.random()*14,vx:0,vy:0,type:Math.random()>.5?'wisp':'phantom'};
  var spd=25+fogLevel*12+Math.random()*20;
  if(side===0){o.x=Math.random()*W;o.y=-30;o.vy=spd;}
  else if(side===1){o.x=W+30;o.y=Math.random()*H;o.vx=-spd;}
  else if(side===2){o.x=Math.random()*W;o.y=H+30;o.vy=-spd;}
  else{o.x=-30;o.y=Math.random()*H;o.vx=spd;}
  obstacles.push(o);
}

function addParticles(x,y,col,n){
  for(var i=0;i<(n||8);i++){
    var a=Math.random()*Math.PI*2;
    var s=40+Math.random()*120;
    particles.push({
      x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:.4+Math.random()*.4,r:2+Math.random()*3,col:col||'#ffc860'
    });
  }
}

function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}

function handleInput(dt){
  if(state!=='playing')return;
  var ts=slowActive?0.22:1;
  timeScale=ts;

  if(input.down&&!input.wasDown){
    slowActive=true;
  }
  if(!input.down&&input.wasDown){
    slowActive=false;
    var dx=input.tx-player.x,dy=input.ty-player.y;
    var len=Math.sqrt(dx*dx+dy*dy)||1;
    var dashSpd=380+fogLevel*20;
    player.vx=dx/len*dashSpd;
    player.vy=dy/len*dashSpd;
    player.dashing=true;
    player.dashT=.28;
    dashCollect=0;
    playDash();
    addParticles(player.x,player.y,'#ffb84d',6);
    if(typeof navigator.vibrate==='function'){
      try{navigator.vibrate(8);}catch(e){}
    }
  }
  input.wasDown=input.down;

  if(slowActive){
    var sdx=input.tx-player.x,sdy=input.ty-player.y;
    var slen=Math.sqrt(sdx*sdx+sdy*sdy)||1;
    player.vx=sdx/slen*55;
    player.vy=sdy/slen*55;
  }

  if(player.dashing){
    player.dashT-=dt;
    if(player.dashT<=0){player.dashing=false;player.vx*=0.3;player.vy*=0.3;}
  }else if(!slowActive){
    player.vx*=Math.pow(0.92,dt*60);
    player.vy*=Math.pow(0.92,dt*60);
  }

  player.x+=player.vx*dt*ts;
  player.y+=player.vy*dt*ts;
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));
}

function update(dt){
  if(state!=='playing')return;
  var ts=timeScale;
  elapsed+=dt;

  timeLeft-=dt;
  if(timeLeft<=0){endGame();return;}

  fogLevel=Math.min(4,Math.floor(elapsed/12));
  var spawnRate=1.4+fogLevel*.35;
  spawnT+=dt;
  if(spawnT>=spawnRate){spawnT=0;spawnSpark();if(fogLevel>=2&&Math.random()<.4)spawnSpark();}

  obsT+=dt;
  var obsRate=3.5-fogLevel*.4;
  if(obsT>=obsRate){obsT=0;if(fogLevel>=1)spawnObstacle();}

  for(var i=sparks.length-1;i>=0;i--){
    var s=sparks[i];
    s.life-=dt;
    s.pulse+=dt*4;
    if(s.life<=0){sparks.splice(i,1);combo=0;continue;}
    if(dist(player,s)<player.r+s.r+4){
      sparks.splice(i,1);
      score++;
      combo++;
      if(combo>bestCombo)bestCombo=combo;
      dashCollect++;
      playCollect(combo);
      hitPause=0.06;
      addParticles(s.x,s.y,'#ffc860',10);
      if(dashCollect>=3&&player.dashing){
        score+=dashCollect;
        showToast('SHIPPED ×'+dashCollect);
        playShip();
        addParticles(player.x,player.y,'#e89040',16);
        dashCollect=0;
      }
    }
  }

  for(var j=obstacles.length-1;j>=0;j--){
    var o=obstacles[j];
    o.x+=o.vx*dt*ts;o.y+=o.vy*dt*ts;
    if(o.x<-60||o.x>W+60||o.y<-60||o.y>H+60){obstacles.splice(j,1);continue;}
    if(dist(player,o)<player.r+o.r-4){
      obstacles.splice(j,1);
      hits++;
      combo=0;
      addParticles(player.x,player.y,'#8b3a3a',12);
      if(typeof navigator.vibrate==='function'){
        try{navigator.vibrate(50);}catch(e){}
      }
      if(hits>=MAX_HITS){endGame();return;}
    }
  }

  for(var k=fogP.length-1;k>=0;k--){
    var f=fogP[k];
    f.x+=f.vx*dt*.3;f.y+=f.vy*dt*.3;
    if(f.x<-f.r)f.x=W+f.r;if(f.x>W+f.r)f.x=-f.r;
    if(f.y<-f.r)f.y=H+f.r;if(f.y>H+f.r)f.y=-f.r;
  }

  for(var p=particles.length-1;p>=0;p--){
    var pt=particles[p];
    pt.life-=dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=80*dt;
    if(pt.life<=0)particles.splice(p,1);
  }

  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('show');}
  if(player.dashing||slowActive){
    trail.push({x:player.x,y:player.y,a:.5});
    if(trail.length>12)trail.shift();
  }else if(trail.length>0){trail.shift();}
  updateHUD();
}

function drawSkyline(col,dark){
  var base=H*.78;
  ctx.fillStyle=dark?'#0a1018':'#8a9aa8';
  ctx.globalAlpha=.35;
  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.lineTo(0,base);
  ctx.lineTo(W*.08,base-.04*H);
  ctx.lineTo(W*.15,base-.12*H);
  ctx.lineTo(W*.22,base-.06*H);
  ctx.lineTo(W*.32,base-.18*H);
  ctx.lineTo(W*.38,base-.14*H);
  ctx.lineTo(W*.48,base-.28*H);
  ctx.lineTo(W*.52,base-.25*H);
  ctx.lineTo(W*.58,base-.32*H);
  ctx.lineTo(W*.65,base-.15*H);
  ctx.lineTo(W*.72,base-.22*H);
  ctx.lineTo(W*.80,base-.08*H);
  ctx.lineTo(W*.88,base-.16*H);
  ctx.lineTo(W,base-.05*H);
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha=1;
}

function getColors(){
  var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  return{
    bg:dark?'#0e1620':'#c8d4dc',
    bg2:dark?'#162028':'#b0bec8',
    fog:dark?'rgba(30,50,65,':'rgba(160,180,200,',
    glow:'#ffb84d',spark:'#ffc860',danger:dark?'#c06060':'#8b3a3a',
    text:dark?'#e8eef2':'#1a2830'
  };
}

function draw(){
  var col=getColors();
  var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  ctx.fillStyle=col.bg;
  ctx.fillRect(0,0,W,H);

  var skyGrd=ctx.createLinearGradient(0,0,0,H*.7);
  skyGrd.addColorStop(0,dark?'#141e28':'#a8bcc8');
  skyGrd.addColorStop(1,col.bg);
  ctx.fillStyle=skyGrd;
  ctx.fillRect(0,0,W,H*.7);
  drawSkyline(col,dark);

  var visR=140-fogLevel*12;
  var grd=ctx.createRadialGradient(player.x,player.y,10,player.x,player.y,visR);
  grd.addColorStop(0,'rgba(255,184,77,.18)');
  grd.addColorStop(.5,'rgba(255,160,60,.06)');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);

  for(var i=0;i<fogP.length;i++){
    var f=fogP[i];
    var fa=f.a+fogLevel*.04;
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle=col.fog+fa+')';
    ctx.fill();
  }

  var fogOverlay=.35+fogLevel*.12;
  ctx.fillStyle=col.fog+fogOverlay+')';
  ctx.fillRect(0,0,W,H);

  for(var s=0;s<sparks.length;s++){
    var sp=sparks[s];
    var alpha=Math.min(1,sp.life/sp.maxLife);
    var pulse=1+Math.sin(sp.pulse)*.2;
    var sz=sp.r*pulse;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=col.spark;
    ctx.fillRect(sp.x-sz*.5,sp.y-sz*.5,sz,sz);
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.fillRect(sp.x-sz*.25,sp.y-sz*.25,sz*.5,sz*.5);
    ctx.restore();
  }

  for(var o=0;o<obstacles.length;o++){
    var ob=obstacles[o];
    ctx.save();
    ctx.globalAlpha=.7;
    if(ob.type==='wisp'){
      ctx.beginPath();
      ctx.arc(ob.x,ob.y,ob.r,0,Math.PI*2);
      ctx.fillStyle=col.danger;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ob.x-ob.r*.3,ob.y,ob.r*.6,0,Math.PI*2);
      ctx.fillStyle=col.fog+.5+')';
      ctx.fill();
    }else{
      ctx.beginPath();
      ctx.ellipse(ob.x,ob.y,ob.r*1.2,ob.r*.7,Date.now()*.001,0,Math.PI*2);
      ctx.fillStyle=col.danger;
      ctx.globalAlpha=.5;
      ctx.fill();
    }
    ctx.restore();
  }

  for(var p=0;p<particles.length;p++){
    var pt=particles[p];
    ctx.globalAlpha=pt.life/.6;
    ctx.fillStyle=pt.col;
    ctx.beginPath();
    ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  for(var t=0;t<trail.length;t++){
    var tr=trail[t];
    ctx.globalAlpha=tr.a*(t/trail.length)*.4;
    ctx.fillStyle=col.glow;
    ctx.beginPath();
    ctx.arc(tr.x,tr.y,player.r*(t/trail.length),0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  var lg=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,player.r*3);
  lg.addColorStop(0,'rgba(255,200,100,.9)');
  lg.addColorStop(.4,'rgba(255,160,60,.4)');
  lg.addColorStop(1,'rgba(255,120,40,0)');
  ctx.fillStyle=lg;
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r*3,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#ffe8c0';
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#d4782a';
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r*.55,0,Math.PI*2);
  ctx.fill();

  if(state==='playing'&&input.down){
    ctx.strokeStyle='rgba(255,184,77,.5)';
    ctx.lineWidth=1.5;
    ctx.setLineDash([4,6]);
    ctx.beginPath();
    ctx.moveTo(player.x,player.y);
    ctx.lineTo(input.tx,input.ty);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(input.tx,input.ty,6,0,Math.PI*2);
    ctx.fillStyle='rgba(255,184,77,.6)';
    ctx.fill();
  }

  if(state==='playing'&&hits>0){
    ctx.fillStyle=col.text;
    ctx.font='10px ui-monospace,Menlo,monospace';
    ctx.globalAlpha=.5;
    for(var h=0;h<MAX_HITS;h++){
      ctx.globalAlpha=h<hits?.25:.15;
      ctx.fillRect(W-20-h*14,H-30,8,8);
    }
    ctx.globalAlpha=1;
  }
}

function loop(ts){
  var dt=Math.min((ts-lastTs)/1000,.05);
  lastTs=ts;
  if(state==='playing'){
    if(hitPause>0){
      hitPause-=dt;
    }else{
      handleInput(dt);
      update(dt);
    }
  }
  draw();
  requestAnimationFrame(loop);
}

function setInput(x,y,down){
  input.tx=x;input.ty=y;input.down=down;
}

function pointerPos(e){
  var rect=canvas.getBoundingClientRect();
  var cx=e.clientX!=null?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:W/2);
  var cy=e.clientY!=null?e.clientY:(e.touches&&e.touches[0]?e.touches[0].clientY:H/2);
  return{x:cx-rect.left,y:cy-rect.top};
}

canvas.addEventListener('mousedown',function(e){
  if(state!=='playing')return;
  e.preventDefault();
  var p=pointerPos(e);setInput(p.x,p.y,true);
});
canvas.addEventListener('mousemove',function(e){
  if(state!=='playing'||!input.down)return;
  e.preventDefault();
  var p=pointerPos(e);input.tx=p.x;input.ty=p.y;
});
canvas.addEventListener('mouseup',function(e){
  if(state!=='playing')return;
  e.preventDefault();
  var p=pointerPos(e);setInput(p.x,p.y,false);
});
canvas.addEventListener('touchstart',function(e){
  if(state!=='playing')return;
  e.preventDefault();
  var p=pointerPos(e);setInput(p.x,p.y,true);
},{passive:false});
canvas.addEventListener('touchmove',function(e){
  if(state!=='playing')return;
  e.preventDefault();
  var p=pointerPos(e);
  input.tx=p.x;input.ty=p.y;
  if(!input.down)input.down=true;
},{passive:false});
canvas.addEventListener('touchend',function(e){
  if(state!=='playing')return;
  e.preventDefault();
  setInput(input.tx,input.ty,false);
},{passive:false});
canvas.addEventListener('touchcancel',function(e){
  if(state!=='playing')return;
  e.preventDefault();
  setInput(input.tx,input.ty,false);
},{passive:false});

canvas.addEventListener('click',function(e){
  if(state==='title'||state==='gameover')return;
  e.preventDefault();
});

document.addEventListener('keydown',function(e){
  if(state!=='playing')return;
  var sp=80;
  if(e.code==='Space'){e.preventDefault();if(!input.down){input.down=true;}}
  if(e.code==='ArrowLeft'||e.code==='KeyA')input.tx=Math.max(0,input.tx-sp*0.016);
  if(e.code==='ArrowRight'||e.code==='KeyD')input.tx=Math.min(W,input.tx+sp*0.016);
  if(e.code==='ArrowUp'||e.code==='KeyW')input.ty=Math.max(0,input.ty-sp*0.016);
  if(e.code==='ArrowDown'||e.code==='KeyS')input.ty=Math.min(H,input.ty+sp*0.016);
});
document.addEventListener('keyup',function(e){
  if(e.code==='Space'&&state==='playing'){e.preventDefault();input.down=false;}
});

var startBtn=document.querySelector('[data-smoke="start"]');
var restartBtn=document.querySelector('[data-smoke="restart"]');
if(startBtn)startBtn.addEventListener('click',function(e){
  e.stopPropagation();startGame();
});
if(restartBtn)restartBtn.addEventListener('click',function(e){
  e.stopPropagation();startGame();
});

initFogParticles();
draw();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
