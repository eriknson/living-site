<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zero Cent Run</title>
  <style>
    :root{
      color-scheme:light;
      --bg:#edf2e5;
      --ink:#071d12;
      --muted:#526457;
      --panel:rgba(248,251,241,.88);
      --line:rgba(7,29,18,.16);
      --green:#008f55;
      --green2:#00b86d;
      --amber:#c76b00;
      --red:#c93826;
      --cyan:#007c85;
      --shadow:0 22px 80px rgba(12,29,17,.22);
    }
    @media (prefers-color-scheme: dark){
      :root{
        color-scheme:dark;
        --bg:#020604;
        --ink:#c8ffd5;
        --muted:#6fa67b;
        --panel:rgba(3,15,8,.84);
        --line:rgba(116,255,154,.16);
        --green:#3dff88;
        --green2:#8affad;
        --amber:#ffb743;
        --red:#ff5a45;
        --cyan:#5ce2dd;
        --shadow:0 24px 90px rgba(0,0,0,.64);
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
    body{min-height:100dvh;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #game{
      position:fixed;inset:0;width:100dvw;height:100dvh;overflow:hidden;
      background:
        radial-gradient(circle at 50% -15%, rgba(0,184,109,.24), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,.18), transparent 24%),
        var(--bg);
      user-select:none;-webkit-user-select:none;touch-action:none;
    }
    canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    .hud{
      position:absolute;z-index:5;left:env(safe-area-inset-left);right:env(safe-area-inset-right);top:env(safe-area-inset-top);
      display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:14px 16px 0;
      font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:11px;
      letter-spacing:.08em;text-transform:uppercase;color:var(--muted);pointer-events:none;
    }
    .hud strong{display:block;color:var(--ink);font-size:20px;line-height:1.05;letter-spacing:.01em}
    .hud .center{text-align:center}.hud .right{text-align:right}
    .bar{height:5px;margin-top:6px;border-radius:99px;background:rgba(127,127,127,.16);overflow:hidden}
    .fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--amber),var(--red))}
    .screen{
      position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:24px;
      background:linear-gradient(180deg, rgba(2,6,4,.34), rgba(2,6,4,.08));
      opacity:0;transform:translateY(8px) scale(.99);transition:opacity .28s ease,transform .28s ease;
      pointer-events:none;
    }
    @media (prefers-color-scheme: light){
      .screen{background:linear-gradient(180deg, rgba(237,242,229,.55), rgba(237,242,229,.14))}
    }
    .screen.active{opacity:1;transform:none}
    .screen.hidden{display:none}
    .card{
      width:min(520px,92dvw);border:1px solid var(--line);border-radius:28px;
      padding:28px 24px 24px;text-align:center;background:var(--panel);box-shadow:var(--shadow);
      backdrop-filter:blur(15px);pointer-events:none;
    }
    h1{margin:0 0 10px;font-size:clamp(42px,13dvw,74px);line-height:.86;letter-spacing:-.08em}
    h2{margin:0 0 10px;font-size:clamp(32px,10dvw,54px);line-height:.92;letter-spacing:-.06em}
    p{margin:10px auto 0;max-width:34em;color:var(--muted);font-size:15px;line-height:1.5}
    .rule{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 22px;
      font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    }
    .rule span{border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--ink);background:rgba(0,143,85,.08)}
    button{
      min-width:178px;min-height:48px;border:0;border-radius:999px;padding:14px 22px;
      background:var(--ink);color:var(--bg);font:800 14px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
      letter-spacing:.08em;text-transform:uppercase;box-shadow:0 14px 34px rgba(0,0,0,.24);
      cursor:pointer;pointer-events:auto;touch-action:manipulation;
    }
    button:active{transform:translateY(1px) scale(.99)}
    .flash{position:absolute;inset:0;z-index:6;background:rgba(255,90,69,.18);opacity:0;pointer-events:none}
    .flash.hit{animation:hit .22s ease}
    @keyframes hit{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
  </style>
</head>
<body>
  <main id="game" aria-label="Zero Cent Run rhythm game">
    <canvas id="arena"></canvas>
    <div class="hud" aria-hidden="true">
      <div>ARC lock<strong id="arc">0.0%</strong></div>
      <div class="center">Seconds<strong id="time">45</strong></div>
      <div class="right">Heat<strong id="heat">0%</strong><div class="bar"><div id="heatFill" class="fill"></div></div></div>
    </div>
    <section id="title" class="screen active">
      <div class="card">
        <h1>Zero Cent Run</h1>
        <p>The ticker is burning cents before dawn. Tap only when the true price hits 0c. Amber ghost dips look cheap, but they melt the benchmark.</p>
        <div class="rule"><span>Tap: lock zero</span><span>Space: keyboard</span></div>
        <button id="startBtn" data-smoke="start" type="button">Start Run</button>
      </div>
    </section>
    <section id="over" class="screen hidden">
      <div class="card">
        <h2 id="overTitle">Run Complete</h2>
        <p id="overText">The terminal cooled before sunrise.</p>
        <div class="rule"><span id="finalArc">ARC 0.0%</span><span id="finalCombo">Best x0</span></div>
        <button id="restartBtn" data-smoke="restart" type="button">Restart Run</button>
      </div>
    </section>
    <div id="flash" class="flash"></div>
  </main>
  <script>
  (()=>{try{"use strict";
    const $=id=>document.getElementById(id);
    const canvas=$("arena"),game=$("game");
    const ctx=canvas&&canvas.getContext?canvas.getContext("2d",{alpha:false}):null;
    const ui={arc:$("arc"),time:$("time"),heat:$("heat"),heatFill:$("heatFill"),title:$("title"),over:$("over"),overTitle:$("overTitle"),overText:$("overText"),finalArc:$("finalArc"),finalCombo:$("finalCombo"),start:$("startBtn"),restart:$("restartBtn"),flash:$("flash")};
    if(!canvas||!game||!ctx||!ui.start||!ui.restart||!ui.arc||!ui.time||!ui.heat||!ui.heatFill||!ui.title||!ui.over) return;
    let W=1,H=1,DPR=1,last=0,raf=0,audio=null;
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const rnd=(a,b)=>a+Math.random()*(b-a);
    const now=()=>performance&&performance.now?performance.now()/1000:Date.now()/1000;
    const dark=()=>window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    const reduce=()=>window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const flex=[
      "ARC +2.4 // zero-cent reasoning locked",
      "44% line crossed for couch-change compute",
      "phone agent shipped while the city slept",
      "fog cleared: scoreline survived the dip",
      "perfect zero: cents null, benchmark bright",
      "sunrise build accepted under a dollar"
    ];
    const miss=["false zero taxed the run","too early: cents still falling","too late: price rebounded","phantom dip ate the tap"];
    const state={
      mode:"title",elapsed:0,clock:45,arc:0,score:0,combo:0,best:0,heat:0,shake:0,hitStop:0,pulse:0,
      cycle:null,particles:[],logs:[],stars:[],floaters:[],tapCooldown:0
    };
    function cycleFor(){
      const d=clamp(state.elapsed/45,0,1), dur=clamp(1.72-d*.78-state.combo*.006,.7,1.72);
      const target=dur*rnd(.70,.78), win=clamp(.155-d*.075-state.combo*.002,.052,.155);
      const fakes=[];
      const chance=clamp(.12+d*.86,0,.9), n=d>.66?2:1;
      for(let i=0;i<n;i++){
        if(Math.random()<chance){
          let t=target+(i===0?-rnd(.23,.52):rnd(.18,.38));
          t=clamp(t,dur*.16,dur*.94);
          if(Math.abs(t-target)>win*2.5) fakes.push({t,w:rnd(.035,.06)});
        }
      }
      return {start:now(),dur,target,win,fakes,tapped:false,missed:false,advance:0,id:Math.random()};
    }
    function resize(){
      DPR=clamp(window.devicePixelRatio||1,1,2);
      W=Math.max(1,Math.floor(window.innerWidth));H=Math.max(1,Math.floor(window.innerHeight));
      canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);
      state.stars=Array.from({length:Math.min(100,Math.floor(W*H/7600))},()=>({x:Math.random()*W,y:Math.random()*H,a:rnd(.05,.28),s:rnd(.25,1.35)}));
    }
    function show(el){el.classList.remove("hidden");requestAnimationFrame(()=>el.classList.add("active"))}
    function hide(el){el.classList.remove("active");setTimeout(()=>el.classList.add("hidden"),290)}
    function hud(){
      ui.arc.textContent=state.arc.toFixed(1)+"%";ui.time.textContent=String(Math.max(0,Math.ceil(state.clock)));
      ui.heat.textContent=Math.round(state.heat)+"%";ui.heatFill.style.width=clamp(state.heat,0,100)+"%";
    }
    function log(txt,bad){state.logs.unshift({txt,bad,t:1});state.logs=state.logs.slice(0,6)}
    function buzz(ms){try{if(navigator.vibrate) navigator.vibrate(ms)}catch(e){}}
    function cue(kind){
      try{
        const AC=window.AudioContext||window.webkitAudioContext;if(!AC) return;
        audio=audio||new AC();if(audio.state==="suspended") audio.resume().catch(()=>{});
        const n=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
        o.type=kind==="bad"?"sawtooth":"triangle";
        o.frequency.setValueAtTime(kind==="bad"?105:kind==="perfect"?660:420,n);
        o.frequency.exponentialRampToValueAtTime(kind==="bad"?48:kind==="perfect"?1040:610,n+.12);
        g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.045,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+.18);
        o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+.2);
      }catch(e){}
    }
    function burst(x,y,color,n,label){
      if(reduce()) return;
      for(let i=0;i<n;i++) state.particles.push({x,y,vx:rnd(-190,190),vy:rnd(-220,110),life:rnd(.35,.86),r:rnd(1.5,4.8),c:color,txt:i%7===0?label:""});
    }
    function reset(){
      state.mode="play";state.elapsed=0;state.clock=45;state.arc=0;state.score=0;state.combo=0;state.best=0;state.heat=0;state.shake=0;state.hitStop=0;state.pulse=0;state.tapCooldown=0;
      state.particles.length=0;state.logs.length=0;state.floaters.length=0;state.cycle=cycleFor();log("ticker armed: wait for true 0c",false);hud();hide(ui.title);hide(ui.over);
    }
    function end(kind){
      if(state.mode!=="play") return;
      state.mode="over";state.shake=8;
      const cleared=state.arc>=44;
      ui.overTitle.textContent=kind==="heat"?"Thermal Runaway":cleared?"Benchmark Flex":"Run Complete";
      ui.overText.textContent=kind==="heat"?"The phantom dips got expensive. Cool the terminal and try a cleaner line.":cleared?"Reasoning score climbed past 44% before sunrise, and the cost ticker hit zero on cue.":"You shipped a modest score through September fog. Cleaner zero taps will push it higher.";
      ui.finalArc.textContent="ARC "+state.arc.toFixed(1)+"%";ui.finalCombo.textContent="Best x"+state.best;hud();show(ui.over);cue(kind==="heat"?"bad":"perfect");buzz(kind==="heat"?90:35);
    }
    function reading(){
      const c=state.cycle;if(!c) return {p:0,price:99,trueZero:false,fake:false,age:0};
      const age=now()-c.start, after=Math.max(0,age-c.target-c.win);
      let price=age<=c.target?Math.ceil(99*(1-age/c.target)):Math.ceil(99*clamp(after/(c.dur-c.target-c.win),0,1));
      const trueZero=Math.abs(age-c.target)<=c.win;
      let fake=false;
      for(const f of c.fakes){if(Math.abs(age-f.t)<=f.w){fake=true;price=Math.min(price,Math.floor(3*Math.abs(age-f.t)/f.w));}}
      if(trueZero) price=0;
      return {p:clamp(age/c.dur,0,1),price:clamp(price,0,99),trueZero,fake,age};
    }
    function nextCycle(penalize){
      if(penalize){state.heat=clamp(state.heat+7,0,100);state.combo=0;log("missed zero beat: heat +7",true);cue("bad");}
      state.cycle=cycleFor();hud();
      if(state.heat>=100) end("heat");
    }
    function tap(x,y){
      if(state.mode!=="play"||!state.cycle||state.tapCooldown>0) return;
      const c=state.cycle,r=reading(),d=Math.abs(r.age-c.target),good=d<=c.win&&!c.tapped;
      state.tapCooldown=.08;
      if(good){
        c.tapped=true;c.advance=.16;
        const acc=clamp(1-d/c.win,0,1),perfect=acc>.72;
        state.combo++;state.best=Math.max(state.best,state.combo);
        const gain=(perfect?1.65:1.05)+acc*.95+Math.min(1.2,state.combo*.055);
        state.arc=clamp(state.arc+gain,0,99.9);state.score+=Math.round(100+acc*180+state.combo*16);
        state.heat=clamp(state.heat-(perfect?5:2),0,100);state.hitStop=perfect?.055:.025;state.pulse=1;
        log(perfect?flex[(Math.random()*flex.length)|0]:"zero lock held: score +" + Math.round(gain*10)/10,false);
        burst(x||W/2,y||H*.5,perfect?"#8affad":"#3dff88",perfect?38:24,perfect?"0c":"+");
        cue(perfect?"perfect":"good");buzz(perfect?28:12);
      }else{
        const hurt=r.fake?18:11;
        state.combo=0;state.heat=clamp(state.heat+hurt,0,100);state.arc=clamp(state.arc-(r.fake?0.8:0.35),0,99.9);
        state.shake=12;log(r.fake?miss[3]:miss[(Math.random()*3)|0],true);
        burst(x||W/2,y||H*.5,"#ff5a45",24,"x");cue("bad");buzz(45);
        ui.flash.classList.remove("hit");void ui.flash.offsetWidth;ui.flash.classList.add("hit");
        if(state.heat>=100) end("heat");
      }
      hud();
    }
    function pos(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
    function down(e){if(e.cancelable)e.preventDefault();const p=pos(e);tap(p.x,p.y)}
    canvas.addEventListener("pointerdown",down,{passive:false});
    canvas.addEventListener("pointermove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
    canvas.addEventListener("pointerup",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
    canvas.addEventListener("pointercancel",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
    window.addEventListener("keydown",e=>{
      if(e.key===" "||e.key==="Enter"){if(e.cancelable)e.preventDefault();if(state.mode==="title")reset();else tap(W/2,H*.5)}
      if((e.key==="r"||e.key==="R")&&state.mode==="over") reset();
    });
    ui.start.addEventListener("click",e=>{e.preventDefault();reset()});
    ui.restart.addEventListener("click",e=>{e.preventDefault();reset()});
    window.addEventListener("resize",resize,{passive:true});resize();hud();
    function update(dt){
      if(state.hitStop>0){state.hitStop-=dt;return}
      state.shake=Math.max(0,state.shake-dt*38);state.pulse=Math.max(0,state.pulse-dt*3.4);state.tapCooldown=Math.max(0,state.tapCooldown-dt);
      for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt}
      state.particles=state.particles.filter(p=>p.life>0);
      for(const l of state.logs) l.t-=dt*.12;
      if(state.mode==="play"&&state.cycle){
        state.elapsed+=dt;state.clock-=dt;
        const c=state.cycle,age=now()-c.start;
        if(c.advance>0){c.advance-=dt;if(c.advance<=0) nextCycle(false)}
        else if(age>c.dur) nextCycle(!c.tapped);
        if(state.clock<=0) end("time");
        hud();
      }
    }
    function colors(){
      return dark()?{bg:"#020604",ink:"#c8ffd5",muted:"#6fa67b",line:"rgba(116,255,154,.16)",green:"#3dff88",amber:"#ffb743",red:"#ff5a45",cyan:"#5ce2dd",panel:"rgba(3,15,8,.72)"}:
        {bg:"#edf2e5",ink:"#071d12",muted:"#526457",line:"rgba(7,29,18,.16)",green:"#008f55",amber:"#c76b00",red:"#c93826",cyan:"#007c85",panel:"rgba(248,251,241,.78)"};
    }
    function text(s,x,y,size,col,align,weight){
      ctx.fillStyle=col;ctx.font=(weight||700)+" "+size+"px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";ctx.textAlign=align||"center";ctx.textBaseline="middle";ctx.fillText(s,x,y);
    }
    function roundRect(x,y,w,h,r,fill,stroke){
      ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
      if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
    }
    function draw(){
      const C=colors(),r=reading(),cx=W/2,cy=H*.48,rad=Math.min(W,H)*.245,shake=state.shake?rnd(-state.shake,state.shake):0;
      ctx.save();ctx.translate(shake,shake*.45);ctx.fillStyle=C.bg;ctx.fillRect(-20,-20,W+40,H+40);
      ctx.globalAlpha=dark()?.82:.58;
      ctx.strokeStyle=C.line;ctx.lineWidth=1;
      const grid=32;
      for(let x=((now()*18)%grid)-grid;x<W+grid;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
      for(let y=((now()*11)%grid)-grid;y<H+grid;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
      ctx.globalAlpha=1;
      for(const s of state.stars){ctx.fillStyle=C.green;ctx.globalAlpha=s.a*(dark()?1:.45);ctx.fillRect(s.x,(s.y+now()*12*s.s)%H,1.4,1.4)}
      ctx.globalAlpha=1;
      const panelW=Math.min(W-34,520),panelH=Math.min(430,H*.58),px=(W-panelW)/2,py=Math.max(96,H*.18);
      roundRect(px,py,panelW,panelH,28,C.panel,C.line);
      ctx.save();ctx.beginPath();ctx.rect(px,py,panelW,panelH);ctx.clip();
      ctx.globalAlpha=dark()?.10:.07;ctx.fillStyle=C.green;
      for(let i=0;i<18;i++){ctx.fillRect(px,py+i*24+((now()*28)%24),panelW,1)}
      ctx.restore();
      const c=state.cycle,angle=-Math.PI/2+r.p*Math.PI*2,zeroAngle=c?-Math.PI/2+(c.target/c.dur)*Math.PI*2:-Math.PI/2;
      ctx.lineCap="round";ctx.lineWidth=13;ctx.strokeStyle=dark()?"rgba(61,255,136,.16)":"rgba(0,143,85,.14)";
      ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();
      if(c){
        const aw=(c.win/c.dur)*Math.PI*2;
        ctx.strokeStyle=C.green;ctx.lineWidth=16;ctx.beginPath();ctx.arc(cx,cy,rad,zeroAngle-aw,zeroAngle+aw);ctx.stroke();
        ctx.strokeStyle=C.amber;ctx.lineWidth=9;
        for(const f of c.fakes){const a=-Math.PI/2+(f.t/c.dur)*Math.PI*2,w=(f.w/c.dur)*Math.PI*2;ctx.beginPath();ctx.arc(cx,cy,rad+19,a-w,a+w);ctx.stroke()}
      }
      ctx.strokeStyle=C.cyan;ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx,cy,rad+2,-Math.PI/2,angle);ctx.stroke();
      ctx.fillStyle=r.trueZero?C.green:r.fake?C.amber:C.ink;
      ctx.beginPath();ctx.arc(cx+Math.cos(angle)*rad,cy+Math.sin(angle)*rad,9+state.pulse*6,0,Math.PI*2);ctx.fill();
      text(r.trueZero?"LOCK NOW":r.fake?"PHANTOM DIP":"WAIT FOR 0c",cx,cy-rad-36,13,r.trueZero?C.green:r.fake?C.amber:C.muted,"center",800);
      const price=(r.price<10?"0":"")+r.price+"c";
      text(price,cx,cy-8,Math.min(82,W*.18),r.trueZero?C.green:r.fake?C.amber:C.ink,"center",900);
      text("cost ticker",cx,cy+58,13,C.muted,"center",800);
      const bw=Math.min(panelW-76,360),bh=12,bx=cx-bw/2,by=py+panelH-76;
      roundRect(bx,by,bw,bh,8,dark()?"rgba(255,255,255,.08)":"rgba(7,29,18,.08)",null);
      roundRect(bx,by,bw*clamp(state.arc/60,0,1),bh,8,C.green,null);
      text("ARC SCORE "+state.arc.toFixed(1)+"%  /  HEAT "+Math.round(state.heat)+"%",cx,by-20,12,C.muted,"center",800);
      const left=px+22,logY=py+panelH+34;
      for(let i=0;i<state.logs.length;i++){
        const l=state.logs[i];ctx.globalAlpha=clamp(l.t,.2,1);
        text("> "+l.txt,left,logY+i*20,11,l.bad?C.red:C.green,"left",700);
      }
      ctx.globalAlpha=1;
      for(const p of state.particles){
        ctx.globalAlpha=clamp(p.life/.65,0,1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
        if(p.txt) text(p.txt,p.x,p.y-14,12,p.c,"center",900);
      }
      ctx.globalAlpha=1;
      if(state.mode!=="play"){
        text("SEPTEMBER FOG // ZERO COST BENCH",cx,H-42,11,C.muted,"center",800);
      }else{
        text("tap anywhere on the beat",cx,H-42,12,C.muted,"center",800);
      }
      ctx.restore();
    }
    function frame(t){
      const ts=t/1000,dt=last?clamp(ts-last,0,.05):0;last=ts;update(dt);draw();raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
    window.addEventListener("pagehide",()=>{if(raf)cancelAnimationFrame(raf)},{once:true});
  }catch(e){}})();
  </script>
</body>
</html>
