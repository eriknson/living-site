<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ship by Sunrise</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-deep:#dce8f5;
  --bg-mid:#b8cce0;
  --accent:#007a55;
  --accent-dim:#005c41;
  --warn:#d94e1f;
  --hud:#1a2a3a;
  --hud-dim:#4a6278;
  --overlay-bg:rgba(220,232,245,.88);
  --btn-bg:#007a55;
  --btn-text:#fff;
  --fog:rgba(255,255,255,.25);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg-deep:#0a1628;
    --bg-mid:#142238;
    --accent:#00e5a0;
    --accent-dim:#00b87a;
    --warn:#ff6b35;
    --hud:#c8d6e5;
    --hud-dim:#6b8299;
    --overlay-bg:rgba(10,22,40,.82);
    --btn-bg:#00e5a0;
    --btn-text:#0a1628;
    --fog:rgba(180,200,220,.12);
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg-deep:#dce8f5;
    --bg-mid:#b8cce0;
    --accent:#007a55;
    --accent-dim:#005c41;
    --warn:#d94e1f;
    --hud:#1a2a3a;
    --hud-dim:#4a6278;
    --overlay-bg:rgba(220,232,245,.88);
    --btn-bg:#007a55;
    --btn-text:#fff;
    --fog:rgba(255,255,255,.25);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
canvas{display:block;width:100%;flex:1;touch-action:none}
#hud{
  position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;
}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--hud-dim)}
.hud-val{font-size:18px;color:var(--hud);font-variant-numeric:tabular-nums}
.hud-val.warn{color:var(--warn)}
#progress-wrap{
  position:absolute;top:max(52px, calc(env(safe-area-inset-top) + 40px));left:16px;right:16px;height:4px;
  background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;pointer-events:none;z-index:2;
}
#progress-fill{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .2s ease}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--overlay-bg);z-index:10;pointer-events:none;padding:24px;text-align:center;
}
.overlay.hidden{display:none}
.overlay-title{font-size:clamp(22px,6vw,32px);color:var(--hud);letter-spacing:-.02em;margin-bottom:6px}
.overlay-sub{font-size:clamp(12px,3.2vw,14px);color:var(--hud-dim);max-width:320px;line-height:1.5;margin-bottom:28px}
.overlay-hint{font-size:11px;color:var(--hud-dim);margin-top:16px;letter-spacing:.06em}
.btn-smoke{
  pointer-events:auto;min-width:160px;min-height:48px;padding:14px 32px;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:6px;cursor:pointer;
  box-shadow:0 4px 24px rgba(0,229,160,.25);transition:transform .12s ease,opacity .12s ease;
}
.btn-smoke:active{transform:scale(.96)}
.btn-smoke.hidden{display:none}
#gameover-panel{pointer-events:none}
#gameover-panel .btn-smoke{pointer-events:auto}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Fragments</span><span class="hud-val" id="score">0 / 15</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Sunrise</span><span class="hud-val" id="timer">60</span></div>
  </div>
  <div id="progress-wrap"><div id="progress-fill"></div></div>
  <div id="title-overlay" class="overlay">
    <div class="overlay-title">Ship by Sunrise</div>
    <div class="overlay-sub">Deploy thumb-sized agents into the fog. Snatch code fragments and stack your cargo before dawn breaks over the bay.</div>
    <button class="btn-smoke" data-smoke="start" id="btnStart">Deploy Agents</button>
    <div class="overlay-hint">Tap anywhere to launch · Space on desktop</div>
  </div>
  <div id="gameover-panel" class="overlay hidden">
    <div class="overlay-title" id="go-title">Shipped!</div>
    <div class="overlay-sub" id="go-sub">Your cargo cleared the harbor before sunrise.</div>
    <button class="btn-smoke" data-smoke="restart" id="btnRestart">Ship Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var GOAL = 15;
var ROUND_SEC = 60;
var MAX_AGENTS = 6;
var DEPLOY_CD = 280;

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var scoreEl = document.getElementById('score');
var timerEl = document.getElementById('timer');
var progFill = document.getElementById('progress-fill');
var btnStart = document.getElementById('btnStart');
var titleOverlay = document.getElementById('title-overlay');
var goPanel = document.getElementById('gameover-panel');
var goTitle = document.getElementById('go-title');
var goSub = document.getElementById('go-sub');
var btnRestart = document.getElementById('btnRestart');

var W = 0, H = 0, dpr = 1;
var state = 'title'; // title | playing | over
var score = 0;
var timeLeft = ROUND_SEC;
var elapsed = 0;
var lastDeploy = 0;
var ship = { x: 0, y: 0, w: 72, h: 36 };
var agents = [];
var fragments = [];
var particles = [];
var fog = [];
var ripples = [];
var glyphs = ['fn','{}','=>','0x','///','git','&&','npm','async','PR','fix','++','<<','::','if'];
var audioCtx = null;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.height = '100%';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ship.x = W * 0.5;
  ship.y = H - Math.max(56, H * 0.1);
}

function initAudio(){
  try{
    if(typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
  }catch(e){ audioCtx = null; }
}

function tone(freq, dur, vol){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function rand(a,b){ return a + Math.random() * (b - a); }
function clamp(v,lo,hi){ return v < lo ? lo : v > hi ? hi : v; }

function esc(){
  var fogD = 0.25 + elapsed / ROUND_SEC * 0.45;
  var spd = 1 + elapsed / ROUND_SEC * 1.2;
  var spawnRate = Math.max(1.8, 4.5 - elapsed / ROUND_SEC * 2.5);
  return { fogD: fogD, spd: spd, spawnRate: spawnRate };
}

function spawnFragment(){
  var e = esc();
  var margin = 40;
  var yRange = H * 0.15;
  fragments.push({
    x: rand(margin, W - margin),
    y: rand(yRange, H * 0.62),
    vx: rand(-18, 18) * e.spd,
    vy: rand(-12, 12) * e.spd,
    glyph: glyphs[Math.floor(Math.random() * glyphs.length)],
    pulse: Math.random() * Math.PI * 2,
    flicker: Math.random() * Math.PI * 2
  });
}

function initFog(){
  fog = [];
  for(var i = 0; i < 28; i++){
    fog.push({ x: Math.random(), y: Math.random(), r: rand(60, 180), vx: rand(-0.008, 0.008), vy: rand(-0.004, 0.004), a: rand(0.04, 0.14) });
  }
}

function initGame(){
  score = 0;
  timeLeft = ROUND_SEC;
  elapsed = 0;
  lastDeploy = 0;
  agents = [];
  fragments = [];
  particles = [];
  ripples = [];
  initFog();
  for(var i = 0; i < 6; i++) spawnFragment();
  updateHUD();
}

function updateHUD(){
  scoreEl.textContent = score + ' / ' + GOAL;
  var t = Math.ceil(timeLeft);
  timerEl.textContent = t;
  timerEl.classList.toggle('warn', t <= 15 && state === 'playing');
  progFill.style.width = (score / GOAL * 100) + '%';
}

function deployAgent(tx, ty){
  if(state !== 'playing') return;
  var now = performance.now();
  if(now - lastDeploy < DEPLOY_CD) return;
  if(agents.length >= MAX_AGENTS) return;
  lastDeploy = now;
  tone(440, 0.08, 0.04);
  vibrate(8);

  var nearest = null, nd = 99999;
  for(var i = 0; i < fragments.length; i++){
    var f = fragments[i];
    var d = (f.x - tx) * (f.x - tx) + (f.y - ty) * (f.y - ty);
    if(d < nd){ nd = d; nearest = f; }
  }

  agents.push({
    x: ship.x, y: ship.y - 10,
    tx: tx, ty: ty,
    target: nearest,
    phase: 'out',
    speed: rand(220, 280),
    glow: 1,
    trail: []
  });

  ripples.push({ x: ship.x, y: ship.y - 10, r: 4, life: 1 });
}

function burst(x, y, col){
  for(var i = 0; i < 10; i++){
    var a = Math.random() * Math.PI * 2;
    var s = rand(40, 140);
    particles.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, col: col || '#00e5a0', sz: rand(2, 5) });
  }
}

function collectFragment(f){
  var idx = fragments.indexOf(f);
  if(idx >= 0) fragments.splice(idx, 1);
  score++;
  updateHUD();
  tone(880, 0.1, 0.07);
  vibrate(18);
  burst(f.x, f.y, '#00e5a0');
  if(score >= GOAL){ endGame(true); return; }
  spawnFragment();
}

function endGame(won){
  state = 'over';
  goTitle.textContent = won ? 'Shipped!' : 'Sunrise';
  goSub.textContent = won
    ? 'Cargo stacked. ' + score + ' fragments cleared the harbor before dawn.'
    : 'Dawn broke over the bay. Only ' + score + ' of ' + GOAL + ' fragments aboard.';
  titleOverlay.classList.add('hidden');
  goPanel.classList.remove('hidden');
  tone(won ? 660 : 220, won ? 0.25 : 0.4, 0.08);
  if(won) vibrate([20, 40, 20]);
}

function startGame(){
  titleOverlay.classList.add('hidden');
  goPanel.classList.add('hidden');
  initGame();
  state = 'playing';
  tone(330, 0.15, 0.05);
}

function skyGradient(t){
  var dawn = 1 - timeLeft / ROUND_SEC;
  var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  if(isLight){
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, lerpColor('#8aabcc', '#c4daf0', dawn));
    g.addColorStop(0.55, lerpColor('#a8c0d8', '#ddeaf5', dawn));
    g.addColorStop(0.78, lerpColor('#d4a574', '#f0c890', dawn));
    g.addColorStop(1, lerpColor('#e87840', '#ffb060', dawn));
    return g;
  }
  var g2 = ctx.createLinearGradient(0, 0, 0, H);
  g2.addColorStop(0, lerpColor('#0a1628', '#1a2840', dawn));
  g2.addColorStop(0.5, lerpColor('#142238', '#283848', dawn));
  g2.addColorStop(0.72, lerpColor('#3a2840', '#584038', dawn));
  g2.addColorStop(0.85, lerpColor('#8a4028', '#b05030', dawn));
  g2.addColorStop(1, lerpColor('#c84820', '#e86030', dawn));
  return g2;
}

function lerpColor(a, b, t){
  t = clamp(t, 0, 1);
  var pa = hexRgb(a), pb = hexRgb(b);
  var r = pa[0] + (pb[0]-pa[0])*t;
  var g = pa[1] + (pb[1]-pa[1])*t;
  var bl = pa[2] + (pb[2]-pa[2])*t;
  return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(bl)+')';
}

function hexRgb(h){
  var n = parseInt(h.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}

function drawBay(){
  var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  ctx.fillStyle = isLight ? 'rgba(60,90,120,0.15)' : 'rgba(20,40,60,0.4)';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for(var i = 0; i <= 8; i++){
    var x = W * i / 8;
    var y = H * 0.78 + Math.sin(i * 1.2 + elapsed * 0.3) * 12;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  // bridge silhouette
  ctx.strokeStyle = isLight ? 'rgba(40,60,80,0.2)' : 'rgba(0,229,160,0.08)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  var bx = W * 0.5, by = H * 0.72;
  ctx.moveTo(bx - W*0.35, by + 20);
  ctx.quadraticCurveTo(bx, by - 30, bx + W*0.35, by + 20);
  ctx.stroke();
}

function drawShip(){
  var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  var sx = ship.x, sy = ship.y;
  ctx.save();
  ctx.translate(sx, sy);

  // hull
  ctx.fillStyle = isLight ? '#2a4058' : '#1a3050';
  ctx.beginPath();
  ctx.moveTo(-ship.w/2, 0);
  ctx.lineTo(ship.w/2, 0);
  ctx.lineTo(ship.w/2 - 8, 16);
  ctx.lineTo(-ship.w/2 + 8, 16);
  ctx.closePath();
  ctx.fill();

  // terminal window
  ctx.fillStyle = isLight ? '#007a55' : '#00e5a0';
  ctx.globalAlpha = 0.15 + (score/GOAL)*0.35;
  ctx.fillRect(-28, -18, 56, 22);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = isLight ? '#007a55' : '#00e5a0';
  ctx.lineWidth = 1;
  ctx.strokeRect(-28, -18, 56, 22);

  ctx.fillStyle = isLight ? '#007a55' : '#00e5a0';
  ctx.font = '10px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('cargo:' + score, 0, -5);

  // stacked blocks
  for(var i = 0; i < Math.min(score, 8); i++){
    ctx.fillStyle = isLight ? '#005c41' : '#00b87a';
    ctx.fillRect(-24 + (i%4)*13, -16 - Math.floor(i/4)*8, 10, 6);
  }

  ctx.restore();
}

function drawFragments(dt, e){
  var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  var col = isLight ? '#007a55' : '#00e5a0';
  for(var i = 0; i < fragments.length; i++){
    var f = fragments[i];
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.pulse += dt * 3;
    f.flicker += dt * 2;
    if(f.x < 30 || f.x > W-30) f.vx *= -1;
    if(f.y < H*0.12 || f.y > H*0.68) f.vy *= -1;

    var fogHide = e.fogD * 0.5;
    var alpha = (0.85 + Math.sin(f.pulse)*0.15) * (1 - fogHide * (0.5 + Math.sin(f.flicker)*0.5));
    alpha = clamp(alpha, 0.06, 1);
    var glow = 8 + Math.sin(f.pulse)*4;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = col;
    ctx.shadowBlur = glow;
    ctx.fillStyle = col;
    ctx.font = 'bold ' + (14 + Math.sin(f.pulse)*2) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.glyph, f.x, f.y);

    // bracket decoration
    ctx.globalAlpha = alpha * 0.4;
    ctx.font = '11px ui-monospace, Menlo, monospace';
    ctx.fillText('[ ]', f.x, f.y + 16);
    ctx.restore();
  }
}

function drawAgents(dt){
  var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  var col = isLight ? '#007a55' : '#00e5a0';

  for(var i = agents.length - 1; i >= 0; i--){
    var a = agents[i];
    var destX, destY;

    if(a.phase === 'out'){
      if(a.target && fragments.indexOf(a.target) >= 0){
        destX = a.target.x; destY = a.target.y;
        var dd = Math.hypot(destX - a.x, destY - a.y);
        if(dd < 18){
          a.phase = 'grab';
          a.hold = 0.12;
          collectFragment(a.target);
          a.target = null;
        }
      } else {
        destX = a.tx; destY = a.ty;
        var dd2 = Math.hypot(destX - a.x, destY - a.y);
        if(dd2 < 12){
          a.phase = 'back';
          a.target = null;
        }
      }
    } else if(a.phase === 'grab'){
      a.hold -= dt;
      if(a.hold <= 0) a.phase = 'back';
      destX = a.x; destY = a.y;
    } else {
      destX = ship.x; destY = ship.y - 10;
      var dd3 = Math.hypot(destX - a.x, destY - a.y);
      if(dd3 < 14){
        agents.splice(i, 1);
        burst(a.x, a.y, col);
        continue;
      }
    }

    if(a.phase !== 'grab'){
      var dx = destX - a.x, dy = destY - a.y;
      var dist = Math.hypot(dx, dy) || 1;
      var spd = a.speed * (a.phase === 'back' ? 1.3 : 1);
      a.x += (dx/dist) * spd * dt;
      a.y += (dy/dist) * spd * dt;
    }

    if(!a.trail) a.trail = [];
    a.trail.push({ x: a.x, y: a.y, life: 1 });
    if(a.trail.length > 8) a.trail.shift();
    for(var ti = 0; ti < a.trail.length; ti++) a.trail[ti].life -= dt * 3;

    ctx.save();
    for(var tr = 0; tr < a.trail.length; tr++){
      var tp = a.trail[tr];
      ctx.globalAlpha = tp.life * 0.25;
      ctx.fillStyle = col;
      ctx.fillRect(tp.x - 3, tp.y - 3, 6, 6);
    }
    ctx.globalAlpha = 0.9;
    ctx.shadowColor = col;
    ctx.shadowBlur = 12;
    ctx.fillStyle = col;
    ctx.fillRect(a.x - 5, a.y - 5, 10, 10);
    ctx.fillStyle = isLight ? '#fff' : '#0a1628';
    ctx.globalAlpha = 1;
    ctx.font = '8px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('>', a.x, a.y);
    ctx.restore();
  }
}

function drawFog(e){
  var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  for(var i = 0; i < fog.length; i++){
    var p = fog[i];
    var alpha = p.a * (0.5 + e.fogD);
    var grd = ctx.createRadialGradient(p.x*W, p.y*H, 0, p.x*W, p.y*H, p.r);
    grd.addColorStop(0, isLight ? 'rgba(255,255,255,'+alpha+')' : 'rgba(180,210,230,'+alpha+')');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(p.x*W - p.r, p.y*H - p.r, p.r*2, p.r*2);
  }
}

function drawParticles(dt){
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 80 * dt;
    p.life -= dt * 2.5;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
}

function drawRipples(dt){
  for(var i = ripples.length - 1; i >= 0; i--){
    var r = ripples[i];
    r.r += 60 * dt;
    r.life -= dt * 1.5;
    if(r.life <= 0){ ripples.splice(i,1); continue; }
    ctx.strokeStyle = 'rgba(0,229,160,'+(r.life*0.4)+')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
    ctx.stroke();
  }
}

function update(dt){
  if(state === 'playing'){
    elapsed += dt;
    timeLeft -= dt;
    updateHUD();
    if(timeLeft <= 0) endGame(false);

    // spawn maintenance
    var e = esc();
    if(fragments.length < 5 && Math.random() < dt * e.spawnRate) spawnFragment();
  }

  for(var i = 0; i < fog.length; i++){
    var p = fog[i];
    p.x += p.vx * dt * (0.3 + esc().fogD * 0.2);
    p.y += p.vy * dt * (0.3 + esc().fogD * 0.2);
    if(p.x < -0.1) p.x = 1.1;
    if(p.x > 1.1) p.x = -0.1;
    if(p.y < -0.1) p.y = 1.1;
    if(p.y > 1.1) p.y = -0.1;
  }
}

function draw(dt){
  var e = esc();
  ctx.fillStyle = skyGradient();
  ctx.fillRect(0, 0, W, H);
  drawBay();
  if(state === 'playing' || state === 'over'){
    drawFragments(dt, e);
    drawAgents(dt);
  } else {
    // idle title animation
    for(var i = 0; i < 4; i++){
      var fx = W*0.5 + Math.sin(elapsed*0.5 + i*1.5)*W*0.25;
      var fy = H*0.35 + Math.cos(elapsed*0.4 + i)*H*0.08;
      ctx.globalAlpha = 0.3 + Math.sin(elapsed + i)*0.15;
      ctx.fillStyle = '#00e5a0';
      ctx.font = '14px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(glyphs[i], fx, fy);
    }
    ctx.globalAlpha = 1;
  }
  drawFog(e);
  drawShip();
  renderRipples();
  renderParticles();
}

function renderParticles(){
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
}

function renderRipples(){
  for(var i = 0; i < ripples.length; i++){
    var r = ripples[i];
    ctx.strokeStyle = 'rgba(0,229,160,'+(r.life*0.4)+')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
    ctx.stroke();
  }
}

var lastT = 0;
var accSpawn = 0;

function loop(t){
  if(!lastT) lastT = t;
  var dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  if(state === 'title') elapsed += dt;

  update(dt);

  if(state === 'playing'){
    var e2 = esc();
    accSpawn += dt;
    if(accSpawn > 1/e2.spawnRate && fragments.length < 8){
      spawnFragment();
      accSpawn = 0;
    }
  }

  drawRipples(dt);
  drawParticles(dt);
  draw(dt);
  requestAnimationFrame(loop);
}

function pointerPos(ev){
  var rect = canvas.getBoundingClientRect();
  var cx = ev.clientX != null ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : W/2);
  var cy = ev.clientY != null ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : H/2);
  return { x: cx - rect.left, y: cy - rect.top };
}

function onTap(ev){
  if(ev.cancelable) ev.preventDefault();
  var p = pointerPos(ev);
  if(state === 'playing') deployAgent(p.x, p.y);
}

canvas.addEventListener('touchstart', onTap, { passive: false });
canvas.addEventListener('click', function(ev){
  if(state === 'playing'){ ev.preventDefault(); onTap(ev); }
});

document.addEventListener('keydown', function(ev){
  if(ev.code === 'Space'){
    ev.preventDefault();
    if(state === 'playing') deployAgent(W*0.5, H*0.35);
  }
});

btnStart.addEventListener('click', function(ev){
  ev.stopPropagation();
  startGame();
});

btnRestart.addEventListener('click', function(ev){
  ev.stopPropagation();
  startGame();
});

window.addEventListener('resize', resize);
initAudio();
resize();
initFog();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
