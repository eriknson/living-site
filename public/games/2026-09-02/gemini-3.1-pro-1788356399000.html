<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Neural Sky</title>
    <style>
        :root {
            --bg-color: #080c16;
            --text-color: #ffffff;
            --accent: #48e5c2;
            --accent-glow: rgba(72, 229, 194, 0.6);
            --surface: rgba(8, 12, 22, 0.85);
            --danger: #f34213;
            --cloud-rgb: 20, 30, 45;
            --node-color: #ffffff;
            --faint-line: rgba(255, 255, 255, 0.15);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #e2e8f0;
                --text-color: #0f172a;
                --accent: #0284c7;
                --accent-glow: rgba(2, 132, 199, 0.6);
                --surface: rgba(226, 232, 240, 0.85);
                --danger: #ef4444;
                --cloud-rgb: 240, 245, 250;
                --node-color: #1e293b;
                --faint-line: rgba(30, 41, 59, 0.15);
            }
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            color: var(--text-color);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #hud {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            box-sizing: border-box;
            padding: env(safe-area-inset-top, 20px) 20px 20px 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .screen {
            pointer-events: none; /* Allows clicks to pass to canvas */
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 1.5rem;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--faint-line);
            max-width: 85%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: opacity 0.3s ease;
        }

        h1 {
            margin: 0 0 1rem 0;
            font-size: 2.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        button {
            pointer-events: auto; /* Re-enable clicks exclusively for buttons */
            background: var(--accent);
            color: #000000;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, filter 0.2s;
            width: 100%;
            max-width: 250px;
        }

        @media (prefers-color-scheme: light) {
            button { color: #ffffff; }
        }

        button:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }

        .hidden { display: none !important; }
        
        #timeContainer {
            transition: color 0.2s, transform 0.1s;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer" class="overlay">
        <div id="hud" class="hidden">
            <div>CONST: <span id="scoreDisplay">0</span></div>
            <div id="timeContainer">SYNC: <span id="timeDisplay">30.0</span>s</div>
        </div>

        <div id="startMenu" class="screen">
            <h1>NEURAL SKY</h1>
            <p>Hold to charge the link.<br>Match the exact distance to connect nodes.<br>Do not overshoot.</p>
            <button id="startBtn" data-smoke="start">START LINK</button>
        </div>

        <div id="gameOverMenu" class="screen hidden">
            <h1>CONNECTION LOST</h1>
            <p>Constellations synced: <span id="finalScore">0</span></p>
            <button id="restartBtn" data-smoke="restart">RECONNECT</button>
        </div>
    </div>

    <script>
        // --- Globals & State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let state = 'MENU'; // MENU, PLAYING, TRANSITION, GAMEOVER
        let colors = {};
        let bgStars = [];
        
        let nodes = [];
        let connectedLinks = [];
        let currentNodeIndex = 0;
        let clouds = [];
        let particles = [];
        let floatingTexts = [];
        
        let score = 0;
        let level = 1;
        let timeLeft = 30.0;
        let flashAlpha = 0;
        
        let isHolding = false;
        let beamLength = 0;
        
        let lastTime = performance.now();
        
        // --- Audio System ---
        let audioCtx = null;
        let chargeOsc = null;
        let chargeGain = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChargeSound() {
            if (!audioCtx) return;
            chargeOsc = audioCtx.createOscillator();
            chargeGain = audioCtx.createGain();
            chargeOsc.type = 'triangle';
            chargeOsc.frequency.setValueAtTime(200, audioCtx.currentTime);
            chargeOsc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 1.5);
            chargeGain.gain.setValueAtTime(0, audioCtx.currentTime);
            chargeGain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.1);
            chargeOsc.connect(chargeGain);
            chargeGain.connect(audioCtx.destination);
            chargeOsc.start();
        }

        function stopChargeSound() {
            if (chargeOsc && chargeGain && audioCtx) {
                chargeGain.gain.cancelScheduledValues(audioCtx.currentTime);
                chargeGain.gain.setValueAtTime(chargeGain.gain.value, audioCtx.currentTime);
                chargeGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                chargeOsc.stop(audioCtx.currentTime + 0.1);
                chargeOsc = null;
                chargeGain = null;
            }
        }

        function playHitSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const notes = [440, 493.88, 554.37, 659.25, 739.99, 880];
            const freq = notes[currentNodeIndex % notes.length];
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function playMissSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playCompleteSound() {
            if (!audioCtx) return;
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.1 + i*0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.0);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.0);
            });
        }

        // --- Core Logic ---
        function updateColors() {
            const style = getComputedStyle(document.documentElement);
            colors.bg = style.getPropertyValue('--bg-color').trim();
            colors.accent = style.getPropertyValue('--accent').trim();
            colors.accentGlow = style.getPropertyValue('--accent-glow').trim();
            colors.danger = style.getPropertyValue('--danger').trim();
            colors.node = style.getPropertyValue('--node-color').trim();
            colors.faint = style.getPropertyValue('--faint-line').trim();
            colors.cloudRGB = style.getPropertyValue('--cloud-rgb').trim();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            bgStars = [];
            for (let i = 0; i < 150; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        }

        function spawnParticles(x, y, color, count, speedFactor = 1) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 300 * speedFactor,
                    vy: (Math.random() - 0.5) * 300 * speedFactor,
                    life: 1.0,
                    color
                });
            }
        }

        function generateConstellation(lvl) {
            const numNodes = Math.min(3 + Math.floor(lvl / 2), 7);
            const newNodes = [];
            const margin = 60;
            for (let i = 0; i < numNodes; i++) {
                let x, y, valid = false, attempts = 0;
                while (!valid && attempts < 100) {
                    x = margin + Math.random() * (canvas.width - margin * 2);
                    y = margin + Math.random() * (canvas.height - margin * 2);
                    valid = true;
                    for (let j = 0; j < newNodes.length; j++) {
                        if (Math.hypot(newNodes[j].x - x, newNodes[j].y - y) < 120) {
                            valid = false;
                            break;
                        }
                    }
                    attempts++;
                }
                let vx = 0, vy = 0;
                if (lvl > 1) {
                    const speed = Math.min((lvl - 1) * 15, 60);
                    const angle = Math.random() * Math.PI * 2;
                    vx = Math.cos(angle) * speed;
                    vy = Math.sin(angle) * speed;
                }
                newNodes.push({ x, y, vx, vy, radius: 15 });
            }
            return newNodes;
        }

        function generateLevel() {
            nodes = generateConstellation(level);
            connectedLinks = [];
            currentNodeIndex = 0;
            beamLength = 0;
            isHolding = false;
            particles = [];
            clouds = [];
        }

        function startGame() {
            initAudio();
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            state = 'PLAYING';
            score = 0;
            level = 1;
            timeLeft = 30.0;
            generateLevel();
        }

        function gameOver() {
            state = 'GAMEOVER';
            isHolding = false;
            stopChargeSound();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function checkConnection() {
            if (state !== 'PLAYING') return;
            const source = nodes[currentNodeIndex];
            const target = nodes[currentNodeIndex + 1];
            const dist = Math.hypot(target.x - source.x, target.y - source.y);
            const tolerance = target.radius + 15; // Visual window is radius 30
            
            const tipX = source.x + Math.cos(Math.atan2(target.y - source.y, target.x - source.x)) * beamLength;
            const tipY = source.y + Math.sin(Math.atan2(target.y - source.y, target.x - source.x)) * beamLength;
            
            if (Math.abs(beamLength - dist) <= tolerance) {
                // HIT
                playHitSound();
                spawnParticles(target.x, target.y, colors.accent, 20);
                if (navigator.vibrate) navigator.vibrate(20);
                
                connectedLinks.push({ a: currentNodeIndex, b: currentNodeIndex + 1 });
                currentNodeIndex++;
                timeLeft = Math.min(timeLeft + 2.5, 60.0);
                
                if (currentNodeIndex === nodes.length - 1) {
                    playCompleteSound();
                    state = 'TRANSITION';
                    score++;
                    timeLeft = Math.min(timeLeft + 8.0, 60.0);
                    flashAlpha = 1.0;
                    
                    setTimeout(() => {
                        level = Math.floor(score / 2) + 1;
                        generateLevel();
                        state = 'PLAYING';
                    }, 1200);
                }
            } else {
                // MISS
                playMissSound();
                if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                spawnParticles(tipX, tipY, colors.danger, 30, 2);
                timeLeft -= 3.0;
                floatingTexts.push({ x: tipX, y: tipY - 20, text: "-3s", life: 1.2 });
            }
            beamLength = 0;
        }

        function handlePointerDown(e) {
            if (e.target !== canvas || state !== 'PLAYING' || isHolding) return;
            initAudio();
            isHolding = true;
            beamLength = 0;
            playChargeSound();
        }

        function handlePointerUp(e) {
            if (state !== 'PLAYING') return;
            if (isHolding) {
                isHolding = false;
                stopChargeSound();
                checkConnection();
            }
        }

        // --- Input Listeners ---
        canvas.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointerup', handlePointerUp);
        
        // Prevent gestures strictly on canvas
        canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('touchmove', (e) => {
            if (e.target === canvas) e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                if (state === 'MENU') { document.getElementById('startBtn').click(); }
                else if (state === 'GAMEOVER') { document.getElementById('restartBtn').click(); }
                else if (state === 'PLAYING' && !isHolding) { handlePointerDown({ target: canvas }); }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handlePointerUp();
            }
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
        window.addEventListener('resize', resizeCanvas);

        // --- Update & Draw ---
        function update(dt) {
            if (state === 'PLAYING' || state === 'TRANSITION') {
                if (state === 'PLAYING') {
                    timeLeft -= dt;
                    if (timeLeft <= 0) {
                        timeLeft = 0;
                        gameOver();
                        return;
                    }
                }
                
                const tc = document.getElementById('timeContainer');
                if (timeLeft <= 5.0) {
                    tc.style.color = colors.danger;
                    tc.style.transform = `scale(${1 + Math.sin(performance.now() * 0.03) * 0.15})`;
                } else {
                    tc.style.color = 'inherit';
                    tc.style.transform = 'scale(1)';
                }
                document.getElementById('timeDisplay').innerText = timeLeft.toFixed(1);
                document.getElementById('scoreDisplay').innerText = score;

                // Drift nodes
                const margin = 30;
                nodes.forEach(n => {
                    n.x += n.vx * dt;
                    n.y += n.vy * dt;
                    if (n.x < margin) { n.x = margin; n.vx *= -1; }
                    if (n.x > canvas.width - margin) { n.x = canvas.width - margin; n.vx *= -1; }
                    if (n.y < margin) { n.y = margin; n.vy *= -1; }
                    if (n.y > canvas.height - margin) { n.y = canvas.height - margin; n.vy *= -1; }
                });

                // Clouds
                if (level >= 3 && state === 'PLAYING') {
                    if (Math.random() < 0.2 * dt * (level - 2) && clouds.length < 5) {
                        clouds.push({
                            x: Math.random() > 0.5 ? -150 : canvas.width + 150,
                            y: Math.random() * canvas.height,
                            vx: (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 40),
                            radius: 150 + Math.random() * 150,
                            opacity: Math.min(0.4 + level * 0.05, 0.85)
                        });
                    }
                }
                for (let i = clouds.length - 1; i >= 0; i--) {
                    clouds[i].x += clouds[i].vx * dt;
                    if (clouds[i].x < -300 || clouds[i].x > canvas.width + 300) clouds.splice(i, 1);
                }

                // Growth limit auto-fail
                if (isHolding && state === 'PLAYING') {
                    beamLength += (400 + level * 30) * dt;
                    const source = nodes[currentNodeIndex];
                    const target = nodes[currentNodeIndex + 1];
                    const dist = Math.hypot(target.x - source.x, target.y - source.y);
                    const tolerance = target.radius + 15;
                    
                    if (beamLength > dist + tolerance) {
                        isHolding = false;
                        stopChargeSound();
                        checkConnection();
                    }
                }
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2.5;
                if (p.life <= 0) particles.splice(i, 1);
            }
            
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 40 * dt;
                ft.life -= dt;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }
            
            if (flashAlpha > 0) flashAlpha -= dt * 1.5;
        }

        function draw() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const timeSec = performance.now() / 1000;

            // Background Stars
            ctx.fillStyle = colors.faint;
            bgStars.forEach(s => {
                ctx.globalAlpha = Math.max(0, 0.3 + Math.sin(s.twinkle + timeSec * 1.5) * 0.3);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Auroras
            ctx.lineWidth = 40;
            ctx.strokeStyle = colors.accent;
            ctx.globalAlpha = 0.04;
            ctx.beginPath();
            for (let x = 0; x <= canvas.width + 50; x += 50) {
                let y = canvas.height * 0.4 + Math.sin(x * 0.004 + timeSec * 0.3) * 120;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.beginPath();
            for (let x = 0; x <= canvas.width + 50; x += 50) {
                let y = canvas.height * 0.8 + Math.cos(x * 0.003 - timeSec * 0.2) * 100;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;

            // Clouds (drawn behind nodes to obscure them softly)
            clouds.forEach(c => {
                const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.radius);
                grad.addColorStop(0, `rgba(${colors.cloudRGB}, ${c.opacity})`);
                grad.addColorStop(1, `rgba(${colors.cloudRGB}, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            if (nodes.length > 0) {
                // Faint Constellation Path
                ctx.strokeStyle = colors.faint;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < nodes.length - 1; i++) {
                    ctx.moveTo(nodes[i].x, nodes[i].y);
                    ctx.lineTo(nodes[i + 1].x, nodes[i + 1].y);
                }
                ctx.stroke();

                // Connected Links
                ctx.strokeStyle = colors.accent;
                ctx.lineWidth = 4;
                ctx.shadowColor = colors.accentGlow;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                connectedLinks.forEach(link => {
                    ctx.moveTo(nodes[link.a].x, nodes[link.a].y);
                    ctx.lineTo(nodes[link.b].x, nodes[link.b].y);
                });
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Beam
                if (isHolding && state === 'PLAYING') {
                    const source = nodes[currentNodeIndex];
                    const target = nodes[currentNodeIndex + 1];
                    const angle = Math.atan2(target.y - source.y, target.x - source.x);
                    const tipX = source.x + Math.cos(angle) * beamLength;
                    const tipY = source.y + Math.sin(angle) * beamLength;
                    
                    ctx.shadowColor = colors.accentGlow;
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.moveTo(source.x, source.y);
                    ctx.lineTo(tipX, tipY);
                    ctx.strokeStyle = colors.accent;
                    ctx.lineWidth = 5;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                }

                // Nodes
                nodes.forEach((n, i) => {
                    ctx.strokeStyle = colors.node;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);
                    ctx.stroke();

                    // Target Visual Tolerance Ring
                    if (i === currentNodeIndex + 1 && state === 'PLAYING') {
                        const pulse = 1 + Math.sin(timeSec * 6) * 0.05;
                        ctx.beginPath();
                        ctx.arc(n.x, n.y, (n.radius + 15) * pulse, 0, Math.PI * 2);
                        ctx.strokeStyle = colors.accent;
                        ctx.setLineDash([6, 6]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }

                    // Source Highlight
                    if (i === currentNodeIndex && state === 'PLAYING') {
                        ctx.beginPath();
                        ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
                        ctx.fillStyle = colors.accent;
                        ctx.fill();
                    }
                });
            }

            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.font = "bold 24px ui-monospace, 'SFMono-Regular', Menlo, monospace";
            ctx.textAlign = "center";
            floatingTexts.forEach(ft => {
                ctx.globalAlpha = Math.max(0, ft.life);
                ctx.fillStyle = colors.danger;
                ctx.fillText(ft.text, ft.x, ft.y);
            });
            ctx.globalAlpha = 1.0;

            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function loop(time) {
            requestAnimationFrame(loop);
            let dt = (time - lastTime) / 1000;
            lastTime = time;
            if (dt > 0.1) dt = 0.1;
            
            update(dt);
            draw();
        }

        // --- Initialization ---
        updateColors();
        resizeCanvas();
        generateLevel(); // Generate a demo constellation for the background
        requestAnimationFrame(loop);
    </script>
</body>
</html>
