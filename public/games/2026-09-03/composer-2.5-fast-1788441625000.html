<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Harbor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#c8cdd2;
  --bg-deep:#aeb4ba;
  --fog-a:rgba(255,255,255,.35);
  --fog-b:rgba(255,255,255,.22);
  --fog-c:rgba(255,255,255,.12);
  --hud:#2a3038;
  --hud-dim:#5a6470;
  --accent:#00bcd4;
  --accent-glow:rgba(0,188,212,.45);
  --warn:#c45c3a;
  --overlay:rgba(200,205,210,.9);
  --btn-bg:#2a3038;
  --btn-text:#f0f2f4;
  --lane-line:rgba(42,48,56,.12);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1e24;
    --bg-deep:#0e1116;
    --fog-a:rgba(180,190,200,.08);
    --fog-b:rgba(180,190,200,.05);
    --fog-c:rgba(180,190,200,.03);
    --hud:#d8dde3;
    --hud-dim:#7a8490;
    --accent:#00e5ff;
    --accent-glow:rgba(0,229,255,.5);
    --warn:#ff7043;
    --overlay:rgba(14,17,22,.88);
    --btn-bg:#00e5ff;
    --btn-text:#0e1116;
    --lane-line:rgba(216,221,227,.08);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
canvas{display:block;width:100%;flex:1;touch-action:none}
#hud{
  position:absolute;top:0;left:0;right:0;
  padding:max(10px,env(safe-area-inset-top)) 14px 6px;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;z-index:2;
}
.hud-col{display:flex;flex-direction:column;gap:1px}
.hud-col.center{align-items:center}
.hud-col.right{align-items:flex-end}
.hud-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--hud-dim)}
.hud-val{font-size:17px;color:var(--hud);font-variant-numeric:tabular-nums;line-height:1.2}
.hud-val.accent{color:var(--accent)}
.hud-val.warn{color:var(--warn)}
#combo-bar{
  position:absolute;top:max(48px,calc(env(safe-area-inset-top)+36px));left:50%;transform:translateX(-50%);
  display:flex;gap:5px;pointer-events:none;z-index:2;
}
.combo-dot{
  width:8px;height:8px;border-radius:50%;border:1.5px solid var(--hud-dim);
  transition:background .15s,box-shadow .15s,transform .15s;
}
.combo-dot.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px var(--accent-glow);transform:scale(1.15)}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--overlay);z-index:10;pointer-events:none;padding:24px;text-align:center;
}
.overlay.hidden{display:none}
.overlay-title{font-size:clamp(20px,5.5vw,30px);color:var(--hud);letter-spacing:-.02em;margin-bottom:8px;font-weight:600}
.overlay-sub{font-size:clamp(11px,3vw,13px);color:var(--hud-dim);max-width:300px;line-height:1.55;margin-bottom:24px}
.overlay-hint{font-size:10px;color:var(--hud-dim);margin-top:14px;letter-spacing:.05em}
.btn-smoke{
  pointer-events:auto;min-width:168px;min-height:48px;padding:14px 28px;
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:6px;cursor:pointer;
  transition:transform .1s ease,opacity .1s ease;
}
.btn-smoke:active{transform:scale(.96)}
#harmony-flash{
  position:absolute;inset:0;background:var(--accent-glow);opacity:0;pointer-events:none;z-index:5;
  transition:opacity .08s ease;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="harmony-flash"></div>
  <div id="hud">
    <div class="hud-col"><span class="hud-lbl">Caught</span><span class="hud-val" id="score">0</span></div>
    <div class="hud-col center"><span class="hud-lbl">Lane Chain</span><span class="hud-val accent" id="chain">0</span></div>
    <div class="hud-col right"><span class="hud-lbl">Fog · Lives</span><span class="hud-val" id="timer">45 · ●●●</span></div>
  </div>
  <div id="combo-bar">
    <div class="combo-dot" id="cd0"></div>
    <div class="combo-dot" id="cd1"></div>
    <div class="combo-dot" id="cd2"></div>
    <div class="combo-dot" id="cd3"></div>
    <div class="combo-dot" id="cd4"></div>
  </div>
  <div id="title-overlay" class="overlay">
    <div class="overlay-title">Fog Harbor</div>
    <div class="overlay-sub">Swipe between three fog layers. Intercept drifting open-source orbs before they dissolve into the gray bay.</div>
    <button class="btn-smoke" data-smoke="start" id="btnStart">Enter the Fog</button>
    <div class="overlay-hint">Swipe ← → · Arrow keys on desktop</div>
  </div>
  <div id="gameover-panel" class="overlay hidden">
    <div class="overlay-title" id="go-title">Dissolved</div>
    <div class="overlay-sub" id="go-sub">The orbs slipped into the bay.</div>
    <button class="btn-smoke" data-smoke="restart" id="btnRestart">Try Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var ROUND_SEC = 45;
var MAX_MISS = 3;
var COMBO_TARGET = 5;
var SWIPE_MIN = 36;
var LANES = 3;

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var scoreEl = document.getElementById('score');
var chainEl = document.getElementById('chain');
var timerEl = document.getElementById('timer');
var btnStart = document.getElementById('btnStart');
var btnRestart = document.getElementById('btnRestart');
var titleOverlay = document.getElementById('title-overlay');
var goPanel = document.getElementById('gameover-panel');
var goTitle = document.getElementById('go-title');
var goSub = document.getElementById('go-sub');
var harmonyFlash = document.getElementById('harmony-flash');
var comboDots = [
  document.getElementById('cd0'),
  document.getElementById('cd1'),
  document.getElementById('cd2'),
  document.getElementById('cd3'),
  document.getElementById('cd4')
];

var W = 0, H = 0, dpr = 1;
var laneW = 0;
var catchY = 0;
var state = 'title';
var score = 0;
var misses = 0;
var timeLeft = ROUND_SEC;
var elapsed = 0;
var playerLane = 1;
var laneOrder = [0, 1, 2];
var laneShuffleT = 0;
var laneShuffleAnim = 0;
var laneShuffleFrom = null;
var laneShuffleTo = null;

var player = { x: 0, y: 0, targetX: 0, scale: 1, flash: 0 };
var orbs = [];
var particles = [];
var fogPuffs = [];
var ripples = [];
var windStreaks = [];
var spawnTimer = 0;
var baseSpeed = 90;
var difficulty = 0;
var laneChain = 0;
var lastCatchLane = -1;
var hitPause = 0;
var shakeT = 0;
var harmonyPulse = 0;

var touchStartX = 0;
var touchStartY = 0;
var audioCtx = null;
var darkMode = false;

var ORB_LABELS = ['MIT','GPL','Apache','BSD','Rust','Go','npm','git','Py','JS','TS','wasm','LLVM','CUDA','HF'];
var ORB_HUES = [180, 185, 175, 190, 178, 182, 188, 176, 183, 179, 186, 181, 177, 184, 187];

function prefersDark(){
  try { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  catch(e){ return false; }
}

function cssVar(name){
  try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  catch(e){ return '#888'; }
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 320;
  H = window.innerHeight || 480;
  canvas.width = Math.max(1, W * dpr);
  canvas.height = Math.max(1, H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  laneW = W / LANES;
  catchY = H * 0.78;
  player.y = catchY;
  updatePlayerTarget(true);
  initFog();
}

function initFog(){
  fogPuffs = [];
  for(var i = 0; i < 28; i++){
    fogPuffs.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 40 + Math.random() * 80,
      layer: Math.floor(Math.random() * 3),
      spd: 8 + Math.random() * 18,
      alpha: 0.04 + Math.random() * 0.08
    });
  }
}

function laneCenter(laneIdx){
  var visual = laneOrder.indexOf(laneIdx);
  if(visual < 0) visual = laneIdx;
  if(laneShuffleAnim > 0 && laneShuffleFrom && laneShuffleTo){
    var fi = laneShuffleFrom.indexOf(laneIdx);
    var ti = laneShuffleTo.indexOf(laneIdx);
    if(fi >= 0 && ti >= 0){
      visual = fi + (ti - fi) * (1 - laneShuffleAnim);
    }
  }
  return (visual + 0.5) * laneW;
}

function updatePlayerTarget(instant){
  player.targetX = laneCenter(playerLane);
  if(instant) player.x = player.targetX;
}

function getAudio(){
  if(!audioCtx){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if(typeof AC !== 'undefined') audioCtx = new AC();
    } catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    try { audioCtx.resume(); } catch(e){}
  }
  return audioCtx;
}

function playTone(freq, dur, vol, type){
  var ac = getAudio();
  if(!ac) return;
  try {
    var t = ac.currentTime;
    var osc = ac.createOscillator();
    var g = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.08, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g);
    g.connect(ac.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  } catch(e){}
}

function playCatchSound(){
  playTone(520 + Math.random() * 80, 0.12, 0.07, 'sine');
}

function playMissSound(){
  playTone(180, 0.25, 0.06, 'triangle');
}

function playHarmony(){
  var freqs = [261.6, 329.6, 392, 523.3, 659.3];
  for(var i = 0; i < freqs.length; i++){
    (function(f, delay){
      setTimeout(function(){ playTone(f, 0.6, 0.09, 'sine'); }, delay);
    })(freqs[i], i * 40);
  }
  try { navigator.vibrate && navigator.vibrate([20, 30, 40, 30, 60]); } catch(e){}
  harmonyFlash.style.opacity = '0.35';
  setTimeout(function(){ harmonyFlash.style.opacity = '0'; }, 180);
  harmonyPulse = 1;
}

function spawnOrb(){
  var lane = Math.floor(Math.random() * LANES);
  var labelIdx = Math.floor(Math.random() * ORB_LABELS.length);
  orbs.push({
    lane: lane,
    x: laneCenter(lane),
    y: -30,
    r: 16 + Math.random() * 4,
    speed: baseSpeed + difficulty * 22 + Math.random() * 20,
    label: ORB_LABELS[labelIdx],
    hue: ORB_HUES[labelIdx % ORB_HUES.length],
    dissolve: 1,
    wobble: Math.random() * Math.PI * 2,
    wind: 0,
    windTarget: 0,
    caught: false
  });
}

function addParticles(x, y, color, n){
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 120;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 30,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.8,
      color: color,
      r: 2 + Math.random() * 3
    });
  }
}

function addRipple(x, y){
  ripples.push({ x: x, y: y, r: 8, life: 0.5, maxLife: 0.5 });
}

function switchLane(dir){
  if(state !== 'playing') return;
  var next = playerLane + dir;
  if(next < 0 || next >= LANES) return;
  playerLane = next;
  updatePlayerTarget(false);
  playTone(300 + playerLane * 60, 0.06, 0.04, 'triangle');
}

function handleSwipe(dx){
  if(Math.abs(dx) < SWIPE_MIN) return;
  switchLane(dx > 0 ? 1 : -1);
}

function resetGame(){
  score = 0;
  misses = 0;
  timeLeft = ROUND_SEC;
  elapsed = 0;
  playerLane = 1;
  laneOrder = [0, 1, 2];
  laneShuffleT = 0;
  laneShuffleAnim = 0;
  orbs = [];
  particles = [];
  ripples = [];
  windStreaks = [];
  spawnTimer = 0;
  baseSpeed = 90;
  difficulty = 0;
  laneChain = 0;
  lastCatchLane = -1;
  hitPause = 0;
  shakeT = 0;
  harmonyPulse = 0;
  updatePlayerTarget(true);
  updateHUD();
}

function startGame(){
  resetGame();
  state = 'playing';
  titleOverlay.classList.add('hidden');
  goPanel.classList.add('hidden');
  getAudio();
}

function endGame(won){
  state = 'over';
  if(won){
    goTitle.textContent = 'Harbor Clear';
    goSub.textContent = 'You intercepted ' + score + ' orbs through the autumn fog.';
  } else if(misses >= MAX_MISS){
    goTitle.textContent = 'Dissolved';
    goSub.textContent = score + ' orbs saved · ' + misses + ' slipped into the bay.';
  } else {
    goTitle.textContent = 'Fog Lifts';
    goSub.textContent = score + ' orbs caught · Best chain: ' + laneChain;
  }
  goPanel.classList.remove('hidden');
}

function livesStr(){
  var s = '';
  for(var i = 0; i < MAX_MISS; i++) s += i < (MAX_MISS - misses) ? '●' : '○';
  return s;
}

function updateHUD(){
  scoreEl.textContent = String(score);
  chainEl.textContent = String(laneChain);
  timerEl.textContent = Math.ceil(timeLeft) + ' · ' + livesStr();
  timerEl.className = 'hud-val' + (timeLeft <= 10 || misses >= 2 ? ' warn' : '');
  for(var i = 0; i < COMBO_TARGET; i++){
    comboDots[i].className = 'combo-dot' + (i < laneChain ? ' on' : '');
  }
}

function triggerLaneShuffle(){
  laneShuffleFrom = laneOrder.slice();
  var a = Math.floor(Math.random() * 3);
  var b = (a + 1 + Math.floor(Math.random() * 2)) % 3;
  laneShuffleTo = laneOrder.slice();
  var tmp = laneShuffleTo[a];
  laneShuffleTo[a] = laneShuffleTo[b];
  laneShuffleTo[b] = tmp;
  laneShuffleAnim = 1;
  laneOrder = laneShuffleTo.slice();
  shakeT = 0.3;
  playTone(140, 0.3, 0.05, 'sawtooth');
}

function update(dt){
  if(state !== 'playing') return;
  if(hitPause > 0){ hitPause -= dt; return; }

  elapsed += dt;
  timeLeft = Math.max(0, ROUND_SEC - elapsed);
  if(timeLeft <= 0){ endGame(true); return; }

  difficulty = Math.min(1, elapsed / ROUND_SEC);
  var spawnInterval = Math.max(0.45, 1.1 - difficulty * 0.55);

  spawnTimer += dt;
  if(spawnTimer >= spawnInterval){
    spawnTimer = 0;
    spawnOrb();
    if(difficulty > 0.35 && Math.random() < 0.3) spawnOrb();
  }

  laneShuffleT += dt;
  if(laneShuffleT > 12 && laneShuffleAnim <= 0){
    laneShuffleT = 0;
    triggerLaneShuffle();
  }
  if(laneShuffleAnim > 0){
    laneShuffleAnim -= dt * 1.8;
    if(laneShuffleAnim <= 0){
      laneShuffleAnim = 0;
      laneShuffleFrom = null;
    }
    updatePlayerTarget(false);
  }

  player.x += (player.targetX - player.x) * Math.min(1, dt * 14);
  if(player.flash > 0) player.flash -= dt;

  var windChance = 0.015 + difficulty * 0.025;
  for(var i = orbs.length - 1; i >= 0; i--){
    var o = orbs[i];
    o.y += o.speed * dt;
    o.wobble += dt * 3;
    o.x = laneCenter(o.lane) + Math.sin(o.wobble) * 6 + o.wind;

    if(Math.random() < windChance * dt * 60){
      o.windTarget = (Math.random() - 0.5) * laneW * 0.35;
    }
    o.wind += (o.windTarget - o.wind) * dt * 2;

    if(Math.abs(o.wind) > laneW * 0.28){
      var shift = o.wind > 0 ? 1 : -1;
      var newLane = o.lane + shift;
      if(newLane >= 0 && newLane < LANES){
        o.lane = newLane;
        o.wind *= 0.2;
        o.windTarget *= 0.2;
        if(Math.random() < 0.4){
          windStreaks.push({
            x: o.x, y: o.y, len: 30 + Math.random() * 40,
            dir: shift, life: 0.35, maxLife: 0.35
          });
        }
      }
    }

    if(o.y > catchY - 10 && o.y < catchY + 30 && !o.caught){
      if(o.lane === playerLane){
        o.caught = true;
        score++;
        player.flash = 0.15;
        player.scale = 1.3;
        hitPause = 0.04;
        addParticles(o.x, o.y, cssVar('--accent') || '#00bcd4', 14);
        addRipple(o.x, catchY);
        playCatchSound();
        try { navigator.vibrate && navigator.vibrate(8); } catch(e){}

        if(lastCatchLane === playerLane){
          laneChain++;
        } else {
          laneChain = 1;
        }
        lastCatchLane = playerLane;

        if(laneChain >= COMBO_TARGET){
          playHarmony();
          laneChain = 0;
          lastCatchLane = -1;
          score += 3;
        }
        updateHUD();
        orbs.splice(i, 1);
        continue;
      }
    }

    if(o.y > catchY + 50 && !o.caught && o.dissolve > 0){
      o.dissolve -= dt * 2.5;
      o.y += 20 * dt;
      if(o.dissolve <= 0){
        misses++;
        addRipple(o.x, H - 20);
        playMissSound();
        shakeT = 0.2;
        laneChain = 0;
        lastCatchLane = -1;
        updateHUD();
        if(misses >= MAX_MISS){ endGame(false); return; }
        orbs.splice(i, 1);
      }
      continue;
    }

    if(o.y > H + 40){
      orbs.splice(i, 1);
    }
  }

  player.scale += (1 - player.scale) * Math.min(1, dt * 10);

  for(var j = particles.length - 1; j >= 0; j--){
    var p = particles[j];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 80 * dt;
    if(p.life <= 0) particles.splice(j, 1);
  }

  for(var k = ripples.length - 1; k >= 0; k--){
    ripples[k].life -= dt;
    ripples[k].r += 60 * dt;
    if(ripples[k].life <= 0) ripples.splice(k, 1);
  }

  for(var w = windStreaks.length - 1; w >= 0; w--){
    windStreaks[w].life -= dt;
    windStreaks[w].x += windStreaks[w].dir * 80 * dt;
    if(windStreaks[w].life <= 0) windStreaks.splice(w, 1);
  }

  for(var f = 0; f < fogPuffs.length; f++){
    var fp = fogPuffs[f];
    fp.x += fp.spd * dt;
    if(fp.x > W + fp.r) fp.x = -fp.r;
  }

  if(shakeT > 0) shakeT -= dt;
  if(harmonyPulse > 0) harmonyPulse -= dt * 0.8;
}

function drawBg(){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, cssVar('--bg') || '#c8cdd2');
  g.addColorStop(1, cssVar('--bg-deep') || '#aeb4ba');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for(var layer = 0; layer < 3; layer++){
    var bandTop = layer * (H / 3);
    var bandH = H / 3;
    var fogColor = layer === 0 ? cssVar('--fog-a') : (layer === 1 ? cssVar('--fog-b') : cssVar('--fog-c'));
    ctx.fillStyle = fogColor || 'rgba(255,255,255,.2)';
    ctx.fillRect(0, bandTop, W, bandH);
  }

  ctx.strokeStyle = cssVar('--lane-line') || 'rgba(0,0,0,.1)';
  ctx.lineWidth = 1;
  for(var li = 1; li < LANES; li++){
    var lx = li * laneW;
    if(laneShuffleAnim > 0 && laneShuffleFrom){
      var fromX = li * laneW;
      ctx.save();
      ctx.setLineDash([4, 8]);
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(fromX, 0);
      ctx.lineTo(fromX, H);
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, H);
      ctx.stroke();
    }
  }

  var bayY = H * 0.88;
  ctx.fillStyle = darkMode ? 'rgba(100,110,120,.25)' : 'rgba(80,90,100,.18)';
  ctx.fillRect(0, bayY, W, H - bayY);
  ctx.strokeStyle = darkMode ? 'rgba(140,150,160,.2)' : 'rgba(60,70,80,.15)';
  ctx.beginPath();
  for(var wx = 0; wx <= W; wx += 12){
    var wy = bayY + Math.sin(wx * 0.03 + elapsed * 1.5) * 3;
    if(wx === 0) ctx.moveTo(wx, wy);
    else ctx.lineTo(wx, wy);
  }
  ctx.stroke();
}

function drawFog(){
  for(var i = 0; i < fogPuffs.length; i++){
    var fp = fogPuffs[i];
    var alpha = fp.alpha * (0.6 + fp.layer * 0.2);
    ctx.fillStyle = darkMode ? 'rgba(200,210,220,' + alpha + ')' : 'rgba(255,255,255,' + alpha + ')';
    ctx.beginPath();
    ctx.arc(fp.x, fp.y, fp.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawWindStreaks(){
  ctx.strokeStyle = darkMode ? 'rgba(180,195,210,.25)' : 'rgba(80,90,100,.2)';
  ctx.lineWidth = 1.5;
  for(var i = 0; i < windStreaks.length; i++){
    var w = windStreaks[i];
    ctx.globalAlpha = (w.life / w.maxLife) * 0.7;
    ctx.beginPath();
    ctx.moveTo(w.x, w.y);
    ctx.lineTo(w.x + w.dir * w.len, w.y - 8);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawOrbs(){
  for(var i = 0; i < orbs.length; i++){
    var o = orbs[i];
    var pulse = 0.85 + Math.sin(o.wobble * 2) * 0.08;

    ctx.save();
    ctx.globalAlpha = Math.max(0, o.dissolve);
    var grd = ctx.createRadialGradient(o.x - 4, o.y - 4, 2, o.x, o.y, o.r);
    grd.addColorStop(0, darkMode ? 'rgba(220,225,230,.9)' : 'rgba(255,255,255,.95)');
    grd.addColorStop(0.6, darkMode ? 'rgba(160,170,180,.7)' : 'rgba(200,205,210,.8)');
    grd.addColorStop(1, darkMode ? 'rgba(100,110,120,.4)' : 'rgba(160,170,180,.3)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = darkMode ? 'rgba(0,229,255,.25)' : 'rgba(0,120,140,.2)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = darkMode ? 'rgba(0,229,255,.7)' : 'rgba(0,100,120,.65)';
    ctx.font = '9px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(o.label, o.x, o.y);
    ctx.restore();
  }
}

function drawPlayer(){
  var accent = cssVar('--accent') || '#00bcd4';
  var flash = player.flash > 0;

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.scale(player.scale, player.scale);

  if(flash){
    ctx.shadowColor = accent;
    ctx.shadowBlur = 24;
  }

  ctx.strokeStyle = accent;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, 22, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = flash ? accent : (darkMode ? 'rgba(0,229,255,.15)' : 'rgba(0,188,212,.12)');
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = darkMode ? '#d8dde3' : '#2a3038';
  ctx.font = '8px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('YOU', 0, 0);

  ctx.restore();

  ctx.strokeStyle = accent;
  ctx.globalAlpha = 0.25;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 5]);
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 30);
  ctx.lineTo(player.x, catchY - 40);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawParticles(){
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawRipples(){
  var accent = cssVar('--accent') || '#00bcd4';
  for(var i = 0; i < ripples.length; i++){
    var r = ripples[i];
    ctx.globalAlpha = Math.max(0, r.life / r.maxLife) * 0.5;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawHarmonyRing(){
  if(harmonyPulse <= 0) return;
  var accent = cssVar('--accent') || '#00bcd4';
  var r = 30 + (1 - harmonyPulse) * 120;
  ctx.globalAlpha = harmonyPulse * 0.4;
  ctx.strokeStyle = accent;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(player.x, player.y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function draw(){
  ctx.save();
  if(shakeT > 0){
    ctx.translate((Math.random() - 0.5) * 6 * shakeT, (Math.random() - 0.5) * 4 * shakeT);
  }
  drawBg();
  drawFog();
  drawWindStreaks();
  drawOrbs();
  drawRipples();
  drawPlayer();
  drawHarmonyRing();
  drawParticles();
  ctx.restore();
}

var lastT = 0;
function loop(t){
  try {
    if(!lastT) lastT = t;
    var dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;
    update(dt);
    draw();
  } catch(e){}
  requestAnimationFrame(loop);
}

function onTouchStart(e){
  if(e.cancelable) e.preventDefault();
  var t = e.changedTouches ? e.changedTouches[0] : e;
  touchStartX = t.clientX;
  touchStartY = t.clientY;
}

function onTouchEnd(e){
  if(e.cancelable) e.preventDefault();
  var t = e.changedTouches ? e.changedTouches[0] : e;
  var dx = t.clientX - touchStartX;
  var dy = t.clientY - touchStartY;
  if(Math.abs(dx) > Math.abs(dy)) handleSwipe(dx);
}

function onKeyDown(e){
  if(e.key === 'ArrowLeft'){ e.preventDefault(); switchLane(-1); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); switchLane(1); }
  else if(e.key === ' ' && state === 'title'){ e.preventDefault(); startGame(); }
}

btnStart.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

btnRestart.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchend', onTouchEnd, { passive: false });
canvas.addEventListener('mousedown', onTouchStart);
canvas.addEventListener('mouseup', onTouchEnd);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('resize', resize);

try {
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
      darkMode = prefersDark();
    });
  }
} catch(e){}

darkMode = prefersDark();
resize();
updateHUD();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
