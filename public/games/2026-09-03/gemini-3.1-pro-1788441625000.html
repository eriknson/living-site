<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Imagine 2026</title>
    <style>
        :root {
            --bg-top: #d1d5db;
            --bg-bottom: #f3f4f6;
            --text-main: #059669;
            --main-r: 5;
            --main-g: 150;
            --main-b: 105;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-top: #0f172a;
                --bg-bottom: #1e293b;
                --text-main: #4ade80;
                --main-r: 74;
                --main-g: 222;
                --main-b: 128;
            }
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text-main);
            font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: clamp(36px, 8vw, 64px);
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px var(--text-main);
            letter-spacing: 2px;
        }
        p.subtitle {
            font-size: clamp(14px, 4vw, 18px);
            margin-bottom: 40px;
            opacity: 0.8;
            line-height: 1.6;
        }
        button {
            pointer-events: auto;
            background: transparent;
            color: var(--text-main);
            border: 2px solid var(--text-main);
            padding: 15px 40px;
            font-size: 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
            touch-action: manipulation;
        }
        button:active {
            background: var(--text-main);
            color: var(--bg-bottom);
        }
        #hud {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px;
            pointer-events: none;
        }
        .hud-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
        }
        .hud-bottom {
            width: 100%;
            font-size: clamp(16px, 5vw, 24px);
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.6;
            word-wrap: break-word;
        }
        #sentence-display span {
            transition: color 0.2s, text-shadow 0.2s;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="title-screen" class="screen">
                <h1>IMAGINE 2026</h1>
                <p class="subtitle">Tap when pulsing words enter the bracket.<br>Ignore the decoys.</p>
                <button data-smoke="start" id="start-btn">START RUN</button>
            </div>

            <div id="hud" class="screen hidden">
                <div class="hud-top">
                    <div id="score">00000</div>
                    <div id="strikes">///</div>
                </div>
                <div class="hud-bottom">
                    <div id="sentence-display"></div>
                </div>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <h1>CONNECTION LOST</h1>
                <p class="subtitle" id="final-score">SCORE: 0</p>
                <button data-smoke="restart" id="restart-btn">RESTART</button>
            </div>
        </div>
    </div>

    <script>
        const SENTENCES = [
            { text: ["IMAGINE", "2026"], decoys: ["IMAGE", "2025", "MAGIC", "2024", "IGNORE", "MARGIN"] },
            { text: ["SHIPPING", "BY", "SUNRISE"], decoys: ["SHOPPING", "MY", "SUNSET", "BUY", "SURPRISE", "SIPPING"] },
            { text: ["AGENTS", "SPUN", "UP"], decoys: ["AGENCY", "SPAN", "US", "AGAINST", "SPAM", "UPON"] },
            { text: ["OPEN", "SOURCE", "MODELS"], decoys: ["OVEN", "SAUCE", "MODEMS", "OFTEN", "FORCE", "MOTELS"] },
            { text: ["A", "DARK", "HORSE", "WAKING"], decoys: ["THE", "DIRK", "HOUSE", "WALKING", "BARK", "MAKING"] },
            { text: ["FINDING", "HARBOR", "IN", "SILICON"], decoys: ["BINDING", "BARBER", "ON", "SILICONE", "HARDER", "SICON"] }
        ];

        let gameState = 'TITLE'; 
        let globalTime = 0;
        let score = 0;
        let strikes = 0;
        let maxStrikes = 3;

        let levelIndex = 0;
        let track = [];
        let startTime = 0;
        let hitZoneX = 0;
        let timeToCross = 2000;
        let hitWindow = 150; 
        let levelPending = false;
        let levelTransitioning = false;
        let loopRunning = false;

        let sentenceTargets = [];
        let currentSentenceProgress = 0;
        let levelPerfect = true;

        let screenShake = 0;
        let flashAlpha = 0;
        let bracketPulse = 0;
        let particles = [];

        let audioCtx = null;
        let canvas, ctx;
        let mainR = 74, mainG = 222, mainB = 128;

        function updateColors() {
            const style = getComputedStyle(document.documentElement);
            mainR = parseInt(style.getPropertyValue('--main-r').trim()) || 74;
            mainG = parseInt(style.getPropertyValue('--main-g').trim()) || 222;
            mainB = parseInt(style.getPropertyValue('--main-b').trim()) || 128;
        }

        function getGreen(alpha) {
            return `rgba(${mainR}, ${mainG}, ${mainB}, ${alpha})`;
        }

        function initAudio() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        }

        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playHitSound() {
            playTone(880, 'sine', 0.1, 0.2);
            setTimeout(() => playTone(1760, 'sine', 0.1, 0.1), 50);
        }

        function playErrorSound() {
            playTone(150, 'sawtooth', 0.3, 0.3);
        }

        function playFlashSound() {
            playTone(440, 'square', 0.2, 0.1);
            setTimeout(() => playTone(554, 'square', 0.2, 0.1), 100);
            setTimeout(() => playTone(659, 'square', 0.4, 0.1), 200);
        }

        class Particle {
            constructor(x, y, text, isGood) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.isGood = isGood;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.02;
                this.scale = Math.random() * 0.5 + 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                if (this.isGood) {
                    ctx.fillStyle = getGreen(this.life);
                } else {
                    ctx.fillStyle = `rgba(239, 68, 68, ${this.life})`; 
                }
                ctx.font = 'bold 20px ui-monospace, "SFMono-Regular", Menlo, monospace';
                ctx.fillText(this.text, 0, 0);
                ctx.restore();
            }
        }

        function spawnParticles(x, y, word, isGood) {
            for(let i=0; i<word.length; i++) {
                for(let j=0; j<2; j++) {
                    particles.push(new Particle(x + (Math.random()-0.5)*50, y + (Math.random()-0.5)*50, word[i], isGood));
                }
            }
        }

        function buildLevel(levelIdx) {
            const sentenceObj = SENTENCES[levelIdx % SENTENCES.length];
            const targets = sentenceObj.text;
            const decoys = sentenceObj.decoys;
            let newTrack = [];
            let currentTimeOffset = 0;
            let baseGap = Math.max(450, 800 - levelIdx * 50); 
            
            for (let i = 0; i < targets.length; i++) {
                let numDecoys = 1 + Math.floor(Math.random() * 2);
                if (levelIdx > 2) numDecoys += Math.floor(Math.random() * 2);
                
                for (let d = 0; d < numDecoys; d++) {
                    currentTimeOffset += baseGap + Math.random() * 200;
                    newTrack.push({
                        word: decoys[Math.floor(Math.random() * decoys.length)],
                        isTarget: false,
                        arrivalTime: currentTimeOffset,
                        hit: false,
                        missed: false,
                        active: true,
                    });
                }
                currentTimeOffset += baseGap + Math.random() * 200;
                newTrack.push({
                    word: targets[i],
                    isTarget: true,
                    arrivalTime: currentTimeOffset,
                    hit: false,
                    missed: false,
                    active: true,
                });
            }
            return { track: newTrack };
        }

        function updateHUDSentence() {
            let html = '';
            for(let i=0; i<sentenceTargets.length; i++) {
                if (i < currentSentenceProgress) {
                    html += `<span style="color: var(--text-main); text-shadow: 0 0 10px var(--text-main);">${sentenceTargets[i]}</span> `;
                } else {
                    html += `<span style="opacity: 0.4">${'_'.repeat(sentenceTargets[i].length)}</span> `;
                }
            }
            document.getElementById('sentence-display').innerHTML = html.trim();
            document.getElementById('score').innerText = String(score).padStart(5, '0');
        }

        function updateHUDStrikes() {
            let str = '';
            for(let i=0; i<maxStrikes; i++) {
                str += i < strikes ? '<span style="color: #ef4444;">X</span> ' : '<span style="color: var(--text-main);">/</span> ';
            }
            document.getElementById('strikes').innerHTML = str.trim();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('final-score').innerText = `SCORE: ${String(score).padStart(5, '0')}`;
        }

        function addStrike() {
            strikes++;
            updateHUDStrikes();
            playErrorSound();
            screenShake = 15;
            try { if (navigator.vibrate) navigator.vibrate(50); } catch(e){}
            if (strikes >= maxStrikes) {
                gameOver();
            }
        }

        function startLevel() {
            levelTransitioning = false;
            timeToCross = Math.max(1000, 2000 - levelIndex * 150);
            let levelData = buildLevel(levelIndex);
            track = levelData.track;
            sentenceTargets = SENTENCES[levelIndex % SENTENCES.length].text;
            currentSentenceProgress = 0;
            levelPerfect = true;
            updateHUDSentence();
            updateHUDStrikes();
            levelPending = true;
        }

        function startGame() {
            initAudio();
            gameState = 'PLAYING';
            score = 0;
            strikes = 0;
            levelIndex = 0;
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hud').style.display = 'flex';
            globalTime = performance.now();
            startLevel();
            if (!loopRunning) {
                loopRunning = true;
                requestAnimationFrame(loop);
            }
        }

        function handleInput() {
            if (gameState !== 'PLAYING') return;
            let trackTime = globalTime - startTime;
            let closestItem = null;
            let minDt = Infinity;
            
            bracketPulse = 1.0;
            
            for (let item of track) {
                if (!item.active) continue;
                let dt = item.arrivalTime - trackTime;
                if (Math.abs(dt) < Math.abs(minDt)) {
                    minDt = dt;
                    closestItem = item;
                }
            }
            
            if (closestItem && Math.abs(minDt) <= hitWindow) {
                if (closestItem.isTarget) {
                    closestItem.hit = true;
                    closestItem.active = false;
                    score += 100;
                    currentSentenceProgress++;
                    updateHUDSentence();
                    playHitSound();
                    spawnParticles(hitZoneX, canvas.height/2, closestItem.word, true);
                    try { if (navigator.vibrate) navigator.vibrate(20); } catch(e){}
                } else {
                    closestItem.hit = true;
                    closestItem.active = false;
                    spawnParticles(hitZoneX, canvas.height/2, closestItem.word, false);
                    addStrike();
                    levelPerfect = false;
                }
            }
        }

        function loop(timestamp) {
            requestAnimationFrame(loop);
            globalTime = timestamp;
            
            if (levelPending) {
                startTime = globalTime + 1000;
                levelPending = false;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (gameState === 'PLAYING') {
                let trackTime = globalTime - startTime;
                let speedPxMs = (canvas.width - hitZoneX) / timeToCross;
                
                let activeItems = 0;
                for (let item of track) {
                    if (!item.active) continue;
                    activeItems++;
                    let timeDiff = item.arrivalTime - trackTime;
                    if (timeDiff < -hitWindow) {
                        if (item.isTarget && !item.hit && !item.missed) {
                            item.missed = true;
                            addStrike();
                            levelPerfect = false;
                        }
                        if (timeDiff < -1000) {
                            item.active = false;
                        }
                    }
                }
                
                if (activeItems === 0 && !levelTransitioning) {
                    levelTransitioning = true;
                    setTimeout(() => {
                        if (gameState === 'PLAYING') {
                            if (levelPerfect) {
                                flashAlpha = 1.0;
                                score += 1000;
                                updateHUDSentence();
                                playFlashSound();
                            }
                            levelIndex++;
                            startLevel();
                        }
                    }, 500);
                }
                
                if (bracketPulse > 0) bracketPulse -= 0.05;
                if (screenShake > 0) screenShake *= 0.9;
                if (screenShake < 0.5) screenShake = 0;
                if (flashAlpha > 0) flashAlpha -= 0.02;
                
                ctx.save();
                if (screenShake > 0) {
                    let dx = (Math.random() - 0.5) * screenShake;
                    let dy = (Math.random() - 0.5) * screenShake;
                    ctx.translate(dx, dy);
                }
                
                ctx.fillStyle = getGreen(0.03);
                let timeOffset = globalTime * 0.05;
                for(let i=0; i<10; i++) {
                    let y = (timeOffset * (i+1)) % canvas.height;
                    ctx.fillRect(0, y, canvas.width, 2 + i % 3);
                }
                
                let hzAlpha = 0.4 + bracketPulse * 0.6;
                let hzWidth = 30 + bracketPulse * 10;
                ctx.strokeStyle = getGreen(hzAlpha);
                ctx.lineWidth = 2 + bracketPulse * 2;
                ctx.beginPath();
                ctx.moveTo(hitZoneX - hzWidth, canvas.height/2 - 40);
                ctx.lineTo(hitZoneX - hzWidth - 10, canvas.height/2 - 40);
                ctx.lineTo(hitZoneX - hzWidth - 10, canvas.height/2 + 40);
                ctx.lineTo(hitZoneX - hzWidth, canvas.height/2 + 40);
                ctx.moveTo(hitZoneX + hzWidth, canvas.height/2 - 40);
                ctx.lineTo(hitZoneX + hzWidth + 10, canvas.height/2 - 40);
                ctx.lineTo(hitZoneX + hzWidth + 10, canvas.height/2 + 40);
                ctx.lineTo(hitZoneX + hzWidth, canvas.height/2 + 40);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.setLineDash([5, 10]);
                ctx.moveTo(hitZoneX, canvas.height/2 - 50);
                ctx.lineTo(hitZoneX, canvas.height/2 + 50);
                ctx.strokeStyle = getGreen(0.2);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let item of track) {
                    if (!item.active) continue;
                    let dt = item.arrivalTime - trackTime;
                    let x = hitZoneX + dt * speedPxMs;
                    let scale = 1;
                    
                    if (item.isTarget) {
                        let p = (Math.sin(globalTime / 150) + 1) / 2; 
                        scale = 1 + p * 0.1;
                        ctx.fillStyle = getGreen(1);
                    } else {
                        ctx.fillStyle = getGreen(0.4);
                    }
                    
                    // adaptive font size for mobile
                    let fSize = canvas.width < 500 ? 24 : 32;
                    ctx.font = `bold ${fSize}px ui-monospace, "SFMono-Regular", Menlo, monospace`;
                    ctx.save();
                    ctx.translate(x, canvas.height / 2);
                    ctx.scale(scale, scale);
                    ctx.fillText(item.word, 0, 0);
                    ctx.restore();
                }
                
                for(let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw(ctx);
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
                
                ctx.restore();
                
                if (flashAlpha > 0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }
        }

        window.onload = () => {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
            }
            updateColors();
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                hitZoneX = canvas.width * 0.3;
            }
            window.addEventListener('resize', resize);
            resize();
            
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', startGame);
            
            window.addEventListener('touchstart', (e) => {
                if (e.target.closest('button')) return; 
                if (gameState === 'PLAYING') {
                    e.preventDefault(); 
                    handleInput();
                }
            }, { passive: false });
            
            window.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                if (gameState === 'PLAYING') {
                    handleInput();
                }
            });
            
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'Enter') {
                    if (gameState === 'PLAYING') {
                        e.preventDefault();
                        handleInput();
                    }
                }
            });
        };
    </script>
</body>
</html>
