<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Founding Engineer</title>
<style>
  :root {
    --bg: #0f172a;
    --text: #f8fafc;
    --ui-bg: rgba(15, 23, 42, 0.85);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc;
      --text: #0f172a;
      --ui-bg: rgba(248, 250, 252, 0.85);
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
  }
  #ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    background: var(--ui-bg);
    padding: 2.5rem 2rem;
    border: 1px solid var(--text);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .screen.active {
    display: flex;
  }
  h1 { font-size: 1.5rem; margin: 0 0 1rem 0; text-transform: uppercase; letter-spacing: 2px; }
  p { margin: 0 0 2rem 0; font-size: 0.95rem; opacity: 0.9; max-width: 260px; line-height: 1.5; }
  button {
    pointer-events: auto;
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 1rem 2rem;
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    border-radius: 6px;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }
  
  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 10px); 
    left: 0; width: 100%;
    padding: 1rem;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 1.2rem;
    font-weight: bold;
    z-index: 5;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div id="score-disp">SCORE: 0</div>
    <div id="time-disp">45.0s</div>
  </div>
  <div id="ui-layer">
    <div id="menu" class="screen active">
      <h1>Founding Engineer</h1>
      <p>Flick your skills into the right startup orbs before runway runs out.</p>
      <button data-smoke="start" id="btn-start">Start Pitch</button>
    </div>
    <div id="gameover" class="screen">
      <h1>Runway Depleted</h1>
      <p id="final-score">Score: 0</p>
      <button data-smoke="restart" id="btn-restart">Pivot (Restart)</button>
    </div>
  </div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const uiLayer = document.getElementById('ui-layer');
const menuScreen = document.getElementById('menu');
const gameoverScreen = document.getElementById('gameover');
const hud = document.getElementById('hud');
const scoreDisp = document.getElementById('score-disp');
const timeDisp = document.getElementById('time-disp');
const finalScoreDisp = document.getElementById('final-score');
const btnStart = document.getElementById('btn-start');
const btnRestart = document.getElementById('btn-restart');

let vw, vh;
function resize() {
    vw = window.innerWidth;
    vh = window.innerHeight;
    canvas.width = vw * window.devicePixelRatio;
    canvas.height = vh * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
window.addEventListener('resize', resize);
resize();

function getColors() {
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    return {
        bg: isDark ? '#0f172a' : '#f8fafc',
        grid: isDark ? '#334155' : '#cbd5e1',
        text: isDark ? '#f8fafc' : '#0f172a',
        AI: isDark ? '#38bdf8' : '#0284c7',
        SYS: isDark ? '#4ade80' : '#16a34a',
        UI: isDark ? '#fb923c' : '#ea580c'
    };
}

const TYPES = ['AI', 'SYS', 'UI'];
const SKILLS = {
    'AI': ['PyTorch', 'LLMs', 'RAG', 'CUDA'],
    'SYS': ['Rust', 'K8s', 'Go', 'Linux'],
    'UI': ['React', 'Figma', 'CSS', 'WebGL']
};

let state = 'MENU';
let score = 0;
let timeRemaining = 45.0;
let combo = 0;
let lastTime = performance.now();
let difficulty = 1;

let orbs = [];
let particles = [];
let currentParticle = null;
let effects = [];
let floatingTexts = [];
let bgShapes = [];

for(let i=0; i<15; i++) {
    bgShapes.push({
        x: Math.random() * vw,
        y: Math.random() * vh,
        size: Math.random() * 80 + 40,
        angle: Math.random() * Math.PI,
        speed: Math.random() * 30 + 10,
        sides: Math.floor(Math.random() * 3) + 3
    });
}

let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'flick') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(600, t + 0.1);
        gain.gain.setValueAtTime(0.05, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.1);
        osc.start(t);
        osc.stop(t + 0.1);
    } else if (type === 'match') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, t);
        osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.2);
        osc.start(t);
        osc.stop(t + 0.2);
    } else if (type === 'mismatch') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.linearRampToValueAtTime(100, t + 0.3);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.3);
        osc.start(t);
        osc.stop(t + 0.3);
    } else if (type === 'burst') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.setValueAtTime(600, t + 0.1);
        osc.frequency.setValueAtTime(800, t + 0.2);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.4);
        osc.start(t);
        osc.stop(t + 0.4);
    }
}

let pointerHistory = [];
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let particleStartX = 0;
let particleStartY = 0;

canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'PLAYING') return;
    initAudio();
    if (!currentParticle) return;
    
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    particleStartX = currentParticle.x;
    particleStartY = currentParticle.y;
    pointerHistory = [{x: e.clientX, y: e.clientY, t: performance.now()}];
});

canvas.addEventListener('pointermove', (e) => {
    if (!isDragging || state !== 'PLAYING' || !currentParticle) return;
    
    pointerHistory.push({x: e.clientX, y: e.clientY, t: performance.now()});
    if (pointerHistory.length > 10) pointerHistory.shift();
    
    currentParticle.x = particleStartX + (e.clientX - dragStartX);
    currentParticle.y = particleStartY + (e.clientY - dragStartY);
    
    currentParticle.x = Math.max(20, Math.min(vw - 20, currentParticle.x));
    currentParticle.y = Math.max(vh * 0.4, Math.min(vh - 20, currentParticle.y));
});

canvas.addEventListener('pointerup', (e) => {
    if (!isDragging || state !== 'PLAYING' || !currentParticle) return;
    isDragging = false;
    
    const now = performance.now();
    const recent = pointerHistory.filter(p => now - p.t < 150);
    
    if (recent.length >= 2) {
        const first = recent[0];
        const last = recent[recent.length - 1];
        const dt = (last.t - first.t) / 1000;
        
        if (dt > 0) {
            let vx = (last.x - first.x) / dt;
            let vy = (last.y - first.y) / dt;
            
            if (vy < -100) {
                currentParticle.vx = vx * 1.5;
                currentParticle.vy = vy * 1.5;
                
                const maxV = vh * 3.5;
                const speed = Math.sqrt(currentParticle.vx**2 + currentParticle.vy**2);
                if (speed > maxV) {
                    currentParticle.vx = (currentParticle.vx / speed) * maxV;
                    currentParticle.vy = (currentParticle.vy / speed) * maxV;
                }
                
                currentParticle.isFlying = true;
                particles.push(currentParticle);
                currentParticle = null;
                playSound('flick');
                
                setTimeout(spawnParticle, 300);
                return;
            }
        }
    }
    
    currentParticle.x = vw / 2;
    currentParticle.y = vh * 0.85;
});

canvas.addEventListener('touchstart', e => e.preventDefault(), {passive: false});
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

function spawnParticle() {
    if (state !== 'PLAYING') return;
    if (currentParticle) return;
    const type = TYPES[Math.floor(Math.random() * TYPES.length)];
    currentParticle = {
        type,
        skill: SKILLS[type][Math.floor(Math.random() * SKILLS[type].length)],
        x: vw / 2,
        y: vh * 0.85,
        vx: 0,
        vy: 0,
        radius: 18,
        isFlying: false,
        trail: []
    };
}

function spawnOrb(type, level) {
    const radius = Math.max(30, 55 - level * 2);
    let attempts = 0;
    let baseX, baseY;
    while (attempts < 15) {
        baseX = Math.random() * (vw - radius * 2) + radius;
        baseY = Math.random() * (vh * 0.35) + radius + 60;
        let overlap = false;
        for (let o of orbs) {
            if (Math.hypot(o.baseX - baseX, o.baseY - baseY) < radius + o.radius + 20) {
                overlap = true;
                break;
            }
        }
        if (!overlap) break;
        attempts++;
    }
    
    orbs.push({
        type,
        radius,
        baseX, baseY,
        x: baseX, y: baseY,
        angle: Math.random() * Math.PI * 2,
        orbitRadius: level > 3 ? Math.random() * 40 + 20 : 0,
        orbitSpeed: level > 3 ? (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random()) : 0,
        moveSpeed: level > 1 ? (Math.random() > 0.5 ? 1 : -1) * (20 + level * 10) : 0,
        pulse: 0
    });
}

function initLevel() {
    orbs = [];
    let numOrbs = 2 + Math.floor(difficulty / 2);
    numOrbs = Math.min(numOrbs, 5);
    
    const typesToSpawn = [];
    for (let i=0; i<numOrbs; i++) {
        if (i < 3) typesToSpawn.push(TYPES[i]);
        else typesToSpawn.push(TYPES[Math.floor(Math.random() * TYPES.length)]);
    }
    
    typesToSpawn.forEach(type => spawnOrb(type, difficulty));
}

function startGame() {
    initAudio();
    state = 'PLAYING';
    score = 0;
    timeRemaining = 45.0;
    combo = 0;
    difficulty = 1;
    particles = [];
    effects = [];
    floatingTexts = [];
    
    menuScreen.classList.remove('active');
    gameoverScreen.classList.remove('active');
    hud.classList.remove('hidden');
    
    initLevel();
    spawnParticle();
    
    lastTime = performance.now();
    requestAnimationFrame(loop);
}

function gameOver() {
    state = 'GAMEOVER';
    hud.classList.add('hidden');
    finalScoreDisp.textContent = `Score: ${score}`;
    gameoverScreen.classList.add('active');
    
    if (navigator.vibrate) {
        try { navigator.vibrate([200, 100, 200]); } catch(e) {}
    }
}

btnStart.addEventListener('click', startGame);
btnRestart.addEventListener('click', startGame);

function spawnEffect(x, y, color, type) {
    for (let i=0; i<20; i++) {
        effects.push({
            x, y,
            vx: (Math.random() - 0.5) * 500,
            vy: (Math.random() - 0.5) * 500,
            life: 1.0,
            color,
            size: Math.random() * 5 + 2
        });
    }
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({
        x, y,
        text, color,
        life: 1.2,
        vy: -60
    });
}

function update(dt) {
    if (state !== 'PLAYING') return;
    
    timeRemaining -= dt;
    if (timeRemaining <= 0) {
        timeRemaining = 0;
        gameOver();
        return;
    }
    
    difficulty = 1 + Math.floor(score / 600);
    if (orbs.length === 0) {
        initLevel();
    }
    
    bgShapes.forEach(s => {
        s.y += s.speed * dt;
        s.angle += s.speed * 0.01 * dt;
        if (s.y > vh + s.size) {
            s.y = -s.size;
            s.x = Math.random() * vw;
        }
    });
    
    orbs.forEach(orb => {
        orb.baseX += orb.moveSpeed * dt;
        if (orb.baseX < orb.radius || orb.baseX > vw - orb.radius) {
            orb.moveSpeed *= -1;
            orb.baseX = Math.max(orb.radius, Math.min(vw - orb.radius, orb.baseX));
        }
        
        orb.angle += orb.orbitSpeed * dt;
        orb.x = orb.baseX + Math.cos(orb.angle) * orb.orbitRadius;
        orb.y = orb.baseY + Math.sin(orb.angle) * orb.orbitRadius;
        
        if (orb.pulse > 0) orb.pulse -= dt * 3;
    });
    
    const gravity = vh * 2.2;
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.vy += gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        
        p.trail.push({x: p.x, y: p.y});
        if (p.trail.length > 12) p.trail.shift();
        
        let hit = false;
        for (let j = 0; j < orbs.length; j++) {
            let orb = orbs[j];
            let dx = p.x - orb.x;
            let dy = p.y - orb.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < p.radius + orb.radius) {
                hit = true;
                if (p.type === orb.type) {
                    combo++;
                    let pts = 100 + combo * 20;
                    score += pts;
                    timeRemaining += 2.5;
                    orb.pulse = 1;
                    playSound('match');
                    spawnEffect(orb.x, orb.y, getColors()[p.type], 'match');
                    spawnFloatingText(orb.x, orb.y, `+${pts}`, getColors()[p.type]);
                    
                    if (combo >= 3) {
                        playSound('burst');
                        spawnEffect(orb.x, orb.y, '#fff', 'burst');
                        spawnFloatingText(orb.x, orb.y - 30, "FUNDING BURST!", '#fff');
                        score += 300;
                        if (navigator.vibrate) {
                            try { navigator.vibrate(50); } catch(e) {}
                        }
                    }
                    
                    if (Math.random() < 0.4) {
                        orbs.splice(j, 1);
                    }
                } else {
                    combo = 0;
                    timeRemaining -= 3;
                    playSound('mismatch');
                    spawnEffect(p.x, p.y, '#f00', 'mismatch');
                    spawnFloatingText(p.x, p.y, "-3s", '#f00');
                    if (navigator.vibrate) {
                        try { navigator.vibrate(100); } catch(e) {}
                    }
                }
                break;
            }
        }
        
        if (hit || p.y > vh + 50 || p.x < -50 || p.x > vw + 50) {
            particles.splice(i, 1);
        }
    }
    
    for (let i = effects.length - 1; i >= 0; i--) {
        let e = effects[i];
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        e.life -= dt * 1.5;
        if (e.life <= 0) effects.splice(i, 1);
    }
    
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy * dt;
        ft.life -= dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
    
    scoreDisp.textContent = `SCORE: ${score}`;
    timeDisp.textContent = `${Math.max(0, timeRemaining).toFixed(1)}s`;
    if (timeRemaining < 10) timeDisp.style.color = '#f00';
    else timeDisp.style.color = getColors().text;
}

function drawPolygon(ctx, x, y, radius, sides, angle) {
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
        let a = angle + (i * Math.PI * 2) / sides;
        let px = x + Math.cos(a) * radius;
        let py = y + Math.sin(a) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
}

function draw() {
    const colors = getColors();
    
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, vw, vh);
    
    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.05;
    bgShapes.forEach(s => {
        drawPolygon(ctx, s.x, s.y, s.size, s.sides, s.angle);
    });
    
    ctx.globalAlpha = 0.15;
    const gridSize = 50;
    const offset = (performance.now() / 40) % gridSize;
    ctx.beginPath();
    for (let x = 0; x < vw; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, vh);
    }
    for (let y = offset; y < vh; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(vw, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1.0;
    
    ctx.lineWidth = 2.5;
    orbs.forEach(orb => {
        ctx.strokeStyle = colors[orb.type];
        ctx.shadowBlur = 15;
        ctx.shadowColor = colors[orb.type];
        
        let sides = orb.type === 'AI' ? 6 : (orb.type === 'SYS' ? 4 : 3);
        let angleOffset = orb.type === 'SYS' ? Math.PI/4 : 0;
        let currentRadius = orb.radius + Math.max(0, orb.pulse * 15);
        
        drawPolygon(ctx, orb.x, orb.y, currentRadius, sides, (performance.now() / 1500) + angleOffset);
        drawPolygon(ctx, orb.x, orb.y, currentRadius * 0.4, sides, -(performance.now() / 1000) + angleOffset);
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = colors.text;
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(orb.type, orb.x, orb.y);
    });
    
    ctx.lineWidth = 2;
    particles.forEach(p => {
        ctx.strokeStyle = colors[p.type];
        ctx.shadowBlur = 10;
        ctx.shadowColor = colors[p.type];
        
        if (p.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(p.trail[0].x, p.trail[0].y);
            for (let i=1; i<p.trail.length; i++) {
                ctx.lineTo(p.trail[i].x, p.trail[i].y);
            }
            ctx.globalAlpha = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }
        
        drawPolygon(ctx, p.x, p.y, p.radius, 3, Math.atan2(p.vy, p.vx));
        ctx.shadowBlur = 0;
    });
    
    if (currentParticle) {
        let p = currentParticle;
        ctx.strokeStyle = colors[p.type];
        ctx.shadowBlur = 12;
        ctx.shadowColor = colors[p.type];
        
        let pulse = Math.sin(performance.now() / 150) * 3;
        drawPolygon(ctx, p.x, p.y, p.radius + pulse, 3, -Math.PI/2);
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = colors.text;
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.skill, p.x, p.y + 30);
        
        if (isDragging) {
            ctx.strokeStyle = colors.text;
            ctx.globalAlpha = 0.2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x, p.y - 150);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1.0;
        }
    }
    
    effects.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.globalAlpha = Math.max(0, e.life);
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;
    
    floatingTexts.forEach(ft => {
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
    });
    ctx.globalAlpha = 1.0;
    
    if (combo > 1) {
        ctx.fillStyle = colors.text;
        ctx.globalAlpha = Math.min(1, combo * 0.2);
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${combo}x COMBO`, vw / 2, vh * 0.2);
        ctx.globalAlpha = 1.0;
    }
}

function loop(timestamp) {
    if (state !== 'PLAYING') return;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    update(dt);
    draw();
    
    if (state === 'PLAYING') {
        requestAnimationFrame(loop);
    }
}

draw();
</script>
</body>
</html>
