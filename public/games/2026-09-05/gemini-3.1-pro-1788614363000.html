<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autumn Sort</title>
<style>
  :root {
    --bg-color: #f5f2eb;
    --text-color: #2c2c2c;
    --hud-bg: rgba(245, 242, 235, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #1a1816;
      --text-color: #e8e6e3;
      --hud-bg: rgba(26, 24, 22, 0.85);
    }
  }
  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--bg-color);
    pointer-events: none;
    z-index: 20;
  }
  .screen button {
    pointer-events: auto;
    margin-top: 2rem;
    padding: 1rem 2rem;
    font-size: 1.5rem;
    font-family: inherit;
    background: none;
    border: 2px solid var(--text-color);
    color: var(--text-color);
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: bold;
  }
  .screen button:active {
    background: var(--text-color);
    color: var(--bg-color);
  }
  #hud {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    padding: 1rem;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: bold;
    pointer-events: none;
    z-index: 10;
    background: var(--hud-bg);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  h1, h2 {
    font-size: 3rem;
    margin: 0 0 1rem 0;
    text-align: center;
  }
  h1 {
    color: #D32F2F;
    text-shadow: 2px 2px 0px #FFB300;
  }
  p {
    font-size: 1.2rem;
    margin: 0.5rem 0;
    text-align: center;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui-layer">
    <div id="hud" style="display:none">
      <div id="scoreDisplay">SCORE: 0</div>
      <div id="comboDisplay" style="color: #FF7B00">COMBO: 0</div>
      <div id="livesDisplay" style="color: #D32F2F">LIVES: 3</div>
    </div>
    
    <div id="start-screen" class="screen">
      <h1>AUTUMN SORT</h1>
      <p>Flick falling leaves into</p>
      <p>matching color bins.</p>
      <p>Watch out for wind gusts!</p>
      <button data-smoke="start">Start</button>
    </div>
    
    <div id="game-over-screen" class="screen" style="display: none;">
      <h2>GAME OVER</h2>
      <p id="final-score" style="font-size: 1.5rem; margin-bottom: 1rem;">Score: 0</p>
      <button data-smoke="restart">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let binHeight = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      binHeight = canvas.height * 0.25;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let lives = 3;
    let combo = 0;
    let currentCentury = 0;
    let gameState = 'title'; 
    let leaves = [];
    let particles = [];
    let windParticles = [];
    let spawnTimer = 0;
    let wind = 0;
    let windTarget = 0;
    let sweepTime = 0;
    let screenShake = 0;
    let bins = [0, 1, 2];
    let grabbedLeaf = null;
    let pointerHistory = [];
    let flashMessage = "";
    let flashTimer = 0;

    const colors = [
      { hex: '#FFB300', binColor: 'rgba(255, 179, 0, 0.25)' }, 
      { hex: '#FF7B00', binColor: 'rgba(255, 123, 0, 0.25)' }, 
      { hex: '#D32F2F', binColor: 'rgba(211, 47, 47, 0.25)' }  
    ];

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        let AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function vibrate(pattern) {
      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch(e) {}
      }
    }

    function spawnLeaf() {
      let colorIndex = Math.floor(Math.random() * 3);
      let type = Math.floor(Math.random() * 3);
      let size = 30 + Math.random() * 15;
      let x = size + Math.random() * (canvas.width - size * 2);
      leaves.push({
        id: Math.random(),
        x, y: -size,
        vx: (Math.random() - 0.5) * 50,
        vy: 50 + Math.random() * 50,
        angle: Math.random() * Math.PI * 2,
        angularVelocity: (Math.random() - 0.5) * 2,
        size,
        colorIndex,
        type,
        state: 'falling'
      });
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 50 + Math.random() * 200;
        let life = 0.5 + Math.random() * 0.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life, maxLife: life,
          color,
          size: 3 + Math.random() * 5
        });
      }
    }

    function updateHUD() {
      document.getElementById('scoreDisplay').innerText = 'SCORE: ' + score;
      document.getElementById('comboDisplay').innerText = 'COMBO: ' + combo;
      document.getElementById('livesDisplay').innerText = 'LIVES: ' + lives;
    }

    function startGame() {
      score = 0;
      lives = 3;
      combo = 0;
      currentCentury = 0;
      leaves = [];
      particles = [];
      windParticles = [];
      bins = [0, 1, 2];
      wind = 0;
      gameState = 'playing';
      spawnTimer = 0;
      grabbedLeaf = null;
      sweepTime = 0;
      screenShake = 0;
      updateHUD();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      gameState = 'gameover';
      document.getElementById('game-over-screen').style.display = 'flex';
      document.getElementById('hud').style.display = 'none';
      document.getElementById('final-score').innerText = 'Score: ' + score;
      vibrate([200, 100, 200]);
    }

    document.querySelector('[data-smoke="start"]').addEventListener('click', () => {
      initAudio();
      startGame();
    });

    document.querySelector('[data-smoke="restart"]').addEventListener('click', () => {
      initAudio();
      startGame();
    });

    function drawLeafShape(ctx, type, size, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      
      if (type === 0) { 
        ctx.moveTo(0, -size);
        ctx.lineTo(size*0.25, -size*0.4);
        ctx.lineTo(size*0.8, -size*0.6);
        ctx.lineTo(size*0.5, -size*0.1);
        ctx.lineTo(size*0.9, size*0.4);
        ctx.lineTo(size*0.4, size*0.4);
        ctx.lineTo(size*0.1, size*0.9);
        ctx.lineTo(-size*0.1, size*0.9);
        ctx.lineTo(-size*0.4, size*0.4);
        ctx.lineTo(-size*0.9, size*0.4);
        ctx.lineTo(-size*0.5, -size*0.1);
        ctx.lineTo(-size*0.8, -size*0.6);
        ctx.lineTo(-size*0.25, -size*0.4);
      } else if (type === 1) { 
        for(let i=0; i<Math.PI*2; i+=0.1) {
          let r = size * (0.8 + 0.2 * Math.sin(i * 5));
          let x = Math.cos(i) * r * 0.6;
          let y = Math.sin(i) * r;
          if (i===0) ctx.moveTo(x,y);
          else ctx.lineTo(x,y);
        }
      } else { 
        for(let i=0; i<Math.PI*2; i+=0.05) {
          let r = size * (0.9 + 0.1 * Math.sin(i * 20));
          let x = Math.cos(i) * r * 0.7;
          let y = Math.sin(i) * r;
          if (i===0) ctx.moveTo(x,y);
          else ctx.lineTo(x,y);
        }
      }
      ctx.closePath();
      ctx.fill();
      
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = size * 0.05;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(0, size * 1.2);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(0, -size*0.6);
      if (type === 0) {
        ctx.moveTo(0,0); ctx.lineTo(size*0.5, -size*0.3);
        ctx.moveTo(0,0); ctx.lineTo(-size*0.5, -size*0.3);
      }
      ctx.stroke();
    }

    function evaluateLeaf(leaf, index) {
      let w = canvas.width / 3;
      let binIndex = 0;
      if (leaf.x < w) binIndex = 0;
      else if (leaf.x < w * 2) binIndex = 1;
      else binIndex = 2;

      let targetColorIndex = bins[binIndex]; 
      
      if (leaf.colorIndex === targetColorIndex) {
        score += 10 + combo * 2;
        combo++;
        createParticles(leaf.x, leaf.y, colors[leaf.colorIndex].hex, 20);
        if (combo > 0 && combo % 10 === 0) {
          sweepTime = 1.5; 
          playTone(600, 'sine', 0.5);
        } else {
          playTone(300 + combo * 30, 'sine', 0.1);
        }
        
        let targetCentury = Math.floor(score / 150);
        if (targetCentury > currentCentury) {
          currentCentury = targetCentury;
          bins.sort(() => Math.random() - 0.5);
          flashMessage = "WIND GUST! BINS SCRAMBLED!";
          flashTimer = 2.0;
          playTone(800, 'square', 0.3);
          vibrate([100, 50, 100]);
        }
      } else {
        lives--;
        combo = 0;
        screenShake = 0.5;
        createParticles(leaf.x, leaf.y, '#888', 30);
        playTone(150, 'sawtooth', 0.3);
        vibrate(200);
        if (lives <= 0) {
          gameOver();
        }
      }
      
      leaves.splice(index, 1);
      updateHUD();
    }

    function update(dt) {
      if (gameState !== 'playing') return;

      if (flashTimer > 0) flashTimer -= dt;
      if (screenShake > 0) screenShake -= dt;
      if (sweepTime > 0) sweepTime -= dt;

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnLeaf();
        let interval = Math.max(0.6, 2.0 - (score * 0.015));
        spawnTimer = interval + (Math.random() * 0.4);
      }

      windTarget = Math.sin(performance.now() / 2500) * (30 + Math.min(score, 150));
      wind += (windTarget - wind) * dt * 2;

      if (Math.random() < 0.1) {
        windParticles.push({
          x: wind > 0 ? -50 : canvas.width + 50,
          y: Math.random() * (canvas.height - binHeight),
          vx: wind * (1.0 + Math.random()),
          life: 1.5, maxLife: 1.5
        });
      }

      for (let i = windParticles.length - 1; i >= 0; i--) {
        let wp = windParticles[i];
        wp.x += wp.vx * dt;
        wp.life -= dt;
        if (wp.life <= 0) windParticles.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      let currentGravity = 150 + Math.min(score, 300);
      let evalY = canvas.height - binHeight * 0.6;

      for (let i = leaves.length - 1; i >= 0; i--) {
        let leaf = leaves[i];
        
        if (leaf === grabbedLeaf) {
          if (leaf.y > evalY) {
            grabbedLeaf = null;
            evaluateLeaf(leaf, i);
          }
          continue;
        }

        leaf.vy += currentGravity * dt;
        let drag = leaf.state === 'flicked' ? 0.98 : 0.92;
        leaf.vx += wind * dt;
        
        let f = Math.pow(drag, dt * 60);
        leaf.vx *= f;
        leaf.vy *= f;

        leaf.x += leaf.vx * dt;
        leaf.y += leaf.vy * dt;

        if (leaf.state === 'falling') {
          leaf.angle += (Math.sin(performance.now()/400 + leaf.id) * 3 + leaf.vx * 0.01) * dt;
        } else {
          leaf.angle += leaf.angularVelocity * dt;
          leaf.angularVelocity *= f;
        }

        if (leaf.x < leaf.size) {
          leaf.x = leaf.size;
          leaf.vx *= -0.6;
        } else if (leaf.x > canvas.width - leaf.size) {
          leaf.x = canvas.width - leaf.size;
          leaf.vx *= -0.6;
        }

        if (leaf.y < -leaf.size * 2) {
          leaf.y = -leaf.size * 2;
          leaf.vy = Math.abs(leaf.vy) * 0.5;
        }

        if (leaf.y > evalY) {
          evaluateLeaf(leaf, i);
        }
      }
    }

    function drawBins(ctx) {
      let binY = canvas.height - binHeight;
      let w = canvas.width / 3;
      for (let i = 0; i < 3; i++) {
        let colorObj = colors[bins[i]];
        
        let grad = ctx.createLinearGradient(0, binY, 0, canvas.height);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, colorObj.binColor);
        ctx.fillStyle = grad;
        ctx.fillRect(i * w, binY, w, binHeight);
        
        if (i > 0) {
          ctx.strokeStyle = 'rgba(150, 150, 150, 0.3)';
          ctx.setLineDash([8, 8]);
          ctx.beginPath();
          ctx.moveTo(i * w, binY);
          ctx.lineTo(i * w, canvas.height);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        
        ctx.save();
        ctx.translate(i * w + w / 2, canvas.height - 50);
        ctx.scale(0.8, 0.8);
        drawLeafShape(ctx, 0, 30, colorObj.hex);
        ctx.restore();
      }
    }

    function draw(ctx) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      if (screenShake > 0) {
        let amt = screenShake * 15;
        ctx.translate((Math.random() - 0.5) * amt, (Math.random() - 0.5) * amt);
      }

      ctx.strokeStyle = 'rgba(150, 150, 150, 0.2)';
      ctx.lineWidth = 2;
      for (let wp of windParticles) {
        ctx.globalAlpha = (wp.life / wp.maxLife);
        ctx.beginPath();
        ctx.moveTo(wp.x, wp.y);
        ctx.lineTo(wp.x + wp.vx * 0.15, wp.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1.0;

      drawBins(ctx);

      for (let leaf of leaves) {
        ctx.save();
        ctx.translate(leaf.x, leaf.y);
        ctx.rotate(leaf.angle);
        
        if (leaf === grabbedLeaf) {
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.shadowBlur = 15;
          ctx.shadowOffsetY = 15;
          ctx.scale(1.2, 1.2);
        } else {
          ctx.shadowColor = 'rgba(0,0,0,0.3)';
          ctx.shadowBlur = 6;
          ctx.shadowOffsetY = 6;
        }

        drawLeafShape(ctx, leaf.type, leaf.size, colors[leaf.colorIndex].hex);
        ctx.restore();
      }

      for (let p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      ctx.restore(); 

      if (sweepTime > 0) {
        ctx.save();
        let alpha = Math.min(1.0, sweepTime);
        ctx.globalAlpha = alpha * 0.6; 
        let grad = ctx.createLinearGradient(0,0, canvas.width, canvas.height);
        grad.addColorStop(0, '#FFB300');
        grad.addColorStop(0.5, '#FF7B00');
        grad.addColorStop(1, '#D32F2F');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.restore();
      }

      if (flashTimer > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1.0, flashTimer);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          ctx.fillStyle = 'rgba(0,0,0,0.9)';
        }
        ctx.font = 'bold 2rem ui-monospace, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(flashMessage, canvas.width/2, canvas.height/2);
        ctx.restore();
      }
    }

    let lastTime = 0;
    function loop(time) {
      if (gameState === 'playing') {
        let dt = (time - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1;
        lastTime = time;
        update(dt);
        draw(ctx);
        requestAnimationFrame(loop);
      }
    }

    const getPointerPos = (e) => {
      let rect = canvas.getBoundingClientRect();
      let clientX = e.clientX;
      let clientY = e.clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }
      return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const handlePointerDown = (e) => {
      e.preventDefault();
      if (gameState !== 'playing') return;
      let pos = getPointerPos(e);
      
      for (let i = leaves.length - 1; i >= 0; i--) {
        let leaf = leaves[i];
        let dx = pos.x - leaf.x;
        let dy = pos.y - leaf.y;
        if (Math.sqrt(dx*dx + dy*dy) < leaf.size * 2.0) { 
          grabbedLeaf = leaf;
          leaf.state = 'grabbed';
          leaf.vx = 0; leaf.vy = 0;
          pointerHistory = [{x: pos.x, y: pos.y, time: performance.now()}];
          vibrate(10);
          break;
        }
      }
    };

    const handlePointerMove = (e) => {
      e.preventDefault();
      if (grabbedLeaf) {
        let pos = getPointerPos(e);
        grabbedLeaf.x = pos.x;
        grabbedLeaf.y = pos.y;
        
        pointerHistory.push({x: pos.x, y: pos.y, time: performance.now()});
        if (pointerHistory.length > 8) pointerHistory.shift();
      }
    };

    const handlePointerUp = (e) => {
      e.preventDefault();
      if (grabbedLeaf) {
        let now = performance.now();
        let old = pointerHistory.find(p => now - p.time > 10 && now - p.time < 150);
        if (!old) old = pointerHistory[0]; 
        
        if (old && now - old.time > 0) {
          let dt = (now - old.time) / 1000;
          grabbedLeaf.vx = (grabbedLeaf.x - old.x) / dt;
          grabbedLeaf.vy = (grabbedLeaf.y - old.y) / dt;
        } else {
          grabbedLeaf.vx = 0;
          grabbedLeaf.vy = 50; 
        }
        
        let maxV = 3000;
        let speed = Math.sqrt(grabbedLeaf.vx**2 + grabbedLeaf.vy**2);
        if (speed > maxV) {
          grabbedLeaf.vx = (grabbedLeaf.vx / speed) * maxV;
          grabbedLeaf.vy = (grabbedLeaf.vy / speed) * maxV;
        }

        grabbedLeaf.state = 'flicked';
        grabbedLeaf.angularVelocity = (Math.random() - 0.5) * 30; 
        grabbedLeaf = null;
      }
    };

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);
    
    canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
    canvas.addEventListener('touchmove', handlePointerMove, {passive: false});
    window.addEventListener('touchend', handlePointerUp, {passive: false});
    window.addEventListener('touchcancel', handlePointerUp, {passive: false});

    // Initial render
    draw(ctx);
  </script>
</body>
</html>
