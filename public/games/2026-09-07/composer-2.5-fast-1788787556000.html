<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ship by Sunrise</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky-top:#0a1628;
  --sky-mid:#1a3050;
  --horizon:#c45a20;
  --horizon-glow:rgba(196,90,32,.45);
  --ground:#1e1408;
  --ink:#f0e8dc;
  --ink-muted:#9a9080;
  --ui-bg:rgba(14,20,32,.88);
  --ui-border:rgba(240,232,220,.1);
  --spark:#ffb830;
  --spark-glow:rgba(255,184,48,.55);
  --cloud:#3a4555;
  --cloud-dark:#252d38;
  --accent:#e87020;
  --accent-glow:rgba(232,112,32,.35);
  --success:#3cb878;
  --danger:#d94030;
  --meter-bg:rgba(240,232,220,.12);
}
@media(prefers-color-scheme:dark){
  :root{
    --sky-top:#0a1628;
    --sky-mid:#1a3050;
    --horizon:#c45a20;
    --horizon-glow:rgba(196,90,32,.45);
    --ground:#1e1408;
    --ink:#f0e8dc;
    --ink-muted:#9a9080;
    --ui-bg:rgba(14,20,32,.88);
    --ui-border:rgba(240,232,220,.1);
    --cloud:#3a4555;
    --cloud-dark:#252d38;
  }
}
@media(prefers-color-scheme:light){
  :root{
    --sky-top:#1a2840;
    --sky-mid:#3a5880;
    --horizon:#e88030;
    --horizon-glow:rgba(232,128,48,.4);
    --ground:#2a1c10;
    --ink:#fff8f0;
    --ink-muted:#c8b8a8;
    --ui-bg:rgba(20,28,44,.85);
    --ui-border:rgba(255,248,240,.14);
    --cloud:#556070;
    --cloud-dark:#3a4555;
  }
}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  background:var(--sky-top);color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{flex:1;width:100%;display:block;touch-action:none;cursor:grab}
#gameCanvas:active{cursor:grabbing}
#hud{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  background:var(--ui-bg);border-bottom:1px solid var(--ui-border);
  font-size:11px;letter-spacing:.04em;min-height:44px;gap:6px;z-index:5}
.hud-block{display:flex;flex-direction:column;gap:2px;min-width:0}
.hud-label{font-size:9px;color:var(--ink-muted);text-transform:uppercase}
.hud-value{font-size:14px;font-weight:600}
#sunriseWrap{flex:1;max-width:160px;display:flex;flex-direction:column;gap:3px;align-items:center}
#sunriseBar{height:8px;width:100%;background:var(--meter-bg);border-radius:4px;overflow:hidden}
#sunriseFill{height:100%;width:0%;background:linear-gradient(90deg,var(--horizon),var(--spark));
  border-radius:4px;transition:width .12s ease}
#comboVal{color:var(--spark)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;text-align:center;pointer-events:none;z-index:20}
.overlay-card{background:var(--ui-bg);border:1px solid var(--ui-border);border-radius:14px;
  padding:28px 22px;max-width:340px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.45);
  pointer-events:none}
.overlay h1{font-size:21px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
.overlay p{font-size:12px;color:var(--ink-muted);line-height:1.55;margin-bottom:18px}
.overlay .tag{display:inline-block;font-size:10px;padding:3px 10px;border-radius:99px;
  background:var(--accent-glow);color:var(--accent);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:168px;
  padding:12px 28px;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  background:var(--accent);color:#fff;box-shadow:0 4px 16px var(--accent-glow);
  transition:transform .12s ease;pointer-events:auto}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--spark);outline-offset:3px}
#titleOverlay{opacity:1;transition:opacity .45s ease}
#titleOverlay.hidden{opacity:0;pointer-events:none}
#gameOverOverlay{opacity:0;pointer-events:none;transition:opacity .45s ease}
#gameOverOverlay.visible{opacity:1}
.result-icon{font-size:34px;margin-bottom:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Dawn</span>
      <span class="hud-value" id="timeVal">45</span>
    </div>
    <div id="sunriseWrap" class="hud-block">
      <span class="hud-label">Sunrise</span>
      <div id="sunriseBar"><div id="sunriseFill"></div></div>
    </div>
    <div class="hud-block" style="align-items:flex-end">
      <span class="hud-label">Streak</span>
      <span class="hud-value" id="comboVal">×1</span>
    </div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="titleOverlay" class="overlay">
    <div class="overlay-card">
      <div class="tag">Clear Autumn Night · SF</div>
      <h1>Ship by Sunrise</h1>
      <p>Catch falling task sparks before dawn breaks. Drag to move your collector. Burnout clouds will steal your streak — fill the sunrise meter in 45 seconds.</p>
      <button class="btn" data-smoke="start" id="startBtn">Begin Shift</button>
    </div>
  </div>
  <div id="gameOverOverlay" class="overlay">
    <div class="overlay-card">
      <div class="result-icon" id="resultIcon">🌅</div>
      <h1 id="resultTitle">Shipped!</h1>
      <p id="resultMsg">The fix is live before sunrise.</p>
      <button class="btn" data-smoke="restart" id="restartBtn">Another Shift</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('gameCanvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');
var titleOverlay = document.getElementById('titleOverlay');
var gameOverOverlay = document.getElementById('gameOverOverlay');
var timeVal = document.getElementById('timeVal');
var sunriseFill = document.getElementById('sunriseFill');
var comboVal = document.getElementById('comboVal');
var resultTitle = document.getElementById('resultTitle');
var resultMsg = document.getElementById('resultMsg');
var resultIcon = document.getElementById('resultIcon');

var W = 360, H = 580;
var state = 'title';
var DURATION = 45;
var GOAL = 100;
var timeLeft = DURATION;
var sunrise = 0;
var combo = 0;
var maxCombo = 0;
var score = 0;
var dawn = 0;
var shakeT = 0;
var hitPause = 0;
var lastTs = 0;
var spawnAcc = 0;
var cloudAcc = 0;
var dragging = false;
var pointerX = W / 2;

var collector = { x: W / 2, w: 72, h: 22, glow: 0 };
var sparks = [];
var clouds = [];
var particles = [];
var stars = [];
var floatTexts = [];

var audioCtx = null;

function initAudio() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch (e) {}
}

function playTone(freq, dur, vol, type) {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function vibrate(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

function resize() {
  if (!canvas) return;
  var rect = canvas.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(280, Math.floor(rect.width));
  H = Math.max(320, Math.floor(rect.height));
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  if (ctx) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  collector.w = Math.max(56, W * 0.2);
  collector.h = Math.max(18, H * 0.034);
  if (state === 'title') collector.x = W / 2;
}

function initStars() {
  stars = [];
  for (var i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.55,
      r: Math.random() * 1.4 + 0.3,
      tw: Math.random() * Math.PI * 2,
      sp: Math.random() * 2 + 0.5
    });
  }
}

function resetGame() {
  timeLeft = DURATION;
  sunrise = 0;
  combo = 0;
  maxCombo = 0;
  score = 0;
  dawn = 0;
  shakeT = 0;
  hitPause = 0;
  spawnAcc = 0;
  cloudAcc = 0;
  sparks = [];
  clouds = [];
  particles = [];
  floatTexts = [];
  collector.x = W / 2;
  collector.glow = 0;
  pointerX = W / 2;
  updateHud();
}

function updateHud() {
  if (timeVal) timeVal.textContent = String(Math.ceil(Math.max(0, timeLeft)));
  if (sunriseFill) sunriseFill.style.width = Math.min(100, sunrise) + '%';
  if (comboVal) comboVal.textContent = '×' + Math.max(1, combo);
}

function spawnSpark() {
  var margin = 16;
  sparks.push({
    x: margin + Math.random() * (W - margin * 2),
    y: -12,
    vy: 90 + dawn * 120 + Math.random() * 40,
    r: 5 + Math.random() * 3,
    wobble: Math.random() * Math.PI * 2,
    wobbleSp: 2 + Math.random() * 2,
    pulse: Math.random() * Math.PI * 2,
    kind: Math.random() < 0.12 ? 'gold' : 'spark'
  });
}

function spawnCloud() {
  var fromLeft = Math.random() < 0.5;
  clouds.push({
    x: fromLeft ? -60 : W + 60,
    y: H * 0.15 + Math.random() * H * 0.55,
    vx: (fromLeft ? 1 : -1) * (28 + dawn * 35 + Math.random() * 20),
    w: 48 + Math.random() * 36,
    h: 28 + Math.random() * 18,
    rot: Math.random() * 0.4 - 0.2
  });
}

function burst(x, y, col, n) {
  for (var i = 0; i < (n || 10); i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 120;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 30,
      life: 0.4 + Math.random() * 0.4,
      max: 0.4 + Math.random() * 0.4,
      r: 2 + Math.random() * 3,
      col: col
    });
  }
}

function floatText(x, y, txt, col) {
  floatTexts.push({ x: x, y: y, txt: txt, life: 0.9, col: col || '#ffb830' });
}

function catchSpark(s, idx) {
  var mult = Math.max(1, combo);
  var gain = s.kind === 'gold' ? 8 : 3.2;
  gain *= 1 + combo * 0.04;
  sunrise = Math.min(GOAL, sunrise + gain);
  score += Math.floor(gain * 10 * mult);
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  collector.glow = 1;
  hitPause = 0.04;
  burst(s.x, s.y, s.kind === 'gold' ? '#ffd060' : '#ffb830', s.kind === 'gold' ? 16 : 10);
  floatText(s.x, s.y - 10, s.kind === 'gold' ? '+FIX' : '+' + gain.toFixed(1), s.kind === 'gold' ? '#ffd060' : '#ffb830');
  playTone(s.kind === 'gold' ? 880 : 660 + combo * 20, 0.08, 0.07, 'sine');
  vibrate(12);
  sparks.splice(idx, 1);
}

function cloudHit() {
  var loss = Math.min(sunrise, 6 + combo * 0.8);
  sunrise = Math.max(0, sunrise - loss);
  combo = 0;
  shakeT = 0.25;
  burst(collector.x, H - collector.h - 20, '#556070', 14);
  floatText(collector.x, H - 60, '−' + loss.toFixed(1), '#d94030');
  playTone(180, 0.2, 0.1, 'sawtooth');
  vibrate(40);
}

function endGame(won) {
  state = 'over';
  if (gameOverOverlay) gameOverOverlay.classList.add('visible');
  if (resultIcon) resultIcon.textContent = won ? '🌅' : '🌑';
  if (resultTitle) resultTitle.textContent = won ? 'Shipped!' : 'Dawn Broke';
  if (resultMsg) {
    resultMsg.textContent = won
      ? 'Score ' + score + ' · Best streak ×' + maxCombo + ' — fix live before sunrise.'
      : 'Sunrise at ' + Math.floor(sunrise) + '% · Score ' + score + '. One more try?';
  }
  playTone(won ? 523 : 220, won ? 0.3 : 0.4, 0.08, won ? 'triangle' : 'sine');
}

function startGame() {
  initAudio();
  resetGame();
  initStars();
  state = 'playing';
  if (titleOverlay) titleOverlay.classList.add('hidden');
  if (gameOverOverlay) gameOverOverlay.classList.remove('visible');
  lastTs = performance.now();
}

function pointerPos(e) {
  if (!canvas) return W / 2;
  var rect = canvas.getBoundingClientRect();
  var cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : W / 2);
  return ((cx - rect.left) / rect.width) * W;
}

function onDown(e) {
  if (state !== 'playing') return;
  e.preventDefault();
  dragging = true;
  pointerX = pointerPos(e);
  collector.x = pointerX;
}

function onMove(e) {
  if (!dragging || state !== 'playing') return;
  e.preventDefault();
  pointerX = pointerPos(e);
  collector.x += (pointerX - collector.x) * 0.35;
}

function onUp(e) {
  if (e) e.preventDefault();
  dragging = false;
}

function onKey(e) {
  if (state !== 'playing') return;
  var step = W * 0.04;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') collector.x -= step;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') collector.x += step;
}

function update(dt) {
  if (state !== 'playing') return;
  if (hitPause > 0) { hitPause -= dt; return; }

  timeLeft -= dt;
  dawn = 1 - timeLeft / DURATION;
  if (timeLeft <= 0) {
    timeLeft = 0;
    endGame(sunrise >= GOAL);
    return;
  }
  if (sunrise >= GOAL) {
    endGame(true);
    return;
  }

  var fallMul = 1 + dawn * 1.6;
  spawnAcc += dt * (1.4 + dawn * 2.2);
  while (spawnAcc >= 1) {
    spawnAcc -= 1;
    spawnSpark();
  }
  cloudAcc += dt * (0.15 + dawn * 0.55);
  while (cloudAcc >= 1) {
    cloudAcc -= 1;
    spawnCloud();
  }

  var cy = H - collector.h - 14;
  var halfW = collector.w * 0.5;

  for (var i = sparks.length - 1; i >= 0; i--) {
    var s = sparks[i];
    s.wobble += s.wobbleSp * dt;
    s.pulse += dt * 5;
    s.y += s.vy * fallMul * dt;
    s.x += Math.sin(s.wobble) * 28 * dt;
    if (s.y > cy - 4 && s.y < cy + collector.h + 8 &&
        s.x > collector.x - halfW - s.r && s.x < collector.x + halfW + s.r) {
      catchSpark(s, i);
      continue;
    }
    if (s.y > H + 20) {
      sparks.splice(i, 1);
      if (combo > 0) {
        combo = Math.max(0, combo - 1);
        floatText(s.x, H - 30, 'miss', '#9a9080');
      }
    }
  }

  for (var j = clouds.length - 1; j >= 0; j--) {
    var c = clouds[j];
    c.x += c.vx * dt;
    var dx = c.x - collector.x;
    var dy = c.y - cy;
    if (Math.abs(dx) < (c.w * 0.35 + halfW) && Math.abs(dy) < (c.h * 0.35 + collector.h)) {
      cloudHit();
      clouds.splice(j, 1);
      continue;
    }
    if (c.x < -100 || c.x > W + 100) clouds.splice(j, 1);
  }

  if (!dragging) {
    collector.x += (pointerX - collector.x) * 0.08;
  }
  collector.x = Math.max(halfW + 4, Math.min(W - halfW - 4, collector.x));
  collector.glow = Math.max(0, collector.glow - dt * 2.5);
  if (shakeT > 0) shakeT -= dt;

  for (var p = particles.length - 1; p >= 0; p--) {
    var pt = particles[p];
    pt.life -= dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 180 * dt;
    if (pt.life <= 0) particles.splice(p, 1);
  }
  for (var f = floatTexts.length - 1; f >= 0; f--) {
    floatTexts[f].life -= dt;
    floatTexts[f].y -= 28 * dt;
    if (floatTexts[f].life <= 0) floatTexts.splice(f, 1);
  }

  updateHud();
}

function cssVar(name, fallback) {
  try {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return v ? v.trim() : fallback;
  } catch (e) { return fallback; }
}

function drawSky() {
  if (!ctx) return;
  var skyTop = cssVar('--sky-top', '#0a1628');
  var skyMid = cssVar('--sky-mid', '#1a3050');
  var horizon = cssVar('--horizon', '#c45a20');
  var ground = cssVar('--ground', '#1e1408');

  var g = ctx.createLinearGradient(0, 0, 0, H);
  var t = dawn;
  g.addColorStop(0, lerpColor(skyTop, '#2a4060', t * 0.7));
  g.addColorStop(0.45 + t * 0.2, lerpColor(skyMid, '#a05028', t * 0.8));
  g.addColorStop(0.72 + t * 0.15, lerpColor('#304868', horizon, t));
  g.addColorStop(1, lerpColor(ground, '#5a3018', t * 0.6));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  var sunY = H * 0.62 + (1 - t) * H * 0.18;
  var sunR = 28 + t * 48;
  var sunG = ctx.createRadialGradient(W * 0.5, sunY, 0, W * 0.5, sunY, sunR * 2.2);
  sunG.addColorStop(0, 'rgba(255,210,80,' + (0.15 + t * 0.55) + ')');
  sunG.addColorStop(0.4, 'rgba(232,120,40,' + (0.08 + t * 0.3) + ')');
  sunG.addColorStop(1, 'rgba(232,120,40,0)');
  ctx.fillStyle = sunG;
  ctx.fillRect(0, sunY - sunR * 2, W, sunR * 4);

  var starAlpha = Math.max(0, 1 - t * 1.4);
  if (starAlpha > 0.02) {
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      st.tw += st.sp * 0.016;
      var a = starAlpha * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(st.tw)));
      ctx.fillStyle = 'rgba(240,232,220,' + a + ')';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.fillStyle = 'rgba(20,14,8,' + (0.25 + t * 0.15) + ')';
  ctx.fillRect(0, H * 0.82, W, H * 0.18);
}

function lerpColor(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  function parse(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  if (a.indexOf('rgb') === 0) return a;
  var ca = parse(a), cb = parse(b);
  var r = Math.round(ca[0] + (cb[0]-ca[0])*t);
  var g = Math.round(ca[1] + (cb[1]-ca[1])*t);
  var bl = Math.round(ca[2] + (cb[2]-ca[2])*t);
  return 'rgb('+r+','+g+','+bl+')';
}

function drawCloud(c) {
  if (!ctx) return;
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.rot);
  var cloudCol = cssVar('--cloud', '#3a4555');
  var cloudDark = cssVar('--cloud-dark', '#252d38');
  ctx.fillStyle = cloudDark;
  ctx.globalAlpha = 0.85;
  blob(c.w * 0.5, 0, c.w * 0.35);
  blob(-c.w * 0.25, c.h * 0.1, c.w * 0.28);
  blob(c.w * 0.15, c.h * 0.15, c.w * 0.22);
  ctx.fillStyle = cloudCol;
  ctx.globalAlpha = 0.65;
  blob(0, -c.h * 0.1, c.w * 0.3);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function blob(x, y, r) {
  if (!ctx) return;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawSpark(s) {
  if (!ctx) return;
  var pulse = 0.75 + 0.25 * Math.sin(s.pulse);
  var col = s.kind === 'gold' ? '#ffd060' : cssVar('--spark', '#ffb830');
  var gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3 * pulse);
  gr.addColorStop(0, col);
  gr.addColorStop(0.35, s.kind === 'gold' ? 'rgba(255,208,96,0.6)' : 'rgba(255,184,48,0.5)');
  gr.addColorStop(1, 'rgba(255,184,48,0)');
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.r * 3 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff8e8';
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.r * 0.55, 0, Math.PI * 2);
  ctx.fill();
}

function drawCollector() {
  if (!ctx) return;
  var cy = H - collector.h - 14;
  var x = collector.x;
  var w = collector.w;
  var h = collector.h;
  var glow = collector.glow;

  if (glow > 0.01) {
    var gg = ctx.createRadialGradient(x, cy, 0, x, cy, w);
    gg.addColorStop(0, 'rgba(255,184,48,' + (0.25 * glow) + ')');
    gg.addColorStop(1, 'rgba(255,184,48,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(x - w, cy - w * 0.5, w * 2, w);
  }

  ctx.fillStyle = 'rgba(14,20,32,0.7)';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.5, cy + h);
  ctx.lineTo(x - w * 0.42, cy);
  ctx.lineTo(x + w * 0.42, cy);
  ctx.lineTo(x + w * 0.5, cy + h);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = cssVar('--accent', '#e87020');
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = cssVar('--spark', '#ffb830');
  ctx.globalAlpha = 0.5 + glow * 0.5;
  ctx.fillRect(x - w * 0.3, cy + h * 0.3, w * 0.6, 2);
  ctx.globalAlpha = 1;
}

function drawParticles() {
  if (!ctx) return;
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatTexts() {
  if (!ctx) return;
  ctx.font = '600 11px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  for (var i = 0; i < floatTexts.length; i++) {
    var f = floatTexts[i];
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  if (!ctx) return;
  ctx.save();
  if (shakeT > 0) {
    ctx.translate((Math.random() - 0.5) * 8 * shakeT, (Math.random() - 0.5) * 6 * shakeT);
  }
  drawSky();
  for (var i = 0; i < clouds.length; i++) drawCloud(clouds[i]);
  for (var j = 0; j < sparks.length; j++) drawSpark(sparks[j]);
  if (state === 'playing' || state === 'over') drawCollector();
  drawParticles();
  drawFloatTexts();

  if (state === 'title') {
    drawCollector();
    ctx.fillStyle = 'rgba(240,232,220,0.55)';
    ctx.font = '600 12px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('drag to catch sparks', W / 2, H * 0.72);
  }
  ctx.restore();
}

function loop(ts) {
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  if (!lastTs) dt = 0;
  lastTs = ts;
  if (state === 'playing') update(dt);
  draw();
  requestAnimationFrame(loop);
}

function bindEvents() {
  if (startBtn) startBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    startGame();
  });
  if (restartBtn) restartBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    startGame();
  });
  if (canvas) {
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp, { passive: false });
    canvas.addEventListener('touchcancel', onUp, { passive: false });
  }
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);
}

function init() {
  resize();
  initStars();
  resetGame();
  bindEvents();
  if (ctx) {
    draw();
    requestAnimationFrame(loop);
  } else if (canvas) {
    canvas.style.background = '#0a1628';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
</body>
</html>
