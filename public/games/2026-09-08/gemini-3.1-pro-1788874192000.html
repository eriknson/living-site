<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dawn Patcher</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
      --neon-cyan-rgb: 0, 255, 204;
      --neon-red-rgb: 255, 51, 51;
      --neon-cyan: rgb(0, 255, 204);
      --neon-red: rgb(255, 51, 51);
      --text-color: #ffffff;
      --overlay-bg: rgba(2, 12, 27, 0.85);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-gradient: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
        --neon-cyan-rgb: 0, 255, 204;
        --neon-red-rgb: 255, 51, 51;
        --neon-cyan: rgb(0, 255, 204);
        --neon-red: rgb(255, 51, 51);
        --text-color: #ffffff;
        --overlay-bg: rgba(2, 12, 27, 0.85);
      }
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-gradient: radial-gradient(circle at center, white 0%, #c8dce8 100%);
        --neon-cyan-rgb: 0, 136, 170;
        --neon-red-rgb: 220, 20, 20;
        --neon-cyan: rgb(0, 136, 170);
        --neon-red: rgb(220, 20, 20);
        --text-color: #1a2b3c;
        --overlay-bg: rgba(255, 255, 255, 0.85);
      }
    }
    
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      width: 100dvw; height: 100dvh;
      overflow: hidden;
      background: var(--bg-gradient);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      color: var(--text-color);
    }

    #game-container {
      position: relative;
      width: 100%; height: 100%;
    }

    canvas {
      display: block;
      width: 100%; height: 100%;
    }

    #ui-layer {
      position: absolute;
      top: 0; left: 0; right: 0;
      pointer-events: none;
      padding: 30px;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #integrity-wrapper {
      flex-grow: 1;
      margin-right: 20px;
      background: transparent;
      height: 8px;
      border: 1px solid var(--text-color);
      opacity: 0.7;
    }

    #integrity-bar {
      height: 100%;
      width: 100%;
      background: var(--text-color);
      transition: width 0.1s linear, background-color 0.3s;
    }
    #integrity-bar.warning { background: #ffaa00; }
    #integrity-bar.danger { background: var(--neon-red); }

    #score-display {
      color: var(--text-color);
      white-space: nowrap;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--overlay-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      pointer-events: none;
      z-index: 100;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      margin: 0 0 10px 0;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    p {
      font-size: 1rem;
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .overlay button {
      pointer-events: auto;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-family: inherit;
      background: transparent;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    .overlay button:active {
      background: rgba(var(--neon-cyan-rgb), 0.1);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer">
      <div id="hud">
        <div id="integrity-wrapper"><div id="integrity-bar"></div></div>
        <div id="score-display">FIXES: 0</div>
      </div>
    </div>
    
    <div id="start-screen" class="overlay">
      <h1>DAWN PATCHER</h1>
      <p>Hold thumb to charge CLI spark.<br>Release to deploy micro-agents.<br>Chain fixes before dawn breaks.</p>
      <button data-smoke="start">INITIALIZE RUN</button>
    </div>
    
    <div id="game-over-screen" class="overlay hidden">
      <h1>SYSTEM OFFLINE</h1>
      <p id="final-score">BUGS FIXED: 0</p>
      <button data-smoke="restart">REBOOT SYSTEM</button>
    </div>
  </div>

  <script>
    let canvas, ctx, width, height;
    let integrity = 100, score = 0, wave = 1, waveTimer = 2;
    let state = 'title'; // title, playing, gameover
    let lastTime = 0;
    
    let isCharging = false;
    let chargePos = { x: 0, y: 0 };
    let chargeAmount = 0;
    
    let nodes = [], agents = [], particles = [];
    
    let isLightMode = false;
    let audioCtx = null;
    let audioInited = false;
    
    function initAudio() {
      if (audioInited) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        try { audioCtx = new AC(); audioInited = true; } catch(e) {}
      }
    }

    function playDeploySound(norm) {
      try {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600 + norm * 600, now + 0.2);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } catch(e) {}
    }

    function playFixSound() {
      try {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800 + Math.random() * 400, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } catch(e) {}
    }

    function vibrate(ms) {
      try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {}
    }

    function getCyan(alpha) {
      return isLightMode ? `rgba(0, 136, 170, ${alpha})` : `rgba(0, 255, 204, ${alpha})`;
    }
    
    function getRed(alpha) {
      return isLightMode ? `rgba(220, 20, 20, ${alpha})` : `rgba(255, 51, 51, ${alpha})`;
    }

    function createParticles(x, y, color, count) {
      for(let i=0; i<count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 50 + Math.random() * 100;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          life: 0.3 + Math.random() * 0.3, maxLife: 0.6,
          size: 2 + Math.random() * 2, color: color
        });
      }
    }

    class Agent {
      constructor(x, y, target, chain) {
        this.x = x; this.y = y;
        this.target = null;
        this.setTarget(target);
        this.chain = chain;
        this.speed = 400;
        this.trail = [];
        this.state = 'flying';
        this.dead = false;
      }
      
      setTarget(newTarget) {
        if (this.target) this.target.targetedBy = Math.max(0, (this.target.targetedBy || 0) - 1);
        this.target = newTarget;
        if (this.target) this.target.targetedBy = (this.target.targetedBy || 0) + 1;
      }

      update(dt, nodes) {
        if (this.dead) return;
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > 20) this.trail.shift();

        if (!this.target || !this.target.infected) {
          let infected = nodes.filter(n => n.infected);
          if (infected.length === 0) {
            this.setTarget(null); this.dead = true; return;
          }
          infected.sort((a, b) => {
            let ta = a.targetedBy || 0;
            let tb = b.targetedBy || 0;
            if (ta !== tb) return ta - tb;
            return Math.hypot(a.x - this.x, a.y - this.y) - Math.hypot(b.x - this.x, b.y - this.y);
          });
          this.setTarget(infected[0]);
        }

        let dx = this.target.x - this.x;
        let dy = this.target.y - this.y;
        let dist = Math.hypot(dx, dy);
        
        let moveDist = this.speed * dt;
        if (this.state === 'chaining') moveDist *= 2.5;

        if (dist > 0 && dist <= moveDist) {
          this.x = this.target.x; this.y = this.target.y;
          
          if (this.target.infected) {
            this.target.infected = false;
            score++;
            createParticles(this.x, this.y, getCyan(1), 8);
            playFixSound();
            this.chain--;
          }

          if (this.chain > 0) {
            let nbrs = this.target.edges.filter(n => n.infected);
            if (nbrs.length > 0) {
              nbrs.sort((a, b) => (a.targetedBy||0) - (b.targetedBy||0));
              this.setTarget(nbrs[0]);
              this.state = 'chaining';
            } else {
              let allInf = nodes.filter(n => n.infected);
              if (allInf.length > 0) {
                 allInf.sort((a, b) => {
                   let ta = a.targetedBy || 0; let tb = b.targetedBy || 0;
                   if (ta !== tb) return ta - tb;
                   return Math.hypot(a.x - this.x, a.y - this.y) - Math.hypot(b.x - this.x, b.y - this.y);
                 });
                 this.setTarget(allInf[0]);
                 this.state = 'flying';
              } else {
                 this.setTarget(null); this.dead = true;
              }
            }
          } else {
            this.setTarget(null); this.dead = true;
          }
        } else if (dist > 0) {
          this.x += (dx / dist) * moveDist;
          this.y += (dy / dist) * moveDist;
        }
      }
    }

    function startGame() {
      state = 'playing';
      integrity = 100; score = 0; wave = 1; waveTimer = 2;
      isCharging = false; agents = []; particles = []; nodes = [];
      updateBackground();

      const numNodes = Math.max(10, Math.floor((width * height) / 15000));
      for (let i = 0; i < numNodes; i++) {
        nodes.push({ id: i, x: 30 + Math.random() * (width - 60), y: 80 + Math.random() * (height - 110), edges: [], infected: false, targetedBy: 0 });
      }
      
      for (let iter = 0; iter < 10; iter++) {
        for (let i = 0; i < numNodes; i++) {
          for (let j = i + 1; j < numNodes; j++) {
            let dx = nodes[i].x - nodes[j].x;
            let dy = nodes[i].y - nodes[j].y;
            let dist = Math.hypot(dx, dy);
            if (dist > 0 && dist < 60) {
              let force = (60 - dist) / 2;
              let fx = (dx / dist) * force; let fy = (dy / dist) * force;
              nodes[i].x += fx; nodes[i].y += fy;
              nodes[j].x -= fx; nodes[j].y -= fy;
            }
          }
        }
      }
      
      nodes.forEach(n => {
        n.x = Math.max(20, Math.min(width - 20, n.x));
        n.y = Math.max(80, Math.min(height - 20, n.y));
      });

      nodes.forEach(n => {
        let distances = nodes.filter(o => o !== n).map(o => ({ node: o, dist: Math.hypot(n.x - o.x, n.y - o.y) }));
        distances.sort((a, b) => a.dist - b.dist);
        let numConnections = Math.random() > 0.5 ? 3 : 2;
        for (let i = 0; i < numConnections; i++) {
          if (distances[i]) {
            let target = distances[i].node;
            if (!n.edges.includes(target)) n.edges.push(target);
            if (!target.edges.includes(n)) target.edges.push(n);
          }
        }
      });

      lastTime = performance.now();
      try {
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
      } catch(e){}
    }

    function gameOver() {
      state = 'gameover';
      document.getElementById('final-score').innerText = 'BUGS FIXED: ' + score;
      document.getElementById('game-over-screen').classList.remove('hidden');
      vibrate(500);
    }

    let lastScoreForBg = -1;
    function updateBackground() {
      if (score === lastScoreForBg) return;
      lastScoreForBg = score;
      if (!isLightMode) {
        let dawnLevel = Math.min(score / 150, 1.0);
        let r = Math.floor(10 + dawnLevel * 20), g = Math.floor(25 + dawnLevel * 40), b = Math.floor(47 + dawnLevel * 50);
        let br = Math.floor(2 + dawnLevel * 180), bg = Math.floor(12 + dawnLevel * 80), bb = Math.floor(27 + dawnLevel * 0);
        document.body.style.background = `radial-gradient(circle at center 120%, rgb(${br},${bg},${bb}) 0%, rgb(${r},${g},${b}) 100%)`;
      } else {
        document.body.style.background = `radial-gradient(circle at center, white 0%, #c8dce8 100%)`;
      }
    }

    function deployAgents() {
      let maxCharge = 1.0;
      let norm = Math.min(chargeAmount / maxCharge, 1.0);
      let numAgents = 1 + Math.floor(norm * 7);
      let chainPower = 1 + Math.floor(norm * 4);
      
      let infected = nodes.filter(n => n.infected);
      if (infected.length > 0) {
        infected.sort((a, b) => Math.hypot(a.x - chargePos.x, a.y - chargePos.y) - Math.hypot(b.x - chargePos.x, b.y - chargePos.y));
        for (let i = 0; i < numAgents; i++) {
          let target = infected[i % infected.length];
          agents.push(new Agent(chargePos.x, chargePos.y, target, chainPower));
        }
      }
      playDeploySound(norm);
      vibrate(norm > 0.8 ? 50 : 20);
      createParticles(chargePos.x, chargePos.y, isLightMode ? '#1a2b3c' : '#ffffff', 10 + norm * 20);
    }

    function update(dt) {
      if (isCharging) chargeAmount += dt;

      waveTimer -= dt;
      if (waveTimer <= 0) {
        let numToSpawn = Math.floor(2 + wave * 0.6);
        for (let i=0; i<numToSpawn; i++) {
          let uninfected = nodes.filter(n => !n.infected);
          if (uninfected.length > 0) {
            let n = uninfected[Math.floor(Math.random() * uninfected.length)];
            n.infected = true; n.targetedBy = 0;
          }
        }
        wave++; waveTimer = Math.max(1.0, 4.0 - wave * 0.15);
      }

      let activeBugs = nodes.filter(n => n.infected && !n.targetedBy).length;
      let handledBugs = nodes.filter(n => n.infected && n.targetedBy > 0).length;
      integrity -= (activeBugs * 0.5 + handledBugs * 0.1) * dt;
      
      if (integrity <= 0) { integrity = 0; gameOver(); }
      
      for (let i = agents.length - 1; i >= 0; i--) {
        agents[i].update(dt, nodes);
        if (agents[i].dead) agents.splice(i, 1);
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].life -= dt;
        particles[i].x += particles[i].vx * dt; particles[i].y += particles[i].vy * dt;
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
      
      let bar = document.getElementById('integrity-bar');
      bar.style.width = Math.max(0, integrity) + '%';
      if (integrity < 25) bar.className = 'danger';
      else if (integrity < 50) bar.className = 'warning';
      else bar.className = '';
      
      document.getElementById('score-display').innerText = 'FIXES: ' + score;
      updateBackground();
    }

    function draw(time) {
      ctx.clearRect(0, 0, width, height);
      
      ctx.lineWidth = 1;
      ctx.strokeStyle = getCyan(isLightMode ? 0.3 : 0.15);
      ctx.beginPath();
      nodes.forEach(n => {
        n.edges.forEach(e => {
          if (n.id < e.id) { ctx.moveTo(n.x, n.y); ctx.lineTo(e.x, e.y); }
        });
      });
      ctx.stroke();

      nodes.forEach(n => {
        if (n.infected) {
          let pulse = Math.sin(time / 150) * 0.5 + 0.5;
          ctx.beginPath();
          ctx.arc(n.x, n.y, 6 + pulse * 4, 0, Math.PI * 2);
          if (n.targetedBy > 0) {
            ctx.fillStyle = isLightMode ? `rgba(255, 170, 0, ${0.7 + pulse*0.3})` : `rgba(255, 204, 0, ${0.7 + pulse*0.3})`;
          } else {
            ctx.fillStyle = getRed(0.7 + pulse * 0.3);
          }
          ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(n.x, n.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = getCyan(0.6); ctx.fill();
        }
      });

      agents.forEach(a => {
        if (a.trail.length > 0) {
          ctx.beginPath(); ctx.moveTo(a.trail[0].x, a.trail[0].y);
          for(let i=1; i<a.trail.length; i++) ctx.lineTo(a.trail[i].x, a.trail[i].y);
          ctx.lineTo(a.x, a.y);
          ctx.strokeStyle = a.state === 'chaining' ? (isLightMode ? '#1a2b3c' : '#ffffff') : getCyan(1);
          ctx.lineWidth = a.state === 'chaining' ? 3 : 2;
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(a.x, a.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = isLightMode ? '#1a2b3c' : '#ffffff'; ctx.fill();
        ctx.beginPath(); ctx.arc(a.x, a.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = getCyan(0.5); ctx.fill();
      });

      particles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI*2);
        ctx.fillStyle = p.color; ctx.fill();
      });

      if (isCharging) {
        let norm = Math.min(chargeAmount / 1.0, 1.0);
        ctx.beginPath(); ctx.arc(chargePos.x, chargePos.y, 40 + norm * 40, 0, Math.PI * 2);
        ctx.strokeStyle = norm >= 1.0 ? (isLightMode ? '#1a2b3c' : '#ffffff') : getCyan(0.4 + norm * 0.4);
        if (norm >= 1.0) {
          ctx.stroke();
          ctx.beginPath(); ctx.arc(chargePos.x, chargePos.y, 30 + Math.sin(time/50)*5, 0, Math.PI * 2);
          ctx.strokeStyle = getCyan(1);
        }
        ctx.lineWidth = 4; ctx.stroke();
      }
    }

    function gameLoop(time) {
      requestAnimationFrame(gameLoop);
      let dt = Math.max(0, (time - lastTime) / 1000);
      lastTime = time;
      if (dt > 0.1) dt = 0.1;
      
      if (state === 'playing') update(dt);
      draw(time);
    }

    function resize() {
      width = window.innerWidth; height = window.innerHeight;
      if (width === 0) width = 375; if (height === 0) height = 812; // fallback
      canvas.width = width; canvas.height = height;
    }

    function getPointerPos(e) {
      if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function handlePointerDown(e) {
      initAudio();
      if (state !== 'playing') return;
      e.preventDefault();
      isCharging = true; chargePos = getPointerPos(e); chargeAmount = 0;
    }
    function handlePointerMove(e) {
      if (!isCharging || state !== 'playing') return;
      e.preventDefault();
      chargePos = getPointerPos(e);
    }
    function handlePointerUp(e) {
      if (!isCharging || state !== 'playing') return;
      e.preventDefault();
      isCharging = false; deployAgents();
    }

    function handleKeyDown(e) {
      if (state !== 'playing' || isCharging) return;
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        initAudio();
        isCharging = true;
        chargePos = { x: width / 2, y: height / 2 };
        chargeAmount = 0;
      }
    }

    function handleKeyUp(e) {
      if (!isCharging || state !== 'playing') return;
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        isCharging = false;
        deployAgents();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('game-canvas');
      ctx = canvas.getContext('2d');
      window.addEventListener('resize', resize);
      resize();
      
      if (window.matchMedia) {
        let mq = window.matchMedia('(prefers-color-scheme: light)');
        isLightMode = mq.matches;
        mq.addEventListener('change', e => { isLightMode = e.matches; lastScoreForBg = -1; updateBackground(); });
      }

      canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
      canvas.addEventListener('touchmove', handlePointerMove, {passive: false});
      canvas.addEventListener('touchend', handlePointerUp, {passive: false});
      canvas.addEventListener('contextmenu', e => e.preventDefault());
      canvas.addEventListener('mousedown', handlePointerDown);
      canvas.addEventListener('mousemove', handlePointerMove);
      window.addEventListener('mouseup', handlePointerUp); // bind to window just in case cursor leaves canvas
      document.addEventListener('keydown', handleKeyDown);
      document.addEventListener('keyup', handleKeyUp);

      document.querySelector('[data-smoke="start"]').addEventListener('click', (e) => {
        e.preventDefault(); initAudio();
        document.getElementById('start-screen').classList.add('hidden');
        startGame();
      });

      document.querySelector('[data-smoke="restart"]').addEventListener('click', (e) => {
        e.preventDefault(); initAudio();
        document.getElementById('game-over-screen').classList.add('hidden');
        startGame();
      });

      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
