<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Cutter</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
body{
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  background:var(--bg);color:var(--fg);
  user-select:none;-webkit-user-select:none;
}
:root{
  --bg:#e8ddd0;--fg:#2a3540;--muted:#6b7a85;
  --accent:#c4782a;--accent2:#3d6b7a;--panel:rgba(255,252,248,.88);
  --beam:#ffd080;--water:#4a7a8a;--fog:rgba(140,155,170,.55);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1a22;--fg:#d8e4ec;--muted:#7a8f9e;
    --accent:#e8a040;--accent2:#5a9aaa;--panel:rgba(18,28,36,.92);
    --beam:#ffc860;--water:#1a3a4a;--fog:rgba(80,100,120,.65);
  }
}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;display:block;touch-action:none}
#hud{
  position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;
}
.hud-block{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud-val{font-size:20px;color:var(--fg);font-weight:600;line-height:1.2}
#light-wrap{width:90px}
#light-bar{height:6px;background:rgba(128,128,128,.25);border-radius:3px;margin-top:4px;overflow:hidden}
#light-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px;transition:width .15s}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.25));
}
.overlay.hidden{display:none}
.card{
  background:var(--panel);border-radius:16px;padding:28px 32px;
  text-align:center;max-width:min(340px,90vw);backdrop-filter:blur(12px);
  box-shadow:0 8px 32px rgba(0,0,0,.15);
}
.card h1{font-size:22px;font-weight:600;margin-bottom:6px;color:var(--fg);letter-spacing:-.02em}
.card p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:20px}
.btn{
  pointer-events:auto;border:none;border-radius:12px;padding:14px 36px;
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;min-height:48px;min-width:160px;
  background:var(--accent);color:#fff;transition:transform .12s,opacity .12s;
  box-shadow:0 4px 16px rgba(196,120,42,.35);
}
.btn:active{transform:scale(.96);opacity:.9}
@media(prefers-color-scheme:dark){.btn{box-shadow:0 4px 16px rgba(232,160,64,.25)}}
#combo-pop{
  position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);
  font-size:28px;font-weight:700;color:var(--accent);pointer-events:none;z-index:5;
  opacity:0;text-shadow:0 2px 12px rgba(196,120,42,.4);
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-block"><div>Score</div><div class="hud-val" id="score">0</div></div>
    <div class="hud-block" id="light-wrap"><div>Beacon</div><div id="light-bar"><div id="light-fill"></div></div></div>
    <div class="hud-block" style="text-align:right"><div>Combo</div><div class="hud-val" id="combo">×1</div></div>
  </div>
  <div id="combo-pop"></div>
  <div class="overlay" id="title-screen">
    <div class="card">
      <h1>Fog Cutter</h1>
      <p>Steer the lighthouse beam through clear gaps in the rolling fog. Drag left or right — keep the light alive before ships lose the shore.</p>
      <button class="btn" data-smoke="start" id="btn-start">Light the Beacon</button>
    </div>
  </div>
  <div class="overlay hidden" id="gameover-screen">
    <div class="card">
      <h1 id="go-title">Light Lost</h1>
      <p id="go-msg">The fog swallowed the beam.</p>
      <div class="hud-val" id="final-score" style="margin-bottom:16px">0</div>
      <button class="btn" data-smoke="restart" id="btn-restart">Relight</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('score');
var comboEl = document.getElementById('combo');
var lightFill = document.getElementById('light-fill');
var comboPop = document.getElementById('combo-pop');
var titleScreen = document.getElementById('title-screen');
var gameoverScreen = document.getElementById('gameover-screen');
var goMsg = document.getElementById('go-msg');
var goTitle = document.getElementById('go-title');
var finalScore = document.getElementById('final-score');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 360, H = 640, dpr = 1;
var state = 'title';
var score = 0, combo = 1, bestCombo = 0, light = 100;
var lane = 1, targetLane = 1, laneAnim = 1;
var fogRows = [], particles = [], ripples = [], stars = [];
var elapsed = 0, spawnTimer = 0, speed = 90, fogDensity = 0.35, shipGlow = 0;
var shake = 0, pulse = 0, hitFlash = 0, comboTimer = 0;
var dragStartX = null, dragAccum = 0;
var audioCtx = null, muted = true;

var LANES = 3;
var LANE_W = 0;

function isDark(){
  try { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  catch(e){ return false; }
}

function resize(){
  if(!canvas) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  LANE_W = W / LANES;
}

function initAudio(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC){ audioCtx = new AC(); muted = false; }
  } catch(e){}
}

function playTone(freq, dur, vol, type){
  if(!audioCtx || muted) return;
  try {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

function vibrate(ms){
  try { if(navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}

function rand(a,b){ return a + Math.random() * (b - a); }
function clamp(v,lo,hi){ return v < lo ? lo : v > hi ? hi : v; }

function makeFogRow(y){
  var clears = [];
  var numClear = Math.random() < 0.3 ? 2 : 1;
  var avail = [0,1,2];
  for(var i = 0; i < numClear; i++){
    var idx = Math.floor(Math.random() * avail.length);
    clears.push(avail.splice(idx, 1)[0]);
  }
  var thick = 40 + Math.random() * 30 + fogDensity * 40;
  var blobs = [];
  for(var b = 0; b < 9; b++){
    blobs.push({ lx: rand(0, 1), ly: rand(0, 1), r: rand(8, 18) });
  }
  return { y: y, h: thick, clears: clears, scored: {}, hit: {}, blobs: blobs };
}

function resetGame(){
  score = 0; combo = 1; bestCombo = 0; light = 100;
  lane = 1; targetLane = 1; laneAnim = 1;
  fogRows = []; particles = []; ripples = [];
  elapsed = 0; spawnTimer = 0; speed = 90; fogDensity = 0.35;
  shake = 0; pulse = 0; hitFlash = 0; comboTimer = 0;
  updateHUD();
  fogRows.push(makeFogRow(-60));
}

function updateHUD(){
  if(scoreEl) scoreEl.textContent = score;
  if(comboEl) comboEl.textContent = '×' + combo;
  if(lightFill) lightFill.style.width = clamp(light, 0, 100) + '%';
}

function showComboPop(text){
  if(!comboPop) return;
  comboPop.textContent = text;
  comboPop.style.transition = 'none';
  comboPop.style.opacity = '1';
  comboPop.style.transform = 'translate(-50%,-50%) scale(1.2)';
  requestAnimationFrame(function(){
    comboPop.style.transition = 'transform .4s ease-out, opacity .6s ease-out';
    comboPop.style.transform = 'translate(-50%,-60%) scale(1)';
    comboPop.style.opacity = '0';
  });
}

function spawnParticles(x, y, col, n){
  for(var i = 0; i < n; i++){
    particles.push({
      x: x, y: y,
      vx: rand(-80, 80), vy: rand(-120, -30),
      life: rand(0.4, 0.9), max: 0.9,
      r: rand(2, 5), color: col
    });
  }
}

function spawnRipple(y){
  ripples.push({ y: y, r: 0, life: 1, maxR: W * 0.8 });
}

function switchLane(dir){
  var nl = clamp(targetLane + dir, 0, LANES - 1);
  if(nl !== targetLane){
    targetLane = nl;
    playTone(220 + nl * 60, 0.08, 0.06, 'triangle');
  }
}

function handleClear(row, li){
  if(row.scored[li]) return;
  row.scored[li] = true;
  var pts = Math.floor(10 * combo);
  score += pts;
  light = clamp(light + 8, 0, 100);
  combo = Math.min(combo + 1, 20);
  if(combo > bestCombo) bestCombo = combo;
  comboTimer = 2;
  pulse = 1;
  shipGlow = Math.min(1, shipGlow + 0.15);
  spawnRipple(row.y + row.h * 0.5);
  var bx = (li + 0.5) * LANE_W;
  spawnParticles(bx, row.y + row.h * 0.5, isDark() ? '#ffc860' : '#e8a040', 12);
  playTone(440 + combo * 20, 0.15, 0.1, 'sine');
  vibrate(15);
  if(combo % 5 === 0 && combo > 1) showComboPop('×' + combo + '!');
  updateHUD();
}

function handleFogHit(row, li){
  if(row.hit[li]) return;
  row.hit[li] = true;
  light = clamp(light - 12, 0, 100);
  combo = 1;
  shake = 8;
  hitFlash = 0.4;
  playTone(120, 0.2, 0.08, 'sawtooth');
  vibrate(30);
  updateHUD();
  if(light <= 0) endGame('The beacon flickered out.', false);
}

function endGame(msg, won){
  state = 'over';
  if(goTitle) goTitle.textContent = won ? 'Dawn Breaks' : 'Light Lost';
  if(goMsg) goMsg.textContent = msg || (won ? 'Ships found the shore.' : 'The fog swallowed the beam.');
  if(finalScore) finalScore.textContent = score + ' pts · best ×' + bestCombo;
  if(gameoverScreen) gameoverScreen.classList.remove('hidden');
}

function startGame(){
  initAudio();
  resetGame();
  state = 'play';
  if(titleScreen) titleScreen.classList.add('hidden');
  if(gameoverScreen) gameoverScreen.classList.add('hidden');
}

function update(dt){
  if(state !== 'play') return;
  elapsed += dt;
  spawnTimer += dt;

  var interval = Math.max(0.55, 1.4 - elapsed * 0.015);
  if(spawnTimer >= interval){
    spawnTimer = 0;
    var topY = fogRows.length ? Math.min.apply(null, fogRows.map(function(r){ return r.y; })) : 0;
    fogRows.push(makeFogRow(topY - 50 - Math.random() * 30));
  }

  speed = 90 + elapsed * 4 + fogDensity * 60;
  fogDensity = Math.min(0.85, 0.35 + elapsed * 0.008);

  laneAnim += (targetLane - laneAnim) * Math.min(1, dt * 14);
  lane = Math.round(laneAnim);

  light -= (2.5 + fogDensity * 3) * dt;
  if(light <= 0){ light = 0; endGame('The beacon flickered out.', false); return; }

  shipGlow = Math.max(0, shipGlow - dt * 0.08);

  if(comboTimer > 0) comboTimer -= dt;
  else if(combo > 1){ combo = 1; updateHUD(); }

  var beamY = H * 0.78;
  var beamX = (laneAnim + 0.5) * LANE_W;

  for(var i = fogRows.length - 1; i >= 0; i--){
    var row = fogRows[i];
    row.y += speed * dt;
    if(row.y > H + 50){ fogRows.splice(i, 1); continue; }

    var inZone = row.y + row.h > beamY - 30 && row.y < beamY + 30;
    if(inZone){
      var li = clamp(Math.round(laneAnim), 0, LANES - 1);
      if(row.clears.indexOf(li) >= 0) handleClear(row, li);
      else handleFogHit(row, li);
    }
  }

  for(i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt;
    if(p.life <= 0) particles.splice(i, 1);
  }
  for(i = ripples.length - 1; i >= 0; i--){
    var rp = ripples[i];
    rp.life -= dt * 0.8; rp.r += 200 * dt;
    if(rp.life <= 0) ripples.splice(i, 1);
  }

  if(shake > 0) shake *= Math.pow(0.85, dt * 60);
  if(pulse > 0) pulse = Math.max(0, pulse - dt * 1.5);
  if(hitFlash > 0) hitFlash = Math.max(0, hitFlash - dt * 2);

  if(elapsed >= 55){
    endGame('You held the line through the night.', true);
  }

  updateHUD();
}

function drawSky(){
  var dark = isDark();
  var g = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  if(dark){
    g.addColorStop(0, '#1a2830'); g.addColorStop(0.5, '#243038'); g.addColorStop(1, '#2a3840');
  } else {
    g.addColorStop(0, '#c8b8a8'); g.addColorStop(0.5, '#b0a090'); g.addColorStop(1, '#988878');
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * 0.55);

  if(dark){
    ctx.fillStyle = 'rgba(255,200,120,0.04)';
    for(var s = 0; s < stars.length; s++){
      var st = stars[s];
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, 6.28);
      ctx.fill();
    }
  }
}

function drawShips(){
  var dark = isDark();
  var ships = [{ x: 0.22, w: 0.12 }, { x: 0.72, w: 0.1 }];
  for(var si = 0; si < ships.length; si++){
    var sh = ships[si];
    var sx = sh.x * W, sy = H * 0.58;
    var glow = shipGlow * (0.4 + si * 0.1);
    ctx.fillStyle = dark ? 'rgba(20,35,45,' + (0.7 + glow * 0.3) + ')' : 'rgba(40,60,70,' + (0.6 + glow * 0.3) + ')';
    ctx.beginPath();
    ctx.moveTo(sx - sh.w * W, sy);
    ctx.lineTo(sx + sh.w * W, sy);
    ctx.lineTo(sx + sh.w * W * 0.6, sy + 14);
    ctx.lineTo(sx - sh.w * W * 0.6, sy + 14);
    ctx.closePath();
    ctx.fill();
    if(glow > 0.05){
      ctx.fillStyle = 'rgba(255,200,100,' + (glow * 0.35) + ')';
      ctx.fillRect(sx - 2, sy - 18, 4, 10);
    }
  }
}

function drawWater(){
  var dark = isDark();
  var base = dark ? '#142830' : '#5a8898';
  var g = ctx.createLinearGradient(0, H * 0.45, 0, H);
  g.addColorStop(0, dark ? '#1a3848' : '#6a98a8');
  g.addColorStop(0.4, base);
  g.addColorStop(1, dark ? '#0a1820' : '#3a6878');
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.45, W, H * 0.55);

  var t = elapsed * 0.5;
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = dark ? '#4a8090' : '#8ab8c8';
  ctx.lineWidth = 1;
  for(var w = 0; w < 6; w++){
    ctx.beginPath();
    for(var x = 0; x <= W; x += 8){
      var y = H * 0.52 + w * 28 + Math.sin(x * 0.02 + t + w) * 4;
      if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for(var r = 0; r < ripples.length; r++){
    var rp = ripples[r];
    ctx.globalAlpha = rp.life * 0.35;
    ctx.strokeStyle = dark ? '#ffc860' : '#e8a040';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(W * 0.5, rp.y, rp.r, rp.r * 0.25, 0, 0, 6.28);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  if(pulse > 0){
    ctx.globalAlpha = pulse * 0.25;
    var pg = ctx.createRadialGradient(W*0.5, H*0.7, 0, W*0.5, H*0.7, W*0.6);
    pg.addColorStop(0, dark ? '#ffc860' : '#ffd080');
    pg.addColorStop(1, 'transparent');
    ctx.fillStyle = pg;
    ctx.fillRect(0, H*0.45, W, H*0.55);
    ctx.globalAlpha = 1;
  }
}

function drawFogRows(){
  var dark = isDark();
  for(var i = 0; i < fogRows.length; i++){
    var row = fogRows[i];
    for(var li = 0; li < LANES; li++){
      var x = li * LANE_W;
      var isClear = row.clears.indexOf(li) >= 0;
      if(isClear){
        ctx.fillStyle = dark ? 'rgba(255,200,100,0.08)' : 'rgba(255,220,160,0.15)';
      } else {
        ctx.fillStyle = dark ? 'rgba(70,90,110,0.7)' : 'rgba(140,160,175,0.55)';
      }
      ctx.beginPath();
      var pad = 3;
      roundRect(ctx, x + pad, row.y, LANE_W - pad * 2, row.h, 8);
      ctx.fill();

      if(!isClear && row.blobs){
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = dark ? '#607080' : '#a0b0c0';
        for(var f = 0; f < row.blobs.length; f++){
          if(f % 3 !== li) continue;
          var bl = row.blobs[f];
          ctx.beginPath();
          ctx.arc(x + bl.lx * LANE_W, row.y + bl.ly * row.h, bl.r, 0, 6.28);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
  }
}

function roundRect(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r);
  c.closePath();
}

function drawLighthouse(){
  var dark = isDark();
  var bx = W * 0.5, by = H * 0.82;
  var bw = LANE_W * 0.35, bh = H * 0.12;

  ctx.fillStyle = dark ? '#2a3840' : '#d8ccc0';
  ctx.fillRect(bx - bw * 0.3, by - bh, bw * 0.6, bh);

  ctx.fillStyle = dark ? '#ffc860' : '#e8a040';
  ctx.beginPath();
  ctx.arc(bx, by - bh - 8, 10, 0, 6.28);
  ctx.fill();

  ctx.fillStyle = dark ? '#1a2830' : '#c0b0a0';
  ctx.fillRect(bx - bw * 0.5, by - bh * 0.3, bw, bh * 0.35);

  var beamX = (laneAnim + 0.5) * LANE_W;
  var beamY = by - bh * 0.5;
  var angle = Math.atan2(beamY - H * 0.3, beamX - bx);
  var beamLen = Math.hypot(beamX - bx, beamY - H * 0.3) + 40;

  ctx.save();
  ctx.translate(bx, beamY);
  ctx.rotate(angle);
  var bg = ctx.createLinearGradient(0, 0, beamLen, 0);
  var intensity = clamp(light / 100, 0.2, 1);
  bg.addColorStop(0, 'rgba(255,200,80,' + (0.5 * intensity) + ')');
  bg.addColorStop(0.5, 'rgba(255,200,80,' + (0.15 * intensity) + ')');
  bg.addColorStop(1, 'transparent');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(0, -6);
  ctx.lineTo(beamLen, -beamLen * 0.12);
  ctx.lineTo(beamLen, beamLen * 0.12);
  ctx.lineTo(0, 6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = dark ? '#ffc860' : '#e8a040';
  ctx.shadowColor = dark ? '#ffc860' : '#e8a040';
  ctx.shadowBlur = 20 * intensity;
  ctx.beginPath();
  ctx.arc(bx, beamY, 6, 0, 6.28);
  ctx.fill();
  ctx.shadowBlur = 0;

  for(var li = 0; li < LANES; li++){
    var lx = (li + 0.5) * LANE_W;
    ctx.strokeStyle = dark ? 'rgba(255,200,100,0.15)' : 'rgba(200,150,80,0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(lx, H * 0.55);
    ctx.lineTo(lx, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  var indX = (laneAnim + 0.5) * LANE_W;
  ctx.strokeStyle = dark ? '#ffc860' : '#c4782a';
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.6 + Math.sin(elapsed * 6) * 0.2;
  ctx.beginPath();
  ctx.arc(indX, H * 0.78, 14, 0, 6.28);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawParticles(){
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function draw(){
  if(!ctx) return;
  ctx.save();
  if(shake > 0.5){
    ctx.translate(rand(-shake, shake), rand(-shake, shake));
  }
  if(hitFlash > 0){
    ctx.fillStyle = 'rgba(180,60,40,' + hitFlash * 0.3 + ')';
    ctx.fillRect(0, 0, W, H);
  }
  drawSky();
  drawWater();
  drawShips();
  drawFogRows();
  drawLighthouse();
  drawParticles();
  ctx.restore();
}

function drawIdle(){
  if(!ctx) return;
  drawSky();
  drawWater();
  drawShips();
  drawLighthouse();
}

function initStars(){
  stars = [];
  for(var i = 0; i < 40; i++){
    stars.push({ x: rand(0, W), y: rand(0, H * 0.4), r: rand(0.5, 1.5) });
  }
}

var lastT = 0;
function loop(t){
  var dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  if(state === 'play'){ update(dt); draw(); }
  else drawIdle();
  requestAnimationFrame(loop);
}

function ptrX(e){
  if(e.clientX != null) return e.clientX;
  if(e.touches && e.touches[0]) return e.touches[0].clientX;
  if(e.changedTouches && e.changedTouches[0]) return e.changedTouches[0].clientX;
  return 0;
}

function onPointerDown(e){
  if(state !== 'play') return;
  e.preventDefault();
  dragStartX = ptrX(e);
  dragAccum = 0;
  dragMoved = 0;
}

function onPointerMove(e){
  if(state !== 'play' || dragStartX === null) return;
  e.preventDefault();
  var x = ptrX(e);
  var step = x - dragStartX;
  dragStartX = x;
  dragAccum += step;
  dragMoved += Math.abs(step);
  if(Math.abs(dragAccum) > 36){
    switchLane(dragAccum > 0 ? 1 : -1);
    dragAccum = 0;
  }
}

var dragMoved = 0;
function onPointerUp(e){
  if(e) e.preventDefault();
  if(state === 'play' && dragMoved < 12){
    var x = ptrX(e);
    if(x < W * 0.33) switchLane(-1);
    else if(x > W * 0.67) switchLane(1);
  }
  dragStartX = null;
  dragAccum = 0;
  dragMoved = 0;
}

function onKey(e){
  if(state !== 'play') return;
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') switchLane(-1);
  if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') switchLane(1);
}

if(btnStart) btnStart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
if(btnRestart) btnRestart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

if(canvas){
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('mouseleave', onPointerUp);
  canvas.addEventListener('touchstart', onPointerDown, {passive:false});
  canvas.addEventListener('touchmove', onPointerMove, {passive:false});
  canvas.addEventListener('touchend', onPointerUp, {passive:false});
  canvas.addEventListener('touchcancel', onPointerUp, {passive:false});
}
window.addEventListener('keydown', onKey);
window.addEventListener('resize', function(){ resize(); initStars(); });

try {
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){});
  }
} catch(e){}

resize();
initStars();
drawIdle();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
