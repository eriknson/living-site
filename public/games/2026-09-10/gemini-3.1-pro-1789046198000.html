<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autumn Shred</title>
<style>
  :root {
    --bg-light: #F4EFE6;
    --text-light: #2C3539;
    --primary-light: #D95C14;
    --overlay-light: rgba(244, 239, 230, 0.9);
    
    --bg-dark: #1A1614;
    --text-dark: #E0D8C8;
    --primary-dark: #E3A834;
    --overlay-dark: rgba(26, 22, 20, 0.95);
    
    --bg: var(--bg-light);
    --text: var(--text-light);
    --primary: var(--primary-light);
    --overlay: var(--overlay-light);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--bg-dark);
      --text: var(--text-dark);
      --primary: var(--primary-dark);
      --overlay: var(--overlay-dark);
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100dvw; height: 100dvh;
    overflow: hidden; background: var(--bg); color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none; -webkit-user-select: none;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none;
  }
  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column;
    z-index: 10;
  }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--overlay); display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .hidden { display: none !important; }
  button {
    pointer-events: auto;
    padding: 1rem 2.5rem; font-size: 1.5rem; font-family: inherit;
    background: var(--primary); color: #fff; border: none;
    border-radius: 12px; cursor: pointer; text-transform: uppercase;
    font-weight: bold; box-shadow: 0 6px 0 rgba(0,0,0,0.2);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active {
    transform: translateY(6px); box-shadow: none;
  }
  #hud {
    padding: 1.5rem; display: flex; justify-content: space-between;
    align-items: flex-start;
  }
  .hud-pill {
    background: var(--bg);
    padding: 0.5rem 1rem;
    border-radius: 12px;
    border: 2px solid var(--text);
    font-weight: bold;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
  }
  h1 { font-size: 2.5rem; margin-bottom: 0.5rem; text-align: center; }
  p { font-size: 1.1rem; text-align: center; max-width: 80%; line-height: 1.5; margin-bottom: 2rem; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="hud" class="hidden">
      <div id="scoreDisplay" class="hud-pill">Stacks: 0 <br> <span style="font-size:0.9em; color:var(--primary)">☆☆☆</span></div>
      <div id="timeDisplay" class="hud-pill" style="font-size: 1.5rem; color: var(--primary);">60s</div>
    </div>
    <div id="startScreen" class="overlay">
      <h1>Autumn Shred</h1>
      <p>Flick leaves into the bin.<br>3 in a row shreds a stack.<br>Beware the fine print.</p>
      <button data-smoke="start" id="startBtn">Start</button>
    </div>
    <div id="gameOverScreen" class="overlay hidden">
      <h1 style="color: var(--primary);">Time's Up</h1>
      <p id="finalScore" style="font-size: 1.5rem; font-weight: bold;">Stacks Shredded: 0</p>
      <button data-smoke="restart" id="restartBtn">Play Again</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let width, height, gravity;
    
    let isDarkTheme = false;
    let themeBg, themeText, themePrimary;
    
    function updateTheme() {
      isDarkTheme = matchMedia('(prefers-color-scheme: dark)').matches;
      themeBg = isDarkTheme ? '#1A1614' : '#F4EFE6';
      themeText = isDarkTheme ? '#E0D8C8' : '#2C3539';
      themePrimary = isDarkTheme ? '#E3A834' : '#D95C14';
    }
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
    updateTheme();

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioContext ? new AudioContext() : null;

    function playTone(freq, type, duration, vol=0.1) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function playShred() {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSize = audioCtx.sampleRate * 0.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch(e) {}
    }

    let gameState = 'start'; // start, playing, gameover
    let score = 0;
    let consecutiveHits = 0;
    let timeLeft = 60;
    let lastTime = 0;
    
    let leaf = { x: 0, y: 0, vx: 0, vy: 0, radius: 15, active: false, color: '#D95C14', rot: 0, vrot: 0 };
    let bin = { x: 0, y: 0, w: 140, h: 30 };
    let bands = [];
    let particles = [];
    let windCurrent = 0, windTarget = 0, windTimer = 0;
    let bgDocs = [];
    
    function initBg() {
      bgDocs = [];
      for (let i = 0; i < 15; i++) {
        bgDocs.push({
          x: Math.random() * width,
          y: Math.random() * height,
          w: 120 + Math.random() * 150,
          h: 180 + Math.random() * 200,
          rot: (Math.random() - 0.5) * 0.4,
          text: ["AFFIDAVIT", "EXHIBIT A", "SUBPOENA", "DEPOSITION", "CONTRACT"][Math.floor(Math.random()*5)]
        });
      }
    }

    function resize() {
      width = window.innerWidth || 320;
      height = window.innerHeight || 480;
      canvas.width = width * devicePixelRatio;
      canvas.height = height * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);
      gravity = height * 1.5;
      bin.x = width / 2 - bin.w / 2;
      bin.y = height * 0.12;
      if (!leaf.active) {
        leaf.x = width / 2;
        leaf.y = height - 120;
      }
      initBg();
    }
    window.addEventListener('resize', resize);

    function generateBands(levelScore) {
      bands = [];
      let level = Math.min(levelScore, 8);
      const texts = ["SECTION 4(b)", "FORCE MAJEURE", "NON-DISCLOSURE", "ARBITRATION", "VOID IF DETACHED", "LIABILITY WAIVER"];
      
      function addBand(cx, cy, length, angle, moveRadius=0, moveSpeed=0) {
        bands.push({
          cx, cy, length, angle, moveRadius, moveSpeed,
          phase: Math.random() * Math.PI * 2,
          text: texts[Math.floor(Math.random() * texts.length)],
          x1: 0, y1: 0, x2: 0, y2: 0, rotSpeed: 0
        });
      }

      if (level >= 1) {
        addBand(width * 0.2, height * 0.4, width * 0.4, 0.3);
        addBand(width * 0.8, height * 0.4, width * 0.4, -0.3);
      }
      if (level >= 2) {
        addBand(width * 0.5, height * 0.6, width * 0.35, 0, width * 0.15, 2);
      }
      if (level >= 3) {
        addBand(width * 0.3, height * 0.28, width * 0.3, Math.PI/4);
        addBand(width * 0.7, height * 0.28, width * 0.3, -Math.PI/4);
      }
      if (level >= 4) {
        addBand(width * 0.5, height * 0.5, width * 0.4, 0, width * 0.25, 3.5);
      }
      if (level >= 5) {
        addBand(width * 0.15, height * 0.5, height * 0.25, Math.PI/2);
        addBand(width * 0.85, height * 0.5, height * 0.25, Math.PI/2);
      }
      if (level >= 6) {
        addBand(width * 0.5, height * 0.35, width * 0.3, 0, 40, 4);
        bands[bands.length-1].rotSpeed = 1.5; 
      }
    }

    function resetLeaf() {
      leaf.x = width / 2;
      leaf.y = height - 120;
      leaf.vx = 0;
      leaf.vy = 0;
      leaf.active = false;
      leaf.rot = 0;
      leaf.vrot = 0;
      const colors = ['#D95C14', '#C22F1D', '#E3A834', '#3C5A3E'];
      leaf.color = colors[Math.floor(Math.random() * colors.length)];
    }

    function updateHUD() {
      const stars = '★'.repeat(consecutiveHits) + '☆'.repeat(3 - consecutiveHits);
      document.getElementById('scoreDisplay').innerHTML = `Stacks: ${score} <br> <span style="font-size:0.9em; color:var(--primary)">${stars}</span>`;
    }

    function spawnShreds(x, y, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random()-0.5)*bin.w*0.8,
          y: y,
          vx: (Math.random() - 0.5) * 500,
          vy: (Math.random() - 1) * 700 - 100,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 20,
          size: 6 + Math.random() * 10,
          life: 1 + Math.random() * 1.5,
          maxLife: 2.5,
          color: ['#F4EFE6', '#E0D8C8', '#2C3539', '#D95C14', '#E3A834'][Math.floor(Math.random() * 5)]
        });
      }
    }

    function scoreHit() {
      consecutiveHits++;
      if (consecutiveHits >= 3) {
        score++;
        consecutiveHits = 0;
        spawnShreds(bin.x + bin.w/2, bin.y + bin.h/2, 80);
        generateBands(score);
        playShred();
        if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
      } else {
        spawnShreds(bin.x + bin.w/2, bin.y + bin.h/2, 15);
        playTone(800, 'sine', 0.2, 0.1);
        setTimeout(() => playTone(1200, 'sine', 0.3, 0.1), 100);
        if (navigator.vibrate) navigator.vibrate(15);
      }
      resetLeaf();
      updateHUD();
    }

    function scoreMiss() {
      consecutiveHits = 0;
      resetLeaf();
      updateHUD();
      playTone(150, 'sawtooth', 0.4, 0.1);
      if (navigator.vibrate) navigator.vibrate(25);
    }

    function startRound() {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      gameState = 'playing';
      score = 0;
      consecutiveHits = 0;
      timeLeft = 60;
      windCurrent = 0;
      windTarget = 0;
      particles = [];
      generateBands(0);
      resetLeaf();
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      updateHUD();
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      gameState = 'gameover';
      document.getElementById('gameOverScreen').classList.remove('hidden');
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('finalScore').innerText = `Stacks Shredded: ${score}`;
    }

    document.getElementById('startBtn').addEventListener('click', startRound);
    document.getElementById('restartBtn').addEventListener('click', startRound);

    let pointerPath = [];
    let isDragging = false;

    const handlePointerDown = e => {
      if (gameState !== 'playing' || leaf.active) return;
      isDragging = true;
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let clientY = e.touches ? e.touches[0].clientY : e.clientY;
      pointerPath = [{x: clientX, y: clientY, t: performance.now()}];
    };

    const handlePointerMove = e => {
      if (!isDragging) return;
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let clientY = e.touches ? e.touches[0].clientY : e.clientY;
      pointerPath.push({x: clientX, y: clientY, t: performance.now()});
      if (pointerPath.length > 15) pointerPath.shift();
    };

    const handlePointerUp = e => {
      if (!isDragging) return;
      isDragging = false;
      
      let now = performance.now();
      let past = pointerPath[0];
      for (let i = pointerPath.length - 1; i >= 0; i--) {
        if (now - pointerPath[i].t > 60) {
          past = pointerPath[i];
          break;
        }
      }
      
      let dt_ms = now - past.t;
      if (dt_ms > 10) {
        let lastPoint = pointerPath[pointerPath.length - 1];
        let dx = lastPoint.x - past.x;
        let dy = lastPoint.y - past.y;
        
        if (dy < -20) {
          leaf.active = true;
          let vx = (dx / dt_ms) * 1000 * 1.5;
          let vy = (dy / dt_ms) * 1000 * 1.5;
          
          let speed = Math.hypot(vx, vy);
          let maxSpeed = height * 4;
          if (speed > maxSpeed) {
            vx = (vx / speed) * maxSpeed;
            vy = (vy / speed) * maxSpeed;
          }
          
          leaf.vx = vx;
          leaf.vy = vy;
          leaf.vrot = (Math.random() - 0.5) * 15;
          
          playTone(300, 'sine', 0.2, 0.1);
          if (navigator.vibrate) navigator.vibrate(10);
        }
      }
    };

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);
    
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e); }, {passive: false});
    window.addEventListener('touchend', handlePointerUp);

    function shadeColor(color, percent) {
      let R = parseInt(color.substring(1,3),16);
      let G = parseInt(color.substring(3,5),16);
      let B = parseInt(color.substring(5,7),16);
      R = parseInt(R * (100 + percent) / 100);
      G = parseInt(G * (100 + percent) / 100);
      B = parseInt(B * (100 + percent) / 100);
      R = Math.max(0, Math.min(255, R));
      G = Math.max(0, Math.min(255, G));
      B = Math.max(0, Math.min(255, B));
      let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
      let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
      let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
      return "#"+RR+GG+BB;
    }

    function drawOrigamiLeaf(ctx, x, y, size, rotation, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(size, size);
      ctx.lineWidth = 2 / size;
      ctx.strokeStyle = isDarkTheme ? '#1A1614' : '#2C3539';
      ctx.lineJoin = 'round';
      
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, -1); ctx.lineTo(0.3, -0.4); ctx.lineTo(0.8, -0.5);
      ctx.lineTo(0.5, 0.1); ctx.lineTo(0.7, 0.6); ctx.lineTo(0, 0.5);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      
      ctx.fillStyle = shadeColor(color, -15);
      ctx.beginPath();
      ctx.moveTo(0, -1); ctx.lineTo(-0.3, -0.4); ctx.lineTo(-0.8, -0.5);
      ctx.lineTo(-0.5, 0.1); ctx.lineTo(-0.7, 0.6); ctx.lineTo(0, 0.5);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(0, 0.5); ctx.lineTo(0, 1.0);
      ctx.stroke();
      ctx.restore();
    }

    function drawBg(ctx) {
      ctx.fillStyle = themeBg;
      ctx.fillRect(0, 0, width, height);
      
      ctx.fillStyle = isDarkTheme ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.03)';
      ctx.strokeStyle = isDarkTheme ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
      ctx.lineWidth = 1;
      
      for (let doc of bgDocs) {
        ctx.save();
        ctx.translate(doc.x, doc.y);
        ctx.rotate(doc.rot);
        ctx.fillRect(-doc.w/2, -doc.h/2, doc.w, doc.h);
        ctx.strokeRect(-doc.w/2, -doc.h/2, doc.w, doc.h);
        ctx.fillStyle = isDarkTheme ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.08)';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(doc.text, -doc.w/2 + 15, -doc.h/2 + 30);
        for(let ly = -doc.h/2 + 50; ly < doc.h/2 - 20; ly += 15) {
          ctx.fillRect(-doc.w/2 + 15, ly, doc.w - 30, 4);
        }
        ctx.restore();
      }
    }

    function drawBin(ctx) {
      ctx.save();
      ctx.translate(bin.x, bin.y);
      ctx.fillStyle = isDarkTheme ? '#3A2E20' : '#8B7355';
      ctx.fillRect(0, 0, bin.w, bin.h);
      ctx.fillStyle = isDarkTheme ? '#000' : '#2C3539';
      ctx.fillRect(10, 5, bin.w - 20, bin.h - 10);
      ctx.fillStyle = isDarkTheme ? '#555' : '#AAA';
      for (let i = 15; i < bin.w - 15; i += 12) {
        ctx.beginPath();
        ctx.moveTo(i, 5); ctx.lineTo(i + 6, 12); ctx.lineTo(i + 12, 5);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(i, bin.h - 5); ctx.lineTo(i + 6, bin.h - 12); ctx.lineTo(i + 12, bin.h - 5);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawBand(ctx, band) {
      ctx.save();
      ctx.strokeStyle = isDarkTheme ? '#E0D8C8' : '#2C3539';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(band.x1, band.y1);
      ctx.lineTo(band.x2, band.y2);
      ctx.stroke();
      
      ctx.translate(band.x1, band.y1);
      let angle = Math.atan2(band.y2 - band.y1, band.x2 - band.x1);
      ctx.rotate(angle);
      ctx.fillStyle = isDarkTheme ? '#1A1614' : '#F4EFE6';
      ctx.font = 'bold 11px monospace';
      ctx.textBaseline = 'middle';
      let len = Math.hypot(band.x2 - band.x1, band.y2 - band.y1);
      ctx.beginPath();
      ctx.rect(0, -10, len, 20);
      ctx.clip();
      let textW = ctx.measureText(band.text).width + 20;
      for(let x = 10; x < len; x += textW) {
        ctx.fillText(band.text, x, 0);
      }
      ctx.restore();
    }

    function drawTrajectory(ctx) {
      if (isDragging && pointerPath.length > 0) {
        let now = performance.now();
        let past = pointerPath[0];
        for (let i = pointerPath.length - 1; i >= 0; i--) {
          if (now - pointerPath[i].t > 60) { past = pointerPath[i]; break; }
        }
        let dt_ms = now - past.t;
        if (dt_ms > 10) {
          let lastPoint = pointerPath[pointerPath.length - 1];
          let dx = lastPoint.x - past.x;
          let dy = lastPoint.y - past.y;
          if (dy < -20) {
            let vx = (dx / dt_ms) * 1000 * 1.5;
            let vy = (dy / dt_ms) * 1000 * 1.5;
            let speed = Math.hypot(vx, vy);
            let maxSpeed = height * 4;
            if (speed > maxSpeed) { vx = (vx/speed)*maxSpeed; vy = (vy/speed)*maxSpeed; }
            
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(217, 92, 20, 0.4)';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 8]);
            let simX = leaf.x, simY = leaf.y, simVx = vx, simVy = vy;
            ctx.moveTo(simX, simY);
            for (let i = 0; i < 15; i++) {
              simVy += gravity * 0.03;
              simVx += windCurrent * 0.03;
              simX += simVx * 0.03;
              simY += simVy * 0.03;
              ctx.lineTo(simX, simY);
            }
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }
      }
    }

    let idleTime = 0;
    function loop(time) {
      if (gameState !== 'playing') return;
      let dt = (time - lastTime) / 1000;
      lastTime = time;
      if (dt > 0.1) dt = 0.1;
      if (dt < 0) dt = 0;
      
      timeLeft -= dt;
      if (timeLeft <= 0) {
        gameOver();
        return;
      }
      document.getElementById('timeDisplay').innerText = Math.ceil(timeLeft) + 's';
      
      windTimer -= dt;
      if (windTimer <= 0) {
        windTimer = 2 + Math.random() * 3;
        windTarget = (Math.random() - 0.5) * (150 + score * 50);
      }
      windCurrent += (windTarget - windCurrent) * dt * 2;
      
      for (let b of bands) {
        if (b.rotSpeed) b.angle += b.rotSpeed * dt;
        if (b.moveSpeed || b.rotSpeed) {
          if (b.moveSpeed) b.phase += b.moveSpeed * dt;
          let offsetX = b.moveRadius ? Math.cos(b.phase) * b.moveRadius : 0;
          let offsetY = b.moveRadius ? Math.sin(b.phase) * b.moveRadius : 0;
          b.x1 = b.cx + offsetX - Math.cos(b.angle) * b.length / 2;
          b.y1 = b.cy + offsetY - Math.sin(b.angle) * b.length / 2;
          b.x2 = b.cx + offsetX + Math.cos(b.angle) * b.length / 2;
          b.y2 = b.cy + offsetY + Math.sin(b.angle) * b.length / 2;
        }
      }
      
      if (leaf.active) {
        let prevY = leaf.y;
        leaf.vy += gravity * dt;
        leaf.vx += windCurrent * dt;
        leaf.x += leaf.vx * dt;
        leaf.y += leaf.vy * dt;
        leaf.rot += leaf.vrot * dt;
        
        if (prevY <= bin.y && leaf.y >= bin.y && leaf.x > bin.x && leaf.x < bin.x + bin.w && leaf.vy > 0) {
          scoreHit();
        } else if (leaf.y > height + 50 || leaf.x < -100 || leaf.x > width + 100 || leaf.y < -height*2) {
          scoreMiss();
        } else {
          for (let band of bands) {
            let dx = band.x2 - band.x1;
            let dy = band.y2 - band.y1;
            let len2 = dx*dx + dy*dy;
            let t = ((leaf.x - band.x1) * dx + (leaf.y - band.y1) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            let closestX = band.x1 + t * dx;
            let closestY = band.y1 + t * dy;
            let nx = leaf.x - closestX;
            let ny = leaf.y - closestY;
            let dist = Math.hypot(nx, ny);
            
            if (dist > 0 && dist < leaf.radius) {
              nx /= dist; ny /= dist;
              let dot = leaf.vx * nx + leaf.vy * ny;
              if (dot < 0) {
                leaf.vx -= 1.8 * dot * nx;
                leaf.vy -= 1.8 * dot * ny;
                leaf.vrot += (Math.random() - 0.5) * 30;
                playTone(600, 'triangle', 0.1, 0.05);
                if (navigator.vibrate) navigator.vibrate(5);
              }
              let overlap = leaf.radius - dist;
              leaf.x += nx * overlap;
              leaf.y += ny * overlap;
            }
          }
        }
      } else {
        idleTime += dt;
        leaf.y = height - 120 + Math.sin(idleTime * 4) * 6;
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.vy += gravity * 0.8 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vrot * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      
      drawBg(ctx);
      
      ctx.strokeStyle = isDarkTheme ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
      ctx.lineWidth = 2;
      for(let i=0; i<5; i++) {
        let wx = (time * 0.1 * (i+1) + windCurrent * 0.5) % width;
        if (wx < 0) wx += width;
        let wy = (height * 0.2 * i + time * 0.05) % height;
        ctx.beginPath();
        ctx.moveTo(wx, wy); ctx.lineTo(wx + windCurrent * 0.2, wy);
        ctx.stroke();
      }
      
      drawBin(ctx);
      for (let band of bands) drawBand(ctx, band);
      drawTrajectory(ctx);
      
      if (leaf.active || gameState === 'playing') {
        drawOrigamiLeaf(ctx, leaf.x, leaf.y, leaf.radius, leaf.rot, leaf.color);
      }
      
      for (let p of particles) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      }
      
      requestAnimationFrame(loop);
    }
    
    resize();
    drawBg(ctx);
    drawBin(ctx);
    drawOrigamiLeaf(ctx, width/2, height - 120, 15, 0, '#D95C14');
  </script>
</body>
