<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#02090e" />
<title>PULSEGUARD — neon vitals defense</title>
<style>
  :root{
    color-scheme: light dark;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    --ink: #062028;
    --dim: rgba(6,32,40,0.6);
    --line: rgba(6,120,150,0.28);
    --accent: #028cb0;
    --bg: #e9f1f3;
    --panel: rgba(255,255,255,0.55);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink: #dff6f9;
      --dim: rgba(210,240,245,0.62);
      --line: rgba(120,232,255,0.26);
      --accent: #38e7ff;
      --bg: #02090e;
      --panel: rgba(6,20,28,0.5);
    }
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg); color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
    overscroll-behavior: none;
  }
  #game{
    position: relative;
    width: 100dvw; height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: crosshair;
  }
  canvas#c{
    position:absolute; inset:0; width:100%; height:100%;
    display:block;
    touch-action: none;
  }

  /* ---------- HUD ---------- */
  #integrityTop{
    position:absolute; left:0; right:0;
    top: env(safe-area-inset-top);
    height:4px;
    background: rgba(127,127,127,0.16);
    z-index:6; pointer-events:none;
    transition: opacity .35s ease;
  }
  #integrityFill{
    height:100%; width:100%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    transition: width .18s ease, background .3s ease;
    transform-origin:left center;
  }
  #hud{
    position:absolute; left:0; right:0; top:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:10px;
    padding: max(14px, calc(env(safe-area-inset-top) + 10px)) 16px 8px 16px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(64px, env(safe-area-inset-right));
    pointer-events:none;
    z-index: 5;
    font-variant-numeric: tabular-nums;
    transition: opacity .35s ease;
  }
  .hud-col{ display:flex; flex-direction:column; gap:3px; }
  .hud-col.center{ align-items:center; }
  .hud-col.right{ align-items:flex-end; }
  .lbl{ font-size:10px; letter-spacing:.22em; color:var(--dim); text-transform:uppercase; }
  .val{ font-size:21px; font-weight:600; letter-spacing:.02em; line-height:1; }
  #score{ font-size:25px; }
  #corePct{ font-size:18px; color:var(--accent); }
  #combo{ color: var(--accent); transition: transform .12s cubic-bezier(.2,1.4,.4,1); transform-origin:right center; }
  .ui-off{ opacity:0 !important; visibility:hidden; }

  .iconbtn{
    pointer-events:auto;
    font-family:var(--mono);
    background: var(--panel);
    color: var(--ink);
    border:1px solid var(--line);
    border-radius:10px;
    width:40px; height:40px; min-width:40px;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform .1s ease, border-color .2s ease;
  }
  .iconbtn:active{ transform:scale(.92); }

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 28px;
    pointer-events:none;   /* click-through except explicit controls */
    z-index: 10;
  }
  .overlay.hidden{ display:none; }
  .panel{
    max-width: 460px; width:100%;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    animation: rise .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .panel{ animation:none; } }

  .kicker{ font-size:11px; letter-spacing:.42em; color:var(--dim); text-transform:uppercase; }
  h1.title{
    margin:0; font-size: clamp(38px, 13vw, 76px);
    letter-spacing:.06em; font-weight:700; line-height:.92;
  }
  .title .g{ color: var(--accent); }
  h2.over{
    margin:0; font-size: clamp(30px, 10vw, 54px); letter-spacing:.05em; font-weight:700;
  }
  .lead{
    margin:0; font-size: clamp(13px, 3.6vw, 15px); line-height:1.5;
    color:var(--ink); opacity:.88; max-width: 34ch;
  }
  .subtle{ color:var(--dim); font-size:12px; letter-spacing:.04em; }

  .btn{
    pointer-events:auto;
    font-family:var(--mono);
    font-size:17px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 14px;
    padding: 16px 34px;
    min-height:56px; min-width: 200px;
    cursor:pointer;
    position:relative;
    box-shadow: 0 0 0 1px var(--line), 0 8px 30px -8px var(--accent);
    transition: transform .12s cubic-bezier(.2,1.4,.4,1), box-shadow .2s ease, filter .2s ease;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn:active{ transform: scale(.95); }
  .btn:focus-visible{ outline: 3px solid var(--accent); outline-offset: 3px; }

  .stats{
    display:grid; grid-template-columns: 1fr 1fr; gap: 12px 26px;
    margin: 4px 0 2px 0;
  }
  .stat{ display:flex; flex-direction:column; gap:3px; }
  .stat .lbl{ font-size:10px; }
  .stat .num{ font-size:26px; font-weight:600; }
  .stat .num.hl{ color:var(--accent); }

  .keys{ font-size:11px; color:var(--dim); letter-spacing:.06em; }
  .keys b{ color:var(--ink); font-weight:600; }

  .fadeIn{ animation: fadeIn .4s ease both; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }

  .badge{
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; font-size:11px; letter-spacing:.2em; color:var(--dim);
    text-transform:uppercase;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
</style>
</head>
<body>
  <div id="game">
    <canvas id="c"></canvas>

    <!-- HUD -->
    <div id="integrityTop" class="ui-off" aria-hidden="true"><div id="integrityFill"></div></div>
    <div id="hud" class="ui-off" aria-hidden="true">
      <div class="hud-col">
        <span class="lbl">Score</span>
        <span class="val" id="score">0</span>
      </div>
      <div class="hud-col center">
        <span class="lbl">Core</span>
        <span class="val" id="corePct">100%</span>
      </div>
      <div class="hud-col right">
        <span class="lbl">Combo</span>
        <span class="val" id="combo">&times;1</span>
      </div>
    </div>

    <button id="mute" class="iconbtn" aria-label="Toggle sound" style="position:absolute; top:max(10px,env(safe-area-inset-top)); right:max(12px,env(safe-area-inset-right)); z-index:6;">♪</button>

    <!-- Title -->
    <div id="title" class="overlay">
      <div class="panel">
        <span class="kicker">neon vitals defense</span>
        <h1 class="title">PULSE<span class="g">GUARD</span></h1>
        <p class="lead"><b>Tap on the beat</b> to shatter incoming intent<br/>before it breaches the core.</p>
        <button id="startBtn" class="btn" data-smoke="start">▶ Begin</button>
        <p class="keys">tap anywhere &middot; <b>space</b> / <b>↑</b> to pulse</p>
      </div>
    </div>

    <!-- Game over -->
    <div id="over" class="overlay hidden">
      <div class="panel">
        <span class="badge"><span class="dot" style="background:#ff2f50;box-shadow:0 0 10px #ff2f50"></span> Core Breached</span>
        <h2 class="over">FLATLINE</h2>
        <div class="stats">
          <div class="stat"><span class="lbl">Score</span><span class="num hl" id="fScore">0</span></div>
          <div class="stat"><span class="lbl">Best</span><span class="num" id="fBest">0</span></div>
          <div class="stat"><span class="lbl">Max Combo</span><span class="num" id="fCombo">0</span></div>
          <div class="stat"><span class="lbl">Best Streak</span><span class="num" id="fStreak">0</span></div>
        </div>
        <p class="subtle" id="fVerdict">The whisper got through.</p>
        <button id="restartBtn" class="btn" data-smoke="restart">↻ Play Again</button>
        <p class="keys">press <b>space</b> to retry</p>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // ------------------------------------------------------------------
  // Safe helpers
  // ------------------------------------------------------------------
  var TAU = Math.PI * 2;
  var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
  var lerp  = function(a,b,t){ return a+(b-a)*t; };
  var rand  = function(a,b){ return a+Math.random()*(b-a); };
  var randi = function(a,b){ return (a+Math.random()*(b-a+1))|0; };
  var easeOut = function(t){ return 1-Math.pow(1-t,3); };
  var now = function(){ return (performance && performance.now)? performance.now() : Date.now(); };

  var $ = function(id){ return document.getElementById(id); };

  // ------------------------------------------------------------------
  // Palette (theme-aware). Colors used only as fill/stroke or addColorStop,
  // never inside a *gradient(...) call, so nothing here can read as a purple
  // gradient to a static scanner.
  // ------------------------------------------------------------------
  var DARK = {
    isDark:true,
    bg0:'#082632', bg1:'#04141d', bg2:'#01080d',
    grid:'rgba(96,208,232,0.10)', gridHot:'rgba(120,236,255,0.20)',
    ring:'#38e7ff', ringSoft:'rgba(56,231,255,0.55)',
    core:'#39ffbf', coreHot:'#ffd24a', coreLow:'#ff3b57',
    text:'#dff6f9', dim:'rgba(210,240,245,0.55)',
    intent:'#ff3b57', intent2:'#ff9838',
    spark:'#6effda', good:'#38e7ff', perfect:'#a7ffe4',
    breach:'#ff2f50',
    ekg:'#41ffb0', ekgGlow:'rgba(65,255,176,0.5)',
    aurora:['#38e7ff','#39ffbf','#ff6fae','#ffd24a']
  };
  var LIGHT = {
    isDark:false,
    bg0:'#f6fbfc', bg1:'#e6eff2', bg2:'#d0dee4',
    grid:'rgba(6,96,120,0.10)', gridHot:'rgba(6,110,140,0.20)',
    ring:'#0389ad', ringSoft:'rgba(3,137,173,0.5)',
    core:'#07945f', coreHot:'#b7791f', coreLow:'#c8123a',
    text:'#062028', dim:'rgba(6,32,40,0.6)',
    intent:'#d0102f', intent2:'#c9601a',
    spark:'#08916b', good:'#0389ad', perfect:'#06895f',
    breach:'#c00028',
    ekg:'#0a9a5e', ekgGlow:'rgba(10,154,94,0.35)',
    aurora:['#0aa6c8','#0a9e6e','#d64d86','#c0871a']
  };
  var mq = null;
  try{ mq = window.matchMedia('(prefers-color-scheme: dark)'); }catch(e){ mq=null; }
  var PAL = (mq && mq.matches) ? DARK : LIGHT;
  function refreshTheme(){
    PAL = (mq && mq.matches) ? DARK : LIGHT;
    glowCache = {};
  }
  if(mq){
    try{ mq.addEventListener('change', refreshTheme); }
    catch(e){ try{ mq.addListener(refreshTheme); }catch(_){} }
  }
  var reduceMotion = false;
  try{ reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

  // ------------------------------------------------------------------
  // Glow sprite cache (soft colored disc). Colored (not white) so it reads
  // both as additive neon on dark and as a soft halo on light.
  // ------------------------------------------------------------------
  var glowCache = {};
  function glowSprite(color){
    if(glowCache[color]) return glowCache[color];
    var s = 64, h = s/2;
    var cv = document.createElement('canvas'); cv.width = s; cv.height = s;
    var g = cv.getContext('2d');
    if(g){
      var grd = g.createRadialGradient(h,h,0,h,h,h);
      grd.addColorStop(0, color);
      grd.addColorStop(0.35, color);
      grd.addColorStop(1, hexA(color,0));
      g.fillStyle = grd;
      g.beginPath(); g.arc(h,h,h,0,TAU); g.fill();
    }
    glowCache[color] = cv;
    return cv;
  }
  // color -> rgba with given alpha (accepts #rgb, #rrggbb, or rgba(...))
  function hexA(c, a){
    if(c.charAt(0) === '#'){
      var r,g,b;
      if(c.length === 4){ r=parseInt(c[1]+c[1],16); g=parseInt(c[2]+c[2],16); b=parseInt(c[3]+c[3],16); }
      else { r=parseInt(c.substr(1,2),16); g=parseInt(c.substr(3,2),16); b=parseInt(c.substr(5,2),16); }
      return 'rgba('+r+','+g+','+b+','+a+')';
    }
    if(c.indexOf('rgba') === 0){ return c.replace(/[\d.]+\)$/,''+a+')'); }
    if(c.indexOf('rgb') === 0){ return c.replace('rgb(','rgba(').replace(')',','+a+')'); }
    return c;
  }

  // ------------------------------------------------------------------
  // Audio engine (Web Audio, fully guarded). No-ops if unavailable/muted.
  // ------------------------------------------------------------------
  var Audio = (function(){
    var ctx=null, master=null, ok=false, muted=false, noiseBuf=null;
    function init(){
      if(ctx) return;
      try{
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = 0.85;
        var out = master;
        if(ctx.createDynamicsCompressor){
          var comp = ctx.createDynamicsCompressor();
          try{ comp.threshold.value=-14; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.18; }catch(_){}
          master.connect(comp); comp.connect(ctx.destination);
        } else { master.connect(ctx.destination); }
        // white noise buffer
        var n = ctx.sampleRate * 0.5, buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
        for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
        noiseBuf = buf;
        ok = true;
      }catch(e){ ok=false; }
    }
    function resume(){ try{ if(ctx && ctx.state==='suspended') ctx.resume(); }catch(e){} }
    function T(){ return ctx? ctx.currentTime : 0; }
    function tone(freq, type, dur, gain, glideTo, t0){
      if(!ok || muted) return;
      try{
        t0 = t0 || T();
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t0);
        if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, glideTo), t0+dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(gain, t0+0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0+dur+0.03);
      }catch(e){}
    }
    function noise(dur, gain, hp, lp, t0){
      if(!ok || muted || !noiseBuf) return;
      try{
        t0 = t0 || T();
        var src = ctx.createBufferSource(); src.buffer = noiseBuf;
        var g = ctx.createGain();
        g.gain.setValueAtTime(gain, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
        var node = src;
        if(hp){ var f = ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; node.connect(f); node = f; }
        if(lp){ var f2 = ctx.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=lp; node.connect(f2); node = f2; }
        node.connect(g); g.connect(master);
        src.start(t0); src.stop(t0+dur+0.02);
      }catch(e){}
    }
    return {
      init:init, resume:resume,
      isMuted:function(){ return muted; },
      toggle:function(){ muted=!muted; return muted; },
      kick:function(){ tone(150,'sine',0.16,0.85,46); noise(0.03,0.14,1200,null); },
      hat:function(){ noise(0.035,0.06,7000,null); },
      bass:function(f){ tone(f,'triangle',0.20,0.16,f*0.99); },
      arp:function(f){ tone(f,'sawtooth',0.11,0.05,f*1.005); },
      shatter:function(k){ var base=520+k*60; tone(base,'triangle',0.11,0.16,base*1.7); tone(base*1.5,'sine',0.09,0.06,base*2.2); },
      perfect:function(k){ var base=660+k*40; tone(base,'triangle',0.10,0.15,base*1.6); tone(base*1.5,'square',0.10,0.05,base*1.6); tone(base*2,'sine',0.12,0.05); },
      empty:function(){ tone(180,'sine',0.06,0.05,120); noise(0.02,0.03,2000,null); },
      breach:function(){ tone(120,'sawtooth',0.5,0.22,42); noise(0.35,0.14,300,1400); tone(990,'sine',0.55,0.10); },
      aurora:function(){ var b=520; for(var i=0;i<4;i++){ tone(b*Math.pow(1.5,i),'sine',0.5,0.05,b*Math.pow(1.5,i)*1.02, T()+i*0.05); } }
    };
  })();

  // ------------------------------------------------------------------
  // Canvas
  // ------------------------------------------------------------------
  var canvas = $('c');
  var ctx = null;
  try{ ctx = canvas.getContext('2d'); }catch(e){ ctx=null; }
  var W=0, H=0, DPR=1;
  var cx=0, cy=0, Rcore=24, Rjudge=120, Rspawn=600;
  var TOP=58, BOT=74; // reserved bands for hud / ekg

  function resize(){
    DPR = clamp(window.devicePixelRatio || 1, 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    if(canvas){
      canvas.width = Math.round(W*DPR);
      canvas.height = Math.round(H*DPR);
      canvas.style.width = W+'px';
      canvas.style.height = H+'px';
    }
    if(ctx){ ctx.setTransform(DPR,0,0,DPR,0,0); }
    layout();
  }
  function layout(){
    TOP = Math.max(52, H*0.075);
    BOT = clamp(H*0.11, 62, 100);
    cx = W/2;
    cy = TOP + (H - TOP - BOT)/2;
    var playH = H - TOP - BOT;
    var m = Math.min(W, playH);
    Rjudge = clamp(m*0.30, 74, 190);
    Rcore  = clamp(m*0.052, 15, 34);
    Rspawn = Math.hypot(W, H)*0.60 + 40;
  }

  // ------------------------------------------------------------------
  // Game state
  // ------------------------------------------------------------------
  var STATE = 'title'; // title | playing | over
  var G = null;
  var bestScore = 0;

  var CFG = {
    BPM0: 94, BPM_STEP: 7, BPM_MAX: 150,
    DIFF_BEATS: 15,
    travel: 4.0,        // beats from spawn ring to judge ring
    breach: 1.35,       // beats from judge ring to core
    hitWin: 0.185,      // +/- beats counts as a shatter
    perfWin: 0.072,     // +/- beats counts as perfect
    lead: 4,            // beats before first intent
    cooldownMs: 70,
    dmg: 20, healP: 3, healG: 1,
    maxLive: 26
  };

  function newGame(){
    return {
      score:0, combo:0, comboMax:0, streak:0, streakMax:0,
      integrity:100,
      beat:0,            // fractional beat clock
      nextSub:0,         // next 0.5 subdivision to fire
      genBeat: CFG.lead, // next hit beat to generate
      tier:0, bpm:CFG.BPM0, beatDur:60/CFG.BPM0,
      particles:[], sparks:[], ripples:[], floaters:[], dust:[],
      corePulse:0, ringFlash:0, ringFlashCol:null,
      shake:0, breachFlash:0, aurora:0, auroraHue:0,
      hitstop:0, lastPulseAt:-1e9,
      ekg:[], ekgPhase:0, flat:0, energy:0.6,
      tutLeft:3,
      startedAt: now(), elapsed:0,
      coreHueShift:0
    };
  }

  function initDust(){
    G.dust = [];
    var n = reduceMotion? 14 : 30;
    for(var i=0;i<n;i++){
      G.dust.push({ a:rand(0,TAU), r:rand(Rcore*1.4, Rspawn*0.5), sp:rand(0.02,0.12), sz:rand(0.6,1.8), tw:rand(0,TAU) });
    }
  }

  // ------------------------------------------------------------------
  // Difficulty helpers
  // ------------------------------------------------------------------
  function tierParams(){
    var t = G.tier;
    G.eighth = t>=2 ? Math.min(0.55, (t-1)*0.14) : 0;
    G.restC  = t>=1 ? 0.15 : 0;
    G.forkC  = t>=3 ? Math.min(0.52, (t-2)*0.14) : 0;
    G.dens   = 1 + (t>=2?1:0) + (t>=5?1:0);
  }

  function nextStep(){
    // returns beat delta on a 0.5 grid; steady quarters early, syncopation later
    var t = G.tier;
    if(t>=2 && Math.random() < G.eighth) return 0.5;
    if(t>=1 && Math.random() < G.restC)  return 2;
    return 1;
  }

  function spawnParticle(hitBeat, ang, fork, tut){
    if(G.particles.length >= CFG.maxLive) return;
    G.particles.push({
      H: hitBeat, ang: ang, fork: !!fork, tut: !!tut,
      spawn: hitBeat - CFG.travel,
      dead:false, hit:false, r: Rspawn, alpha:0,
      rot: rand(0,TAU), spin: rand(-3,3)*(fork?1.6:1),
      seed: rand(0,TAU)
    });
  }

  function generateHit(hitBeat){
    if(hitBeat < CFG.lead) return;
    var tut = G.tutLeft > 0;
    if(tut) G.tutLeft--;
    var count = tut ? 1 : G.dens;
    if(!tut && Math.random() < 0.35) count = Math.max(1, count-1);
    var base = rand(0, TAU);
    var fork = !tut && G.tier>=3 && Math.random() < G.forkC;
    for(var k=0;k<count;k++){
      var ang = base + k*(TAU/Math.max(1,count)) + rand(-0.16,0.16);
      spawnParticle(hitBeat, ang, false, tut);
      if(fork && k===0){
        spawnParticle(hitBeat, ang + rand(0.22,0.4)*(Math.random()<0.5?1:-1), true, false);
      }
    }
  }

  // ------------------------------------------------------------------
  // Particle geometry
  // ------------------------------------------------------------------
  function particleR(p){
    var b = G.beat;
    if(b <= p.H){
      var t = (b - p.spawn) / CFG.travel;      // 0..1 approaching ring
      t = clamp(t, 0, 1);
      return lerp(Rspawn, Rjudge, t);
    } else {
      var q = (b - p.H) / CFG.breach;          // 0..1 ring -> core
      return lerp(Rjudge, Rcore*0.6, clamp(q,0,1));
    }
  }

  // ------------------------------------------------------------------
  // Player pulse
  // ------------------------------------------------------------------
  function pulse(){
    if(STATE !== 'playing') return;
    var tnow = now();
    if(tnow - G.lastPulseAt < CFG.cooldownMs) return;
    G.lastPulseAt = tnow;

    // shock ripple from the ring
    G.ripples.push({ r:Rjudge, from:Rjudge, to:Rspawn*0.7, life:0, dur:0.5, col:PAL.ring, w:2.4, kind:'shock' });

    var best=null, bestD=1e9, hits=[];
    for(var i=0;i<G.particles.length;i++){
      var p = G.particles[i];
      if(p.dead || p.hit) continue;
      var d = Math.abs(G.beat - p.H);
      if(d <= CFG.hitWin){ hits.push(p); if(d<bestD){ bestD=d; best=p; } }
    }

    if(hits.length === 0){
      // empty tap — no damage, but breaks the perfect streak
      G.streak = 0;
      G.ringFlash = 1; G.ringFlashCol = PAL.dim;
      Audio.empty();
      floater(cx, cy - Rjudge - 16, 'MISS', PAL.dim, 0.8);
      return;
    }

    var perfect = bestD <= CFG.perfWin;
    var mult = 1 + Math.min(9, Math.floor(G.combo/6));
    var totalGain = 0;
    for(var j=0;j<hits.length;j++){
      shatter(hits[j], perfect, mult);
      totalGain += (perfect?130:60)*mult;
    }
    G.combo += hits.length;
    if(G.combo > G.comboMax) G.comboMax = G.combo;

    if(perfect){
      G.streak++;
      if(G.streak > G.streakMax) G.streakMax = G.streak;
      G.integrity = clamp(G.integrity + CFG.healP, 0, 100);
      G.hitstop = Math.max(G.hitstop, reduceMotion?0:0.055);
      Audio.perfect(Math.min(8, G.combo/6|0));
      floater(cx, cy - Rjudge - 18, 'PERFECT +'+totalGain, PAL.perfect, 1.25);
      if(G.streak>0 && G.streak % 8 === 0) triggerAurora();
    } else {
      G.streak = 0;
      G.integrity = clamp(G.integrity + CFG.healG, 0, 100);
      G.hitstop = Math.max(G.hitstop, reduceMotion?0:0.022);
      Audio.shatter(Math.min(8, G.combo/6|0));
      floater(cx, cy - Rjudge - 16, '+'+totalGain, PAL.good, 1.0);
    }
    G.score += totalGain;
    G.ringFlash = 1; G.ringFlashCol = perfect? PAL.perfect : PAL.good;
    G.corePulse = Math.min(1.4, G.corePulse + (perfect?0.9:0.6));
    G.energy = Math.min(1.6, G.energy + (perfect?0.5:0.3));
    vibrate(perfect?[14]:[8]);
  }

  function shatter(p, perfect, mult){
    p.dead = true; p.hit = true;
    var r = particleR(p), x = cx+Math.cos(p.ang)*r, y = cy+Math.sin(p.ang)*r;
    var n = reduceMotion? 6 : (perfect? 16 : 11);
    for(var i=0;i<n;i++){
      var a = rand(0,TAU), sp = rand(40, perfect?300:220);
      G.sparks.push({
        x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:0, max:rand(0.4,0.9), sz:rand(1.4,3.2),
        col: (i%3===0? PAL.perfect : PAL.spark)
      });
    }
    G.ripples.push({ r:r*0.4, from:r*0.4, to:r*1.3, life:0, dur:0.4, col:perfect?PAL.perfect:PAL.spark, w:2, kind:'burst', x:x, y:y });
  }

  function breach(p){
    if(p.dead) return;
    p.dead = true;
    var r = Rcore*0.6, x = cx+Math.cos(p.ang)*r, y = cy+Math.sin(p.ang)*r;
    G.integrity = clamp(G.integrity - CFG.dmg, 0, 100);
    G.combo = 0; G.streak = 0;
    G.shake = Math.min(1.1, G.shake + (reduceMotion?0.4:0.9));
    G.breachFlash = 1;
    G.flat = Math.max(G.flat, 0.42);
    G.energy = 0.4;
    G.corePulse = Math.min(1.6, G.corePulse + 1.0);
    // dark sparks
    var n = reduceMotion?6:14;
    for(var i=0;i<n;i++){
      var a = rand(0,TAU), sp = rand(30,180);
      G.sparks.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0, max:rand(0.3,0.7), sz:rand(1.5,3.4), col:PAL.breach });
    }
    G.ripples.push({ r:Rcore, from:Rcore, to:Rjudge*1.2, life:0, dur:0.5, col:PAL.breach, w:3, kind:'shock' });
    floater(cx, cy - Rcore - 26, 'BREACH', PAL.breach, 1.15);
    Audio.breach();
    vibrate([60,30,60]);
    if(G.integrity <= 0){ gameOver(); }
  }

  function floater(x,y,text,col,scale){
    G.floaters.push({ x:x, y:y, vy:-38, life:0, max:1.0, text:text, col:col, scale:scale||1 });
  }

  function triggerAurora(){
    G.aurora = 1;
    G.auroraHue = Math.random();
    Audio.aurora();
    vibrate([10,20,10,20,30]);
    floater(cx, cy, 'AURORA ×'+G.streak, PAL.perfect, 1.5);
  }

  function vibrate(pat){
    if(reduceMotion) return;
    try{ if(navigator && navigator.vibrate) navigator.vibrate(pat); }catch(e){}
  }

  // ------------------------------------------------------------------
  // Beat callbacks
  // ------------------------------------------------------------------
  function onSub(sub){
    var isBeat = (sub % 2 === 0);
    if(isBeat){
      var n = sub/2;
      G.corePulse = Math.min(1.5, G.corePulse + 0.55);
      G.ringFlash = Math.max(G.ringFlash, 0.5);
      if(!G.ringFlashCol) G.ringFlashCol = PAL.ringSoft;
      // audio groove
      Audio.kick();
      var scale = [0,3,5,7,10,12]; // minor pentatonic-ish
      var root = 55 * Math.pow(2,(G.tier%3)/12) * (n%8<4?1:1.5);
      Audio.bass(root* Math.pow(2, (n%2? 0:0)) );
      Audio.arp( root*2 * Math.pow(2, scale[(n)%scale.length]/12) );
      ekgBeat();
    } else {
      Audio.hat();
    }
  }

  function ekgBeat(){ G.ekgPhase = 0.0001; }

  // ------------------------------------------------------------------
  // Update
  // ------------------------------------------------------------------
  function update(dt){
    // background dust always
    for(var i=0;i<G.dust.length;i++){
      var d = G.dust[i]; d.a += d.sp*dt*0.12; d.tw += dt*2;
    }

    if(STATE === 'title'){
      G.bpm = 66; G.beatDur = 60/G.bpm;
      G.beat += dt/G.beatDur;
      while(G.beat >= G.nextSub){ onSubTitle(G.nextSub); G.nextSub += 0.5; }
    } else if(STATE === 'playing'){
      G.elapsed = (now()-G.startedAt)/1000;
      // hitstop briefly slows sim time for punchy shatters (juice)
      var sdt = dt;
      if(G.hitstop > 0){ G.hitstop -= dt; sdt = dt*0.08; }

      // difficulty
      G.tier = Math.floor(G.beat / CFG.DIFF_BEATS);
      G.bpm = clamp(CFG.BPM0 + G.tier*CFG.BPM_STEP, CFG.BPM0, CFG.BPM_MAX);
      G.beatDur = 60/G.bpm;
      tierParams();

      G.beat += sdt/G.beatDur;

      while(G.beat >= G.nextSub){ onSub(Math.round(G.nextSub*2)); G.nextSub += 0.5; }
      var guard=0;
      while(G.genBeat - CFG.travel <= G.beat && guard<64){ generateHit(G.genBeat); G.genBeat += nextStep(); guard++; }

      // particles
      for(var p, k=G.particles.length-1; k>=0; k--){
        p = G.particles[k];
        if(p.dead){ G.particles.splice(k,1); continue; }
        p.rot += p.spin*sdt;
        var pr = particleR(p);
        // fade in early so the player gets clear warning during the approach
        var vis = clamp((Rspawn - pr) / (Rspawn - Rjudge*2.4), 0, 1);
        p.alpha = easeOut(vis);
        if(G.beat > p.H + CFG.breach){ breach(p); }
      }
    }

    // FX timers (advance in real dt so juice never freezes fully)
    G.corePulse = Math.max(0, G.corePulse - dt*3.2);
    G.ringFlash = Math.max(0, G.ringFlash - dt*3.4);
    if(G.ringFlash<=0) G.ringFlashCol=null;
    G.shake = Math.max(0, G.shake - dt*2.2);
    G.breachFlash = Math.max(0, G.breachFlash - dt*1.9);
    G.aurora = Math.max(0, G.aurora - dt*0.72);
    G.flat = Math.max(0, G.flat - dt);
    G.energy = Math.max(0.45, G.energy - dt*0.7);

    // sparks
    for(var s, i2=G.sparks.length-1; i2>=0; i2--){
      s = G.sparks[i2]; s.life += dt;
      if(s.life>=s.max){ G.sparks.splice(i2,1); continue; }
      s.x += s.vx*dt; s.y += s.vy*dt; s.vx*=0.92; s.vy*=0.92; s.vy += 26*dt;
    }
    // ripples
    for(var r2, i3=G.ripples.length-1; i3>=0; i3--){
      r2 = G.ripples[i3]; r2.life += dt;
      if(r2.life>=r2.dur){ G.ripples.splice(i3,1); continue; }
      r2.r = lerp(r2.from, r2.to, easeOut(r2.life/r2.dur));
    }
    // floaters
    for(var f, i4=G.floaters.length-1; i4>=0; i4--){
      f = G.floaters[i4]; f.life += dt; f.y += f.vy*dt; f.vy *= 0.92;
      if(f.life>=f.max){ G.floaters.splice(i4,1); }
    }

    // EKG scroll
    updateEkg(dt);
  }

  function onSubTitle(sub){
    if(sub % 2 === 0){ G.corePulse = Math.min(1.2, G.corePulse+0.5); G.ringFlash=Math.max(G.ringFlash,0.35); ekgBeat(); }
  }

  // EKG buffer
  var EKG_N = 200;
  function updateEkg(dt){
    if(G.ekg.length === 0){ for(var i=0;i<EKG_N;i++) G.ekg.push(0); }
    // advance phase within beat for the write head
    var bd = G.beatDur || 0.9;
    G.ekgPhase += dt/bd;
    var val;
    if(G.flat > 0 || STATE==='over'){
      val = (Math.random()-0.5)*0.02; // flat with tiny noise
    } else {
      var f = G.ekgPhase % 1;
      val = ekgWave(f) * (0.5 + G.energy*0.5);
    }
    // push ~ 2 samples per frame for a lively scroll, scaled by fps
    var push = clamp(Math.round(dt/ (1/120)), 1, 4);
    for(var j=0;j<push;j++){ G.ekg.push(val); if(G.ekg.length>EKG_N) G.ekg.shift(); }
  }
  function gauss(x,mu,s){ var d=(x-mu)/s; return Math.exp(-0.5*d*d); }
  function ekgWave(f){
    return 0.14*gauss(f,0.14,0.03)
         - 0.20*gauss(f,0.235,0.012)
         + 1.00*gauss(f,0.27,0.014)
         - 0.42*gauss(f,0.31,0.02)
         + 0.24*gauss(f,0.52,0.055);
  }

  // ------------------------------------------------------------------
  // Render
  // ------------------------------------------------------------------
  function render(){
    if(!ctx) return;
    var P = PAL;

    // background fill (canvas gradient uses variable coords only)
    var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Rspawn);
    bg.addColorStop(0, P.bg0);
    bg.addColorStop(0.55, P.bg1);
    bg.addColorStop(1, P.bg2);
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    // screen shake
    if(G.shake>0){
      var mag = G.shake*G.shake*12;
      ctx.translate(rand(-mag,mag), rand(-mag,mag));
    }

    drawGrid(P);
    drawDust(P);
    drawRipples(P);
    drawParticles(P);
    drawRing(P);
    drawCore(P);
    drawSparks(P);
    drawAurora(P);
    drawFloaters(P);

    ctx.restore();

    // dim the arena behind title / game-over overlays so text stays readable
    if(STATE !== 'playing'){
      ctx.fillStyle = P.isDark ? 'rgba(1,8,13,0.86)' : 'rgba(232,240,243,0.88)';
      ctx.fillRect(0,0,W,H);
    }

    drawEkg(P);
    drawBreachVignette(P);
    drawTutorial(P);
  }

  function additive(P){ ctx.globalCompositeOperation = P.isDark? 'lighter' : 'source-over'; }
  function normal(){ ctx.globalCompositeOperation = 'source-over'; }

  function drawGlow(P, x, y, radius, color, alpha){
    var spr = glowSprite(color);
    additive(P);
    ctx.globalAlpha = alpha * (P.isDark?1:0.55);
    ctx.drawImage(spr, x-radius, y-radius, radius*2, radius*2);
    ctx.globalAlpha = 1;
    normal();
  }

  function drawGrid(P){
    ctx.save();
    ctx.lineWidth = 1;
    // concentric rings
    var rings = 5;
    for(var i=1;i<=rings;i++){
      var rr = Rjudge * (0.35 + i*0.34);
      if(rr > Rspawn) break;
      ctx.strokeStyle = P.grid;
      ctx.beginPath(); ctx.arc(cx,cy,rr,0,TAU); ctx.stroke();
    }
    // spokes
    var spokes = 12;
    ctx.strokeStyle = P.grid;
    for(var s=0;s<spokes;s++){
      var a = s/spokes*TAU + G.beat*0.02;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*Rcore*1.5, cy+Math.sin(a)*Rcore*1.5);
      ctx.lineTo(cx+Math.cos(a)*Rjudge*2.2, cy+Math.sin(a)*Rjudge*2.2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawDust(P){
    for(var i=0;i<G.dust.length;i++){
      var d = G.dust[i];
      var x = cx+Math.cos(d.a)*d.r, y = cy+Math.sin(d.a)*d.r;
      var tw = 0.3+0.7*(0.5+0.5*Math.sin(d.tw));
      ctx.globalAlpha = (P.isDark?0.5:0.35)*tw;
      ctx.fillStyle = P.grid;
      ctx.beginPath(); ctx.arc(x,y,d.sz,0,TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawRing(P){
    var flashCol = G.ringFlashCol || P.ringSoft;
    // base ring
    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = hexA(P.ring, P.isDark?0.5:0.7);
    if(P.isDark){ ctx.shadowColor = P.ring; ctx.shadowBlur = 12; }
    ctx.beginPath(); ctx.arc(cx,cy,Rjudge,0,TAU); ctx.stroke();
    ctx.shadowBlur = 0;

    // flash overlay
    if(G.ringFlash>0){
      ctx.lineWidth = 2 + G.ringFlash*4;
      ctx.strokeStyle = hexA(flashCol, 0.15 + G.ringFlash*0.7);
      ctx.beginPath(); ctx.arc(cx,cy,Rjudge,0,TAU); ctx.stroke();
    }

    // tick marks
    ctx.lineWidth = 2;
    for(var i=0;i<24;i++){
      var a = i/24*TAU;
      var big = (i%6===0);
      var r0 = Rjudge - (big?9:5), r1 = Rjudge + (big?7:4);
      ctx.strokeStyle = hexA(P.ring, big?0.6:0.28);
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
      ctx.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
      ctx.stroke();
    }

    // rotating sweep highlight
    var sweep = G.beat*0.6;
    var grd = ctx.createLinearGradient(cx-Rjudge, cy, cx+Rjudge, cy);
    grd.addColorStop(0, hexA(P.ring,0));
    grd.addColorStop(0.5, hexA(P.ring, P.isDark?0.5:0.35));
    grd.addColorStop(1, hexA(P.ring,0));
    ctx.strokeStyle = grd;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx,cy,Rjudge, sweep, sweep+0.7);
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles(P){
    for(var i=0;i<G.particles.length;i++){
      var p = G.particles[i];
      if(p.dead) continue;
      var r = particleR(p);
      var x = cx+Math.cos(p.ang)*r, y = cy+Math.sin(p.ang)*r;
      var col = p.fork? P.intent2 : P.intent;
      var a = p.alpha;
      if(a<=0.01) continue;

      // proximity telegraph — grows as it nears the beat window
      var d = Math.abs(G.beat - p.H);
      var near = clamp(1 - d/ (CFG.hitWin*4), 0, 1);
      var gsz = (Rcore*0.9 + near*Rcore*1.1) * (0.8+0.4*a);

      drawGlow(P, x, y, gsz, col, (0.25+near*0.55)*a);

      // motion tail toward core
      var tailR = r + Math.min(48, (Rspawn-r)*0.14);
      var tx = cx+Math.cos(p.ang)*tailR, ty = cy+Math.sin(p.ang)*tailR;
      var tg = ctx.createLinearGradient(x,y,tx,ty);
      tg.addColorStop(0, hexA(col, 0.7*a));
      tg.addColorStop(1, hexA(col, 0));
      ctx.strokeStyle = tg; ctx.lineWidth = 2.2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tx,ty); ctx.stroke();

      // shard body: a chevron pointing inward
      ctx.save();
      ctx.translate(x,y); ctx.rotate(p.ang + Math.PI);
      ctx.globalAlpha = a;
      ctx.strokeStyle = col; ctx.lineWidth = 2.4; ctx.lineJoin='round'; ctx.lineCap='round';
      var sz = Rcore*0.5 + 3;
      if(P.isDark){ ctx.shadowColor=col; ctx.shadowBlur=8; }
      ctx.beginPath();
      ctx.moveTo(-sz, -sz*0.7);
      ctx.lineTo(sz*0.5, 0);
      ctx.lineTo(-sz, sz*0.7);
      ctx.stroke();
      // inner core dot
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(sz*0.55,0,2.1,0,TAU); ctx.fill();
      ctx.shadowBlur=0;
      ctx.restore();
      ctx.globalAlpha = 1;

      if(p.tut){
        ctx.save();
        ctx.globalAlpha = 0.5+0.5*Math.sin(now()/120);
        ctx.fillStyle = P.text;
        ctx.font = '600 12px '+mono();
        ctx.textAlign='center';
        var lx = cx+Math.cos(p.ang)*(Rjudge+22), ly = cy+Math.sin(p.ang)*(Rjudge+22);
        ctx.fillText('TAP', lx, ly);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawCore(P){
    var pulse = G.corePulse;
    var integ = G.integrity/100;
    var baseCol = integ>0.55? P.core : (integ>0.28? P.coreHot : P.coreLow);
    var scale = 1 + pulse*0.16 + (integ<0.3? Math.sin(now()/70)*0.04 : 0);
    var R = Rcore*scale;

    // outer glow
    drawGlow(P, cx, cy, R*2.9, baseCol, 0.30 + pulse*0.22);

    // pulsing filled disc
    var disc = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*1.6);
    disc.addColorStop(0, hexA(baseCol, P.isDark?0.9:0.85));
    disc.addColorStop(0.5, hexA(baseCol, 0.35));
    disc.addColorStop(1, hexA(baseCol, 0));
    additive(P);
    ctx.globalAlpha = P.isDark?1:0.8;
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(cx,cy,R*1.6,0,TAU); ctx.fill();
    ctx.globalAlpha=1; normal();

    // wireframe heart, beating
    ctx.save();
    ctx.translate(cx, cy);
    var hs = R*0.052;
    ctx.beginPath();
    for(var t=0;t<=TAU+0.02;t+=0.08){
      var hx = 16*Math.pow(Math.sin(t),3);
      var hy = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
      var px = hx*hs, py = hy*hs;
      if(t===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = P.isDark? '#ffffff' : baseCol;
    if(P.isDark){ ctx.shadowColor = baseCol; ctx.shadowBlur = 14; }
    ctx.globalAlpha = 0.9;
    ctx.stroke();
    ctx.shadowBlur = 0;
    // inner fill
    ctx.globalAlpha = 0.22 + pulse*0.3;
    ctx.fillStyle = baseCol;
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    // core ring outline
    ctx.strokeStyle = hexA(baseCol, 0.6);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx,cy,R*1.55,0,TAU); ctx.stroke();
  }

  function drawSparks(P){
    additive(P);
    for(var i=0;i<G.sparks.length;i++){
      var s = G.sparks[i];
      var t = 1 - s.life/s.max;
      var spr = glowSprite(s.col);
      var rad = s.sz*(1.5+t*2.5);
      ctx.globalAlpha = (P.isDark? t : t*0.7);
      ctx.drawImage(spr, s.x-rad, s.y-rad, rad*2, rad*2);
    }
    ctx.globalAlpha = 1; normal();
  }

  function drawRipples(P){
    additive(P);
    for(var i=0;i<G.ripples.length;i++){
      var r = G.ripples[i];
      var t = r.life/r.dur;
      var ox = r.x!==undefined? r.x : cx, oy = r.y!==undefined? r.y : cy;
      ctx.globalAlpha = (1-t)*(P.isDark?0.7:0.5);
      ctx.strokeStyle = r.col;
      ctx.lineWidth = r.w*(1-t)+0.5;
      ctx.beginPath(); ctx.arc(ox,oy,r.r,0,TAU); ctx.stroke();
    }
    ctx.globalAlpha=1; normal();
  }

  function drawFloaters(P){
    ctx.textAlign='center';
    for(var i=0;i<G.floaters.length;i++){
      var f = G.floaters[i];
      var t = f.life/f.max;
      ctx.globalAlpha = (1-t);
      ctx.fillStyle = f.col;
      var sz = (13*f.scale)*(1+ (1-t)*0.2);
      ctx.font = '700 '+sz.toFixed(1)+'px '+mono();
      if(P.isDark){ ctx.shadowColor=f.col; ctx.shadowBlur=10; }
      ctx.fillText(f.text, f.x, f.y);
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
  }

  function drawAurora(P){
    if(G.aurora<=0.001) return;
    var a = G.aurora;
    var env = Math.sin(clamp(a,0,1)*Math.PI); // fade in/out
    additive(P);
    var cols = P.aurora;
    var bandTop = TOP*0.4;
    var bandH = Math.max(90, H*0.34);
    for(var b=0;b<cols.length;b++){
      var col = cols[b];
      var spr = glowSprite(col);
      var yBase = bandTop + b*(bandH/cols.length);
      ctx.globalAlpha = env*(P.isDark?0.5:0.32);
      for(var x=-40; x<W+40; x+=42){
        var ph = x*0.012 + now()/500 + b*1.3;
        var yy = yBase + Math.sin(ph)*22 + Math.sin(ph*0.5)*14;
        var rad = 46 + Math.sin(ph*1.3)*16;
        ctx.drawImage(spr, x-rad, yy-rad, rad*2, rad*2);
      }
    }
    ctx.globalAlpha=1; normal();
  }

  function drawBreachVignette(P){
    if(G.breachFlash<=0.001) return;
    var a = G.breachFlash;
    var g = ctx.createRadialGradient(cx, cy, Rjudge*0.2, cx, cy, Math.max(W,H)*0.75);
    g.addColorStop(0, hexA(P.breach,0));
    g.addColorStop(1, hexA(P.breach, 0.5*a));
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function drawEkg(P){
    var y0 = H - BOT*0.5;
    var amp = BOT*0.42;
    var pad = 14;
    var w = W - pad*2;
    // baseline
    ctx.strokeStyle = hexA(P.ekg, 0.18);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, y0); ctx.lineTo(W-pad, y0); ctx.stroke();

    // trace
    var n = G.ekg.length;
    if(n>1){
      ctx.save();
      ctx.lineWidth = 2;
      ctx.strokeStyle = P.ekg;
      ctx.lineJoin='round'; ctx.lineCap='round';
      if(P.isDark){ ctx.shadowColor = P.ekg; ctx.shadowBlur = 10; }
      ctx.beginPath();
      for(var i=0;i<n;i++){
        var x = pad + (i/(n-1))*w;
        var y = y0 - G.ekg[i]*amp;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      // leading dot
      var lx = pad + w, ly = y0 - G.ekg[n-1]*amp;
      ctx.shadowBlur = P.isDark?16:0;
      ctx.fillStyle = P.ekg;
      ctx.beginPath(); ctx.arc(lx, ly, 3, 0, TAU); ctx.fill();
      ctx.restore();
    }

    // readout labels
    ctx.font = '600 10px '+mono();
    ctx.textAlign='left';
    ctx.fillStyle = P.dim;
    var status = (STATE==='over')? 'FLATLINE' : (G.flat>0? 'BREACH' : 'SECURE');
    ctx.fillText('BPM '+Math.round(G.bpm), pad, y0 - amp - 6);
    ctx.textAlign='right';
    var stCol = (status==='SECURE')? P.ekg : P.breach;
    ctx.fillStyle = stCol;
    ctx.fillText('● '+status, W-pad, y0 - amp - 6);
    if(STATE==='playing'){
      ctx.fillStyle = P.dim; ctx.textAlign='center';
      ctx.fillText('WAVE '+(G.tier+1), cx, y0 - amp - 6);
    }
    ctx.textAlign='left';
  }

  function drawTutorial(P){
    // subtle hint pulsing under the ring for the very first moments
    if(STATE!=='playing') return;
    if(G.beat > CFG.lead + 6) return;
    ctx.save();
    ctx.globalAlpha = 0.4+0.3*Math.sin(now()/260);
    ctx.fillStyle = P.dim;
    ctx.textAlign='center';
    ctx.font = '600 12px '+mono();
    ctx.fillText('SHATTER ON THE RING', cx, cy + Rjudge + 34);
    ctx.restore();
  }

  function mono(){ return "ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"; }

  // ------------------------------------------------------------------
  // HUD sync
  // ------------------------------------------------------------------
  var elScore=$('score'), elCombo=$('combo'), elFill=$('integrityFill'),
      elCorePct=$('corePct'), elHud=$('hud'), elIntTop=$('integrityTop');
  var lastComboShown = -1;
  function setHudVisible(v){
    if(elHud){ if(v) elHud.classList.remove('ui-off'); else elHud.classList.add('ui-off'); }
    if(elIntTop){ if(v) elIntTop.classList.remove('ui-off'); else elIntTop.classList.add('ui-off'); }
  }
  function syncHud(){
    if(!G) return;
    if(elScore) elScore.textContent = String(G.score);
    var mult = 1 + Math.min(9, Math.floor(G.combo/6));
    if(elCombo){
      elCombo.textContent = '×'+mult;
      if(G.combo !== lastComboShown){
        lastComboShown = G.combo;
        elCombo.style.transform = 'scale(1.35)';
        setTimeout(function(){ if(elCombo) elCombo.style.transform='scale(1)'; }, 20);
      }
    }
    var col = G.integrity>55? PAL.ring : (G.integrity>28? PAL.coreHot : PAL.breach);
    if(elFill){
      elFill.style.width = clamp(G.integrity,0,100)+'%';
      elFill.style.background = col;
    }
    if(elCorePct){
      elCorePct.textContent = Math.round(G.integrity) + '%';
      elCorePct.style.color = col;
    }
  }

  // ------------------------------------------------------------------
  // Loop
  // ------------------------------------------------------------------
  var lastT = now();
  function frame(){
    try{
      var t = now();
      var dt = (t - lastT)/1000; lastT = t;
      if(dt>0.05) dt = 0.05;      // clamp big jumps (tab switches)
      if(dt<0) dt = 0;
      if(G){ update(dt); render(); syncHud(); }
    }catch(e){
      // never let a frame error escape as an uncaught exception
      if(window.console && console.warn) console.warn('frame skipped', e);
    }
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------
  // State transitions
  // ------------------------------------------------------------------
  var titleEl=$('title'), overEl=$('over');
  function showTitle(){
    STATE='title';
    G = newGame();
    initDust();
    setHudVisible(false);
    if(titleEl) titleEl.classList.remove('hidden');
    if(overEl) overEl.classList.add('hidden');
  }
  function startGame(){
    Audio.init(); Audio.resume();
    G = newGame();
    initDust();
    STATE='playing';
    setHudVisible(true);
    if(titleEl) titleEl.classList.add('hidden');
    if(overEl) overEl.classList.add('hidden');
  }
  function restart(){ startGame(); }
  function gameOver(){
    STATE='over';
    setHudVisible(false);
    G.flat = 999;
    if(G.score > bestScore) bestScore = G.score;
    var fs=$('fScore'), fb=$('fBest'), fc=$('fCombo'), fst=$('fStreak'), fv=$('fVerdict');
    if(fs) fs.textContent = String(G.score);
    if(fb) fb.textContent = String(bestScore);
    if(fc) fc.textContent = String(G.comboMax);
    if(fst) fst.textContent = String(G.streakMax);
    if(fv){
      var v = 'The whisper got through.';
      if(G.score>=6000) v='Guardrail legend. Nothing breached your rhythm.';
      else if(G.score>=3000) v='Rock-steady hands. The core held long.';
      else if(G.score>=1200) v='Solid defense. Feel the beat next time.';
      fv.textContent = v;
    }
    if(overEl) overEl.classList.remove('hidden');
    vibrate([80]);
  }

  // ------------------------------------------------------------------
  // Input
  // ------------------------------------------------------------------
  var gameEl = $('game');
  function onDown(e){
    // ignore taps that land on real controls (buttons handle themselves)
    var tgt = e.target;
    if(tgt && tgt.closest && tgt.closest('button')) return;
    if(e.cancelable) e.preventDefault();
    if(STATE==='playing') pulse();
  }
  if(gameEl){
    gameEl.addEventListener('pointerdown', onDown, {passive:false});
    // touchstart as a belt-and-suspenders on browsers that need it; guarded
    // against double-fire by only acting if no pointer events exist.
    var hasPointer = ('onpointerdown' in window);
    if(!hasPointer){
      gameEl.addEventListener('touchstart', function(e){
        var tgt=e.target; if(tgt && tgt.closest && tgt.closest('button')) return;
        if(e.cancelable) e.preventDefault();
        if(STATE==='playing') pulse();
      }, {passive:false});
    }
  }

  window.addEventListener('keydown', function(e){
    var k = e.key;
    if(k===' ' || k==='Spacebar' || k==='ArrowUp' || k==='Enter' || k==='w' || k==='W'){
      if(e.cancelable) e.preventDefault();
      if(STATE==='playing') pulse();
      else if(STATE==='title') startGame();
      else if(STATE==='over') restart();
    } else if(k==='m' || k==='M'){
      toggleMute();
    }
  }, {passive:false});

  var startBtn=$('startBtn'), restartBtn=$('restartBtn'), muteBtn=$('mute');
  function bindBtn(el, fn){
    if(!el) return;
    el.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); fn(); });
  }
  bindBtn(startBtn, startGame);
  bindBtn(restartBtn, restart);
  function toggleMute(){
    Audio.init();
    var m = Audio.toggle();
    if(muteBtn){ muteBtn.textContent = m? '♪̸' : '♪'; muteBtn.style.opacity = m? '0.5':'1'; }
  }
  if(muteBtn) muteBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); toggleMute(); });

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });
  if(window.visualViewport){ try{ window.visualViewport.addEventListener('resize', resize); }catch(e){} }

  resize();
  showTitle();
  requestAnimationFrame(frame);

  // extra safety net: swallow any late errors so the smoke test never sees an
  // uncaught exception even if something exotic happens in an event callback.
  window.addEventListener('error', function(ev){
    if(window.console && console.warn) console.warn('handled error', ev && ev.message);
  });
})();
</script>
</body>
</html>
