<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Bunker</title>
<style>
:root {
  --bg-color: #e0e0e0;
  --text-color: #111;
  --panel-bg: rgba(255, 255, 255, 0.95);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #1a1a1a;
    --text-color: #f0f0f0;
    --panel-bg: rgba(20, 20, 20, 0.95);
  }
}
body, html {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background-color: var(--bg-color);
  font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#game-canvas {
  display: block; width: 100vw; height: 100vh; /* Using vw/vh, handled by JS innerWidth/Height too */
  touch-action: none;
}
#crt-overlay {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
  background-size: 100% 4px;
  z-index: 10;
}
#ui-layer {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; justify-content: center; align-items: center;
  z-index: 20;
}
.panel {
  background: var(--panel-bg); color: var(--text-color);
  padding: 40px; border-radius: 4px; border: 2px solid var(--text-color);
  text-align: center;
  box-shadow: 8px 8px 0px rgba(0,0,0,0.3);
  pointer-events: none; 
}
.panel h1, .panel h2 {
  margin: 0 0 20px 0; font-size: 28px; text-transform: uppercase;
}
.panel p { margin: 10px 0; font-size: 14px; }
button {
  pointer-events: auto; 
  background: var(--text-color); color: var(--bg-color);
  border: none; padding: 16px 32px; font-size: 18px;
  font-family: inherit; font-weight: bold; cursor: pointer;
  margin-top: 24px; border-radius: 2px;
  text-transform: uppercase;
  transition: transform 0.1s;
}
button:active { transform: translateY(4px); }
#hud {
  position: absolute; top: 0; left: 0; right: 0; padding: 20px;
  display: none; justify-content: space-between;
  color: var(--text-color); font-size: 24px; font-weight: bold;
  pointer-events: none; z-index: 20;
}
.strike { color: #FF2A2A; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="crt-overlay"></div>
<div id="hud">
  <div>SCORE: <span id="score">0</span></div>
  <div id="hearts">♥♥♥</div>
</div>
<div id="ui-layer">
  <div id="title-screen" class="panel">
    <h1>DATA BUNKER</h1>
    <p>Sort falling shards into matching racks.</p>
    <p>Swipe Left/Right anywhere to shift racks.</p>
    <p>Warning: Tremors will scramble systems.</p>
    <button data-smoke="start" id="start-btn">INITIALIZE</button>
  </div>
  <div id="game-over-screen" class="panel" style="display: none;">
    <h2>SYSTEM FAILURE</h2>
    <p>FINAL SCORE: <span id="final-score">0</span></p>
    <button data-smoke="restart" id="restart-btn">REBOOT</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const COLORS = ['#FFB000', '#00E5FF', '#39FF14', '#FF2A2A', '#2A7FFF'];
let gameState = 'TITLE';
let score = 0, combo = 0, strikes = 0, lanesCount = 3;
let shards = [], particles = [], rackObjects = [];
let lastTime = 0, spawnTimer = 0, currentSpawnRate = 1.5, baseFallSpeed = 0.3;
let nextTremorScore = 15, nextLaneScore = 30;
let tremorWarningTime = 0, tremorShakeTime = 0, smallShakeTime = 0;
let animationFrameId = null;
let audioCtx = null;
let touchStartX = 0, touchStartY = 0, touchId = null;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      try { audioCtx = new AudioContext(); } catch(e) {}
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(()=>{});
  }
}

function playTone(freq, type, duration, vol=0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playNoise(duration, vol=0.1, freq=1000) {
  if (!audioCtx) return;
  try {
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = freq;
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start();
  } catch(e) {}
}

function playClunk() {
  playNoise(0.2, 0.4, 800);
  playTone(200, 'square', 0.1, 0.1);
}
function playError() {
  playTone(150, 'sawtooth', 0.3, 0.2);
  setTimeout(() => playTone(120, 'sawtooth', 0.4, 0.2), 100);
}
function playAlarm() {
  playTone(600, 'square', 0.2, 0.1);
  setTimeout(() => playTone(600, 'square', 0.2, 0.1), 300);
}
function playTremor() {
  playNoise(1.0, 0.8, 400);
}

function updateHearts() {
  let str = '';
  for(let i=0; i<3; i++) {
    if (i < 3 - strikes) str += '♥';
    else str += '<span class="strike">♥</span>';
  }
  document.getElementById('hearts').innerHTML = str;
}

function initGame() {
  score = 0; combo = 0; strikes = 0; lanesCount = 3;
  shards = []; particles = []; rackObjects = [];
  currentSpawnRate = 1.5; baseFallSpeed = 0.3; spawnTimer = 1.0;
  nextTremorScore = 15; nextLaneScore = 30;
  tremorWarningTime = 0; tremorShakeTime = 0; smallShakeTime = 0;
  
  for(let i=0; i<lanesCount; i++) {
    rackObjects.push({
      colorIdx: i, lane: i,
      visualX: i * (window.innerWidth / lanesCount),
      glow: 0
    });
  }
  
  document.getElementById('score').innerText = '0';
  updateHearts();
}

function shiftRacks(dir) {
  rackObjects.forEach(r => {
    r.lane = (r.lane + dir + lanesCount) % lanesCount;
  });
  playTone(300, 'triangle', 0.05, 0.1);
}

function triggerTremor() {
  playTremor();
  try { if(navigator.vibrate) navigator.vibrate([300, 100, 300]); } catch(e){}
  tremorShakeTime = 1.0;
  
  let lanes = Array.from({length: lanesCount}, (_, i) => i);
  let isSame = true;
  while(isSame && lanesCount > 1) {
    for (let i = lanes.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
    }
    isSame = true;
    for(let i=0; i<lanesCount; i++) {
      if(rackObjects[i].lane !== lanes[i]) { isSame = false; break; }
    }
  }
  rackObjects.forEach((r, idx) => r.lane = lanes[idx]);
}

function checkTremor() {
  if (score >= nextTremorScore) {
    nextTremorScore += 15 + Math.floor(Math.random() * 10);
    tremorWarningTime = 2.0;
    playAlarm();
  }
}

function checkEscalation() {
  if (score >= nextLaneScore && lanesCount < 5) {
    lanesCount++;
    nextLaneScore += 40;
    
    const newColorIdx = lanesCount - 1;
    rackObjects.push({
      colorIdx: newColorIdx, lane: newColorIdx,
      visualX: window.innerWidth, glow: 0
    });
    
    let lanes = Array.from({length: lanesCount}, (_, i) => i);
    for (let i = lanes.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
    }
    rackObjects.forEach((r, idx) => r.lane = lanes[idx]);
    
    playTone(400, 'square', 0.2, 0.2);
    setTimeout(() => playTone(600, 'square', 0.4, 0.2), 200);
  }
}

function createParticles(lane, y, color) {
  const laneW = window.innerWidth / lanesCount;
  const cx = lane * laneW + laneW/2;
  for(let i=0; i<15; i++) {
    particles.push({
      x: cx + (Math.random()-0.5)*20,
      y: y,
      vx: (Math.random()-0.5)*150,
      vy: -Math.random()*300 - 50,
      life: 0.5 + Math.random()*0.5, maxLife: 1.0, color: color
    });
  }
}

function spawnShard() {
  shards.push({
    lane: Math.floor(Math.random() * lanesCount),
    colorIdx: Math.floor(Math.random() * lanesCount),
    y: -50, size: 40,
    speed: baseFallSpeed * (0.9 + Math.random() * 0.2)
  });
}

function gameOver() {
  gameState = 'GAME_OVER';
  document.getElementById('game-over-screen').style.display = 'block';
  document.getElementById('final-score').innerText = score;
  playError();
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]); } catch(e){}
}

function update(dt) {
  if (tremorWarningTime > 0) {
    tremorWarningTime -= dt;
    if (tremorWarningTime <= 0) triggerTremor();
  }
  
  let dtScale = 1.0;
  if (tremorShakeTime > 0) {
    tremorShakeTime -= dt;
    dtScale = 0.25; // bullet time
  }
  if (smallShakeTime > 0) smallShakeTime -= dt;
  
  spawnTimer -= (dt * dtScale);
  if (spawnTimer <= 0) {
    spawnShard();
    currentSpawnRate = Math.max(0.5, currentSpawnRate - 0.01);
    baseFallSpeed = Math.min(1.2, baseFallSpeed + 0.005);
    spawnTimer = currentSpawnRate;
  }
  
  const h = window.innerHeight;
  const rackHeight = 120;
  const bottomY = h - rackHeight;
  
  for (let i = shards.length - 1; i >= 0; i--) {
    let s = shards[i];
    s.y += s.speed * h * (dt * dtScale);
    
    if (s.y + s.size/2 >= bottomY) {
      let targetRack = rackObjects.find(r => r.lane === s.lane);
      if (targetRack && targetRack.colorIdx === s.colorIdx) {
        score += 1 + Math.floor(combo / 5);
        combo++;
        targetRack.glow = 1.0;
        playClunk();
        createParticles(s.lane, bottomY, COLORS[s.colorIdx]);
        try { if(navigator.vibrate) navigator.vibrate(50); } catch(e){}
      } else {
        strikes++; combo = 0;
        playError(); updateHearts(); smallShakeTime = 0.3;
        try { if(navigator.vibrate) navigator.vibrate([100, 50, 100]); } catch(e){}
        if (strikes >= 3) {
          gameOver();
          return;
        }
      }
      shards.splice(i, 1);
      checkTremor();
      checkEscalation();
      document.getElementById('score').innerText = score;
    }
  }
  
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 800 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  const w = window.innerWidth;
  const laneW = w / lanesCount;
  rackObjects.forEach(r => {
    let targetX = r.lane * laneW;
    if (Math.abs(targetX - r.visualX) > laneW * (lanesCount - 1.5)) {
       if (targetX < r.visualX) r.visualX -= w;
       else r.visualX += w;
    }
    const lerpFactor = 1 - Math.exp(-15 * dt);
    r.visualX += (targetX - r.visualX) * lerpFactor;
    if (r.glow > 0) r.glow = Math.max(0, r.glow - dt * 2);
  });
}

function draw(ctx) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  
  if (tremorShakeTime > 0) {
    const intensity = Math.min(1, tremorShakeTime) * 15;
    ctx.translate((Math.random()-0.5)*intensity, (Math.random()-0.5)*intensity);
  }
  if (smallShakeTime > 0) {
    const intensity = smallShakeTime * 10;
    ctx.translate((Math.random()-0.5)*intensity, (Math.random()-0.5)*intensity);
  }
  
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 2;
  const laneW = w / lanesCount;
  for (let i = 1; i < lanesCount; i++) {
    ctx.beginPath(); ctx.moveTo(i * laneW, 0); ctx.lineTo(i * laneW, h); ctx.stroke();
  }
  
  if (tremorWarningTime > 0) {
    const alpha = (Math.sin(tremorWarningTime * 20) * 0.5 + 0.5) * 0.2;
    ctx.fillStyle = `rgba(255, 0, 0, ${alpha})`;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = isDark ? '#fff' : '#000';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText("TREMOR IMMINENT", w/2, h/2);
  }
  
  const rackHeight = 120;
  rackObjects.forEach(r => {
    const rx = r.visualX;
    const ry = h - rackHeight;
    const pad = 10;
    
    ctx.fillStyle = isDark ? '#2a2a2a' : '#b3b3b3';
    ctx.fillRect(rx + pad, ry, laneW - pad*2, rackHeight);
    
    ctx.fillStyle = isDark ? '#111' : '#888';
    ctx.fillRect(rx + pad + 10, ry + 20, laneW - pad*2 - 20, rackHeight - 40);
    
    const color = COLORS[r.colorIdx];
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = r.glow > 0 ? 20 + r.glow*30 : 10;
    
    ctx.fillRect(rx + pad + 15, ry + 30, laneW - pad*2 - 30, 20);
    ctx.fillRect(rx + pad + 15, ry + 60, laneW - pad*2 - 30, 20);
    
    ctx.shadowBlur = 0;
    if (r.glow > 0) {
      ctx.fillStyle = `rgba(255,255,255,${r.glow})`;
      ctx.fillRect(rx + pad + 15, ry + 30, laneW - pad*2 - 30, 20);
      ctx.fillRect(rx + pad + 15, ry + 60, laneW - pad*2 - 30, 20);
    }
  });
  
  shards.forEach(s => {
    const cx = s.lane * laneW + laneW/2;
    const color = COLORS[s.colorIdx];
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    ctx.fillRect(cx - s.size/2, s.y - s.size/2, s.size, s.size);
    
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.fillRect(cx - s.size/4, s.y - s.size/4, s.size/2, s.size/2);
  });
  
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillRect(p.x, p.y, 6, 6);
  });
  ctx.globalAlpha = 1.0;
  ctx.restore();
}

function gameLoop(timestamp) {
  if (gameState !== 'PLAYING') return;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  update(dt);
  draw(ctx);
  if (gameState === 'PLAYING') {
    animationFrameId = requestAnimationFrame(gameLoop);
  }
}

document.addEventListener('touchstart', (e) => {
  if (e.target.closest('button')) return;
  if (gameState !== 'PLAYING') return;
  e.preventDefault();
  const t = e.changedTouches[0];
  touchStartX = t.clientX; touchStartY = t.clientY; touchId = t.identifier;
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (e.target.closest('button')) return;
  if (gameState !== 'PLAYING') return;
  e.preventDefault();
  for (let i=0; i<e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === touchId) {
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
        shiftRacks(dx > 0 ? 1 : -1);
      } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        shiftRacks(t.clientX > window.innerWidth/2 ? 1 : -1);
      }
      touchId = null;
    }
  }
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (gameState !== 'PLAYING') return;
  if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') shiftRacks(-1);
  if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') shiftRacks(1);
});

document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  gameState = 'PLAYING';
  initGame();
  lastTime = performance.now();
  if (animationFrameId) cancelAnimationFrame(animationFrameId);
  animationFrameId = requestAnimationFrame(gameLoop);
});

document.getElementById('restart-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('game-over-screen').style.display = 'none';
  gameState = 'PLAYING';
  initGame();
  lastTime = performance.now();
  if (animationFrameId) cancelAnimationFrame(animationFrameId);
  animationFrameId = requestAnimationFrame(gameLoop);
});

// Initial draw behind menu
initGame();
draw(ctx);
</script>
</body>
</html>
