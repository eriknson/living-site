<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whisper Sort</title>
<style>
  :root {
    --bg: #111;
    --fg: #4af626;
    --dim: #1a4d10;
    --danger: #f62626;
    --scanline: rgba(74, 246, 38, 0.05);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e0e0e0;
      --fg: #0a5a0a;
      --dim: #99b399;
      --danger: #a00000;
      --scanline: rgba(10, 90, 10, 0.05);
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100dvw; height: 100dvh;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden; touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
  }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, var(--scanline) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    background-size: 100% 4px, 3px 100%;
  }
  .ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 20;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: rgba(17, 17, 17, 0.85);
    transition: opacity 0.3s;
  }
  @media (prefers-color-scheme: light) {
    .screen { background: rgba(224, 224, 224, 0.85); }
  }
  .hidden { opacity: 0; pointer-events: none !important; }
  
  button {
    pointer-events: auto;
    background: var(--bg); color: var(--fg);
    border: 2px solid var(--fg); padding: 15px 40px;
    font-size: 1.2rem; font-family: inherit; text-transform: uppercase;
    cursor: pointer; margin-top: 30px;
    box-shadow: 0 0 15px var(--scanline);
    transition: all 0.2s;
    letter-spacing: 2px;
  }
  button:active { background: var(--fg); color: var(--bg); }
  
  h1 { 
    font-size: 2.5rem; margin: 0 0 10px 0; 
    text-shadow: 0 0 10px var(--fg); 
    text-transform: uppercase; letter-spacing: 4px;
    text-align: center;
  }
  p { 
    margin: 10px 0; text-align: center; max-width: 80%; 
    line-height: 1.6; font-size: 1.1rem;
  }
  .controls-desc {
    margin-top: 20px; padding: 20px;
    border: 1px solid var(--dim);
    background: rgba(0,0,0,0.5);
    text-align: center; line-height: 1.8;
  }
  @media (prefers-color-scheme: light) {
    .controls-desc { background: rgba(255,255,255,0.5); }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div class="overlay"></div>

<div class="ui-layer">
  <div id="startScreen" class="screen">
    <h1>Whisper Sort</h1>
    <p>Sort the drifting tokens before they dissolve.</p>
    <div class="controls-desc">
      Swipe <strong>LEFT</strong> for FEAR<br>
      Swipe <strong>UP</strong> for AGENT<br>
      Swipe <strong>RIGHT</strong> for HOPE
    </div>
    <button data-smoke="start" id="startBtn">Initialize</button>
  </div>
  
  <div id="gameOverScreen" class="screen hidden">
    <h1>System Halt</h1>
    <p>Integrity compromised.</p>
    <p style="font-size: 1.5rem; margin-top: 20px;">Score: <span id="finalScore">0</span></p>
    <button data-smoke="restart" id="restartBtn">Reboot</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const finalScoreEl = document.getElementById('finalScore');

let width, height;
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

let colors = {};
function updateColors() {
  const style = getComputedStyle(document.body);
  colors = {
    bg: style.getPropertyValue('--bg').trim() || '#111',
    fg: style.getPropertyValue('--fg').trim() || '#4af626',
    dim: style.getPropertyValue('--dim').trim() || '#1a4d10',
    danger: style.getPropertyValue('--danger').trim() || '#f62626'
  };
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
updateColors();

let audioCtx;
function playTone(freq, type, duration, vol=0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

const WORDS = {
  fear: ['lost', 'dark', 'cold', 'fall', 'void', 'panic', 'dread', 'fade', 'ruin', 'doom'],
  hope: ['dawn', 'clear', 'warm', 'rise', 'glow', 'spark', 'calm', 'mend', 'safe', 'heal'],
  agent: ['sync', 'task', 'node', 'loop', 'exec', 'ping', 'scan', 'boot', 'auth', 'link']
};

let state = 'start';
let score = 0;
let integrity = 100;
let tokens = [];
let particles = [];
let lastTime = performance.now();
let spawnTimer = 0;
let spawnInterval = 2000;
let timeElapsed = 0;
let screenShake = 0;

let binFlashes = { fear: 0, hope: 0, agent: 0 };
let binMeters = { fear: 0, hope: 0, agent: 0 };

class Token {
  constructor(x, y, isHybrid, speedMult) {
    this.x = x;
    this.y = y;
    this.isHybrid = isHybrid;
    
    const types = ['fear', 'hope', 'agent'];
    this.realType = types[Math.floor(Math.random() * types.length)];
    this.realWord = WORDS[this.realType][Math.floor(Math.random() * WORDS[this.realType].length)];
    this.displayWord = this.realWord;
    
    this.vx = 0;
    this.vy = - (height * 0.2) * speedMult / 1000; 
    this.life = 1.0;
    this.isDragging = false;
    this.isFlicked = false;
    this.hybridTimer = 0;
    this.dissolveRate = (0.15 + Math.random() * 0.1) * speedMult; 
  }

  update(dt) {
    if (this.isFlicked) {
      this.x += this.vx * (dt/1000);
      this.y += this.vy * (dt/1000);
    } else if (!this.isDragging) {
      this.x += this.vx * (dt/1000);
      this.y += this.vy * (dt/1000);
      this.life -= this.dissolveRate * (dt / 1000);
      
      if (this.isHybrid) {
        this.hybridTimer += dt;
        if (this.hybridTimer > 150) {
          this.hybridTimer = 0;
          const types = ['fear', 'hope', 'agent'];
          const rt = types[Math.floor(Math.random() * types.length)];
          this.displayWord = WORDS[rt][Math.floor(Math.random() * WORDS[rt].length)];
        }
      }
    }
  }

  draw(ctx, colors) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    let alpha = Math.max(0, this.life);
    if (this.isDragging) alpha = 1.0;
    
    if (this.isHybrid && !this.isDragging && !this.isFlicked) {
      ctx.globalAlpha = alpha * 0.8;
      ctx.fillStyle = colors.fg;
      ctx.font = 'bold 18px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      let ox = (Math.random()-0.5)*4;
      let oy = (Math.random()-0.5)*4;
      ctx.fillText(this.displayWord.toUpperCase(), ox, oy);
      
      if (Math.random() < 0.2) {
        ctx.fillStyle = colors.dim;
        ctx.fillRect(-30 + ox, -10 + oy, 60, 4);
      }
    } else {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = colors.bg;
      ctx.strokeStyle = colors.fg;
      ctx.lineWidth = 2;
      
      ctx.beginPath();
      ctx.rect(-45, -20, 90, 40);
      ctx.fill();
      ctx.stroke();
      
      ctx.fillStyle = colors.fg;
      ctx.font = '16px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.displayWord.toUpperCase(), 0, 0);
    }
    
    if (!this.isFlicked && !this.isHybrid) {
      ctx.fillStyle = colors.dim;
      ctx.fillRect(-40, 15, 80, 2);
      ctx.fillStyle = colors.fg;
      ctx.fillRect(-40, 15, 80 * this.life, 2);
    }
    
    ctx.restore();
  }
}

let activeToken = null;
let dragStartX = 0;
let dragStartY = 0;
let tokenStartX = 0;
let tokenStartY = 0;
let dragHistory = [];

function getPointerPos(e) {
  if (e.touches && e.touches.length > 0) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

function onPointerDown(e) {
  if (state !== 'playing') return;
  if (e.target !== canvas) return;
  if (e.cancelable) e.preventDefault();
  
  const pos = getPointerPos(e);
  
  for (let i = tokens.length - 1; i >= 0; i--) {
    let t = tokens[i];
    if (t.isFlicked) continue;
    let dx = pos.x - t.x;
    let dy = pos.y - t.y;
    if (dx*dx + dy*dy < 60*60) { 
      activeToken = t;
      t.isDragging = true;
      if (t.isHybrid) {
        t.isHybrid = false;
        t.displayWord = t.realWord;
        playTone(600, 'square', 0.1, 0.05);
      }
      dragStartX = pos.x;
      dragStartY = pos.y;
      tokenStartX = t.x;
      tokenStartY = t.y;
      dragHistory = [{x: pos.x, y: pos.y, time: performance.now()}];
      break;
    }
  }
}

function onPointerMove(e) {
  if (!activeToken) return;
  if (e.cancelable) e.preventDefault();
  const pos = getPointerPos(e);
  
  activeToken.x = tokenStartX + (pos.x - dragStartX);
  activeToken.y = tokenStartY + (pos.y - dragStartY);
  
  const now = performance.now();
  dragHistory.push({x: pos.x, y: pos.y, time: now});
  while (dragHistory.length > 0 && now - dragHistory[0].time > 100) {
    dragHistory.shift();
  }
}

function onPointerUp(e) {
  if (!activeToken) return;
  if (e.cancelable) e.preventDefault();
  
  const now = performance.now();
  let flickVx = 0;
  let flickVy = 0;
  
  while (dragHistory.length > 0 && now - dragHistory[0].time > 150) {
    dragHistory.shift();
  }
  
  if (dragHistory.length > 1) {
    const oldest = dragHistory[0];
    const latest = dragHistory[dragHistory.length - 1];
    const dt = latest.time - oldest.time;
    if (dt > 0) {
      flickVx = (latest.x - oldest.x) / dt;
      flickVy = (latest.y - oldest.y) / dt;
    }
  }
  
  activeToken.isDragging = false;
  
  const speed = Math.sqrt(flickVx*flickVx + flickVy*flickVy);
  if (speed > 0.5) { 
    activeToken.isFlicked = true;
    activeToken.vx = flickVx * 1000;
    activeToken.vy = flickVy * 1000;
    playTone(300, 'sine', 0.1, 0.05);
  } else {
    activeToken.vx = 0;
    activeToken.vy = - (height * 0.2) / 1000; 
  }
  
  activeToken = null;
}

canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

canvas.addEventListener('touchstart', onPointerDown, {passive: false});
canvas.addEventListener('touchmove', onPointerMove, {passive: false});
window.addEventListener('touchend', onPointerUp, {passive: false});

function spawnParticles(x, y, color, count=15) {
  for(let i=0; i<count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random()-0.5)*300,
      vy: (Math.random()-0.5)*300,
      life: 1.0,
      color: color
    });
  }
}

function update(dt) {
  if (state !== 'playing') return;
  
  timeElapsed += dt;
  
  let difficulty = Math.min(1.0, timeElapsed / 60000); 
  spawnInterval = 2000 - difficulty * 1300; 
  let speedMult = 1.0 + difficulty * 1.5;
  let hybridChance = difficulty * 0.5; 
  
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = spawnInterval;
    let isHybrid = Math.random() < hybridChance;
    let x = width * 0.2 + Math.random() * (width * 0.6);
    let y = height + 50;
    tokens.push(new Token(x, y, isHybrid, speedMult));
  }
  
  for (let k in binMeters) {
    binMeters[k] -= dt * 0.005;
    if (binMeters[k] < 0) binMeters[k] = 0;
  }
  
  for (let i = tokens.length - 1; i >= 0; i--) {
    let t = tokens[i];
    t.update(dt);
    
    if (t.isFlicked) {
      let sorted = false;
      let sortType = null;
      
      if (t.x < 0) { sorted = true; sortType = 'fear'; }
      else if (t.x > width) { sorted = true; sortType = 'hope'; }
      else if (t.y < 0) { sorted = true; sortType = 'agent'; }
      else if (t.y > height + 100) { sorted = true; sortType = 'miss'; }
      
      if (sorted) {
        let px = Math.max(10, Math.min(width - 10, t.x));
        let py = Math.max(10, Math.min(height - 10, t.y));
        
        if (sortType === t.realType) {
          score += 10;
          integrity = Math.min(100, integrity + 5);
          binFlashes[sortType] = 1.0;
          binMeters[sortType] = Math.min(100, binMeters[sortType] + 20);
          
          if (binMeters[sortType] >= 100) {
            score += 50;
            binMeters[sortType] = 0;
            playTone(1000, 'square', 0.2, 0.1);
            playTone(1500, 'square', 0.3, 0.1);
            spawnParticles(px, py, colors.fg, 30);
          } else {
            playTone(800 + score*2, 'sine', 0.1, 0.1);
            playTone(1200 + score*2, 'sine', 0.15, 0.1);
          }
          
          if (navigator.vibrate) try { navigator.vibrate(10); } catch(e){}
          spawnParticles(px, py, colors.fg, 10);
        } else if (sortType !== 'miss') {
          integrity -= 15;
          screenShake = 10;
          playTone(150, 'sawtooth', 0.3, 0.1);
          if (navigator.vibrate) try { navigator.vibrate([30, 30, 30]); } catch(e){}
          spawnParticles(px, py, colors.danger, 20);
        }
        tokens.splice(i, 1);
        continue;
      }
    } else {
      if (t.life <= 0) {
        integrity -= 10;
        playTone(100, 'sawtooth', 0.4, 0.1);
        if (navigator.vibrate) try { navigator.vibrate(50); } catch(e){}
        spawnParticles(t.x, t.y, colors.danger);
        tokens.splice(i, 1);
        continue;
      }
    }
  }
  
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * (dt/1000);
    p.y += p.vy * (dt/1000);
    p.life -= dt/1000;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  if (integrity <= 0) {
    gameOver();
  }
}

function drawBins(ctx, colors) {
  ctx.font = '20px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  const drawMeter = (val) => {
    ctx.fillStyle = colors.dim;
    ctx.fillRect(-40, 20, 80, 4);
    ctx.fillStyle = colors.fg;
    ctx.fillRect(-40, 20, 80 * (val/100), 4);
  };
  
  ctx.save();
  ctx.translate(30, height/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillStyle = binFlashes.fear > 0 ? colors.fg : colors.dim;
  ctx.fillText('< FEAR', 0, 0);
  drawMeter(binMeters.fear);
  ctx.restore();
  
  ctx.save();
  ctx.translate(width - 30, height/2);
  ctx.rotate(Math.PI/2);
  ctx.fillStyle = binFlashes.hope > 0 ? colors.fg : colors.dim;
  ctx.fillText('HOPE >', 0, 0);
  drawMeter(binMeters.hope);
  ctx.restore();
  
  ctx.save();
  ctx.translate(width/2, 30);
  ctx.fillStyle = binFlashes.agent > 0 ? colors.fg : colors.dim;
  ctx.fillText('^ AGENT ^', 0, 0);
  drawMeter(binMeters.agent);
  ctx.restore();
  
  for (let k in binFlashes) {
    if (binFlashes[k] > 0) binFlashes[k] -= 0.05;
  }
}

function drawUI(ctx, colors) {
  ctx.fillStyle = colors.fg;
  ctx.font = '16px ui-monospace, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(`SCORE: ${score}`, 10, 10);
  
  ctx.textAlign = 'right';
  ctx.fillText('INTEGRITY', width - 10, 10);
  ctx.fillStyle = colors.dim;
  ctx.fillRect(width - 110, 30, 100, 10);
  ctx.fillStyle = integrity > 30 ? colors.fg : colors.danger;
  ctx.fillRect(width - 110, 30, integrity, 10);
}

function loop(time) {
  requestAnimationFrame(loop);
  
  let dt = time - lastTime;
  lastTime = time;
  if (dt > 100) dt = 100; 
  
  update(dt);
  
  ctx.fillStyle = colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
    screenShake -= dt * 0.05;
    if (screenShake < 0) screenShake = 0;
  }
  
  if (state === 'playing') {
    drawBins(ctx, colors);
    
    for (let t of tokens) {
      t.draw(ctx, colors);
    }
    
    for (let p of particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillRect(p.x, p.y, 4, 4);
    }
    ctx.globalAlpha = 1.0;
  }
  
  ctx.restore();
  
  if (state === 'playing') {
    drawUI(ctx, colors);
  }
}

function startGame() {
  initAudio();
  state = 'playing';
  score = 0;
  integrity = 100;
  tokens = [];
  particles = [];
  timeElapsed = 0;
  spawnTimer = 1000;
  
  binFlashes = { fear: 0, hope: 0, agent: 0 };
  binMeters = { fear: 0, hope: 0, agent: 0 };
  
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  
  playTone(400, 'square', 0.1);
  setTimeout(() => playTone(600, 'square', 0.2), 100);
}

function gameOver() {
  state = 'gameover';
  finalScoreEl.innerText = score;
  gameOverScreen.classList.remove('hidden');
  
  playTone(200, 'sawtooth', 0.5);
  setTimeout(() => playTone(150, 'sawtooth', 0.8), 200);
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

requestAnimationFrame(loop);
</script>
</body>
</html>
