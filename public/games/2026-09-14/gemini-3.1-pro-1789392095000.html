<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sunrise Shippers</title>
  <style>
    :root {
      --bg-dark: #11131a;
      --bg-light: #f0f2f5;
      --text-dark: #ffffff;
      --text-light: #111111;
      --brand: #ff6b35;
      --brand-hover: #ff8c61;
      --accent: #00ffcc;
    }
    html, body {
      margin: 0; padding: 0;
      width: 100dvw; height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-dark);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: var(--bg-light);
        color: var(--text-light);
      }
    }
    canvas {
      display: block;
      width: 100dvw; height: 100dvh;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #uiLayer {
      position: absolute;
      top: 0; left: 0;
      width: 100dvw; height: 100dvh;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .screen {
      background: rgba(17, 19, 26, 0.85);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      text-align: center;
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 85%;
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: light) {
      .screen {
        background: rgba(240, 242, 245, 0.85);
        border: 1px solid rgba(0,0,0,0.1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      }
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1.5rem 0;
      font-size: 1rem;
      line-height: 1.5;
      opacity: 0.9;
    }
    .hint {
      font-size: 0.85rem;
      opacity: 0.6;
      margin-bottom: 2rem;
    }
    button {
      appearance: none;
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-family: inherit;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      pointer-events: auto;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: transform 0.1s;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
    }
    button:active {
      transform: scale(0.95);
    }
    .hidden {
      display: none !important;
    }
    #hud {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 0;
      width: 100%;
      padding: 15px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 5;
      pointer-events: none;
    }
    #hudTop {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 1.1rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    @media (prefers-color-scheme: light) {
      #hudTop { text-shadow: 0 2px 4px rgba(255,255,255,0.8); }
    }
    #timeBarContainer {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.2);
      overflow: hidden;
    }
    @media (prefers-color-scheme: light) {
      #timeBarContainer { background: rgba(0,0,0,0.15); }
    }
    #timeBar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff6b35, #f7c59f);
      transform-origin: left;
      transition: width 0.1s linear;
    }
    #finalScoreHighlight {
      font-size: 3.5rem;
      font-weight: bold;
      display: block;
      margin: 1rem 0;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="uiLayer">
    <div id="startScreen" class="screen">
      <h1>Sunrise Shippers</h1>
      <p>Flick agent orbs to complete tasks before sunrise.</p>
      <p class="hint">Drag from the bottom half of the screen to aim and flick.</p>
      <button data-smoke="start" id="btnStart">Ship It</button>
    </div>

    <div id="hud" class="hidden">
      <div id="hudTop">
        <div id="scoreDisplay">Tasks: 0</div>
        <div id="timeDisplay">Until Sunrise</div>
      </div>
      <div id="timeBarContainer">
        <div id="timeBar"></div>
      </div>
    </div>

    <div id="gameOverScreen" class="screen hidden">
      <h1 id="gameOverTitle">Morning Shipped!</h1>
      <span id="finalScoreHighlight">0</span>
      <p id="gameOverSubtext">The registry is safe for another day.</p>
      <button data-smoke="restart" id="btnRestart">Restart</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let isDark = true;
    if (typeof window !== 'undefined' && window.matchMedia) {
      const mm = window.matchMedia('(prefers-color-scheme: dark)');
      isDark = mm.matches;
      mm.addEventListener('change', e => isDark = e.matches);
    }

    let gameState = 'START'; // START, PLAYING, GAME_OVER
    let score = 0;
    let maxTime = 45;
    let timeLeft = maxTime;
    let lastTime = 0;
    let loopRunning = false;
    let shakeTime = 0;

    let orbs = [];
    let nodes = [];
    let wells = [];
    let particles = [];
    let bgStars = [];
    
    // Interaction state
    let isPointerDown = false;
    let draggingOrb = null;
    let dragPositions = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      // Re-init stars on resize
      bgStars = [];
      for(let i=0; i<60; i++) {
        bgStars.push({
          x: Math.random(),
          y: Math.random(),
          size: 0.5 + Math.random() * 1.5,
          blinkBase: Math.random() * Math.PI * 2,
          blinkSpeed: 1 + Math.random() * 2
        });
      }
    }
    window.addEventListener('resize', resize);

    function spawnParticles(x, y, count, color) {
      for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * canvas.height * 0.25 + 50;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.2 + Math.random() * 0.4,
          maxLife: 0.6,
          size: 2 + Math.random() * 3,
          color: color
        });
      }
    }

    function spawnNode() {
      let targetNodes = 1;
      if (score >= 2) targetNodes = 2;
      if (score >= 6) targetNodes = 3;
      if (score >= 12) targetNodes = 4;

      while (nodes.length < targetNodes) {
        nodes.push({
          baseX: canvas.width * (0.2 + Math.random() * 0.6),
          baseY: canvas.height * (0.1 + Math.random() * 0.3), // upper area
          x: 0, y: 0,
          ampX: canvas.width * (0.1 + Math.random() * 0.2),
          ampY: canvas.height * (0.05 + Math.random() * 0.1),
          speedX: 0.8 + Math.random() * 1.5 + (score * 0.05),
          speedY: 0.8 + Math.random() * 1.5 + (score * 0.05),
          offsetX: Math.random() * Math.PI * 2,
          offsetY: Math.random() * Math.PI * 2,
          radius: Math.min(canvas.width, canvas.height) * 0.065,
          health: 3
        });
      }
    }

    function checkLevelEscalation() {
      if (score === 3 && wells.length === 0) {
        wells.push({
          baseX: canvas.width / 2,
          baseY: canvas.height * 0.45,
          x: canvas.width / 2, y: canvas.height * 0.45,
          radius: canvas.width * 0.08,
          mass: 250, // strength multiplier
          moving: false
        });
      }
      if (score === 8 && wells.length === 1) {
        wells.push({
          baseX: canvas.width / 2,
          baseY: canvas.height * 0.35,
          x: canvas.width / 2, y: canvas.height * 0.35,
          radius: canvas.width * 0.07,
          mass: 300,
          moving: true,
          amp: canvas.width * 0.3,
          speed: 1.2,
          offsetX: 0
        });
      }
    }

    function initGame() {
      score = 0;
      timeLeft = maxTime;
      orbs = [];
      nodes = [];
      wells = [];
      particles = [];
      shakeTime = 0;
      
      spawnNode();
      
      gameState = 'PLAYING';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      
      lastTime = performance.now();
    }

    function endGame() {
      gameState = 'GAME_OVER';
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.remove('hidden');
      
      let title = document.getElementById('gameOverTitle');
      let subtext = document.getElementById('gameOverSubtext');
      
      if (score >= 3) {
        title.innerText = "Morning Shipped!";
        subtext.innerText = "The registry is safe for another day.";
      } else {
        title.innerText = "Deadline Missed";
        subtext.innerText = "Sunrise caught you sleeping.";
      }
      document.getElementById('finalScoreHighlight').innerText = score;
    }

    document.getElementById('btnStart').addEventListener('click', initGame);
    document.getElementById('btnRestart').addEventListener('click', initGame);

    // Pointer Input
    canvas.addEventListener('pointerdown', (e) => {
      if (gameState !== 'PLAYING') return;
      isPointerDown = true;
      let x = e.clientX;
      let y = e.clientY;

      // Allow dragging from anywhere in the bottom 60% of the screen
      if (y > canvas.height * 0.4) {
        draggingOrb = { x: x, y: y };
        dragPositions = [{ x: x, y: y, t: performance.now() }];
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (gameState !== 'PLAYING' || !isPointerDown) return;
      if (draggingOrb) {
        draggingOrb.x = e.clientX;
        draggingOrb.y = e.clientY;
        dragPositions.push({ x: e.clientX, y: e.clientY, t: performance.now() });
        if (dragPositions.length > 8) dragPositions.shift(); // keep short history
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      if (gameState !== 'PLAYING' || !isPointerDown) return;
      isPointerDown = false;

      if (draggingOrb) {
        let now = performance.now();
        // Only consider movements from the last 150ms to ensure crisp flicks
        let validPositions = dragPositions.filter(p => now - p.t < 150);
        validPositions.push({ x: e.clientX, y: e.clientY, t: now });

        if (validPositions.length >= 2) {
          let first = validPositions[0];
          let last = validPositions[validPositions.length - 1];
          let dt = (last.t - first.t) / 1000;
          
          if (dt > 0.005) { // Prevent division by tiny fraction
            let vx = (last.x - first.x) / dt;
            let vy = (last.y - first.y) / dt;

            let speed = Math.hypot(vx, vy);
            const MAX_SPEED = canvas.height * 3.5;
            if (speed > MAX_SPEED) {
              vx = (vx / speed) * MAX_SPEED;
              vy = (vy / speed) * MAX_SPEED;
            }

            // Only launch if there is a minimum upward or sideward intentional flick
            if (speed > canvas.height * 0.2) {
              orbs.push({
                x: draggingOrb.x,
                y: draggingOrb.y,
                vx: vx,
                vy: vy,
                radius: Math.min(canvas.width, canvas.height) * 0.02,
                trail: []
              });
              if (navigator.vibrate) navigator.vibrate(10);
            }
          }
        }
        draggingOrb = null;
        dragPositions = [];
      }
    });

    // Leave touch behavior to touch-action: none, but gracefully handle canceling
    canvas.addEventListener('pointercancel', () => {
      isPointerDown = false;
      draggingOrb = null;
    });

    function update(dt) {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        endGame();
        return;
      }

      // Update Orbs
      for (let i = orbs.length - 1; i >= 0; i--) {
        let o = orbs[i];
        o.x += o.vx * dt;
        o.y += o.vy * dt;

        o.trail.push({x: o.x, y: o.y});
        if (o.trail.length > 8) o.trail.shift();

        // Particles emit
        if (Math.random() < 0.2) {
          particles.push({
            x: o.x + (Math.random()-0.5)*o.radius,
            y: o.y + (Math.random()-0.5)*o.radius,
            vx: o.vx * 0.05 + (Math.random()-0.5)*15,
            vy: o.vy * 0.05 + (Math.random()-0.5)*15,
            life: 0.1 + Math.random()*0.2,
            maxLife: 0.3,
            size: 1 + Math.random()*2,
            color: '#00ffcc'
          });
        }

        // Gravity Wells pull
        let absorbed = false;
        for (let w of wells) {
          let dx = w.x - o.x;
          let dy = w.y - o.y;
          let distSq = dx*dx + dy*dy;
          let dist = Math.sqrt(distSq);
          
          if (dist < w.radius * 0.6) {
            // Destroyed by well
            orbs.splice(i, 1);
            spawnParticles(o.x, o.y, 12, '#ff3333');
            if (navigator.vibrate) navigator.vibrate(20);
            absorbed = true;
            break;
          }

          // Apply Gravity force
          let forceMagnitude = Math.min((canvas.height * w.mass) / Math.max(dist, 10), canvas.height * 10);
          o.vx += (dx / dist) * forceMagnitude * dt;
          o.vy += (dy / dist) * forceMagnitude * dt;
        }
        if (absorbed) continue;

        // Bounds Check
        if (o.x < -100 || o.x > canvas.width + 100 || o.y < -100 || o.y > canvas.height + 100) {
          orbs.splice(i, 1);
          continue;
        }

        // Node Collision
        for (let j = nodes.length - 1; j >= 0; j--) {
          let n = nodes[j];
          let dx = n.x - o.x;
          let dy = n.y - o.y;
          if (Math.hypot(dx, dy) < n.radius + o.radius) {
            // Hit!
            n.health--;
            orbs.splice(i, 1);
            spawnParticles(o.x, o.y, 15, '#ffaa00');
            timeLeft = Math.min(maxTime, timeLeft + 1.5);
            if (navigator.vibrate) navigator.vibrate(30);

            if (n.health <= 0) {
              nodes.splice(j, 1);
              score++;
              timeLeft = Math.min(maxTime, timeLeft + 6);
              spawnParticles(n.x, n.y, 50, '#00ffcc');
              shakeTime = 0.2;
              if (navigator.vibrate) navigator.vibrate([50, 40, 50]);
              checkLevelEscalation();
              spawnNode();
            }
            break; // Orb is gone
          }
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      let timeNow = performance.now() / 1000;

      // Base fill
      ctx.fillStyle = isDark ? '#11131a' : '#f0f2f5';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sunrise Gradient Background
      let sunriseProgress = 0;
      if (gameState === 'PLAYING') {
        sunriseProgress = 1 - (timeLeft / maxTime);
      } else if (gameState === 'GAME_OVER') {
        sunriseProgress = 1;
      }
      
      let horizonY = canvas.height * (1 - sunriseProgress * 0.9);
      let gradient = ctx.createLinearGradient(0, horizonY - canvas.height*0.4, 0, canvas.height);
      if (isDark) {
        gradient.addColorStop(0, 'rgba(255, 107, 53, 0)');
        gradient.addColorStop(1, 'rgba(255, 107, 53, 0.35)');
      } else {
        gradient.addColorStop(0, 'rgba(255, 150, 80, 0)');
        gradient.addColorStop(1, 'rgba(255, 150, 80, 0.5)');
      }
      ctx.fillStyle = gradient;
      ctx.fillRect(0, horizonY - canvas.height*0.4, canvas.width, canvas.height);

      // Stars / Nodes background layer
      ctx.fillStyle = isDark ? '#fff' : '#000';
      for (let s of bgStars) {
        let alpha = (Math.sin(timeNow * s.blinkSpeed + s.blinkBase) * 0.5 + 0.5) * 0.4;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(s.x * canvas.width, s.y * canvas.height, s.size, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // Apply screen shake
      ctx.save();
      if (shakeTime > 0) {
        let mag = shakeTime * 40;
        ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
      }

      // Update passive movement for idle states (START / GAME_OVER)
      if (gameState !== 'PLAYING') {
        let dt = 1/60;
        for (let p of particles) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
        }
        particles = particles.filter(p => p.life > 0);
      }
      
      // Update & Draw Nodes passively
      for (let n of nodes) {
        n.x = n.baseX + Math.sin(timeNow * n.speedX + n.offsetX) * n.ampX;
        n.y = n.baseY + Math.cos(timeNow * n.speedY + n.offsetY) * n.ampY;

        ctx.save();
        ctx.translate(n.x, n.y);
        ctx.rotate(timeNow * n.speedX * 0.5);

        // Core
        ctx.beginPath();
        ctx.arc(0, 0, n.radius * 0.35, 0, Math.PI*2);
        ctx.fillStyle = isDark ? '#222' : '#ddd';
        ctx.fill();
        let color = n.health === 3 ? '#00ffcc' : (n.health === 2 ? '#ffaa00' : '#ff3333');
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Health Rings
        let segments = 3;
        let gap = 0.2;
        for(let i = 0; i < segments; i++) {
          if (i >= n.health) continue;
          let startAngle = (i * Math.PI * 2 / segments) + gap;
          let endAngle = ((i+1) * Math.PI * 2 / segments) - gap;
          ctx.beginPath();
          ctx.arc(0, 0, n.radius * 0.8, startAngle, endAngle);
          ctx.lineWidth = n.radius * 0.15;
          ctx.strokeStyle = color;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
        ctx.restore();
      }

      // Update & Draw Wells
      for (let w of wells) {
        if (w.moving) {
          w.x = w.baseX + Math.sin(timeNow * w.speed + w.offsetX) * w.amp;
        }
        ctx.save();
        ctx.translate(w.x, w.y);
        ctx.rotate(-timeNow * 2);

        // Core
        ctx.beginPath();
        ctx.arc(0, 0, w.radius * 0.45, 0, Math.PI*2);
        ctx.fillStyle = isDark ? '#000' : '#333';
        ctx.fill();

        // Accretion disk rings
        ctx.beginPath();
        ctx.ellipse(0, 0, w.radius, w.radius * 0.6, 0, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255, 107, 53, 0.6)';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, 0, w.radius * 0.85, w.radius * 0.4, Math.PI/3, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255, 150, 80, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
      }

      // Draw Dock
      let dockW = canvas.width * 0.25;
      let dockH = 6;
      let dockX = canvas.width / 2 - dockW / 2;
      let dockY = canvas.height - 35;

      ctx.fillStyle = isDark ? '#333' : '#ccc';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(dockX, dockY, dockW, dockH, 3) : ctx.rect(dockX, dockY, dockW, dockH);
      ctx.fill();
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(dockX + dockW*0.35, dockY - 2, dockW*0.3, dockH + 4);

      // Draw Drag Interaction
      if (draggingOrb) {
        // Data Tether
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, dockY);
        ctx.lineTo(draggingOrb.x, draggingOrb.y);
        ctx.strokeStyle = 'rgba(0, 255, 204, 0.4)';
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 10]);
        ctx.lineDashOffset = -timeNow * 60;
        ctx.stroke();
        ctx.setLineDash([]);

        // Dragged Orb
        ctx.beginPath();
        ctx.arc(draggingOrb.x, draggingOrb.y, Math.min(canvas.width, canvas.height) * 0.02, 0, Math.PI*2);
        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Draw active Orbs
      for (let o of orbs) {
        // Trail
        if (o.trail && o.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(o.trail[0].x, o.trail[0].y);
          for (let i = 1; i < o.trail.length; i++) {
            ctx.lineTo(o.trail[i].x, o.trail[i].y);
          }
          ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
          ctx.lineWidth = o.radius * 1.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(o.x, o.y, o.radius, 0, Math.PI*2);
        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Draw Particles
      for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }

      ctx.restore(); // Restore shake

      // Update UI HUD Text
      if (gameState === 'PLAYING') {
        document.getElementById('scoreDisplay').innerText = `Tasks: ${score}`;
        let p = Math.max(0, Math.min(1, timeLeft / maxTime));
        document.getElementById('timeBar').style.width = `${p * 100}%`;
      }
    }

    function gameLoop(time) {
      if (!time) time = performance.now();
      let dt = (time - lastTime) / 1000;
      if (dt > 0.1) dt = 0.1;
      lastTime = time;

      if (gameState === 'PLAYING') {
        update(dt);
      }
      
      draw();
      requestAnimationFrame(gameLoop);
    }

    function initApp() {
      resize();
      // Start with some visual nodes for the title screen
      score = 0;
      nodes = [];
      spawnNode();
      
      if (!loopRunning) {
        loopRunning = true;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
      }
    }

    window.addEventListener('load', initApp);

  </script>
</body>
</html>
