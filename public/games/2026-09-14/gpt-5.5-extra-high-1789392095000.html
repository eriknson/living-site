<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Threadshift</title>
<style>
:root{
  color-scheme:light dark;
  --bg0:#071113;
  --bg1:#16221f;
  --ink:#eefbf6;
  --muted:#9db0aa;
  --glass:rgba(240,255,249,.10);
  --glass2:rgba(240,255,249,.18);
  --line:rgba(222,246,238,.22);
  --shadow:rgba(0,0,0,.38);
  --good:#2dd4bf;
  --warm:#f4a21f;
  --fast:#ff6b3d;
  --bad:#ff4f43;
}
@media (prefers-color-scheme:light){
  :root{
    --bg0:#f7f1e7;
    --bg1:#dfeae5;
    --ink:#10201d;
    --muted:#5d6e69;
    --glass:rgba(255,255,255,.58);
    --glass2:rgba(255,255,255,.82);
    --line:rgba(24,48,43,.16);
    --shadow:rgba(48,42,31,.14);
  }
}
@media (prefers-color-scheme:dark){
  :root{
    --bg0:#071113;
    --bg1:#16221f;
    --ink:#eefbf6;
    --muted:#9db0aa;
    --glass:rgba(240,255,249,.10);
    --glass2:rgba(240,255,249,.18);
    --line:rgba(222,246,238,.22);
    --shadow:rgba(0,0,0,.38);
  }
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg0)}
body{
  min-height:100dvh;
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{
  position:fixed;
  inset:0;
  width:100dvw;
  height:100dvh;
  min-height:100dvh;
  overflow:hidden;
  user-select:none;
  background:
    radial-gradient(circle at 50% 18%, color-mix(in srgb,var(--good),transparent 76%), transparent 34%),
    linear-gradient(160deg,var(--bg0),var(--bg1));
}
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  z-index:1;
}
.hud{
  position:absolute;
  z-index:4;
  top:env(safe-area-inset-top,0);
  left:0;
  right:0;
  padding:14px clamp(14px,4vw,28px);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  pointer-events:none;
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
.stack{display:grid;gap:7px}
.pill,.hud button{
  min-height:44px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--glass);
  color:var(--ink);
  box-shadow:0 14px 42px var(--shadow), inset 0 1px 0 rgba(255,255,255,.18);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.pill{
  padding:10px 13px;
  min-width:108px;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-size:12px;
}
.pill b{display:block;font-size:20px;line-height:1.05;letter-spacing:.01em;text-transform:none}
.hud button{
  pointer-events:auto;
  appearance:none;
  border-color:color-mix(in srgb,var(--line),var(--ink) 6%);
  padding:0 16px;
  font:700 12px/1 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
}
.hud button[hidden]{display:none}
.overlay{
  position:absolute;
  inset:0;
  z-index:5;
  display:grid;
  place-items:center;
  padding:clamp(18px,5vw,42px);
  pointer-events:none;
  transition:opacity .32s ease,transform .32s ease;
}
.overlay[hidden]{display:none}
.panel{
  width:min(520px,100%);
  border:1px solid var(--line);
  border-radius:32px;
  padding:clamp(22px,6vw,38px);
  background:linear-gradient(145deg,var(--glass2),color-mix(in srgb,var(--glass),transparent 20%));
  box-shadow:0 28px 90px var(--shadow), inset 0 1px 0 rgba(255,255,255,.22);
  backdrop-filter:blur(24px) saturate(1.2);
  -webkit-backdrop-filter:blur(24px) saturate(1.2);
  text-align:left;
}
.kicker{
  margin:0 0 13px;
  color:var(--muted);
  font:700 12px/1.2 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  letter-spacing:.14em;
  text-transform:uppercase;
}
h1{
  margin:0;
  font-size:clamp(42px,14vw,74px);
  line-height:.88;
  letter-spacing:-.08em;
}
p{
  margin:18px 0 0;
  max-width:38ch;
  color:var(--muted);
  font-size:clamp(15px,4vw,18px);
  line-height:1.48;
}
.legend{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:22px 0;
}
.chip{
  border:1px solid var(--line);
  border-radius:18px;
  padding:11px 9px;
  background:rgba(255,255,255,.08);
  color:var(--ink);
  font:700 11px/1.2 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  letter-spacing:.08em;
  text-align:center;
}
.dot{
  display:block;
  width:16px;
  height:16px;
  border-radius:999px;
  margin:0 auto 7px;
}
.actions{display:flex;gap:10px;align-items:center;margin-top:22px}
.primary{
  min-width:154px;
  min-height:52px;
  border:0;
  border-radius:999px;
  padding:0 22px;
  background:linear-gradient(135deg,var(--good),#d3b34b);
  color:#061310;
  box-shadow:0 16px 42px color-mix(in srgb,var(--good),transparent 62%);
  font:800 13px/1 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  letter-spacing:.1em;
  text-transform:uppercase;
  cursor:pointer;
  pointer-events:auto;
}
.hint{
  color:var(--muted);
  font:700 11px/1.35 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  letter-spacing:.06em;
  text-transform:uppercase;
}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--good),white 24%);outline-offset:4px}
@media (max-width:430px){
  .hud{padding-top:10px}
  .pill{min-width:94px;padding:9px 11px;font-size:11px}
  .pill b{font-size:18px}
  .panel{border-radius:28px}
  .legend{gap:6px}
}
</style>
</head>
<body>
<main id="app" aria-label="Threadshift game">
  <canvas id="game" aria-hidden="true"></canvas>
  <div class="hud" aria-live="polite">
    <div class="stack">
      <div class="pill">Score <b id="score">0</b></div>
      <div class="pill">Thread <b id="thread">100%</b></div>
    </div>
    <button id="restartBtn" data-smoke="restart" type="button" hidden>Reset</button>
  </div>
  <section id="title" class="overlay">
    <div class="panel">
      <p class="kicker">Overcast autumn handoff</p>
      <h1>Threadshift</h1>
      <p>Questions ride the waveform. Tap or press Space as each colored prompt crosses the answer ring to swap in the matching AI voice.</p>
      <div class="legend" aria-hidden="true">
        <div class="chip"><span class="dot" style="background:#2dd4bf"></span>CIPHER</div>
        <div class="chip"><span class="dot" style="background:#f4a21f"></span>EMBER</div>
        <div class="chip"><span class="dot" style="background:#ff6b3d"></span>SPARK</div>
      </div>
      <div class="actions">
        <button id="startBtn" data-smoke="start" class="primary" type="button">Tune In</button>
        <span class="hint">One thumb. Stay on rhythm.</span>
      </div>
    </div>
  </section>
  <section id="gameover" class="overlay" hidden>
    <div class="panel">
      <p class="kicker" id="overKicker">Conversation closed</p>
      <h1 id="overTitle">Thread held.</h1>
      <p id="overCopy">Nice run.</p>
      <div class="actions">
        <span class="hint" id="overStats">Score 0</span>
      </div>
    </div>
  </section>
</main>
<script>
(()=>{
"use strict";
const $=(id)=>document.getElementById(id);
const canvas=$("game");
if(!(canvas instanceof HTMLCanvasElement))return;
const ctx=canvas.getContext("2d",{alpha:false});
if(!ctx)return;
const app=$("app"),title=$("title"),over=$("gameover"),startBtn=$("startBtn"),restartBtn=$("restartBtn");
const scoreEl=$("score"),threadEl=$("thread"),overTitle=$("overTitle"),overCopy=$("overCopy"),overStats=$("overStats"),overKicker=$("overKicker");
if(!app||!title||!over||!startBtn||!restartBtn||!scoreEl||!threadEl||!overTitle||!overCopy||!overStats||!overKicker)return;

const voices=[
  {name:"CIPHER",role:"precision",color:"#2dd4bf",dark:"#0f766e",tone:392,words:["audit package","trace fork","prove claim","map risk","clean diff"]},
  {name:"EMBER",role:"empathy",color:"#f4a21f",dark:"#b86e12",tone:294,words:["soft reply","calm user","coach voice","warm handoff","steady room"]},
  {name:"SPARK",role:"velocity",color:"#ff6b3d",dark:"#b83d24",tone:523,words:["ship fix","quick plan","agent burst","sunrise push","tiny launch"]}
];
const TAU=Math.PI*2;
let w=1,h=1,dpr=1,hitY=0,centerX=0,topY=0;
let state="title",last=0,t=0,elapsed=0,nextHit=0,score=0,combo=0,integrity=5,hits=0,goal=34,active=0;
let beats=[],particles=[],ripples=[],shake=0,flash=0,message="",messageTimer=0,won=false;
let audioCtx=null,muted=false,seed=7;

function rnd(){
  seed=(seed*1664525+1013904223)>>>0;
  return seed/4294967296;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,p){return a+(b-a)*p}
function ease(p){return 1-Math.pow(1-p,3)}
function isLight(){
  return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches);
}
function resize(){
  dpr=Math.min(2,Math.max(1,window.devicePixelRatio||1));
  w=Math.max(1,window.innerWidth||document.documentElement.clientWidth||390);
  h=Math.max(1,window.innerHeight||document.documentElement.clientHeight||844);
  canvas.width=Math.floor(w*dpr);
  canvas.height=Math.floor(h*dpr);
  canvas.style.width=w+"px";
  canvas.style.height=h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  centerX=w/2;
  hitY=h*.64;
  topY=Math.max(86,h*.13);
}
function safeVibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}
function ensureAudio(){
  if(muted||audioCtx)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(Ctx)audioCtx=new Ctx();
  }catch(e){muted=true}
}
function blip(freq,type,vol,dur){
  try{
    ensureAudio();
    if(!audioCtx)return;
    if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
    const now=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type=type||"sine";
    osc.frequency.setValueAtTime(freq,now);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.05),now+.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+(dur||.16));
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now+(dur||.16)+.03);
  }catch(e){muted=true}
}
function setHud(){
  scoreEl.textContent=String(score);
  threadEl.textContent=Math.max(0,Math.round(integrity/5*100))+"%";
}
function showTitle(){
  state="title";
  title.hidden=false;
  over.hidden=true;
  restartBtn.hidden=true;
  setHud();
}
function showOver(success){
  state="over";
  won=!!success;
  over.hidden=false;
  title.hidden=true;
  restartBtn.hidden=false;
  restartBtn.textContent="Replay Thread";
  overKicker.textContent=won?"Full conversation resolved":"Dialogue broke";
  overTitle.textContent=won?"Thread held.":"Thread cracked.";
  const accuracy=hits+combo>0?Math.round(hits/Math.max(1,hits+(5-integrity))*100):0;
  overCopy.textContent=won?"You matched the rhythm of every rising question long enough to close the loop.":"The question stream outran the handoff. Breathe, listen for the ring, and take the thread again.";
  overStats.textContent="Score "+score+" · Best combo "+combo+" · Sync "+accuracy+"%";
  safeVibrate(won?45:[18,35,18]);
}
function startGame(){
  ensureAudio();
  seed=(Date.now()&0xfffffff)||9;
  state="playing";
  title.hidden=true;
  over.hidden=true;
  restartBtn.hidden=false;
  restartBtn.textContent="Reset";
  elapsed=0;
  nextHit=2.15;
  score=0;
  combo=0;
  integrity=5;
  hits=0;
  active=0;
  beats=[];
  particles=[];
  ripples=[];
  shake=0;
  flash=0;
  message="Find the answer ring";
  messageTimer=1.8;
  won=false;
  setHud();
  blip(330,"sine",.035,.12);
}
function beatInterval(){
  return clamp(1.16-elapsed*.012, .62, 1.16);
}
function hitWindow(){
  return clamp(.205-elapsed*.0021, .108, .205);
}
function chooseVoice(){
  const r=rnd();
  if(elapsed<8)return hits%3;
  if(r<.38)return (active+1)%3;
  if(r<.68)return Math.floor(rnd()*3);
  return (active+2)%3;
}
function spawnBeat(){
  const target=chooseVoice();
  const v=voices[target];
  const list=v.words;
  beats.push({
    id:seed+"-"+Math.floor(nextHit*1000),
    target,
    hit:nextHit,
    travel:clamp(2.42-elapsed*.01,1.68,2.42),
    lane:(rnd()-.5)*Math.min(84,w*.22),
    word:list[Math.floor(rnd()*list.length)]||v.role,
    judged:false,
    wobble:rnd()*TAU
  });
  let gap=beatInterval();
  if(elapsed>18&&rnd()<.18)gap*=.56;
  if(elapsed>30&&rnd()<.16)gap*=.48;
  nextHit+=gap;
}
function addBurst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=rnd()*TAU,sp=lerp(50,230,rnd());
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,life:lerp(.35,.75,rnd()),age:0,color,size:lerp(2,5,rnd())});
  }
}
function feedback(text,good){
  message=text;
  messageTimer=good?.9:1.1;
}
function penalize(reason){
  combo=0;
  integrity-=1;
  shake=.22;
  flash=.42;
  feedback(reason,false);
  setHud();
  safeVibrate(24);
  blip(112,"sawtooth",.035,.18);
  if(integrity<=0)showOver(false);
}
function judgeTap(){
  if(state!=="playing")return;
  const win=hitWindow();
  let best=null,bestD=99;
  for(const b of beats){
    if(b.judged)continue;
    const d=Math.abs(elapsed-b.hit);
    if(d<bestD){best=b;bestD=d}
  }
  ripples.push({x:centerX,y:hitY,age:0,life:.42,color:voices[best?best.target:active].color});
  if(best&&bestD<=win){
    best.judged=true;
    beats=beats.filter(b=>b!==best);
    active=best.target;
    combo+=1;
    hits+=1;
    const tight=Math.max(0,1-bestD/win);
    const gain=100+combo*9+Math.round(tight*65);
    score+=gain;
    addBurst(centerX+best.lane,hitY,voices[active].color,18+Math.min(14,combo));
    feedback((tight>.75?"Perfect ":"Synced ")+voices[active].name,true);
    setHud();
    safeVibrate(combo%8===0?[12,28,12]:10);
    blip(voices[active].tone*(tight>.7?1.5:1),"triangle",.048,.13);
    if(hits>=goal)showOver(true);
  }else{
    penalize(best&&elapsed<best.hit?"Too early":"Off beat");
  }
}
function update(dt){
  if(state==="playing"){
    elapsed+=dt;
    while(nextHit-elapsed<2.7&&hits<goal+4)spawnBeat();
    const late=hitWindow()+.035;
    for(const b of beats){
      if(!b.judged&&elapsed-b.hit>late){
        b.judged=true;
        penalize("Dropped "+voices[b.target].name);
        break;
      }
    }
    beats=beats.filter(b=>!b.judged&&elapsed-b.hit<.6);
    if(elapsed>58&&state==="playing")showOver(false);
  }
  for(const p of particles){
    p.age+=dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vx*=Math.pow(.12,dt);
    p.vy+=120*dt;
  }
  particles=particles.filter(p=>p.age<p.life);
  for(const r of ripples)r.age+=dt;
  ripples=ripples.filter(r=>r.age<r.life);
  shake=Math.max(0,shake-dt*1.8);
  flash=Math.max(0,flash-dt*1.7);
  messageTimer=Math.max(0,messageTimer-dt);
}
function roundRect(x,y,ww,hh,rr){
  const r=Math.min(rr,ww/2,hh/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+ww,y,x+ww,y+hh,r);
  ctx.arcTo(x+ww,y+hh,x,y+hh,r);
  ctx.arcTo(x,y+hh,x,y,r);
  ctx.arcTo(x,y,x+ww,y,r);
  ctx.closePath();
}
function drawBackground(time){
  const light=isLight();
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,light?"#f7f1e7":"#071113");
  g.addColorStop(.58,light?"#dfeae5":"#12201e");
  g.addColorStop(1,light?"#cfded7":"#1d2923");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,w,h);
  ctx.save();
  ctx.globalAlpha=light?.24:.18;
  for(let i=0;i<9;i++){
    const y=(i/8)*h+Math.sin(time*.21+i)*22;
    const grad=ctx.createLinearGradient(0,y-50,w,y+50);
    grad.addColorStop(0,"rgba(45,212,191,0)");
    grad.addColorStop(.48,light?"rgba(60,93,84,.28)":"rgba(160,190,180,.20)");
    grad.addColorStop(1,"rgba(244,162,31,0)");
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.ellipse(w*.5+Math.sin(time*.13+i)*60,y,w*.72,42+Math.sin(i)*10,0,0,TAU);
    ctx.fill();
  }
  ctx.restore();
}
function drawWave(time){
  const amp=Math.min(32,w*.07);
  ctx.save();
  ctx.lineCap="round";
  for(let k=0;k<3;k++){
    ctx.beginPath();
    for(let y=topY-44;y<h+20;y+=8){
      const p=(y-topY)/(hitY-topY);
      const beatPulse=1+Math.sin(time*3.4+y*.026+k)*.25;
      const x=centerX+Math.sin(y*.024+time*(1.25+k*.18))*amp*beatPulse*(.42+k*.18);
      if(y===topY-44)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=voices[(active+k)%3].color;
    ctx.globalAlpha=.12+k*.07;
    ctx.lineWidth=10-k*3;
    ctx.stroke();
  }
  ctx.globalAlpha=.42;
  ctx.strokeStyle=isLight()?"rgba(16,32,29,.35)":"rgba(238,251,246,.38)";
  ctx.lineWidth=1;
  ctx.setLineDash([3,12]);
  ctx.beginPath();
  ctx.moveTo(centerX,topY-50);
  ctx.lineTo(centerX,h-30);
  ctx.stroke();
  ctx.restore();
}
function drawHitRing(time){
  const pulse=1+Math.sin(time*5)*.025;
  const radius=Math.min(83,w*.23)*pulse;
  ctx.save();
  ctx.translate(centerX,hitY);
  ctx.globalAlpha=.22;
  ctx.strokeStyle=voices[active].color;
  ctx.lineWidth=18;
  ctx.beginPath();
  ctx.arc(0,0,radius,0,TAU);
  ctx.stroke();
  ctx.globalAlpha=.84;
  ctx.lineWidth=2;
  ctx.strokeStyle=isLight()?"rgba(15,32,29,.52)":"rgba(240,255,249,.78)";
  ctx.beginPath();
  ctx.arc(0,0,radius,0,TAU);
  ctx.stroke();
  const win=hitWindow();
  ctx.strokeStyle=voices[active].color;
  ctx.lineWidth=5;
  ctx.globalAlpha=.95;
  ctx.beginPath();
  ctx.arc(0,0,radius+8,-Math.PI/2-win*3.7,-Math.PI/2+win*3.7);
  ctx.stroke();
  ctx.restore();
}
function drawFace(v,i,time){
  const orbit=Math.min(130,w*.33,h*.17);
  const a=time*.45+i*TAU/3-Math.PI/2;
  const x=centerX+Math.cos(a)*orbit;
  const y=hitY+Math.sin(a)*orbit*.54;
  const on=i===active;
  const r=on?31:24;
  ctx.save();
  ctx.globalAlpha=on?1:.62;
  const rg=ctx.createRadialGradient(x-r*.3,y-r*.35,2,x,y,r*1.25);
  rg.addColorStop(0,"rgba(255,255,255,.72)");
  rg.addColorStop(.38,v.color);
  rg.addColorStop(1,v.dark);
  ctx.fillStyle=rg;
  ctx.shadowColor=v.color;
  ctx.shadowBlur=on?24:9;
  ctx.beginPath();
  ctx.arc(x,y,r,0,TAU);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=on?"rgba(255,255,255,.82)":"rgba(255,255,255,.36)";
  ctx.lineWidth=on?2.5:1.5;
  ctx.stroke();
  ctx.fillStyle="rgba(5,18,16,.78)";
  ctx.beginPath();
  ctx.arc(x-r*.28,y-r*.08,2.7,0,TAU);
  ctx.arc(x+r*.28,y-r*.08,2.7,0,TAU);
  ctx.fill();
  ctx.strokeStyle="rgba(5,18,16,.7)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(x,y+r*.06,r*.25,0,Math.PI);
  ctx.stroke();
  ctx.fillStyle=isLight()?"rgba(16,32,29,.82)":"rgba(238,251,246,.9)";
  ctx.font="700 10px ui-monospace, SFMono-Regular, Menlo, monospace";
  ctx.textAlign="center";
  ctx.fillText(v.name,x,y+r+17);
  ctx.restore();
}
function drawBeat(b,time){
  const p=clamp(1-(b.hit-elapsed)/b.travel,0,1.18);
  const y=lerp(topY-50,hitY,ease(clamp(p,0,1)));
  const x=centerX+b.lane+Math.sin(time*2.2+b.wobble+p*5)*10;
  const v=voices[b.target];
  const ww=Math.min(192,w*.58),hh=48;
  const scale=lerp(.82,1.04,clamp(p,0,1));
  const near=1-clamp(Math.abs(elapsed-b.hit)/Math.max(.001,hitWindow()),0,1);
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.globalAlpha=clamp(.25+p*.85,0,1);
  ctx.shadowColor=v.color;
  ctx.shadowBlur=8+near*24;
  roundRect(-ww/2,-hh/2,ww,hh,18);
  ctx.fillStyle=isLight()?"rgba(255,255,255,.66)":"rgba(235,255,249,.14)";
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=near>.1?v.color:"rgba(255,255,255,.28)";
  ctx.lineWidth=1.4+near*2.2;
  ctx.stroke();
  ctx.fillStyle=v.color;
  ctx.beginPath();
  ctx.arc(-ww/2+25,0,8+near*3,0,TAU);
  ctx.fill();
  ctx.fillStyle=isLight()?"#10201d":"#eefbf6";
  ctx.font="800 12px ui-monospace, SFMono-Regular, Menlo, monospace";
  ctx.textAlign="left";
  ctx.fillText(v.name,-ww/2+43,-5);
  ctx.fillStyle=isLight()?"rgba(16,32,29,.62)":"rgba(238,251,246,.64)";
  ctx.font="700 11px ui-monospace, SFMono-Regular, Menlo, monospace";
  ctx.fillText(b.word,-ww/2+43,13);
  ctx.restore();
}
function drawParticles(){
  for(const p of particles){
    const q=1-p.age/p.life;
    ctx.save();
    ctx.globalAlpha=q;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*q,0,TAU);
    ctx.fill();
    ctx.restore();
  }
  for(const r of ripples){
    const q=r.age/r.life;
    ctx.save();
    ctx.globalAlpha=(1-q)*.75;
    ctx.strokeStyle=r.color;
    ctx.lineWidth=2+q*6;
    ctx.beginPath();
    ctx.arc(r.x,r.y,22+q*96,0,TAU);
    ctx.stroke();
    ctx.restore();
  }
}
function drawCracks(){
  if(integrity>=5&&flash<=0)return;
  ctx.save();
  ctx.globalAlpha=.16+(5-integrity)*.08+flash*.28;
  ctx.strokeStyle="#ff4f43";
  ctx.lineWidth=1.4;
  for(let i=0;i<5-integrity;i++){
    const a=-Math.PI*.8+i*.42+Math.sin(t+i)*.08;
    const sx=centerX+Math.cos(a)*92,sy=hitY+Math.sin(a)*92;
    ctx.beginPath();
    ctx.moveTo(sx,sy);
    for(let k=1;k<5;k++){
      ctx.lineTo(sx+Math.cos(a+.5*Math.sin(k))*k*15,sy+Math.sin(a+.9*Math.cos(k))*k*13);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawCopy(){
  ctx.save();
  ctx.textAlign="center";
  ctx.font="800 12px ui-monospace, SFMono-Regular, Menlo, monospace";
  ctx.fillStyle=isLight()?"rgba(16,32,29,.68)":"rgba(238,251,246,.72)";
  ctx.fillText(state==="playing"?"TAP ON THE RING · SPACE WORKS TOO":"",centerX,Math.min(h-28,hitY+Math.min(185,h*.22)));
  if(messageTimer>0){
    ctx.globalAlpha=clamp(messageTimer,0,1);
    ctx.fillStyle=message.indexOf("Perfect")===0?voices[active].color:(message.indexOf("Synced")===0?voices[active].color:"#ff6b3d");
    ctx.font="900 18px ui-monospace, SFMono-Regular, Menlo, monospace";
    ctx.fillText(message,centerX,hitY-105);
  }
  if(state==="title"){
    ctx.globalAlpha=.72;
    ctx.fillStyle=voices[active].color;
    ctx.font="800 13px ui-monospace, SFMono-Regular, Menlo, monospace";
    ctx.fillText("CIPHER · EMBER · SPARK",centerX,hitY-112);
  }
  ctx.restore();
}
function drawProgress(){
  if(state!=="playing")return;
  const pad=Math.max(16,w*.05),y=h-15,x=pad,ww=w-pad*2;
  ctx.save();
  ctx.globalAlpha=.55;
  ctx.fillStyle=isLight()?"rgba(16,32,29,.12)":"rgba(238,251,246,.14)";
  roundRect(x,y,ww,4,4);
  ctx.fill();
  ctx.globalAlpha=.95;
  const g=ctx.createLinearGradient(x,0,x+ww,0);
  g.addColorStop(0,voices[0].color);
  g.addColorStop(.56,voices[1].color);
  g.addColorStop(1,voices[2].color);
  ctx.fillStyle=g;
  roundRect(x,y,ww*clamp(hits/goal,0,1),4,4);
  ctx.fill();
  ctx.restore();
}
function render(){
  const sx=shake?Math.sin(t*70)*shake*16:0;
  const sy=shake?Math.cos(t*64)*shake*10:0;
  ctx.save();
  ctx.translate(sx,sy);
  drawBackground(t);
  drawWave(t);
  drawHitRing(t);
  for(let i=0;i<voices.length;i++)drawFace(voices[i],i,t);
  const sorted=beats.slice().sort((a,b)=>a.hit-b.hit);
  for(const b of sorted)drawBeat(b,t);
  drawParticles();
  drawCracks();
  drawCopy();
  drawProgress();
  ctx.restore();
  if(flash>0){
    ctx.save();
    ctx.globalAlpha=flash*.18;
    ctx.fillStyle="#ff4f43";
    ctx.fillRect(0,0,w,h);
    ctx.restore();
  }
}
function frame(now){
  try{
    const n=now*.001;
    const dt=Math.min(.05,Math.max(0,n-last||0));
    last=n;
    t=n;
    update(dt);
    render();
    window.requestAnimationFrame(frame);
  }catch(e){
    state="over";
    try{
      over.hidden=false;
      restartBtn.hidden=false;
      overTitle.textContent="Signal recovered.";
      overCopy.textContent="A rendering hiccup was contained. You can take the thread again.";
    }catch(_e){}
  }
}
function onPointer(e){
  if(e&&e.cancelable)e.preventDefault();
  judgeTap();
}
function onKey(e){
  if(e.code==="Space"||e.key===" "||e.key==="Enter"){
    if(e.cancelable)e.preventDefault();
    if(state==="title")startGame();else judgeTap();
  }
  if(state==="playing"&&(e.key==="1"||e.key==="2"||e.key==="3")){
    active=Number(e.key)-1;
    ripples.push({x:centerX,y:hitY,age:0,life:.34,color:voices[active].color});
  }
}
window.addEventListener("resize",resize,{passive:true});
canvas.addEventListener("pointerdown",onPointer);
canvas.addEventListener("touchstart",(e)=>{if(e.cancelable)e.preventDefault()},{passive:false});
window.addEventListener("keydown",onKey);
startBtn.addEventListener("click",(e)=>{if(e&&e.cancelable)e.preventDefault();startGame()});
restartBtn.addEventListener("click",(e)=>{if(e&&e.cancelable)e.preventDefault();startGame()});
resize();
showTitle();
window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
