<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ship by Dawn</title>
<style>
  :root {
    --bg: #0a1128;
    --text: #ffffff;
    --accent: #FFD56F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1128;
      --text: #ffffff;
      --accent: #FFD56F;
    }
    .screen {
      background: rgba(0,0,0,0.6);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .hud { text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e0e5ec;
      --text: #1a1a24;
      --accent: #F2A65A;
    }
  }
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100dvh;
    background-color: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .screen {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    padding: 30px;
    border-radius: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  @media (prefers-color-scheme: light) {
    .screen {
      background: rgba(255,255,255,0.7);
      text-shadow: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .hud { text-shadow: 0 1px 2px rgba(255,255,255,0.8); }
  }
  h1 { margin: 0 0 10px 0; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; }
  p { margin: 0 0 25px 0; font-size: 1rem; opacity: 0.8; line-height: 1.4; max-width: 250px;}
  button {
    pointer-events: auto;
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 15px 30px;
    font-size: 1.2rem;
    font-family: inherit;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  button:active { transform: scale(0.95); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui-layer">
  <div class="hud hidden" id="hud">
    <div id="score">Features: 0</div>
    <div id="time">Dawn in: 30s</div>
  </div>

  <div class="screen" id="start-screen">
    <h1>Ship by Dawn</h1>
    <p>Hold to charge.<br>Release to fire agents at orbiting task nodes.<br><br>Ship features before sunrise.</p>
    <button data-smoke="start" id="start-btn">Start Game</button>
  </div>

  <div class="screen hidden" id="game-over-screen">
    <h1 style="color: var(--accent);">Sunrise</h1>
    <p id="final-score">Features Shipped: 0</p>
    <button data-smoke="restart" id="restart-btn">Deploy Again</button>
  </div>
</div>

<script>
// Prevent context menu
window.addEventListener('contextmenu', e => e.preventDefault());

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
if (!ctx) {
    document.getElementById('start-screen').innerHTML = '<h1>Browser not supported</h1>';
}

let W, H, S;
let skyline = [];

function generateSkyline() {
    skyline = [];
    const numBuildings = 30;
    for (let i = 0; i < numBuildings; i++) {
        skyline.push({
            h: 0.1 + Math.random() * 0.25,
            w: 1 / numBuildings
        });
    }
}

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    S = Math.min(W, H) / 400;
    generateSkyline();
}
window.addEventListener('resize', resize);
resize();

// Color scheme tracking
let isLight = false;
if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    isLight = mq.matches;
    mq.addEventListener('change', e => isLight = e.matches);
}

// Audio System
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let chargeOsc = null;
let chargeGain = null;

function initAudio() {
    if (!AudioContextClass) return;
    if (!audioCtx) {
        try { audioCtx = new AudioContextClass(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        try { audioCtx.resume(); } catch(e) {}
    }
}

function playTone(freq, type, duration) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function startChargeSound() {
    if (!audioCtx) return;
    try {
        chargeOsc = audioCtx.createOscillator();
        chargeGain = audioCtx.createGain();
        chargeOsc.type = 'triangle';
        chargeOsc.frequency.setValueAtTime(100, audioCtx.currentTime);
        chargeOsc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 1);
        chargeGain.gain.setValueAtTime(0, audioCtx.currentTime);
        chargeGain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
        chargeOsc.connect(chargeGain);
        chargeGain.connect(audioCtx.destination);
        chargeOsc.start();
    } catch(e) {}
}

function stopChargeSound() {
    if (chargeOsc && chargeGain && audioCtx) {
        try {
            chargeGain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            chargeOsc.stop(audioCtx.currentTime + 0.1);
            chargeOsc = null;
        } catch(e) {}
    }
}

function playShootSound() {
    stopChargeSound();
    playTone(600, 'square', 0.2);
}

function playExplosionSound() {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } catch(e) {}
}

function vibrate(pattern) {
    try {
        if (typeof navigator !== 'undefined' && navigator.vibrate) {
            navigator.vibrate(pattern);
        }
    } catch(e) {}
}

// Game State
let state = 'start';
let score = 0;
let totalHits = 0;
let timeRemaining = 30;
const maxTime = 30;
let lastTimeStr = -1;

let wave = 1;
let aimAngle = 0;
let sweepPhase = 0;
let isHolding = false;
let chargeDist = 0;
let launcherRecoil = 0;
let hitPause = 0;
let shake = 0;

let nodes = [];
let projectiles = [];
let particles = [];
let ripples = [];
let floatingTexts = [];

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 200 + 50;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.color = color;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt * 2;
    }
    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillRect(this.x, this.y, 4, 4);
        ctx.globalAlpha = 1.0;
    }
}

function spawnWave() {
    let numNodes = Math.min(wave, 5);
    for (let i = 0; i < numNodes; i++) {
        let cx = W/2 + (Math.random() - 0.5) * W * 0.6;
        let cy = H * 0.15 + Math.random() * (H * 0.3);
        let rx = W * 0.1 + Math.random() * (W * 0.15);
        let ry = H * 0.05 + Math.random() * (H * 0.1);
        nodes.push({
            cx, cy, rx, ry,
            x: cx, y: cy,
            time: Math.random() * 10,
            speedX: (0.8 + Math.random() * 0.8) * (1 + wave * 0.05),
            speedY: (0.8 + Math.random() * 0.8) * (1 + wave * 0.05),
            radius: (15 + Math.random() * 5) * S,
            color: '#FFD56F',
            history: []
        });
    }
}

function fireProjectile() {
    const cannonX = W / 2;
    const cannonY = H - 50;
    const angle = -Math.PI / 2 + aimAngle;
    const targetX = cannonX + Math.cos(angle) * chargeDist;
    const targetY = cannonY + Math.sin(angle) * chargeDist;

    projectiles.push({
        startX: cannonX,
        startY: cannonY,
        targetX: targetX,
        targetY: targetY,
        x: cannonX,
        y: cannonY,
        progress: 0,
        speed: 4
    });
    launcherRecoil = 20;
}

function explode(sx, sy, tx, ty) {
    const radius = 60 + (S * 10);
    ripples.push({ x: tx, y: ty, r: 0, maxR: radius, alpha: 1 });
    playExplosionSound();
    
    let hitCount = 0;
    for (let i = nodes.length - 1; i >= 0; i--) {
        let n = nodes[i];
        let dx = n.x - tx;
        let dy = n.y - ty;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < radius + n.radius) {
            nodes.splice(i, 1);
            hitCount++;
            for(let j=0; j<15; j++) particles.push(new Particle(n.x, n.y, n.color));
        }
    }

    if (hitCount > 0) {
        timeRemaining = Math.min(maxTime, timeRemaining + hitCount * 5);
        totalHits += hitCount;
        score = Math.floor(totalHits / 3);
        hitPause = 0.05;
        shake = 10;
        
        floatingTexts.push({ x: tx, y: ty - 20, text: `+${hitCount * 5}s`, life: 1.0, color: '#00F0FF' });
        if (totalHits % 3 === 0) {
            floatingTexts.push({ x: W/2, y: H/2, text: "FEATURE SHIPPED!", life: 1.5, color: '#FFD56F', large: true });
        }
        
        updateHUD();
        vibrate(50);
        if (nodes.length === 0) {
            wave++;
            timeRemaining = Math.min(maxTime, timeRemaining + 2);
            vibrate([10, 50, 10]);
        }
    } else {
        vibrate(20);
    }
}

function updateHUD() {
    document.getElementById('score').innerText = `Features: ${score}`;
    let tInt = Math.ceil(timeRemaining);
    if (tInt !== lastTimeStr) {
        document.getElementById('time').innerText = `Dawn in: ${tInt}s`;
        lastTimeStr = tInt;
        if (tInt <= 5) {
            document.getElementById('time').style.color = '#ff4444';
        } else {
            document.getElementById('time').style.color = '';
        }
    }
}

function update(dt) {
    if (hitPause > 0) {
        hitPause -= dt;
        return;
    }

    if (state === 'start' || state === 'gameover') {
        sweepPhase += dt * 0.5;
        aimAngle = Math.sin(sweepPhase) * (Math.PI / 3);
        return;
    }

    timeRemaining -= dt;
    if (timeRemaining <= 0) {
        gameOver();
        return;
    }
    updateHUD();

    const MAX_CHARGE = Math.max(W, H) * 0.8;

    if (!isHolding) {
        sweepPhase += dt * (2.5 + wave * 0.2);
        aimAngle = Math.sin(sweepPhase) * (Math.PI / 3);
    } else {
        chargeDist += dt * MAX_CHARGE * 1.5;
        if (chargeDist > MAX_CHARGE) chargeDist = MAX_CHARGE;
    }

    if (nodes.length === 0) {
        spawnWave();
    }

    nodes.forEach(n => {
        n.time += dt;
        n.x = n.cx + Math.sin(n.time * n.speedX) * n.rx;
        n.y = n.cy + Math.cos(n.time * n.speedY) * n.ry;
        
        if (!n.history) n.history = [];
        n.history.push({x: n.x, y: n.y});
        if (n.history.length > 10) n.history.shift();
    });

    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.progress += dt * p.speed;
        if (p.progress >= 1) {
            explode(p.startX, p.startY, p.targetX, p.targetY);
            projectiles.splice(i, 1);
        } else {
            p.x = p.startX + (p.targetX - p.startX) * p.progress;
            p.y = p.startY + (p.targetY - p.startY) * p.progress;
        }
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
        let r = ripples[i];
        r.r += 300 * dt;
        r.alpha -= dt * 1.5;
        if (r.alpha <= 0) ripples.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    floatingTexts.forEach(ft => {
        ft.life -= dt;
        ft.y -= dt * 30;
    });
    floatingTexts = floatingTexts.filter(ft => ft.life > 0);

    if (launcherRecoil > 0) {
        launcherRecoil -= dt * 100;
        if (launcherRecoil < 0) launcherRecoil = 0;
    }
    
    if (shake > 0) {
        shake -= dt * 60;
        if (shake < 0) shake = 0;
    }
}

function lerpColor(c1, c2, t) {
    const r1 = parseInt(c1.substring(1,3), 16);
    const g1 = parseInt(c1.substring(3,5), 16);
    const b1 = parseInt(c1.substring(5,7), 16);
    const r2 = parseInt(c2.substring(1,3), 16);
    const g2 = parseInt(c2.substring(3,5), 16);
    const b2 = parseInt(c2.substring(5,7), 16);
    
    const r = Math.round(r1 + (r2 - r1) * t);
    const g = Math.round(g1 + (g2 - g1) * t);
    const b = Math.round(b1 + (b2 - b1) * t);
    
    return `rgb(${r},${g},${b})`;
}

function draw(ctx) {
    if (!ctx) return;
    
    let didShake = false;
    if (shake > 0 && state === 'playing') {
        ctx.save();
        let dx = (Math.random() - 0.5) * shake;
        let dy = (Math.random() - 0.5) * shake;
        ctx.translate(dx, dy);
        didShake = true;
    }

    // Background sky
    let t = state === 'playing' ? Math.max(0, timeRemaining / maxTime) : (state === 'start' ? 1 : 0);
    let topColor, bottomColor;
    
    if (isLight) {
        topColor = lerpColor('#F2A65A', '#6D8B9B', t);
        bottomColor = lerpColor('#FFD56F', '#A3BCCB', t);
    } else {
        topColor = lerpColor('#B34D1B', '#020B14', t);
        bottomColor = lerpColor('#E68A2E', '#0A1C2E', t);
    }

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, topColor);
    grad.addColorStop(1, bottomColor);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Skyline
    ctx.fillStyle = isLight ? '#2a3b4c' : '#000000';
    for (let i = 0; i < skyline.length; i++) {
        let b = skyline[i];
        ctx.fillRect(i * (W * b.w), H - (H * b.h) - 60, (W * b.w) + 1, H * b.h);
    }

    // Node Trails
    nodes.forEach(n => {
        if (n.history && n.history.length > 1) {
            ctx.beginPath();
            ctx.moveTo(n.history[0].x, n.history[0].y);
            for(let i=1; i<n.history.length; i++) {
                ctx.lineTo(n.history[i].x, n.history[i].y);
            }
            ctx.strokeStyle = `rgba(255, 213, 111, 0.3)`;
            ctx.lineWidth = 4;
            ctx.stroke();
        }
    });

    // Nodes
    nodes.forEach(n => {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI*2);
        ctx.fillStyle = n.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = n.color;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius * 0.5, 0, Math.PI*2);
        ctx.fillStyle = 'white';
        ctx.fill();
    });

    // Projectiles
    projectiles.forEach(p => {
        ctx.beginPath();
        ctx.moveTo(p.startX, p.startY);
        ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
        ctx.fillStyle = '#00F0FF';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00F0FF';
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Ripples
    ripples.forEach(r => {
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(0, 240, 255, ${r.alpha})`;
        ctx.lineWidth = 4;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r * 0.8, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0, 240, 255, ${r.alpha * 0.2})`;
        ctx.fill();
    });

    // Particles
    particles.forEach(p => p.draw(ctx));

    // Floating Texts
    floatingTexts.forEach(ft => {
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = Math.max(0, Math.min(1, ft.life));
        ctx.font = ft.large ? 'bold 2rem ui-monospace, monospace' : 'bold 1.2rem ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.globalAlpha = 1.0;
    });

    // Dock & Launcher
    const cannonX = W / 2;
    const cannonY = H - 50;
    const drawCannonY = cannonY + launcherRecoil;

    ctx.fillStyle = isLight ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)';
    if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(W/2 - 120, H - 80, 240, 60, 30);
        ctx.fill();
    } else {
        let x = W/2 - 120, y = H - 80, w = 240, h = 60, r = 30;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.fill();
    }

    for(let i=-1; i<=1; i+=2) { 
        ctx.beginPath();
        ctx.arc(W/2 + i*70, H - 50, 15, 0, Math.PI*2);
        ctx.fillStyle = isLight ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.2)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(W/2 + i*70, H - 50, 4, 0, Math.PI*2);
        ctx.fillStyle = isLight ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.4)';
        ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(cannonX, drawCannonY, 15, 0, Math.PI*2);
    ctx.fillStyle = '#00F0FF';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00F0FF';
    ctx.fill();
    ctx.shadowBlur = 0;

    // Aim Line
    if (state === 'playing') {
        const MAX_CHARGE = Math.max(W, H) * 0.8;
        ctx.save();
        ctx.translate(cannonX, drawCannonY);
        ctx.rotate(aimAngle);

        ctx.beginPath();
        ctx.moveTo(0, -20);
        if (isHolding) {
            ctx.lineTo(0, -chargeDist);
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(0, -chargeDist, 10, 0, Math.PI*2);
            ctx.fillStyle = '#00F0FF';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(0, -chargeDist, 60 + (S*10), 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0, 240, 255, 0.1)';
            ctx.fill();
        } else {
            ctx.setLineDash([5, 10]);
            ctx.lineTo(0, -MAX_CHARGE);
            ctx.strokeStyle = isLight ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.beginPath();
            ctx.arc(0, -MAX_CHARGE, 5, 0, Math.PI*2);
            ctx.fillStyle = isLight ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.5)';
            ctx.fill();
        }
        ctx.restore();
    }

    // Feature Dots
    if (state === 'playing') {
        const dotsY = H - 20;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(W/2 - 20 + i * 20, dotsY, 5, 0, Math.PI*2);
            if (i < totalHits % 3) {
                ctx.fillStyle = '#00F0FF';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00F0FF';
            } else {
                ctx.fillStyle = isLight ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.2)';
                ctx.shadowBlur = 0;
            }
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }

    if (didShake) {
        ctx.restore();
    }
}

let lastTime = 0;
function loop(timestamp) {
    requestAnimationFrame(loop);
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    if (isNaN(dt) || dt < 0) dt = 0.016;
    if (dt > 0.1) dt = 0.1;
    lastTime = timestamp;

    update(dt);
    draw(ctx);
}

function startGame() {
    initAudio();
    state = 'playing';
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    score = 0;
    totalHits = 0;
    timeRemaining = 30;
    wave = 1;
    nodes = [];
    projectiles = [];
    particles = [];
    ripples = [];
    floatingTexts = [];
    aimAngle = 0;
    sweepPhase = 0;
    isHolding = false;
    chargeDist = 0;
    lastTimeStr = -1;
    
    updateHUD();
    generateSkyline();
    lastTime = performance.now();
}

function gameOver() {
    state = 'gameover';
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = `Features Shipped: ${score}`;
    vibrate(200);
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

function onInputStart(e) {
    if (e.cancelable) e.preventDefault();
    if (state !== 'playing') return;
    initAudio();
    isHolding = true;
    chargeDist = 0;
    startChargeSound();
}

function onInputEnd(e) {
    if (e.cancelable) e.preventDefault();
    if (state !== 'playing') return;
    if (isHolding) {
        fireProjectile();
        isHolding = false;
        playShootSound();
    }
}

canvas.addEventListener('touchstart', onInputStart, {passive: false});
canvas.addEventListener('touchend', onInputEnd, {passive: false});
canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    onInputStart(e);
});
canvas.addEventListener('pointerup', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    onInputEnd(e);
});

function handleKeyDown(e) {
    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        onInputStart(e);
    }
}

function handleKeyUp(e) {
    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        onInputEnd(e);
    }
}

document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

requestAnimationFrame(loop);
</script>
</body>
</html>
