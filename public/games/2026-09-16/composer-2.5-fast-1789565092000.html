<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chip Breach</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c0a;--fg:#39ff14;--fg-dim:#1a8a0a;--fg-bright:#7fff6a;
  --decoy:#ff4444;--hud:#39ff14;--panel:rgba(10,14,10,.92);
  --scan:rgba(0,0,0,.12);--glow:rgba(57,255,20,.35);--mist:rgba(180,140,60,.04);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#080c0a;--fg:#39ff14;--fg-dim:#1a8a0a;--fg-bright:#7fff6a;
    --decoy:#ff4444;--hud:#39ff14;--panel:rgba(10,14,10,.92);
    --scan:rgba(0,0,0,.12);--glow:rgba(57,255,20,.35);--mist:rgba(180,140,60,.04);
  }
  #vignette{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8ece4;--fg:#0d5c0d;--fg-dim:#4a8a4a;--fg-bright:#0a7a0a;
    --decoy:#c62828;--hud:#0d5c0d;--panel:rgba(232,236,228,.94);
    --scan:rgba(255,255,255,.08);--glow:rgba(13,92,13,.2);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
canvas#game{flex:1;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.5;color:var(--hud)}
.hud-block .val{font-size:18px;font-weight:700;letter-spacing:.05em}
#layer-bar{position:absolute;top:max(52px,env(safe-area-inset-top));left:16px;right:16px;height:3px;
  background:var(--fg-dim);opacity:.4;pointer-events:none;z-index:2}
#layer-fill{height:100%;width:0;background:var(--fg);box-shadow:0 0 8px var(--glow);transition:width .3s}
#scanlines{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,var(--scan) 2px,var(--scan) 4px);
  opacity:.45}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}
@media(prefers-color-scheme:light){#vignette{background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.08) 100%)}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:10;pointer-events:none;padding:24px;text-align:center}
.overlay-inner{pointer-events:none;max-width:340px}
.overlay h1{font-size:clamp(22px,6vw,32px);letter-spacing:.25em;margin-bottom:8px;text-shadow:0 0 20px var(--glow)}
.overlay .sub{font-size:12px;letter-spacing:.08em;opacity:.75;margin-bottom:6px;line-height:1.6}
.overlay .hint{font-size:10px;opacity:.5;margin-bottom:28px;letter-spacing:.06em}
.overlay button{pointer-events:auto;min-height:48px;min-width:180px;padding:14px 32px;
  font-family:inherit;font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  background:transparent;border:2px solid var(--fg);color:var(--fg);cursor:pointer;
  box-shadow:0 0 16px var(--glow);transition:transform .15s,background .15s}
.overlay button:active{transform:scale(.96);background:var(--fg);color:var(--bg)}
.overlay.hidden{display:none}
#toast{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.15em;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
#toast.show{opacity:.8}
.combo-flash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:28px;letter-spacing:.2em;opacity:0;pointer-events:none;z-index:4;text-shadow:0 0 24px var(--glow)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block">score<span class="val" id="score">0</span></div>
    <div class="hud-block" style="text-align:center">layer<span class="val" id="layer">1/5</span></div>
    <div class="hud-block" style="text-align:right">integrity<span class="val" id="lives">●●●</span></div>
  </div>
  <div id="layer-bar"><div id="layer-fill"></div></div>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="toast"></div>
  <div class="combo-flash" id="comboFlash"></div>
  <div class="overlay" id="titleOverlay">
    <div class="overlay-inner">
      <h1>CHIP BREACH</h1>
      <p class="sub">Crack the silicon. Peel the layers.<br>Twenty-six years of circuitry, laid bare.</p>
      <p class="hint">Tap nodes at peak pulse · avoid decoy traces</p>
      <button type="button" data-smoke="start" id="btnStart">Initialize</button>
    </div>
  </div>
  <div class="overlay hidden" id="gameOverOverlay">
    <div class="overlay-inner">
      <h1 id="goTitle">BREACH FAILED</h1>
      <p class="sub" id="goMsg">Signal lost in the fog.</p>
      <p class="hint" id="goScore">Score: 0</p>
      <button type="button" data-smoke="restart" id="btnRestart">Reboot</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('game');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var titleOverlay = document.getElementById('titleOverlay');
var gameOverOverlay = document.getElementById('gameOverOverlay');
var btnStart = document.getElementById('btnStart');
var btnRestart = document.getElementById('btnRestart');
var scoreEl = document.getElementById('score');
var layerEl = document.getElementById('layer');
var livesEl = document.getElementById('lives');
var layerFill = document.getElementById('layer-fill');
var toastEl = document.getElementById('toast');
var comboFlash = document.getElementById('comboFlash');
var goTitle = document.getElementById('goTitle');
var goMsg = document.getElementById('goMsg');
var goScore = document.getElementById('goScore');

var W = 300, H = 500;
var state = 'title';
var score = 0, combo = 0, maxCombo = 0;
var lives = 3, currentLayer = 0, layerProgress = 0;
var nodes = [], particles = [], revealedTraces = [];
var shake = 0, flash = 0, hitPause = 0;
var timeLeft = 55, roundTime = 0;
var audioCtx = null;
var lastFrame = 0;
var toastTimer = 0;
var comboFlashTimer = 0;
var activeNodeIndex = -1;
var pulseSpeed = 1.8;
var windowMin = 0.82, windowMax = 1.0;
var decoyChance = 0;
var nodesNeeded = 4;
var nodesHit = 0;
var spawnTimer = 0;
var layerRevealAnim = 0;

var TOTAL_LAYERS = 5;
var isLight = false;

function checkTheme(){
  isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
}
checkTheme();
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', checkTheme);
}

var COL = {
  fg: function(){ return isLight ? '#0d5c0d' : '#39ff14'; },
  fgDim: function(){ return isLight ? '#4a8a4a' : '#1a8a0a'; },
  fgBright: function(){ return isLight ? '#0a7a0a' : '#7fff6a'; },
  decoy: function(){ return isLight ? '#c62828' : '#ff4444'; },
  bg: function(){ return isLight ? '#e8ece4' : '#0a0e0a'; }
};

var CIRCUIT_LAYERS = [
  {paths:[[0.5,0.15,0.5,0.35],[0.35,0.35,0.65,0.35],[0.35,0.35,0.35,0.55],[0.65,0.35,0.65,0.55]]},
  {paths:[[0.5,0.35,0.25,0.5],[0.5,0.35,0.75,0.5],[0.25,0.5,0.25,0.7],[0.75,0.5,0.75,0.7]]},
  {paths:[[0.35,0.55,0.5,0.65],[0.65,0.55,0.5,0.65],[0.5,0.65,0.5,0.78],[0.3,0.7,0.7,0.7]]},
  {paths:[[0.2,0.4,0.8,0.4],[0.2,0.6,0.8,0.6],[0.4,0.3,0.4,0.85],[0.6,0.3,0.6,0.85]]},
  {paths:[[0.15,0.25,0.85,0.25],[0.15,0.75,0.85,0.75],[0.5,0.15,0.5,0.85],[0.15,0.5,0.85,0.5],
         [0.3,0.3,0.7,0.7],[0.7,0.3,0.3,0.7]]}
];

var NODE_POSITIONS = [
  [{x:0.5,y:0.35},{x:0.35,y:0.35},{x:0.65,y:0.35},{x:0.5,y:0.25}],
  [{x:0.25,y:0.5},{x:0.75,y:0.5},{x:0.5,y:0.42},{x:0.35,y:0.55},{x:0.65,y:0.55}],
  [{x:0.5,y:0.65},{x:0.35,y:0.55},{x:0.65,y:0.55},{x:0.5,y:0.78},{x:0.3,y:0.7}],
  [{x:0.2,y:0.4},{x:0.8,y:0.4},{x:0.4,y:0.3},{x:0.6,y:0.85},{x:0.5,y:0.5},{x:0.7,y:0.6}],
  [{x:0.5,y:0.5},{x:0.15,y:0.25},{x:0.85,y:0.75},{x:0.3,y:0.3},{x:0.7,y:0.7},{x:0.5,y:0.15},{x:0.5,y:0.85}]
];

function resize(){
  if(!canvas) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var rect = canvas.getBoundingClientRect();
  W = Math.max(rect.width || 300, 100);
  H = Math.max(rect.height || 400, 100);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function initAudio(){
  try{
    if(!audioCtx && typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(!audioCtx && typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}

function playTone(freq, dur, type, vol){
  if(!audioCtx) return;
  try{
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function playHit(){ playTone(880 + combo * 40, 0.08, 'square', 0.06); }
function playMiss(){ playTone(120, 0.15, 'sawtooth', 0.05); }
function playLayer(){ playTone(440, 0.05, 'square', 0.04); setTimeout(function(){ playTone(660, 0.05, 'square', 0.04); }, 60); setTimeout(function(){ playTone(880, 0.1, 'square', 0.05); }, 120); }
function playWin(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ playTone(f, 0.12, 'square', 0.05); }, i * 80); }); }

function vibrate(ms){
  if(typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(ms);
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = 1.5;
}

function showComboFlash(text){
  comboFlash.textContent = text;
  comboFlash.style.opacity = '1';
  comboFlashTimer = 0.6;
}

function updateHUD(){
  scoreEl.textContent = String(score);
  layerEl.textContent = (currentLayer + 1) + '/' + TOTAL_LAYERS;
  var dots = '';
  for(var i = 0; i < 3; i++) dots += i < lives ? '●' : '○';
  livesEl.textContent = dots;
  layerFill.style.width = ((currentLayer + layerProgress / nodesNeeded) / TOTAL_LAYERS * 100) + '%';
}

function resetGame(){
  score = 0; combo = 0; maxCombo = 0;
  lives = 3; currentLayer = 0; layerProgress = 0;
  nodes = []; particles = []; revealedTraces = [0];
  shake = 0; flash = 0; hitPause = 0;
  timeLeft = 50; roundTime = 0;
  activeNodeIndex = -1;
  spawnTimer = 0.5;
  layerRevealAnim = 0;
  configureLayer();
  updateHUD();
}

function configureLayer(){
  pulseSpeed = 1.6 + currentLayer * 0.35;
  windowMin = Math.max(0.55, 0.85 - currentLayer * 0.06);
  decoyChance = Math.min(0.45, currentLayer * 0.1);
  nodesNeeded = 3 + (currentLayer >= 3 ? 1 : 0);
  nodesHit = 0;
  layerProgress = 0;
  nodes = [];
  spawnTimer = 0.3;
}

function spawnNode(){
  var positions = NODE_POSITIONS[currentLayer] || NODE_POSITIONS[0];
  if(!positions || positions.length === 0) return;
  var idx = Math.floor(Math.random() * positions.length);
  var pos = positions[idx];
  var isDecoy = Math.random() < decoyChance && currentLayer > 0;
  var node = {
    x: pos.x, y: pos.y,
    phase: Math.random(),
    isDecoy: isDecoy,
    alive: true,
    birth: roundTime,
    id: roundTime + Math.random()
  };
  nodes.push(node);
  activeNodeIndex = nodes.length - 1;
}

function getPulse(t, phase){
  return (Math.sin((t * pulseSpeed + phase) * Math.PI * 2) + 1) / 2;
}

function inSweetSpot(pulse){
  return pulse >= windowMin && pulse <= windowMax;
}

function getCanvasPos(clientX, clientY){
  var rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top) * (H / rect.height)
  };
}

function handleTap(clientX, clientY){
  if(state !== 'playing') return;
  initAudio();
  var p = getCanvasPos(clientX, clientY);
  var hitNode = null;
  var hitDist = Infinity;

  for(var i = nodes.length - 1; i >= 0; i--){
    var n = nodes[i];
    if(!n.alive) continue;
    var nx = n.x * W, ny = n.y * H;
    var pulse = getPulse(roundTime - n.birth, n.phase);
    var r = 28 + pulse * 22;
    var dx = p.x - nx, dy = p.y - ny;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if(dist < r + 20 && dist < hitDist){
      hitDist = dist;
      hitNode = n;
    }
  }

  if(!hitNode){
    missTap(p.x, p.y, 'no target');
    return;
  }

  var pulse = getPulse(roundTime - hitNode.birth, hitNode.phase);
  if(hitNode.isDecoy){
    missTap(hitNode.x * W, hitNode.y * H, 'decoy');
    hitNode.alive = false;
    return;
  }
  if(!inSweetSpot(pulse)){
    missTap(hitNode.x * W, hitNode.y * H, pulse < windowMin ? 'too early' : 'too late');
    hitNode.alive = false;
    return;
  }

  successTap(hitNode, pulse);
}

function successTap(node, pulse){
  node.alive = false;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  var pts = 100 + Math.floor((pulse - windowMin) / (windowMax - windowMin) * 50) + combo * 25;
  score += pts;
  nodesHit++;
  layerProgress = nodesHit;

  spawnParticles(node.x * W, node.y * H, COL.fg(), 14);
  flash = 0.15;
  hitPause = 0.04;
  playHit();
  vibrate(15);

  if(combo >= 3 && combo % 3 === 0) showComboFlash('x' + combo);

  if(nodesHit >= nodesNeeded){
    completeLayer();
  } else {
    spawnTimer = 0.4 + Math.random() * 0.3;
    activeNodeIndex = -1;
  }
  updateHUD();
}

function missTap(x, y, reason){
  combo = 0;
  lives--;
  shake = 8;
  spawnParticles(x, y, COL.decoy(), 8);
  playMiss();
  vibrate(40);
  if(reason === 'decoy') showToast('DECOY TRACE');
  else if(reason === 'too early') showToast('TOO EARLY');
  else if(reason === 'too late') showToast('TOO LATE');

  activeNodeIndex = -1;
  spawnTimer = 0.5;
  nodes.forEach(function(n){ n.alive = false; });
  updateHUD();

  if(lives <= 0) endGame(false);
}

function completeLayer(){
  playLayer();
  vibrate([20, 30, 20]);
  revealedTraces.push(currentLayer + 1);
  layerRevealAnim = 1.2;
  showToast('LAYER ' + (currentLayer + 1) + ' BREACHED');

  currentLayer++;
  if(currentLayer >= TOTAL_LAYERS){
    endGame(true);
    return;
  }
  configureLayer();
  updateHUD();
}

function endGame(won){
  state = 'over';
  if(won){
    goTitle.textContent = 'SILICON LAID BARE';
    goMsg.textContent = 'All security layers cracked. The phosphor remembers.';
    playWin();
  } else {
    goTitle.textContent = 'BREACH FAILED';
    goMsg.textContent = lives <= 0 ? 'Integrity compromised.' : 'Signal lost in the fog.';
  }
  goScore.textContent = 'Score: ' + score + ' · Best combo: x' + maxCombo;
  gameOverOverlay.classList.remove('hidden');
}

function startGame(){
  initAudio();
  resetGame();
  state = 'playing';
  titleOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
}

function drawBackground(){
  var cx = W * 0.5, cy = H * 0.42;
  var grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  if(isLight){
    grd.addColorStop(0, '#eef2ea');
    grd.addColorStop(1, '#dde4d8');
  } else {
    grd.addColorStop(0, '#0c120e');
    grd.addColorStop(0.5, '#0a0e0a');
    grd.addColorStop(1, '#060806');
  }
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = isLight ? 'rgba(13,92,13,0.06)' : 'rgba(57,255,20,0.04)';
  ctx.lineWidth = 1;
  var step = 32;
  for(var gx = 0; gx < W; gx += step){
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  for(var gy = 0; gy < H; gy += step){
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }

  ctx.fillStyle = isLight ? 'rgba(180,150,80,0.05)' : 'rgba(180,140,60,0.035)';
  ctx.fillRect(0, 0, W, H);
}

function drawChip(){
  var cx = W * 0.5, cy = H * 0.48;
  var chipW = Math.min(W, H) * 0.55;
  var chipH = chipW * 0.75;

  ctx.strokeStyle = COL.fgDim();
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.3;
  ctx.strokeRect(cx - chipW/2, cy - chipH/2, chipW, chipH);

  var pinCount = 8;
  for(var i = 0; i < pinCount; i++){
    var t = i / (pinCount - 1);
    var px = cx - chipW/2 + t * chipW;
    ctx.beginPath();
    ctx.moveTo(px, cy - chipH/2 - 6);
    ctx.lineTo(px, cy - chipH/2);
    ctx.moveTo(px, cy + chipH/2);
    ctx.lineTo(px, cy + chipH/2 + 6);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawTraces(){
  for(var li = 0; li < revealedTraces.length; li++){
    var layerIdx = revealedTraces[li];
    var layer = CIRCUIT_LAYERS[layerIdx];
    if(!layer) continue;
    var reveal = li === revealedTraces.length - 1 && layerRevealAnim > 0
      ? 1 - layerRevealAnim / 1.2 : 1;
    if(reveal <= 0) continue;

    ctx.lineWidth = li === layerIdx ? 2 : 1.5;
    ctx.strokeStyle = li === revealedTraces.length - 1 ? COL.fgBright() : COL.fg();
    ctx.globalAlpha = (0.5 + li * 0.12) * reveal;
    ctx.shadowColor = COL.fg();
    ctx.shadowBlur = li === revealedTraces.length - 1 ? 12 : 4;

    layer.paths.forEach(function(path){
      ctx.beginPath();
      ctx.moveTo(path[0] * W, path[1] * H);
      var steps = 20;
      for(var s = 1; s <= steps; s++){
        var t = s / steps * reveal;
        if(t > 1) t = 1;
        var x = path[0] + (path[2] - path[0]) * t;
        var y = path[1] + (path[3] - path[1]) * t;
        ctx.lineTo(x * W, y * H);
      }
      ctx.stroke();
    });
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

function drawNodes(){
  var now = roundTime;
  nodes.forEach(function(n){
    if(!n.alive) return;
    var age = now - n.birth;
    if(age > 4) return;
    var pulse = getPulse(age, n.phase);
    var nx = n.x * W, ny = n.y * H;
    var r = 14 + pulse * 18;
    var sweet = inSweetSpot(pulse);
    var color = n.isDecoy ? COL.decoy() : (sweet ? COL.fgBright() : COL.fg());

    ctx.globalAlpha = 0.25 + pulse * 0.5;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    if(n.isDecoy){
      ctx.rect(nx - r, ny - r, r * 2, r * 2);
    } else {
      ctx.arc(nx, ny, r, 0, Math.PI * 2);
    }
    ctx.stroke();

    ctx.globalAlpha = sweet ? 0.9 : 0.4;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(nx, ny, 4 + pulse * 4, 0, Math.PI * 2);
    ctx.fill();

    if(sweet && !n.isDecoy){
      ctx.globalAlpha = 0.15 + Math.sin(now * 8) * 0.05;
      ctx.beginPath();
      ctx.arc(nx, ny, r + 8, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
}

function drawWindowIndicator(){
  if(state !== 'playing') return;
  var barW = W - 32;
  var barX = 16;
  var barY = H - Math.max(40, 24);
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = COL.fgDim();
  ctx.fillRect(barX, barY, barW, 4);
  var winStart = barX + windowMin * barW;
  var winEnd = barX + windowMax * barW;
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = COL.fg();
  ctx.fillRect(winStart, barY - 1, winEnd - winStart, 6);
  ctx.globalAlpha = 1;
}

function spawnParticles(x, y, color, count){
  for(var i = 0; i < count; i++){
    var angle = Math.random() * Math.PI * 2;
    var speed = 40 + Math.random() * 120;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.6,
      color: color,
      size: 1 + Math.random() * 2
    });
  }
}

function updateParticles(dt){
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 80 * dt;
  }
}

function drawParticles(){
  particles.forEach(function(p){
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

function drawCRT(){
  if(flash > 0){
    ctx.fillStyle = isLight ? 'rgba(13,92,13,0.15)' : 'rgba(57,255,20,0.12)';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawTimer(){
  if(state !== 'playing') return;
  var barW = W - 32;
  var pct = timeLeft / 50;
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = COL.fgDim();
  ctx.fillRect(16, H - Math.max(28, 16), barW, 2);
  ctx.fillStyle = pct < 0.2 ? COL.decoy() : COL.fg();
  ctx.globalAlpha = 0.6;
  ctx.fillRect(16, H - Math.max(28, 16), barW * pct, 2);
  ctx.globalAlpha = 1;
}

function render(){
  if(!ctx) return;
  ctx.save();
  if(shake > 0){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.85;
    if(shake < 0.5) shake = 0;
  }

  drawBackground();
  drawChip();
  drawTraces();
  drawNodes();
  drawParticles();
  drawWindowIndicator();
  drawTimer();
  drawCRT();

  ctx.restore();
}

function update(dt){
  if(state !== 'playing') return;
  if(hitPause > 0){ hitPause -= dt; return; }

  roundTime += dt;
  timeLeft -= dt;
  if(timeLeft <= 0){ endGame(false); return; }

  if(layerRevealAnim > 0) layerRevealAnim -= dt;

  spawnTimer -= dt;
  var hasActive = nodes.some(function(n){ return n.alive; });
  if(spawnTimer <= 0 && !hasActive && nodesHit < nodesNeeded){
    spawnNode();
  }

  nodes.forEach(function(n){
    if(n.alive && roundTime - n.birth > 4){
      missTap(n.x * W, n.y * H, 'too late');
    }
  });

  updateParticles(dt);

  if(flash > 0) flash -= dt;
  if(toastTimer > 0){ toastTimer -= dt; if(toastTimer <= 0) toastEl.classList.remove('show'); }
  if(comboFlashTimer > 0){ comboFlashTimer -= dt; if(comboFlashTimer <= 0) comboFlash.style.opacity = '0'; }
}

function loop(ts){
  if(!lastFrame) lastFrame = ts;
  var dt = Math.min((ts - lastFrame) / 1000, 0.05);
  lastFrame = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function onPointerDown(e){
  e.preventDefault();
  var x, y;
  if(e.touches && e.touches.length){
    x = e.touches[0].clientX;
    y = e.touches[0].clientY;
  } else {
    x = e.clientX;
    y = e.clientY;
  }
  handleTap(x, y);
}

if(canvas){
  canvas.addEventListener('touchstart', onPointerDown, {passive: false});
  canvas.addEventListener('mousedown', onPointerDown);
}

if(btnStart) btnStart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
if(btnRestart) btnRestart.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

document.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    if(state === 'title') startGame();
    else if(state === 'playing') handleTap(W/2, H/2);
  }
  if(e.code === 'KeyR' && state === 'over') startGame();
});

render();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
