<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dawn Load</title>
    <style>
        :root {
            --bg-overlay: rgba(255, 255, 255, 0.95);
            --text: #111;
            --btn-bg: #111;
            --btn-text: #fff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-overlay: rgba(20, 20, 20, 0.95);
                --text: #f1f1f1;
                --btn-bg: #f1f1f1;
                --btn-text: #111;
            }
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            background: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-canvas {
            touch-action: none;
            display: block;
            width: 100dvw;
            height: 100dvh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .panel {
            pointer-events: auto;
            background: var(--bg-overlay);
            padding: 2.5rem;
            border-radius: 1.5rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            color: var(--text);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            max-width: 80%;
        }
        h1, h2 { margin: 0; font-size: 2.2rem; }
        p { margin: 0; font-size: 1.2rem; opacity: 0.9; line-height: 1.4; }
        button {
            padding: 1.2rem 2rem;
            font-size: 1.3rem;
            font-weight: bold;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        #hud-screen {
            position: absolute;
            top: env(safe-area-inset-top, 0);
            left: 0;
            width: 100%;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 5;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    
    <div id="hud-screen" class="hidden">
        <div id="score-display">0 / 8</div>
        <div id="time-display">45s</div>
    </div>
    
    <div id="ui-layer">
        <div id="title-screen" class="panel">
            <h1>Dawn Load</h1>
            <p>Flick the tour gear into the truck.<br>Beat the sunrise.</p>
            <button data-smoke="start" id="start-btn">Start Loading</button>
        </div>
        <div id="game-over-screen" class="panel hidden">
            <h2 id="end-title">Sunrise</h2>
            <p id="end-desc">You loaded 5 crates.</p>
            <button data-smoke="restart" id="restart-btn">Try Again</button>
        </div>
    </div>

    <script src="https://unpkg.com/matter-js@0.19.0/build/matter.min.js"></script>
    <script>
        let Engine, Runner, Bodies, Composite, Body, Vector;
        
        let canvas, ctx, width, height;
        let engine, world;
        
        let truck = [];
        let leftWall, rightWall, bottomWall;
        let initialTruckWidth;
        
        let crates = [];
        let currentCrate = null;
        
        let state = 'START'; // START, PLAYING, GAMEOVER
        let totalTime = 45;
        let timeLeft = 45;
        let targetScore = 8;
        let packedCount = 0;
        
        let isDragging = false;
        let dragStart = null;
        let dragCurrent = null;
        const maxDrag = 150;
        
        let lastTime = 0;

        const crateTypes = [
            { type: 'rect', w: 45, h: 45, density: 0.002, color: '#ff6b6b' }, // red
            { type: 'rect', w: 70, h: 35, density: 0.0015, color: '#48dbfb' }, // cyan
            { type: 'circle', r: 28, density: 0.002, color: '#1dd1a1' }, // green
            { type: 'poly', sides: 3, r: 40, density: 0.0025, color: '#feca57' }, // yellow
            { type: 'rect', w: 35, h: 70, density: 0.0015, color: '#ff9f43' } // orange
        ];

        window.onload = () => {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                width = canvas.width;
                height = canvas.height;
            }
            window.addEventListener('resize', resize);
            resize();

            if (typeof Matter !== 'undefined') {
                Engine = Matter.Engine;
                Runner = Matter.Runner;
                Bodies = Matter.Bodies;
                Composite = Matter.Composite;
                Body = Matter.Body;
                Vector = Matter.Vector;
            }

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', startGame);

            setupInput();

            requestAnimationFrame((ts) => {
                lastTime = ts;
                gameLoop(ts);
            });
        };

        function lerpColor(hex1, hex2, t) {
            let c1 = { r: parseInt(hex1.substring(1,3), 16), g: parseInt(hex1.substring(3,5), 16), b: parseInt(hex1.substring(5,7), 16) };
            let c2 = { r: parseInt(hex2.substring(1,3), 16), g: parseInt(hex2.substring(3,5), 16), b: parseInt(hex2.substring(5,7), 16) };
            let r = Math.round(c1.r + (c2.r - c1.r) * t);
            let g = Math.round(c1.g + (c2.g - c1.g) * t);
            let b = Math.round(c1.b + (c2.b - c1.b) * t);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function getGradientColors(progress) {
            if (progress < 0.5) {
                let p = progress * 2;
                return [lerpColor('#2d3436', '#2c3e50', p), lerpColor('#4b6584', '#d35400', p)];
            } else {
                let p = (progress - 0.5) * 2;
                return [lerpColor('#2c3e50', '#e67e22', p), lerpColor('#d35400', '#f1c40f', p)];
            }
        }

        function startGame() {
            if (typeof Matter === 'undefined') {
                document.getElementById('title-screen').classList.add('hidden');
                document.getElementById('end-title').innerText = "Engine Error";
                document.getElementById('end-desc').innerText = "Physics engine failed to load. Check connection.";
                document.getElementById('game-over-screen').classList.remove('hidden');
                return;
            }

            timeLeft = totalTime;
            packedCount = 0;
            state = 'PLAYING';
            isDragging = false;
            currentCrate = null;
            crates = [];

            document.getElementById('title-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud-screen').classList.remove('hidden');
            document.getElementById('score-display').innerText = `0 / ${targetScore}`;
            document.getElementById('time-display').innerText = `${totalTime}s`;

            if (engine) {
                Engine.clear(engine);
            }
            engine = Engine.create();
            world = engine.world;

            createTruck();
            spawnCrate();
        }

        function createTruck() {
            let bedY = height * 0.65;
            let bedWidth = Math.min(width * 0.7, 350);
            initialTruckWidth = bedWidth;

            bottomWall = Bodies.rectangle(width / 2, bedY + 20, bedWidth + 40, 40, { isStatic: true, render: { fillStyle: '#2d3436' } });
            leftWall = Bodies.rectangle(width / 2 - bedWidth / 2 - 10, bedY - 60, 40, 200, { isStatic: true, render: { fillStyle: '#2d3436' } });
            rightWall = Bodies.rectangle(width / 2 + bedWidth / 2 + 10, bedY - 60, 40, 200, { isStatic: true, render: { fillStyle: '#2d3436' } });

            truck = [bottomWall, leftWall, rightWall];
            Composite.add(world, truck);
        }

        function spawnCrate() {
            if (state !== 'PLAYING') return;
            let def = crateTypes[Math.floor(Math.random() * crateTypes.length)];
            let spawnX = width / 2;
            let spawnY = height * 0.85;

            let body;
            if (def.type === 'rect') {
                body = Bodies.rectangle(spawnX, spawnY, def.w, def.h, { render: { fillStyle: def.color }, density: def.density });
            } else if (def.type === 'circle') {
                body = Bodies.circle(spawnX, spawnY, def.r, { render: { fillStyle: def.color }, density: def.density });
            } else if (def.type === 'poly') {
                body = Bodies.polygon(spawnX, spawnY, def.sides, def.r, { render: { fillStyle: def.color }, density: def.density });
            }

            body.restitution = 0.3;
            body.friction = 0.8;
            Body.setStatic(body, true);

            Composite.add(world, body);
            currentCrate = body;
            crates.push(body);
        }

        function updateTruckShrink(progress) {
            let currentWidth = initialTruckWidth * (1 - 0.4 * progress); 
            let targetLeftX = width / 2 - currentWidth / 2 - 10;
            let targetRightX = width / 2 + currentWidth / 2 + 10;

            Body.setPosition(leftWall, { x: targetLeftX, y: leftWall.position.y });
            Body.setPosition(rightWall, { x: targetRightX, y: rightWall.position.y });
        }

        function updateLogic() {
            for (let i = crates.length - 1; i >= 0; i--) {
                let c = crates[i];
                if (c.position.y > height + 200 || c.position.x < -200 || c.position.x > width + 200) {
                    Composite.remove(world, c);
                    crates.splice(i, 1);
                }
            }

            packedCount = 0;
            crates.forEach(c => {
                c.isPacked = false;
                if (c === currentCrate) return;
                
                if (c.position.y < bottomWall.position.y && c.position.y > 0) {
                    if (c.position.x > leftWall.position.x && c.position.x < rightWall.position.x) {
                        if (c.speed < 5) { 
                            c.isPacked = true;
                            packedCount++;
                        }
                    }
                }
            });

            document.getElementById('score-display').innerText = `${packedCount} / ${targetScore}`;

            if (packedCount >= targetScore) {
                endGame(true);
            }
        }

        function endGame(win) {
            state = 'GAMEOVER';
            if (win) {
                document.getElementById('end-title').innerText = "Sunrise!";
                document.getElementById('end-desc').innerText = "Truck loaded. You beat the dawn.";
                if (navigator.vibrate) navigator.vibrate([50, 50, 100]);
            } else {
                document.getElementById('end-title').innerText = "Too Slow";
                document.getElementById('end-desc').innerText = `Packed: ${packedCount}/${targetScore}. The sun rose.`;
                if (navigator.vibrate) navigator.vibrate(200);
            }
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('hud-screen').classList.add('hidden');
        }

        function setupInput() {
            function onDown(x, y, e) {
                if (state !== 'PLAYING' || !currentCrate) return;
                let dist = Math.hypot(x - currentCrate.position.x, y - currentCrate.position.y);
                if (dist < 80) {
                    isDragging = true;
                    dragStart = { x: currentCrate.position.x, y: currentCrate.position.y };
                    dragCurrent = { x, y };
                    if (e && e.cancelable) e.preventDefault();
                }
            }
            function onMove(x, y, e) {
                if (!isDragging) return;
                dragCurrent = { x, y };
                if (e && e.cancelable) e.preventDefault();
            }
            function onUp(e) {
                if (!isDragging) return;
                isDragging = false;
                if (e && e.cancelable) e.preventDefault();

                let dx = dragStart.x - dragCurrent.x;
                let dy = dragStart.y - dragCurrent.y;
                let dist = Math.hypot(dx, dy);

                if (dist > maxDrag) {
                    dx = (dx / dist) * maxDrag;
                    dy = (dy / dist) * maxDrag;
                }

                if (dist > 15) {
                    Body.setStatic(currentCrate, false);
                    
                    let massFactor = 50 / currentCrate.mass;
                    let velMult = Math.max(0.08, Math.min(0.25, 0.15 * massFactor));
                    
                    Body.setVelocity(currentCrate, { x: dx * velMult, y: dy * velMult });
                    Body.setAngularVelocity(currentCrate, (Math.random() - 0.5) * 0.3);
                    
                    if (navigator.vibrate) navigator.vibrate(15);
                    currentCrate = null;
                    setTimeout(spawnCrate, 600);
                }
            }

            canvas.addEventListener('touchstart', e => onDown(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
            canvas.addEventListener('touchmove', e => onMove(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
            canvas.addEventListener('touchend', e => onUp(e), { passive: false });

            canvas.addEventListener('mousedown', e => onDown(e.clientX, e.clientY, e));
            canvas.addEventListener('mousemove', e => onMove(e.clientX, e.clientY, e));
            canvas.addEventListener('mouseup', e => onUp(e));
            canvas.addEventListener('mouseleave', e => onUp(e));
        }

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            
            let dt = timestamp - lastTime;
            lastTime = timestamp;
            if (dt > 100) dt = 16; 

            if (state === 'PLAYING') {
                timeLeft -= dt / 1000;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endGame(false);
                } else {
                    let progress = 1 - (timeLeft / totalTime);
                    updateTruckShrink(progress);
                    updateLogic();
                    document.getElementById('time-display').innerText = Math.ceil(timeLeft) + "s";
                }
            }

            if (typeof Matter !== 'undefined' && engine && (state === 'PLAYING' || state === 'GAMEOVER')) {
                Engine.update(engine, dt);
            }

            render();
        }

        function render() {
            ctx.clearRect(0, 0, width, height);

            let progress = state === 'PLAYING' ? 1 - (timeLeft / totalTime) : (state === 'GAMEOVER' ? 1 : 0);
            let colors = getGradientColors(progress);
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, colors[0]);
            grad.addColorStop(1, colors[1]);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            let sunY = height - (height * 0.5 * progress);
            ctx.beginPath();
            ctx.arc(width * 0.5, sunY, 80, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 240, 180, 0.9)';
            ctx.shadowColor = 'rgba(255, 230, 150, 0.6)';
            ctx.shadowBlur = 40;
            ctx.fill();
            ctx.shadowColor = 'transparent';

            ctx.fillStyle = '#1e272e';
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.65);
            ctx.lineTo(width * 0.25, height * 0.5);
            ctx.lineTo(width * 0.55, height * 0.6);
            ctx.lineTo(width * 0.8, height * 0.45);
            ctx.lineTo(width, height * 0.55);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();

            if (typeof Matter === 'undefined' || !world) return;

            ctx.fillStyle = '#2d3436';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 5;

            ctx.beginPath();
            ctx.moveTo(leftWall.position.x - 20, leftWall.position.y - 100);
            ctx.lineTo(leftWall.position.x + 20, leftWall.position.y - 100);
            ctx.lineTo(leftWall.position.x + 20, bottomWall.position.y - 20);
            ctx.lineTo(rightWall.position.x - 20, bottomWall.position.y - 20);
            ctx.lineTo(rightWall.position.x - 20, rightWall.position.y - 100);
            ctx.lineTo(rightWall.position.x + 20, rightWall.position.y - 100);
            ctx.lineTo(rightWall.position.x + 20, bottomWall.position.y + 20);
            ctx.lineTo(leftWall.position.x - 20, bottomWall.position.y + 20);
            ctx.closePath();
            ctx.fill();
            ctx.shadowColor = 'transparent';

            crates.forEach(c => {
                ctx.beginPath();
                c.vertices.forEach((v, i) => {
                    if (i === 0) ctx.moveTo(v.x, v.y);
                    else ctx.lineTo(v.x, v.y);
                });
                ctx.closePath();
                ctx.fillStyle = c.render.fillStyle;
                
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 4;
                ctx.fill();
                
                ctx.shadowColor = 'transparent';
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.stroke();

                if (c.isPacked) {
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                    ctx.stroke();
                }
            });

            if (isDragging && currentCrate) {
                let dx = dragStart.x - dragCurrent.x;
                let dy = dragStart.y - dragCurrent.y;
                let dist = Math.hypot(dx, dy);

                if (dist > maxDrag) {
                    dx = (dx / dist) * maxDrag;
                    dy = (dy / dist) * maxDrag;
                }

                ctx.beginPath();
                ctx.moveTo(currentCrate.position.x, currentCrate.position.y);
                let endX = currentCrate.position.x + dx * 2;
                let endY = currentCrate.position.y + dy * 2;
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.setLineDash([10, 10]);
                ctx.stroke();
                ctx.setLineDash([]);
                
                let angle = Math.atan2(dy, dx);
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - 15 * Math.cos(angle - Math.PI / 6), endY - 15 * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(endX - 15 * Math.cos(angle + Math.PI / 6), endY - 15 * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fill();
            }

            if (state === 'PLAYING' && (!currentCrate || isDragging)) {
                ctx.beginPath();
                ctx.arc(width / 2, height * 0.85, 50, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 8]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }
    </script>
</body>
</html>
