<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cold Storage Pulse</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e0a;--glass:rgba(12,18,12,.72);--phosphor:#3dff7a;--phosphor-dim:#1a8f42;
  --phosphor-glow:rgba(61,255,122,.35);--text:#b8ffc8;--muted:#5a9a6a;
  --danger:#ff4466;--ui-bg:rgba(8,12,8,.88);--scan:rgba(0,0,0,.12);
  --rain:rgba(180,210,190,.08);--btn-bg:#0f1a0f;--btn-border:#3dff7a;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8ede8;--glass:rgba(220,228,220,.75);--phosphor:#1a7a3a;--phosphor-dim:#0d4a22;
    --phosphor-glow:rgba(26,122,58,.25);--text:#0a2a14;--muted:#4a7a5a;
    --danger:#c02040;--ui-bg:rgba(240,245,240,.92);--scan:rgba(255,255,255,.15);
    --rain:rgba(80,100,90,.06);--btn-bg:#f0f5f0;--btn-border:#1a7a3a;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;color:var(--text);touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2;font-size:clamp(11px,2.8vw,13px);letter-spacing:.06em}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:9px;color:var(--muted);text-transform:uppercase}
.hud-value{font-size:clamp(14px,3.5vw,18px);color:var(--phosphor);text-shadow:0 0 8px var(--phosphor-glow)}
#combo{position:absolute;top:max(60px,12dvh);left:50%;transform:translateX(-50%);font-size:clamp(20px,5vw,28px);color:var(--phosphor);opacity:0;transition:opacity .15s;pointer-events:none;z-index:2;text-shadow:0 0 12px var(--phosphor-glow)}
#combo.show{opacity:1}
#layerBanner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;z-index:3;text-align:center;transition:opacity .3s,transform .3s}
#layerBanner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#layerBanner h2{font-size:clamp(18px,5vw,24px);color:var(--phosphor);text-shadow:0 0 20px var(--phosphor-glow);margin-bottom:4px}
#layerBanner p{font-size:clamp(10px,2.5vw,12px);color:var(--muted)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:none;padding:24px}
.screen.hidden{display:none}
.screen-inner{background:var(--ui-bg);border:1px solid var(--phosphor-dim);padding:clamp(24px,6vw,40px) clamp(20px,5vw,32px);max-width:340px;width:90%;text-align:center;backdrop-filter:blur(8px);box-shadow:0 0 40px var(--phosphor-glow),inset 0 0 30px rgba(0,0,0,.2)}
.screen h1{font-size:clamp(16px,4.5vw,22px);color:var(--phosphor);letter-spacing:.12em;margin-bottom:8px;text-shadow:0 0 12px var(--phosphor-glow)}
.screen .subtitle{font-size:clamp(10px,2.6vw,12px);color:var(--muted);line-height:1.5;margin-bottom:20px}
.screen .hint{font-size:clamp(9px,2.2vw,11px);color:var(--muted);margin-top:16px;line-height:1.6}
.btn{display:inline-block;min-height:48px;min-width:180px;padding:14px 28px;font-family:inherit;font-size:clamp(12px,3vw,14px);letter-spacing:.1em;text-transform:uppercase;color:var(--phosphor);background:var(--btn-bg);border:1px solid var(--btn-border);cursor:pointer;pointer-events:auto;transition:background .15s,box-shadow .15s,transform .1s;box-shadow:0 0 16px var(--phosphor-glow)}
.btn:active{transform:scale(.97)}
.btn:hover,.btn:focus-visible{background:rgba(61,255,122,.08);box-shadow:0 0 24px var(--phosphor-glow);outline:none}
#gameOverScreen .score-display{font-size:clamp(28px,8vw,40px);color:var(--phosphor);margin:12px 0;text-shadow:0 0 16px var(--phosphor-glow)}
#gameOverScreen .stats{font-size:clamp(10px,2.5vw,12px);color:var(--muted);margin-bottom:20px;line-height:1.8}
#feedback{position:absolute;bottom:max(80px,15dvh);left:50%;transform:translateX(-50%);font-size:clamp(11px,2.8vw,13px);color:var(--muted);pointer-events:none;z-index:2;opacity:.7}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Score</span><span class="hud-value" id="scoreVal">0</span></div>
    <div class="hud-block" style="align-items:center"><span class="hud-label">Layer</span><span class="hud-value" id="layerVal">1</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Integrity</span><span class="hud-value" id="lifeVal">●●●</span></div>
  </div>
  <div id="combo"></div>
  <div id="layerBanner"><h2 id="layerTitle">LAYER 1</h2><p id="layerDesc">Surface seal</p></div>
  <div id="feedback">Tap when the ring aligns with the target</div>
  <div id="titleScreen" class="screen">
    <div class="screen-inner">
      <h1>COLD STORAGE PULSE</h1>
      <p class="subtitle">Dormant treasury traces sleep beneath layered silicon.<br>Wake each pulse before the vault re-seals.</p>
      <button class="btn" data-smoke="start" id="startBtn">Unseal Vault</button>
      <p class="hint">Tap pulse windows · Avoid decoy nodes · Space to tap</p>
    </div>
  </div>
  <div id="gameOverScreen" class="screen hidden">
    <div class="screen-inner">
      <h1>VAULT RE-SEALED</h1>
      <div class="score-display" id="finalScore">0</div>
      <div class="stats" id="finalStats"></div>
      <button class="btn" data-smoke="restart" id="restartBtn">Re-seal &amp; Retry</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('gameCanvas');
var ctx=canvas&&canvas.getContext?canvas.getContext('2d'):null;
var W=300,H=500, dpr=1;
var state='title';
var score=0,combo=0,maxCombo=0,lives=3,layer=1,layerHits=0,layerTarget=5;
var nodes=[],particles=[],rainDrops=[],traces=[];
var spawnTimer=0,gameTime=0,roundDuration=50;
var bpm=72,beatInterval=60/bpm;
var hitPause=0,flashAlpha=0,layerReveal=0,revealTimer=0,shake=0;
var audioCtx=null,audioReady=false;
var isDark=true;
var layerNames=['Surface seal','Silicon substrate','Trace routing','Hash lattice','Deep cold storage','Core treasury'];
var layerDescs=['Outer encryption shell','Wafer-level circuitry','Copper interconnects','Merkle tree fragments','Dormant since 2023','The untouched reserve'];

function mqDark(){try{return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return true}}
function getColors(){
  isDark=mqDark();
  if(isDark)return{bg:'#0a0e0a',phosphor:'#3dff7a',phosphorDim:'#1a8f42',glow:'rgba(61,255,122,0.35)',danger:'#ff4466',muted:'#5a9a6a',grid:'rgba(61,255,122,0.06)',rain:'rgba(180,210,190,0.12)',scan:'rgba(0,0,0,0.12)',trace:'rgba(61,255,122,0.6)'};
  return{bg:'#e8ede8',phosphor:'#1a7a3a',phosphorDim:'#0d4a22',glow:'rgba(26,122,58,0.25)',danger:'#c02040',muted:'#4a7a5a',grid:'rgba(26,122,58,0.08)',rain:'rgba(80,100,90,0.1)',scan:'rgba(255,255,255,0.15)',trace:'rgba(26,122,58,0.5)'};
}
var C=getColors();

function resize(){
  if(!canvas)return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||300;H=window.innerHeight||500;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  if(ctx)ctx.setTransform(dpr,0,0,dpr,0,0);
  initRain();
  initTraces();
}
function initRain(){
  rainDrops=[];
  for(var i=0;i<40;i++)rainDrops.push({x:Math.random()*W,y:Math.random()*H,len:8+Math.random()*20,spd:.4+Math.random()*1.2,op:.15+Math.random()*.25});
}
function initTraces(){
  traces=[];
  for(var l=0;l<6;l++){
    var t=[];
    for(var i=0;i<12+layer*3;i++){
      t.push({x:Math.random()*W,y:Math.random()*H,w:20+Math.random()*80,h:1+Math.random()*2,angle:Math.random()*Math.PI,a:0});
    }
    traces.push(t);
  }
}

function initAudio(){
  if(audioReady)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    audioCtx=new AC();
    audioReady=true;
  }catch(e){}
}
function playTone(freq,dur,type,vol){
  if(!audioCtx||!audioReady)return;
  try{
    if(audioCtx.state==='suspended')audioCtx.resume();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'square';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.08,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.1));
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+(dur||0.1));
  }catch(e){}
}
function playHit(quality){
  if(quality==='perfect'){playTone(880,0.08,'square',0.06);playTone(1320,0.06,'sine',0.04);}
  else if(quality==='good')playTone(660,0.08,'square',0.05);
  else playTone(220,0.15,'sawtooth',0.06);
}
function playCrack(){playTone(120,0.2,'sawtooth',0.07);playTone(440,0.15,'square',0.05);}
function playDecoy(){playTone(150,0.2,'sawtooth',0.08);}
function playOver(){playTone(110,0.3,'sawtooth',0.07);setTimeout(function(){playTone(80,0.4,'sawtooth',0.06);},200);}

function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

function spawnNode(){
  var margin=50;
  var x=margin+Math.random()*(W-2*margin);
  var y=margin+Math.random()*(H-2*margin);
  var decoyChance=Math.min(0.15+layer*0.08,0.55);
  var isDecoy=Math.random()<decoyChance;
  var pulseSpeed=1.2+layer*0.15+gameTime*0.003;
  var sweetStart=0.62-Math.min(layer*0.04,0.18);
  var sweetEnd=sweetStart+Math.max(0.12-layer*0.015,0.05);
  var maxR=28-Math.min(layer*2.5,14);
  nodes.push({
    x:x,y:y,phase:0,pulseSpeed:pulseSpeed,
    sweetStart:sweetStart,sweetEnd:sweetEnd,
    maxR:maxR,minR:8,
    isDecoy:isDecoy,active:true,spawnTime:gameTime,
    ttl:3.5-Math.min(layer*0.2,1.2)
  });
}

function getActiveNodeAt(px,py){
  var best=null,bestD=999;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(!n.active)continue;
    var r=n.maxR+10;
    var dx=px-n.x,dy=py-n.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<r&&d<bestD){bestD=d;best=n;}
  }
  return best;
}

function judgeNode(n){
  if(!n||!n.active)return;
  if(n.isDecoy){
    n.active=false;combo=0;lives--;
    playDecoy();vibrate(30);
    spawnParticles(n.x,n.y,C.danger,8);
    flashAlpha=0.3;
    updateHUD();
    if(lives<=0)endGame();
    return;
  }
  var q='miss';
  if(n.phase>=n.sweetStart&&n.phase<=n.sweetEnd)q='perfect';
  else if(n.phase>=n.sweetStart-0.12&&n.phase<=n.sweetEnd+0.12)q='good';
  n.active=false;
  if(q==='miss'){
    combo=0;lives--;
    playHit('miss');vibrate(20);
    spawnParticles(n.x,n.y,C.danger,6);
    flashAlpha=0.2;
    if(lives<=0)endGame();
  }else{
    combo++;
    if(combo>maxCombo)maxCombo=combo;
    var pts=q==='perfect'?150+combo*10:80+combo*5;
    score+=pts;
    layerHits++;
    playHit(q);vibrate(q==='perfect'?15:8);
    hitPause=q==='perfect'?3:1;
    shake=q==='perfect'?6:3;
    spawnParticles(n.x,n.y,C.phosphor,q==='perfect'?14:8);
    showCombo(q,combo);
    if(layerHits>=layerTarget)crackLayer();
  }
  updateHUD();
}

function showCombo(q,c){
  var el=document.getElementById('combo');
  if(!el)return;
  el.textContent=(q==='perfect'?'PERFECT':'GOOD')+' ×'+c;
  el.classList.add('show');
  clearTimeout(showCombo._t);
  showCombo._t=setTimeout(function(){el.classList.remove('show');},600);
}

function crackLayer(){
  layerHits=0;
  playCrack();vibrate(40);
  layerReveal=1;revealTimer=1.8;
  hitPause=8;
  flashAlpha=0.5;
  var banner=document.getElementById('layerBanner');
  var lt=document.getElementById('layerTitle');
  var ld=document.getElementById('layerDesc');
  if(lt)lt.textContent='LAYER '+layer+' CRACKED';
  if(ld)ld.textContent='Phosphor trace revealed';
  if(banner){banner.classList.add('show');setTimeout(function(){banner.classList.remove('show');},1400);}
  layer++;
  if(layer>6)layer=6;
  layerTarget=4+layer;
  bpm=72+layer*8;
  beatInterval=60/bpm;
  var lv=document.getElementById('layerVal');
  if(lv)lv.textContent=layer;
  var fb=document.getElementById('feedback');
  if(fb)fb.textContent=layerNames[layer-1]||'Deep vault';
}

function spawnParticles(x,y,color,count){
  for(var i=0;i<count;i++){
    var a=Math.random()*Math.PI*2,spd=1+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,color:color,size:2+Math.random()*3});
  }
}

function updateHUD(){
  var sv=document.getElementById('scoreVal');if(sv)sv.textContent=score;
  var lv=document.getElementById('lifeVal');
  if(lv){var s='';for(var i=0;i<3;i++)s+=i<lives?'●':'○';lv.textContent=s;}
}

function startGame(){
  initAudio();
  state='playing';
  score=0;combo=0;maxCombo=0;lives=3;layer=1;layerHits=0;layerTarget=5;
  nodes=[];particles=[];gameTime=0;spawnTimer=0;
  bpm=72;beatInterval=60/bpm;
  hitPause=0;flashAlpha=0;layerReveal=0;revealTimer=0;
  C=getColors();initTraces();
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('feedback').style.opacity='0.7';
  updateHUD();
  var lv=document.getElementById('layerVal');if(lv)lv.textContent='1';
}

function endGame(){
  state='gameover';
  playOver();
  document.getElementById('finalScore').textContent=score;
  document.getElementById('finalStats').innerHTML='Layer reached: '+layer+'<br>Max combo: '+maxCombo+'<br>Time: '+Math.floor(gameTime)+'s';
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function handleTap(clientX,clientY){
  if(state!=='playing')return;
  var rect=canvas.getBoundingClientRect();
  var px=clientX-rect.left,py=clientY-rect.top;
  var n=getActiveNodeAt(px,py);
  if(n)judgeNode(n);
}

function handleKey(e){
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(state==='playing'){
      var best=null,bestScore=-1;
      for(var i=0;i<nodes.length;i++){
        var n=nodes[i];
        if(!n.active||n.isDecoy)continue;
        var mid=(n.sweetStart+n.sweetEnd)/2;
        var dist=Math.abs(n.phase-mid);
        if(dist<bestScore||bestScore<0){bestScore=dist;best=n;}
      }
      if(best)judgeNode(best);
    }
  }
}

function drawBackground(){
  if(!ctx)return;
  var sx=0,sy=0;
  if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake*=0.85;}
  ctx.save();ctx.translate(sx,sy);
  ctx.fillStyle=C.bg;
  ctx.fillRect(-10,-10,W+20,H+20);
  ctx.strokeStyle=C.grid;
  ctx.lineWidth=1;
  var gs=40;
  for(var x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  if(layerReveal>0){
    var ti=layer-1;if(ti<0)ti=0;if(ti>=traces.length)ti=traces.length-1;
    var tlist=traces[ti]||[];
    ctx.save();
    ctx.globalAlpha=layerReveal*0.7;
    for(var i=0;i<tlist.length;i++){
      var t=tlist[i];
      ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.angle);
      ctx.fillStyle=C.trace;
      ctx.fillRect(-t.w/2,-t.h/2,t.w,t.h);
      ctx.restore();
    }
    ctx.font='10px monospace';
    ctx.fillStyle=C.phosphor;
    ctx.globalAlpha=layerReveal*0.5;
    var chars='01abcdef';
    for(var j=0;j<20;j++){
      var hx=Math.random()*W,hy=Math.random()*H;
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)]+chars[Math.floor(Math.random()*chars.length)],hx,hy);
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawRain(){
  if(!ctx)return;
  ctx.strokeStyle=C.rain;
  ctx.lineWidth=1;
  for(var i=0;i<rainDrops.length;i++){
    var r=rainDrops[i];
    ctx.globalAlpha=r.op;
    ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-2,r.y+r.len);ctx.stroke();
    r.y+=r.spd;
    if(r.y>H+20){r.y=-20;r.x=Math.random()*W;}
  }
  ctx.globalAlpha=1;
}

function drawScanlines(){
  if(!ctx)return;
  ctx.fillStyle=C.scan;
  for(var y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
}

function drawNodes(){
  if(!ctx)return;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(!n.active)continue;
    var pulse=n.phase;
    var ringR=n.minR+(n.maxR-n.minR)*pulse;
    var sweetR=n.minR+(n.maxR-n.minR)*((n.sweetStart+n.sweetEnd)/2);
    ctx.save();
    if(n.isDecoy){
      ctx.strokeStyle=C.muted;
      ctx.shadowColor='transparent';
      ctx.setLineDash([4,6]);
    }else{
      ctx.setLineDash([]);
      ctx.strokeStyle=C.phosphor;
      ctx.shadowColor=C.glow;ctx.shadowBlur=12;
    }
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(n.x,n.y,ringR,0,Math.PI*2);ctx.stroke();
    if(!n.isDecoy){
      ctx.globalAlpha=0.35;
      ctx.beginPath();ctx.arc(n.x,n.y,sweetR,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=0.6;
      ctx.fillStyle=C.phosphorDim;
      ctx.beginPath();ctx.arc(n.x,n.y,4,0,Math.PI*2);ctx.fill();
      var inSweet=pulse>=n.sweetStart&&pulse<=n.sweetEnd;
      if(inSweet){
        ctx.globalAlpha=0.25+Math.sin(gameTime*12)*0.1;
        ctx.beginPath();ctx.arc(n.x,n.y,ringR+6,0,Math.PI*2);ctx.stroke();
      }
    }else{
      ctx.globalAlpha=0.5;
      ctx.fillStyle=C.muted;
      ctx.beginPath();ctx.arc(n.x,n.y,3,0,Math.PI*2);ctx.fill();
      ctx.setLineDash([]);
      ctx.font='8px monospace';ctx.fillStyle=C.danger;
      ctx.fillText('DECOY',n.x-16,n.y-12);
    }
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawParticles(){
  if(!ctx)return;
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=0.03;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
}

function drawTimer(){
  if(!ctx||state!=='playing')return;
  var remaining=Math.max(0,roundDuration-gameTime);
  var barW=W-40,bx=20,by=H-30;
  ctx.fillStyle=C.muted;ctx.globalAlpha=0.3;
  ctx.fillRect(bx,by,barW,4);
  ctx.fillStyle=C.phosphor;ctx.globalAlpha=0.8;
  ctx.fillRect(bx,by,barW*(remaining/roundDuration),4);
  ctx.globalAlpha=1;
  ctx.font='10px monospace';ctx.fillStyle=C.muted;
  ctx.fillText(Math.ceil(remaining)+'s',bx+barW/2-8,by-4);
}

function drawFlash(){
  if(!ctx||flashAlpha<=0)return;
  ctx.fillStyle=C.phosphor;
  ctx.globalAlpha=flashAlpha*0.15;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;
  flashAlpha*=0.85;
}

function update(dt){
  if(state!=='playing')return;
  if(hitPause>0){hitPause-=dt*60;return;}
  gameTime+=dt;
  if(gameTime>=roundDuration){endGame();return;}
  spawnTimer+=dt;
  var interval=Math.max(0.6,beatInterval*(1-Math.min(gameTime*0.008,0.3)));
  if(spawnTimer>=interval){
    spawnTimer=0;
    if(nodes.filter(function(n){return n.active;}).length<3+layer)spawnNode();
  }
  for(var i=nodes.length-1;i>=0;i--){
    var n=nodes[i];
    if(!n.active){nodes.splice(i,1);continue;}
    n.phase+=n.pulseSpeed*dt;
    if(gameTime-n.spawnTime>n.ttl){
      if(!n.isDecoy){combo=0;lives--;playHit('miss');if(lives<=0)endGame();updateHUD();}
      n.active=false;
    }
  }
  if(revealTimer>0){
    revealTimer-=dt;
    layerReveal=Math.min(1,revealTimer/0.8);
    if(revealTimer<=0)layerReveal=0;
  }
}

function render(){
  C=getColors();
  drawBackground();
  drawNodes();
  drawParticles();
  drawRain();
  drawScanlines();
  drawTimer();
  drawFlash();
}

var lastTime=0;
function loop(ts){
  var dt=Math.min((ts-lastTime)/1000,0.05);
  if(!lastTime)dt=0.016;
  lastTime=ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function bindEvents(){
  var startBtn=document.getElementById('startBtn');
  var restartBtn=document.getElementById('restartBtn');
  if(startBtn)startBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
  if(restartBtn)restartBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
  if(canvas){
    canvas.addEventListener('touchstart',function(e){
      e.preventDefault();
      if(e.touches&&e.touches[0])handleTap(e.touches[0].clientX,e.touches[0].clientY);
    },{passive:false});
    canvas.addEventListener('mousedown',function(e){
      e.preventDefault();handleTap(e.clientX,e.clientY);
    });
  }
  window.addEventListener('keydown',handleKey);
  window.addEventListener('resize',resize);
  try{
    var mq=window.matchMedia('(prefers-color-scheme: dark)');
    if(mq&&mq.addEventListener)mq.addEventListener('change',function(){C=getColors();});
    else if(mq&&mq.addListener)mq.addListener(function(){C=getColors();});
  }catch(e){}
}

function init(){
  if(!canvas||!ctx){
    document.body.innerHTML='<p style="padding:20px;font-family:monospace">Canvas unavailable</p>';
    return;
  }
  resize();
  bindEvents();
  render();
  requestAnimationFrame(loop);
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
})();
</script>
</body>
</html>
