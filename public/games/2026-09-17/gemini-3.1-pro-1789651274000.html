<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autumn Drizzle</title>
<style>
  :root {
    --bg: #F0EDE6;
    --text: #2C303A;
    --accent: #5F9EA0;
    --overlay: rgba(240, 237, 230, 0.9);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E2024;
      --text: #E5E4E0;
      --accent: #78B3B5;
      --overlay: rgba(30, 32, 36, 0.9);
    }
  }
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden;
    user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }
  #ui, #start-screen, #game-over-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .hud {
    position: absolute;
    top: env(safe-area-inset-top, 20px);
    left: env(safe-area-inset-left, 20px);
    right: env(safe-area-inset-right, 20px);
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: bold;
    pointer-events: none;
    z-index: 5;
    text-shadow: 0 1px 4px var(--bg), 0 -1px 4px var(--bg), 1px 0 4px var(--bg), -1px 0 4px var(--bg);
    transition: opacity 0.3s;
  }
  .screen {
    background: var(--overlay);
  }
  .hidden {
    display: none !important;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-align: center;
  }
  p {
    margin-bottom: 35px;
    opacity: 0.85;
    text-align: center;
    max-width: 85%;
    line-height: 1.5;
  }
  button {
    pointer-events: auto;
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 16px 45px;
    font-size: 1.2rem;
    font-family: inherit;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    transition: transform 0.1s;
  }
  button:active {
    transform: scale(0.94);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud" id="hud" style="opacity: 0;">
  <div id="score-display">Score: 0</div>
  <div id="level-display">Lvl: 1</div>
</div>

<div id="start-screen" class="screen">
  <h1>Autumn Drizzle</h1>
  <p>Hold screen to tilt right.<br>Release to tilt left.<br><br>Catch clear drops.<br>Avoid muddy splashes.</p>
  <button data-smoke="start" id="btn-start">Start</button>
</div>

<div id="game-over-screen" class="screen hidden">
  <h1>Overflown</h1>
  <p id="final-score">Score: 0</p>
  <button data-smoke="restart" id="btn-restart">Restart</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let width, height;
let Ux, Uy, R;
let buckets = [];
let drops = [];
let particles = [];
let popups = [];

let state = 'TITLE'; 
let score = 0;
let level = 1;
let gameTime = 0;
let windTime = 0;
let lastSpawn = 0;
let rot = -Math.PI / 6;
let isHolding = false;
let shakeTime = 0;

const G = 1500;
const arc_angle = Math.PI / 3; 
const max_rot = Math.PI / 6;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    
    Ux = width / 2;
    Uy = height * 0.28;
    R = Math.min(width * 0.38, height * 0.25);
    
    if (buckets.length === 2) {
        buckets[0].x = Ux - R * 0.95;
        buckets[0].y = height - height * 0.15;
        buckets[0].width = Math.max(width * 0.15, width * 0.22 - (level - 1) * 5);
        buckets[0].height = height * 0.1;
        
        buckets[1].x = Ux + R * 0.95;
        buckets[1].y = height - height * 0.15;
        buckets[1].width = Math.max(width * 0.15, width * 0.22 - (level - 1) * 5);
        buckets[1].height = height * 0.1;
    }
}
window.addEventListener('resize', resize);

function initGame() {
    drops = [];
    particles = [];
    popups = [];
    score = 0;
    level = 1;
    windTime = 0;
    gameTime = 0;
    lastSpawn = 0;
    rot = -max_rot;
    isHolding = false;
    shakeTime = 0;
    
    buckets = [
        { x: 0, y: 0, width: 0, height: 0, fill: 0.3 },
        { x: 0, y: 0, width: 0, height: 0, fill: 0.3 }
    ];
    resize();
    
    document.getElementById('score-display').innerText = 'Score: 0';
    document.getElementById('level-display').innerText = 'Lvl: 1';
    
    state = 'PLAYING';
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').style.opacity = '1';
}

document.getElementById('btn-start').addEventListener('click', initGame);
document.getElementById('btn-restart').addEventListener('click', initGame);

const setHold = (val, e) => {
    if (e && e.target.tagName.toLowerCase() === 'button') return;
    if (e) e.preventDefault();
    isHolding = val;
};

window.addEventListener('touchstart', (e) => setHold(true, e), { passive: false });
window.addEventListener('touchend', (e) => setHold(false, e), { passive: false });
window.addEventListener('mousedown', (e) => setHold(true, e));
window.addEventListener('mouseup', (e) => setHold(false, e));
window.addEventListener('keydown', (e) => { if (e.code === 'Space') setHold(true, e); });
window.addEventListener('keyup', (e) => { if (e.code === 'Space') setHold(false, e); });

function spawnDrop() {
    let spawnW = R * 1.8;
    let x = Ux + (Math.random() - 0.5) * spawnW;
    let type = Math.random() < 0.15 + (level * 0.03) ? 'mud' : 'clean';
    drops.push({
        x: x, y: -20, vx: 0, vy: 0,
        state: 0, type: type, alpha: 0, v_alpha: 0
    });
}

function createSplashes(x, y, type) {
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 250,
            vy: -Math.random() * 300 - 150,
            life: Math.random() * 0.3 + 0.2,
            type: type
        });
    }
}

function createPopup(x, y, text, color) {
    popups.push({ x, y, text, color, life: 1.0 });
}

function levelUp() {
    level++;
    score += 200;
    if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
    for (let b of buckets) {
        b.fill = 0.2;
        b.width = Math.max(width * 0.12, b.width * 0.9);
        createSplashes(b.x, b.y, 'clean');
        createSplashes(b.x, b.y, 'clean');
    }
    document.getElementById('level-display').innerText = 'Lvl: ' + level;
    document.getElementById('score-display').innerText = 'Score: ' + score;
    createPopup(Ux, height * 0.5, 'LEVEL UP!', '#78B3B5');
}

function gameOver() {
    state = 'GAMEOVER';
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    document.getElementById('final-score').innerText = 'Score: ' + score;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').style.opacity = '0';
}

function checkLevelState() {
    let allFull = true;
    for (let b of buckets) {
        if (b.fill <= 0) {
            gameOver();
            return;
        }
        if (b.fill < 1) allFull = false;
    }
    if (allFull) levelUp();
}

function update(dt) {
    if (state !== 'PLAYING') return;
    
    gameTime += dt;
    windTime += dt;
    if (shakeTime > 0) shakeTime -= dt;
    
    let windBase = Math.sin(windTime * 1.2) * (150 + level * 20);
    let gust = Math.sin(windTime * 4.7) * Math.cos(windTime * 2.3) * 180;
    let wind = windBase + gust;
    
    let target_rot = isHolding ? max_rot : -max_rot;
    let rot_speed = 10 + level * 0.5; 
    let prev_rot = rot;
    rot += (target_rot - rot) * Math.min(1, rot_speed * dt);
    let v_rot = (rot - prev_rot) / dt;
    
    let spawnRate = Math.max(0.2, 0.75 - level * 0.05);
    if (gameTime - lastSpawn > spawnRate) {
        spawnDrop();
        lastSpawn = gameTime;
    }
    
    for (let i = drops.length - 1; i >= 0; i--) {
        let drop = drops[i];
        
        if (drop.state === 0 || drop.state === 2) {
            drop.vy += G * dt;
            drop.vx += wind * dt;
            drop.vx *= 0.99;
            drop.vy *= 0.99;
            
            drop.x += drop.vx * dt;
            drop.y += drop.vy * dt;
            
            if (drop.state === 0 && drop.vy > 0) {
                let dx = drop.x - Ux;
                let dy = drop.y - Uy;
                let d = Math.sqrt(dx*dx + dy*dy);
                
                if (d >= R - 25 && d <= R + 25) {
                    let theta = Math.atan2(dy, dx);
                    let alpha = theta - rot;
                    while(alpha > Math.PI) alpha -= Math.PI*2;
                    while(alpha < -Math.PI) alpha += Math.PI*2;
                    
                    if (alpha >= -arc_angle && alpha <= arc_angle) {
                        drop.state = 1;
                        drop.alpha = alpha;
                        let tx = -Math.sin(theta);
                        let ty = Math.cos(theta);
                        drop.v_alpha = (drop.vx * tx + drop.vy * ty) / R;
                    }
                }
            }
        } else if (drop.state === 1) {
            let theta = rot + drop.alpha;
            let gravity_tangent = G * Math.cos(theta);
            
            drop.v_alpha += (gravity_tangent / R) * dt;
            drop.v_alpha -= v_rot * 0.8 * dt;
            drop.v_alpha *= 0.94;
            
            drop.alpha += drop.v_alpha * dt;
            
            if (drop.alpha < -arc_angle || drop.alpha > arc_angle) {
                drop.state = 2;
                drop.alpha = Math.max(-arc_angle, Math.min(arc_angle, drop.alpha));
                theta = rot + drop.alpha;
                let world_v_theta = drop.v_alpha + v_rot;
                
                drop.vx = -world_v_theta * R * Math.sin(theta);
                drop.vy = world_v_theta * R * Math.cos(theta);
                drop.x = Ux + R * Math.cos(theta);
                drop.y = Uy + R * Math.sin(theta);
            } else {
                drop.x = Ux + R * Math.cos(theta);
                drop.y = Uy + R * Math.sin(theta);
            }
        }
        
        if (drop.state === 2 || drop.state === 0) {
            if (drop.y > height - height * 0.18) {
                let hitBucket = null;
                for (let b of buckets) {
                    if (Math.abs(drop.x - b.x) < b.width / 2 && drop.y > b.y && drop.y < b.y + b.height) {
                        hitBucket = b;
                        break;
                    }
                }
                
                if (hitBucket) {
                    createSplashes(drop.x, drop.y, drop.type);
                    if (drop.type === 'clean') {
                        if (hitBucket.fill < 1) {
                            hitBucket.fill += 0.05;
                            score += 10;
                            document.getElementById('score-display').innerText = 'Score: ' + score;
                        }
                    } else {
                        hitBucket.fill -= 0.18;
                        shakeTime = 0.15;
                        if (navigator.vibrate) navigator.vibrate(50);
                    }
                    drops.splice(i, 1);
                    checkLevelState();
                    continue;
                }
            }
            
            if (drop.y > height + 50 || drop.x < -50 || drop.x > width + 50) {
                drops.splice(i, 1);
            }
        }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += G * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    for (let i = popups.length - 1; i >= 0; i--) {
        let p = popups[i];
        p.y -= 40 * dt;
        p.life -= dt;
        if (p.life <= 0) popups.splice(i, 1);
    }
}

function lerpColor(c1, c2, t) {
    t = Math.max(0, Math.min(1, t));
    let r1 = parseInt(c1.slice(1,3), 16), g1 = parseInt(c1.slice(3,5), 16), b1 = parseInt(c1.slice(5,7), 16);
    let r2 = parseInt(c2.slice(1,3), 16), g2 = parseInt(c2.slice(3,5), 16), b2 = parseInt(c2.slice(5,7), 16);
    let r = Math.round(r1 + (r2 - r1) * t);
    let g = Math.round(g1 + (g2 - g1) * t);
    let b = Math.round(b1 + (b2 - b1) * t);
    return `rgb(${r},${g},${b})`;
}

function drawWind(ctx, color, isDark) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.08;
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    
    let wind = Math.sin(windTime * 1.2) * (150 + level * 20) + Math.sin(windTime * 4.7) * Math.cos(windTime * 2.3) * 180;
    let angle = Math.atan2(G, wind); 
    let len = Math.abs(wind) * 0.15 + 20;
    
    for (let i = 0; i < 25; i++) {
        let x = ((i * 187 + windTime * wind * 0.8) % (width + 200) + (width + 200)) % (width + 200) - 100;
        let y = ((i * 93 + windTime * G * 0.6) % (height + 200) + (height + 200)) % (height + 200) - 100;
        
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - Math.cos(angle) * len, y - Math.sin(angle) * len);
        ctx.stroke();
    }
    ctx.globalAlpha = 1.0;
}

function drawUmbrella(ctx, color) {
    ctx.save();
    ctx.translate(Ux, Uy);
    ctx.rotate(rot);
    
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(12, width * 0.02);
    ctx.lineCap = 'round';
    
    ctx.beginPath();
    ctx.arc(0, 0, R, -Math.PI/2 - arc_angle, -Math.PI/2 + arc_angle);
    ctx.stroke();
    
    ctx.lineWidth = Math.max(5, width * 0.01);
    ctx.beginPath();
    ctx.moveTo(0, -R);
    ctx.lineTo(0, -R * 0.2);
    ctx.arc(10, -R * 0.2, 10, Math.PI, 0, true);
    ctx.stroke();
    
    ctx.restore();
}

function drawBucket(ctx, b, colors, currentBg) {
    let x = b.x, y = b.y, w = b.width, h = b.height;
    
    ctx.fillStyle = colors.umbrella; 
    ctx.beginPath();
    ctx.moveTo(x - w/2, y);
    ctx.lineTo(x + w/2, y);
    ctx.lineTo(x + w/2 * 0.8, y + h);
    ctx.lineTo(x - w/2 * 0.8, y + h);
    ctx.closePath();
    ctx.fill();
    
    let fw = w * 0.85;
    let fh = h * 0.9;
    let fx = x;
    let fy = y + h * 0.05;
    
    ctx.fillStyle = currentBg;
    ctx.beginPath();
    ctx.moveTo(fx - fw/2, fy);
    ctx.lineTo(fx + fw/2, fy);
    ctx.lineTo(fx + fw/2 * 0.8, fy + fh);
    ctx.lineTo(fx - fw/2 * 0.8, fy + fh);
    ctx.closePath();
    ctx.fill();
    
    if (b.fill > 0) {
        let fill = Math.min(1, b.fill);
        let waterH = fh * fill;
        ctx.fillStyle = colors.water;
        ctx.beginPath();
        let topW = fw * 0.8 + (fw * 0.2) * fill;
        ctx.moveTo(fx - topW/2, fy + fh - waterH);
        ctx.lineTo(fx + topW/2, fy + fh - waterH);
        ctx.lineTo(fx + fw/2 * 0.8, fy + fh);
        ctx.lineTo(fx - fw/2 * 0.8, fy + fh);
        ctx.closePath();
        ctx.fill();
    }
}

function drawDrops(ctx, colors) {
    for (let drop of drops) {
        ctx.fillStyle = drop.type === 'clean' ? colors.clean : colors.mud;
        ctx.beginPath();
        ctx.arc(drop.x, drop.y, 7, 0, Math.PI*2);
        ctx.fill();
        
        ctx.globalAlpha = 0.45;
        ctx.beginPath();
        ctx.arc(drop.x - 3, drop.y - 3, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(drop.x + 2, drop.y + 3, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

function draw() {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const colors = {
        bg: isDark ? '#1E2024' : '#F0EDE6',
        umbrella: isDark ? '#E5E4E0' : '#2C303A',
        clean: isDark ? 'rgba(120, 210, 215, 0.85)' : 'rgba(95, 158, 160, 0.85)',
        mud: isDark ? 'rgba(220, 130, 90, 0.85)' : 'rgba(180, 100, 70, 0.85)',
        water: isDark ? '#78B3B5' : '#5F9EA0',
        dawn: isDark ? '#4A3B2C' : '#F9EED5'
    };
    
    let avgFill = 0;
    if (buckets.length) {
        for (let b of buckets) avgFill += Math.max(0, b.fill);
        avgFill /= buckets.length;
    }
    
    let currentBg = lerpColor(colors.bg, colors.dawn, avgFill * 0.8);
    
    ctx.fillStyle = currentBg;
    ctx.fillRect(0, 0, width, height);
    
    ctx.save();
    if (shakeTime > 0) {
        let intensity = shakeTime * 60;
        ctx.translate((Math.random()-0.5)*intensity, (Math.random()-0.5)*intensity);
    }
    
    drawWind(ctx, colors.umbrella, isDark);
    
    if (state === 'PLAYING' || state === 'GAMEOVER') {
        drawUmbrella(ctx, colors.umbrella);
        
        for (let b of buckets) {
            drawBucket(ctx, b, colors, currentBg);
        }
        
        drawDrops(ctx, colors);
        
        for (let p of particles) {
            ctx.fillStyle = p.type === 'clean' ? colors.clean : colors.mud;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
            ctx.fill();
        }
        
        ctx.font = 'bold 20px ui-monospace, sans-serif';
        ctx.textAlign = 'center';
        for (let p of popups) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillText(p.text, p.x, p.y);
        }
        ctx.globalAlpha = 1.0;
    }
    
    ctx.restore();
}

let lastTime = performance.now();
function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;
    
    update(dt);
    draw();
}

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
