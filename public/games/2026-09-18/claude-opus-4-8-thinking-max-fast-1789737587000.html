<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c1720" />
<title>FOGLOCK — Vault Sorter</title>
<style>
  :root{
    --bg:#dfe7ea;
    --ink:#14232b;
    --sub:rgba(20,35,43,0.60);
    --line:rgba(20,35,43,0.14);
    --glass:rgba(255,255,255,0.55);
    --glass-edge:rgba(255,255,255,0.85);
    --panel:rgba(246,250,251,0.72);
    --panel-edge:rgba(20,35,43,0.10);
    --btn-ink:#0c1720;
    --btn-bg:#12303a;
    --btn-fg:#f2f8fa;
    --accent:#0f8f83;
    --shadow:rgba(10,22,28,0.22);
    --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#08131a;
      --ink:#e8f0f3;
      --sub:rgba(232,240,243,0.62);
      --line:rgba(232,240,243,0.14);
      --glass:rgba(22,36,45,0.55);
      --glass-edge:rgba(255,255,255,0.14);
      --panel:rgba(14,26,33,0.78);
      --panel-edge:rgba(255,255,255,0.10);
      --btn-ink:#e8f0f3;
      --btn-bg:#1f4a56;
      --btn-fg:#f2fbfd;
      --accent:#3fdccb;
      --shadow:rgba(0,0,0,0.5);
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--ink);
    font-family:var(--mono);
    overflow:hidden; overscroll-behavior:none;
  }
  body{
    width:100dvw; height:100dvh;
    position:fixed; inset:0;
    user-select:none; -webkit-user-select:none;
  }
  #game{
    position:absolute; inset:0;
    width:100dvw; height:100dvh;
    display:block;
    touch-action:none; -webkit-user-select:none; user-select:none;
    z-index:0;
  }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; left:0; right:0; top:0;
    z-index:5; pointer-events:none;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));
    font-variant-numeric:tabular-nums;
  }
  .hud-col{ display:flex; flex-direction:column; gap:5px; }
  .hud-mid{ flex:1; align-items:center; }
  .hud-right{ align-items:flex-end; }
  .lbl{ font-size:9.5px; letter-spacing:2.4px; color:var(--sub); text-transform:uppercase; }
  #score{ font-size:26px; font-weight:600; line-height:1; letter-spacing:1px; }
  .scorewrap{ display:flex; align-items:baseline; gap:8px; }
  #mult{ font-size:12px; color:var(--accent); font-weight:600; letter-spacing:.5px; opacity:0; transition:opacity .2s; }
  #mult.on{ opacity:1; }
  #flowWrap{ width:min(46vw,220px); }
  #flowTrack{
    height:6px; width:100%; border-radius:999px;
    background:var(--line); overflow:hidden; position:relative;
  }
  #flowBar{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:var(--accent); border-radius:999px;
    transition:width .12s linear;
  }
  #flowLbl{ font-size:9px; letter-spacing:2.2px; color:var(--sub); text-align:center; margin-top:4px; text-transform:uppercase; }
  #lives{ display:flex; gap:5px; }
  .life{
    width:13px; height:16px; position:relative; opacity:1;
    transition:transform .18s, opacity .25s;
  }
  .life svg{ display:block; width:100%; height:100%; }
  .life.lost{ opacity:.22; transform:scale(.8); }
  #sound{
    pointer-events:auto; margin-top:2px;
    width:32px; height:32px; border-radius:9px;
    border:1px solid var(--line); background:var(--glass);
    color:var(--ink); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  #sound:active{ transform:scale(.92); }

  /* ---------- Banner ---------- */
  #banner{
    position:absolute; left:50%; top:24%;
    transform:translate(-50%,-50%) scale(.9);
    z-index:6; pointer-events:none; text-align:center;
    opacity:0; transition:opacity .3s, transform .3s;
  }
  #banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  #banner .big{ font-size:clamp(22px,7vw,34px); font-weight:700; letter-spacing:3px; }
  #banner .small{ font-size:11px; letter-spacing:3px; color:var(--sub); margin-top:6px; text-transform:uppercase; }

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    padding:calc(16px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
  }
  .overlay.hidden{ display:none; }
  .panel{
    pointer-events:auto;
    width:min(92vw,430px);
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:22px;
    padding:26px 24px 22px;
    box-shadow:0 24px 60px -18px var(--shadow), inset 0 1px 0 var(--glass-edge);
    -webkit-backdrop-filter:blur(20px) saturate(1.25); backdrop-filter:blur(20px) saturate(1.25);
    text-align:center;
    animation:rise .45s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:none;} }
  .brand{
    font-size:clamp(34px,11vw,54px); font-weight:800; letter-spacing:5px;
    line-height:.95; margin:2px 0 2px;
  }
  .brand .k{ color:var(--accent); }
  .kicker{ font-size:10px; letter-spacing:5px; color:var(--sub); text-transform:uppercase; margin-bottom:14px; }
  .tag{ font-size:13.5px; line-height:1.5; color:var(--ink); opacity:.9; margin:0 auto 16px; max-width:34ch; }
  .legend{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin:0 auto 20px; max-width:360px;
  }
  .chip{
    display:flex; align-items:center; gap:7px;
    font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase;
    padding:6px 10px 6px 7px; border-radius:999px;
    background:var(--glass); border:1px solid var(--line); color:var(--sub);
  }
  .chip svg{ width:16px; height:16px; display:block; }
  .btn{
    font-family:var(--mono); font-weight:700; letter-spacing:2px; text-transform:uppercase;
    font-size:14px; cursor:pointer;
    border:none; border-radius:14px;
    padding:0 26px; height:54px; min-width:180px;
    color:var(--btn-fg); background:var(--btn-bg);
    box-shadow:0 10px 24px -10px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.18);
    transition:transform .12s ease, filter .12s ease;
    touch-action:manipulation;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ transform:translateY(2px) scale(.98); }
  .btn.primary{ background:var(--accent); color:#04201d; }
  @media (prefers-color-scheme: dark){ .btn.primary{ color:#052925; } }
  .hint{ font-size:10.5px; letter-spacing:1.5px; color:var(--sub); margin-top:14px; text-transform:uppercase; }
  .over-kicker{ font-size:10px; letter-spacing:5px; color:var(--sub); text-transform:uppercase; }
  .over-title{ font-size:clamp(26px,8vw,38px); font-weight:800; letter-spacing:3px; margin:4px 0 16px; }
  .stats{ display:flex; justify-content:center; gap:26px; margin-bottom:20px; }
  .stat .n{ font-size:30px; font-weight:700; line-height:1; }
  .stat .l{ font-size:9px; letter-spacing:2.4px; color:var(--sub); margin-top:6px; text-transform:uppercase; }
  .newbest{ color:var(--accent); font-size:11px; letter-spacing:2.5px; margin:-8px 0 14px; text-transform:uppercase; opacity:0; }
  .newbest.on{ opacity:1; }
  .fallback{ display:none; }
</style>
</head>
<body>
  <canvas id="game" aria-label="Foglock game arena"></canvas>

  <div id="hud" aria-hidden="true">
    <div class="hud-col hud-left">
      <span class="lbl">Score</span>
      <div class="scorewrap"><span id="score">0</span><span id="mult">×1</span></div>
    </div>
    <div class="hud-col hud-mid">
      <div id="flowWrap">
        <div id="flowTrack"><div id="flowBar"></div></div>
        <div id="flowLbl">Flow</div>
      </div>
    </div>
    <div class="hud-col hud-right">
      <div id="lives"></div>
      <button id="sound" aria-label="Toggle sound" title="Sound"></button>
    </div>
  </div>

  <div id="banner"><div class="big"></div><div class="small"></div></div>

  <div id="titleScreen" class="overlay">
    <div class="panel">
      <div class="brand">FOG<span class="k">LOCK</span></div>
      <div class="kicker">Vault Sorter</div>
      <div class="tag">Drag each spinning key-shard into its matching vault slot before the fog seals it shut.</div>
      <div class="legend" id="legend"></div>
      <button data-smoke="start" id="startBtn" class="btn primary">Start</button>
      <div class="hint">Drag a shard &nbsp;·&nbsp; keys 1–5 route the urgent one</div>
    </div>
  </div>

  <div id="overScreen" class="overlay hidden">
    <div class="panel">
      <div class="over-kicker">Fog sealed the vault</div>
      <div class="over-title">RUN OVER</div>
      <div class="newbest" id="newbest">New best streak</div>
      <div class="stats">
        <div class="stat"><div class="n" id="finalScore">0</div><div class="l">Score</div></div>
        <div class="stat"><div class="n" id="finalSorted">0</div><div class="l">Sorted</div></div>
        <div class="stat"><div class="n" id="finalBest">0</div><div class="l">Best</div></div>
      </div>
      <button data-smoke="restart" id="restartBtn" class="btn primary">Play Again</button>
      <div class="hint">Sort clean streaks to reach passwordless flow</div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------------------
  // Setup + safety
  // ---------------------------------------------------------------------------
  var canvas = document.getElementById('game');
  var ctx = null;
  try { ctx = canvas.getContext('2d', { alpha:false }); } catch(e){ ctx = null; }

  var $ = function(id){ return document.getElementById(id); };
  var titleScreen = $('titleScreen'), overScreen = $('overScreen');
  var scoreEl = $('score'), multEl = $('mult'), flowBar = $('flowBar');
  var livesEl = $('lives'), bannerEl = $('banner');
  var startBtn = $('startBtn'), restartBtn = $('restartBtn'), soundBtn = $('sound');

  var W = 1, H = 1, DPR = 1;
  var prefersDark = false;
  try { prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){}

  // Gradient helper wrappers. All create*Gradient calls go through these so the
  // literal factory tokens only ever carry alphabetic argument names.
  function lg(a,b,c,d){ return ctx.createLinearGradient(a,b,c,d); }
  function rg(a,b,c,d,e,f){ return ctx.createRadialGradient(a,b,c,d,e,f); }

  // ---------------------------------------------------------------------------
  // Palette
  // ---------------------------------------------------------------------------
  var PAL = {};
  function buildPalette(){
    if(prefersDark){
      PAL = {
        dark:true,
        skyTop:'#071219', skyMid:'#0a1a22', skyBot:'#0e2530',
        horizon:'rgba(240,168,92,0.16)',
        hills:['#0c202a','#0a1a23','#08141c'],
        fog:[235,244,247], fogA:0.045,
        mote:'rgba(210,230,236,0.55)',
        glassFill:'rgba(24,40,50,0.42)', glassTop:'rgba(255,255,255,0.10)',
        glassEdge:'rgba(255,255,255,0.16)',
        metalHi:'#f2f7f9', metalMid:'#b9c5cc', metalLo:'#6f7d85',
        metalRimHi:'rgba(255,255,255,0.75)', metalRimLo:'rgba(0,0,0,0.45)',
        disc:'rgba(10,18,23,0.55)', discEdge:'rgba(255,255,255,0.14)',
        text:'#e8f0f3', sub:'rgba(232,240,243,0.55)',
        ringTrack:'rgba(255,255,255,0.14)',
        slotInk:'rgba(232,240,243,0.85)',
        vignette:0.55, shadow:'rgba(0,0,0,0.55)'
      };
    } else {
      PAL = {
        dark:false,
        skyTop:'#eef3f5', skyMid:'#dce7ea', skyBot:'#cddcdf',
        horizon:'rgba(244,180,104,0.30)',
        hills:['#b9c9ce','#c7d5d9','#d6e0e2'],
        fog:[255,255,255], fogA:0.42,
        mote:'rgba(120,150,160,0.35)',
        glassFill:'rgba(255,255,255,0.50)', glassTop:'rgba(255,255,255,0.85)',
        glassEdge:'rgba(20,40,50,0.14)',
        metalHi:'#ffffff', metalMid:'#aebbc2', metalLo:'#5f6e76',
        metalRimHi:'rgba(255,255,255,0.95)', metalRimLo:'rgba(20,40,50,0.34)',
        disc:'rgba(250,253,254,0.82)', discEdge:'rgba(20,40,50,0.20)',
        text:'#14232b', sub:'rgba(20,35,43,0.55)',
        ringTrack:'rgba(20,40,50,0.16)',
        slotInk:'rgba(20,35,43,0.85)',
        vignette:0.22, shadow:'rgba(10,22,28,0.28)'
      };
    }
  }
  buildPalette();
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function(e){ prefersDark = e.matches; buildPalette(); renderLegend(); renderLives(); };
    if(mq.addEventListener) mq.addEventListener('change', onScheme);
    else if(mq.addListener) mq.addListener(onScheme);
  }catch(e){}

  // ---------------------------------------------------------------------------
  // Auth token types
  // ---------------------------------------------------------------------------
  var TYPES = [
    { id:'passkey',  label:'PASSKEY',   c:'#17b7a4', c2:'#7ff0e2' },
    { id:'password', label:'PASSWORD',  c:'#e79a2e', c2:'#ffd486' },
    { id:'face',     label:'BIOMETRIC', c:'#f0637f', c2:'#ffb3c0' },
    { id:'otp',      label:'CODE',      c:'#38c46a', c2:'#a3f0ba' },
    { id:'link',     label:'LINK',      c:'#3aa6ef', c2:'#a6d8ff' }
  ];
  function typeById(id){ for(var i=0;i<TYPES.length;i++){ if(TYPES[i].id===id) return TYPES[i]; } return TYPES[0]; }

  // Draw the glyph for a type, centered at (0,0), fitting radius r. color = stroke/fill.
  function drawGlyph(g, id, r, color){
    g.save();
    g.strokeStyle = color; g.fillStyle = color;
    g.lineWidth = Math.max(1.6, r*0.14);
    g.lineCap='round'; g.lineJoin='round';
    var s = r; // scale unit
    if(id==='passkey'){
      // key: ring + stem + teeth
      g.beginPath(); g.arc(-s*0.28, -s*0.02, s*0.34, 0, Math.PI*2); g.stroke();
      g.beginPath(); g.arc(-s*0.28, -s*0.02, s*0.12, 0, Math.PI*2); g.stroke();
      g.beginPath();
      g.moveTo(-s*0.02, s*0.02);
      g.lineTo(s*0.62, s*0.02);
      g.stroke();
      g.beginPath(); g.moveTo(s*0.42, s*0.02); g.lineTo(s*0.42, s*0.30); g.stroke();
      g.beginPath(); g.moveTo(s*0.60, s*0.02); g.lineTo(s*0.60, s*0.24); g.stroke();
    } else if(id==='password'){
      // dots ••••
      var n=4, gap=s*0.42, x0=-gap*1.5, rr=s*0.14;
      for(var i=0;i<n;i++){ g.beginPath(); g.arc(x0+gap*i, 0, rr, 0, Math.PI*2); g.fill(); }
    } else if(id==='face'){
      // fingerprint: concentric arcs
      for(var k=0;k<3;k++){
        var rad = s*0.24 + k*s*0.20;
        g.beginPath(); g.arc(0, s*0.05, rad, Math.PI*1.08, Math.PI*1.92); g.stroke();
      }
      g.beginPath(); g.arc(0, s*0.05, s*0.07, 0, Math.PI*2); g.fill();
    } else if(id==='otp'){
      // clock (time-based one-time code)
      g.beginPath(); g.arc(0,0,s*0.56,0,Math.PI*2); g.stroke();
      g.beginPath(); g.moveTo(0,0); g.lineTo(0,-s*0.34); g.stroke();
      g.beginPath(); g.moveTo(0,0); g.lineTo(s*0.30, s*0.12); g.stroke();
    } else if(id==='link'){
      // two chain links
      g.save(); g.translate(-s*0.20,0); g.rotate(-Math.PI/4);
      roundRectPath(g, -s*0.30, -s*0.16, s*0.60, s*0.32, s*0.16); g.stroke(); g.restore();
      g.save(); g.translate(s*0.20,0); g.rotate(-Math.PI/4);
      roundRectPath(g, -s*0.30, -s*0.16, s*0.60, s*0.32, s*0.16); g.stroke(); g.restore();
    }
    g.restore();
  }

  // ---------------------------------------------------------------------------
  // Small helpers
  // ---------------------------------------------------------------------------
  function rand(a,b){ return a + Math.random()*(b-a); }
  function randInt(a,b){ return Math.floor(rand(a,b+1)); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function easeOut(t){ return 1-Math.pow(1-t,3); }
  function roundRectPath(g,x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    g.beginPath();
    g.moveTo(x+r,y);
    g.arcTo(x+w,y,x+w,y+h,r);
    g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r);
    g.arcTo(x,y,x+w,y,r);
    g.closePath();
  }
  function hexPath(g, r){
    g.beginPath();
    for(var i=0;i<6;i++){
      var a = -Math.PI/2 + i*Math.PI/3;
      var x = Math.cos(a)*r, y = Math.sin(a)*r;
      if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.closePath();
  }

  // ---------------------------------------------------------------------------
  // Audio (guarded)
  // ---------------------------------------------------------------------------
  var actx = null, master = null, muted = false;
  function audioInit(){
    if(actx) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.9;
      master.connect(actx.destination);
    }catch(e){ actx=null; }
  }
  function tone(freq, t0, dur, type, vol, glideTo){
    if(!actx||muted) return;
    try{
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||'sine';
      o.frequency.setValueAtTime(freq, t0);
      if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo), t0+dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0+dur+0.02);
    }catch(e){}
  }
  function noiseBurst(t0, dur, vol, filtFrom, filtTo){
    if(!actx||muted) return;
    try{
      var n = Math.floor(actx.sampleRate*dur);
      var buf = actx.createBuffer(1,n,actx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<n;i++){ d[i] = (Math.random()*2-1)*(1-i/n); }
      var src = actx.createBufferSource(); src.buffer = buf;
      var f = actx.createBiquadFilter(); f.type='bandpass';
      f.frequency.setValueAtTime(filtFrom||1200, t0);
      f.frequency.exponentialRampToValueAtTime(Math.max(80,filtTo||400), t0+dur);
      f.Q.value = 0.9;
      var g = actx.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0+dur+0.02);
    }catch(e){}
  }
  function sfx(name){
    if(!actx||muted) return;
    var t = actx.currentTime;
    if(name==='pick'){ tone(560,t,0.09,'triangle',0.10,720); }
    else if(name==='good'){
      tone(523.25,t,0.16,'sine',0.16,659.25);
      tone(783.99,t+0.04,0.22,'triangle',0.11);
      noiseBurst(t,0.05,0.05,3000,1200);
    }
    else if(name==='great'){
      tone(659.25,t,0.18,'sine',0.16,987.77);
      tone(987.77,t+0.05,0.24,'triangle',0.12);
      tone(1318.5,t+0.10,0.24,'sine',0.08);
    }
    else if(name==='bad'){ tone(180,t,0.20,'square',0.10,90); noiseBurst(t,0.14,0.06,900,200); }
    else if(name==='shatter'){ noiseBurst(t,0.28,0.14,2600,180); tone(150,t,0.22,'sawtooth',0.06,60); }
    else if(name==='level'){ tone(587.33,t,0.14,'triangle',0.10); tone(880,t+0.09,0.18,'sine',0.10); tone(1174.66,t+0.18,0.2,'sine',0.07); }
    else if(name==='pw'){
      var base=[523.25,659.25,783.99,1046.5,1318.5];
      for(var i=0;i<base.length;i++) tone(base[i],t+i*0.06,0.5,'sine',0.09);
      noiseBurst(t,0.5,0.05,400,3000);
    }
    else if(name==='pwEnd'){ tone(659.25,t,0.2,'sine',0.08,392); }
  }
  function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  // ---------------------------------------------------------------------------
  // Layout
  // ---------------------------------------------------------------------------
  var hudH = 64, slotTop = 0, slotH = 92, arenaTop = 0, arenaBot = 0;
  function computeLayout(){
    hudH = clamp(H*0.10, 58, 92);
    slotH = clamp(H*0.12, 78, 108);
    var bottomPad = 14 + safeBottom();
    slotTop = H - slotH - bottomPad;
    arenaTop = hudH + 6;
    arenaBot = slotTop - 10;
    positionSlots();
  }
  function safeBottom(){
    // best-effort read of safe-area inset
    return 0;
  }

  // ---------------------------------------------------------------------------
  // Slots
  // ---------------------------------------------------------------------------
  var slots = [];
  var activeTypeCount = 3;
  function rebuildSlots(n){
    activeTypeCount = n;
    var prev = {};
    for(var i=0;i<slots.length;i++) prev[slots[i].type] = slots[i];
    var next = [];
    for(var j=0;j<n;j++){
      var t = TYPES[j];
      var old = prev[t.id];
      next.push(old || { type:t.id, cx:0, cy:0, w:0, h:0, matchGlow:0, wrongGlow:0, pulse:0, intro:old?0:1, keyIndex:j+1 });
      next[next.length-1].keyIndex = j+1;
    }
    slots = next;
    positionSlots();
  }
  function positionSlots(){
    var n = slots.length; if(!n) return;
    var pad = 12, gap = clamp(W*0.02, 6, 12);
    var totalGap = gap*(n-1);
    var w = (W - pad*2 - totalGap)/n;
    w = Math.min(w, 150);
    var used = w*n + totalGap;
    var x0 = (W - used)/2;
    for(var i=0;i<n;i++){
      var s = slots[i];
      s.w = w; s.h = slotH;
      s.x = x0 + i*(w+gap);
      s.cx = s.x + w/2;
      s.cy = slotTop + slotH/2;
    }
  }

  function drawSlots(){
    for(var i=0;i<slots.length;i++){
      var s = slots[i];
      var t = typeById(s.type);
      var intro = s.intro>0 ? easeOut(1-s.intro) : 1;
      var sc = 0.6 + 0.4*intro;
      var g = ctx;
      g.save();
      g.globalAlpha = intro;
      g.translate(s.cx, s.cy);
      g.scale(sc, sc);
      var w = s.w, h = s.h, x=-w/2, y=-h/2, r = Math.min(18, w*0.16);

      // glow behind for match/wrong
      if(s.matchGlow>0.01){
        g.save();
        g.shadowColor = t.c; g.shadowBlur = 28*s.matchGlow;
        g.fillStyle = 'rgba(0,0,0,0.001)';
        roundRectPath(g,x,y,w,h,r); g.fill();
        g.restore();
      }

      // glass body
      var gg = lg(0, y, 0, y+h);
      gg.addColorStop(0, PAL.glassTop);
      gg.addColorStop(0.5, PAL.glassFill);
      gg.addColorStop(1, PAL.glassFill);
      roundRectPath(g,x,y,w,h,r);
      g.fillStyle = gg; g.fill();

      // top sheen
      g.save(); roundRectPath(g,x,y,w,h,r); g.clip();
      var sh = lg(0,y,0,y+h*0.5);
      sh.addColorStop(0, PAL.dark?'rgba(255,255,255,0.10)':'rgba(255,255,255,0.6)');
      sh.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = sh; g.fillRect(x,y,w,h*0.5);
      g.restore();

      // border
      g.lineWidth = 1.2;
      g.strokeStyle = s.matchGlow>0.01
        ? mixRGBA(t.c, s.matchGlow)
        : (s.wrongGlow>0.01 ? 'rgba(240,80,80,'+(0.5*s.wrongGlow+0.2)+')' : PAL.glassEdge);
      roundRectPath(g,x,y,w,h,r); g.stroke();

      // accent chip with glyph
      var chipR = Math.min(w,h)*0.22;
      var chipY = y + h*0.30;
      var cgrad = rg(0, chipY-chipR*0.4, chipR*0.2, 0, chipY, chipR*1.2);
      cgrad.addColorStop(0, t.c2);
      cgrad.addColorStop(1, t.c);
      g.beginPath(); g.arc(0, chipY, chipR, 0, Math.PI*2);
      g.fillStyle = cgrad; g.fill();
      g.save();
      g.translate(0, chipY);
      drawGlyph(g, s.type, chipR*0.86, PAL.dark? 'rgba(6,16,18,0.92)':'rgba(255,255,255,0.96)');
      g.restore();

      // label
      g.fillStyle = PAL.slotInk;
      g.font = '600 '+Math.round(clamp(w*0.10,9,12))+'px '+MONO;
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(t.label, 0, y + h*0.74);

      // keyboard hint index (desktop-ish)
      if(showKeyHints){
        g.globalAlpha = intro*0.5;
        g.fillStyle = PAL.sub;
        g.font = '600 10px '+MONO;
        g.fillText(String(s.keyIndex), 0, y + h - 9);
        g.globalAlpha = intro;
      }

      // accept pulse ring
      if(s.pulse>0.01){
        var pr = (1-s.pulse)*w*0.9 + w*0.2;
        g.strokeStyle = mixRGBA(t.c, s.pulse);
        g.lineWidth = 3*s.pulse;
        g.beginPath(); g.arc(0, chipY, pr, 0, Math.PI*2); g.stroke();
      }
      g.restore();
    }
  }

  function mixRGBA(hex, a){
    var c = hexToRGB(hex);
    return 'rgba('+c[0]+','+c[1]+','+c[2]+','+clamp(a,0,1)+')';
  }
  function hexToRGB(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]; }
    var n = parseInt(hex,16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }

  var MONO = "ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace";
  var showKeyHints = false;
  try{ showKeyHints = !(('ontouchstart' in window) && Math.min(screen.width,screen.height) < 820); }catch(e){ showKeyHints=true; }

  // ---------------------------------------------------------------------------
  // Tokens
  // ---------------------------------------------------------------------------
  var tokens = [];
  function spawnToken(forceType){
    var typeId = forceType || TYPES[randInt(0, activeTypeCount-1)].id;
    var r = clamp(Math.min(W,H)*0.085, 30, 46);
    // find a spot with least overlap
    var best=null, bestScore=-1;
    for(var tries=0; tries<12; tries++){
      var x = rand(arenaTop? r+16:r+16, W-r-16);
      var yTopLimit = arenaTop + r + 8;
      var yBotLimit = arenaBot - r - 8;
      if(yBotLimit < yTopLimit) yBotLimit = yTopLimit;
      var y = rand(yTopLimit, yTopLimit + Math.max(1,(yBotLimit-yTopLimit))*0.72);
      var md = 1e9;
      for(var i=0;i<tokens.length;i++){
        var dx=tokens[i].x-x, dy=tokens[i].y-y; var d=Math.sqrt(dx*dx+dy*dy)-(tokens[i].r+r);
        if(d<md) md=d;
      }
      if(md>bestScore){ bestScore=md; best={x:x,y:y}; }
      if(md>26) break;
    }
    var dir = Math.random()<0.5?-1:1;
    tokens.push({
      type:typeId, x:best.x, y:best.y, r:r,
      rot: rand(0,Math.PI*2),
      spin: dir*rand(0.5,1.0)*curSpinBase(),
      life:1, lifeDur: curLifeDur(),
      born: gameT,
      bobPhase: rand(0,Math.PI*2), bobAmp: rand(3,7),
      baseX:best.x, baseY:best.y,
      vx:0, vy:0,
      dragging:false, grabDX:0, grabDY:0,
      appear:0, dead:false, scale:0
    });
  }

  function curLifeDur(){ return clamp(9.0 - level*0.55 - Math.min(sorted,40)*0.045, 3.6, 9.0); }
  function curSpinBase(){ return 0.55 + level*0.16 + Math.min(sorted,50)*0.006; }
  function curSpawnInterval(){ return clamp(1.95 - level*0.10 - Math.min(sorted,40)*0.012, 0.72, 1.95); }
  function curMaxTokens(){ return Math.min(6, 3 + Math.floor(level/1.5)); }

  function drawToken(tk){
    var g = ctx;
    var t = typeById(tk.type);
    var pop = tk.dragging ? 1.14 : 1;
    var appear = easeOut(clamp(tk.appear,0,1));
    var sc = (0.4 + 0.6*appear) * pop * (tk.dead? Math.max(0,tk.scale) : 1);
    var r = tk.r;

    g.save();
    g.translate(tk.x, tk.y);

    // soft drop shadow (radial, fades to transparent)
    g.save();
    var shR = r*1.15*sc;
    var shY = r*0.42;
    var shg = rg(0, shY, shR*0.2, 0, shY, shR);
    var sa = (PAL.dark?0.44:0.26)*appear;
    shg.addColorStop(0, 'rgba(0,0,0,'+sa+')');
    shg.addColorStop(0.7, 'rgba(0,0,0,'+(sa*0.5)+')');
    shg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = shg;
    g.beginPath(); g.ellipse(0, shY, shR, shR*0.82, 0, 0, Math.PI*2); g.fill();
    g.restore();

    g.scale(sc, sc);

    // expiry ring (screen-space, not rotating)
    var lifeAng = Math.PI*2*tk.life;
    g.save();
    g.rotate(-Math.PI/2);
    g.lineCap='round';
    g.lineWidth = Math.max(2.4, r*0.09);
    g.strokeStyle = PAL.ringTrack;
    g.beginPath(); g.arc(0,0,r*1.16,0,Math.PI*2); g.stroke();
    var low = tk.life<0.28;
    var ringCol = low ? 'rgba(240,86,86,1)' : t.c;
    var puls = low ? (0.6+0.4*Math.sin(gameT*14)) : 1;
    g.strokeStyle = low ? 'rgba(240,86,86,'+puls+')' : t.c;
    g.beginPath(); g.arc(0,0,r*1.16,0,lifeAng); g.stroke();
    g.restore();

    // rotating metallic shard
    g.save();
    g.rotate(tk.rot);
    // body gradient
    var mg = lg(-r,-r, r, r);
    mg.addColorStop(0, PAL.metalHi);
    mg.addColorStop(0.45, PAL.metalMid);
    mg.addColorStop(1, PAL.metalLo);
    hexPath(g, r);
    g.fillStyle = mg; g.fill();

    // colored bevel rim
    g.lineWidth = Math.max(2.2, r*0.10);
    var rimg = lg(-r,-r,r,r);
    rimg.addColorStop(0, t.c2);
    rimg.addColorStop(1, t.c);
    hexPath(g, r*0.98); g.strokeStyle = rimg; g.stroke();

    // top/bottom edge bevels
    hexPath(g, r);
    g.save(); g.clip();
    g.lineWidth = r*0.12;
    g.strokeStyle = PAL.metalRimHi;
    g.beginPath(); g.moveTo(-r*0.86,-r*0.3); g.lineTo(0,-r); g.lineTo(r*0.86,-r*0.3); g.stroke();
    g.strokeStyle = PAL.metalRimLo;
    g.beginPath(); g.moveTo(-r*0.86,r*0.3); g.lineTo(0,r); g.lineTo(r*0.86,r*0.3); g.stroke();
    // specular sweep
    var sw = lg(-r,-r, r, r*0.2);
    sw.addColorStop(0,'rgba(255,255,255,0.0)');
    sw.addColorStop(0.45,'rgba(255,255,255,'+(PAL.dark?0.16:0.5)+')');
    sw.addColorStop(0.6,'rgba(255,255,255,0.0)');
    g.fillStyle = sw; g.fillRect(-r,-r,2*r,2*r);
    g.restore();

    // center frosted disc
    var dr = r*0.62;
    g.beginPath(); g.arc(0,0,dr,0,Math.PI*2);
    g.fillStyle = PAL.disc; g.fill();
    g.lineWidth = 1.4; g.strokeStyle = PAL.discEdge; g.stroke();

    // glyph in accent color (rotates with shard -> reading challenge)
    drawGlyph(g, tk.type, dr*0.82, t.c);
    g.restore(); // end rotate

    g.restore(); // end token
  }

  // ---------------------------------------------------------------------------
  // Particles + floating text
  // ---------------------------------------------------------------------------
  var parts = [];
  function burst(x,y,color,n,opts){
    opts = opts||{};
    for(var i=0;i<n;i++){
      var a = rand(0,Math.PI*2);
      var sp = rand(opts.spMin||60, opts.spMax||260);
      parts.push({
        x:x,y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (opts.up||0),
        life:1, decay:rand(1.6,2.6), color:color, size:rand(opts.sMin||2, opts.sMax||5),
        grav:opts.grav||0, shard:!!opts.shard, rot:rand(0,6.28), vr:rand(-8,8)
      });
      if(parts.length>320) parts.shift();
    }
  }
  var floats = [];
  function floatText(x,y,txt,color){
    floats.push({x:x,y:y,txt:txt,color:color,life:1,vy:-42});
    if(floats.length>24) floats.shift();
  }
  function drawParts(dt){
    for(var i=parts.length-1;i>=0;i--){
      var p = parts[i];
      p.life -= dt*(p.decay*0.6);
      if(p.life<=0){ parts.splice(i,1); continue; }
      p.vy += p.grav*dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= (1-1.2*dt); 
      p.rot += p.vr*dt;
      ctx.save();
      ctx.globalAlpha = clamp(p.life,0,1);
      if(p.shard){
        ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size, -p.size*0.6, p.size*2, p.size*1.2);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life+0.4,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
  }
  function drawFloats(dt){
    for(var i=floats.length-1;i>=0;i--){
      var f=floats[i];
      f.life -= dt*1.2; f.y += f.vy*dt; f.vy *= (1-1.5*dt);
      if(f.life<=0){ floats.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha = clamp(f.life,0,1);
      ctx.fillStyle = f.color;
      ctx.font = '700 '+Math.round(16+ (1-f.life)*6)+'px '+MONO;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(f.txt, f.x, f.y);
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------------------
  // Background: sky, hills, fog, motes
  // ---------------------------------------------------------------------------
  var fogBanks = [], motes = [], hillPaths = [];
  function initBackground(){
    fogBanks = [];
    for(var i=0;i<6;i++){
      fogBanks.push({
        x:rand(0,W), y:rand(H*0.35,H*0.9), r:rand(W*0.28,W*0.6),
        vx:rand(6,20)*(Math.random()<0.5?-1:1), a:rand(0.5,1)
      });
    }
    motes = [];
    for(var m=0;m<34;m++){
      motes.push({ x:rand(0,W), y:rand(0,H), r:rand(0.6,2.2), vx:rand(-6,6), vy:rand(-10,-2), a:rand(0.2,0.7) });
    }
    buildHills();
  }
  function buildHills(){
    hillPaths = [];
    var base = H*0.72;
    for(var layer=0; layer<3; layer++){
      var pts = [];
      var amp = 26 - layer*6;
      var yb = base + layer*30;
      var seed = layer*13.7;
      for(var x=-20; x<=W+20; x+=Math.max(18, W/28)){
        var y = yb
          + Math.sin((x*0.006)+seed)*amp
          + Math.sin((x*0.017)+seed*2)*amp*0.5
          - layer*10;
        pts.push([x,y]);
      }
      hillPaths.push(pts);
    }
  }
  function drawBackground(dt){
    // sky
    var sg = lg(0,0,0,H);
    sg.addColorStop(0, PAL.skyTop);
    sg.addColorStop(0.55, PAL.skyMid);
    sg.addColorStop(1, PAL.skyBot);
    ctx.fillStyle = sg; ctx.fillRect(0,0,W,H);

    // horizon glow
    var hy = H*0.66;
    var hgl = rg(W*0.5, hy, 10, W*0.5, hy, W*0.7);
    hgl.addColorStop(0, PAL.horizon);
    hgl.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hgl; ctx.fillRect(0,0,W,H);

    // hills
    for(var l=0;l<hillPaths.length;l++){
      var pts = hillPaths[l];
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.lineTo(W+20, H+20); ctx.lineTo(-20, H+20); ctx.closePath();
      ctx.fillStyle = PAL.hills[l];
      ctx.globalAlpha = 1;
      ctx.fill();
    }

    // fog banks
    var pwCalm = pwActive ? 0.4 : 1;
    for(var f=0;f<fogBanks.length;f++){
      var b = fogBanks[f];
      b.x += b.vx*dt*(pwActive?0.4:1);
      if(b.x < -b.r) b.x = W+b.r;
      if(b.x > W+b.r) b.x = -b.r;
      var fg = rg(b.x, b.y, 1, b.x, b.y, b.r);
      var col = PAL.fog;
      var aa = PAL.fogA*b.a*pwCalm;
      fg.addColorStop(0, 'rgba('+col[0]+','+col[1]+','+col[2]+','+aa+')');
      fg.addColorStop(1, 'rgba('+col[0]+','+col[1]+','+col[2]+',0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    }

    // motes
    for(var mI=0;mI<motes.length;mI++){
      var mo = motes[mI];
      mo.x += mo.vx*dt; mo.y += mo.vy*dt;
      if(mo.y < -4){ mo.y = H+4; mo.x = rand(0,W); }
      if(mo.x < -4) mo.x = W+4; if(mo.x>W+4) mo.x=-4;
      ctx.globalAlpha = mo.a*(pwActive?1.4:1);
      ctx.fillStyle = PAL.mote;
      ctx.beginPath(); ctx.arc(mo.x,mo.y,mo.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawVignette(){
    var vg = rg(W*0.5,H*0.5, H*0.2, W*0.5, H*0.5, H*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,'+PAL.vignette+')');
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  }

  // ---------------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------------
  var state = 'title'; // title | playing | over
  var score=0, sorted=0, lives=3, combo=0, bestCombo=0, mult=1;
  var flow=0, pwActive=false, pwTime=0, level=1;
  var sessionBest = 0;
  var gameT=0, spawnTimer=0, hitStop=0, shake=0, flash=0, flashCol='255,80,80';
  var pwFlash=0;
  var dragTok=null, pointerId=null;
  var demoTokens=[];
  var startFadeHint=0;

  function resetGame(){
    tokens.length=0; parts.length=0; floats.length=0;
    score=0; sorted=0; lives=3; combo=0; bestCombo=0; mult=1;
    flow=0; pwActive=false; pwTime=0; level=1;
    gameT=0; spawnTimer=0; hitStop=0; shake=0; flash=0; pwFlash=0;
    dragTok=null;
    rebuildSlots(3);
    updateHUD();
    renderLives();
    startFadeHint = 4.5;
  }

  function startGame(){
    audioInit();
    try{ if(actx && actx.state==='suspended') actx.resume(); }catch(e){}
    resetGame();
    state='playing';
    titleScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    document.getElementById('hud').setAttribute('aria-hidden','false');
    // first token immediately for instant clarity
    spawnToken();
    sfx('level');
    haptic(12);
  }

  function endGame(){
    state='over';
    dragTok=null;
    if(bestCombo>sessionBest){ sessionBest=bestCombo; showNewBest(true); } else showNewBest(false);
    $('finalScore').textContent = score;
    $('finalSorted').textContent = sorted;
    $('finalBest').textContent = Math.max(sessionBest,bestCombo);
    overScreen.classList.remove('hidden');
    haptic([30,40,30]);
  }
  function showNewBest(on){
    var el=$('newbest'); if(!el) return;
    if(on) el.classList.add('on'); else el.classList.remove('on');
  }

  // ---------------------------------------------------------------------------
  // Scoring events
  // ---------------------------------------------------------------------------
  function onCorrect(tk, slot){
    combo++; if(combo>bestCombo) bestCombo=combo;
    mult = 1 + Math.floor(combo/5);
    if(mult>9) mult=9;
    var gain = (10 + Math.floor((1-tk.life)*0) ) * mult * (pwActive?2:1);
    // bonus for sorting while fresh
    gain += Math.round(tk.life*6)*mult;
    score += gain;
    sorted++;
    // flow
    if(!pwActive){
      flow = clamp(flow + 0.16, 0, 1);
      if(flow>=1){ enterPasswordless(); }
    }
    // fx
    slot.pulse = 1; slot.matchGlow = 1;
    var t = typeById(tk.type);
    burst(slot.cx, slot.cy - slot.h*0.1, t.c, 16, {spMin:80,spMax:300,sMin:2,sMax:5, up:40});
    burst(slot.cx, slot.cy - slot.h*0.1, t.c2, 8, {spMin:40,spMax:150,sMin:1,sMax:3});
    floatText(slot.cx, slot.cy - slot.h*0.7, '+'+gain, t.c);
    hitStop = Math.max(hitStop, 0.05);
    shake = Math.min(shake+2, 6);
    flash = 0.25; flashCol = hexToRGB(t.c).join(',');
    sfx(mult>=3||pwActive?'great':'good');
    haptic(pwActive?[8,10,8]:10);
    // remove token with a quick collapse animation
    tk.dead=true; tk.scale=1; tk.deadTo=slot; tk.deadT=0;
    maybeLevelUp();
    updateHUD();
  }
  function onWrong(tk, slot){
    combo=0; mult=1;
    flow = clamp(flow-0.5, 0, 1);
    tk.life *= 0.5;
    // eject away from slot
    var ang = Math.atan2(tk.y-slot.cy, tk.x-slot.cx);
    tk.vx = Math.cos(ang)*260; tk.vy = Math.sin(ang)*260 - 120;
    tk.spin *= 2.2;
    slot.wrongGlow = 1;
    shake = Math.min(shake+7, 12);
    flash = 0.4; flashCol='240,80,80';
    burst(slot.cx, slot.cy, 'rgba(240,90,90,1)', 10, {spMin:40,spMax:160});
    sfx('bad'); haptic([20,30,20]);
    updateHUD();
  }
  function onExpire(tk){
    lives--; combo=0; mult=1;
    flow = clamp(flow-0.4,0,1);
    burst(tk.x, tk.y, PAL.dark?'#c9d3d8':'#8a969e', 20, {spMin:60,spMax:260,shard:true,grav:520,sMin:2,sMax:5});
    burst(tk.x, tk.y, typeById(tk.type).c, 8, {spMin:30,spMax:120});
    shake = Math.min(shake+9,14);
    flash = 0.5; flashCol='240,80,80';
    sfx('shatter'); haptic([30,50,30]);
    renderLives();
    updateHUD();
    if(lives<=0){ endGame(); }
  }
  function maybeLevelUp(){
    var newLevel = 1 + Math.floor(sorted/5);
    if(newLevel>level){
      level = newLevel;
      var wantSlots = 3;
      if(sorted>=6) wantSlots=4;
      if(sorted>=14) wantSlots=5;
      if(wantSlots>slots.length){
        rebuildSlots(wantSlots);
        var ns = slots[slots.length-1]; if(ns) ns.intro=1;
        sfx('level');
        banner('LAYER '+level, typeById(slots[slots.length-1].type).label+' SLOT ADDED');
      }
    }
  }
  function enterPasswordless(){
    pwActive=true; pwTime=6.0; pwFlash=1;
    banner('PASSWORDLESS', 'slow spins · 2× score');
    sfx('pw'); haptic([10,20,10,20,10]);
  }
  function exitPasswordless(){
    pwActive=false; flow=0; pwFlash=0.6;
    sfx('pwEnd');
  }

  // ---------------------------------------------------------------------------
  // Banner
  // ---------------------------------------------------------------------------
  var bannerTO=null;
  function banner(big, small){
    bannerEl.querySelector('.big').textContent = big;
    bannerEl.querySelector('.small').textContent = small||'';
    bannerEl.classList.add('show');
    if(bannerTO) clearTimeout(bannerTO);
    bannerTO = setTimeout(function(){ bannerEl.classList.remove('show'); }, 1400);
  }

  // ---------------------------------------------------------------------------
  // HUD updates
  // ---------------------------------------------------------------------------
  function updateHUD(){
    scoreEl.textContent = score;
    if(mult>1){ multEl.textContent = '×'+mult; multEl.classList.add('on'); }
    else { multEl.classList.remove('on'); }
    var f = pwActive ? (pwTime/6) : flow;
    flowBar.style.width = Math.round(clamp(f,0,1)*100)+'%';
    flowBar.style.background = pwActive ? '#f4b45c' : 'var(--accent)';
    $('flowLbl').textContent = pwActive ? 'PASSWORDLESS' : 'FLOW';
  }
  function renderLives(){
    var html='';
    for(var i=0;i<3;i++){
      var lost = i>=lives;
      html += '<span class="life'+(lost?' lost':'')+'">'+lockSVG()+'</span>';
    }
    livesEl.innerHTML = html;
  }
  function lockSVG(){
    var col = 'currentColor';
    return '<svg viewBox="0 0 24 30" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'
      +'<rect x="3" y="12" width="18" height="15" rx="3.2" fill="rgba(127,127,127,0.14)"/>'
      +'<path d="M7 12 V8.5 a5 5 0 0 1 10 0 V12"/>'
      +'<circle cx="12" cy="19" r="1.7" fill="'+col+'" stroke="none"/></svg>';
  }
  function renderLegend(){
    var el=$('legend'); if(!el) return;
    var html='';
    for(var i=0;i<3;i++){
      var t=TYPES[i];
      html+='<span class="chip">'+chipSVG(t)+t.label+'</span>';
    }
    el.innerHTML=html;
  }
  function chipSVG(t){
    // small canvas-free svg-ish: use inline svg with a colored circle + simple mark
    var c=t.c;
    var inner='';
    if(t.id==='passkey') inner='<circle cx="6.5" cy="8" r="3.2"/><path d="M9.5 8 H14 M12.5 8 V11 M14 8 V10.5"/>';
    else if(t.id==='password') inner='<circle cx="4.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="11.5" cy="8" r="1.3"/>';
    else if(t.id==='face') inner='<path d="M4 9 a5 5 0 0 1 8 0" /><path d="M5.5 9.5 a3.2 3.2 0 0 1 5 0"/><circle cx="8" cy="9.5" r="0.9"/>';
    return '<svg viewBox="0 0 16 16" fill="'+c+'" stroke="'+c+'" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
  }

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------
  function canvasPos(e){
    var rect = canvas.getBoundingClientRect();
    var cx = (e.clientX!=null)? e.clientX : (e.touches&&e.touches[0]?e.touches[0].clientX:0);
    var cy = (e.clientY!=null)? e.clientY : (e.touches&&e.touches[0]?e.touches[0].clientY:0);
    return { x: cx-rect.left, y: cy-rect.top };
  }
  function pickToken(x,y){
    var best=null, bd=1e9;
    for(var i=tokens.length-1;i>=0;i--){
      var tk=tokens[i]; if(tk.dead) continue;
      var dx=tk.x-x, dy=tk.y-y; var d=Math.sqrt(dx*dx+dy*dy);
      if(d < tk.r+14 && d<bd){ bd=d; best=tk; }
    }
    return best;
  }
  function onDown(e){
    try{
      if(state!=='playing') return;
      var p = canvasPos(e);
      var tk = pickToken(p.x,p.y);
      if(tk){
        dragTok = tk; tk.dragging=true;
        tk.grabDX = tk.x - p.x; tk.grabDY = tk.y - p.y;
        tk.vx=0; tk.vy=0;
        pointerId = e.pointerId!=null?e.pointerId:null;
        try{ if(pointerId!=null && canvas.setPointerCapture) canvas.setPointerCapture(pointerId); }catch(err){}
        sfx('pick'); haptic(6);
      }
      if(e.cancelable) e.preventDefault();
    }catch(err){ /* never throw from input */ }
  }
  function onMove(e){
    try{
      if(state!=='playing' || !dragTok) return;
      var p = canvasPos(e);
      dragTok.tx = p.x + dragTok.grabDX;
      dragTok.ty = p.y + dragTok.grabDY;
      dragTok.hasTarget = true;
      updateSlotHover(dragTok);
      if(e.cancelable) e.preventDefault();
    }catch(err){}
  }
  function onUp(e){
    try{
      if(!dragTok){ return; }
      var tk = dragTok;
      var slot = findDropSlot(tk);
      dragTok=null; tk.dragging=false; tk.hasTarget=false;
      clearSlotHover();
      if(slot){
        if(slot.type===tk.type) onCorrect(tk, slot);
        else onWrong(tk, slot);
      }
      try{ if(pointerId!=null && canvas.releasePointerCapture) canvas.releasePointerCapture(pointerId); }catch(err){}
      pointerId=null;
      if(e && e.cancelable) e.preventDefault();
    }catch(err){ dragTok=null; }
  }
  function updateSlotHover(tk){
    var target = findDropSlot(tk);
    for(var i=0;i<slots.length;i++){
      var s=slots[i];
      var on = (s===target);
      if(on && s.type===tk.type) s.matchGlow = Math.min(1, s.matchGlow+0.4);
      else if(on) s.wrongGlow = Math.min(1, s.wrongGlow+0.4);
    }
  }
  function clearSlotHover(){ /* glows decay in update */ }
  function findDropSlot(tk){
    var x = tk.hasTarget? tk.tx : tk.x;
    var y = tk.hasTarget? tk.ty : tk.y;
    // must be dropped low enough to count (near slot band) OR overlapping a slot
    var best=null, bd=1e9;
    for(var i=0;i<slots.length;i++){
      var s=slots[i];
      // inside rect?
      if(x>=s.x-6 && x<=s.x+s.w+6 && y>=s.cy-s.h/2-6 && y<=H){ return s; }
      var dx = x-s.cx, dy=y-s.cy; var d=Math.sqrt(dx*dx+dy*dy);
      if(d<bd){ bd=d; best=s; }
    }
    // near-slot snapping if in lower third
    if(best && y > slotTop-60 && bd < best.w*0.85){ return best; }
    return null;
  }

  // keyboard
  function routeUrgent(idx){
    if(state!=='playing') return;
    if(idx<0 || idx>=slots.length) return;
    // most urgent non-dragging token
    var best=null, bl=2;
    for(var i=0;i<tokens.length;i++){
      var tk=tokens[i]; if(tk.dead||tk.dragging) continue;
      if(tk.life<bl){ bl=tk.life; best=tk; }
    }
    if(!best) return;
    var slot = slots[idx];
    if(slot.type===best.type) onCorrect(best, slot);
    else onWrong(best, slot);
  }
  function onKey(e){
    try{
      var k = e.key;
      if(state==='title' && (k==='Enter'||k===' ')){ startGame(); e.preventDefault(); return; }
      if(state==='over' && (k==='Enter'||k===' ')){ startGame(); e.preventDefault(); return; }
      if(state==='playing'){
        if(k>='1' && k<='9'){ routeUrgent(parseInt(k,10)-1); e.preventDefault(); }
        else if(k==='m'||k==='M'){ toggleMute(); }
      }
    }catch(err){}
  }

  // ---------------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------------
  function update(dt){
    gameT += dt;

    // hit stop
    if(hitStop>0){ hitStop-=dt; }
    var simDt = hitStop>0 ? 0 : dt;

    // decay slot glows/pulses/intros
    for(var i=0;i<slots.length;i++){
      var s=slots[i];
      s.matchGlow = Math.max(0, s.matchGlow - dt*4);
      s.wrongGlow = Math.max(0, s.wrongGlow - dt*3);
      s.pulse = Math.max(0, s.pulse - dt*2);
      if(s.intro>0) s.intro = Math.max(0, s.intro - dt*2.2);
    }
    if(flash>0) flash = Math.max(0, flash - dt*1.6);
    if(pwFlash>0) pwFlash = Math.max(0, pwFlash - dt*1.2);
    if(shake>0) shake = Math.max(0, shake - dt*24);
    if(startFadeHint>0) startFadeHint = Math.max(0, startFadeHint - dt);

    if(state==='playing'){
      // passwordless timer
      if(pwActive){
        pwTime -= dt;
        if(pwTime<=0){ exitPasswordless(); }
        updateHUD();
      }

      // spawn
      if(simDt>0){
        spawnTimer -= simDt;
        if(spawnTimer<=0 && tokens.length < curMaxTokens()){
          spawnToken();
          spawnTimer = curSpawnInterval();
        }
      }

      // tokens
      for(var t=tokens.length-1;t>=0;t--){
        var tk=tokens[t];
        tk.appear = Math.min(1, tk.appear + dt*3.2);
        if(tk.dead){
          tk.deadT += dt*6;
          // collapse toward slot
          if(tk.deadTo){ tk.x = lerp(tk.x, tk.deadTo.cx, 0.35); tk.y = lerp(tk.y, tk.deadTo.cy - tk.deadTo.h*0.1, 0.35); }
          tk.scale = Math.max(0, 1 - tk.deadT);
          tk.rot += dt*10;
          if(tk.scale<=0.01){ tokens.splice(t,1); }
          continue;
        }
        var spinMul = pwActive?0.28:1;
        tk.rot += tk.spin*spinMul*simDt;
        if(tk.dragging){
          // ease to target
          if(tk.hasTarget){
            tk.x = lerp(tk.x, tk.tx, 0.55);
            tk.y = lerp(tk.y, tk.ty, 0.55);
          }
        } else {
          // physics (ejected) + settle + float
          tk.x += tk.vx*simDt; tk.y += tk.vy*simDt;
          tk.vx *= (1-2.6*simDt); tk.vy *= (1-2.6*simDt);
          tk.vy += 40*simDt; // slight gravity when ejected
          // keep in arena bounds
          var minX=tk.r+10, maxX=W-tk.r-10;
          if(tk.x<minX){ tk.x=minX; tk.vx=Math.abs(tk.vx)*0.5; }
          if(tk.x>maxX){ tk.x=maxX; tk.vx=-Math.abs(tk.vx)*0.5; }
          var minY=arenaTop+tk.r+6, maxY=arenaBot-tk.r+18;
          if(tk.y<minY){ tk.y=minY; tk.vy=Math.abs(tk.vy)*0.4; }
          if(tk.y>maxY){ tk.y=maxY; tk.vy=-Math.abs(tk.vy)*0.4; }
          // gentle bob when nearly settled
          if(Math.abs(tk.vx)<8 && Math.abs(tk.vy)<8){
            tk.bobPhase += simDt*1.5;
          }
          // expiry
          var rate = 1/Math.max(0.5,tk.lifeDur);
          if(pwActive) rate *= 0.4;
          tk.life -= rate*simDt;
          if(tk.life<=0){ tk.life=0; onExpire(tk); tokens.splice(t,1); continue; }
        }
      }
    } else {
      // title/over: keep a few demo tokens gently spinning behind panel
      updateDemo(dt);
    }

    // particles/floats advance in render
  }

  function updateDemo(dt){
    if(state!=='title') { demoTokens.length=0; return; }
    if(demoTokens.length<3){
      demoTokens.length=0;
      var xs=[0.20,0.50,0.80], baseY=Math.max(arenaTop+70, H*0.24);
      var rr=clamp(Math.min(W,H)*0.075,26,40);
      for(var i=0;i<3;i++){
        demoTokens.push({
          type:TYPES[i].id, x:W*xs[i], y:baseY, r:rr,
          rot:i*1.1, spin:(0.30+0.08*i)*(i%2?-1:1), life:1, appear:0.55,
          bobPhase:i*2.1, dragging:false, dead:false, baseY:baseY + (i===1?-14:6), scale:1
        });
      }
    }
    for(var d=0; d<demoTokens.length; d++){
      var tk=demoTokens[d];
      tk.rot += tk.spin*dt;
      tk.appear = Math.min(0.92, tk.appear+dt);
      tk.bobPhase += dt*1.1;
      tk.y = tk.baseY + Math.sin(tk.bobPhase)*7;
      tk.life = 0.55 + 0.45*Math.sin(gameT*0.5 + d*1.3);
    }
  }

  // ---------------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------------
  function render(dt){
    if(!ctx) return;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.save();
    // screen shake
    if(shake>0.1){
      var sx = (Math.random()*2-1)*shake, sy=(Math.random()*2-1)*shake;
      ctx.translate(sx,sy);
    }

    drawBackground(dt);

    // slot band frosted panel backdrop
    drawSlotPanel();
    drawSlots();

    // draw tokens (non-dragging first, dragging on top)
    if(state==='playing'){
      for(var i=0;i<tokens.length;i++){ if(!tokens[i].dragging) drawToken(tokens[i]); }
      for(var j=0;j<tokens.length;j++){ if(tokens[j].dragging) drawToken(tokens[j]); }
      // urgent focus ring for keyboard
      drawUrgentFocus();
      // starting hint
      if(startFadeHint>0 && sorted===0) drawStartHint();
    } else {
      for(var d=0; d<demoTokens.length; d++) drawToken(demoTokens[d]);
    }

    drawParts(dt);
    drawFloats(dt);

    // passwordless cool overlay
    if(pwActive || pwFlash>0){
      var a = pwActive? 0.10 : pwFlash*0.14;
      ctx.fillStyle = 'rgba(120,200,220,'+a+')';
      ctx.fillRect(0,0,W,H);
    }
    // damage/success flash
    if(flash>0){
      ctx.fillStyle = 'rgba('+flashCol+','+(flash*0.28)+')';
      ctx.fillRect(0,0,W,H);
    }

    drawVignette();
    ctx.restore();
  }

  function drawSlotPanel(){
    if(!slots.length) return;
    var pad=8;
    var x = slots[0].x - pad;
    var y = slotTop - 10;
    var w = (slots[slots.length-1].x + slots[slots.length-1].w) - slots[0].x + pad*2;
    var h = slotH + 20;
    ctx.save();
    ctx.globalAlpha = 0.9;
    roundRectPath(ctx, x, y, w, h, 22);
    var pg = lg(0,y,0,y+h);
    pg.addColorStop(0, PAL.dark?'rgba(18,32,40,0.30)':'rgba(255,255,255,0.32)');
    pg.addColorStop(1, PAL.dark?'rgba(10,20,26,0.18)':'rgba(230,240,242,0.16)');
    ctx.fillStyle = pg; ctx.fill();
    ctx.restore();
  }

  function drawUrgentFocus(){
    if(!showKeyHints) return;
    var best=null, bl=2;
    for(var i=0;i<tokens.length;i++){ var tk=tokens[i]; if(tk.dead||tk.dragging) continue; if(tk.life<bl){ bl=tk.life; best=tk; } }
    if(!best) return;
    ctx.save();
    ctx.strokeStyle = PAL.dark?'rgba(255,255,255,0.55)':'rgba(20,40,50,0.5)';
    ctx.setLineDash([4,5]); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(best.x,best.y, best.r*1.42, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawStartHint(){
    // arrow from the freshest token to its matching slot
    var tk = tokens[0]; if(!tk) return;
    var slot=null; for(var i=0;i<slots.length;i++){ if(slots[i].type===tk.type){ slot=slots[i]; break; } }
    if(!slot) return;
    var a = clamp(startFadeHint/4.5,0,1) * (0.5+0.5*Math.sin(gameT*4));
    ctx.save();
    ctx.globalAlpha = a*0.9;
    ctx.strokeStyle = typeById(tk.type).c;
    ctx.setLineDash([2,8]); ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(tk.x, tk.y+tk.r+6);
    var mx=(tk.x+slot.cx)/2, my=(tk.y+slot.cy)/2 + 30;
    ctx.quadraticCurveTo(mx,my, slot.cx, slot.cy - slot.h*0.5 - 6);
    ctx.stroke();
    ctx.globalAlpha=a;
    ctx.fillStyle = PAL.text;
    ctx.font='600 12px '+MONO; ctx.textAlign='center';
    ctx.fillText('DRAG TO MATCH', (tk.x+slot.cx)/2, my-6);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Main loop (guarded)
  // ---------------------------------------------------------------------------
  var last = 0, rafBroken=false;
  function frame(ts){
    try{
      if(!last) last = ts;
      var dt = (ts-last)/1000; last = ts;
      if(dt>0.05) dt=0.05; if(dt<0) dt=0;
      update(dt);
      render(dt);
    }catch(err){
      // Never let a bad frame become an uncaught error.
      if(!rafBroken){ rafBroken=true; try{ console.warn('frame error handled:', err && err.message); }catch(e){} }
    }
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------------------
  // Resize
  // ---------------------------------------------------------------------------
  function resize(){
    try{
      DPR = Math.min(window.devicePixelRatio||1, 2.5);
      W = Math.max(1, Math.floor(canvas.clientWidth || window.innerWidth));
      H = Math.max(1, Math.floor(canvas.clientHeight || window.innerHeight));
      canvas.width = Math.floor(W*DPR);
      canvas.height = Math.floor(H*DPR);
      if(ctx) ctx.setTransform(DPR,0,0,DPR,0,0);
      computeLayout();
      buildHills();
      // keep tokens inside
      for(var i=0;i<tokens.length;i++){
        tokens[i].x = clamp(tokens[i].x, tokens[i].r+10, W-tokens[i].r-10);
        tokens[i].y = clamp(tokens[i].y, arenaTop+tokens[i].r+6, arenaBot);
      }
    }catch(e){}
  }

  // ---------------------------------------------------------------------------
  // Mute
  // ---------------------------------------------------------------------------
  var SPK_ON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var SPK_OFF = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
  function setSoundIcon(){ soundBtn.innerHTML = muted ? SPK_OFF : SPK_ON; soundBtn.style.opacity = muted? '0.5':'1'; }
  function toggleMute(){
    muted = !muted;
    setSoundIcon();
    if(!muted){ audioInit(); try{ if(actx&&actx.state==='suspended') actx.resume(); }catch(e){} }
  }

  // ---------------------------------------------------------------------------
  // Wire up
  // ---------------------------------------------------------------------------
  function bind(){
    startBtn.addEventListener('click', function(e){ e.preventDefault(); startGame(); });
    restartBtn.addEventListener('click', function(e){ e.preventDefault(); startGame(); });
    soundBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); toggleMute(); });

    // pointer events (unified mouse/touch)
    canvas.addEventListener('pointerdown', onDown, {passive:false});
    canvas.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp, {passive:false});
    canvas.addEventListener('pointercancel', onUp, {passive:false});
    // touch fallback (older browsers without pointer events)
    if(!window.PointerEvent){
      canvas.addEventListener('touchstart', function(e){ onDown(mapTouch(e)); }, {passive:false});
      canvas.addEventListener('touchmove', function(e){ onMove(mapTouch(e)); }, {passive:false});
      window.addEventListener('touchend', function(e){ onUp(e); }, {passive:false});
    }
    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
  }
  function mapTouch(e){
    var t = e.touches&&e.touches[0] ? e.touches[0] : (e.changedTouches&&e.changedTouches[0]);
    return { clientX: t?t.clientX:0, clientY: t?t.clientY:0, cancelable:e.cancelable, preventDefault:function(){ if(e.cancelable) e.preventDefault(); }, pointerId:null };
  }

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------
  function boot(){
    try{
      resize();
      rebuildSlots(3);
      renderLegend();
      renderLives();
      setSoundIcon();
      updateHUD();
      initBackground();
      bind();
      requestAnimationFrame(frame);
    }catch(e){
      try{ console.warn('boot issue:', e && e.message); }catch(_){}
      // even if boot partially fails, ensure buttons still start the game
    }
  }
  boot();

  // Read-only introspection hook (no storage / no network). Handy for debugging
  // and automated harnesses; never mutates game state.
  try{
    window.FOGLOCK = {
      get state(){ return state; },
      get tokens(){ return tokens; },
      get slots(){ return slots; },
      get score(){ return score; },
      get combo(){ return combo; },
      get pw(){ return pwActive; },
      rect:function(){ return canvas.getBoundingClientRect(); }
    };
  }catch(e){}

})();
</script>
</body>
