<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 Forecast</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #05060d;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: light) {
    body, html { background-color: #e0e8f0; }
}

#game-container {
    position: relative;
    width: 100%;
    height: 100%;
}

#game-canvas {
    display: block;
    width: 100%;
    height: 100dvh;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

#ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.screen {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(10, 13, 26, 0.85);
    color: #fff;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    text-align: center;
    max-width: 90%;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
@media (prefers-color-scheme: light) {
    .screen {
        background: rgba(255, 255, 255, 0.85);
        color: #111;
        border: 1px solid rgba(0,0,0,0.1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
}

h1 { font-size: 1.8rem; margin-bottom: 10px; letter-spacing: 2px; }
h2 { font-size: 1.5rem; margin-bottom: 10px; color: #ff5555; }
p { font-size: 1rem; opacity: 0.8; margin-bottom: 20px; line-height: 1.4; }

.shape-icons {
    display: flex;
    gap: 15px;
    margin: 10px 0 20px 0;
}
.shape-icons span {
    display: inline-block;
}
.s-cyan { width: 20px; height: 20px; background: rgb(0,229,255); }
.s-green { 
    width: 0; height: 0; 
    border-left: 12px solid transparent; 
    border-right: 12px solid transparent; 
    border-bottom: 20px solid rgb(57,255,20);
}
.s-orange { width: 20px; height: 20px; background: rgb(255,136,0); border-radius: 50%; }

@media (prefers-color-scheme: light) {
    .s-cyan { background: rgb(0,136,204); }
    .s-green { border-bottom-color: rgb(17,170,51); }
    .s-orange { background: rgb(238,85,0); }
}

button {
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: bold;
    padding: 15px 30px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    min-height: 50px;
    min-width: 200px;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: transform 0.1s;
}
button:active { transform: scale(0.95); }
@media (prefers-color-scheme: light) {
    button { background: #111; color: #fff; }
}

#hud {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 2rem;
    font-weight: bold;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    z-index: 10;
}
@media (prefers-color-scheme: light) {
    #hud { color: #111; text-shadow: 0 2px 4px rgba(255,255,255,0.5); }
}
</style>
</head>
<body>

<div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <div id="hud" style="display: none;">
        <span id="score-display">0</span>
    </div>
    
    <div id="ui-layer">
        <div id="start-screen" class="screen">
            <h1>2026 FORECAST</h1>
            <p>Flick timeline orbs into matching futures.<br>Don't let the year collapse.<br><br><small>(Swipe up to flick, or press 1, 2, 3)</small></p>
            <div class="shape-icons">
                <span class="s-cyan"></span>
                <span class="s-green"></span>
                <span class="s-orange"></span>
            </div>
            <button data-smoke="start">START PREDICTION</button>
        </div>
        
        <div id="game-over-screen" class="screen" style="display: none;">
            <h2>TIMELINE COLLAPSED</h2>
            <p id="final-score">Fragments collected: 0</p>
            <button data-smoke="restart">RETRY FORECAST</button>
        </div>
    </div>
</div>

<script>
try {
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    let theme = getTheme();

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        isDarkMode = e.matches;
        theme = getTheme();
        if (targets.length > 0) {
            targets[0].color = theme.colors[0];
            targets[1].color = theme.colors[1];
            targets[2].color = theme.colors[2];
        }
        if (currentOrb) {
            currentOrb.color = theme.colors[currentOrb.type];
        }
    });

    function getTheme() {
        return {
            bgTop: isDarkMode ? '#0a0d1a' : '#d0e0ea',
            bgBottom: isDarkMode ? '#05060d' : '#e0e8f0',
            textRaw: isDarkMode ? '255, 255, 255' : '0, 0, 0',
            stars: isDarkMode ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.2)',
            colors: [
                isDarkMode ? '0,229,255' : '0,136,204',
                isDarkMode ? '57,255,20' : '17,170,51',
                isDarkMode ? '255,136,0' : '238,85,0'
            ]
        };
    }

    let gameState = 'START';
    let score = 0;
    let timer = 100;
    let maxTimer = 100;

    let currentOrb = null;
    let targets = [];
    let particles = [];
    let stars = [];
    let trail = [];
    
    let lastTime = 0;

    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const scoreDisplay = document.getElementById('score-display');
    const finalScore = document.getElementById('final-score');
    const startBtn = document.querySelector('[data-smoke="start"]');
    const restartBtn = document.querySelector('[data-smoke="restart"]');

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initStars();
        if (gameState === 'PLAYING') {
            setupTargets();
            if (currentOrb && !currentOrb.inFlight) {
                currentOrb.y = canvas.height - currentOrb.radius - 80;
                currentOrb.baseY = currentOrb.y;
            }
        }
    }
    window.addEventListener('resize', resize);
    resize();

    function initStars() {
        stars = [];
        const numStars = 60;
        for (let i=0; i<numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: 0.1 + Math.random() * 0.4,
                size: Math.random() * 2 + 0.5
            });
        }
    }

    function startGame() {
        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        hud.style.display = 'block';
        
        gameState = 'PLAYING';
        score = 0;
        timer = maxTimer;
        particles = [];
        trail = [];
        scoreDisplay.innerText = score;
        
        setupTargets();
        spawnNextOrb();
        
        if (lastTime === 0) {
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }
    }

    function gameOver() {
        gameState = 'GAME_OVER';
        hud.style.display = 'none';
        gameOverScreen.style.display = 'flex';
        finalScore.innerText = `Fragments collected: ${score}`;
        navigator.vibrate?.([200, 100, 200]);
    }

    function setupTargets() {
        targets = [];
        const numTargets = 3;
        const spacing = canvas.width / (numTargets + 1);
        const radius = Math.min(canvas.width * 0.12, 45);
        
        for (let i = 0; i < numTargets; i++) {
            targets.push({
                x: spacing * (i + 1),
                y: canvas.height * 0.18 + (i === 1 ? -25 : 0),
                radius: radius,
                type: i,
                color: theme.colors[i]
            });
        }
    }

    function spawnNextOrb() {
        const type = Math.floor(Math.random() * 3);
        const radius = Math.min(canvas.width * 0.08, 30);
        currentOrb = {
            x: canvas.width / 2,
            y: canvas.height - radius - 100,
            baseX: canvas.width / 2,
            baseY: canvas.height - radius - 100,
            vx: 0,
            vy: 0,
            radius: radius,
            type: type,
            color: theme.colors[type],
            inFlight: false,
            wobble: 0
        };
        trail = [];
    }

    let touchHistory = [];
    let isDragging = false;
    let dragId = null;

    canvas.addEventListener('pointerdown', (e) => {
        try {
            if (gameState !== 'PLAYING') return;
            if (currentOrb && !currentOrb.inFlight) {
                if (e.clientY > canvas.height * 0.3) {
                    isDragging = true;
                    dragId = e.pointerId;
                    touchHistory = [{x: e.clientX, y: e.clientY, t: performance.now()}];
                    currentOrb.x = Math.max(currentOrb.radius, Math.min(canvas.width - currentOrb.radius, e.clientX));
                    currentOrb.y = Math.max(canvas.height * 0.4, Math.min(canvas.height - currentOrb.radius, e.clientY));
                    canvas.setPointerCapture(dragId);
                }
            }
        } catch(err) {}
    });

    canvas.addEventListener('pointermove', (e) => {
        try {
            if (!isDragging || e.pointerId !== dragId) return;
            e.preventDefault();
            
            currentOrb.x = Math.max(currentOrb.radius, Math.min(canvas.width - currentOrb.radius, e.clientX));
            currentOrb.y = Math.max(canvas.height * 0.4, Math.min(canvas.height - currentOrb.radius, e.clientY));
            
            touchHistory.push({x: e.clientX, y: e.clientY, t: performance.now()});
            if (touchHistory.length > 10) touchHistory.shift();
        } catch(err) {}
    });

    canvas.addEventListener('pointerup', (e) => {
        try {
            if (!isDragging || e.pointerId !== dragId) return;
            e.preventDefault();
            isDragging = false;
            canvas.releasePointerCapture(dragId);
            
            touchHistory.push({x: e.clientX, y: e.clientY, t: performance.now()});
            
            const now = performance.now();
            let oldPoint = touchHistory[0];
            for (let i = touchHistory.length - 1; i >= 0; i--) {
                if (now - touchHistory[i].t > 100) {
                    oldPoint = touchHistory[i];
                    break;
                }
            }
            
            const dt = now - oldPoint.t;
            if (dt > 10) {
                const dx = e.clientX - oldPoint.x;
                const dy = e.clientY - oldPoint.y;
                
                let vx = dx / dt;
                let vy = dy / dt;
                
                const mult = 2.0; 
                vx *= mult;
                vy *= mult;
                
                const maxSpeed = canvas.height * 0.008; 
                const speed = Math.sqrt(vx*vx + vy*vy);
                if (speed > maxSpeed) {
                    vx = (vx / speed) * maxSpeed;
                    vy = (vy / speed) * maxSpeed;
                }
                
                if (vy < -0.3) {
                    currentOrb.inFlight = true;
                    currentOrb.vx = vx;
                    currentOrb.vy = vy;
                    navigator.vibrate?.(10);
                } else {
                    currentOrb.x = currentOrb.baseX;
                    currentOrb.y = currentOrb.baseY;
                }
            } else {
                currentOrb.x = currentOrb.baseX;
                currentOrb.y = currentOrb.baseY;
            }
        } catch(err) {}
    });

    canvas.addEventListener('pointercancel', (e) => {
        try {
            if (!isDragging || e.pointerId !== dragId) return;
            isDragging = false;
            currentOrb.x = currentOrb.baseX;
            currentOrb.y = currentOrb.baseY;
        } catch(err) {}
    });

    window.addEventListener('keydown', (e) => {
        try {
            if (gameState !== 'PLAYING') return;
            if (currentOrb && !currentOrb.inFlight) {
                let targetIdx = -1;
                if (e.key === '1') targetIdx = 0;
                if (e.key === '2') targetIdx = 1;
                if (e.key === '3') targetIdx = 2;
                
                if (targetIdx >= 0 && targetIdx < targets.length) {
                    const t = targets[targetIdx];
                    const dx = t.x - currentOrb.x;
                    const dy = t.y - currentOrb.y;
                    const flightTime = 350; 
                    const currentGravity = (canvas.height * 0.0000035) * (1 + score * 0.04);
                    
                    const vx = dx / flightTime;
                    const vy = (dy - 0.5 * currentGravity * flightTime * flightTime) / flightTime;
                    
                    currentOrb.vx = vx;
                    currentOrb.vy = vy;
                    currentOrb.inFlight = true;
                    navigator.vibrate?.(10);
                }
            }
        } catch(err) {}
    });

    function createParticles(x, y, colorStr, isSuccess) {
        const num = isSuccess ? 25 : 15;
        for (let i = 0; i < num; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * (isSuccess ? 0.3 : 0.15);
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                decay: 0.01 + Math.random() * 0.02,
                size: Math.random() * 5 + 2,
                color: colorStr 
            });
        }
    }

    function updateGame(dt) {
        timer -= (dt / 1000) * 8; 
        timer -= (dt / 1000) * (score * 0.3); 
        
        if (timer <= 0) {
            gameOver();
            return;
        }

        if (currentOrb && currentOrb.inFlight) {
            const steps = 5;
            const subDt = dt / steps;
            const currentGravity = (canvas.height * 0.0000035) * (1 + score * 0.04);
            const targetShrink = Math.max(0.4, 1 - score * 0.02);
            
            let hit = false;
            
            for (let s = 0; s < steps; s++) {
                currentOrb.vy += currentGravity * subDt;
                currentOrb.x += currentOrb.vx * subDt;
                currentOrb.y += currentOrb.vy * subDt;
                
                if (currentOrb.x - currentOrb.radius < 0) {
                    currentOrb.x = currentOrb.radius;
                    currentOrb.vx *= -0.7;
                    navigator.vibrate?.(10);
                } else if (currentOrb.x + currentOrb.radius > canvas.width) {
                    currentOrb.x = canvas.width - currentOrb.radius;
                    currentOrb.vx *= -0.7;
                    navigator.vibrate?.(10);
                }
                
                for (let target of targets) {
                    const currentR = target.radius * targetShrink;
                    const dx = currentOrb.x - target.x;
                    const dy = currentOrb.y - target.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < currentR + currentOrb.radius * 0.6) {
                        hit = true;
                        if (target.type === currentOrb.type) {
                            score++;
                            scoreDisplay.innerText = score;
                            timer = Math.min(timer + 15, maxTimer);
                            createParticles(currentOrb.x, currentOrb.y, currentOrb.color, true);
                            navigator.vibrate?.([40, 40, 40]);
                        } else {
                            timer = Math.max(timer - 15, 0);
                            createParticles(currentOrb.x, currentOrb.y, isDarkMode ? '255,50,50' : '220,20,20', false);
                            navigator.vibrate?.([150]);
                        }
                        break;
                    }
                }
                if (hit) break;
            }
            
            if (hit) {
                spawnNextOrb();
            } else {
                trail.push({x: currentOrb.x, y: currentOrb.y});
                if (trail.length > 25) trail.shift();
                
                if (currentOrb.y > canvas.height + currentOrb.radius || currentOrb.y < -canvas.height * 2.5) {
                    timer = Math.max(timer - 10, 0);
                    createParticles(currentOrb.x, Math.max(0, Math.min(canvas.height, currentOrb.y)), '255,255,255', false);
                    navigator.vibrate?.([80]);
                    spawnNextOrb();
                }
            }
        } else if (currentOrb && !isDragging) {
            currentOrb.wobble += dt * 0.005;
            currentOrb.y = currentOrb.baseY + Math.sin(currentOrb.wobble) * 4;
        }
        
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= p.decay * (dt / 16);
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function drawGame(time) {
        const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grd.addColorStop(0, theme.bgTop);
        grd.addColorStop(1, theme.bgBottom);
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = theme.stars;
        for (let star of stars) {
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
            if (gameState === 'PLAYING') {
                star.y += star.speed + (score * 0.05);
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            }
        }
        
        ctx.fillStyle = `rgba(${theme.textRaw}, 0.1) !important`;
        ctx.fillStyle = `rgba(${theme.textRaw}, 0.1)`;
        ctx.font = `bold ${Math.min(canvas.width * 0.35, 200)}px ui-monospace, "SFMono-Regular", monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        let xOff = 0;
        if (gameState === 'PLAYING' && timer < 30) {
            xOff = (Math.random() - 0.5) * (30 - timer) * 0.4;
        }
        ctx.fillText('2026', canvas.width / 2 + xOff, canvas.height / 2);
        
        if (gameState === 'PLAYING') {
            const maxR = Math.max(canvas.width, canvas.height);
            const collapseRadius = Math.max(0, (maxR * 0.8) * (timer / maxTimer));
            
            ctx.strokeStyle = (timer < 30) ? 
                `rgba(255, 50, 50, ${0.4 + Math.abs(Math.sin(time*0.01))*0.4})` : 
                `rgba(${theme.textRaw}, 0.15)`;
            ctx.lineWidth = timer < 30 ? 4 : 2;
            
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, collapseRadius, 0, Math.PI * 2);
            ctx.stroke();
            
            const targetShrink = Math.max(0.4, 1 - score * 0.02);
            for (let target of targets) {
                const currentR = target.radius * targetShrink;
                ctx.strokeStyle = `rgb(${target.color})`;
                ctx.lineWidth = 4;
                ctx.setLineDash([12, 12]);
                ctx.lineDashOffset = -time * 0.04;
                ctx.beginPath();
                ctx.arc(target.x, target.y, currentR, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = `rgb(${target.color})`;
                ctx.beginPath();
                if (target.type === 0) { 
                    ctx.rect(target.x - 12, target.y - 12, 24, 24);
                } else if (target.type === 1) { 
                    ctx.moveTo(target.x, target.y - 14);
                    ctx.lineTo(target.x + 14, target.y + 10);
                    ctx.lineTo(target.x - 14, target.y + 10);
                    ctx.closePath();
                } else if (target.type === 2) { 
                    ctx.arc(target.x, target.y, 12, 0, Math.PI * 2);
                }
                ctx.fill();
            }
            
            if (trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                ctx.strokeStyle = `rgba(${currentOrb.color}, 0.4)`;
                ctx.lineWidth = currentOrb.radius * 0.9;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }
            
            if (currentOrb) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = `rgb(${currentOrb.color})`;
                ctx.fillStyle = `rgb(${currentOrb.color})`;
                ctx.beginPath();
                ctx.arc(currentOrb.x, currentOrb.y, currentOrb.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = isDarkMode ? '#000' : '#fff';
                ctx.beginPath();
                const tr = currentOrb.radius * 0.4;
                if (currentOrb.type === 0) { 
                    ctx.rect(currentOrb.x - tr, currentOrb.y - tr, tr*2, tr*2);
                } else if (currentOrb.type === 1) {
                    ctx.moveTo(currentOrb.x, currentOrb.y - tr*1.2);
                    ctx.lineTo(currentOrb.x + tr*1.2, currentOrb.y + tr*0.8);
                    ctx.lineTo(currentOrb.x - tr*1.2, currentOrb.y + tr*0.8);
                    ctx.closePath();
                } else if (currentOrb.type === 2) {
                    ctx.arc(currentOrb.x, currentOrb.y, tr, 0, Math.PI * 2);
                }
                ctx.fill();
            }
        }
        
        for (let p of particles) {
            ctx.fillStyle = `rgba(${p.color}, ${Math.max(0, p.life)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function gameLoop(time) {
        try {
            let dt = time - lastTime;
            if (dt > 100) dt = 16;
            lastTime = time;

            if (gameState === 'PLAYING') {
                updateGame(dt);
            }
            
            drawGame(time);
        } catch(e) {
            console.error(e);
        }
        requestAnimationFrame(gameLoop);
    }
    
    requestAnimationFrame((time) => {
        lastTime = time;
        gameLoop(time);
    });

} catch (err) {
    console.error("Initialization error:", err);
}
</script>
</body>
</html>
