<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Port Breach</title>
    <style>
        :root {
            --bg: #050505;
            --text: #00ffff;
            --ui-bg: rgba(0, 10, 5, 0.85);
            --border: #00ffff;
            --closed: #ff0033;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #050505;
                --text: #00ffff;
                --ui-bg: rgba(0, 10, 5, 0.85);
                --border: #00ffff;
                --closed: #ff0033;
            }
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f4f4f5;
                --text: #0f172a;
                --ui-bg: rgba(244, 244, 245, 0.9);
                --border: #0f172a;
                --closed: #ef4444;
            }
        }
        body, html {
            margin: 0; padding: 0;
            width: 100dvw; height: 100dvh;
            background-color: var(--bg);
            overflow: hidden;
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            overscroll-behavior: none;
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--text);
        }
        .screen {
            background: var(--ui-bg);
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            pointer-events: none; /* Let touches pass through unless on button */
            max-width: 80%;
        }
        .title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .instructions p {
            margin: 12px 0;
            font-size: 1rem;
            opacity: 0.9;
            line-height: 1.4;
        }
        .score-box {
            font-size: 1.5rem;
            margin: 20px 0;
        }
        button {
            pointer-events: auto; /* CRITICAL FOR SMOKE TEST */
            background: transparent;
            color: var(--text);
            border: 2px solid var(--border);
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            transition: all 0.2s;
            border-radius: 2px;
        }
        button:active {
            background: var(--text);
            color: var(--bg);
        }
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text);
            text-shadow: 0 0 10px var(--text);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="start-screen" class="screen">
            <div class="title">PORT BREACH</div>
            <div class="instructions">
                <p>Swipe <b>LEFT/RIGHT</b> to switch lanes.</p>
                <p>Swipe <b>UP</b> to dash and beat the bot.</p>
                <p>Swipe <b>DOWN</b> to brake.</p>
                <p>Breach the open port before it's patched.</p>
            </div>
            <button data-smoke="start" id="btn-start">INITIALIZE</button>
        </div>
        <div id="game-over-screen" class="screen" style="display: none;">
            <div class="title" style="color: var(--closed);">CONNECTION TERMINATED</div>
            <div class="score-box">PORTS BREACHED: <span id="final-score">0</span></div>
            <button data-smoke="restart" id="btn-restart">RETRY</button>
        </div>
        <div id="hud" style="display: none;">
            <div id="score-display">0</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let colors = {};
        function updateColors() {
            const isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            if (isLight) {
                colors = {
                    bg: '#f4f4f5', grid: '#cbd5e1', player: '#0ea5e9',
                    weak: '#10b981', closed: '#ef4444', bot: '#f59e0b',
                    text: '#0f172a', dash: '#64748b'
                };
            } else {
                colors = {
                    bg: '#050505', grid: '#003311', player: '#00ffff',
                    weak: '#00ff00', closed: '#ff0033', bot: '#ffcc00',
                    text: '#00ffff', dash: '#ffffff'
                };
            }
        }
        if (window.matchMedia) window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateColors);
        updateColors();

        let fov = 400;
        const camera = { x: 0, y: 30, z: -40, pitch: 0.1 };
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            fov = Math.min(600, canvas.width * 0.8);
            if (state !== 'PLAYING') draw();
        }
        window.addEventListener('resize', resize);

        function project(x, y, z) {
            let tx = x - camera.x;
            let ty = y - camera.y;
            let tz = z - camera.z;

            const cosP = Math.cos(camera.pitch);
            const sinP = Math.sin(camera.pitch);
            
            let ry = ty * cosP - tz * sinP;
            let rz = ty * sinP + tz * cosP;

            if (rz <= 0.1) return null;

            let scale = fov / rz;
            return {
                x: canvas.width / 2 + tx * scale,
                y: canvas.height / 2 - ry * scale,
                scale: scale,
                z: rz
            };
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
        const resumeAudio = () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };
        window.addEventListener('click', resumeAudio, {once: true});
        window.addEventListener('touchstart', resumeAudio, {once: true});

        let state = 'START';
        let score = 0;
        let baseSpeed = 250;
        let currentSpeed = 250;
        let dashTimer = 0;
        let brakeTimer = 0;
        let cascadeTimer = 0;
        let shake = 0;
        let gridOffset = 0;
        
        let player = { lane: 2, x: 0 };
        let layers = [];
        let particles = [];
        let playerTrail = [];

        function spawnLayer(z) {
            let weakLane = Math.floor(Math.random() * 5);
            let botStartLane;
            do { botStartLane = Math.floor(Math.random() * 5); } while (botStartLane === weakLane);

            let speedMultiplier = Math.min(2.0, 1.0 + score * 0.04);
            let currentBase = baseSpeed * speedMultiplier;
            let normalTimeToReach = z / currentBase;

            let minPatchRatio = Math.max(0.5, 0.8 - score * 0.015);
            let maxPatchRatio = Math.max(0.8, 1.2 - score * 0.015);
            let timeToPatch = normalTimeToReach * (minPatchRatio + Math.random() * (maxPatchRatio - minPatchRatio));
            
            let decoys = [];
            if (score > 3) {
                let numDecoys = Math.min(3, Math.floor(score / 4));
                for (let i = 0; i < 5; i++) {
                    if (i !== weakLane && Math.random() < 0.5 && decoys.length < numDecoys) decoys.push(i);
                }
            }

            layers.push({
                z: z, weakLane: weakLane, decoys: decoys, decoyPopped: false, passed: false,
                bot: { startLane: botStartLane, currentLane: botStartLane, timeToPatch: timeToPatch, timer: 0, patched: false }
            });
        }

        function createExplosion(x, y, z, color, count=15) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y, z: z,
                    vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, vz: (Math.random() - 0.5) * 40,
                    life: 0.5 + Math.random() * 0.5, color: color
                });
            }
        }

        function createDashParticles() {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: player.x + (Math.random() - 0.5) * 10, y: 0, z: 0,
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, vz: -50 - Math.random() * 50,
                    life: 0.3 + Math.random() * 0.3, color: colors.dash
                });
            }
        }

        function startGame() {
            resumeAudio();
            state = 'PLAYING';
            score = 0;
            baseSpeed = 250;
            currentSpeed = 250;
            player.lane = 2;
            player.x = 0;
            layers = [];
            particles = [];
            playerTrail = [];
            dashTimer = 0;
            brakeTimer = 0;
            cascadeTimer = 0;
            shake = 0;
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('score-display').innerText = score;
            
            spawnLayer(600);
            spawnLayer(1200);
        }

        function gameOver() {
            state = 'GAMEOVER';
            shake = 20;
            createExplosion(player.x, 0, 0, colors.closed, 30);
            playTone(150, 'sawtooth', 0.5, 0.2);
            setTimeout(() => playTone(100, 'square', 0.5, 0.2), 100);
            
            if (navigator.vibrate) { try { navigator.vibrate([200]); } catch(e){} }
            
            setTimeout(() => {
                document.getElementById('game-over-screen').style.display = 'block';
                document.getElementById('final-score').innerText = score;
                document.getElementById('hud').style.display = 'none';
            }, 1000);
        }

        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-restart').addEventListener('click', startGame);

        let touchStartX = 0, touchStartY = 0, touchActive = false;
        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchActive = true;
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            if (!touchActive || state !== 'PLAYING') return;
            e.preventDefault();
            let dx = e.touches[0].clientX - touchStartX;
            let dy = e.touches[0].clientY - touchStartY;
            const threshold = 30;
            
            if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0 && player.lane < 4) { player.lane++; playTone(200 + player.lane*20, 'sine', 0.1, 0.05); }
                    else if (dx < 0 && player.lane > 0) { player.lane--; playTone(200 + player.lane*20, 'sine', 0.1, 0.05); }
                } else {
                    if (dy < 0) {
                        dashTimer = 0.5; brakeTimer = 0;
                        createDashParticles();
                        playTone(400, 'square', 0.2, 0.05);
                    } else {
                        brakeTimer = 0.5; dashTimer = 0;
                        playTone(100, 'sawtooth', 0.2, 0.05);
                    }
                }
                touchActive = false;
            }
        }, {passive: false});
        window.addEventListener('touchend', () => touchActive = false);

        window.addEventListener('keydown', e => {
            if (state !== 'PLAYING') return;
            if (e.key === 'ArrowLeft' || e.key === 'a') {
                if (player.lane > 0) { player.lane--; playTone(200 + player.lane*20, 'sine', 0.1, 0.05); }
            } else if (e.key === 'ArrowRight' || e.key === 'd') {
                if (player.lane < 4) { player.lane++; playTone(200 + player.lane*20, 'sine', 0.1, 0.05); }
            } else if (e.key === 'ArrowUp' || e.key === 'w') {
                dashTimer = 0.5; brakeTimer = 0;
                createDashParticles();
                playTone(400, 'square', 0.2, 0.05);
            } else if (e.key === 'ArrowDown' || e.key === 's') {
                brakeTimer = 0.5; dashTimer = 0;
                playTone(100, 'sawtooth', 0.2, 0.05);
            }
        });

        let lastTime = 0;
        function update(dt) {
            if (state !== 'PLAYING') {
                updateParticles(dt);
                return;
            }

            let speedMultiplier = Math.min(2.0, 1.0 + score * 0.04);
            let targetSpeed = baseSpeed * speedMultiplier;
            let targetFov = Math.min(600, canvas.width * 0.8);
            
            if (dashTimer > 0) {
                targetSpeed *= 2.5;
                targetFov *= 1.2;
                dashTimer -= dt;
            } else if (brakeTimer > 0) {
                targetSpeed *= 0.4;
                targetFov *= 0.9;
                brakeTimer -= dt;
            }
            
            currentSpeed = targetSpeed + (currentSpeed - targetSpeed) * Math.exp(-10 * dt);
            fov = targetFov + (fov - targetFov) * Math.exp(-10 * dt);

            let targetX = (player.lane - 2) * 10;
            player.x = targetX + (player.x - targetX) * Math.exp(-15 * dt);

            playerTrail.push({ x: player.x, z: 0, life: 1.0 });
            for (let i = playerTrail.length - 1; i >= 0; i--) {
                playerTrail[i].z += currentSpeed * dt;
                playerTrail[i].life -= dt * 5;
                if (playerTrail[i].life <= 0) playerTrail.splice(i, 1);
            }

            for (let i = layers.length - 1; i >= 0; i--) {
                let layer = layers[i];
                layer.z -= currentSpeed * dt;

                if (!layer.decoyPopped && layer.z <= 400) {
                    layer.decoyPopped = true;
                    for (let lane of layer.decoys) {
                        createExplosion((lane - 2) * 10, 0, layer.z, colors.closed, 5);
                        playTone(600, 'sawtooth', 0.1, 0.05);
                    }
                }

                if (!layer.bot.patched) {
                    layer.bot.timer += dt;
                    let progress = Math.min(1, layer.bot.timer / layer.bot.timeToPatch);
                    layer.bot.currentLane = layer.bot.startLane + (layer.weakLane - layer.bot.startLane) * progress;

                    if (progress >= 1) {
                        layer.bot.patched = true;
                        createExplosion((layer.weakLane - 2) * 10, 0, layer.z, colors.closed, 15);
                        playTone(300, 'square', 0.1, 0.1);
                    }
                }

                if (!layer.passed && layer.z <= 0) {
                    layer.passed = true;
                    if (Math.abs(player.x - (layer.weakLane - 2) * 10) < 5) {
                        if (layer.bot.patched) {
                            gameOver();
                        } else {
                            score++;
                            document.getElementById('score-display').innerText = score;
                            createExplosion((layer.weakLane - 2) * 10, 0, 0, colors.weak, 20);
                            playTone(800, 'sine', 0.3, 0.1);
                            setTimeout(() => playTone(1200, 'sine', 0.4, 0.1), 100);
                            if (navigator.vibrate) { try { navigator.vibrate([50]); } catch(e){} }
                            cascadeTimer = 0.3;
                            
                            for (let j = 0; j < 20; j++) {
                                particles.push({
                                    x: player.x + (Math.random() - 0.5) * 40, y: 0, z: 0,
                                    vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, vz: 200 + Math.random() * 300,
                                    life: 0.8, color: colors.player
                                });
                            }
                        }
                    } else {
                        gameOver();
                    }
                }

                if (layer.z < -100) {
                    layers.splice(i, 1);
                    let maxZ = 0;
                    for (let l of layers) if (l.z > maxZ) maxZ = l.z;
                    spawnLayer(Math.max(maxZ + 600, 600));
                }
            }
            
            updateParticles(dt);
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.z += p.vz * dt;
                p.z -= currentSpeed * dt;
                p.life -= dt;
                if (p.life <= 0 || p.z < -100) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (shake > 0) {
                ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
                shake *= 0.9;
                if (shake < 0.5) shake = 0;
            }

            if (cascadeTimer > 0) {
                ctx.fillStyle = colors.player;
                ctx.globalAlpha = cascadeTimer * 0.3;
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
                cascadeTimer -= 1/60;
            }

            ctx.strokeStyle = colors.grid;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.3;
            for (let i = 0; i <= 5; i++) {
                let x = (i - 2.5) * 10;
                let pNear = project(x, 0, 0);
                let pFar = project(x, 0, 1000);
                if (pNear && pFar) {
                    ctx.beginPath(); ctx.moveTo(pNear.x, pNear.y); ctx.lineTo(pFar.x, pFar.y); ctx.stroke();
                }
            }
            gridOffset = (gridOffset + currentSpeed * (1/60)) % 100;
            for (let z = gridOffset; z < 1000; z += 100) {
                let pLeft = project(-30, 0, z);
                let pRight = project(30, 0, z);
                if (pLeft && pRight) {
                    ctx.beginPath(); ctx.moveTo(pLeft.x, pLeft.y); ctx.lineTo(pRight.x, pRight.y); ctx.stroke();
                }
            }
            ctx.globalAlpha = 1.0;

            let sortedLayers = [...layers].sort((a, b) => b.z - a.z);
            for (let layer of sortedLayers) {
                if (layer.z < 0) continue;
                
                let pL = project(-30, 0, layer.z);
                let pR = project(30, 0, layer.z);
                if (!pL || !pR) continue;

                ctx.strokeStyle = colors.grid;
                ctx.lineWidth = 2 * pL.scale;
                ctx.beginPath(); ctx.moveTo(pL.x, pL.y); ctx.lineTo(pR.x, pR.y); ctx.stroke();

                for (let i = 0; i < 5; i++) {
                    let portX = (i - 2) * 10;
                    let p = project(portX, 0, layer.z);
                    if (!p) continue;

                    let isWeak = (i === layer.weakLane);
                    let isDecoy = layer.decoys.includes(i) && layer.z > 400;
                    let isPatched = isWeak && layer.bot.patched;

                    let color = colors.closed;
                    let isOpen = false;

                    if ((isWeak && !isPatched) || isDecoy) {
                        color = colors.weak;
                        isOpen = true;
                    }

                    ctx.fillStyle = color;
                    ctx.strokeStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 10 * p.scale;
                    
                    let w = 6 * p.scale;
                    let h = 4 * p.scale;
                    
                    if (isOpen) {
                        ctx.lineWidth = 1.5 * p.scale;
                        ctx.beginPath();
                        ctx.moveTo(p.x - w/2 + w/4, p.y - h); ctx.lineTo(p.x - w/2, p.y - h);
                        ctx.lineTo(p.x - w/2, p.y); ctx.lineTo(p.x - w/2 + w/4, p.y);
                        ctx.stroke();
                        
                        ctx.beginPath();
                        ctx.moveTo(p.x + w/2 - w/4, p.y - h); ctx.lineTo(p.x + w/2, p.y - h);
                        ctx.lineTo(p.x + w/2, p.y); ctx.lineTo(p.x + w/2 - w/4, p.y);
                        ctx.stroke();
                    } else {
                        ctx.fillRect(p.x - w/2, p.y - h, w, h);
                    }
                    ctx.shadowBlur = 0;
                }

                let botX = (layer.bot.currentLane - 2) * 10;
                let pBot = project(botX, 0, layer.z);
                if (pBot && !layer.bot.patched) {
                    ctx.fillStyle = colors.bot;
                    ctx.shadowColor = colors.bot;
                    ctx.shadowBlur = 15 * pBot.scale;
                    ctx.beginPath(); ctx.arc(pBot.x, pBot.y - 2 * pBot.scale, 2 * pBot.scale, 0, Math.PI * 2); ctx.fill();
                    
                    ctx.beginPath(); ctx.moveTo(pBot.x, pBot.y); ctx.lineTo(pBot.x, pBot.y + 10 * pBot.scale);
                    ctx.strokeStyle = colors.bot; ctx.lineWidth = 1 * pBot.scale; ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1.0;
                    
                    ctx.shadowBlur = 0;
                }
            }

            if (playerTrail.length > 0) {
                ctx.strokeStyle = colors.player;
                ctx.lineWidth = 2;
                ctx.beginPath();
                let first = true;
                for (let pt of playerTrail) {
                    let p = project(pt.x, 0, pt.z);
                    if (p) {
                        if (first) { ctx.moveTo(p.x, p.y); first = false; }
                        else { ctx.lineTo(p.x, p.y); }
                    }
                }
                ctx.stroke();
            }

            if (state !== 'GAMEOVER') {
                let pPlayer = project(player.x, 0, 0);
                if (pPlayer) {
                    ctx.fillStyle = colors.player;
                    ctx.shadowColor = colors.player;
                    ctx.shadowBlur = 20;
                    
                    let size = 3 * pPlayer.scale;
                    ctx.beginPath();
                    ctx.moveTo(pPlayer.x, pPlayer.y - size * 1.5);
                    ctx.lineTo(pPlayer.x - size, pPlayer.y + size * 0.5);
                    ctx.lineTo(pPlayer.x + size, pPlayer.y + size * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    
                    if (dashTimer > 0) {
                        ctx.strokeStyle = colors.dash;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                }
            }

            for (let p of particles) {
                let proj = project(p.x, p.y, p.z);
                if (proj) {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.life);
                    let size = 3 * proj.scale;
                    ctx.fillRect(proj.x - size/2, proj.y - size/2, size, size);
                    ctx.globalAlpha = 1.0;
                }
            }

            ctx.restore();
        }

        function loop(time) {
            requestAnimationFrame(loop);
            let dt = (time - lastTime) / 1000;
            lastTime = time;
            if (dt > 0.1) dt = 0.1;
            update(dt);
            draw();
        }

        resize();
        requestAnimationFrame(t => { lastTime = t; loop(t); });
    </script>
</body>
</html>
