<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Sort</title>
<style>
:root {
    --bg: #121212;
    --fg: #ffb000;
    --fg-dim: rgba(255, 176, 0, 0.3);
    --card-bg: #1e1e1e;
    --danger: #ff3333;
    --success: #33ff33;
    --buffer: #33ccff;
    --font: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --grid-color: rgba(255, 176, 0, 0.05);
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #121212;
        --fg: #ffb000;
        --fg-dim: rgba(255, 176, 0, 0.3);
        --card-bg: #1e1e1e;
        --danger: #ff3333;
        --success: #33ff33;
        --buffer: #33ccff;
        --grid-color: rgba(255, 176, 0, 0.05);
    }
}

@media (prefers-color-scheme: light) {
    :root {
        --bg: #f4f4f4;
        --fg: #d97700;
        --fg-dim: rgba(217, 119, 0, 0.3);
        --card-bg: #ffffff;
        --danger: #cc0000;
        --success: #008800;
        --buffer: #0066cc;
        --grid-color: rgba(217, 119, 0, 0.05);
    }
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg);
    background-image: 
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 30px 30px;
    background-position: center center;
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
    width: 100dvw;
    height: 100dvh;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

body::after {
    content: " ";
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 100;
    background-size: 100% 4px, 6px 100%;
    pointer-events: none;
}

#game-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 600px;
    margin: 0 auto;
    overflow: hidden;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
}

#ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.screen {
    background: var(--bg);
    border: 2px solid var(--fg);
    padding: 2rem;
    text-align: center;
    pointer-events: auto;
    box-shadow: 0 0 30px var(--bg);
    max-width: 90%;
    z-index: 21;
}

.screen.hidden {
    display: none;
}

h1 {
    font-size: 1.5rem;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 2px;
}

p {
    margin-bottom: 1rem;
    line-height: 1.5;
}

.instructions {
    color: var(--fg);
    opacity: 0.9;
    font-size: 0.9rem;
    margin-bottom: 2rem;
    border: 1px dashed var(--fg-dim);
    padding: 1rem;
    text-align: left;
}

.instructions span {
    display: inline-block;
    width: 60px;
    font-weight: bold;
}

.inst-up { color: var(--success); }
.inst-left { color: var(--danger); }
.inst-right { color: var(--buffer); }

button {
    background: transparent;
    color: var(--fg);
    border: 2px solid var(--fg);
    padding: 1rem 2rem;
    font-family: var(--font);
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    pointer-events: auto;
}

button:hover, button:active {
    background: var(--fg);
    color: var(--bg);
}

#hud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    display: flex;
    flex-direction: column;
}

#hud.hidden {
    display: none;
}

#progress-bar-container {
    width: 100%;
    height: 8px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--fg-dim);
}

#progress-bar {
    width: 0%;
    height: 100%;
    background: var(--fg);
    transition: width 0.1s linear;
}

.hud-stats {
    display: flex;
    justify-content: space-between;
    padding: 1rem;
    font-size: 1rem;
    font-weight: bold;
    background: linear-gradient(var(--bg), transparent);
}

.zone-indicator {
    position: absolute;
    font-size: 2rem;
    font-weight: bold;
    opacity: 0.15;
    letter-spacing: 0.5rem;
    pointer-events: none;
    text-transform: uppercase;
}

.zone-indicator.up {
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    color: var(--success);
}

.zone-indicator.left {
    top: 50%;
    left: -40px;
    transform: translateY(-50%) rotate(-90deg);
    color: var(--danger);
}

.zone-indicator.right {
    top: 50%;
    right: -40px;
    transform: translateY(-50%) rotate(90deg);
    color: var(--buffer);
}

#card-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 8;
    display: flex;
    justify-content: center;
    align-items: center;
}

#card-container.hidden {
    display: none;
}

.card {
    width: 280px;
    height: 380px;
    background: var(--card-bg);
    border: 2px solid var(--fg);
    position: absolute;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    cursor: grab;
    touch-action: none;
    border-radius: 4px;
    overflow: hidden;
}

.card:active {
    cursor: grabbing;
}

.card.returning {
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s;
}

.card-header {
    border-bottom: 2px solid var(--fg);
    padding: 0.5rem 1rem;
    font-size: 0.8rem;
    font-weight: bold;
    background: var(--fg-dim);
    display: flex;
    justify-content: space-between;
}

.card-header::after {
    content: "x";
    opacity: 0.5;
}

.card-body {
    flex: 1;
    padding: 1.5rem;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    word-break: break-word;
    line-height: 1.4;
}

.card-timer {
    height: 6px;
    background: var(--fg-dim);
    width: 100%;
}

.card-timer-bar {
    height: 100%;
    background: var(--fg);
    width: 100%;
    transform-origin: left;
}

@keyframes pulse-danger {
    0% { box-shadow: 0 0 10px var(--danger); border-color: var(--danger); }
    50% { box-shadow: 0 0 30px var(--danger); border-color: var(--danger); }
    100% { box-shadow: 0 0 10px var(--danger); border-color: var(--danger); }
}

.card.danger {
    animation: pulse-danger 0.5s infinite;
}

.shake {
    animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
}

@keyframes shake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
    40%, 60% { transform: translate3d(8px, 0, 0); }
}
</style>
</head>
<body>

<div id="game-container">
    <canvas id="fx-canvas"></canvas>
    
    <div id="hud" class="hidden">
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <div class="hud-stats">
            <span id="score-display">SCORE: 0</span>
            <span id="time-display">05:00 AM</span>
            <span id="strikes-display">ERRORS: 0/3</span>
        </div>
        
        <div class="zone-indicator up">DEPLOY</div>
        <div class="zone-indicator left">DISCARD</div>
        <div class="zone-indicator right">BUFFER</div>
    </div>

    <div id="card-container" class="hidden">
        <!-- Cards injected here -->
    </div>

    <div id="ui-layer">
        <div id="start-screen" class="screen">
            <h1>AGENT_SORT.exe</h1>
            <p>Sort incoming tasks before sunrise.</p>
            <div class="instructions">
                <span class="inst-up">UP</span> = DEPLOY<br>
                <span class="inst-right">RIGHT</span> = BUFFER<br>
                <span class="inst-left">LEFT</span> = DISCARD
            </div>
            <button data-smoke="start">INITIATE</button>
        </div>
        
        <div id="game-over-screen" class="screen hidden">
            <h1 id="end-title">SYSTEM CRASH</h1>
            <p id="end-message">Too many bugs shipped.</p>
            <p style="margin-bottom: 2rem;">Tasks Sorted: <span id="end-score">0</span></p>
            <button data-smoke="restart">REBOOT</button>
        </div>
    </div>
</div>

<script>
const TASKS = {
    deploy: [
        "Fix critical auth bypass",
        "Deploy security patch",
        "Ship landing page",
        "Merge hotfix PR",
        "Update SSL certs",
        "Fix payment gateway",
        "Scale up database",
        "Resolve memory leak",
        "Update API endpoints",
        "Ship v2.0 release"
    ],
    buffer: [
        "Refactor legacy CSS",
        "Update README.md",
        "Investigate flaky test",
        "Draft release notes",
        "Optimize images",
        "Research framework",
        "Update dependencies",
        "Write unit tests",
        "Clean up logs",
        "Review stale PRs"
    ],
    discard: [
        "Crypto spam PR",
        "Rewrite in Brainfuck",
        "Hardcode API keys",
        "Delete prod DB",
        "Ignore user feedback",
        "Add 50MB video",
        "Disable firewall",
        "Bypass code review",
        "Store passwords in plaintext",
        "Push to master directly"
    ]
};

let state = 'start'; // start, playing, gameover, win
let score = 0;
let strikes = 0;
let gameTime = 0; 
const MAX_TIME = 60;
const MAX_STRIKES = 3;

let currentCard = null;
let currentTaskType = '';
let cardTimeRemaining = 0;
let cardTimeLimit = 4.0;

let lastFrameTime = 0;
let animationFrameId = null;

// DOM Elements
const uiLayer = document.getElementById('ui-layer');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const hud = document.getElementById('hud');
const cardContainer = document.getElementById('card-container');
const scoreDisplay = document.getElementById('score-display');
const timeDisplay = document.getElementById('time-display');
const strikesDisplay = document.getElementById('strikes-display');
const progressBar = document.getElementById('progress-bar');
const endTitle = document.getElementById('end-title');
const endMessage = document.getElementById('end-message');
const endScore = document.getElementById('end-score');
const gameContainer = document.getElementById('game-container');
const restartBtn = document.querySelector('[data-smoke="restart"]');

// Canvas
const canvas = document.getElementById('fx-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Input handling
let isDragging = false;
let startX = 0;
let startY = 0;
let currentX = 0;
let currentY = 0;

function init() {
    document.querySelector('[data-smoke="start"]').addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    cardContainer.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    
    document.addEventListener('touchmove', (e) => {
        if (e.target.tagName !== 'BUTTON') {
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);

    requestAnimationFrame(loop);
}

function handleKeyDown(e) {
    if (state !== 'playing' || !currentCard || e.repeat) return;
    let direction = '';
    if (e.key === 'ArrowUp') direction = 'deploy';
    else if (e.key === 'ArrowLeft') direction = 'discard';
    else if (e.key === 'ArrowRight') direction = 'buffer';
    else return;
    e.preventDefault();
    sortByDirection(direction);
}

function handleKeyUp(e) {
    if (['ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
    }
}

function sortByDirection(direction) {
    if (state !== 'playing' || !currentCard) return;
    isDragging = false;
    const offX = direction === 'buffer' ? window.innerWidth : (direction === 'discard' ? -window.innerWidth : 0);
    const offY = direction === 'deploy' ? -window.innerHeight : 0;
    currentCard.classList.remove('returning');
    currentCard.style.transition = 'transform 0.3s ease-in, opacity 0.3s ease-in';
    currentCard.style.transform = `translate(${offX}px, ${offY}px) rotate(0deg)`;
    currentCard.style.opacity = '0';
    const sortedCard = currentCard;
    currentCard = null;
    setTimeout(() => {
        handleSort(direction, sortedCard);
    }, 150);
}

function startGame() {
    state = 'playing';
    score = 0;
    strikes = 0;
    gameTime = 0;
    particles = [];
    
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    cardContainer.classList.remove('hidden');
    
    updateHUD();
    spawnCard();
}

function spawnCard() {
    if (currentCard) {
        currentCard.remove();
    }
    
    const types = ['deploy', 'buffer', 'discard'];
    currentTaskType = types[Math.floor(Math.random() * types.length)];
    const tasks = TASKS[currentTaskType];
    const taskText = tasks[Math.floor(Math.random() * tasks.length)];
    
    const progress = gameTime / MAX_TIME;
    cardTimeLimit = 4.0 - (progress * 2.5);
    cardTimeRemaining = cardTimeLimit;
    
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
        <div class="card-header"><span>TASK #${Math.floor(Math.random() * 9000) + 1000}</span></div>
        <div class="card-body">${taskText}</div>
        <div class="card-timer"><div class="card-timer-bar" id="current-timer-bar"></div></div>
    `;
    
    cardContainer.appendChild(card);
    currentCard = card;
}

function onPointerDown(e) {
    if (state !== 'playing' || !currentCard) return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    currentCard.classList.remove('returning');
    currentCard.style.transition = 'none';
}

function onPointerMove(e) {
    if (!isDragging || !currentCard) return;
    currentX = e.clientX;
    currentY = e.clientY;
    
    const dx = currentX - startX;
    const dy = currentY - startY;
    
    const rotate = dx * 0.05;
    currentCard.style.transform = `translate(${dx}px, ${dy}px) rotate(${rotate}deg)`;
    
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    const THRESHOLD = 60;
    
    if (Math.max(absDx, absDy) > THRESHOLD) {
        let swipeDir = '';
        if (absDx > absDy) {
            swipeDir = dx > 0 ? 'buffer' : 'discard';
        } else if (dy < 0) {
            swipeDir = 'deploy';
        }
        
        if (swipeDir === 'deploy') currentCard.style.borderColor = 'var(--success)';
        else if (swipeDir === 'discard') currentCard.style.borderColor = 'var(--danger)';
        else if (swipeDir === 'buffer') currentCard.style.borderColor = 'var(--buffer)';
        else currentCard.style.borderColor = 'var(--fg)';
    } else {
        currentCard.style.borderColor = 'var(--fg)';
    }
}

function onPointerUp(e) {
    if (!isDragging || !currentCard) return;
    isDragging = false;
    
    const dx = currentX - startX;
    const dy = currentY - startY;
    
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    
    const THRESHOLD = 60;
    
    if (Math.max(absDx, absDy) > THRESHOLD) {
        let swipeDir = '';
        if (absDx > absDy) {
            swipeDir = dx > 0 ? 'buffer' : 'discard';
        } else {
            if (dy < 0) {
                swipeDir = 'deploy';
            } else {
                returnToCenter();
                return;
            }
        }
        
        const offX = dx > 0 ? window.innerWidth : (dx < 0 ? -window.innerWidth : 0);
        const offY = dy < 0 ? -window.innerHeight : (dy > 0 ? window.innerHeight : 0);
        
        currentCard.style.transition = 'transform 0.3s ease-in, opacity 0.3s ease-in';
        currentCard.style.transform = `translate(${offX}px, ${offY}px) rotate(${dx * 0.1}deg)`;
        currentCard.style.opacity = '0';
        
        const sortedCard = currentCard;
        currentCard = null;
        
        setTimeout(() => {
            handleSort(swipeDir, sortedCard);
        }, 150);
        
    } else {
        returnToCenter();
    }
}

function returnToCenter() {
    currentCard.classList.add('returning');
    currentCard.style.transform = `translate(0px, 0px) rotate(0deg)`;
    currentCard.style.borderColor = 'var(--fg)';
}

function handleSort(direction, cardElement) {
    if (state !== 'playing') return;
    
    const rect = cardElement.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    
    if (direction === currentTaskType) {
        score += 100;
        let color = 'var(--fg)';
        if (direction === 'deploy') color = 'var(--success)';
        if (direction === 'discard') color = 'var(--danger)';
        if (direction === 'buffer') color = 'var(--buffer)';
        
        spawnParticles(cx, cy, getComputedStyle(document.documentElement).getPropertyValue(color.replace('var(','').replace(')','')).trim() || '#ffb000', 15);
        if (navigator.vibrate) {
            try { navigator.vibrate(20); } catch(e){}
        }
    } else {
        strike(cx, cy);
    }
    
    updateHUD();
    
    if (state === 'playing') {
        spawnCard();
    }
}

function strike(x, y) {
    strikes++;
    spawnParticles(x || window.innerWidth/2, y || window.innerHeight/2, getComputedStyle(document.documentElement).getPropertyValue('--danger').trim(), 30, true);
    gameContainer.classList.remove('shake');
    void gameContainer.offsetWidth;
    gameContainer.classList.add('shake');
    
    if (navigator.vibrate) {
        try { navigator.vibrate([50, 50, 50]); } catch(e){}
    }
    
    if (strikes >= MAX_STRIKES) {
        endGame(false);
    }
}

function updateHUD() {
    scoreDisplay.innerText = `SCORE: ${score}`;
    strikesDisplay.innerText = `ERRORS: ${strikes}/${MAX_STRIKES}`;
    
    const minutes = Math.floor(gameTime);
    const displayMin = minutes < 10 ? `0${minutes}` : minutes;
    timeDisplay.innerText = `05:${displayMin} AM`;
    
    progressBar.style.width = `${(gameTime / MAX_TIME) * 100}%`;
}

function endGame(isWin) {
    state = isWin ? 'win' : 'gameover';
    
    if (currentCard) {
        currentCard.remove();
        currentCard = null;
    }
    
    hud.classList.add('hidden');
    cardContainer.classList.add('hidden');
    gameOverScreen.classList.remove('hidden');
    
    endScore.innerText = score / 100;
    
    if (isWin) {
        endTitle.innerText = 'SUNRISE DEPLOY SUCCESS';
        endMessage.innerText = 'System stable. Good work, Agent.';
        restartBtn.innerText = 'NEXT SHIFT';
        
        const fgColor = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
        for(let i=0; i<150; i++) {
            setTimeout(() => {
                if (state !== 'win') return;
                spawnParticles(
                    window.innerWidth/2 + (Math.random()-0.5)*300, 
                    window.innerHeight + 20, 
                    fgColor, 
                    1, 
                    false, 
                    true
                );
            }, i * 15);
        }
    } else {
        endTitle.innerText = 'SYSTEM CRASH';
        endMessage.innerText = 'Too many bugs shipped to production.';
        restartBtn.innerText = 'REBOOT';
    }
}

function loop(timestamp) {
    if (!lastFrameTime) lastFrameTime = timestamp;
    const dt = (timestamp - lastFrameTime) / 1000;
    lastFrameTime = timestamp;
    
    if (state === 'playing') {
        gameTime += dt;
        if (gameTime >= MAX_TIME) {
            gameTime = MAX_TIME;
            updateHUD();
            endGame(true);
        } else {
            updateHUD();
            
            if (currentCard && !isDragging) {
                cardTimeRemaining -= dt;
                const timerBar = document.getElementById('current-timer-bar');
                if (timerBar) {
                    const pct = Math.max(0, cardTimeRemaining / cardTimeLimit);
                    timerBar.style.transform = `scaleX(${pct})`;
                    if (pct < 0.3) {
                        timerBar.style.background = 'var(--danger)';
                        if (!currentCard.classList.contains('danger')) {
                            currentCard.classList.add('danger');
                        }
                    } else {
                        timerBar.style.background = 'var(--fg)';
                        currentCard.classList.remove('danger');
                    }
                }
                
                if (cardTimeRemaining <= 0) {
                    const rect = currentCard.getBoundingClientRect();
                    strike(rect.left + rect.width/2, rect.top + rect.height/2);
                    if (state === 'playing') {
                        spawnCard();
                    }
                }
            }
        }
    }
    
    updateAndDrawParticles(dt);
    
    animationFrameId = requestAnimationFrame(loop);
}

const CHARS = ['+', '*', '1', '0', '#', '!', '<', '>'];

function spawnParticles(x, y, color, count, isError = false, isMerge = false) {
    if (!ctx) return;
    for (let i = 0; i < count; i++) {
        let vx, vy, speed, life, char;
        if (isMerge) {
            const angle = Math.PI * 1.5 + (Math.random() - 0.5) * 0.5;
            speed = 300 + Math.random() * 300;
            vx = Math.cos(angle) * speed;
            vy = Math.sin(angle) * speed;
            life = 2.0;
            char = ['^', '|', '*', '+'][Math.floor(Math.random() * 4)];
        } else {
            const angle = Math.random() * Math.PI * 2;
            speed = 50 + Math.random() * 200;
            vx = Math.cos(angle) * speed;
            vy = Math.sin(angle) * speed;
            life = 1.0;
            char = CHARS[Math.floor(Math.random() * CHARS.length)];
        }
        
        particles.push({
            x: x,
            y: y,
            vx: vx,
            vy: vy,
            life: life,
            decay: isMerge ? (0.3 + Math.random() * 0.5) : (0.5 + Math.random() * 1.5),
            char: char,
            color: color,
            isError: isError,
            isMerge: isMerge
        });
    }
}

function updateAndDrawParticles(dt) {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= p.decay * dt;
        
        if (!p.isError && !p.isMerge) {
            p.vy += 400 * dt;
        }
        
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }
        
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillText(p.char, p.x, p.y);
    }
    ctx.globalAlpha = 1.0;
}

window.addEventListener('load', () => {
    try {
        init();
    } catch (e) {
        console.error(e);
    }
});
</script>
</body>
</html>
