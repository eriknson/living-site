<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lossless</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #e8e6e1;
    --fog: rgba(180, 175, 165, 0.45);
    --charcoal: #2a2826;
    --muted: #6b6560;
    --amber: #e8a020;
    --amber-glow: rgba(232, 160, 32, 0.55);
    --panel: rgba(255, 255, 255, 0.72);
    --wave: rgba(90, 85, 78, 0.65);
    --danger: #c44a2a;
    --ui-font: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --fog: rgba(40, 38, 35, 0.55);
      --charcoal: #ece8e2;
      --muted: #9a948c;
      --amber: #f0b030;
      --amber-glow: rgba(240, 176, 48, 0.6);
      --panel: rgba(22, 21, 19, 0.82);
      --wave: rgba(60, 56, 50, 0.75);
      --danger: #e06040;
    }
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--ui-font);
    color: var(--charcoal);
    touch-action: manipulation;
  }
  #wrap {
    position: fixed;
    inset: 0;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }
  #topbar {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    z-index: 5;
    pointer-events: none;
  }
  #topbar span { opacity: 0.85; }
  #score-val, #time-val { color: var(--amber); }
  #arena-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #mosaic-wrap {
    flex: 0 0 auto;
    padding: 8px 14px 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 5;
    pointer-events: none;
  }
  #mosaic-label {
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }
  #mosaic {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    gap: 2px;
    flex: 1;
    max-width: 280px;
    aspect-ratio: 16 / 4;
  }
  .mosaic-cell {
    background: var(--fog);
    border-radius: 1px;
    transition: background 0.15s ease;
  }
  .mosaic-cell.filled {
    box-shadow: 0 0 6px var(--amber-glow);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--panel);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  .overlay.visible {
    opacity: 1;
    visibility: visible;
  }
  .overlay h1 {
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .overlay .tagline {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    max-width: 280px;
    line-height: 1.5;
    margin-bottom: 28px;
  }
  .overlay .final-score {
    font-size: 14px;
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }
  .overlay .final-score strong {
    color: var(--amber);
    font-weight: 400;
  }
  .smoke-btn {
    pointer-events: auto;
    min-height: 48px;
    min-width: 160px;
    padding: 14px 28px;
    border: 1px solid var(--amber);
    background: transparent;
    color: var(--charcoal);
    font-family: var(--ui-font);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s, color 0.2s, transform 0.1s;
  }
  .smoke-btn:active { transform: scale(0.97); }
  .smoke-btn:hover, .smoke-btn:focus-visible {
    background: var(--amber);
    color: var(--bg);
    outline: none;
  }
  #hint {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
    pointer-events: none;
    z-index: 4;
    opacity: 0.7;
    transition: opacity 0.4s;
  }
  #hint.hidden { opacity: 0; }
  #lives {
    display: flex;
    gap: 5px;
  }
  .life-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 4px var(--amber-glow);
    transition: opacity 0.3s, transform 0.3s;
  }
  .life-dot.lost {
    opacity: 0.2;
    transform: scale(0.6);
    box-shadow: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <span>Shards <strong id="score-val">0</strong></span>
    <div id="lives">
      <div class="life-dot"></div>
      <div class="life-dot"></div>
      <div class="life-dot"></div>
    </div>
    <span>Time <strong id="time-val">45</strong></span>
  </div>
  <div id="arena-wrap">
    <canvas id="game"></canvas>
    <div id="hint">Tap shards · Swipe to dodge waves</div>
    <div id="title-overlay" class="overlay visible">
      <h1>Lossless</h1>
      <p class="tagline">Rescue memory shards before compression waves blur them into summaries. Each fragment keeps one crisp detail alive.</p>
      <button type="button" class="smoke-btn" data-smoke="start">Begin rescue</button>
    </div>
    <div id="gameover-overlay" class="overlay">
      <h1>Compressed</h1>
      <p class="final-score">Shards saved: <strong id="final-score">0</strong></p>
      <p class="tagline" id="gameover-msg">Details lost to the fog.</p>
      <button type="button" class="smoke-btn" data-smoke="restart">Rescue again</button>
    </div>
  </div>
  <div id="mosaic-wrap">
    <span id="mosaic-label">Mosaic</span>
    <div id="mosaic"></div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('score-val');
  var timeEl = document.getElementById('time-val');
  var finalScoreEl = document.getElementById('final-score');
  var gameoverMsg = document.getElementById('gameover-msg');
  var titleOverlay = document.getElementById('title-overlay');
  var gameoverOverlay = document.getElementById('gameover-overlay');
  var hintEl = document.getElementById('hint');
  var mosaicEl = document.getElementById('mosaic');
  var lifeDots = document.querySelectorAll('.life-dot');
  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');

  var W = 300, H = 400;
  var state = 'title';
  var score = 0;
  var lives = 3;
  var timeLeft = 45;
  var mosaicIndex = 0;
  var lastTs = 0;
  var spawnTimer = 0;
  var waveTimer = 2.5;
  var waveInterval = 3.8;
  var waveSpeed = 140;
  var waveWidth = 52;
  var difficulty = 0;
  var shake = 0;
  var flash = 0;

  var player = { x: 150, y: 200, r: 14, vx: 0, vy: 0, invuln: 0, dash: 0 };
  var shards = [];
  var waves = [];
  var particles = [];
  var fogDrifts = [];
  var touchStart = null;
  var pointerDown = false;

  var audioCtx = null;
  function beep(freq, dur, vol) {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* silent */ }
  }

  function haptic(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* */ }
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function initMosaic() {
    if (!mosaicEl) return;
    mosaicEl.innerHTML = '';
    for (var i = 0; i < 64; i++) {
      var cell = document.createElement('div');
      cell.className = 'mosaic-cell';
      cell.dataset.idx = i;
      mosaicEl.appendChild(cell);
    }
  }

  function fillMosaicPixel(hue) {
    if (!mosaicEl || mosaicIndex >= 64) return;
    var cell = mosaicEl.children[mosaicIndex];
    if (cell) {
      cell.classList.add('filled');
      var sat = 70 + Math.random() * 20;
      var lit = 45 + Math.random() * 15;
      cell.style.background = 'hsl(' + hue + ',' + sat + '%,' + lit + '%)';
    }
    mosaicIndex++;
  }

  function resize() {
    if (!canvas) return;
    var wrap = document.getElementById('arena-wrap');
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state === 'title') {
      player.x = W * 0.5;
      player.y = H * 0.5;
    }
  }

  function resetGame() {
    score = 0;
    lives = 3;
    timeLeft = 45;
    mosaicIndex = 0;
    spawnTimer = 0;
    waveTimer = 2;
    waveInterval = 3.8;
    waveSpeed = 140;
    waveWidth = 52;
    difficulty = 0;
    shake = 0;
    flash = 0;
    shards = [];
    waves = [];
    particles = [];
    player.x = W * 0.5;
    player.y = H * 0.5;
    player.vx = 0;
    player.vy = 0;
    player.invuln = 0;
    player.dash = 0;
    initMosaic();
    updateHUD();
    for (var i = 0; i < 5; i++) spawnShard(true);
    initFog();
  }

  function initFog() {
    fogDrifts = [];
    for (var i = 0; i < 12; i++) {
      fogDrifts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 30 + Math.random() * 60,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 4,
        a: 0.04 + Math.random() * 0.06
      });
    }
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = String(score);
    if (timeEl) timeEl.textContent = String(Math.ceil(timeLeft));
    for (var i = 0; i < lifeDots.length; i++) {
      if (lifeDots[i]) {
        lifeDots[i].classList.toggle('lost', i >= lives);
      }
    }
  }

  function spawnShard(initial) {
    var margin = 40;
    var sx = margin + Math.random() * (W - margin * 2);
    var sy = margin + Math.random() * (H - margin * 2);
    var hue = 32 + Math.random() * 18;
    shards.push({
      x: sx, y: sy,
      r: 6 + Math.random() * 4,
      hue: hue,
      pulse: Math.random() * Math.PI * 2,
      detail: ['pixel', 'trace', 'glyph', 'frame', 'bit'][Math.floor(Math.random() * 5)],
      alive: true
    });
  }

  function spawnWave() {
    var horizontal = Math.random() > 0.35;
    var dir = Math.random() > 0.5 ? 1 : -1;
    if (horizontal) {
      waves.push({
        type: 'h',
        y: 30 + Math.random() * (H - 60),
        x: dir > 0 ? -waveWidth : W + waveWidth,
        dir: dir,
        speed: waveSpeed,
        width: waveWidth,
        alpha: 0,
        phase: 'warn'
      });
    } else {
      waves.push({
        type: 'v',
        x: 30 + Math.random() * (W - 60),
        y: dir > 0 ? -waveWidth : H + waveWidth,
        dir: dir,
        speed: waveSpeed,
        width: waveWidth,
        alpha: 0,
        phase: 'warn'
      });
    }
    beep(80, 0.15, 0.05);
  }

  function burst(x, y, hue, n) {
    for (var i = 0; i < (n || 8); i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.4 + Math.random() * 0.4,
        maxLife: 0.8,
        hue: hue,
        size: 2 + Math.random() * 3
      });
    }
  }

  function collectShard(s, idx) {
    if (!s.alive) return;
    s.alive = false;
    score++;
    fillMosaicPixel(s.hue);
    burst(s.x, s.y, s.hue, 12);
    beep(520 + score * 8, 0.12, 0.07);
    haptic(20);
    shards.splice(idx, 1);
    updateHUD();
  }

  function tryCollectAt(px, py) {
    var grabR = 48;
    var best = -1;
    var bestD = grabR;
    for (var i = 0; i < shards.length; i++) {
      if (!shards[i].alive) continue;
      var dx = shards[i].x - px;
      var dy = shards[i].y - py;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    }
    if (best >= 0) collectShard(shards[best], best);
  }

  function dash(dx, dy) {
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 20) return;
    var nx = dx / len;
    var ny = dy / len;
    player.vx = nx * 420;
    player.vy = ny * 420;
    player.dash = 0.22;
    player.invuln = 0.35;
    beep(180, 0.08, 0.04);
    haptic(12);
  }

  function compressShardsInWave(w) {
    var destroyed = 0;
    var maxDestroy = 1 + Math.floor(difficulty * 0.4);
    for (var i = shards.length - 1; i >= 0 && destroyed < maxDestroy; i--) {
      if (!shards[i].alive) continue;
      var hit = false;
      if (w.type === 'h') {
        hit = Math.abs(shards[i].y - w.y) < w.width * 0.5;
      } else {
        hit = Math.abs(shards[i].x - w.x) < w.width * 0.5;
      }
      if (hit) {
        burst(shards[i].x, shards[i].y, 30, 4);
        shards.splice(i, 1);
        destroyed++;
      }
    }
  }

  function playerHitByWave(w) {
    if (player.invuln > 0) return false;
    if (w.type === 'h') {
      return Math.abs(player.y - w.y) < w.width * 0.45 + player.r * 0.5;
    }
    return Math.abs(player.x - w.x) < w.width * 0.45 + player.r * 0.5;
  }

  function hurtPlayer() {
    lives--;
    player.invuln = 1.2;
    shake = 8;
    flash = 0.4;
    beep(90, 0.25, 0.1);
    haptic(60);
    updateHUD();
    if (lives <= 0) endGame(false);
  }

  function escalate(dt) {
    difficulty += dt * 0.015;
    waveInterval = Math.max(1.4, 3.8 - difficulty * 0.35);
    waveSpeed = 140 + difficulty * 22;
    waveWidth = 52 + difficulty * 3;
  }

  function endGame(survived) {
    state = 'gameover';
    if (gameoverOverlay) gameoverOverlay.classList.add('visible');
    if (titleOverlay) titleOverlay.classList.remove('visible');
    if (finalScoreEl) finalScoreEl.textContent = String(score);
    if (gameoverMsg) {
      if (survived) {
        gameoverMsg.textContent = score >= 20
          ? 'Lossless archive complete. Every detail preserved.'
          : 'Survived the sweep. The mosaic remembers what you saved.';
      } else {
        gameoverMsg.textContent = 'Too many waves caught you. Details lost to the fog.';
      }
    }
    if (hintEl) hintEl.classList.add('hidden');
  }

  function startGame() {
    resetGame();
    state = 'playing';
    if (titleOverlay) titleOverlay.classList.remove('visible');
    if (gameoverOverlay) gameoverOverlay.classList.remove('visible');
    if (hintEl) hintEl.classList.remove('hidden');
    setTimeout(function () {
      if (hintEl && state === 'playing') hintEl.classList.add('hidden');
    }, 4000);
  }

  function update(dt) {
    if (state !== 'playing') return;

    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame(true);
      return;
    }
    updateHUD();

    escalate(dt);

    spawnTimer += dt;
    var targetShards = Math.min(10, 4 + Math.floor(difficulty));
    if (spawnTimer > 1.1 && shards.length < targetShards) {
      spawnShard(false);
      spawnTimer = 0;
    }

    waveTimer -= dt;
    if (waveTimer <= 0) {
      spawnWave();
      waveTimer = waveInterval;
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.vx *= Math.pow(0.02, dt);
    player.vy *= Math.pow(0.02, dt);
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));
    if (player.dash > 0) player.dash -= dt;
    if (player.invuln > 0) player.invuln -= dt;

    for (var wi = waves.length - 1; wi >= 0; wi--) {
      var w = waves[wi];
      if (w.phase === 'warn') {
        w.alpha = Math.min(1, w.alpha + dt * 3);
        w.warnT = (w.warnT || 0) + dt;
        if (w.warnT > 0.55) w.phase = 'sweep';
      } else {
        if (w.type === 'h') w.x += w.dir * w.speed * dt;
        else w.y += w.dir * w.speed * dt;
        compressShardsInWave(w);
        if (playerHitByWave(w)) hurtPlayer();
        var out = w.type === 'h'
          ? (w.dir > 0 ? w.x > W + w.width : w.x < -w.width * 2)
          : (w.dir > 0 ? w.y > H + w.width : w.y < -w.width * 2);
        if (out) waves.splice(wi, 1);
      }
    }

    for (var si = 0; si < shards.length; si++) {
      shards[si].pulse += dt * 3;
    }

    for (var fi = 0; fi < fogDrifts.length; fi++) {
      var f = fogDrifts[fi];
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.x < -f.r) f.x = W + f.r;
      if (f.x > W + f.r) f.x = -f.r;
      if (f.y < -f.r) f.y = H + f.r;
      if (f.y > H + f.r) f.y = -f.r;
    }

    for (var pi = particles.length - 1; pi >= 0; pi--) {
      var p = particles[pi];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 80 * dt;
      if (p.life <= 0) particles.splice(pi, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 18);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.5);
  }

  function draw() {
    if (!ctx) return;

    var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    var sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    ctx.save();
    ctx.translate(sx, sy);

    var bgCol = cssVar('--bg') || '#141312';
    ctx.fillStyle = bgCol;
    ctx.fillRect(0, 0, W, H);

    for (var fi = 0; fi < fogDrifts.length; fi++) {
      var f = fogDrifts[fi];
      var grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      grad.addColorStop(0, 'rgba(160,150,140,' + f.a + ')');
      grad.addColorStop(1, 'rgba(160,150,140,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    }

    for (var wi = 0; wi < waves.length; wi++) {
      var w = waves[wi];
      ctx.save();
      if (w.type === 'h') {
        var wg = ctx.createLinearGradient(w.x - w.width, w.y, w.x + w.width * 2, w.y);
        wg.addColorStop(0, 'rgba(40,38,35,0)');
        wg.addColorStop(0.35, 'rgba(80,75,68,' + (0.55 * w.alpha) + ')');
        wg.addColorStop(0.5, 'rgba(120,110,95,' + (0.75 * w.alpha) + ')');
        wg.addColorStop(0.65, 'rgba(80,75,68,' + (0.55 * w.alpha) + ')');
        wg.addColorStop(1, 'rgba(40,38,35,0)');
        ctx.fillStyle = wg;
        ctx.fillRect(w.x - w.width, w.y - w.width * 0.5, w.width * 3, w.width);
        if (w.phase === 'warn') {
          ctx.strokeStyle = 'rgba(196,74,42,' + (0.4 * w.alpha) + ')';
          ctx.lineWidth = 1;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(0, w.y);
          ctx.lineTo(W, w.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      } else {
        var wgv = ctx.createLinearGradient(w.x, w.y - w.width, w.x, w.y + w.width * 2);
        wgv.addColorStop(0, 'rgba(40,38,35,0)');
        wgv.addColorStop(0.35, 'rgba(80,75,68,' + (0.55 * w.alpha) + ')');
        wgv.addColorStop(0.5, 'rgba(120,110,95,' + (0.75 * w.alpha) + ')');
        wgv.addColorStop(0.65, 'rgba(80,75,68,' + (0.55 * w.alpha) + ')');
        wgv.addColorStop(1, 'rgba(40,38,35,0)');
        ctx.fillStyle = wgv;
        ctx.fillRect(w.x - w.width * 0.5, w.y - w.width, w.width, w.width * 3);
        if (w.phase === 'warn') {
          ctx.strokeStyle = 'rgba(196,74,42,' + (0.4 * w.alpha) + ')';
          ctx.lineWidth = 1;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(w.x, 0);
          ctx.lineTo(w.x, H);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      ctx.restore();
    }

    for (var si = 0; si < shards.length; si++) {
      var s = shards[si];
      if (!s.alive) continue;
      var pulse = 1 + Math.sin(s.pulse) * 0.15;
      var r = s.r * pulse;
      var glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 3);
      glow.addColorStop(0, 'hsla(' + s.hue + ',85%,55%,0.9)');
      glow.addColorStop(0.4, 'hsla(' + s.hue + ',80%,50%,0.35)');
      glow.addColorStop(1, 'hsla(' + s.hue + ',70%,45%,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'hsl(' + s.hue + ',90%,58%)';
      ctx.fillRect(s.x - r * 0.6, s.y - r * 0.6, r * 1.2, r * 1.2);
      ctx.strokeStyle = 'hsla(' + s.hue + ',100%,70%,0.8)';
      ctx.lineWidth = 1;
      ctx.strokeRect(s.x - r * 0.6, s.y - r * 0.6, r * 1.2, r * 1.2);
    }

    for (var pi = 0; pi < particles.length; pi++) {
      var p = particles[pi];
      var pa = p.life / p.maxLife;
      ctx.fillStyle = 'hsla(' + p.hue + ',90%,55%,' + pa + ')';
      ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
    }

    var amber = cssVar('--amber') || '#f0b030';
    ctx.save();
    if (player.invuln > 0 && Math.floor(Date.now() / 80) % 2 === 0) ctx.globalAlpha = 0.45;
    var pg = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.r * 2.5);
    pg.addColorStop(0, amber);
    pg.addColorStop(0.5, 'rgba(240,176,48,0.3)');
    pg.addColorStop(1, 'rgba(240,176,48,0)');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = amber;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if (player.dash > 0) {
      ctx.strokeStyle = 'rgba(240,176,48,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r + 6, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = 'rgba(196,74,42,' + (flash * 0.25) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function getPos(e) {
    if (!canvas) return { x: 0, y: 0 };
    var rect = canvas.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX;
      cy = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length) {
      cx = e.changedTouches[0].clientX;
      cy = e.changedTouches[0].clientY;
    } else {
      cx = e.clientX;
      cy = e.clientY;
    }
    return { x: cx - rect.left, y: cy - rect.top };
  }

  function onPointerDown(e) {
    if (state !== 'playing') return;
    if (e.cancelable) e.preventDefault();
    pointerDown = true;
    var pos = getPos(e);
    touchStart = { x: pos.x, y: pos.y, t: Date.now() };
    player.x = pos.x;
    player.y = pos.y;
  }

  function onPointerMove(e) {
    if (state !== 'playing' || !pointerDown) return;
    if (e.cancelable) e.preventDefault();
    var pos = getPos(e);
    player.x = pos.x;
    player.y = pos.y;
  }

  function onPointerUp(e) {
    if (state !== 'playing') return;
    if (e.cancelable) e.preventDefault();
    pointerDown = false;
    if (!touchStart) return;
    var pos = getPos(e);
    var dx = pos.x - touchStart.x;
    var dy = pos.y - touchStart.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var elapsed = Date.now() - touchStart.t;
    if (dist > 28) {
      dash(dx, dy);
    } else if (elapsed < 280) {
      tryCollectAt(pos.x, pos.y);
    }
    touchStart = null;
  }

  function onCanvasTapSafe(e) {
    try {
      if (state === 'title' || state === 'gameover') return;
      if (e.cancelable) e.preventDefault();
    } catch (err) { /* */ }
  }

  if (startBtn) {
    startBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
  }
  if (restartBtn) {
    restartBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      startGame();
    });
  }

  if (canvas) {
    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    canvas.addEventListener('touchend', onPointerUp, { passive: false });
    canvas.addEventListener('touchcancel', onPointerUp, { passive: false });
    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('mouseleave', function () { pointerDown = false; });
    canvas.addEventListener('click', onCanvasTapSafe);
  }

  var keys = {};
  function onKeyDown(e) {
    if (state !== 'playing') return;
    keys[e.code] = true;
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      tryCollectAt(player.x, player.y);
    }
    var dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
    if ((dx || dy) && !e.repeat) {
      e.preventDefault();
      dash(dx, dy);
    }
  }
  function onKeyUp(e) { keys[e.code] = false; }

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 100); });

  initMosaic();
  initFog();
  resize();
  player.x = W * 0.5;
  player.y = H * 0.5;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
