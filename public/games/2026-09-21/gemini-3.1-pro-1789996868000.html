<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Foggy Deliveries</title>
    <style>
        :root {
            --bg: #e0e5e0;
            --chrome: #008f11;
            --chrome-dim: rgba(0, 143, 17, 0.3);
            --crate: #333333;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d110d;
                --chrome: #00ff41;
                --chrome-dim: rgba(0, 255, 65, 0.3);
                --crate: #eeeeee;
            }
        }
        body, html {
            margin: 0; padding: 0; width: 100dvw; height: 100dvh;
            background-color: var(--bg);
            overflow: hidden;
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column;
        }
        #ui-layer::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.3;
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: transparent;
            z-index: 10;
            pointer-events: none;
        }
        .screen.hidden { display: none; }
        
        .title-box {
            background: var(--bg);
            padding: 20px 40px;
            border: 2px solid var(--chrome);
            text-align: center;
            box-shadow: 0 0 20px var(--chrome-dim);
            margin-bottom: 30px;
            pointer-events: none;
        }
        
        h1 {
            color: var(--chrome);
            font-size: clamp(2rem, 8vw, 4rem);
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px var(--chrome-dim);
        }
        p {
            color: var(--chrome);
            text-align: center;
            line-height: 1.5;
            font-size: clamp(1rem, 4vw, 1.2rem);
            margin: 0;
        }
        button {
            pointer-events: auto;
            background: var(--bg);
            color: var(--chrome);
            border: 2px solid var(--chrome);
            padding: 15px 30px;
            font-size: clamp(1rem, 4vw, 1.5rem);
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px var(--chrome-dim);
            z-index: 30; /* Ensure it's above scanlines */
            position: relative;
        }
        button:active {
            background: var(--chrome);
            color: var(--bg);
        }
        #hud {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 20px; box-sizing: border-box;
            display: flex; justify-content: space-between;
            color: var(--chrome);
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            font-weight: bold;
            z-index: 5;
            text-shadow: 0 0 5px var(--bg), 0 0 10px var(--bg);
        }
        #hud.hidden { display: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="hud" class="hidden">
            <div id="score">0000</div>
            <div id="time">60.00</div>
            <div id="combo">x1</div>
        </div>
        <div id="start-screen" class="screen">
            <div class="title-box">
                <h1>FOG FLICK</h1>
                <p>Swipe to flick crates.<br>Tap to brake mid-roll.<br>Land in the zones.</p>
            </div>
            <button data-smoke="start">INITIALIZE</button>
        </div>
        <div id="game-over-screen" class="screen hidden">
            <div class="title-box">
                <h1>SHIFT OVER</h1>
                <p>Delivered: <span id="final-score">0</span></p>
            </div>
            <button data-smoke="restart">RESTART SHIFT</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            let dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        let state = 'MENU';
        let score = 0;
        let time = 60;
        let combo = 1;
        let lastTimeMs = 0;

        let crate = null;
        let targets = [];
        let particles = [];
        let trails = [];
        let fogs = [];
        let floatingTexts = [];

        let touchStart = null;
        let touchCurrent = null;
        let isSwiping = false;

        let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            isDark = e.matches;
        });

        function getColors() {
            return {
                bg: isDark ? '#0d110d' : '#e0e5e0',
                chrome: isDark ? '#00ff41' : '#008f11',
                chromeDim: isDark ? 'rgba(0, 255, 65, 0.3)' : 'rgba(0, 143, 17, 0.3)',
                crate: isDark ? '#eeeeee' : '#333333',
                fog: isDark ? ['rgba(26, 34, 26, 0.4)', 'rgba(5, 8, 5, 0.4)'] : ['rgba(255, 255, 255, 0.6)', 'rgba(204, 204, 204, 0.4)']
            };
        }

        class FogParticle {
            constructor() {
                this.reset(true);
            }
            reset(randomY = false) {
                this.r = 100 + Math.random() * 250;
                this.x = Math.random() * width;
                this.y = randomY ? Math.random() * height : height + this.r;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = -0.2 - Math.random() * 0.8;
                this.colorIndex = Math.floor(Math.random() * 2);
            }
            update(dt) {
                this.x += this.vx * (dt / 16);
                this.y += this.vy * (dt / 16);
                if (this.y < -this.r) {
                    this.reset();
                }
            }
            draw(ctx, colors) {
                let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
                let baseColor = colors.fog[this.colorIndex];
                let colorParts = baseColor.match(/rgba\((\d+),\s*(\d+),\s*(\d+),\s*([\d.]+)\)/);
                if (colorParts) {
                    let r = colorParts[1], g = colorParts[2], b = colorParts[3], a = colorParts[4];
                    grad.addColorStop(0, `rgba(${r},${g},${b},${a})`);
                    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        for (let i = 0; i < 15; i++) {
            fogs.push(new FogParticle());
        }

        function spawnParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 0.5 + Math.random() * 0.5,
                    color: color
                });
            }
        }

        function spawnFloatingText(x, y, text, color) {
            floatingTexts.push({ x, y, text, color, life: 1.0 });
        }

        function spawnTarget() {
            let w = Math.max(80, width * 0.6 - score * 1.5);
            let h = 100;
            let x = (width - w) / 2 + (Math.random() * 0.6 - 0.3) * width;
            let y = 80 + Math.random() * (height * 0.4);
            
            let isMoving = score > 30;
            let speed = isMoving ? (Math.random() > 0.5 ? 1 : -1) * (1 + score / 60) : 0;
            
            targets.push({ x, y, w, h, speed });
            
            if (score > 100 && Math.random() > 0.6) {
                let w2 = Math.max(80, width * 0.4);
                let x2 = (width - w2) / 2 + (Math.random() * 0.6 - 0.3) * width;
                let y2 = 80 + Math.random() * (height * 0.4);
                targets.push({ x: x2, y: y2, w: w2, h, speed: -speed });
            }
        }

        class Crate {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = width / 2;
                this.y = height - 120;
                this.vx = 0;
                this.vy = 0;
                this.size = 36;
                this.state = 'idle';
            }
            update(dt, colors) {
                if (this.state === 'sliding' || this.state === 'braking') {
                    this.x += this.vx * (dt / 16);
                    this.y += this.vy * (dt / 16);
                    
                    let currentFriction = this.state === 'braking' ? 0.85 : 0.98;
                    let frictionFactor = Math.pow(currentFriction, dt / 16);
                    this.vx *= frictionFactor;
                    this.vy *= frictionFactor;
                    
                    if (Math.random() < (dt / 16) * 0.5 || this.state === 'braking') {
                        trails.push({
                            x: this.x + (Math.random()-0.5)*15, 
                            y: this.y + (Math.random()-0.5)*15,
                            life: 1.5,
                            color: colors.chromeDim,
                            scored: false
                        });
                    }

                    if (this.x < this.size/2) { 
                        this.x = this.size/2; 
                        this.vx *= -0.6; 
                        spawnParticles(this.x, this.y, 5, colors.crate);
                    }
                    if (this.x > width - this.size/2) { 
                        this.x = width - this.size/2; 
                        this.vx *= -0.6; 
                        spawnParticles(this.x, this.y, 5, colors.crate);
                    }
                    
                    if (Math.abs(this.vx) < 0.5 && Math.abs(this.vy) < 0.5) {
                        this.vx = 0;
                        this.vy = 0;
                        this.resolve(false, colors);
                    }
                    
                    if (this.y < -this.size || this.y > height + this.size) {
                        this.resolve(true, colors);
                    }
                }
            }
            resolve(forcedMiss = false, colors) {
                this.state = 'resolved';
                let scored = false;
                if (!forcedMiss) {
                    for (let i = 0; i < targets.length; i++) {
                        let t = targets[i];
                        if (this.x > t.x && this.x < t.x + t.w &&
                            this.y > t.y && this.y < t.y + t.h) {
                            scored = true;
                            targets.splice(i, 1);
                            break;
                        }
                    }
                }
                
                if (scored) {
                    let points = 10 * combo;
                    score += points;
                    combo++;
                    time += 2; 
                    spawnParticles(this.x, this.y, 25, colors.chrome);
                    spawnFloatingText(this.x, this.y - 30, `+${points}`, colors.chrome);
                    spawnFloatingText(this.x, this.y - 50, `+2s`, colors.chrome);
                    
                    try { if (navigator.vibrate) navigator.vibrate([30, 50, 30]); } catch(e){}
                    
                    trails.forEach(tr => {
                        tr.color = colors.chrome;
                        tr.life = 3.0;
                        tr.scored = true;
                    });
                    
                    spawnTarget();
                } else {
                    combo = 1;
                    spawnParticles(this.x, this.y, 15, colors.crate);
                    spawnFloatingText(this.x, this.y - 30, `MISS`, colors.crate);
                    try { if (navigator.vibrate) navigator.vibrate(50); } catch(e){}
                }
                
                updateHUD();
                
                setTimeout(() => {
                    if (state === 'PLAYING') this.reset();
                }, 500);
            }
            draw(ctx, colors) {
                if (this.state === 'resolved') return;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                
                if (this.state === 'sliding' || this.state === 'braking') {
                    let speed = Math.hypot(this.vx, this.vy);
                    ctx.rotate(Math.sin(Date.now() / 50) * speed * 0.01);
                }
                
                ctx.fillStyle = colors.crate;
                ctx.shadowColor = colors.chromeDim;
                ctx.shadowBlur = 10;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                
                ctx.strokeStyle = colors.bg;
                ctx.lineWidth = 2;
                ctx.strokeRect(-this.size/2 + 4, -this.size/2 + 4, this.size - 8, this.size - 8);
                ctx.beginPath();
                ctx.moveTo(-this.size/2 + 4, -this.size/2 + 4);
                ctx.lineTo(this.size/2 - 4, this.size/2 - 4);
                ctx.moveTo(this.size/2 - 4, -this.size/2 + 4);
                ctx.lineTo(-this.size/2 + 4, this.size/2 - 4);
                ctx.stroke();
                
                ctx.restore();

                if (this.state === 'idle' && isSwiping) {
                    let dx = touchCurrent.x - touchStart.x;
                    let dy = touchCurrent.y - touchStart.y;
                    
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + dx, this.y + dy);
                    ctx.strokeStyle = colors.chrome;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    
                    let angle = Math.atan2(dy, dx);
                    ctx.beginPath();
                    ctx.moveTo(this.x + dx, this.y + dy);
                    ctx.lineTo(this.x + dx - 12 * Math.cos(angle - Math.PI/6), this.y + dy - 12 * Math.sin(angle - Math.PI/6));
                    ctx.lineTo(this.x + dx - 12 * Math.cos(angle + Math.PI/6), this.y + dy - 12 * Math.sin(angle + Math.PI/6));
                    ctx.closePath();
                    ctx.fillStyle = colors.chrome;
                    ctx.fill();
                }
            }
        }

        canvas.addEventListener('pointerdown', e => {
            e.preventDefault();
            if (state !== 'PLAYING') return;
            if (!crate) return;
            
            if (crate.state === 'sliding') {
                crate.state = 'braking';
                spawnParticles(crate.x, crate.y, 10, getColors().chrome);
                try { if (navigator.vibrate) navigator.vibrate(20); } catch(e){}
            } else if (crate.state === 'idle') {
                isSwiping = true;
                touchStart = { x: e.clientX, y: e.clientY };
                touchCurrent = { x: e.clientX, y: e.clientY };
            }
        });
        canvas.addEventListener('pointermove', e => {
            e.preventDefault();
            if (isSwiping) {
                touchCurrent = { x: e.clientX, y: e.clientY };
            }
        });
        canvas.addEventListener('pointerup', e => {
            e.preventDefault();
            if (isSwiping && crate && crate.state === 'idle') {
                isSwiping = false;
                let dx = touchCurrent.x - touchStart.x;
                let dy = touchCurrent.y - touchStart.y;
                
                let dist = Math.hypot(dx, dy);
                if (dist > 10) {
                    let power = Math.min(dist * 0.15, 45);
                    let angle = Math.atan2(dy, dx);
                    crate.vx = Math.cos(angle) * power;
                    crate.vy = Math.sin(angle) * power;
                    crate.state = 'sliding';
                    try { if (navigator.vibrate) navigator.vibrate(10); } catch(e){}
                }
            }
            isSwiping = false;
        });
        canvas.addEventListener('pointercancel', e => {
            isSwiping = false;
        });

        function startGame() {
            state = 'PLAYING';
            score = 0;
            time = 60;
            combo = 1;
            targets = [];
            trails = [];
            particles = [];
            floatingTexts = [];
            crate = new Crate();
            spawnTarget();
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            updateHUD();
        }

        function gameOver() {
            state = 'GAMEOVER';
            crate = null;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
        }

        function updateHUD() {
            document.getElementById('score').innerText = String(score).padStart(4, '0');
            let timeEl = document.getElementById('time');
            timeEl.innerText = time.toFixed(2);
            if (time <= 10) {
                timeEl.style.color = (Math.floor(time * 10) % 2 === 0) ? '#ff3333' : 'var(--chrome)';
                timeEl.style.transform = `scale(${1 + (10 - time)/50})`;
            } else {
                timeEl.style.color = 'var(--chrome)';
                timeEl.style.transform = 'scale(1)';
            }
            document.getElementById('combo').innerText = `x${combo}`;
        }

        document.querySelector('[data-smoke="start"]').addEventListener('click', startGame);
        document.querySelector('[data-smoke="restart"]').addEventListener('click', startGame);

        function update(dt) {
            let colors = getColors();
            
            if (state === 'PLAYING') {
                time -= dt / 1000;
                if (time <= 0) {
                    time = 0;
                    gameOver();
                } else {
                    updateHUD();
                }
                
                if (crate) crate.update(dt, colors);
                
                targets.forEach(t => {
                    t.x += t.speed * (dt / 16);
                    if (t.x < 20 || t.x + t.w > width - 20) {
                        t.speed *= -1;
                    }
                });
            }
            
            fogs.forEach(f => f.update(dt));
            
            for (let i = trails.length - 1; i >= 0; i--) {
                trails[i].life -= dt / 1000;
                if (trails[i].life <= 0) trails.splice(i, 1);
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * (dt / 16);
                p.y += p.vy * (dt / 16);
                p.life -= dt / 1000;
                if (p.life <= 0) particles.splice(i, 1);
            }
            
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= dt / 30;
                ft.life -= dt / 1000;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }
        }

        function drawFogOverlay(ctx, colors) {
            let fogDensity = Math.min(0.9, score / 150);
            if (fogDensity <= 0) return;
            
            let grad = ctx.createLinearGradient(0, 0, 0, height * 0.7);
            let r = isDark ? 13 : 224;
            let g = isDark ? 17 : 229;
            let b = isDark ? 13 : 224;
            
            grad.addColorStop(0, `rgba(${r},${g},${b}, ${fogDensity})`);
            grad.addColorStop(1, `rgba(${r},${g},${b}, 0)`);
            
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height * 0.7);
        }

        function draw() {
            let colors = getColors();
            
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = colors.chromeDim;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.3;
            let lanes = 4;
            for (let i = 1; i < lanes; i++) {
                let x = (width / lanes) * i;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            
            let gridSpeed = 50 + (state === 'PLAYING' ? score : 0);
            let yOffset = (Date.now() / 1000 * gridSpeed) % 100;
            for (let y = yOffset; y < height; y += 100) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
            
            fogs.forEach(f => f.draw(ctx, colors));
            
            if (state === 'PLAYING' && (!crate || crate.state === 'idle')) {
                ctx.strokeStyle = colors.chromeDim;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(width / 2, height - 120, 45, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            trails.forEach(tr => {
                ctx.fillStyle = tr.color;
                ctx.globalAlpha = tr.scored ? Math.min(1, tr.life) : tr.life;
                ctx.beginPath();
                ctx.arc(tr.x, tr.y, tr.scored ? 5 : 3, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
            
            targets.forEach(t => {
                ctx.strokeStyle = colors.chrome;
                ctx.lineWidth = 3;
                let len = 15;
                ctx.beginPath();
                ctx.moveTo(t.x + len, t.y);
                ctx.lineTo(t.x, t.y);
                ctx.lineTo(t.x, t.y + len);
                ctx.moveTo(t.x, t.y + t.h - len);
                ctx.lineTo(t.x, t.y + t.h);
                ctx.lineTo(t.x + len, t.y + t.h);
                ctx.moveTo(t.x + t.w - len, t.y);
                ctx.lineTo(t.x + t.w, t.y);
                ctx.lineTo(t.x + t.w, t.y + len);
                ctx.moveTo(t.x + t.w, t.y + t.h - len);
                ctx.lineTo(t.x + t.w, t.y + t.h);
                ctx.lineTo(t.x + t.w - len, t.y + t.h);
                ctx.stroke();
                
                ctx.fillStyle = colors.chrome;
                ctx.globalAlpha = 0.1 + Math.sin(Date.now() / 200 + t.x) * 0.05;
                ctx.fillRect(t.x, t.y, t.w, t.h);
                ctx.globalAlpha = 1.0;
            });
            
            if (crate) crate.draw(ctx, colors);
            
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
            
            drawFogOverlay(ctx, colors);
            
            ctx.textAlign = 'center';
            ctx.font = 'bold 20px ui-monospace, "SFMono-Regular", Menlo, monospace';
            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.life;
                ctx.fillText(ft.text, ft.x, ft.y);
            });
            ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(function initLoop(timestamp) {
            lastTimeMs = timestamp;
            requestAnimationFrame(function loop(ts) {
                let dt = ts - lastTimeMs;
                lastTimeMs = ts;
                if (dt > 100) dt = 16;
                
                update(dt);
                draw();
                
                requestAnimationFrame(loop);
            });
        });
    </script>
</body>
</html>
