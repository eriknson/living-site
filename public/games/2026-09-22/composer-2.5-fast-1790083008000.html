<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compile Drift</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a2228;--fg:#c8d4dc;--muted:#6a7a86;--accent:#3dd9c4;
  --danger:#e85d4a;--panel:rgba(26,34,40,.88);--border:rgba(200,212,220,.12);
  --glow:rgba(61,217,196,.35);--btn-bg:#2a3844;--btn-fg:#e8f0f4;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e4eaee;--fg:#1a2830;--muted:#5a6a76;--accent:#0a9e8a;
    --danger:#c43d2e;--panel:rgba(228,234,238,.92);--border:rgba(26,40,48,.1);
    --glow:rgba(10,158,138,.25);--btn-bg:#d0dae0;--btn-fg:#142028;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#canvas:active{cursor:grabbing}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hud-val{font-size:18px;font-weight:600;color:var(--fg);text-shadow:0 0 12px var(--glow)}
#combo{position:absolute;top:max(52px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  font-size:13px;color:var(--accent);opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
#combo.show{opacity:1}
#bloom-bar{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:16px;right:16px;height:4px;
  background:var(--border);border-radius:2px;overflow:hidden;pointer-events:none;z-index:2}
#bloom-fill{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .3s ease;
  box-shadow:0 0 8px var(--glow)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;z-index:10;pointer-events:none;transition:opacity .35s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-bg{position:absolute;inset:0;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.overlay-content{position:relative;z-index:1;text-align:center;max-width:340px;pointer-events:none}
.overlay h1{font-size:clamp(22px,6vw,32px);letter-spacing:.06em;margin-bottom:8px;color:var(--fg)}
.overlay .sub{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:24px}
.overlay .score-big{font-size:48px;color:var(--accent);margin:8px 0;text-shadow:0 0 20px var(--glow)}
.overlay .score-label{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:160px;
  padding:12px 28px;border:1px solid var(--border);border-radius:6px;background:var(--btn-bg);
  color:var(--btn-fg);font-family:inherit;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;pointer-events:auto;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#title-overlay .hint{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.5}
#gameover-overlay .fragments{font-size:13px;color:var(--fg);margin-bottom:4px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Score</span><span class="hud-val" id="score">0</span></div>
    <div class="hud-block" style="align-items:center"><span class="hud-label">Time</span><span class="hud-val" id="time">60</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Lives</span><span class="hud-val" id="lives">●●●</span></div>
  </div>
  <div id="combo"></div>
  <div id="bloom-bar"><div id="bloom-fill"></div></div>

  <div id="title-overlay" class="overlay">
    <div class="overlay-bg"></div>
    <div class="overlay-content">
      <h1>COMPILE DRIFT</h1>
      <p class="sub">Steer through the foggy terminal. Catch glowing code fragments before autumn gusts scatter them into wrong compile paths. Avoid the red forks.</p>
      <button class="btn" data-smoke="start" id="btn-start">Begin Compile</button>
      <p class="hint">Drag to steer · Arrow keys on desktop</p>
    </div>
  </div>

  <div id="gameover-overlay" class="overlay hidden">
    <div class="overlay-bg"></div>
    <div class="overlay-content">
      <p class="score-label" id="go-label">Compile Halted</p>
      <div class="score-big" id="final-score">0</div>
      <p class="fragments" id="frag-count">0 fragments linked</p>
      <p class="sub" id="go-msg">The gusts won this round.</p>
      <button class="btn" data-smoke="restart" id="btn-restart">Recompile</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var bloomCanvas = document.createElement('canvas');
var bloomCtx = bloomCanvas.getContext('2d');
var glCanvas = document.createElement('canvas');
var gl = null;
try{ gl = glCanvas.getContext('webgl2') || glCanvas.getContext('webgl'); }catch(e){ gl = null; }

var scoreEl = document.getElementById('score');
var timeEl = document.getElementById('time');
var livesEl = document.getElementById('lives');
var comboEl = document.getElementById('combo');
var bloomFill = document.getElementById('bloom-fill');
var titleOverlay = document.getElementById('title-overlay');
var gameoverOverlay = document.getElementById('gameover-overlay');
var finalScoreEl = document.getElementById('final-score');
var fragCountEl = document.getElementById('frag-count');
var goMsgEl = document.getElementById('go-msg');
var goLabelEl = document.getElementById('go-label');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 0, H = 0, dpr = 1;
var state = 'title';
var score = 0, lives = 3, timeLeft = 60, combo = 0, maxCombo = 0;
var fragmentsCaught = 0, bloomLevel = 0;
var player = { x: 0, y: 0, tx: 0, ty: 0, r: 22 };
var fragments = [];
var particles = [];
var windStreaks = [];
var gustTimer = 0, gustActive = 0, gustDir = 0;
var spawnTimer = 0, difficulty = 1;
var lastTime = 0, shake = 0;
var audioCtx = null;
var bloomLines = [];
var fogParticles = [];
var titleFrags = [];
var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

var CODE_SYMS = ['{ }','</>','#','fn','=>','::','[]','&&','||','01','if','let'];
var FORK_SYMS = ['fork','merge!','conflict','!!'];

function initAudio(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }catch(e){ audioCtx = null; }
}

function playTone(freq, dur, vol, type){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bloomCanvas.width = W * dpr;
  bloomCanvas.height = H * dpr;
  bloomCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  glCanvas.width = W * dpr;
  glCanvas.height = H * dpr;
  if(state === 'title'){
    player.x = player.tx = W * 0.5;
    player.y = player.ty = H * 0.55;
    initTitleAmbience();
  }
}

function palette(){
  return isDark ? {
    fog: '#1a2228', fog2: '#243038', grid: 'rgba(61,217,196,0.06)',
    good: '#3dd9c4', goodGlow: 'rgba(61,217,196,0.5)', bad: '#e85d4a',
    badGlow: 'rgba(232,93,74,0.5)', player: '#f0c060', playerGlow: 'rgba(240,192,96,0.6)',
    wire: 'rgba(200,212,220,0.15)', bloom: '#3dd9c4', sky: '#2a3844'
  } : {
    fog: '#d8e2e8', fog2: '#c8d4dc', grid: 'rgba(10,158,138,0.08)',
    good: '#0a9e8a', goodGlow: 'rgba(10,158,138,0.4)', bad: '#c43d2e',
    badGlow: 'rgba(196,61,46,0.4)', player: '#d4880a', playerGlow: 'rgba(212,136,10,0.5)',
    wire: 'rgba(26,40,48,0.12)', bloom: '#0a9e8a', sky: '#b8c8d4'
  };
}

function resetGame(){
  score = 0; lives = 3; timeLeft = 60; combo = 0; maxCombo = 0;
  fragmentsCaught = 0; bloomLevel = 0; difficulty = 1;
  fragments = []; particles = []; windStreaks = []; bloomLines = [];
  gustTimer = 0; gustActive = 0; spawnTimer = 0; shake = 0;
  player.x = player.tx = W * 0.5;
  player.y = player.ty = H * 0.55;
  bloomCtx.clearRect(0, 0, W, H);
  fogParticles = [];
  updateHUD();
  bloomFill.style.width = '0%';
  comboEl.classList.remove('show');
}

function initTitleAmbience(){
  titleFrags = [];
  for(var i = 0; i < 8; i++){
    titleFrags.push({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*30, vy: (Math.random()-0.5)*30,
      sym: CODE_SYMS[Math.floor(Math.random()*CODE_SYMS.length)],
      rot: Math.random()*6, pulse: Math.random()*6
    });
  }
}

function startGame(){
  resetGame();
  state = 'playing';
  titleOverlay.classList.add('hidden');
  gameoverOverlay.classList.add('hidden');
  initAudio();
  playTone(220, 0.15, 0.06, 'triangle');
}

function endGame(won){
  state = 'over';
  gameoverOverlay.classList.remove('hidden');
  finalScoreEl.textContent = score;
  fragCountEl.textContent = fragmentsCaught + ' fragment' + (fragmentsCaught !== 1 ? 's' : '') + ' linked';
  if(won){
    goLabelEl.textContent = 'Compile Complete';
    goMsgEl.textContent = 'Shader bloomed at sunrise. Max combo: ' + maxCombo + '×';
  } else {
    goLabelEl.textContent = 'Compile Halted';
    goMsgEl.textContent = lives <= 0 ? 'Forked into a wrong path.' : 'Time expired in the fog.';
  }
  playTone(won ? 440 : 110, 0.3, 0.07, won ? 'sine' : 'sawtooth');
}

function updateHUD(){
  scoreEl.textContent = score;
  timeEl.textContent = Math.ceil(timeLeft);
  var dots = '';
  for(var i = 0; i < 3; i++) dots += i < lives ? '●' : '○';
  livesEl.textContent = dots;
  bloomFill.style.width = Math.min(100, bloomLevel * 10) + '%';
}

function addBloomLine(){
  var cx = W * 0.5, cy = H * 0.45;
  var angle = Math.random() * Math.PI * 2;
  var len = 30 + bloomLevel * 8 + Math.random() * 40;
  bloomLines.push({
    x1: cx + Math.cos(angle) * (20 + bloomLevel * 5),
    y1: cy + Math.sin(angle) * (20 + bloomLevel * 5),
    x2: cx + Math.cos(angle) * len,
    y2: cy + Math.sin(angle) * len,
    life: 1,
    hue: bloomLevel
  });
  if(bloomLines.length > 80) bloomLines.shift();
  for(var fp = 0; fp < 3; fp++){
    fogParticles.push({
      x: cx + (Math.random()-0.5)*60, y: cy + (Math.random()-0.5)*60,
      vx: Math.cos(angle + (Math.random()-0.5)) * (40 + bloomLevel * 10),
      vy: Math.sin(angle + (Math.random()-0.5)) * (40 + bloomLevel * 10),
      life: 0.6 + Math.random()*0.4, size: 2 + Math.random()*4
    });
  }
}

function spawnFragment(forceBad){
  var side = Math.floor(Math.random() * 4);
  var x, y, vx, vy;
  var speed = (80 + difficulty * 25) * (0.8 + Math.random() * 0.4);
  if(side === 0){ x = Math.random() * W; y = -30; vx = (Math.random()-0.5)*40; vy = speed; }
  else if(side === 1){ x = W+30; y = Math.random()*H; vx = -speed; vy = (Math.random()-0.5)*40; }
  else if(side === 2){ x = Math.random()*W; y = H+30; vx = (Math.random()-0.5)*40; vy = -speed; }
  else { x = -30; y = Math.random()*H; vx = speed; vy = (Math.random()-0.5)*40; }
  var isBad = forceBad || (Math.random() < 0.18 + difficulty * 0.04);
  fragments.push({
    x: x, y: y, vx: vx, vy: vy, r: isBad ? 18 : 16,
    bad: isBad,
    sym: isBad ? FORK_SYMS[Math.floor(Math.random()*FORK_SYMS.length)] : CODE_SYMS[Math.floor(Math.random()*CODE_SYMS.length)],
    rot: Math.random() * Math.PI * 2,
    rotSpd: (Math.random()-0.5) * 2,
    pulse: Math.random() * Math.PI * 2
  });
}

function spawnParticles(x, y, color, n){
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 120;
    particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color, size:2+Math.random()*3 });
  }
}

function triggerGust(){
  gustActive = 2.5 + difficulty * 0.3;
  gustDir = Math.random() * Math.PI * 2;
  for(var i = 0; i < 12; i++){
    windStreaks.push({
      x: Math.random()*W, y: Math.random()*H,
      len: 60+Math.random()*100, angle: gustDir + (Math.random()-0.5)*0.5,
      life: 1, spd: 200+Math.random()*150
    });
  }
  shake = 4;
  playTone(80 + Math.random()*40, 0.2, 0.04, 'sawtooth');
}

function collectFragment(f, idx){
  fragments.splice(idx, 1);
  if(f.bad){
    lives--;
    combo = 0;
    comboEl.classList.remove('show');
    shake = 8;
    spawnParticles(f.x, f.y, palette().bad, 16);
    playTone(150, 0.25, 0.1, 'square');
    vibrate(80);
    if(lives <= 0) endGame(false);
  } else {
    combo++;
    if(combo > maxCombo) maxCombo = combo;
    var pts = 10 + combo * 2;
    score += pts;
    fragmentsCaught++;
    bloomLevel = Math.min(10, bloomLevel + 0.35);
    addBloomLine();
    spawnParticles(f.x, f.y, palette().good, 12);
    playTone(300 + combo * 20, 0.12, 0.07, 'sine');
    vibrate(15);
    if(combo >= 3){
      comboEl.textContent = combo + '× COMPILE STREAK';
      comboEl.classList.add('show');
    }
  }
  updateHUD();
}

function update(dt){
  if(state !== 'playing') return;
  timeLeft -= dt;
  if(timeLeft <= 0){ timeLeft = 0; endGame(true); return; }

  difficulty = 1 + (60 - timeLeft) / 15;
  gustTimer += dt;
  if(gustTimer > Math.max(3, 6 - difficulty * 0.5)){
    gustTimer = 0;
    triggerGust();
  }

  var gustVx = 0, gustVy = 0;
  if(gustActive > 0){
    gustActive -= dt;
    var gStr = 120 * difficulty * (gustActive / 2.5);
    gustVx = Math.cos(gustDir) * gStr;
    gustVy = Math.sin(gustDir) * gStr;
  }

  player.x += (player.tx - player.x) * Math.min(1, dt * 12);
  player.y += (player.ty - player.y) * Math.min(1, dt * 12);
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r + 40, Math.min(H - player.r - 20, player.y));

  spawnTimer += dt;
  var spawnRate = Math.max(0.35, 1.1 - difficulty * 0.08);
  while(spawnTimer > spawnRate){
    spawnTimer -= spawnRate;
    spawnFragment(false);
    if(difficulty > 2 && Math.random() < 0.3) spawnFragment(true);
  }

  for(var i = fragments.length - 1; i >= 0; i--){
    var f = fragments[i];
    f.vx += gustVx * dt * 0.5;
    f.vy += gustVy * dt * 0.5;
    f.vx *= 0.998; f.vy *= 0.998;
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.rot += f.rotSpd * dt;
    f.pulse += dt * 4;
    var dx = f.x - player.x, dy = f.y - player.y;
    if(dx*dx + dy*dy < (player.r + f.r) * (player.r + f.r)){
      collectFragment(f, i);
      continue;
    }
    if(f.x < -60 || f.x > W+60 || f.y < -60 || f.y > H+60) fragments.splice(i, 1);
  }

  for(var j = particles.length - 1; j >= 0; j--){
    var p = particles[j];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= dt * 2;
    if(p.life <= 0) particles.splice(j, 1);
  }

  for(var k = windStreaks.length - 1; k >= 0; k--){
    var w = windStreaks[k];
    w.x += Math.cos(w.angle) * w.spd * dt;
    w.y += Math.sin(w.angle) * w.spd * dt;
    w.life -= dt * 0.8;
    if(w.life <= 0) windStreaks.splice(k, 1);
  }

  for(var fp = fogParticles.length - 1; fp >= 0; fp--){
    var fog = fogParticles[fp];
    fog.x += fog.vx * dt; fog.y += fog.vy * dt;
    fog.life -= dt * 0.7;
    if(fog.life <= 0) fogParticles.splice(fp, 1);
  }

  if(shake > 0) shake *= 0.88;
  updateHUD();
}

function updateTitle(dt){
  for(var i = 0; i < titleFrags.length; i++){
    var tf = titleFrags[i];
    tf.x += tf.vx * dt; tf.y += tf.vy * dt;
    tf.pulse += dt * 2;
    if(tf.x < -20) tf.x = W+20; if(tf.x > W+20) tf.x = -20;
    if(tf.y < -20) tf.y = H+20; if(tf.y > H+20) tf.y = -20;
  }
}

function drawBackground(p){
  var grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, p.sky);
  grd.addColorStop(0.4, p.fog2);
  grd.addColorStop(1, p.fog);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = p.grid;
  ctx.lineWidth = 1;
  var gs = 40;
  ctx.beginPath();
  for(var gx = 0; gx < W; gx += gs){ ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
  for(var gy = 0; gy < H; gy += gs){ ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
  ctx.stroke();

  ctx.strokeStyle = p.wire;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.72);
  for(var wx = 0; wx <= W; wx += 30){
    ctx.lineTo(wx, H * 0.72 + Math.sin(wx * 0.008 + lastTime * 0.0003) * 8);
  }
  ctx.stroke();
}

function drawBloom(p){
  bloomCtx.clearRect(0, 0, W, H);
  if(bloomLevel <= 0 && state !== 'title') return;
  var cx = W * 0.5, cy = H * 0.45;
  var lvl = state === 'title' ? 3 : bloomLevel;

  bloomCtx.globalCompositeOperation = 'source-over';
  for(var i = 0; i < bloomLines.length; i++){
    var bl = bloomLines[i];
    bloomCtx.strokeStyle = p.bloom;
    bloomCtx.globalAlpha = bl.life * 0.5;
    bloomCtx.lineWidth = 1.5;
    bloomCtx.beginPath();
    bloomCtx.moveTo(bl.x1, bl.y1);
    bloomCtx.lineTo(bl.x2, bl.y2);
    bloomCtx.stroke();
  }

  bloomCtx.globalAlpha = 0.15 + lvl * 0.04;
  bloomCtx.strokeStyle = p.bloom;
  bloomCtx.lineWidth = 1;
  for(var ring = 1; ring <= Math.floor(lvl) + 1; ring++){
    bloomCtx.beginPath();
    var rr = ring * 28 + Math.sin(lastTime * 0.002 + ring) * 4;
    bloomCtx.arc(cx, cy, rr, 0, Math.PI * 2);
    bloomCtx.stroke();
  }

  for(var n = 0; n < Math.floor(lvl * 2); n++){
    var na = (n / (lvl * 2)) * Math.PI * 2 + lastTime * 0.0005;
    var nr = 40 + n * 12;
    bloomCtx.globalAlpha = 0.2;
    bloomCtx.beginPath();
    bloomCtx.moveTo(cx, cy);
    bloomCtx.lineTo(cx + Math.cos(na) * nr, cy + Math.sin(na) * nr);
    bloomCtx.stroke();
  }
  bloomCtx.globalAlpha = 1;
  bloomCtx.globalCompositeOperation = 'source-over';
}

function drawWind(p){
  ctx.strokeStyle = isDark ? 'rgba(200,212,220,0.08)' : 'rgba(26,40,48,0.06)';
  ctx.lineWidth = 2;
  for(var i = 0; i < windStreaks.length; i++){
    var w = windStreaks[i];
    ctx.globalAlpha = w.life * 0.6;
    ctx.beginPath();
    ctx.moveTo(w.x, w.y);
    ctx.lineTo(w.x - Math.cos(w.angle)*w.len, w.y - Math.sin(w.angle)*w.len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawFragment(f, p){
  var col = f.bad ? p.bad : p.good;
  var glow = f.bad ? p.badGlow : p.goodGlow;
  var pulse = 1 + Math.sin(f.pulse) * 0.12;

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.rot);
  ctx.scale(pulse, pulse);

  ctx.shadowColor = glow;
  ctx.shadowBlur = 14;
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.fillStyle = glow;

  if(f.bad){
    ctx.beginPath();
    ctx.moveTo(-10, 8); ctx.lineTo(0, -12); ctx.lineTo(10, 8);
    ctx.moveTo(-6, 2); ctx.lineTo(6, 2);
    ctx.moveTo(0, 2); ctx.lineTo(0, 12);
    ctx.moveTo(-8, 12); ctx.lineTo(8, 12);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.rect(-12, -12, 24, 24);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
    ctx.moveTo(0, -12); ctx.lineTo(0, 12);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  ctx.fillStyle = col;
  ctx.font = '9px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(f.sym, 0, f.bad ? 16 : 0);

  ctx.restore();
}

function drawPlayer(p){
  ctx.save();
  ctx.translate(player.x, player.y);

  ctx.shadowColor = p.playerGlow;
  ctx.shadowBlur = 20;
  ctx.strokeStyle = p.player;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, player.r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, player.r * 0.55, 0, Math.PI * 2);
  ctx.strokeStyle = p.good;
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.fillStyle = p.player;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.arc(0, 0, player.r * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawParticles(){
  for(var i = 0; i < particles.length; i++){
    var pt = particles[i];
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
    ctx.fill();
  }
  for(var j = 0; j < fogParticles.length; j++){
    var fg = fogParticles[j];
    ctx.globalAlpha = fg.life * 0.35;
    ctx.fillStyle = palette().bloom;
    ctx.beginPath();
    ctx.arc(fg.x, fg.y, fg.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTitleFrags(p){
  for(var i = 0; i < titleFrags.length; i++){
    var tf = titleFrags[i];
    ctx.save();
    ctx.translate(tf.x, tf.y);
    ctx.rotate(tf.rot + tf.pulse * 0.1);
    ctx.globalAlpha = 0.25 + Math.sin(tf.pulse) * 0.1;
    ctx.strokeStyle = p.good;
    ctx.lineWidth = 1;
    ctx.strokeRect(-10, -10, 20, 20);
    ctx.font = '8px ui-monospace, Menlo, monospace';
    ctx.fillStyle = p.good;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tf.sym, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function render(){
  var p = palette();
  var sx = shake > 0.5 ? (Math.random()-0.5)*shake : 0;
  var sy = shake > 0.5 ? (Math.random()-0.5)*shake : 0;

  ctx.save();
  ctx.translate(sx, sy);

  drawBackground(p);
  drawBloom(p);

  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(bloomCanvas, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  if(state === 'title') drawTitleFrags(p);

  drawWind(p);

  for(var i = 0; i < fragments.length; i++) drawFragment(fragments[i], p);
  drawPlayer(p);
  drawParticles();

  if(gustActive > 0){
    ctx.fillStyle = isDark ? 'rgba(200,212,220,0.03)' : 'rgba(26,40,48,0.04)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = p.good;
    ctx.globalAlpha = 0.6;
    ctx.font = '11px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('◁ GUST ▷', W/2, 80);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function loop(ts){
  var dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
  lastTime = ts;
  if(state === 'playing') update(dt);
  else if(state === 'title'){
    updateTitle(dt);
    player.x = W*0.5 + Math.sin(ts*0.001)*30;
    player.y = H*0.55 + Math.cos(ts*0.0013)*20;
    player.tx = player.x; player.ty = player.y;
  }
  render();
  requestAnimationFrame(loop);
}

function setTarget(x, y){
  if(state !== 'playing') return;
  player.tx = x;
  player.ty = y;
}

function onPointerDown(e){
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  setTarget(e.clientX - rect.left, e.clientY - rect.top);
}

function onPointerMove(e){
  e.preventDefault();
  if(e.buttons === 0 && e.type.indexOf('touch') === -1) return;
  var rect = canvas.getBoundingClientRect();
  setTarget(e.clientX - rect.left, e.clientY - rect.top);
}

var keys = {};
function onKeyDown(e){
  keys[e.key] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) >= 0) e.preventDefault();
}
function onKeyUp(e){ keys[e.key] = false; }

function handleKeyboard(dt){
  if(state !== 'playing') return;
  var spd = 280 * dt;
  if(keys['ArrowLeft']||keys['a']||keys['A']) player.tx -= spd;
  if(keys['ArrowRight']||keys['d']||keys['D']) player.tx += spd;
  if(keys['ArrowUp']||keys['w']||keys['W']) player.ty -= spd;
  if(keys['ArrowDown']||keys['s']||keys['S']) player.ty += spd;
}

var kbLoop = function(){
  handleKeyboard(1/60);
  requestAnimationFrame(kbLoop);
};

canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  if(e.touches.length){ var t = e.touches[0]; var r = canvas.getBoundingClientRect();
    setTarget(t.clientX - r.left, t.clientY - r.top); }
},{passive:false});
canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  if(e.touches.length){ var t = e.touches[0]; var r = canvas.getBoundingClientRect();
    setTarget(t.clientX - r.left, t.clientY - r.top); }
},{passive:false});
canvas.addEventListener('touchend', function(e){ e.preventDefault(); },{passive:false});

window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);

btnStart.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});
btnRestart.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

window.addEventListener('resize', resize);

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
    isDark = e.matches;
  });
}

resize();
initTitleAmbience();
for(var ti = 0; ti < 5; ti++) addBloomLine();
bloomLevel = 2;
requestAnimationFrame(loop);
requestAnimationFrame(kbLoop);

})();
</script>
</body>
</html>
