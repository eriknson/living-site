<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Before Sunrise</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  background:var(--bg);
  color:var(--fg);
  --bg:#e8edf2;
  --fg:#1a2332;
  --muted:#5a6b7d;
  --accent:#c47a2a;
  --panel:rgba(255,255,255,.82);
  --btn-bg:#1a2332;
  --btn-fg:#f5f0e8;
  --hud:rgba(255,255,255,.55);
}
@media(prefers-color-scheme:dark){
  body{
    --bg:#0f1419;
    --fg:#e8edf2;
    --muted:#8a9bb0;
    --accent:#e8a84a;
    --panel:rgba(15,20,25,.88);
    --btn-bg:#e8a84a;
    --btn-fg:#0f1419;
    --hud:rgba(15,20,25,.65);
  }
}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh}
#game{
  display:block;width:100%;height:100%;
  touch-action:none;
}
#hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:max(12px,env(safe-area-inset-top)) 16px 0;
  pointer-events:none;z-index:2;
}
.hud-pill{
  background:var(--hud);backdrop-filter:blur(8px);
  border:1px solid rgba(128,128,128,.2);
  border-radius:999px;padding:8px 14px;font-size:13px;letter-spacing:.04em;
}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:24px;z-index:3;pointer-events:none;
  transition:opacity .45s ease,visibility .45s;
}
.overlay.hidden{opacity:0;visibility:hidden}
.panel{
  background:var(--panel);backdrop-filter:blur(14px);
  border:1px solid rgba(128,128,128,.18);
  border-radius:20px;padding:28px 24px 24px;max-width:340px;width:100%;
}
.panel h1{font-size:22px;font-weight:600;letter-spacing:.06em;margin-bottom:6px}
.panel .sub{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:20px}
.panel .score-big{font-size:42px;font-weight:600;color:var(--accent);margin:8px 0 4px}
.panel .score-label{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
.btn{
  pointer-events:auto;
  min-height:48px;min-width:160px;padding:14px 28px;
  border:none;border-radius:999px;
  background:var(--btn-bg);color:var(--btn-fg);
  font:inherit;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;touch-action:manipulation;
  transition:transform .15s ease,opacity .15s;
}
.btn:active{transform:scale(.96)}
.hint{
  position:absolute;bottom:max(20px,env(safe-area-inset-bottom));
  left:0;right:0;text-align:center;font-size:11px;color:var(--muted);
  letter-spacing:.06em;pointer-events:none;z-index:2;
  opacity:1;transition:opacity .3s;
}
.hint.hidden{opacity:0}
#hud.playing .hud-pill{opacity:1}
#hud:not(.playing) .hud-pill{opacity:0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-pill" id="scoreHud">0 wisps</div>
    <div class="hud-pill" id="timeHud">sunrise —</div>
  </div>
  <div class="hint" id="hint">hold anywhere to pull mist toward you</div>
  <div class="overlay" id="titleScreen">
    <div class="panel">
      <h1>BEFORE SUNRISE</h1>
      <p class="sub">Karl settles over the rooftops. Hold to magnetize drifting fog wisps before golden light burns them away.</p>
      <button class="btn" data-smoke="start" id="startBtn">Gather Mist</button>
    </div>
  </div>
  <div class="overlay hidden" id="gameOverScreen">
    <div class="panel">
      <h1>SUNRISE</h1>
      <p class="sub">The skyline clears. Another dawn shipped.</p>
      <div class="score-big" id="finalScore">0</div>
      <div class="score-label">wisps harvested</div>
      <button class="btn" data-smoke="restart" id="restartBtn">Before Dawn</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('game');
var ctx=canvas&&canvas.getContext?canvas.getContext('2d'):null;
var titleScreen=document.getElementById('titleScreen');
var gameOverScreen=document.getElementById('gameOverScreen');
var startBtn=document.getElementById('startBtn');
var restartBtn=document.getElementById('restartBtn');
var scoreHud=document.getElementById('scoreHud');
var timeHud=document.getElementById('timeHud');
var hint=document.getElementById('hint');
var hud=document.getElementById('hud');

var W=300,H=500,DPR=1;
var state='title';
var score=0,combo=0,maxCombo=0;
var elapsed=0;
var ROUND=48;
var wisps=[];
var particles=[];
var ripples=[];
var bridgePts=[];
var roofPts=[];
var audioCtx=null;
var magnet={active:false,x:0,y:0};
var shake=0,flash=0;
var spawnTimer=0;
var windPhase=0;

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}

function initAudio(){
  try{
    if(typeof AudioContext!=='undefined'||typeof webkitAudioContext!=='undefined'){
      var AC=typeof AudioContext!=='undefined'?AudioContext:webkitAudioContext;
      audioCtx=new AC();
    }
  }catch(e){audioCtx=null;}
}

function playTone(freq,dur,vol,type){
  if(!audioCtx)return;
  try{
    if(audioCtx.state==='suspended')audioCtx.resume();
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type=type||'sine';
    o.frequency.value=freq;
    g.gain.value=vol||0.04;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function resize(){
  if(!canvas)return;
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||300;
  H=window.innerHeight||500;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  if(ctx)ctx.setTransform(DPR,0,0,DPR,0,0);
  buildBridge();
  buildRoofs();
}

function buildRoofs(){
  var base=H*0.72;
  roofPts=[{x:0,y:base+40}];
  var step=Math.max(18,W/14);
  for(var x=step;x<=W;x+=step){
    roofPts.push({x:x,y:base-(8+(x*17%31))});
  }
  roofPts.push({x:W,y:base+40});
}

function buildBridge(){
  var base=H*0.78;
  bridgePts=[
    {x:0,y:base+40},{x:W*0.08,y:base+38},{x:W*0.14,y:base-8},
    {x:W*0.18,y:base-42},{x:W*0.22,y:base-8},{x:W*0.28,y:base+38},
    {x:W*0.34,y:base-55},{x:W*0.38,y:base-95},{x:W*0.42,y:base-55},
    {x:W*0.48,y:base+38},{x:W*0.54,y:base-8},{x:W*0.58,y:base-42},
    {x:W*0.62,y:base-8},{x:W*0.68,y:base+38},{x:W*0.76,y:base-28},
    {x:W*0.82,y:base-62},{x:W*0.86,y:base-28},{x:W*0.92,y:base+38},
    {x:W,y:base+40}
  ];
}

function spawnWisp(){
  var t=elapsed/ROUND;
  var size=rand(14,28)*(1-t*0.15);
  wisps.push({
    x:rand(W*0.05,W*0.95),
    y:rand(H*0.08,H*0.55),
    vx:rand(-0.3,0.3),
    vy:rand(-0.15,0.25),
    r:size,
    life:1,
    maxLife:1,
    hue:rand(195,215),
    phase:Math.random()*Math.PI*2,
    wobble:rand(0.4,1.2)
  });
}

function burst(x,y,n,col){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2;
    var sp=rand(1.5,5);
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:rand(2,5),col:col});
  }
}

function addRipple(x,y){
  ripples.push({x:x,y:y,r:0,life:1});
}

function resetGame(){
  score=0;combo=0;maxCombo=0;elapsed=0;spawnTimer=0;windPhase=0;
  wisps=[];particles=[];ripples=[];
  magnet.active=false;
  shake=0;flash=0;
  updateHud();
}

function startGame(){
  resetGame();
  for(var i=0;i<8;i++)spawnWisp();
  state='playing';
  titleScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  hud.classList.add('playing');
  hint.classList.remove('hidden');
  initAudio();
  playTone(220,0.3,0.03,'triangle');
  setTimeout(function(){hint.classList.add('hidden');},3500);
}

function endGame(){
  state='gameover';
  hud.classList.remove('playing');
  hint.classList.add('hidden');
  document.getElementById('finalScore').textContent=String(score);
  gameOverScreen.classList.remove('hidden');
  playTone(330,0.5,0.04,'sine');
  setTimeout(function(){playTone(440,0.6,0.03,'sine');},180);
  if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate([20,40,20]);
}

function updateHud(){
  if(scoreHud)scoreHud.textContent=score+(combo>1?'  ×'+combo:'')+' wisps';
  if(timeHud){
    var left=Math.max(0,ROUND-elapsed);
    timeHud.textContent='sunrise '+Math.ceil(left)+'s';
  }
}

function collectWisp(w,i){
  score++;
  combo++;
  if(combo>maxCombo)maxCombo=combo;
  burst(w.x,w.y,10,'rgba(232,168,74,0.8)');
  addRipple(w.x,w.y);
  flash=0.15;
  shake=Math.min(shake+2,6);
  playTone(520+combo*20,0.08,0.035,'sine');
  if(combo%5===0&&typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate(12);
  wisps.splice(i,1);
  updateHud();
}

function update(dt){
  if(state!=='playing')return;
  elapsed+=dt;
  var prog=clamp(elapsed/ROUND,0,1);
  windPhase+=dt*0.8;

  if(elapsed>=ROUND){endGame();return;}

  spawnTimer-=dt;
  var spawnRate=lerp(0.55,0.28,prog);
  if(spawnTimer<=0){
    spawnWisp();
    if(Math.random()<0.35+prog*0.2)spawnWisp();
    spawnTimer=spawnRate;
  }

  var wind=lerp(0.2,2.8,prog*prog);
  var evap=lerp(0.012,0.055,prog);
  var magnetR=lerp(110,85,prog);
  var pull=lerp(2.2,3.8,prog);

  for(var i=wisps.length-1;i>=0;i--){
    var w=wisps[i];
    w.phase+=dt*w.wobble;
    w.vx+=Math.sin(windPhase+w.phase)*wind*dt*0.6;
    w.vy+=Math.cos(windPhase*0.7+w.phase)*0.08*wind*dt;
    w.vx*=0.992;
    w.vy*=0.994;

    if(magnet.active){
      var dx=magnet.x-w.x,dy=magnet.y-w.y;
      var dist=Math.sqrt(dx*dx+dy*dy)||1;
      if(dist<magnetR*1.8){
        var f=pull*(1-dist/(magnetR*1.8));
        w.vx+=dx/dist*f*dt*55;
        w.vy+=dy/dist*f*dt*55;
      }
      if(dist<w.r+22){
        collectWisp(w,i);
        continue;
      }
    }

    w.x+=w.vx;
    w.y+=w.vy;
    w.life-=evap*(1+w.r*0.01);

    if(w.life<=0||w.x<-40||w.x>W+40||w.y<-40||w.y>H+40){
      if(w.life<=0)combo=0;
      wisps.splice(i,1);
    }
  }

  for(var p=particles.length-1;p>=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.04;
    pt.life-=dt*1.8;
    if(pt.life<=0)particles.splice(p,1);
  }
  for(var r=ripples.length-1;r>=0;r--){
    ripples[r].r+=dt*90;
    ripples[r].life-=dt*1.2;
    if(ripples[r].life<=0)ripples.splice(r,1);
  }

  shake*=0.85;
  flash=Math.max(0,flash-dt*2);
  updateHud();
}

function isDark(){
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function drawSky(prog){
  var dark=isDark();
  var g=ctx.createLinearGradient(0,0,0,H);
  if(dark){
    g.addColorStop(0,'#0a1018');
    g.addColorStop(0.55,'#121a24');
    g.addColorStop(1,lerpColor('#1a2430','#3a2818',prog));
  }else{
    g.addColorStop(0,'#b8c8d8');
    g.addColorStop(0.5,'#c8d4de');
    g.addColorStop(1,lerpColor('#d8dfe8','#f0c890',prog));
  }
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  var sunY=H*(0.92-prog*0.38);
  var sunG=ctx.createRadialGradient(W*0.5,sunY,0,W*0.5,sunY,H*0.55);
  sunG.addColorStop(0,'rgba(255,210,120,'+(0.15+prog*0.55)+')');
  sunG.addColorStop(0.35,'rgba(255,180,80,'+(0.08+prog*0.25)+')');
  sunG.addColorStop(1,'rgba(255,160,60,0)');
  ctx.fillStyle=sunG;
  ctx.fillRect(0,0,W,H);
}

function lerpColor(a,b,t){
  var pa=hexToRgb(a),pb=hexToRgb(b);
  if(!pa||!pb)return a;
  var r=Math.round(lerp(pa.r,pb.r,t));
  var g=Math.round(lerp(pa.g,pb.g,t));
  var bl=Math.round(lerp(pa.b,pb.b,t));
  return 'rgb('+r+','+g+','+bl+')';
}

function hexToRgb(h){
  if(!h||h.charAt(0)!=='#')return null;
  var n=parseInt(h.slice(1),16);
  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}

function drawRooftops(prog){
  var dark=isDark();
  ctx.fillStyle=dark?'rgba(12,18,26,'+(0.5+prog*0.2)+')':'rgba(40,52,68,'+(0.35+prog*0.2)+')';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(var i=0;i<roofPts.length;i++)ctx.lineTo(roofPts[i].x,roofPts[i].y);
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();
}

function drawBridge(prog){
  var dark=isDark();
  var base=H*0.78;
  ctx.save();
  ctx.fillStyle=dark?'rgba(8,12,18,'+(0.85+prog*0.1)+')':'rgba(30,40,52,'+(0.75+prog*0.15)+')';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(var i=0;i<bridgePts.length;i++)ctx.lineTo(bridgePts[i].x,bridgePts[i].y);
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle=dark?'rgba(232,168,74,'+(0.25+prog*0.35)+')':'rgba(196,122,42,'+(0.2+prog*0.3)+')';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(W*0.34,base-55);
  ctx.lineTo(W*0.34,base+38);
  ctx.moveTo(W*0.42,base-55);
  ctx.lineTo(W*0.42,base+38);
  ctx.moveTo(W*0.76,base-28);
  ctx.lineTo(W*0.76,base+38);
  ctx.moveTo(W*0.86,base-28);
  ctx.lineTo(W*0.86,base+38);
  ctx.stroke();
  ctx.restore();
}

function drawWisp(w,prog){
  var alpha=w.life*(0.35+0.25*(1-prog));
  var layers=3;
  for(var L=0;L<layers;L++){
    var t=L/layers;
    var r=w.r*(1.1-t*0.25);
    var ox=Math.sin(w.phase+t)*3;
    var oy=Math.cos(w.phase*1.3+t)*2;
    var g=ctx.createRadialGradient(w.x+ox,w.y+oy,0,w.x+ox,w.y+oy,r);
    var dark=isDark();
    var core=dark?'rgba(200,220,240,'+(alpha*0.5)+')':'rgba(240,248,255,'+(alpha*0.55)+')';
    var mid=dark?'rgba(140,165,190,'+(alpha*0.35)+')':'rgba(180,200,220,'+(alpha*0.4)+')';
    g.addColorStop(0,core);
    g.addColorStop(0.45,mid);
    g.addColorStop(1,'rgba(120,150,180,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(w.x+ox,w.y+oy,r,0,Math.PI*2);
    ctx.fill();
  }
}

function drawPullStreaks(prog){
  if(!magnet.active)return;
  var magnetR=lerp(110,85,prog);
  for(var i=0;i<wisps.length;i++){
    var w=wisps[i];
    var dx=magnet.x-w.x,dy=magnet.y-w.y;
    var dist=Math.sqrt(dx*dx+dy*dy)||1;
    if(dist>magnetR*1.8)continue;
    var alpha=(1-dist/(magnetR*1.8))*0.35*w.life;
    ctx.strokeStyle='rgba(232,168,74,'+alpha+')';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(w.x,w.y);
    ctx.lineTo(magnet.x,magnet.y);
    ctx.stroke();
  }
}

function drawMagnet(prog){
  if(!magnet.active)return;
  var r=lerp(110,85,prog);
  var g=ctx.createRadialGradient(magnet.x,magnet.y,0,magnet.x,magnet.y,r);
  g.addColorStop(0,'rgba(232,168,74,0.12)');
  g.addColorStop(0.6,'rgba(200,180,140,0.06)');
  g.addColorStop(1,'rgba(180,200,220,0)');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(magnet.x,magnet.y,r,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle='rgba(232,168,74,0.35)';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.arc(magnet.x,magnet.y,18,0,Math.PI*2);
  ctx.stroke();
  ctx.fillStyle='rgba(232,168,74,0.5)';
  ctx.beginPath();
  ctx.arc(magnet.x,magnet.y,5,0,Math.PI*2);
  ctx.fill();
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col||'rgba(232,168,74,0.8)';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawRipples(){
  for(var i=0;i<ripples.length;i++){
    var rp=ripples[i];
    ctx.strokeStyle='rgba(232,168,74,'+(rp.life*0.4)+')';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(rp.x,rp.y,rp.r,0,Math.PI*2);
    ctx.stroke();
  }
}

function draw(prog){
  if(!ctx)return;
  ctx.save();
  if(shake>0.1){
    ctx.translate(rand(-shake,shake),rand(-shake,shake));
  }
  drawSky(prog||0);

  drawRooftops(prog||0);
  for(var i=0;i<wisps.length;i++)drawWisp(wisps[i],prog||0);
  drawPullStreaks(prog||0);

  drawBridge(prog||0);
  drawMagnet(prog||0);
  drawRipples();
  drawParticles();

  if(flash>0){
    ctx.fillStyle='rgba(255,220,160,'+(flash*0.25)+')';
    ctx.fillRect(0,0,W,H);
  }

  if(state==='title'){
    ctx.fillStyle=isDark()?'rgba(15,20,25,0.35)':'rgba(232,237,242,0.25)';
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();
}

var last=0;
function loop(ts){
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000);
  last=ts;
  var prog=state==='playing'?clamp(elapsed/ROUND,0,1):0;
  update(dt);
  if(state==='title')draw(0);
  else if(state==='playing'||state==='gameover')draw(prog);
  else draw(0);
  requestAnimationFrame(loop);
}

function setMagnet(x,y,on){
  magnet.active=!!on;
  magnet.x=x;magnet.y=y;
}

function pointerPos(e){
  var r=canvas.getBoundingClientRect();
  var cx=e.clientX!=null?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:W/2);
  var cy=e.clientY!=null?e.clientY:(e.touches&&e.touches[0]?e.touches[0].clientY:H/2);
  return {x:cx-r.left,y:cy-r.top};
}

function onDown(e){
  if(state!=='playing')return;
  if(e.target&&e.target.closest&&e.target.closest('.btn'))return;
  if(e.cancelable)e.preventDefault();
  var p=pointerPos(e);
  setMagnet(p.x,p.y,true);
}

function onMove(e){
  if(state!=='playing'||!magnet.active)return;
  if(e.cancelable)e.preventDefault();
  var p=pointerPos(e);
  setMagnet(p.x,p.y,true);
}

function onUp(){
  magnet.active=false;
}

function onKeyDown(e){
  if(state==='playing'&&(e.code==='Space'||e.key===' ')){
    e.preventDefault();
    setMagnet(W/2,H*0.55,true);
  }
}

function onKeyUp(e){
  if(e.code==='Space'||e.key===' ')magnet.active=false;
}

if(startBtn)startBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
if(restartBtn)restartBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});

if(canvas){
  canvas.addEventListener('mousedown',onDown);
  canvas.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  canvas.addEventListener('touchstart',onDown,{passive:false});
  canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('touchend',onUp);
  canvas.addEventListener('touchcancel',onUp);
}
window.addEventListener('keydown',onKeyDown);
window.addEventListener('keyup',onKeyUp);
window.addEventListener('resize',resize);

resize();
if(!ctx&&canvas){
  canvas.style.background=isDark()?'#0f1419':'#e8edf2';
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
