<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeline Scrambler</title>
<style>
  :root {
    --bg: #f0f0f0;
    --text: #111;
    --panel: #ccc;
    --accent: #e63946;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11;
      --text: #f1faee;
      --panel: #222;
    }
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  #hud {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--text);
    text-shadow: 0 0 4px var(--bg);
  }
  .screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background: rgba(255,255,255,0.9);
    color: #000;
    padding: 2rem;
    border: 2px solid var(--text);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  @media (prefers-color-scheme: dark) {
    .screen {
      background: rgba(0,0,0,0.85);
      color: #fff;
    }
  }
  h1 {
    margin-top: 0;
    font-size: 1.5rem;
    letter-spacing: 2px;
  }
  p {
    font-size: 0.9rem;
    max-width: 250px;
    line-height: 1.4;
    margin-bottom: 2rem;
  }
  button {
    pointer-events: auto;
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 1rem 2rem;
    font-size: 1.2rem;
    font-family: inherit;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  button:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="ui-layer">
  <div id="hud" style="display:none; pointer-events:none;">
    CLIPS REPAIRED: <span id="hud-score">0</span>
  </div>
  
  <div id="title-screen" class="screen">
    <h1>TIMELINE_SCRAMBLER</h1>
    <p>Reconstruct the corrupted product demo clips before the broadcast auto-plays.</p>
    <button data-smoke="start">START EDITING</button>
  </div>
  
  <div id="game-over-screen" class="screen" style="display:none">
    <h1>BROADCAST_FAILED</h1>
    <p>Frames repaired: <span id="final-score">0</span></p>
    <button data-smoke="restart">REBOOT SYSTEM</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
if (!ctx) document.body.innerHTML = 'Canvas not supported';

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, type, duration, vol=0.1) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function playNoise(duration, vol=0.1) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  noise.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  isDark = e.matches;
});

const noiseCanvas = document.createElement('canvas');
noiseCanvas.width = 256;
noiseCanvas.height = 256;
const nctx = noiseCanvas.getContext('2d');
let imgData = nctx.createImageData(256, 256);
for(let i=0; i<imgData.data.length; i+=4) {
  let v = Math.random() * 255;
  imgData.data[i] = v;
  imgData.data[i+1] = v;
  imgData.data[i+2] = v;
  imgData.data[i+3] = 12; 
}
nctx.putImageData(imgData, 0, 0);

function drawNoiseOverlay() {
  ctx.save();
  ctx.fillStyle = ctx.createPattern(noiseCanvas, 'repeat');
  ctx.translate(Math.random()*256, Math.random()*256);
  ctx.fillRect(-256, -256, canvas.width+256, canvas.height+256);
  ctx.restore();
}

let gameState = 'MENU';
let score = 0;
let level = 1;
let frameCount = 3;
let timeLimit = 15;
let timeRemaining = 15;
let checkProgress = 0;
let shakeAmount = 0;

let monitorRect = {x:0, y:0, w:0, h:0};
let timelineSlots = [];
let binSlots = [];
let frames = [];

class Frame {
  constructor(id, correctIndex, img) {
    this.id = id;
    this.correctIndex = correctIndex;
    this.img = img;
    this.slot = null;
    this.lastSlot = null;
    this.x = 0;
    this.y = 0;
  }
  update(dt) {
    if (this !== draggedFrame && this.slot) {
      this.x += (this.slot.x - this.x) * 15 * dt;
      this.y += (this.slot.y - this.y) * 15 * dt;
    }
  }
  draw(c) {
    let w = this.slot ? this.slot.w : (this.lastSlot ? this.lastSlot.w : 80);
    let h = this.slot ? this.slot.h : (this.lastSlot ? this.lastSlot.h : 80);
    c.drawImage(this.img, this.x, this.y, w, h);
    c.strokeStyle = '#555';
    c.strokeRect(this.x, this.y, w, h);
  }
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (frameCount === 0) return;
  
  let w = canvas.width;
  let h = canvas.height;
  
  monitorRect.w = Math.min(w * 0.9, 600);
  monitorRect.h = monitorRect.w * 0.6;
  monitorRect.x = (w - monitorRect.w) / 2;
  monitorRect.y = Math.max(h * 0.05, 40);
  
  let maxCols = Math.min(frameCount, 6);
  let slotSize = Math.min((w * 0.9) / maxCols, 90);
  let padding = slotSize * 0.15;
  
  let timelineW = (slotSize + padding) * frameCount - padding;
  let startX = (w - timelineW) / 2;
  let startY = monitorRect.y + monitorRect.h + Math.max(h * 0.05, 20);
  
  let oldTimeline = timelineSlots.map(s => s.frame);
  timelineSlots = [];
  for(let i=0; i<frameCount; i++) {
    timelineSlots.push({ x: startX + i * (slotSize + padding), y: startY, w: slotSize, h: slotSize, frame: null });
  }
  
  let cols = frameCount > 4 ? Math.ceil(frameCount / 2) : frameCount;
  let rows = frameCount > 4 ? 2 : 1;
  let binW = (slotSize + padding) * cols - padding;
  let binStartX = (w - binW) / 2;
  let binStartY = startY + slotSize + Math.max(h * 0.08, 40);
  
  let oldBin = binSlots.map(s => s.frame);
  binSlots = [];
  for(let i=0; i<frameCount; i++) {
    let r = Math.floor(i / cols);
    let c = i % cols;
    binSlots.push({ x: binStartX + c * (slotSize + padding), y: binStartY + r * (slotSize + padding), w: slotSize, h: slotSize, frame: null });
  }
  
  for(let i=0; i<timelineSlots.length; i++) {
    if (oldTimeline[i]) {
      timelineSlots[i].frame = oldTimeline[i];
      oldTimeline[i].slot = timelineSlots[i];
      oldTimeline[i].x = timelineSlots[i].x;
      oldTimeline[i].y = timelineSlots[i].y;
    }
  }
  for(let i=0; i<binSlots.length; i++) {
    if (oldBin[i]) {
      binSlots[i].frame = oldBin[i];
      oldBin[i].slot = binSlots[i];
      oldBin[i].x = binSlots[i].x;
      oldBin[i].y = binSlots[i].y;
    }
  }
}
window.addEventListener('resize', resize);

function safeRoundRect(c, x, y, width, height, radius) {
  c.beginPath();
  c.moveTo(x + radius, y);
  c.lineTo(x + width - radius, y);
  c.quadraticCurveTo(x + width, y, x + width, y + radius);
  c.lineTo(x + width, y + height - radius);
  c.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  c.lineTo(x + radius, y + height);
  c.quadraticCurveTo(x, y + height, x, y + height - radius);
  c.lineTo(x, y + radius);
  c.quadraticCurveTo(x, y, x + radius, y);
  c.closePath();
}

const scenes = [
  function drawBattery(c, w, h, p, dark) {
    let cx = w/2, cy = h/2;
    c.strokeStyle = dark ? '#fff' : '#000';
    c.lineWidth = 3;
    c.strokeRect(cx - 20, cy - 10, 40, 20);
    c.fillRect(cx + 20, cy - 5, 3, 10);
    c.fillStyle = '#27c93f';
    let iw = 34 * p;
    if (iw > 0) c.fillRect(cx - 17, cy - 7, iw, 14);
  },
  function drawChart(c, w, h, p, dark) {
    c.strokeStyle = dark ? '#fff' : '#000';
    c.lineWidth = 2;
    c.beginPath(); c.moveTo(10, 10); c.lineTo(10, h-10); c.lineTo(w-10, h-10); c.stroke();
    let pts = [[10, h-10], [30, h-30], [50, h-20], [70, h-60], [90, h-70]];
    c.strokeStyle = '#007acc'; c.lineWidth = 3; c.beginPath();
    let tot = pts.length - 1; let cur = p * tot;
    for(let i=0; i<tot; i++) {
      if (cur > i) {
        if (i===0) c.moveTo(pts[i][0], pts[i][1]);
        let t = Math.min(1, cur - i);
        c.lineTo(pts[i][0] + (pts[i+1][0] - pts[i][0])*t, pts[i][1] + (pts[i+1][1] - pts[i][1])*t);
      }
    }
    c.stroke();
  },
  function drawToggle(c, w, h, p, dark) {
    let cx = w/2, cy = h/2;
    c.fillStyle = p > 0.5 ? '#27c93f' : (dark ? '#555' : '#ccc');
    safeRoundRect(c, cx - 25, cy - 12, 50, 24, 12); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(cx - 13 + (26 * p), cy, 10, 0, Math.PI*2); c.fill();
  },
  function drawSun(c, w, h, p, dark) {
    c.fillStyle = dark ? '#1a1a2e' : '#87ceeb'; c.fillRect(0,0,w,h);
    c.fillStyle = '#ffb703'; c.beginPath(); c.arc(w/2, h - (h * 0.6 * p), 15, 0, Math.PI*2); c.fill();
    c.fillStyle = dark ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.8)';
    c.fillRect(0, h-20, w, 20); c.fillRect(0, h-35, w, 35);
  },
  function drawFolder(c, w, h, p, dark) {
    let cx = w/2, cy = h/2;
    c.fillStyle = dark ? '#ddd' : '#fff'; c.fillRect(cx - 15, cy - (20 * p), 30, 25);
    c.fillStyle = '#fb8500'; c.beginPath();
    c.moveTo(cx-25, cy-10); c.lineTo(cx-10, cy-10); c.lineTo(cx-5, cy-5); c.lineTo(cx+25, cy-5);
    c.lineTo(cx+25, cy+20); c.lineTo(cx-25, cy+20); c.fill();
    c.fillStyle = '#ffb703'; let fh = 25 - (10 * p); c.fillRect(cx - 25, cy + 20 - fh, 50, fh);
  },
  function drawSpinner(c, w, h, p, dark) {
    c.strokeStyle = dark ? '#fff' : '#000'; c.lineWidth = 4;
    c.beginPath(); c.arc(w/2, h/2, 15, 0, Math.PI * 2 * p); c.stroke();
  },
  function drawCode(c, w, h, p, dark) {
    c.fillStyle = dark ? '#a8dadc' : '#1d3557'; c.font = '10px monospace';
    let lines = ["function init() {", "  setup();", "  loop();", "}"];
    let tot = lines.join('').length; let show = Math.floor(p * tot); let cur = 0;
    for(let i=0; i<lines.length; i++) {
      let l = lines[i];
      if (cur + l.length <= show) { c.fillText(l, 10, 20 + i*12); cur += l.length; }
      else { let r = show - cur; if (r>0) c.fillText(l.substring(0, r), 10, 20 + i*12); break; }
    }
  }
];

function generateLevel() {
  frameCount = Math.min(3 + Math.floor((level - 1) / 2), 6);
  timeLimit = Math.max(15 - (level - 1) * 1.5, 6);
  timeRemaining = timeLimit;
  
  let sceneFn = scenes[Math.floor(Math.random() * scenes.length)];
  frames = [];
  
  for(let i=0; i<frameCount; i++) {
    let p = i / (frameCount - 1);
    let oc = document.createElement('canvas'); oc.width = 100; oc.height = 100;
    let octx = oc.getContext('2d');
    octx.fillStyle = isDark ? '#1a1a1a' : '#f8f8f8'; octx.fillRect(0,0,100,100);
    octx.fillStyle = isDark ? '#333' : '#ddd'; octx.fillRect(0,0,100,15);
    octx.fillStyle = '#ff5f56'; octx.beginPath(); octx.arc(10,7,3,0,Math.PI*2); octx.fill();
    octx.fillStyle = '#ffbd2e'; octx.beginPath(); octx.arc(20,7,3,0,Math.PI*2); octx.fill();
    octx.fillStyle = '#27c93f'; octx.beginPath(); octx.arc(30,7,3,0,Math.PI*2); octx.fill();
    
    octx.save(); octx.translate(0, 15); sceneFn(octx, 100, 85, p, isDark); octx.restore();
    
    let imgData = octx.getImageData(0,0,100,100);
    for(let j=0; j<imgData.data.length; j+=4) {
      let v = Math.random()*255; let a = 0.05;
      imgData.data[j] = imgData.data[j]*(1-a) + v*a;
      imgData.data[j+1] = imgData.data[j+1]*(1-a) + v*a;
      imgData.data[j+2] = imgData.data[j+2]*(1-a) + v*a;
    }
    octx.putImageData(imgData, 0, 0);
    frames.push(new Frame(i, i, oc));
  }
  
  let shuffled = [...frames].sort(() => Math.random() - 0.5);
  resize();
  
  for(let i=0; i<frameCount; i++) {
    shuffled[i].slot = binSlots[i];
    binSlots[i].frame = shuffled[i];
    shuffled[i].x = binSlots[i].x;
    shuffled[i].y = binSlots[i].y;
  }
  
  gameState = 'PLAYING';
}

function startGame() {
  score = 0; level = 1;
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-over-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('hud-score').innerText = score;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  generateLevel();
}

function endGame() {
  gameState = 'GAME_OVER';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('game-over-screen').style.display = 'flex';
  document.getElementById('final-score').innerText = score;
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

document.querySelector('[data-smoke="start"]').addEventListener('click', startGame);
document.querySelector('[data-smoke="restart"]').addEventListener('click', startGame);

let pointer = { id: -1, x: 0, y: 0, down: false };
let draggedFrame = null;
let dragOffset = { x: 0, y: 0 };

function getSlotAt(x, y) {
  for(let s of timelineSlots.concat(binSlots)) {
    if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) return s;
  }
  return null;
}

function handleDragStart() {
  let s = getSlotAt(pointer.x, pointer.y);
  if (s && s.frame) {
    draggedFrame = s.frame;
    draggedFrame.lastSlot = s;
    s.frame = null;
    draggedFrame.slot = null;
    dragOffset.x = pointer.x - draggedFrame.x;
    dragOffset.y = pointer.y - draggedFrame.y;
    playTone(400, 'sine', 0.05);
  }
}

function handleDragMove() {
  draggedFrame.x = pointer.x - dragOffset.x;
  draggedFrame.y = pointer.y - dragOffset.y;
}

function handleDragEnd() {
  let s = getSlotAt(pointer.x, pointer.y);
  if (s) {
    if (s.frame) {
      let existing = s.frame;
      existing.slot = draggedFrame.lastSlot;
      draggedFrame.lastSlot.frame = existing;
      draggedFrame.slot = s;
      s.frame = draggedFrame;
    } else {
      draggedFrame.slot = s;
      s.frame = draggedFrame;
    }
    playTone(300, 'sine', 0.05);
  } else {
    draggedFrame.slot = draggedFrame.lastSlot;
    draggedFrame.lastSlot.frame = draggedFrame;
    playTone(200, 'triangle', 0.1);
  }
  draggedFrame = null;
}

window.addEventListener('pointerdown', e => {
  if (e.target !== canvas) return;
  if (pointer.down) return;
  pointer.id = e.pointerId; pointer.x = e.clientX; pointer.y = e.clientY; pointer.down = true;
  if (gameState === 'PLAYING') handleDragStart();
});
window.addEventListener('pointermove', e => {
  if (e.target !== canvas) return;
  if (pointer.down && pointer.id === e.pointerId) {
    pointer.x = e.clientX; pointer.y = e.clientY;
    if (draggedFrame) handleDragMove();
  }
});
window.addEventListener('pointerup', e => {
  if (e.target !== canvas) return;
  if (pointer.down && pointer.id === e.pointerId) {
    pointer.down = false;
    if (draggedFrame) handleDragEnd();
  }
});
window.addEventListener('pointercancel', e => {
  if (pointer.down && pointer.id === e.pointerId) {
    pointer.down = false;
    if (draggedFrame) handleDragEnd();
  }
});

function updatePlaying(dt) {
  let allFilled = true;
  for(let s of timelineSlots) if (!s.frame) { allFilled = false; break; }
  
  if (allFilled && !draggedFrame) timeRemaining -= dt * 5;
  else timeRemaining -= dt;
  
  if (timeRemaining <= 0) {
    timeRemaining = 0;
    if (draggedFrame) handleDragEnd();
    gameState = 'CHECKING';
    checkProgress = 0;
  }
}

function updateChecking(dt) {
  checkProgress += dt / 1.5;
  if (checkProgress >= 1) {
    let isCorrect = true;
    for(let i=0; i<timelineSlots.length; i++) {
      if (!timelineSlots[i].frame || timelineSlots[i].frame.correctIndex !== i) {
        isCorrect = false; break;
      }
    }
    if (isCorrect) {
      playTone(600, 'sine', 0.1); setTimeout(()=> playTone(800, 'sine', 0.2), 100);
      score++; document.getElementById('hud-score').innerText = score;
      level++; generateLevel();
    } else {
      playNoise(0.5, 0.2); shakeAmount = 1; gameState = 'FAILED';
      setTimeout(endGame, 1000);
    }
  }
}

let lastTime = performance.now();
function loop(time) {
  let dt = (time - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = time;
  
  if (gameState === 'PLAYING') updatePlaying(dt);
  else if (gameState === 'CHECKING') updateChecking(dt);
  
  if (shakeAmount > 0) shakeAmount -= dt * 20;
  if (shakeAmount < 0) shakeAmount = 0;
  
  for(let f of frames) f.update(dt);
  
  ctx.fillStyle = isDark ? '#0f0f11' : '#f0f0f0';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  if (shakeAmount > 0) {
    ctx.save();
    ctx.translate((Math.random()-0.5)*shakeAmount*10, (Math.random()-0.5)*shakeAmount*10);
  }
  
  ctx.fillStyle = isDark ? '#1a1a1a' : '#e0e0e0';
  ctx.fillRect(monitorRect.x, monitorRect.y, monitorRect.w, monitorRect.h);
  ctx.strokeStyle = isDark ? '#333' : '#aaa';
  ctx.lineWidth = 4;
  ctx.strokeRect(monitorRect.x, monitorRect.y, monitorRect.w, monitorRect.h);
  
  if (gameState === 'PLAYING' || gameState === 'MENU') {
    ctx.fillStyle = isDark ? '#333' : '#999';
    ctx.font = '20px ui-monospace, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('NO SIGNAL', monitorRect.x + monitorRect.w/2, monitorRect.y + monitorRect.h/2);
  } else if (gameState === 'CHECKING') {
    let tot = timelineSlots.length;
    let idx = Math.floor(checkProgress * tot);
    if (idx >= tot) idx = tot - 1;
    let s = timelineSlots[idx];
    if (s && s.frame) {
      ctx.drawImage(s.frame.img, monitorRect.x, monitorRect.y, monitorRect.w, monitorRect.h);
    } else {
      ctx.fillStyle = '#f00'; ctx.fillRect(monitorRect.x, monitorRect.y, monitorRect.w, monitorRect.h);
    }
    let sx = monitorRect.x + (checkProgress * monitorRect.w);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillRect(sx - 2, monitorRect.y, 4, monitorRect.h);
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
    ctx.fillRect(sx - 2, monitorRect.y, 4, monitorRect.h); ctx.shadowBlur = 0;
  } else if (gameState === 'FAILED') {
    for(let i=0; i<15; i++) {
      ctx.fillStyle = ['#f00', '#0f0', '#00f', '#fff'][Math.floor(Math.random()*4)];
      ctx.fillRect(monitorRect.x + Math.random()*monitorRect.w, monitorRect.y + Math.random()*monitorRect.h, Math.random()*100, Math.random()*20);
    }
  }
  
  ctx.strokeStyle = isDark ? '#444' : '#bbb';
  ctx.lineWidth = 2;
  
  for(let s of timelineSlots.concat(binSlots)) {
    ctx.fillStyle = isDark ? '#1a1a1a' : '#ddd';
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.strokeRect(s.x, s.y, s.w, s.h);
    if (timelineSlots.includes(s)) {
      ctx.fillStyle = isDark ? '#444' : '#999';
      ctx.font = '12px monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(timelineSlots.indexOf(s)+1, s.x + 4, s.y + 4);
    }
  }
  
  if (gameState !== 'MENU') {
    if (timelineSlots.length > 0) {
      let first = timelineSlots[0];
      let last = timelineSlots[timelineSlots.length-1];
      let barW = last.x + last.w - first.x;
      let timerY = first.y + first.h + 20;
      let ratio = Math.max(0, timeRemaining / timeLimit);
      ctx.fillStyle = isDark ? '#333' : '#ccc';
      ctx.fillRect(first.x, timerY, barW, 6);
      let fgColor = ratio > 0.3 ? (isDark ? '#0ff' : '#007acc') : '#e63946';
      ctx.fillStyle = fgColor; ctx.shadowColor = fgColor; ctx.shadowBlur = 10;
      ctx.fillRect(first.x, timerY, barW * ratio, 6); ctx.shadowBlur = 0;
    }
    
    for(let f of frames) if (f !== draggedFrame) f.draw(ctx);
    
    if (draggedFrame) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10;
      let dw = draggedFrame.lastSlot ? draggedFrame.lastSlot.w : 80;
      let dh = draggedFrame.lastSlot ? draggedFrame.lastSlot.h : 80;
      ctx.translate(draggedFrame.x + dw/2, draggedFrame.y + dh/2);
      ctx.scale(1.1, 1.1);
      ctx.translate(-(draggedFrame.x + dw/2), -(draggedFrame.y + dh/2));
      draggedFrame.draw(ctx);
      ctx.restore();
    }
  }
  
  if (shakeAmount > 0) ctx.restore();
  drawNoiseOverlay();
  
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);

</script>
</body>
</html>
