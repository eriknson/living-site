<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golden Ribbons</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  background:var(--bg);color:var(--fg);
  --bg:#1a1208;--fg:#f5e6d0;--muted:#a08060;--accent:#e07030;
  --panel:rgba(20,14,8,.88);--btn-bg:#e07030;--btn-fg:#1a0e04;
  --hud:rgba(10,8,4,.55);
}
@media(prefers-color-scheme:light){
  body{
    --bg:#f0e4d4;--fg:#2a1808;--muted:#7a6048;--accent:#c05820;
    --panel:rgba(255,248,238,.92);--btn-bg:#2a1808;--btn-fg:#fff8f0;
    --hud:rgba(255,248,238,.72);
  }
}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh}
#game{display:block;width:100%;height:100%;touch-action:none}
#hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:max(10px,env(safe-area-inset-top)) 14px 0;
  pointer-events:none;z-index:2;
}
.hud-pill{
  background:var(--hud);backdrop-filter:blur(8px);
  border:1px solid rgba(128,96,64,.25);border-radius:999px;
  padding:7px 13px;font-size:12px;letter-spacing:.05em;
  transition:opacity .35s;
}
#hud:not(.playing) .hud-pill{opacity:0}
#palette{
  position:absolute;top:max(44px,env(safe-area-inset-top));left:14px;right:14px;
  height:6px;border-radius:999px;overflow:hidden;pointer-events:none;z-index:2;
  opacity:0;transition:opacity .4s;
}
#palette.visible{opacity:1}
#palette span{display:block;height:100%;float:left;transition:width .35s ease}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:20px;z-index:5;pointer-events:none;
  transition:opacity .45s ease,visibility .45s;
}
.overlay.hidden{opacity:0;visibility:hidden}
.panel{
  background:var(--panel);backdrop-filter:blur(14px);
  border:1px solid rgba(180,120,60,.22);border-radius:20px;
  padding:26px 22px 22px;max-width:340px;width:100%;
}
.panel h1{font-size:21px;font-weight:600;letter-spacing:.08em;margin-bottom:6px}
.panel .sub{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:18px}
.panel .score-big{font-size:40px;font-weight:600;color:var(--accent);margin:6px 0 2px}
.panel .score-label{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
.btn{
  pointer-events:auto;min-height:48px;min-width:168px;padding:14px 26px;
  border:none;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);
  font:inherit;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;touch-action:manipulation;
  transition:transform .14s ease,opacity .14s;
}
.btn:active{transform:scale(.96)}
.hint{
  position:absolute;bottom:max(18px,env(safe-area-inset-bottom));
  left:0;right:0;text-align:center;font-size:10px;color:var(--muted);
  letter-spacing:.08em;pointer-events:none;z-index:2;
  opacity:1;transition:opacity .3s;
}
.hint.hidden{opacity:0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-pill" id="scoreHud">0 ribbons</div>
    <div class="hud-pill" id="timeHud">0:50</div>
  </div>
  <div id="palette"></div>
  <div class="hint" id="hint">drag to catch ribbons · ← → keys</div>
  <div class="overlay" id="titleScreen">
    <div class="panel">
      <h1>GOLDEN RIBBONS</h1>
      <p class="sub">Autumn fog unravels over the bay. Drag your sail to intercept dissolving ribbons before they touch the water — each catch paints another streak into your sunset.</p>
      <button class="btn" data-smoke="start" id="startBtn">Hold the Dusk</button>
    </div>
  </div>
  <div class="overlay hidden" id="gameOverScreen">
    <div class="panel">
      <h1 id="endTitle">TWILIGHT</h1>
      <p class="sub" id="endSub">The water claims what you couldn't hold.</p>
      <div class="score-big" id="finalScore">0</div>
      <div class="score-label">ribbons saved</div>
      <button class="btn" data-smoke="restart" id="restartBtn">Paint Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('game');
var ctx=canvas&&canvas.getContext?canvas.getContext('2d'):null;
var titleScreen=document.getElementById('titleScreen');
var gameOverScreen=document.getElementById('gameOverScreen');
var startBtn=document.getElementById('startBtn');
var restartBtn=document.getElementById('restartBtn');
var scoreHud=document.getElementById('scoreHud');
var timeHud=document.getElementById('timeHud');
var hint=document.getElementById('hint');
var hud=document.getElementById('hud');
var paletteEl=document.getElementById('palette');
var endTitle=document.getElementById('endTitle');
var endSub=document.getElementById('endSub');
var finalScore=document.getElementById('finalScore');

var W=360,H=640,DPR=1;
var state='title';
var score=0,combo=0,maxCombo=0,missed=0;
var elapsed=0,ROUND=50;
var ribbons=[],particles=[],splashes=[],gusts=[];
var collector={x:180,w:72,y:0};
var drag={active:false,offsetX:0};
var keys={left:false,right:false};
var audioCtx=null;
var windPhase=0,spawnTimer=0,difficulty=0;
var shake=0,flash=0,hitPause=0;
var paletteColors=[];
var bridgePts=[],waterY=0,idleRibbons=[];
var isDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;

var RIBBON_COLORS=[
  '#e07030','#d85828','#f09040','#c84820','#ffb060',
  '#a83818','#ff8040','#e89848','#d06020','#ff9850'
];

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}

function initAudio(){
  try{
    var AC=typeof AudioContext!=='undefined'?AudioContext:(typeof webkitAudioContext!=='undefined'?webkitAudioContext:null);
    if(AC)audioCtx=new AC();
  }catch(e){}
}

function tone(freq,dur,type,vol){
  if(!audioCtx)return;
  try{
    if(audioCtx.state==='suspended')audioCtx.resume();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.08,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.12));
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+(dur||0.12));
  }catch(e){}
}

function resize(){
  if(!canvas)return;
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||360;H=window.innerHeight||640;
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  if(ctx)ctx.setTransform(DPR,0,0,DPR,0,0);
  waterY=H*0.78;
  collector.y=waterY-28;
  collector.x=W*0.5;
  buildBridge();
}

function buildBridge(){
  bridgePts=[];
  var bx=W*0.5,bw=W*0.72,bh=H*0.22,by=waterY-bh*0.85;
  for(var i=0;i<=24;i++){
    var t=i/24;
    var x=bx-bw*0.5+bw*t;
    var arch=Math.sin(t*Math.PI)*bh*0.55;
    bridgePts.push({x:x,y:by+bh-arch});
  }
  idleRibbons=[];
  for(var j=0;j<4;j++){
    idleRibbons.push({
      x:W*(0.15+j*0.22),y:H*(0.12+j*0.08),w:18+j*3,h:50+j*8,
      rot:-0.15+j*0.1,alpha:0.25+j*0.08,type:'real',
      color:RIBBON_COLORS[j%RIBBON_COLORS.length],
      segments:[{ox:-4,oy:0,sway:j,amp:5},{ox:3,oy:18,sway:j+1,amp:7},{ox:-2,oy:36,sway:j+2,amp:5}]
    });
  }
}

function resetGame(){
  score=0;combo=0;maxCombo=0;missed=0;elapsed=0;
  difficulty=0;spawnTimer=0;windPhase=0;
  ribbons=[];particles=[];splashes=[];gusts=[];
  paletteColors=[];shake=0;flash=0;hitPause=0;
  collector.x=W*0.5;
  updatePaletteUI();
  updateHud();
}

function startGame(){
  resetGame();
  state='playing';
  titleScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  hint.classList.add('hidden');
  hud.classList.add('playing');
  paletteEl.classList.add('visible');
  initAudio();
  tone(220,0.15,'sine',0.06);
}

function endGame(won){
  state='gameover';
  gameOverScreen.classList.remove('hidden');
  hint.classList.add('hidden');
  hud.classList.remove('playing');
  finalScore.textContent=String(score);
  if(won){
    endTitle.textContent='SUNSET COMPLETE';
    endSub.textContent='You held the whole dusk in your sail.';
    tone(440,0.2,'sine',0.07);setTimeout(function(){tone(554,0.25,'sine',0.06);},120);
  }else{
    endTitle.textContent='TWILIGHT';
    endSub.textContent=missed>=3?'Three ribbons lost to the bay.':'Time ran out before the last light.';
    tone(180,0.3,'triangle',0.05);
  }
  try{navigator.vibrate&&navigator.vibrate(won?[20,30,20]:[40]);}catch(e){}
}

function updateHud(){
  if(scoreHud)scoreHud.textContent=score+(combo>1?' · ×'+combo:'')+' ribbons';
  var rem=Math.max(0,Math.ceil(ROUND-elapsed));
  if(timeHud)timeHud.textContent=Math.floor(rem/60)+':'+(rem%60<10?'0':'')+(rem%60);
}

function updatePaletteUI(){
  if(!paletteEl)return;
  paletteEl.innerHTML='';
  if(!paletteColors.length){
    var ph=document.createElement('span');
    ph.style.width='100%';ph.style.background=isDark?'#3a2818':'#d8c8b0';
    paletteEl.appendChild(ph);
    return;
  }
  var total=paletteColors.length;
  for(var i=0;i<total;i++){
    var s=document.createElement('span');
    s.style.width=(100/total)+'%';
    s.style.background=paletteColors[i];
    paletteEl.appendChild(s);
  }
}

function addPaletteColor(c){
  paletteColors.push(c);
  if(paletteColors.length>24)paletteColors.shift();
  updatePaletteUI();
}

function spawnRibbon(){
  var decoyChance=clamp(0.08+difficulty*0.12,0,0.45);
  var isDecoy=Math.random()<decoyChance;
  var w=rand(18,32)+difficulty*8;
  var x=rand(w,W-w);
  ribbons.push({
    x:x,y:-40,
    w:w,h:rand(50,90)+difficulty*15,
    vx:rand(-0.4,0.4),
    vy:rand(1.2,1.8)+difficulty*0.9,
    rot:rand(-0.3,0.3),
    vr:rand(-0.02,0.02),
    alpha:rand(0.55,0.85),
    type:isDecoy?'decoy':'real',
    color:isDecoy?'':RIBBON_COLORS[Math.floor(Math.random()*RIBBON_COLORS.length)],
    dissolve:rand(0.002,0.005),
    segments:[]
  });
  var r=ribbons[ribbons.length-1];
  var segCount=5+Math.floor(Math.random()*4);
  for(var i=0;i<segCount;i++){
    r.segments.push({ox:rand(-w*0.3,w*0.3),oy:i*(r.h/segCount),sway:rand(0,Math.PI*2),amp:rand(2,8)});
  }
}

function spawnParticles(x,y,col,n){
  for(var i=0;i<(n||8);i++){
    particles.push({
      x:x,y:y,
      vx:rand(-2.5,2.5),vy:rand(-3,0.5),
      life:rand(0.4,0.9),max:0.9,
      r:rand(1.5,4),color:col||'#ffb060'
    });
  }
}

function spawnSplash(x){
  splashes.push({x:x,y:waterY,life:0.6,max:0.6,r:0});
  for(var i=0;i<6;i++){
    particles.push({
      x:x+rand(-20,20),y:waterY,
      vx:rand(-1.5,1.5),vy:rand(-2,-0.5),
      life:rand(0.3,0.6),max:0.6,
      r:rand(1,3),color:isDark?'#6080a0':'#5080b0'
    });
  }
}

function catchRibbon(r,idx){
  ribbons.splice(idx,1);
  if(r.type==='decoy'){
    combo=0;
    flash=0.15;
    shake=4;
    tone(120,0.15,'sawtooth',0.04);
    spawnParticles(r.x,r.y,'#a0a8b0',10);
    try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
    return;
  }
  combo++;
  if(combo>maxCombo)maxCombo=combo;
  score+=1+Math.floor(combo/3);
  hitPause=3;
  flash=0.08;
  shake=2;
  addPaletteColor(r.color);
  spawnParticles(r.x,r.y,r.color,12);
  tone(330+combo*20,0.1,'sine',0.06);
  if(combo%5===0){
    tone(523,0.08,'sine',0.05);
    try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}
  }
}

function missRibbon(r){
  ribbons.splice(ribbons.indexOf(r),1);
  if(r.type==='real'){
    missed++;
    combo=0;
    spawnSplash(r.x);
    shake=6;
    tone(90,0.2,'triangle',0.04);
    try{navigator.vibrate&&navigator.vibrate(50);}catch(e){}
    if(missed>=3){endGame(false);return;}
  }
}

function update(dt){
  if(state!=='playing')return;
  if(hitPause>0){hitPause--;return;}

  elapsed+=dt;
  difficulty=clamp(elapsed/ROUND,0,1);
  windPhase+=dt*(0.8+difficulty*1.5);

  if(elapsed>=ROUND){endGame(true);return;}

  spawnTimer-=dt;
  var interval=lerp(1.4,0.45,difficulty);
  if(spawnTimer<=0){
    spawnRibbon();
    if(Math.random()<difficulty*0.4)spawnRibbon();
    spawnTimer=interval;
  }

  if(Math.random()<0.008+difficulty*0.015){
    gusts.push({life:rand(1.5,3),str:rand(1.5,4+difficulty*3),dir:Math.random()<0.5?-1:1});
  }

  var gustForce=0;
  for(var g=0;g<gusts.length;g++){
    gusts[g].life-=dt;
    gustForce+=gusts[g].dir*gusts[g].str*Math.sin(windPhase*3)*0.15;
    if(gusts[g].life<=0){gusts.splice(g,1);g--;}
  }

  var move=0;
  if(keys.left)move-=1;
  if(keys.right)move+=1;
  if(move)collector.x+=move*420*dt;
  collector.x=clamp(collector.x,collector.w*0.5,W-collector.w*0.5);

  for(var i=ribbons.length-1;i>=0;i--){
    var r=ribbons[i];
    var wind=Math.sin(windPhase+r.x*0.01)*0.6+gustForce;
    r.x+=r.vx+wind*dt*30;
    r.y+=r.vy*(1+difficulty*0.5);
    r.rot+=r.vr;
    r.alpha-=r.dissolve;
    for(var s=0;s<r.segments.length;s++){
      r.segments[s].sway+=dt*2;
    }

    var caught=r.y+r.h*0.5>collector.y-8&&
      r.y<collector.y+20&&
      Math.abs(r.x-collector.x)<(collector.w+r.w)*0.45;
    if(caught){catchRibbon(r,i);continue;}

    if(r.y-r.h>waterY+10||r.alpha<=0.05){
      if(r.y>waterY-10&&r.type==='real')missRibbon(r);
      else ribbons.splice(i,1);
    }
  }

  for(var p=particles.length-1;p>=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.08;
    pt.life-=dt;
    if(pt.life<=0)particles.splice(p,1);
  }
  for(var sp=0;sp<splashes.length;sp++){
    splashes[sp].life-=dt;
    splashes[sp].r=lerp(0,40,1-splashes[sp].life/splashes[sp].max);
    if(splashes[sp].life<=0){splashes.splice(sp,1);sp--;}
  }

  if(shake>0)shake*=0.85;
  if(flash>0)flash-=dt;
  updateHud();
}

function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,waterY);
  var skyTop=isDark?'#0a0810':'#6a3820';
  var skyMid=isDark?'#2a1810':'#c06030';
  var skyLow=isDark?'#4a2818':'#e89050';

  if(paletteColors.length>2){
    skyMid=paletteColors[paletteColors.length-1];
    skyLow=paletteColors[Math.max(0,paletteColors.length-3)];
  }

  g.addColorStop(0,skyTop);
  g.addColorStop(0.45,skyMid);
  g.addColorStop(1,skyLow);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,waterY);

  ctx.globalAlpha=0.12+difficulty*0.08;
  for(var i=0;i<3;i++){
    var fg=ctx.createRadialGradient(W*0.3+i*W*0.2,waterY*0.3,0,W*0.3+i*W*0.2,waterY*0.3,W*0.4);
    fg.addColorStop(0,isDark?'#ff9040':'#ffb060');
    fg.addColorStop(1,'transparent');
    ctx.fillStyle=fg;
    ctx.fillRect(0,0,W,waterY);
  }
  ctx.globalAlpha=1;
}

function drawBridge(){
  ctx.save();
  ctx.strokeStyle=isDark?'rgba(60,40,30,0.5)':'rgba(40,25,15,0.35)';
  ctx.lineWidth=2;
  ctx.beginPath();
  for(var i=0;i<bridgePts.length;i++){
    if(i===0)ctx.moveTo(bridgePts[i].x,bridgePts[i].y);
    else ctx.lineTo(bridgePts[i].x,bridgePts[i].y);
  }
  ctx.stroke();

  ctx.strokeStyle=isDark?'rgba(80,55,40,0.35)':'rgba(60,40,25,0.25)';
  ctx.lineWidth=1;
  var left=bridgePts[0],right=bridgePts[bridgePts.length-1];
  for(var t=0;t<3;t++){
    var ty=lerp(left.y,waterY,0.3+t*0.25);
    ctx.beginPath();
    ctx.moveTo(left.x,ty);ctx.lineTo(right.x,ty);
    ctx.stroke();
  }

  ctx.fillStyle=isDark?'rgba(50,35,25,0.6)':'rgba(30,20,12,0.4)';
  ctx.fillRect(left.x-4,left.y,W*0.04,waterY-left.y);
  ctx.fillRect(right.x-4,right.y,W*0.04,waterY-right.y);
  ctx.restore();
}

function drawWater(){
  var wg=ctx.createLinearGradient(0,waterY,0,H);
  wg.addColorStop(0,isDark?'#1a2838':'#3a6888');
  wg.addColorStop(1,isDark?'#0a1018':'#1a3848');
  ctx.fillStyle=wg;
  ctx.fillRect(0,waterY,W,H-waterY);

  ctx.save();
  ctx.globalAlpha=0.25;
  var t=windPhase*2;
  for(var w=0;w<5;w++){
    ctx.beginPath();
    var wy=waterY+12+w*14;
    for(var x=0;x<=W;x+=8){
      var y=wy+Math.sin(x*0.02+t+w)*3+Math.sin(x*0.008+t*0.7)*2;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=isDark?'#6080a0':'#90b8d0';
    ctx.lineWidth=1;
    ctx.stroke();
  }
  ctx.restore();

  for(var s=0;s<splashes.length;s++){
    var sp=splashes[s];
    ctx.globalAlpha=sp.life/sp.max*0.5;
    ctx.strokeStyle='#90c0e0';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.ellipse(sp.x,sp.y,sp.r,sp.r*0.3,0,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawRibbon(r){
  ctx.save();
  ctx.translate(r.x,r.y);
  ctx.rotate(r.rot);
  ctx.globalAlpha=r.alpha;

  if(r.type==='decoy'){
    ctx.fillStyle=isDark?'rgba(140,150,160,0.35)':'rgba(160,170,180,0.4)';
    ctx.beginPath();
    ctx.ellipse(0,0,r.w*0.5,r.h*0.45,0,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=r.alpha*0.5;
    ctx.strokeStyle=isDark?'rgba(180,190,200,0.3)':'rgba(120,130,140,0.3)';
    ctx.lineWidth=1;
    ctx.setLineDash([4,6]);
    ctx.stroke();
    ctx.setLineDash([]);
  }else{
    var rg=ctx.createLinearGradient(-r.w*0.3,0,r.w*0.3,0);
    rg.addColorStop(0,'transparent');
    rg.addColorStop(0.3,r.color);
    rg.addColorStop(0.7,r.color);
    rg.addColorStop(1,'transparent');
    ctx.strokeStyle=rg;
    ctx.lineWidth=r.w*0.35;
    ctx.lineCap='round';
    ctx.beginPath();
    for(var i=0;i<r.segments.length;i++){
      var seg=r.segments[i];
      var sx=seg.ox+Math.sin(seg.sway)*seg.amp;
      var sy=seg.oy-r.h*0.5;
      if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);
    }
    ctx.stroke();

    ctx.globalAlpha=r.alpha*0.3;
    ctx.fillStyle=r.color;
    ctx.beginPath();
    ctx.ellipse(0,-r.h*0.1,r.w*0.25,r.h*0.15,0,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawCollector(){
  var cx=collector.x,cy=collector.y,cw=collector.w;
  ctx.save();

  ctx.shadowColor='rgba(255,140,60,0.4)';
  ctx.shadowBlur=12;

  var sailG=ctx.createLinearGradient(cx,cy-cw,cx,cy+cw*0.3);
  sailG.addColorStop(0,isDark?'#ffb060':'#e07030');
  sailG.addColorStop(1,isDark?'#d85828':'#c04818');
  ctx.fillStyle=sailG;
  ctx.beginPath();
  ctx.moveTo(cx,cy-cw*0.55);
  ctx.quadraticCurveTo(cx+cw*0.6,cy-cw*0.1,cx+cw*0.45,cy+cw*0.35);
  ctx.lineTo(cx-cw*0.45,cy+cw*0.35);
  ctx.quadraticCurveTo(cx-cw*0.6,cy-cw*0.1,cx,cy-cw*0.55);
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.fillStyle=isDark?'#3a2818':'#5a3820';
  ctx.fillRect(cx-cw*0.35,cy+cw*0.3,cw*0.7,6);

  ctx.globalAlpha=0.35;
  ctx.strokeStyle='#ffb060';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(cx,cy+cw*0.1,cw*0.55,Math.PI,0);
  ctx.stroke();
  ctx.restore();
}

function drawGusts(){
  for(var g=0;g<gusts.length;g++){
    var gu=gusts[g];
    ctx.save();
    ctx.globalAlpha=clamp(gu.life*0.15,0,0.25);
    ctx.fillStyle=isDark?'#c0d0e0':'#ffffff';
    var gx=gu.dir>0?-20:W+20;
    for(var l=0;l<3;l++){
      ctx.beginPath();
      ctx.moveTo(gx,waterY*0.2+l*H*0.15);
      ctx.lineTo(gx+gu.dir*80,waterY*0.2+l*H*0.15+10);
      ctx.lineTo(gx+gu.dir*60,waterY*0.2+l*H*0.15+20);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function draw(){
  if(!ctx){
    if(canvas){canvas.style.background=isDark?'#1a1208':'#f0e4d4';}
    return;
  }

  var sx=shake>0.5?rand(-shake,shake):0;
  var sy=shake>0.5?rand(-shake,shake):0;
  ctx.save();
  ctx.translate(sx,sy);

  drawSky();
  drawBridge();
  drawGusts();

  for(var i=0;i<ribbons.length;i++)drawRibbon(ribbons[i]);
  drawWater();
  drawCollector();
  drawParticles();

  ctx.restore();

  if(flash>0){
    ctx.fillStyle='rgba(255,180,100,'+(flash*0.35)+')';
    ctx.fillRect(0,0,W,H);
  }

  if(state==='title')drawIdleScene();
}

function drawIdleScene(){
  ctx.save();
  windPhase+=0.008;
  for(var i=0;i<idleRibbons.length;i++){
    var ir=idleRibbons[i];
    ir.segments[0].sway+=0.01;
    ir.segments[1].sway+=0.012;
    ir.segments[2].sway+=0.009;
    drawRibbon(ir);
  }
  ctx.restore();
}

function loop(ts){
  if(!loop.last)loop.last=ts;
  var dt=Math.min((ts-loop.last)/1000,0.05);
  loop.last=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function pointerX(e){
  var rect=canvas.getBoundingClientRect();
  var cx=e.clientX!=null?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:0);
  return((cx-rect.left)/rect.width)*W;
}

function onPointerDown(e){
  if(state!=='playing')return;
  if(e.cancelable)e.preventDefault();
  drag.active=true;
  drag.offsetX=pointerX(e)-collector.x;
  initAudio();
}

function onPointerMove(e){
  if(!drag.active||state!=='playing')return;
  if(e.cancelable)e.preventDefault();
  collector.x=clamp(pointerX(e)-drag.offsetX,collector.w*0.5,W-collector.w*0.5);
}

function onPointerUp(e){
  drag.active=false;
}

function onKeyDown(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
}

function onKeyUp(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
}

if(startBtn)startBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
if(restartBtn)restartBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});

if(canvas){
  canvas.addEventListener('mousedown',onPointerDown);
  canvas.addEventListener('mousemove',onPointerMove);
  canvas.addEventListener('mouseup',onPointerUp);
  canvas.addEventListener('mouseleave',onPointerUp);
  canvas.addEventListener('touchstart',onPointerDown,{passive:false});
  canvas.addEventListener('touchmove',onPointerMove,{passive:false});
  canvas.addEventListener('touchend',onPointerUp);
  canvas.addEventListener('touchcancel',onPointerUp);
}

window.addEventListener('keydown',onKeyDown);
window.addEventListener('keyup',onKeyUp);
window.addEventListener('resize',resize);

if(window.matchMedia){
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener('change',function(e){isDark=e.matches;updatePaletteUI();});
}

resize();
updatePaletteUI();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
