<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boot Chain</title>
<style>
  :root {
    --bg: #f0f0f0;
    --text: #111;
    --primary: #ff6b00;
    --secondary: #00a8ff;
    --danger: #ff003c;
    --grid: #e0e0e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --text: #eee;
      --grid: #222;
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100dvw; height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    overflow: hidden; touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  
  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: rgba(240, 240, 240, 0.9);
    transition: opacity 0.3s;
  }
  @media (prefers-color-scheme: dark) {
    .screen { background: rgba(17, 17, 17, 0.9); }
  }
  @supports (backdrop-filter: blur(4px)) {
    .screen {
      background: rgba(240, 240, 240, 0.5);
      backdrop-filter: blur(8px);
    }
    @media (prefers-color-scheme: dark) {
      .screen { background: rgba(17, 17, 17, 0.5); }
    }
  }
  .hidden { opacity: 0; pointer-events: none !important; }
  
  @keyframes pulse {
    0% { text-shadow: 0 0 10px var(--primary); }
    50% { text-shadow: 0 0 20px var(--primary), 0 0 30px var(--primary); }
    100% { text-shadow: 0 0 10px var(--primary); }
  }
  
  h1 { 
    font-size: 2.5rem; margin-bottom: 0.5rem; text-transform: uppercase; 
    letter-spacing: 4px; color: var(--text);
    animation: pulse 2s infinite;
    text-align: center;
  }
  p { margin-bottom: 2rem; text-align: center; max-width: 80%; line-height: 1.5; color: #888; font-size: 1.1rem; }
  
  button {
    pointer-events: auto;
    background: var(--primary); color: #fff;
    border: none; padding: 1rem 2rem; font-size: 1.2rem;
    font-family: inherit; font-weight: bold; text-transform: uppercase;
    border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 #cc5500;
    transition: transform 0.1s, box-shadow 0.1s;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: translateY(4px); box-shadow: 0 0 0 #cc5500; }
  
  #hud {
    position: absolute; top: 0; left: 0; width: 100%; padding: 1rem;
    box-sizing: border-box; display: flex; justify-content: space-between;
    font-size: 1.2rem; font-weight: bold; pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    color: var(--text);
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div id="score-display">BOOT: 0</div>
    <div id="combo-display">CHAIN: 0</div>
    <div id="lives-display">SYS: 3</div>
  </div>
  
  <div id="ui-layer">
    <div id="start-screen" class="screen">
      <h1>Boot Chain</h1>
      <p>Flick the ESP32 boards into the valid slots before they overheat.<br>Avoid decoy ports.</p>
      <button data-smoke="start" id="start-btn">Initialize</button>
    </div>
    
    <div id="game-over-screen" class="screen hidden">
      <h1>Kernel Panic</h1>
      <p id="final-score">BOOTS: 0</p>
      <button data-smoke="restart" id="restart-btn">Reboot</button>
    </div>
  </div>
  
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      if (state === 'start') draw();
    }
    window.addEventListener('resize', resize);

    // State
    let state = 'start'; // start, playing, gameover
    let score = 0;
    let lives = 3;
    let combo = 0;
    let lastTime = 0;
    let flashAlpha = 0;

    // Theme colors
    const colors = {
      bg: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),
      primary: '#ff6b00',
      secondary: '#00a8ff',
      danger: '#ff003c',
      board: '#114b21',
      slotValid: '#00a8ff',
      slotDecoy: '#ff003c',
      hub: '#2c3e50'
    };

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      colors.bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    });

    // Audio
    let audioCtx;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        
        if (type === 'valid') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'decoy' || type === 'collision') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'boot') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(330, now + 0.1);
          osc.frequency.setValueAtTime(440, now + 0.2);
          osc.frequency.setValueAtTime(660, now + 0.3);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'flick') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        }
      } catch (e) {}
    }

    function vibrate(pattern) {
      try {
        if (navigator.vibrate) navigator.vibrate(pattern);
      } catch (e) {}
    }

    // Input
    const input = {
      active: false,
      x: 0, y: 0,
      history: []
    };

    function handleStart(x, y) {
      if (state !== 'playing') return;
      input.active = true;
      input.x = x; input.y = y;
      input.history = [{x, y, time: performance.now()}];
      
      if (board && board.state === 'idle') {
        const dx = x - board.x;
        const dy = y - board.y;
        if (dx*dx + dy*dy < board.size * board.size * 9) {
          board.state = 'dragged';
        }
      }
    }

    function handleMove(x, y) {
      if (!input.active) return;
      input.x = x; input.y = y;
      input.history.push({x, y, time: performance.now()});
      if (input.history.length > 10) input.history.shift();
      
      if (board && board.state === 'dragged') {
        board.x = x; 
        board.y = y;
        board.x = Math.max(board.size, Math.min(width - board.size, board.x));
        board.y = Math.max(board.size, Math.min(height - board.size, board.y));
      }
    }

    function handleEnd() {
      if (!input.active) return;
      input.active = false;
      
      if (board && board.state === 'dragged') {
        const now = performance.now();
        let validHistory = input.history.filter(p => now - p.time < 100);
        if (validHistory.length > 1) {
          const first = validHistory[0];
          const last = validHistory[validHistory.length - 1];
          const dt = Math.max(1, last.time - first.time);
          board.vx = (last.x - first.x) / dt * 25; 
          board.vy = (last.y - first.y) / dt * 25;
        } else {
          board.vx = 0; board.vy = 0;
        }
        
        const speed = Math.sqrt(board.vx*board.vx + board.vy*board.vy);
        if (speed > 40) {
          board.vx = (board.vx / speed) * 40;
          board.vy = (board.vy / speed) * 40;
        }
        
        if (board.vy > -2 && Math.abs(board.vx) < 5) {
            board.state = 'idle';
        } else {
            board.state = 'flicked';
            playSound('flick');
        }
      }
    }

    canvas.addEventListener('touchstart', e => { e.preventDefault(); handleStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
    canvas.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
    canvas.addEventListener('touchend', e => { e.preventDefault(); handleEnd(); }, {passive: false});
    canvas.addEventListener('mousedown', e => { handleStart(e.clientX, e.clientY); });
    canvas.addEventListener('mousemove', e => { handleMove(e.clientX, e.clientY); });
    canvas.addEventListener('mouseup', e => { handleEnd(); });

    // Game Objects
    let hub = { x: 0, y: 0, radius: 80, rotation: 0, speed: 0.02, slots: [] };
    let board = null;
    let particles = [];
    let texts = [];

    function spawnBoard() {
      board = {
        x: width / 2,
        y: height * 0.8,
        size: Math.max(10, 20 - Math.floor(score / 3)),
        vx: 0, vy: 0,
        state: 'idle',
        heat: 0,
        trail: []
      };
    }

    function generateHub() {
      hub.x = width / 2;
      hub.y = height * 0.25;
      hub.radius = Math.min(width * 0.25, 100);
      
      let numSlots = 1 + Math.floor(score / 5);
      if (numSlots > 4) numSlots = 4;
      
      let speedMult = 1 + (score * 0.1);
      hub.speed = 0.02 * speedMult * (Math.random() > 0.5 ? 1 : -1);
      
      hub.slots = [];
      const slotWidth = Math.PI / 4;
      
      for (let i = 0; i < numSlots; i++) {
        hub.slots.push({
          angleOffset: (i * Math.PI * 2) / numSlots,
          width: slotWidth,
          type: 'valid'
        });
      }
      
      if (score > 5) {
        let numDecoys = Math.min(numSlots, Math.floor(score / 5));
        for (let i = 0; i < numDecoys; i++) {
          hub.slots.push({
            angleOffset: (i * Math.PI * 2) / numSlots + Math.PI / numSlots,
            width: slotWidth * 0.6,
            type: 'decoy'
          });
        }
      }
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 20; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          size: Math.random() * 4 + 2,
          color: color,
          life: 1
        });
      }
    }

    function spawnText(x, y, text, color, size = 20) {
      texts.push({ x: x, y: y, text: text, color: color, size: size, life: 1 });
    }

    function updateHUD() {
      document.getElementById('score-display').innerText = `BOOT: ${score}`;
      document.getElementById('combo-display').innerText = `CHAIN: ${combo}`;
      document.getElementById('lives-display').innerText = `SYS: ${lives}`;
    }

    function loseLife() {
      lives--;
      combo = 0;
      vibrate([50, 50, 50]);
      updateHUD();
      playSound('collision');
      
      if (lives <= 0) {
        gameOver();
      } else {
        spawnBoard();
      }
    }

    const bootLogs = [
      "[OK] Started Kernel Logging",
      "[OK] Reached target Basic System",
      "[OK] Found device /dev/ttyS0",
      "Mounting /sys/kernel/debug...",
      "Starting Network Service...",
      "[OK] Started Network Service"
    ];

    function loop(time) {
      requestAnimationFrame(loop);
      
      let dt = time - lastTime;
      lastTime = time;
      
      hub.rotation += hub.speed;
      
      if (state === 'playing') {
        if (board && (board.state === 'idle' || board.state === 'dragged')) {
          board.heat += 0.0015 * (1 + score * 0.05);
          if (board.heat >= 1) {
            createExplosion(board.x, board.y, colors.danger);
            spawnText(board.x, board.y, "OVERHEAT", colors.danger);
            loseLife();
          }
        }
        
        if (board && board.state === 'flicked') {
          let steps = Math.ceil(Math.max(Math.abs(board.vx), Math.abs(board.vy)) / 5);
          let stepX = board.vx / steps;
          let stepY = board.vy / steps;
          
          let collided = false;
          
          for (let s = 0; s < steps; s++) {
            board.x += stepX;
            board.y += stepY;
            
            const dx = board.x - hub.x;
            const dy = board.y - hub.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < hub.radius + board.size) {
              collided = true;
              break;
            }
          }
          
          if (!collided) {
              board.vx *= 0.98;
              board.vy *= 0.98;
              
              if (board.x < board.size || board.x > width - board.size) {
                board.vx *= -0.8;
                board.x = Math.max(board.size, Math.min(width - board.size, board.x));
              }
              
              if (board.y > height + 50 || board.y < -50) {
                spawnText(board.x, Math.max(20, Math.min(height-20, board.y)), "LOST", '#aaa');
                loseLife();
              } else if (Math.abs(board.vx) < 0.5 && Math.abs(board.vy) < 0.5) {
                board.state = 'idle';
              }
          } else {
              const dx = board.x - hub.x;
              const dy = board.y - hub.y;
              let angle = Math.atan2(dy, dx);
              if (angle < 0) angle += Math.PI * 2;
              
              let hitSlot = null;
              for (let slot of hub.slots) {
                let slotAngle = (slot.angleOffset + hub.rotation) % (Math.PI * 2);
                if (slotAngle < 0) slotAngle += Math.PI * 2;
                
                let diff = Math.abs(angle - slotAngle);
                if (diff > Math.PI) diff = Math.PI * 2 - diff;
                
                if (diff < slot.width / 2) {
                  hitSlot = slot;
                  break;
                }
              }
              
              if (hitSlot) {
                if (hitSlot.type === 'valid') {
                  score++;
                  combo++;
                  createExplosion(board.x, board.y, colors.slotValid);
                  spawnText(board.x, board.y, "BOOT OK", colors.slotValid);
                  
                  if (combo > 0 && combo % 3 === 0) {
                     spawnText(width/2, height/2 - 40, "PI DESKTOP BOOTED", colors.secondary, 30);
                     flashAlpha = 1;
                     score += 5;
                     playSound('boot');
                     
                     for (let i = 0; i < bootLogs.length; i++) {
                       setTimeout(() => {
                         if (state === 'playing') {
                           spawnText(width/2, height/2 + i * 20, bootLogs[i], '#00ffcc', 12);
                         }
                       }, i * 100);
                     }
                  } else {
                     playSound('valid');
                  }
                  
                  vibrate(50);
                  updateHUD();
                  generateHub();
                  spawnBoard();
                } else {
                  createExplosion(board.x, board.y, colors.danger);
                  spawnText(board.x, board.y, "ERR: DECOY", colors.danger);
                  loseLife();
                }
              } else {
                createExplosion(board.x, board.y, '#aaa');
                spawnText(board.x, board.y, "ERR: COLLISION", '#aaa');
                loseLife();
              }
          }
        }
      }
      
      draw();
    }

    function draw() {
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, width, height);
      
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#ddd';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = -width; i < width * 2; i += 60) {
        ctx.moveTo(i, 0);
        ctx.lineTo(i + height, height);
        ctx.moveTo(i, 0);
        ctx.lineTo(i - height, height);
      }
      ctx.stroke();
      
      if (flashAlpha > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
          ctx.fillRect(0, 0, width, height);
          flashAlpha -= 0.05;
      }
      
      ctx.save();
      ctx.translate(hub.x, hub.y);
      ctx.rotate(hub.rotation);
      
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.arc(10, 10, hub.radius, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = colors.hub;
      ctx.beginPath();
      ctx.arc(0, 0, hub.radius, 0, Math.PI * 2);
      ctx.arc(0, 0, hub.radius - 15, 0, Math.PI * 2, true);
      ctx.fill();
      
      for (let slot of hub.slots) {
        ctx.fillStyle = slot.type === 'valid' ? colors.slotValid : colors.slotDecoy;
        ctx.beginPath();
        ctx.arc(0, 0, hub.radius, slot.angleOffset - slot.width/2, slot.angleOffset + slot.width/2);
        ctx.arc(0, 0, hub.radius - 15, slot.angleOffset + slot.width/2, slot.angleOffset - slot.width/2, true);
        ctx.fill();
      }
      
      ctx.fillStyle = '#1a252f';
      ctx.beginPath();
      ctx.arc(0, 0, hub.radius - 15, 0, Math.PI * 2);
      ctx.fill();
      
      if (flashAlpha > 0) {
        ctx.fillStyle = colors.secondary;
        ctx.beginPath();
        ctx.arc(0, 0, 15 + flashAlpha * 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-8, -6, 16, 12);
        ctx.fillStyle = '#333';
        ctx.fillRect(-8, -6, 16, 3);
      } else {
        ctx.fillStyle = colors.slotValid;
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
      }
      
      ctx.restore();
      
      if (board) {
        if (board.state === 'flicked') {
          board.trail.push({x: board.x, y: board.y});
          if (board.trail.length > 10) board.trail.shift();
          
          if (board.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(board.trail[0].x, board.trail[0].y);
            for (let i = 1; i < board.trail.length; i++) {
              ctx.lineTo(board.trail[i].x, board.trail[i].y);
            }
            ctx.strokeStyle = 'rgba(0, 168, 255, 0.5)';
            ctx.lineWidth = board.size;
            ctx.lineCap = 'round';
            ctx.stroke();
          }
        } else {
          board.trail = [];
        }
        
        ctx.save();
        let bx = board.x;
        let by = board.y;
        if (board.heat > 0.7 && (board.state === 'idle' || board.state === 'dragged')) {
          bx += (Math.random() - 0.5) * 4;
          by += (Math.random() - 0.5) * 4;
        }
        ctx.translate(bx, by);
        
        let scale = board.state === 'dragged' ? 1.2 : 1;
        ctx.scale(scale, scale);
        
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(-board.size + 5, -board.size + 5, board.size * 2, board.size * 2);
        
        ctx.fillStyle = colors.board;
        ctx.fillRect(-board.size, -board.size, board.size * 2, board.size * 2);
        
        ctx.fillStyle = '#f1c40f';
        for(let i=0; i<5; i++) {
            ctx.fillRect(-board.size - 3, -board.size + 2 + i*8, 3, 4);
            ctx.fillRect(board.size, -board.size + 2 + i*8, 3, 4);
        }
        
        ctx.fillStyle = '#bdc3c7';
        ctx.fillRect(-board.size + 4, -board.size + 4, board.size * 2 - 8, board.size * 2 - 14);
        
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-board.size + 6, board.size - 6);
        ctx.lineTo(-board.size + 10, board.size - 2);
        ctx.lineTo(-board.size + 14, board.size - 6);
        ctx.lineTo(-board.size + 18, board.size - 2);
        ctx.stroke();
        
        if (board.heat > 0) {
          ctx.fillStyle = `rgba(255, 0, 0, ${board.heat * 0.8})`;
          ctx.fillRect(-board.size, -board.size, board.size * 2, board.size * 2);
        }
        
        ctx.fillStyle = '#333';
        ctx.fillRect(-board.size, board.size + 8, board.size * 2, 4);
        ctx.fillStyle = colors.danger;
        ctx.fillRect(-board.size, board.size + 8, board.size * 2 * board.heat, 4);
        
        ctx.restore();
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      
      for (let i = texts.length - 1; i >= 0; i--) {
        let t = texts[i];
        t.y -= 1; t.life -= 0.02;
        if (t.life <= 0) { texts.splice(i, 1); continue; }
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.life;
        ctx.font = `bold ${t.size}px ui-monospace, 'SFMono-Regular', Menlo, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x, t.y);
        ctx.globalAlpha = 1;
      }
    }

    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');

    startBtn.addEventListener('click', () => {
      initAudio();
      startScreen.classList.add('hidden');
      hud.classList.remove('hidden');
      startGame();
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      gameOverScreen.classList.add('hidden');
      startGame();
    });

    function startGame() {
      state = 'playing';
      score = 0;
      lives = 3;
      combo = 0;
      particles = [];
      texts = [];
      flashAlpha = 0;
      updateHUD();
      generateHub();
      spawnBoard();
    }

    function gameOver() {
      state = 'gameover';
      board = null;
      hud.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');
      document.getElementById('final-score').innerText = `BOOTS: ${score}`;
    }

    resize();
    generateHub();
    spawnBoard();
    requestAnimationFrame(loop);
  </script>
