<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Still Human</title>
<style>
  :root{
    --bg:#f2e9d8; --fg:#2b211b; --mut:#7a6d60; --line:rgba(0,0,0,.14);
    --btn:#e8843a; --btnfg:#fff6ea; --warm:#d8672e; --cold:#5f7d8c; --heart:#df5566;
    --panel:rgba(255,250,242,.55);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#100c0a; --fg:#f0e7d9; --mut:#9a8b7c; --line:rgba(255,255,255,.12);
      --btn:#ffb057; --btnfg:#20140a; --warm:#ff9a52; --cold:#9fb9c6; --heart:#ff6f7d;
      --panel:rgba(20,15,12,.42);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; width:100%;}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden; overscroll-behavior:none;
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }
  #game{
    position:fixed; inset:0; width:100dvw; height:100dvh; overflow:hidden;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  canvas#c{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}

  .overlay{
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between; text-align:center;
    pointer-events:none;
    padding: calc(env(safe-area-inset-top,0px) + 30px) 22px calc(env(safe-area-inset-bottom,0px) + 34px);
  }
  .ov-top{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .ov-bottom{display:flex; flex-direction:column; align-items:center; gap:14px; max-width:520px;}
  .kicker{font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:var(--mut); text-shadow:0 1px 12px rgba(0,0,0,.5);}
  h1.title{
    margin:0; font-size:clamp(34px,11vw,66px); font-weight:800; letter-spacing:.02em; line-height:.98;
    text-shadow:0 2px 26px rgba(0,0,0,.55), 0 0 1px rgba(0,0,0,.4);
  }
  h1.title.small{font-size:clamp(24px,7.5vw,40px); font-weight:700; letter-spacing:.06em; text-transform:lowercase; color:var(--warm);}
  .lede{margin:0; font-size:clamp(13px,3.7vw,16px); line-height:1.5; color:var(--fg); opacity:.94; text-shadow:0 1px 14px rgba(0,0,0,.6);}
  .lede b{color:var(--warm);}
  .legend{display:flex; gap:16px; align-items:center; justify-content:center; font-size:12px; color:var(--mut); letter-spacing:.08em;}
  .sw{display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; box-shadow:0 0 10px currentColor;}
  .sw.warm{background:var(--warm); color:var(--warm);}
  .sw.cold{background:var(--cold); color:var(--cold); box-shadow:none; opacity:.85;}
  .micro{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mut); opacity:.85;}
  .btn{
    pointer-events:auto; appearance:none; -webkit-appearance:none; cursor:pointer;
    border:1px solid rgba(0,0,0,.18); background:var(--btn); color:var(--btnfg);
    font-family:inherit; font-weight:700; font-size:16px; letter-spacing:.16em; text-transform:uppercase;
    padding:16px 34px; min-height:56px; min-width:200px; border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(1.05);}
  .btn:active{transform:translateY(2px) scale(.985);}
  .btn:focus-visible{outline:3px solid var(--fg); outline-offset:3px;}
  .stats{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; padding:16px 22px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .stats>div{display:flex; flex-direction:column; align-items:center; min-width:96px;}
  .stats span{font-size:26px; font-weight:800; color:var(--fg); line-height:1;}
  .stats i{font-style:normal; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--mut); margin-top:6px;}
  #over{display:none;}
  @media (max-height:560px){
    .overlay{padding-top:calc(env(safe-area-inset-top,0px) + 14px); padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);}
    .ov-bottom{gap:9px;}
    .stats{padding:10px 16px;}
    .stats span{font-size:20px;}
  }
</style>
</head>
<body>
  <div id="game">
    <canvas id="c"></canvas>

    <div id="title" class="overlay" aria-hidden="false">
      <div class="ov-top">
        <div class="kicker">humanity &middot; still online</div>
        <h1 class="title">STILL&nbsp;HUMAN</h1>
      </div>
      <div class="ov-bottom">
        <p class="lede">One gesture here is <b>truly alive</b>.<br>Tap it before the chrome copies replace the warmth.</p>
        <div class="legend"><span><span class="sw warm"></span>human</span><span><span class="sw cold"></span>copy</span></div>
        <button class="btn" data-smoke="start" id="startBtn">Begin</button>
        <div class="micro">warm glow &middot; a living heartbeat &middot; a rising spark</div>
      </div>
    </div>

    <div id="over" class="overlay" aria-hidden="true">
      <div class="ov-top">
        <div class="kicker" id="overKicker">the chrome crept in</div>
        <h1 class="title small" id="overTitle">warmth faded</h1>
      </div>
      <div class="ov-bottom">
        <div class="stats">
          <div><span id="fScore">0</span><i>score</i></div>
          <div><span id="fCombo">0</span><i>best combo</i></div>
          <div><span id="fLevel">1</span><i>reached lv</i></div>
          <div><span id="fRestore">0%</span><i>restored</i></div>
        </div>
        <button class="btn" data-smoke="restart" id="restartBtn">Play again</button>
        <div class="micro" id="overMsg">the warmth you saved remains</div>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var TAU = Math.PI*2, PI = Math.PI;
  var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
  var lerp = function(a,b,t){ return a+(b-a)*t; };
  var rand = function(a,b){ return a + Math.random()*(b-a); };
  var easeOutBack = function(x){ var c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
  var easeOutCubic = function(x){ return 1 - Math.pow(1-x,3); };
  function h2(x){ return parseInt(x,16); }
  function hexLerp(a,b,t){
    var ar=h2(a.slice(1,3)),ag=h2(a.slice(3,5)),ab=h2(a.slice(5,7));
    var br=h2(b.slice(1,3)),bg=h2(b.slice(3,5)),bb=h2(b.slice(5,7));
    return 'rgb('+Math.round(lerp(ar,br,t))+','+Math.round(lerp(ag,bg,t))+','+Math.round(lerp(ab,bb,t))+')';
  }

  // ---- value noise for organic, irregular motion ----
  function makeNoise(seed){
    var p = new Float32Array(512); var s = (seed>>>0)||1;
    for(var i=0;i<512;i++){ s=(s*1664525+1013904223)>>>0; p[i]=s/4294967295; }
    return function(x){
      var i=Math.floor(x), f=x-i; var a=p[i&511], b=p[(i+1)&511];
      var u=f*f*(3-2*f); return a+(b-a)*u;
    };
  }
  var noise = makeNoise(9137);

  // ---- palettes (no purple anywhere; chrome = steel/blue-gray) ----
  var DARK = {
    bg0:'#100c0a', bg1:'#0a0807', fg:'#f0e7d9', mut:'#9a8b7c',
    warmCore:'#ffe6b8', warmMid:'#ffab5c', warmEdge:'#ff6f3c',
    coldCore:'#eef5f9', coldMid:'#a7bcc8', coldEdge:'#5a747f',
    lead:'#20130d', coldLead:'#152026', leadSoft:'#3a2a20', mouthWarm:'#c8402c',
    warmGlow:'rgba(255,150,70,', coldGlow:'rgba(150,180,200,',
    grout:'rgba(0,0,0,0.55)',
    tileBg:'rgba(255,255,255,0.045)', tileLine:'rgba(255,255,255,0.11)',
    timerA:'#ffd08a', timerB:'#ff5636', track:'rgba(255,255,255,0.10)',
    heart:'#ff6f7d', skin:'#ffcf9a', skinEdge:'#e8895a', cheek:'#ff7d84',
    haze:'rgba(150,178,198,'
  };
  var LIGHT = {
    bg0:'#f3ead9', bg1:'#e7d8c1', fg:'#2b211b', mut:'#7a6d60',
    warmCore:'#ffd79a', warmMid:'#f0913f', warmEdge:'#cf5622',
    coldCore:'#ffffff', coldMid:'#8fa7b4', coldEdge:'#54707d',
    lead:'#4a3326', coldLead:'#3f4e58', leadSoft:'#7a5a44', mouthWarm:'#b23a24',
    warmGlow:'rgba(224,124,48,', coldGlow:'rgba(96,124,142,',
    grout:'rgba(60,40,25,0.34)',
    tileBg:'rgba(255,255,255,0.62)', tileLine:'rgba(0,0,0,0.12)',
    timerA:'#e0902f', timerB:'#c8371f', track:'rgba(0,0,0,0.10)',
    heart:'#df5566', skin:'#ffd6a6', skinEdge:'#dd8452', cheek:'#e97b83',
    haze:'rgba(96,124,142,'
  };
  var pal = DARK;
  function pickTheme(){
    var dark = true;
    try { dark = !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); } catch(e){}
    pal = dark ? DARK : LIGHT;
  }
  pickTheme();
  try {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq && mq.addEventListener) mq.addEventListener('change', pickTheme);
    else if (mq && mq.addListener) mq.addListener(pickTheme);
  } catch(e){}

  // ---- canvas ----
  var game = document.getElementById('game');
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W=1, H=1, dpr=1;
  var arena = {x:0,y:0,w:1,h:1};
  var topBand = 76;

  function resize(){
    var r = game.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    dpr = Math.min(2, window.devicePixelRatio||1);
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    if(ctx.setTransform) ctx.setTransform(dpr,0,0,dpr,0,0);
    topBand = Math.max(64, Math.min(96, H*0.11)) + safeTop();
    arena.x = 16;
    arena.y = topBand + 10;
    arena.w = W - 32;
    arena.h = H - arena.y - (safeBottom()+18);
    if(arena.h < 120){ arena.y = topBand; arena.h = H - arena.y - 12; }
    layoutTiles();
  }
  function safeTop(){ return envPx('safe-area-inset-top'); }
  function safeBottom(){ return envPx('safe-area-inset-bottom'); }
  function envPx(name){
    // read env() via a temp element (guarded)
    try{
      var d=document.createElement('div');
      d.style.cssText='position:fixed;top:0;left:0;height:env('+name+',0px);width:0;visibility:hidden;';
      document.body.appendChild(d); var v=d.getBoundingClientRect().height; document.body.removeChild(d);
      return v||0;
    }catch(e){ return 0; }
  }

  // ---- geometry helpers ----
  function rrPath(c,x,y,w,h,r){
    r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
  }
  function capV(c,cx,topY,w,len){ rrPath(c, cx-w/2, topY, w, len, w/2); }

  // ---- gesture glyph rendering ----
  function fillWarm(c,s){
    var cx=-s*0.10, cy=-s*0.12, r1=s*1.25;
    var g=c.createRadialGradient(cx,cy,0,cx,cy,r1);
    g.addColorStop(0, pal.warmCore);
    g.addColorStop(0.5, pal.warmMid);
    g.addColorStop(1, pal.warmEdge);
    c.fillStyle=g; c.fill();
  }
  function fillCold(c,s,mimic){
    var x0=0, y0=-s*0.7, x1=0, y1=s*0.75;
    var g=c.createLinearGradient(x0,y0,x1,y1);
    var core = mimic>0 ? hexLerp(pal.coldCore, pal.warmCore, mimic*0.7) : pal.coldCore;
    var mid  = mimic>0 ? hexLerp(pal.coldMid,  pal.warmMid,  mimic*0.72) : pal.coldMid;
    var edge = mimic>0 ? hexLerp(pal.coldEdge, pal.warmEdge, mimic*0.55) : pal.coldEdge;
    g.addColorStop(0, core);
    g.addColorStop(0.5, mid);
    g.addColorStop(1, edge);
    c.fillStyle=g; c.fill();
  }
  function heartPath(c,s){
    var w=s*0.95, h=s*0.9;
    c.moveTo(0,-h*0.18);
    c.bezierCurveTo(-w*0.12,-h*0.44,-w*0.50,-h*0.50,-w*0.50,-h*0.16);
    c.bezierCurveTo(-w*0.50, h*0.10,-w*0.16, h*0.24, 0, h*0.48);
    c.bezierCurveTo(w*0.16, h*0.24, w*0.50, h*0.10, w*0.50,-h*0.16);
    c.bezierCurveTo(w*0.50,-h*0.50, w*0.12,-h*0.44, 0,-h*0.18);
  }
  function handParts(c, pose, s){
    var palmW=0.60*s, palmH=0.60*s, palmX=-palmW/2, palmY=-0.04*s;
    rrPath(c, palmX, palmY, palmW, palmH, 0.24*s);
    var fx=[-0.205,-0.068,0.068,0.205];
    var fw=0.142*s, flen;
    if(pose==='wave'||pose==='high') flen=[0.34,0.42,0.40,0.30];
    else if(pose==='peace') flen=[0.40,0.45,0.11,0.10];
    else flen=[0.11,0.12,0.11,0.10]; // fist (thumb pose)
    for(var i=0;i<4;i++){
      var L=flen[i]*s;
      capV(c, fx[i]*s, palmY - L + 0.04*s, fw, L + 0.16*s);
    }
  }
  function drawThumb(c, pose, s, warm, mimic){
    c.save();
    if(pose==='thumb'){ c.translate(-0.24*s, -0.02*s); c.rotate(-0.12); c.beginPath(); capV(c,0,-0.44*s,0.17*s,0.5*s); }
    else { c.translate(-0.28*s, 0.30*s); c.rotate(-0.95); c.beginPath(); capV(c,0,-0.34*s,0.155*s,0.42*s); }
    if(warm) fillWarm(c,s); else fillCold(c,s,mimic);
    c.lineWidth=s*0.045; c.strokeStyle= warm?pal.lead:pal.coldLead; c.stroke();
    c.restore();
  }
  function drawGesture(c, type, s, warm, mimic, tsec, sharedPhase){
    c.save();
    c.lineJoin='round'; c.lineCap='round';
    var lead = warm ? pal.lead : pal.coldLead;
    var lw = s*0.05;
    if(type==='smile'){
      c.beginPath(); c.arc(0,0,s*0.5,0,TAU);
      if(warm) fillWarm(c,s); else fillCold(c,s,mimic);
      c.lineWidth=lw; c.strokeStyle=lead; c.stroke();
      if(warm){
        c.fillStyle='rgba(255,120,120,0.28)';
        c.beginPath(); c.arc(-s*0.26, s*0.10, s*0.11,0,TAU); c.arc(s*0.26, s*0.10, s*0.11,0,TAU); c.fill();
      }
      c.fillStyle = warm ? pal.lead : pal.coldLead;
      c.beginPath(); c.arc(-s*0.17,-s*0.07,s*0.055,0,TAU); c.arc(s*0.17,-s*0.07,s*0.055,0,TAU); c.fill();
      c.beginPath(); c.lineWidth=s*0.062; c.lineCap='round';
      c.strokeStyle = warm ? pal.mouthWarm : pal.coldLead;
      c.arc(0,-s*0.04,s*0.27,0.16*PI,0.84*PI); c.stroke();
    } else if(type==='heart'){
      c.beginPath(); heartPath(c,s);
      if(warm) fillWarm(c,s); else fillCold(c,s,mimic);
      c.lineWidth=lw; c.strokeStyle=lead; c.stroke();
      c.save(); c.clip();
      c.fillStyle = warm ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.14)';
      c.beginPath(); c.ellipse(-s*0.16,-s*0.16,s*0.14,s*0.09,-0.5,0,TAU); c.fill();
      c.restore();
    } else {
      drawThumb(c, type, s, warm, mimic);
      c.beginPath(); handParts(c, type, s);
      if(warm) fillWarm(c,s); else fillCold(c,s,mimic);
      c.lineWidth=lw; c.strokeStyle=lead; c.stroke();
    }
    // mechanical sheen for cold copies (synchronized across all decoys)
    if(!warm){
      c.save(); c.beginPath(); c.arc(0,0,s*0.62,0,TAU); c.clip();
      var sweep = Math.sin(tsec*1.7 + sharedPhase) * s*0.9;
      var g=c.createLinearGradient(sweep - s*0.5, -s, sweep + s*0.5, s);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(0.5,'rgba(255,255,255,0.26)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      c.fillStyle=g; c.fillRect(-s,-s,2*s,2*s);
      c.restore();
    }
    c.restore();
  }
  function warmGlow(c, s, intensity){
    var r1=s*1.45;
    var g=c.createRadialGradient(0,0,0,0,0,r1);
    g.addColorStop(0, pal.warmGlow+(0.52*intensity)+')');
    g.addColorStop(0.42, pal.warmGlow+(0.2*intensity)+')');
    g.addColorStop(1, pal.warmGlow+'0)');
    c.fillStyle=g; c.beginPath(); c.arc(0,0,r1,0,TAU); c.fill();
  }

  // ---- portrait (stained-glass human face; warms as you restore) ----
  var GRID = 8, TOTAL = GRID*GRID;
  var order = (function(){
    var a=[]; for(var i=0;i<TOTAL;i++) a.push(i);
    for(var j=a.length-1;j>0;j--){ var k=(Math.random()*(j+1))|0; var t=a[j]; a[j]=a[k]; a[k]=t; }
    var rank=new Array(TOTAL); for(var r=0;r<TOTAL;r++) rank[a[r]]=r; return rank;
  })();
  function drawFace(c, R){
    // warm skin base
    var g=c.createRadialGradient(-R*0.12,-R*0.16,0,0,0,R);
    g.addColorStop(0, pal.skin); g.addColorStop(0.7, pal.skin); g.addColorStop(1, pal.skinEdge);
    c.fillStyle=g; c.beginPath(); c.arc(0,0,R,0,TAU); c.fill();
    // cheeks
    c.fillStyle='rgba(255,110,120,0.30)';
    c.beginPath(); c.arc(-R*0.42,R*0.16,R*0.16,0,TAU); c.arc(R*0.42,R*0.16,R*0.16,0,TAU); c.fill();
    // eyes
    c.fillStyle=pal.lead;
    c.beginPath(); c.ellipse(-R*0.30,-R*0.12,R*0.09,R*0.12,0,0,TAU); c.ellipse(R*0.30,-R*0.12,R*0.09,R*0.12,0,0,TAU); c.fill();
    c.fillStyle='rgba(255,255,255,0.85)';
    c.beginPath(); c.arc(-R*0.27,-R*0.16,R*0.03,0,TAU); c.arc(R*0.33,-R*0.16,R*0.03,0,TAU); c.fill();
    // smile
    c.lineCap='round'; c.strokeStyle=pal.mouthWarm; c.lineWidth=R*0.07;
    c.beginPath(); c.arc(0,-R*0.02,R*0.42,0.18*PI,0.82*PI); c.stroke();
  }
  function drawPortrait(cx, cy, R, warmFrac, alpha, tsec){
    if(R<=2 || alpha<=0) return;
    var c=ctx; c.save(); c.globalAlpha=alpha; c.translate(cx,cy);
    // soft warm halo
    var hg=c.createRadialGradient(0,0,0,0,0,R*1.7);
    hg.addColorStop(0, pal.warmGlow+(0.10+0.22*warmFrac)+')');
    hg.addColorStop(1, pal.warmGlow+'0)');
    c.fillStyle=hg; c.beginPath(); c.arc(0,0,R*1.7,0,TAU); c.fill();
    // clip to face circle and paint warm face
    c.save(); c.beginPath(); c.arc(0,0,R,0,TAU); c.clip();
    drawFace(c, R);
    // cover unrevealed cells with cold chrome shards
    var cell = (2*R)/GRID, ox=-R, oy=-R;
    for(var gy=0; gy<GRID; gy++){
      for(var gx=0; gx<GRID; gx++){
        var idx=gy*GRID+gx;
        if(order[idx] >= warmFrac*TOTAL){
          var x=ox+gx*cell, y=oy+gy*cell;
          var lg=c.createLinearGradient(x,y,x+cell,y+cell);
          lg.addColorStop(0, pal.coldCore); lg.addColorStop(0.5, pal.coldMid); lg.addColorStop(1, pal.coldEdge);
          c.fillStyle=lg; c.fillRect(x,y,cell+0.6,cell+0.6);
          c.fillStyle='rgba(255,255,255,0.10)'; c.fillRect(x,y,cell,cell*0.18);
        }
      }
    }
    // grout lines for stained-glass
    c.strokeStyle=pal.grout; c.lineWidth=Math.max(1,R*0.012);
    for(var i=1;i<GRID;i++){
      c.beginPath(); c.moveTo(ox+i*cell,-R); c.lineTo(ox+i*cell,R); c.stroke();
      c.beginPath(); c.moveTo(-R,oy+i*cell); c.lineTo(R,oy+i*cell); c.stroke();
    }
    c.restore();
    // leading ring
    c.strokeStyle=pal.lead; c.lineWidth=Math.max(2,R*0.05);
    c.beginPath(); c.arc(0,0,R,0,TAU); c.stroke();
    c.restore();
  }

  // ---- particles & floaters ----
  var parts=[], floats=[], ambient=[];
  function spawnBurst(x,y){
    for(var i=0;i<20;i++){
      var a=rand(0,TAU), sp=rand(60,320);
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp - 40,life:rand(0.5,1.0),max:1,size:rand(2,5),kind:'burst',rot:0,vr:0});
    }
  }
  function spawnShards(x,y){
    for(var i=0;i<16;i++){
      var a=rand(0,TAU), sp=rand(50,260);
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(0.4,0.9),max:1,size:rand(3,7),kind:'shard',rot:rand(0,TAU),vr:rand(-8,8)});
    }
  }
  function spawnSpark(x,y){
    parts.push({x:x+rand(-6,6),y:y,vx:rand(-14,14),vy:rand(-42,-70),life:rand(0.7,1.2),max:1.2,size:rand(1.5,3),kind:'spark',rot:0,vr:0});
  }
  function spawnAmbient(){
    ambient.push({x:rand(0,W),y:H+10,vy:rand(-8,-22),vx:rand(-6,6),life:rand(6,12),max:12,size:rand(1,2.4),ph:rand(0,TAU)});
  }
  function updateParts(dt){
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i]; p.life-=dt; if(p.life<=0){ parts.splice(i,1); continue; }
      if(p.kind==='burst'){ p.vy+=420*dt; p.vx*=0.98; }
      else if(p.kind==='shard'){ p.vy+=520*dt; p.rot+=p.vr*dt; }
      else if(p.kind==='spark'){ p.vy+=26*dt; p.x+=Math.sin(p.life*10)*8*dt; }
      p.x+=p.vx*dt; p.y+=p.vy*dt;
    }
    for(var j=floats.length-1;j>=0;j--){ var f=floats[j]; f.life-=dt; f.y+=f.vy*dt; f.vy*=0.94; if(f.life<=0) floats.splice(j,1); }
    for(var k=ambient.length-1;k>=0;k--){ var a=ambient[k]; a.life-=dt; a.y+=a.vy*dt; a.x+=Math.sin((a.life+a.ph)*0.8)*4*dt + a.vx*dt; if(a.life<=0||a.y< -20) ambient.splice(k,1); }
    if(ambient.length<26 && Math.random()<dt*6) spawnAmbient();
  }
  function drawParts(){
    var c=ctx;
    for(var m=0;m<ambient.length;m++){ var a=ambient[m]; var al=Math.min(1,a.life/a.max)*0.5; c.globalAlpha=al; c.fillStyle=pal.warmGlow+'0.7)'; c.beginPath(); c.arc(a.x,a.y,a.size,0,TAU); c.fill(); }
    c.globalAlpha=1;
    for(var i=0;i<parts.length;i++){
      var p=parts[i]; var al=clamp(p.life/p.max,0,1);
      if(p.kind==='shard'){
        c.save(); c.globalAlpha=al; c.translate(p.x,p.y); c.rotate(p.rot);
        c.fillStyle=pal.coldMid; c.beginPath(); c.moveTo(0,-p.size); c.lineTo(p.size,p.size); c.lineTo(-p.size,p.size); c.closePath(); c.fill();
        c.restore();
      } else {
        var col = p.kind==='spark' ? pal.warmGlow+(al)+')' : pal.warmGlow+(al*0.95)+')';
        c.globalAlpha=1;
        c.fillStyle=col;
        c.beginPath(); c.arc(p.x,p.y,p.size,0,TAU); c.fill();
        if(p.kind==='spark'){ c.globalAlpha=al*0.5; c.beginPath(); c.arc(p.x,p.y,p.size*2.4,0,TAU); c.fillStyle=pal.warmGlow+'0.25)'; c.fill(); }
      }
    }
    c.globalAlpha=1;
    for(var f=0;f<floats.length;f++){
      var ff=floats[f]; var fa=clamp(ff.life/ff.max,0,1);
      c.globalAlpha=fa; c.fillStyle=ff.color; c.font='800 '+ff.size+'px ui-monospace,Menlo,monospace';
      c.textAlign='center'; c.textBaseline='middle';
      c.fillText(ff.text, ff.x, ff.y);
    }
    c.globalAlpha=1;
  }

  // ---- audio (guarded) ----
  var AC=null, master=null;
  function initAudio(){
    if(AC) return;
    try{
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return;
      AC = new C();
      master = AC.createGain();
      master.gain.value = S.muted?0:0.85;
      master.connect(AC.destination);
    }catch(e){ AC=null; }
  }
  function resumeAudio(){ try{ if(AC && AC.state==='suspended') AC.resume(); }catch(e){} }
  function tone(freq,dur,type,vol,when,glide){
    if(!AC||!master) return;
    try{
      var t = when||AC.currentTime;
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
      if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(20,glide), t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(vol||0.2, t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  }
  function noiseHit(dur,vol,cut){
    if(!AC||!master) return;
    try{
      var n=AC.createBufferSource();
      var b=AC.createBuffer(1, Math.max(1,(AC.sampleRate*dur)|0), AC.sampleRate);
      var d=b.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      n.buffer=b;
      var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1400;
      var g=AC.createGain(); g.gain.setValueAtTime(vol||0.2, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
      n.connect(f); f.connect(g); g.connect(master); n.start(); n.stop(AC.currentTime+dur+0.02);
    }catch(e){}
  }
  var PENTA=[523.25,587.33,659.25,783.99,880.00,987.77];
  function sfxCorrect(combo){
    if(!AC) return; var t=AC.currentTime;
    var idx=Math.min(PENTA.length-1, combo);
    tone(PENTA[idx],0.20,'triangle',0.26,t);
    tone(PENTA[idx]*2,0.14,'sine',0.08,t+0.01);
  }
  function sfxMilestone(){
    if(!AC) return; var t=AC.currentTime;
    [0,1,2,4].forEach(function(k,i){ tone(PENTA[k],0.5,'triangle',0.16,t+i*0.07); });
  }
  function sfxWrong(){ tone(180,0.20,'sawtooth',0.20,AC?AC.currentTime:0,90); noiseHit(0.14,0.14,900); }
  function sfxTimeout(){ tone(320,0.32,'sine',0.18,AC?AC.currentTime:0,150); }
  function sfxOver(){ if(!AC)return; var t=AC.currentTime; tone(196,0.7,'sine',0.16,t); tone(233.08,0.7,'sine',0.12,t+0.02); tone(146.83,0.9,'sine',0.12,t+0.04); }
  function sfxStart(){ tone(440,0.10,'triangle',0.18); tone(660,0.14,'sine',0.10, AC?AC.currentTime+0.05:0); }
  function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

  // ---- state ----
  var S = {
    mode:'title', phase:'over',
    score:0, best:0, combo:0, bestCombo:0,
    lives:3, maxLives:3, level:1, clears:0,
    tiles:[], realIndex:0, gtype:'heart', lastType:'', sharedPhase:0,
    roundTime:4, roundLeft:4, introT:0, outT:0, revT:0,
    hitStop:0, shake:0, shakeX:0, shakeY:0,
    flash:null, restored:0, totalShards:TOTAL,
    muted:false, hintT:0, portraitPulse:0, tickT:0, titleFrac:0.55
  };
  var nowSec=0;

  function countFor(l){ if(l<=2)return 4; if(l<=4)return 6; if(l<=7)return 9; if(l<=10)return 12; return 16; }
  function timeFor(l){ return clamp(4.7 - 0.235*l, 1.45, 4.7); }
  function warmMimic(l){ return clamp((l-4)/9,0,0.7); }
  function motionMimic(l){ return clamp((l-6)/8,0,0.95); }
  function hazeFor(l){ return clamp((l-5)/18,0,0.34); }
  function sparkGap(l){ return clamp(0.92 - l*0.03, 0.34, 0.92); }

  var POOL=['heart','smile','wave','peace','thumb','high'];
  function buildTiles(n){
    S.tiles=[];
    for(var i=0;i<n;i++){
      S.tiles.push({ i:i, real:false, seed:rand(0,1000), wob:0, beatPhase:rand(0,1), hb:0,
        cx:0,cy:0,w:60,h:60, win:false, wrong:false, sparkT:rand(0.2,0.7) });
    }
    S.realIndex = (Math.random()*n)|0;
    S.tiles[S.realIndex].real=true;
    S.sharedPhase = rand(0,TAU);
    var g;
    do { g = POOL[(Math.random()*POOL.length)|0]; } while(g===S.lastType && Math.random()<0.8);
    S.gtype=g; S.lastType=g;
    layoutTiles();
  }
  function gridFor(n, aw, ah){
    var best=null, GAPg=12;
    for(var cols=1; cols<=n; cols++){
      var rows=Math.ceil(n/cols);
      var tw=(aw-(cols+1)*GAPg)/cols;
      var th=(ah-(rows+1)*GAPg)/rows;
      var s=Math.min(tw,th);
      if(s<=0) continue;
      var waste=rows*cols-n;
      var score=s - waste*6 - Math.abs(tw-th)*0.4;
      if(!best || score>best.score) best={cols:cols,rows:rows,s:s,score:score};
    }
    return best||{cols:1,rows:n,s:20};
  }
  var PREF={4:[2,2],6:[2,3],9:[3,3],12:[3,4],16:[4,4]};
  function layoutTiles(){
    var n=S.tiles.length; if(!n) return;
    var GAPg=n>=12?10:12;
    var cols, rows;
    var pr=PREF[n];
    if(pr){ cols=pr[0]; rows=pr[1]; if(arena.w > arena.h*1.15){ cols=pr[1]; rows=pr[0]; } }
    else { var g0=gridFor(n, arena.w, arena.h); cols=g0.cols; rows=g0.rows; }
    var tw=(arena.w-(cols+1)*GAPg)/cols;
    var th=(arena.h-(rows+1)*GAPg)/rows;
    var MAXT=Math.min(156, arena.w*0.44);
    var t=Math.max(46, Math.min(tw, th, MAXT));
    var gw=cols*t + (cols-1)*GAPg;
    var gh=rows*t + (rows-1)*GAPg;
    var g={cols:cols, rows:rows};
    var startX=arena.x + (arena.w-gw)/2;
    var startY=arena.y + (arena.h-gh)/2;
    for(var i=0;i<n;i++){
      var r=(i/g.cols)|0, cc=i%g.cols;
      var tl=S.tiles[i];
      tl.w=t; tl.h=t;
      tl.x=startX + cc*(t+GAPg);
      tl.y=startY + r*(t+GAPg);
      tl.cx=tl.x+t/2; tl.cy=tl.y+t/2;
    }
  }

  // ---- flow ----
  function startGame(){
    initAudio(); resumeAudio();
    S.mode='playing';
    S.score=0; S.combo=0; S.bestCombo=0;
    S.lives=3; S.maxLives=3; S.level=1; S.clears=0; S.restored=0;
    S.hintT=4.2; S.portraitPulse=0;
    parts.length=0; floats.length=0;
    titleEl.style.display='none'; titleEl.setAttribute('aria-hidden','true');
    overEl.style.display='none'; overEl.setAttribute('aria-hidden','true');
    sfxStart();
    startRound();
  }
  function startRound(){
    S.phase='in'; S.introT=0.36; S.outT=0; S.revT=0;
    S.roundTime=timeFor(S.level); S.roundLeft=S.roundTime;
    buildTiles(countFor(S.level));
  }
  function onCorrect(tl){
    S.combo++; if(S.combo>S.bestCombo) S.bestCombo=S.combo;
    S.clears++;
    var frac=clamp(S.roundLeft/S.roundTime,0,1);
    var gain=Math.round((100 + Math.round(130*frac)) * (1 + 0.12*(S.combo-1)));
    S.score+=gain; if(S.score>S.best) S.best=S.score;
    S.restored=Math.min(S.totalShards, S.restored+2);
    floats.push({x:tl.cx,y:tl.cy-tl.h*0.35,vy:-46,life:0.95,max:0.95,text:'+'+gain,color:pal.warmMid,size:Math.min(30,18+S.combo)});
    spawnBurst(tl.cx,tl.cy);
    S.flash={color:pal.warmGlow, a:0.22, t:0.28, max:0.28};
    S.shake=Math.min(9,4+S.combo*0.3); S.hitStop=0.06;
    sfxCorrect(S.combo); vib(12);
    tl.win=true;
    if(S.clears%5===0){
      S.portraitPulse=1; sfxMilestone(); vib([10,26,10,26]);
      floats.push({x:W/2,y:arena.y+arena.h*0.5,vy:-30,life:1.4,max:1.4,text:'WARMTH RESTORED',color:pal.warmMid,size:20});
      if(S.clears%10===0 && S.maxLives<5){ S.maxLives++; S.lives=Math.min(S.maxLives,S.lives+1); }
    }
    S.level++;
    S.phase='out'; S.outT=0.30;
  }
  function loseWarmth(tl){
    S.combo=0; S.lives--;
    S.flash={color: (pal===DARK?'rgba(255,90,60,':'rgba(210,60,40,'), a:0.28, t:0.34, max:0.34};
    S.shake=12;
    if(tl){ tl.wrong=true; spawnShards(tl.cx,tl.cy); }
    vib([22,44,22]);
    S.phase='reveal'; S.revT=0.72;
  }
  function onWrong(tl){ sfxWrong(); loseWarmth(tl); }
  function onTimeout(){ sfxTimeout(); loseWarmth(null); }
  function gameOver(){
    S.mode='gameover'; S.phase='over';
    if(S.score>S.best) S.best=S.score;
    sfxOver(); vib([60,40,60]);
    fScore.textContent=S.score;
    fCombo.textContent=S.bestCombo;
    fLevel.textContent=S.level;
    var pct=Math.round(S.restored/S.totalShards*100);
    fRestore.textContent=pct+'%';
    overKicker.textContent = pct>=100 ? 'you kept them human' : 'the chrome crept in';
    overTitle.textContent = pct>=100 ? 'fully restored' : 'warmth faded';
    overMsg.textContent = pct>=70 ? 'so much warmth remains' : (pct>=30 ? 'the warmth you saved remains' : 'find the living one — it always breathes');
    overEl.style.display='flex'; overEl.setAttribute('aria-hidden','false');
  }

  // ---- update ----
  function update(dt){
    nowSec+=dt;
    if(S.flash){ S.flash.t-=dt; if(S.flash.t<=0) S.flash=null; }
    if(S.shake>0){ S.shake=Math.max(0,S.shake-dt*38); }
    S.shakeX=(Math.random()*2-1)*S.shake; S.shakeY=(Math.random()*2-1)*S.shake;
    if(S.portraitPulse>0) S.portraitPulse=Math.max(0,S.portraitPulse-dt*0.9);
    if(S.hintT>0) S.hintT=Math.max(0,S.hintT-dt);
    updateParts(dt);
    if(S.mode==='title'){ S.titleFrac = 0.5 + 0.35*Math.sin(nowSec*0.7); }

    // per-tile anim (real breathes irregularly; decoys handled in render)
    for(var i=0;i<S.tiles.length;i++){
      var tl=S.tiles[i];
      if(tl.real){
        var period = 0.82 + 0.28*noise(nowSec*0.35 + tl.seed);
        tl.beatPhase += dt/period;
        var p=tl.beatPhase%1;
        tl.hb = Math.exp(-Math.pow((p-0.04)/0.05,2)) + 0.55*Math.exp(-Math.pow((p-0.20)/0.05,2));
        tl.wob = 0.05*(noise(nowSec*0.7 + tl.seed*1.7)*2-1);
      }
    }

    if(S.hitStop>0){ S.hitStop-=dt; return; }
    if(S.mode!=='playing') return;

    if(S.phase==='in'){ S.introT-=dt; if(S.introT<=0){ S.phase='live'; } return; }
    if(S.phase==='out'){
      S.outT-=dt;
      // spawn sparks from winner during pop
      if(S.phase==='out' && Math.random()<dt*30){ var wt=S.tiles[S.realIndex]; if(wt) spawnSpark(wt.cx,wt.cy); }
      if(S.outT<=0){ startRound(); }
      return;
    }
    if(S.phase==='reveal'){ S.revT-=dt; if(S.revT<=0){ if(S.lives<=0) gameOver(); else startRound(); } return; }

    // live
    for(var s=0;s<S.tiles.length;s++){
      var t2=S.tiles[s];
      if(t2.real){ t2.sparkT-=dt; if(t2.sparkT<=0){ spawnSpark(t2.cx, t2.cy - t2.h*0.18); var sg=sparkGap(S.level); t2.sparkT=rand(sg*0.7, sg*1.1); } }
    }
    S.roundLeft-=dt;
    if(S.roundLeft<=2 && S.roundLeft>0){ S.tickT-=dt; if(S.tickT<=0){ S.tickT=0.5; tone(880,0.03,'square',0.05); } }
    if(S.roundLeft<=0){ S.roundLeft=0; onTimeout(); }
  }

  // ---- render ----
  function drawBackground(){
    var c=ctx;
    c.fillStyle=pal.bg0; c.fillRect(0,0,W,H);
    var cx=W*0.5, cy=H*0.42, r=Math.max(W,H)*0.75;
    var g=c.createRadialGradient(cx,cy,0,cx,cy,r);
    if(pal===DARK){ g.addColorStop(0,'rgba(60,34,18,0.55)'); g.addColorStop(1,'rgba(0,0,0,0)'); }
    else { g.addColorStop(0,'rgba(255,230,190,0.5)'); g.addColorStop(1,'rgba(255,255,255,0)'); }
    c.fillStyle=g; c.fillRect(0,0,W,H);
    // bottom vignette
    var vg=c.createLinearGradient(0,H*0.6,0,H);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1, pal===DARK?'rgba(0,0,0,0.4)':'rgba(80,60,40,0.10)');
    c.fillStyle=vg; c.fillRect(0,H*0.6,W,H*0.4);
  }
  function drawHaze(level){
    var h=hazeFor(level); if(h<=0) return;
    var c=ctx;
    c.save(); c.globalAlpha=h;
    var g=c.createRadialGradient(W/2,arena.y+arena.h/2,arena.w*0.2, W/2,arena.y+arena.h/2, arena.w*0.75);
    g.addColorStop(0, pal.haze+'0)'); g.addColorStop(1, pal.haze+'0.5)');
    c.fillStyle=g; c.fillRect(0,0,W,H);
    // faint scanlines
    c.globalAlpha=h*0.5; c.strokeStyle=pal.haze+'0.4)'; c.lineWidth=1;
    for(var y=arena.y; y<arena.y+arena.h; y+=4){ c.beginPath(); c.moveTo(arena.x,y+0.5); c.lineTo(arena.x+arena.w,y+0.5); c.stroke(); }
    c.restore();
  }
  function drawCard(w,h){
    var c=ctx, r=Math.min(w,h)*0.22;
    c.beginPath(); rrPath(c,-w/2,-h/2,w,h,r);
    c.fillStyle=pal.tileBg; c.fill();
    c.lineWidth=1.2; c.strokeStyle=pal.tileLine; c.stroke();
  }
  function drawTiles(){
    var c=ctx, n=S.tiles.length;
    for(var i=0;i<n;i++){
      var tl=S.tiles[i];
      var ap=1;
      if(S.phase==='in'){
        var e=(0.36 - S.introT) - i*0.028;
        ap = e<=0?0:Math.min(1, e/0.18); ap=easeOutBack(ap);
      }
      if(ap<=0.001) continue;
      var alpha=1, winScale=1;
      if(S.phase==='out'){
        var op=1-clamp(S.outT/0.30,0,1);
        if(tl.win){ winScale=1+0.55*op; alpha=1-op*0.9; }
        else { alpha=1-op*0.85; }
      }
      if(S.phase==='reveal'){
        if(!tl.real) alpha*= (tl.wrong?0.45:0.6);
      }
      var bs=1, glow=0;
      if(tl.real){ bs=1+0.065*tl.hb; glow=0.62+0.5*tl.hb; }
      else { var mm=motionMimic(S.level); bs=1+mm*0.028*Math.sin(nowSec*2.3+S.sharedPhase); }

      c.save();
      c.globalAlpha=alpha;
      c.translate(tl.cx,tl.cy);
      c.scale(ap*winScale, ap*winScale);
      drawCard(tl.w,tl.h);
      var gs=tl.w*0.5;
      c.save();
      c.scale(bs,bs); c.rotate(tl.wob||0);
      if(tl.real) warmGlow(c, gs, glow);
      drawGesture(c, S.gtype, gs, tl.real, tl.real?0:warmMimic(S.level), nowSec, S.sharedPhase);
      c.restore();
      // reveal ring on the real one
      if(S.phase==='reveal' && tl.real){
        var pr=(0.72-S.revT)/0.72;
        c.lineWidth=3+3*Math.sin(nowSec*10);
        c.strokeStyle=pal.warmMid;
        c.globalAlpha=alpha*(0.7+0.3*Math.sin(nowSec*12));
        c.beginPath(); rrPath(c,-tl.w/2-4,-tl.h/2-4,tl.w+8,tl.h+8,tl.w*0.24); c.stroke();
      }
      c.restore();
    }
  }

  function drawTimer(){
    var c=ctx;
    var frac=clamp(S.roundLeft/S.roundTime,0,1);
    var x=arena.x, y=topBand-6, w=arena.w, h=6;
    c.fillStyle=pal.track; c.beginPath(); rrPath(c,x,y,w,h,3); c.fill();
    var col=hexLerp(pal.timerB,pal.timerA,frac);
    var fw=Math.max(0.001,w*frac);
    c.fillStyle=col; c.beginPath(); rrPath(c,x,y,fw,h,3); c.fill();
    if(frac<0.34){ c.save(); c.globalAlpha=0.5+0.5*Math.sin(nowSec*14); c.shadowColor=col; c.shadowBlur=10; c.fillStyle=col; c.beginPath(); rrPath(c,x,y,fw,h,3); c.fill(); c.restore(); }
  }
  function heartIcon(c,x,y,r,fill,col){
    c.save(); c.translate(x,y); c.scale(r/10,r/10);
    c.beginPath(); heartPath(c,16);
    if(fill){ c.fillStyle=col; c.fill(); } else { c.lineWidth=1.6; c.strokeStyle=col; c.globalAlpha=0.5; c.stroke(); }
    c.restore();
  }
  var muteRect={x:0,y:0,w:0,h:0};
  function drawMute(){
    var c=ctx, s=22, x=W-16-s, y=safeTop()+12;
    muteRect={x:x-8,y:y-6,w:s+16,h:s+12};
    c.save(); c.strokeStyle=pal.mut; c.fillStyle=pal.mut; c.lineWidth=2; c.lineJoin='round';
    c.beginPath(); c.moveTo(x, y+s*0.35); c.lineTo(x+s*0.32,y+s*0.35); c.lineTo(x+s*0.6,y+s*0.12); c.lineTo(x+s*0.6,y+s*0.88); c.lineTo(x+s*0.32,y+s*0.65); c.lineTo(x,y+s*0.65); c.closePath(); c.fill();
    if(S.muted){ c.beginPath(); c.moveTo(x+s*0.72,y+s*0.32); c.lineTo(x+s*1.02,y+s*0.68); c.moveTo(x+s*1.02,y+s*0.32); c.lineTo(x+s*0.72,y+s*0.68); c.stroke(); }
    else { c.beginPath(); c.arc(x+s*0.7,y+s*0.5,s*0.22,-0.6,0.6); c.stroke(); c.beginPath(); c.arc(x+s*0.7,y+s*0.5,s*0.42,-0.6,0.6); c.globalAlpha=0.6; c.stroke(); }
    c.restore();
  }
  function drawHUD(){
    var c=ctx; var top=safeTop();
    c.textBaseline='alphabetic';
    // score
    c.textAlign='left';
    c.fillStyle=pal.mut; c.font='700 10px ui-monospace,Menlo,monospace';
    c.fillText('SCORE', 16, top+18);
    c.fillStyle=pal.fg; c.font='800 26px ui-monospace,Menlo,monospace';
    c.fillText(String(S.score), 16, top+44);
    c.fillStyle=pal.mut; c.font='700 10px ui-monospace,Menlo,monospace';
    c.fillText('RESTORED '+Math.round(S.restored/S.totalShards*100)+'%', 16, top+60);
    // hearts center
    var hearts=S.maxLives, hr=9, gapH=24, totalW=(hearts-1)*gapH;
    var hx=W/2-totalW/2, hy=top+16;
    for(var i=0;i<hearts;i++){ heartIcon(c, hx+i*gapH, hy, hr, i<S.lives, pal.heart); c.globalAlpha=1; }
    c.textAlign='center'; c.fillStyle=pal.mut; c.font='700 10px ui-monospace,Menlo,monospace';
    c.fillText('LEVEL '+S.level, W/2, top+44);
    // combo right
    if(S.combo>1){ c.textAlign='right'; c.fillStyle=pal.warmMid; c.font='800 20px ui-monospace,Menlo,monospace'; c.fillText('×'+S.combo, W-16, top+60); }
    drawMute();
  }
  function drawHint(){
    if(S.hintT<=0) return;
    var c=ctx, a=clamp(S.hintT/1.2,0,1)*0.92;
    var y=Math.min(H-safeBottom()-16, arena.y+arena.h+18);
    c.save(); c.globalAlpha=a; c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle=pal.fg; c.font='700 15px ui-monospace,Menlo,monospace';
    c.fillText('tap the one that\u2019s alive', W/2, y);
    c.restore();
  }
  function drawTitleScene(){
    var R=Math.min(arena.w,arena.h)*0.20;
    drawPortrait(W/2, H*0.44, R, S.titleFrac, 0.95, nowSec);
  }
  function drawGameOverScene(){
    var c=ctx;
    c.fillStyle= pal===DARK? 'rgba(8,6,5,0.55)':'rgba(255,250,242,0.35)';
    c.fillRect(0,0,W,H);
    var R=Math.min(W,H)*0.20;
    drawPortrait(W/2, H*0.34, R, S.restored/S.totalShards, 0.98, nowSec);
  }
  function drawFlash(){
    if(!S.flash) return;
    var a=S.flash.a*(S.flash.t/S.flash.max);
    ctx.fillStyle=S.flash.color+a+')'; ctx.fillRect(0,0,W,H);
  }

  function render(){
    if(ctx.setTransform) ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.save();
    ctx.translate(S.shakeX||0, S.shakeY||0);
    drawBackground();
    if(S.mode==='playing'){
      var R=Math.min(arena.w,arena.h)*0.40;
      drawPortrait(W/2, arena.y+arena.h*0.5, R, S.restored/S.totalShards, 0.032+0.24*S.portraitPulse, nowSec);
      drawTiles();
      drawHaze(S.level);
      drawParts();
      drawTimer();
      drawHUD();
      drawHint();
    } else if(S.mode==='title'){
      drawParts();
      drawTitleScene();
    } else {
      drawGameOverScene();
      drawParts();
    }
    ctx.restore();
    drawFlash();
  }

  // ---- input ----
  function pt(e){
    var r=cv.getBoundingClientRect();
    var cx = (e.clientX!==undefined)? e.clientX : (e.touches&&e.touches[0]?e.touches[0].clientX:0);
    var cy = (e.clientY!==undefined)? e.clientY : (e.touches&&e.touches[0]?e.touches[0].clientY:0);
    return {x:cx-r.left, y:cy-r.top};
  }
  function inRect(p,r){ return p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h; }
  function toggleMute(){ S.muted=!S.muted; if(master) master.gain.value=S.muted?0:0.85; }
  function onDown(e){
    if(e.preventDefault) e.preventDefault();
    resumeAudio();
    var p=pt(e);
    if(muteRect.w && inRect(p,muteRect)){ toggleMute(); return; }
    if(S.mode!=='playing' || S.phase!=='live') return;
    for(var i=0;i<S.tiles.length;i++){
      var tl=S.tiles[i];
      if(p.x>=tl.x && p.x<=tl.x+tl.w && p.y>=tl.y && p.y<=tl.y+tl.h){
        if(tl.real) onCorrect(tl); else onWrong(tl);
        return;
      }
    }
  }
  cv.addEventListener('pointerdown', onDown, {passive:false});
  cv.addEventListener('touchstart', function(e){ if(e.preventDefault) e.preventDefault(); }, {passive:false});

  function selectIndex(idx){
    if(S.mode!=='playing' || S.phase!=='live') return;
    if(idx<0 || idx>=S.tiles.length) return;
    var tl=S.tiles[idx]; if(tl.real) onCorrect(tl); else onWrong(tl);
  }
  window.addEventListener('keydown', function(e){
    var k=e.key;
    if(k===' '||k==='Enter'){
      e.preventDefault();
      if(S.mode==='title') startGame();
      else if(S.mode==='gameover') startGame();
      return;
    }
    if(k==='m'||k==='M'){ toggleMute(); return; }
    if(k>='1'&&k<='9'){ selectIndex(parseInt(k,10)-1); }
  });

  var startEl=document.getElementById('startBtn');
  var restartEl=document.getElementById('restartBtn');
  var titleEl=document.getElementById('title');
  var overEl=document.getElementById('over');
  var fScore=document.getElementById('fScore');
  var fCombo=document.getElementById('fCombo');
  var fLevel=document.getElementById('fLevel');
  var fRestore=document.getElementById('fRestore');
  var overKicker=document.getElementById('overKicker');
  var overTitle=document.getElementById('overTitle');
  var overMsg=document.getElementById('overMsg');
  if(startEl) startEl.addEventListener('click', function(e){ e.preventDefault(); startGame(); });
  if(restartEl) restartEl.addEventListener('click', function(e){ e.preventDefault(); startGame(); });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });

  // ---- main loop ----
  var last=performance.now();
  function frame(now){
    var dt=(now-last)/1000; last=now;
    if(dt>0.05) dt=0.05; if(dt<0) dt=0;
    try { update(dt); render(); } catch(err){ /* never crash the loop */ }
    requestAnimationFrame(frame);
  }
  // seed a little ambient warmth immediately
  for(var a=0;a<14;a++){ ambient.push({x:rand(0,600),y:rand(0,900),vy:rand(-8,-22),vx:rand(-6,6),life:rand(2,12),max:12,size:rand(1,2.4),ph:rand(0,TAU)}); }
  resize();
  S.mode='title';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
