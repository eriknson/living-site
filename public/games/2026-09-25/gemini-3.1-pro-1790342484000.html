<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autumn Sort</title>
<style>
  * { box-sizing: border-box; }
  
  :root {
    --bg-color: #e0f2f1;
    --text-color: #263238;
    --overlay-bg: rgba(224, 242, 241, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #0d1b2a;
      --text-color: #e0e1dd;
      --overlay-bg: rgba(13, 27, 42, 0.85);
    }
  }

  html, body {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    background-color: var(--bg-color);
    color: var(--text-color);
  }

  #sunset-bg {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 0%;
    background: linear-gradient(to top, rgba(255, 112, 67, 0.5), rgba(255, 202, 40, 0.1));
    transition: height 0.5s ease;
    z-index: 0;
    pointer-events: none;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  #flash-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #ff5252;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
    transition: opacity 0.2s;
  }
  #flash-overlay.flash {
    opacity: 0.3;
    transition: none;
  }

  #hud {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    padding: 1.5rem;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #hud.active {
    opacity: 1;
  }

  .hud-box { display: flex; flex-direction: column; }
  .label { font-size: 0.75rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; font-weight: bold; }
  .val { font-size: 1.5rem; font-weight: bold; transition: transform 0.1s; }
  
  #strikes { display: flex; gap: 6px; margin-top: 6px; }
  .strike {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.2;
  }
  .strike.active { opacity: 1; color: #ff5252; }

  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background: var(--overlay-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 2.5rem 2rem;
    border-radius: 16px;
    border: 1px solid rgba(128, 128, 128, 0.15);
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    pointer-events: none;
  }
  .screen.active { display: flex; }

  h1 { margin: 0 0 0.5rem 0; font-size: 2.2rem; font-weight: bold; letter-spacing: -0.02em; }
  p { margin: 0 0 2rem 0; font-size: 1rem; line-height: 1.5; opacity: 0.8; max-width: 280px; }

  button {
    pointer-events: auto;
    background: var(--text-color);
    color: var(--bg-color);
    border: none;
    padding: 1.25rem 2.5rem;
    font-size: 1.1rem;
    font-family: inherit;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>
  <div id="sunset-bg"></div>
  <canvas id="game"></canvas>
  <div id="flash-overlay"></div>

  <div id="hud">
    <div class="hud-box">
      <span class="label">Score</span>
      <span id="score-val" class="val">0</span>
    </div>
    <div class="hud-box" style="align-items: flex-end;">
      <span class="label">Strikes</span>
      <div id="strikes">
        <div class="strike" id="strike-1"></div>
        <div class="strike" id="strike-2"></div>
        <div class="strike" id="strike-3"></div>
      </div>
    </div>
  </div>

  <div id="ui-layer">
    <div class="screen active" id="title-screen">
      <h1>Autumn Sort</h1>
      <p>Swipe to flick fallen leaves into matching bins. Watch the wind direction!</p>
      <button data-smoke="start" id="start-btn">Start Game</button>
    </div>
    <div class="screen" id="game-over-screen">
      <h1>Game Over</h1>
      <p>Sorted: <span id="final-score" style="font-weight:bold; font-size:1.5em;">0</span></p>
      <button data-smoke="restart" id="restart-btn">Play Again</button>
    </div>
  </div>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx && typeof AudioContext !== 'undefined') {
    try { audioCtx = new AudioContext(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(()=>{});
  }
}
function playSound(type) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'hit') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'strike') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'flick') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'wind') {
      const bufferSize = audioCtx.sampleRate * 1;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(400, now);
      filter.frequency.exponentialRampToValueAtTime(100, now + 1);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.1, now + 0.2);
      gain.gain.linearRampToValueAtTime(0, now + 1);
      noise.connect(filter);
      filter.connect(gain);
      noise.start(now);
    }
  } catch(e) {}
}

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let width, height;

const LEAF_COLORS = ['#ff5252', '#ffeb3b', '#ff9800'];
const leafPaths = [
  [0,-1, 0.2,-0.4, 0.8,-0.5, 0.4,0, 0.7,0.7, 0,0.4, -0.7,0.7, -0.4,0, -0.8,-0.5, -0.2,-0.4],
  [0,-1, 0.4,-0.4, 0.5,0.2, 0.2,0.8, -0.2,0.8, -0.5,0.2, -0.4,-0.4],
  [0,-1, 0.3,-0.8, 0.2,-0.4, 0.6,-0.2, 0.4,0.2, 0.5,0.7, 0,0.8, -0.5,0.7, -0.4,0.2, -0.6,-0.2, -0.2,-0.4, -0.3,-0.8]
];

function drawLeafPath(ctx, type, size) {
  ctx.beginPath();
  const p = leafPaths[type];
  ctx.moveTo(p[0]*size, p[1]*size);
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i]*size, p[i+1]*size);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, size * 0.7);
  ctx.lineTo(0, size * 1.3);
  ctx.strokeStyle = ctx.fillStyle; 
  ctx.lineWidth = size * 0.15;
  ctx.lineCap = 'round';
  ctx.stroke();
}

let gameState = 'title';
let score = 0, streak = 0, strikes = 0;
let leaves = [], particles = [], windLines = [], bins = [];
let currentLeaf = null;
let wind = {x: 0, y: 0}, targetWind = {x: 0, y: 0};
let windTimer = 0;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width; canvas.height = height;
  if (bins.length === 3) {
    bins[0].baseX = width * 0.2;
    bins[1].baseX = width * 0.5;
    bins[2].baseX = width * 0.8;
  }
}
window.addEventListener('resize', resize);
resize();

class WindLine {
  constructor() { this.reset(); this.x = Math.random() * width; }
  reset() {
    this.y = Math.random() * height;
    this.x = wind.x > 0 ? -100 : width + 100;
    this.length = 50 + Math.random() * 100;
    this.speed = 1 + Math.random() * 0.5;
    this.alpha = 0.05 + Math.random() * 0.15;
  }
  update(dt) {
    let wx = wind.x * this.speed; let wy = wind.y * this.speed;
    if (Math.abs(wx) < 50) wx = wx < 0 ? -50 : 50;
    this.x += wx * dt; this.y += wy * dt;
    if ((wx > 0 && this.x - this.length > width) || (wx < 0 && this.x + this.length < 0)) this.reset();
  }
  draw(ctx) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    let mag = Math.hypot(wind.x, wind.y) + 0.001;
    ctx.lineTo(this.x - (wind.x/mag)*this.length, this.y - (wind.y/mag)*this.length);
    ctx.strokeStyle = `rgba(150, 150, 150, ${this.alpha})`;
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
  }
}
for(let i=0; i<15; i++) windLines.push(new WindLine());

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 500;
    this.vy = (Math.random() - 0.5) * 500;
    this.life = 1.0;
    this.color = color;
    this.size = 3 + Math.random() * 5;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.life -= dt * 2;
  }
  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}
function createParticles(x, y, color) {
  for(let i=0; i<12; i++) particles.push(new Particle(x, y, color));
}

class Leaf {
  constructor(type) {
    this.type = type;
    this.x = width / 2;
    this.y = height - 150;
    this.vx = 0; this.vy = 0;
    this.rotation = (Math.random() - 0.5) * Math.PI;
    this.angularVel = 0;
    this.size = 0;
    this.targetSize = 35;
    this.state = 'spawning';
    this.timer = 0;
    this.color = LEAF_COLORS[type];
  }
  update(dt) {
    if (this.state === 'spawning') {
      this.size += (this.targetSize - this.size) * 15 * dt;
      if (this.size > this.targetSize - 0.5) { this.size = this.targetSize; this.state = 'idle'; }
    } else if (this.state === 'idle') {
      this.timer += dt;
      let maxTime = Math.max(1.5, 4 - (score / 15));
      if (this.timer > maxTime) {
        this.state = 'falling';
        this.vx = (wind.x >= 0 ? 1 : -1) * 1000;
        this.vy = -100;
        this.angularVel = (Math.random() - 0.5) * 40;
      }
    } else if (this.state === 'flying' || this.state === 'falling') {
      this.vy += 1500 * dt;
      this.vx += wind.x * dt;
      this.vy += wind.y * dt;
      this.vx *= 0.99; this.vy *= 0.99;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.rotation += this.angularVel * dt;
      
      if (this.state === 'flying') {
        for (let b of bins) {
          let bx = b.baseX + b.xOffset; let by = b.y + b.yOffset;
          if (Math.hypot(this.x - bx, this.y - by) < b.radius) {
            if (this.type === b.type) {
              this.state = 'hit'; this.vx = 0; this.vy = 0; this.x = bx; this.y = by;
              handleScore(); createParticles(this.x, this.y, this.color);
            } else {
              this.state = 'falling';
              this.vx = (this.x - bx) * 5; this.vy = 200;
              handleStrike(); createParticles(this.x, this.y, '#9e9e9e');
            }
            break;
          }
        }
      }
      if (this.y > height + 100 || this.x < -100 || this.x > width + 100) {
        if (this.state === 'flying') handleStrike();
        this.state = 'dead';
      }
    } else if (this.state === 'hit') {
      this.size -= 150 * dt;
      if (this.size <= 0) this.state = 'dead';
    }
  }
  draw(ctx) {
    if (this.size <= 0.1) return;
    let drawX = this.x; let drawY = this.y;
    if (this.state === 'idle') {
      let timeLeft = Math.max(1.5, 4 - (score/15)) - this.timer;
      if (timeLeft < 1.0) {
        drawX += (Math.random()-0.5)*4; drawY += (Math.random()-0.5)*4;
      }
    }
    ctx.save();
    ctx.translate(drawX + 4, drawY + 6);
    ctx.rotate(this.rotation);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    drawLeafPath(ctx, this.type, this.size);
    ctx.restore();
    
    ctx.save();
    ctx.translate(drawX, drawY);
    ctx.rotate(this.rotation);
    ctx.fillStyle = this.color;
    drawLeafPath(ctx, this.type, this.size);
    ctx.restore();
  }
}

function setupBins() {
  bins = [
    { type: 0, baseX: width*0.2, xOffset: 0, yOffset: 0, y: height*0.15, radius: 40, baseT: 0 },
    { type: 1, baseX: width*0.5, xOffset: 0, yOffset: 0, y: height*0.15, radius: 40, baseT: 2 },
    { type: 2, baseX: width*0.8, xOffset: 0, yOffset: 0, y: height*0.15, radius: 40, baseT: 4 }
  ];
}

function updateBins(dt, time) {
  let difficulty = Math.min(score / 40, 1);
  let moveAmt = difficulty * 45;
  let shrink = difficulty * 15;
  bins.forEach(b => {
    if (score >= 5) {
      let speed = 1.5 + difficulty * 1.5;
      b.xOffset = Math.cos(time * speed + b.baseT) * moveAmt;
      b.yOffset = Math.sin(time * speed + b.baseT) * (moveAmt * 0.4);
    } else { b.xOffset = 0; b.yOffset = 0; }
    b.radius = 45 - shrink;
  });
}

function drawBin(ctx, b) {
  let bx = b.baseX + b.xOffset; let by = b.y + b.yOffset;
  ctx.save();
  ctx.translate(bx, by);
  ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI*2);
  ctx.strokeStyle = LEAF_COLORS[b.type];
  ctx.lineWidth = 3; ctx.setLineDash([8, 8]);
  ctx.lineDashOffset = -performance.now() / 40;
  ctx.stroke();
  ctx.fillStyle = LEAF_COLORS[b.type];
  ctx.globalAlpha = 0.5;
  drawLeafPath(ctx, b.type, b.radius * 0.4);
  ctx.restore();
}

function spawnNextLeaf() {
  currentLeaf = new Leaf(Math.floor(Math.random() * 3));
}

function handleScore() {
  score++; streak++;
  playSound('hit'); vibrate(40);
  const sv = document.getElementById('score-val');
  sv.innerText = score;
  sv.style.transform = 'scale(1.4)';
  setTimeout(() => sv.style.transform = 'scale(1)', 100);
  document.getElementById('sunset-bg').style.height = `${Math.min(100, score * 2)}%`;
}

function handleStrike() {
  strikes++; streak = 0;
  playSound('strike'); vibrate([100, 50, 100]);
  const flash = document.getElementById('flash-overlay');
  flash.classList.add('flash');
  setTimeout(() => flash.classList.remove('flash'), 50);
  for(let i=1; i<=3; i++) {
    const el = document.getElementById(`strike-${i}`);
    if (i <= strikes) el.classList.add('active');
    else el.classList.remove('active');
  }
  if (strikes >= 3) gameOver();
}

function flickCurrentLeaf(dx, dy) {
  if (Math.hypot(dx, dy) < 15) return;
  playSound('flick');
  let mag = Math.hypot(dx, dy);
  let dirX = dx / mag; let dirY = dy / mag;
  if (dirY > -0.2) dirY = -0.2;
  let power = 1000 + mag * 6;
  if (power > 2500) power = 2500;
  currentLeaf.vx = dirX * power;
  currentLeaf.vy = dirY * power;
  currentLeaf.angularVel = (Math.random() - 0.5) * 40;
  currentLeaf.state = 'flying';
  leaves.push(currentLeaf);
  currentLeaf = null;
  spawnNextLeaf();
}

let touchStartX, touchStartY, isDragging = false;
function handleStart(x, y) {
  if (gameState !== 'playing') return;
  initAudio();
  touchStartX = x; touchStartY = y;
  if (currentLeaf && currentLeaf.state === 'idle') isDragging = true;
}
function handleEnd(x, y) {
  if (gameState !== 'playing' || !isDragging) return;
  isDragging = false;
  flickCurrentLeaf(x - touchStartX, y - touchStartY);
}
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleStart(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, {passive: false});
canvas.addEventListener('touchmove', e => { if (gameState === 'playing' && isDragging) e.preventDefault(); }, {passive: false});
canvas.addEventListener('touchend', e => { e.preventDefault(); handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, {passive: false});
canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
canvas.addEventListener('mouseup', e => handleEnd(e.clientX, e.clientY));
window.addEventListener('keydown', e => {
  if (gameState !== 'playing' || !currentLeaf || currentLeaf.state !== 'idle') return;
  let dx = 0;
  if (e.key === 'ArrowLeft' || e.key === '1') dx = -200;
  else if (e.key === 'ArrowUp' || e.key === '2') dx = 0;
  else if (e.key === 'ArrowRight' || e.key === '3') dx = 200;
  else return;
  flickCurrentLeaf(dx, -200);
});

function startGame() {
  document.getElementById('title-screen').classList.remove('active');
  document.getElementById('game-over-screen').classList.remove('active');
  document.getElementById('hud').classList.add('active');
  document.getElementById('sunset-bg').style.height = '0%';
  gameState = 'playing'; score = 0; streak = 0; strikes = 0;
  document.getElementById('score-val').innerText = '0';
  for(let i=1; i<=3; i++) document.getElementById(`strike-${i}`).classList.remove('active');
  leaves = []; particles = [];
  wind = {x: 0, y: 0}; targetWind = {x: 0, y: 0}; windTimer = 0;
  setupBins(); spawnNextLeaf();
}

function gameOver() {
  gameState = 'gameOver';
  document.getElementById('game-over-screen').classList.add('active');
  document.getElementById('hud').classList.remove('active');
  document.getElementById('final-score').innerText = score;
  vibrate([200, 100, 200]);
}

document.getElementById('start-btn').addEventListener('click', function() { this.blur(); startGame(); });
document.getElementById('restart-btn').addEventListener('click', function() { this.blur(); startGame(); });

let lastTime = performance.now();
function gameLoop(time) {
  let dt = (time - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = time;

  windTimer -= dt;
  if (windTimer <= 0) {
    windTimer = 4 + Math.random() * 3;
    let windAmp = Math.min(score * 20, 800);
    targetWind.x = (Math.random() - 0.5) * 2 * windAmp;
    targetWind.y = (Math.random() - 0.5) * 100;
    if (gameState === 'playing' && Math.abs(targetWind.x - wind.x) > 300) playSound('wind');
  }
  wind.x += (targetWind.x - wind.x) * dt;
  wind.y += (targetWind.y - wind.y) * dt;

  if (gameState === 'playing') {
    updateBins(dt, time / 1000);
    if (currentLeaf) {
      let old = currentLeaf.state;
      currentLeaf.update(dt);
      if (old === 'idle' && currentLeaf.state === 'falling') {
        leaves.push(currentLeaf);
        currentLeaf = null;
        handleStrike();
        if (gameState === 'playing') spawnNextLeaf();
      }
    }
  }

  for (let i = leaves.length - 1; i >= 0; i--) {
    leaves[i].update(dt);
    if (leaves[i].state === 'dead') leaves.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(dt);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  for (let w of windLines) w.update(dt);

  ctx.clearRect(0, 0, width, height);
  for (let w of windLines) w.draw(ctx);
  if (gameState === 'playing') for (let b of bins) drawBin(ctx, b);
  for (let l of leaves) l.draw(ctx);
  if (gameState === 'playing' && currentLeaf) currentLeaf.draw(ctx);
  for (let p of particles) p.draw(ctx);

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

function spawnDeco() {
  if (gameState === 'title') {
    let l = new Leaf(Math.floor(Math.random() * 3));
    l.x = Math.random() * width; l.y = -50;
    l.vx = (Math.random() - 0.5) * 200; l.vy = 100 + Math.random() * 200;
    l.angularVel = (Math.random() - 0.5) * 10; l.state = 'flying';
    leaves.push(l);
  }
  setTimeout(spawnDeco, 1000 + Math.random() * 2000);
}
setTimeout(spawnDeco, 500);

</script>
