<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harbor Threads</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e1620;--surface:rgba(14,22,32,.88);--text:#dce8f0;--muted:#7a96a8;
  --accent:#c4782a;--accent-dim:#8a5520;--line:#3d6078;--fog:rgba(180,200,215,.12);
  --btn-bg:#1e3344;--btn-border:#3d6078;--danger:#c44a3a;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e4ecf2;--surface:rgba(228,236,242,.92);--text:#1a2830;--muted:#5a7080;
    --accent:#b86a18;--accent-dim:#8a5010;--line:#8aa8bc;--fog:rgba(120,150,170,.18);
    --btn-bg:#d0dde8;--btn-border:#8aa8bc;--danger:#b83828;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100dvw;height:100dvh;overflow:hidden}
#game{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;line-height:1.4;color:var(--muted)}
.hud-block strong{display:block;font-size:20px;color:var(--text);font-weight:600;letter-spacing:-.02em}
#sun-bar{position:absolute;top:max(52px,calc(env(safe-area-inset-top) + 40px));left:16px;right:16px;height:4px;
  background:var(--line);border-radius:2px;overflow:hidden;pointer-events:none;z-index:2}
#sun-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:2px;transition:width .15s linear}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;pointer-events:none;z-index:10;transition:opacity .35s ease}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;
  max-width:340px;width:100%;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.overlay h1{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.overlay .tag{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;
  text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:14px}
.overlay p{font-size:14px;line-height:1.55;color:var(--muted);margin-bottom:20px}
.overlay .hint{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;color:var(--muted);
  margin-top:14px;opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:160px;
  padding:12px 28px;font-size:15px;font-weight:600;border-radius:12px;border:1px solid var(--btn-border);
  background:var(--btn-bg);color:var(--text);cursor:pointer;pointer-events:auto;
  transition:transform .12s ease,background .12s ease}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);border-color:var(--accent-dim);color:#fff}
@media(prefers-color-scheme:light){.btn-primary{color:#fff}}
#toast{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:12px;padding:8px 16px;border-radius:8px;
  background:var(--surface);border:1px solid var(--line);opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;z-index:5;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block"><span>PIERS</span><strong id="score-val">0</strong></div>
    <div class="hud-block" style="text-align:right"><span>WAVE</span><strong id="wave-val">1</strong></div>
  </div>
  <div id="sun-bar"><div id="sun-fill"></div></div>
  <div id="title-overlay" class="overlay">
    <div class="overlay-card">
      <div class="tag">Pre-dawn · SF Bay</div>
      <h1>Harbor Threads</h1>
      <p>Drag routes from the ship to each pier before sunrise. Your paths must never cross.</p>
      <button class="btn btn-primary" data-smoke="start" id="btn-start">Cast Off</button>
      <p class="hint">Drag to draw · release at pier</p>
    </div>
  </div>
  <div id="gameover-overlay" class="overlay hidden">
    <div class="overlay-card">
      <div class="tag" id="go-tag">Sunrise</div>
      <h1 id="go-title">Harbor Closed</h1>
      <p id="go-msg">You threaded 0 piers.</p>
      <button class="btn btn-primary" data-smoke="restart" id="btn-restart">Sail Again</button>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('game');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('score-val');
var waveEl = document.getElementById('wave-val');
var sunFill = document.getElementById('sun-fill');
var titleOverlay = document.getElementById('title-overlay');
var gameoverOverlay = document.getElementById('gameover-overlay');
var goTag = document.getElementById('go-tag');
var goTitle = document.getElementById('go-title');
var goMsg = document.getElementById('go-msg');
var toastEl = document.getElementById('toast');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 390, H = 844;
var state = 'title';
var ship = { x: 0.12, y: 0.72 };
var piers = [];
var routes = [];
var currentPath = [];
var drawing = false;
var sunrise = 0;
var score = 0;
var wave = 1;
var pierTarget = 3;
var pierConnected = 0;
var fogDensity = 0.35;
var lastTime = 0;
var animId = 0;
var toastTimer = 0;
var particles = [];
var ripples = [];
var shakeT = 0;
var audioCtx = null;
var isDark = true;
var timeSec = 0;
var showGuide = true;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }

function detectDark() {
  try {
    isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  } catch (e) { isDark = true; }
}

function resize() {
  if (!canvas) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 390;
  H = window.innerHeight || 844;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function sx(x) { return x * W; }
function sy(y) { return y * H; }

function ensureAudio() {
  if (audioCtx) return audioCtx;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch (e) {}
  return audioCtx;
}

function playTone(freq, dur, vol, type) {
  var ac = ensureAudio();
  if (!ac) return;
  try {
    if (ac.state === 'suspended') ac.resume();
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, ac.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g);
    g.connect(ac.destination);
    o.start(ac.currentTime);
    o.stop(ac.currentTime + dur + 0.05);
  } catch (e) {}
}

function vibrate(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

function showToast(msg) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 1400);
}

function randRange(a, b) { return a + Math.random() * (b - a); }

function spawnPier() {
  var attempts = 0;
  while (attempts < 40) {
    attempts++;
    var px = randRange(0.55, 0.92);
    var py = randRange(0.28, 0.82);
    var ok = true;
    if (Math.hypot(px - ship.x, py - ship.y) < 0.22) ok = false;
    for (var i = 0; i < piers.length; i++) {
      if (!piers[i].connected && Math.hypot(px - piers[i].x, py - piers[i].y) < 0.12) ok = false;
    }
    for (var j = 0; j < routes.length; j++) {
      if (Math.hypot(px - routes[j].target.x, py - routes[j].target.y) < 0.1) ok = false;
    }
    if (ok) {
      piers.push({ x: px, y: py, connected: false, pulse: Math.random() * Math.PI * 2 });
      return;
    }
  }
  piers.push({ x: 0.75, y: 0.5 + Math.random() * 0.2, connected: false, pulse: 0 });
}

function resetGame() {
  piers = [];
  routes = [];
  currentPath = [];
  drawing = false;
  sunrise = 0;
  score = 0;
  wave = 1;
  pierTarget = 3;
  pierConnected = 0;
  fogDensity = 0.35;
  particles = [];
  ripples = [];
  shakeT = 0;
  timeSec = 0;
  showGuide = true;
  spawnPier();
  updateHUD();
}

function startGame() {
  resetGame();
  state = 'playing';
  if (titleOverlay) titleOverlay.classList.add('hidden');
  if (gameoverOverlay) gameoverOverlay.classList.add('hidden');
  lastTime = performance.now();
}

function endGame(won) {
  state = 'gameover';
  if (gameoverOverlay) gameoverOverlay.classList.remove('hidden');
  if (goTag) goTag.textContent = won ? 'Gold Horizon' : 'Sunrise';
  if (goTitle) goTitle.textContent = won ? 'Harbor Cleared' : 'Fog Claims All';
  if (goMsg) {
    goMsg.textContent = won
      ? 'You threaded every pier before the bay turned gold. ' + score + ' piers, wave ' + wave + '.'
      : 'Sunrise broke through with ' + score + ' piers threaded across ' + (wave - 1) + ' waves.';
  }
  playTone(won ? 523 : 220, 0.4, 0.1, won ? 'triangle' : 'sawtooth');
}

function updateHUD() {
  if (scoreEl) scoreEl.textContent = String(score);
  if (waveEl) waveEl.textContent = String(wave);
  if (sunFill) sunFill.style.width = (sunrise * 100).toFixed(1) + '%';
}

function segIntersect(a, b, c, d) {
  var d1x = b.x - a.x, d1y = b.y - a.y;
  var d2x = d.x - c.x, d2y = d.y - c.y;
  var denom = d1x * d2y - d1y * d2x;
  if (Math.abs(denom) < 1e-10) return false;
  var t = ((c.x - a.x) * d2y - (c.y - a.y) * d2x) / denom;
  var u = ((c.x - a.x) * d1y - (c.y - a.y) * d1x) / denom;
  return t > 0.002 && t < 0.998 && u > 0.002 && u < 0.998;
}

function pathCrossesExisting(path) {
  if (path.length < 2) return false;
  for (var i = 0; i < path.length - 1; i++) {
    var a = path[i], b = path[i + 1];
    for (var r = 0; r < routes.length; r++) {
      var rp = routes[r].points;
      for (var j = 0; j < rp.length - 1; j++) {
        if (segIntersect(a, b, rp[j], rp[j + 1])) return true;
      }
    }
    for (var k = 0; k < path.length - 1; k++) {
      if (k === i) continue;
      if (segIntersect(a, b, path[k], path[k + 1])) return true;
    }
  }
  return false;
}

function simplifyPath(pts, minDist) {
  if (pts.length < 2) return pts;
  var out = [pts[0]];
  for (var i = 1; i < pts.length; i++) {
    var last = out[out.length - 1];
    if (Math.hypot(pts[i].x - last.x, pts[i].y - last.y) > minDist) out.push(pts[i]);
  }
  return out;
}

function nearestPier(x, y) {
  var best = null, bestD = 0.09;
  for (var i = 0; i < piers.length; i++) {
    if (piers[i].connected) continue;
    var d = Math.hypot(x - piers[i].x, y - piers[i].y);
    if (d < bestD) { bestD = d; best = piers[i]; }
  }
  return best;
}

function pointerNorm(e) {
  var rect = canvas.getBoundingClientRect();
  var cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  var cy = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  return { x: clamp((cx - rect.left) / rect.width, 0, 1), y: clamp((cy - rect.top) / rect.height, 0, 1) };
}

function onPointerDown(e) {
  if (state !== 'playing' || !canvas) return;
  if (e.cancelable) e.preventDefault();
  var p = pointerNorm(e);
  if (Math.hypot(p.x - ship.x, p.y - ship.y) > 0.14) return;
  drawing = true;
  currentPath = [{ x: ship.x, y: ship.y }, p];
  playTone(180, 0.08, 0.04, 'sine');
}

function onPointerMove(e) {
  if (!drawing || state !== 'playing') return;
  if (e.cancelable) e.preventDefault();
  var p = pointerNorm(e);
  var last = currentPath[currentPath.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < 0.008) return;
  currentPath.push(p);
  if (pathCrossesExisting(currentPath)) {
    drawing = false;
    currentPath = [];
    shakeT = 0.35;
    playTone(110, 0.15, 0.07, 'square');
    vibrate(40);
    showToast('Lines crossed — route snapped');
    spawnRipple(p.x, p.y, true);
  }
}

function onPointerUp(e) {
  if (!drawing || state !== 'playing') return;
  if (e.cancelable) e.preventDefault();
  drawing = false;
  var end = currentPath[currentPath.length - 1];
  if (!end) { currentPath = []; return; }
  var pier = nearestPier(end.x, end.y);
  if (!pier) {
    currentPath = [];
    showToast('Missed the pier');
    playTone(140, 0.1, 0.05, 'sine');
    return;
  }
  currentPath.push({ x: pier.x, y: pier.y });
  currentPath = simplifyPath(currentPath, 0.01);
  if (pathCrossesExisting(currentPath)) {
    currentPath = [];
    shakeT = 0.35;
    vibrate(40);
    showToast('Crossing — try another lane');
    return;
  }
  pier.connected = true;
  routes.push({ points: currentPath.slice(), target: { x: pier.x, y: pier.y }, age: 0 });
  currentPath = [];
  score++;
  pierConnected++;
  showGuide = false;
  spawnRipple(pier.x, pier.y, false);
  playTone(330 + score * 20, 0.18, 0.08, 'triangle');
  vibrate(20);
  updateHUD();

  if (pierConnected >= pierTarget) {
    wave++;
    pierConnected = 0;
    pierTarget = Math.min(3 + wave, 7);
    fogDensity = Math.min(0.75, fogDensity + 0.08);
    sunrise = Math.max(0, sunrise - 0.08);
    showToast('Wave ' + wave + ' — fog thickens');
    playTone(440, 0.25, 0.09, 'triangle');
  }
  piers = piers.filter(function(p) { return !p.connected; });
  spawnPier();
}

function spawnRipple(x, y, bad) {
  ripples.push({ x: x, y: y, r: 0, life: 1, bad: bad });
}

function spawnFogParticle() {
  particles.push({
    x: Math.random(), y: Math.random() * 0.85,
    vx: randRange(-0.0002, 0.0002), vy: randRange(-0.0001, 0.00008),
    size: randRange(20, 60), alpha: randRange(0.03, 0.12), life: randRange(3, 8)
  });
}

function update(dt) {
  if (state !== 'playing') return;
  timeSec += dt;
  var speed = 0.016 + wave * 0.005 + score * 0.0004;
  sunrise += dt * speed;
  if (sunrise >= 1) { endGame(false); return; }
  updateHUD();

  var i;
  for (i = particles.length - 1; i >= 0; i--) {
    particles[i].x += particles[i].vx * dt * 60;
    particles[i].y += particles[i].vy * dt * 60;
    particles[i].life -= dt;
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  while (particles.length < 30 + fogDensity * 40) spawnFogParticle();

  for (i = ripples.length - 1; i >= 0; i--) {
    ripples[i].r += dt * 0.25;
    ripples[i].life -= dt * 1.2;
    if (ripples[i].life <= 0) ripples.splice(i, 1);
  }

  for (i = 0; i < routes.length; i++) routes[i].age += dt;
  if (shakeT > 0) shakeT -= dt;

  for (i = 0; i < piers.length; i++) piers[i].pulse += dt * 3;
}

function drawSky() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  var t = sunrise;
  if (isDark) {
    g.addColorStop(0, lerpColor('#0a1218', '#1a2838', t * 0.5));
    g.addColorStop(0.45, lerpColor('#142030', '#3a5068', t * 0.7));
    g.addColorStop(0.72, lerpColor('#1a3040', '#6a5840', t));
    g.addColorStop(1, lerpColor('#0e1a22', '#8a6030', t));
  } else {
    g.addColorStop(0, lerpColor('#b8ccd8', '#c8d8e8', t * 0.3));
    g.addColorStop(0.5, lerpColor('#a0b8c8', '#d8b878', t * 0.8));
    g.addColorStop(1, lerpColor('#88a8b8', '#c89048', t));
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (t > 0.15) {
    var sunY = sy(0.18 + t * 0.08);
    var sunX = sx(0.78);
    var rg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 120 + t * 80);
    rg.addColorStop(0, 'rgba(255,200,100,' + (0.15 + t * 0.35) + ')');
    rg.addColorStop(0.4, 'rgba(255,160,60,' + (0.08 + t * 0.15) + ')');
    rg.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }
}

function lerpColor(hex1, hex2, t) {
  function parse(h) {
    var n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  var a = parse(hex1), b = parse(hex2);
  var r = Math.round(lerp(a[0], b[0], t));
  var g = Math.round(lerp(a[1], b[1], t));
  var bl = Math.round(lerp(a[2], b[2], t));
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

function drawWater() {
  var waterTop = sy(0.55);
  var wg = ctx.createLinearGradient(0, waterTop, 0, H);
  if (isDark) {
    wg.addColorStop(0, 'rgba(20,45,60,0.85)');
    wg.addColorStop(1, 'rgba(8,18,28,0.95)');
  } else {
    wg.addColorStop(0, 'rgba(60,100,120,0.55)');
    wg.addColorStop(1, 'rgba(40,70,90,0.75)');
  }
  ctx.fillStyle = wg;
  ctx.fillRect(0, waterTop, W, H - waterTop);

  var time = performance.now() * 0.001;
  ctx.strokeStyle = isDark ? 'rgba(60,100,120,0.15)' : 'rgba(80,120,140,0.2)';
  ctx.lineWidth = 1;
  for (var row = 0; row < 6; row++) {
    ctx.beginPath();
    var baseY = waterTop + row * 28 + 10;
    for (var x = 0; x <= W; x += 8) {
      var y = baseY + Math.sin(x * 0.012 + time * 1.2 + row) * 3;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function drawBridge() {
  var bx = sx(0.38), by = sy(0.42);
  ctx.strokeStyle = isDark ? 'rgba(30,50,65,0.7)' : 'rgba(50,70,85,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bx - 80, by + 30);
  ctx.quadraticCurveTo(bx, by - 50, bx + 120, by + 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bx - 60, by + 20);
  ctx.lineTo(bx - 60, by + 80);
  ctx.moveTo(bx + 20, by - 10);
  ctx.lineTo(bx + 20, by + 70);
  ctx.moveTo(bx + 90, by + 5);
  ctx.lineTo(bx + 90, by + 65);
  ctx.stroke();
}

function drawHills() {
  ctx.fillStyle = isDark ? 'rgba(12,22,30,0.6)' : 'rgba(70,90,100,0.35)';
  ctx.beginPath();
  ctx.moveTo(0, sy(0.52));
  ctx.lineTo(sx(0.15), sy(0.38));
  ctx.lineTo(sx(0.35), sy(0.44));
  ctx.lineTo(sx(0.55), sy(0.32));
  ctx.lineTo(sx(0.75), sy(0.40));
  ctx.lineTo(W, sy(0.48));
  ctx.lineTo(W, sy(0.55));
  ctx.closePath();
  ctx.fill();
}

function drawRoute(pts, alpha, color, width) {
  if (!pts || pts.length < 2) return;
  ctx.strokeStyle = color;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = width || 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(sx(pts[0].x), sy(pts[0].y));
  for (var i = 1; i < pts.length; i++) ctx.lineTo(sx(pts[i].x), sy(pts[i].y));
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawShip() {
  var bob = Math.sin(timeSec * 2.2) * 2;
  var x = sx(ship.x), y = sy(ship.y) + bob;
  ctx.save();
  ctx.translate(x, y);
  if (showGuide && state === 'playing' && !drawing) {
    var gr = 0.5 + 0.5 * Math.sin(timeSec * 4);
    ctx.strokeStyle = 'rgba(196,120,42,' + (0.25 + gr * 0.35) + ')';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, 28 + gr * 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.fillStyle = isDark ? '#2a4050' : '#4a6070';
  ctx.beginPath();
  ctx.moveTo(-14, 6);
  ctx.lineTo(14, 6);
  ctx.lineTo(10, 14);
  ctx.lineTo(-10, 14);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = isDark ? '#c4782a' : '#b86a18';
  ctx.fillRect(-3, -10, 6, 16);
  ctx.fillStyle = isDark ? 'rgba(196,120,42,0.3)' : 'rgba(184,106,24,0.25)';
  ctx.beginPath();
  ctx.arc(0, 0, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPier(p) {
  var x = sx(p.x), y = sy(p.y);
  var pulse = 0.5 + 0.5 * Math.sin(p.pulse);
  ctx.fillStyle = isDark ? '#3a5868' : '#6a8898';
  ctx.fillRect(x - 3, y - 8, 6, 16);
  ctx.fillStyle = isDark ? '#5a7888' : '#8aa8b8';
  ctx.fillRect(x - 12, y + 6, 24, 4);

  var gr = ctx.createRadialGradient(x, y, 0, x, y, 18 + pulse * 6);
  gr.addColorStop(0, 'rgba(196,120,42,' + (0.5 + pulse * 0.3) + ')');
  gr.addColorStop(1, 'rgba(196,120,42,0)');
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.arc(x, y, 18 + pulse * 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = isDark ? '#dce8f0' : '#1a2830';
  ctx.font = '10px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('PIER', x, y - 14);
}

function drawFog() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var a = p.alpha * fogDensity * (0.5 + sunrise * 0.5);
    ctx.fillStyle = isDark
      ? 'rgba(180,200,215,' + a + ')'
      : 'rgba(120,150,170,' + (a * 1.2) + ')';
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  var fogG = ctx.createLinearGradient(0, sy(0.3), 0, sy(0.8));
  fogG.addColorStop(0, isDark ? 'rgba(14,22,32,0)' : 'rgba(228,236,242,0)');
  fogG.addColorStop(0.5, isDark ? 'rgba(14,22,32,' + (fogDensity * 0.35) + ')' : 'rgba(200,215,225,' + (fogDensity * 0.25) + ')');
  fogG.addColorStop(1, isDark ? 'rgba(14,22,32,' + (fogDensity * 0.2) + ')' : 'rgba(180,200,210,' + (fogDensity * 0.15) + ')');
  ctx.fillStyle = fogG;
  ctx.fillRect(0, 0, W, H);
}

function drawRipples() {
  for (var i = 0; i < ripples.length; i++) {
    var r = ripples[i];
    ctx.strokeStyle = r.bad
      ? 'rgba(196,74,58,' + (r.life * 0.6) + ')'
      : 'rgba(196,120,42,' + (r.life * 0.5) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx(r.x), sy(r.y), sx(r.r * 0.08), 0, Math.PI * 2);
    ctx.stroke();
  }
}

function draw() {
  if (!ctx) return;
  ctx.save();
  if (shakeT > 0) {
    var sh = shakeT * 8;
    ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  }

  drawSky();
  drawHills();
  drawBridge();
  drawWater();

  var routeColor = isDark ? 'rgba(196,120,42,0.85)' : 'rgba(184,106,24,0.9)';
  var glowColor = isDark ? 'rgba(196,120,42,0.25)' : 'rgba(184,106,24,0.2)';

  for (var i = 0; i < routes.length; i++) {
    drawRoute(routes[i].points, 1, glowColor, 7);
    drawRoute(routes[i].points, 1, routeColor, 2.5);
  }

  if (currentPath.length > 1) {
    var cross = pathCrossesExisting(currentPath);
    var col = cross ? 'rgba(196,74,58,0.9)' : routeColor;
    drawRoute(currentPath, 1, col, 3);
    var tip = currentPath[currentPath.length - 1];
    var tgt = nearestPier(tip.x, tip.y);
    if (tgt && !cross) {
      ctx.setLineDash([5, 7]);
      ctx.strokeStyle = isDark ? 'rgba(196,120,42,0.35)' : 'rgba(184,106,24,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(sx(tip.x), sy(tip.y));
      ctx.lineTo(sx(tgt.x), sy(tgt.y));
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  if (showGuide && state === 'playing') {
    ctx.font = '11px ui-monospace, Menlo, monospace';
    ctx.fillStyle = isDark ? 'rgba(220,232,240,0.7)' : 'rgba(26,40,48,0.65)';
    ctx.textAlign = 'center';
    ctx.fillText('drag from ship', sx(ship.x), sy(ship.y) + 42);
  }

  for (var j = 0; j < piers.length; j++) {
    if (!piers[j].connected) drawPier(piers[j]);
  }

  drawShip();
  drawFog();
  drawRipples();
  ctx.restore();

  if (state === 'title') drawTitlePreview();
}

function drawTitlePreview() {
  ctx.fillStyle = isDark ? 'rgba(14,22,32,0.25)' : 'rgba(228,236,242,0.2)';
  ctx.fillRect(0, 0, W, H);
}

function loop(now) {
  var dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  animId = requestAnimationFrame(loop);
}

function bindEvents() {
  if (btnStart) btnStart.addEventListener('click', function(e) {
    e.stopPropagation();
    startGame();
  });
  if (btnRestart) btnRestart.addEventListener('click', function(e) {
    e.stopPropagation();
    startGame();
  });

  if (!canvas) return;
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('mouseleave', function() { if (drawing) { drawing = false; currentPath = []; } });

  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('touchmove', onPointerMove, { passive: false });
  canvas.addEventListener('touchend', onPointerUp, { passive: false });
  canvas.addEventListener('touchcancel', function() { drawing = false; currentPath = []; });

  window.addEventListener('resize', resize);

  try {
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) mq.addEventListener('change', function() { detectDark(); });
      else if (mq.addListener) mq.addListener(function() { detectDark(); });
    }
  } catch (e) {}

  document.addEventListener('keydown', function(e) {
    if (state === 'title' && (e.key === ' ' || e.key === 'Enter')) startGame();
    if (state === 'gameover' && (e.key === ' ' || e.key === 'Enter')) startGame();
  });
}

function init() {
  detectDark();
  resize();
  bindEvents();
  for (var i = 0; i < 20; i++) spawnFogParticle();
  lastTime = performance.now();
  draw();
  animId = requestAnimationFrame(loop);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
</body>
</html>
