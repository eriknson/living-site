<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Autumn Arcs</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #111827;
            touch-action: none; user-select: none;
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.3s;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .hidden { opacity: 0; pointer-events: none !important; }
        
        h1 { color: #f3f4f6; font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -1px; }
        p { color: #9ca3af; font-size: 1rem; margin-bottom: 2.5rem; text-align: center; max-width: 280px; line-height: 1.5; }
        
        button {
            pointer-events: auto;
            background: #f97316; color: #fff; border: none;
            padding: 1rem 2.5rem; font-size: 1.2rem; border-radius: 99px;
            font-family: inherit; font-weight: bold;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:active { transform: scale(0.95); }
        
        #hud {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 1.5rem; box-sizing: border-box;
            display: flex; justify-content: space-between;
            color: #f3f4f6; font-size: 1.2rem; font-weight: bold;
        }
        
        .life-dot {
            display: inline-block; width: 12px; height: 12px;
            background: #f97316; border-radius: 50%; margin-left: 4px;
        }
        .life-dot.lost { background: #374151; }

        @media (prefers-color-scheme: dark) {
            body, html { background: #111827; }
            .screen { background: rgba(17, 24, 39, 0.8); }
            h1 { color: #f3f4f6; }
            p { color: #9ca3af; }
            #hud { color: #f3f4f6; }
            .life-dot { background: #f97316; }
            .life-dot.lost { background: #374151; }
            button { background: #f97316; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); }
        }

        @media (prefers-color-scheme: light) {
            body { background: #ffebd2; }
            .screen { background: rgba(255, 235, 210, 0.8); }
            h1 { color: #1a252f; }
            p { color: #34495e; }
            #hud { color: #1a252f; }
            .life-dot { background: #d35400; }
            .life-dot.lost { background: #cbd5e1; }
            button { background: #d35400; box-shadow: 0 4px 15px rgba(211, 84, 0, 0.3); }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="hud" class="hidden">
            <div id="score-display">0</div>
            <div id="lives-display"></div>
        </div>
        
        <div id="title-screen" class="screen">
            <h1>Autumn Arcs</h1>
            <p>Flick leaves from the bridge.<br>Hit the pilgrims below.<br>Watch the wind.</p>
            <button data-smoke="start" id="start-btn">Play</button>
        </div>
        
        <div id="gameover-screen" class="screen hidden">
            <h1>Game Over</h1>
            <p id="final-score">Score: 0</p>
            <button data-smoke="restart" id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function getTheme(isLight) {
            return isLight ? {
                bg: '#ffebd2', ground: '#f0d6b8', lines: '#e0c09d',
                railing: '#2c3e50', railingTop: '#34495e', gargoyle: '#1a252f',
                target: '#2c3e50', targetHead: '#1a252f', leaf: '#d35400',
                shadow: 'rgba(0,0,0,0.15)', text: '#2c3e50', wind: 'rgba(0,0,0,0.05)'
            } : {
                bg: '#111827', ground: '#1f2937', lines: '#374151',
                railing: '#030712', railingTop: '#111827', gargoyle: '#000000',
                target: '#9ca3af', targetHead: '#d1d5db', leaf: '#f97316',
                shadow: 'rgba(0,0,0,0.5)', text: '#f3f4f6', wind: 'rgba(255,255,255,0.05)'
            };
        }
        
        let isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        let theme = getTheme(isLight);
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
            isLight = e.matches;
            theme = getTheme(isLight);
        });

        let state = 'title';
        let score = 0;
        let bestScore = 0;
        let lives = 3;
        let lastTime = 0;

        let leaf = null;
        let pilgrims = [];
        let gargoyles = [];
        let particles = [];
        let deadLeaves = [];

        let wind = { x: 0, y: 0 };
        let targetWind = { x: 0, y: 0 };
        let windTimer = 0;

        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };

        const GRAVITY = -0.8;
        const LEAF_START_Z = 120;
        const RAILING_Y_OFFSET = 100;

        function initGame() {
            score = 0;
            lives = 3;
            pilgrims = [];
            gargoyles = [];
            particles = [];
            deadLeaves = [];
            wind = { x: 0, y: 0 };
            targetWind = { x: 0, y: 0 };
            spawnLeaf();
            updateHUD();
            
            // Initial pilgrims
            for(let i=0; i<3; i++) {
                spawnPilgrim(Math.random() * height);
            }
        }

        function spawnLeaf() {
            leaf = {
                x: width / 2,
                y: height - RAILING_Y_OFFSET,
                z: LEAF_START_Z,
                vx: 0, vy: 0, vz: 0,
                angle: Math.random() * Math.PI * 2,
                angularVelocity: 0,
                state: 'idle'
            };
        }

        function spawnPilgrim(startY = -50) {
            pilgrims.push({
                x: 40 + Math.random() * (width - 80),
                y: startY,
                speed: 1 + Math.random() * 1.0 + (score * 0.05),
                angle: Math.PI,
                radius: 15,
                seed: Math.random() * 100
            });
        }

        function spawnGargoyle() {
            const side = Math.random() > 0.5 ? 'left' : 'right';
            gargoyles.push({
                side: side,
                x: side === 'left' ? 0 : width,
                y: 100 + Math.random() * (height - 350),
                z: 60,
                width: 45,
                height: 40,
                moveSpeed: (Math.random() - 0.5) * 1.5
            });
        }

        function handlePointerDown(e) {
            if (state !== 'playing') return;
            if (leaf && leaf.state === 'idle') {
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                if (clientY > height / 2) {
                    isDragging = true;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    dragStart = { x: clientX, y: clientY };
                    dragCurrent = { x: clientX, y: clientY };
                }
            }
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            if (e.cancelable) e.preventDefault();
            dragCurrent.x = e.touches ? e.touches[0].clientX : e.clientX;
            dragCurrent.y = e.touches ? e.touches[0].clientY : e.clientY;
        }

        function handlePointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            
            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 20) {
                const powerScale = 0.15;
                const maxPower = 28;
                let vx = dx * powerScale;
                let vy = dy * powerScale;
                const speed = Math.hypot(vx, vy);
                if (speed > maxPower) {
                    vx = (vx / speed) * maxPower;
                    vy = (vy / speed) * maxPower;
                }
                
                leaf.state = 'flying';
                leaf.vx = vx;
                leaf.vy = vy;
                leaf.vz = 16;
                leaf.angularVelocity = (Math.random() - 0.5) * 0.4;
                
                if (navigator.vibrate) navigator.vibrate(15);
            }
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
        canvas.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        function handleKeyDown(e) {
            if (state === 'title' && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault();
                document.getElementById('start-btn').click();
                return;
            }
            if (state === 'gameover' && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault();
                document.getElementById('restart-btn').click();
                return;
            }
            if (state !== 'playing' || !leaf || leaf.state !== 'idle') return;
            const keys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Enter'];
            if (!keys.includes(e.key)) return;
            e.preventDefault();
            if (e.key === ' ' || e.key === 'Enter') {
                if (isDragging) handlePointerUp({});
                return;
            }
            if (!isDragging) {
                isDragging = true;
                dragStart = { x: width / 2, y: height - 50 };
                dragCurrent = { x: width / 2, y: height - 50 };
            }
            const step = 20;
            if (e.key === 'ArrowLeft') dragCurrent.x -= step;
            if (e.key === 'ArrowRight') dragCurrent.x += step;
            if (e.key === 'ArrowUp') dragCurrent.y -= step;
            if (e.key === 'ArrowDown') dragCurrent.y += step;
        }

        function handleKeyUp(e) {
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Enter'].includes(e.key)) {
                e.preventDefault();
            }
        }

        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);

        function update(dt) {
            if (state !== 'playing') return;
            
            windTimer -= dt;
            if (windTimer <= 0) {
                windTimer = 2000 + Math.random() * 3000;
                if (score > 3) {
                    targetWind.x = (Math.random() - 0.5) * 3 * Math.min(1 + score * 0.1, 2.5);
                    targetWind.y = (Math.random() - 0.5) * 1.5;
                }
            }
            wind.x += (targetWind.x - wind.x) * 0.02;
            wind.y += (targetWind.y - wind.y) * 0.02;
            
            if (Math.random() < 0.02 + (score * 0.001) && pilgrims.length < 4 + Math.floor(score/6)) {
                spawnPilgrim();
            }
            for (let i = pilgrims.length - 1; i >= 0; i--) {
                let p = pilgrims[i];
                p.y += p.speed;
                if (p.y > height + 50) {
                    pilgrims.splice(i, 1);
                }
            }
            
            const targetGargoyles = Math.min(Math.floor(score / 8), 4);
            if (gargoyles.length < targetGargoyles && Math.random() < 0.05) {
                spawnGargoyle();
            }
            gargoyles.forEach(g => {
                g.y += g.moveSpeed;
                if (g.y < 100 || g.y > height - 250) g.moveSpeed *= -1;
            });
            
            if (leaf && leaf.state === 'flying') {
                leaf.vz += GRAVITY;
                leaf.vx += wind.x * 0.08;
                leaf.vy += wind.y * 0.08;
                
                leaf.x += leaf.vx;
                leaf.y += leaf.vy;
                leaf.z += leaf.vz;
                leaf.angle += leaf.angularVelocity;
                
                gargoyles.forEach(g => {
                    if (leaf.z < g.z + 20 && leaf.z > g.z - 20) {
                        const gLeft = g.side === 'left' ? 0 : width - g.width;
                        const gRight = g.side === 'left' ? g.width : width;
                        if (leaf.x > gLeft && leaf.x < gRight && leaf.y > g.y - 15 && leaf.y < g.y + g.height + 15) {
                            leaf.vx *= -0.4;
                            leaf.vy *= -0.4;
                            leaf.x += leaf.vx;
                            leaf.y += leaf.vy;
                            if (navigator.vibrate) navigator.vibrate(20);
                        }
                    }
                });
                
                if (leaf.z <= 0) {
                    leaf.z = 0;
                    checkLanding();
                }
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function checkLanding() {
            let hit = false;
            for (let i = pilgrims.length - 1; i >= 0; i--) {
                let p = pilgrims[i];
                let dist = Math.hypot(leaf.x - p.x, leaf.y - p.y);
                if (dist < p.radius + 15) {
                    hit = true;
                    score++;
                    updateHUD();
                    createParticles(p.x, p.y, theme.targetHead);
                    pilgrims.splice(i, 1);
                    if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                    break;
                }
            }
            
            if (!hit) {
                lives--;
                updateHUD();
                if (navigator.vibrate) navigator.vibrate(100);
                
                deadLeaves.push({
                    x: leaf.x, y: leaf.y, angle: leaf.angle
                });
                if (deadLeaves.length > 12) deadLeaves.shift();
                
                if (lives <= 0) {
                    gameOver();
                    return;
                }
            }
            
            spawnLeaf();
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 400 + Math.random() * 400,
                    maxLife: 800,
                    color: color
                });
            }
        }

        function draw() {
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = theme.lines;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < width; i += 120) {
                ctx.moveTo(i, 0); ctx.lineTo(i, height);
            }
            for (let i = 0; i < height; i += 120) {
                ctx.moveTo(0, i); ctx.lineTo(width, i);
            }
            ctx.stroke();
            
            if (Math.abs(wind.x) > 0.2 || Math.abs(wind.y) > 0.2) {
                ctx.strokeStyle = theme.wind;
                ctx.lineWidth = 2;
                ctx.beginPath();
                const t = Date.now() / 1000;
                for(let i=0; i<15; i++) {
                    let startX = ((i * 137 + t * wind.x * 100) % width + width) % width;
                    let startY = ((i * 93 + t * 50) % height + height) % height;
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(startX + wind.x * 25, startY + wind.y * 25 + 10);
                }
                ctx.stroke();
            }

            ctx.fillStyle = theme.shadow;
            
            deadLeaves.forEach(dl => {
                drawLeafShape(dl.x + 5, dl.y + 5, dl.angle, 1, theme.shadow);
            });
            
            pilgrims.forEach(p => {
                ctx.beginPath();
                ctx.ellipse(p.x + 5, p.y + 5, p.radius, p.radius * 0.6, 0, 0, Math.PI*2);
                ctx.fill();
            });
            
            gargoyles.forEach(g => {
                ctx.save();
                ctx.translate(g.side === 'left' ? 0 : width, g.y + 10);
                if (g.side === 'right') ctx.scale(-1, 1);
                ctx.fillRect(0, -15, 45, 30);
                ctx.restore();
            });
            
            if (leaf) {
                drawLeafShape(leaf.x + (leaf.z * 0.1), leaf.y + (leaf.z * 0.1), leaf.angle, 1, theme.shadow);
            }
            
            let renderList = [];
            deadLeaves.forEach(dl => renderList.push({ type: 'deadLeaf', y: dl.y, obj: dl }));
            pilgrims.forEach(p => renderList.push({ type: 'pilgrim', y: p.y, obj: p }));
            gargoyles.forEach(g => renderList.push({ type: 'gargoyle', y: g.y, obj: g }));
            renderList.push({ type: 'railing', y: height - RAILING_Y_OFFSET });
            if (leaf) renderList.push({ type: 'leaf', y: leaf.y, obj: leaf });
            
            renderList.sort((a, b) => a.y - b.y);
            
            const t = Date.now();
            renderList.forEach(item => {
                if (item.type === 'deadLeaf') {
                    drawLeafShape(item.obj.x, item.obj.y, item.obj.angle, 1, theme.leaf);
                }
                else if (item.type === 'pilgrim') {
                    const bob = Math.sin(t / 150 + item.obj.seed) * 2;
                    drawPilgrim(item.obj.x, item.obj.y + bob, item.obj.angle, 1, theme.target, theme.targetHead);
                }
                else if (item.type === 'gargoyle') {
                    drawGargoyle(item.obj.x, item.obj.y - item.obj.z, item.obj.side, 1, theme.gargoyle);
                }
                else if (item.type === 'railing') {
                    drawRailing(width, height, theme);
                }
                else if (item.type === 'leaf') {
                    drawLeafShape(item.obj.x, item.obj.y - item.obj.z, item.obj.angle, 1, theme.leaf);
                }
            });
            
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
            
            if (isDragging && leaf && leaf.state === 'idle') {
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                const powerScale = 0.15;
                const maxPower = 28;
                let vx = dx * powerScale;
                let vy = dy * powerScale;
                const speed = Math.hypot(vx, vy);
                if (speed > maxPower) {
                    vx = (vx / speed) * maxPower;
                    vy = (vy / speed) * maxPower;
                }
                
                ctx.beginPath();
                ctx.strokeStyle = isLight ? 'rgba(0, 0, 0, 0.2)' : 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                
                let tx = leaf.x;
                let ty = leaf.y;
                let tz = leaf.z;
                let tvx = vx;
                let tvy = vy;
                let tvz = 16;
                
                ctx.moveTo(tx, ty - tz);
                
                for (let i = 0; i < 35; i++) {
                    tvz += GRAVITY;
                    tx += tvx;
                    ty += tvy;
                    tz += tvz;
                    if (tz <= 0) {
                        tz = 0;
                        ctx.lineTo(tx, ty - tz);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.setLineDash([]);
                        ctx.arc(tx, ty, 4, 0, Math.PI*2);
                        ctx.stroke();
                        break;
                    }
                    if (i % 2 === 0) ctx.lineTo(tx, ty - tz);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function drawLeafShape(x, y, angle, scale, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.scale(scale, scale);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -12);
            ctx.quadraticCurveTo(12, -6, 12, 6);
            ctx.lineTo(0, 18);
            ctx.lineTo(-12, 6);
            ctx.quadraticCurveTo(-12, -6, 0, -12);
            ctx.fill();
            ctx.restore();
        }

        function drawPilgrim(x, y, angle, scale, color, headColor) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.scale(scale, scale);
            
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -8);
            ctx.lineTo(14, 16);
            ctx.lineTo(-14, 16);
            ctx.fill();
            
            ctx.fillStyle = headColor;
            ctx.beginPath();
            ctx.arc(0, -4, 7, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        function drawGargoyle(x, y, side, scale, color) {
            ctx.save();
            ctx.translate(x, y);
            if (side === 'right') ctx.scale(-1, 1);
            
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.fillRect(0, -15, 12, 30);
            
            ctx.moveTo(12, -10);
            ctx.lineTo(45, -5);
            ctx.lineTo(50, 5);
            ctx.lineTo(40, 15);
            ctx.lineTo(12, 10);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(40, -5);
            ctx.lineTo(50, -15);
            ctx.lineTo(47, 0);
            ctx.fill();
            
            ctx.restore();
        }

        function drawRailing(w, h, theme) {
            const y = h - RAILING_Y_OFFSET;
            const z = LEAF_START_Z;
            const drawY = y - z;
            
            ctx.fillStyle = theme.railing;
            ctx.fillRect(0, drawY, w, h - drawY);
            
            ctx.fillStyle = theme.railingTop;
            ctx.fillRect(0, drawY, w, 25);
            
            ctx.strokeStyle = theme.bg;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, drawY + 25);
            ctx.lineTo(w, drawY + 25);
            ctx.stroke();
        }

        const titleScreen = document.getElementById('title-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');
        const finalScore = document.getElementById('final-score');

        document.getElementById('start-btn').addEventListener('click', () => {
            titleScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            state = 'playing';
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            gameoverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            state = 'playing';
            initGame();
        });

        function updateHUD() {
            scoreDisplay.textContent = score;
            let livesHtml = '';
            for(let i=0; i<3; i++) {
                livesHtml += `<span class="life-dot ${i >= lives ? 'lost' : ''}"></span>`;
            }
            livesDisplay.innerHTML = livesHtml;
        }

        function gameOver() {
            state = 'gameover';
            hud.classList.add('hidden');
            gameoverScreen.classList.remove('hidden');
            if (score > bestScore) bestScore = score;
            finalScore.innerHTML = `Score: ${score}<br><span style="font-size:0.8em; opacity:0.7">Best: ${bestScore}</span>`;
        }

        function loop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            if (dt < 100) update(dt);
            draw();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
