<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deploy Trace</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141816;--surface:rgba(20,24,22,.92);--text:#c8e6cc;--muted:#6b8f72;
  --term:#3dff7a;--term-dim:#1a9e4a;--line:#2a4030;--fog:rgba(180,195,185,.08);
  --btn-bg:#1c2820;--btn-border:#3a5840;--danger:#e05540;--warn:#d4a030;
  --sun: rgba(255,190,100,.0);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8ece9;--surface:rgba(232,236,233,.94);--text:#1a2820;--muted:#5a7060;
    --term:#15803d;--term-dim:#0d5c2c;--line:#a8c4b0;--fog:rgba(100,130,110,.12);
    --btn-bg:#d4e0d8;--btn-border:#8aaa90;--danger:#c04030;--warn:#b08018;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100dvw;height:100dvh;overflow:hidden}
#game{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 6px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;line-height:1.35;color:var(--muted)}
.hud-block strong{display:block;font-size:18px;color:var(--text);font-weight:600;letter-spacing:-.02em}
#sun-bar{position:absolute;top:max(48px,calc(env(safe-area-inset-top)+36px));left:14px;right:14px;height:3px;
  background:var(--line);border-radius:2px;overflow:hidden;pointer-events:none;z-index:2}
#sun-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--warn),#ffb860);border-radius:2px}
#sunrise-wash{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,rgba(255,200,120,0) 0%,rgba(255,180,90,0) 100%);opacity:0;transition:opacity .3s}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;text-align:center;pointer-events:none;z-index:10;transition:opacity .35s ease,visibility .35s}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;
  max-width:320px;width:100%;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.overlay h1{font-size:20px;font-weight:600;letter-spacing:-.03em;margin-bottom:4px}
.overlay .tag{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:9px;
  text-transform:uppercase;letter-spacing:.14em;color:var(--term);margin-bottom:12px}
.overlay p{font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:18px}
.overlay .hint{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;color:var(--muted);
  margin-top:12px;opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:150px;
  padding:12px 24px;font-size:14px;font-weight:600;border-radius:10px;border:1px solid var(--btn-border);
  background:var(--btn-bg);color:var(--text);cursor:pointer;pointer-events:auto;
  transition:transform .1s ease,background .1s ease;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--term-dim);border-color:var(--term);color:#fff}
@media(prefers-color-scheme:light){.btn-primary{color:#fff}}
#combo{position:absolute;top:max(58px,calc(env(safe-area-inset-top)+46px));left:50%;transform:translateX(-50%);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;color:var(--term);
  pointer-events:none;z-index:3;opacity:0;transition:opacity .2s}
#combo.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="sunrise-wash"></div>
  <div id="hud">
    <div class="hud-block"><span>SHIPPED</span><strong id="score-val">0</strong></div>
    <div class="hud-block" style="text-align:center"><span>TIME</span><strong id="time-val">45</strong></div>
    <div class="hud-block" style="text-align:right"><span>MISS</span><strong id="miss-val">0</strong></div>
  </div>
  <div id="sun-bar"><div id="sun-fill"></div></div>
  <div id="combo"></div>
  <div id="title-overlay" class="overlay">
    <div class="overlay-card">
      <div class="tag">Pre-dawn deploy · SF</div>
      <h1>Deploy Trace</h1>
      <p>Drag routes from phone shortcuts into matching cloud folders. Wind shears erase old paths — keep tracing before sunrise.</p>
      <button class="btn btn-primary" data-smoke="start" id="btn-start">Init Deploy</button>
      <p class="hint">Drag shortcut → folder · keys 1–3 quick-route</p>
    </div>
  </div>
  <div id="gameover-overlay" class="overlay hidden">
    <div class="overlay-card">
      <div class="tag" id="go-tag">Sunrise</div>
      <h1 id="go-title">Deploy Complete</h1>
      <p id="go-msg">You shipped 0 agents.</p>
      <button class="btn btn-primary" data-smoke="restart" id="btn-restart">Deploy Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('game');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('score-val');
var timeEl = document.getElementById('time-val');
var missEl = document.getElementById('miss-val');
var sunFill = document.getElementById('sun-fill');
var sunriseWash = document.getElementById('sunrise-wash');
var titleOverlay = document.getElementById('title-overlay');
var gameoverOverlay = document.getElementById('gameover-overlay');
var goTag = document.getElementById('go-tag');
var goTitle = document.getElementById('go-title');
var goMsg = document.getElementById('go-msg');
var comboEl = document.getElementById('combo');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 390, H = 844, dpr = 1;
var state = 'title';
var ROUND_SEC = 45;
var MAX_MISS = 5;

var COLORS = [
  { id:0, hex:'#3dff7a', label:'agents', dark:'#1a9e4a' },
  { id:1, hex:'#40c8e0', label:'deploy', dark:'#208898' },
  { id:2, hex:'#e8b040', label:'logs', dark:'#a07018' },
  { id:3, hex:'#f07050', label:'cache', dark:'#a04030' }
];

var nodes = [];
var treeLines = [];
var routes = [];
var packets = [];
var particles = [];
var fogPuffs = [];
var windShears = [];
var currentStroke = null;
var pointer = { x:0, y:0, down:false };
var timeLeft = ROUND_SEC;
var score = 0;
var misses = 0;
var combo = 0;
var comboTimer = 0;
var sunrise = 0;
var spawnTimer = 0;
var spawnInterval = 2.8;
var shearTimer = 0;
var shearInterval = 9;
var shearAge = 6;
var folderWave = 0;
var lastTime = 0;
var animId = 0;
var audioCtx = null;
var isDark = true;
var shakeT = 0;
var blinkPhase = 0;
var nextPacketColor = 0;

function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function dist(x1,y1,x2,y2){var dx=x2-x1,dy=y2-y1;return Math.sqrt(dx*dx+dy*dy)}

function detectDark(){
  try{isDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches}
  catch(e){isDark=true}
}

function resize(){
  if(!canvas)return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||390;
  H=window.innerHeight||844;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  if(ctx)ctx.setTransform(dpr,0,0,dpr,0,0);
  layoutNodes();
}

function layoutNodes(){
  nodes=[];
  treeLines=[];
  var pad=16;
  var treeLeft=W*0.38;
  var treeTop=H*0.14;
  var root={id:'root',type:'folder',x:treeLeft,y:treeTop,r:14,depth:0,label:'cloud/',colorId:-1,parent:null};
  nodes.push(root);

  var idMap={root:root};
  function addFolder(key,label,colorId,parentKey,dy,depth,sub){
    var parent=idMap[parentKey]||root;
    var nx=parent.x+(sub?48:28);
    var ny=parent.y+dy*H;
    var n={id:key,type:'folder',x:nx,y:ny,r:sub?11:13,depth:depth,label:label,colorId:colorId,parent:parentKey};
    nodes.push(n);
    idMap[key]=n;
    treeLines.push({x1:parent.x+(sub?12:8),y1:parent.y,x2:nx-10,y2:ny});
    return n;
  }

  addFolder('agents','agents/',0,'root',0.09,1,false);
  addFolder('deploy','deploy/',1,'root',0.17,1,false);
  addFolder('logs','logs/',2,'root',0.25,1,false);
  if(folderWave>=1)addFolder('cache','cache/',3,'root',0.33,1,false);
  if(folderWave>=2){
    addFolder('build','build/',1,'agents',0.05,2,true);
    addFolder('queue','queue/',0,'deploy',0.05,2,true);
  }

  var shortcuts=Math.min(2+Math.floor(folderWave/2),3);
  for(var s=0;s<shortcuts;s++){
    nodes.unshift({
      id:'s'+s,type:'shortcut',x:pad+28,y:H*(0.22+s*0.14),r:22,
      colorId:s%COLORS.length,label:'⌘',blink:0
    });
  }
}

function hitNode(x,y){
  var best=null,bd=999;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    var d=dist(x,y,n.x,n.y);
    if(d<n.r+14&&d<bd){bd=d;best=n}
  }
  return best;
}

function getFolderNodes(){
  return nodes.filter(function(n){return n.type==='folder'&&n.colorId>=0});
}

function getShortcuts(){
  return nodes.filter(function(n){return n.type==='shortcut'});
}

function findRoute(fromId,toId){
  for(var i=routes.length-1;i>=0;i--){
    var r=routes[i];
    if(r.fromId===fromId&&r.toId===toId)return r;
  }
  return null;
}

function findRouteForColor(colorId){
  for(var i=routes.length-1;i>=0;i--){
    var r=routes[i];
    var from=nodes.find(function(n){return n.id===r.fromId});
    var to=nodes.find(function(n){return n.id===r.toId});
    if(from&&to&&from.colorId===colorId&&to.colorId===colorId)return r;
  }
  return null;
}

function addRoute(fromNode,toNode,points){
  routes.push({
    fromId:fromNode.id,toId:toNode.id,
    colorId:fromNode.colorId,
    points:points.slice(),
    createdAt:performance.now(),
    alpha:1
  });
  playTone(440,0.06,0.08);
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
}

function ensureAudio(){
  if(audioCtx)return audioCtx;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(AC)audioCtx=new AC();
  }catch(e){}
  return audioCtx;
}

function playTone(freq,dur,vol){
  var ac=ensureAudio();
  if(!ac)return;
  try{
    if(ac.state==='suspended')ac.resume();
    var o=ac.createOscillator();
    var g=ac.createGain();
    o.type='square';
    o.frequency.value=freq;
    g.gain.value=vol||0.06;
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}

function spawnPacket(){
  var shortcuts=getShortcuts();
  if(!shortcuts.length)return;
  var sc=shortcuts[nextPacketColor%shortcuts.length];
  nextPacketColor++;
  var colorId=sc.colorId;
  var route=findRouteForColor(colorId);
  var targetFolders=getFolderNodes().filter(function(f){return f.colorId===colorId});
  if(!targetFolders.length)return;
  var target=targetFolders[0];

  packets.push({
    shortcutId:sc.id,
    colorId:colorId,
    x:sc.x,y:sc.y,
    progress:0,
    speed:0.35+sunrise*0.25,
    route:route,
    targetId:target.id,
    state:'waiting',
    waitT:route?0:3.5,
    trail:[]
  });
}

function spawnParticles(x,y,color,count){
  for(var i=0;i<(count||8);i++){
    var a=Math.random()*Math.PI*2;
    var sp=1+Math.random()*3;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5+Math.random()*0.4,r:2+Math.random()*2,color:color});
  }
}

function spawnFog(){
  if(fogPuffs.length>40)return;
  fogPuffs.push({
    x:Math.random()*W,y:Math.random()*H,
    r:30+Math.random()*60,vx:(Math.random()-0.5)*0.3,vy:-0.1-Math.random()*0.2,
    a:0.04+Math.random()*0.06
  });
}

function triggerWindShear(){
  var now=performance.now();
  var removed=0;
  routes=routes.filter(function(r){
    if(now-r.createdAt>shearAge*1000){removed++;return false}
    return true;
  });
  windShears.push({t:0,dur:0.6});
  shearAge=Math.max(3.5,shearAge-0.4);
  playTone(120,0.15,0.05);
  if(navigator.vibrate)try{navigator.vibrate([8,30,8])}catch(e){}
  if(removed>0&&state==='playing'){
    packets.forEach(function(p){
      if(p.state==='moving'||p.state==='waiting'){
        p.route=findRouteForColor(p.colorId);
        if(!p.route&&p.state==='moving'){p.state='waiting';p.waitT=2;p.progress=0}
      }
    });
  }
}

function deliverPacket(p,success){
  if(success){
    score+=10+combo*2;
    combo++;
    comboTimer=2;
    comboEl.textContent='×'+combo+' streak';
    comboEl.classList.add('show');
    spawnParticles(p.x,p.y,COLORS[p.colorId].hex,12);
    playTone(660+combo*20,0.08,0.07);
    if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}
  }else{
    misses++;
    combo=0;
    comboEl.classList.remove('show');
    shakeT=0.25;
    playTone(180,0.12,0.08);
    if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}
    if(misses>=MAX_MISS)endGame(false);
  }
  if(scoreEl)scoreEl.textContent=String(score);
  if(missEl)missEl.textContent=String(misses);
}

function endGame(survived){
  state='gameover';
  if(gameoverOverlay)gameoverOverlay.classList.remove('hidden');
  if(titleOverlay)titleOverlay.classList.add('hidden');
  if(survived){
    if(goTag)goTag.textContent='Shipped by sunrise';
    if(goTitle)goTitle.textContent='Deploy Shipped';
    playTone(880,0.2,0.08);
  }else{
    if(goTag)goTag.textContent='Route failure';
    if(goTitle)goTitle.textContent='Deploy Halted';
  }
  if(goMsg)goMsg.textContent='You shipped '+score+' agents'+(combo>0?' · best streak ×'+combo:'')+'.';
}

function resetGame(){
  state='playing';
  score=0;misses=0;combo=0;comboTimer=0;
  timeLeft=ROUND_SEC;sunrise=0;
  spawnTimer=0;spawnInterval=2.8;
  shearTimer=0;shearInterval=9;shearAge=6;
  folderWave=0;nextPacketColor=0;
  routes=[];packets=[];particles=[];windShears=[];
  currentStroke=null;
  if(scoreEl)scoreEl.textContent='0';
  if(missEl)missEl.textContent='0';
  if(timeEl)timeEl.textContent=String(ROUND_SEC);
  if(sunFill)sunFill.style.width='0%';
  if(sunriseWash)sunriseWash.style.opacity='0';
  if(comboEl)comboEl.classList.remove('show');
  if(gameoverOverlay)gameoverOverlay.classList.add('hidden');
  if(titleOverlay)titleOverlay.classList.add('hidden');
  layoutNodes();
  lastTime=performance.now();
}

function getPointer(e){
  var rect=canvas.getBoundingClientRect();
  var cx, cy;
  if(e.touches&&e.touches.length){
    cx=e.touches[0].clientX;cy=e.touches[0].clientY;
  }else{
    cx=e.clientX;cy=e.clientY;
  }
  return{x:cx-rect.left,y:cy-rect.top};
}

function onPointerDown(e){
  if(state!=='playing'||!ctx)return;
  if(e.cancelable)e.preventDefault();
  ensureAudio();
  var p=getPointer(e);
  pointer.x=p.x;pointer.y=p.y;pointer.down=true;
  var node=hitNode(p.x,p.y);
  if(node&&(node.type==='shortcut'||(node.type==='folder'&&node.colorId>=0))){
    currentStroke={
      startNode:node,
      points:[{x:p.x,y:p.y}],
      colorId:node.type==='shortcut'?node.colorId:node.colorId
    };
  }else{
    currentStroke={startNode:null,points:[{x:p.x,y:p.y}],colorId:-1};
  }
}

function onPointerMove(e){
  if(!pointer.down||state!=='playing')return;
  if(e.cancelable)e.preventDefault();
  var p=getPointer(e);
  pointer.x=p.x;pointer.y=p.y;
  if(currentStroke){
    var pts=currentStroke.points;
    var last=pts[pts.length-1];
    if(dist(last.x,last.y,p.x,p.y)>4){
      pts.push({x:p.x,y:p.y});
    }
  }
}

function onPointerUp(e){
  if(!pointer.down)return;
  if(e.cancelable)e.preventDefault();
  pointer.down=false;
  if(state!=='playing'||!currentStroke)return;

  var endNode=hitNode(pointer.x,pointer.y);
  var start=currentStroke.startNode;

  if(start&&start.type==='shortcut'&&endNode&&endNode.type==='folder'&&endNode.colorId>=0){
    if(start.colorId===endNode.colorId){
      addRoute(start,endNode,currentStroke.points);
    }else{
      shakeT=0.15;
      playTone(200,0.08,0.06);
    }
  }
  currentStroke=null;
}

function sampleRoute(route,t){
  var pts=route.points;
  if(!pts||pts.length<2){
    var from=nodes.find(function(n){return n.id===route.fromId});
    var to=nodes.find(function(n){return n.id===route.toId});
    if(from&&to)return{x:lerp(from.x,to.x,t),y:lerp(from.y,to.y,t)};
    return{x:0,y:0};
  }
  var total=0,segs=[];
  for(var i=1;i<pts.length;i++){
    var d=dist(pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y);
    segs.push(d);total+=d;
  }
  if(total<1){
    var f=nodes.find(function(n){return n.id===route.fromId});
    var t2=nodes.find(function(n){return n.id===route.toId});
    if(f&&t2)return{x:lerp(f.x,t2.x,t),y:lerp(f.y,t2.y,t)};
    return pts[0]||{x:0,y:0};
  }
  var target=t*total,acc=0;
  for(var j=0;j<segs.length;j++){
    if(acc+segs[j]>=target){
      var lt=(target-acc)/segs[j];
      return{x:lerp(pts[j].x,pts[j+1].x,lt),y:lerp(pts[j].y,pts[j+1].y,lt)};
    }
    acc+=segs[j];
  }
  return pts[pts.length-1];
}

function updatePackets(dt){
  for(var i=packets.length-1;i>=0;i--){
    var p=packets[i];
    if(p.state==='waiting'){
      p.waitT-=dt;
      if(!p.route)p.route=findRouteForColor(p.colorId);
      if(p.route){p.state='moving';p.progress=0}
      else if(p.waitT<=0){
        deliverPacket(p,false);
        packets.splice(i,1);
      }
      continue;
    }
    if(p.state==='moving'&&p.route){
      p.progress+=p.speed*dt;
      var pos=sampleRoute(p.route,clamp(p.progress,0,1));
      p.trail.push({x:pos.x,y:pos.y});
      if(p.trail.length>20)p.trail.shift();
      p.x=pos.x;p.y=pos.y;
      if(p.progress>=1){
        var target=nodes.find(function(n){return n.id===p.targetId});
        if(target&&target.colorId===p.colorId){
          deliverPacket(p,true);
        }else{
          deliverPacket(p,false);
        }
        packets.splice(i,1);
      }
    }
  }
}

function update(dt){
  if(state!=='playing')return;

  timeLeft-=dt;
  sunrise=1-timeLeft/ROUND_SEC;
  if(timeEl)timeEl.textContent=String(Math.max(0,Math.ceil(timeLeft)));
  if(sunFill)sunFill.style.width=(sunrise*100)+'%';
  if(sunriseWash)sunriseWash.style.opacity=String(sunrise*0.55);

  blinkPhase+=dt*(1+sunrise*3);
  nodes.forEach(function(n){
    if(n.type==='shortcut')n.blink=0.5+0.5*Math.sin(blinkPhase*4+n.colorId);
  });

  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){
    spawnTimer=0;
    spawnPacket();
    spawnInterval=Math.max(1.2,spawnInterval-0.08);
  }

  shearTimer+=dt;
  if(shearTimer>=shearInterval){
    shearTimer=0;
    triggerWindShear();
    shearInterval=Math.max(5,shearInterval-0.5);
  }

  if(timeLeft<=30&&folderWave<1){folderWave=1;layoutNodes()}
  if(timeLeft<=15&&folderWave<2){folderWave=2;layoutNodes()}

  if(timeLeft<=0){endGame(true);return}

  updatePackets(dt);

  comboTimer-=dt;
  if(comboTimer<=0&&comboEl)comboEl.classList.remove('show');

  if(shakeT>0)shakeT-=dt;

  windShears.forEach(function(w){w.t+=dt});
  windShears=windShears.filter(function(w){return w.t<w.dur});

  particles.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=dt;
  });
  particles=particles.filter(function(p){return p.life>0});

  if(Math.random()<0.04)spawnFog();
  fogPuffs.forEach(function(f){
    f.x+=f.vx;f.y+=f.vy;
    if(f.x<-60)f.x=W+60;
    if(f.y<-60)f.y=H+60;
  });
}

function drawPhoneIcon(x,y,r,color){
  if(!ctx)return;
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle=isDark?'#1a201c':'#dce8e0';
  ctx.strokeStyle=color;
  ctx.lineWidth=1.5;
  var w=r*0.7,h=r*1.1;
  roundRect(-w/2,-h/2,w,h,4);
  ctx.fill();ctx.stroke();
  ctx.fillStyle=color;
  ctx.globalAlpha=0.5;
  ctx.fillRect(-w/2+4,-h/2+6,w-8,h-14);
  ctx.globalAlpha=1;
  ctx.beginPath();
  ctx.arc(0,h/2-5,2,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();
  ctx.restore();
}

function roundRect(x,y,w,h,rad){
  if(!ctx)return;
  ctx.beginPath();
  ctx.moveTo(x+rad,y);
  ctx.lineTo(x+w-rad,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+rad);
  ctx.lineTo(x+w,y+h-rad);
  ctx.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);
  ctx.lineTo(x+rad,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-rad);
  ctx.lineTo(x,y+rad);
  ctx.quadraticCurveTo(x,y,x+rad,y);
  ctx.closePath();
}

function drawFolder(x,y,r,label,colorId,depth){
  if(!ctx)return;
  var col=colorId>=0?COLORS[colorId].hex:(isDark?'#6b8f72':'#5a7060');
  ctx.save();
  ctx.translate(x,y);
  ctx.strokeStyle=col;
  ctx.lineWidth=depth>1?1:1.2;
  ctx.globalAlpha=0.9;
  ctx.beginPath();
  ctx.moveTo(-r,-r*0.4);
  ctx.lineTo(-r*0.3,-r*0.4);
  ctx.lineTo(-r*0.1,-r*0.65);
  ctx.lineTo(r,-r*0.65);
  ctx.lineTo(r,r*0.65);
  ctx.lineTo(-r,r*0.65);
  ctx.closePath();
  ctx.stroke();
  if(colorId>=0){
    ctx.fillStyle=col;
    ctx.globalAlpha=0.15;
    ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.font='10px ui-monospace,Menlo,monospace';
  ctx.fillStyle=isDark?'#8aa890':'#3a5040';
  ctx.textAlign='left';
  ctx.fillText(label,r+4,3);
  ctx.restore();
}

function draw(){
  if(!ctx){
    if(canvas){canvas.style.background='var(--bg)'}
    return;
  }

  detectDark();
  var ox=shakeT>0?(Math.random()-0.5)*shakeT*8:0;
  var oy=shakeT>0?(Math.random()-0.5)*shakeT*8:0;
  ctx.save();
  ctx.translate(ox,oy);

  ctx.fillStyle=isDark?'#141816':'#e8ece9';
  ctx.fillRect(0,0,W,H);

  fogPuffs.forEach(function(f){
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle=isDark?'rgba(180,195,185,'+(f.a)+')':'rgba(100,130,110,'+(f.a*1.5)+')';
    ctx.fill();
  });

  ctx.strokeStyle=isDark?'#2a4030':'#a8c4b0';
  ctx.lineWidth=1;
  ctx.setLineDash([]);
  treeLines.forEach(function(l){
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1);
    ctx.lineTo(l.x2,l.y2);
    ctx.stroke();
  });

  var shearActive=windShears.length>0;
  routes.forEach(function(r){
    var col=COLORS[r.colorId]||COLORS[0];
    var age=(performance.now()-r.createdAt)/1000;
    var fade=clamp(1-age/shearAge,0.25,1);
    ctx.strokeStyle=col.hex;
    ctx.globalAlpha=fade*(shearActive?0.5+0.5*Math.sin(windShears[0].t*20):1);
    ctx.lineWidth=2.5;
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    var pts=r.points;
    if(pts.length>=2){
      ctx.moveTo(pts[0].x,pts[0].y);
      for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
    }else{
      var from=nodes.find(function(n){return n.id===r.fromId});
      var to=nodes.find(function(n){return n.id===r.toId});
      if(from&&to){ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y)}
    }
    ctx.stroke();
    ctx.globalAlpha=1;
  });

  if(currentStroke&&currentStroke.points.length>=2){
    var cid=currentStroke.colorId>=0?currentStroke.colorId:0;
    ctx.strokeStyle=COLORS[cid].hex;
    ctx.globalAlpha=0.7;
    ctx.lineWidth=2.5;
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(currentStroke.points[0].x,currentStroke.points[0].y);
    for(var j=1;j<currentStroke.points.length;j++){
      ctx.lineTo(currentStroke.points[j].x,currentStroke.points[j].y);
    }
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  nodes.forEach(function(n){
    if(n.type==='shortcut'){
      var col=COLORS[n.colorId];
      var pulse=0.6+0.4*(n.blink||0);
      drawPhoneIcon(n.x,n.y,n.r,col.hex);
      ctx.beginPath();
      ctx.arc(n.x,n.y,n.r+4,0,Math.PI*2);
      ctx.strokeStyle=col.hex;
      ctx.globalAlpha=pulse*0.5;
      ctx.lineWidth=1.5;
      ctx.stroke();
      ctx.globalAlpha=1;
      ctx.font='9px ui-monospace,Menlo,monospace';
      ctx.fillStyle=col.hex;
      ctx.textAlign='center';
      ctx.fillText(col.label,n.x,n.y+n.r+14);
    }else if(n.type==='folder'){
      if(n.id==='root'){
        ctx.font='11px ui-monospace,Menlo,monospace';
        ctx.fillStyle=isDark?'#6b8f72':'#4a6050';
        ctx.textAlign='left';
        ctx.fillText(n.label,n.x-4,n.y+4);
      }else{
        drawFolder(n.x,n.y,n.r,n.label,n.colorId,n.depth);
        if(n.colorId>=0){
          ctx.beginPath();
          ctx.arc(n.x,n.y,n.r+6,0,Math.PI*2);
          ctx.strokeStyle=COLORS[n.colorId].hex;
          ctx.globalAlpha=0.2;
          ctx.lineWidth=1;
          ctx.stroke();
          ctx.globalAlpha=1;
        }
      }
    }
  });

  packets.forEach(function(p){
    var col=COLORS[p.colorId]||COLORS[0];
    if(p.trail.length>1){
      ctx.strokeStyle=col.hex;
      ctx.globalAlpha=0.3;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(p.trail[0].x,p.trail[0].y);
      for(var t=1;t<p.trail.length;t++)ctx.lineTo(p.trail[t].x,p.trail[t].y);
      ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.beginPath();
    ctx.arc(p.x,p.y,5,0,Math.PI*2);
    ctx.fillStyle=col.hex;
    ctx.fill();
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1;
    ctx.globalAlpha=0.6;
    ctx.stroke();
    ctx.globalAlpha=1;
    if(p.state==='waiting'){
      ctx.font='9px ui-monospace,Menlo,monospace';
      ctx.fillStyle=col.hex;
      ctx.textAlign='center';
      ctx.fillText(Math.ceil(p.waitT)+'s',p.x,p.y-12);
    }
  });

  particles.forEach(function(p){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.life;
    ctx.fill();
  });
  ctx.globalAlpha=1;

  if(shearActive){
    var w=windShears[0];
    var prog=w.t/w.dur;
    ctx.fillStyle=isDark?'rgba(200,220,210,'+(0.08*(1-prog))+')':'rgba(120,150,130,'+(0.12*(1-prog))+')';
    ctx.fillRect(0,0,W,H);
    ctx.font='11px ui-monospace,Menlo,monospace';
    ctx.fillStyle=isDark?'#8aa890':'#4a6050';
    ctx.textAlign='center';
    ctx.globalAlpha=1-prog;
    ctx.fillText('// wind shear — paths aging',W/2,H*0.08);
    ctx.globalAlpha=1;
  }

  if(state==='playing'&&routes.length===0&&packets.length===0){
    ctx.font='11px ui-monospace,Menlo,monospace';
    ctx.fillStyle=isDark?'#6b8f72':'#5a7060';
    ctx.textAlign='center';
    ctx.globalAlpha=0.7+0.3*Math.sin(blinkPhase*2);
    ctx.fillText('drag shortcut → matching folder',W/2,H*0.92);
    ctx.globalAlpha=1;
  }

  ctx.restore();
}

function loop(now){
  var dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;
  update(dt);
  draw();
  animId=requestAnimationFrame(loop);
}

function autoRoute(shortcutIdx){
  if(state!=='playing')return;
  var shortcuts=getShortcuts();
  var sc=shortcuts[shortcutIdx];
  if(!sc)return;
  var targets=getFolderNodes().filter(function(f){return f.colorId===sc.colorId});
  if(!targets.length)return;
  var tgt=targets[0];
  var pts=[{x:sc.x,y:sc.y},{x:(sc.x+tgt.x)/2,y:sc.y-30},{x:tgt.x,y:tgt.y}];
  addRoute(sc,tgt,pts);
}

function onKeyDown(e){
  if(!e)return;
  var k=e.key;
  if(k==='Enter'||k===' '){
    if(state==='title'&&btnStart){e.preventDefault();btnStart.click();return}
    if(state==='gameover'&&btnRestart){e.preventDefault();btnRestart.click();return}
  }
  if(state!=='playing')return;
  if(k==='1'||k==='2'||k==='3'){
    e.preventDefault();
    autoRoute(parseInt(k,10)-1);
  }
}

function bindEvents(){
  if(btnStart){
    btnStart.addEventListener('click',function(){
      ensureAudio();
      resetGame();
    });
  }
  if(btnRestart){
    btnRestart.addEventListener('click',function(){
      ensureAudio();
      resetGame();
    });
  }
  window.addEventListener('keydown',onKeyDown);
  if(canvas){
    canvas.addEventListener('mousedown',onPointerDown);
    canvas.addEventListener('mousemove',onPointerMove);
    canvas.addEventListener('mouseup',onPointerUp);
    canvas.addEventListener('mouseleave',onPointerUp);
    canvas.addEventListener('touchstart',onPointerDown,{passive:false});
    canvas.addEventListener('touchmove',onPointerMove,{passive:false});
    canvas.addEventListener('touchend',onPointerUp,{passive:false});
    canvas.addEventListener('touchcancel',onPointerUp,{passive:false});
  }
  window.addEventListener('resize',resize);
  try{
    var mq=window.matchMedia('(prefers-color-scheme: dark)');
    if(mq&&mq.addEventListener)mq.addEventListener('change',function(){detectDark()});
    else if(mq&&mq.addListener)mq.addListener(function(){detectDark()});
  }catch(e){}
}

detectDark();
resize();
bindEvents();
draw();
lastTime=performance.now();
animId=requestAnimationFrame(loop);

})();
</script>
</body>
</html>
