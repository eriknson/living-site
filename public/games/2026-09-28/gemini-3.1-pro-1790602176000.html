<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Hurricane Polo</title>
    <style>
        :root {
            --bg-top: #a2c2d6;
            --bg-bottom: #708ea3;
            --coast-color: #5c7587;
            --coast-top: #405260;
            --text-color: #1a252f;
            --ui-bg: rgba(220, 230, 240, 0.85);
            --flood: #3498db;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-top: #1a2a3a;
                --bg-bottom: #0d151c;
                --coast-color: #2c3e50;
                --coast-top: #1a252f;
                --text-color: #e0e5ea;
                --ui-bg: rgba(13, 21, 28, 0.75);
                --flood: #09151e;
            }
            #hud { text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;
            min-height: 100vh;
            overflow: hidden;
            background: var(--bg-top);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            color: var(--text-color);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: var(--ui-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 80%;
        }
        .screen.active {
            display: flex;
        }
        h1, h2 {
            margin: 0 0 1rem 0;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            pointer-events: none;
        }
        p {
            margin: 0 0 2.5rem 0;
            font-size: 0.95rem;
            opacity: 0.9;
            max-width: 280px;
            line-height: 1.5;
            pointer-events: none;
        }
        button {
            pointer-events: auto;
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        button:active {
            transform: scale(0.95);
            background: var(--text-color);
            color: var(--bg-bottom);
        }
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            left: env(safe-area-inset-left, 20px);
            right: env(safe-area-inset-right, 20px);
            display: flex;
            justify-content: space-between;
            z-index: 5;
            pointer-events: none;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(255,255,255,0.5);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    
    <div id="hud" class="hidden">
        <div>SCORE <span id="score">0</span></div>
        <div>COAST <span id="health">100</span>%</div>
    </div>

    <div id="ui-layer">
        <div id="start-screen" class="screen active">
            <h1>Hurricane Polo</h1>
            <p>Flick the radar storm bands into the open ocean to protect the coast from flooding.</p>
            <button data-smoke="start" id="start-btn">BEGIN</button>
        </div>

        <div id="game-over-screen" class="screen">
            <h2>COAST FLOODED</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button data-smoke="restart" id="restart-btn">REPLAY</button>
        </div>
    </div>

    <script>
    (function() {
        try {
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d', { alpha: false });
            if (!ctx) return;

            let width, height, dpr;
            let state = 'MENU'; // MENU, PLAY, OVER_ANIMATING, OVER
            let score = 0;
            let time = 0;
            let lastTime = performance.now();
            let lastSpawnTime = 0;
            let screenShake = 0;
            let redFlash = 0;
            let rafId = null;

            const GAME_CONFIG = {
                coastHeight: 80,
                numTiles: 5,
                bandBaseSpeed: 1,
            };

            const colors = {
                bgTop: '#1a2a3a', bgBottom: '#0d151c',
                coast: '#2c3e50', coastTop: '#1a252f', flood: '#09151e',
                radarGreen: '#2ecc71', radarYellow: '#f1c40f', radarRed: '#e74c3c'
            };

            const radarColors = [
                { core: 'rgba(46, 204, 113, 0.9)', edge: 'rgba(46, 204, 113, 0)' },
                { core: 'rgba(241, 196, 15, 0.9)', edge: 'rgba(241, 196, 15, 0)' },
                { core: 'rgba(231, 76, 60, 0.9)', edge: 'rgba(231, 76, 60, 0)' }
            ];

            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            function updateColors() {
                if (mediaQuery.matches) {
                    colors.bgTop = '#1a2a3a'; colors.bgBottom = '#0d151c';
                    colors.coast = '#2c3e50'; colors.coastTop = '#1a252f'; colors.flood = '#09151e';
                } else {
                    colors.bgTop = '#a2c2d6'; colors.bgBottom = '#708ea3';
                    colors.coast = '#5c7587'; colors.coastTop = '#405260'; colors.flood = '#3498db';
                }
            }
            if(mediaQuery.addEventListener) {
                mediaQuery.addEventListener('change', updateColors);
            } else {
                mediaQuery.addListener(updateColors);
            }
            updateColors();

            let coast = [];
            let bands = [];
            let particles = [];
            let pointer = { active: false, x: 0, y: 0, path: [], dragging: null };

            function resize() {
                dpr = window.devicePixelRatio || 1;
                width = window.innerWidth || document.documentElement.clientWidth;
                height = window.innerHeight || document.documentElement.clientHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
                initCoast();
            }
            window.addEventListener('resize', resize);
            resize();

            function initCoast() {
                if (coast.length > 0 && coast[0].health !== undefined) {
                    // Just update positions if resizing mid-game, keep health
                    let tileW = width / GAME_CONFIG.numTiles;
                    for (let i = 0; i < GAME_CONFIG.numTiles; i++) {
                        coast[i].x = i * tileW;
                        coast[i].w = tileW;
                    }
                } else {
                    coast = [];
                    let tileW = width / GAME_CONFIG.numTiles;
                    for (let i = 0; i < GAME_CONFIG.numTiles; i++) {
                        coast.push({ x: i * tileW, w: tileW, health: 100 });
                    }
                }
            }

            function getEyeRadius() {
                if (state === 'PLAY' || state === 'OVER_ANIMATING') {
                    return Math.max(15, 40 - (time / 60000) * 25);
                }
                return 40;
            }

            function getEyeX() { return width / 2; }
            function getEyeY() {
                if (state === 'PLAY' || state === 'OVER_ANIMATING') {
                    let drop = Math.min(0.25, (time / 60000) * 0.25);
                    return height * (0.15 + drop);
                }
                return height * 0.2;
            }

            class Band {
                constructor(eyeX, eyeY, gameTime) {
                    let angle = Math.random() * Math.PI * 2;
                    let dist = getEyeRadius() + 15 + Math.random() * 20;
                    this.x = eyeX + Math.cos(angle) * dist;
                    this.y = eyeY + Math.sin(angle) * dist;
                    
                    this.baseR = 30 + Math.random() * 20;
                    
                    let speed = GAME_CONFIG.bandBaseSpeed + (gameTime/15000);
                    this.vx = Math.cos(angle) * speed * 0.5;
                    this.vy = Math.abs(Math.sin(angle)) * speed + 0.5;
                    
                    this.active = true;
                    this.flicked = false;
                    
                    this.blobs = [];
                    let numBlobs = 2 + Math.floor(Math.random() * 3);
                    for(let i=0; i<numBlobs; i++) {
                        this.blobs.push({
                            ox: (Math.random()-0.5) * (this.baseR * 0.6),
                            oy: (Math.random()-0.5) * (this.baseR * 0.6),
                            r: this.baseR * (0.5 + Math.random()*0.5),
                            type: Math.random() > 0.8 ? 2 : (Math.random() > 0.4 ? 1 : 0)
                        });
                    }
                    this.trail = [];
                }
                
                update(dt) {
                    if (pointer.dragging === this) {
                        this.x = pointer.x;
                        this.y = pointer.y;
                        this.trail.push({x: this.x, y: this.y});
                        if(this.trail.length > 10) this.trail.shift();
                        return;
                    }
                    
                    let timeFactor = dt/16;
                    this.x += this.vx * timeFactor;
                    this.y += this.vy * timeFactor;
                    
                    if (this.flicked) {
                        this.vx *= 0.99;
                        this.vy *= 0.99;
                        if (this.vy < 0) this.vy -= 0.05 * timeFactor; 
                        
                        this.baseR *= 0.96; 
                        
                        if (this.baseR < 3 || this.x < -100 || this.x > width + 100 || this.y < -100) {
                            this.active = false;
                            if (state === 'PLAY') {
                                score += 10;
                                updateHUD();
                                spawnParticles(this.x, Math.max(0, this.y), 15, colors.radarGreen);
                            }
                        }
                    } else {
                        let globalWind = Math.sin(time / 2000) * Math.min(2.0, (time / 20000));
                        this.vx += globalWind * 0.05 * timeFactor;
                        this.vx = Math.max(-4, Math.min(4, this.vx));
                        
                        if (this.x - this.baseR < 0) {
                            this.x = this.baseR;
                            this.vx *= -0.5;
                        } else if (this.x + this.baseR > width) {
                            this.x = width - this.baseR;
                            this.vx *= -0.5;
                        }
                        
                        if (this.y + this.baseR > height - GAME_CONFIG.coastHeight) {
                            this.active = false;
                            if (state === 'PLAY') damageCoast(this.x, 1);
                        }
                    }
                    
                    this.trail.push({x: this.x, y: this.y});
                    if(this.trail.length > 15) this.trail.shift();
                }
                
                draw(ctx) {
                    if (this.flicked && this.trail.length > 1) {
                        ctx.beginPath();
                        ctx.moveTo(this.trail[0].x, this.trail[0].y);
                        for(let i=1; i<this.trail.length; i++) {
                            ctx.lineTo(this.trail[i].x, this.trail[i].y);
                        }
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                        ctx.lineWidth = this.baseR;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.stroke();
                    }

                    for (let blob of this.blobs) {
                        let bx = this.x + blob.ox;
                        let by = this.y + blob.oy;
                        let r = this.flicked ? blob.r * (this.baseR / 30) : blob.r; 
                        if (r <= 0) continue;
                        
                        let grad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
                        let color = radarColors[blob.type];
                        grad.addColorStop(0, color.core);
                        grad.addColorStop(1, color.edge);
                        
                        ctx.beginPath();
                        ctx.arc(bx, by, r, 0, Math.PI*2);
                        ctx.fillStyle = grad;
                        ctx.fill();
                    }
                }
            }

            function spawnParticles(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = Math.random() * 5 + 2;
                    particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        r: Math.random() * 3 + 1,
                        color: color,
                        life: 600 + Math.random() * 400,
                        maxLife: 1000
                    });
                }
            }

            function damageCoast(x, mult) {
                let tileW = width / GAME_CONFIG.numTiles;
                let index = Math.floor(x / tileW);
                if (index < 0) index = 0;
                if (index >= GAME_CONFIG.numTiles) index = GAME_CONFIG.numTiles - 1;
                
                let c = coast[index];
                if (c.health > 0) {
                    c.health -= 34 * mult;
                    if (c.health < 0) c.health = 0;
                    
                    screenShake = 15 * mult;
                    redFlash = 0.8;
                    spawnParticles(x, height - GAME_CONFIG.coastHeight, 20 * mult, colors.radarRed);
                    if (navigator.vibrate) navigator.vibrate(50 * mult);
                    checkGameOver();
                }
            }

            function checkGameOver() {
                let totalHealth = coast.reduce((sum, c) => sum + c.health, 0);
                let maxHealth = GAME_CONFIG.numTiles * 100;
                let hp = Math.max(0, Math.floor((totalHealth / maxHealth) * 100));
                document.getElementById('health').innerText = hp;
                
                if (totalHealth <= 0) {
                    state = 'OVER_ANIMATING';
                    screenShake = 30;
                    redFlash = 1.0;
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
                    
                    setTimeout(() => {
                        state = 'OVER';
                        document.getElementById('game-over-screen').classList.add('active');
                        document.getElementById('hud').classList.add('hidden');
                        document.getElementById('final-score').innerText = score;
                    }, 1200);
                }
            }

            function updateHUD() {
                document.getElementById('score').innerText = score;
            }

            function startGame() {
                state = 'PLAY';
                score = 0;
                time = 0;
                bands = [];
                particles = [];
                pointer.dragging = null;
                coast.forEach(c => c.health = 100);
                
                updateHUD();
                document.getElementById('health').innerText = '100';
                document.getElementById('start-screen').classList.remove('active');
                document.getElementById('game-over-screen').classList.remove('active');
                document.getElementById('hud').classList.remove('hidden');
            }

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', startGame);

            function handlePointerDown(e) {
                if (e.cancelable) e.preventDefault();
                if (state !== 'PLAY') return;
                
                let rect = canvas.getBoundingClientRect();
                pointer.x = e.clientX - rect.left;
                pointer.y = e.clientY - rect.top;
                pointer.active = true;
                pointer.path = [{x: pointer.x, y: pointer.y, t: performance.now()}];
                
                for (let i = bands.length - 1; i >= 0; i--) {
                    let b = bands[i];
                    if (b.flicked) continue;
                    let dx = b.x - pointer.x;
                    let dy = b.y - pointer.y;
                    if (dx*dx + dy*dy <= Math.pow(b.baseR + 25, 2)) {
                        pointer.dragging = b;
                        bands.splice(i, 1);
                        bands.push(b);
                        b.baseR *= 1.15; 
                        break;
                    }
                }
            }

            function handlePointerMove(e) {
                if (e.cancelable) e.preventDefault();
                if (!pointer.active) return;
                
                let rect = canvas.getBoundingClientRect();
                pointer.x = e.clientX - rect.left;
                pointer.y = e.clientY - rect.top;
                let now = performance.now();
                pointer.path.push({x: pointer.x, y: pointer.y, t: now});
                
                while(pointer.path.length > 0 && now - pointer.path[0].t > 150) {
                    pointer.path.shift();
                }
            }

            function handlePointerUp(e) {
                if (e.cancelable) e.preventDefault();
                pointer.active = false;
                
                if (pointer.dragging) {
                    let now = performance.now();
                    let validPoints = pointer.path.filter(p => now - p.t < 120);
                    
                    if (validPoints.length > 1) {
                        let first = validPoints[0];
                        let last = validPoints[validPoints.length - 1];
                        let dt = Math.max(last.t - first.t, 16);
                        
                        let vx = ((last.x - first.x) / dt) * 16 * 1.5;
                        let vy = ((last.y - first.y) / dt) * 16 * 1.5;
                        
                        let speed = Math.sqrt(vx*vx + vy*vy);
                        if (speed > 4) {
                            pointer.dragging.vx = vx;
                            pointer.dragging.vy = vy;
                            pointer.dragging.flicked = true;
                        } else {
                            pointer.dragging.vx = vx * 0.2;
                            pointer.dragging.vy = Math.max(2, vy * 0.2);
                        }
                    } else {
                        pointer.dragging.vx = 0;
                        pointer.dragging.vy = 2;
                    }
                    pointer.dragging.baseR /= 1.15;
                    pointer.dragging = null;
                }
            }

            canvas.addEventListener('pointerdown', handlePointerDown, {passive: false});
            canvas.addEventListener('pointermove', handlePointerMove, {passive: false});
            canvas.addEventListener('pointerup', handlePointerUp, {passive: false});
            canvas.addEventListener('pointercancel', handlePointerUp, {passive: false});

            window.addEventListener('keydown', (e) => {
                if (state !== 'PLAY') return;
                if (e.code === 'Space') {
                    if (e.cancelable) e.preventDefault();
                    let lowest = null;
                    for (let b of bands) {
                        if (!b.flicked && (!lowest || b.y > lowest.y)) lowest = b;
                    }
                    if (lowest) {
                        lowest.flicked = true;
                        lowest.vx = (Math.random() - 0.5) * 8;
                        lowest.vy = -18;
                        lowest.baseR *= 1.1;
                        spawnParticles(lowest.x, lowest.y, 8, colors.radarGreen);
                    }
                }
            });

            function drawEye(eyeX, eyeY) {
                let eyeRad = getEyeRadius();
                
                ctx.save();
                ctx.translate(eyeX, eyeY);
                ctx.rotate((time / 1000) * 1.5);
                
                let g1 = ctx.createRadialGradient(0, 0, eyeRad*0.3, 0, 0, eyeRad*2.5);
                g1.addColorStop(0, 'rgba(46, 204, 113, 0)');
                g1.addColorStop(0.4, 'rgba(241, 196, 15, 0.15)');
                g1.addColorStop(1, 'rgba(231, 76, 60, 0)');
                
                ctx.fillStyle = g1;
                ctx.beginPath();
                ctx.arc(0, 0, eyeRad*2.5, 0, Math.PI*2);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(eyeRad * 2.5, 0);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.arc(0, 0, eyeRad*2.5, 0, -Math.PI/3, true);
                ctx.lineTo(0,0);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.fill();
                
                ctx.restore();
                
                ctx.beginPath();
                ctx.arc(eyeX, eyeY, eyeRad * 0.8, 0, Math.PI*2);
                ctx.fillStyle = colors.bgTop;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            function drawCoast() {
                let tileW = width / GAME_CONFIG.numTiles;
                for (let i = 0; i < coast.length; i++) {
                    let c = coast[i];
                    let cx = c.x;
                    let cy = height - GAME_CONFIG.coastHeight;
                    
                    ctx.fillStyle = colors.coast;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy + 5);
                    ctx.quadraticCurveTo(cx + tileW/2, cy - 8, cx + tileW, cy + 5);
                    ctx.lineTo(cx + tileW, height);
                    ctx.lineTo(cx, height);
                    ctx.fill();
                    
                    ctx.fillStyle = colors.coastTop;
                    let bSeed = i * 123;
                    let xOffset = 5;
                    while(xOffset < tileW - 15) {
                        let bw = 8 + (bSeed % 12);
                        let bh = 10 + ((bSeed * 7) % 25);
                        ctx.fillRect(cx + xOffset, cy + 5 - bh, bw, bh);
                        xOffset += bw + 3 + (bSeed % 6);
                        bSeed++;
                    }
                    
                    if (c.health < 100) {
                        let floodRatio = 1 - (c.health / 100);
                        let floodH = GAME_CONFIG.coastHeight * floodRatio + 15;
                        
                        ctx.fillStyle = colors.flood;
                        ctx.globalAlpha = 0.7 + Math.sin(time/200)*0.1;
                        ctx.beginPath();
                        let waveY = height - floodH;
                        ctx.moveTo(cx, height);
                        ctx.lineTo(cx, waveY);
                        ctx.quadraticCurveTo(cx + tileW/2, waveY - 5 + Math.sin(time/300 + i)*5, cx + tileW, waveY);
                        ctx.lineTo(cx + tileW, height);
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                    }
                }
            }

            function loop(timestamp) {
                let dt = timestamp - lastTime;
                if (dt > 100) dt = 16; 
                lastTime = timestamp;
                
                let eyeX = getEyeX();
                let eyeY = getEyeY();

                if (state === 'PLAY' || state === 'OVER_ANIMATING') {
                    time += dt;
                    
                    let currentSpawnRate = Math.max(400, 1500 - (time / 1000) * 18);
                    if (timestamp - lastSpawnTime > currentSpawnRate) {
                        bands.push(new Band(eyeX, eyeY, time));
                        lastSpawnTime = timestamp;
                    }
                } else if (state === 'MENU') {
                    time += dt;
                    if (timestamp - lastSpawnTime > 2000) {
                        let b = new Band(eyeX, eyeY, 0);
                        b.vx = (Math.random() - 0.5) * 2;
                        b.vy = 1 + Math.random();
                        bands.push(b);
                        lastSpawnTime = timestamp;
                    }
                }

                for (let i = bands.length - 1; i >= 0; i--) {
                    let b = bands[i];
                    b.update(dt);
                    if (!b.active) bands.splice(i, 1);
                }
                
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx * (dt/16);
                    p.y += p.vy * (dt/16);
                    p.life -= dt;
                    if (p.life <= 0) particles.splice(i, 1);
                }

                if (screenShake > 0) screenShake -= dt * 0.05;
                if (redFlash > 0) redFlash -= dt * 0.002;

                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, colors.bgTop);
                grad.addColorStop(1, colors.bgBottom);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                ctx.save();
                if (screenShake > 0) {
                    ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
                }

                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let x=0; x<width; x+=60) { ctx.moveTo(x,0); ctx.lineTo(x,height); }
                for(let y=0; y<height; y+=60) { ctx.moveTo(0,y); ctx.lineTo(width,y); }
                ctx.stroke();

                drawEye(eyeX, eyeY);

                ctx.globalCompositeOperation = 'screen';
                for (let b of bands) b.draw(ctx);
                ctx.globalCompositeOperation = 'source-over';

                for (let p of particles) {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;

                drawCoast();

                if (pointer.dragging) {
                    ctx.beginPath();
                    ctx.moveTo(pointer.dragging.x, pointer.dragging.y);
                    ctx.lineTo(pointer.x, pointer.y);
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([8, 8]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                if (redFlash > 0) {
                    ctx.fillStyle = `rgba(231, 76, 60, ${Math.min(redFlash, 0.4)})`;
                    ctx.fillRect(0, 0, width, height);
                }

                ctx.restore();
                rafId = requestAnimationFrame(loop);
            }
            
            initCoast();
            rafId = requestAnimationFrame(loop);

        } catch (e) {
            console.error("Game load failed gracefully:", e);
        }
    })();
    </script>
</body>
</html>
