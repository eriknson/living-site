<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid Patch — Autumn Blackout</title>
<style>
  :root {
    --bg: #e8eef4;
    --bg2: #d4dce6;
    --text: #1a2530;
    --muted: #5a6b7d;
    --accent: #008f7a;
    --accent2: #d97706;
    --danger: #dc2626;
    --panel: rgba(255, 255, 255, 0.94);
    --panel-border: rgba(0, 143, 122, 0.3);
    --btn-bg: #008f7a;
    --btn-text: #ffffff;
    --shadow: rgba(0, 143, 122, 0.25);
    --overlay-top: rgba(232, 238, 244, 0.6);
    --overlay-bot: rgba(232, 238, 244, 0.88);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0e14;
      --bg2: #111820;
      --text: #c8d6e5;
      --muted: #6b7d8f;
      --accent: #00e5cc;
      --accent2: #ff9f43;
      --danger: #ff4757;
      --panel: rgba(12, 18, 28, 0.92);
      --panel-border: rgba(0, 229, 204, 0.25);
      --btn-bg: #00e5cc;
      --btn-text: #0a0e14;
      --shadow: rgba(0, 229, 204, 0.35);
      --overlay-top: rgba(10, 14, 20, 0.55);
      --overlay-bot: rgba(10, 14, 20, 0.82);
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    background: var(--bg2);
    border-bottom: 1px solid var(--panel-border);
    z-index: 10;
  }
  .hud-block { display: flex; flex-direction: column; gap: 2px; }
  .hud-label { font-size: 10px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .hud-value { font-size: 18px; font-weight: 600; color: var(--accent); }
  .hud-value.warn { color: var(--accent2); }
  .hud-value.danger { color: var(--danger); }
  #canvas-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    background: linear-gradient(180deg, var(--overlay-top) 0%, var(--overlay-bot) 100%);
    pointer-events: none;
    z-index: 20;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  .overlay.visible { opacity: 1; visibility: visible; }
  .panel {
    max-width: 340px;
    width: 100%;
    text-align: center;
    padding: 28px 24px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    pointer-events: none;
  }
  .panel h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
    color: var(--text);
  }
  .panel .subtitle {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .panel .stat-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 20px;
  }
  .panel .stat { text-align: center; }
  .panel .stat .val { font-size: 24px; color: var(--accent); font-weight: 700; }
  .panel .stat .lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }
  .smoke-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    min-width: 180px;
    padding: 14px 28px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--btn-text);
    background: var(--btn-bg);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 4px 20px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .smoke-btn:active { transform: scale(0.96); }
  .hint {
    margin-top: 16px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  #toast {
    position: absolute;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 8px 16px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    font-size: 11px;
    color: var(--accent2);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 15;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="scoreVal">0</span>
    </div>
    <div class="hud-block" style="align-items:center">
      <span class="hud-label">Grid</span>
      <span class="hud-value" id="gridVal">0%</span>
    </div>
    <div class="hud-block" style="align-items:flex-end">
      <span class="hud-label">Time</span>
      <span class="hud-value" id="timeVal">45</span>
    </div>
  </header>
  <div id="canvas-wrap">
    <canvas id="game"></canvas>
    <div id="toast"></div>
    <div id="titleOverlay" class="overlay visible">
      <div class="panel">
        <h1>GRID PATCH</h1>
        <p class="subtitle">Autumn blackout rolling across the wireframe city. Seal leaks before blocks go dark — drag to reroute power.</p>
        <button type="button" class="smoke-btn" data-smoke="start">Ignite Grid</button>
        <p class="hint">Tap sparking nodes · Drag between nodes to reroute · Space to seal</p>
      </div>
    </div>
    <div id="gameOverOverlay" class="overlay">
      <div class="panel">
        <h1 id="goTitle">BLACKOUT</h1>
        <p class="subtitle" id="goMsg">The city went dark.</p>
        <div class="stat-row">
          <div class="stat"><div class="val" id="goScore">0</div><div class="lbl">SCORE</div></div>
          <div class="stat"><div class="val" id="goGrid">0%</div><div class="lbl">LIT</div></div>
          <div class="stat"><div class="val" id="goCombo">0</div><div class="lbl">BEST COMBO</div></div>
        </div>
        <button type="button" class="smoke-btn" data-smoke="restart">Patch Again</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var scoreEl = document.getElementById('scoreVal');
  var gridEl = document.getElementById('gridVal');
  var timeEl = document.getElementById('timeVal');
  var titleOverlay = document.getElementById('titleOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var toastEl = document.getElementById('toast');
  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');

  var STATE = { TITLE: 0, PLAYING: 1, OVER: 2 };
  var state = STATE.TITLE;
  var W = 400, H = 600;
  var dpr = 1;
  var isDark = true;

  var ROUND_TIME = 45;
  var timeLeft = ROUND_TIME;
  var score = 0;
  var combo = 0;
  var bestCombo = 0;
  var gameTime = 0;
  var shake = 0;
  var hitPause = 0;
  var lastTs = 0;
  var animId = 0;

  var nodes = [];
  var edges = [];
  var leaks = [];
  var particles = [];
  var pulses = [];
  var drag = { active: false, from: -1, x: 0, y: 0 };
  var pointer = { x: 0, y: 0, down: false };
  var spawnTimer = 0;
  var spawnInterval = 2.8;
  var toastTimer = 0;

  var audioCtx = null;
  function initAudio() {
    try {
      if (typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
      else if (typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  function detectTheme() {
    isDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: light)').matches ? false : true;
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () {
        isDark = !window.matchMedia('(prefers-color-scheme: light)').matches;
      });
    }
  }

  function colors() {
    if (isDark) {
      return {
        sky: '#0a0e14',
        sky2: '#0f1520',
        wire: 'rgba(0, 229, 204, 0.15)',
        wireLit: 'rgba(0, 229, 204, 0.55)',
        node: '#1a2535',
        nodeLit: '#00e5cc',
        nodeDim: '#2a3545',
        leak: '#ff4757',
        leakGlow: 'rgba(255, 71, 87, 0.6)',
        amber: '#ff9f43',
        text: '#c8d6e5',
        building: 'rgba(0, 229, 204, 0.08)',
        buildingLit: 'rgba(0, 229, 204, 0.22)',
        buildingGlow: 'rgba(255, 159, 67, 0.35)'
      };
    }
    return {
      sky: '#e8eef4',
      sky2: '#d4dce6',
      wire: 'rgba(0, 100, 90, 0.2)',
      wireLit: 'rgba(0, 143, 122, 0.6)',
      node: '#b8c5d4',
      nodeLit: '#008f7a',
      nodeDim: '#9aaabb',
      leak: '#dc2626',
      leakGlow: 'rgba(220, 38, 38, 0.5)',
      amber: '#d97706',
      text: '#1a2530',
      building: 'rgba(0, 100, 90, 0.06)',
      buildingLit: 'rgba(0, 143, 122, 0.18)',
      buildingGlow: 'rgba(217, 119, 6, 0.3)'
    };
  }

  function buildCity() {
    nodes = [];
    edges = [];
    var cols = 4;
    var rows = 5;
    var marginX = W * 0.12;
    var marginY = H * 0.08;
    var gapX = (W - marginX * 2) / (cols - 1);
    var gapY = (H - marginY * 2) / (rows - 1);
    var idx = 0;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var nx = marginX + c * gapX;
        var ny = marginY + r * gapY;
        var isSource = (r === rows - 1 && c === Math.floor(cols / 2));
        nodes.push({
          id: idx,
          x: nx,
          y: ny,
          col: c,
          row: r,
          power: isSource ? 1 : 0,
          brightness: isSource ? 1 : 0.15,
          targetBright: isSource ? 1 : 0.15,
          isSource: isSource,
          sealed: true,
          buildingH: 18 + ((idx * 7) % 25),
          flicker: Math.random() * Math.PI * 2
        });
        idx++;
      }
    }
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.col < cols - 1) addEdge(i, i + 1);
      if (n.row < rows - 1) addEdge(i, i + cols);
    }
    addEdge(findNode(cols - 1, rows - 2), findNode(Math.floor(cols / 2), rows - 1));
    addEdge(findNode(0, rows - 2), findNode(Math.floor(cols / 2), rows - 1));
    propagatePower();
  }

  function findNode(c, r) {
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].col === c && nodes[i].row === r) return i;
    }
    return 0;
  }

  function addEdge(a, b) {
    if (a < 0 || b < 0 || a >= nodes.length || b >= nodes.length) return;
    for (var i = 0; i < edges.length; i++) {
      if ((edges[i].a === a && edges[i].b === b) || (edges[i].a === b && edges[i].b === a)) return;
    }
    edges.push({ a: a, b: b, boost: 0 });
  }

  function propagatePower() {
    for (var i = 0; i < nodes.length; i++) {
      if (!nodes[i].isSource) nodes[i].power = 0;
    }
    var queue = [];
    for (var j = 0; j < nodes.length; j++) {
      if (nodes[j].isSource) {
        nodes[j].power = 1;
        queue.push(j);
      }
    }
    while (queue.length) {
      var cur = queue.shift();
      for (var e = 0; e < edges.length; e++) {
        var ed = edges[e];
        var next = ed.a === cur ? ed.b : (ed.b === cur ? ed.a : -1);
        if (next >= 0 && !nodes[next].power) {
          var blocked = false;
          for (var l = 0; l < leaks.length; l++) {
            if (leaks[l].nodeId === cur && !leaks[l].sealed && leaks[l].severity > 0.7) blocked = true;
          }
          if (!blocked) {
            nodes[next].power = 1;
            queue.push(next);
          }
        }
      }
    }
    for (var k = 0; k < nodes.length; k++) {
      nodes[k].targetBright = nodes[k].isSource ? 1 : (nodes[k].power ? 0.85 + Math.sin(nodes[k].flicker) * 0.05 : 0.12);
    }
  }

  function litPercent() {
    var lit = 0;
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].brightness > 0.5) lit++;
    }
    return Math.round((lit / nodes.length) * 100);
  }

  function spawnLeak() {
    var candidates = [];
    for (var i = 0; i < nodes.length; i++) {
      if (!nodes[i].isSource) candidates.push(i);
    }
    if (!candidates.length) return;
    var nid = candidates[Math.floor(Math.random() * candidates.length)];
    for (var l = 0; l < leaks.length; l++) {
      if (leaks[l].nodeId === nid && !leaks[l].sealed) return;
    }
    leaks.push({
      nodeId: nid,
      age: 0,
      maxAge: 4.5,
      sealed: false,
      pulse: Math.random() * Math.PI * 2,
      severity: 0
    });
    showToast('Leak at block ' + (nodes[nid].row + 1) + '-' + (nodes[nid].col + 1));
  }

  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = 1.5;
  }

  function burst(x, y, col, count) {
    for (var i = 0; i < (count || 12); i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.4 + Math.random() * 0.4,
        maxLife: 0.8,
        color: col,
        size: 2 + Math.random() * 3
      });
    }
  }

  function sealLeak(idx) {
    var leak = leaks[idx];
    if (!leak || leak.sealed) return false;
    leak.sealed = true;
    var n = nodes[leak.nodeId];
    combo++;
    if (combo > bestCombo) bestCombo = combo;
    var comboBonus = Math.min(combo, 10);
    score += 10 + comboBonus * 2;
    n.targetBright = Math.min(1, n.targetBright + 0.3);
    burst(n.x, n.y, colors().nodeLit, 16);
    shake = 4;
    hitPause = 3;
    playTone(440 + comboBonus * 30, 0.12, 'square', 0.06);
    vibrate(25);
    propagatePower();
    pulses.push({ edgeIdx: -1, from: leak.nodeId, t: 0, dur: 0.6 });
    return true;
  }

  function nearestNode(x, y, maxDist) {
    var best = -1;
    var bestD = maxDist || 44;
    for (var i = 0; i < nodes.length; i++) {
      var dx = nodes[i].x - x;
      var dy = nodes[i].y - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function nearestLeak(x, y) {
    var c = colors();
    for (var i = 0; i < leaks.length; i++) {
      if (leaks[i].sealed) continue;
      var n = nodes[leaks[i].nodeId];
      if (!n) continue;
      var dx = n.x - x;
      var dy = n.y - y;
      if (dx * dx + dy * dy < 55 * 55) return i;
    }
    return -1;
  }

  function reroute(fromId, toId) {
    if (fromId < 0 || toId < 0 || fromId === toId) return;
    addEdge(fromId, toId);
    var na = nodes[fromId];
    var nb = nodes[toId];
    burst((na.x + nb.x) / 2, (na.y + nb.y) / 2, colors().amber, 10);
    score += 5;
    playTone(220, 0.15, 'sine', 0.05);
    vibrate(15);
    propagatePower();
    for (var e = 0; e < edges.length; e++) {
      if ((edges[e].a === fromId && edges[e].b === toId) || (edges[e].a === toId && edges[e].b === fromId)) {
        edges[e].boost = 1;
        pulses.push({ edgeIdx: e, from: fromId, t: 0, dur: 0.8 });
        break;
      }
    }
    showToast('Rerouted power');
  }

  function resize() {
    if (!canvas) return;
    var wrap = document.getElementById('canvas-wrap');
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(rect.width, 100);
    H = Math.max(rect.height, 100);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  function drawBackground(c) {
    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, c.sky2);
    grd.addColorStop(1, c.sky);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = c.wire;
    ctx.lineWidth = 1;
    var gridStep = 32;
    ctx.beginPath();
    for (var x = 0; x < W; x += gridStep) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
    }
    for (var y = 0; y < H; y += gridStep) {
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
    }
    ctx.stroke();

    ctx.fillStyle = isDark ? 'rgba(255,159,67,0.04)' : 'rgba(217,119,6,0.06)';
    ctx.beginPath();
    ctx.arc(W * 0.85, H * 0.12, 30, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBuildings(c) {
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var bw = 28;
      var bh = n.buildingH;
      var bx = n.x - bw / 2;
      var by = n.y - bh - 8;
      var alpha = n.brightness;
      ctx.fillStyle = alpha > 0.4 ? c.buildingLit : c.building;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = alpha > 0.4 ? c.wireLit : c.wire;
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, bh);
      if (alpha > 0.6) {
        ctx.fillStyle = c.buildingGlow;
        ctx.globalAlpha = alpha * 0.4;
        ctx.fillRect(bx + 4, by + 4, bw - 8, 4);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawEdges(c) {
    for (var e = 0; e < edges.length; e++) {
      var ed = edges[e];
      var a = nodes[ed.a];
      var b = nodes[ed.b];
      if (!a || !b) continue;
      var lit = (a.brightness > 0.4 && b.brightness > 0.4) || a.isSource || b.isSource;
      ctx.strokeStyle = lit ? c.wireLit : c.wire;
      ctx.lineWidth = lit ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();

      if (ed.boost > 0) {
        ed.boost = Math.max(0, ed.boost - 0.016);
        ctx.strokeStyle = c.amber;
        ctx.lineWidth = 3;
        ctx.globalAlpha = ed.boost;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    for (var p = 0; p < pulses.length; p++) {
      var pu = pulses[p];
      pu.t += 0.016;
      if (pu.t > pu.dur) continue;
      var prog = pu.t / pu.dur;
      if (pu.edgeIdx >= 0) {
        var ed2 = edges[pu.edgeIdx];
        if (ed2) {
          var na = nodes[ed2.a];
          var nb = nodes[ed2.b];
          var px = na.x + (nb.x - na.x) * prog;
          var py = na.y + (nb.y - na.y) * prog;
          ctx.fillStyle = c.amber;
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (pu.from >= 0) {
        var nf = nodes[pu.from];
        ctx.fillStyle = c.nodeLit;
        ctx.globalAlpha = 1 - prog;
        ctx.beginPath();
        ctx.arc(nf.x, nf.y, 8 + prog * 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    pulses = pulses.filter(function (pu) { return pu.t <= pu.dur; });
  }

  function drawNodes(c) {
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var r = n.isSource ? 10 : 7;
      var glow = n.brightness;

      if (glow > 0.5) {
        ctx.fillStyle = isDark ? 'rgba(0,229,204,0.2)' : 'rgba(0,143,122,0.2)';
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 8 * glow, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = glow > 0.4 ? c.nodeLit : c.nodeDim;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fill();

      if (n.isSource) {
        ctx.strokeStyle = c.amber;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 4 + Math.sin(gameTime * 3) * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawLeaks(c) {
    for (var i = 0; i < leaks.length; i++) {
      var lk = leaks[i];
      if (lk.sealed) continue;
      var n = nodes[lk.nodeId];
      if (!n) continue;
      lk.pulse += 0.08;
      var pulseR = 14 + Math.sin(lk.pulse) * 4;
      ctx.strokeStyle = c.leakGlow;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(n.x, n.y, pulseR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = c.leak;
      ctx.beginPath();
      for (var s = 0; s < 8; s++) {
        var ang = (s / 8) * Math.PI * 2 + lk.pulse;
        var rr = s % 2 === 0 ? 6 : 3;
        var sx = n.x + Math.cos(ang) * rr;
        var sy = n.y + Math.sin(ang) * rr;
        if (s === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.closePath();
      ctx.fill();

      var urgency = lk.age / lk.maxAge;
      if (urgency > 0.5) {
        ctx.strokeStyle = c.leak;
        ctx.lineWidth = 1;
        ctx.globalAlpha = urgency;
        ctx.beginPath();
        ctx.arc(n.x, n.y, pulseR + 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawDragLine(c) {
    if (!drag.active || drag.from < 0) return;
    var n = nodes[drag.from];
    if (!n) return;
    ctx.strokeStyle = c.amber;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(n.x, n.y);
    ctx.lineTo(drag.x, drag.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawParticles() {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= 0.016;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * 0.016;
      p.y += p.vy * 0.016;
      p.vy += 80 * 0.016;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    if (!ctx) return;
    var c = colors();
    var sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    var sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    if (shake > 0) shake *= 0.85;

    ctx.save();
    ctx.translate(sx, sy);
    drawBackground(c);
    drawBuildings(c);
    drawEdges(c);
    drawNodes(c);
    drawLeaks(c);
    drawDragLine(c);
    drawParticles();
    ctx.restore();
  }

  function updateHUD() {
    if (scoreEl) scoreEl.textContent = String(score);
    var pct = litPercent();
    if (gridEl) {
      gridEl.textContent = pct + '%';
      gridEl.className = 'hud-value' + (pct < 40 ? ' danger' : pct < 60 ? ' warn' : '');
    }
    if (timeEl) {
      timeEl.textContent = String(Math.ceil(timeLeft));
      timeEl.className = 'hud-value' + (timeLeft <= 10 ? ' danger' : '');
    }
  }

  function update(dt) {
    if (state !== STATE.PLAYING) return;
    if (hitPause > 0) { hitPause--; return; }

    gameTime += dt;
    timeLeft -= dt;
    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0 && toastEl) toastEl.classList.remove('show');
    }

    var pct = litPercent();
    spawnInterval = Math.max(0.9, 2.8 - (pct / 100) * 1.6);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnLeak();
      spawnTimer = spawnInterval;
    }

    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      n.flicker += dt * 2;
      n.brightness += (n.targetBright - n.brightness) * Math.min(1, dt * 4);
    }

    for (var l = leaks.length - 1; l >= 0; l--) {
      var lk = leaks[l];
      if (lk.sealed) {
        if (lk.age > 1) leaks.splice(l, 1);
        continue;
      }
      lk.age += dt;
      lk.severity = lk.age / lk.maxAge;
      var ln = nodes[lk.nodeId];
      if (ln) {
        ln.targetBright = Math.max(0.08, 0.85 - lk.severity * 0.9);
        if (lk.severity >= 1) {
          ln.targetBright = 0.08;
          ln.power = 0;
          combo = 0;
          burst(ln.x, ln.y, colors().leak, 8);
          playTone(110, 0.2, 'sawtooth', 0.04);
          vibrate(40);
          lk.sealed = true;
          propagatePower();
          showToast('Block lost!');
        }
      }
    }

    propagatePower();

    if (litPercent() < 25) {
      endGame(false);
      return;
    }
    if (timeLeft <= 0) {
      endGame(true);
    }
  }

  function endGame(survived) {
    state = STATE.OVER;
    if (gameOverOverlay) gameOverOverlay.classList.add('visible');
    var goTitle = document.getElementById('goTitle');
    var goMsg = document.getElementById('goMsg');
    var goScore = document.getElementById('goScore');
    var goGrid = document.getElementById('goGrid');
    var goCombo = document.getElementById('goCombo');
    if (survived) {
      score += litPercent() * 2;
      if (goTitle) goTitle.textContent = 'GRID STABLE';
      if (goMsg) goMsg.textContent = 'You held the blackout at bay through the autumn night.';
    } else {
      if (goTitle) goTitle.textContent = 'BLACKOUT';
      if (goMsg) goMsg.textContent = 'Too many blocks went dark. The city sleeps.';
    }
    if (goScore) goScore.textContent = String(score);
    if (goGrid) goGrid.textContent = litPercent() + '%';
    if (goCombo) goCombo.textContent = String(bestCombo);
    updateHUD();
    playTone(survived ? 523 : 180, 0.3, 'sine', 0.07);
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    render();
    updateHUD();
    animId = requestAnimationFrame(loop);
  }

  function getPos(e) {
    if (!canvas) return { x: 0, y: 0 };
    var rect = canvas.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX;
      cy = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length) {
      cx = e.changedTouches[0].clientX;
      cy = e.changedTouches[0].clientY;
    } else {
      cx = e.clientX;
      cy = e.clientY;
    }
    return { x: cx - rect.left, y: cy - rect.top };
  }

  function onDown(e) {
    if (state !== STATE.PLAYING) return;
    e.preventDefault();
    var pos = getPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
    pointer.down = true;

    var li = nearestLeak(pos.x, pos.y);
    if (li >= 0) {
      sealLeak(li);
      return;
    }

    drag.from = nearestNode(pos.x, pos.y, 50);
    drag.x = pos.x;
    drag.y = pos.y;
    drag.active = drag.from >= 0;
  }

  function onMove(e) {
    if (state !== STATE.PLAYING) return;
    e.preventDefault();
    var pos = getPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
    if (drag.active) {
      drag.x = pos.x;
      drag.y = pos.y;
    }
  }

  function onUp(e) {
    if (state !== STATE.PLAYING) return;
    e.preventDefault();
    var pos = getPos(e);
    if (drag.active && drag.from >= 0) {
      var to = nearestNode(pos.x, pos.y, 50);
      if (to >= 0 && to !== drag.from) reroute(drag.from, to);
    }
    drag.active = false;
    drag.from = -1;
    pointer.down = false;
  }

  function startGame() {
    initAudio();
    state = STATE.PLAYING;
    score = 0;
    combo = 0;
    bestCombo = 0;
    timeLeft = ROUND_TIME;
    gameTime = 0;
    leaks = [];
    particles = [];
    pulses = [];
    spawnTimer = 1.5;
    spawnInterval = 2.8;
    shake = 0;
    hitPause = 0;
    if (titleOverlay) titleOverlay.classList.remove('visible');
    if (gameOverOverlay) gameOverOverlay.classList.remove('visible');
    buildCity();
    updateHUD();
    playTone(330, 0.2, 'sine', 0.06);
  }

  function restartGame() {
    startGame();
  }

  function onKeyDown(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      if (state === STATE.TITLE && startBtn) { e.preventDefault(); startGame(); return; }
      if (state === STATE.OVER && restartBtn) { e.preventDefault(); restartGame(); return; }
    }
    if (state !== STATE.PLAYING) return;
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      var li = nearestLeak(pointer.x || W / 2, pointer.y || H / 2);
      if (li < 0) {
        var urgent = -1;
        var bestAge = 0;
        for (var i = 0; i < leaks.length; i++) {
          if (leaks[i].sealed) continue;
          if (leaks[i].age > bestAge) { bestAge = leaks[i].age; urgent = i; }
        }
        if (urgent >= 0) sealLeak(urgent);
      } else {
        sealLeak(li);
      }
    }
  }

  function bindEvents() {
    if (startBtn) startBtn.addEventListener('click', function (e) { e.stopPropagation(); startGame(); });
    if (restartBtn) restartBtn.addEventListener('click', function (e) { e.stopPropagation(); restartGame(); });
    document.addEventListener('keydown', onKeyDown);

    if (canvas) {
      canvas.addEventListener('mousedown', onDown);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onUp);
      canvas.addEventListener('mouseleave', onUp);
      canvas.addEventListener('touchstart', onDown, { passive: false });
      canvas.addEventListener('touchmove', onMove, { passive: false });
      canvas.addEventListener('touchend', onUp, { passive: false });
      canvas.addEventListener('touchcancel', onUp, { passive: false });
    }
    window.addEventListener('resize', function () {
      resize();
      if (state === STATE.TITLE || nodes.length === 0) buildCity();
    });
  }

  function init() {
    detectTheme();
    resize();
    buildCity();
    bindEvents();
    render();
    updateHUD();
    animId = requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
