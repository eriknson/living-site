<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Orbital Drift</title>
    <style>
        :root {
            --bg: #0B0F19;
            --text: #F8FAFC;
            --btn-bg: #F8FAFC;
            --btn-text: #0B0F19;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #E2E8F0;
                --text: #0F172A;
                --btn-bg: #0F172A;
                --btn-text: #E2E8F0;
            }
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .ui-content {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            color: var(--text);
            font-weight: 400;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }
        p {
            color: var(--text);
            opacity: 0.7;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            max-width: 300px;
            line-height: 1.5;
        }
        button {
            pointer-events: auto;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.1em;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        #ui-hud {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            left: 20px;
            right: 20px;
            display: none;
            justify-content: space-between;
            pointer-events: none;
            color: var(--text);
            z-index: 10;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
        }
        .dim-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.1s;
        }
        .flash-overlay {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 6;
        }
    </style>
</head>
<body>

    <canvas id="game"></canvas>
    <div id="dimmer" class="dim-overlay"></div>
    <div id="flasher" class="flash-overlay"></div>

    <div id="ui-hud">
        <div id="hud-orbit">ORBIT: 0</div>
        <div id="hud-chain">CHAIN: 0</div>
    </div>

    <div id="ui-start" class="ui-layer">
        <div class="ui-content">
            <h1>ORBITAL DRIFT</h1>
            <p>Hold your thumb to trace the drifting path. Release exactly over a node to connect.</p>
            <button data-smoke="start" onclick="startGame()">BEGIN</button>
        </div>
    </div>

    <div id="ui-gameover" class="ui-layer" style="display: none;">
        <div class="ui-content">
            <h1>CONNECTION LOST</h1>
            <p id="final-stats">ORBITS: 0<br>CONNECTIONS: 0</p>
            <button data-smoke="restart" onclick="startGame()">RESTART</button>
        </div>
    </div>

<script>
    // --- Configuration ---
    const CONFIG = {
        scrollSpeedBase: 150,
        scrollSpeedMax: 500,
        nodeDistanceBase: 400,
        safeRadiusBase: 50,
        nodeRadius: 60,
        healthDrainOffPath: 50, // % per second
        healthDrainNoTouch: 25,
        healthRegenOnPath: 40,
        healthPenaltyMissNode: 35,
        healthPenaltyMissRelease: 15,
        gracePeriod: 1.0,
        touchOffsetY: 60
    };

    const THEMES = {
        dark: {
            bg: '#0B0F19',
            fog1: [28, 48, 80],
            fog2: [16, 28, 50],
            fogMode: 'screen',
            pathBase: 'rgba(255, 255, 255, 0.15)',
            pathTraced: '#E2E8F0',
            nodeBase: 'rgba(255, 255, 255, 0.3)',
            nodeTarget: '#F8FAFC',
            nodePulse: 'rgba(255, 255, 255, 0.4)',
            particleOk: '#F8FAFC',
            particleErr: '#EF4444'
        },
        light: {
            bg: '#E2E8F0',
            fog1: [255, 255, 255],
            fog2: [203, 213, 225],
            fogMode: 'screen',
            pathBase: 'rgba(15, 23, 42, 0.15)',
            pathTraced: '#0F172A',
            nodeBase: 'rgba(15, 23, 42, 0.3)',
            nodeTarget: '#0F172A',
            nodePulse: 'rgba(15, 23, 42, 0.4)',
            particleOk: '#0F172A',
            particleErr: '#DC2626'
        }
    };

    // --- State ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    let width, height;
    
    let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    let currentTheme = isDark ? THEMES.dark : THEMES.light;

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        isDark = e.matches;
        currentTheme = isDark ? THEMES.dark : THEMES.light;
    });

    let actx = null;
    let state = {
        mode: 'title', // title, playing, gameover
        health: 100,
        score: 0,
        orbits: 0,
        cameraY: 0,
        nodes: [],
        targetNodeIndex: 0,
        isHolding: false,
        touchX: 0,
        touchY: 0,
        windX: 0,
        windTarget: 0,
        graceTimer: 0,
        hasTouchedYet: false,
        lastTime: 0
    };

    let fogBlobs = [];
    let particles = [];
    let flashOpacity = 0;

    // --- Audio ---
    function initAudio() {
        if (!actx) {
            try {
                actx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        }
        if (actx && actx.state === 'suspended') {
            actx.resume();
        }
    }

    function playTone(type, pitchOffset = 0) {
        if (!actx || actx.state !== 'running') return;
        try {
            let osc = actx.createOscillator();
            let gain = actx.createGain();
            osc.connect(gain);
            gain.connect(actx.destination);
            let t = actx.currentTime;

            if (type === 'connect') {
                osc.type = 'sine';
                let baseFreq = 440 * Math.pow(1.05946, pitchOffset);
                osc.frequency.setValueAtTime(baseFreq, t);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 2, t + 0.1);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                osc.start(t);
                osc.stop(t + 0.3);
            } else if (type === 'orbit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, t);
                osc.frequency.linearRampToValueAtTime(880, t + 0.5);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.linearRampToValueAtTime(0, t + 1.0);
                osc.start(t);
                osc.stop(t + 1.0);
            } else if (type === 'err') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, t);
                osc.frequency.exponentialRampToValueAtTime(50, t + 0.2);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
                osc.start(t);
                osc.stop(t + 0.2);
            }
        } catch(e) {}
    }

    function haptic(type) {
        if (!navigator.vibrate) return;
        try {
            if (type === 'light') navigator.vibrate(10);
            if (type === 'heavy') navigator.vibrate(40);
            if (type === 'success') navigator.vibrate([20, 30, 20]);
        } catch(e) {}
    }

    // --- Math & World ---
    function rgba(arr, a) {
        return `rgba(${arr[0]},${arr[1]},${arr[2]},${a})`;
    }

    function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
    }

    function screenToWorld(y) {
        return y + state.cameraY;
    }

    function worldToScreen(y) {
        return y - state.cameraY;
    }

    function getPathX(worldY) {
        // Curve parameters
        let y = Math.abs(worldY);
        let cx = width / 2;
        
        let freq1 = 0.002;
        let amp1 = width * 0.15;
        let freq2 = 0.005;
        let amp2 = width * 0.1;
        
        let x = cx;
        x += Math.sin(y * freq1) * amp1;
        x += Math.cos(y * freq2) * amp2;
        x += state.windX;
        
        return clamp(x, width * 0.1, width * 0.9);
    }

    function addNode() {
        let lastY = state.nodes.length > 0 ? state.nodes[state.nodes.length - 1].worldY : 0;
        let newY = lastY - (CONFIG.nodeDistanceBase + Math.random() * 200 + (state.score * 10));
        state.nodes.push({ worldY: newY });
    }

    function spawnParticles(x, y, color, count, speed) {
        for(let i=0; i<count; i++) {
            let a = Math.random() * Math.PI * 2;
            let v = Math.random() * speed;
            particles.push({
                x: x, y: y,
                vx: Math.cos(a) * v,
                vy: Math.sin(a) * v,
                life: 1.0,
                color: color
            });
        }
    }

    // --- Logic ---
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        let dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        
        if (fogBlobs.length === 0) {
            for(let i=0; i<6; i++) {
                fogBlobs.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: width * 0.6 + Math.random() * width * 0.4,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20,
                    colorType: Math.random() > 0.5 ? 'fog1' : 'fog2'
                });
            }
        }
    }
    
    window.addEventListener('resize', resize);
    resize();

    window.startGame = function() {
        initAudio();
        state.mode = 'playing';
        state.health = 100;
        state.score = 0;
        state.orbits = 0;
        state.cameraY = -height * 0.8;
        state.nodes = [];
        state.targetNodeIndex = 0;
        state.isHolding = false;
        state.hasTouchedYet = false;
        state.windX = 0;
        state.windTarget = 0;
        state.graceTimer = 0;
        particles = [];
        
        state.nodes.push({ worldY: state.cameraY + height * 0.5 }); // First node
        for(let i=0; i<8; i++) addNode();

        document.getElementById('ui-start').style.display = 'none';
        document.getElementById('ui-gameover').style.display = 'none';
        document.getElementById('ui-hud').style.display = 'flex';
        updateHUD();
        
        state.lastTime = performance.now();
        requestAnimationFrame(loop);
    };

    function updateHUD() {
        document.getElementById('hud-orbit').innerText = `ORBIT: ${state.orbits}`;
        document.getElementById('hud-chain').innerText = `CHAIN: ${state.score}`;
    }

    function doOrbitComplete() {
        state.orbits++;
        state.health = 100;
        flashOpacity = 1.0;
        state.windX = 0;
        state.windTarget = 0;
        playTone('orbit');
        haptic('success');
        updateHUD();
    }

    function triggerGameOver() {
        state.mode = 'gameover';
        document.getElementById('ui-hud').style.display = 'none';
        document.getElementById('ui-gameover').style.display = 'flex';
        document.getElementById('final-stats').innerHTML = `ORBITS: ${state.orbits}<br>CONNECTIONS: ${state.score}`;
        haptic('heavy');
        playTone('err');
    }

    // --- Input ---
    function handleDown(e) {
        if (state.mode !== 'playing') return;
        let evt = e.touches ? e.touches[0] : e;
        state.isHolding = true;
        state.hasTouchedYet = true;
        state.touchX = evt.clientX;
        state.touchY = evt.clientY;
    }
    
    function handleMove(e) {
        if (!state.isHolding || state.mode !== 'playing') return;
        let evt = e.touches ? e.touches[0] : e;
        state.touchX = evt.clientX;
        state.touchY = evt.clientY;
    }

    function handleUp(e) {
        if (state.mode !== 'playing' || !state.isHolding) return;
        state.isHolding = false;

        let targetNode = state.nodes[state.targetNodeIndex];
        if (!targetNode) return;
        
        let tx = getPathX(targetNode.worldY);
        let ty = worldToScreen(targetNode.worldY);
        
        let ax = state.touchX;
        let ay = state.touchY - CONFIG.touchOffsetY;
        
        let dist = Math.hypot(ax - tx, ay - ty);
        
        if (dist <= CONFIG.nodeRadius) {
            // Success
            state.score++;
            state.health = Math.min(100, state.health + 20);
            state.targetNodeIndex++;
            state.graceTimer = CONFIG.gracePeriod;
            spawnParticles(tx, ty, currentTheme.particleOk, 20, 150);
            playTone('connect', (state.score % 5) * 2);
            haptic('light');
            updateHUD();
            
            if (state.score % 5 === 0) {
                doOrbitComplete();
            }
        } else {
            // Missed node on release
            state.health -= CONFIG.healthPenaltyMissRelease;
            spawnParticles(ax, ay, currentTheme.particleErr, 10, 100);
            playTone('err');
            haptic('light');
        }
    }

    canvas.addEventListener('pointerdown', handleDown);
    canvas.addEventListener('pointermove', handleMove);
    canvas.addEventListener('pointerup', handleUp);
    canvas.addEventListener('pointercancel', handleUp);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); handleDown(e); }, {passive: false});
    canvas.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e); }, {passive: false});
    canvas.addEventListener('touchend', handleUp, {passive: false});
    canvas.addEventListener('touchcancel', handleUp, {passive: false});

    // --- Loop ---
    function loop(time) {
        let dt = (time - state.lastTime) / 1000;
        state.lastTime = time;
        if (dt > 0.1) dt = 0.1; // clamp for lag

        update(dt);
        draw();
        
        requestAnimationFrame(loop);
    }

    function update(dt) {
        // Fog animation
        fogBlobs.forEach(b => {
            b.x += (b.vx + (state.mode === 'playing' ? state.windX * 0.5 : 0)) * dt;
            b.y += b.vy * dt;
            if (b.x > width + b.r) b.x = -b.r;
            if (b.x < -b.r) b.x = width + b.r;
            if (b.y > height + b.r) b.y = -b.r;
            if (b.y < -b.r) b.y = height + b.r;
        });

        // Particles
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2.0;
            if (p.life <= 0) particles.splice(i, 1);
        }

        if (flashOpacity > 0) flashOpacity = Math.max(0, flashOpacity - dt * 2.0);

        if (state.mode !== 'playing') {
            document.getElementById('flasher').style.opacity = flashOpacity;
            return;
        }

        // Wind
        if (Math.random() < dt * 0.5) {
            let intensity = Math.min(1.0, state.score / 20.0);
            state.windTarget = (Math.random() - 0.5) * width * (0.1 + 0.3 * intensity);
        }
        state.windX += (state.windTarget - state.windX) * dt * 0.5;

        // Camera
        let currentScrollSpeed = CONFIG.scrollSpeedBase + (state.score * 8);
        currentScrollSpeed = Math.min(currentScrollSpeed, CONFIG.scrollSpeedMax);
        
        if (state.graceTimer > 0) {
            state.graceTimer -= dt;
            currentScrollSpeed *= 0.15; // Slow mo
        }

        state.cameraY -= currentScrollSpeed * dt;

        // Check node bounds
        let targetNode = state.nodes[state.targetNodeIndex];
        if (targetNode) {
            let ty = worldToScreen(targetNode.worldY);
            if (ty > height + 100) {
                // Node missed entirely
                state.health -= CONFIG.healthPenaltyMissNode;
                state.targetNodeIndex++;
                let tx = getPathX(targetNode.worldY);
                spawnParticles(tx, height, currentTheme.particleErr, 30, 200);
                playTone('err');
                haptic('heavy');
            }
        }

        // Ensure nodes
        while (state.nodes.length < state.targetNodeIndex + 5) {
            addNode();
        }

        // Health logic
        let onPath = false;
        let currentSafeRadius = Math.max(25, CONFIG.safeRadiusBase - (state.score * 0.5));

        if (state.hasTouchedYet && state.graceTimer <= 0) {
            if (!state.isHolding) {
                state.health -= CONFIG.healthDrainNoTouch * dt;
            } else {
                let ax = state.touchX;
                let ay = state.touchY - CONFIG.touchOffsetY;
                let pathXAtAgent = getPathX(screenToWorld(ay));
                
                if (Math.abs(ax - pathXAtAgent) <= currentSafeRadius) {
                    onPath = true;
                    state.health += CONFIG.healthRegenOnPath * dt;
                } else {
                    state.health -= CONFIG.healthDrainOffPath * dt;
                    if (Math.random() < 0.1) spawnParticles(ax, ay, currentTheme.particleErr, 1, 50);
                }
            }
        }

        state.health = Math.max(0, Math.min(100, state.health));
        
        document.getElementById('dimmer').style.opacity = (1.0 - state.health / 100).toString();
        document.getElementById('flasher').style.opacity = flashOpacity;

        if (state.health <= 0) {
            triggerGameOver();
        }
    }

    function draw() {
        ctx.fillStyle = currentTheme.bg;
        ctx.fillRect(0, 0, width, height);

        // Fog
        ctx.globalCompositeOperation = currentTheme.fogMode;
        fogBlobs.forEach(b => {
            let grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
            let colorStr = currentTheme[b.colorType];
            grad.addColorStop(0, rgba(colorStr, 0.5));
            grad.addColorStop(1, rgba(colorStr, 0));
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalCompositeOperation = 'source-over';

        if (state.mode === 'title') return;

        // Path Base
        ctx.beginPath();
        let step = 20;
        let startScreenY = Math.min(height, worldToScreen((state.nodes[Math.max(0, state.targetNodeIndex-1)] || {worldY:0}).worldY));
        for (let y = height; y >= -50; y -= step) {
            let wy = screenToWorld(y);
            let px = getPathX(wy);
            if (y === height) ctx.moveTo(px, y);
            else ctx.lineTo(px, y);
        }
        ctx.strokeStyle = currentTheme.pathBase;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        // Traced Path
        if (state.isHolding) {
            let ay = state.touchY - CONFIG.touchOffsetY;
            let sy = Math.max(0, Math.min(height, startScreenY));
            let ey = Math.max(0, Math.min(height, ay));
            
            if (sy >= ey) {
                ctx.beginPath();
                for (let y = sy; y >= ey; y -= 10) {
                    let wy = screenToWorld(y);
                    let px = getPathX(wy);
                    if (y === sy) ctx.moveTo(px, y);
                    else ctx.lineTo(px, y);
                }
                ctx.strokeStyle = currentTheme.pathTraced;
                ctx.lineWidth = 4;
                ctx.stroke();
                
                // Agent cursor
                let ax = state.touchX;
                ctx.beginPath();
                ctx.arc(ax, ay, 8, 0, Math.PI*2);
                ctx.fillStyle = currentTheme.pathTraced;
                ctx.fill();
                
                let safeR = Math.max(25, CONFIG.safeRadiusBase - (state.score * 0.5));
                ctx.beginPath();
                ctx.arc(ax, ay, safeR, 0, Math.PI*2);
                let onPath = Math.abs(ax - getPathX(screenToWorld(ay))) <= safeR;
                ctx.strokeStyle = onPath ? rgba([255,255,255], 0.3) : rgba([255,0,0], 0.4);
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Nodes
        for (let i = Math.max(0, state.targetNodeIndex - 1); i < state.nodes.length; i++) {
            let n = state.nodes[i];
            let ty = worldToScreen(n.worldY);
            if (ty > height + 100 || ty < -100) continue;
            
            let tx = getPathX(n.worldY);
            let isTarget = (i === state.targetNodeIndex);
            
            ctx.beginPath();
            ctx.arc(tx, ty, 6, 0, Math.PI*2);
            ctx.fillStyle = isTarget ? currentTheme.nodeTarget : currentTheme.nodeBase;
            ctx.fill();

            if (isTarget) {
                let pulse = CONFIG.nodeRadius + Math.sin(performance.now() * 0.005) * 8;
                ctx.beginPath();
                ctx.arc(tx, ty, pulse, 0, Math.PI*2);
                ctx.strokeStyle = currentTheme.nodePulse;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // If holding and in range, emphasize
                if (state.isHolding) {
                    let ax = state.touchX;
                    let ay = state.touchY - CONFIG.touchOffsetY;
                    if (Math.hypot(ax - tx, ay - ty) <= CONFIG.nodeRadius) {
                        ctx.beginPath();
                        ctx.arc(tx, ty, CONFIG.nodeRadius, 0, Math.PI*2);
                        ctx.fillStyle = rgba([255,255,255], 0.2);
                        ctx.fill();
                    }
                }
            }
        }

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    // Initial draw
    requestAnimationFrame((t) => { state.lastTime = t; loop(t); });

</script>
</body>
</html>
