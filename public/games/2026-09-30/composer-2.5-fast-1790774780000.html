<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coolant Route</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8ebe6;--surface:#f4f6f2;--text:#1a5c1a;--text-dim:#5a8a5a;
  --accent:#008833;--accent-dim:#006622;--danger:#cc2233;--warn:#cc8800;
  --lane:#d8ddd4;--hud-bg:rgba(244,246,242,.9);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a0c0a;--surface:#111411;--text:#8aff8a;--text-dim:#3d6b3d;
    --accent:#00ff66;--accent-dim:#00cc52;--danger:#ff3344;--warn:#ffaa00;
    --lane:#1a221a;--hud-bg:rgba(10,12,10,.85);
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8ebe6;--surface:#f4f6f2;--text:#1a5c1a;--text-dim:#5a8a5a;
    --accent:#008833;--accent-dim:#006622;--danger:#cc2233;--warn:#cc8800;
    --lane:#d8ddd4;--hud-bg:rgba(244,246,242,.9);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
  background:var(--hud-bg);border-bottom:1px solid var(--text-dim);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;z-index:2;flex-shrink:0}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:9px;color:var(--text-dim)}
.hud-value{font-size:15px;color:var(--accent);font-weight:700}
#temp-bar-wrap{flex:1;max-width:140px;margin:0 12px}
#temp-bar{height:6px;background:var(--lane);border:1px solid var(--text-dim);border-radius:2px;overflow:hidden}
#temp-fill{height:100%;width:0%;background:var(--accent);transition:background .2s}
#temp-fill.hot{background:var(--warn)}
#temp-fill.critical{background:var(--danger)}
#game-area{flex:1;position:relative;overflow:hidden;user-select:none}
#canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;z-index:3;
  background:rgba(232,235,230,.82);transition:opacity .35s}
@media(prefers-color-scheme:dark){
  .overlay{background:rgba(10,12,10,.72)}
}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-title{font-size:clamp(22px,6vw,32px);letter-spacing:.15em;color:var(--accent);
  margin-bottom:6px;text-shadow:0 0 20px rgba(0,255,102,.3)}
.overlay-sub{font-size:11px;color:var(--text-dim);letter-spacing:.06em;
  text-align:center;max-width:280px;line-height:1.6;margin-bottom:28px}
.btn{pointer-events:auto;min-height:48px;min-width:160px;padding:14px 32px;
  border:1px solid var(--accent);background:transparent;color:var(--accent);
  font-family:inherit;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;border-radius:2px;transition:background .15s,color .15s,transform .1s}
.btn:active{transform:scale(.96)}
.btn:hover,.btn:focus-visible{background:var(--accent);color:var(--bg);outline:none}
#gameover-stats{font-size:12px;color:var(--text);margin-bottom:20px;text-align:center;line-height:1.8}
#combo-pop{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:28px;color:var(--accent);opacity:0;pointer-events:none;z-index:4;
  text-shadow:0 0 12px rgba(0,255,102,.5);transition:none}
#swipe-hint{position:absolute;bottom:18%;left:0;right:0;text-align:center;
  font-size:10px;color:var(--text-dim);letter-spacing:.1em;pointer-events:none;
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Score</span><span class="hud-value" id="score-val">0000</span></div>
    <div id="temp-bar-wrap">
      <div class="hud-label" style="text-align:center;margin-bottom:3px">Rack Temp</div>
      <div id="temp-bar"><div id="temp-fill"></div></div>
    </div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Combo</span><span class="hud-value" id="combo-val">×1</span></div>
  </div>
  <div id="game-area">
    <canvas id="canvas"></canvas>
    <div id="combo-pop"></div>
    <div id="swipe-hint" class="hidden">← SWIPE LANES →</div>
    <div id="title-screen" class="overlay">
      <div class="overlay-title">COOLANT ROUTE</div>
      <div class="overlay-sub">Steer cold air through the rack.<br>Avoid heat blooms. Catch coolant.<br>One cycle before redline.</div>
      <button class="btn" data-smoke="start" id="btn-start">Init Cycle</button>
    </div>
    <div id="gameover-screen" class="overlay hidden">
      <div class="overlay-title" style="color:var(--danger)">REDLINE</div>
      <div id="gameover-stats"></div>
      <button class="btn" data-smoke="restart" id="btn-restart">Reboot Rack</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('score-val');
var comboEl = document.getElementById('combo-val');
var tempFill = document.getElementById('temp-fill');
var comboPop = document.getElementById('combo-pop');
var titleScreen = document.getElementById('title-screen');
var gameoverScreen = document.getElementById('gameover-screen');
var gameoverStats = document.getElementById('gameover-stats');
var swipeHint = document.getElementById('swipe-hint');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var LANES = 3;
var state = 'title';
var W = 300, H = 500;
var laneW = 100;
var playerLane = 1;
var playerLaneVis = 1;
var playerY = 0;
var scrollSpeed = 90;
var scrollY = 0;
var score = 0;
var combo = 0;
var maxCombo = 0;
var temp = 0;
var elapsed = 0;
var entities = [];
var particles = [];
var shakeT = 0;
var hitPause = 0;
var spawnTimer = 0;
var serverCount = 6;
var diagonalHeat = false;
var lastTime = 0;
var animId = 0;
var audioCtx = null;

var colors = {
  bg: '#0a0c0a', lane: '#1a221a', accent: '#00ff66', accentDim: '#00cc52',
  danger: '#ff3344', warn: '#ffaa00', text: '#8aff8a', textDim: '#3d6b3d', surface: '#111411'
};

function applyColorScheme(){
  var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(dark){
    colors = { bg:'#0a0c0a', lane:'#1a221a', accent:'#00ff66', accentDim:'#00cc52',
      danger:'#ff3344', warn:'#ffaa00', text:'#8aff8a', textDim:'#3d6b3d', surface:'#111411' };
  } else {
    colors = { bg:'#e8ebe6', lane:'#d8ddd4', accent:'#008833', accentDim:'#006622',
      danger:'#cc2233', warn:'#cc8800', text:'#1a5c1a', textDim:'#5a8a5a', surface:'#f4f6f2' };
  }
}

function resize(){
  if(!canvas) return;
  var area = document.getElementById('game-area');
  if(!area) return;
  var rect = area.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.floor(rect.width));
  H = Math.max(1, Math.floor(rect.height));
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  laneW = W / LANES;
  playerY = H * 0.78;
}

function laneX(l){ return l * laneW + laneW * 0.5; }

function initAudio(){
  try {
    if(typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
  } catch(e){ audioCtx = null; }
}

function playTone(freq, dur, vol){
  if(!audioCtx) return;
  try {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

function vibrate(ms){
  try { if(navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}

function resetGame(){
  playerLane = 1;
  playerLaneVis = 1;
  scrollSpeed = 90;
  scrollY = 0;
  score = 0;
  combo = 0;
  maxCombo = 0;
  temp = 8;
  elapsed = 0;
  entities = [];
  particles = [];
  shakeT = 0;
  hitPause = 0;
  spawnTimer = 0;
  serverCount = 6;
  diagonalHeat = false;
  updateHUD();
}

function startGame(){
  resetGame();
  state = 'playing';
  titleScreen.classList.add('hidden');
  gameoverScreen.classList.add('hidden');
  swipeHint.classList.remove('hidden');
  setTimeout(function(){ swipeHint.classList.add('hidden'); }, 4000);
  playTone(440, 0.12, 0.06);
  lastTime = performance.now();
  if(animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

function endGame(){
  state = 'gameover';
  gameoverScreen.classList.remove('hidden');
  swipeHint.classList.add('hidden');
  gameoverStats.innerHTML = 'Final Score: <strong>' + score + '</strong><br>Max Combo: ×' + maxCombo + '<br>Cycle Time: ' + Math.floor(elapsed) + 's';
  playTone(110, 0.4, 0.1);
  vibrate(120);
}

function updateHUD(){
  if(scoreEl) scoreEl.textContent = String(score).padStart(4, '0');
  if(comboEl) comboEl.textContent = '×' + Math.max(1, combo);
  if(tempFill){
    tempFill.style.width = Math.min(100, temp) + '%';
    tempFill.className = temp > 75 ? 'critical' : temp > 50 ? 'hot' : '';
  }
}

function showComboPop(text){
  if(!comboPop) return;
  comboPop.textContent = text;
  comboPop.style.opacity = '1';
  comboPop.style.transform = 'translate(-50%,-60%) scale(1.2)';
  setTimeout(function(){
    comboPop.style.opacity = '0';
    comboPop.style.transform = 'translate(-50%,-50%) scale(1)';
  }, 500);
}

function spawnEntity(){
  var lane = Math.floor(Math.random() * LANES);
  var r = Math.random();
  var type;
  if(r < 0.32) type = 'coolant';
  else if(r < 0.52) type = 'heat';
  else if(r < 0.72) type = 'server';
  else type = 'power';

  entities.push({
    type: type,
    lane: lane,
    y: -40,
    w: laneW * 0.55,
    h: laneW * 0.55,
    collected: false,
    activated: false,
    pulse: Math.random() * Math.PI * 2,
    leakTimer: 0
  });
}

function addParticles(x, y, col, n){
  for(var i = 0; i < n; i++){
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 120,
      vy: (Math.random() - 0.5) * 120 - 40,
      life: 0.4 + Math.random() * 0.3,
      maxLife: 0.7,
      color: col,
      size: 2 + Math.random() * 3
    });
  }
}

function switchLane(dir){
  if(state !== 'playing') return;
  var next = playerLane + dir;
  if(next >= 0 && next < LANES){
    playerLane = next;
    playTone(330 + playerLane * 40, 0.05, 0.04);
    addParticles(laneX(playerLaneVis), playerY, colors.accent, 6);
  }
}

function handleCollect(ent){
  if(ent.collected) return;
  ent.collected = true;
  if(ent.type === 'coolant'){
    combo++;
    if(combo > maxCombo) maxCombo = combo;
    var pts = 10 + combo * 3;
    score += pts;
    temp = Math.max(0, temp - 6);
    addParticles(laneX(ent.lane), ent.y, colors.accent, 12);
    playTone(520 + combo * 20, 0.08, 0.06);
    if(combo >= 3 && combo % 3 === 0) showComboPop('×' + combo + ' FLOW');
    vibrate(15);
  } else if(ent.type === 'heat'){
    combo = 0;
    temp += 14;
    shakeT = 0.25;
    hitPause = 0.08;
    addParticles(laneX(ent.lane), ent.y, colors.danger, 16);
    playTone(150, 0.15, 0.1);
    vibrate(40);
  } else if(ent.type === 'power'){
    combo = 0;
    temp += 22;
    shakeT = 0.35;
    hitPause = 0.12;
    addParticles(laneX(ent.lane), ent.y, colors.warn, 20);
    playTone(100, 0.2, 0.12);
    vibrate(60);
  } else if(ent.type === 'server'){
    score += 5;
    temp = Math.max(0, temp - 2);
    addParticles(laneX(ent.lane), ent.y, colors.textDim, 8);
    playTone(400, 0.06, 0.04);
  }
  updateHUD();
}

function update(dt){
  if(state !== 'playing') return;
  playerLaneVis += (playerLane - playerLaneVis) * Math.min(1, dt * 14);
  if(hitPause > 0){ hitPause -= dt; return; }

  elapsed += dt;
  scrollY += scrollSpeed * dt;
  temp += (2.5 + elapsed * 0.04) * dt;
  spawnTimer -= dt;

  var spawnRate = Math.max(0.35, 1.1 - elapsed * 0.012);
  if(spawnTimer <= 0){
    spawnEntity();
    spawnTimer = spawnRate;
  }

  if(elapsed > 12 && serverCount < 14){
    serverCount = 14;
    for(var s = 0; s < 2; s++) spawnEntity();
  }
  if(elapsed > 22 && !diagonalHeat){
    diagonalHeat = true;
    scrollSpeed = 115;
  }
  if(elapsed > 35) scrollSpeed = 130 + (elapsed - 35) * 2;

  var i, ent, dx, hitDist;
  for(i = entities.length - 1; i >= 0; i--){
    ent = entities[i];
    ent.y += scrollSpeed * dt;
    ent.pulse += dt * 4;

    if(diagonalHeat && ent.type === 'heat' && !ent.collected){
      ent.leakTimer += dt;
      if(ent.leakTimer > 0.6){
        ent.leakTimer = 0;
        var adj = ent.lane + (Math.random() < 0.5 ? -1 : 1);
        if(adj >= 0 && adj < LANES && Math.random() < 0.35){
          entities.push({
            type: 'heat', lane: adj, y: ent.y,
            w: ent.w * 0.7, h: ent.h * 0.7,
            collected: false, activated: false,
            pulse: 0, leakTimer: 0, isLeak: true
          });
        }
      }
    }

    if(ent.type === 'power' && !ent.activated && ent.y > H * 0.15){
      ent.activated = true;
    }

    if(!ent.collected && ent.lane === playerLane){
      hitDist = Math.abs(ent.y - playerY);
      if(hitDist < (ent.h + 20) * 0.5){
        handleCollect(ent);
      }
    }

    if(ent.y > H + 60) entities.splice(i, 1);
  }

  for(i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 80 * dt;
    p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }

  if(shakeT > 0) shakeT -= dt;
  updateHUD();

  if(temp >= 100) endGame();
}

function drawRackBg(){
  ctx.fillStyle = colors.bg;
  ctx.fillRect(0, 0, W, H);

  var gridOff = scrollY % 48;
  ctx.strokeStyle = colors.lane;
  ctx.lineWidth = 1;
  for(var l = 1; l < LANES; l++){
    ctx.beginPath();
    ctx.moveTo(l * laneW, 0);
    ctx.lineTo(l * laneW, H);
    ctx.stroke();
  }
  ctx.globalAlpha = 0.35;
  for(var gy = -gridOff; gy < H; gy += 48){
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = colors.textDim;
  ctx.font = '9px ui-monospace, Menlo, monospace';
  for(var sl = 0; sl < LANES; sl++){
    ctx.fillText('CH-' + (sl + 1), sl * laneW + 6, 16);
  }
}

function drawEntity(ent){
  var x = laneX(ent.lane);
  var sz = ent.w * 0.5;
  var glow = 0.5 + Math.sin(ent.pulse) * 0.2;

  ctx.save();
  ctx.translate(x, ent.y);

  if(ent.type === 'coolant'){
    ctx.shadowColor = colors.accent;
    ctx.shadowBlur = 12 * glow;
    ctx.fillStyle = colors.accent;
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = colors.bg;
    ctx.font = 'bold 10px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('COOL', 0, 0);
  } else if(ent.type === 'heat'){
    ctx.shadowColor = colors.danger;
    ctx.shadowBlur = 14 * glow;
    ctx.fillStyle = colors.danger;
    ctx.globalAlpha = 0.85;
    for(var t = 0; t < 6; t++){
      var ang = t * Math.PI / 3 + ent.pulse * 0.5;
      ctx.beginPath();
      ctx.arc(Math.cos(ang) * sz * 0.3, Math.sin(ang) * sz * 0.3, sz * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  } else if(ent.type === 'server'){
    ctx.fillStyle = colors.surface;
    ctx.strokeStyle = colors.textDim;
    ctx.lineWidth = 1;
    ctx.fillRect(-sz * 0.5, -sz * 0.35, sz, sz * 0.7);
    ctx.strokeRect(-sz * 0.5, -sz * 0.35, sz, sz * 0.7);
    ctx.fillStyle = colors.accentDim;
    for(var led = 0; led < 3; led++){
      ctx.fillRect(-sz * 0.35 + led * sz * 0.22, -sz * 0.15, sz * 0.1, sz * 0.1);
    }
  } else if(ent.type === 'power'){
    var showDanger = ent.activated;
    ctx.fillStyle = colors.surface;
    ctx.strokeStyle = showDanger ? colors.warn : colors.textDim;
    ctx.lineWidth = showDanger ? 2 : 1;
    ctx.fillRect(-sz * 0.5, -sz * 0.35, sz, sz * 0.7);
    ctx.strokeRect(-sz * 0.5, -sz * 0.35, sz, sz * 0.7);
    if(showDanger){
      ctx.shadowColor = colors.warn;
      ctx.shadowBlur = 16;
      ctx.fillStyle = colors.warn;
      ctx.font = 'bold 9px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('DRAW', 0, 4);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = colors.textDim;
      ctx.font = '9px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('???', 0, 4);
    }
  }

  if(ent.isLeak){
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = colors.danger;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.55, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawPlayer(){
  var x = laneX(playerLaneVis);
  ctx.save();
  ctx.translate(x, playerY);

  ctx.shadowColor = colors.accent;
  ctx.shadowBlur = 20;
  ctx.strokeStyle = colors.accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(-14, 10);
  ctx.lineTo(0, 4);
  ctx.lineTo(14, 10);
  ctx.closePath();
  ctx.stroke();
  ctx.fillStyle = colors.accent;
  ctx.globalAlpha = 0.25;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  ctx.fillStyle = colors.accent;
  ctx.font = '8px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('AIR', 0, 22);

  ctx.restore();
}

function drawParticles(){
  var i, p, a;
  for(i = 0; i < particles.length; i++){
    p = particles[i];
    a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawScanlines(){
  ctx.globalAlpha = 0.04;
  ctx.fillStyle = colors.text;
  for(var sy = 0; sy < H; sy += 3){
    ctx.fillRect(0, sy, W, 1);
  }
  ctx.globalAlpha = 1;
}

function render(){
  if(!ctx) return;
  var sx = 0, sy = 0;
  if(shakeT > 0){
    sx = (Math.random() - 0.5) * 8;
    sy = (Math.random() - 0.5) * 8;
  }
  ctx.save();
  ctx.translate(sx, sy);
  drawRackBg();

  var i;
  for(i = 0; i < entities.length; i++) drawEntity(entities[i]);
  drawPlayer();
  drawParticles();
  drawScanlines();
  ctx.restore();
}

function drawIdle(){
  if(!ctx) return;
  applyColorScheme();
  drawRackBg();
  ctx.fillStyle = colors.textDim;
  ctx.font = '11px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('RACK STANDBY — ' + serverCount + ' UNITS', W * 0.5, H * 0.42);
  drawScanlines();
}

function loop(now){
  var dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  applyColorScheme();
  if(state === 'playing'){
    update(dt);
    render();
    animId = requestAnimationFrame(loop);
  }
}

/* Touch / swipe */
var touchStartX = 0, touchStartY = 0, touchTime = 0;

function onTouchStart(e){
  if(e.target.closest && e.target.closest('button')) return;
  e.preventDefault();
  var t = e.changedTouches ? e.changedTouches[0] : e.touches[0];
  if(!t) return;
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchTime = Date.now();
}

function onTouchEnd(e){
  if(e.target.closest && e.target.closest('button')) return;
  e.preventDefault();
  var t = e.changedTouches ? e.changedTouches[0] : null;
  if(!t) return;
  var dx = t.clientX - touchStartX;
  var dy = t.clientY - touchStartY;
  var elapsedSwipe = Date.now() - touchTime;
  if(Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) && elapsedSwipe < 400){
    switchLane(dx > 0 ? 1 : -1);
  }
}

function onKeyDown(e){
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') switchLane(-1);
  else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') switchLane(1);
}

if(btnStart) btnStart.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});
if(btnRestart) btnRestart.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

if(canvas){
  canvas.addEventListener('touchstart', onTouchStart, {passive:false});
  canvas.addEventListener('touchend', onTouchEnd, {passive:false});
  canvas.addEventListener('mousedown', function(e){
    touchStartX = e.clientX;
    touchStartY = e.clientY;
    touchTime = Date.now();
  });
  canvas.addEventListener('mouseup', function(e){
    var dx = e.clientX - touchStartX;
    var dy = e.clientY - touchStartY;
    if(Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) switchLane(dx > 0 ? 1 : -1);
  });
}

document.addEventListener('keydown', onKeyDown);

window.addEventListener('resize', function(){
  resize();
  if(state !== 'playing') drawIdle();
});

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){
    applyColorScheme();
    if(state !== 'playing') drawIdle(); else render();
  });
}

initAudio();
applyColorScheme();
resize();
drawIdle();

})();
</script>
</body>
</html>
