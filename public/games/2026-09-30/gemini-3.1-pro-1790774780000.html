<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>September Mist</title>
<style>
  :root {
    --bg: #050505;
    --fg: #e0e0e0;
    --grid: #00ffff;
    --grid-dim: rgba(0, 255, 255, 0.2);
    --node: #0088ff;
    --node-flash: #00ffff;
    --node-decoy: #ff4400;
    --ui-bg: rgba(5, 5, 5, 0.7);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #050505;
      --fg: #e0e0e0;
      --grid: #00ffff;
      --grid-dim: rgba(0, 255, 255, 0.2);
      --node: #0088ff;
      --node-flash: #00ffff;
      --node-decoy: #ff4400;
      --ui-bg: rgba(5, 5, 5, 0.7);
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f0f0;
      --fg: #111111;
      --grid: #0066cc;
      --grid-dim: rgba(0, 102, 204, 0.2);
      --node: #0044aa;
      --node-flash: #0066cc;
      --node-decoy: #cc3300;
      --ui-bg: rgba(240, 240, 240, 0.7);
    }
  }
  body, html {
    margin: 0;
    padding: 0;
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
  }
  .screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--ui-bg);
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .screen h1, .screen p {
    pointer-events: none;
  }
  .screen:not(.hidden) button {
    pointer-events: auto;
  }
  .hidden {
    opacity: 0;
    pointer-events: none !important;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: center;
    text-shadow: 0 0 10px var(--grid);
    color: var(--grid);
  }
  p {
    font-size: 1rem;
    margin-bottom: 2.5rem;
    text-align: center;
    max-width: 80%;
    line-height: 1.6;
  }
  button {
    background: var(--bg);
    color: var(--fg);
    border: 2px solid var(--grid);
    padding: 1rem 2.5rem;
    font-size: 1.2rem;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    outline: none;
    transition: all 0.2s;
    box-shadow: 0 0 10px var(--grid-dim);
  }
  button:active {
    background: var(--grid);
    color: var(--bg);
  }
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 1.5rem;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 1.2rem;
    z-index: 10;
    text-shadow: 0 0 5px var(--bg);
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="hud" class="hidden">
    <div id="scoreDisplay">SCORE: 0</div>
    <div id="levelDisplay">LVL: 1</div>
  </div>

  <div id="ui-layer">
    <div id="startScreen" class="screen">
      <h1>September Mist</h1>
      <p>A foggy horizon flashes future glimpses.<br><br>Tap them back in order before the mist erases the vision.</p>
      <button data-smoke="start" id="startBtn">Initiate</button>
    </div>
    
    <div id="gameOverScreen" class="screen hidden">
      <h1>Vision Lost</h1>
      <p id="finalScore">Score: 0<br>Level: 1</p>
      <button data-smoke="restart" id="restartBtn">Replay</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let width, height, horizonY;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      horizonY = height * 0.35;
    }
    window.addEventListener('resize', resize);
    resize();

    const colors = {
      bg: '#050505', fg: '#e0e0e0', grid: '#00ffff', gridDim: 'rgba(0, 255, 255, 0.2)',
      node: '#0088ff', nodeFlash: '#00ffff', nodeDecoy: '#ff4400'
    };

    function updateColors() {
      const isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      if (isLight) {
        colors.bg = '#f0f0f0'; colors.fg = '#111111'; colors.grid = '#0066cc';
        colors.gridDim = 'rgba(0, 102, 204, 0.2)'; colors.node = '#0044aa';
        colors.nodeFlash = '#0066cc'; colors.nodeDecoy = '#cc3300';
      } else {
        colors.bg = '#050505'; colors.fg = '#e0e0e0'; colors.grid = '#00ffff';
        colors.gridDim = 'rgba(0, 255, 255, 0.2)'; colors.node = '#0088ff';
        colors.nodeFlash = '#00ffff'; colors.nodeDecoy = '#ff4400';
      }
    }
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateColors);
    }
    updateColors();

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(freq, type = 'sine') {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {}
    }

    const STATE_START = 0, STATE_OBSERVE = 1, STATE_RECALL = 2, STATE_GAMEOVER = 3;
    let state = STATE_START;
    let lastTime = performance.now();
    let observeTimer = 0, observeIndex = 0;
    let mistLevel = 0.5;
    let recallTimer = 0, recallTimeLimit = 0;
    let playerProgress = 0, score = 0, level = 1;
    let nodes = [], sequence = [], particles = [];

    function generateLevel(lvl) {
      nodes = []; sequence = [];
      let numNodes = Math.min(3 + Math.floor((lvl - 1) / 2), 8);
      let numDecoys = lvl > 2 ? Math.min(lvl - 2, 5) : 0;
      let totalNodes = numNodes + numDecoys;
      
      for (let i = 0; i < totalNodes; i++) {
        let node = createNode();
        if (node) {
          node.isDecoy = i >= numNodes;
          nodes.push(node);
          if (!node.isDecoy) sequence.push(node);
        }
      }
      sequence.sort(() => Math.random() - 0.5);
      
      let sortedNodes = [...nodes].sort((a, b) => a.x - b.x);
      for (let i = 0; i < sortedNodes.length; i++) {
        sortedNodes[i].key = (i + 1).toString();
      }
    }

    function createNode() {
      let attempts = 0;
      while (attempts < 200) {
        let minY = horizonY + 40;
        let maxY = height - 60;
        let y = minY + Math.random() * (maxY - minY);
        let x = 60 + Math.random() * (width - 120);
        let t = (y - horizonY) / (height - horizonY);
        let radius = 20 + t * 30;
        
        let overlap = false;
        for (let n of nodes) {
          let dx = n.x - x, dy = n.y - y;
          if (Math.sqrt(dx*dx + dy*dy) < radius + n.radius + 15) {
            overlap = true; break;
          }
        }
        if (!overlap) {
          return { x, y, radius, flashAmount: 0, isDecoy: false, tapped: false, isMistake: false, appearAmount: 0 };
        }
        attempts++;
      }
      return null;
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 15; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 50 + Math.random() * 100;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.0, color });
      }
    }

    function updateHUD() {
      document.getElementById('scoreDisplay').innerText = `SCORE: ${score}`;
      document.getElementById('levelDisplay').innerText = `LVL: ${level}`;
    }

    function gameOver() {
      state = STATE_GAMEOVER;
      document.getElementById('finalScore').innerHTML = `Score: ${score}<br>Level: ${level}`;
      document.getElementById('gameOverScreen').classList.remove('hidden');
      document.getElementById('hud').classList.add('hidden');
    }

    function startGame() {
      initAudio();
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      
      score = 0; level = 1; updateHUD();
      state = STATE_OBSERVE;
      mistLevel = 1; observeTimer = 1.0; observeIndex = 0;
      generateLevel(level);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    function handleNodeTap(n) {
      if (n === sequence[playerProgress]) {
        n.tapped = true; n.flashAmount = 1;
        playSound(600 + playerProgress * 100, 'sine');
        playerProgress++;
        spawnParticles(n.x, n.y, colors.nodeFlash);
        if (navigator.vibrate) try { navigator.vibrate(20); } catch(e){}
        
        if (playerProgress === sequence.length) {
          score += level * 100; level++; updateHUD();
          state = STATE_OBSERVE;
          mistLevel = 1; observeTimer = 1.0; observeIndex = 0;
          playSound(1000, 'triangle');
          setTimeout(() => generateLevel(level), 500);
        }
      } else {
        n.isMistake = true; n.tapped = true; n.flashAmount = 1;
        playSound(200, 'sawtooth');
        if (navigator.vibrate) try { navigator.vibrate([50, 50, 50]); } catch(e){}
        spawnParticles(n.x, n.y, colors.nodeDecoy);
        gameOver();
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      initAudio();
      if (state !== STATE_RECALL) return;
      
      let rect = canvas.getBoundingClientRect();
      let x = e.clientX - rect.left, y = e.clientY - rect.top;
      
      let tappedNode = null;
      for (let i = nodes.length - 1; i >= 0; i--) {
        let n = nodes[i];
        if (n.tapped || n.appearAmount <= 0) continue;
        let dx = n.x - x, dy = n.y - (n.y + (n.yOffset || 0));
        if (Math.sqrt(dx*dx + dy*dy) < n.radius + 20) {
          tappedNode = n; break;
        }
      }
      if (tappedNode) handleNodeTap(tappedNode);
    });

    window.addEventListener('keydown', (e) => {
      if (state !== STATE_RECALL) return;
      let n = nodes.find(n => n.key === e.key);
      if (n && !n.tapped && n.appearAmount > 0) handleNodeTap(n);
    });

    function drawGrid(ctx, w, h, hy, timeSec) {
      ctx.strokeStyle = colors.gridDim;
      ctx.lineWidth = 1;
      ctx.beginPath();
      let vpX = w / 2, vpY = hy, bottomSpacing = w / 10;
      for (let i = -20; i <= 20; i++) {
        ctx.moveTo(vpX, vpY); ctx.lineTo(vpX + i * bottomSpacing, h);
      }
      let numH = 25;
      for (let i = 0; i < numH; i++) {
        let t = (i + (timeSec % 1)) / numH; 
        let y = hy + Math.pow(t, 2) * (h - hy);
        ctx.moveTo(0, y); ctx.lineTo(w, y);
      }
      ctx.stroke();
      
      ctx.strokeStyle = colors.grid; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(w, hy); ctx.stroke();
      ctx.shadowColor = colors.grid; ctx.shadowBlur = 10; ctx.stroke(); ctx.shadowBlur = 0;
    }

    function drawMist(ctx, w, h, hy, lvl, timeSec) {
      let bgRgb = colors.bg === '#050505' ? '5,5,5' : '240,240,240';
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, w, hy - 50);
      
      let grad = ctx.createLinearGradient(0, hy - 50, 0, h);
      let opaqueStop = 0.1 + lvl * 0.9;
      grad.addColorStop(0, `rgba(${bgRgb}, 1)`);
      grad.addColorStop(Math.min(1, opaqueStop), `rgba(${bgRgb}, 1)`);
      grad.addColorStop(1, `rgba(${bgRgb}, ${lvl})`);
      
      ctx.fillStyle = grad;
      ctx.fillRect(0, hy - 50, w, h - (hy - 50));
      
      ctx.globalAlpha = 0.05;
      ctx.fillStyle = colors.fg;
      for (let i = 0; i < 5; i++) {
        let y = hy + ((timeSec * 10 + i * 50) % (h - hy));
        let fh = 5 + Math.sin(timeSec + i) * 3;
        ctx.fillRect(0, y, w, fh);
      }
      ctx.globalAlpha = 1;
    }

    function update(time) {
      let dt = (time - lastTime) / 1000;
      lastTime = time;
      if (dt > 0.1) dt = 0.1;
      let timeSec = time / 1000;
      
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, width, height);
      drawGrid(ctx, width, height, horizonY, timeSec);
      
      if (state === STATE_OBSERVE) {
        mistLevel = Math.max(0, mistLevel - dt * 1.5);
        if (mistLevel === 0) {
          observeTimer -= dt;
          if (observeTimer <= 0) {
            if (observeIndex < sequence.length) {
              sequence[observeIndex].flashAmount = 1;
              playSound(400 + observeIndex * 50, 'sine');
              observeIndex++;
              observeTimer = 0.6;
            } else {
              state = STATE_RECALL;
              playerProgress = 0;
              recallTimeLimit = sequence.length * 1.2 + 2.0;
              recallTimer = recallTimeLimit;
            }
          }
        }
        for (let n of nodes) {
          if (!n.isDecoy) n.appearAmount = Math.min(1, n.appearAmount + dt * 2);
        }
      } else if (state === STATE_RECALL) {
        recallTimer -= dt;
        mistLevel = 1 - (recallTimer / recallTimeLimit);
        for (let n of nodes) {
          if (n.isDecoy) n.appearAmount = Math.min(1, n.appearAmount + dt * 2);
        }
        if (recallTimer <= 0) gameOver();
      } else if (state === STATE_GAMEOVER) {
        mistLevel = Math.min(1, mistLevel + dt * 2);
      }
      
      nodes.sort((a, b) => a.y - b.y);
      
      for (let n of nodes) {
        if (n.flashAmount > 0) n.flashAmount = Math.max(0, n.flashAmount - dt * 2);
        n.yOffset = Math.sin(timeSec * 2 + n.x) * 5;
        
        if (n.appearAmount <= 0) continue;
        ctx.save();
        ctx.translate(n.x, n.y + n.yOffset);
        let scale = 1 + n.flashAmount * 0.3;
        ctx.scale(scale, scale);
        
        ctx.beginPath();
        ctx.moveTo(0, -n.radius); ctx.lineTo(n.radius, 0);
        ctx.lineTo(0, n.radius); ctx.lineTo(-n.radius, 0);
        ctx.closePath();
        
        let strokeColor = n.isMistake ? colors.nodeDecoy : colors.node;
        let fillColor = n.isMistake ? colors.nodeDecoy : colors.nodeFlash;
        
        if (n.tapped) {
          ctx.fillStyle = fillColor; ctx.shadowColor = fillColor; ctx.shadowBlur = 15; ctx.fill();
        } else {
          ctx.strokeStyle = strokeColor; ctx.lineWidth = 2;
          if (n.flashAmount > 0) {
            ctx.fillStyle = fillColor; ctx.globalAlpha = n.appearAmount * n.flashAmount; ctx.fill();
            ctx.globalAlpha = n.appearAmount; ctx.shadowColor = fillColor; ctx.shadowBlur = 15 * n.flashAmount;
          }
          ctx.stroke();
        }
        
        if (n.appearAmount > 0 && !n.tapped) {
          ctx.fillStyle = colors.fg; ctx.globalAlpha = n.appearAmount * 0.5;
          ctx.font = "12px ui-monospace, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(n.key, 0, 0); ctx.globalAlpha = 1;
        }
        ctx.restore();
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
        else {
          ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
          ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        }
      }
      ctx.globalAlpha = 1;
      
      drawMist(ctx, width, height, horizonY, mistLevel, timeSec);
      requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  </script>
</body>
</html>
