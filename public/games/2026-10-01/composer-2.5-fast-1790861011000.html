<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Ferry</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8ecef;--fg:#1a2329;--muted:#5a6b78;--accent:#c47a2c;--accent2:#3d6b7a;
  --panel:rgba(255,255,255,.88);--lane:rgba(90,107,120,.12);--hud-bg:rgba(255,255,255,.72);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1418;--fg:#e4eaef;--muted:#8a9bab;--accent:#e8a04a;--accent2:#5a9aaa;
    --panel:rgba(18,24,30,.92);--lane:rgba(138,155,171,.08);--hud-bg:rgba(18,24,30,.78);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{display:block;width:100%;flex:1;touch-action:none;user-select:none;background:var(--bg)}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.hud-val{font-size:20px;color:var(--fg);font-weight:600}
#combo{position:absolute;top:max(56px,calc(env(safe-area-inset-top)+44px));left:50%;
  transform:translateX(-50%);font-size:13px;color:var(--accent);opacity:0;transition:opacity .2s;
  pointer-events:none;z-index:2}
#combo.show{opacity:1}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;z-index:10;padding:24px;text-align:center}
.overlay.hidden{display:none}
.panel{background:var(--panel);border:1px solid var(--lane);border-radius:12px;padding:28px 24px;
  max-width:340px;width:100%;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.panel h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px;color:var(--fg)}
.panel .sub{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.panel .hint{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:160px;
  padding:12px 28px;border:none;border-radius:8px;background:var(--accent);color:#fff;
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.04em;cursor:pointer;
  pointer-events:auto;touch-action:manipulation;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.96);opacity:.9}
#goScore{font-size:28px;font-weight:600;color:var(--accent);margin:8px 0 16px}
#lives{display:flex;gap:4px;margin-top:4px}
.life{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.35}
.life.on{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-block">Score<div class="hud-val" id="scoreEl">0</div></div>
    <div class="hud-block" style="text-align:center">Time<div class="hud-val" id="timeEl">45</div></div>
    <div class="hud-block" style="text-align:right">Lives<div id="lives"></div></div>
  </div>
  <div id="combo"></div>
  <div class="overlay" id="titleScreen">
    <div class="panel">
      <h1>Fog Ferry</h1>
      <p class="sub">Steer through autumn fog. Catch lighthouse pulses before they fade — each one clears the gray and reveals the ghost skyline.</p>
      <button class="btn" data-smoke="start" id="startBtn">Cast Off</button>
      <p class="hint">Swipe left / right · Arrow keys on desktop</p>
    </div>
  </div>
  <div class="overlay hidden" id="gameOverScreen">
    <div class="panel">
      <h1>Lost in the Fog</h1>
      <div id="goScore">0</div>
      <p class="sub" id="goMsg">The bay swallowed your lantern.</p>
      <button class="btn" data-smoke="restart" id="restartBtn">Sail Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var scoreEl = document.getElementById('scoreEl');
var timeEl = document.getElementById('timeEl');
var comboEl = document.getElementById('combo');
var livesEl = document.getElementById('lives');
var titleScreen = document.getElementById('titleScreen');
var gameOverScreen = document.getElementById('gameOverScreen');
var goScore = document.getElementById('goScore');
var goMsg = document.getElementById('goMsg');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');

var W = 360, H = 640, DPR = 1;
var state = 'title';
var score = 0, combo = 0, maxCombo = 0, lives = 3, timeLeft = 45;
var laneCount = 3, ferryLane = 1, ferryX = 0, ferryTargetX = 0;
var ferryY = 0, laneW = 0;
var entities = [], particles = [], reveals = [], fogLayers = [];
var spawnT = 0, pulseT = 0, elapsed = 0, difficulty = 0;
var shakeT = 0, hitFlash = 0, comboShowT = 0;
var lastTs = 0, animId = 0;
var dark = false;
var audioCtx = null;

var skyline = [
  [0,.72],[.06,.7],[.1,.62],[.14,.64],[.18,.52],[.22,.54],[.26,.44],[.3,.46],
  [.34,.36],[.38,.5],[.42,.34],[.46,.48],[.5,.3],[.52,.32],[.54,.28],[.56,.32],
  [.58,.28],[.6,.32],[.62,.26],[.66,.38],[.7,.32],[.74,.4],[.78,.28],[.82,.36],
  [.86,.3],[.9,.42],[.94,.38],[1,.4],[1,.75],[0,.75]
];

function prefersDark(){
  try{return window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;}
  catch(e){return false;}
}

function initAudio(){
  if(audioCtx) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }catch(e){}
}

function playTone(freq, dur, vol, type){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){
  try{if(navigator.vibrate) navigator.vibrate(ms);}catch(e){}
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  var rect = canvas.getBoundingClientRect();
  W = Math.max(rect.width, 1);
  H = Math.max(rect.height, 1);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ferryY = H * 0.82;
  updateLaneGeom();
  initFogLayers();
}

function lanePad(){
  return W * (0.06 + difficulty * 0.1);
}

function updateLaneGeom(){
  var pad = lanePad();
  laneW = (W - pad * 2) / laneCount;
  ferryTargetX = pad + laneW * (ferryLane + 0.5);
  if(!ferryX) ferryX = ferryTargetX;
}

function initFogLayers(){
  fogLayers = [];
  for(var i = 0; i < 5; i++){
    fogLayers.push({
      y: Math.random() * H, speed: 8 + Math.random() * 18,
      alpha: 0.04 + Math.random() * 0.06, scale: 0.8 + Math.random() * 0.6
    });
  }
}

function resetGame(){
  score = 0; combo = 0; maxCombo = 0; lives = 3; timeLeft = 45;
  laneCount = 3; ferryLane = 1; difficulty = 0;
  entities = []; particles = []; reveals = [];
  spawnT = 0; pulseT = 0; elapsed = 0;
  shakeT = 0; hitFlash = 0; comboShowT = 0;
  ferryX = 0; updateLaneGeom();
  updateHUD();
}

function updateHUD(){
  scoreEl.textContent = String(score);
  timeEl.textContent = String(Math.ceil(timeLeft));
  livesEl.innerHTML = '';
  for(var i = 0; i < 3; i++){
    var d = document.createElement('div');
    d.className = 'life' + (i < lives ? ' on' : '');
    livesEl.appendChild(d);
  }
}

function showCombo(){
  if(combo < 2){ comboEl.classList.remove('show'); return; }
  comboEl.textContent = combo + '× pulse chain';
  comboEl.classList.add('show');
  comboShowT = 1.2;
}

function startGame(){
  resetGame();
  state = 'playing';
  titleScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  initAudio();
  lastTs = performance.now();
  if(!animId) loop(lastTs);
}

function endGame(reason){
  state = 'gameover';
  goScore.textContent = String(score);
  goMsg.textContent = reason || ('Best chain: ' + maxCombo + '× · Fog reclaimed the bay.');
  gameOverScreen.classList.remove('hidden');
}

function switchLane(dir){
  if(state !== 'playing') return;
  var nl = ferryLane + dir;
  if(nl < 0 || nl >= laneCount) return;
  ferryLane = nl;
  updateLaneGeom();
  playTone(220 + ferryLane * 40, 0.06, 0.04, 'triangle');
}

function spawnEntity(){
  var lane = Math.floor(Math.random() * laneCount);
  var isPulse = Math.random() < 0.62;
  var life = isPulse ? (2.8 - difficulty * 0.5) : 4;
  entities.push({
    type: isPulse ? 'pulse' : 'wreck',
    lane: lane,
    y: -40,
    life: life,
    maxLife: life,
    phase: Math.random() * Math.PI * 2,
    collected: false
  });
}

function laneCenter(lane){
  return lanePad() + laneW * (lane + 0.5);
}

function addParticles(x, y, col, n){
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 120;
    particles.push({
      x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 30,
      life:0.4 + Math.random()*0.5, max:0.9, col:col, r:2+Math.random()*3
    });
  }
}

function addReveal(x, y){
  reveals.push({x:x, y:y, r:0, maxR:W*0.45, life:2.5, max:2.5});
}

function collectPulse(ent){
  if(ent.collected) return;
  ent.collected = true;
  var pts = Math.floor(10 + combo * 3);
  score += pts;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  var cx = laneCenter(ent.lane);
  addParticles(cx, ent.y, dark ? '#e8a04a' : '#c47a2c', 16);
  addReveal(cx, ent.y);
  playTone(440 + combo * 30, 0.15, 0.1, 'sine');
  playTone(660 + combo * 20, 0.2, 0.06, 'triangle');
  vibrate(12);
  showCombo();
  updateHUD();
}

function hitWreck(){
  lives--;
  combo = 0;
  comboEl.classList.remove('show');
  shakeT = 0.35;
  hitFlash = 0.4;
  playTone(90, 0.25, 0.12, 'sawtooth');
  vibrate(40);
  updateHUD();
  if(lives <= 0) endGame('Your hull cracked on a hidden wreck.');
}

function update(dt){
  if(state !== 'playing') return;
  elapsed += dt;
  difficulty = Math.min(1, elapsed / 40);
  timeLeft -= dt;
  if(timeLeft <= 0){ endGame('Sunset reached the horizon — you made it through!'); return; }

  updateLaneGeom();

  ferryX += (ferryTargetX - ferryX) * Math.min(1, dt * 14);

  if(Math.random() < dt * 12){
    particles.push({
      x:ferryX + (Math.random()-0.5)*16, y:ferryY + 14,
      vx:(Math.random()-0.5)*20, vy:15+Math.random()*10,
      life:0.5, max:0.5, col:dark?'rgba(90,154,170,0.5)':'rgba(61,107,122,0.45)', r:2+Math.random()*2
    });
  }

  spawnT -= dt;
  var interval = Math.max(0.55, 1.4 - difficulty * 0.7);
  if(spawnT <= 0){ spawnEntity(); spawnT = interval; }

  pulseT -= dt;
  if(pulseT <= 0 && Math.random() < 0.3){
    entities.push({
      type:'pulse', lane:Math.floor(Math.random()*laneCount), y:-30,
      life:2.2 - difficulty*0.6, maxLife:2.2, phase:0, collected:false
    });
    pulseT = 2.5;
  }

  for(var i = entities.length - 1; i >= 0; i--){
    var e = entities[i];
    e.y += (80 + difficulty * 60) * dt;
    e.life -= dt;
    if(e.type === 'pulse' && !e.collected){
      var bright = Math.sin((1 - e.life/e.maxLife) * Math.PI);
      if(bright > 0.55 && Math.abs(ferryLane - e.lane) < 0.1 && Math.abs(e.y - ferryY) < 36){
        collectPulse(e);
      }
    }
    if(e.type === 'wreck' && Math.abs(ferryLane - e.lane) < 0.1 && Math.abs(e.y - ferryY) < 28){
      hitWreck();
      entities.splice(i, 1);
      continue;
    }
    if(e.y > H + 50 || e.life <= 0){
      if(e.type === 'pulse' && !e.collected && e.y > ferryY - 20) combo = 0;
      entities.splice(i, 1);
    }
  }

  for(var j = particles.length - 1; j >= 0; j--){
    var p = particles[j];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 80 * dt;
    if(p.life <= 0) particles.splice(j, 1);
  }

  for(var k = reveals.length - 1; k >= 0; k--){
    reveals[k].life -= dt;
    reveals[k].r = reveals[k].maxR * (1 - reveals[k].life / reveals[k].max);
    if(reveals[k].life <= 0) reveals.splice(k, 1);
  }

  for(var f = 0; f < fogLayers.length; f++){
    fogLayers[f].y += fogLayers[f].speed * dt;
    if(fogLayers[f].y > H + 100) fogLayers[f].y = -100;
  }

  if(shakeT > 0) shakeT -= dt;
  if(hitFlash > 0) hitFlash -= dt;
  if(comboShowT > 0){ comboShowT -= dt; if(comboShowT <= 0) comboEl.classList.remove('show'); }

  updateHUD();
}

function palette(){
  dark = prefersDark();
  return dark ? {
    sky1:'#141c24', sky2:'#1e2a34', fog:'rgba(180,195,210,',
    pulse:'#e8a04a', pulseGlow:'rgba(232,160,74,',
    wreck:'#3a4854', ferry:'#8aa0b0', ferryHull:'#5a7080',
    water:'#1a2830', skyline:'rgba(120,150,170,', accent:'#5a9aaa'
  } : {
    sky1:'#c8d4dc', sky2:'#dfe8ee', fog:'rgba(200,210,220,',
    pulse:'#c47a2c', pulseGlow:'rgba(196,122,44,',
    wreck:'#7a8a96', ferry:'#4a6270', ferryHull:'#2a4555',
    water:'#b0c4ce', skyline:'rgba(80,110,130,', accent:'#3d6b7a'
  };
}

function drawSkyline(pal, alpha){
  ctx.beginPath();
  for(var i = 0; i < skyline.length; i++){
    var px = skyline[i][0] * W;
    var py = H * 0.75 - skyline[i][1] * H * 0.35;
    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = pal.skyline + alpha + ')';
  ctx.fill();
}

function drawBackground(c){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, c.sky1);
  g.addColorStop(0.55, c.sky2);
  g.addColorStop(1, c.water);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.25 + difficulty * 0.2;
  drawSkyline(c, 0.35);
  ctx.restore();

  for(var r = 0; r < reveals.length; r++){
    var rev = reveals[r];
    var a = (rev.life / rev.max) * 0.7;
    ctx.save();
    ctx.beginPath();
    ctx.arc(rev.x, rev.y, rev.r, 0, Math.PI * 2);
    ctx.clip();
    ctx.globalAlpha = a;
    drawSkyline(c, 0.85);
    ctx.restore();
  }
}

function drawFog(c){
  var thick = 0.35 + difficulty * 0.35;
  ctx.save();
  for(var i = 0; i < fogLayers.length; i++){
    var fl = fogLayers[i];
    ctx.globalAlpha = fl.alpha + thick * 0.08;
    var grd = ctx.createRadialGradient(W*0.3, fl.y, 10, W*0.5, fl.y, W*fl.scale);
    grd.addColorStop(0, c.fog + '0.25)');
    grd.addColorStop(1, c.fog + '0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, fl.y - 80, W, 160);
  }
  ctx.globalAlpha = thick * 0.5;
  var topG = ctx.createLinearGradient(0, 0, 0, H);
  topG.addColorStop(0, c.fog + '0.55)');
  topG.addColorStop(0.4, c.fog + '0.15)');
  topG.addColorStop(1, c.fog + '0.05)');
  ctx.fillStyle = topG;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawLanes(c){
  var pad = lanePad();
  ctx.strokeStyle = dark ? 'rgba(138,155,171,0.12)' : 'rgba(90,107,120,0.15)';
  ctx.lineWidth = 1;
  for(var i = 1; i < laneCount; i++){
    var x = pad + laneW * i;
    ctx.beginPath();
    ctx.moveTo(x, H * 0.12);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
}

function drawEntities(c){
  for(var i = 0; i < entities.length; i++){
    var e = entities[i];
    var x = laneCenter(e.lane);
    if(e.type === 'pulse'){
      var t = 1 - e.life / e.maxLife;
      var bright = Math.sin(t * Math.PI);
      var r = 14 + bright * 10;
      ctx.save();
      ctx.globalAlpha = bright * 0.9 + 0.1;
      var pg = ctx.createRadialGradient(x, e.y, 0, x, e.y, r * 2.5);
      pg.addColorStop(0, c.pulseGlow + (0.6 * bright) + ')');
      pg.addColorStop(0.5, c.pulseGlow + (0.15 * bright) + ')');
      pg.addColorStop(1, c.pulseGlow + '0)');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(x, e.y, r * 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = c.pulse;
      ctx.beginPath();
      ctx.arc(x, e.y, r * 0.4, 0, Math.PI * 2);
      ctx.fill();
      for(var ring = 1; ring <= 3; ring++){
        ctx.strokeStyle = c.pulseGlow + (bright * 0.3 / ring) + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, e.y, r * (0.6 + ring * 0.35) + Math.sin(e.phase + elapsed * 4) * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = 0.5 + difficulty * 0.2;
      ctx.fillStyle = c.wreck;
      ctx.beginPath();
      ctx.moveTo(x - 18, e.y + 10);
      ctx.lineTo(x - 8, e.y - 14);
      ctx.lineTo(x + 12, e.y - 8);
      ctx.lineTo(x + 16, e.y + 12);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawFerry(c){
  var x = ferryX;
  var y = ferryY;
  ctx.save();
  ctx.translate(x, y);
  var bob = Math.sin(elapsed * 3) * 2;
  ctx.translate(0, bob);

  ctx.fillStyle = c.water;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.ellipse(0, 18, 28, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.fillStyle = c.ferryHull;
  ctx.beginPath();
  ctx.moveTo(-22, 8);
  ctx.quadraticCurveTo(-24, -2, -14, -6);
  ctx.lineTo(14, -6);
  ctx.quadraticCurveTo(24, -2, 22, 8);
  ctx.lineTo(18, 14);
  ctx.lineTo(-18, 14);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = c.ferry;
  ctx.fillRect(-3, -18, 6, 14);

  ctx.fillStyle = c.pulse;
  ctx.globalAlpha = 0.7 + Math.sin(elapsed * 5) * 0.2;
  ctx.beginPath();
  ctx.arc(0, -20, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawParticles(){
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function render(){
  var c = palette();
  var sx = 0, sy = 0;
  if(shakeT > 0){
    sx = (Math.random() - 0.5) * 8 * (shakeT / 0.35);
    sy = (Math.random() - 0.5) * 6 * (shakeT / 0.35);
  }
  ctx.save();
  ctx.translate(sx, sy);
  drawBackground(c);
  drawLanes(c);
  drawEntities(c);
  drawFerry(c);
  drawParticles();
  drawFog(c);
  if(hitFlash > 0){
    ctx.fillStyle = dark ? 'rgba(200,80,60,' + hitFlash * 0.3 + ')' : 'rgba(180,60,50,' + hitFlash * 0.25 + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function loop(ts){
  animId = requestAnimationFrame(loop);
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  if(state === 'playing') update(dt);
  else if(state === 'title'){ elapsed += dt * 0.3; }
  render();
}

/* Input */
var touchStartX = 0, touchStartY = 0, touchActive = false;

function onTouchStart(e){
  try{
    if(e.cancelable) e.preventDefault();
    var t = e.touches && e.touches[0];
    if(!t) return;
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchActive = true;
  }catch(err){}
}

function onTouchEnd(e){
  try{
    if(e.cancelable) e.preventDefault();
    if(!touchActive) return;
    touchActive = false;
    var t = e.changedTouches && e.changedTouches[0];
    if(!t) return;
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if(Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) switchLane(dx > 0 ? 1 : -1);
  }catch(err){}
}

function onKey(e){
  try{
    if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') switchLane(-1);
    if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') switchLane(1);
  }catch(err){}
}

canvas.addEventListener('touchstart', onTouchStart, {passive:false});
canvas.addEventListener('touchend', onTouchEnd, {passive:false});
canvas.addEventListener('touchcancel', onTouchEnd, {passive:false});
document.addEventListener('keydown', onKey);
startBtn.addEventListener('click', function(){ startGame(); });
restartBtn.addEventListener('click', function(){ startGame(); });

window.addEventListener('resize', resize);
try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(){ render(); });
  }
}catch(e){}

resize();
lastTs = performance.now();
animId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
