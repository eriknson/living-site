<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sync Threads</title>
<style>
    :root {
        --bg-rgb: 240, 240, 240;
        --text: #111;
        --btn-bg: #111;
        --btn-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg-rgb: 17, 17, 17;
            --text: #f0f0f0;
            --btn-bg: #f0f0f0;
            --btn-text: #111;
        }
    }
    body, html {
        margin: 0;
        padding: 0;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        background: rgb(var(--bg-rgb));
        color: var(--text);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
    #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: rgba(var(--bg-rgb), 0.85);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        pointer-events: none;
    }
    #hud {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        justify-content: flex-start;
    }
    h1 {
        font-size: 32px;
        letter-spacing: 4px;
        margin-bottom: 10px;
        font-weight: 800;
        text-transform: uppercase;
    }
    p {
        font-size: 16px;
        opacity: 0.7;
        max-width: 80%;
        line-height: 1.5;
    }
    button {
        pointer-events: auto;
        background: var(--text);
        color: rgb(var(--bg-rgb));
        border: 2px solid var(--text);
        border-radius: 4px;
        padding: 16px 40px;
        font-family: inherit;
        font-weight: bold;
        font-size: 18px;
        letter-spacing: 2px;
        cursor: pointer;
        text-transform: uppercase;
        margin-top: 40px;
        box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
        transition: transform 0.1s, box-shadow 0.1s;
    }
    @media (prefers-color-scheme: dark) {
        button {
            box-shadow: 4px 4px 0px rgba(255,255,255,0.2);
        }
    }
    button:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }
    .score, .level {
        position: absolute;
        top: 20px;
        font-size: 18px;
        font-weight: bold;
    }
    .score { left: 20px; }
    .level { right: 20px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-layer">
    <div id="start-screen" class="screen">
        <h1>SYNC THREADS</h1>
        <p>Hold to spawn agents.<br>Release when ALL reach the merge zone.</p>
        <button data-smoke="start" id="btn-start">START</button>
    </div>
    
    <div id="hud" class="screen" style="display: none;">
        <div class="score">Score: <span id="score-val">0</span></div>
        <div class="level">Level: <span id="level-val">1</span></div>
    </div>
    
    <div id="game-over-screen" class="screen" style="display: none;">
        <h1 id="game-over-reason">MERGE CONFLICT</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button data-smoke="restart" id="btn-restart">RESTART</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let state = 'START'; // START, IDLE, HOLDING, SUCCESS, GAMEOVER
let score = 0;
let level = 1;

let agents = [];
let slices = [];
let T_ring = 1.5;
let delta = 0.2;
let holdTime = 0;
let lastTime = performance.now();
let shakeTime = 0;
let flashTime = 0;
let successAnimTime = 0;

const safeColors = ['#00E5FF', '#FF007F', '#FFEA00', '#00E676', '#FF9100', '#2979FF'];

let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        isDark = e.matches;
    });
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio & Haptics
let audioCtx = null;
let holdOsc = null;

function initAudio() {
    if (!audioCtx) {
        let AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            audioCtx = new AudioContext();
        }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    let t = audioCtx.currentTime;
    if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.start(t);
        osc.stop(t + 0.3);
    } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.2);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        osc.start(t);
        osc.stop(t + 0.2);
    }
}

function playHoldSound() {
    if (!audioCtx) return;
    stopHoldSound();
    holdOsc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    holdOsc.connect(gain);
    gain.connect(audioCtx.destination);
    
    let t = audioCtx.currentTime;
    holdOsc.type = 'triangle';
    holdOsc.frequency.setValueAtTime(100, t);
    holdOsc.frequency.linearRampToValueAtTime(400, t + T_ring + delta);
    
    gain.gain.setValueAtTime(0.1, t);
    gain.gain.linearRampToValueAtTime(0.3, t + T_ring + delta);
    
    holdOsc.start(t);
}

function stopHoldSound() {
    if (holdOsc) {
        try { holdOsc.stop(); } catch(e) {}
        holdOsc = null;
    }
}

function vibrate(pattern) {
    if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch(e) {}
    }
}

// Particles & Text
let particles = [];
function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 15,
            vy: (Math.random() - 0.5) * 15,
            life: 1.0,
            color: color
        });
    }
}

let floatingTexts = [];
function addFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, color, life: 1.0 });
}

// Game Logic
function initLevel() {
    let N = Math.min(2 + Math.floor((level - 1) / 2), 6);
    T_ring = 1.0 + Math.random() * 0.5;
    delta = Math.max(0.06, 0.2 - (level - 1) * 0.015);
    
    slices = [];
    agents = [];
    
    let baseAngle = Math.random() * Math.PI * 2;
    let angles = [];
    for (let i = 0; i < N; i++) {
        angles.push(baseAngle + (i / N) * Math.PI * 2 + (Math.random() - 0.5) * (Math.PI * 2 / N) * 0.4);
    }
    angles.sort((a, b) => a - b);
    
    let cx = canvas.width / 2;
    let cy = canvas.height / 2;
    let maxDist = Math.sqrt(cx*cx + cy*cy) + 50;
    
    for (let i = 0; i < N; i++) {
        let a1 = angles[i];
        let a2 = angles[(i + 1) % N];
        if (i === N - 1) a2 += Math.PI * 2;
        
        slices.push({ a1: a1, a2: a2 });
        
        let midAngle = (a1 + a2) / 2;
        let startDist = maxDist * (0.8 + Math.random() * 0.4);
        let D_merge = 60;
        let V = (startDist - D_merge) / T_ring;
        
        agents.push({
            angle: midAngle,
            startDist: startDist,
            V: V,
            color: safeColors[i % safeColors.length]
        });
    }
    
    state = 'IDLE';
    holdTime = 0;
}

function updateHUD() {
    document.getElementById('score-val').innerText = score;
    document.getElementById('level-val').innerText = level;
}

function success() {
    state = 'SUCCESS';
    stopHoldSound();
    successAnimTime = 0;
    
    let diff = Math.abs(holdTime - T_ring);
    if (diff < 0.03) {
        score += 300;
        addFloatingText("PERFECT", canvas.width/2, canvas.height/2 - 40, '#00E676');
    } else {
        score += 100;
        addFloatingText("MERGED", canvas.width/2, canvas.height/2 - 40, '#00E5FF');
    }
    level++;
    updateHUD();
    
    playSound('success');
    vibrate([20, 30, 20]);
    flashTime = 0.2;
    createParticles(canvas.width/2, canvas.height/2, isDark ? '#fff' : '#000', 30);
    
    setTimeout(() => {
        if (state === 'SUCCESS') initLevel();
    }, 800);
}

function gameOver(reason) {
    state = 'GAMEOVER';
    stopHoldSound();
    playSound('error');
    vibrate(50);
    shakeTime = 0.4;
    
    for (let agent of agents) {
        agent.color = '#FF1744';
        let currentDist = agent.startDist - agent.V * holdTime;
        let x = canvas.width/2 + currentDist * Math.cos(agent.angle);
        let y = canvas.height/2 + currentDist * Math.sin(agent.angle);
        createParticles(x, y, '#FF1744', 15);
    }
    
    setTimeout(() => {
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('game-over-reason').innerText = reason;
        document.getElementById('final-score').innerText = score;
    }, 600);
}

function update(dt) {
    if (shakeTime > 0) shakeTime -= dt;
    if (flashTime > 0) flashTime -= dt;
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 50 * dt;
        ft.life -= dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
    
    if (state === 'HOLDING') {
        holdTime += dt;
        if (holdTime > T_ring + delta) {
            gameOver('CONFLICT');
        }
    } else if (state === 'SUCCESS') {
        successAnimTime += dt;
    }
}

function drawSlices() {
    let cx = canvas.width / 2;
    let cy = canvas.height / 2;
    let R = Math.sqrt(cx*cx + cy*cy) + 100;
    
    for (let i = 0; i < slices.length; i++) {
        let slice = slices[i];
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, slice.a1, slice.a2);
        ctx.closePath();
        
        let lightness = isDark ? 10 + (i % 3) * 3 : 96 - (i % 3) * 3;
        ctx.fillStyle = `hsl(0, 0%, ${lightness}%)`;
        
        ctx.shadowColor = isDark ? 'rgba(0,0,0,0.8)' : 'rgba(0,0,0,0.1)';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowColor = 'transparent';
        
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + R * Math.cos(slice.a1), cy + R * Math.sin(slice.a1));
        ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

function drawGrid() {
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
    ctx.lineWidth = 1;
    let step = 40;
    let cx = canvas.width / 2;
    let cy = canvas.height / 2;
    ctx.beginPath();
    for (let x = cx % step; x < canvas.width; x += step) {
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
    }
    for (let y = cy % step; y < canvas.height; y += step) {
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();
}

function drawPaths() {
    let cx = canvas.width / 2;
    let cy = canvas.height / 2;
    let D_merge = 60;
    let isInsideZone = (state === 'HOLDING' && holdTime >= T_ring - delta && holdTime <= T_ring + delta);
    
    for (let i = 0; i < agents.length; i++) {
        let agent = agents[i];
        let cosA = Math.cos(agent.angle);
        let sinA = Math.sin(agent.angle);
        
        ctx.beginPath();
        ctx.moveTo(cx + agent.startDist * cosA, cy + agent.startDist * sinA);
        ctx.lineTo(cx + D_merge * cosA, cy + D_merge * sinA);
        ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.stroke();
        ctx.setLineDash([]);
        
        let D_in = D_merge + agent.V * delta;
        let D_out = D_merge - agent.V * delta;
        
        ctx.beginPath();
        ctx.moveTo(cx + D_in * cosA, cy + D_in * sinA);
        ctx.lineTo(cx + D_out * cosA, cy + D_out * sinA);
        
        if (isInsideZone) {
            ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.8)';
            ctx.shadowColor = isDark ? '#fff' : '#000';
            ctx.shadowBlur = 10;
        } else {
            ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.2)';
            ctx.shadowColor = 'transparent';
        }
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.shadowColor = 'transparent';
        
        let perpX = -sinA * 8;
        let perpY = cosA * 8;
        ctx.beginPath();
        ctx.moveTo(cx + D_out * cosA + perpX, cy + D_out * sinA + perpY);
        ctx.lineTo(cx + D_out * cosA - perpX, cy + D_out * sinA - perpY);
        ctx.moveTo(cx + D_in * cosA + perpX, cy + D_in * sinA + perpY);
        ctx.lineTo(cx + D_in * cosA - perpX, cy + D_in * sinA - perpY);
        ctx.lineWidth = 3;
        ctx.stroke();
    }
}

function drawCenterNode() {
    let cx = canvas.width / 2;
    let cy = canvas.height / 2;
    let isInsideZone = (state === 'HOLDING' && holdTime >= T_ring - delta && holdTime <= T_ring + delta);
    
    ctx.save();
    ctx.translate(cx, cy);
    
    let scale = 1.0;
    if (state === 'HOLDING') {
        let progress = holdTime / T_ring;
        scale = 1.0 + 0.1 * Math.sin(progress * Math.PI * 4);
    } else if (state === 'SUCCESS') {
        scale = 1.3;
    }
    ctx.scale(scale, scale);
    
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(20, 0); ctx.lineTo(0, 20); ctx.lineTo(-20, 0);
    ctx.closePath();
    
    ctx.fillStyle = isDark ? '#222' : '#fff';
    ctx.shadowColor = isDark ? 'rgba(0,0,0,0.8)' : 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;
    
    if (isInsideZone) {
        ctx.shadowColor = isDark ? '#fff' : '#000';
        ctx.shadowBlur = 20;
    }
    ctx.fill();
    
    ctx.strokeStyle = isInsideZone ? (isDark ? '#fff' : '#000') : (isDark ? '#555' : '#ccc');
    ctx.lineWidth = 2;
    ctx.stroke();
    
    if (state === 'SUCCESS') {
        ctx.fillStyle = '#00E676';
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('OK', 0, 0);
    } else {
        ctx.fillStyle = isDark ? '#888' : '#888';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('</>', 0, 0);
    }
    ctx.restore();
}

function drawAgents() {
    let cx = canvas.width / 2;
    let cy = canvas.height / 2;
    
    for (let i = 0; i < agents.length; i++) {
        let agent = agents[i];
        let currentDist = agent.startDist;
        
        if (state === 'HOLDING' || state === 'GAMEOVER') {
            currentDist = agent.startDist - agent.V * holdTime;
        } else if (state === 'SUCCESS') {
            let t = Math.min(successAnimTime / 0.15, 1.0);
            t = 1 - Math.pow(1 - t, 3);
            currentDist = (agent.startDist - agent.V * holdTime) * (1 - t);
        }
        
        let x = cx + currentDist * Math.cos(agent.angle);
        let y = cy + currentDist * Math.sin(agent.angle);
        
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(agent.angle);
        
        ctx.beginPath();
        ctx.moveTo(-12, 0);
        ctx.lineTo(8, -8);
        ctx.lineTo(4, 0);
        ctx.lineTo(8, 8);
        ctx.closePath();
        
        ctx.fillStyle = agent.color;
        ctx.shadowColor = agent.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
        
        ctx.beginPath();
        ctx.moveTo(x, y);
        let tailDist = currentDist + agent.V * 0.15;
        ctx.lineTo(cx + tailDist * Math.cos(agent.angle), cy + tailDist * Math.sin(agent.angle));
        
        let grad = ctx.createLinearGradient(x, y, cx + tailDist * Math.cos(agent.angle), cy + tailDist * Math.sin(agent.angle));
        grad.addColorStop(0, agent.color);
        grad.addColorStop(1, 'transparent');
        
        ctx.strokeStyle = grad;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    if (shakeTime > 0) {
        let dx = (Math.random() - 0.5) * 15 * shakeTime;
        let dy = (Math.random() - 0.5) * 15 * shakeTime;
        ctx.translate(dx, dy);
    }
    
    if (state !== 'START') {
        drawSlices();
        drawGrid();
        drawPaths();
        drawCenterNode();
        drawAgents();
    }
    
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 24px monospace';
    for (let ft of floatingTexts) {
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = ft.life;
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1.0;
    
    if (state === 'IDLE') {
        ctx.fillStyle = isDark ? '#fff' : '#000';
        ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(performance.now() / 300));
        ctx.font = '16px monospace';
        ctx.fillText('HOLD ANYWHERE TO SPAWN', canvas.width / 2, canvas.height - 60);
        ctx.globalAlpha = 1.0;
    }
    
    ctx.restore();
    
    if (flashTime > 0) {
        ctx.fillStyle = `rgba(${isDark ? '255,255,255' : '0,0,0'}, ${flashTime / 0.2})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function loop(time) {
    requestAnimationFrame(loop);
    let dt = (time - lastTime) / 1000;
    lastTime = time;
    if (dt > 0.1) dt = 0.1;
    
    update(dt);
    draw();
}
requestAnimationFrame(loop);

// Input Handling
function onPointerDown(e) {
    if (e.target.tagName.toLowerCase() === 'button') return;
    e.preventDefault();
    
    if (state === 'IDLE') {
        initAudio();
        state = 'HOLDING';
        holdTime = 0;
        playHoldSound();
        vibrate(10);
    }
}

function onPointerUp(e) {
    if (e.target.tagName.toLowerCase() === 'button') return;
    e.preventDefault();
    
    if (state === 'HOLDING') {
        if (holdTime < T_ring - delta) {
            gameOver('TOO EARLY');
        } else {
            success();
        }
    }
}

window.addEventListener('pointerdown', onPointerDown, { passive: false });
window.addEventListener('pointerup', onPointerUp, { passive: false });
window.addEventListener('pointercancel', onPointerUp, { passive: false });
window.addEventListener('contextmenu', e => e.preventDefault());

document.getElementById('btn-start').addEventListener('click', () => {
    initAudio();
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    score = 0;
    level = 1;
    updateHUD();
    initLevel();
});

document.getElementById('btn-restart').addEventListener('click', () => {
    initAudio();
    document.getElementById('game-over-screen').style.display = 'none';
    score = 0;
    level = 1;
    updateHUD();
    initLevel();
});
</script>
</body>
</html>
