<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Ferry</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1f24;--fg:#e8e4df;--muted:#8a939c;--accent:#d4652a;--accent2:#c45a22;
  --panel:rgba(26,31,36,.88);--border:rgba(232,228,223,.12);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#eef1f4;--fg:#1c2228;--muted:#5c6670;--accent:#c04e18;--accent2:#a84312;
    --panel:rgba(238,241,244,.92);--border:rgba(28,34,40,.1);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hud-val{font-size:22px;font-weight:600;line-height:1;color:var(--fg)}
#combo{position:absolute;top:max(60px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  font-size:13px;color:var(--accent);opacity:0;transition:opacity .25s;pointer-events:none;z-index:2}
#combo.show{opacity:1}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:10;pointer-events:none;transition:opacity .4s}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay-bg{position:absolute;inset:0;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card{position:relative;z-index:1;text-align:center;padding:32px 28px;max-width:340px;width:90%}
.card h1{font-size:clamp(26px,7vw,36px);font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.card .sub{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:24px;line-height:1.5}
.card .score-final{font-size:42px;font-weight:700;color:var(--accent);margin:12px 0 4px}
.card .score-label{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px}
.card .hint{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.6}
.btn{pointer-events:auto;min-height:48px;min-width:180px;padding:14px 32px;border:none;border-radius:6px;
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;background:var(--accent);color:#fff;transition:transform .12s,background .12s}
.btn:active{transform:scale(.96);background:var(--accent2)}
#swipe-hint{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-size:11px;color:var(--muted);letter-spacing:.1em;pointer-events:none;
  z-index:2;opacity:0;transition:opacity .5s}
#swipe-hint.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Score</span><span class="hud-val" id="scoreEl">0</span></div>
    <div class="hud-block" style="align-items:flex-end"><span class="hud-label">Corridors</span><span class="hud-val" id="corridorEl">0</span></div>
  </div>
  <div id="combo"></div>
  <div id="swipe-hint">← swipe to switch lanes →</div>
  <div class="overlay" id="titleOverlay">
    <div class="overlay-bg"></div>
    <div class="card">
      <h1>Fog Ferry</h1>
      <p class="sub">Steer through the bay fog before dawn.<br>Chain three corridors — don't scrape the pylons.</p>
      <button class="btn" data-smoke="start" id="startBtn">Cast Off</button>
      <p class="hint">Swipe left / right · Arrow keys on desktop</p>
    </div>
  </div>
  <div class="overlay hidden" id="gameOverOverlay">
    <div class="overlay-bg"></div>
    <div class="card">
      <h1>Run Aground</h1>
      <p class="score-label">Final Score</p>
      <div class="score-final" id="finalScore">0</div>
      <p class="sub" id="finalMsg"></p>
      <button class="btn" data-smoke="restart" id="restartBtn">Sail Again</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('canvas');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('scoreEl');
var corridorEl = document.getElementById('corridorEl');
var comboEl = document.getElementById('combo');
var titleOverlay = document.getElementById('titleOverlay');
var gameOverOverlay = document.getElementById('gameOverOverlay');
var finalScoreEl = document.getElementById('finalScore');
var finalMsgEl = document.getElementById('finalMsg');
var swipeHint = document.getElementById('swipe-hint');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');

var W = 360, H = 640, DPR = 1;
var LANES = 5;
var state = 'title';
var score = 0, corridors = 0, combo = 0, bestCombo = 0;
var elapsed = 0, speed = 120, fogDensity = 0.35;
var playerLane = 2, playerX = 0, targetLane = 2;
var laneW = 0, margin = 0;
var obstacles = [], particles = [], fogLayers = [];
var corridorActive = false, lastCorridorClear = false;
var audioCtx = null;
var shakeT = 0, breathT = 0;

var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

var COL = {
  skyTop: isDark ? '#1a2228' : '#b8c4ce',
  skyMid: isDark ? '#2a3540' : '#d4dce4',
  skyBot: isDark ? '#3d3028' : '#e8c9a0',
  dawn: isDark ? '#8a5030' : '#d4652a',
  water: isDark ? '#152028' : '#1a3040',
  waterHi: isDark ? '#1e2830' : '#243848',
  fog: isDark ? 'rgba(180,190,200,' : 'rgba(200,210,220,',
  ferry: isDark ? '#c8d0d8' : '#2a3848',
  ferryTrim: isDark ? '#d4652a' : '#c04e18',
  pylon: isDark ? '#4a5560' : '#6a7580',
  phantom: isDark ? 'rgba(120,130,140,0.5)' : 'rgba(80,90,100,0.45)',
  particle: isDark ? '#d4652a' : '#c04e18'
};

function initAudio(){
  try{
    if(typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
  }catch(e){ audioCtx = null; }
}

function playTone(freq, dur, vol, type){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function resize(){
  if(!canvas) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  margin = W * 0.06;
  laneW = (W - margin * 2) / LANES;
  playerX = laneCenter(playerLane);
}

function laneCenter(l){
  return margin + laneW * (l + 0.5);
}

function laneFromX(x){
  var l = Math.floor((x - margin) / laneW);
  if(l < 0) return 0;
  if(l >= LANES) return LANES - 1;
  return l;
}

function resetGame(){
  score = 0; corridors = 0; combo = 0; bestCombo = 0;
  elapsed = 0; speed = 120; fogDensity = 0.35;
  playerLane = 2; targetLane = 2; playerX = laneCenter(2);
  obstacles = []; particles = []; fogLayers = [];
  corridorActive = false; lastCorridorClear = false;
  spawnTimer = 0; phantomTimer = 8;
  updateHUD();
  initFogLayers();
  spawnObstacle();
}

function initFogLayers(){
  fogLayers = [];
  for(var i = 0; i < 6; i++){
    fogLayers.push({
      y: Math.random() * H * 2 - H,
      speed: 15 + Math.random() * 25,
      opacity: 0.08 + Math.random() * 0.12,
      scale: 0.6 + Math.random() * 0.8,
      offset: Math.random() * 1000
    });
  }
}

var spawnTimer = 0;
var phantomTimer = 8;
var gapWidth = 3;

function spawnObstacle(){
  var gapStart = Math.floor(Math.random() * (LANES - gapWidth + 1));
  var gapEnd = gapStart + gapWidth;
  var obsH = 80 + Math.random() * 60;
  var hasPylons = Math.random() < 0.55;
  obstacles.push({
    y: -obsH - 20,
    h: obsH,
    gapStart: gapStart,
    gapEnd: gapEnd,
    passed: false,
    cleared: false,
    pylons: hasPylons ? [
      { lane: gapStart, side: 'left' },
      { lane: gapEnd - 1, side: 'right' }
    ] : [],
    phantom: null
  });
}

function spawnPhantom(obs){
  if(Math.random() > 0.4) return;
  var lanes = [];
  for(var i = 0; i < LANES; i++){
    if(i < obs.gapStart || i >= obs.gapEnd) lanes.push(i);
  }
  if(lanes.length) obs.phantom = { lane: lanes[Math.floor(Math.random() * lanes.length)], alpha: 0, life: 2.5 };
}

function updateHUD(){
  if(scoreEl) scoreEl.textContent = score;
  if(corridorEl) corridorEl.textContent = corridors;
  if(comboEl){
    if(combo >= 2){
      comboEl.textContent = combo + '× corridor chain';
      comboEl.classList.add('show');
    } else {
      comboEl.classList.remove('show');
    }
  }
}

function switchLane(dir){
  if(state !== 'playing') return;
  var nl = targetLane + dir;
  if(nl < 0 || nl >= LANES) return;
  targetLane = nl;
  playTone(220 + nl * 40, 0.08, 0.06, 'triangle');
  for(var i = 0; i < 5; i++){
    particles.push({
      x: playerX + (Math.random() - 0.5) * 20,
      y: H * 0.78 + (Math.random() - 0.5) * 10,
      vx: dir * (30 + Math.random() * 40),
      vy: -20 - Math.random() * 30,
      life: 0.4 + Math.random() * 0.3,
      maxLife: 0.7,
      r: 2 + Math.random() * 3,
      color: COL.particle
    });
  }
}

function burstParticles(x, y, n, col){
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 40 + Math.random() * 80;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.4,
      maxLife: 0.9,
      r: 2 + Math.random() * 4,
      color: col || COL.particle
    });
  }
}

function gameOver(reason){
  state = 'over';
  shakeT = 0.45;
  vibrate([30, 50, 30]);
  playTone(80, 0.4, 0.1, 'sawtooth');
  if(finalScoreEl) finalScoreEl.textContent = score;
  if(finalMsgEl){
    var msg = reason || 'The fog claimed another vessel.';
    if(bestCombo >= 3) msg = 'Three corridors chained — legendary run.';
    else if(corridors >= 5) msg = corridors + ' corridors cleared through the mist.';
    finalMsgEl.textContent = msg;
  }
  if(gameOverOverlay) gameOverOverlay.classList.remove('hidden');
  if(swipeHint) swipeHint.classList.remove('show');
}

function startGame(){
  resetGame();
  state = 'playing';
  if(titleOverlay) titleOverlay.classList.add('hidden');
  if(gameOverOverlay) gameOverOverlay.classList.add('hidden');
  if(swipeHint) swipeHint.classList.add('show');
  setTimeout(function(){ if(swipeHint) swipeHint.classList.remove('show'); }, 4000);
  playTone(330, 0.15, 0.07, 'sine');
  vibrate(20);
}

function checkCollision(obs){
  var ferryY = H * 0.78;
  var ferryTop = ferryY - 18;
  var ferryBot = ferryY + 12;
  var obsTop = obs.y;
  var obsBot = obs.y + obs.h;

  if(ferryBot < obsTop || ferryTop > obsBot) return false;

  var curLane = laneFromX(playerX);
  var inGap = curLane >= obs.gapStart && curLane < obs.gapEnd;
  if(!inGap) return 'fog';

  if(obs.pylons){
    for(var i = 0; i < obs.pylons.length; i++){
      var p = obs.pylons[i];
      var px = laneCenter(p.lane) + (p.side === 'left' ? -laneW * 0.38 : laneW * 0.38);
      if(Math.abs(playerX - px) < laneW * 0.22) return 'pylon';
    }
  }

  if(obs.phantom && obs.phantom.alpha > 0.3){
    var phX = laneCenter(obs.phantom.lane);
    if(curLane === obs.phantom.lane && Math.abs(playerX - phX) < laneW * 0.35) return 'phantom';
  }

  return false;
}

var lastTime = 0;
function update(dt){
  if(state !== 'playing') return;
  elapsed += dt;

  // Escalation
  speed = 120 + elapsed * 4;
  fogDensity = Math.min(0.75, 0.35 + elapsed * 0.008);
  gapWidth = Math.max(1, 3 - Math.floor(elapsed / 18));

  // Lane lerp
  var tx = laneCenter(targetLane);
  playerX += (tx - playerX) * Math.min(1, dt * 12);
  if(Math.abs(playerX - tx) < 1) playerLane = targetLane;

  // Fog layers
  for(var f = 0; f < fogLayers.length; f++){
    var fl = fogLayers[f];
    fl.y += fl.speed * dt;
    if(fl.y > H + 100) fl.y = -100 - Math.random() * 200;
  }

  // Spawn
  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnObstacle();
    spawnTimer = Math.max(1.2, 2.8 - elapsed * 0.025);
  }

  phantomTimer -= dt;
  if(phantomTimer <= 0 && obstacles.length){
    var recent = obstacles[obstacles.length - 1];
    if(recent && !recent.phantom) spawnPhantom(recent);
    phantomTimer = Math.max(3, 8 - elapsed * 0.15);
  }

  // Update obstacles
  for(var i = obstacles.length - 1; i >= 0; i--){
    var obs = obstacles[i];
    obs.y += speed * dt;

    if(obs.phantom){
      obs.phantom.life -= dt;
      if(obs.phantom.life > 1.5) obs.phantom.alpha = Math.min(0.7, obs.phantom.alpha + dt * 0.8);
      else obs.phantom.alpha = Math.max(0, obs.phantom.alpha - dt * 1.2);
      if(obs.phantom.life <= 0) obs.phantom = null;
    }

    var hit = checkCollision(obs);
    if(hit){
      gameOver(hit === 'pylon' ? 'Scraped a pylon in the fog.' :
               hit === 'phantom' ? 'Phantom hull in the mist.' :
               'Lost in the fog bank.');
      return;
    }

    if(!obs.passed && obs.y + obs.h > H * 0.78){
      obs.passed = true;
      var curL = laneFromX(playerX);
      var inGap = curL >= obs.gapStart && curL < obs.gapEnd;
      if(inGap && !obs.cleared){
        obs.cleared = true;
        corridors++;
        combo++;
        if(combo > bestCombo) bestCombo = combo;
        var pts = 100 + combo * 50;
        score += pts;
        breathT = 0.35;
        playTone(440 + combo * 30, 0.12, 0.07, 'sine');
        vibrate(15);
        burstParticles(playerX, H * 0.78, 8, COL.dawn);
        updateHUD();
      } else if(!inGap){
        combo = 0;
        updateHUD();
      }
    }

    if(obs.y > H + 100) obstacles.splice(i, 1);
  }

  // Particles
  for(var j = particles.length - 1; j >= 0; j--){
    var p = particles[j];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 60 * dt;
    p.life -= dt;
    if(p.life <= 0) particles.splice(j, 1);
  }

  if(shakeT > 0) shakeT -= dt;
  if(breathT > 0) breathT -= dt;

  // Score over time
  score += Math.floor(speed * dt * 0.05);
  if(scoreEl) scoreEl.textContent = score;

  // Time limit ~60s soft end with bonus
  if(elapsed > 60){
    score += 500;
    gameOver('Survived the dawn crossing.');
  }
}

function drawSky(){
  if(!ctx) return;
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, COL.skyTop);
  g.addColorStop(0.55, COL.skyMid);
  g.addColorStop(0.85, COL.skyBot);
  g.addColorStop(1, COL.dawn);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Dawn glow
  var dg = ctx.createRadialGradient(W * 0.5, H, 0, W * 0.5, H, H * 0.7);
  dg.addColorStop(0, isDark ? 'rgba(138,80,48,0.35)' : 'rgba(212,101,42,0.25)');
  dg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = dg;
  ctx.fillRect(0, H * 0.5, W, H * 0.5);
}

function drawWater(){
  if(!ctx) return;
  var wy = H * 0.72;
  ctx.fillStyle = COL.water;
  ctx.fillRect(0, wy, W, H - wy);

  ctx.strokeStyle = COL.waterHi;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.3;
  var waveOff = elapsed * 40;
  for(var w = 0; w < 8; w++){
    ctx.beginPath();
    var wy2 = wy + 10 + w * 14;
    for(var x = 0; x <= W; x += 8){
      var y = wy2 + Math.sin((x + waveOff + w * 50) * 0.02) * 3;
      if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawLanes(){
  if(!ctx) return;
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.05)';
  ctx.lineWidth = 1;
  for(var i = 1; i < LANES; i++){
    var x = margin + laneW * i;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
}

function drawFogLayers(){
  if(!ctx) return;
  for(var i = 0; i < fogLayers.length; i++){
    var fl = fogLayers[i];
    var op = fl.opacity * (0.5 + fogDensity);
    ctx.globalAlpha = op;
    var fw = W * fl.scale * 1.5;
    var fh = 60 + fl.scale * 40;
    var fx = W * 0.5 + Math.sin(fl.offset + elapsed * 0.3) * W * 0.15 - fw * 0.5;
    var grad = ctx.createRadialGradient(fx + fw * 0.5, fl.y + fh * 0.5, 0, fx + fw * 0.5, fl.y + fh * 0.5, fw * 0.5);
    grad.addColorStop(0, COL.fog + '0.6)');
    grad.addColorStop(1, COL.fog + '0)');
    ctx.fillStyle = grad;
    ctx.fillRect(fx, fl.y, fw, fh);
  }
  ctx.globalAlpha = 1;
}

function drawObstacle(obs){
  if(!ctx) return;
  var top = obs.y, bot = obs.y + obs.h;

  // Fog walls blocking closed lanes
  for(var lane = 0; lane < LANES; lane++){
    if(lane >= obs.gapStart && lane < obs.gapEnd) continue;
    var lx = margin + laneW * lane;
    var fogG = ctx.createLinearGradient(lx, top, lx + laneW, bot);
    var baseOp = 0.55 + fogDensity * 0.35;
    fogG.addColorStop(0, COL.fog + baseOp + ')');
    fogG.addColorStop(0.5, COL.fog + (baseOp + 0.1) + ')');
    fogG.addColorStop(1, COL.fog + (baseOp - 0.1) + ')');
    ctx.fillStyle = fogG;
    ctx.fillRect(lx + 1, top, laneW - 2, obs.h);

    // Soft edge
    ctx.fillStyle = COL.fog + (baseOp * 0.5) + ')';
    ctx.fillRect(lx, top, 3, obs.h);
    ctx.fillRect(lx + laneW - 3, top, 3, obs.h);
  }

  // Gap corridor highlight
  var gx = margin + laneW * obs.gapStart;
  var gw = laneW * (obs.gapEnd - obs.gapStart);
  ctx.fillStyle = isDark ? 'rgba(212,101,42,0.04)' : 'rgba(212,101,42,0.06)';
  ctx.fillRect(gx, top, gw, obs.h);

  // Pylons
  if(obs.pylons){
    for(var p = 0; p < obs.pylons.length; p++){
      var pyl = obs.pylons[p];
      var px = laneCenter(pyl.lane) + (pyl.side === 'left' ? -laneW * 0.38 : laneW * 0.38);
      drawPylon(px, top + obs.h * 0.3, obs.h * 0.5);
    }
  }

  // Phantom ship
  if(obs.phantom && obs.phantom.alpha > 0.05){
    drawPhantom(laneCenter(obs.phantom.lane), top + obs.h * 0.45, obs.phantom.alpha);
  }
}

function drawPylon(x, y, h){
  if(!ctx) return;
  ctx.fillStyle = COL.pylon;
  ctx.fillRect(x - 4, y, 8, h);
  ctx.fillStyle = isDark ? '#5a6570' : '#8a959f';
  ctx.beginPath();
  ctx.moveTo(x - 8, y);
  ctx.lineTo(x + 8, y);
  ctx.lineTo(x + 4, y - 10);
  ctx.lineTo(x - 4, y - 10);
  ctx.closePath();
  ctx.fill();
  // Glow warning
  ctx.globalAlpha = 0.3 + Math.sin(elapsed * 4) * 0.15;
  ctx.fillStyle = COL.dawn;
  ctx.beginPath();
  ctx.arc(x, y - 5, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawPhantom(x, y, alpha){
  if(!ctx) return;
  ctx.globalAlpha = alpha * 0.6;
  ctx.fillStyle = COL.phantom;
  ctx.beginPath();
  ctx.moveTo(x, y - 20);
  ctx.lineTo(x + 18, y + 8);
  ctx.lineTo(x + 8, y + 12);
  ctx.lineTo(x, y + 6);
  ctx.lineTo(x - 8, y + 12);
  ctx.lineTo(x - 18, y + 8);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = alpha * 0.3;
  ctx.strokeStyle = COL.phantom;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawFerry(){
  if(!ctx) return;
  var x = playerX, y = H * 0.78;
  var bob = Math.sin(elapsed * 3) * 2;

  // Wake
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = isDark ? '#6090a0' : '#4080a0';
  ctx.beginPath();
  ctx.ellipse(x, y + 16 + bob, 22, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Hull
  ctx.fillStyle = COL.ferry;
  ctx.beginPath();
  ctx.moveTo(x, y - 16 + bob);
  ctx.lineTo(x + 14, y + 4 + bob);
  ctx.lineTo(x + 10, y + 10 + bob);
  ctx.lineTo(x - 10, y + 10 + bob);
  ctx.lineTo(x - 14, y + 4 + bob);
  ctx.closePath();
  ctx.fill();

  // Cabin
  ctx.fillStyle = isDark ? '#889098' : '#1a2838';
  ctx.fillRect(x - 7, y - 22 + bob, 14, 10);

  // Stack trim
  ctx.fillStyle = COL.ferryTrim;
  ctx.fillRect(x - 2, y - 28 + bob, 4, 8);

  // Light
  ctx.globalAlpha = 0.7 + Math.sin(elapsed * 5) * 0.3;
  ctx.fillStyle = COL.dawn;
  ctx.beginPath();
  ctx.arc(x, y - 24 + bob, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawParticles(){
  if(!ctx) return;
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawVignette(){
  if(!ctx) return;
  var vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.85);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, isDark ? 'rgba(0,0,0,' + (fogDensity * 0.5) + ')' : 'rgba(40,50,60,' + (fogDensity * 0.25) + ')');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function render(){
  if(!ctx) return;
  ctx.save();
  if(shakeT > 0){
    var s = shakeT * 8;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }
  drawSky();
  drawWater();
  drawLanes();

  for(var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);

  drawFogLayers();
  drawFerry();
  drawParticles();
  drawVignette();
  if(breathT > 0){
    ctx.globalAlpha = breathT * 0.25;
    ctx.fillStyle = isDark ? 'rgba(212,101,42,0.4)' : 'rgba(212,101,42,0.3)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function loop(ts){
  if(!lastTime) lastTime = ts;
  var dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// Input
var touchStartX = 0, touchStartY = 0, touchMoved = false;

function onTouchStart(e){
  if(e.cancelable) e.preventDefault();
  if(!e.touches || !e.touches.length) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchMoved = false;
}

function onTouchMove(e){
  if(e.cancelable) e.preventDefault();
}

function onTouchEnd(e){
  if(e.cancelable) e.preventDefault();
  if(!e.changedTouches || !e.changedTouches.length) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)){
    switchLane(dx > 0 ? 1 : -1);
  }
}

function onKeyDown(e){
  if(state !== 'playing') return;
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ switchLane(-1); e.preventDefault(); }
  if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ switchLane(1); e.preventDefault(); }
}

if(startBtn) startBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
if(restartBtn) restartBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

if(canvas){
  canvas.addEventListener('touchstart', onTouchStart, {passive:false});
  canvas.addEventListener('touchmove', onTouchMove, {passive:false});
  canvas.addEventListener('touchend', onTouchEnd, {passive:false});
  canvas.addEventListener('mousedown', function(e){
    touchStartX = e.clientX; touchStartY = e.clientY; touchMoved = false;
  });
  canvas.addEventListener('mouseup', function(e){
    var dx = e.clientX - touchStartX;
    var dy = e.clientY - touchStartY;
    if(Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) switchLane(dx > 0 ? 1 : -1);
  });
}

document.addEventListener('keydown', onKeyDown);
window.addEventListener('resize', resize);

if(window.matchMedia){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change', function(){
    isDark = mq.matches;
    COL.skyTop = isDark ? '#1a2228' : '#b8c4ce';
    COL.skyMid = isDark ? '#2a3540' : '#d4dce4';
    COL.skyBot = isDark ? '#3d3028' : '#e8c9a0';
    COL.dawn = isDark ? '#8a5030' : '#d4652a';
    COL.water = isDark ? '#152028' : '#1a3040';
    COL.waterHi = isDark ? '#1e2830' : '#243848';
    COL.fog = isDark ? 'rgba(180,190,200,' : 'rgba(200,210,220,';
    COL.ferry = isDark ? '#c8d0d8' : '#2a3848';
    COL.ferryTrim = isDark ? '#d4652a' : '#c04e18';
    COL.pylon = isDark ? '#4a5560' : '#6a7580';
    COL.phantom = isDark ? 'rgba(120,130,140,0.5)' : 'rgba(80,90,100,0.45)';
    COL.particle = isDark ? '#d4652a' : '#c04e18';
  });
}

initAudio();
resize();
initFogLayers();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
