<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawn Cargo</title>
<style>
  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  #gameCanvas {
    display: block;
    width: 100%; height: 100%;
  }
  #uiLayer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    color: #fff;
    text-align: center;
    pointer-events: none;
  }
  .overlay button {
    pointer-events: auto;
    margin-top: 20px;
    padding: 15px 40px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #FFEA00;
    color: #000;
    cursor: pointer;
    box-shadow: 0 4px 0 #F57F17;
    font-family: inherit;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .overlay button:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #F57F17;
  }
  #hud {
    position: absolute;
    top: 20px; left: 20px; right: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    body, html {
      background: #0d0d0d;
    }
    .overlay {
      background: rgba(0, 0, 0, 0.85);
      color: #e0e0e0;
    }
    .overlay button {
      background: #FFD600;
      color: #1a1a1a;
      box-shadow: 0 4px 0 #C49000;
    }
    .overlay button:active {
      box-shadow: 0 0 0 #C49000;
    }
    #hud {
      color: #e0e0e0;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="uiLayer">
    <div id="titleScreen" class="overlay">
      <h1 style="font-size: 36px; margin: 0 0 10px 0;">Dawn Cargo</h1>
      <p style="margin: 0; opacity: 0.9; max-width: 80%; line-height: 1.4;">
        Sort crates before sunrise.<br>Clear a pier to ship it.<br>Don't let the hub fill up!
      </p>
      <button id="startBtn" data-smoke="start">START WORK</button>
    </div>
    <div id="hud" style="display:none;">
       <div>Score: <span id="scoreDisplay">0</span></div>
       <div id="timeDisplay">60s</div>
    </div>
    <div id="gameOverScreen" class="overlay" style="display:none;">
      <h2 id="gameOverTitle" style="font-size: 36px; margin: 0 0 10px 0;">Sunrise</h2>
      <p style="margin: 0; font-size: 24px;">Score: <span id="finalScore">0</span></p>
      <button id="restartBtn" data-smoke="restart">RESTART</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let W, H, scale, effW, effH, offsetX, offsetY;
    const TILE_W = 64;
    const TILE_H = 32;
    const CRATE_H = 24;

    const colors = {
      red: { base: '#E63946', light: '#EF636E', dark: '#B81D29' },
      blue: { base: '#457B9D', light: '#629DBE', dark: '#29546E' },
      yellow: { base: '#E9C46A', light: '#F1D895', dark: '#C89F3C' },
      dock: { base: '#CFD8DC', light: '#ECEFF1', dark: '#90A4AE' }
    };

    let state = 'title'; // title, play, gameover
    let score = 0;
    let time = 60.0;
    let timeSinceSwap = 0;
    let spawnTimer = 0.5;
    let hornPlayed = false;
    let flashAlpha = 0;
    let shakeTime = 0;

    let crates = [];
    let particles = [];
    
    const centerTiles = [
      {x:-1, y:-1}, {x:0, y:-1}, {x:1, y:-1},
      {x:-1, y:0},  {x:0, y:0},  {x:1, y:0},
      {x:-1, y:1},  {x:0, y:1},  {x:1, y:1}
    ];
    let zones = [
      { color: 'red', tiles: [{x:2, y:-1, crate:null}, {x:3, y:-1, crate:null}, {x:2, y:0, crate:null}, {x:3, y:0, crate:null}] },
      { color: 'blue', tiles: [{x:-1, y:2, crate:null}, {x:0, y:2, crate:null}, {x:-1, y:3, crate:null}, {x:0, y:3, crate:null}] },
      { color: 'yellow', tiles: [{x:-2, y:0, crate:null}, {x:-3, y:0, crate:null}, {x:-2, y:1, crate:null}, {x:-3, y:1, crate:null}] }
    ];

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol=0.1) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function playPop() { playTone(400, 'sine', 0.1, 0.1); }
    function playThud() { playTone(150, 'triangle', 0.15, 0.2); }
    function playError() { playTone(100, 'sawtooth', 0.3, 0.2); }
    function playSnap() { playTone(200, 'triangle', 0.1, 0.05); }
    function playClear() {
      playTone(523.25, 'sine', 0.5, 0.1); 
      setTimeout(() => playTone(659.25, 'sine', 0.5, 0.1), 50); 
      setTimeout(() => playTone(783.99, 'sine', 0.5, 0.1), 100); 
    }
    function playSwapSound() {
      playTone(800, 'square', 0.1, 0.05);
      setTimeout(() => playTone(600, 'square', 0.2, 0.05), 100);
    }
    function playFogHorn() {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        let filter = audioCtx.createBiquadFilter();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(400, audioCtx.currentTime);
        filter.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 1.5);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + 1.0);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        osc.stop(audioCtx.currentTime + 1.5);
      } catch(e){}
    }

    function vibrate(ms) {
      try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
    }

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * window.devicePixelRatio;
      canvas.height = H * window.devicePixelRatio;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      scale = Math.min(W / 400, H / 600);
      effW = TILE_W * scale;
      effH = TILE_H * scale;
      offsetX = W / 2;
      offsetY = H / 2;
    }
    window.addEventListener('resize', resize);

    function setUIState(newState) {
      state = newState;
      document.getElementById('titleScreen').style.display = state === 'title' ? 'flex' : 'none';
      document.getElementById('gameOverScreen').style.display = state === 'gameover' ? 'flex' : 'none';
      document.getElementById('hud').style.display = state === 'play' ? 'flex' : 'none';
    }

    let lastHudScore = -1, lastHudTime = -1;
    function updateHUD() {
      let t = Math.ceil(Math.max(0, time));
      if (score !== lastHudScore) {
        document.getElementById('scoreDisplay').innerText = score;
        lastHudScore = score;
      }
      if (t !== lastHudTime) {
        const timeEl = document.getElementById('timeDisplay');
        timeEl.innerText = t + 's';
        timeEl.style.color = t <= 10 ? '#FF5252' : '#FFF';
        lastHudTime = t;
      }
    }

    function initGame() {
      score = 0;
      time = 60.0;
      timeSinceSwap = 0;
      spawnTimer = 1.0;
      hornPlayed = false;
      flashAlpha = 0;
      shakeTime = 0;
      crates = [];
      particles = [];
      lastHudScore = -1;
      lastHudTime = -1;

      const baseColors = ['red', 'blue', 'yellow'];
      zones.forEach((z, i) => {
        z.color = baseColors[i];
        z.tiles.forEach(t => t.crate = null);
      });

      setUIState('play');
      initAudio();
      updateHUD();
    }

    document.getElementById('startBtn').addEventListener('click', initGame);
    document.getElementById('restartBtn').addEventListener('click', initGame);

    const keysDown = new Set();
    function handleKeyDown(e) {
      keysDown.add(e.code);
      if (e.code === 'Enter' || e.code === 'Space') {
        if (state === 'title') initGame();
        else if (state === 'gameover') initGame();
      }
    }
    function handleKeyUp(e) {
      keysDown.delete(e.code);
    }
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);

    function gameOver(reason) {
      state = 'gameover';
      document.getElementById('gameOverTitle').innerText = reason === 'full' ? 'Hub Overflow' : 'Sunrise';
      document.getElementById('finalScore').innerText = score;
      setUIState('gameover');
    }

    function spawnParticles(cx, cy, color, count) {
      for(let i=0; i<count; i++) {
        particles.push({
          x: cx, y: cy,
          vx: (Math.random()-0.5)*200,
          vy: (Math.random()-0.5)*200 - 100,
          life: 1.0, maxLife: 1.0, color
        });
      }
    }

    function checkZoneClear(z) {
      if (z.tiles.every(t => t.crate !== null)) {
        score += 100;
        playClear();
        vibrate([30, 50, 30]);
        flashAlpha = 1.0;
        shakeTime = 0.4;
        z.tiles.forEach(t => {
          t.crate.animatingOut = true;
          t.crate = null;
        });
      }
    }

    function swapZones() {
      let zoneColors = zones.map(z => z.color);
      zoneColors.unshift(zoneColors.pop());
      zones.forEach((z, i) => z.color = zoneColors[i]);
      playSwapSound();
      vibrate(20);
    }

    function hitTestIso(px, py, gx, gy, w, h, ox, oy, crateHeightPx) {
      let cx = (gx - gy) * w / 2 + ox;
      let cy = (gx + gy) * h / 2 + oy - crateHeightPx;
      let dx = px - cx;
      let dy = py - cy;
      let locX = (dx / (w/2) + dy / (h/2)) / 2;
      let locY = (dy / (h/2) - dx / (w/2)) / 2;
      return (locX >= -0.5 && locX <= 0.5 && locY >= -0.5 && locY <= 0.5);
    }

    canvas.addEventListener('pointerdown', e => {
      if (state !== 'play') return;
      let rect = canvas.getBoundingClientRect();
      let px = e.clientX - rect.left;
      let py = e.clientY - rect.top;

      for (let i = crates.length - 1; i >= 0; i--) {
         let c = crates[i];
         if (c.placed || c.animatingOut) continue;
         let ch = CRATE_H * scale * (c.scale !== undefined ? c.scale : 1);
         if (hitTestIso(px, py, c.gx, c.gy, effW, effH, offsetX, offsetY, ch)) {
            c.isDragged = true;
            c.dragId = e.pointerId;
            c.dragX = px;
            c.dragY = py;
            initAudio();
            break;
         }
      }
    });

    canvas.addEventListener('pointermove', e => {
      if (state !== 'play') return;
      for (let c of crates) {
        if (c.isDragged && c.dragId === e.pointerId) {
          c.dragX = e.clientX;
          c.dragY = e.clientY;
        }
      }
    });

    function handleDrop(pointerId) {
      for (let c of crates) {
        if (c.isDragged && c.dragId === pointerId) {
          c.isDragged = false;
          
          let dx = c.dragX - offsetX;
          let dy = c.dragY - offsetY;
          let dropGx = Math.round((dx / (effW/2) + dy / (effH/2)) / 2);
          let dropGy = Math.round((dy / (effH/2) - dx / (effW/2)) / 2);

          let handled = false;
          let inHub = (Math.abs(dropGx) <= 1 && Math.abs(dropGy) <= 1);
          
          if (!inHub) {
            let bestDist = Infinity;
            let targetZone = null;
            for (let z of zones) {
              for (let t of z.tiles) {
                let dist = Math.hypot(t.x - dropGx, t.y - dropGy);
                if (dist < bestDist) {
                  bestDist = dist;
                  targetZone = z;
                }
              }
            }

            if (targetZone && bestDist < 2.5) {
              if (targetZone.color === c.color) {
                let emptyTile = targetZone.tiles.find(t => t.crate === null);
                if (emptyTile) {
                  emptyTile.crate = c;
                  c.gx = emptyTile.x;
                  c.gy = emptyTile.y;
                  c.placed = true;
                  c.zOffset = 0;
                  score += 10;
                  playThud();
                  vibrate(10);
                  spawnParticles(c.dragX, c.dragY, colors[c.color].light, 15);
                  checkZoneClear(targetZone);
                  handled = true;
                }
              } else {
                playError();
                vibrate(40);
                handled = true; // Handled as error rejection
              }
            }
          }

          if (!handled) {
            playSnap();
          }
        }
      }
    }

    canvas.addEventListener('pointerup', e => {
      if (state === 'play') handleDrop(e.pointerId);
    });
    canvas.addEventListener('pointercancel', e => {
      if (state === 'play') handleDrop(e.pointerId);
    });

    ['touchstart', 'touchmove', 'touchend', 'contextmenu'].forEach(evt => {
      canvas.addEventListener(evt, e => e.preventDefault(), {passive: false});
    });

    function drawIsoPrism(ctx, cx, cy, w, h, zHeight, topC, leftC, rightC) {
      let topY = cy - zHeight;
      
      ctx.fillStyle = leftC;
      ctx.beginPath();
      ctx.moveTo(cx - w/2, topY);
      ctx.lineTo(cx, topY + h/2);
      ctx.lineTo(cx, cy + h/2);
      ctx.lineTo(cx - w/2, cy);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = rightC;
      ctx.beginPath();
      ctx.moveTo(cx, topY + h/2);
      ctx.lineTo(cx + w/2, topY);
      ctx.lineTo(cx + w/2, cy);
      ctx.lineTo(cx, cy + h/2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = topC;
      ctx.beginPath();
      ctx.moveTo(cx, topY - h/2);
      ctx.lineTo(cx + w/2, topY);
      ctx.lineTo(cx, topY + h/2);
      ctx.lineTo(cx - w/2, topY);
      ctx.closePath();
      ctx.fill();
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    let lastTime = performance.now();
    function loop(now) {
      let dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (state === 'play') {
        if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 2);
        if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);

        time -= dt;
        if (time <= 0) {
          time = 0;
          gameOver('time');
        } else {
          if (time <= 10 && !hornPlayed) {
            playFogHorn();
            hornPlayed = true;
          }

          timeSinceSwap += dt;
          if (timeSinceSwap >= 15.0) {
            timeSinceSwap = 0;
            swapZones();
          }

          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            let prog = 1 - (time / 60);
            spawnTimer = 2.0 - (1.3 * prog);
            let available = centerTiles.filter(t => !crates.some(c => c.gx === t.x && c.gy === t.y && !c.placed && !c.animatingOut));
            if (available.length > 0) {
              let t = available[Math.floor(Math.random() * available.length)];
              let colKeys = ['red', 'blue', 'yellow'];
              let cKey = colKeys[Math.floor(Math.random() * colKeys.length)];
              crates.push({
                id: Math.random(),
                color: cKey,
                gx: t.x, gy: t.y,
                placed: false, isDragged: false,
                animatingIn: true, scale: 0, zOffset: 0, alpha: 1
              });
              playPop();
            } else {
              gameOver('full');
            }
          }

          crates.forEach(c => {
            if (c.animatingIn) {
              c.scale += dt * 6;
              if (c.scale >= 1) { c.scale = 1; c.animatingIn = false; }
            }
            if (c.animatingOut) {
              c.zOffset += dt * 200;
              c.alpha -= dt * 2;
            }
          });
          crates = crates.filter(c => !c.animatingOut || c.alpha > 0);

          particles.forEach(p => {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 400 * dt;
            p.life -= dt;
          });
          particles = particles.filter(p => p.life > 0);

          updateHUD();
        }
      }

      // Draw
      let prog = Math.max(0, Math.min(1, 1 - (time / 60)));
      let r1 = lerp(0x4A, 0xFF, prog), g1 = lerp(0x57, 0x7B, prog), b1 = lerp(0x59, 0x00, prog);
      let r2 = lerp(0xB0, 0xFF, prog), g2 = lerp(0xC4, 0xEA, prog), b2 = lerp(0xB1, 0x00, prog);
      
      let grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, `rgb(${Math.floor(r1)},${Math.floor(g1)},${Math.floor(b1)})`);
      grad.addColorStop(1, `rgb(${Math.floor(r2)},${Math.floor(g2)},${Math.floor(b2)})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Water lines
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 2 * scale;
      let waveOffset = (now / 50) % 40;
      for (let y = waveOffset; y < H; y += 40 * scale) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      ctx.save();
      if (shakeTime > 0) {
        let mag = shakeTime * 10;
        ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
      }

      let renderables = [];
      
      centerTiles.forEach(t => {
        renderables.push({ type: 'tile', x: t.x, y: t.y, c_top: colors.dock.light, c_left: colors.dock.base, c_right: colors.dock.dark });
      });

      let flashWarn = (state === 'play' && timeSinceSwap > 13 && Math.floor(now / 125) % 2 === 0);
      
      zones.forEach(z => {
        let topC = flashWarn ? '#FFF' : colors[z.color].light;
        let leftC = flashWarn ? '#EEE' : colors[z.color].base;
        let rightC = flashWarn ? '#DDD' : colors[z.color].dark;
        z.tiles.forEach(t => {
          renderables.push({ type: 'tile', x: t.x, y: t.y, c_top: topC, c_left: leftC, c_right: rightC });
        });
      });

      crates.forEach(c => {
        if (!c.isDragged) {
          renderables.push({ type: 'crate', x: c.gx, y: c.gy, ref: c });
        }
      });

      renderables.sort((a,b) => {
        let d1 = a.x + a.y + (a.type==='crate'? 0.1 : 0);
        let d2 = b.x + b.y + (b.type==='crate'? 0.1 : 0);
        return d1 - d2;
      });

      renderables.forEach(r => {
        let cx = (r.x - r.y) * effW/2 + offsetX;
        let cy = (r.x + r.y) * effH/2 + offsetY;
        if (r.type === 'tile') {
           drawIsoPrism(ctx, cx, cy + 10*scale, effW, effH, 10*scale, r.c_top, r.c_left, r.c_right);
        } else if (r.type === 'crate') {
           let c = r.ref;
           let s = c.scale !== undefined ? c.scale : 1;
           let a = c.alpha !== undefined ? c.alpha : 1;
           ctx.globalAlpha = a;
           ctx.fillStyle = 'rgba(0,0,0,0.2)';
           ctx.beginPath();
           ctx.ellipse(cx, cy, (effW/4)*s, (effH/4)*s, 0, 0, Math.PI*2);
           ctx.fill();
           drawIsoPrism(ctx, cx, cy - c.zOffset, effW*0.8*s, effH*0.8*s, CRATE_H*scale*s, colors[c.color].light, colors[c.color].base, colors[c.color].dark);
           ctx.globalAlpha = 1.0;
        }
      });

      crates.forEach(c => {
        if (c.isDragged) {
          let s = 1.1; // slightly larger when dragged
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.beginPath();
          ctx.ellipse(c.dragX, c.dragY, (effW/4)*s, (effH/4)*s, 0, 0, Math.PI*2);
          ctx.fill();
          drawIsoPrism(ctx, c.dragX, c.dragY, effW*0.8*s, effH*0.8*s, CRATE_H*scale*s, colors[c.color].light, colors[c.color].base, colors[c.color].dark);
        }
      });

      ctx.restore();

      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillRect(p.x - 3*scale, p.y - 3*scale, 6*scale, 6*scale);
        ctx.globalAlpha = 1.0;
      });

      if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255, 215, 0, ${flashAlpha})`;
        ctx.fillRect(0, 0, W, H);
      }

      requestAnimationFrame(loop);
    }

    resize();
    requestAnimationFrame(loop);

  </script>
</body>
</html>
