<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Golden Hour — Rooftop Stack</title>
<style>
  :root{
    --ink:#2a231c;
    --ink-soft:#6a5c4c;
    --paper:#f3e7d2;
    --card:rgba(248,240,226,0.82);
    --card-line:rgba(70,55,40,0.14);
    --accent:#c76a3a;
    --accent-2:#2f8f82;
    --good:#2f8f82;
    --warn:#c7532f;
    --btn-bg:#2a231c;
    --btn-ink:#f6ecd8;
    --shadow:rgba(40,28,16,0.22);
    --hud-bg:rgba(248,240,226,0.55);
    --bar-track:rgba(70,55,40,0.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#f3e6d2;
      --ink-soft:#c3ad90;
      --paper:#141a24;
      --card:rgba(20,26,36,0.72);
      --card-line:rgba(240,225,200,0.16);
      --accent:#ef9a4e;
      --accent-2:#5bb8a8;
      --good:#5bb8a8;
      --warn:#ef7a4e;
      --btn-bg:#f1e4cc;
      --btn-ink:#1a1610;
      --shadow:rgba(0,0,0,0.5);
      --hud-bg:rgba(16,22,32,0.42);
      --bar-track:rgba(240,225,200,0.16);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;background:var(--paper);}
  body{
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    color:var(--ink);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    position:relative;
  }
  #game{
    position:fixed;inset:0;
    width:100dvw;height:100dvh;
    width:100vw;height:100vh;
    overflow:hidden;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  #c{
    position:absolute;inset:0;
    width:100%;height:100%;
    display:block;
    touch-action:none;
  }

  /* ---------- HUD ---------- */
  .layer{position:absolute;inset:0;pointer-events:none;}
  #hud{z-index:5;opacity:0;transition:opacity .5s ease;}
  #hud-top{
    position:absolute;left:0;right:0;top:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:max(14px,env(safe-area-inset-top)) 16px 0 16px;
    gap:10px;
  }
  .stat{display:flex;flex-direction:column;line-height:1;gap:5px;}
  .stat.right{align-items:flex-end;}
  .lbl{font-size:10px;letter-spacing:.22em;color:var(--ink-soft);font-weight:600;}
  .val{font-size:26px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;
       text-shadow:0 1px 0 var(--shadow);transform-origin:left center;}
  .stat.right .val{transform-origin:right center;}
  #beatwrap{
    position:absolute;top:max(16px,calc(env(safe-area-inset-top) + 2px));left:50%;transform:translateX(-50%);
    display:flex;gap:6px;align-items:center;opacity:.9;
  }
  .beatdot{width:7px;height:7px;border-radius:50%;background:var(--bar-track);transition:background .08s,transform .08s;}
  .beatdot.on{background:var(--accent);transform:scale(1.5);}

  /* balance meter — sits just under the top HUD */
  #balance{
    position:absolute;left:50%;transform:translateX(-50%);
    top:calc(max(14px,env(safe-area-inset-top)) + 40px);
    width:min(48vw,188px);height:6px;border-radius:6px;background:var(--bar-track);
    overflow:visible;
  }
  #balance::before{content:"";position:absolute;left:50%;top:-4px;width:2px;height:14px;transform:translateX(-50%);
    background:var(--ink-soft);opacity:.6;border-radius:2px;}
  #balmark{
    position:absolute;top:50%;left:50%;width:15px;height:15px;border-radius:50%;
    background:var(--accent-2);transform:translate(-50%,-50%);
    box-shadow:0 0 0 3px var(--paper), 0 2px 6px var(--shadow);
    transition:background .1s;
  }
  #balance.warn #balmark{background:var(--warn);}
  #ballabel{position:absolute;left:50%;transform:translateX(-50%);top:14px;white-space:nowrap;
    font-size:9px;letter-spacing:.24em;color:var(--ink-soft);}

  /* combo chip under the score */
  #comboChip{
    margin-top:9px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent);
    opacity:0;transform-origin:right center;white-space:nowrap;
  }
  #comboChip .x{font-size:14px;}
  /* milestone banner — high, fades fast, rare */
  #banner{
    position:absolute;left:50%;top:13.5%;transform:translate(-50%,-50%);
    font-size:12px;letter-spacing:.34em;font-weight:700;color:var(--accent-2);
    opacity:0;text-align:center;white-space:nowrap;
    text-shadow:0 1px 10px var(--shadow);
  }

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    pointer-events:none;
    transition:opacity .45s ease;
  }
  .overlay.hidden{opacity:0;visibility:hidden;}
  .card{
    pointer-events:none;
    width:min(92vw,420px);
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:20px;
    padding:30px 26px 26px;
    text-align:center;
    backdrop-filter:blur(10px) saturate(1.1);
    -webkit-backdrop-filter:blur(10px) saturate(1.1);
    box-shadow:0 18px 50px var(--shadow);
  }
  .eyebrow{font-size:10px;letter-spacing:.42em;color:var(--ink-soft);margin:0 0 14px;font-weight:600;}
  h1{font-size:clamp(34px,10vw,52px);margin:0;line-height:.98;letter-spacing:-.01em;font-weight:800;}
  h1 .thin{display:block;font-weight:400;font-size:.42em;letter-spacing:.12em;color:var(--accent);margin-top:10px;}
  .tag{font-size:13px;line-height:1.5;color:var(--ink-soft);margin:16px auto 0;max-width:30ch;}
  .how{
    margin:20px auto 4px;font-size:11.5px;letter-spacing:.06em;color:var(--ink);
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  }
  .how b{color:var(--accent);font-weight:700;}
  .chip{border:1px solid var(--card-line);border-radius:999px;padding:7px 12px;background:rgba(127,127,127,0.05);}
  .btn{
    pointer-events:auto;
    margin-top:22px;
    appearance:none;border:none;cursor:pointer;
    font-family:inherit;font-weight:700;letter-spacing:.14em;font-size:15px;
    color:var(--btn-ink);background:var(--btn-bg);
    padding:16px 40px;min-height:52px;min-width:180px;border-radius:999px;
    box-shadow:0 8px 24px var(--shadow);
    transition:transform .12s ease, filter .12s ease;
    touch-action:manipulation;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(2px) scale(.98);}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}

  #over .card h2{font-size:clamp(26px,8vw,40px);margin:0;font-weight:800;line-height:1;}
  .finalgrid{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:22px 0 4px;
  }
  .fstat{display:flex;flex-direction:column;gap:6px;padding:12px 6px;border:1px solid var(--card-line);border-radius:12px;background:rgba(127,127,127,0.04);}
  .fstat .lbl{font-size:9px;}
  .fstat .num{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;}
  .fstat .num.accent{color:var(--accent);}
  #overMsg{font-size:12px;color:var(--ink-soft);margin:14px 0 0;letter-spacing:.04em;min-height:1.2em;}

  .credit{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:9px;letter-spacing:.24em;color:var(--ink-soft);opacity:.5;}

  .nolean{transition:none!important;}
  @media (prefers-reduced-motion: reduce){
    .overlay{transition:none;}
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>

  <!-- HUD -->
  <div id="hud" class="layer">
    <div id="hud-top">
      <div class="stat"><span class="lbl">FLOORS</span><span class="val" id="floorVal">0</span></div>
      <div class="stat right">
        <span class="lbl">SCORE</span><span class="val" id="scoreVal">0</span>
        <span id="comboChip"></span>
      </div>
    </div>
    <div id="beatwrap" aria-hidden="true">
      <span class="beatdot"></span><span class="beatdot"></span><span class="beatdot"></span><span class="beatdot"></span>
    </div>
    <div id="banner"></div>
    <div id="balance"><div id="balmark"></div><div id="ballabel">BALANCE</div></div>
  </div>

  <!-- Title -->
  <div id="title" class="overlay layer">
    <div class="card">
      <p class="eyebrow">A ROOFTOP STACKER</p>
      <h1>GOLDEN<br>HOUR<span class="thin">keep the skyline steady</span></h1>
      <p class="tag">Drop housing modules onto the tilting row house. Land them centered or the whole block topples.</p>
      <div class="how">
        <span class="chip"><b>TAP</b> drop</span>
        <span class="chip"><b>HOLD</b> tilt</span>
        <span class="chip"><b>SPACE</b> desktop</span>
      </div>
      <button class="btn" data-smoke="start" id="startBtn">BUILD</button>
    </div>
  </div>

  <!-- Game over -->
  <div id="over" class="overlay layer hidden">
    <div class="card">
      <p class="eyebrow" id="overEyebrow">THE BLOCK CAME DOWN</p>
      <h2 id="overTitle">TIMBER!</h2>
      <div class="finalgrid">
        <div class="fstat"><span class="lbl">FLOORS</span><span class="num" id="fFloors">0</span></div>
        <div class="fstat"><span class="lbl">SCORE</span><span class="num accent" id="fScore">0</span></div>
        <div class="fstat"><span class="lbl">BEST</span><span class="num" id="fBest">0</span></div>
      </div>
      <p id="overMsg"></p>
      <button class="btn" data-smoke="restart" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
/* ============================================================
   GOLDEN HOUR — a watercolor rooftop stacker
   Pure Canvas 2D, no external libraries. Phone-first.
   ============================================================ */

/* ---------- tiny utils ---------- */
var TAU = Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function easeInQuad(t){ return t*t; }
function now(){ return (typeof performance!=="undefined"&&performance.now)?performance.now():Date.now(); }

// hex helpers (operate on "#rrggbb")
function hexToRgb(h){
  h=h.replace('#','');
  if(h.length===3){ h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
  var n=parseInt(h,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToCss(r,g,b,a){ return 'rgba('+ (r|0) +','+ (g|0) +','+ (b|0) +','+ (a==null?1:a) +')'; }
function shade(hex, amt){ // amt -1..1 ; negative=darker
  var c=hexToRgb(hex);
  if(amt>=0){ return rgbToCss(lerp(c.r,255,amt),lerp(c.g,255,amt),lerp(c.b,255,amt)); }
  var k=1+amt; return rgbToCss(c.r*k,c.g*k,c.b*k);
}
function shadeA(hex, amt, a){ // shaded color with explicit alpha
  var c=hexToRgb(hex), r,g,b;
  if(amt>=0){ r=lerp(c.r,255,amt); g=lerp(c.g,255,amt); b=lerp(c.b,255,amt); }
  else { var k=1+amt; r=c.r*k; g=c.g*k; b=c.b*k; }
  return rgbToCss(r,g,b,a);
}
function withAlpha(hex,a){ var c=hexToRgb(hex); return rgbToCss(c.r,c.g,c.b,a); }
function mix(h1,h2,t){ var a=hexToRgb(h1),b=hexToRgb(h2); return rgbToCss(lerp(a.r,b.r,t),lerp(a.g,b.g,t),lerp(a.b,b.b,t)); }

/* ---------- DOM ---------- */
var D = function(id){ return document.getElementById(id); };
var gameEl = D('game');
var canvas = D('c');
var ctx = null;
try { ctx = canvas.getContext('2d', { alpha:false }); } catch(e){ ctx=null; }

var floorVal=D('floorVal'), scoreVal=D('scoreVal'), comboChip=D('comboChip');
var bannerEl=D('banner');
var balanceEl=D('balance'), balMark=D('balmark');
var titleEl=D('title'), overEl=D('over');
var startBtn=D('startBtn'), restartBtn=D('restartBtn');
var fFloors=D('fFloors'), fScore=D('fScore'), fBest=D('fBest');
var overTitle=D('overTitle'), overMsg=D('overMsg'), overEyebrow=D('overEyebrow');
var beatDots = document.querySelectorAll('.beatdot');

/* ---------- global sizing ---------- */
var DPR=1, W=0, H=0; // CSS pixels for W/H
function resize(){
  DPR = Math.max(1, Math.min(2.5, window.devicePixelRatio||1));
  W = Math.max(1, Math.round(gameEl.clientWidth || window.innerWidth));
  H = Math.max(1, Math.round(gameEl.clientHeight || window.innerHeight));
  if(canvas){
    canvas.width = Math.round(W*DPR);
    canvas.height = Math.round(H*DPR);
  }
  buildBackground();
  layoutPivot();
}
function layoutPivot(){
  Cam.pivotX = W*0.5;
  Cam.pivotY = H*0.80;
}

/* ---------- theme / palette ---------- */
var isDark = false;
function readTheme(){
  try{ isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  catch(e){ isDark=false; }
}
readTheme();

var PAL = {};
function buildPalette(){
  if(isDark){
    PAL = {
      skyTop:'#0d1f38', skyMid:'#2a3f57', skyLow:'#8a4a2a', skyHorizon:'#d8763a',
      sunCore:'#ffe3a6', sunGlow:'#ff9a46',
      fog:'#1a2740', fogWarm:'#caa36a',
      far:'#20344e', farLit:'#f0b968',
      ground:'#141c2a', street:'#1c2636',
      ink:'#f3e6d2', accent:'#ef9a4e', good:'#5bb8a8', warn:'#ef7049',
      windowGlow:'#ffd27a', windowGlowStrength:0.95,
      rim:'#ffd9a0',
      blocks:['#c9794e','#d79a4e','#b5603f','#caa86f','#89986a','#5f9088','#cf8f63','#bd6f4b'],
      shadow:'rgba(0,0,0,0.42)',
      leafCol:['#d98a4a','#c7633a','#caa86f']
    };
  } else {
    PAL = {
      skyTop:'#7fb8e0', skyMid:'#bcd8dd', skyLow:'#f3d093', skyHorizon:'#f6ad5f',
      sunCore:'#fffae8', sunGlow:'#ffd98f',
      fog:'#f0e6d4', fogWarm:'#ffe8c6',
      far:'#b6a888', farLit:'#fff0cf',
      ground:'#bfad87', street:'#b09c78',
      ink:'#2a231c', accent:'#c76a3a', good:'#2f8f82', warn:'#c7442a',
      windowGlow:'#ffdf9e', windowGlowStrength:0.5,
      rim:'#fff3d6',
      blocks:['#d98a5b','#e3b05e','#c7714e','#e8c98a','#a9b57e','#7fb0a3','#d7a074','#cf9a5f'],
      shadow:'rgba(60,40,22,0.2)',
      leafCol:['#d98a4a','#c7633a','#b8923f']
    };
  }
}
buildPalette();

/* ---------- offscreen helpers ---------- */
function makeCanvas(w,h){
  var cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(w)); cv.height=Math.max(1,Math.round(h));
  return cv;
}

/* paper grain */
var grainCv=null;
function buildGrain(){
  var s=140; grainCv=makeCanvas(s,s);
  var g=grainCv.getContext('2d'); if(!g) return;
  var img=g.createImageData(s,s);
  for(var i=0;i<img.data.length;i+=4){
    var v=200+((Math.random()*55)|0);
    img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v;
    img.data[i+3]=Math.random()*26; // low alpha specks
  }
  g.putImageData(img,0,0);
}
buildGrain();

/* ---------- background (sky, sun, skyline, fog) ---------- */
var bg = { sky:null, far:null, sun:null, light:null };
function buildBackground(){
  if(W<=0||H<=0) return;
  buildSky();
  buildSun();
  buildFarSkyline();
  buildLight();
}

function buildSky(){
  var cv=makeCanvas(W,H); var g=cv.getContext('2d'); if(!g){ bg.sky=cv; return; }
  var grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, PAL.skyTop);
  grad.addColorStop(0.42, PAL.skyMid);
  grad.addColorStop(0.72, PAL.skyLow);
  grad.addColorStop(1, PAL.skyHorizon);
  g.fillStyle=grad; g.fillRect(0,0,W,H);
  // soft watercolor cloud washes
  var horizon=H*0.72;
  for(var i=0;i<7;i++){
    var cy=rand(H*0.08,H*0.5), cw=rand(W*0.3,W*0.75), ch=rand(18,40);
    var cx=rand(0,W);
    var rg=g.createRadialGradient(cx,cy,0,cx,cy,cw*0.5);
    var tone= isDark ? withAlpha('#3a4b63',0.22) : withAlpha('#ffffff',0.3);
    rg.addColorStop(0,tone); rg.addColorStop(1,withAlpha('#ffffff',0));
    g.fillStyle=rg;
    g.save(); g.translate(cx,cy); g.scale(1,ch/(cw*0.5)); g.beginPath(); g.arc(0,0,cw*0.5,0,TAU); g.fill(); g.restore();
  }
  bg.sky=cv;
}

function buildSun(){
  var sz=Math.round(Math.max(W,H)*1.1);
  var cv=makeCanvas(sz,sz); var g=cv.getContext('2d'); if(!g){ bg.sun=cv; return; }
  var c=sz/2;
  var rg=g.createRadialGradient(c,c,0,c,c,c);
  rg.addColorStop(0, withAlpha(PAL.sunCore,0.95));
  rg.addColorStop(0.12, withAlpha(PAL.sunCore,0.8));
  rg.addColorStop(0.3, withAlpha(PAL.sunGlow,0.35));
  rg.addColorStop(0.6, withAlpha(PAL.sunGlow,0.08));
  rg.addColorStop(1, withAlpha(PAL.sunGlow,0));
  g.fillStyle=rg; g.fillRect(0,0,sz,sz);
  bg.sun=cv;
}

function buildFarSkyline(){
  var cv=makeCanvas(W,H); var g=cv.getContext('2d'); if(!g){ bg.far=cv; return; }
  var baseY=H*0.78;
  // two parallax rows of simple houses/roofs
  function row(yOff, col, scaleH, alpha){
    g.globalAlpha=alpha;
    var x=-20;
    while(x<W+40){
      var bw=rand(26,64), bh=rand(30,90)*scaleH;
      var top=baseY+yOff-bh;
      g.fillStyle=col;
      g.beginPath(); g.rect(x,top,bw,bh); g.fill();
      // pitched roof sometimes
      if(Math.random()<0.5){
        g.beginPath(); g.moveTo(x-3,top); g.lineTo(x+bw/2,top-rand(8,18)); g.lineTo(x+bw+3,top); g.closePath(); g.fill();
      }
      // a few lit windows in dark mode
      if(isDark && Math.random()<0.7){
        g.fillStyle=withAlpha(PAL.farLit,rand(0.25,0.6));
        for(var wy=top+6; wy<baseY+yOff-6; wy+=10){
          for(var wx=x+4; wx<x+bw-4; wx+=9){
            if(Math.random()<0.45) g.fillRect(wx,wy,3,4);
          }
        }
        g.fillStyle=col;
      }
      x+=bw+rand(2,10);
    }
    g.globalAlpha=1;
  }
  row(-H*0.02, mix(PAL.far,PAL.skyHorizon,isDark?0.0:0.25), 0.7, isDark?0.8:0.55);
  row(H*0.01, PAL.far, 1.0, isDark?0.95:0.8);
  bg.far=cv;
}

function buildLight(){
  // warm golden glow + vignette overlay, drawn with 'screen'/'multiply'
  var cv=makeCanvas(W,H); var g=cv.getContext('2d'); if(!g){ bg.light=cv; return; }
  var sx=W*0.78, sy=H*0.3;
  var rg=g.createRadialGradient(sx,sy,0,sx,sy,Math.max(W,H)*0.9);
  rg.addColorStop(0, withAlpha(PAL.sunGlow,isDark?0.3:0.22));
  rg.addColorStop(0.4, withAlpha(PAL.sunGlow,0.06));
  rg.addColorStop(1, withAlpha(PAL.sunGlow,0));
  g.fillStyle=rg; g.fillRect(0,0,W,H);
  bg.light=cv;
}

/* ---------- camera ---------- */
var Cam = { pivotX:0, pivotY:0, scale:90, targetScale:90, shake:0, shakeX:0, shakeY:0 };

/* world(local, y-up) -> screen. Includes tower lean rotation about pivot. */
function w2s(lx, ly){
  var cs=Math.cos(Phys.lean), sn=Math.sin(Phys.lean);
  var rx = lx*cs - ly*sn;
  var ry = lx*sn + ly*cs;
  return { x: Cam.pivotX + rx*Cam.scale + Cam.shakeX, y: Cam.pivotY - ry*Cam.scale + Cam.shakeY };
}
function s2w(sx, sy){
  var rx=(sx - Cam.pivotX - Cam.shakeX)/Cam.scale;
  var ry=(Cam.pivotY + Cam.shakeY - sy)/Cam.scale;
  var cs=Math.cos(Phys.lean), sn=Math.sin(Phys.lean);
  return { x: rx*cs + ry*sn, y: -rx*sn + ry*cs };
}

/* ---------- game constants ---------- */
var BW = 1.0;      // base module width (world units)
var BH = 0.6;      // module height
var FOUND_W = 1.26;// foundation width
var FOUND_H = 0.95;// foundation visual height (below pivot)
var LEAN_MAX = 0.42; // radians before topple

/* lean dynamics — an authored, height-scaled driven oscillator.
   The whole tower tilts by `lean`; a soft spring returns it toward the lean
   its centre-of-mass wants (eq). As floors rise the spring softens and the
   centre-of-mass leverage grows, so wobble gets wilder — a smooth ramp with
   no hard bifurcation. */
var PH = {
  k: 24.0,       // base spring stiffness (gentle ~1.3s sway early)
  c: 3.6,        // damping
  eqGain: 1.05,  // how far COM imbalance pulls the lean
  leverH: 0.16,  // extra COM leverage per floor
  softH: 0.18,   // spring softening per floor
  impulse: 0.42  // landing angular kick from an off-centre drop
};
/* difficulty / feel knobs */
var TUNE = {
  craneBase: 0.85,     // base crane speed
  cranePerFloor: 0.045,
  craneMax: 2.3,
  narrow: 0.016,       // block width shrink per floor
  narrowMin: 0.62,
  drumScale: 1.15,     // drum pulse wobble
  drumKick: 0.028,
  windFloor: 5,        // first floor gusts appear
  windScale: 1.1,      // gust strength
  stabPerfect: 0.74    // lean multiplier on a perfect drop
};

/* ---------- physics / tower ---------- */
var Phys = {
  blocks:[],      // {cx,cy,w,h,m,color,img,phi,born}
  lean:0, leanVel:0,
  Mx:0, My:0, I:0, mass:0,
  topY:0,         // local y of current top surface
  recompute:function(){
    var Mx=0,My=0,I=0,m=0;
    for(var i=0;i<this.blocks.length;i++){
      var b=this.blocks[i];
      Mx += b.m*b.cx; My += b.m*b.cy; I += b.m*(b.cx*b.cx + b.cy*b.cy); m+=b.m;
    }
    this.Mx=Mx; this.My=My; this.I=I+PH.Ibase; this.mass=m;
  },
  reset:function(){
    this.blocks=[]; this.lean=0; this.leanVel=0; this.topY=0;
    this.recompute();
  },
  addBlock:function(b){
    this.blocks.push(b);
    this.topY = b.cy + b.h/2;
    this.recompute();
  },
  step:function(dt, ext){
    var n=this.blocks.length;
    var comX = this.mass>0? this.Mx/this.mass : 0;        // average horizontal imbalance
    var lever = 1 + n*PH.leverH;
    var eq = comX * lever * PH.eqGain;                     // lean the mass "wants"
    var kH = PH.k / (1 + n*PH.softH);                      // spring softens with height
    var alpha = kH*(eq - this.lean) - PH.c*this.leanVel + ext;
    this.leanVel += alpha*dt;
    this.lean += this.leanVel*dt;
  }
};

/* ---------- block (house module) baking ---------- */
var BAKE = 150; // px per unit when baking module art
function bakeModule(w,h,color,opts){
  opts=opts||{};
  var pad=10;
  var pw=Math.round(w*BAKE)+pad*2, ph=Math.round(h*BAKE)+pad*2;
  var cv=makeCanvas(pw,ph); var g=cv.getContext('2d');
  if(!g) return {canvas:cv,pad:pad,wpx:pw,hpx:ph};
  var x=pad, y=pad, bw=w*BAKE, bh=h*BAKE;
  var roofH = opts.foundation ? 0 : Math.min(bh*0.34, rand(bh*0.14,bh*0.3));
  var bodyTop=y+roofH;
  var bodyH=bh-roofH;

  // soft contact shadow baked under
  // --- body base fill ---
  g.save();
  roundRectPath(g,x,bodyTop,bw,bodyH,Math.min(10,bw*0.08));
  g.clip();
  g.fillStyle=color; g.fillRect(x-2,bodyTop-2,bw+4,bodyH+4);
  // watercolor pigment blooms
  var blooms = 3+((Math.random()*3)|0);
  for(var i=0;i<blooms;i++){
    var bx=x+rand(0,bw), by=bodyTop+rand(0,bodyH), br=rand(bw*0.25,bw*0.7);
    var darker = Math.random()<0.5;
    var amt = darker? -rand(0.12,0.3) : rand(0.12,0.3);
    var rg=g.createRadialGradient(bx,by,0,bx,by,br);
    rg.addColorStop(0, shadeA(color, amt, rand(0.18,0.4)));
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle=rg; g.fillRect(x,bodyTop,bw,bodyH);
  }
  // vertical light gradient (sun from upper-right)
  var lg=g.createLinearGradient(x,bodyTop,x+bw,bodyTop);
  lg.addColorStop(0, withAlpha('#000000', isDark?0.22:0.14));
  lg.addColorStop(0.5, 'rgba(0,0,0,0)');
  lg.addColorStop(1, withAlpha(PAL.rim, 0.22));
  g.fillStyle=lg; g.fillRect(x,bodyTop,bw,bodyH);
  // top light
  var tg=g.createLinearGradient(0,bodyTop,0,bodyTop+bodyH);
  tg.addColorStop(0, withAlpha('#ffffff',0.14));
  tg.addColorStop(0.3,'rgba(255,255,255,0)');
  tg.addColorStop(1, withAlpha('#000000', isDark?0.28:0.16));
  g.fillStyle=tg; g.fillRect(x,bodyTop,bw,bodyH);
  // watercolor granulation — fine pigment speckle
  var specks=Math.min(90, Math.floor(bw*bodyH/420));
  for(var sgi=0;sgi<specks;sgi++){
    g.globalAlpha=rand(0.03,0.09);
    g.fillStyle = Math.random()<0.5? shade(color,-rand(0.2,0.4)) : shade(color, rand(0.15,0.35));
    g.fillRect(x+rand(0,bw), bodyTop+rand(0,bodyH), rand(1,2.4), rand(1,2.4));
  }
  g.globalAlpha=1;
  g.restore();

  // --- windows ---
  var cols = w>0.85?2:1;
  if(opts.foundation) cols = w>1.1?3:2;
  var rows = opts.foundation? 2 : 1;
  var winGlow = isDark;
  var mW = bw*0.17, mTop=bodyTop+bodyH*0.2, availW=bw-mW*2, availH=bodyH*(opts.foundation?0.55:0.5);
  var gapx=availW/cols, gapy=availH/rows;
  var winW=gapx*0.56, winH=Math.min(gapy*0.7, winW*1.25);
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var wx=x+mW+gapx*c+(gapx-winW)/2;
      var wy=mTop+gapy*r+(gapy-winH)/2;
      // frame
      g.fillStyle = shade(color,-0.34);
      roundRectPath(g,wx-2,wy-2,winW+4,winH+4,3); g.fill();
      // glass
      var lit = winGlow && Math.random()<0.78;
      if(lit){
        var wg=g.createLinearGradient(wx,wy,wx,wy+winH);
        wg.addColorStop(0, withAlpha(PAL.windowGlow,0.95));
        wg.addColorStop(1, shadeA(PAL.windowGlow,-0.2,0.8));
        g.fillStyle=wg;
      } else {
        g.fillStyle = isDark? withAlpha('#20303f',0.9) : withAlpha('#bcd0d8',0.85);
      }
      roundRectPath(g,wx,wy,winW,winH,2); g.fill();
      // mullion
      g.strokeStyle=shade(color,-0.28); g.lineWidth=1.2;
      g.beginPath(); g.moveTo(wx+winW/2,wy); g.lineTo(wx+winW/2,wy+winH);
      g.moveTo(wx,wy+winH/2); g.lineTo(wx+winW,wy+winH/2); g.stroke();
      if(lit){
        // warm bloom
        var bg2=g.createRadialGradient(wx+winW/2,wy+winH/2,0,wx+winW/2,wy+winH/2,winW*1.6);
        bg2.addColorStop(0, withAlpha(PAL.windowGlow, PAL.windowGlowStrength*0.5));
        bg2.addColorStop(1, withAlpha(PAL.windowGlow,0));
        g.fillStyle=bg2; g.fillRect(wx-winW,wy-winH,winW*3,winH*3);
      }
    }
  }

  // door on foundation
  if(opts.foundation){
    var dw=bw*0.2, dh=bodyH*0.3, dx=x+bw/2-dw/2, dy=bodyTop+bodyH-dh;
    g.fillStyle=shade(color,-0.4); roundRectPath(g,dx,dy,dw,dh,4); g.fill();
    g.fillStyle=withAlpha(PAL.windowGlow,isDark?0.6:0.2);
    g.fillRect(dx+dw*0.2,dy+dh*0.12,dw*0.6,dh*0.3);
    g.fillStyle=PAL.rim; g.fillRect(dx+dw*0.7,dy+dh*0.5,2.5,2.5);
  }

  // --- roof ---
  if(!opts.foundation){
    var roofType=opts.roof!=null?opts.roof:randInt(0,3);
    g.save();
    if(roofType===0){ // flat parapet
      g.fillStyle=shade(color,-0.22);
      g.fillRect(x-1,bodyTop-roofH, bw+2, roofH*0.8);
      g.fillStyle=shade(color,-0.08);
      g.fillRect(x-1,bodyTop-roofH, bw+2, roofH*0.28);
    } else if(roofType===1){ // pitched
      g.fillStyle=shade(color,-0.26);
      g.beginPath(); g.moveTo(x-3,bodyTop+2); g.lineTo(x+bw/2,bodyTop-roofH); g.lineTo(x+bw+3,bodyTop+2); g.closePath(); g.fill();
      g.fillStyle=withAlpha(PAL.rim,0.3);
      g.beginPath(); g.moveTo(x+bw/2,bodyTop-roofH); g.lineTo(x+bw+3,bodyTop+2); g.lineTo(x+bw*0.7,bodyTop+2); g.closePath(); g.fill();
    } else { // flat + detail
      g.fillStyle=shade(color,-0.2);
      g.fillRect(x-1,bodyTop-roofH*0.6, bw+2, roofH*0.6);
    }
    // rooftop props
    var prop=randInt(0,4);
    var topLine=bodyTop-roofH;
    if(prop===0){ // water tank
      g.fillStyle=shade(color,-0.36);
      var tw=bw*0.18, tx=x+bw*rand(0.3,0.6);
      g.fillRect(tx,topLine-bh*0.14,tw,bh*0.14);
      g.beginPath(); g.ellipse(tx+tw/2,topLine-bh*0.14,tw*0.6,bh*0.03,0,0,TAU); g.fill();
    } else if(prop===1){ // little plant
      g.fillStyle=pick(['#6f8f4a','#89986a','#7fa05a']);
      var px=x+bw*rand(0.3,0.7);
      g.beginPath(); g.arc(px,topLine-6,6,0,TAU); g.arc(px+7,topLine-4,5,0,TAU); g.fill();
      g.fillStyle=shade(color,-0.3); g.fillRect(px-7,topLine-3,16,4);
    } else if(prop===2){ // chimney w/ smoke-ish
      g.fillStyle=shade(color,-0.38);
      var cx2=x+bw*rand(0.25,0.7);
      g.fillRect(cx2,topLine-bh*0.16,bw*0.1,bh*0.16);
    } else if(prop===3){ // antenna
      g.strokeStyle=shade(color,-0.42); g.lineWidth=2;
      var ax=x+bw*rand(0.4,0.7);
      g.beginPath(); g.moveTo(ax,topLine); g.lineTo(ax,topLine-bh*0.2);
      g.moveTo(ax-5,topLine-bh*0.2); g.lineTo(ax+5,topLine-bh*0.14); g.stroke();
    }
    g.restore();
  } else {
    // foundation cap / stoop
    g.fillStyle=shade(color,-0.2);
    g.fillRect(x-2,bodyTop-6,bw+4,8);
  }

  // --- irregular hand-drawn outline ---
  g.strokeStyle=withAlpha(isDark?'#000000':'#3a2a1c', isDark?0.34:0.22);
  g.lineWidth=2.2;
  roundRectPath(g,x,bodyTop,bw,bodyH,Math.min(10,bw*0.08));
  g.stroke();

  return { canvas:cv, pad:pad, wpx:pw, hpx:ph, w:w, h:h };
}
function roundRectPath(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

var foundationArt=null;
function buildFoundation(){
  foundationArt = bakeModule(FOUND_W, FOUND_H, pick(PAL.blocks), {foundation:true});
}

/* ---------- particles ---------- */
var parts=[];
function spawnDust(sx,sy,n,col,spread,up){

    var a=rand(0,TAU), sp=rand(0.3,1)*spread;
    parts.push({x:sx,y:sy,vx:Math.cos(a)*sp, vy:(up?-Math.abs(Math.sin(a))*sp:Math.sin(a)*sp)-up*rand(10,60),
      life:rand(0.4,0.9),age:0,r:rand(2,6),col:col||PAL.fog,g:140,fade:true});
  }
}
function spawnSpark(sx,sy,n,col){
  for(var i=0;i<n;i++){
    var a=rand(-0.9,0.9)-Math.PI/2, sp=rand(80,260);
    parts.push({x:sx,y:sy,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:rand(0.5,1.0),age:0,r:rand(1.5,3.5),col:col||PAL.sunGlow,g:260,fade:true,spark:true});

/* floating score texts (screen space) */
var floats=[];
function spawnFloat(sx,sy,text,col,big){
  floats.push({x:sx,y:sy,text:text,col:col||PAL.accent,age:0,life:big?1.1:0.85,vy:-44,scale:big?1:0.8});
}
function updateFloats(dt){
  for(var i=floats.length-1;i>=0;i--){
    var f=floats[i]; f.age+=dt; f.y+=f.vy*dt; f.vy*=(1-dt*1.5);
    if(f.age>=f.life) floats.splice(i,1);
  }
}
function drawFloats(){
  for(var i=0;i<floats.length;i++){
    var f=floats[i]; var t=f.age/f.life;
    var a=t<0.2? t/0.2 : (1-(t-0.2)/0.8);
    var pop=f.age<0.12? (f.age/0.12) : 1;
    ctx.save();
    ctx.globalAlpha=clamp(a,0,1);
    ctx.font='700 '+Math.round(20*f.scale*(0.7+pop*0.3))+'px ui-monospace,SFMono-Regular,Menlo,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=f.col;
    ctx.shadowColor=PAL.shadow; ctx.shadowBlur=6;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

var leaves=[];
function spawnLeaf(){

    rot:rand(0,TAU), vr:rand(-2,2), sway:rand(0.5,1.5), ph:rand(0,TAU),

function spawnGustFx(dir){

      rot:rand(0,TAU), vr:dir*rand(3,7), sway:rand(1,2.5), ph:rand(0,TAU),

/* birds drifting at golden hour */
var birds=[];
function spawnBird(){
  var dir=Math.random()<0.5?1:-1;
  birds.push({x:dir>0?-24:W+24, y:rand(H*0.1,H*0.42), dir:dir, sp:rand(26,52), ph:rand(0,TAU), size:rand(5,9), flap:rand(5,9)});
}
function updateBirds(dt){
  if(birds.length<3 && Math.random()<dt*0.07) spawnBird();
  for(var i=birds.length-1;i>=0;i--){ var b=birds[i]; b.x+=b.dir*b.sp*dt; b.ph+=dt*b.flap; b.y+=Math.sin(b.ph*0.25)*5*dt;
    if(b.x<-50||b.x>W+50) birds.splice(i,1); }
}
function drawBirds(){
  ctx.save(); ctx.strokeStyle=withAlpha(isDark?'#0a1324':'#584936',0.5); ctx.lineWidth=1.8; ctx.lineCap='round';
  for(var i=0;i<birds.length;i++){ var b=birds[i]; var wv=b.size, fl=Math.sin(b.ph)*0.5+0.5, up=fl*wv*0.6;
    ctx.beginPath();
    ctx.moveTo(b.x-wv, b.y);
    ctx.quadraticCurveTo(b.x-wv*0.4, b.y-up, b.x, b.y);
    ctx.quadraticCurveTo(b.x+wv*0.4, b.y-up, b.x+wv, b.y);
    ctx.stroke();
  }
  ctx.restore();
}

/* downbeat ground ripples — the drum pulse through the foundation */
var ripples=[];
function spawnRipple(){ ripples.push({age:0, life:1.3}); }
function updateRipples(dt){ for(var i=ripples.length-1;i>=0;i--){ ripples[i].age+=dt; if(ripples[i].age>=ripples[i].life) ripples.splice(i,1); } }
function drawRipples(){
  var base=w2s(0,0);
  var gy=Math.max(base.y, H*0.86);
  for(var i=0;i<ripples.length;i++){ var r=ripples[i]; var t=r.age/r.life;
    ctx.save(); ctx.globalAlpha=(1-t)*0.4; ctx.strokeStyle=withAlpha(PAL.accent,0.9); ctx.lineWidth=2*(1-t)+0.5;
    ctx.beginPath(); ctx.ellipse(base.x, gy, 30+t*180, 6+t*22, 0, 0, TAU); ctx.stroke(); ctx.restore();
  }
}

function updateParticles(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.age+=dt;
    if(p.age>=p.life){ parts.splice(i,1); continue; }
    p.vy += p.g*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=(1-dt*1.2);
  }
  // leaves ambient
  for(var j=leaves.length-1;j>=0;j--){
    var l=leaves[j]; l.age+=dt; l.ph+=dt*l.sway;
    l.x += (l.vx + Math.sin(l.ph)*18)*dt;
    l.y += l.vy*dt; l.rot+=l.vr*dt;
    if(l.y>H+30 || l.age>l.life){ leaves.splice(j,1); }
  }
}
function drawParticles(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i]; var t=1-p.age/p.life;
    ctx.globalAlpha = p.fade? t : 1;
    ctx.fillStyle=p.col;
    if(p.spark){
      ctx.save(); ctx.translate(p.x,p.y);
      var ang=Math.atan2(p.vy,p.vx);
      ctx.rotate(ang);
      ctx.fillRect(0,-p.r*0.4, p.r*3*t, p.r*0.8);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  // leaves
  for(var j=0;j<leaves.length;j++){
    var l=leaves[j];
    ctx.save(); ctx.translate(l.x,l.y); ctx.rotate(l.rot);
    ctx.globalAlpha=0.9;
    ctx.fillStyle=l.col;
    ctx.beginPath();
    ctx.moveTo(0,-l.size*0.5);
    ctx.quadraticCurveTo(l.size*0.5,0,0,l.size*0.5);
    ctx.quadraticCurveTo(-l.size*0.5,0,0,-l.size*0.5);
    ctx.fill();
    ctx.strokeStyle=shade(l.col,-0.3); ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(0,-l.size*0.5); ctx.lineTo(0,l.size*0.5); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* ---------- audio (lazy, guarded) ---------- */
var AC=null, master=null, audioOn=false;
function initAudio(){
  if(audioOn) return;
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    AC=new Ctx();
    master=AC.createGain(); master.gain.value=0.42; master.connect(AC.destination);
    audioOn=true;
  }catch(e){ AC=null; audioOn=false; }
}
function resumeAudio(){
  try{ if(AC && AC.state==='suspended') AC.resume(); }catch(e){}
}
function tone(freq,dur,type,vol,when,slideTo){
  if(!audioOn||!AC) return;
  try{
    var t0=(when||AC.currentTime);
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function noiseBurst(dur,vol,lp){
  if(!audioOn||!AC) return;
  try{
    var n=Math.floor(AC.sampleRate*dur);
    var buf=AC.createBuffer(1,n,AC.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2); }
    var s=AC.createBufferSource(); s.buffer=buf;
    var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||1200;
    var g=AC.createGain(); g.gain.value=vol||0.2;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }catch(e){}
}
function sndLand(impact){
  tone(150+impact*60, 0.14, 'sine', 0.22, 0, 90);
  noiseBurst(0.09, 0.12+impact*0.08, 900);
}
function sndPerfect(combo){
  var base=523.25, semi=Math.pow(2,1/12);
  var step=Math.min(combo,8);
  tone(base*Math.pow(semi,step*2), 0.18,'triangle',0.2,0, base*Math.pow(semi,step*2));
  tone(base*Math.pow(semi,step*2+4), 0.22,'sine',0.14, (AC?AC.currentTime+0.04:0));
}
function sndKick(){
  tone(120,0.18,'sine',0.26,0,45);
  noiseBurst(0.05,0.06,300);
}
function sndGust(){ noiseBurst(0.6,0.08,700); }
function sndTopple(){
  tone(180,0.5,'sawtooth',0.14,0,40);
  noiseBurst(0.5,0.22,500);
  tone(70,0.6,'sine',0.2,0,40);
}

function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

function spawnPiece(){
  var w = BW * clamp(1 - floors*TUNE.narrow, TUNE.narrowMin, 1);
  var col = pick(PAL.blocks);
  var art = bakeModule(w, BH, col, {});
  piece = {
    w:w, h:BH, color:col, art:art,
    state:'hang',
    craneT: rand(0,TAU),
    craneSpeed: Math.min(TUNE.craneMax, TUNE.craneBase + floors*TUNE.cranePerFloor) * (sampleMode?0.5:1),
    amp: 1, // in world units, set at update
    screenX: W*0.5, hangY: H*0.17,
    y: H*0.17, vy:0,
    angle:0, rotPhase:0, held:false, holdT:0,
    landLX:0, newCy:0, targetY:0, offset:0, overlap:1, perfect:false
  };
}

/* decorative starter tower for the title screen */
function buildSampleTower(){
  Phys.reset();
  var n=5, cy=0;
  var off=0;
  for(var i=0;i<n;i++){
    var w=BW*rand(0.82,1), col=pick(PAL.blocks);
    off += rand(-0.12,0.12);
    var art=bakeModule(w,BH,col,{});
    cy += BH/2 + (i>0?BH/2:0);
    Phys.addBlock({cx:off,cy:cy,w:w,h:BH,m:1,color:col,art:art,phi:rand(-0.04,0.04),born:now()});
  }
  floors=n;
}

/* ---------- start / over ---------- */
function startGame(){
  initAudio(); resumeAudio();
  sampleMode=false;
  STATE='playing';
  floors=0; score=0; combo=0; freeze=0; scorePunch=0; comboTimer=0;
  parts.length=0; floats.length=0;
  if(comboChip) comboChip.style.opacity=0;
  windTimer=rand(4,7); windActive=0; windMag=0;
  beatClock=0; beatIndex=0; bpm=96;
  Phys.reset();
  // place foundation's roof as block 0 (the existing roofline we stack on)
  startTime=now(); elapsed=0;
  Cam.targetScale=computeTargetScale(); // let Cam.scale ease in for a gentle arrival zoom
  spawnPiece();
  updateHUD();
  var hudEl=D('hud'); if(hudEl) hudEl.style.opacity='1';
  if(titleEl){ titleEl.classList.add('hidden'); }
  if(overEl){ overEl.classList.add('hidden'); }
  flashBanner('TAP TO DROP');
}

var toppling=false, toppleT=0;
function gameOver(reason){
  if(STATE==='over') return;
  STATE='over';
  piece=null; // stop any in-flight drop from committing after the collapse
  elapsed=(now()-startTime)/1000;
  if(floors>best) best=floors;
  freeze=0.14;
  Cam.shake=16;
  toppling=true; toppleT=0;
  sndTopple();
  vibrate([24,40,80]);
  // give each block some tumble velocity
  for(var i=0;i<Phys.blocks.length;i++){
    var b=Phys.blocks[i];
    b.vx=rand(-1,1)*2 + (Phys.lean<0?2:-2); b.vy=rand(1,4); b.vr=rand(-4,4); b.fall=0;
  }
  // show overlay a touch later
  setTimeout(showOver, 700);

  function showOver(){
    if(fFloors) fFloors.textContent=floors;
    if(fScore) fScore.textContent=score;
    if(fBest) fBest.textContent=best;
    var head, eye, msg;
    if(floors>=18){ head='SKYLINE LEGEND'; eye='THE WHOLE BLOCK STOOD'; msg='The neighbourhood holds its breath.'; }
    else if(floors>=12){ head='GOLDEN'; eye='A TOWER AT DUSK'; msg='The fog never reached the top floor.'; }
    else if(floors>=7){ head='STEADY HAND'; eye='ROOM FOR MORE'; msg='Almost held the whole skyline.'; }
    else if(floors>=3){ head='TIMBER!'; eye='THE BLOCK CAME DOWN'; msg='Keep each drop near the centre.'; }
    else { head='OOF'; eye='FOUNDATIONS MATTER'; msg='Tap when the module is centred.'; }
    if(reason==='miss') eye='MISSED THE ROOF';
    if(overTitle) overTitle.textContent=head;
    if(overEyebrow) overEyebrow.textContent=eye;
    if(overMsg) overMsg.textContent=msg + '  ·  ' + Math.round(elapsed) + 's';
    if(overEl) overEl.classList.remove('hidden');
  }
}

function restartGame(){
  if(overEl) overEl.classList.add('hidden');
  toppling=false;
  startGame();
}

/* ---------- drop ---------- */
function computeTargetScale(){
  var topLocal = Phys.topY + (piece? piece.h : BH);
  topLocal = Math.max(topLocal, 2.2);
  var usableH = Cam.pivotY - H*0.17;
  var sByH = usableH / (topLocal + 0.6);
  var sByW = (W*0.46) / BW;
  return clamp(Math.min(sByH, sByW), 24, 150);
}

function doDrop(){
  if(STATE!=='playing' || !piece || piece.state!=='hang') return;
  piece.state='falling';
  piece.vy=0;
  // where will it land (local x) — derive from current screen x at top height
  var approxTopY = Cam.pivotY - (Phys.topY + piece.h/2)*Cam.scale;
  var wl = s2w(piece.screenX, approxTopY);
  piece.landLX = wl.x;
  piece.newCy = Phys.topY + piece.h/2;
}

function commitPiece(){
  if(STATE!=='playing' || !piece) return;
  var topB = Phys.blocks.length? Phys.blocks[Phys.blocks.length-1] : null;
  var topCx = topB? topB.cx : 0;
  var topW = topB? topB.w : FOUND_W;
  var offset = piece.landLX - topCx;
  var overlap = (piece.w/2 + topW/2) - Math.abs(offset);
  piece.offset=offset; piece.overlap=overlap;

  if(overlap <= 0.04){
    // missed — tips off the edge
    piece.state='missed';
    piece.vx = (offset>0? 2.4 : -2.4);
    piece.vr = (offset>0? 5 : -5);
    piece.fall=0;
    vibrate(20);
    noiseBurst(0.12,0.1,700);
    setTimeout(function(){ gameOver('miss'); }, 420);
    return;
  }

  // commit to tower
  var phi = -piece.angle - Phys.lean;
  var nb = {cx:piece.landLX, cy:piece.newCy, w:piece.w, h:piece.h, m:1, color:piece.color, art:piece.art, phi:phi, born:now(), landT:0};
  Phys.addBlock(nb);
  floors++;

  // landing impulse — off-center drop kicks the tower toward the heavy side
  var flush = Math.abs(piece.angle + Phys.lean);
  var kick = -offset*PH.impulse - Math.sign(offset||1)*flush*0.25;
  Phys.leanVel += kick;

  // scoring
  var eps = 0.055 + piece.w*0.04;
  var perfect = Math.abs(offset) < eps;
  var sp;
  var mid=w2s(nb.cx,nb.cy);
  if(perfect){
    combo++;
    sp = 20 + combo*8;
    score += sp;
    // precision stabilises the tower
    Phys.leanVel *= 0.4; Phys.lean *= TUNE.stabPerfect;
    showCombo(combo);
    spawnSpark(mid.x, mid.y, 14, PAL.sunGlow);
    spawnFloat(mid.x, mid.y - nb.h*Cam.scale*0.5, combo>1?('PERFECT ×'+combo):'PERFECT', PAL.accent, true);
    sndPerfect(combo);
    vibrate([8,20,8]);
    freeze=0.07;
    Cam.shake=Math.max(Cam.shake,4);
  } else {
    combo=0;
    if(comboChip) comboChip.style.opacity=0;
    sp = 10;
    score += sp;
    spawnFloat(mid.x, mid.y - nb.h*Cam.scale*0.5, '+'+sp, withAlpha(PAL.ink,0.85), false);
    sndLand(Math.min(Math.abs(offset)*6,1));
    vibrate(10);
    freeze=0.04;
    Cam.shake=Math.max(Cam.shake, 2+Math.abs(offset)*8);
  }
  scorePunch=1;
  // dust at contact
  var cs=w2s(nb.cx, nb.cy - nb.h/2);
  spawnDust(cs.x, cs.y, 10, withAlpha(PAL.fog,0.9), 120, 0.3);

  // milestones
  if(floors===5) flashBanner('ROOFLINE');
  else if(floors===8) flashBanner('SKYLINE STEADY');
  else if(floors===12) flashBanner('GOLDEN HOUR');
  else if(floors===18) flashBanner('LEGENDARY');

  updateHUD();
  // next piece
  spawnPiece();
}

/* ---------- HUD helpers ---------- */
function updateHUD(){
  if(floorVal) floorVal.textContent=floors;
  if(scoreVal) scoreVal.textContent=score;
}
var comboTimer=0, scorePunch=0;
function showCombo(c){
  if(!comboChip) return;
  comboChip.innerHTML = 'PERFECT <span class="x">×'+c+'</span>';
  comboTimer=1.0;
}
var bannerTimer=0;
function flashBanner(txt){
  if(!bannerEl) return;
  bannerEl.textContent=txt; bannerTimer=1.6;
}

/* ---------- input ---------- */
var pressed=false;
function onPress(e){
  try{
    if(e && e.cancelable) e.preventDefault();
  }catch(_){}
  resumeAudio();
  if(STATE!=='playing') return;
  if(piece && piece.state==='hang'){
    piece.held=true; piece.holdT=0; pressed=true;
  }
}
function onRelease(e){
  try{ if(e && e.cancelable) e.preventDefault(); }catch(_){}
  if(STATE!=='playing'){ pressed=false; return; }
  if(piece && piece.state==='hang' && pressed){
    piece.held=false;
    doDrop();
  }
  pressed=false;
}

if(gameEl){
  // Pointer events drive play (unify mouse + touch). touch-action:none stops scroll.
  gameEl.addEventListener('pointerdown', onPress, {passive:false});
  window.addEventListener('pointerup', onRelease, {passive:false});
  gameEl.addEventListener('pointercancel', onRelease, {passive:false});
  // Extra guard against mobile scroll/pull-to-refresh during a drag (does not block pointer events).
  gameEl.addEventListener('touchmove', function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});
}
window.addEventListener('keydown', function(e){
  if(e.repeat) return;
  var k=e.key;
  if(k===' '||k==='Spacebar'||k==='Enter'||k==='ArrowUp'||k==='w'||k==='W'){
    e.preventDefault();
    if(STATE==='title'){ startGame(); return; }
    if(STATE==='over'){ restartGame(); return; }
    if(STATE==='playing' && piece && piece.state==='hang'){ piece.held=true; piece.holdT=0; pressed=true; }
  } else if(k==='r'||k==='R'){
    if(STATE==='over') restartGame();
  }
});
window.addEventListener('keyup', function(e){
  var k=e.key;
  if(k===' '||k==='Spacebar'||k==='Enter'||k==='ArrowUp'||k==='w'||k==='W'){
    if(STATE==='playing' && piece && piece.state==='hang' && pressed){
      piece.held=false; doDrop();
    }
    pressed=false;
  }
});

if(startBtn) startBtn.addEventListener('click', function(e){ e.preventDefault(); startGame(); });
if(restartBtn) restartBtn.addEventListener('click', function(e){ e.preventDefault(); restartGame(); });

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });
try{
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  var onThemeChange=function(){ readTheme(); buildPalette(); buildBackground(); buildFoundation();

  };

  else if(mq.addListener) mq.addListener(onThemeChange);
}catch(e){}

document.addEventListener('visibilitychange', function(){
  if(document.hidden){ /* pause handled by dt clamp */ }
  else { lastT=now(); }
});

/* ---------- update ---------- */
function update(dt){
  // tempo rises with height (drum pulses intensify → more wobble, escalation)
  if(STATE==='playing') bpm = 90 + Math.min(floors,22)*2.0;
  // beat clock always runs (drives ambience)
  var beatLen = 60/bpm;
  beatClock += dt;
  if(beatClock>=beatLen){
    beatClock-=beatLen;
    beatIndex=(beatIndex+1)%4;
    pulseBeat(beatIndex);
    if(STATE==='playing'){
      // drum pulse ripples through the foundation (alternating = oscillatory, non-drifting)
      var amp = (0.4 + Math.min(floors,28)*0.1) * TUNE.drumScale;
      Phys.leanVel += (beatIndex%2===0? 1:-1) * amp * TUNE.drumKick * (0.6+Math.random()*0.8);
      if(beatIndex===0){ sndKick(); spawnRipple(); }
    }
  }

  if(comboTimer>0){ comboTimer-=dt; }
  if(bannerTimer>0){ bannerTimer-=dt; }
  if(scorePunch>0){ scorePunch-=dt*4; if(scorePunch<0) scorePunch=0; }

  // ambient leaves + birds
  if(leaves.length<9 && Math.random()<dt*1.1){ spawnLeaf(); }
  updateParticles(dt);
  updateFloats(dt);
  updateBirds(dt);
  updateRipples(dt);

  // camera scale easing
  Cam.targetScale = STATE==='playing'? computeTargetScale() : (sampleMode? 70 : Cam.targetScale);
  if(sampleMode) Cam.targetScale = clamp((Cam.pivotY-H*0.26)/(Phys.topY+1), 40, 110);
  Cam.scale = lerp(Cam.scale, Cam.targetScale, 1-Math.pow(0.001,dt));
  // shake decay
  Cam.shake *= Math.pow(0.0025, dt);
  if(Cam.shake<0.05) Cam.shake=0;
  Cam.shakeX = (Math.random()*2-1)*Cam.shake;
  Cam.shakeY = (Math.random()*2-1)*Cam.shake;

  if(freeze>0){ freeze-=dt; return; } // hit pause freezes sim (but not render)

  // wind / gusts
  var extTorque=0;
  if(STATE==='playing'){
    if(floors>=TUNE.windFloor){
      windTimer-=dt;
      if(windTimer<=0 && windActive<=0){
        windActive = rand(0.9,1.5);
        windMag = rand(0.45,1.0)*(0.5+Math.min(floors,28)*0.055)*TUNE.windScale;
        windDir = Math.random()<0.5?-1:1;
        windTimer = rand(3.4,6.8) - Math.min(floors*0.08,2);
        sndGust();
        spawnGustFx(windDir);
        flashBanner(windDir>0? 'GUST →' : '← GUST');
      }
    }
    if(windActive>0){
      windActive-=dt;
      var wEnv = Math.sin(clamp(1-windActive/1.2,0,1)*Math.PI); // ramp up/down
      windPhase += dt*8;
      extTorque += windDir*windMag*wEnv*(0.6+0.4*Math.sin(windPhase));
      // push the hanging piece a touch
      if(piece && piece.state==='hang'){ piece.windNudge = windDir*windMag*wEnv*0.05; }
    } else if(piece){ piece.windNudge = 0; }
  }

  // physics
  if(STATE==='playing'){
    var sub=2;
    for(var s=0;s<sub;s++) Phys.step(dt/sub, extTorque);
    if(Math.abs(Phys.lean) > LEAN_MAX){ gameOver('topple'); }
  } else if(STATE==='title' && sampleMode){
    // gentle idle sway
    Phys.step(dt, Math.sin(now()/900)*0.6);
  } else if(toppling){
    toppleT+=dt;
    // let lean run away for drama
    Phys.lean += Phys.leanVel*dt;
    Phys.leanVel += Math.sign(Phys.lean||1)*2.2*dt;
    // tumble blocks
    for(var i=0;i<Phys.blocks.length;i++){
      var b=Phys.blocks[i];
      if(b.vx==null) continue;
      b.fall=(b.fall||0)+dt;
      b.cx += b.vx*dt; b.cy += b.vy*dt; b.vy-=6*dt; b.phi+=b.vr*dt;
    }
  }

  // piece update
  if(piece){
    if(piece.state==='hang'){
      piece.craneT += dt*piece.craneSpeed;
      var ampPx = (W*0.5 - Math.max(40, piece.w*Cam.scale*0.6));
      piece.screenX = W*0.5 + Math.sin(piece.craneT)*ampPx + (piece.windNudge||0)*Cam.scale;
      piece.y = piece.hangY + Math.sin(piece.craneT*2)*3;
      if(piece.held){
        piece.holdT+=dt;
        if(piece.holdT>0.11){ piece.rotPhase+=dt*2.2; piece.angle=Math.sin(piece.rotPhase)*0.5; }
      }
    } else if(piece.state==='falling'){
      piece.vy += 7200*dt; // screen px/s^2 — snappy drop
      piece.y += piece.vy*dt;
      piece.targetY = w2s(piece.landLX, piece.newCy).y;
      if(piece.y >= piece.targetY){ piece.y=piece.targetY; commitPiece(); }
    } else if(piece.state==='missed'){
      piece.fall+=dt;
      piece.vy = (piece.vy||0)+4200*dt;
      piece.y += piece.vy*dt;
      piece.screenX += piece.vx*Cam.scale*dt;
      piece.angle += piece.vr*dt;
    }
  }

  elapsed=(now()-startTime)/1000;
}

function pulseBeat(idx){
  for(var i=0;i<beatDots.length;i++){
    if(i===idx) beatDots[i].classList.add('on'); else beatDots[i].classList.remove('on');
  }
}

/* ---------- render ---------- */
function clearBG(){
  if(bg.sky){ ctx.drawImage(bg.sky,0,0,W,H); }
  else { ctx.fillStyle=PAL.skyHorizon; ctx.fillRect(0,0,W,H); }
}
function render(time){
  if(!ctx) return;
  ctx.save();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  // sky
  clearBG();

  // sun (low on horizon, right side)
  if(bg.sun){
    var sunX=W*0.76, sunY=H*0.52;
    var ss=bg.sun.width;
    ctx.globalAlpha=1;
    ctx.drawImage(bg.sun, sunX-ss/2, sunY-ss/2, ss, ss);
    // sun disc
    ctx.fillStyle=withAlpha(PAL.sunCore,0.9);
    ctx.beginPath(); ctx.arc(sunX,sunY, Math.max(W,H)*0.05,0,TAU); ctx.fill();
  }

  // birds high in the sky
  drawBirds();

  // far skyline with slight parallax from lean
  if(bg.far){
    var par = Phys.lean*30;
    ctx.globalAlpha=1;
    ctx.drawImage(bg.far, par*0.4, 0, W, H);
  }

  // fog band (two drifting layers)
  drawFog(time);

  // ground / street
  drawGround();

  // tower shadow on ground
  drawTowerShadow();

  // drum-pulse ripples on the ground
  if(STATE==='playing') drawRipples();

  // foundation + blocks
  drawTower();

  // incoming piece + crane
  drawPieceAndCrane();

  // particles (dust/sparks/leaves) in screen space
  drawParticles();
  drawFloats();

  // golden light overlay
  if(bg.light){ ctx.globalAlpha=1; ctx.globalCompositeOperation='screen'; ctx.drawImage(bg.light,0,0,W,H); ctx.globalCompositeOperation='source-over'; }

  // vignette
  drawVignette();

  // paper grain
  if(grainCv){
    ctx.globalAlpha=isDark?0.05:0.06;
    var gp=ctx.createPattern(grainCv,'repeat');
    if(gp){ ctx.fillStyle=gp; ctx.fillRect(0,0,W,H); }
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // DOM HUD bits that animate
  renderHUDDynamic();
}

function drawFog(time){
  var y=H*0.66;
  ctx.save();
  var f1=(time*8)% (W);
  for(var layer=0; layer<2; layer++){
    var yy=y + layer*22;
    var a=isDark? (0.14+layer*0.05) : (0.22-layer*0.06);
    var grad=ctx.createLinearGradient(0,yy-30,0,yy+60);
    grad.addColorStop(0, withAlpha(PAL.fog,0));
    grad.addColorStop(0.5, withAlpha(layer? PAL.fog:PAL.fogWarm, a));
    grad.addColorStop(1, withAlpha(PAL.fog, a*0.6));
    ctx.fillStyle=grad;
    ctx.fillRect(0,yy-30,W,120);
    // soft blobs drifting
    ctx.globalAlpha=a*0.7;
    ctx.fillStyle=withAlpha(PAL.fog, 0.5);
    var off=(layer? -f1: f1);
    for(var i=-1;i<W/90+1;i++){
      var bx=((i*90+off)%(W+180))-90;
      ctx.beginPath(); ctx.ellipse(bx, yy+layer*8, 70, 16, 0,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawGround(){
  var gy=H*0.88;
  var grad=ctx.createLinearGradient(0,gy,0,H);
  grad.addColorStop(0, PAL.street);
  grad.addColorStop(1, shade(PAL.ground,-0.15));
  ctx.fillStyle=grad; ctx.fillRect(0,gy,W,H-gy);
  // subtle street edge highlight (golden rim)
  ctx.fillStyle=withAlpha(PAL.rim, isDark?0.12:0.22);
  ctx.fillRect(0,gy,W,2);
}

function drawTowerShadow(){
  // long soft shadow cast to the left (sun on right)
  var base=w2s(0,0);
  ctx.save();
  ctx.globalAlpha=isDark?0.3:0.18;
  ctx.fillStyle=PAL.shadow;
  var len = (Phys.topY)*Cam.scale*0.9 + 40;
  ctx.beginPath();
  ctx.ellipse(base.x- len*0.1, Cam.pivotY+ FOUND_H*Cam.scale*0.5, Math.max(40, FOUND_W*Cam.scale*0.7)+len*0.4, 18, 0,0,TAU);
  ctx.fill();
  ctx.restore();
}

function drawBlockArt(art, cx, cy, w, h, phi){
  var sc=w2s(cx,cy);
  var sang = -(Phys.lean + phi);
  ctx.save();
  ctx.translate(sc.x, sc.y);
  ctx.rotate(sang);
  var dw=w*Cam.scale, dh=h*Cam.scale;
  var padScaleX = dw/(w*BAKE), padScaleY=dh/(h*BAKE);
  // draw baked art centered (account for pad)
  var drawW = art.wpx*padScaleX, drawH=art.hpx*padScaleY;
  ctx.drawImage(art.canvas, -drawW/2, -drawH/2, drawW, drawH);
  ctx.restore();
}

function drawTower(){
  // foundation (below pivot, sways with lean)
  if(foundationArt){
    var fc=w2s(0, -FOUND_H/2);
    var sang=-(Phys.lean);
    ctx.save();
    ctx.translate(fc.x, fc.y);
    ctx.rotate(sang);
    var dw=FOUND_W*Cam.scale, dh=FOUND_H*Cam.scale;
    var psx=dw/(FOUND_W*BAKE), psy=dh/(FOUND_H*BAKE);
    ctx.drawImage(foundationArt.canvas, -foundationArt.wpx*psx/2, -foundationArt.hpx*psy/2, foundationArt.wpx*psx, foundationArt.hpx*psy);
    ctx.restore();
  }
  // blocks
  for(var i=0;i<Phys.blocks.length;i++){
    var b=Phys.blocks[i];
    // contact shadow between blocks
    if(!toppling){
      var bs=w2s(b.cx, b.cy-b.h/2);
      ctx.save(); ctx.globalAlpha=isDark?0.26:0.16; ctx.fillStyle=PAL.shadow;
      ctx.beginPath(); ctx.ellipse(bs.x, bs.y, b.w*Cam.scale*0.5, 5, 0,0,TAU); ctx.fill();
      ctx.restore();
    }
    drawBlockArt(b.art, b.cx, b.cy, b.w, b.h, b.phi);
  }
}

function drawPieceAndCrane(){
  if(!piece) return;
  if(STATE!=='playing' && piece.state==='hang') { /* still draw idle piece on title? no */ }
  if(STATE!=='playing') return;

  var px=piece.screenX, py=piece.y;
  // crane rail across top
  if(piece.state==='hang'){
    ctx.save();
    ctx.strokeStyle=withAlpha(PAL.ink,0.5); ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(0, H*0.085); ctx.lineTo(W, H*0.085); ctx.stroke();
    // trolley
    ctx.fillStyle=PAL.ink;
    ctx.fillRect(px-14, H*0.085-6, 28, 10);
    // cable
    ctx.strokeStyle=withAlpha(PAL.ink,0.6); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(px, H*0.085); ctx.lineTo(px, py - piece.h*Cam.scale*0.5); ctx.stroke();
    ctx.restore();
  }

  // the module
  var dw=piece.w*Cam.scale, dh=piece.h*Cam.scale;
  var art=piece.art;
  var psx=dw/(piece.w*BAKE), psy=dh/(piece.h*BAKE);
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(piece.angle);
  // guide: center line + drop shadow target when hanging
  ctx.drawImage(art.canvas, -art.wpx*psx/2, -art.hpx*psy/2, art.wpx*psx, art.hpx*psy);
  ctx.restore();

  // drop guide: colored line + landing ghost that turns green when centered
  if(piece.state==='hang'){
    var topB = Phys.blocks.length? Phys.blocks[Phys.blocks.length-1] : null;
    var topCx = topB? topB.cx : 0;
    var topW = topB? topB.w : FOUND_W;
    var topScreen = w2s(topCx, Phys.topY);
    var landLocal = s2w(px, topScreen.y).x;
    var predOff = landLocal - topCx;
    var predOverlap = (piece.w/2 + topW/2) - Math.abs(predOff);
    var eps = 0.055 + piece.w*0.04;
    var good = Math.abs(predOff) <= eps;
    var willMiss = predOverlap <= 0.06;
    var gcol = willMiss? PAL.warn : (good? PAL.good : PAL.accent);
    var landCenter = w2s(landLocal, Phys.topY + piece.h/2);
    ctx.save();
    // drop line
    ctx.globalAlpha=0.55;
    ctx.strokeStyle=withAlpha(gcol,0.8);
    ctx.setLineDash([3,7]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(px, py+dh*0.5); ctx.lineTo(landCenter.x, landCenter.y); ctx.stroke();
    ctx.setLineDash([]);
    // ghost footprint
    ctx.globalAlpha=good?0.8:0.5;
    ctx.translate(landCenter.x, landCenter.y);
    ctx.rotate(-(Phys.lean + piece.angle));
    ctx.strokeStyle=gcol; ctx.lineWidth=good?2.5:1.8;
    roundRectPath(ctx, -dw/2, -dh/2, dw, dh, Math.min(8,dw*0.08));
    ctx.stroke();
    ctx.restore();
  }
}

function drawVignette(){
  var g=ctx.createRadialGradient(W*0.5,H*0.44,Math.min(W,H)*0.3, W*0.5,H*0.5, Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1, isDark?'rgba(0,0,0,0.45)':'rgba(40,24,10,0.14)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function renderHUDDynamic(){
  // balance marker
  if(balMark && balanceEl){
    var t = clamp(Phys.lean / LEAN_MAX, -1, 1);
    balMark.style.left = (50 + t*50) + '%';
    var danger=Math.abs(t)>0.66;
    if(danger) balanceEl.classList.add('warn'); else balanceEl.classList.remove('warn');
  }
  // combo chip (persists while combo active; pulses on gain)
  if(comboChip){
    if(combo>0){
      comboChip.style.opacity = 0.65 + Math.max(0,comboTimer)*0.35;
      var pop = comboTimer>0.8? (comboTimer-0.8)/0.2 : 0;
      comboChip.style.transform = 'scale('+(1+pop*0.35)+')';
    } else {
      comboChip.style.opacity = 0;
    }
  }
  // score punch
  if(scoreVal){
    if(scorePunch>0){ scoreVal.style.transform='scale('+(1+scorePunch*0.22)+')'; }
    else scoreVal.style.transform='scale(1)';
  }
  if(bannerEl){
    if(bannerTimer>0){
      var ba=Math.min(1, bannerTimer*2)*Math.min(1,(1.6-bannerTimer)*3);
      bannerEl.style.opacity=clamp(ba,0,1);
      bannerEl.style.letterSpacing=(0.34 + (1.6-bannerTimer)*0.04)+'em';
    } else bannerEl.style.opacity=0;
  }
}

/* ---------- main loop ---------- */
var lastT=now(), acc=0; var STEP=1/120;
var started=false;
function frame(t){
  requestAnimationFrame(frame);
  try{
    var dt=(t-lastT)/1000; lastT=t;
    if(!(dt>0)) dt=0.0001;
    if(dt>0.1) dt=0.1;
    acc+=dt;
    var guard=0;
    while(acc>=STEP && guard<8){ update(STEP); acc-=STEP; guard++; }
    if(guard>=8) acc=0;
    render(t/1000);
  }catch(err){
    // never let a frame error become fatal
    if(window.console&&console.warn) console.warn('frame', err && err.message);
  }
}

/* ---------- boot ---------- */
function boot(){
  if(!ctx){
    // graceful: show a message, keep body non-zero
    if(gameEl){ gameEl.style.background=PAL.skyHorizon; }
    return;
  }
  resize();
  buildFoundation();
  buildSampleTower();
  spawnPiece(); piece=null; // no live piece on title
  lastT=now();
  requestAnimationFrame(frame);
}

boot();
})();
</script>
