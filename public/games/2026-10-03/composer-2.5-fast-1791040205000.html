<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Deploy</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c0e;--fg:#e8eaed;--muted:#8b939c;--accent:#00e5a0;--accent2:#00c4ff;
  --fog:rgba(180,190,200,.12);--panel:rgba(10,12,14,.88);--border:rgba(255,255,255,.08);
  --glow:rgba(0,229,160,.35);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a0c0e;--fg:#e8eaed;--muted:#8b939c;--accent:#00e5a0;--accent2:#00c4ff;
    --fog:rgba(180,190,200,.12);--panel:rgba(10,12,14,.88);--border:rgba(255,255,255,.08);
    --glow:rgba(0,229,160,.35);
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#eef1f4;--fg:#1a1f24;--muted:#5c6670;--accent:#00996a;--accent2:#0077b3;
    --fog:rgba(80,90,100,.1);--panel:rgba(238,241,244,.92);--border:rgba(0,0,0,.08);
    --glow:rgba(0,153,106,.25);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
canvas#game{flex:1;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hud-block span{display:block;font-size:22px;font-weight:600;color:var(--fg);letter-spacing:0;text-transform:none;margin-top:2px}
.hud-block.accent span{color:var(--accent)}
#combo{position:absolute;top:max(60px,calc(env(safe-area-inset-top)+48px));left:50%;transform:translateX(-50%);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13px;color:var(--accent);
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
#combo.show{opacity:1}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  z-index:10;pointer-events:none;padding:24px;text-align:center;transition:opacity .35s}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay h1{font-size:clamp(28px,8vw,42px);font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.overlay h2{font-size:clamp(22px,6vw,32px);font-weight:600;margin-bottom:12px}
.overlay p{font-size:14px;color:var(--muted);max-width:280px;line-height:1.5;margin-bottom:28px}
.overlay .tag{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.btn{pointer-events:auto;min-width:160px;min-height:48px;padding:14px 32px;border:none;border-radius:8px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:14px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:var(--accent);color:var(--bg);
  box-shadow:0 0 24px var(--glow);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
#hint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);pointer-events:none;z-index:2;opacity:.7}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-block"><label>Score</label><span id="scoreVal">0</span></div>
    <div class="hud-block accent" style="text-align:right"><label>Time</label><span id="timeVal">60</span></div>
  </div>
  <div id="combo"></div>
  <div id="hint">Drag to draw · Release to deploy</div>
  <div class="overlay" id="titleScreen">
    <div class="tag">SF · Clear Autumn · 15°</div>
    <h1>Pocket Deploy</h1>
    <p>Draw brief paths through the fog before the lane closes. Ship your agent before sunrise.</p>
    <button class="btn" data-smoke="start" id="startBtn">Deploy</button>
  </div>
  <div class="overlay hidden" id="gameOverScreen">
    <div class="tag">Signal lost in the mist</div>
    <h2>Session End</h2>
    <p>Deployments: <strong id="finalDeploys">0</strong> · Best combo: <strong id="finalCombo">0</strong></p>
    <p style="margin-top:-16px;margin-bottom:28px">Score: <strong id="finalScore">0</strong></p>
    <button class="btn" data-smoke="restart" id="restartBtn">Retry</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var scoreEl = document.getElementById('scoreVal');
var timeEl = document.getElementById('timeVal');
var comboEl = document.getElementById('combo');
var titleScreen = document.getElementById('titleScreen');
var gameOverScreen = document.getElementById('gameOverScreen');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');
var hintEl = document.getElementById('hint');
var finalScoreEl = document.getElementById('finalScore');
var finalDeploysEl = document.getElementById('finalDeploys');
var finalComboEl = document.getElementById('finalCombo');

var W = 0, H = 0, dpr = 1;
var state = 'title';
var score = 0, combo = 0, maxCombo = 0, deploys = 0;
var timeLeft = 60, wave = 1;
var lastTs = 0, shakeT = 0, hitPause = 0, waveFlash = 0;
var darkMode = true;

var drawPath = [];
var isDrawing = false;
var deployments = [];
var particles = [];
var fogLayers = [];
var windows = [];
var targets = [];
var nextWindowAt = 0;
var windowInterval = 2.8;

var audioCtx = null;

function initAudio(){
  try{
    if(typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
  }catch(e){}
}

function tone(freq, dur, vol, type){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function detectTheme(){
  darkMode = !window.matchMedia || !window.matchMedia('(prefers-color-scheme:light)').matches;
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function rand(a, b){ return a + Math.random() * (b - a); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function dist(x1,y1,x2,y2){ var dx=x2-x1, dy=y2-y1; return Math.sqrt(dx*dx+dy*dy); }

function initFog(){
  fogLayers = [];
  for(var i = 0; i < 5; i++){
    fogLayers.push({
      y: rand(0.15, 0.85) * H,
      speed: rand(8, 20) * (i % 2 ? 1 : -1),
      opacity: 0.04 + i * 0.025,
      scale: rand(0.8, 1.4),
      phase: rand(0, Math.PI * 2)
    });
  }
}

function spawnWindow(){
  var margin = 40 + wave * 4;
  var size = clamp(120 - wave * 8, 44, 120);
  var x = rand(margin + size/2, W - margin - size/2);
  var y = rand(H * 0.25, H * 0.72);
  var duration = clamp(3.2 - wave * 0.22, 1.2, 3.2);
  var w = {
    x: x, y: y, r: size / 2,
    life: duration, maxLife: duration,
    active: true, id: Date.now() + Math.random()
  };
  windows.push(w);
  var tx = rand(W * 0.2, W * 0.8);
  var ty = rand(H * 0.06, H * 0.18);
  targets.push({ x: tx, y: ty, windowId: w.id, pulse: 0, hit: false });
}

function resetGame(){
  score = 0; combo = 0; maxCombo = 0; deploys = 0;
  timeLeft = 60; wave = 1;
  drawPath = []; isDrawing = false;
  deployments = []; particles = [];
  windows = []; targets = [];
  nextWindowAt = 0.5;
  windowInterval = 2.8;
  shakeT = 0; hitPause = 0;
  initFog();
  spawnWindow();
  updateHUD();
}

function updateHUD(){
  scoreEl.textContent = score;
  timeEl.textContent = Math.ceil(timeLeft);
  if(combo > 1){
    comboEl.textContent = combo + '× FLOW';
    comboEl.classList.add('show');
  } else {
    comboEl.classList.remove('show');
  }
}

function spawnParticles(x, y, color, n){
  for(var i = 0; i < n; i++){
    var a = rand(0, Math.PI * 2);
    var sp = rand(40, 180);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, 0.7), maxLife: 0.7,
      color: color, size: rand(2, 5)
    });
  }
}

function pathLength(pts){
  var len = 0;
  for(var i = 1; i < pts.length; i++) len += dist(pts[i-1].x, pts[i-1].y, pts[i].x, pts[i].y);
  return len;
}

function samplePath(pts, t){
  if(pts.length < 2) return pts[0] || {x:0,y:0};
  var total = pathLength(pts);
  var target = t * total;
  var acc = 0;
  for(var i = 1; i < pts.length; i++){
    var seg = dist(pts[i-1].x, pts[i-1].y, pts[i].x, pts[i].y);
    if(acc + seg >= target){
      var f = (target - acc) / seg;
      return { x: pts[i-1].x + (pts[i].x - pts[i-1].x) * f, y: pts[i-1].y + (pts[i].y - pts[i-1].y) * f };
    }
    acc += seg;
  }
  return pts[pts.length - 1];
}

function pointInWindow(px, py){
  for(var i = 0; i < windows.length; i++){
    var w = windows[i];
    if(!w.active) continue;
    if(dist(px, py, w.x, w.y) < w.r * 0.85) return w;
  }
  return null;
}

function pathCrossesWindow(pts){
  var samples = 24;
  for(var s = 0; s <= samples; s++){
    var p = samplePath(pts, s / samples);
    var w = pointInWindow(p.x, p.y);
    if(w) return w;
  }
  return null;
}

function launchDeployment(pts){
  if(pts.length < 2) return;
  var len = pathLength(pts);
  if(len < 20) return;
  var crossed = pathCrossesWindow(pts);
  var startX = pts[0].x;
  var startY = pts[0].y;
  var speed = clamp(280 + len * 0.3, 280, 520);
  deployments.push({
    pts: pts.slice(),
    t: 0,
    speed: speed,
    totalLen: len,
    crossed: crossed,
    windowId: crossed ? crossed.id : null,
    done: false,
    trail: []
  });
  tone(440 + combo * 20, 0.08, 0.06, 'triangle');
}

function finishDeployment(dep, success){
  dep.done = true;
  if(success){
    deploys++;
    combo++;
    if(combo > maxCombo) maxCombo = combo;
    var bonus = Math.floor(100 * (1 + combo * 0.15) * (1 + wave * 0.05));
    score += bonus;
    hitPause = 0.06;
    spawnParticles(dep.trail.length ? dep.trail[dep.trail.length-1].x : W/2,
      dep.trail.length ? dep.trail[dep.trail.length-1].y : H/2, getAccent(), 16);
    tone(660 + combo * 30, 0.12, 0.1, 'sine');
    vibrate(20);
    for(var i = 0; i < targets.length; i++){
      if(targets[i].windowId === dep.windowId){ targets[i].hit = true; break; }
    }
  } else {
    combo = 0;
    shakeT = 0.25;
    spawnParticles(dep.trail.length ? dep.trail[dep.trail.length-1].x : W/2,
      dep.trail.length ? dep.trail[dep.trail.length-1].y : H/2, getFailColor(), 10);
    tone(180, 0.2, 0.08, 'sawtooth');
    vibrate([30, 20, 30]);
  }
  updateHUD();
}

function getAccent(){ return darkMode ? '#00e5a0' : '#00996a'; }
function getAccent2(){ return darkMode ? '#00c4ff' : '#0077b3'; }
function getFailColor(){ return darkMode ? '#ff6b5a' : '#d94030'; }
function getBg(){ return darkMode ? '#0a0c0e' : '#eef1f4'; }
function getFogColor(a){ return darkMode ? 'rgba(160,170,180,'+a+')' : 'rgba(100,110,120,'+a+')'; }

function getPointer(e){
  var rect = canvas.getBoundingClientRect();
  var cx, cy;
  if(e.touches && e.touches.length){
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  return { x: cx - rect.left, y: cy - rect.top };
}

function onPointerDown(e){
  if(state !== 'playing') return;
  e.preventDefault();
  var p = getPointer(e);
  if(p.y < H * 0.78) return;
  isDrawing = true;
  drawPath = [p];
}

function onPointerMove(e){
  if(!isDrawing || state !== 'playing') return;
  e.preventDefault();
  var p = getPointer(e);
  var last = drawPath[drawPath.length - 1];
  if(dist(last.x, last.y, p.x, p.y) > 4){
    drawPath.push(p);
    var maxLen = clamp(180 - wave * 8, 80, 180);
    while(pathLength(drawPath) > maxLen && drawPath.length > 2) drawPath.shift();
  }
}

function onPointerUp(e){
  if(!isDrawing || state !== 'playing') return;
  e.preventDefault();
  isDrawing = false;
  if(drawPath.length >= 2) launchDeployment(drawPath);
  drawPath = [];
}

function startGame(){
  initAudio();
  resetGame();
  state = 'playing';
  titleScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  hintEl.style.opacity = '0.7';
}

function endGame(){
  state = 'gameover';
  finalScoreEl.textContent = score;
  finalDeploysEl.textContent = deploys;
  finalComboEl.textContent = maxCombo;
  gameOverScreen.classList.remove('hidden');
  hintEl.style.opacity = '0';
  tone(330, 0.3, 0.06, 'sine');
}

function update(dt){
  if(state !== 'playing') return;
  if(hitPause > 0){ hitPause -= dt; return; }

  timeLeft -= dt;
  if(timeLeft <= 0){ timeLeft = 0; endGame(); return; }

  var newWave = Math.floor((60 - timeLeft) / 12) + 1;
  if(newWave > wave){ wave = newWave; waveFlash = 1.8; windowInterval = clamp(2.8 - wave * 0.18, 1.4, 2.8); tone(520, 0.1, 0.05); }

  nextWindowAt -= dt;
  if(nextWindowAt <= 0){
    spawnWindow();
    nextWindowAt = windowInterval + rand(-0.3, 0.3);
  }

  for(var i = windows.length - 1; i >= 0; i--){
    windows[i].life -= dt;
    if(windows[i].life <= 0) windows[i].active = false;
    if(windows[i].life < -0.5){ windows.splice(i, 1); }
  }
  for(var j = targets.length - 1; j >= 0; j--){
    var found = false;
    for(var k = 0; k < windows.length; k++){
      if(windows[k].id === targets[j].windowId){ found = true; break; }
    }
    if(!found && targets[j].hit) targets.splice(j, 1);
    else if(!found) targets.splice(j, 1);
    else targets[j].pulse += dt * 4;
  }

  for(var d = deployments.length - 1; d >= 0; d--){
    var dep = deployments[d];
    if(dep.done){ deployments.splice(d, 1); continue; }
    dep.t += (dep.speed * dt) / dep.totalLen;
    var pos = samplePath(dep.pts, clamp(dep.t, 0, 1));
    dep.trail.push({ x: pos.x, y: pos.y });
    if(dep.trail.length > 30) dep.trail.shift();

    if(dep.t >= 1){
      var success = !!(dep.crossed && dep.crossed.active);
      finishDeployment(dep, success);
    } else {
      var cur = samplePath(dep.pts, dep.t);
      if(!dep.crossed){
        var wHit = pointInWindow(cur.x, cur.y);
        if(wHit){ dep.crossed = wHit; dep.windowId = wHit.id; }
      }
    }
  }

  for(var i = fogLayers.length - 1; i >= 0; i--){
    fogLayers[i].phase += dt * 0.4;
    fogLayers[i].y += Math.sin(fogLayers[i].phase) * dt * 6;
  }

  for(var p = particles.length - 1; p >= 0; p--){
    particles[p].life -= dt;
    particles[p].x += particles[p].vx * dt;
    particles[p].y += particles[p].vy * dt;
    particles[p].vy += 120 * dt;
    if(particles[p].life <= 0) particles.splice(p, 1);
  }

  if(shakeT > 0) shakeT -= dt;
  if(waveFlash > 0) waveFlash -= dt;
  timeEl.textContent = Math.ceil(timeLeft);
}

function drawFogLayer(layer, waveMult){
  var alpha = layer.opacity * (1 + wave * 0.08) * waveMult;
  ctx.fillStyle = getFogColor(alpha);
  var bandH = 60 * layer.scale;
  ctx.beginPath();
  for(var x = 0; x <= W + 20; x += 20){
    var yOff = Math.sin(x * 0.008 + layer.phase) * 18;
    if(x === 0) ctx.moveTo(x - 10, layer.y + yOff - bandH/2);
    else ctx.lineTo(x, layer.y + yOff - bandH/2);
  }
  for(var x2 = W + 20; x2 >= 0; x2 -= 20){
    var yOff2 = Math.sin(x2 * 0.008 + layer.phase + 1) * 18;
    ctx.lineTo(x2, layer.y + yOff2 + bandH/2);
  }
  ctx.closePath();
  ctx.fill();
}

function draw(){
  var sx = shakeT > 0 ? (Math.random() - 0.5) * 8 * shakeT * 4 : 0;
  var sy = shakeT > 0 ? (Math.random() - 0.5) * 8 * shakeT * 4 : 0;
  ctx.save();
  ctx.translate(sx, sy);

  ctx.fillStyle = getBg();
  ctx.fillRect(0, 0, W, H);

  var grad = ctx.createLinearGradient(0, 0, 0, H);
  if(darkMode){
    grad.addColorStop(0, 'rgba(0,196,255,0.04)');
    grad.addColorStop(1, 'rgba(0,229,160,0.02)');
  } else {
    grad.addColorStop(0, 'rgba(0,119,179,0.06)');
    grad.addColorStop(1, 'rgba(0,153,106,0.04)');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  var fogMult = 1 + (wave - 1) * 0.15;
  for(var f = 0; f < fogLayers.length; f++) drawFogLayer(fogLayers[f], fogMult);

  for(var i = 0; i < windows.length; i++){
    var w = windows[i];
    if(!w.active) continue;
    var pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.005 + w.id);
    var shrink = w.r * (0.7 + 0.3 * (w.life / w.maxLife));
    ctx.beginPath();
    ctx.arc(w.x, w.y, shrink, 0, Math.PI * 2);
    ctx.fillStyle = getBg();
    ctx.fill();
    ctx.strokeStyle = getAccent();
    ctx.globalAlpha = 0.3 + 0.5 * (w.life / w.maxLife);
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 0.15 + pulse * 0.1;
    ctx.strokeStyle = getAccent2();
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(w.x, w.y, shrink + 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  for(var t = 0; t < targets.length; t++){
    var tg = targets[t];
    if(tg.hit) continue;
    var ps = 0.6 + 0.4 * Math.sin(tg.pulse);
    ctx.beginPath();
    ctx.arc(tg.x, tg.y, 8 + ps * 3, 0, Math.PI * 2);
    ctx.fillStyle = getAccent2();
    ctx.globalAlpha = 0.5 + ps * 0.3;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = getAccent2();
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tg.x, tg.y);
    for(var wi = 0; wi < windows.length; wi++){
      if(windows[wi].id === tg.windowId){ ctx.lineTo(windows[wi].x, windows[wi].y); break; }
    }
    ctx.globalAlpha = 0.12;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  for(var d = 0; d < deployments.length; d++){
    var dep = deployments[d];
    if(dep.trail.length > 1){
      ctx.beginPath();
      ctx.moveTo(dep.trail[0].x, dep.trail[0].y);
      for(var ti = 1; ti < dep.trail.length; ti++) ctx.lineTo(dep.trail[ti].x, dep.trail[ti].y);
      ctx.strokeStyle = getAccent();
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    var pos = samplePath(dep.pts, clamp(dep.t, 0, 1));
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = getAccent();
    ctx.shadowColor = getAccent();
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if(drawPath.length > 1){
    ctx.beginPath();
    ctx.moveTo(drawPath[0].x, drawPath[0].y);
    for(var pi = 1; pi < drawPath.length; pi++) ctx.lineTo(drawPath[pi].x, drawPath[pi].y);
    ctx.strokeStyle = getAccent2();
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = getAccent2();
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.fillStyle = darkMode ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.04)';
  ctx.fillRect(0, H * 0.88, W, H * 0.12);
  ctx.fillStyle = getMuted();
  ctx.font = "10px ui-monospace, 'SFMono-Regular', Menlo, monospace";
  ctx.textAlign = 'center';
  ctx.fillText('POCKET', W / 2, H * 0.935);
  ctx.beginPath();
  ctx.arc(W / 2, H * 0.96, 5, 0, Math.PI * 2);
  ctx.fillStyle = getAccent();
  ctx.fill();

  for(var p = 0; p < particles.length; p++){
    var pt = particles[p];
    ctx.globalAlpha = pt.life / pt.maxLife;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = darkMode ? 'rgba(10,12,14,0.55)' : 'rgba(238,241,244,0.65)';
  var fogOverlayAlpha = 0.25 + wave * 0.04;
  ctx.fillStyle = getFogColor(fogOverlayAlpha);
  ctx.fillRect(0, 0, W, H);

  if(waveFlash > 0 && state === 'playing'){
    ctx.globalAlpha = Math.min(1, waveFlash);
    ctx.fillStyle = getAccent();
    ctx.font = "600 13px ui-monospace, 'SFMono-Regular', Menlo, monospace";
    ctx.textAlign = 'center';
    ctx.fillText('WAVE ' + wave + ' · FOG THICKENING', W / 2, H * 0.42);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function getMuted(){ return darkMode ? '#8b939c' : '#5c6670'; }

function loop(ts){
  if(!lastTs) lastTs = ts;
  var dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function bindEvents(){
  startBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
  restartBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('mouseleave', onPointerUp);

  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('touchmove', onPointerMove, { passive: false });
  canvas.addEventListener('touchend', onPointerUp, { passive: false });
  canvas.addEventListener('touchcancel', onPointerUp, { passive: false });

  window.addEventListener('resize', resize);
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){ detectTheme(); });
  }

  document.addEventListener('keydown', function(e){
    if(state === 'title' && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); startGame(); }
    if(state === 'gameover' && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); startGame(); }
  });
}

detectTheme();
resize();
initFog();
bindEvents();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
