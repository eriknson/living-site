<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amber Waves</title>
<style>
  :root {
    --bg: #fff3e0;
    --text: #333;
    --btn-bg: #cc5500;
    --btn-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a0f00;
      --text: #eee;
      --btn-bg: #ffb347;
      --btn-text: #1a0f00;
    }
  }
  body, html {
    margin: 0; padding: 0; width: 100dvw; height: 100dvh;
    background: var(--bg); color: var(--text);
    overflow: hidden; 
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none; 
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block; width: 100%; height: 100%;
  }
  #ui, .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .overlay {
    background: rgba(255,243,224,0.8);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  @media (prefers-color-scheme: dark) {
    .overlay { background: rgba(26,15,0,0.8); }
  }
  h1 { margin: 0 0 10px 0; font-size: 2.5rem; text-align: center; text-transform: uppercase; letter-spacing: 2px;}
  p { margin: 0 0 40px 0; font-size: 1.1rem; opacity: 0.8; text-align: center; max-width: 80%; line-height: 1.5;}
  button {
    pointer-events: auto;
    background: var(--btn-bg); color: var(--btn-text);
    border: none; padding: 18px 45px; font-size: 1.2rem;
    border-radius: 35px; font-weight: bold; font-family: inherit;
    cursor: pointer; text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: transform 0.1s, background 0.2s;
  }
  button:active { transform: scale(0.95); }
  
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="menu" class="overlay">
    <h1>Amber Waves</h1>
    <p>Tap lanes to the beat.<br>Keep the signal alive.</p>
    <button id="start-btn" data-smoke="start">Start Sync</button>
  </div>
  <div id="gameover" class="overlay hidden">
    <h1>Signal Lost</h1>
    <p id="final-score">Score: 0</p>
    <button id="restart-btn" data-smoke="restart">Restart</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const menuUI = document.getElementById('menu');
const gameoverUI = document.getElementById('gameover');
const finalScoreText = document.getElementById('final-score');

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

let isDark = false;
function updateColors() {
    isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
}
updateColors();

function getLaneColor(idx) {
    const laneColsDark = ['#ffb732', '#ff7a00', '#e53935'];
    const laneColsLight = ['#cc7000', '#cc3b00', '#b20000'];
    return isDark ? laneColsDark[idx] : laneColsLight[idx];
}

function getFlatColor() {
    return isDark ? '#4a3b2c' : '#d2bca8';
}

let audioCtx;
let masterGain;
let laneGainNodes = [];

let state = 'MENU'; 
let score = 0;
let coherence = 50;
let visualCoherence = 50;
let currentBPM = 100;
let audioStartTime = 0;
let beatOffset = 0;
let lanesVisual = [{ active: true }, { active: true }, { active: true }];
let laneFlashes = [0, 0, 0];
let visualNotes = [];
let particles = [];
let scheduledVisualUpToBeat = 0;
let scheduledAudioUpToBeat = 0;
const visualLookahead = 5.0;
const audioLookahead = 0.5;
const BEATS_ON_SCREEN = 4.0;
let lastTimeFallback = performance.now();

const pat0 = [
    { b: 0, f: 130.81 }, { b: 2.5, f: 155.56 }, { b: 4, f: 130.81 }, { b: 6.5, f: 174.61 },
    { b: 8, f: 130.81 }, { b: 10.5, f: 196.00 }, { b: 12, f: 155.56 }, { b: 14.5, f: 130.81 }
];
const pat1 = [
    { b: 1, f: 261.63 }, { b: 3, f: 261.63 }, { b: 4.5, f: 349.23 },
    { b: 6, f: 261.63 }, { b: 7.5, f: 392.00 }, { b: 9, f: 261.63 },
    { b: 11, f: 261.63 }, { b: 12.5, f: 233.08 }, { b: 15, f: 349.23 }
];
const pat2 = [
    { b: 0.5, f: 392.00 }, { b: 2.5, f: 523.25 }, { b: 4.5, f: 349.23 },
    { b: 6.5, f: 523.25 }, { b: 8.5, f: 392.00 }, { b: 10.5, f: 523.25 },
    { b: 12.5, f: 349.23 }, { b: 14.5, f: 523.25 }
];
let lanesData = [];

function initAudio() {
    if (audioCtx) return;
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        audioCtx = new AudioContext();
    } catch (e) {
        console.warn("Audio init failed", e);
        audioCtx = null;
    }
}

function startGame() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    
    if (audioCtx) {
        if (masterGain) masterGain.disconnect();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.5;
        masterGain.connect(audioCtx.destination);
        
        laneGainNodes = [];
        for (let i=0; i<3; i++) {
            let lg = audioCtx.createGain();
            lg.gain.value = 1.0;
            lg.connect(masterGain);
            laneGainNodes.push(lg);
        }
        audioStartTime = audioCtx.currentTime;
    }
    
    state = 'PLAYING';
    score = 0;
    coherence = 50;
    visualCoherence = 50;
    currentBPM = 100;
    visualNotes = [];
    particles = [];
    laneFlashes = [0, 0, 0];
    
    lanesData = [
        { pattern: pat0, visualNextIdx: 0, visualLoopCount: 0 },
        { pattern: pat1, visualNextIdx: 0, visualLoopCount: 0 },
        { pattern: pat2, visualNextIdx: 0, visualLoopCount: 0 }
    ];
    
    lanesVisual = [{ active: true }, { active: true }, { active: true }];
    beatOffset = 0;
    scheduledVisualUpToBeat = 0;
    scheduledAudioUpToBeat = 0;
    lastTimeFallback = performance.now();
    
    menuUI.classList.add('hidden');
    gameoverUI.classList.add('hidden');
}

function setBPM(newBPM) {
    beatOffset = getVisualBeat();
    if (audioCtx) audioStartTime = audioCtx.currentTime;
    lastTimeFallback = performance.now();
    currentBPM = newBPM;
}

function getVisualBeat() {
    if (audioCtx) {
        return beatOffset + (audioCtx.currentTime - audioStartTime) * (currentBPM / 60);
    } else {
        return beatOffset + ((performance.now() - lastTimeFallback) / 1000) * (currentBPM / 60);
    }
}

function scheduleNoteAudio(laneIdx, beat, freq) {
    if (!audioCtx) return;
    let timeToPlay = audioStartTime + (beat - beatOffset) / (currentBPM / 60);
    if (timeToPlay < audioCtx.currentTime) return;
    
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(laneGainNodes[laneIdx]);
        
        if (laneIdx === 0) osc.type = 'sine';
        else if (laneIdx === 1) osc.type = 'triangle';
        else osc.type = 'sawtooth';
        
        osc.frequency.setValueAtTime(freq, timeToPlay);
        gain.gain.setValueAtTime(0, timeToPlay);
        gain.gain.linearRampToValueAtTime(0.5, timeToPlay + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, timeToPlay + 0.3);
        
        if (laneIdx === 2) {
            let filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2000, timeToPlay);
            filter.frequency.exponentialRampToValueAtTime(400, timeToPlay + 0.3);
            osc.disconnect();
            osc.connect(filter);
            filter.connect(gain);
        }
        
        osc.start(timeToPlay);
        osc.stop(timeToPlay + 0.35);
    } catch(e) {}
}

function updateLogic() {
    let currentBeat = getVisualBeat();
    
    while (scheduledVisualUpToBeat < currentBeat + visualLookahead) {
        for (let i=0; i<3; i++) {
            let ld = lanesData[i];
            if (ld.pattern.length === 0) continue;
            
            while (true) {
                let nextNote = ld.pattern[ld.visualNextIdx];
                let noteBeat = nextNote.b + ld.visualLoopCount * 16;
                if (noteBeat <= scheduledVisualUpToBeat) {
                    visualNotes.push({ 
                        lane: i, beat: noteBeat, freq: nextNote.f, 
                        hit: false, missed: false, y: 0, audioScheduled: false 
                    });
                    ld.visualNextIdx++;
                    if (ld.visualNextIdx >= ld.pattern.length) {
                        ld.visualNextIdx = 0;
                        ld.visualLoopCount++;
                    }
                } else {
                    break;
                }
            }
        }
        scheduledVisualUpToBeat += 0.1;
    }
    
    while (scheduledAudioUpToBeat < currentBeat + audioLookahead) {
        for (let note of visualNotes) {
            if (!note.audioScheduled && note.beat <= scheduledAudioUpToBeat) {
                scheduleNoteAudio(note.lane, note.beat, note.freq);
                note.audioScheduled = true;
            }
        }
        scheduledAudioUpToBeat += 0.1;
    }
    
    const HIT_ZONE_Y = height * 0.85;
    for (let i=0; i<visualNotes.length; i++) {
        let note = visualNotes[i];
        let beatDiff = note.beat - currentBeat; 
        let progress = 1 - (beatDiff / BEATS_ON_SCREEN);
        note.y = progress * HIT_ZONE_Y;
        
        if (beatDiff < -0.3 && !note.hit && !note.missed) {
            note.missed = true;
            updateLaneMute(note.lane, false);
            coherence -= 5;
            laneFlashes[note.lane] = -0.3;
            try { if (navigator.vibrate) navigator.vibrate(40); } catch(e){}
        }
    }
    
    visualNotes = visualNotes.filter(n => n.beat - currentBeat > -1.0);
    
    if (coherence <= 0) gameOver();
    
    if (coherence >= 100) {
        coherence = 50;
        setBPM(currentBPM + 10);
        laneFlashes = [1, 1, 1];
        if (audioCtx) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(masterGain);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.55);
            } catch(e) {}
        }
    }
}

function updateLaneMute(laneIdx, active) {
    lanesVisual[laneIdx].active = active;
    if (audioCtx && laneGainNodes[laneIdx]) {
        let now = audioCtx.currentTime;
        laneGainNodes[laneIdx].gain.cancelScheduledValues(now);
        laneGainNodes[laneIdx].gain.setTargetAtTime(active ? 1.0 : 0.0, now, 0.05);
    }
}

function spawnParticles(laneIdx, y, color) {
    let x = (laneIdx + 0.5) * (width / 3);
    for (let i=0; i<15; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0, color: color
        });
    }
}

function updateDrawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) {
            particles.splice(i, 1);
        } else {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2 + p.life * 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1.0;
}

function drawAmbient() {
    ctx.fillStyle = isDark ? '#1a0b00' : '#fff0df';
    ctx.fillRect(0, 0, width, height);
    for (let i=0; i<3; i++) {
        let x = (i + 0.5) * (width / 3);
        ctx.beginPath();
        ctx.strokeStyle = getLaneColor(i);
        ctx.lineWidth = 2;
        let t = performance.now() * 0.002;
        for (let y = 0; y < height; y += 10) {
            let dx = Math.sin(y * 0.02 + t + i * 2) * 30; 
            if (y === 0) ctx.moveTo(x + dx, y);
            else ctx.lineTo(x + dx, y);
        }
        ctx.stroke();
    }
}

function draw() {
    ctx.fillStyle = isDark ? '#1a0b00' : '#fff0df';
    ctx.fillRect(0, 0, width, height);
    
    let currentBeat = getVisualBeat();
    let beatPhase = currentBeat % 1.0; 
    let pulseAlpha = Math.max(0, 1 - beatPhase * 3);
    if (visualCoherence > 50) {
        pulseAlpha *= (visualCoherence - 50) / 50; 
        ctx.fillStyle = isDark ? `rgba(255, 180, 50, ${pulseAlpha * 0.05})` : `rgba(200, 80, 0, ${pulseAlpha * 0.05})`;
        ctx.fillRect(0, 0, width, height);
    }
    
    const HIT_ZONE_Y = height * 0.85;
    for (let i=0; i<3; i++) {
        let x = (i + 0.5) * (width / 3);
        let flash = laneFlashes[i];
        ctx.beginPath();
        if (flash > 0) {
            ctx.strokeStyle = isDark ? `rgba(255, 255, 255, ${0.2 + flash * 0.8})` : `rgba(0, 0, 0, ${0.2 + flash * 0.8})`;
            ctx.lineWidth = 2 + flash * 3;
        } else if (flash < 0) {
            ctx.strokeStyle = `rgba(255, 0, 0, ${-flash})`;
            ctx.lineWidth = 4;
        } else {
            ctx.strokeStyle = isDark ? `rgba(255, 255, 255, 0.2)` : `rgba(0, 0, 0, 0.2)`;
            ctx.lineWidth = 2;
        }
        ctx.moveTo(x - 40, HIT_ZONE_Y);
        ctx.lineTo(x + 40, HIT_ZONE_Y);
        ctx.stroke();
        
        if (flash > 0) laneFlashes[i] = Math.max(0, flash - 0.05);
        if (flash < 0) laneFlashes[i] = Math.min(0, flash + 0.05);
    }
    
    for (let i=0; i<3; i++) {
        let x = (i + 0.5) * (width / 3);
        ctx.beginPath();
        let isActive = lanesVisual[i].active;
        ctx.strokeStyle = isActive ? getLaneColor(i) : getFlatColor();
        ctx.lineWidth = isActive ? 3 : 1;
        
        let t = performance.now() * 0.005;
        for (let y = 0; y < height; y += 10) {
            let dx = 0;
            for (let n of visualNotes) {
                if (n.lane === i && !n.hit && n.y > 0 && n.y < height) {
                    let dist = Math.abs(y - n.y);
                    if (dist < 80) {
                        let env = Math.exp(-(dist * dist) / (2 * 20 * 20));
                        dx += Math.sin(y * 0.1 - t * 3) * 30 * env;
                    }
                }
            }
            if (isActive) dx += (Math.random() - 0.5) * 2; 
            
            if (y === 0) ctx.moveTo(x + dx, y);
            else ctx.lineTo(x + dx, y);
        }
        ctx.stroke();
    }
    
    updateDrawParticles();
    
    ctx.fillStyle = isDark ? '#fff' : '#000';
    ctx.font = "20px ui-monospace, 'SFMono-Regular', Menlo, monospace";
    ctx.textAlign = "left";
    ctx.fillText(`SCORE ${score}`, 20, 40);
    ctx.textAlign = "right";
    ctx.fillText(`${Math.floor(currentBPM)} BPM`, width - 20, 40);
    
    visualCoherence += (coherence - visualCoherence) * 0.1;
    let barWidth = Math.min(200, width - 40);
    let barX = width / 2 - barWidth / 2;
    ctx.fillStyle = getFlatColor();
    ctx.fillRect(barX, 60, barWidth, 6);
    
    let barCol = isDark ? '#fff' : '#000';
    if (coherence > 80) barCol = '#4caf50';
    else if (coherence < 30) barCol = '#f44336';
    
    ctx.fillStyle = barCol;
    ctx.fillRect(barX, 60, (visualCoherence / 100) * barWidth, 6);
}

function gameOver() {
    state = 'GAMEOVER';
    finalScoreText.textContent = `Score: ${score}  |  Reached: ${Math.floor(currentBPM)} BPM`;
    gameoverUI.classList.remove('hidden');
    if (audioCtx && masterGain) {
        let now = audioCtx.currentTime;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setTargetAtTime(0.0, now, 0.1);
    }
}

function handleTap(x) {
    if (state !== 'PLAYING') return;
    let laneIdx = Math.floor(x / (width / 3));
    if (laneIdx < 0) laneIdx = 0;
    if (laneIdx > 2) laneIdx = 2;
    
    let currentBeat = getVisualBeat();
    let hitToleranceBeats = 0.4;
    let nearestNote = null;
    let minDiff = Infinity;
    
    for (let i=0; i<visualNotes.length; i++) {
        let note = visualNotes[i];
        if (note.lane === laneIdx && !note.hit && !note.missed) {
            let diff = Math.abs(note.beat - currentBeat);
            if (diff < minDiff) {
                minDiff = diff;
                nearestNote = note;
            }
        }
    }
    
    if (nearestNote && minDiff <= hitToleranceBeats) {
        nearestNote.hit = true;
        updateLaneMute(laneIdx, true);
        coherence = Math.min(100, coherence + 3); 
        score += 10 + Math.floor(currentBPM / 10);
        spawnParticles(laneIdx, nearestNote.y, getLaneColor(laneIdx));
        laneFlashes[laneIdx] = 1.0;
        try { if (navigator.vibrate) navigator.vibrate(15); } catch(e){}
    } else {
        coherence -= 3;
        laneFlashes[laneIdx] = -0.5;
        try { if (navigator.vibrate) navigator.vibrate(30); } catch(e){}
    }
}

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault(); 
    if (state !== 'PLAYING') return;
    for (let i=0; i<e.changedTouches.length; i++) {
        handleTap(e.changedTouches[i].clientX);
    }
}, {passive: false});

canvas.addEventListener('mousedown', (e) => {
    if (state !== 'PLAYING') return;
    handleTap(e.clientX);
});

window.addEventListener('keydown', (e) => {
    if (state !== 'PLAYING') return;
    if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') handleTap(width/6);
    if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') handleTap(width/2);
    if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') handleTap(5*width/6);
});

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

function loop(timestamp) {
    if (state === 'PLAYING') {
        updateLogic();
        draw();
    } else if (state === 'MENU') {
        drawAmbient();
    } else if (state === 'GAMEOVER') {
        draw();
    }
    requestAnimationFrame(loop);
}

window.addEventListener('load', () => {
    lastTimeFallback = performance.now();
    requestAnimationFrame(loop);
});
</script>
</body>
</html>
