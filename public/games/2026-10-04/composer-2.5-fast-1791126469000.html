<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Deploy</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0f12;--fg:#e4e8ec;--muted:#7a8490;--accent:#00d4aa;--accent2:#38bdf8;
  --warn:#f59e0b;--danger:#ef4444;--panel:rgba(12,15,18,.92);--border:rgba(255,255,255,.07);
  --glow:rgba(0,212,170,.4);--fog:rgba(140,155,170,.15);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0c0f12;--fg:#e4e8ec;--muted:#7a8490;--accent:#00d4aa;--accent2:#38bdf8;
    --warn:#f59e0b;--danger:#ef4444;--panel:rgba(12,15,18,.92);--border:rgba(255,255,255,.07);
    --glow:rgba(0,212,170,.4);--fog:rgba(140,155,170,.15);
  }
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8ecf0;--fg:#141a20;--muted:#5a6570;--accent:#008f72;--accent2:#0284c7;
    --warn:#d97706;--danger:#dc2626;--panel:rgba(232,236,240,.94);--border:rgba(0,0,0,.08);
    --glow:rgba(0,143,114,.3);--fog:rgba(80,95,110,.12);
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
canvas#game{flex:1;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 6px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-col{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud-col span{display:block;font-size:20px;font-weight:600;color:var(--fg);letter-spacing:0;text-transform:none;margin-top:1px}
.hud-col.accent span{color:var(--accent)}
#shipMeter{position:absolute;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));
  pointer-events:none;z-index:2}
#shipMeter label{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.meter-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden;position:relative}
.meter-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:4px;transition:width .15s ease-out}
.meter-ship{position:absolute;right:0;top:50%;transform:translate(50%,-50%);font-size:14px;opacity:.6}
#combo{position:absolute;top:max(52px,calc(env(safe-area-inset-top)+40px));left:50%;
  transform:translateX(-50%) scale(.8);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  font-size:12px;color:var(--accent);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:2}
#combo.show{opacity:1;transform:translateX(-50%) scale(1)}
#hint{position:absolute;bottom:max(38px,calc(env(safe-area-inset-bottom)+24px));left:50%;
  transform:translateX(-50%);font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  pointer-events:none;z-index:2;opacity:.65}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:10;pointer-events:none;padding:24px;text-align:center;transition:opacity .4s,visibility .4s}
.overlay.hidden{opacity:0;visibility:hidden}
.overlay .tag{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.overlay h1{font-size:clamp(26px,7.5vw,40px);font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.overlay h2{font-size:clamp(20px,5.5vw,28px);font-weight:600;margin-bottom:10px}
.overlay p{font-size:13px;color:var(--muted);max-width:290px;line-height:1.55;margin-bottom:24px}
.overlay .stat{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:11px;color:var(--fg);margin-bottom:20px}
.btn{pointer-events:auto;min-width:168px;min-height:48px;padding:14px 28px;border:none;border-radius:8px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:var(--accent);color:var(--bg);
  box-shadow:0 0 28px var(--glow);transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-col"><label>Shards</label><span id="scoreVal">0</span></div>
    <div class="hud-col accent" style="text-align:right"><label>Deploy</label><span id="timeVal">30</span></div>
  </div>
  <div id="combo"></div>
  <div id="shipMeter">
    <label>Ship milestone</label>
    <div class="meter-track"><div class="meter-fill" id="meterFill"></div><span class="meter-ship">⛵</span></div>
  </div>
  <div id="hint">Tap to spawn agents</div>
  <div class="overlay" id="titleScreen">
    <div class="tag">Autumn fog · SF Bay · 19°</div>
    <h1>Fog Deploy</h1>
    <p>Tap to spawn wireframe agents. Scoop falling code shards before they dissolve in the mist. Fill the ship meter in 30 seconds.</p>
    <button class="btn" data-smoke="start" id="startBtn">Launch batch</button>
  </div>
  <div class="overlay hidden" id="gameOverScreen">
    <div class="tag" id="endTag">Batch incomplete</div>
    <h2 id="endTitle">Time expired</h2>
    <p id="endMsg">The fragments dissolved into the fog.</p>
    <div class="stat" id="endStats"></div>
    <button class="btn" data-smoke="restart" id="restartBtn">Retry deploy</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas = document.getElementById('game');
var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
var scoreEl = document.getElementById('scoreVal');
var timeEl = document.getElementById('timeVal');
var comboEl = document.getElementById('combo');
var meterFill = document.getElementById('meterFill');
var titleScreen = document.getElementById('titleScreen');
var gameOverScreen = document.getElementById('gameOverScreen');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');
var hintEl = document.getElementById('hint');
var endTag = document.getElementById('endTag');
var endTitle = document.getElementById('endTitle');
var endMsg = document.getElementById('endMsg');
var endStats = document.getElementById('endStats');

var W = 360, H = 640, dpr = 1;
var state = 'title';
var score = 0, combo = 0, maxCombo = 0, missed = 0;
var shipProgress = 0, shipGoal = 18;
var timeLeft = 30;
var elapsed = 0;
var lastTs = 0;
var shakeT = 0, hitPause = 0, deployFlash = 0;
var darkMode = true;
var spawnTimer = 0;
var spawnInterval = 1.4;
var fogDensity = 0.25;
var catchMargin = 0;
var maxAgents = 4;
var spawnCooldown = 0;
var lastPointerId = -1;
var lastTapAt = 0;
var nextAgentId = 1;

var fragments = [];
var agents = [];
var particles = [];
var fogWisps = [];
var collectBursts = [];

var CODE_SNIPPETS = ['fn()','125B','async','{ }','=>','git','npm','ctx','tok','vec','gpu','run','ship','v0.1','lint','fix','push','ci','api','map'];

var audioCtx = null;

function initAudio(){
  try{
    if(typeof AudioContext !== 'undefined') audioCtx = new AudioContext();
    else if(typeof webkitAudioContext !== 'undefined') audioCtx = new webkitAudioContext();
  }catch(e){}
}

function tone(freq, dur, vol, type){
  if(!audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function vibrate(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function detectTheme(){
  try{
    darkMode = !window.matchMedia || !window.matchMedia('(prefers-color-scheme:light)').matches;
  }catch(e){ darkMode = true; }
}

function resize(){
  if(!canvas) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 360;
  H = window.innerHeight || 640;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  initFog();
}

function initFog(){
  fogWisps = [];
  for(var i = 0; i < 40; i++){
    fogWisps.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 20 + Math.random() * 60,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 4,
      a: 0.04 + Math.random() * 0.08
    });
  }
}

function randSnippet(){
  return CODE_SNIPPETS[Math.floor(Math.random() * CODE_SNIPPETS.length)];
}

function spawnFragment(){
  var margin = 30 + catchMargin;
  var zoneW = W - margin * 2;
  if(zoneW < 60) zoneW = 60;
  fragments.push({
    x: margin + Math.random() * zoneW,
    y: -20,
    vy: 55 + elapsed * 2.2 + Math.random() * 20,
    text: randSnippet(),
    life: 1,
    w: 36 + Math.random() * 16,
    hue: Math.random() > 0.5 ? 170 : 195,
    claimed: false
  });
}

function spawnAgent(x, y){
  if(agents.length >= maxAgents) return false;
  agents.push({
    id: nextAgentId++,
    x: x, y: y,
    vx: 0, vy: 0,
    target: null,
    age: 0,
    maxAge: 6,
    pulse: 0,
    collected: false
  });
  tone(440 + Math.random() * 80, 0.08, 0.05, 'triangle');
  return true;
}

function findTarget(agent){
  var best = null, bestD = Infinity;
  for(var i = 0; i < fragments.length; i++){
    var f = fragments[i];
    if(f.claimed || f.life <= 0) continue;
    var dx = f.x - agent.x, dy = f.y - agent.y;
    var d = dx * dx + dy * dy;
    if(d < bestD){ bestD = d; best = f; }
  }
  return best;
}

function claimFragment(f, agent){
  if(f.claimed) return false;
  f.claimed = true;
  score++;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  shipProgress = Math.min(shipGoal, shipProgress + 1);
  if(scoreEl) scoreEl.textContent = score;
  if(meterFill) meterFill.style.width = (shipProgress / shipGoal * 100) + '%';
  if(comboEl){
    if(combo >= 2){
      comboEl.textContent = combo + '× streak';
      comboEl.classList.add('show');
    } else comboEl.classList.remove('show');
  }
  tone(660 + combo * 20, 0.1, 0.07, 'sine');
  vibrate(12);
  hitPause = 0.04;
  collectBursts.push({x:f.x, y:f.y, t:0, hue:f.hue});
  for(var i = 0; i < 8; i++){
    var a = Math.random() * Math.PI * 2;
    particles.push({
      x:f.x, y:f.y,
      vx: Math.cos(a) * (60 + Math.random() * 80),
      vy: Math.sin(a) * (60 + Math.random() * 80),
      life: 0.4 + Math.random() * 0.3,
      hue: f.hue
    });
  }
  agent.collected = true;
  f.life = 0;
  if(shipProgress >= shipGoal) endGame(true);
  return true;
}

function missFragment(){
  missed++;
  combo = 0;
  if(comboEl) comboEl.classList.remove('show');
  shipProgress = Math.max(0, shipProgress - 0.5);
  if(meterFill) meterFill.style.width = (shipProgress / shipGoal * 100) + '%';
  shakeT = 0.15;
  tone(180, 0.15, 0.05, 'sawtooth');
}

function updateEscalation(){
  var t = elapsed;
  spawnInterval = Math.max(0.55, 1.4 - t * 0.028);
  fogDensity = Math.min(0.65, 0.25 + t * 0.013);
  catchMargin = Math.min(W * 0.18, t * 3.5);
  maxAgents = Math.min(6, 4 + Math.floor(t / 12));
}

function update(dt){
  if(state !== 'playing') return;
  if(hitPause > 0){ hitPause -= dt; return; }

  elapsed += dt;
  timeLeft = Math.max(0, 30 - elapsed);
  if(timeEl) timeEl.textContent = Math.ceil(timeLeft);

  updateEscalation();

  spawnTimer += dt;
  if(spawnTimer >= spawnInterval){
    spawnTimer = 0;
    spawnFragment();
    if(elapsed > 8 && Math.random() < 0.35) spawnFragment();
  }

  if(spawnCooldown > 0) spawnCooldown -= dt;

  for(var i = agents.length - 1; i >= 0; i--){
    var a = agents[i];
    a.age += dt;
    a.pulse += dt * 5;
    if(a.age > a.maxAge || a.collected){
      agents.splice(i, 1);
      continue;
    }
    if(!a.target || a.target.life <= 0 || a.target.claimed){
      a.target = findTarget(a);
    }
    if(a.target){
      var dx = a.target.x - a.x, dy = a.target.y - a.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      var speed = 180 + elapsed * 1.5;
      a.vx += (dx / dist) * speed * dt * 3;
      a.vy += (dy / dist) * speed * dt * 3;
      a.vx *= 0.92; a.vy *= 0.92;
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      if(dist < 22) claimFragment(a.target, a);
    }
  }

  var bottomY = H - max(50, envSafeBottom());
  for(var j = fragments.length - 1; j >= 0; j--){
    var f = fragments[j];
    f.y += f.vy * dt;
    if(f.y > bottomY - 30) f.life -= dt * 1.8;
    if(f.y > bottomY && !f.claimed){
      missFragment();
      f.life = 0;
    }
    if(f.life <= 0) fragments.splice(j, 1);
  }

  for(var k = particles.length - 1; k >= 0; k--){
    var p = particles[k];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 120 * dt;
    p.life -= dt;
    if(p.life <= 0) particles.splice(k, 1);
  }

  for(var b = collectBursts.length - 1; b >= 0; b--){
    collectBursts[b].t += dt;
    if(collectBursts[b].t > 0.35) collectBursts.splice(b, 1);
  }

  for(var w = 0; w < fogWisps.length; w++){
    var fw = fogWisps[w];
    fw.x += fw.vx * dt; fw.y += fw.vy * dt;
    if(fw.x < -fw.r) fw.x = W + fw.r;
    if(fw.x > W + fw.r) fw.x = -fw.r;
    if(fw.y < -fw.r) fw.y = H + fw.r;
    if(fw.y > H + fw.r) fw.y = -fw.r;
  }

  if(shakeT > 0) shakeT -= dt;
  if(deployFlash > 0) deployFlash -= dt;

  if(timeLeft <= 0 && state === 'playing') endGame(false);
}

function max(a,b){ return a > b ? a : b; }

function envSafeBottom(){
  try{ return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe')||'0',10); }catch(e){ return 0; }
}

function drawAgent(a){
  var s = 14 + Math.sin(a.pulse) * 2;
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.strokeStyle = darkMode ? 'rgba(0,212,170,0.9)' : 'rgba(0,143,114,0.85)';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = darkMode ? 'rgba(0,212,170,0.6)' : 'rgba(0,143,114,0.4)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  for(var i = 0; i < 6; i++){
    var ang = Math.PI / 3 * i - Math.PI / 6;
    var px = Math.cos(ang) * s, py = Math.sin(ang) * s;
    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fillStyle = darkMode ? 'rgba(56,189,248,0.8)' : 'rgba(2,132,199,0.7)';
  ctx.fill();
  if(a.target && a.target.life > 0){
    ctx.strokeStyle = darkMode ? 'rgba(56,189,248,0.25)' : 'rgba(2,132,199,0.2)';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(a.target.x - a.x, a.target.y - a.y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawFragment(f){
  if(f.life <= 0) return;
  var alpha = Math.min(1, f.life);
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.globalAlpha = alpha;
  var col = darkMode
    ? 'hsla(' + f.hue + ',80%,55%,0.85)'
    : 'hsla(' + f.hue + ',70%,38%,0.9)';
  ctx.fillStyle = darkMode ? 'rgba(20,26,32,0.7)' : 'rgba(255,255,255,0.75)';
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.2;
  ctx.shadowColor = col;
  ctx.shadowBlur = 6;
  var hw = f.w * 0.5, hh = 10;
  roundRect(-hw, -hh, f.w, hh * 2, 4);
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.font = "600 11px ui-monospace, 'SFMono-Regular', Menlo, monospace";
  ctx.fillStyle = col;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(f.text, 0, 0);
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function render(){
  if(!ctx) return;
  detectTheme();

  var sx = shakeT > 0 ? (Math.random() - 0.5) * 6 * shakeT * 10 : 0;
  var sy = shakeT > 0 ? (Math.random() - 0.5) * 6 * shakeT * 10 : 0;
  ctx.save();
  ctx.translate(sx, sy);

  var bg = darkMode ? '#0c0f12' : '#e8ecf0';
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  var grad = ctx.createLinearGradient(0, 0, 0, H);
  if(darkMode){
    grad.addColorStop(0, 'rgba(30,38,48,0.5)');
    grad.addColorStop(0.5, 'rgba(15,18,22,0.2)');
    grad.addColorStop(1, 'rgba(8,10,14,0.6)');
  } else {
    grad.addColorStop(0, 'rgba(180,190,200,0.35)');
    grad.addColorStop(0.5, 'rgba(220,225,230,0.15)');
    grad.addColorStop(1, 'rgba(160,170,180,0.3)');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  for(var i = 0; i < fogWisps.length; i++){
    var fw = fogWisps[i];
    ctx.beginPath();
    ctx.arc(fw.x, fw.y, fw.r, 0, Math.PI * 2);
    ctx.fillStyle = darkMode
      ? 'rgba(140,155,170,' + (fw.a * fogDensity) + ')'
      : 'rgba(100,115,130,' + (fw.a * fogDensity * 0.8) + ')';
    ctx.fill();
  }

  var margin = catchMargin;
  if(margin > 5){
    var fogGradL = ctx.createLinearGradient(0, 0, margin, 0);
    fogGradL.addColorStop(0, darkMode ? 'rgba(8,10,14,0.85)' : 'rgba(232,236,240,0.9)');
    fogGradL.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fogGradL;
    ctx.fillRect(0, 0, margin, H);
    var fogGradR = ctx.createLinearGradient(W - margin, 0, W, 0);
    fogGradR.addColorStop(0, 'rgba(0,0,0,0)');
    fogGradR.addColorStop(1, darkMode ? 'rgba(8,10,14,0.85)' : 'rgba(232,236,240,0.9)');
    ctx.fillStyle = fogGradR;
    ctx.fillRect(W - margin, 0, margin, H);
  }

  var gridCol = darkMode ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.04)';
  ctx.strokeStyle = gridCol;
  ctx.lineWidth = 1;
  for(var gx = 0; gx < W; gx += 40){
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  for(var gy = 0; gy < H; gy += 40){
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }

  for(var fi = 0; fi < fragments.length; fi++) drawFragment(fragments[fi]);
  for(var ai = 0; ai < agents.length; ai++) drawAgent(agents[ai]);

  for(var pi = 0; pi < particles.length; pi++){
    var p = particles[pi];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = darkMode
      ? 'hsla(' + p.hue + ',80%,60%,0.9)'
      : 'hsla(' + p.hue + ',70%,42%,0.85)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(var bi = 0; bi < collectBursts.length; bi++){
    var b = collectBursts[bi];
    var r = 10 + b.t * 50;
    ctx.strokeStyle = darkMode
      ? 'hsla(' + b.hue + ',80%,55%,' + (1 - b.t / 0.35) + ')'
      : 'hsla(' + b.hue + ',70%,40%,' + (1 - b.t / 0.35) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  if(deployFlash > 0){
    ctx.fillStyle = darkMode
      ? 'rgba(0,212,170,' + deployFlash * 0.3 + ')'
      : 'rgba(0,143,114,' + deployFlash * 0.25 + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

function loop(ts){
  if(!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function resetGame(){
  score = 0; combo = 0; maxCombo = 0; missed = 0;
  shipProgress = 0; timeLeft = 30; elapsed = 0;
  spawnTimer = 0; spawnInterval = 1.4; fogDensity = 0.25;
  catchMargin = 0; maxAgents = 4; spawnCooldown = 0;
  fragments = []; agents = []; particles = []; collectBursts = [];
  shakeT = 0; hitPause = 0; deployFlash = 0;
  if(scoreEl) scoreEl.textContent = '0';
  if(timeEl) timeEl.textContent = '30';
  if(meterFill) meterFill.style.width = '0%';
  if(comboEl) comboEl.classList.remove('show');
  initFog();
}

function startGame(){
  initAudio();
  resetGame();
  state = 'playing';
  if(titleScreen) titleScreen.classList.add('hidden');
  if(gameOverScreen) gameOverScreen.classList.add('hidden');
  if(hintEl) hintEl.style.opacity = '0.65';
  tone(330, 0.12, 0.06, 'sine');
}

function endGame(won){
  state = 'over';
  deployFlash = won ? 0.6 : 0;
  if(won){
    tone(523, 0.15, 0.08, 'sine');
    setTimeout(function(){ tone(659, 0.15, 0.08, 'sine'); }, 100);
    setTimeout(function(){ tone(784, 0.25, 0.1, 'sine'); }, 200);
    vibrate([20, 40, 20]);
  }
  if(endTag) endTag.textContent = won ? 'Shipped by sunrise' : 'Batch incomplete';
  if(endTitle) endTitle.textContent = won ? 'Deploy complete' : 'Time expired';
  if(endMsg) endMsg.textContent = won
    ? 'Your micro-agents cleared the batch. The ship sails on.'
    : 'Too many shards dissolved in the autumn fog.';
  if(endStats) endStats.textContent = 'Shards: ' + score + ' · Best streak: ' + maxCombo + '× · Missed: ' + missed;
  if(gameOverScreen) gameOverScreen.classList.remove('hidden');
  if(hintEl) hintEl.style.opacity = '0';
}

function handleTap(clientX, clientY){
  if(state !== 'playing') return;
  var now = performance.now ? performance.now() : Date.now();
  if(now - lastTapAt < 80) return;
  lastTapAt = now;
  if(spawnCooldown > 0) return;
  var rect = canvas.getBoundingClientRect();
  var x = clientX - rect.left;
  var y = clientY - rect.top;
  if(spawnAgent(x, y)){
    spawnCooldown = 0.35;
    for(var i = 0; i < 4; i++){
      var a = Math.random() * Math.PI * 2;
      particles.push({
        x:x, y:y,
        vx: Math.cos(a) * 40,
        vy: Math.sin(a) * 40,
        life: 0.25,
        hue: 170
      });
    }
  }
}

function onPointerDown(e){
  if(state !== 'playing') return;
  e.preventDefault();
  if(e.pointerId !== undefined && e.pointerId === lastPointerId) return;
  lastPointerId = e.pointerId !== undefined ? e.pointerId : -1;
  handleTap(e.clientX, e.clientY);
}

function onTouchStart(e){
  if(state !== 'playing') return;
  e.preventDefault();
  if(!e.touches || !e.touches[0]) return;
  handleTap(e.touches[0].clientX, e.touches[0].clientY);
}

function onKeyDown(e){
  if(e.code === 'Space' || e.code === 'Enter'){
    if(state === 'title' && startBtn) startBtn.click();
    else if(state === 'over' && restartBtn) restartBtn.click();
    else if(state === 'playing'){
      e.preventDefault();
      handleTap(W * 0.5, H * 0.55);
    }
  }
}

if(startBtn) startBtn.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

if(restartBtn) restartBtn.addEventListener('click', function(e){
  e.stopPropagation();
  startGame();
});

if(canvas){
  if(window.PointerEvent){
    canvas.addEventListener('pointerdown', onPointerDown, {passive:false});
  } else {
    canvas.addEventListener('touchstart', onTouchStart, {passive:false});
    canvas.addEventListener('mousedown', function(e){
      if(state !== 'playing') return;
      e.preventDefault();
      handleTap(e.clientX, e.clientY);
    });
  }
}

window.addEventListener('keydown', onKeyDown);
window.addEventListener('resize', resize);

try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){
      detectTheme();
    });
  }
}catch(e){}

resize();
render();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
