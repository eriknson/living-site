<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Param Flick</title>
<style>
  :root {
    --bg: #e0f0e0;
    --trace: #c0d0c0;
    --text: #113311;
    --danger: #cc3333;
    --ui-bg: rgba(224, 240, 224, 0.95);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1a0a;
      --trace: #1a3a1a;
      --text: #88ff88;
      --danger: #ff4444;
      --ui-bg: rgba(10, 26, 10, 0.95);
    }
  }
  body, html {
    margin: 0; padding: 0;
    width: 100dvw; height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }
  #ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
  }
  .screen {
    background: var(--ui-bg);
    padding: 2rem;
    border: 2px solid var(--text);
    border-radius: 8px;
    text-align: center;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    max-width: 85%;
  }
  .screen h1, .screen p {
    pointer-events: none;
    margin-top: 0;
  }
  button {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 1rem 2rem;
    font-size: 1.2rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    margin-top: 1rem;
    text-transform: uppercase;
    pointer-events: auto;
  }
  button:active {
    transform: scale(0.95);
  }
  .hidden { display: none !important; }
  #hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 1rem;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    font-size: 1rem;
    font-weight: bold;
    z-index: 10;
  }
  #heat-container {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  #heat-bar-bg {
    width: 100px;
    height: 12px;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--text);
    border-radius: 6px;
    overflow: hidden;
  }
  #heat-bar {
    width: 0%;
    height: 100%;
    background: var(--text);
    transition: width 0.1s linear;
  }
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }
  .danger-pulse {
    animation: pulse 0.5s infinite;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div id="score">TOKENS: 0</div>
    <div id="heat-container">
      <div>HEAT</div>
      <div id="heat-bar-bg"><div id="heat-bar"></div></div>
    </div>
  </div>
  <div id="ui-layer">
    <div id="start-screen" class="screen">
      <h1>PARAM FLICK</h1>
      <p>Flick blocks into matching GPU slots.</p>
      <p style="font-size: 0.9em; opacity: 0.8;">7B (Small) | 70B (Med) | 125B (Large)</p>
      <p>Don't overheat the board!</p>
      <button data-smoke="start" id="btn-start">Start Benchmark</button>
    </div>
    <div id="game-over-screen" class="screen hidden">
      <h1>THERMAL THROTTLE</h1>
      <p>Tokens Generated: <span id="final-score">0</span></p>
      <button data-smoke="restart" id="btn-restart">Reboot</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const btnStart = document.getElementById('btn-start');
    const btnRestart = document.getElementById('btn-restart');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const heatBar = document.getElementById('heat-bar');
    const heatContainer = document.getElementById('heat-container');
    const finalScoreEl = document.getElementById('final-score');

    let width, height, baseSize;
    let dpr = window.devicePixelRatio || 1;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      baseSize = Math.min(width, height);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', () => {
      resize();
      if (state === 'start') draw(0);
    });
    resize();

    const getColors = () => {
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      return {
        bg: isDark ? '#0a1a0a' : '#e0f0e0',
        trace: isDark ? '#1a3a1a' : '#c0d0c0',
        text: isDark ? '#88ff88' : '#113311',
        danger: isDark ? '#ff4444' : '#cc3333',
        types: [
          isDark ? '#44aa44' : '#66aa66', // 7B
          isDark ? '#66cc66' : '#448844', // 70B
          isDark ? '#88ff88' : '#226622', // 125B
          isDark ? '#ffaa00' : '#cc8800'  // Rogue
        ],
        slot: isDark ? '#225522' : '#a0c0a0'
      };
    };

    let colors = getColors();
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        colors = getColors();
        if (state === 'start') draw(0);
      });
    }

    let state = 'start';
    let tokens = 0;
    let heat = 0;
    let difficulty = 1;
    let lastTime = 0;
    let spawnTimer = 0;
    let burstTimer = 0;
    let shakeTime = 0;

    let slots = [];
    let blocks = [];
    let particles = [];

    const BLOCK_TYPES = [
      { id: 0, label: '7B', sizeMult: 0.07 },
      { id: 1, label: '70B', sizeMult: 0.10 },
      { id: 2, label: '125B', sizeMult: 0.13 },
      { id: 3, label: '400B', sizeMult: 0.15 } // Rogue
    ];

    function initGame() {
      tokens = 0;
      heat = 0;
      difficulty = 1;
      blocks = [];
      particles = [];
      shakeTime = 0;
      
      slots = [
        { type: 0, x: 0, y: height * 0.15, filled: false },
        { type: 1, x: 0, y: height * 0.15, filled: false },
        { type: 2, x: 0, y: height * 0.15, filled: false }
      ];
      
      shuffleSlots();

      state = 'playing';
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      hud.classList.remove('hidden');
      lastTime = performance.now();
      spawnTimer = 0;
      
      updateHUD();
      requestAnimationFrame(loop);
    }

    function shuffleSlots() {
      const xs = [width * 0.2, width * 0.5, width * 0.8];
      xs.sort(() => Math.random() - 0.5);
      slots.forEach((s, i) => s.x = xs[i]);
    }

    let activePointer = null;
    let dragBlock = null;
    let pointerHistory = [];

    canvas.addEventListener('pointerdown', (e) => {
      if (state !== 'playing') return;
      e.preventDefault();
      if (activePointer !== null) return;
      
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      for (let i = blocks.length - 1; i >= 0; i--) {
        const b = blocks[i];
        if (b.state === 'slotted' || b.state === 'dead') continue;
        const dx = b.x - x;
        const dy = b.y - y;
        if (dx*dx + dy*dy <= b.radius * b.radius * 1.5) {
          activePointer = e.pointerId;
          dragBlock = b;
          b.state = 'dragged';
          b.vx = 0;
          b.vy = 0;
          pointerHistory = [{x, y, t: performance.now()}];
          break;
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== activePointer || !dragBlock) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      dragBlock.x = x;
      dragBlock.y = y;
      
      const now = performance.now();
      pointerHistory.push({x, y, t: now});
      if (pointerHistory.length > 5) pointerHistory.shift();
    });

    function releasePointer(e) {
      if (e.pointerId !== activePointer || !dragBlock) return;
      e.preventDefault();
      
      const now = performance.now();
      if (pointerHistory.length > 1) {
        const first = pointerHistory[0];
        const last = pointerHistory[pointerHistory.length - 1];
        const dt = Math.max(1, now - first.t);
        dragBlock.vx = ((last.x - first.x) / dt) * 15;
        dragBlock.vy = ((last.y - first.y) / dt) * 15;
        
        let speed = Math.sqrt(dragBlock.vx**2 + dragBlock.vy**2);
        if (speed > 40) {
          dragBlock.vx = (dragBlock.vx / speed) * 40;
          dragBlock.vy = (dragBlock.vy / speed) * 40;
        }
      } else {
        dragBlock.vx = 0;
        dragBlock.vy = 0;
      }
      
      dragBlock.state = 'flicked';
      activePointer = null;
      dragBlock = null;
    }

    canvas.addEventListener('pointerup', releasePointer);
    canvas.addEventListener('pointercancel', releasePointer);

    // Explicit touch handlers to satisfy strict checks
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); }, { passive: false });

    function loop(time) {
      if (state === 'start' || state === 'gameover') return;
      
      const dt = (time - lastTime) / 1000;
      lastTime = time;
      
      update(Math.min(dt, 0.1));
      draw(time);
      
      if (state !== 'gameover') {
        requestAnimationFrame(loop);
      }
    }

    function update(dt) {
      if (state === 'playing') {
        difficulty += dt * 0.02;
        heat += difficulty * 1.5 * dt;
        
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnBlock();
          spawnTimer = Math.max(0.4, 2.0 - difficulty * 0.2);
        }
      } else if (state === 'burst') {
        burstTimer -= dt;
        tokens += 1500 * dt;
        heat = Math.max(0, heat - 100 * dt);
        if (burstTimer <= 0) {
          endBurst();
        }
      }
      
      if (heat >= 100 && state === 'playing') {
        gameOver();
        return;
      }
      
      for (let i = blocks.length - 1; i >= 0; i--) {
        const b = blocks[i];
        
        if (b.state === 'flicked' || b.state === 'idle') {
          b.x += b.vx;
          b.y += b.vy;
          
          if (b.state === 'flicked') {
            b.vx *= 0.98;
            b.vy *= 0.98;
            b.vy += 0.2; // gravity
          }
          
          if (b.x < b.radius) { b.x = b.radius; b.vx *= -0.8; }
          if (b.x > width - b.radius) { b.x = width - b.radius; b.vx *= -0.8; }
          
          if (b.state === 'idle') {
            if (b.y > height - b.radius) {
              b.y = height - b.radius;
              b.vy *= -0.5;
              b.vx *= 0.8;
            }
          }
          
          if (b.state === 'flicked') {
            if (b.y < -b.radius) {
              blocks.splice(i, 1);
              continue;
            }
            if (b.y > height + b.radius) {
              if (b.type !== 3) {
                heat += 5;
                shakeTime = 0.1;
              }
              blocks.splice(i, 1);
              continue;
            }
          }
          
          if (b.state === 'flicked' && b.y < height * 0.35 && b.vy < 0) {
            for (let s of slots) {
              const dx = b.x - s.x;
              const dy = b.y - s.y;
              const dist = Math.sqrt(dx*dx + dy*dy);
              if (dist < b.radius + baseSize * 0.1) {
                if (!s.filled && b.type === s.type) {
                  b.state = 'slotted';
                  b.x = s.x;
                  b.y = s.y;
                  b.vx = 0;
                  b.vy = 0;
                  s.filled = true;
                  spawnParticles(b.x, b.y, colors.text, 15);
                  checkBurst();
                  if (navigator && navigator.vibrate) navigator.vibrate(50);
                } else if (b.vy < -2) {
                  b.vy = Math.abs(b.vy) * 0.6 + 5;
                  b.vx += (Math.random() - 0.5) * 10;
                  heat += 10;
                  shakeTime = 0.2;
                  spawnParticles(b.x, b.y, colors.danger, 10);
                  if (navigator && navigator.vibrate) navigator.vibrate(100);
                }
              }
            }
          }
        }
      }
      
      for (let i = 0; i < blocks.length; i++) {
        let b1 = blocks[i];
        if (b1.state !== 'idle') continue;
        for (let j = i + 1; j < blocks.length; j++) {
          let b2 = blocks[j];
          if (b2.state !== 'idle') continue;
          let dx = b2.x - b1.x;
          let dy = b2.y - b1.y;
          let dist = Math.sqrt(dx*dx + dy*dy);
          let minDist = b1.radius + b2.radius;
          if (dist < minDist && dist > 0) {
            let overlap = minDist - dist;
            let nx = dx / dist;
            let ny = dy / dist;
            b1.x -= nx * overlap * 0.5;
            b1.y -= ny * overlap * 0.5;
            b2.x += nx * overlap * 0.5;
            b2.y += ny * overlap * 0.5;
            
            let dvx = b2.vx - b1.vx;
            let dvy = b2.vy - b1.vy;
            b1.vx += dvx * 0.1;
            b1.vy += dvy * 0.1;
            b2.vx -= dvx * 0.1;
            b2.vy -= dvy * 0.1;
          }
        }
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      
      if (shakeTime > 0) shakeTime -= dt;
      
      updateHUD();
    }

    function spawnBlock() {
      let type = Math.floor(Math.random() * 3);
      if (difficulty > 2 && Math.random() < 0.2) {
        type = 3; 
      }
      
      const typeDef = BLOCK_TYPES[type];
      const radius = baseSize * typeDef.sizeMult;
      
      let x = width / 2;
      for (let i = 0; i < 5; i++) {
        x = width * 0.15 + Math.random() * width * 0.7;
        let clear = true;
        for (let b of blocks) {
          if (b.state === 'idle') {
            if (Math.abs(b.x - x) < radius * 2.5) {
              clear = false; break;
            }
          }
        }
        if (clear) break;
      }
      
      blocks.push({
        type: type,
        radius: radius,
        x: x,
        y: height + radius + 10,
        vx: (Math.random() - 0.5) * 2,
        vy: -6 - Math.random() * 4,
        state: 'idle'
      });
    }

    function checkBurst() {
      if (slots.every(s => s.filled)) {
        state = 'burst';
        burstTimer = 2.0;
        if (navigator && navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
      }
    }

    function endBurst() {
      state = 'playing';
      slots.forEach(s => s.filled = false);
      blocks = blocks.filter(b => b.state !== 'slotted');
      shuffleSlots();
      difficulty += 0.5;
    }

    function gameOver() {
      state = 'gameover';
      hud.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');
      finalScoreEl.innerText = Math.floor(tokens);
      if (navigator && navigator.vibrate) navigator.vibrate(500);
    }

    function updateHUD() {
      scoreEl.innerText = `TOKENS: ${Math.floor(tokens)}`;
      const heatPercent = Math.min(100, Math.max(0, heat));
      heatBar.style.width = `${heatPercent}%`;
      
      if (heat > 80) {
        heatContainer.classList.add('danger-pulse');
        heatBar.style.background = colors.danger;
      } else {
        heatContainer.classList.remove('danger-pulse');
        heatBar.style.background = colors.text;
      }
    }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 15,
          vy: (Math.random() - 0.5) * 15,
          life: 0.5 + Math.random() * 0.5,
          maxLife: 1,
          color
        });
      }
    }

    function draw(time) {
      ctx.save();
      ctx.clearRect(0, 0, width, height);
      
      if (shakeTime > 0) {
        const mag = shakeTime * 15;
        ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
      }
      
      ctx.strokeStyle = colors.trace;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < width; i += 50) {
        ctx.moveTo(i, 0); ctx.lineTo(i, height);
      }
      for (let i = 0; i < height; i += 50) {
        ctx.moveTo(0, i); ctx.lineTo(width, i);
      }
      ctx.stroke();
      
      if (heat > 0 && state === 'playing') {
        ctx.fillStyle = colors.danger;
        ctx.globalAlpha = (heat / 100) * 0.25;
        ctx.fillRect(0, 0, width, height);
        ctx.globalAlpha = 1.0;
      }
      
      if (state === 'burst') {
        ctx.fillStyle = colors.text;
        ctx.globalAlpha = (Math.floor(time / 100) % 2 === 0) ? 0.2 : 0;
        ctx.fillRect(0, 0, width, height);
        ctx.globalAlpha = 1.0;
        
        ctx.fillStyle = colors.text;
        ctx.font = `bold ${baseSize * 0.08}px ui-monospace, monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (Math.floor(time / 150) % 2 === 0) {
          ctx.fillText('BENCHMARK BURST', width / 2, height / 2);
        }
      }
      
      for (let s of slots) {
        const sSize = baseSize * BLOCK_TYPES[s.type].sizeMult + 6;
        ctx.strokeStyle = s.filled ? colors.types[s.type] : colors.slot;
        ctx.lineWidth = s.filled ? 6 : 3;
        ctx.setLineDash(s.filled ? [] : [8, 8]);
        ctx.strokeRect(s.x - sSize, s.y - sSize, sSize * 2, sSize * 2);
        ctx.setLineDash([]);
        
        ctx.fillStyle = colors.text;
        ctx.font = '12px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(BLOCK_TYPES[s.type].label, s.x, s.y - sSize - 12);
      }
      
      for (let b of blocks) {
        ctx.save();
        if (b.state === 'dragged') {
          ctx.shadowColor = colors.types[b.type];
          ctx.shadowBlur = 20;
        }
        
        ctx.fillStyle = colors.types[b.type];
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.arc(b.x - b.radius*0.3, b.y - b.radius*0.3, b.radius*0.4, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = colors.bg;
        ctx.font = `bold ${b.radius * 0.6}px ui-monospace, monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(BLOCK_TYPES[b.type].label, b.x, b.y);
        ctx.restore();
      }
      
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
      }
      ctx.globalAlpha = 1.0;
      
      ctx.restore();
    }

    btnStart.addEventListener('click', initGame);
    btnRestart.addEventListener('click', initGame);

    draw(0);
  </script>
</body>
</html>
