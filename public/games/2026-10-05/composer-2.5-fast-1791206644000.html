<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawn Jar</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  :root {
    --bg: #f4efe8;
    --text: #2a2520;
    --muted: #6b635a;
    --accent: #c45c2a;
    --panel: rgba(255, 252, 248, 0.92);
    --panel-border: rgba(42, 37, 32, 0.12);
    --btn-bg: #2a2520;
    --btn-text: #f4efe8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1816;
      --text: #e8e2da;
      --muted: #9a9288;
      --accent: #e07840;
      --panel: rgba(26, 24, 22, 0.94);
      --panel-border: rgba(232, 226, 218, 0.1);
      --btn-bg: #e8e2da;
      --btn-text: #1a1816;
    }
  }
  body {
    background: var(--bg);
    color: var(--text);
    position: relative;
  }
  #gameCanvas {
    display: block;
    width: 100dvw;
    height: 100dvh;
    touch-action: none;
  }
  .hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: max(12px, env(safe-area-inset-top)) 16px 8px;
    pointer-events: none;
    z-index: 2;
  }
  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hud-val { color: var(--text); font-size: 13px; margin-top: 2px; }
  .bar-wrap { flex: 1; max-width: 140px; }
  .bar-label { margin-bottom: 4px; }
  .bar-track {
    height: 6px;
    background: var(--panel-border);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.15s ease-out;
  }
  .bar-fill.jar { background: linear-gradient(90deg, #7eb8c4, #a8d4dc); }
  .bar-fill.sun { background: linear-gradient(90deg, #e8a060, #f0c878); }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.35s ease;
  }
  .overlay.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    pointer-events: none;
  }
  .panel h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    color: var(--text);
    text-transform: none;
  }
  .panel p {
    font-size: 13px;
    line-height: 1.55;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .panel .score-line {
    font-size: 15px;
    color: var(--text);
    margin-bottom: 16px;
  }
  .panel .score-line span { color: var(--accent); }
  button[data-smoke] {
    pointer-events: auto;
    min-height: 48px;
    min-width: 160px;
    padding: 14px 28px;
    border: none;
    border-radius: 999px;
    background: var(--btn-bg);
    color: var(--btn-text);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button[data-smoke]:active { transform: scale(0.96); opacity: 0.88; }
  .hint {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
    z-index: 3;
    opacity: 0.7;
  }
  .hint.hidden { display: none; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="hud" id="hud">
  <div class="hud-row">
    <div class="bar-wrap">
      <div class="bar-label">Jar</div>
      <div class="bar-track"><div class="bar-fill jar" id="jarBar" style="width:0%"></div></div>
      <div class="hud-val" id="jarText">0%</div>
    </div>
    <div style="text-align:center">
      <div class="bar-label">Score</div>
      <div class="hud-val" id="scoreText">0</div>
      <div class="hud-val" id="comboText" style="font-size:10px;color:var(--accent);margin-top:2px;min-height:14px"></div>
    </div>
    <div class="bar-wrap" style="text-align:right">
      <div class="bar-label">Sunrise</div>
      <div class="bar-track"><div class="bar-fill sun" id="sunBar" style="width:0%"></div></div>
      <div class="hud-val" id="sunText">0%</div>
    </div>
  </div>
</div>
<div class="hint" id="hint">Swipe ← → to switch lanes</div>

<div class="overlay" id="titleOverlay">
  <div class="panel">
    <h1>Dawn Jar</h1>
    <p>Switch lanes through rolling fog at dawn. Scoop dew drops into your jar before the sun burns them off.</p>
    <button type="button" data-smoke="start">Begin Collection</button>
  </div>
</div>

<div class="overlay hidden" id="gameOverOverlay">
  <div class="panel">
    <h1 id="goTitle">Sunrise</h1>
    <p id="goMsg">The dew is gone.</p>
    <div class="score-line" id="goScore"></div>
    <button type="button" data-smoke="restart">Try Again</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var jarBar = document.getElementById('jarBar');
  var sunBar = document.getElementById('sunBar');
  var jarText = document.getElementById('jarText');
  var sunText = document.getElementById('sunText');
  var scoreText = document.getElementById('scoreText');
  var comboText = document.getElementById('comboText');
  var titleOverlay = document.getElementById('titleOverlay');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var goTitle = document.getElementById('goTitle');
  var goMsg = document.getElementById('goMsg');
  var goScore = document.getElementById('goScore');
  var hint = document.getElementById('hint');

  var LANES = 3;
  var W = 360;
  var H = 640;
  var state = 'title';
  var lane = 1;
  var laneX = 1;
  var jarFill = 0;
  var sunProgress = 0;
  var score = 0;
  var combo = 0;
  var scrollSpeed = 120;
  var fogDensity = 0.15;
  var elapsed = 0;
  var roundDuration = 55;
  var jarGoal = 100;
  var shake = 0;
  var hitFlash = 0;
  var lastTime = 0;
  var entities = [];
  var particles = [];
  var fogLayers = [];
  var spawnTimer = 0;
  var audioCtx = null;
  var darkMode = false;

  var touchStartX = 0;
  var touchStartY = 0;
  var swipeThreshold = 40;

  function resize() {
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 360;
    H = window.innerHeight || 640;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function laneCenter(l) {
    var pad = W * 0.08;
    var laneW = (W - pad * 2) / LANES;
    return pad + laneW * (l + 0.5);
  }

  function laneWidth() {
    return (W - W * 0.16) / LANES;
  }

  function initFogLayers() {
    fogLayers = [];
    for (var i = 0; i < 8; i++) {
      fogLayers.push({
        y: Math.random() * H,
        speed: 15 + Math.random() * 25,
        opacity: 0.04 + Math.random() * 0.06,
        scale: 0.6 + Math.random() * 1.2,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function initAudio() {
    try {
      if (typeof window.AudioContext !== 'undefined') {
        audioCtx = new window.AudioContext();
      } else if (typeof window.webkitAudioContext !== 'undefined') {
        audioCtx = new window.webkitAudioContext();
      }
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, vol, type) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(vol || 0.08, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur + 0.05);
    } catch (e) {}
  }

  function vibrate(ms) {
    try {
      if (navigator && typeof navigator.vibrate === 'function') {
        navigator.vibrate(ms);
      }
    } catch (e) {}
  }

  function resetGame() {
    lane = 1;
    laneX = 1;
    jarFill = 0;
    sunProgress = 0;
    score = 0;
    combo = 0;
    scrollSpeed = 120;
    fogDensity = 0.15;
    elapsed = 0;
    shake = 0;
    hitFlash = 0;
    entities = [];
    particles = [];
    spawnTimer = 0;
    initFogLayers();
    updateHUD();
  }

  function startGame() {
    resetGame();
    state = 'playing';
    titleOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    hint.classList.remove('hidden');
    initAudio();
    playTone(220, 0.3, 0.06, 'triangle');
  }

  function endGame(won) {
    state = 'over';
    hint.classList.add('hidden');
    gameOverOverlay.classList.remove('hidden');
    if (won) {
      goTitle.textContent = 'Jar Full';
      goMsg.textContent = 'You gathered enough dew before sunrise. The hills glow gold.';
      playTone(440, 0.2, 0.1, 'sine');
      setTimeout(function () { playTone(554, 0.25, 0.08, 'sine'); }, 120);
      setTimeout(function () { playTone(659, 0.35, 0.07, 'sine'); }, 240);
    } else {
      goTitle.textContent = 'Sunrise';
      goMsg.textContent = 'The sun burned off the dew before your jar was full.';
      playTone(180, 0.4, 0.06, 'sawtooth');
    }
    goScore.innerHTML = 'Score <span>' + score + '</span> · Combo ×' + combo;
    vibrate(won ? [30, 20, 40] : 80);
  }

  function switchLane(dir) {
    if (state !== 'playing') return;
    var next = lane + dir;
    if (next >= 0 && next < LANES) {
      lane = next;
      playTone(300 + lane * 40, 0.08, 0.04, 'sine');
      vibrate(8);
    }
  }

  function spawnEntity() {
    var laneIdx = Math.floor(Math.random() * LANES);
    var roll = Math.random();
    var difficulty = Math.min(1, elapsed / roundDuration);
    if (roll < 0.55 + difficulty * 0.1) {
      var size = 0.7 + Math.random() * 0.5;
      var life = 4 - difficulty * 1.8;
      entities.push({
        type: 'dew',
        lane: laneIdx,
        y: -40,
        size: size,
        life: life,
        maxLife: life,
        wobble: Math.random() * Math.PI * 2,
        value: Math.round(4 + size * 5)
      });
    } else if (roll < 0.82) {
      entities.push({
        type: 'fog',
        lane: laneIdx,
        y: -60,
        h: 50 + Math.random() * 40,
        w: laneWidth() * 0.85
      });
    } else {
      var span = Math.random() < 0.5 ? 1 : 2;
      var startLane = Math.floor(Math.random() * (LANES - span + 1));
      entities.push({
        type: 'fogwall',
        lane: startLane,
        span: span,
        y: -80,
        h: 70 + Math.random() * 30
      });
    }
  }

  function addParticles(x, y, count, color) {
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 30 + Math.random() * 80;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 40,
        life: 0.4 + Math.random() * 0.4,
        maxLife: 0.8,
        r: 2 + Math.random() * 3,
        color: color
      });
    }
  }

  function collectDew(ent) {
    var mult = 1 + combo * 0.05;
    var gain = ent.value * mult;
    jarFill = Math.min(jarGoal, jarFill + gain);
    score += Math.round(gain * 2);
    combo++;
    addParticles(laneCenter(ent.lane), H * 0.78, 12, 'rgba(168, 212, 220, 0.9)');
    playTone(520 + combo * 15, 0.12, 0.07, 'sine');
    vibrate(12);
    if (jarFill >= jarGoal) endGame(true);
  }

  function hitFog() {
    jarFill = Math.max(0, jarFill - 8);
    combo = 0;
    score = Math.max(0, score - 5);
    shake = 8;
    hitFlash = 0.25;
    addParticles(laneCenter(lane), H * 0.78, 6, 'rgba(180, 175, 170, 0.6)');
    playTone(120, 0.2, 0.08, 'square');
    vibrate(40);
  }

  function updateHUD() {
    if (jarBar) jarBar.style.width = Math.min(100, jarFill) + '%';
    if (sunBar) sunBar.style.width = Math.min(100, sunProgress) + '%';
    if (jarText) jarText.textContent = Math.floor(jarFill) + '%';
    if (sunText) sunText.textContent = Math.floor(sunProgress) + '%';
    if (scoreText) scoreText.textContent = String(score);
    if (comboText) comboText.textContent = combo > 1 ? '×' + combo + ' combo' : '';
  }

  function update(dt) {
    if (state !== 'playing') return;

    elapsed += dt;
    sunProgress = Math.min(100, (elapsed / roundDuration) * 100);
    fogDensity = 0.15 + (elapsed / roundDuration) * 0.45;
    scrollSpeed = 120 + (elapsed / roundDuration) * 80;

    laneX += (lane - laneX) * Math.min(1, dt * 12);

    spawnTimer -= dt;
    var spawnRate = Math.max(0.35, 0.9 - elapsed * 0.012);
    if (spawnTimer <= 0) {
      spawnEntity();
      spawnTimer = spawnRate;
    }

    var playerY = H * 0.78;
    var playerR = laneWidth() * 0.22;
    var px = laneCenter(laneX);

    for (var i = entities.length - 1; i >= 0; i--) {
      var e = entities[i];
      e.y += scrollSpeed * dt;
      if (e.type === 'dew') {
        e.life -= dt * (0.8 + (elapsed / roundDuration) * 1.2);
        e.wobble += dt * 4;
        if (e.life <= 0) {
          entities.splice(i, 1);
          combo = Math.max(0, combo - 1);
          continue;
        }
      }
      if (e.y > H + 80) {
        entities.splice(i, 1);
        continue;
      }
      var inLane = e.type === 'fogwall'
        ? (lane >= e.lane && lane < e.lane + e.span)
        : (e.lane === lane);
      if (inLane && Math.abs(e.y - playerY) < (e.type === 'dew' ? 36 : 50)) {
        if (e.type === 'dew') {
          collectDew(e);
          entities.splice(i, 1);
        } else if (e.type === 'fog' || e.type === 'fogwall') {
          hitFog();
          entities.splice(i, 1);
        }
      }
    }

    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 120 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(j, 1);
    }

    for (var k = 0; k < fogLayers.length; k++) {
      fogLayers[k].y += fogLayers[k].speed * dt;
      if (fogLayers[k].y > H + 100) {
        fogLayers[k].y = -100;
        fogLayers[k].phase = Math.random() * Math.PI * 2;
      }
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 30);
    if (hitFlash > 0) hitFlash = Math.max(0, hitFlash - dt);

    updateHUD();

    if (sunProgress >= 100 && jarFill < jarGoal) endGame(false);
  }

  function getPalette() {
    darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (darkMode) {
      return {
        skyTop: '#1e2428',
        skyMid: '#3a3530',
        skyHorizon: '#6b4a32',
        sun: '#e09050',
        sunGlow: 'rgba(224, 144, 80, 0.25)',
        hill: '#2a2824',
        hillLight: '#3d3832',
        fog: 'rgba(200, 195, 190, 0.12)',
        fogThick: 'rgba(160, 155, 150, 0.35)',
        lane: 'rgba(255, 255, 255, 0.04)',
        dew: '#a8d4dc',
        dewCore: '#e8f4f8',
        jar: '#7eb8c4',
        jarGlass: 'rgba(168, 212, 220, 0.35)',
        player: '#c8e0e4'
      };
    }
    return {
      skyTop: '#b8c8d4',
      skyMid: '#d4c4b8',
      skyHorizon: '#e8b888',
      sun: '#f0c060',
      sunGlow: 'rgba(240, 192, 96, 0.35)',
      hill: '#8a9a7a',
      hillLight: '#a8b898',
      fog: 'rgba(255, 255, 255, 0.35)',
      fogThick: 'rgba(220, 215, 210, 0.55)',
      lane: 'rgba(255, 255, 255, 0.25)',
      dew: '#7eb8c4',
      dewCore: '#ffffff',
      jar: '#5a98a4',
      jarGlass: 'rgba(126, 184, 196, 0.4)',
      player: '#4a8894'
    };
  }

  function drawSky(pal) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, pal.skyTop);
    g.addColorStop(0.55, pal.skyMid);
    g.addColorStop(1, pal.skyHorizon);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var sunY = H * 0.22 + sunProgress * 0.001 * H;
    var sunR = 28 + sunProgress * 0.15;
    var sunX = W * 0.72;
    var glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 4);
    glow.addColorStop(0, pal.sunGlow);
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    ctx.fillStyle = pal.sun;
    ctx.fill();

    ctx.fillStyle = pal.hill;
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, H * 0.62);
    ctx.bezierCurveTo(W * 0.2, H * 0.55, W * 0.35, H * 0.68, W * 0.5, H * 0.58);
    ctx.bezierCurveTo(W * 0.65, H * 0.48, W * 0.8, H * 0.6, W, H * 0.52);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = pal.hillLight;
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, H * 0.72);
    ctx.bezierCurveTo(W * 0.15, H * 0.68, W * 0.4, H * 0.75, W * 0.6, H * 0.7);
    ctx.lineTo(W, H * 0.74);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawLanes(pal) {
    var pad = W * 0.08;
    var lw = laneWidth();
    for (var i = 0; i < LANES; i++) {
      var x = pad + lw * i;
      ctx.fillStyle = pal.lane;
      ctx.fillRect(x, H * 0.35, lw - 2, H * 0.65);
    }
    ctx.save();
    ctx.strokeStyle = darkMode ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 10]);
    for (var j = 1; j < LANES; j++) {
      var lx = pad + lw * j;
      ctx.beginPath();
      ctx.moveTo(lx, H * 0.35);
      ctx.lineTo(lx, H);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFogAmbient(pal) {
    for (var i = 0; i < fogLayers.length; i++) {
      var f = fogLayers[i];
      var alpha = f.opacity * (0.5 + fogDensity);
      ctx.fillStyle = darkMode
        ? 'rgba(180, 175, 170, ' + alpha + ')'
        : 'rgba(255, 252, 248, ' + alpha + ')';
      var cx = W * 0.5 + Math.sin(elapsed * 0.3 + f.phase) * W * 0.3;
      var cy = f.y;
      var rx = W * 0.4 * f.scale;
      var ry = 60 * f.scale;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = darkMode
      ? 'rgba(30, 28, 26, ' + (fogDensity * 0.35) + ')'
      : 'rgba(244, 239, 232, ' + (fogDensity * 0.25) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  function drawEntity(e, pal) {
    var x = laneCenter(e.lane);
    if (e.type === 'dew') {
      var fade = Math.min(1, e.life / e.maxLife);
      var r = 10 * e.size * fade;
      var wx = Math.sin(e.wobble) * 4;
      ctx.save();
      ctx.globalAlpha = fade;
      var dg = ctx.createRadialGradient(x + wx, e.y, 0, x + wx, e.y, r * 1.8);
      dg.addColorStop(0, pal.dewCore);
      dg.addColorStop(0.4, pal.dew);
      dg.addColorStop(1, 'transparent');
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.arc(x + wx, e.y, r * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + wx - r * 0.2, e.y - r * 0.2, r * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fill();
      ctx.restore();
    } else if (e.type === 'fog') {
      ctx.save();
      ctx.fillStyle = pal.fogThick;
      ctx.beginPath();
      ctx.ellipse(x, e.y, e.w * 0.5, e.h * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = pal.fog;
      ctx.beginPath();
      ctx.ellipse(x + 8, e.y - 5, e.w * 0.4, e.h * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (e.type === 'fogwall') {
      var pad = W * 0.08;
      var lw = laneWidth();
      var fx = pad + lw * e.lane + (lw * e.span) / 2;
      var fw = lw * e.span - 4;
      ctx.save();
      ctx.fillStyle = pal.fogThick;
      ctx.beginPath();
      ctx.ellipse(fx, e.y, fw * 0.48, e.h * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPlayer(pal) {
    var px = laneCenter(laneX);
    var py = H * 0.78;
    var jw = laneWidth() * 0.35;
    var jh = jw * 1.3;

    ctx.save();
    ctx.translate(px, py);

    ctx.fillStyle = pal.jarGlass;
    ctx.strokeStyle = pal.jar;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-jw * 0.35, -jh * 0.3);
    ctx.lineTo(-jw * 0.45, jh * 0.35);
    ctx.quadraticCurveTo(-jw * 0.45, jh * 0.5, -jw * 0.3, jh * 0.5);
    ctx.lineTo(jw * 0.3, jh * 0.5);
    ctx.quadraticCurveTo(jw * 0.45, jh * 0.5, jw * 0.45, jh * 0.35);
    ctx.lineTo(jw * 0.35, -jh * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    var fillH = jh * 0.42 * (jarFill / jarGoal);
    if (fillH > 2) {
      ctx.fillStyle = pal.dew;
      ctx.globalAlpha = 0.7;
      ctx.fillRect(-jw * 0.32, jh * 0.5 - fillH, jw * 0.64, fillH);
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = pal.player;
    ctx.beginPath();
    ctx.arc(0, -jh * 0.55, jw * 0.18, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawTitleBg() {
    if (state !== 'title' && state !== 'over') return;
    var pal = getPalette();
    drawSky(pal);
    drawFogAmbient(pal);
  }

  function render() {
    if (!ctx) return;
    var pal = getPalette();

    ctx.save();
    var sx = (Math.random() - 0.5) * shake;
    var sy = (Math.random() - 0.5) * shake;
    ctx.translate(sx, sy);

    drawSky(pal);
    drawLanes(pal);

    for (var i = 0; i < entities.length; i++) {
      if (entities[i].type === 'fog' || entities[i].type === 'fogwall') {
        drawEntity(entities[i], pal);
      }
    }

    for (var j = 0; j < entities.length; j++) {
      if (entities[j].type === 'dew') drawEntity(entities[j], pal);
    }

    if (state === 'playing' || state === 'over') {
      drawPlayer(pal);
    }

    drawFogAmbient(pal);
    drawParticles();

    if (hitFlash > 0) {
      ctx.fillStyle = 'rgba(200, 80, 60, ' + (hitFlash * 0.25) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }

  function loop(ts) {
    if (!lastTime) lastTime = ts;
    var dt = Math.min(0.05, (ts - lastTime) / 1000);
    lastTime = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function onTouchStart(e) {
    if (e.cancelable) e.preventDefault();
    var t = e.changedTouches ? e.changedTouches[0] : e;
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }

  function onTouchEnd(e) {
    if (e.cancelable) e.preventDefault();
    if (state !== 'playing') return;
    var t = e.changedTouches ? e.changedTouches[0] : e;
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if (Math.abs(dx) > swipeThreshold && Math.abs(dx) > Math.abs(dy)) {
      switchLane(dx > 0 ? 1 : -1);
    }
  }

  function onKeyDown(e) {
    if (state === 'playing') {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') switchLane(-1);
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') switchLane(1);
    }
  }

  function bindEvents() {
    var startBtn = document.querySelector('[data-smoke="start"]');
    var restartBtn = document.querySelector('[data-smoke="restart"]');
    if (startBtn) startBtn.addEventListener('click', startGame);
    if (restartBtn) restartBtn.addEventListener('click', startGame);

    window.addEventListener('resize', resize);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('mousedown', function (e) {
      touchStartX = e.clientX;
      touchStartY = e.clientY;
    });
    canvas.addEventListener('mouseup', function (e) {
      if (state !== 'playing') return;
      var dx = e.clientX - touchStartX;
      var dy = e.clientY - touchStartY;
      if (Math.abs(dx) > swipeThreshold && Math.abs(dx) > Math.abs(dy)) {
        switchLane(dx > 0 ? 1 : -1);
      }
    });
    window.addEventListener('keydown', onKeyDown);

    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
    }
  }

  resize();
  initFogLayers();
  bindEvents();
  drawTitleBg();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
