<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSTRICH.EXE</title>
<style>
    :root {
        --bg: #f4ece4;
        --fg: #332b26;
        --accent: #d32f2f;
        --bg-alpha: rgba(244, 236, 228, 0.95);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #14110f;
            --fg: #ffb000;
            --accent: #ff3300;
            --bg-alpha: rgba(20, 17, 15, 0.95);
        }
    }
    html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        background-color: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
    #ui {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
    }
    .panel {
        pointer-events: auto;
        background: var(--bg-alpha);
        padding: 2rem;
        border: 4px solid var(--fg);
        text-align: center;
        box-shadow: 10px 10px 0 var(--fg);
        max-width: 90vw;
        box-sizing: border-box;
    }
    h1 {
        font-size: 2.5rem;
        margin: 0 0 1rem 0;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    p {
        font-size: 1.1rem;
        line-height: 1.5;
        margin-bottom: 2rem;
        font-weight: bold;
    }
    .subtitle {
        font-size: 0.9rem;
        opacity: 0.8;
        margin-bottom: 2rem;
        font-weight: normal;
    }
    button {
        pointer-events: auto;
        font-family: inherit;
        font-size: 1.4rem;
        padding: 1rem 2rem;
        background: var(--fg);
        color: var(--bg);
        border: none;
        cursor: pointer;
        text-transform: uppercase;
        font-weight: bold;
        box-shadow: 4px 4px 0 var(--accent);
        transition: transform 0.1s, box-shadow 0.1s;
    }
    button:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--accent);
    }
    #hud {
        position: absolute;
        top: 0; left: 0; right: 0;
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        font-size: 1.2rem;
        z-index: 10;
        pointer-events: none;
        box-sizing: border-box;
    }
    body::after {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100vw; height: 100dvh;
        background: repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.05) 0px,
            rgba(0, 0, 0, 0.05) 1px,
            transparent 1px,
            transparent 2px
        );
        pointer-events: none;
        z-index: 999;
    }
    @media (prefers-color-scheme: dark) {
        body::after {
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 176, 0, 0.05) 0px,
                rgba(255, 176, 0, 0.05) 1px,
                transparent 1px,
                transparent 2px
            );
        }
    }
</style>
</head>
<body>
    <canvas id="game"></canvas>
    
    <div id="hud" style="display:none;">
        <div id="time-display">CYCLE: 0%</div>
        <div id="score-hud">SCORE: 0</div>
        <div id="strikes-display">ERRORS: 0/3</div>
    </div>

    <div id="ui">
        <div id="menu" class="panel">
            <h1>OSTRICH.EXE</h1>
            <p>SORT INCOMING CODE BLOCKS<br><br>➔ TAP TO APPROVE CLEAN CODE<br>➔ SWIPE TO REJECT BUGS</p>
            <p class="subtitle">Desktop: Space to approve, Arrows to reject</p>
            <button data-smoke="start">INITIALIZE</button>
        </div>
        
        <div id="gameover" class="panel" style="display:none;">
            <h1 id="gameover-title">SYSTEM HALTED</h1>
            <p id="score-display">FINAL SCORE: 0</p>
            <button data-smoke="restart">REBOOT</button>
        </div>
    </div>

<script>
(function(){
    const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
    let state = STATE.MENU;
    
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    let time = 0;
    let strikes = 0;
    const MAX_STRIKES = 3;
    let blocks = [];
    let stack = [];
    let lastTime = 0;
    let spawnTimer = 0;
    let isCompiling = false;
    let compileTimer = 0;
    let particles = [];
    let floatingTexts = [];
    let score = 0;
    let survivalTime = 60; // seconds
    let gameTime = 0;
    let screenShake = 0;
    
    let activePointer = null;
    let audioCtx = null;
    
    const CLEAN_TEXTS = ["const x=1", "return ok", "[1].map(x)", "{ok:true}", "()=>true", "import *", "if(ok)", "new Date", "Math.max", "pure fn"];
    const DEFECT_TEXTS = ["while(1){}", "null.x", "var x=1", "eval(x)", "[object]", "NaN", "x=y //", "1 / 0", "throw err", "leak()"];
    
    class Block {
        constructor(x, y, text, isDefect) {
            this.x = x;
            this.y = y;
            this.width = 160;
            this.height = 60;
            this.text = text;
            this.isDefect = isDefect;
            this.state = 'falling'; // falling, dragged, flicked, approved, stacked, dead
            this.vx = 0;
            this.vy = 0;
            this.id = Math.random();
            this.glitchTimer = 0;
        }
    }
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    
    function initAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }
    
    function playSound(type) {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;
            
            if (type === 'approve') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'reject') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'strike') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'compile') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.5);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        } catch(e) {}
    }
    
    function createExplosion(x, y, type) {
        for(let i=0; i<25; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 300 + 50;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                maxLife: 0.4 + Math.random() * 0.4,
                size: Math.random() * 6 + 2,
                type: type
            });
        }
    }
    
    function showFloatingText(text, x, y) {
        floatingTexts.push({ text: text, x: x, y: y, life: 1.0 });
    }
    
    function strike(reason) {
        strikes++;
        showFloatingText(reason, canvas.width/2, canvas.height/2);
        screenShake = 0.5;
        playSound('strike');
        if (navigator.vibrate) { try { navigator.vibrate(200); } catch(e){} }
        
        if (strikes >= MAX_STRIKES) {
            endGame(false);
        }
    }
    
    function spawnBlock() {
        let progress = Math.min(1, gameTime / (survivalTime * 1000));
        let defectRatio = 0.3 + progress * 0.4;
        let isDefect = Math.random() < defectRatio;
        let texts = isDefect ? DEFECT_TEXTS : CLEAN_TEXTS;
        let text = texts[Math.floor(Math.random() * texts.length)];
        
        let block = new Block(canvas.width / 2, -60, text, isDefect);
        blocks.push(block);
    }
    
    function checkStackCompile() {
        if (stack.length >= 5 && !isCompiling) {
            isCompiling = true;
            compileTimer = 1.5;
        }
    }
    
    function startGame() {
        state = STATE.PLAYING;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('gameover').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        
        gameTime = 0;
        strikes = 0;
        score = 0;
        blocks = [];
        stack = [];
        particles = [];
        floatingTexts = [];
        isCompiling = false;
        spawnTimer = 1.0;
        screenShake = 0;
        activePointer = null;
        lastTime = performance.now();
    }
    
    function endGame(won) {
        state = STATE.GAMEOVER;
        document.getElementById('gameover').style.display = 'block';
        document.getElementById('hud').style.display = 'none';
        
        document.getElementById('gameover-title').innerText = won ? "CYCLE COMPLETE" : "SYSTEM HALTED";
        let finalScore = score + (won ? (MAX_STRIKES - strikes) * 1000 : 0);
        document.getElementById('score-display').innerText = `FINAL SCORE: ${finalScore}`;
    }
    
    document.querySelector('[data-smoke="start"]').addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        startGame();
    });
    
    document.querySelector('[data-smoke="restart"]').addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        startGame();
    });
    
    canvas.addEventListener('pointerdown', e => {
        if (state !== STATE.PLAYING) return;
        e.preventDefault();
        if (activePointer) return;
        
        let rect = canvas.getBoundingClientRect();
        let x = (e.clientX - rect.left) * (canvas.width / rect.width);
        let y = (e.clientY - rect.top) * (canvas.height / rect.height);
        
        for (let i = blocks.length - 1; i >= 0; i--) {
            let b = blocks[i];
            if (b.state === 'falling') {
                if (Math.abs(x - b.x) < b.width/2 && Math.abs(y - b.y) < b.height/2) {
                    activePointer = {
                        id: e.pointerId,
                        block: b,
                        startX: x,
                        startY: y,
                        lastX: x,
                        lastY: y,
                        vx: 0,
                        time: performance.now()
                    };
                    b.state = 'dragged';
                    canvas.setPointerCapture(e.pointerId);
                    break;
                }
            }
        }
    });
    
    canvas.addEventListener('pointermove', e => {
        if (!activePointer || activePointer.id !== e.pointerId) return;
        e.preventDefault();
        
        let rect = canvas.getBoundingClientRect();
        let x = (e.clientX - rect.left) * (canvas.width / rect.width);
        
        let dt = (performance.now() - activePointer.time) / 1000;
        if (dt > 0) {
            activePointer.vx = (x - activePointer.lastX) / dt;
        }
        
        activePointer.block.x += (x - activePointer.lastX);
        activePointer.lastX = x;
        activePointer.time = performance.now();
    });
    
    function handlePointerEnd(e) {
        if (!activePointer || activePointer.id !== e.pointerId) return;
        e.preventDefault();
        
        let b = activePointer.block;
        let dx = activePointer.lastX - activePointer.startX;
        
        if (Math.abs(dx) > b.width * 0.5 || Math.abs(activePointer.vx) > 500) {
            b.state = 'flicked';
            b.vx = activePointer.vx;
            if (Math.abs(b.vx) < 500) {
                b.vx = Math.sign(dx) * 1200;
                if (b.vx === 0) b.vx = 1200;
            }
            playSound('reject');
        } else {
            b.state = 'approved';
            playSound('approve');
        }
        
        activePointer = null;
    }
    
    canvas.addEventListener('pointerup', handlePointerEnd);
    canvas.addEventListener('pointercancel', handlePointerEnd);
    
    window.addEventListener('keydown', e => {
        if (state !== STATE.PLAYING) return;
        
        let lowest = null;
        let maxY = -9999;
        blocks.forEach(b => {
            if (b.state === 'falling' && b.y > maxY) {
                maxY = b.y;
                lowest = b;
            }
        });
        
        if (!lowest) return;
        
        if (e.code === 'ArrowLeft') {
            lowest.state = 'flicked';
            lowest.vx = -1200;
            playSound('reject');
        } else if (e.code === 'ArrowRight') {
            lowest.state = 'flicked';
            lowest.vx = 1200;
            playSound('reject');
        } else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown') {
            lowest.state = 'approved';
            playSound('approve');
        }
    });
    
    function update(dt) {
        gameTime += dt * 1000;
        let progress = Math.min(1, gameTime / (survivalTime * 1000));
        
        document.getElementById('time-display').innerText = `CYCLE: ${Math.floor(progress * 100)}%`;
        document.getElementById('strikes-display').innerText = `ERRORS: ${strikes}/${MAX_STRIKES}`;
        document.getElementById('score-hud').innerText = `SCORE: ${score}`;
        
        if (progress >= 1) {
            endGame(true);
            return;
        }
        
        spawnTimer -= dt;
        let currentSpawnRate = 2.0 - progress * 1.2;
        if (spawnTimer <= 0) {
            spawnBlock();
            spawnTimer = currentSpawnRate;
        }
        
        if (screenShake > 0) {
            screenShake -= dt;
            if (screenShake < 0) screenShake = 0;
        }
        
        let stackTopY = canvas.height - 20;
        if (stack.length > 0) {
            let lastBlock = stack[stack.length - 1];
            stackTopY = lastBlock.y - lastBlock.height / 2;
        }
        
        let baseSpeed = 100 + progress * 250;
        
        blocks.forEach((b) => {
            if (b.state === 'falling') {
                b.y += baseSpeed * dt;
                
                if (b.isDefect) {
                    b.glitchTimer -= dt;
                    if (b.glitchTimer <= 0) {
                        b.glitchTimer = 0.5 + Math.random();
                    }
                }
                
                let bottomY = b.y + b.height / 2;
                if (bottomY >= stackTopY) {
                    b.y = stackTopY - b.height / 2;
                    if (b.isDefect) {
                        strike("BUG ESCAPED!");
                    } else {
                        strike("MISSED CLEAN CODE!");
                    }
                    b.state = 'dead';
                    createExplosion(b.x, b.y, b.isDefect ? 'defect' : 'clean');
                }
            } else if (b.state === 'flicked') {
                b.x += b.vx * dt;
                b.y += baseSpeed * dt;
                if (b.x < -b.width || b.x > canvas.width + b.width) {
                    b.state = 'dead';
                    if (!b.isDefect) {
                        strike("REJECTED CLEAN CODE!");
                    } else {
                        score += 100;
                    }
                }
            } else if (b.state === 'approved') {
                b.x += (canvas.width/2 - b.x) * 15 * dt;
                b.y += 1500 * dt;
                
                let targetY = stackTopY - b.height / 2;
                if (b.y >= targetY) {
                    b.y = targetY;
                    b.x = canvas.width / 2;
                    if (b.isDefect) {
                        strike("APPROVED A BUG!");
                        b.state = 'dead';
                        createExplosion(b.x, b.y, 'defect');
                    } else {
                        b.state = 'stacked';
                        stack.push(b);
                        score += 50;
                        checkStackCompile();
                    }
                }
            }
        });
        
        blocks = blocks.filter(b => b.state !== 'dead');
        
        if (isCompiling) {
            compileTimer -= dt;
            if (compileTimer <= 0) {
                isCompiling = false;
                stack.forEach(b => createExplosion(b.x, b.y, 'compile'));
                stack = [];
                score += 500;
                screenShake = 0.4;
                playSound('compile');
            }
        }
        
        particles.forEach(p => {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt / p.maxLife;
        });
        particles = particles.filter(p => p.life > 0);
        
        floatingTexts.forEach(ft => {
            ft.y -= 80 * dt;
            ft.life -= dt / 1.5;
        });
        floatingTexts = floatingTexts.filter(ft => ft.life > 0);
    }
    
    function render() {
        let style = getComputedStyle(document.body);
        let COLOR_BG = style.getPropertyValue('--bg').trim();
        let COLOR_FG = style.getPropertyValue('--fg').trim();
        let COLOR_ACCENT = style.getPropertyValue('--accent').trim();
        
        ctx.fillStyle = COLOR_BG;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.fillStyle = COLOR_FG;
        ctx.globalAlpha = 0.05;
        ctx.font = 'bold 80px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText("OSTRICH.EXE", canvas.width/2, canvas.height/2);
        ctx.restore();
        
        if (screenShake > 0) {
            ctx.save();
            let dx = (Math.random() - 0.5) * 20 * screenShake;
            let dy = (Math.random() - 0.5) * 20 * screenShake;
            ctx.translate(dx, dy);
        }
        
        ctx.save();
        ctx.strokeStyle = COLOR_FG;
        ctx.globalAlpha = 0.2;
        ctx.lineWidth = 2;
        ctx.beginPath();
        let beltX1 = canvas.width / 2 - 100;
        let beltX2 = canvas.width / 2 + 100;
        ctx.moveTo(beltX1, 0); ctx.lineTo(beltX1, canvas.height);
        ctx.moveTo(beltX2, 0); ctx.lineTo(beltX2, canvas.height);
        ctx.stroke();
        
        ctx.setLineDash([10, 20]);
        let offset = (gameTime / 1000 * 150) % 30;
        ctx.lineDashOffset = -offset;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.restore();
        
        ctx.save();
        ctx.fillStyle = COLOR_FG;
        ctx.globalAlpha = 0.1;
        ctx.fillRect(beltX1, canvas.height - 20, 200, 20);
        ctx.restore();
        
        function drawBlock(b) {
            ctx.save();
            ctx.translate(b.x, b.y);
            
            let isGlitching = false;
            if (b.isDefect && b.state === 'falling' && b.glitchTimer > 0 && b.glitchTimer < 0.1) {
                isGlitching = true;
                ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
            }
            
            ctx.fillStyle = COLOR_BG;
            ctx.fillRect(-b.width/2, -b.height/2, b.width, b.height);
            
            ctx.strokeStyle = COLOR_FG;
            ctx.lineWidth = 4;
            if (isGlitching) {
                ctx.strokeStyle = COLOR_ACCENT;
                ctx.fillStyle = COLOR_ACCENT;
                ctx.fillRect(-b.width/2, -b.height/2, b.width, b.height);
            }
            ctx.strokeRect(-b.width/2 + 2, -b.height/2 + 2, b.width - 4, b.height - 4);
            
            ctx.fillStyle = isGlitching ? COLOR_BG : COLOR_FG;
            ctx.font = 'bold 18px ui-monospace, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.text, 0, 0);
            
            ctx.restore();
        }
        
        stack.forEach(drawBlock);
        blocks.forEach(drawBlock);
        
        particles.forEach(p => {
            ctx.save();
            ctx.fillStyle = p.type === 'defect' ? COLOR_ACCENT : COLOR_FG;
            ctx.globalAlpha = p.life;
            ctx.translate(p.x, p.y);
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();
        });
        
        floatingTexts.forEach(ft => {
            ctx.save();
            ctx.fillStyle = COLOR_ACCENT;
            ctx.globalAlpha = Math.max(0, ft.life);
            ctx.font = 'bold 24px ui-monospace, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        });
        
        if (isCompiling) {
            ctx.save();
            ctx.fillStyle = COLOR_ACCENT;
            ctx.font = 'bold 36px ui-monospace, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (Math.floor(performance.now() / 150) % 2 === 0) {
                ctx.fillText("COMPILING...", canvas.width/2, canvas.height/2);
            }
            ctx.restore();
        }
        
        if (screenShake > 0) {
            ctx.restore();
        }
    }
    
    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1;
        lastTime = timestamp;
        
        if (state === STATE.PLAYING) {
            update(dt);
        }
        
        render();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

})();
</script>
</body>
</html>
