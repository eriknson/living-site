<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crustline — Bank the Warmth</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e12;--bg2:#141820;--text:#e8e4df;--muted:#8a8680;
  --magma:#ff5c2a;--ember:#ffb347;--basalt:#1e2228;--hud:rgba(12,14,18,.82);
  --accent:#3d8b7a;--danger:#e04530;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e4e0da;--bg2:#d6d0c8;--text:#1a1816;--muted:#5c5854;
    --magma:#c0391a;--ember:#d35400;--basalt:#b8b2aa;--hud:rgba(228,224,218,.88);
    --accent:#2a6b5c;--danger:#b8321c;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{flex:1;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 16px 8px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13px;line-height:1.4}
.hud-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud-value{font-size:22px;font-weight:600;color:var(--text)}
#combo{display:none;color:var(--ember);font-size:14px;margin-top:2px}
#combo.show{display:block}
#overlay,#gameoverScreen{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;z-index:10;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.35) 100%)}
@media(prefers-color-scheme:light){
  #overlay,#gameoverScreen{background:linear-gradient(180deg,rgba(228,224,218,.75) 0%,rgba(228,224,218,.55) 100%)}
}
#overlay.hidden,#gameoverScreen.hidden{display:none}
.title-main{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:clamp(28px,8vw,42px);
  font-weight:700;letter-spacing:-.02em;color:var(--text);text-align:center}
.title-sub{font-size:14px;color:var(--muted);max-width:280px;text-align:center;line-height:1.5;padding:0 20px}
.btn{pointer-events:auto!important;min-width:160px;min-height:48px;padding:14px 28px;border:none;border-radius:8px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:15px;font-weight:600;
  cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;background:var(--magma);color:#fff;
  box-shadow:0 4px 20px rgba(255,92,42,.35)}
.btn:active{transform:scale(.96)}
@media(prefers-color-scheme:light){.btn{color:#fff}}
.final-score{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:48px;font-weight:700;color:var(--magma)}
.final-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#hint{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-size:11px;color:var(--muted);pointer-events:none;z-index:2;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;opacity:.7}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-block">
      <div class="hud-label">Heat banked</div>
      <div class="hud-value" id="scoreVal">0</div>
      <div id="combo"></div>
    </div>
    <div class="hud-block" style="text-align:right">
      <div class="hud-label">Night left</div>
      <div class="hud-value" id="timeVal">45</div>
    </div>
  </div>
  <div id="hint">Tap pulses · Hold tank to channel · Release to bank</div>
  <div id="overlay">
    <div class="title-main">Crustline</div>
    <div class="title-sub">Autumn vents run hotter tonight. Tap rising heat before it cools, channel it into the tanks.</div>
    <button class="btn" data-smoke="start" id="startBtn">Tap to Begin</button>
  </div>
  <div id="gameoverScreen" class="hidden">
    <div class="final-label">Warmth banked</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="title-sub" id="finalMsg">The crust settles for another night.</div>
    <button class="btn" data-smoke="restart" id="restartBtn">Bank Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('gameCanvas');
var ctx=canvas&&canvas.getContext('2d');
var scoreEl=document.getElementById('scoreVal');
var timeEl=document.getElementById('timeVal');
var comboEl=document.getElementById('combo');
var overlay=document.getElementById('overlay');
var gameoverScreen=document.getElementById('gameoverScreen');
var finalScoreEl=document.getElementById('finalScore');
var finalMsgEl=document.getElementById('finalMsg');
var hintEl=document.getElementById('hint');
var startBtn=document.getElementById('startBtn');
var restartBtn=document.getElementById('restartBtn');

var W=300,H=500,DPR=1;
var state='title';
var score=0,timeLeft=45,combo=0,comboTimer=0;
var pulses=[],particles=[],embers=[],vents=[],tanks=[];
var spawnTimer=0,spawnInterval=1.4,difficulty=0;
var captured=[];
var channeling=false,channelTank=-1,channelProgress=0,channelPulseIdx=-1;
var touchX=0,touchY=0,touchActive=false;
var shake=0,flash=0,hitPause=0;
var audioCtx=null;
var lastT=0,animId=0;
var isDark=true;

function checkDark(){
  try{isDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){isDark=true;}
}
checkDark();
try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',checkDark);
  }
}catch(e){}

function resize(){
  if(!canvas)return;
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||300;
  H=window.innerHeight||500;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  initLayout();
}
window.addEventListener('resize',resize);

function initLayout(){
  var tankW=Math.min(90,W/3.5);
  var tankH=56;
  var tankY=H- tankH - Math.max(24, H*0.08);
  var gap=(W-tankW*3)/4;
  tanks=[];
  for(var i=0;i<3;i++){
    tanks.push({x:gap+(tankW+gap)*i+tankW/2,y:tankY+ tankH/2,w:tankW,h:tankH,fill:0,total:0,glow:0});
  }
  vents=[];
  var margin=50;
  var positions=[
    {x:W*0.2,y:H*0.28},{x:W*0.8,y:H*0.25},{x:W*0.15,y:H*0.45},
    {x:W*0.85,y:H*0.42},{x:W*0.5,y:H*0.22},{x:W*0.35,y:H*0.38},{x:W*0.65,y:H*0.35}
  ];
  for(var v=0;v<positions.length;v++){
    vents.push({x:positions[v].x,y:positions[v].y,active:v<4,pulse:Math.random()*Math.PI*2});
  }
}

function initAudio(){
  try{
    if(!audioCtx&&window.AudioContext) audioCtx=new AudioContext();
    else if(!audioCtx&&window.webkitAudioContext) audioCtx=new window.webkitAudioContext();
  }catch(e){}
}

function playTone(freq,dur,type,vol){
  if(!audioCtx)return;
  try{
    if(audioCtx.state==='suspended') audioCtx.resume();
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type=type||'sine';
    o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+(dur||0.15));
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+(dur||0.15));
  }catch(e){}
}

function vibrate(ms){
  try{if(navigator.vibrate) navigator.vibrate(ms);}catch(e){}
}

function resetGame(){
  score=0;timeLeft=45;combo=0;comboTimer=0;
  pulses=[];particles=[];captured=[];
  spawnTimer=0;spawnInterval=1.4;difficulty=0;
  channeling=false;channelTank=-1;channelProgress=0;channelPulseIdx=-1;
  shake=0;flash=0;hitPause=0;
  for(var i=0;i<tanks.length;i++){tanks[i].fill=0;tanks[i].total=0;tanks[i].glow=0;}
  for(var j=0;j<vents.length;j++){vents[j].active=j<4;}
  updateHUD();
}

function startGame(){
  initAudio();
  resetGame();
  state='playing';
  overlay.classList.add('hidden');
  gameoverScreen.classList.add('hidden');
  hintEl.style.opacity='0.7';
  lastT=performance.now();
  if(!animId) loop(lastT);
}

function endGame(){
  state='gameover';
  gameoverScreen.classList.remove('hidden');
  finalScoreEl.textContent=String(Math.floor(score));
  if(score>=800) finalMsgEl.textContent='The bay holds your warmth until dawn.';
  else if(score>=400) finalMsgEl.textContent='A good haul before the crust cools.';
  else finalMsgEl.textContent='The vents will run hotter tomorrow night.';
  hintEl.style.opacity='0';
  playTone(180,0.4,'triangle',0.06);
}

function updateHUD(){
  if(scoreEl) scoreEl.textContent=String(Math.floor(score));
  if(timeEl) timeEl.textContent=String(Math.ceil(timeLeft));
  if(comboEl){
    if(combo>=2){
      comboEl.textContent='×'+combo+' chain';
      comboEl.classList.add('show');
    }else{
      comboEl.classList.remove('show');
    }
  }
}

function spawnPulse(){
  var activeVents=vents.filter(function(v){return v.active;});
  if(!activeVents.length)return;
  var v=activeVents[Math.floor(Math.random()*activeVents.length)];
  var heat=0.85+Math.random()*0.15;
  pulses.push({
    x:v.x+(Math.random()-0.5)*20,
    y:v.y-10,
    vx:(Math.random()-0.5)*0.4,
    vy:-0.6-Math.random()*0.3-difficulty*0.08,
    heat:heat,
    maxHeat:heat,
    r:14+heat*8,
    captured:false,
    wobble:Math.random()*Math.PI*2,
    id:Math.random()
  });
  burstParticles(v.x,v.y-8,6,0.6);
}

function burstParticles(x,y,n,intensity){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2;
    var sp=1+Math.random()*3*intensity;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:0.4+Math.random()*0.4,
      r:2+Math.random()*3,color:i%2?'ember':'magma'});
  }
}

function tankAt(x,y){
  for(var i=0;i<tanks.length;i++){
    var t=tanks[i];
    if(x>=t.x-t.w/2&&x<=t.x+t.w/2&&y>=t.y-t.h/2&&y<=t.y+t.h/2) return i;
  }
  return -1;
}

function pulseAt(x,y){
  for(var i=pulses.length-1;i>=0;i--){
    var p=pulses[i];
    if(p.captured) continue;
    var dx=x-p.x,dy=y-p.y;
    if(dx*dx+dy*dy<(p.r+16)*(p.r+16)) return i;
  }
  return -1;
}

function capturePulse(idx){
  if(channeling) return false;
  var p=pulses[idx];
  if(!p||p.captured||captured.length>=4) return false;
  p.captured=true;
  captured.push(p);
  playTone(320+p.heat*200,0.08,'sine',0.07);
  vibrate(8);
  burstParticles(p.x,p.y,8,p.heat);
  return true;
}

function bankPulse(p,tankIdx){
  var t=tanks[tankIdx];
  if(!t||!p) return;
  var pts=Math.floor(p.heat*100);
  if(combo>=2) pts=Math.floor(pts*(1+combo*0.15));
  score+=pts;
  t.total+=pts;
  t.glow=1;
  t.fill=Math.min(1,t.fill+p.heat*0.35);
  combo++;
  comboTimer=2.5;
  flash=0.15;
  shake=4;
  hitPause=3;
  burstParticles(t.x,t.y-t.h/2,12,p.heat);
  playTone(440+combo*30,0.12,'triangle',0.09);
  vibrate(15);
  updateHUD();
}

function startChannel(tankIdx){
  if(captured.length===0) return;
  channeling=true;
  channelTank=tankIdx;
  channelProgress=0;
  channelPulseIdx=0;
}

function finishChannel(){
  if(!channeling) return;
  channeling=false;
  if(channelTank>=0&&channelPulseIdx<captured.length){
    for(var i=channelPulseIdx;i<captured.length;i++){
      bankPulse(captured[i],channelTank);
    }
  }
  captured=[];
  for(var j=0;j<pulses.length;j++){
    if(pulses[j].captured) pulses[j]._dead=true;
  }
  pulses=pulses.filter(function(p){return !p._dead;});
  channelTank=-1;
  channelProgress=0;
  channelPulseIdx=-1;
}

function onPointerDown(x,y){
  touchX=x;touchY=y;touchActive=true;
  if(state!=='playing') return;
  initAudio();
  var pi=pulseAt(x,y);
  if(pi>=0){capturePulse(pi);return;}
  var ti=tankAt(x,y);
  if(ti>=0&&captured.length>0) startChannel(ti);
}

function onPointerMove(x,y){
  touchX=x;touchY=y;
  if(state!=='playing'||!touchActive) return;
  if(channeling){
    var ti=tankAt(x,y);
    if(ti>=0) channelTank=ti;
  }
}

function onPointerUp(){
  if(state==='playing'&&channeling) finishChannel();
  touchActive=false;
}

canvas.addEventListener('mousedown',function(e){
  e.preventDefault();onPointerDown(e.clientX,e.clientY);
});
canvas.addEventListener('mousemove',function(e){
  if(touchActive) onPointerMove(e.clientX,e.clientY);
});
window.addEventListener('mouseup',onPointerUp);

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(e.touches.length) onPointerDown(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length) onPointerMove(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
canvas.addEventListener('touchend',function(e){
  e.preventDefault();onPointerUp();
},{passive:false});
canvas.addEventListener('touchcancel',function(e){
  e.preventDefault();onPointerUp();
},{passive:false});

startBtn.addEventListener('click',function(e){
  e.stopPropagation();startGame();
});
restartBtn.addEventListener('click',function(e){
  e.stopPropagation();startGame();
});

document.addEventListener('keydown',function(e){
  if(state==='title'&&e.code==='Space'){e.preventDefault();startGame();}
  if(state==='gameover'&&e.code==='Space'){e.preventDefault();startGame();}
  if(state!=='playing') return;
  if(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3'){
    var ti=parseInt(e.code.slice(-1))-1;
    if(captured.length>0) startChannel(ti);
  }
  if(e.code==='Space'){
    e.preventDefault();
    if(channeling) finishChannel();
    else{
      var best=-1,bestD=99999;
      for(var i=0;i<pulses.length;i++){
        if(pulses[i].captured) continue;
        var d=pulses[i].x*pulses[i].x+pulses[i].y*pulses[i].y;
        if(d<bestD){bestD=d;best=i;}
      }
      if(best>=0) capturePulse(best);
    }
  }
});

function update(dt){
  if(state!=='playing') return;
  if(hitPause>0){hitPause-=dt*60;return;}

  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endGame();return;}

  difficulty=Math.min(1,(45-timeLeft)/45);
  spawnInterval=Math.max(0.45,1.4-difficulty*0.9);
  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){
    spawnTimer=0;
    spawnPulse();
    if(difficulty>0.3&&Math.random()<difficulty*0.4) spawnPulse();
  }

  if(difficulty>0.5&&vents.length>5&&!vents[5].active&&Math.random()<0.002) vents[5].active=true;
  if(difficulty>0.7&&vents.length>6&&!vents[6].active&&Math.random()<0.002) vents[6].active=true;

  comboTimer-=dt;
  if(comboTimer<=0&&combo>0){combo=0;updateHUD();}

  var coolRate=(0.12+difficulty*0.18)*dt;
  for(var i=pulses.length-1;i>=0;i--){
    var p=pulses[i];
    if(p.captured) continue;
    p.wobble+=dt*4;
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy-=0.02*dt*60;
    p.heat-=coolRate;
    p.r=8+p.heat*14;
    if(p.heat<=0||p.y<-30) pulses.splice(i,1);
  }

  for(var c=0;c<captured.length;c++){
    var cap=captured[c];
    var tx=touchX,ty=touchY;
    if(channeling&&channelTank>=0){
      tx=tanks[channelTank].x;
      ty=tanks[channelTank].y-20;
    }
    var angle=(c/captured.length)*Math.PI*2+performance.now()*0.003;
    cap.x=tx+Math.cos(angle)*28;
    cap.y=ty+Math.sin(angle)*28;
  }

  if(channeling&&channelTank>=0&&channelPulseIdx<captured.length){
    channelProgress+=dt*1.8;
    if(channelProgress>=1){
      bankPulse(captured[channelPulseIdx],channelTank);
      channelPulseIdx++;
      channelProgress=0;
      if(channelPulseIdx>=captured.length){
        channeling=false;
        captured=[];
        for(var k=0;k<pulses.length;k++){
          if(pulses[k].captured) pulses[k]._dead=true;
        }
        pulses=pulses.filter(function(pp){return !pp._dead;});
      }
    }
  }

  for(var t=0;t<tanks.length;t++){
    tanks[t].glow=Math.max(0,tanks[t].glow-dt*2);
    tanks[t].fill=Math.max(0,tanks[t].fill-dt*0.15);
  }

  for(var j=particles.length-1;j>=0;j--){
    var pt=particles[j];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vy-=0.05;pt.life-=dt;
    if(pt.life<=0) particles.splice(j,1);
  }

  if(embers.length<40&&Math.random()<0.3){
    embers.push({x:Math.random()*W,y:H+5,vx:(Math.random()-0.5)*0.3,
      vy:-0.3-Math.random()*0.5,life:3+Math.random()*4,r:1+Math.random()*2,a:0.3+Math.random()*0.4});
  }
  for(var e=embers.length-1;e>=0;e--){
    var em=embers[e];
    em.x+=em.vx;em.y+=em.vy;em.life-=dt;em.a*=0.998;
    if(em.life<=0||em.y<-10) embers.splice(e,1);
  }

  if(shake>0) shake*=0.85;
  if(flash>0) flash-=dt;
  updateHUD();
}

function col(name){
  if(name==='magma') return isDark?'#ff5c2a':'#c0391a';
  if(name==='ember') return isDark?'#ffb347':'#d35400';
  if(name==='basalt') return isDark?'#1e2228':'#b8b2aa';
  if(name==='bg') return isDark?'#0c0e12':'#e4e0da';
  if(name==='bg2') return isDark?'#141820':'#d6d0c8';
  if(name==='line') return isDark?'rgba(255,92,42,0.25)':'rgba(192,57,26,0.2)';
  return '#fff';
}

function drawBackground(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,isDark?'#0a0e18':'#c8d4e0');
  g.addColorStop(0.55,col('bg'));
  g.addColorStop(1,isDark?'#080a0e':'#d0cac2');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle=col('line');
  ctx.lineWidth=1;
  for(var i=0;i<8;i++){
    ctx.beginPath();
    var y=H*0.15+i*H*0.09;
    ctx.moveTo(0,y);
    for(var x=0;x<=W;x+=30){
      ctx.lineTo(x,y+Math.sin(x*0.02+i)*3);
    }
    ctx.stroke();
  }

  ctx.fillStyle=isDark?'rgba(61,139,122,0.06)':'rgba(42,107,92,0.08)';
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.85,W*0.6,H*0.12,0,0,Math.PI*2);
  ctx.fill();
}

function drawEmbers(){
  for(var i=0;i<embers.length;i++){
    var em=embers[i];
    ctx.globalAlpha=em.a*em.life/3;
    ctx.fillStyle=col('ember');
    ctx.beginPath();
    ctx.arc(em.x,em.y,em.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawVents(t){
  for(var i=0;i<vents.length;i++){
    var v=vents[i];
    if(!v.active) continue;
    v.pulse+=0.04;
    var glow=0.4+Math.sin(v.pulse)*0.2;

    ctx.save();
    ctx.translate(v.x,v.y);

    ctx.strokeStyle=col('magma');
    ctx.lineWidth=2;
    ctx.globalAlpha=0.5+glow*0.3;
    ctx.beginPath();
    for(var a=0;a<=Math.PI*2;a+=0.4){
      var rr=12+Math.sin(a*3+v.pulse)*2;
      var px=Math.cos(a)*rr,py=Math.sin(a)*rr*0.6;
      if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.stroke();

    var grd=ctx.createRadialGradient(0,0,0,0,0,18);
    grd.addColorStop(0,col('magma'));
    grd.addColorStop(0.5,col('ember'));
    grd.addColorStop(1,'transparent');
    ctx.globalAlpha=glow;
    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.arc(0,0,18,0,Math.PI*2);
    ctx.fill();

    ctx.globalAlpha=1;
    ctx.restore();
  }
}

function drawPulse(p,t){
  var heatRatio=Math.max(0,p.heat/p.maxHeat);
  var r=p.r;

  ctx.save();
  ctx.translate(p.x,p.y);

  var outer=ctx.createRadialGradient(0,0,r*0.2,0,0,r*1.4);
  outer.addColorStop(0,'rgba(255,200,100,'+(0.9*heatRatio)+')');
  outer.addColorStop(0.4,col('magma'));
  outer.addColorStop(1,'transparent');
  ctx.fillStyle=outer;
  ctx.beginPath();
  ctx.arc(0,0,r*1.4,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle=col('magma');
  ctx.lineWidth=2;
  ctx.globalAlpha=0.6+heatRatio*0.4;
  ctx.beginPath();
  var segs=6;
  for(var s=0;s<=segs;s++){
    var ang=(s/segs)*Math.PI*2+p.wobble;
    var rr=r*(0.85+Math.sin(ang*2)*0.08);
    var px=Math.cos(ang)*rr,py=Math.sin(ang)*rr;
    if(s===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.fillStyle=isDark?'#fff':'#1a1816';
  ctx.globalAlpha=heatRatio*0.9;
  ctx.font='10px ui-monospace,monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(Math.ceil(heatRatio*100),0,0);

  ctx.restore();
}

function drawTanks(t){
  for(var i=0;i<tanks.length;i++){
    var tk=tanks[i];
    var x=tk.x-tk.w/2,y=tk.y-tk.h/2;

    ctx.save();

    if(tk.glow>0){
      ctx.shadowColor=col('magma');
      ctx.shadowBlur=20*tk.glow;
    }

    ctx.fillStyle=col('basalt');
    ctx.strokeStyle=col('magma');
    ctx.lineWidth=2;
    ctx.beginPath();
    var rad=8;
    ctx.moveTo(x+rad,y);
    ctx.lineTo(x+tk.w-rad,y);
    ctx.quadraticCurveTo(x+tk.w,y,x+tk.w,y+rad);
    ctx.lineTo(x+tk.w,y+tk.h-rad);
    ctx.quadraticCurveTo(x+tk.w,y+tk.h,x+tk.w-rad,y+tk.h);
    ctx.lineTo(x+rad,y+tk.h);
    ctx.quadraticCurveTo(x,y+tk.h,x,y+tk.h-rad);
    ctx.lineTo(x,y+rad);
    ctx.quadraticCurveTo(x,y,x+rad,y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    if(tk.fill>0){
      var fh=tk.h*tk.fill*0.85;
      var grd=ctx.createLinearGradient(x,y+tk.h-fh,x,y+tk.h);
      grd.addColorStop(0,col('ember'));
      grd.addColorStop(1,col('magma'));
      ctx.fillStyle=grd;
      ctx.beginPath();
      ctx.moveTo(x+4,y+tk.h-4);
      ctx.lineTo(x+tk.w-4,y+tk.h-4);
      ctx.lineTo(x+tk.w-4,y+tk.h-fh);
      ctx.lineTo(x+4,y+tk.h-fh);
      ctx.closePath();
      ctx.fill();
    }

    ctx.shadowBlur=0;
    ctx.fillStyle=isDark?'#8a8680':'#5c5854';
    ctx.font='9px ui-monospace,monospace';
    ctx.textAlign='center';
    ctx.fillText('T'+(i+1),tk.x,tk.y+tk.h/2+18);

    if(channeling&&channelTank===i){
      ctx.strokeStyle=col('ember');
      ctx.lineWidth=3;
      ctx.globalAlpha=0.8;
      ctx.strokeRect(x-2,y-2,tk.w+4,tk.h+4);
      var bw=tk.w*channelProgress;
      ctx.fillStyle=col('ember');
      ctx.globalAlpha=0.4;
      ctx.fillRect(x,y-6,bw,4);
    }

    ctx.restore();
  }
}

function drawCapturedOrbit(){
  if(!captured.length) return;
  var cx=touchX,cy=touchY;
  if(channeling&&channelTank>=0){
    cx=tanks[channelTank].x;cy=tanks[channelTank].y-20;
  }
  ctx.strokeStyle=col('ember');
  ctx.lineWidth=1;
  ctx.globalAlpha=0.3;
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.arc(cx,cy,28,0,Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);
  if(channeling&&channelTank>=0&&channelPulseIdx<captured.length){
    var cap=captured[channelPulseIdx];
    var tx=tanks[channelTank].x,ty=tanks[channelTank].y-tanks[channelTank].h/2;
    var grd=ctx.createLinearGradient(cap.x,cap.y,tx,ty);
    grd.addColorStop(0,col('ember'));
    grd.addColorStop(1,col('magma'));
    ctx.strokeStyle=grd;
    ctx.lineWidth=3+channelProgress*4;
    ctx.globalAlpha=0.5+channelProgress*0.4;
    ctx.beginPath();
    ctx.moveTo(cap.x,cap.y);
    var mx=(cap.x+tx)/2+Math.sin(performance.now()*0.01)*4;
    var my=(cap.y+ty)/2-20;
    ctx.quadraticCurveTo(mx,my,tx,ty);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.min(1,p.life);
    ctx.fillStyle=col(p.color);
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawTimerBar(){
  if(state!=='playing') return;
  var pct=timeLeft/45;
  var bw=W-32;
  ctx.fillStyle=isDark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.08)';
  ctx.fillRect(16,H*0.06,bw,3);
  ctx.fillStyle=col('magma');
  ctx.fillRect(16,H*0.06,bw*pct,3);
}

function drawFlash(){
  if(flash<=0) return;
  ctx.fillStyle=isDark?'rgba(255,180,80,'+(flash*0.3)+')':'rgba(255,120,60,'+(flash*0.2)+')';
  ctx.fillRect(0,0,W,H);
}

function render(){
  if(!ctx) return;
  ctx.save();
  var sx=(Math.random()-0.5)*shake;
  var sy=(Math.random()-0.5)*shake;
  ctx.translate(sx,sy);

  drawBackground();
  drawEmbers();
  drawVents();
  for(var i=0;i<pulses.length;i++) drawPulse(pulses[i]);
  drawTanks();
  drawCapturedOrbit();
  drawParticles();
  drawTimerBar();
  drawFlash();

  ctx.restore();
}

function loop(t){
  animId=requestAnimationFrame(loop);
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  update(dt);
  render();
}

resize();
render();
loop(performance.now());

})();
</script>
</body>
</html>
