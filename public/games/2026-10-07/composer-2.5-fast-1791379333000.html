<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tunnel Listing — 15M Rooms Below</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0c0a;--bg2:#161310;--text:#e8dcc8;--muted:#8a7d6a;
  --rust:#b85c38;--lamp:#f0c060;--concrete:#3a3530;--blueprint:#4a7a8c;
  --hud:rgba(14,12,10,.85);--danger:#c04030;--tag:#d4a840;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8e2d6;--bg2:#d8d0c4;--text:#1a1612;--muted:#6a6058;
    --rust:#9a4028;--lamp:#c89830;--concrete:#a09890;--blueprint:#3a6070;
    --hud:rgba(232,226,214,.9);--danger:#a03020;--tag:#a07820;
  }
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#gameCanvas{flex:1;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 6px;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-block{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:12px;line-height:1.35}
.hud-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud-value{font-size:20px;font-weight:600;color:var(--text)}
#forkTimer{display:none;color:var(--lamp);font-size:13px;margin-top:2px}
#forkTimer.show{display:block}
#overlay,#gameoverScreen{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;z-index:10;pointer-events:none;
  background:linear-gradient(180deg,rgba(14,12,10,.72) 0%,rgba(14,12,10,.5) 100%)}
@media(prefers-color-scheme:light){
  #overlay,#gameoverScreen{background:linear-gradient(180deg,rgba(232,226,214,.82) 0%,rgba(232,226,214,.6) 100%)}
}
#overlay.hidden,#gameoverScreen.hidden{display:none}
.title-main{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:clamp(24px,7vw,38px);
  font-weight:700;letter-spacing:-.02em;color:var(--text);text-align:center;line-height:1.15}
.title-sub{font-size:13px;color:var(--muted);max-width:290px;text-align:center;line-height:1.55;padding:0 18px}
.btn{pointer-events:auto!important;min-width:168px;min-height:48px;padding:14px 26px;border:none;border-radius:8px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:14px;font-weight:600;
  cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;background:var(--rust);color:#fff;
  box-shadow:0 4px 18px rgba(184,92,56,.35)}
.btn:active{transform:scale(.96)}
.final-score{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:44px;font-weight:700;color:var(--rust)}
.final-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-size:10px;color:var(--muted);pointer-events:none;z-index:2;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;opacity:.75}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-block">
      <div class="hud-label">Appraised</div>
      <div class="hud-value" id="scoreVal">$0</div>
      <div id="forkTimer"></div>
    </div>
    <div class="hud-block" style="text-align:right">
      <div class="hud-label">Depth left</div>
      <div class="hud-value" id="timeVal">50</div>
    </div>
  </div>
  <div id="hint">Swipe or tap sides · Arrow keys · Pick the live branch</div>
  <div id="overlay">
    <div class="title-main">Tunnel Listing</div>
    <div class="title-sub">Fifteen million rooms below. Swipe between forked passages before dead ends collapse — grab price tags from rooms that shouldn't exist.</div>
    <button class="btn" data-smoke="start" id="startBtn">Enter the Listing</button>
  </div>
  <div id="gameoverScreen" class="hidden">
    <div class="final-label">Total appraised</div>
    <div class="final-score" id="finalScore">$0</div>
    <div class="title-sub" id="finalMsg">The blueprint ends here.</div>
    <button class="btn" data-smoke="restart" id="restartBtn">Descend Again</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('gameCanvas');
var ctx=canvas?canvas.getContext('2d'):null;
var scoreEl=document.getElementById('scoreVal');
var timeEl=document.getElementById('timeVal');
var forkTimerEl=document.getElementById('forkTimer');
var overlay=document.getElementById('overlay');
var gameoverScreen=document.getElementById('gameoverScreen');
var finalScoreEl=document.getElementById('finalScore');
var finalMsgEl=document.getElementById('finalMsg');
var hintEl=document.getElementById('hint');
var startBtn=document.getElementById('startBtn');
var restartBtn=document.getElementById('restartBtn');

var W=360,H=640,DPR=1;
var state='title';
var score=0,timeLeft=50,combo=0;
var player={lane:1,targetLane:1,laneT:1,x:0,y:0,trail:[]};
var scrollY=0,scrollSpeed=90;
var segments=[],particles=[],floatTexts=[];
var forkActive=false,activeForkSeg=null;
var debris=[];
var spawnAhead=0,difficulty=0,shake=0,flash=0,hitPause=0;
var audioCtx=null,lastT=0,animId=0,isDark=true;
var touchStartX=0,touchStartY=0,touchMoved=false;

var PRICES=[
  {label:'$42',val:42},{label:'$890',val:890},{label:'$12K',val:12000},
  {label:'$2.1M',val:2100000,decoy:true},{label:'$15M',val:15000000,decoy:true},
  {label:'$0.99',val:1},{label:'$7,777',val:7777},{label:'∞¢',val:500},
  {label:'$404',val:404},{label:'$3.3M',val:3300000,decoy:true},
  {label:'$188',val:188},{label:'NEG.',val:0},{label:'$9,999',val:9999}
];
var ROOM_NAMES=['Wine Cellar','Sub-basement','Catacombs','Laundry Void','Echo Chamber',
  'Root Room','Furnace Nook','Archive Pit','Mirror Hall','Agent Bunker'];

function checkDark(){
  try{isDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){isDark=true;}
}
checkDark();
try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',checkDark);
  }
}catch(e){}

function laneX(lane){
  var margin=W*0.12;
  var usable=W-margin*2;
  return margin+usable*(lane/2);
}

function fmtScore(v){
  if(v>=1000000)return '$'+(v/1000000).toFixed(1)+'M';
  if(v>=1000)return '$'+(v/1000).toFixed(1)+'K';
  return '$'+Math.floor(v);
}

function resize(){
  if(!canvas)return;
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||360;
  H=window.innerHeight||640;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  if(ctx)ctx.setTransform(DPR,0,0,DPR,0,0);
  player.y=H*0.78;
  player.x=laneX(player.lane);
}
window.addEventListener('resize',resize);
resize();

function initAudio(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}

function playTone(freq,dur,type,vol){
  if(!audioCtx)return;
  try{
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type=type||'sine';
    o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.08,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.12));
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+(dur||0.12));
  }catch(e){}
}

function playCollect(){
  playTone(520+combo*40,0.1,'triangle',0.07);
  setTimeout(function(){playTone(780+combo*30,0.08,'sine',0.05);},50);
}

function playSwitch(){playTone(280,0.06,'square',0.04);}
function playForkWarn(){playTone(180,0.15,'sawtooth',0.05);}
function playCollapse(){
  playTone(80,0.35,'sawtooth',0.1);
  try{navigator.vibrate&&navigator.vibrate([30,20,50]);}catch(e){}
}
function playDecoy(){playTone(120,0.2,'square',0.06);}

function randPick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function makeSegment(type,y){
  var seg={type:type,y:y,w:W*0.76,h:0,lane:1,safeLane:1,collected:false,price:null,roomName:'',decoy:false,flashT:0};
  if(type==='straight'){
    seg.h=80+Math.random()*40;
  }else if(type==='room'){
    seg.h=110;
    seg.lane=Math.floor(Math.random()*3);
    var p=randPick(PRICES.filter(function(x){return !x.decoy||Math.random()<0.3+difficulty*0.08;}));
    seg.price=p;
    seg.decoy=!!p.decoy;
    seg.roomName=randPick(ROOM_NAMES);
  }else if(type==='fork'){
    seg.h=170;
    seg.safeLane=Math.floor(Math.random()*3);
    seg.forkTimer=-1;
    seg.forkDone=false;
    seg.decoyLanes=[];
    var dead=[0,1,2].filter(function(l){return l!==seg.safeLane;});
    for(var d=0;d<dead.length;d++){
      if(Math.random()<0.55+difficulty*0.2){
        var dp=randPick(PRICES.filter(function(x){return x.decoy;}));
        seg.decoyLanes.push({lane:dead[d],price:dp});
      }
    }
  }
  return seg;
}

function buildInitialWorld(){
  segments=[];
  var y=-200;
  for(var i=0;i<8;i++){
    var t=i%4===2?'room':(i%5===3?'fork':'straight');
    if(i<2)t='straight';
    var s=makeSegment(t,y);
    y-=s.h+20;
    segments.push(s);
  }
  spawnAhead=y;
}

function spawnMore(){
  while(spawnAhead>scrollY-H-400){
    var r=Math.random();
    var t='straight';
    if(r<0.22+difficulty*0.04)t='room';
    else if(r<0.38+difficulty*0.06)t='fork';
    var s=makeSegment(t,spawnAhead);
    spawnAhead-=s.h+15+Math.random()*25;
    segments.push(s);
  }
  while(segments.length>0&&segments[0].y-scrollY>H+200){
    segments.shift();
  }
}

function addParticles(x,y,col,n){
  for(var i=0;i<(n||8);i++){
    particles.push({
      x:x,y:y,vx:(Math.random()-0.5)*120,vy:(Math.random()-0.5)*120-40,
      life:0.4+Math.random()*0.4,r:2+Math.random()*3,col:col||'#f0c060'
    });
  }
}

function addFloatText(x,y,txt,col){
  floatTexts.push({x:x,y:y,txt:txt,life:1.2,col:col||'#d4a840',vy:-40});
}

function setLane(l){
  if(state!=='playing')return;
  l=Math.max(0,Math.min(2,l|0));
  if(l!==player.targetLane){
    player.targetLane=l;
    playSwitch();
    try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}
  }
}

function swipeLane(dir){
  setLane(player.targetLane+(dir>0?1:-1));
}

function resetGame(){
  score=0;timeLeft=50;combo=0;difficulty=0;
  scrollY=0;scrollSpeed=90;
  player.lane=1;player.targetLane=1;player.laneT=1;player.trail=[];
  forkActive=false;activeForkSeg=null;
  particles=[];floatTexts=[];debris=[];
  buildInitialWorld();
  if(scoreEl)scoreEl.textContent='$0';
  if(timeEl)timeEl.textContent='50';
  if(forkTimerEl){forkTimerEl.textContent='';forkTimerEl.classList.remove('show');}
}

function startGame(){
  initAudio();
  resetGame();
  state='playing';
  if(overlay)overlay.classList.add('hidden');
  if(gameoverScreen)gameoverScreen.classList.add('hidden');
  if(hintEl)hintEl.style.opacity='0.75';
  lastT=performance.now();
  if(!animId)loop(lastT);
}

function endGame(msg){
  state='gameover';
  if(gameoverScreen)gameoverScreen.classList.remove('hidden');
  if(finalScoreEl)finalScoreEl.textContent=fmtScore(score);
  if(finalMsgEl)finalMsgEl.textContent=msg||'The blueprint ends here.';
  if(hintEl)hintEl.style.opacity='0';
  if(forkTimerEl){forkTimerEl.textContent='';forkTimerEl.classList.remove('show');}
}

function die(reason){
  shake=12;flash=0.4;playCollapse();
  endGame(reason||'Dead end. Ceiling collapse.');
}

function collectRoom(seg){
  if(seg.collected||!seg.price)return;
  seg.collected=true;
  var val=seg.price.val;
  if(seg.decoy&&seg.price.decoy){
    playDecoy();
    addFloatText(laneX(seg.lane),seg.y-scrollY+40,'DECOY!','#c04030');
    combo=0;
    shake=4;
    return;
  }
  score+=val;
  combo++;
  if(scoreEl)scoreEl.textContent=fmtScore(score);
  playCollect();
  addParticles(laneX(seg.lane),seg.y-scrollY+30,'#d4a840',10);
  addFloatText(laneX(seg.lane),seg.y-scrollY+20,'+'+seg.price.label,'#d4a840');
  try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}
}

function update(dt){
  if(state!=='playing')return;
  if(hitPause>0){hitPause-=dt;return;}

  timeLeft-=dt;
  if(timeLeft<=0){
    timeLeft=0;
    endGame('Survey complete. You mapped the absurd floor plan.');
    return;
  }
  if(timeEl)timeEl.textContent=Math.ceil(timeLeft).toString();

  difficulty=Math.min(1,(50-timeLeft)/50);
  scrollSpeed=90+difficulty*70;

  player.laneT+=(player.targetLane-player.laneT)*Math.min(1,dt*12);
  player.lane=Math.round(player.laneT*100)/100;
  player.x=laneX(player.laneT);

  scrollY+=scrollSpeed*dt;
  spawnMore();

  forkActive=false;activeForkSeg=null;
  var forkRead=3-Math.min(1.2,difficulty*1.4);

  for(var i=0;i<segments.length;i++){
    var seg=segments[i];
    var sy=seg.y-scrollY;
    var py=player.y;

    if(seg.type==='room'&&!seg.collected){
      if(Math.abs(sy-py)<55&&Math.abs(player.laneT-seg.lane)<0.45){
        collectRoom(seg);
      }
    }

    if(seg.type==='fork'){
      var forkZone=sy>py-130&&sy<py+20;
      if(forkZone&&!seg.forkDone){
        forkActive=true;
        activeForkSeg=seg;
        if(seg.forkTimer<0){
          seg.forkTimer=forkRead;
          playForkWarn();
        }
        seg.forkTimer-=dt;
        if(forkTimerEl){
          forkTimerEl.textContent='FORK · '+Math.max(0,seg.forkTimer).toFixed(1)+'s';
          forkTimerEl.classList.add('show');
        }
        if(seg.forkTimer<=0){
          seg.forkDone=true;
          var chosen=Math.round(player.laneT);
          if(chosen!==seg.safeLane){
            die('Wrong branch. The tunnel sealed behind you.');
            return;
          }
          hitPause=0.08;
          addFloatText(W/2,py-60,'CLEAR','#4a7a8c');
          addParticles(laneX(chosen),py,'#4a7a8c',6);
          playTone(400,0.15,'triangle',0.06);
          if(forkTimerEl){forkTimerEl.textContent='';forkTimerEl.classList.remove('show');}
        }
      }
    }

    if(seg.decoy||seg.type==='fork')seg.flashT=(seg.flashT||0)+dt*4;
  }

  if(!forkActive&&forkTimerEl){
    forkTimerEl.textContent='';
    forkTimerEl.classList.remove('show');
  }

  if(difficulty>0.15&&Math.random()<dt*difficulty*2.5){
    debris.push({
      x:laneX(Math.floor(Math.random()*3))+(Math.random()-0.5)*40,
      y:-20,w:8+Math.random()*16,h:6+Math.random()*10,
      vy:scrollSpeed*0.6+40,rot:Math.random()*Math.PI
    });
  }
  for(var d=debris.length-1;d>=0;d--){
    var db=debris[d];
    db.y+=db.vy*dt;db.rot+=dt*2;
    if(db.y>H+30)debris.splice(d,1);
  }

  player.trail.push({x:player.x,y:player.y});
  if(player.trail.length>18)player.trail.shift();

  for(var p=particles.length-1;p>=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=180*dt;pt.life-=dt;
    if(pt.life<=0)particles.splice(p,1);
  }
  for(var f=floatTexts.length-1;f>=0;f--){
    var ft=floatTexts[f];
    ft.y+=ft.vy*dt;ft.life-=dt;
    if(ft.life<=0)floatTexts.splice(f,1);
  }
  if(shake>0)shake=Math.max(0,shake-dt*18);
  if(flash>0)flash=Math.max(0,flash-dt*2);
}

function drawBlueprintGrid(){
  if(!ctx)return;
  ctx.save();
  ctx.strokeStyle=isDark?'rgba(74,122,140,0.12)':'rgba(58,96,112,0.15)';
  ctx.lineWidth=1;
  var gs=32;
  var off=scrollY%gs;
  for(var x=0;x<W;x+=gs){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(var y=-off;y<H;y+=gs){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  ctx.restore();
}

function drawTunnelWalls(){
  if(!ctx)return;
  var margin=W*0.08;
  var grad=ctx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,isDark?'#1a1612':'#c8c0b4');
  grad.addColorStop(0.15,isDark?'#2a2420':'#b0a898');
  grad.addColorStop(0.5,isDark?'#3a3530':'#989088');
  grad.addColorStop(0.85,isDark?'#2a2420':'#b0a898');
  grad.addColorStop(1,isDark?'#1a1612':'#c8c0b4');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,margin,H);
  ctx.fillRect(W-margin,0,margin,H);

  ctx.fillStyle=isDark?'rgba(184,92,56,0.08)':'rgba(154,64,40,0.1)';
  for(var i=0;i<6;i++){
    var rx=margin*0.3+Math.sin(scrollY*0.01+i)*margin*0.2;
    ctx.fillRect(rx,i*(H/6),margin*0.4,H/6+2);
    ctx.fillRect(W-margin-rx-margin*0.4,i*(H/6),margin*0.4,H/6+2);
  }
}

function drawSegment(seg){
  if(!ctx)return;
  var sy=seg.y-scrollY;
  if(sy<-seg.h-50||sy>H+100)return;

  var lx=laneX(0),cx=laneX(1),rx=laneX(2);
  var tunnelW=W*0.22;

  ctx.save();
  if(seg.type==='straight'){
    ctx.fillStyle=isDark?'#2a2420':'#b8b0a4';
    ctx.fillRect(lx-tunnelW/2,sy,tunnelW*3+tunnelW,sy+seg.h);
    ctx.strokeStyle=isDark?'rgba(240,192,96,0.15)':'rgba(200,152,48,0.2)';
    ctx.lineWidth=1;
    ctx.setLineDash([6,8]);
    ctx.beginPath();
    ctx.moveTo(lx,sy);ctx.lineTo(lx,sy+seg.h);
    ctx.moveTo(cx,sy);ctx.lineTo(cx,sy+seg.h);
    ctx.moveTo(rx,sy);ctx.lineTo(rx,sy+seg.h);
    ctx.stroke();
    ctx.setLineDash([]);
  }else if(seg.type==='room'){
    var roomX=laneX(seg.lane);
    var rw=tunnelW*1.1,rh=70;
    var ry=sy+20;
    ctx.fillStyle=isDark?'#322c26':'#a89888';
    ctx.beginPath();
    ctx.arc(roomX,ry+rh/2,rw/2,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle=isDark?'rgba(184,92,56,0.5)':'rgba(154,64,40,0.55)';
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle=isDark?'rgba(240,192,96,0.12)':'rgba(200,152,48,0.18)';
    ctx.beginPath();ctx.arc(roomX,ry+rh/2-8,12,0,Math.PI*2);ctx.fill();

    if(!seg.collected&&seg.price){
      var flash=seg.decoy?(0.6+Math.sin(seg.flashT||0)*0.4):1;
      ctx.globalAlpha=flash;
      ctx.fillStyle=seg.decoy?'#c04030':'#d4a840';
      ctx.font='600 13px ui-monospace,monospace';
      ctx.textAlign='center';
      ctx.fillText(seg.price.label,roomX,ry-6);
      ctx.globalAlpha=1;
      ctx.fillStyle=isDark?'#8a7d6a':'#5a5048';
      ctx.font='10px ui-monospace,monospace';
      ctx.fillText(seg.roomName,roomX,ry+rh/2+18);
    }
  }else if(seg.type==='fork'){
    var forkY=sy+85;
    var branches=[{x:lx,lane:0},{x:cx,lane:1},{x:rx,lane:2}];
    var ft=seg.forkTimer>=0?seg.forkTimer:99;
    var reveal=ft<1.2;
    for(var b=0;b<3;b++){
      var br=branches[b];
      var isSafe=seg.safeLane===br.lane;
      ctx.strokeStyle=isDark?'rgba(184,92,56,0.45)':'rgba(154,64,40,0.5)';
      ctx.lineWidth=2;
      if(reveal&&isSafe){
        ctx.strokeStyle=isDark?'rgba(74,122,140,0.75)':'rgba(58,96,112,0.8)';
        ctx.lineWidth=2.5;
      }
      ctx.beginPath();
      ctx.moveTo(laneX(1),forkY);
      ctx.quadraticCurveTo(br.x,forkY-45,br.x,sy+8);
      ctx.stroke();
      if(ft<2&&!isSafe){
        ctx.fillStyle=isDark?'rgba(192,64,48,0.3)':'rgba(160,48,32,0.35)';
        ctx.font='8px ui-monospace,monospace';
        ctx.textAlign='center';
        ctx.fillText('?',br.x,sy+16);
      }
    }
    if(seg.decoyLanes){
      for(var dl=0;dl<seg.decoyLanes.length;dl++){
        var dec=seg.decoyLanes[dl];
        var dx=laneX(dec.lane);
        var pulse=0.65+Math.sin((seg.flashT||0)+dl)*0.35;
        ctx.globalAlpha=pulse;
        ctx.fillStyle='#c04030';
        ctx.font='600 12px ui-monospace,monospace';
        ctx.textAlign='center';
        ctx.fillText(dec.price.label,dx,forkY-18);
        ctx.globalAlpha=1;
      }
    }
    if(forkActive&&activeForkSeg===seg){
      ctx.fillStyle=isDark?'rgba(240,192,96,0.9)':'rgba(200,152,48,0.95)';
      ctx.font='600 11px ui-monospace,monospace';
      ctx.textAlign='center';
      ctx.fillText('SWIPE TO LIVE BRANCH',W/2,forkY-58);
    }
  }
  ctx.restore();
}

function drawPlayer(){
  if(!ctx)return;
  var px=player.x,py=player.y;

  for(var t=0;t<player.trail.length;t++){
    var tr=player.trail[t];
    var a=t/player.trail.length*0.25;
    ctx.fillStyle=isDark?'rgba(240,192,96,'+a+')':'rgba(200,152,48,'+a+')';
    ctx.beginPath();ctx.arc(tr.x,tr.y,3,0,Math.PI*2);ctx.fill();
  }

  var glow=ctx.createRadialGradient(px,py,0,px,py,28);
  glow.addColorStop(0,isDark?'rgba(240,192,96,0.5)':'rgba(200,152,48,0.45)');
  glow.addColorStop(1,'rgba(240,192,96,0)');
  ctx.fillStyle=glow;
  ctx.beginPath();ctx.arc(px,py,28,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=isDark?'#f0c060':'#c89830';
  ctx.beginPath();ctx.arc(px,py,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=isDark?'#1a1612':'#fff';
  ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle=isDark?'rgba(74,122,140,0.4)':'rgba(58,96,112,0.45)';
  ctx.lineWidth=1;
  ctx.setLineDash([4,6]);
  ctx.beginPath();
  ctx.moveTo(laneX(0),py);ctx.lineTo(laneX(2),py);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawParticles(){
  if(!ctx)return;
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawFloatTexts(){
  if(!ctx)return;
  ctx.font='600 14px ui-monospace,monospace';
  ctx.textAlign='center';
  for(var i=0;i<floatTexts.length;i++){
    var f=floatTexts[i];
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.fillStyle=f.col;
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

function drawDebris(){
  if(!ctx)return;
  var narrow=difficulty*0.08;
  for(var i=0;i<debris.length;i++){
    var db=debris[i];
    ctx.save();
    ctx.translate(db.x,db.y);
    ctx.rotate(db.rot);
    ctx.fillStyle=isDark?'#4a4038':'#8a8078';
    ctx.fillRect(-db.w/2,-db.h/2,db.w,db.h);
    ctx.strokeStyle=isDark?'rgba(192,64,48,0.4)':'rgba(160,48,32,0.35)';
    ctx.strokeRect(-db.w/2,-db.h/2,db.w,db.h);
    ctx.restore();
  }
  if(narrow>0.02){
    ctx.fillStyle=isDark?'rgba(14,12,10,'+(0.25+narrow)+')':'rgba(232,226,214,'+(0.2+narrow)+')';
    var inset=W*narrow*0.5;
    ctx.fillRect(0,0,inset,H);
    ctx.fillRect(W-inset,0,inset,H);
  }
}

function drawLaneHints(){
  if(!ctx||state!=='playing')return;
  var alpha=0.12+Math.sin(performance.now()*0.003)*0.04;
  ctx.fillStyle=isDark?'rgba(240,192,96,'+alpha+')':'rgba(200,152,48,'+alpha+')';
  ctx.font='10px ui-monospace,monospace';
  ctx.textAlign='center';
  ctx.fillText('◀',laneX(0),H-28);
  ctx.fillText('▶',laneX(2),H-28);
}

function render(){
  if(!ctx)return;
  var sx=shake>0?(Math.random()-0.5)*shake:0;
  var sy=shake>0?(Math.random()-0.5)*shake:0;
  ctx.save();
  ctx.translate(sx,sy);

  ctx.fillStyle=isDark?'#0e0c0a':'#e8e2d6';
  ctx.fillRect(-10,-10,W+20,H+20);

  drawBlueprintGrid();
  drawTunnelWalls();

  for(var i=0;i<segments.length;i++)drawSegment(segments[i]);

  drawDebris();
  drawPlayer();
  drawParticles();
  drawFloatTexts();
  drawLaneHints();

  ctx.restore();

  if(flash>0){
    ctx.fillStyle=isDark?'rgba(192,64,48,'+flash*0.4+')':'rgba(160,48,32,'+flash*0.35+')';
    ctx.fillRect(0,0,W,H);
  }
}

function loop(t){
  animId=requestAnimationFrame(loop);
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  update(dt);
  render();
}

function onPointerDown(e){
  if(e.target&&e.target.closest&&e.target.closest('button'))return;
  e.preventDefault();
  touchStartX=e.clientX||(e.touches&&e.touches[0]?e.touches[0].clientX:0);
  touchStartY=e.clientY||(e.touches&&e.touches[0]?e.touches[0].clientY:0);
  touchMoved=false;
  if(state==='playing'){
    var tx=touchStartX;
    if(tx<W/3)setLane(0);
    else if(tx>W*2/3)setLane(2);
    else setLane(1);
  }
}

function onPointerMove(e){
  e.preventDefault();
  var cx=e.clientX||(e.touches&&e.touches[0]?e.touches[0].clientX:0);
  var cy=e.clientY||(e.touches&&e.touches[0]?e.touches[0].clientY:0);
  var dx=cx-touchStartX,dy=cy-touchStartY;
  if(Math.abs(dx)>24||Math.abs(dy)>24)touchMoved=true;
  if(state==='playing'&&Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)){
    swipeLane(dx>0?1:-1);
    touchStartX=cx;
  }
}

function onPointerUp(e){e.preventDefault();}

function onKey(e){
  if(state==='playing'){
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')setLane(player.targetLane-1);
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')setLane(player.targetLane+1);
    if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')setLane(1);
  }
}

if(canvas){
  canvas.addEventListener('mousedown',onPointerDown);
  canvas.addEventListener('mousemove',onPointerMove);
  canvas.addEventListener('mouseup',onPointerUp);
  canvas.addEventListener('touchstart',onPointerDown,{passive:false});
  canvas.addEventListener('touchmove',onPointerMove,{passive:false});
  canvas.addEventListener('touchend',onPointerUp,{passive:false});
}
window.addEventListener('keydown',onKey);

if(startBtn)startBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});
if(restartBtn)restartBtn.addEventListener('click',function(e){e.stopPropagation();startGame();});

buildInitialWorld();
render();
animId=requestAnimationFrame(loop);

})();
</script>
</body>
</html>
