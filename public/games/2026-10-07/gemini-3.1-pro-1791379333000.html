<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JXL LAB</title>
<style>
    :root {
        --bg-color: #08080c;
        --text-color: #eef;
        --overlay-bg: rgba(8, 8, 12, 0.85);
    }
    @media (prefers-color-scheme: light) {
        :root {
            --bg-color: #f0f0f4;
            --text-color: #112;
            --overlay-bg: rgba(240, 240, 244, 0.85);
        }
    }
    body, html {
        margin: 0; padding: 0;
        width: 100dvw; height: 100dvh;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
        display: block;
    }
    #overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--overlay-bg);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        pointer-events: none;
        transition: opacity 0.3s;
    }
    .screen {
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
        padding: 20px;
    }
    .screen h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: 2px;
    }
    .screen p {
        margin: 0;
        font-size: 1rem;
        opacity: 0.8;
        line-height: 1.5;
    }
    button {
        pointer-events: auto;
        position: relative;
        z-index: 12;
        font-family: inherit;
        font-size: 1.2rem;
        padding: 15px 40px;
        background: transparent;
        color: var(--text-color);
        border: 2px solid var(--text-color);
        cursor: pointer;
        text-transform: uppercase;
        font-weight: bold;
        border-radius: 4px;
        transition: all 0.2s;
    }
    button:active {
        background: var(--text-color);
        color: var(--bg-color);
    }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="overlay">
  <div id="start-screen" class="screen">
    <h1>JXL LAB</h1>
    <p>Flick quality blocks to matching bins.<br>Avoid anomalies. Ship the image.</p>
    <button data-smoke="start" id="start-btn">START</button>
  </div>
  <div id="game-over-screen" class="screen" style="display: none;">
    <h1>CONNECTION DROPPED</h1>
    <p id="score-display"></p>
    <button data-smoke="restart" id="restart-btn">RESTART</button>
  </div>
</div>

<script>
(function() {
    let canvas, ctx;
    let width, height;
    let dpr = 1;

    let colors = {};
    const updateColors = () => {
        const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        colors = {
            bg: isDark ? '#08080c' : '#f0f0f4',
            text: isDark ? '#eef' : '#112',
            wire: [
                isDark ? '#00ffff' : '#0077aa',
                isDark ? '#ffea00' : '#bb8800',
                isDark ? '#00ff44' : '#00aa33'
            ],
            error: isDark ? '#ff3344' : '#cc1122',
            artifactSafe: isDark ? '#ff7700' : '#cc5500',
            gray: isDark ? '#2a2a35' : '#cccccc'
        };
    };

    updateColors();
    if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateColors);
    }

    let gameState = 'start';
    let lastTime = 0;
    let level = 1;
    let totalScore = 0;
    let quality = 0;
    let targetQuality = 10;
    let maxTime = 30;
    let timeRemaining = 30;
    let noiseLevel = 0;
    
    let particles = [];
    let floatingTexts = [];
    let blocks = [];
    let artifacts = [];
    
    let activeBlock = null;
    let nextBlockType = 0;

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragCurrentX = 0;
    let dragCurrentY = 0;

    class Block {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type;
            this.radius = 25;
            this.mass = 1 + (level - 1) * 0.2;
            this.vx = 0;
            this.vy = 0;
            this.angle = 0;
            this.vAngle = 0;
            this.state = 'spawning';
            this.scale = 0;
            this.flightTime = 0;
            this.trail = [];
        }
    }

    class Artifact {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 18;
            this.mass = 2;
            this.vx = (Math.random() - 0.5) * 300;
            this.vy = (Math.random() - 0.5) * 300;
        }
    }

    function init() {
        try {
            canvas = document.getElementById('game-canvas');
            if (!canvas.getContext) return;
            ctx = canvas.getContext('2d', { alpha: false });
            if (!ctx) return;
            
            window.addEventListener('resize', resize);
            resize();
            
            setupInputs();
            setupUI();
            
            lastTime = performance.now();
            requestAnimationFrame(loop);
        } catch (e) {
            console.error("Initialization error:", e);
        }
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        
        if (gameState === 'start' || gameState === 'gameover') {
            ctx.save();
            ctx.scale(dpr, dpr);
            draw(0);
            ctx.restore();
        }
    }

    function setupUI() {
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    }

    function setupInputs() {
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (gameState !== 'playing') return;
            if (activeBlock && activeBlock.state === 'ready') {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                dragCurrentX = e.clientX;
                dragCurrentY = e.clientY;
                activeBlock.state = 'dragging';
            }
        });
        
        canvas.addEventListener('pointermove', (e) => {
            e.preventDefault();
            if (isDragging) {
                dragCurrentX = e.clientX;
                dragCurrentY = e.clientY;
            }
        });
        
        const handlePointerUp = (e) => {
            e.preventDefault();
            if (isDragging) {
                isDragging = false;
                let dx = dragCurrentX - dragStartX;
                let dy = dragCurrentY - dragStartY;
                
                if (dy < -20) {
                    activeBlock.vx = (dx * 15) / activeBlock.mass;
                    activeBlock.vy = (dy * 15) / activeBlock.mass;
                    activeBlock.vAngle = (Math.random() - 0.5) * 10 * activeBlock.mass;
                    activeBlock.state = 'flying';
                    
                    if (navigator.vibrate) navigator.vibrate(15);
                    spawnNextBlock();
                } else {
                    activeBlock.state = 'ready';
                }
            }
        };
        
        canvas.addEventListener('pointerup', handlePointerUp);
        canvas.addEventListener('pointercancel', handlePointerUp);
    }

    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        gameState = 'playing';
        level = 1;
        totalScore = 0;
        quality = 0;
        targetQuality = 10;
        maxTime = 30;
        timeRemaining = maxTime;
        noiseLevel = 0;
        particles = [];
        floatingTexts = [];
        blocks = [];
        artifacts = [];
        nextBlockType = Math.floor(Math.random() * 3);
        
        startLevel();
    }

    function startLevel() {
        quality = 0;
        targetQuality = 10 + level * 2;
        maxTime = Math.max(15, 30 - level * 2);
        timeRemaining = maxTime;
        
        artifacts = [];
        let numArtifacts = Math.min(8, level);
        for (let i = 0; i < numArtifacts; i++) {
            artifacts.push(new Artifact(
                width / 2 + (Math.random() - 0.5) * 100,
                height / 2 + (Math.random() - 0.5) * 100
            ));
        }
        
        blocks = [];
        spawnNextBlock();
    }

    function levelUp() {
        totalScore += quality * 100 + Math.floor(timeRemaining * 10);
        level++;
        floatingTexts.push({
            text: `IMAGE SHIPPED! LVL ${level}`,
            x: width / 2,
            y: height / 2,
            life: 2,
            maxLife: 2,
            color: colors.text
        });
        startLevel();
    }

    function gameOver() {
        gameState = 'gameover';
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('score-display').innerText = `FINAL SCORE: ${totalScore}`;
        noiseLevel = 50;
        if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
    }

    function spawnNextBlock() {
        let b = new Block(width / 2, height - 80, nextBlockType);
        blocks.push(b);
        activeBlock = b;
        nextBlockType = Math.floor(Math.random() * 3);
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 15; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 600,
                vy: (Math.random() - 0.5) * 600,
                radius: Math.random() * 3 + 1,
                color: color,
                life: 0.5 + Math.random() * 0.5,
                maxLife: 1
            });
        }
    }

    function resolveCollision(b, a) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const dist = Math.hypot(dx, dy);
        const minDist = b.radius + a.radius;
        
        if (dist < minDist && dist > 0) {
            const overlap = minDist - dist;
            const nx = dx / dist;
            const ny = dy / dist;
            
            const totalMass = b.mass + a.mass;
            const m1Ratio = a.mass / totalMass;
            const m2Ratio = b.mass / totalMass;
            
            b.x -= nx * overlap * m1Ratio;
            b.y -= ny * overlap * m1Ratio;
            a.x += nx * overlap * m2Ratio;
            a.y += ny * overlap * m2Ratio;
            
            const kx = b.vx - a.vx;
            const ky = b.vy - a.vy;
            const p = 2.0 * (nx * kx + ny * ky) / totalMass;
            const restitution = 0.9;
            
            b.vx -= p * a.mass * restitution * nx;
            b.vy -= p * a.mass * restitution * ny;
            a.vx += p * b.mass * restitution * nx;
            a.vy += p * b.mass * restitution * ny;
            
            spawnParticles(b.x + nx * b.radius, b.y + ny * b.radius, colors.text);
            if (navigator.vibrate) navigator.vibrate(5);
        }
    }

    function getBinRect(i, w) {
        const gap = Math.min(20, (level - 1) * 5); 
        const availableWidth = w - gap * 4;
        const binWidth = availableWidth / 3;
        const x = gap + i * (binWidth + gap);
        return { x, y: 10, w: binWidth, h: 80 };
    }

    function update(dt) {
        if (gameState !== 'playing') return;
        
        timeRemaining -= dt;
        if (timeRemaining <= 0) {
            if (quality >= targetQuality) {
                levelUp();
            } else {
                gameOver();
            }
            return;
        }
        
        if (quality >= targetQuality) {
            levelUp();
            return;
        }

        artifacts.forEach(a => {
            a.x += a.vx * dt;
            a.y += a.vy * dt;
            if (a.x - a.radius < 0) { a.x = a.radius; a.vx *= -1; }
            if (a.x + a.radius > width) { a.x = width - a.radius; a.vx *= -1; }
            if (a.y - a.radius < 90) { a.y = 90 + a.radius; a.vy *= -1; }
            if (a.y + a.radius > height - 150) { a.y = height - 150 - a.radius; a.vy *= -1; }
        });

        blocks.forEach(b => {
            if (b.state === 'spawning') {
                b.scale = Math.min(1, b.scale + dt * 5);
                if (b.scale >= 1) b.state = 'ready';
            }
            if (b.state === 'flying') {
                b.flightTime += dt;
                if (b.flightTime > 5) {
                    b.state = 'dying';
                    noiseLevel += 10;
                    timeRemaining -= 2;
                }
                
                b.trail.unshift({x: b.x, y: b.y});
                if (b.trail.length > 8) b.trail.pop();
                
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.angle += b.vAngle * dt;
                
                if (b.x - b.radius < 0) { b.x = b.radius; b.vx *= -0.8; }
                if (b.x + b.radius > width) { b.x = width - b.radius; b.vx *= -0.8; }
                if (b.y + b.radius > height) { b.y = height - b.radius; b.vy *= -0.8; }
                
                artifacts.forEach(a => resolveCollision(b, a));
                
                if (b.y < 90) {
                    let hitBin = -1;
                    for (let i = 0; i < 3; i++) {
                        const rect = getBinRect(i, width);
                        if (b.x >= rect.x && b.x <= rect.x + rect.w) {
                            hitBin = i;
                            break;
                        }
                    }
                    
                    if (hitBin === -1) {
                        noiseLevel += 15;
                        spawnParticles(b.x, b.y, colors.error);
                        if (navigator.vibrate) navigator.vibrate([20, 20, 20]);
                        b.state = 'dying';
                        timeRemaining -= 2;
                        floatingTexts.push({ text: "-2s", x: b.x, y: b.y, life: 1, maxLife: 1, color: colors.error });
                    } else if (b.type === hitBin) {
                        quality++;
                        totalScore += 10;
                        spawnParticles(b.x, b.y, colors.wire[b.type]);
                        if (navigator.vibrate) navigator.vibrate(10);
                        b.state = 'dying';
                        floatingTexts.push({ text: "+1", x: b.x, y: b.y, life: 1, maxLife: 1, color: colors.wire[b.type] });
                    } else {
                        noiseLevel += 15;
                        spawnParticles(b.x, b.y, colors.error);
                        if (navigator.vibrate) navigator.vibrate([20, 20, 20]);
                        b.state = 'dying';
                        timeRemaining -= 2;
                        floatingTexts.push({ text: "ERROR", x: b.x, y: b.y, life: 1, maxLife: 1, color: colors.error });
                    }
                }
            }
        });

        blocks = blocks.filter(b => b.state !== 'dying');

        particles.forEach(p => {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
        });
        particles = particles.filter(p => p.life > 0);

        noiseLevel *= 0.9;
        if (noiseLevel < 0.1) noiseLevel = 0;
    }

    function drawGrid(w, h) {
        ctx.strokeStyle = colors.gray;
        ctx.globalAlpha = 0.1;
        ctx.lineWidth = 1;
        ctx.beginPath();
        const size = 40;
        for (let x = (timeRemaining*10)%size; x < w; x += size) {
            ctx.moveTo(x, 0); ctx.lineTo(x, h);
        }
        for (let y = (timeRemaining*10)%size; y < h; y += size) {
            ctx.moveTo(0, y); ctx.lineTo(w, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    }

    function drawBins(w) {
        for (let i = 0; i < 3; i++) {
            const rect = getBinRect(i, w);
            ctx.strokeStyle = colors.wire[i];
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.rect(rect.x, rect.y, rect.w, rect.h);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.save();
            ctx.translate(rect.x + rect.w / 2, rect.y + rect.h / 2);
            ctx.globalAlpha = 0.2 + (Math.sin(performance.now()*0.005 + i) * 0.1);
            ctx.lineWidth = 3;
            ctx.beginPath();
            if (i === 0) {
                ctx.arc(0, 0, 18, 0, Math.PI * 2);
            } else if (i === 1) {
                ctx.moveTo(0, -18); ctx.lineTo(18, 18); ctx.lineTo(-18, 18); ctx.closePath();
            } else if (i === 2) {
                ctx.rect(-18, -18, 36, 36);
            }
            ctx.stroke();
            ctx.restore();
        }
    }

    function draw(time) {
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, width, height);
        
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        drawGrid(width, height);
        
        ctx.save();
        if (noiseLevel > 0) {
            const sx = (Math.random() - 0.5) * noiseLevel;
            const sy = (Math.random() - 0.5) * noiseLevel;
            ctx.translate(sx, sy);
        }
        
        drawBins(width);
        
        // Progress bar
        ctx.fillStyle = colors.gray;
        ctx.fillRect(0, 0, width, 10);
        const ratio = Math.max(0, 1 - (timeRemaining / maxTime));
        ctx.fillStyle = timeRemaining < 5 ? colors.error : colors.text;
        ctx.fillRect(0, 0, width * ratio, 10);
        
        if (timeRemaining < 5 && Math.floor(timeRemaining * 10) % 2 === 0) {
            ctx.fillStyle = colors.error;
            ctx.globalAlpha = 0.3;
            ctx.fillRect(0, 0, width, 10);
            ctx.globalAlpha = 1.0;
        }
        
        if (gameState === 'start') {
            ctx.fillStyle = colors.text;
            ctx.globalAlpha = 0.05;
            ctx.font = "bold 60px ui-monospace, monospace";
            ctx.textAlign = "center";
            ctx.fillText("JXL", width/2, height/2 - 30);
            ctx.fillText("LAB", width/2, height/2 + 30);
            ctx.globalAlpha = 1.0;
            ctx.restore();
            return;
        }

        ctx.fillStyle = colors.text;
        ctx.font = "bold 16px ui-monospace, 'SFMono-Regular', Menlo, monospace";
        ctx.textAlign = "left";
        ctx.fillText(`QLTY: ${quality}/${targetQuality}`, 10, 115);
        ctx.textAlign = "right";
        ctx.fillText(`LVL: ${level}`, width - 10, 115);
        ctx.textAlign = "center";
        ctx.fillText(totalScore.toString().padStart(5, '0'), width / 2, 115);

        ctx.fillStyle = colors.text;
        ctx.globalAlpha = 0.5;
        ctx.font = "12px ui-monospace, 'SFMono-Regular', Menlo, monospace";
        ctx.textAlign = "center";
        ctx.fillText("NEXT", width / 2, height - 35);
        ctx.globalAlpha = 1.0;
        
        ctx.save();
        ctx.translate(width / 2, height - 20);
        ctx.scale(0.5, 0.5);
        ctx.strokeStyle = colors.wire[nextBlockType];
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (nextBlockType === 0) ctx.arc(0, 0, 12, 0, Math.PI * 2);
        else if (nextBlockType === 1) { ctx.moveTo(0, -12); ctx.lineTo(12, 12); ctx.lineTo(-12, 12); ctx.closePath(); }
        else if (nextBlockType === 2) ctx.rect(-12, -12, 24, 24);
        ctx.stroke();
        ctx.restore();

        if (isDragging && activeBlock) {
            let dx = dragCurrentX - dragStartX;
            let dy = dragCurrentY - dragStartY;
            ctx.strokeStyle = colors.gray;
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(activeBlock.x, activeBlock.y);
            ctx.lineTo(activeBlock.x + dx * 2, activeBlock.y + dy * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        artifacts.forEach(a => {
            ctx.save();
            ctx.translate(a.x, a.y);
            const pulse = 1 + Math.sin(time * 0.01 + a.x) * 0.1;
            ctx.scale(pulse, pulse);
            ctx.strokeStyle = colors.artifactSafe;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, a.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
                const a1 = Math.random() * Math.PI * 2;
                const a2 = Math.random() * Math.PI * 2;
                ctx.moveTo(Math.cos(a1) * a.radius, Math.sin(a1) * a.radius);
                ctx.lineTo(Math.cos(a2) * a.radius, Math.sin(a2) * a.radius);
            }
            ctx.stroke();
            ctx.restore();
        });

        blocks.forEach(b => {
            if (b.trail.length > 0) {
                ctx.beginPath();
                ctx.moveTo(b.trail[0].x, b.trail[0].y);
                for (let i = 1; i < b.trail.length; i++) ctx.lineTo(b.trail[i].x, b.trail[i].y);
                ctx.strokeStyle = colors.wire[b.type];
                ctx.globalAlpha = 0.4;
                ctx.lineWidth = b.radius * 0.8;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }
            
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.angle);
            ctx.scale(b.scale, b.scale);
            ctx.strokeStyle = colors.wire[b.type];
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.rect(-b.radius, -b.radius, b.radius * 2, b.radius * 2);
            ctx.stroke();
            
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (b.type === 0) ctx.arc(0, 0, b.radius * 0.5, 0, Math.PI * 2);
            else if (b.type === 1) { ctx.moveTo(0, -b.radius * 0.5); ctx.lineTo(b.radius * 0.5, b.radius * 0.5); ctx.lineTo(-b.radius * 0.5, b.radius * 0.5); ctx.closePath(); }
            else if (b.type === 2) ctx.rect(-b.radius * 0.5, -b.radius * 0.5, b.radius, b.radius);
            ctx.stroke();
            ctx.restore();
        });

        if (noiseLevel > 0) {
            ctx.strokeStyle = colors.text;
            ctx.globalAlpha = Math.min(0.3, noiseLevel / 50);
            ctx.beginPath();
            for (let i = 0; i < noiseLevel; i++) {
                ctx.moveTo(Math.random() * width, Math.random() * height);
                ctx.lineTo(Math.random() * width, Math.random() * height);
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        floatingTexts.forEach(ft => {
            ctx.fillStyle = ft.color || colors.text;
            ctx.globalAlpha = ft.life / ft.maxLife;
            ctx.font = "bold 24px ui-monospace, 'SFMono-Regular', Menlo, monospace";
            ctx.textAlign = "center";
            ctx.fillText(ft.text, ft.x, ft.y - (1 - ft.life/ft.maxLife) * 40);
            ctx.globalAlpha = 1.0;
        });

        ctx.restore();
    }

    function loop(time) {
        requestAnimationFrame(loop);
        const dt = Math.min((time - lastTime) / 1000, 0.1);
        lastTime = time;
        
        update(dt);
        
        floatingTexts.forEach(ft => ft.life -= dt);
        floatingTexts = floatingTexts.filter(ft => ft.life > 0);
        
        ctx.save();
        ctx.scale(dpr, dpr);
        draw(time);
        ctx.restore();
    }

    window.onload = init;
})();
</script>
</body>
</html>
