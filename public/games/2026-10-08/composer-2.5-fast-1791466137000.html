<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBS ROUTER — keep the line alive</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c0a;
    --fg: #33ff66;
    --fg-dim: #1a9933;
    --fg-bright: #66ff99;
    --panel: rgba(10, 20, 10, 0.92);
    --scanline: rgba(0, 0, 0, 0.12);
    --glow: rgba(51, 255, 102, 0.35);
    --danger: #ff4444;
    --warn: #ffaa00;
    --btn-bg: #0d1a0d;
    --btn-border: #33ff66;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e8ebe4;
      --fg: #1a6633;
      --fg-dim: #2d8044;
      --fg-bright: #0d4d1f;
      --panel: rgba(232, 235, 228, 0.94);
      --scanline: rgba(0, 0, 0, 0.04);
      --glow: rgba(26, 102, 51, 0.2);
      --danger: #cc2222;
      --warn: #cc7700;
      --btn-bg: #d4ddd4;
      --btn-border: #1a6633;
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.5rem;
    padding: 0.6rem 0.8rem;
    font-size: clamp(0.65rem, 2.8vw, 0.8rem);
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--fg-dim);
    z-index: 2;
  }
  #hud span { opacity: 0.85; }
  #hud .val { color: var(--fg-bright); }
  #canvas-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #scanlines {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      var(--scanline) 2px,
      var(--scanline) 4px
    );
    z-index: 1;
  }
  #fragment-bar {
    flex: 0 0 auto;
    padding: 0.45rem 0.8rem;
    font-size: clamp(0.6rem, 2.5vw, 0.75rem);
    border-top: 1px solid var(--fg-dim);
    min-height: 2.2rem;
    color: var(--fg-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 2;
  }
  #fragment-bar .lit { color: var(--fg-bright); }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  .overlay.visible {
    opacity: 1;
    visibility: visible;
  }
  .overlay h1 {
    font-size: clamp(1.1rem, 5vw, 1.6rem);
    letter-spacing: 0.15em;
    margin-bottom: 0.4rem;
    text-shadow: 0 0 12px var(--glow);
  }
  .overlay p {
    font-size: clamp(0.65rem, 3vw, 0.85rem);
    color: var(--fg-dim);
    max-width: 85%;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 1.2rem;
  }
  .overlay .stats {
    font-size: clamp(0.7rem, 3vw, 0.9rem);
    margin-bottom: 1rem;
    text-align: center;
    line-height: 1.6;
  }
  .smoke-btn {
    pointer-events: auto;
    min-width: 44px;
    min-height: 44px;
    padding: 0.75rem 2rem;
    font-family: inherit;
    font-size: clamp(0.75rem, 3.5vw, 0.95rem);
    letter-spacing: 0.12em;
    background: var(--btn-bg);
    color: var(--fg-bright);
    border: 2px solid var(--btn-border);
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 16px var(--glow);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .smoke-btn:active {
    transform: scale(0.96);
    box-shadow: 0 0 8px var(--glow);
  }
  .hint {
    margin-top: 1rem;
    font-size: clamp(0.55rem, 2.4vw, 0.7rem);
    color: var(--fg-dim);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><span>SCORE </span><span class="val" id="score">0</span></div>
    <div><span>BAUD </span><span class="val" id="baud">300</span></div>
    <div><span>LINE </span><span class="val" id="conn">100%</span></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game"></canvas>
    <div id="scanlines"></div>
    <div id="title-overlay" class="overlay visible">
      <h1>BBS ROUTER</h1>
      <p>Match your router to each packet's glyph before it hits the line.<br>Swipe ← → to switch lanes. Double-tap glitched packets to purge.</p>
      <button class="smoke-btn" data-smoke="start" id="btn-start">CONNECT</button>
      <p class="hint">← → or swipe &nbsp;·&nbsp; double-tap glitches</p>
    </div>
    <div id="gameover-overlay" class="overlay">
      <h1>LINE DEAD</h1>
      <div class="stats" id="go-stats"></div>
      <button class="smoke-btn" data-smoke="restart" id="btn-restart">REDIAL</button>
    </div>
  </div>
  <div id="fragment-bar"><span id="fragment-text">awaiting packets…</span></div>
</div>
<script>
(function () {
  'use strict';

  var CHANNELS = [
    { id: 0, name: 'TECH',  glyph: '#', color: '#33ff66' },
    { id: 1, name: 'ART',   glyph: '*', color: '#44ddaa' },
    { id: 2, name: 'POET',  glyph: '~', color: '#88cc44' },
    { id: 3, name: 'CHAT',  glyph: '@', color: '#55ff88' }
  ];

  var FRAGMENTS = [
    'imagine 2026 — what threads will we leave on the board?',
    'shipping by sunrise, one packet at a time',
    'the invisible city maps itself in ASCII tonight',
    'the line breaks where the autumn light falls',
    'thirteen degrees at dusk, connection holding',
    'telnet still flickers. so do we.',
    'no commits this week. just routing dreams.',
    'dial-up never dies, it only waits for you',
    'six hours, one prompt — cities bloom in green',
    'bulletin boards remember what the web forgot',
    'a quiet week. the board hums anyway.',
    'agents spin up from shortcuts at dawn'
  ];

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var baudEl = document.getElementById('baud');
  var connEl = document.getElementById('conn');
  var fragEl = document.getElementById('fragment-text');
  var titleOverlay = document.getElementById('title-overlay');
  var goOverlay = document.getElementById('gameover-overlay');
  var goStats = document.getElementById('go-stats');
  var btnStart = document.getElementById('btn-start');
  var btnRestart = document.getElementById('btn-restart');

  var W = 0, H = 0, laneW = 0;
  var state = 'title';
  var routerLane = 1;
  var targetLane = 1;
  var laneAnim = 0;
  var score = 0;
  var combo = 0;
  var connection = 100;
  var gameTime = 0;
  var spawnTimer = 0;
  var baud = 300;
  var packets = [];
  var particles = [];
  var floatTexts = [];
  var shake = 0;
  var hitPause = 0;
  var flicker = 0;
  var fragmentIdx = 0;
  var revealed = '';
  var routes = 0;
  var lastTapTime = 0;
  var lastTapLane = -1;
  var audioCtx = null;

  var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

  function getCSS(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { /* noop */ }
  }

  function beep(freq, dur, vol) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* noop */ }
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* noop */ }
  }

  function resize() {
    var wrap = document.getElementById('canvas-wrap');
    if (!wrap) return;
    W = wrap.clientWidth || window.innerWidth;
    H = wrap.clientHeight || Math.max(200, window.innerHeight * 0.6);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    laneW = W / 4;
  }

  function resetGame() {
    routerLane = 1;
    targetLane = 1;
    laneAnim = 1;
    score = 0;
    combo = 0;
    connection = 100;
    gameTime = 0;
    spawnTimer = 0.8;
    baud = 300;
    packets = [];
    particles = [];
    floatTexts = [];
    shake = 0;
    hitPause = 0;
    fragmentIdx = 0;
    revealed = '';
    routes = 0;
    lastTapTime = 0;
    lastTapLane = -1;
    updateHUD();
    fragEl.textContent = 'routing packets…';
    fragEl.className = '';
  }

  function updateHUD() {
    scoreEl.textContent = String(score);
    baudEl.textContent = String(baud);
    connEl.textContent = Math.max(0, Math.ceil(connection)) + '%';
    connEl.style.color = connection < 30 ? 'var(--danger)' : '';
  }

  function startGame() {
    initAudio();
    resetGame();
    state = 'playing';
    titleOverlay.classList.remove('visible');
    goOverlay.classList.remove('visible');
    beep(440, 0.08, 0.05);
    beep(660, 0.12, 0.04);
  }

  function endGame(survived) {
    state = 'gameover';
    var title = goOverlay.querySelector('h1');
    if (title) title.textContent = survived ? 'LINE HELD' : 'LINE DEAD';
    goStats.innerHTML =
      'SCORE: ' + score + '<br>' +
      'ROUTES: ' + routes + '<br>' +
      'PEAK BAUD: ' + baud + '<br>' +
      (revealed ? 'LAST FRAGMENT:<br>"' + revealed + '"' : '');
    goOverlay.classList.add('visible');
    beep(survived ? 660 : 180, survived ? 0.15 : 0.3, 0.06);
    vibrate(80);
  }

  function revealFragment() {
    if (fragmentIdx >= FRAGMENTS.length) fragmentIdx = 0;
    revealed = FRAGMENTS[fragmentIdx++];
    fragEl.textContent = '> ' + revealed;
    fragEl.className = 'lit';
  }

  function spawnPacket() {
    var lane = Math.floor(Math.random() * 4);
    var type = Math.floor(Math.random() * 4);
    var corruptChance = Math.min(0.45, 0.08 + gameTime * 0.008);
    var corrupted = Math.random() < corruptChance;
    var speed = 80 + gameTime * 12 + (baud - 300) * 0.04;
    packets.push({
      lane: lane,
      type: type,
      y: -20,
      speed: speed,
      corrupted: corrupted,
      purged: false,
      resolved: false,
      wobble: Math.random() * Math.PI * 2
    });
  }

  function addParticles(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var angle = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * sp,
        vy: Math.sin(angle) * sp,
        life: 0.4 + Math.random() * 0.3,
        maxLife: 0.7,
        char: String.fromCharCode(33 + Math.floor(Math.random() * 60)),
        color: color
      });
    }
  }

  function addFloatText(x, y, text, color) {
    floatTexts.push({ x: x, y: y, text: text, life: 0.8, color: color || getCSS('--fg-bright') });
  }

  function moveLane(dir) {
    if (state !== 'playing') return;
    var next = targetLane + dir;
    if (next < 0 || next > 3) return;
    targetLane = next;
    laneAnim = 0;
    beep(320 + targetLane * 40, 0.04, 0.03);
  }

  function tryPurge(lane) {
    if (state !== 'playing') return false;
    var routerY = H - laneW * 0.55;
    for (var i = packets.length - 1; i >= 0; i--) {
      var p = packets[i];
      if (p.resolved || p.purged) continue;
      if (!p.corrupted) continue;
      if (p.lane !== lane) continue;
      if (p.y < routerY - laneW * 0.8 || p.y > routerY + laneW * 0.3) continue;
      p.purged = true;
      p.resolved = true;
      score += 5;
      combo++;
      addParticles(lane * laneW + laneW * 0.5, p.y, '#ff4444', 10);
      addFloatText(lane * laneW + laneW * 0.5, p.y - 10, 'PURGED', '#ff4444');
      beep(880, 0.06, 0.05);
      vibrate(20);
      hitPause = 0.04;
      updateHUD();
      return true;
    }
    return false;
  }

  function handleDoubleTap(lane) {
    var now = performance.now();
    if (now - lastTapTime < 350 && lastTapLane === lane) {
      tryPurge(lane);
      lastTapTime = 0;
      lastTapLane = -1;
    } else {
      lastTapTime = now;
      lastTapLane = lane;
    }
  }

  function resolvePacket(p) {
    if (p.resolved) return;
    p.resolved = true;
    var cx = p.lane * laneW + laneW * 0.5;

    if (p.corrupted && !p.purged) {
      connection -= 18;
      combo = 0;
      shake = 8;
      flicker = 0.15;
      addFloatText(cx, p.y, 'CORRUPT!', '#ff4444');
      addParticles(cx, p.y, '#ff4444', 8);
      beep(120, 0.15, 0.07);
      vibrate(60);
      return;
    }

    if (p.purged) return;

    if (routerLane === p.type) {
      combo++;
      var pts = 10 + Math.min(combo, 20) * 2;
      score += pts;
      routes++;
      connection = Math.min(100, connection + 4);
      revealFragment();
      hitPause = 0.05;
      addParticles(cx, p.y, CHANNELS[p.type].color, 12);
      addFloatText(cx, p.y - 14, '+' + pts, getCSS('--fg-bright'));
      beep(520 + combo * 20, 0.07, 0.05);
      if (combo % 5 === 0) vibrate(15);
    } else {
      connection -= 9;
      combo = 0;
      shake = 6;
      addFloatText(cx, p.y, 'WRONG!', '#ffaa00');
      beep(200, 0.1, 0.05);
      vibrate(40);
    }
    updateHUD();
  }

  function update(dt) {
    if (state !== 'playing') return;
    if (hitPause > 0) { hitPause -= dt; return; }

    gameTime += dt;
    connection -= (1.35 + gameTime * 0.038) * dt;
    baud = Math.min(57600, 300 + Math.floor(gameTime * 180 + score * 2));
    spawnTimer -= dt;

    var interval = Math.max(0.38, 1.5 - gameTime * 0.032);
    if (gameTime < 6) interval = Math.max(interval, 1.15);
    if (spawnTimer <= 0) {
      spawnPacket();
      if (gameTime > 12 && Math.random() < 0.28) spawnPacket();
      if (gameTime > 25 && Math.random() < 0.22) spawnPacket();
      spawnTimer = interval;
    }

    if (laneAnim < 1) {
      laneAnim = Math.min(1, laneAnim + dt * 10);
      routerLane = routerLane + (targetLane - routerLane) * Math.min(1, dt * 14);
      if (Math.abs(routerLane - targetLane) < 0.01) routerLane = targetLane;
    }

    var routerY = H - laneW * 0.55;
    for (var i = packets.length - 1; i >= 0; i--) {
      var p = packets[i];
      if (!p.resolved) {
        p.y += p.speed * dt;
        p.wobble += dt * 6;
        if (p.y >= routerY) resolvePacket(p);
      }
      if (p.resolved && p.y > H + 30) packets.splice(i, 1);
    }

    for (var j = particles.length - 1; j >= 0; j--) {
      var pt = particles[j];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 200 * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(j, 1);
    }

    for (var k = floatTexts.length - 1; k >= 0; k--) {
      floatTexts[k].y -= 30 * dt;
      floatTexts[k].life -= dt;
      if (floatTexts[k].life <= 0) floatTexts.splice(k, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 30);
    if (flicker > 0) flicker = Math.max(0, flicker - dt);

    updateHUD();
    if (connection <= 0) endGame(false);
    if (gameTime >= 58) endGame(connection > 0);
  }

  function draw() {
    var bg = getCSS('--bg');
    var fg = getCSS('--fg');
    var fgDim = getCSS('--fg-dim');
    var fgBright = getCSS('--fg-bright');

    ctx.save();
    var sx = (Math.random() - 0.5) * shake * 2;
    var sy = (Math.random() - 0.5) * shake * 2;
    ctx.translate(sx, sy);

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    if (flicker > 0) {
      ctx.fillStyle = isDark ? 'rgba(51,255,102,0.06)' : 'rgba(26,102,51,0.08)';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.strokeStyle = fgDim;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    for (var l = 1; l < 4; l++) {
      ctx.beginPath();
      ctx.moveTo(l * laneW, 0);
      ctx.lineTo(l * laneW, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    var labelY = laneW * 0.35;
    ctx.font = '600 ' + Math.floor(laneW * 0.18) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var c = 0; c < 4; c++) {
      ctx.fillStyle = fgDim;
      ctx.fillText(CHANNELS[c].name, c * laneW + laneW * 0.5, labelY);
      ctx.fillStyle = CHANNELS[c].color;
      ctx.fillText(CHANNELS[c].glyph, c * laneW + laneW * 0.5, labelY + laneW * 0.22);
    }

    for (var i = 0; i < packets.length; i++) {
      var p = packets[i];
      if (p.resolved && p.purged) continue;
      var px = p.lane * laneW + laneW * 0.5;
      var py = p.y;
      var sz = laneW * 0.32;
      if (p.corrupted && !p.purged) {
        var glitch = Math.sin(p.wobble * 3) * 3;
        ctx.fillStyle = isDark ? '#ff3333' : '#cc2222';
        ctx.globalAlpha = 0.85 + Math.sin(p.wobble * 8) * 0.15;
        ctx.fillRect(px - sz * 0.5 + glitch, py - sz * 0.5, sz, sz);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + Math.floor(sz * 0.5) + 'px monospace';
        ctx.fillText('!', px + glitch, py);
      } else if (!p.resolved) {
        var reroute = p.lane !== p.type;
        ctx.fillStyle = isDark ? 'rgba(20,40,20,0.9)' : 'rgba(200,220,200,0.9)';
        ctx.strokeStyle = CHANNELS[p.type].color;
        ctx.lineWidth = reroute ? 3 : 2;
        if (reroute) {
          ctx.setLineDash([3, 3]);
        }
        ctx.fillRect(px - sz * 0.5, py - sz * 0.5, sz, sz);
        ctx.strokeRect(px - sz * 0.5, py - sz * 0.5, sz, sz);
        ctx.setLineDash([]);
        ctx.fillStyle = CHANNELS[p.type].color;
        ctx.font = 'bold ' + Math.floor(sz * 0.55) + 'px monospace';
        ctx.fillText(CHANNELS[p.type].glyph, px, py);
        if (reroute) {
          var tx = p.type * laneW + laneW * 0.5;
          ctx.strokeStyle = fgDim;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(px, py + sz * 0.4);
          ctx.lineTo(tx, py + sz * 0.9);
          ctx.stroke();
        }
      }
    }

    var rx = routerLane * laneW + laneW * 0.5;
    var ry = H - laneW * 0.55;
    var rw = laneW * 0.75;
    var rh = laneW * 0.28;
    ctx.fillStyle = isDark ? 'rgba(51,255,102,0.15)' : 'rgba(26,102,51,0.12)';
    ctx.strokeStyle = fgBright;
    ctx.lineWidth = 2;
    ctx.shadowColor = getCSS('--glow');
    ctx.shadowBlur = 12;
    ctx.fillRect(rx - rw * 0.5, ry - rh * 0.5, rw, rh);
    ctx.strokeRect(rx - rw * 0.5, ry - rh * 0.5, rw, rh);
    ctx.shadowBlur = 0;
    ctx.fillStyle = fgBright;
    ctx.font = '600 ' + Math.floor(rh * 0.55) + 'px monospace';
    ctx.fillText('[ROUTER]', rx, ry);

    var connW = W * (connection / 100);
    ctx.fillStyle = fgDim;
    ctx.fillRect(0, H - 4, W, 4);
    var connColor = connection > 50 ? fg : (connection > 25 ? '#ffaa00' : '#ff4444');
    ctx.fillStyle = connColor;
    ctx.fillRect(0, H - 4, connW, 4);

    for (var j = 0; j < particles.length; j++) {
      var pt = particles[j];
      ctx.globalAlpha = pt.life / pt.maxLife;
      ctx.fillStyle = pt.color;
      ctx.font = Math.floor(10 + pt.life * 8) + 'px monospace';
      ctx.fillText(pt.char, pt.x, pt.y);
    }
    ctx.globalAlpha = 1;

    for (var k = 0; k < floatTexts.length; k++) {
      var ft = floatTexts[k];
      ctx.globalAlpha = Math.min(1, ft.life * 2);
      ctx.fillStyle = ft.color;
      ctx.font = 'bold ' + Math.floor(laneW * 0.16) + 'px monospace';
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;

    if (state === 'playing' && combo >= 3) {
      ctx.fillStyle = fgBright;
      ctx.font = Math.floor(laneW * 0.14) + 'px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('x' + combo + ' COMBO', W - 8, laneW * 0.5);
      ctx.textAlign = 'center';
    }

    ctx.restore();
  }

  var touchStartX = 0;
  var touchStartY = 0;
  var touchMoved = false;

  function laneFromX(x) {
    return Math.max(0, Math.min(3, Math.floor(x / laneW)));
  }

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (state !== 'playing') return;
    var t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchMoved = false;
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (state !== 'playing') return;
    touchMoved = true;
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (state !== 'playing') return;
    var rect = canvas.getBoundingClientRect();
    var endX = e.changedTouches[0].clientX - rect.left;
    var endY = e.changedTouches[0].clientY - rect.top;
    var dx = endX - (touchStartX - rect.left);
    var dy = endY - (touchStartY - rect.top);

    if (!touchMoved || (Math.abs(dx) < 20 && Math.abs(dy) < 20)) {
      handleDoubleTap(laneFromX(endX));
      return;
    }
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 24) {
      moveLane(dx > 0 ? 1 : -1);
    }
  }, { passive: false });

  canvas.addEventListener('mousedown', function (e) {
    if (state !== 'playing') return;
    var rect = canvas.getBoundingClientRect();
    touchStartX = e.clientX - rect.left;
    touchStartY = e.clientY - rect.top;
    touchMoved = false;
  });

  canvas.addEventListener('mousemove', function (e) {
    if (e.buttons !== 1 || state !== 'playing') return;
    touchMoved = true;
  });

  canvas.addEventListener('mouseup', function (e) {
    if (state !== 'playing') return;
    var rect = canvas.getBoundingClientRect();
    var endX = e.clientX - rect.left;
    var endY = e.clientY - rect.top;
    var dx = endX - touchStartX;
    var dy = endY - touchStartY;
    if (!touchMoved || (Math.abs(dx) < 10 && Math.abs(dy) < 10)) {
      handleDoubleTap(laneFromX(endX));
      return;
    }
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
      moveLane(dx > 0 ? 1 : -1);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (state === 'playing') {
      if (e.key === 'ArrowLeft') { moveLane(-1); e.preventDefault(); }
      if (e.key === 'ArrowRight') { moveLane(1); e.preventDefault(); }
      if (e.key === ' ' || e.key === 'Enter') {
        tryPurge(Math.round(routerLane));
        e.preventDefault();
      }
    }
  });

  btnStart.addEventListener('click', function () { startGame(); });
  btnRestart.addEventListener('click', function () { startGame(); });

  var lastTime = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  window.addEventListener('resize', resize);
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (ev) {
      isDark = ev.matches;
    });
  }

  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
