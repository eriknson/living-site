<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ship It</title>
  <style>
    :root {
      --bg-color: #0a0f1a;
      --text-color: #ffffff;
      --btn-bg: #e63946;
      --btn-color: #ffffff;
      --grid-color: rgba(255,255,255,0.05);
      --task-color: #4cc9f0;
      --orb-color: #ffffff;
      --dawn-1: #e63946;
      --dawn-2: #f4a261;
      --dawn-3: #e9c46a;
      --shadow-color: rgba(0,0,0,0.5);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0a0f1a;
        --text-color: #ffffff;
        --btn-bg: #e63946;
        --btn-color: #ffffff;
        --grid-color: rgba(255,255,255,0.05);
        --task-color: #4cc9f0;
        --orb-color: #ffffff;
        --dawn-1: #e63946;
        --dawn-2: #f4a261;
        --dawn-3: #e9c46a;
        --shadow-color: rgba(0,0,0,0.5);
      }
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f8f9fa;
        --text-color: #003049;
        --btn-bg: #ff6b6b;
        --btn-color: #ffffff;
        --grid-color: rgba(0,0,0,0.05);
        --task-color: #003049;
        --orb-color: #000000;
        --dawn-1: #ff6b6b;
        --dawn-2: #feca57;
        --dawn-3: #ffdd59;
        --shadow-color: rgba(0,48,73,0.1);
      }
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    * {
      box-sizing: border-box;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .screen {
      text-align: center;
      background: var(--bg-color);
      padding: 40px 60px;
      border: 1px solid var(--grid-color);
      box-shadow: 20px 20px 0px var(--shadow-color);
      max-width: 90%;
      display: none;
    }
    #title-screen {
      display: block;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    p {
      margin: 0 0 30px;
      opacity: 0.8;
      font-size: 1.1rem;
      line-height: 1.4;
    }
    .btn {
      pointer-events: auto;
      padding: 15px 40px;
      font-size: 1.2rem;
      border-radius: 0;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-color);
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      transition: transform 0.1s, filter 0.1s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:active {
      transform: scale(0.95);
      filter: brightness(0.9);
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: none;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
      font-size: 1.2rem;
      font-weight: bold;
      text-shadow: 2px 2px 0px var(--shadow-color);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  
  <div id="hud">
    <div>SHIPPED: <span id="score-display">0</span></div>
    <div id="lives-display">♥♥♥</div>
  </div>

  <div id="ui-layer">
    <div id="title-screen" class="screen">
      <h1>Ship It</h1>
      <p>Swipe up from bottom to ship tasks before dawn.</p>
      <button data-smoke="start" class="btn">START DAWN</button>
    </div>

    <div id="game-over-screen" class="screen">
      <h1>DAWN ARRIVED</h1>
      <p>Features shipped: <span id="final-score">0</span></p>
      <button data-smoke="restart" class="btn">RESTART</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d', { alpha: false });
      
      let W, H;
      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
      }
      window.addEventListener('resize', resize);
      resize();

      let colors = {};
      function extractColors() {
        const root = getComputedStyle(document.documentElement);
        colors.bg = root.getPropertyValue('--bg-color').trim() || '#0a0f1a';
        colors.grid = root.getPropertyValue('--grid-color').trim() || 'rgba(255,255,255,0.05)';
        colors.task = root.getPropertyValue('--task-color').trim() || '#4cc9f0';
        colors.orb = root.getPropertyValue('--orb-color').trim() || '#ffffff';
        colors.dawn1 = root.getPropertyValue('--dawn-1').trim() || '#e63946';
        colors.dawn2 = root.getPropertyValue('--dawn-2').trim() || '#f4a261';
        colors.dawn3 = root.getPropertyValue('--dawn-3').trim() || '#e9c46a';
      }
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', extractColors);
      extractColors();

      let gameState = 'MENU';
      let score = 0;
      let lives = 3;
      let dawnX = W;
      let gravity = 0;
      let baseDawnSpeed = 0;
      let currentDawnSpeed = 0;
      let tasks = [];
      let orbs = [];
      let particles = [];
      let frameCount = 0;
      let hitPause = 0;
      let shakeTime = 0;
      let menuTime = 0;

      let isDragging = false;
      let touchStart = {x: 0, y: 0};
      let touchCurrent = {x: 0, y: 0};
      let lastInput = 'touch';
      let aimAngle = -Math.PI / 2;
      let keys = {};

      let audioCtx;
      function initAudio() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (typeof AudioContext !== 'undefined' && !audioCtx) {
            audioCtx = new AudioContext();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        } catch(e) {}
      }

      function playSound(type) {
        if (!audioCtx) return;
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          let now = audioCtx.currentTime;
          if (type === 'shoot') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1600, now + 0.1);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
          }
        } catch(e) {}
      }

      function vibrate(ms) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch(e) {}
      }

      function updateHUD() {
        document.getElementById('score-display').innerText = score;
        document.getElementById('lives-display').innerText = '♥'.repeat(Math.max(0, lives));
      }

      function resetGameParams() {
        gravity = Math.max(H, W) * 0.0006;
        baseDawnSpeed = W * 0.001;
        currentDawnSpeed = baseDawnSpeed;
        score = 0;
        lives = 3;
        dawnX = W;
        tasks = [];
        orbs = [];
        particles = [];
        frameCount = 0;
        hitPause = 0;
        shakeTime = 0;
        
        for(let i=0; i<3; i++) {
          spawnTask();
        }
      }

      function spawnTask() {
        let size = Math.min(W, H) * (0.05 + Math.random() * 0.05);
        let safeMargin = W * 0.1;
        let minX = W * 0.05;
        let maxX = dawnX - size - safeMargin;
        if (maxX > minX) {
          tasks.push({
            x: minX + Math.random() * (maxX - minX),
            y: H * 0.1 + Math.random() * (H * 0.4),
            size: size,
            vy: (Math.random() - 0.5) * H * 0.002,
            rot: Math.random() * Math.PI,
            rotSpeed: (Math.random() - 0.5) * 0.05
          });
        }
      }

      function startGame() {
        initAudio();
        gameState = 'PLAYING';
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        resetGameParams();
        updateHUD();
      }

      function gameOver() {
        gameState = 'GAMEOVER';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score;
        dawnX = 0;
      }

      document.querySelector('[data-smoke="start"]').addEventListener('click', startGame);
      document.querySelector('[data-smoke="restart"]').addEventListener('click', startGame);

      function getLaunchVector() {
        let vx = (touchCurrent.x - touchStart.x) * 0.2;
        let vy = (touchCurrent.y - touchStart.y) * 0.2;
        
        let maxVx = W * 0.05;
        let minVy = -H * 0.005;
        let maxVy = -H * 0.04;
        
        if (vy > minVy) return null;
        if (vx < -maxVx) vx = -maxVx;
        if (vx > maxVx) vx = maxVx;
        if (vy < maxVy) vy = maxVy;
        return { vx, vy };
      }

      function launchOrb(vx, vy) {
        orbs.push({
          x: W/2,
          y: H - 40,
          vx: vx,
          vy: vy,
          radius: 8,
          history: []
        });
        playSound('shoot');
      }

      window.addEventListener('touchstart', e => {
        if (e.target.tagName !== 'BUTTON') e.preventDefault();
        lastInput = 'touch';
        if (gameState !== 'PLAYING') return;
        isDragging = true;
        touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
        touchCurrent = {x: e.touches[0].clientX, y: e.touches[0].clientY};
      }, {passive: false});

      window.addEventListener('touchmove', e => {
        if (isDragging) e.preventDefault();
        if (gameState !== 'PLAYING') return;
        touchCurrent = {x: e.touches[0].clientX, y: e.touches[0].clientY};
      }, {passive: false});

      window.addEventListener('touchend', e => {
        if (e.target.tagName !== 'BUTTON') e.preventDefault();
        if (gameState !== 'PLAYING' || !isDragging) return;
        isDragging = false;
        let vec = getLaunchVector();
        if (vec) launchOrb(vec.vx, vec.vy);
      }, {passive: false});

      window.addEventListener('mousedown', e => {
        if (e.target.tagName === 'BUTTON') return;
        lastInput = 'touch';
        if (gameState !== 'PLAYING') return;
        isDragging = true;
        touchStart = {x: e.clientX, y: e.clientY};
        touchCurrent = {x: e.clientX, y: e.clientY};
      });

      window.addEventListener('mousemove', e => {
        if (gameState !== 'PLAYING') return;
        touchCurrent = {x: e.clientX, y: e.clientY};
      });

      window.addEventListener('mouseup', e => {
        if (gameState !== 'PLAYING' || !isDragging) return;
        isDragging = false;
        let vec = getLaunchVector();
        if (vec) launchOrb(vec.vx, vec.vy);
      });

      window.addEventListener('keydown', e => { 
        keys[e.code] = true;
        lastInput = 'keyboard';
        if (e.code === 'Space' && gameState === 'PLAYING') {
          let p = H * 0.035;
          launchOrb(Math.cos(aimAngle) * p, Math.sin(aimAngle) * p);
        }
      });
      window.addEventListener('keyup', e => { keys[e.code] = false; });

      function createParticles(x, y, color) {
        for (let i = 0; i < 20; i++) {
          let angle = Math.random() * Math.PI * 2;
          let speed = Math.random() * W * 0.01;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 4 + 2,
            life: 1.0,
            decay: 0.02 + Math.random() * 0.03,
            color: color
          });
        }
      }

      function update() {
        if (gameState !== 'PLAYING') return;
        
        if (keys['ArrowLeft']) aimAngle -= 0.05;
        if (keys['ArrowRight']) aimAngle += 0.05;
        if (aimAngle < -Math.PI + 0.1) aimAngle = -Math.PI + 0.1;
        if (aimAngle > -0.1) aimAngle = -0.1;

        if (hitPause > 0) {
          hitPause--;
          return;
        }
        if (shakeTime > 0) shakeTime--;
        
        frameCount++;
        dawnX -= currentDawnSpeed;
        
        let rate = Math.max(30, 120 - score * 3);
        if (frameCount % rate === 0) spawnTask();
        
        for (let i = tasks.length - 1; i >= 0; i--) {
          let t = tasks[i];
          t.y += t.vy;
          t.rot += t.rotSpeed;
          if (t.y < H * 0.05 || t.y > H * 0.6) t.vy *= -1;
          
          if (t.x + t.size > dawnX) {
            createParticles(t.x, t.y, colors.dawn1);
            tasks.splice(i, 1);
            lives--;
            playSound('error');
            vibrate(200);
            shakeTime = 15;
            updateHUD();
            if (lives <= 0) gameOver();
          }
        }
        
        for (let i = orbs.length - 1; i >= 0; i--) {
          let o = orbs[i];
          o.x += o.vx;
          o.vy += gravity;
          o.y += o.vy;
          
          o.history.push({x: o.x, y: o.y});
          if (o.history.length > 12) o.history.shift();
          
          if (o.y > H + 50 || o.x < -50 || o.x > W + 50) {
            orbs.splice(i, 1);
            continue;
          }
          
          let hit = false;
          for (let j = tasks.length - 1; j >= 0; j--) {
            let t = tasks[j];
            let hw = t.size/2;
            let cx = t.x;
            let cy = t.y;
            let testX = o.x;
            let testY = o.y;
            
            if (o.x < cx - hw) testX = cx - hw;
            else if (o.x > cx + hw) testX = cx + hw;
            if (o.y < cy - hw) testY = cy - hw;
            else if (o.y > cy + hw) testY = cy + hw;
            
            let dx = o.x - testX;
            let dy = o.y - testY;
            if (dx*dx + dy*dy <= o.radius*o.radius) {
              createParticles(cx, cy, colors.task);
              tasks.splice(j, 1);
              hit = true;
              score++;
              dawnX = Math.min(W, dawnX + W * 0.05);
              currentDawnSpeed += W * 0.00005;
              playSound('hit');
              vibrate(50);
              hitPause = 2;
              updateHUD();
              break;
            }
          }
          if (hit) orbs.splice(i, 1);
        }
        
        for (let i = particles.length - 1; i >= 0; i--) {
          let p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;
          if (p.life <= 0) particles.splice(i, 1);
        }
        
        if (dawnX <= 0) gameOver();
      }

      function draw() {
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, W, H);
        
        ctx.save();
        if (shakeTime > 0 && gameState === 'PLAYING') {
          let mag = shakeTime * 1.5;
          ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
        }
        
        ctx.strokeStyle = colors.grid;
        ctx.lineWidth = 1;
        let spacing = Math.max(40, W * 0.05);
        for (let x = 0; x < W; x += spacing) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += spacing) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        let dX = W;
        if (gameState === 'PLAYING') dX = dawnX;
        else if (gameState === 'GAMEOVER') dX = 0;
        else if (gameState === 'MENU') {
          menuTime += 0.01;
          dX = W * 0.6 + Math.sin(menuTime) * W * 0.1;
        }

        if (dX < W) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(dX, 0, W - dX, H);
          ctx.clip();
          
          let grad = ctx.createLinearGradient(dX, 0, W, 0);
          grad.addColorStop(0, colors.dawn1);
          grad.addColorStop(0.5, colors.dawn2);
          grad.addColorStop(1, colors.dawn3);
          ctx.fillStyle = grad;
          ctx.fillRect(dX, 0, W - dX, H);
          ctx.restore();
          
          ctx.strokeStyle = colors.dawn1;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(dX, 0);
          ctx.lineTo(dX, H);
          ctx.stroke();
          
          ctx.shadowColor = colors.dawn1;
          ctx.shadowBlur = 20;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        ctx.strokeStyle = colors.task;
        ctx.lineWidth = 2;
        tasks.forEach(t => {
          ctx.save();
          ctx.translate(t.x, t.y);
          ctx.rotate(t.rot);
          ctx.beginPath();
          ctx.rect(-t.size/2, -t.size/2, t.size, t.size);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-t.size/2 + 5, -t.size/2 + 5);
          ctx.lineTo(t.size/2 - 5, t.size/2 - 5);
          ctx.moveTo(t.size/2 - 5, -t.size/2 + 5);
          ctx.lineTo(-t.size/2 + 5, t.size/2 - 5);
          ctx.stroke();
          ctx.restore();
        });

        particles.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        ctx.fillStyle = colors.orb;
        orbs.forEach(o => {
          if (o.history.length > 0) {
            ctx.beginPath();
            ctx.moveTo(o.history[0].x, o.history[0].y);
            for (let i = 1; i < o.history.length; i++) {
              ctx.lineTo(o.history[i].x, o.history[i].y);
            }
            ctx.strokeStyle = colors.orb;
            ctx.lineWidth = o.radius;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalAlpha = 0.3;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
          }
          ctx.beginPath();
          ctx.arc(o.x, o.y, o.radius, 0, Math.PI*2);
          ctx.fill();
        });

        // Dock
        ctx.fillStyle = colors.task;
        ctx.beginPath();
        ctx.arc(W/2, H, 60, Math.PI, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = colors.orb;
        ctx.beginPath();
        ctx.arc(W/2, H - 40, 8, 0, Math.PI*2);
        ctx.fill();

        if (gameState === 'PLAYING') {
          function drawTrajectory(vx, vy) {
            ctx.fillStyle = colors.orb;
            ctx.globalAlpha = 0.4;
            for (let t=0; t<60; t+=4) {
              let px = W/2 + vx * t;
              let py = H - 40 + vy * t + 0.5 * gravity * t * t;
              ctx.beginPath();
              ctx.arc(px, py, 3, 0, Math.PI*2);
              ctx.fill();
            }
            ctx.globalAlpha = 1.0;
          }

          if (isDragging && lastInput === 'touch') {
            let vec = getLaunchVector();
            if (vec) drawTrajectory(vec.vx, vec.vy);
          } else if (lastInput === 'keyboard') {
            let p = H * 0.035;
            let vx = Math.cos(aimAngle) * p;
            let vy = Math.sin(aimAngle) * p;
            drawTrajectory(vx, vy);
            
            ctx.strokeStyle = colors.orb;
            ctx.globalAlpha = 0.8;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(W/2, H - 40);
            ctx.lineTo(W/2 + Math.cos(aimAngle)*50, H - 40 + Math.sin(aimAngle)*50);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
          }
        }
        
        ctx.restore();
      }

      let lastTime = performance.now();
      function loop(timestamp) {
        requestAnimationFrame(loop);
        if (timestamp < lastTime) lastTime = timestamp;
        if (timestamp - lastTime > 100) lastTime = timestamp - 16;
        
        let steps = 0;
        while (lastTime <= timestamp && steps < 5) {
          update();
          lastTime += 16.666;
          steps++;
        }
        draw();
      }
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
