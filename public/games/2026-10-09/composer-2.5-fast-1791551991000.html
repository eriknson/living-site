<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Circuit — capture the agent arrows</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1c1e;
    --fg: #00e5cc;
    --fg-dim: #3a8a80;
    --fg-bright: #5cffea;
    --accent: #ff9a3c;
    --panel: rgba(22, 24, 26, 0.94);
    --glow: rgba(0, 229, 204, 0.35);
    --danger: #ff5c4a;
    --btn-bg: #141618;
    --btn-border: #00e5cc;
    --fog: rgba(180, 190, 200, 0.08);
    --hud-bg: rgba(14, 16, 18, 0.85);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #d8dce0;
      --fg: #007a6e;
      --fg-dim: #5a8a84;
      --fg-bright: #005548;
      --accent: #c96a10;
      --panel: rgba(220, 224, 228, 0.96);
      --glow: rgba(0, 122, 110, 0.25);
      --danger: #c03020;
      --btn-bg: #c8ccd0;
      --btn-border: #007a6e;
      --fog: rgba(100, 110, 120, 0.12);
      --hud-bg: rgba(210, 214, 218, 0.9);
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.4rem;
    padding: 0.55rem 0.75rem;
    font-size: clamp(0.6rem, 2.6vw, 0.78rem);
    letter-spacing: 0.06em;
    background: var(--hud-bg);
    border-bottom: 1px solid var(--fg-dim);
    z-index: 3;
  }
  #hud .val { color: var(--fg-bright); }
  #hud .center { text-align: center; }
  #hud .right { text-align: right; }
  #arena-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #blueprint-bar {
    flex: 0 0 auto;
    height: clamp(72px, 18dvh, 110px);
    border-top: 1px solid var(--fg-dim);
    background: var(--hud-bg);
    position: relative;
    z-index: 2;
  }
  #blueprint {
    display: block;
    width: 100%;
    height: 100%;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s;
  }
  .overlay.visible {
    opacity: 1;
    visibility: visible;
  }
  .overlay h1 {
    font-size: clamp(1rem, 4.8vw, 1.55rem);
    letter-spacing: 0.18em;
    margin-bottom: 0.35rem;
    text-shadow: 0 0 14px var(--glow);
  }
  .overlay .sub {
    font-size: clamp(0.55rem, 2.4vw, 0.72rem);
    color: var(--fg-dim);
    letter-spacing: 0.14em;
    margin-bottom: 0.8rem;
  }
  .overlay p {
    font-size: clamp(0.62rem, 2.8vw, 0.82rem);
    color: var(--fg-dim);
    max-width: 88%;
    text-align: center;
    line-height: 1.55;
    margin-bottom: 1.1rem;
  }
  .overlay .stats {
    font-size: clamp(0.68rem, 3vw, 0.88rem);
    margin-bottom: 1rem;
    text-align: center;
    line-height: 1.65;
    color: var(--fg-bright);
  }
  .smoke-btn {
    pointer-events: auto;
    min-width: 44px;
    min-height: 44px;
    padding: 0.72rem 1.8rem;
    font-family: inherit;
    font-size: clamp(0.72rem, 3.2vw, 0.92rem);
    letter-spacing: 0.14em;
    background: var(--btn-bg);
    color: var(--fg-bright);
    border: 2px solid var(--btn-border);
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 18px var(--glow);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .smoke-btn:active {
    transform: scale(0.96);
    box-shadow: 0 0 8px var(--glow);
  }
  .hint {
    margin-top: 0.9rem;
    font-size: clamp(0.52rem, 2.2vw, 0.68rem);
    color: var(--fg-dim);
    letter-spacing: 0.07em;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><span>NODES </span><span class="val" id="nodes">0/12</span></div>
    <div class="center"><span>TIME </span><span class="val" id="time">60</span></div>
    <div class="right"><span>COMBO </span><span class="val" id="combo">×1</span></div>
  </div>
  <div id="arena-wrap">
    <canvas id="game"></canvas>
    <div id="title-overlay" class="overlay visible">
      <h1>FOG CIRCUIT</h1>
      <p class="sub">OCT 09 · FOG · 14°C</p>
      <p>Drag to steer your collector through the fog.<br>Grab glowing agent arrows before they dissolve.<br>Each capture wires another node into the blueprint.</p>
      <button class="smoke-btn" data-smoke="start" id="btn-start">INITIATE</button>
      <p class="hint">drag or arrow keys · avoid flickering decoys</p>
    </div>
    <div id="gameover-overlay" class="overlay">
      <h1 id="go-title">CIRCUIT LOST</h1>
      <div class="stats" id="go-stats"></div>
      <button class="smoke-btn" data-smoke="restart" id="btn-restart">RECOMPILE</button>
    </div>
  </div>
  <div id="blueprint-bar">
    <canvas id="blueprint"></canvas>
  </div>
</div>
<script>
(function () {
  'use strict';

  var SEGMENTS = 12;
  var ROUND_TIME = 60;
  var MAX_MISSES = 8;

  /* Blueprint topology: normalized coords 0-1, segments light in order */
  var BP_NODES = [
    { x: 0.12, y: 0.5, r: 0.04 },
    { x: 0.28, y: 0.28, r: 0.035 },
    { x: 0.28, y: 0.72, r: 0.035 },
    { x: 0.44, y: 0.5, r: 0.04 },
    { x: 0.56, y: 0.22, r: 0.03 },
    { x: 0.56, y: 0.78, r: 0.03 },
    { x: 0.68, y: 0.5, r: 0.04 },
    { x: 0.78, y: 0.32, r: 0.03 },
    { x: 0.78, y: 0.68, r: 0.03 },
    { x: 0.88, y: 0.5, r: 0.035 },
    { x: 0.94, y: 0.35, r: 0.025 },
    { x: 0.94, y: 0.65, r: 0.025 }
  ];
  var BP_EDGES = [
    [0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [3, 5],
    [4, 6], [5, 6], [6, 7], [6, 8], [7, 9], [8, 9], [9, 10], [9, 11]
  ];
  /* Which segment index unlocks which blueprint parts */
  var SEG_UNLOCK = [
    { edges: [0], nodes: [0] },
    { edges: [1], nodes: [1] },
    { edges: [2], nodes: [2] },
    { edges: [3], nodes: [3] },
    { edges: [4, 5], nodes: [4, 5] },
    { edges: [6, 7], nodes: [] },
    { edges: [8], nodes: [6] },
    { edges: [9, 10], nodes: [7, 8] },
    { edges: [11], nodes: [9] },
    { edges: [12], nodes: [10] },
    { edges: [13], nodes: [11] },
    { edges: [], nodes: [] }
  ];

  var canvas = document.getElementById('game');
  var bpCanvas = document.getElementById('blueprint');
  var ctx = canvas.getContext('2d');
  var bpCtx = bpCanvas.getContext('2d');
  var nodesEl = document.getElementById('nodes');
  var timeEl = document.getElementById('time');
  var comboEl = document.getElementById('combo');
  var titleOverlay = document.getElementById('title-overlay');
  var goOverlay = document.getElementById('gameover-overlay');
  var goTitle = document.getElementById('go-title');
  var goStats = document.getElementById('go-stats');
  var btnStart = document.getElementById('btn-start');
  var btnRestart = document.getElementById('btn-restart');

  var W = 0, H = 0, bpW = 0, bpH = 0;
  var state = 'title';
  var collector = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, r: 28 };
  var arrows = [];
  var fogParts = [];
  var particles = [];
  var floatTexts = [];
  var keys = {};
  var dragging = false;
  var dragOffX = 0, dragOffY = 0;
  var collected = 0;
  var combo = 0;
  var comboTimer = 0;
  var misses = 0;
  var timeLeft = ROUND_TIME;
  var gameTime = 0;
  var spawnTimer = 1.2;
  var fogDensity = 0.25;
  var arrowSpeed = 1;
  var shake = 0;
  var hitPause = 0;
  var litEdges = {};
  var litNodes = {};
  var audioCtx = null;
  var lastTs = 0;
  var bpPulse = 0;

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { /* noop */ }
  }

  function tone(freq, dur, vol, type) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* noop */ }
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* noop */ }
  }

  function resize() {
    var wrap = document.getElementById('arena-wrap');
    var bpBar = document.getElementById('blueprint-bar');
    if (!wrap) return;
    W = wrap.clientWidth || window.innerWidth;
    H = wrap.clientHeight || Math.max(200, window.innerHeight * 0.55);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    bpW = bpBar ? bpBar.clientWidth : W;
    bpH = bpBar ? bpBar.clientHeight : 80;
    bpCanvas.width = Math.floor(bpW * dpr);
    bpCanvas.height = Math.floor(bpH * dpr);
    bpCanvas.style.width = bpW + 'px';
    bpCanvas.style.height = bpH + 'px';
    bpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    collector.x = W * 0.5;
    collector.y = H * 0.5;
    collector.tx = collector.x;
    collector.ty = collector.y;
    initFog();
  }

  function initFog() {
    fogParts = [];
    var n = Math.floor((W * H) / 8000);
    for (var i = 0; i < n; i++) {
      fogParts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 20 + Math.random() * 60,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        a: 0.03 + Math.random() * 0.08
      });
    }
  }

  function resetGame() {
    collected = 0;
    combo = 0;
    comboTimer = 0;
    misses = 0;
    timeLeft = ROUND_TIME;
    gameTime = 0;
    spawnTimer = 1.0;
    fogDensity = 0.22;
    arrowSpeed = 1;
    arrows = [];
    particles = [];
    floatTexts = [];
    shake = 0;
    hitPause = 0;
    litEdges = {};
    litNodes = {};
    bpPulse = 0;
    collector.x = W * 0.5;
    collector.y = H * 0.5;
    collector.tx = collector.x;
    collector.ty = collector.y;
    updateHUD();
    drawBlueprint();
  }

  function updateHUD() {
    nodesEl.textContent = collected + '/' + SEGMENTS;
    timeEl.textContent = String(Math.ceil(timeLeft));
    timeEl.style.color = timeLeft <= 10 ? cssVar('--danger') : '';
    var mult = 1 + Math.floor(combo / 3);
    comboEl.textContent = '×' + mult;
    comboEl.style.color = mult > 2 ? cssVar('--accent') : '';
  }

  function unlockSegment(idx) {
    var u = SEG_UNLOCK[idx];
    if (!u) return;
    var i;
    for (i = 0; i < u.edges.length; i++) litEdges[u.edges[i]] = true;
    for (i = 0; i < u.nodes.length; i++) litNodes[u.nodes[i]] = true;
    bpPulse = 1;
    drawBlueprint();
  }

  function drawBlueprint() {
    if (!bpCtx || bpW <= 0) return;
    bpCtx.clearRect(0, 0, bpW, bpH);
    var fg = cssVar('--fg-dim');
    var bright = cssVar('--fg-bright');
    var glow = cssVar('--glow');
    var accent = cssVar('--accent');
    var pad = 8;
    var bw = bpW - pad * 2;
    var bh = bpH - pad * 2;

    bpCtx.save();
    bpCtx.translate(pad, pad);

    /* grid */
    bpCtx.strokeStyle = fg;
    bpCtx.globalAlpha = 0.15;
    bpCtx.lineWidth = 0.5;
    for (var gx = 0; gx <= 10; gx++) {
      bpCtx.beginPath();
      bpCtx.moveTo(gx * bw / 10, 0);
      bpCtx.lineTo(gx * bw / 10, bh);
      bpCtx.stroke();
    }
    for (var gy = 0; gy <= 4; gy++) {
      bpCtx.beginPath();
      bpCtx.moveTo(0, gy * bh / 4);
      bpCtx.lineTo(bw, gy * bh / 4);
      bpCtx.stroke();
    }
    bpCtx.globalAlpha = 1;

    /* edges */
    var ei;
    for (ei = 0; ei < BP_EDGES.length; ei++) {
      var e = BP_EDGES[ei];
      var n0 = BP_NODES[e[0]];
      var n1 = BP_NODES[e[1]];
      var lit = !!litEdges[ei];
      bpCtx.beginPath();
      bpCtx.moveTo(n0.x * bw, n0.y * bh);
      bpCtx.lineTo(n1.x * bw, n1.y * bh);
      bpCtx.strokeStyle = lit ? bright : fg;
      bpCtx.globalAlpha = lit ? 0.95 : 0.25;
      bpCtx.lineWidth = lit ? 2 : 1;
      if (lit) {
        bpCtx.shadowColor = glow;
        bpCtx.shadowBlur = 6 + bpPulse * 8;
      } else {
        bpCtx.shadowBlur = 0;
      }
      bpCtx.stroke();
      bpCtx.shadowBlur = 0;
    }

    /* nodes */
    var ni;
    for (ni = 0; ni < BP_NODES.length; ni++) {
      var nd = BP_NODES[ni];
      var nl = !!litNodes[ni];
      var nr = nd.r * Math.min(bw, bh);
      bpCtx.beginPath();
      bpCtx.arc(nd.x * bw, nd.y * bh, nr, 0, Math.PI * 2);
      if (nl) {
        bpCtx.fillStyle = bright;
        bpCtx.globalAlpha = 0.9;
        bpCtx.shadowColor = glow;
        bpCtx.shadowBlur = 8;
      } else {
        bpCtx.fillStyle = fg;
        bpCtx.globalAlpha = 0.2;
        bpCtx.shadowBlur = 0;
      }
      bpCtx.fill();
      bpCtx.strokeStyle = nl ? bright : fg;
      bpCtx.globalAlpha = nl ? 1 : 0.35;
      bpCtx.lineWidth = nl ? 1.5 : 0.8;
      bpCtx.stroke();
      bpCtx.shadowBlur = 0;
    }

    /* label */
    bpCtx.globalAlpha = 0.7;
    bpCtx.fillStyle = collected >= SEGMENTS ? accent : fg;
    bpCtx.font = '600 ' + Math.max(8, bpH * 0.12) + 'px ui-monospace, Menlo, monospace';
    bpCtx.textAlign = 'left';
    bpCtx.fillText(collected >= SEGMENTS ? 'STACK ONLINE' : 'AGENT TOPOLOGY', 2, bh - 4);

    bpCtx.restore();
    if (bpPulse > 0) bpPulse = Math.max(0, bpPulse - 0.04);
  }

  function spawnArrow() {
    var decoy = gameTime > 8 && Math.random() < Math.min(0.35, 0.08 + gameTime * 0.004);
    var edge = Math.floor(Math.random() * 4);
    var x, y, vx, vy;
    var spd = (60 + Math.random() * 40) * arrowSpeed;
    var margin = 30;
    if (edge === 0) { x = Math.random() * W; y = -margin; vx = (Math.random() - 0.5) * 40; vy = spd; }
    else if (edge === 1) { x = W + margin; y = Math.random() * H; vx = -spd; vy = (Math.random() - 0.5) * 40; }
    else if (edge === 2) { x = Math.random() * W; y = H + margin; vx = (Math.random() - 0.5) * 40; vy = -spd; }
    else { x = -margin; y = Math.random() * H; vx = spd; vy = (Math.random() - 0.5) * 40; }

    arrows.push({
      x: x, y: y, vx: vx, vy: vy,
      angle: Math.atan2(vy, vx),
      life: decoy ? 2.5 + Math.random() * 1.5 : 4 + Math.random() * 2,
      maxLife: 0,
      decoy: decoy,
      flicker: Math.random() * Math.PI * 2,
      r: decoy ? 14 : 18
    });
    arrows[arrows.length - 1].maxLife = arrows[arrows.length - 1].life;
  }

  function burst(x, y, color, n) {
    var i;
    for (i = 0; i < (n || 12); i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.4 + Math.random() * 0.4,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function floatText(x, y, txt, color) {
    floatTexts.push({ x: x, y: y, txt: txt, life: 0.9, color: color || cssVar('--fg-bright') });
  }

  function collectArrow(a, idx) {
    arrows.splice(idx, 1);
    if (a.decoy) {
      combo = 0;
      comboTimer = 0;
      fogDensity = Math.min(0.75, fogDensity + 0.06);
      shake = 8;
      hitPause = 0.06;
      burst(a.x, a.y, cssVar('--danger'), 16);
      floatText(a.x, a.y - 20, 'DECOY', cssVar('--danger'));
      tone(120, 0.15, 0.07, 'sawtooth');
      vibrate(40);
      return;
    }
    combo++;
    comboTimer = 2.5;
    collected++;
    var mult = 1 + Math.floor(combo / 3);
    burst(a.x, a.y, cssVar('--fg-bright'), 14 + mult * 2);
    floatText(a.x, a.y - 24, '+NODE ×' + mult, cssVar('--fg-bright'));
    tone(440 + combo * 20, 0.08, 0.05, 'sine');
    tone(660 + combo * 15, 0.12, 0.04, 'triangle');
    vibrate(15);
    hitPause = 0.04;
    shake = 3;
    unlockSegment(collected - 1);
    updateHUD();
    if (collected >= SEGMENTS) endGame(true);
  }

  function missArrow() {
    misses++;
    combo = 0;
    comboTimer = 0;
    fogDensity = Math.min(0.8, fogDensity + 0.04);
    tone(90, 0.2, 0.04, 'sawtooth');
    updateHUD();
    if (misses >= MAX_MISSES) endGame(false);
  }

  function drawArrow(a) {
    var alpha = Math.min(1, a.life / (a.maxLife * 0.3));
    var flick = a.decoy ? 0.4 + 0.6 * Math.abs(Math.sin(a.flicker)) : 1;
    var col = a.decoy ? cssVar('--accent') : cssVar('--fg-bright');
    var dim = cssVar('--fg-dim');

    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.angle);
    ctx.globalAlpha = alpha * flick;

    /* glow trail */
    ctx.strokeStyle = col;
    ctx.lineWidth = a.decoy ? 1.5 : 2.5;
    ctx.shadowColor = col;
    ctx.shadowBlur = a.decoy ? 6 : 14;
    ctx.beginPath();
    ctx.moveTo(-a.r * 1.2, 0);
    ctx.lineTo(a.r * 0.6, 0);
    ctx.stroke();

    /* arrowhead */
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(a.r, 0);
    ctx.lineTo(a.r * 0.2, a.r * 0.45);
    ctx.lineTo(a.r * 0.2, -a.r * 0.45);
    ctx.closePath();
    ctx.fill();

    /* wireframe box for agent arrow */
    if (!a.decoy) {
      ctx.strokeStyle = dim;
      ctx.lineWidth = 0.8;
      ctx.globalAlpha = alpha * 0.5;
      ctx.shadowBlur = 0;
      ctx.strokeRect(-a.r * 0.5, -a.r * 0.35, a.r * 0.5, a.r * 0.7);
    }

    ctx.restore();
  }

  function drawCollector() {
    var fg = cssVar('--fg-bright');
    var glow = cssVar('--glow');
    ctx.save();
    ctx.translate(collector.x, collector.y);

    /* outer ring */
    ctx.strokeStyle = fg;
    ctx.lineWidth = 2;
    ctx.shadowColor = glow;
    ctx.shadowBlur = 16;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(0, 0, collector.r, 0, Math.PI * 2);
    ctx.stroke();

    /* crosshair */
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.moveTo(-collector.r * 0.6, 0);
    ctx.lineTo(collector.r * 0.6, 0);
    ctx.moveTo(0, -collector.r * 0.6);
    ctx.lineTo(0, collector.r * 0.6);
    ctx.stroke();

    /* core */
    ctx.fillStyle = fg;
    ctx.globalAlpha = 0.35;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, 0, collector.r * 0.35, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawFog() {
    var fogCol = cssVar('--fog');
    var i;
    for (i = 0; i < fogParts.length; i++) {
      var f = fogParts[i];
      ctx.fillStyle = fogCol;
      ctx.globalAlpha = f.a * fogDensity * 2.5;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    /* vignette fog */
    var grd = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.15, W * 0.5, H * 0.5, Math.max(W, H) * 0.65);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(30,34,38,' + (fogDensity * 0.55) + ')');
    ctx.fillStyle = grd;
    ctx.globalAlpha = 1;
    ctx.fillRect(0, 0, W, H);

    /* autumn dusk horizon — earlier sunset, fog before seven */
    var dusk = ctx.createLinearGradient(0, H * 0.55, 0, H);
    dusk.addColorStop(0, 'rgba(0,0,0,0)');
    dusk.addColorStop(0.5, 'rgba(255,120,40,' + (0.04 + fogDensity * 0.03) + ')');
    dusk.addColorStop(1, 'rgba(180,90,30,' + (0.08 + fogDensity * 0.04) + ')');
    ctx.fillStyle = dusk;
    ctx.fillRect(0, 0, W, H);
  }

  function drawScene() {
    var bg = cssVar('--bg');
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.85;
      if (shake < 0.3) shake = 0;
    }

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    /* subtle grid */
    ctx.strokeStyle = cssVar('--fg-dim');
    ctx.globalAlpha = 0.08;
    ctx.lineWidth = 0.5;
    var gs = 40;
    var gx, gy;
    for (gx = 0; gx < W; gx += gs) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    for (gy = 0; gy < H; gy += gs) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* arrows (under fog partially) */
    var ai;
    for (ai = 0; ai < arrows.length; ai++) drawArrow(arrows[ai]);

    drawCollector();

    /* particles */
    var pi;
    for (pi = 0; pi < particles.length; pi++) {
      var p = particles[pi];
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    /* float text */
    var fi;
    for (fi = 0; fi < floatTexts.length; fi++) {
      var ft = floatTexts[fi];
      ctx.fillStyle = ft.color;
      ctx.globalAlpha = ft.life;
      ctx.font = '600 13px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(ft.txt, ft.x, ft.y);
    }

    drawFog();
    ctx.restore();
  }

  function pointerToGame(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (W / rect.width),
      y: (clientY - rect.top) * (H / rect.height)
    };
  }

  function onPointerDown(e) {
    if (state !== 'playing') return;
    e.preventDefault();
    dragging = true;
    var p = pointerToGame(e.clientX, e.clientY);
    dragOffX = collector.x - p.x;
    dragOffY = collector.y - p.y;
  }

  function onPointerMove(e) {
    if (!dragging || state !== 'playing') return;
    e.preventDefault();
    var p = pointerToGame(e.clientX, e.clientY);
    collector.tx = p.x + dragOffX;
    collector.ty = p.y + dragOffY;
  }

  function onPointerUp(e) {
    dragging = false;
  }

  function update(dt) {
    if (state !== 'playing') return;
    if (hitPause > 0) { hitPause -= dt; return; }

    gameTime += dt;
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; endGame(collected >= SEGMENTS); return; }

    /* escalation */
    arrowSpeed = 1 + gameTime * 0.025;
    fogDensity = Math.min(0.72, 0.22 + gameTime * 0.008);
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnArrow();
      spawnTimer = Math.max(0.35, 1.1 - gameTime * 0.012);
    }

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) { combo = 0; updateHUD(); }
    }

    /* collector movement */
    var speed = dragging ? 18 : 10;
    if (keys['ArrowLeft'] || keys['a']) collector.tx -= 280 * dt;
    if (keys['ArrowRight'] || keys['d']) collector.tx += 280 * dt;
    if (keys['ArrowUp'] || keys['w']) collector.ty -= 280 * dt;
    if (keys['ArrowDown'] || keys['s']) collector.ty += 280 * dt;
    collector.tx = Math.max(collector.r, Math.min(W - collector.r, collector.tx));
    collector.ty = Math.max(collector.r, Math.min(H - collector.r, collector.ty));
    collector.x += (collector.tx - collector.x) * Math.min(1, speed * dt);
    collector.y += (collector.ty - collector.y) * Math.min(1, speed * dt);

    /* fog drift */
    var fi;
    for (fi = 0; fi < fogParts.length; fi++) {
      var f = fogParts[fi];
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.x < -f.r) f.x = W + f.r;
      if (f.x > W + f.r) f.x = -f.r;
      if (f.y < -f.r) f.y = H + f.r;
      if (f.y > H + f.r) f.y = -f.r;
    }

    /* arrows */
    var i = arrows.length - 1;
    while (i >= 0) {
      var a = arrows[i];
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.angle = Math.atan2(a.vy, a.vx);
      a.life -= dt;
      a.flicker += dt * (a.decoy ? 12 : 3);
      if (a.life <= 0) {
        if (!a.decoy) missArrow();
        arrows.splice(i, 1);
      } else {
        var dx = a.x - collector.x;
        var dy = a.y - collector.y;
        if (dx * dx + dy * dy < (collector.r + a.r * 0.5) * (collector.r + a.r * 0.5)) {
          collectArrow(a, i);
        }
      }
      i--;
    }

    /* particles */
    i = particles.length - 1;
    while (i >= 0) {
      var p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
      i--;
    }

    i = floatTexts.length - 1;
    while (i >= 0) {
      floatTexts[i].y -= 30 * dt;
      floatTexts[i].life -= dt;
      if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
      i--;
    }

    updateHUD();
  }

  function startGame() {
    initAudio();
    resetGame();
    state = 'playing';
    titleOverlay.classList.remove('visible');
    goOverlay.classList.remove('visible');
    spawnArrow();
    spawnTimer = 0.7;
    tone(330, 0.1, 0.05, 'sine');
    tone(550, 0.15, 0.04, 'triangle');
  }

  function endGame(won) {
    state = 'over';
    goTitle.textContent = won ? 'STACK ONLINE' : 'CIRCUIT LOST';
    var mult = 1 + Math.floor(combo / 3);
    var lines = [
      'Nodes wired: ' + collected + ' / ' + SEGMENTS,
      'Time left: ' + Math.ceil(timeLeft) + 's',
      'Misses: ' + misses + ' / ' + MAX_MISSES
    ];
    if (won) lines.push('The agent topology is live.');
    else if (collected >= SEGMENTS - 2) lines.push('One more dawn shipment…');
    else lines.push('Fog swallowed the arrows.');
    goStats.innerHTML = lines.join('<br>');
    goOverlay.classList.add('visible');
    if (won) {
      tone(523, 0.12, 0.05, 'sine');
      tone(659, 0.12, 0.05, 'sine');
      tone(784, 0.2, 0.05, 'triangle');
      vibrate([30, 20, 30]);
    } else {
      tone(180, 0.3, 0.06, 'sawtooth');
    }
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    drawScene();
    if (state === 'title' || state === 'over') drawBlueprint();
    requestAnimationFrame(loop);
  }

  btnStart.addEventListener('click', function () { startGame(); });
  btnRestart.addEventListener('click', function () { startGame(); });

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  window.addEventListener('resize', resize);
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      drawBlueprint();
    });
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () {
      drawBlueprint();
    });
  }

  resize();
  drawBlueprint();
  drawScene();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
