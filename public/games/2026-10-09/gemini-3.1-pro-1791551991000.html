<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dawn Manifest</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --text: #0f172a;
            --accent: #d95c14;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --text: #f1f5f9;
                --accent: #e09f26;
            }
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
            font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 4px var(--bg), 0 0 8px var(--bg);
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .screen.active {
            opacity: 1;
        }
        .screen-content {
            text-align: center;
            padding: 2rem;
            background: var(--bg);
            border: 2px solid var(--text);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            pointer-events: auto;
            max-width: 90%;
            box-sizing: border-box;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            margin: 0 auto 2rem auto;
            font-size: 1rem;
            opacity: 0.8;
            max-width: 280px;
            line-height: 1.4;
        }
        button {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: auto;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div class="hud" id="hud">
                <div id="score-display">REVEALED: 0%</div>
                <div id="time-display">0:45</div>
            </div>
        </div>
        
        <div id="start-screen" class="screen active">
            <div class="screen-content">
                <h1>Dawn Manifest</h1>
                <p>Swipe to flick leaves and clear the frost. Reveal the cargo before it freezes over.</p>
                <button data-smoke="start" id="btn-start">Start</button>
            </div>
        </div>
        
        <div id="game-over-screen" class="screen">
            <div class="screen-content">
                <h1 id="end-title">Manifest Obscured</h1>
                <p id="end-desc">The frost took over.</p>
                <button data-smoke="restart" id="btn-restart">Restart</button>
            </div>
        </div>
    </div>
    <script>
        const container = document.getElementById('game-container');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const btnStart = document.getElementById('btn-start');
        const btnRestart = document.getElementById('btn-restart');
        const endTitle = document.getElementById('end-title');
        const endDesc = document.getElementById('end-desc');

        let width, height;
        let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        const bgCanvas = document.createElement('canvas');
        const bgCtx = bgCanvas.getContext('2d', { alpha: false });
        const fogCanvas = document.createElement('canvas');
        const fogCtx = fogCanvas.getContext('2d');
        const mainCanvas = document.createElement('canvas');
        const mainCtx = mainCanvas.getContext('2d', { alpha: false });
        const checkCanvas = document.createElement('canvas');
        const checkCtx = checkCanvas.getContext('2d', { willReadFrequently: true });
        checkCanvas.width = 64;
        checkCanvas.height = 64;

        container.insertBefore(mainCanvas, container.firstChild);

        const noiseCanvas = document.createElement('canvas');
        noiseCanvas.width = 128;
        noiseCanvas.height = 128;
        const noiseCtx = noiseCanvas.getContext('2d');
        let noiseData = noiseCtx.createImageData(128, 128);
        for (let i = 0; i < noiseData.data.length; i += 4) {
            let val = Math.random() * 255;
            noiseData.data[i] = val;
            noiseData.data[i+1] = val;
            noiseData.data[i+2] = val;
            noiseData.data[i+3] = 15;
        }
        noiseCtx.putImageData(noiseData, 0, 0);

        let gameState = 'start';
        let leaves = [];
        let gameTime = 0;
        let lastTime = 0;
        let frameCount = 0;
        let score = 0;
        let reqId;

        const MAX_TIME = 45;
        const WIN_THRESHOLD = 0.85;

        let isSwiping = false;
        let prevX = 0, prevY = 0;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let lastSwipeSound = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playThud(vol) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        function playSwipe(speed) {
            if (!audioCtx) return;
            try {
                let bufferSize = audioCtx.sampleRate * 0.1;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                
                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = Math.min(3000, 1000 + speed * 2);
                
                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                noise.start();
            } catch (e) {}
        }

        class Leaf {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 200;
                this.vy = (Math.random() - 0.5) * 200;
                let baseSize = Math.min(width, height) * 0.05;
                this.radius = baseSize + Math.random() * baseSize * 0.8;
                this.mass = this.radius;
                this.angle = Math.random() * Math.PI * 2;
                this.angularVelocity = (Math.random() - 0.5) * 5;
                this.type = Math.floor(Math.random() * 3);
                const colors = ['#d95c14', '#c43b16', '#e09f26', '#8b9933', '#a33b20'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.angle += this.angularVelocity * dt;
                
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.angularVelocity *= 0.95;
                
                if (this.x < this.radius) { this.x = this.radius; this.vx *= -0.6; }
                if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -0.6; }
                if (this.y < this.radius) { this.y = this.radius; this.vy *= -0.6; }
                if (this.y > height - this.radius) { this.y = height - this.radius; this.vy *= -0.6; }
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            bgCanvas.width = width;
            bgCanvas.height = height;
            fogCanvas.width = width;
            fogCanvas.height = height;
            mainCanvas.width = width;
            mainCanvas.height = height;
            
            if (gameState === 'start') {
                drawManifest();
                initFog();
                render();
            } else if (gameState === 'gameover') {
                render();
            }
        }
        window.addEventListener('resize', resize);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            isDark = e.matches;
            if (gameState !== 'playing') {
                drawManifest();
                initFog();
                render();
            }
        });

        function drawManifest() {
            bgCtx.fillStyle = isDark ? '#0f172a' : '#cbd5e1';
            bgCtx.fillRect(0, 0, width, height);
            
            bgCtx.fillStyle = isDark ? '#1e293b' : '#94a3b8';
            bgCtx.strokeStyle = isDark ? '#1e293b' : '#94a3b8';
            
            bgCtx.lineWidth = 2;
            for(let i=0; i<width; i+=100) {
                bgCtx.beginPath(); bgCtx.moveTo(i, 0); bgCtx.lineTo(i, height); bgCtx.stroke();
            }
            for(let i=0; i<height; i+=100) {
                bgCtx.beginPath(); bgCtx.moveTo(0, i); bgCtx.lineTo(width, i); bgCtx.stroke();
            }
            
            bgCtx.font = 'bold 80px ui-monospace, "SFMono-Regular", Menlo, monospace';
            bgCtx.textAlign = 'center';
            bgCtx.textBaseline = 'middle';
            
            bgCtx.save();
            bgCtx.translate(width/2, height/2 - 100);
            bgCtx.rotate(-0.1);
            bgCtx.fillText("MANIFEST", 0, 0);
            bgCtx.font = 'bold 40px ui-monospace';
            bgCtx.fillText("AWB: 772-9942-11", 0, 60);
            bgCtx.restore();
            
            let bx = width/2 - 150;
            let by = height/2 + 50;
            for(let i=0; i<300; i+= Math.random()*10 + 2) {
                let w = Math.random()*5 + 1;
                bgCtx.fillRect(bx + i, by, w, 80);
            }
            
            bgCtx.beginPath();
            bgCtx.arc(width*0.8, height*0.3, 60, 0, Math.PI*2);
            bgCtx.lineWidth = 8;
            bgCtx.stroke();
            bgCtx.font = 'bold 24px ui-monospace';
            bgCtx.fillText("APPROVED", width*0.8, height*0.3);
            
            bgCtx.font = '14px ui-monospace';
            bgCtx.textAlign = 'left';
            for(let i=0; i<5; i++) {
                let tx = Math.random() * width * 0.8;
                let ty = Math.random() * height * 0.8;
                bgCtx.fillText(`SEC-${Math.floor(Math.random()*9999)}`, tx, ty);
                bgCtx.fillText(`WT: ${Math.floor(Math.random()*500)}KG`, tx, ty + 20);
            }
        }

        function initFog() {
            fogCtx.globalCompositeOperation = 'source-over';
            fogCtx.fillStyle = isDark ? '#1e293b' : '#f1f5f9';
            fogCtx.fillRect(0, 0, width, height);
            
            fogCtx.fillStyle = fogCtx.createPattern(noiseCanvas, 'repeat');
            fogCtx.fillRect(0, 0, width, height);
        }

        function drawMaple(ctx, r) {
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(r*0.3, -r*0.3);
            ctx.lineTo(r*0.9, -r*0.4);
            ctx.lineTo(r*0.5, r*0.2);
            ctx.lineTo(r*0.7, r*0.8);
            ctx.lineTo(0, r*0.5);
            ctx.lineTo(-r*0.7, r*0.8);
            ctx.lineTo(-r*0.5, r*0.2);
            ctx.lineTo(-r*0.9, -r*0.4);
            ctx.lineTo(-r*0.3, -r*0.3);
            ctx.closePath();
        }

        function drawOak(ctx, r) {
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.bezierCurveTo(r*0.5, -r, r*0.8, -r*0.5, r*0.5, -r*0.2);
            ctx.bezierCurveTo(r, -r*0.1, r, r*0.4, r*0.5, r*0.5);
            ctx.bezierCurveTo(r*0.6, r*0.9, r*0.2, r, 0, r*0.8);
            ctx.bezierCurveTo(-r*0.2, r, -r*0.6, r*0.9, -r*0.5, r*0.5);
            ctx.bezierCurveTo(-r, r*0.4, -r, -r*0.1, -r*0.5, -r*0.2);
            ctx.bezierCurveTo(-r*0.8, -r*0.5, -r*0.5, -r, 0, -r);
            ctx.closePath();
        }

        function drawOval(ctx, r) {
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.quadraticCurveTo(r, 0, 0, r);
            ctx.quadraticCurveTo(-r, 0, 0, -r);
            ctx.closePath();
        }

        function renderLeaf(ctx, leaf) {
            ctx.save();
            ctx.translate(leaf.x, leaf.y);
            ctx.rotate(leaf.angle);
            
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 4;
            
            ctx.fillStyle = leaf.color;
            
            if (leaf.type === 0) drawOval(ctx, leaf.radius);
            else if (leaf.type === 1) drawMaple(ctx, leaf.radius);
            else drawOak(ctx, leaf.radius);
            
            ctx.fill();
            
            ctx.shadowColor = 'transparent';
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-leaf.radius*0.8, 0);
            ctx.lineTo(leaf.radius*0.8, 0);
            ctx.stroke();
            
            ctx.restore();
        }

        function resolveCollisions() {
            for (let i = 0; i < leaves.length; i++) {
                for (let j = i + 1; j < leaves.length; j++) {
                    let l1 = leaves[i];
                    let l2 = leaves[j];
                    let dx = l2.x - l1.x;
                    let dy = l2.y - l1.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    let minDist = l1.radius + l2.radius;
                    if (dist < minDist) {
                        let overlap = minDist - dist;
                        let nx = dx / dist;
                        let ny = dy / dist;
                        
                        let totalMass = l1.mass + l2.mass;
                        let m1Ratio = l2.mass / totalMass;
                        let m2Ratio = l1.mass / totalMass;
                        
                        l1.x -= nx * overlap * m1Ratio;
                        l1.y -= ny * overlap * m1Ratio;
                        l2.x += nx * overlap * m2Ratio;
                        l2.y += ny * overlap * m2Ratio;
                        
                        let kx = (l1.vx - l2.vx);
                        let ky = (l1.vy - l2.vy);
                        let p = 2.0 * (nx * kx + ny * ky) / totalMass;
                        
                        l1.vx -= p * l2.mass * nx * 0.8;
                        l1.vy -= p * l2.mass * ny * 0.8;
                        l2.vx += p * l1.mass * nx * 0.8;
                        l2.vy += p * l1.mass * ny * 0.8;
                        
                        let impact = Math.abs(p);
                        if (impact > 100) {
                            playThud(Math.min(0.5, impact / 1000));
                            if (navigator.vibrate && impact > 300) {
                                try { navigator.vibrate(5); } catch(e) {}
                            }
                        }
                    }
                }
            }
        }

        function getClearedPercentage() {
            checkCtx.clearRect(0, 0, 64, 64);
            checkCtx.drawImage(fogCanvas, 0, 0, 64, 64);
            let data = checkCtx.getImageData(0, 0, 64, 64).data;
            let clearCount = 0;
            for (let i = 3; i < data.length; i += 4) {
                if (data[i] < 128) clearCount++;
            }
            return clearCount / (64 * 64);
        }

        function render() {
            mainCtx.drawImage(bgCanvas, 0, 0);
            mainCtx.drawImage(fogCanvas, 0, 0);
            for (let leaf of leaves) {
                renderLeaf(mainCtx, leaf);
            }
        }

        function distToSegment(px, py, x1, y1, x2, y2) {
            let l2 = (x2 - x1)**2 + (y2 - y1)**2;
            if (l2 === 0) return Math.sqrt((px - x1)**2 + (py - y1)**2);
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.sqrt((px - (x1 + t * (x2 - x1)))**2 + (py - (y1 + t * (y2 - y1)))**2);
        }

        function handleInputStart(x, y) {
            if (gameState !== 'playing') return;
            initAudio();
            isSwiping = true;
            prevX = x;
            prevY = y;
        }

        function handleInputMove(x, y) {
            if (gameState !== 'playing' || !isSwiping) return;
            
            let brushSize = Math.min(width, height) * 0.12;
            
            fogCtx.globalCompositeOperation = 'destination-out';
            fogCtx.beginPath();
            fogCtx.moveTo(prevX, prevY);
            fogCtx.lineTo(x, y);
            fogCtx.lineWidth = brushSize;
            fogCtx.lineCap = 'round';
            fogCtx.strokeStyle = 'rgba(0,0,0,1)';
            fogCtx.stroke();
            
            let dx = x - prevX;
            let dy = y - prevY;
            let speed = Math.sqrt(dx*dx + dy*dy);
            if (speed > 0) {
                let now = performance.now();
                if (speed > 10 && now - lastSwipeSound > 100) {
                    playSwipe(speed);
                    lastSwipeSound = now;
                }
                
                let nx = dx / speed;
                let ny = dy / speed;
                for (let leaf of leaves) {
                    let dist = distToSegment(leaf.x, leaf.y, prevX, prevY, x, y);
                    if (dist < leaf.radius + brushSize/2) {
                        leaf.vx += nx * speed * 4;
                        leaf.vy += ny * speed * 4;
                        leaf.angularVelocity += (Math.random() - 0.5) * speed * 0.2;
                    }
                }
            }
            
            prevX = x;
            prevY = y;
        }

        function handleInputEnd() {
            isSwiping = false;
        }

        container.addEventListener('touchstart', e => {
            e.preventDefault();
            handleInputStart(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        container.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInputMove(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        container.addEventListener('touchend', e => {
            e.preventDefault();
            handleInputEnd();
        }, {passive: false});

        container.addEventListener('mousedown', e => {
            handleInputStart(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', e => {
            handleInputMove(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', e => {
            handleInputEnd();
        });

        function startGame() {
            initAudio();
            gameState = 'playing';
            startScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            hud.style.opacity = '1';
            
            drawManifest();
            initFog();
            
            leaves = [];
            let numLeaves = Math.floor(width * height / 30000);
            numLeaves = Math.max(10, Math.min(40, numLeaves));
            for (let i = 0; i < numLeaves; i++) {
                leaves.push(new Leaf(Math.random() * width, Math.random() * height));
            }
            
            gameTime = 0;
            score = 0;
            frameCount = 0;
            lastTime = performance.now();
            
            if (reqId) cancelAnimationFrame(reqId);
            reqId = requestAnimationFrame(loop);
        }

        function endGame(win) {
            gameState = 'gameover';
            hud.style.opacity = '0';
            gameOverScreen.classList.add('active');
            
            if (win) {
                endTitle.textContent = "Manifest Revealed";
                endDesc.textContent = `You cleared the frost with ${Math.ceil(MAX_TIME - gameTime)}s left.`;
            } else {
                endTitle.textContent = "Manifest Obscured";
                endDesc.textContent = `The frost took over. You revealed ${Math.floor(score * 100)}%.`;
            }
        }

        btnStart.addEventListener('click', startGame);
        btnRestart.addEventListener('click', startGame);

        function loop(timestamp) {
            if (gameState !== 'playing') return;
            
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = timestamp;
            
            gameTime += dt;
            
            for (let leaf of leaves) {
                leaf.update(dt);
            }
            resolveCollisions();
            
            let escalation = Math.min(1, gameTime / MAX_TIME);
            
            if (Math.random() < 0.02 + escalation * 0.05) {
                let wx = (Math.random() - 0.5) * 1500;
                let wy = (Math.random() - 0.5) * 1500;
                for (let leaf of leaves) {
                    leaf.vx += wx * dt;
                    leaf.vy += wy * dt;
                }
            }
            
            let currentRegen = 0.005 + escalation * 0.02;
            
            fogCtx.globalCompositeOperation = 'source-over';
            fogCtx.fillStyle = isDark ? `rgba(30, 41, 59, ${currentRegen})` : `rgba(241, 245, 249, ${currentRegen})`;
            fogCtx.fillRect(0, 0, width, height);
            
            fogCtx.globalCompositeOperation = 'destination-out';
            for (let leaf of leaves) {
                let speed = Math.sqrt(leaf.vx*leaf.vx + leaf.vy*leaf.vy);
                if (speed > 20) {
                    fogCtx.beginPath();
                    fogCtx.arc(leaf.x, leaf.y, leaf.radius * 1.2, 0, Math.PI*2);
                    fogCtx.fillStyle = `rgba(0,0,0, ${Math.min(1, speed/800)})`;
                    fogCtx.fill();
                }
            }
            
            if (gameTime >= MAX_TIME) {
                endGame(false);
            } else {
                if (frameCount % 15 === 0) {
                    score = getClearedPercentage();
                    scoreDisplay.textContent = `REVEALED: ${Math.floor(score * 100)}%`;
                    if (score >= WIN_THRESHOLD) {
                        endGame(true);
                    }
                }
                timeDisplay.textContent = Math.ceil(MAX_TIME - gameTime) + 's';
            }
            
            render();
            frameCount++;
            reqId = requestAnimationFrame(loop);
        }

        resize();
    </script>
</body>
</html>
