<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registry Eviction — POSIX vs Proprietary</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0e0c;
    --fg: #33ff66;
    --fg-dim: #1a6633;
    --fg-bright: #5cff88;
    --accent: #e8a040;
    --fog: rgba(180, 140, 90, 0.12);
    --panel: rgba(8, 14, 10, 0.94);
    --hud-bg: rgba(6, 10, 8, 0.88);
    --danger: #ff5544;
    --apple: #a8a8aa;
    --btn-bg: #0c1210;
    --btn-border: #33ff66;
    --glow: rgba(51, 255, 102, 0.35);
    --crt-line: rgba(51, 255, 102, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0e0c;
      --fg: #33ff66;
      --fg-dim: #1a6633;
      --fg-bright: #5cff88;
      --accent: #e8a040;
      --fog: rgba(180, 140, 90, 0.12);
      --panel: rgba(8, 14, 10, 0.94);
      --hud-bg: rgba(6, 10, 8, 0.88);
      --danger: #ff5544;
      --apple: #a8a8aa;
      --btn-bg: #0c1210;
      --btn-border: #33ff66;
      --glow: rgba(51, 255, 102, 0.35);
      --crt-line: rgba(51, 255, 102, 0.04);
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #c8d0c4;
      --fg: #0a5c28;
      --fg-dim: #4a7a58;
      --fg-bright: #063818;
      --accent: #b87018;
      --fog: rgba(120, 90, 60, 0.15);
      --panel: rgba(210, 218, 208, 0.96);
      --hud-bg: rgba(200, 210, 200, 0.92);
      --danger: #c03020;
      --apple: #707074;
      --btn-bg: #dce4da;
      --btn-border: #0a5c28;
      --glow: rgba(10, 92, 40, 0.25);
      --crt-line: rgba(10, 92, 40, 0.06);
    }
  }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.35rem;
    padding: 0.5rem 0.7rem;
    font-size: clamp(0.58rem, 2.5vw, 0.76rem);
    letter-spacing: 0.05em;
    background: var(--hud-bg);
    border-bottom: 1px solid var(--fg-dim);
    z-index: 3;
  }
  #hud .val { color: var(--fg-bright); }
  #hud .center { text-align: center; }
  #hud .right { text-align: right; }
  #arena-wrap {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  .overlay.visible {
    opacity: 1;
    visibility: visible;
  }
  .overlay h1 {
    font-size: clamp(0.95rem, 4.5vw, 1.5rem);
    letter-spacing: 0.16em;
    margin-bottom: 0.3rem;
    text-shadow: 0 0 12px var(--glow);
  }
  .overlay .sub {
    font-size: clamp(0.52rem, 2.2vw, 0.7rem);
    color: var(--fg-dim);
    letter-spacing: 0.12em;
    margin-bottom: 0.7rem;
  }
  .overlay p {
    font-size: clamp(0.6rem, 2.6vw, 0.8rem);
    color: var(--fg-dim);
    max-width: 90%;
    text-align: center;
    line-height: 1.55;
    margin-bottom: 1rem;
  }
  .overlay .stats {
    font-size: clamp(0.65rem, 2.8vw, 0.85rem);
    margin-bottom: 0.9rem;
    text-align: center;
    line-height: 1.6;
    color: var(--fg-bright);
  }
  .smoke-btn {
    pointer-events: auto;
    min-width: 44px;
    min-height: 44px;
    padding: 0.7rem 1.7rem;
    font-family: inherit;
    font-size: clamp(0.7rem, 3vw, 0.9rem);
    letter-spacing: 0.12em;
    background: var(--btn-bg);
    color: var(--fg);
    border: 1px solid var(--btn-border);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  .smoke-btn:active {
    transform: scale(0.96);
    box-shadow: 0 0 16px var(--glow);
  }
  #hint-bar {
    flex: 0 0 auto;
    padding: 0.35rem 0.6rem;
    font-size: clamp(0.5rem, 2.1vw, 0.65rem);
    letter-spacing: 0.08em;
    color: var(--fg-dim);
    text-align: center;
    background: var(--hud-bg);
    border-top: 1px solid var(--fg-dim);
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div>ROW <span class="val" id="hud-row">0/5</span></div>
    <div class="center">COMBO <span class="val" id="hud-combo">×1</span></div>
    <div class="right">SCORE <span class="val" id="hud-score">0</span></div>
  </div>
  <div id="arena-wrap">
    <canvas id="game"></canvas>
    <div id="title-overlay" class="overlay visible">
      <h1>REGISTRY EVICTION</h1>
      <div class="sub">POSIX · autumn dusk · 14°C</div>
      <p>Swipe between three terminal columns. Catch falling POSIX glyphs to fill the registry row before the Apple logo silently overwrites your stack.</p>
      <button type="button" class="smoke-btn" data-smoke="start">INITIALIZE</button>
    </div>
    <div id="end-overlay" class="overlay">
      <h1 id="end-title">OVERWRITTEN</h1>
      <div class="sub" id="end-sub">proprietary symbols installed</div>
      <div class="stats" id="end-stats"></div>
      <button type="button" class="smoke-btn" data-smoke="restart">REBOOT</button>
    </div>
  </div>
  <div id="hint-bar">← swipe · lane switch · →</div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  var titleOverlay = document.getElementById('title-overlay');
  var endOverlay = document.getElementById('end-overlay');
  var endTitle = document.getElementById('end-title');
  var endSub = document.getElementById('end-sub');
  var endStats = document.getElementById('end-stats');
  var hudRow = document.getElementById('hud-row');
  var hudCombo = document.getElementById('hud-combo');
  var hudScore = document.getElementById('hud-score');

  var POSIX = ['ls', 'grep', 'awk', 'sed', 'chmod', 'kill', 'ps', 'echo', 'cat', 'mv', 'cp', 'pwd', 'find', 'ssh', 'tar', 'man', '|', '$', '>', '&&'];
  var DECOYS = ['ls', 'gr€p', 'l0ck', 'sudo™', 'iTerm', 'zsh+', 'plist', 'kqueue', 'launchd', 'Metal'];

  var state = 'title';
  var W = 300, H = 500;
  var lanes = 3;
  var playerLane = 1;
  var laneW = 100;
  var registry = [];
  var registryFilled = 0;
  var overwrite = 0;
  var overwriteRate = 0.018;
  var score = 0;
  var combo = 1;
  var maxCombo = 1;
  var items = [];
  var particles = [];
  var spawnTimer = 0;
  var spawnInterval = 1.1;
  var elapsed = 0;
  var shake = 0;
  var flash = 0;
  var playerY = 0;
  var laneAnim = 1;
  var targetLane = 1;
  var darkMode = true;
  var audioCtx = null;
  var scanOffset = 0;
  var fogPhase = 0;
  var hitStop = 0;

  var colors = {
    bg: '#0a0e0c',
    fg: '#33ff66',
    fgDim: '#1a6633',
    fgBright: '#5cff88',
    accent: '#e8a040',
    fog: 'rgba(180,140,90,0.12)',
    danger: '#ff5544',
    apple: '#a8a8aa',
    glow: 'rgba(51,255,102,0.35)',
    crtLine: 'rgba(51,255,102,0.04)',
    slotEmpty: 'rgba(51,255,102,0.15)',
    slotFill: '#33ff66',
    slotBad: '#ff5544'
  };

  function readTheme() {
    darkMode = !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    if (!darkMode) {
      colors.bg = '#c8d0c4';
      colors.fg = '#0a5c28';
      colors.fgDim = '#4a7a58';
      colors.fgBright = '#063818';
      colors.accent = '#b87018';
      colors.fog = 'rgba(120,90,60,0.15)';
      colors.danger = '#c03020';
      colors.apple = '#707074';
      colors.glow = 'rgba(10,92,40,0.25)';
      colors.crtLine = 'rgba(10,92,40,0.06)';
      colors.slotEmpty = 'rgba(10,92,40,0.12)';
      colors.slotFill = '#0a5c28';
      colors.slotBad = '#c03020';
    } else {
      colors.bg = '#0a0e0c';
      colors.fg = '#33ff66';
      colors.fgDim = '#1a6633';
      colors.fgBright = '#5cff88';
      colors.accent = '#e8a040';
      colors.fog = 'rgba(180,140,90,0.12)';
      colors.danger = '#ff5544';
      colors.apple = '#a8a8aa';
      colors.glow = 'rgba(51,255,102,0.35)';
      colors.crtLine = 'rgba(51,255,102,0.04)';
      colors.slotEmpty = 'rgba(51,255,102,0.15)';
      colors.slotFill = '#33ff66';
      colors.slotBad = '#ff5544';
    }
  }

  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) mq.addEventListener('change', readTheme);
    else if (mq.addListener) mq.addListener(readTheme);
  }
  readTheme();

  function resize() {
    if (!canvas) return;
    var wrap = canvas.parentElement;
    if (!wrap) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth || 300;
    H = wrap.clientHeight || 400;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    laneW = W / lanes;
    playerY = H - Math.max(56, H * 0.11);
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { /* noop */ }
  }

  function beep(freq, dur, vol) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* noop */ }
  }

  function vibrate(ms) {
    try {
      if (navigator.vibrate) navigator.vibrate(ms);
    } catch (e) { /* noop */ }
  }

  function pickTargets() {
    var pool = POSIX.slice();
    var row = [];
    var used = {};
    for (var i = 0; i < 5; i++) {
      var idx = Math.floor(Math.random() * pool.length);
      var g = pool[idx];
      if (used[g]) {
        i--;
        continue;
      }
      used[g] = true;
      row.push({ glyph: g, status: 'empty' });
    }
    return row;
  }

  function neededGlyphs() {
    var out = [];
    for (var i = 0; i < registry.length; i++) {
      if (registry[i].status === 'empty') out.push(registry[i].glyph);
    }
    return out;
  }

  function resetGame() {
    registry = pickTargets();
    registryFilled = 0;
    overwrite = 0;
    overwriteRate = 0.018;
    score = 0;
    combo = 1;
    maxCombo = 1;
    items = [];
    particles = [];
    spawnTimer = 0;
    spawnInterval = 1.1;
    elapsed = 0;
    shake = 0;
    flash = 0;
    playerLane = 1;
    targetLane = 1;
    laneAnim = 1;
    updateHud();
  }

  function updateHud() {
    if (hudRow) hudRow.textContent = registryFilled + '/5';
    if (hudCombo) hudCombo.textContent = '×' + combo;
    if (hudScore) hudScore.textContent = String(score);
  }

  function spawnItem() {
    var lane = Math.floor(Math.random() * lanes);
    var needed = neededGlyphs();
    var isDecoy = Math.random() < Math.min(0.15 + elapsed * 0.008, 0.45);
    var glyph;
    var kind;

    if (isDecoy) {
      glyph = DECOYS[Math.floor(Math.random() * DECOYS.length)];
      kind = 'decoy';
    } else if (needed.length > 0 && Math.random() < 0.55) {
      glyph = needed[Math.floor(Math.random() * needed.length)];
      kind = 'posix';
    } else {
      glyph = POSIX[Math.floor(Math.random() * POSIX.length)];
      kind = 'posix';
    }

    var speed = 90 + elapsed * 12 + Math.random() * 30;
    items.push({
      lane: lane,
      glyph: glyph,
      kind: kind,
      y: -20,
      speed: speed,
      wobble: Math.random() * Math.PI * 2,
      rot: (Math.random() - 0.5) * 0.08
    });
  }

  function addParticles(x, y, col, n) {
    for (var i = 0; i < (n || 8); i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 120;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.4 + Math.random() * 0.35,
        maxLife: 0.75,
        color: col
      });
    }
  }

  function moveLane(dir) {
    if (state !== 'playing') return;
    var next = targetLane + dir;
    if (next < 0 || next >= lanes) return;
    targetLane = next;
    beep(220 + next * 80, 0.05, 0.04);
  }

  function fillSlot(glyph) {
    for (var i = 0; i < registry.length; i++) {
      if (registry[i].status === 'empty' && registry[i].glyph === glyph) {
        registry[i].status = 'filled';
        registryFilled++;
        score += 100 * combo;
        combo = Math.min(combo + 1, 8);
        if (combo > maxCombo) maxCombo = combo;
        addParticles(laneW * (i + 0.5) * (W / (lanes * 5)) + (W * 0.05), 42, colors.slotFill, 12);
        beep(520 + registryFilled * 60, 0.08, 0.07);
        vibrate(12);
        hitStop = 0.06;
        updateHud();
        if (registryFilled >= 5) endGame(true);
        return true;
      }
    }
    return false;
  }

  function corruptSlot() {
    var empties = [];
    for (var i = 0; i < registry.length; i++) {
      if (registry[i].status === 'empty') empties.push(i);
    }
    if (empties.length === 0) {
      for (var j = 0; j < registry.length; j++) {
        if (registry[j].status === 'filled') empties.push(j);
      }
    }
    if (empties.length === 0) return;
    var idx = empties[Math.floor(Math.random() * empties.length)];
    registry[idx].status = 'corrupt';
    combo = 1;
    shake = 8;
    flash = 0.35;
    score = Math.max(0, score - 50);
    addParticles(W * 0.5, 42, colors.slotBad, 14);
    beep(120, 0.15, 0.08);
    vibrate(30);
    updateHud();

    var corruptCount = 0;
    for (var k = 0; k < registry.length; k++) {
      if (registry[k].status === 'corrupt') corruptCount++;
    }
    if (corruptCount >= 3) endGame(false);
  }

  function catchItem(item) {
    if (item.kind === 'decoy') {
      corruptSlot();
      return;
    }
    if (!fillSlot(item.glyph)) {
      combo = 1;
      score += 10;
      beep(300, 0.04, 0.03);
      updateHud();
    }
  }

  function endGame(won) {
    state = won ? 'won' : 'lost';
    if (endTitle) endTitle.textContent = won ? 'ROW COMMITTED' : 'OVERWRITTEN';
    if (endSub) endSub.textContent = won ? 'POSIX registry intact — for now' : 'proprietary symbols installed';
    if (endStats) {
      endStats.innerHTML = 'SCORE ' + score + '<br>MAX COMBO ×' + maxCombo + '<br>TIME ' + elapsed.toFixed(1) + 's';
    }
    if (endOverlay) endOverlay.classList.add('visible');
    beep(won ? 660 : 90, won ? 0.2 : 0.25, 0.08);
    vibrate(won ? 20 : 40);
  }

  function startGame() {
    initAudio();
    resetGame();
    state = 'playing';
    if (titleOverlay) titleOverlay.classList.remove('visible');
    if (endOverlay) endOverlay.classList.remove('visible');
  }

  function drawAppleLogo(cx, cy, r, alpha) {
    if (!ctx) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.fillStyle = colors.apple;
    ctx.beginPath();
    ctx.arc(0, 2, r * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-r * 0.12, -r * 0.38);
    ctx.quadraticCurveTo(0, -r * 0.62, r * 0.18, -r * 0.42);
    ctx.quadraticCurveTo(r * 0.05, -r * 0.52, -r * 0.12, -r * 0.38);
    ctx.fill();
    ctx.restore();
  }

  function drawBackground() {
    if (!ctx) return;
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, colors.bg);
    grad.addColorStop(0.55, colors.bg);
    grad.addColorStop(1, darkMode ? '#1a1410' : '#b8a890');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    fogPhase += 0.008;
    for (var f = 0; f < 4; f++) {
      var fy = H * (0.55 + f * 0.12) + Math.sin(fogPhase + f) * 12;
      var fg = ctx.createLinearGradient(0, fy - 30, 0, fy + 40);
      fg.addColorStop(0, 'rgba(0,0,0,0)');
      fg.addColorStop(0.5, colors.fog);
      fg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(0, fy - 30, W, 70);
    }

    ctx.strokeStyle = colors.fgDim;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.35;
    for (var l = 1; l < lanes; l++) {
      var lx = l * laneW;
      ctx.beginPath();
      ctx.setLineDash([4, 8]);
      ctx.moveTo(lx, 70);
      ctx.lineTo(lx, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function drawRegistryRow() {
    if (!ctx) return;
    var slotCount = 5;
    var pad = W * 0.04;
    var totalW = W - pad * 2;
    var slotW = totalW / slotCount - 4;
    var y = 14;
    var h = 36;

    ctx.fillStyle = darkMode ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.35)';
    ctx.fillRect(pad - 4, y - 4, totalW + 8, h + 8);

    for (var i = 0; i < slotCount; i++) {
      var sx = pad + i * (slotW + 4);
      var st = registry[i] ? registry[i].status : 'empty';
      var fill = colors.slotEmpty;
      if (st === 'filled') fill = colors.slotFill;
      else if (st === 'corrupt') fill = colors.slotBad;

      ctx.fillStyle = fill;
      ctx.globalAlpha = st === 'empty' ? 0.25 : 0.55;
      ctx.fillRect(sx, y, slotW, h);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = st === 'corrupt' ? colors.danger : colors.fgDim;
      ctx.lineWidth = 1;
      ctx.strokeRect(sx, y, slotW, h);

      ctx.fillStyle = st === 'corrupt' ? colors.danger : colors.fgBright;
      ctx.font = 'bold ' + Math.min(14, slotW * 0.38) + 'px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var label = registry[i] ? registry[i].glyph : '?';
      if (st === 'corrupt') label = '';
      ctx.fillText(label, sx + slotW / 2, y + h / 2);
    }

    var barY = y + h + 10;
    var barH = 8;
    ctx.fillStyle = darkMode ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
    ctx.fillRect(pad, barY, totalW, barH);
    var ow = totalW * overwrite;
    var og = ctx.createLinearGradient(pad, 0, pad + ow, 0);
    og.addColorStop(0, colors.apple);
    og.addColorStop(1, colors.danger);
    ctx.fillStyle = og;
    ctx.fillRect(pad, barY, ow, barH);
    drawAppleLogo(pad + totalW - 10, barY + barH / 2, 14, 0.5 + overwrite * 0.5);

    ctx.fillStyle = colors.fgDim;
    ctx.font = Math.min(9, W * 0.024) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SILENT OVERWRITE', pad, barY - 3);
  }

  function drawPlayer() {
    if (!ctx) return;
    laneAnim += (targetLane - laneAnim) * 0.22;
    playerLane = Math.round(laneAnim);
    var px = laneAnim * laneW + laneW / 2;
    var py = playerY;

    ctx.save();
    ctx.translate(px, py);
    ctx.fillStyle = colors.fgBright;
    ctx.globalAlpha = 0.2;
    ctx.beginPath();
    ctx.arc(0, 0, laneW * 0.38, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = colors.fg;
    ctx.lineWidth = 2;
    ctx.shadowColor = colors.glow;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(-laneW * 0.28, 8);
    ctx.lineTo(0, -10);
    ctx.lineTo(laneW * 0.28, 8);
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = colors.fg;
    ctx.font = 'bold 11px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('>_', 0, 22);
    ctx.restore();
  }

  function drawItems() {
    if (!ctx) return;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var x = it.lane * laneW + laneW / 2 + Math.sin(it.wobble + elapsed * 3) * 3;
      ctx.save();
      ctx.translate(x, it.y);
      ctx.rotate(it.rot);

      var isBad = it.kind === 'decoy';
      ctx.fillStyle = isBad ? 'rgba(168,168,170,0.28)' : 'rgba(51,255,102,0.12)';
      if (!darkMode) ctx.fillStyle = isBad ? 'rgba(112,112,116,0.28)' : 'rgba(10,92,40,0.12)';
      ctx.fillRect(-laneW * 0.32, -12, laneW * 0.64, 24);
      if (isBad) {
        ctx.fillStyle = colors.danger;
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(laneW * 0.18, -6, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.strokeStyle = isBad ? colors.apple : colors.fg;
      ctx.lineWidth = 1;
      ctx.strokeRect(-laneW * 0.32, -12, laneW * 0.64, 24);

      ctx.fillStyle = isBad ? colors.apple : colors.fgBright;
      ctx.font = 'bold ' + Math.min(13, laneW * 0.22) + 'px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(it.glyph, 0, 0);
      ctx.restore();
    }
  }

  function drawParticles() {
    if (!ctx) return;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawCRT() {
    if (!ctx) return;
    scanOffset = (scanOffset + 1.2) % 4;
    ctx.fillStyle = colors.crtLine;
    for (var y = scanOffset; y < H; y += 4) {
      ctx.fillRect(0, y, W, 1);
    }
    var vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, darkMode ? 'rgba(0,0,0,0.45)' : 'rgba(0,0,0,0.15)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    if (flash > 0) {
      ctx.fillStyle = colors.danger;
      ctx.globalAlpha = flash * 0.25;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  function update(dt) {
    if (state !== 'playing') return;
    if (hitStop > 0) {
      hitStop -= dt;
      return;
    }
    elapsed += dt;
    overwrite += overwriteRate * dt;
    overwriteRate = 0.018 + elapsed * 0.0012;
    spawnInterval = Math.max(0.35, 1.1 - elapsed * 0.015);

    if (overwrite >= 1) {
      overwrite = 1;
      endGame(false);
      return;
    }

    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnItem();
      if (Math.random() < 0.25 + elapsed * 0.01) spawnItem();
    }

    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.y += it.speed * dt;
      it.wobble += dt * 2;

      var catchY = playerY - 18;
      if (Math.abs(it.y - catchY) < 24 && it.lane === targetLane) {
        catchItem(it);
        items.splice(i, 1);
        continue;
      }
      if (it.y > H + 30) {
        if (it.kind === 'posix' && neededGlyphs().indexOf(it.glyph) >= 0) {
          combo = 1;
          updateHud();
        }
        items.splice(i, 1);
      }
    }

    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 180 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(j, 1);
    }

    if (shake > 0) shake *= 0.85;
    if (flash > 0) flash -= dt * 1.5;
  }

  function render() {
    if (!ctx) return;
    ctx.save();
    var sx = (Math.random() - 0.5) * shake;
    var sy = (Math.random() - 0.5) * shake;
    ctx.translate(sx, sy);

    drawBackground();
    drawRegistryRow();
    drawItems();
    drawPlayer();
    drawParticles();
    drawCRT();
    ctx.restore();
  }

  var last = 0;
  function loop(ts) {
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  var touchStartX = 0;
  var touchStartY = 0;
  var touchMoved = false;

  function onTouchStart(e) {
    if (e.cancelable) e.preventDefault();
    if (!e.touches || !e.touches[0]) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMoved = false;
  }

  function onTouchMove(e) {
    if (e.cancelable) e.preventDefault();
  }

  function onTouchEnd(e) {
    if (e.cancelable) e.preventDefault();
    if (!e.changedTouches || !e.changedTouches[0]) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) {
      moveLane(dx > 0 ? 1 : -1);
      touchMoved = true;
    }
  }

  function onKeyDown(e) {
    if (!e) return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
  }

  var startBtn = document.querySelector('[data-smoke="start"]');
  var restartBtn = document.querySelector('[data-smoke="restart"]');
  if (startBtn) startBtn.addEventListener('click', startGame);
  if (restartBtn) restartBtn.addEventListener('click', startGame);

  if (canvas) {
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('mousedown', function (e) {
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      touchMoved = false;
    });
    canvas.addEventListener('mouseup', function (e) {
      var dx = e.clientX - touchStartX;
      var dy = e.clientY - touchStartY;
      if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
    });
  }

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', resize);

  resize();
  render();
  requestAnimationFrame(loop);

  if (!ctx) {
    if (titleOverlay) {
      var p = titleOverlay.querySelector('p');
      if (p) p.textContent = 'Canvas unavailable in this browser.';
    }
  }
})();
</script>
</body>
</html>
