<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inference Tree</title>
<style>
  :root {
    --bg: #f4f4f6;
    --text: #1a1a1c;
    --accent: #0066cc;
    --accentDim: rgba(0, 102, 204, 0.2);
    --danger: #dd1144;
    --node: #cccccc;
    --hitZone: rgba(0, 0, 0, 0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0c;
      --text: #e0e0e0;
      --accent: #00ffcc;
      --accentDim: rgba(0, 255, 204, 0.2);
      --danger: #ff3366;
      --node: #444444;
      --hitZone: rgba(255, 255, 255, 0.03);
    }
  }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--bg); color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  #gameCanvas {
    display: block; width: 100vw; height: 100vh;
  }
  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column;
  }
  #hud {
    padding: 20px; display: flex; flex-direction: column; gap: 10px;
    padding-top: max(20px, env(safe-area-inset-top));
  }
  #sentence {
    font-size: 18px; min-height: 24px; color: var(--accent);
    word-wrap: break-word; text-shadow: 0 0 8px var(--accentDim);
    font-weight: bold;
  }
  #stats {
    font-size: 14px; opacity: 0.8; letter-spacing: 1px;
  }
  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: var(--bg); pointer-events: none; text-align: center; padding: 20px;
    box-sizing: border-box; z-index: 10;
  }
  h1 { margin: 0 0 10px 0; font-size: 32px; letter-spacing: 4px; color: var(--accent); }
  p { margin: 0 0 30px 0; font-size: 14px; opacity: 0.7; max-width: 300px; line-height: 1.5; }
  #finalSentence { margin-bottom: 30px; font-size: 16px; line-height: 1.4; word-wrap: break-word; color: var(--accent); font-style: italic; max-width: 80%; }
  
  button {
    background: var(--accent); color: var(--bg); border: none;
    padding: 15px 40px; font-size: 18px; font-family: inherit; font-weight: bold;
    border-radius: 30px; cursor: pointer; text-transform: uppercase;
    box-shadow: 0 0 15px var(--accentDim); pointer-events: auto;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="hud">
      <div id="sentence"></div>
      <div id="stats">SCORE: <span id="scoreVal">0</span> &nbsp;&nbsp; INTEGRITY: <span id="healthVal">♥♥♥</span></div>
    </div>
    <div id="startScreen" class="screen">
      <h1>INFERENCE</h1>
      <p>Tap when the wave aligns with a node in the hit zone.</p>
      <button data-smoke="start" id="startBtn">INITIALIZE</button>
    </div>
    <div id="gameOverScreen" class="screen" style="display: none;">
      <h1>SYSTEM HALTED</h1>
      <p>Tokens generated: <span id="finalScore">0</span></p>
      <p id="finalSentence"></p>
      <button data-smoke="restart" id="restartBtn">REBOOT</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let colors = {};
    function updateColors() {
      const style = getComputedStyle(document.documentElement);
      colors = {
        bg: style.getPropertyValue('--bg').trim(),
        text: style.getPropertyValue('--text').trim(),
        accent: style.getPropertyValue('--accent').trim(),
        accentDim: style.getPropertyValue('--accentDim').trim(),
        danger: style.getPropertyValue('--danger').trim(),
        node: style.getPropertyValue('--node').trim(),
        hitZone: style.getPropertyValue('--hitZone').trim()
      };
    }
    updateColors();
    const mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    if (mql) mql.addEventListener('change', updateColors);

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioContext ? new AudioContext() : null;
    
    function playSound(type) {
      if (!audioCtx || audioCtx.state === 'suspended') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        let now = audioCtx.currentTime;
        if (type === 'hit') {
          const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
          osc.type = 'sine';
          osc.frequency.setValueAtTime(scale[score % scale.length], now);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'miss') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    const words = [
      "the", "a", "is", "of", "and", "in", "to", "it", "that", "for", "on", "with", "as", "by", "at",
      "data", "node", "tree", "branch", "path", "loop", "sync", "wave", "pulse", "core", "void", "null",
      "token", "state", "flow", "stream", "logic", "shift", "phase", "cycle", "link", "root", "leaf",
      "generate", "predict", "infer", "compute", "resolve", "collapse", "expand", "align", "steer",
      "neon", "cyber", "quantum", "neural", "latent", "hidden", "deep", "dark", "light", "fast", "slow"
    ];

    let state = 'start';
    let stateTime = 0;
    let score = 0;
    let health = 3;
    let cameraY = 0;
    let cameraX = 0;
    let targetCameraX = 0;
    let scrollSpeed = 150;
    let sweepSpeed = 6;
    let branchCount = 2;
    let activeNodes = [];
    let currentNode = null;
    let sentence = [];
    let fullSentence = [];
    let particles = [];
    let hitPause = 0;
    let shake = 0;
    let time = 0;
    let nodeIdCounter = 0;

    function createNode(x, y, parent) {
      return {
        id: nodeIdCounter++,
        x: x,
        y: y,
        parent: parent,
        word: words[Math.floor(Math.random() * words.length)]
      };
    }

    function generateChildren(parents, count) {
      let children = [];
      const spacingX = 120;
      const rowSpacingY = 180;
      
      parents.forEach(p => {
        let startX = p.x - (spacingX * (count - 1)) / 2;
        for (let i = 0; i < count; i++) {
          children.push(createNode(startX + i * spacingX, p.y + rowSpacingY, p));
        }
      });
      return children;
    }

    function initTree() {
      nodeIdCounter = 0;
      currentNode = createNode(0, 0, null);
      activeNodes = [];
      activeNodes[0] = generateChildren([currentNode], branchCount);
      activeNodes[1] = generateChildren(activeNodes[0], branchCount);
      activeNodes[2] = generateChildren(activeNodes[1], branchCount);
    }

    function updateHUD() {
      document.getElementById('sentence').innerText = sentence.join(' ') + (state === 'playing' ? '_' : '');
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('healthVal').innerText = '♥'.repeat(Math.max(0, health));
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 200,
          vy: (Math.random() - 0.5) * 200,
          life: 0.5 + Math.random() * 0.5,
          color: color
        });
      }
    }

    function advanceTree(selectedNode) {
      currentNode = selectedNode;
      targetCameraX = selectedNode.x;
      
      activeNodes[0] = activeNodes[1].filter(n => n.parent === selectedNode);
      activeNodes[1] = activeNodes[2].filter(n => activeNodes[0].includes(n.parent));
      activeNodes[2] = generateChildren(activeNodes[1], branchCount);
      
      score++;
      sentence.push(selectedNode.word);
      fullSentence.push(selectedNode.word);
      if (sentence.length > 6) sentence.shift();
      
      scrollSpeed += 2;
      sweepSpeed += 0.1;
      
      if (score === 15) branchCount = 3;
      if (score === 40) branchCount = 4;
      
      updateHUD();
    }

    function getSweeperX() {
      if (!activeNodes[0] || activeNodes[0].length === 0) return W/2;
      let minX = W/2 + (activeNodes[0][0].x - cameraX);
      let maxX = W/2 + (activeNodes[0][activeNodes[0].length - 1].x - cameraX);
      let phase = (Math.sin(time * sweepSpeed) + 1) / 2;
      return minX + (maxX - minX) * phase;
    }

    function takeDamage() {
      health--;
      shake = 20;
      playSound('miss');
      updateHUD();
      
      try {
        if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
      } catch(e) {}
      
      let flash = document.createElement('div');
      flash.style.position = 'absolute';
      flash.style.top = '0'; flash.style.left = '0';
      flash.style.width = '100%'; flash.style.height = '100%';
      flash.style.background = colors.danger;
      flash.style.opacity = '0.4';
      flash.style.pointerEvents = 'none';
      flash.style.transition = 'opacity 0.2s';
      flash.style.zIndex = '5';
      document.body.appendChild(flash);
      
      flash.getBoundingClientRect();
      flash.style.opacity = '0';
      setTimeout(() => flash.remove(), 200);
      
      if (health <= 0) {
        state = 'gameover';
        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalSentence').innerText = fullSentence.join(' ') + '.';
        document.getElementById('gameOverScreen').style.display = 'flex';
      }
    }

    function autoAdvance() {
      if (!activeNodes[0] || activeNodes[0].length === 0) return;
      let sweeperX = getSweeperX();
      let closestNode = activeNodes[0][0];
      let minDist = Infinity;
      activeNodes[0].forEach(n => {
        let nScreenX = W/2 + (n.x - cameraX);
        let dist = Math.abs(nScreenX - sweeperX);
        if (dist < minDist) {
          minDist = dist;
          closestNode = n;
        }
      });
      advanceTree(closestNode);
    }

    function startGame() {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      
      score = 0;
      health = 3;
      scrollSpeed = 150;
      sweepSpeed = 6;
      branchCount = 2;
      sentence = [];
      fullSentence = [];
      particles = [];
      cameraY = 0;
      cameraX = 0;
      targetCameraX = 0;
      time = 0;
      stateTime = 0;
      
      initTree();
      updateHUD();
      
      state = 'playing';
      
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    function handleTap() {
      if (state !== 'playing' || stateTime < 0.2) return;
      if (!activeNodes[0] || activeNodes[0].length === 0) return;

      let hitLineY = H * 0.75;
      let rowY = activeNodes[0][0].y;
      let screenY = hitLineY - (rowY - cameraY);

      if (Math.abs(screenY - hitLineY) <= 60) {
        let sweeperX = getSweeperX();
        let closestNode = null;
        let minDist = Infinity;

        activeNodes[0].forEach(n => {
          let nScreenX = W/2 + (n.x - cameraX);
          let dist = Math.abs(nScreenX - sweeperX);
          if (dist < minDist) {
            minDist = dist;
            closestNode = n;
          }
        });

        if (minDist <= 50) {
          playSound('hit');
          createParticles(sweeperX, screenY, colors.accent);
          hitPause = 0.05;
          advanceTree(closestNode);
          try { if (navigator.vibrate) navigator.vibrate(15); } catch(e) {}
        } else {
          takeDamage();
          if (health > 0) autoAdvance();
        }
      } else {
        takeDamage();
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      if (e.cancelable) e.preventDefault();
      handleTap();
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        handleTap();
      }
    });

    function drawGrid() {
      ctx.strokeStyle = colors.hitZone;
      ctx.lineWidth = 1;
      let gridSize = 40;
      let offsetX = cameraX % gridSize;
      let offsetY = cameraY % gridSize;
      
      ctx.beginPath();
      for (let x = -offsetX; x < W; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, H);
      }
      for (let y = offsetY; y < H; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(W, y);
      }
      ctx.stroke();
    }

    function draw() {
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, W, H);
      
      if (state !== 'playing' && state !== 'gameover') return;
      
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        shake *= 0.9;
        if (shake < 0.5) shake = 0;
      }
      
      drawGrid();
      
      let hitLineY = H * 0.75;
      
      // Hit Zone
      ctx.fillStyle = colors.hitZone;
      ctx.fillRect(0, hitLineY - 60, W, 120);
      ctx.strokeStyle = colors.accentDim;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, hitLineY - 60); ctx.lineTo(W, hitLineY - 60);
      ctx.moveTo(0, hitLineY + 60); ctx.lineTo(W, hitLineY + 60);
      ctx.stroke();
      
      ctx.lineWidth = 2;
      ctx.strokeStyle = colors.node;
      
      function drawLines(parents, children, alpha) {
        ctx.globalAlpha = alpha;
        children.forEach(c => {
          let p = c.parent;
          if (p) {
            let px = W/2 + (p.x - cameraX);
            let py = hitLineY - (p.y - cameraY);
            let cx = W/2 + (c.x - cameraX);
            let cy = hitLineY - (c.y - cameraY);
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(cx, cy);
            ctx.stroke();
          }
        });
      }
      
      drawLines([currentNode], activeNodes[0], 1.0);
      drawLines(activeNodes[0], activeNodes[1], 0.5);
      drawLines(activeNodes[1], activeNodes[2], 0.15);
      
      ctx.globalAlpha = 1.0;
      
      let sweeperX = getSweeperX();
      
      function drawNodeArray(nodes, alpha, isTargetRow) {
        ctx.globalAlpha = alpha;
        nodes.forEach(n => {
          let nx = W/2 + (n.x - cameraX);
          let ny = hitLineY - (n.y - cameraY);
          
          let inZone = isTargetRow && Math.abs(ny - hitLineY) <= 60;
          let distToSweeper = Math.abs(nx - sweeperX);
          let isHovered = inZone && distToSweeper <= 50;
          
          if (isHovered) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.accent;
            ctx.fillStyle = colors.accent;
          } else {
            ctx.shadowBlur = 0;
            ctx.fillStyle = colors.bg;
          }
          
          ctx.beginPath();
          ctx.arc(nx, ny, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = isTargetRow ? colors.accent : colors.node;
          ctx.lineWidth = isTargetRow ? 3 : 2;
          ctx.stroke();
          ctx.shadowBlur = 0;
          
          ctx.fillStyle = isHovered ? colors.bg : colors.text;
          ctx.font = "12px ui-monospace, 'SFMono-Regular', Menlo, monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(n.word, nx, ny - 28);
        });
      }
      
      drawNodeArray(activeNodes[2], 0.15, false);
      drawNodeArray(activeNodes[1], 0.5, false);
      drawNodeArray(activeNodes[0], 1.0, true);
      
      // Current Node
      let cx = W/2 + (currentNode.x - cameraX);
      let cy = hitLineY - (currentNode.y - cameraY);
      let pulse = 1 + 0.15 * Math.sin(time * 8);
      ctx.beginPath();
      ctx.arc(cx, cy, 20 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = colors.accentDim;
      ctx.fill();
      ctx.strokeStyle = colors.accent;
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // Sweeper
      ctx.shadowBlur = 15;
      ctx.shadowColor = colors.accent;
      ctx.strokeStyle = colors.accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sweeperX, hitLineY - 70);
      ctx.lineTo(sweeperX, hitLineY + 70);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.arc(sweeperX, hitLineY, 8, 0, Math.PI * 2);
      ctx.fillStyle = colors.accent;
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      });
      ctx.globalAlpha = 1.0;
      
      ctx.restore();
    }

    let lastTime = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      let dt = (now - lastTime) / 1000;
      lastTime = now;
      if (dt > 0.1) dt = 0.1;
      
      if (state === 'playing') {
        if (hitPause > 0) {
          hitPause -= dt;
        } else {
          time += dt;
          stateTime += dt;
          cameraY += scrollSpeed * dt;
          cameraX += (targetCameraX - cameraX) * 10 * dt;
          
          if (activeNodes[0] && activeNodes[0].length > 0) {
            let rowY = activeNodes[0][0].y;
            let screenY = H * 0.75 - (rowY - cameraY);
            
            if (screenY > H * 0.75 + 60) {
              takeDamage();
              if (health > 0) autoAdvance();
            }
          }
          
          particles.forEach(p => {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
          });
          particles = particles.filter(p => p.life > 0);
        }
      }
      
      draw();
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
