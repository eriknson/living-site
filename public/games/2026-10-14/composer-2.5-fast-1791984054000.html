<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Index Rush</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#071008;--bg2:#0c1a0f;--fg:#b8ffc8;--muted:#4a7a58;
  --neon:#00ff66;--neon-dim:#00cc52;--accent:#00e8ff;--warn:#ffb020;--danger:#ff4466;
  --glass:rgba(0,255,102,.04);--border:rgba(0,255,102,.18);
  --overlay:rgba(4,12,6,.88);--lane-bg:rgba(0,255,102,.03);
  --btn-fg:#041008;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#e8f5ea;--bg2:#d4ead8;--fg:#0a2812;--muted:#3d6b4a;
    --neon:#008833;--neon-dim:#006628;--accent:#007799;--warn:#cc7700;--danger:#cc2244;
    --glass:rgba(0,100,40,.06);--border:rgba(0,100,40,.22);
    --overlay:rgba(232,245,234,.92);--lane-bg:rgba(0,100,40,.05);
    --btn-fg:#f0fff2;
  }
}
html,body{width:100%;height:100%;min-height:100dvh;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;display:flex;flex-direction:column}
#canvas{flex:1;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
#hud{position:absolute;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 6px;
  pointer-events:none;z-index:2;display:flex;flex-direction:column;gap:6px}
.hud-row{display:flex;justify-content:space-between;align-items:center;
  font:500 11px ui-monospace,'SFMono-Regular',Menlo,monospace;color:var(--muted)}
#score-val{color:var(--neon);font-weight:700;font-size:13px}
#combo-val{color:var(--accent);font-weight:600}
#index-wrap{width:100%;height:5px;background:var(--glass);border:1px solid var(--border);border-radius:3px;overflow:hidden}
#index-bar{height:100%;width:0;background:var(--neon);border-radius:2px;transition:width .25s ease-out;
  box-shadow:0 0 8px color-mix(in srgb,var(--neon) 50%,transparent)}
#rebuild-wrap{display:flex;align-items:center;gap:8px}
#rebuild-label{font:500 10px ui-monospace,Menlo,monospace;color:var(--muted);white-space:nowrap}
#rebuild-track{flex:1;height:4px;background:var(--glass);border-radius:2px;overflow:hidden}
#rebuild-bar{height:100%;width:100%;background:var(--warn);border-radius:2px;transition:width .1s linear}
#rebuild-bar.critical{background:var(--danger)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--overlay);z-index:10;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.overlay.visible{opacity:1;visibility:visible}
.overlay-content{text-align:center;padding:20px 24px;max-width:360px;pointer-events:none}
.overlay h1{font:700 clamp(26px,7vw,40px)/1.05 ui-monospace,Menlo,monospace;
  letter-spacing:.06em;color:var(--neon);text-shadow:0 0 24px color-mix(in srgb,var(--neon) 40%,transparent);
  margin-bottom:6px}
.overlay .sub{font:400 13px/1.5 system-ui;color:var(--muted);margin-bottom:4px}
.overlay .hint{font:400 11px ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:24px;line-height:1.7}
.overlay .hint kbd{display:inline-block;padding:2px 7px;background:var(--glass);border:1px solid var(--border);
  border-radius:4px;font-size:10px;color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:190px;min-height:48px;
  padding:12px 28px;font:600 14px ui-monospace,Menlo,monospace;letter-spacing:.04em;
  color:var(--btn-fg);background:var(--neon);border:1px solid var(--neon-dim);border-radius:10px;
  cursor:pointer;pointer-events:auto;
  box-shadow:0 0 20px color-mix(in srgb,var(--neon) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.15);
  transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.95)}
.btn-restart{background:var(--accent);border-color:var(--accent);color:var(--btn-fg);
  box-shadow:0 0 20px color-mix(in srgb,var(--accent) 35%,transparent)}
#go-score{font:700 28px ui-monospace,Menlo,monospace;color:var(--neon);margin:10px 0 4px}
#go-detail{font:400 12px ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:22px;line-height:1.6}
.flash-msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);
  font:700 16px ui-monospace,Menlo,monospace;color:var(--neon);opacity:0;pointer-events:none;z-index:5;
  text-shadow:0 0 16px color-mix(in srgb,var(--neon) 60%,transparent);transition:opacity .15s,transform .15s}
.flash-msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="hud-row">
      <span>INDEX <span id="score-val">0</span></span>
      <span id="combo-val"></span>
      <span id="timer-val">60s</span>
    </div>
    <div id="index-wrap"><div id="index-bar"></div></div>
    <div id="rebuild-wrap">
      <span id="rebuild-label">REBUILD</span>
      <div id="rebuild-track"><div id="rebuild-bar"></div></div>
    </div>
  </div>
  <div class="flash-msg" id="flash-msg"></div>
  <div class="overlay visible" id="title-screen">
    <div class="overlay-content">
      <h1>INDEX RUSH</h1>
      <p class="sub">Sort query tokens before the rebuild wipes your clusters.</p>
      <p class="hint">Swipe ← → to shift lanes. Catch each token in its matching lane.<br>
      Oracle circuits hum — fill the index in 60 seconds.<br><kbd>←</kbd> <kbd>→</kbd> on desktop.</p>
      <button class="btn" data-smoke="start" id="btn-start">INITIALIZE</button>
    </div>
  </div>
  <div class="overlay" id="gameover-screen">
    <div class="overlay-content">
      <h1 id="go-title">REBUILD COMPLETE</h1>
      <div id="go-score">0 clusters</div>
      <p id="go-detail">The index was wiped clean.</p>
      <button class="btn btn-restart" data-smoke="restart" id="btn-restart">REINDEX</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var LANE_TYPES = [
  { id:0, label:'SCAN',  color:'#00e8ff' },
  { id:1, label:'FILTER',color:'#ffb020' },
  { id:2, label:'JOIN',  color:'#20a0ff' },
  { id:3, label:'AGG',   color:'#ff5566' }
];
var LANE_TYPE_SORT = { id:4, label:'SORT', color:'#ffe040' };

var ROUND_SEC = 60;
var CATCH_Y_RATIO = 0.82;
var PLAYER_Y_RATIO = 0.88;

var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var scoreEl = document.getElementById('score-val');
var comboEl = document.getElementById('combo-val');
var timerEl = document.getElementById('timer-val');
var indexBar = document.getElementById('index-bar');
var rebuildBar = document.getElementById('rebuild-bar');
var titleScreen = document.getElementById('title-screen');
var gameoverScreen = document.getElementById('gameover-screen');
var goTitle = document.getElementById('go-title');
var goScore = document.getElementById('go-score');
var goDetail = document.getElementById('go-detail');
var flashMsg = document.getElementById('flash-msg');
var btnStart = document.getElementById('btn-start');
var btnRestart = document.getElementById('btn-restart');

var W = 0, H = 0, laneW = 0, laneCount = 3;
var state = 'title';
var playerLane = 1;
var targetLane = 1;
var laneAnim = 0;
var tokens = [];
var clusters = [];
var particles = [];
var gridPulse = 0;
var score = 0;
var combo = 0;
var maxCombo = 0;
var indexFill = 0;
var rebuildProgress = 0;
var timeLeft = ROUND_SEC;
var elapsed = 0;
var spawnTimer = 0;
var spawnInterval = 1.4;
var fallSpeed = 140;
var activeTypes = 2;
var misses = 0;
var lastTime = 0;
var animId = null;
var shake = 0;
var hitPause = 0;
var flashTimer = 0;
var audioCtx = null;
var touchStartX = 0;
var touchStartY = 0;
function isDark(){
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches; }
  catch(e){ return true; }
}

function theme(){
  var d = isDark();
  return {
    bg: d ? '#071008' : '#e8f5ea',
    bg2: d ? '#0c1a0f' : '#d4ead8',
    grid: d ? 'rgba(0,255,102,0.07)' : 'rgba(0,100,40,0.12)',
    gridBright: d ? 'rgba(0,255,102,0.14)' : 'rgba(0,100,40,0.22)',
    neon: d ? '#00ff66' : '#008833',
    muted: d ? '#4a7a58' : '#3d6b4a',
    laneBg: d ? 'rgba(0,255,102,0.03)' : 'rgba(0,100,40,0.05)',
    playerGlow: d ? 'rgba(0,255,102,0.35)' : 'rgba(0,100,40,0.25)'
  };
}

function resize(){
  W = canvas.clientWidth || window.innerWidth;
  H = canvas.clientHeight || window.innerHeight;
  if(W < 1) W = window.innerWidth;
  if(H < 1) H = window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  laneW = W / laneCount;
}

function getActiveLaneTypes(){
  if(activeTypes >= 5) return LANE_TYPES.concat([LANE_TYPE_SORT]);
  return LANE_TYPES.slice(0, activeTypes);
}

function laneTypeAt(i){
  var types = getActiveLaneTypes();
  return types[i] || types[0];
}

function ensureAudio(){
  if(audioCtx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  } catch(e){}
}

function playTone(freq, dur, type, vol){
  if(!audioCtx) return;
  try {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

function playCatch(comboN){
  playTone(220 + comboN * 18, 0.08, 'square', 0.05);
  playTone(440 + comboN * 12, 0.06, 'sine', 0.03);
}

function playMiss(){
  playTone(90, 0.15, 'sawtooth', 0.04);
}

function showFlash(text, color){
  flashMsg.textContent = text;
  flashMsg.style.color = color || theme().neon;
  flashMsg.classList.add('show');
  flashTimer = 0.5;
}

function spawnToken(){
  var types = getActiveLaneTypes();
  var laneIndex = Math.floor(Math.random() * types.length);
  var type = types[laneIndex];
  var spawnLane = Math.floor(Math.random() * laneCount);
  var startX = spawnLane * laneW + laneW * 0.5;
  tokens.push({
    laneIndex: laneIndex,
    label: type.label,
    color: type.color,
    x: startX,
    targetX: laneIndex * laneW + laneW * 0.5,
    y: -24,
    speed: fallSpeed * (0.85 + Math.random() * 0.3),
    drift: 0,
    trail: [],
    glow: 0
  });
}

function spawnCluster(lane, color){
  var cx = lane * laneW + laneW * 0.5;
  var cy = H * 0.12 + Math.random() * H * 0.38;
  var nodes = [];
  var edges = [];
  var n = 4 + Math.floor(Math.random() * 4);
  var i, j;
  for(i = 0; i < n; i++){
    nodes.push({
      x: cx + (Math.random() - 0.5) * laneW * 0.65,
      y: cy + (Math.random() - 0.5) * 36,
      r: 2 + Math.random() * 3
    });
  }
  for(i = 0; i < n; i++){
    for(j = i + 1; j < n; j++){
      if(Math.random() > 0.55) edges.push([i, j]);
    }
  }
  clusters.push({ nodes:nodes, edges:edges, color:color, alpha:0, pulse:0, lane:lane });
  for(var j = 0; j < 12; j++){
    particles.push({
      x: cx, y: H * CATCH_Y_RATIO,
      vx: (Math.random()-0.5)*120, vy: (Math.random()-0.5)*120 - 40,
      life: 0.4 + Math.random()*0.3, color: color, size: 2 + Math.random()*2
    });
  }
}

function burstParticles(x, y, color, n){
  for(var i = 0; i < n; i++){
    var ang = Math.random() * Math.PI * 2;
    var spd = 60 + Math.random() * 100;
    particles.push({
      x:x, y:y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      life:0.3+Math.random()*0.4, color:color, size:1.5+Math.random()*2
    });
  }
}

function moveLane(dir){
  if(state !== 'playing') return;
  var next = playerLane + dir;
  if(next < 0 || next >= laneCount) return;
  playerLane = next;
  targetLane = next;
  try { navigator.vibrate && navigator.vibrate(8); } catch(e){}
  playTone(180 + next * 40, 0.04, 'triangle', 0.025);
}

function handleSwipe(dx){
  if(Math.abs(dx) < 28) return;
  moveLane(dx > 0 ? 1 : -1);
}

function updateHUD(){
  scoreEl.textContent = String(score);
  comboEl.textContent = combo > 1 ? 'x' + combo + ' COMBO' : '';
  timerEl.textContent = Math.ceil(timeLeft) + 's';
  indexBar.style.width = Math.min(100, indexFill) + '%';
  var rb = Math.max(0, 100 - rebuildProgress);
  rebuildBar.style.width = rb + '%';
  rebuildBar.classList.toggle('critical', rb < 25);
}

function setDifficulty(t){
  var prog = Math.min(1, t / ROUND_SEC);
  activeTypes = prog < 0.2 ? 3 : prog < 0.45 ? 4 : 5;
  var newCount = activeTypes;
  if(newCount !== laneCount){
    laneCount = newCount;
    laneW = W / laneCount;
    if(playerLane >= laneCount) playerLane = laneCount - 1;
    targetLane = playerLane;
  }
  spawnInterval = Math.max(0.5, 1.35 - prog * 0.8);
  fallSpeed = 130 + prog * 140;
  rebuildProgress = Math.min(100, rebuildProgress + (0.28 + prog * 0.55) * (1/60));
}

function catchToken(tok){
  tok.caught = true;
  score += 10 + combo * 2;
  combo++;
  if(combo > maxCombo) maxCombo = combo;
  indexFill = Math.min(100, indexFill + 2.5 + combo * 0.3);
  rebuildProgress = Math.max(0, rebuildProgress - 4 - combo * 0.5);
  spawnCluster(tok.laneIndex, tok.color);
  playCatch(combo);
  hitPause = 0.04;
  shake = 3;
  gridPulse = 1;
  if(combo % 5 === 0) showFlash(combo + ' COMBO', tok.color);
  try { navigator.vibrate && navigator.vibrate(15); } catch(e){}
}

function missToken(tok){
  tok.missed = true;
  combo = 0;
  misses++;
  rebuildProgress = Math.min(100, rebuildProgress + 8);
  indexFill = Math.max(0, indexFill - 3);
  playMiss();
  shake = 8;
  burstParticles(tok.x, tok.y, '#ff4466', 8);
  try { navigator.vibrate && navigator.vibrate([20,30,20]); } catch(e){}
}

function endGame(reason){
  state = 'gameover';
  titleScreen.classList.remove('visible');
  gameoverScreen.classList.add('visible');
  if(reason === 'win'){
    goTitle.textContent = 'INDEX COMPLETE';
    goDetail.textContent = 'All clusters indexed before sunrise. Max combo: x' + maxCombo + '.';
  } else if(reason === 'rebuild'){
    goTitle.textContent = 'REBUILD WIPED';
    goDetail.textContent = 'The index collapsed. ' + misses + ' fragments lost. Max combo: x' + maxCombo + '.';
  } else {
    goTitle.textContent = 'SESSION END';
    goDetail.textContent = misses + ' misses · max combo x' + maxCombo;
  }
  goScore.textContent = score + ' pts · ' + clusters.length + ' clusters';
}

function resetGame(){
  tokens = [];
  clusters = [];
  particles = [];
  score = 0;
  combo = 0;
  maxCombo = 0;
  indexFill = 0;
  rebuildProgress = 0;
  timeLeft = ROUND_SEC;
  elapsed = 0;
  spawnTimer = 0;
  spawnInterval = 1.4;
  fallSpeed = 140;
  activeTypes = 3;
  laneCount = 3;
  misses = 0;
  playerLane = 1;
  targetLane = 1;
  laneAnim = 0;
  shake = 0;
  hitPause = 0;
  gridPulse = 0;
  resize();
  updateHUD();
}

function startGame(){
  ensureAudio();
  resetGame();
  state = 'playing';
  titleScreen.classList.remove('visible');
  gameoverScreen.classList.remove('visible');
}

function update(dt){
  if(state !== 'playing'){
    if(hitPause > 0) hitPause -= dt;
    return;
  }
  if(hitPause > 0){ hitPause -= dt; return; }

  elapsed += dt;
  timeLeft = Math.max(0, ROUND_SEC - elapsed);
  setDifficulty(elapsed);
  updateHUD();

  if(rebuildProgress >= 100){ endGame('rebuild'); return; }
  if(timeLeft <= 0){
    endGame(indexFill >= 70 ? 'win' : 'session');
    return;
  }

  spawnTimer += dt;
  if(spawnTimer >= spawnInterval){
    spawnTimer = 0;
    spawnToken();
  }

  var catchY = H * CATCH_Y_RATIO;
  var i;
  for(i = tokens.length - 1; i >= 0; i--){
    var tok = tokens[i];
    tok.y += tok.speed * dt;
    tok.drift += dt;
    tok.x += (tok.targetX - tok.x) * Math.min(1, dt * 2.8);
    tok.glow = 0.5 + Math.sin(tok.drift * 6) * 0.3;
    tok.trail.push({ x: tok.x, y: tok.y });
    if(tok.trail.length > 6) tok.trail.shift();

    if(tok.y >= catchY){
      if(playerLane === tok.laneIndex) catchToken(tok);
      else missToken(tok);
      tokens.splice(i, 1);
    }
  }

  for(i = clusters.length - 1; i >= 0; i--){
    var c = clusters[i];
    if(c.alpha < 1) c.alpha = Math.min(1, c.alpha + dt * 2.5);
    c.pulse = (c.pulse || 0) + dt;
  }

  for(i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 180 * dt;
    p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }

  laneAnim += (targetLane - laneAnim) * Math.min(1, dt * 14);
  if(shake > 0) shake = Math.max(0, shake - dt * 30);
  if(gridPulse > 0) gridPulse = Math.max(0, gridPulse - dt * 3);
  if(flashTimer > 0){
    flashTimer -= dt;
    if(flashTimer <= 0) flashMsg.classList.remove('show');
  }

}

function drawGrid(t){
  var cols = laneCount;
  var rows = Math.ceil(H / 40);
  ctx.strokeStyle = t.grid;
  ctx.lineWidth = 1;
  var i;
  for(i = 0; i <= cols; i++){
    var x = i * laneW;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for(i = 0; i <= rows; i++){
    var y = i * 40;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawLanes(t){
  var types = getActiveLaneTypes();
  var i;
  for(i = 0; i < laneCount; i++){
    var lx = i * laneW;
    ctx.fillStyle = i === Math.round(laneAnim) ? 'rgba(0,255,102,0.06)' : t.laneBg;
    if(!isDark()) ctx.fillStyle = i === Math.round(laneAnim) ? 'rgba(0,100,40,0.1)' : t.laneBg;
    ctx.fillRect(lx + 1, H * 0.72, laneW - 2, H * 0.28);

    var lt = types[i] || types[0];
    ctx.font = '600 10px ui-monospace,Menlo,monospace';
    ctx.fillStyle = lt.color;
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.7;
    ctx.fillText(lt.label, lx + laneW * 0.5, H * 0.96);
    ctx.globalAlpha = 1;

    ctx.strokeStyle = lt.color;
    ctx.globalAlpha = 0.25;
    ctx.strokeRect(lx + 4, H * 0.74, laneW - 8, H * 0.22);
    ctx.globalAlpha = 1;
  }
}

function drawClusters(t){
  var i, j, c, e, pulse;
  for(i = 0; i < clusters.length; i++){
    c = clusters[i];
    pulse = 0.7 + Math.sin((c.pulse || 0) * 3) * 0.3;
    ctx.globalAlpha = c.alpha * 0.8 * pulse;
    ctx.strokeStyle = c.color;
    ctx.lineWidth = 1;
    for(j = 0; j < c.edges.length; j++){
      e = c.edges[j];
      ctx.beginPath();
      ctx.moveTo(c.nodes[e[0]].x, c.nodes[e[0]].y);
      ctx.lineTo(c.nodes[e[1]].x, c.nodes[e[1]].y);
      ctx.stroke();
    }
    ctx.fillStyle = c.color;
    for(j = 0; j < c.nodes.length; j++){
      ctx.beginPath();
      ctx.arc(c.nodes[j].x, c.nodes[j].y, c.nodes[j].r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawTokens(){
  var i, j, tok, tr;
  for(i = 0; i < tokens.length; i++){
    tok = tokens[i];
    ctx.save();
    for(j = 0; j < tok.trail.length; j++){
      tr = tok.trail[j];
      ctx.globalAlpha = (j / tok.trail.length) * 0.25;
      ctx.fillStyle = tok.color;
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowColor = tok.color;
    ctx.shadowBlur = 14 * tok.glow;
    ctx.strokeStyle = tok.color;
    ctx.lineWidth = 2;
    ctx.fillStyle = isDark() ? 'rgba(0,12,4,0.55)' : 'rgba(255,255,255,0.65)';

    var rw = Math.min(laneW * 0.58, 58);
    var rh = 24;
    ctx.beginPath();
    ctx.roundRect(tok.x - rw/2, tok.y - rh/2, rw, rh, 5);
    ctx.fill();
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.font = '700 9px ui-monospace,Menlo,monospace';
    ctx.fillStyle = tok.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tok.label, tok.x, tok.y);

    var laneX = tok.laneIndex * laneW + laneW * 0.5;
    ctx.strokeStyle = tok.color;
    ctx.globalAlpha = 0.15;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.moveTo(tok.x, tok.y + rh/2);
    ctx.lineTo(laneX, H * CATCH_Y_RATIO);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawPlayer(t){
  var px = laneAnim * laneW + laneW * 0.5;
  var py = H * PLAYER_Y_RATIO;
  var pw = laneW * 0.65;

  ctx.save();
  ctx.shadowColor = t.neon;
  ctx.shadowBlur = 18;
  ctx.strokeStyle = t.neon;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px - pw/2, py);
  ctx.lineTo(px + pw/2, py);
  ctx.stroke();

  ctx.fillStyle = t.neon;
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.moveTo(px, py - 10);
  ctx.lineTo(px - 8, py + 4);
  ctx.lineTo(px + 8, py + 4);
  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha = 0.2 + gridPulse * 0.3;
  ctx.fillStyle = t.playerGlow;
  ctx.fillRect(px - pw/2, py - 14, pw, 20);
  ctx.restore();
}

function drawCatchLine(t){
  var y = H * CATCH_Y_RATIO;
  ctx.strokeStyle = t.gridBright;
  ctx.setLineDash([6, 8]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(W, y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawParticles(){
  var i, p;
  for(i = 0; i < particles.length; i++){
    p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawOracleHint(t){
  if(state !== 'playing') return;
  ctx.font = '400 9px ui-monospace,Menlo,monospace';
  ctx.fillStyle = t.muted;
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.5 + Math.sin(elapsed * 2) * 0.15;
  ctx.fillText('oracle query · autumn 11°C · clear night', W * 0.5, H * 0.08);
  ctx.globalAlpha = 1;
}

function render(){
  var t = theme();
  ctx.save();
  if(shake > 0){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  ctx.fillStyle = t.bg;
  ctx.fillRect(0, 0, W, H);

  drawGrid(t);
  drawClusters(t);
  drawLanes(t);
  drawCatchLine(t);
  if(state === 'playing'){
    drawTokens();
    drawPlayer(t);
    drawParticles();
    drawOracleHint(t);
  } else {
    drawIdleScene(t);
  }
  ctx.restore();
}

function drawIdleScene(t){
  var cx = W * 0.5, cy = H * 0.42;
  ctx.strokeStyle = t.neon;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.35;
  var i;
  for(i = 0; i < 6; i++){
    var ang = (Date.now() / 2000 + i / 6) * Math.PI * 2;
    var r = 40 + i * 14;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(ang)*8, cy + Math.sin(ang)*8, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 0.6;
  ctx.font = '600 11px ui-monospace,Menlo,monospace';
  ctx.fillStyle = t.muted;
  ctx.textAlign = 'center';
  ctx.fillText('awaiting initialization…', cx, cy + 90);
  ctx.globalAlpha = 1;
}

function loop(now){
  if(!lastTime) lastTime = now;
  var dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  render();
  animId = requestAnimationFrame(loop);
}

function onKey(e){
  if(e.key === 'ArrowLeft'){ e.preventDefault(); moveLane(-1); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); moveLane(1); }
}

function onTouchStart(e){
  if(e.touches && e.touches[0]){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    try { e.preventDefault(); } catch(ex){}
  }
}

function onTouchMove(e){
  try { e.preventDefault(); } catch(ex){}
}

function onTouchEnd(e){
  if(!e.changedTouches || !e.changedTouches[0]) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > Math.abs(dy)) handleSwipe(dx);
  try { e.preventDefault(); } catch(ex){}
}

function onPointerDown(e){
  touchStartX = e.clientX;
  touchStartY = e.clientY;
}

function onPointerUp(e){
  var dx = e.clientX - touchStartX;
  var dy = e.clientY - touchStartY;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) handleSwipe(dx);
}

function init(){
  if(!ctx){
    canvas.style.background = theme().bg;
    return;
  }
  if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
      r = Math.min(r, w/2, h/2);
      this.moveTo(x+r,y); this.lineTo(x+w-r,y);
      this.quadraticCurveTo(x+w,y,x+w,y+r); this.lineTo(x+w,y+h-r);
      this.quadraticCurveTo(x+w,y+h,x+w-r,y+h); this.lineTo(x+r,y+h);
      this.quadraticCurveTo(x,y+h,x,y+h-r); this.lineTo(x,y+r);
      this.quadraticCurveTo(x,y,x+r,y);
    };
  }

  resize();
  render();

  btnStart.addEventListener('click', function(){ startGame(); });
  btnRestart.addEventListener('click', function(){ startGame(); });

  window.addEventListener('resize', resize);
  window.addEventListener('keydown', onKey);
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointerup', onPointerUp);

  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ render(); });
  } catch(e){}

  animId = requestAnimationFrame(loop);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
})();
</script>
</body>
</html>
