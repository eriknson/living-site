<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HERA — DART Scar Mosaic</title>
<style>
  :root {
    --bg: #060810;
    --bg2: #0c1220;
    --cyan: #3dd9e8;
    --cyan-dim: #1a7a85;
    --cyan-glow: rgba(61, 217, 232, 0.35);
    --amber: #e8a030;
    --amber-glow: rgba(232, 160, 48, 0.4);
    --red: #e84050;
    --text: #c8dce8;
    --text-dim: #5a7080;
    --panel: rgba(6, 8, 16, 0.92);
    --grid: rgba(61, 217, 232, 0.06);
    --line: rgba(61, 217, 232, 0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #060810;
      --bg2: #0c1220;
      --cyan: #3dd9e8;
      --cyan-dim: #1a7a85;
      --cyan-glow: rgba(61, 217, 232, 0.35);
      --amber: #e8a030;
      --amber-glow: rgba(232, 160, 48, 0.4);
      --red: #e84050;
      --text: #c8dce8;
      --text-dim: #5a7080;
      --panel: rgba(6, 8, 16, 0.92);
      --grid: rgba(61, 217, 232, 0.06);
      --line: rgba(61, 217, 232, 0.15);
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e8eef4;
      --bg2: #d4dce8;
      --cyan: #0878a0;
      --cyan-dim: #065a78;
      --cyan-glow: rgba(8, 120, 160, 0.25);
      --amber: #b07010;
      --amber-glow: rgba(176, 112, 16, 0.3);
      --red: #c02030;
      --text: #1a2838;
      --text-dim: #5a7080;
      --panel: rgba(232, 238, 244, 0.94);
      --grid: rgba(8, 120, 160, 0.08);
      --line: rgba(8, 120, 160, 0.2);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100dvw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    position: relative;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    padding-top: max(8px, env(safe-area-inset-top));
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    z-index: 10;
    gap: 8px;
  }
  .hud-block { display: flex; flex-direction: column; gap: 1px; min-width: 56px; }
  .hud-label {
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .hud-value { font-size: 16px; font-weight: 600; color: var(--cyan); }
  #signal-wrap { flex: 1; max-width: 140px; margin: 0 4px; }
  #signal-bg {
    height: 5px;
    background: var(--bg2);
    border: 1px solid var(--cyan-dim);
    border-radius: 1px;
    overflow: hidden;
  }
  #signal-bar {
    height: 100%;
    width: 100%;
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan-glow);
    transition: width 0.2s linear;
  }
  #mosaic-wrap {
    flex: 0 0 auto;
    padding: 6px 14px 4px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .mosaic-label {
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  #mosaic {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
    max-width: 240px;
  }
  .mosaic-tile {
    aspect-ratio: 1;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }
  .mosaic-tile.filled { border-color: var(--cyan-dim); }
  .mosaic-tile canvas { width: 100%; height: 100%; display: block; }
  #arena-wrap {
    flex: 1;
    position: relative;
    min-height: 120px;
  }
  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  #feedback {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(18px, 5vw, 28px);
    font-weight: 700;
    letter-spacing: 0.1em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 5;
    text-shadow: 0 0 12px var(--cyan-glow);
  }
  #feedback.show { opacity: 1; }
  #feedback.perfect { color: var(--amber); text-shadow: 0 0 12px var(--amber-glow); }
  #feedback.good { color: var(--cyan); }
  #feedback.miss { color: var(--red); }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    z-index: 20;
    pointer-events: none;
    transition: opacity 0.4s ease, visibility 0.4s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .overlay-card {
    text-align: center;
    padding: 24px 20px;
    max-width: 320px;
    pointer-events: none;
  }
  .title-main {
    font-size: clamp(22px, 6vw, 36px);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--cyan);
    text-shadow: 0 0 18px var(--cyan-glow);
    margin-bottom: 6px;
  }
  .title-sub {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .overlay-stat {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .overlay-stat span { color: var(--amber); font-weight: 600; }
  .btn {
    pointer-events: auto;
    min-height: 48px;
    min-width: 180px;
    padding: 12px 28px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: 1px solid var(--cyan);
    background: transparent;
    color: var(--cyan);
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .btn:active {
    background: rgba(61, 217, 232, 0.15);
    box-shadow: 0 0 16px var(--cyan-glow);
  }
  @media (prefers-color-scheme: light) {
    .btn:active { background: rgba(8, 120, 160, 0.12); }
  }
  .hint {
    margin-top: 16px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    line-height: 1.6;
  }
  #scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.08) 2px,
      rgba(0, 0, 0, 0.08) 4px
    );
  }
  @media (prefers-color-scheme: light) {
    #scanlines {
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255, 255, 255, 0.12) 2px,
        rgba(255, 255, 255, 0.12) 4px
      );
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Frames</span>
      <span class="hud-value" id="frames-val">0/12</span>
    </div>
    <div id="signal-wrap">
      <span class="hud-label">Signal</span>
      <div id="signal-bg"><div id="signal-bar"></div></div>
    </div>
    <div class="hud-block" style="text-align:right">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="score-val">0</span>
    </div>
  </div>
  <div id="mosaic-wrap">
    <div class="mosaic-label">Impact scar mosaic</div>
    <div id="mosaic"></div>
  </div>
  <div id="arena-wrap">
    <canvas id="canvas"></canvas>
    <div id="scanlines"></div>
    <div id="feedback"></div>
    <div class="overlay" id="title-overlay">
      <div class="overlay-card">
        <div class="title-main">HERA CAM</div>
        <div class="title-sub">Dimorphos flyby · DART impact scar<br>Tap when scan line crosses the bright rim</div>
        <button class="btn" data-smoke="start" id="start-btn" type="button">Begin Flyby</button>
        <div class="hint">Tap screen or press SPACE on alignment<br>Build the mosaic before signal fades</div>
      </div>
    </div>
    <div class="overlay hidden" id="gameover-overlay">
      <div class="overlay-card">
        <div class="title-main" id="go-title">SIGNAL LOST</div>
        <div class="overlay-stat">Frames captured: <span id="go-frames">0</span>/12</div>
        <div class="overlay-stat">Final score: <span id="go-score">0</span></div>
        <button class="btn" data-smoke="restart" id="restart-btn" type="button">Retry Flyby</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var framesVal = document.getElementById('frames-val');
  var scoreVal = document.getElementById('score-val');
  var signalBar = document.getElementById('signal-bar');
  var feedback = document.getElementById('feedback');
  var titleOverlay = document.getElementById('title-overlay');
  var gameoverOverlay = document.getElementById('gameover-overlay');
  var goTitle = document.getElementById('go-title');
  var goFrames = document.getElementById('go-frames');
  var goScore = document.getElementById('go-score');
  var mosaicEl = document.getElementById('mosaic');
  var startBtn = document.getElementById('start-btn');
  var restartBtn = document.getElementById('restart-btn');

  var TOTAL_FRAMES = 12;
  var state = 'title';
  var w = 300, h = 400;
  var dpr = 1;
  var lastTime = 0;
  var animId = 0;

  var spinAngle = 0;
  var spinSpeed = 1.2;
  var scanY = 0;
  var scanSpeed = 90;
  var signal = 100;
  var score = 0;
  var framesCaptured = 0;
  var tapCooldown = 0;
  var perfectWindow = 22;
  var goodWindow = 42;
  var interference = 0;
  var interferenceTimer = 0;
  var freezeFlash = 0;
  var elapsed = 0;
  var mosaicTiles = [];
  var particles = [];
  var darkMode = true;

  var audioCtx = null;

  function initAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { /* noop */ }
  }

  function playTone(freq, dur, vol) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* noop */ }
  }

  function detectDarkMode() {
    darkMode = !window.matchMedia || window.matchMedia('(prefers-color-scheme: light)').matches ? false : true;
  }

  function buildMosaic() {
    mosaicEl.innerHTML = '';
    mosaicTiles = [];
    for (var i = 0; i < TOTAL_FRAMES; i++) {
      var tile = document.createElement('div');
      tile.className = 'mosaic-tile';
      var mc = document.createElement('canvas');
      mc.width = 32;
      mc.height = 32;
      tile.appendChild(mc);
      mosaicEl.appendChild(tile);
      mosaicTiles.push({ el: tile, canvas: mc, filled: false });
    }
  }

  function resize() {
    var wrap = document.getElementById('arena-wrap');
    if (!wrap) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = wrap.clientWidth || 300;
    h = wrap.clientHeight || 400;
    canvas.width = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function getRimY() {
    var cy = h * 0.52;
    var amp = h * 0.22;
    return cy + Math.sin(spinAngle) * amp;
  }

  function getColors() {
    if (darkMode) {
      return {
        bg: '#060810',
        grid: 'rgba(61,217,232,0.04)',
        wire: '#3dd9e8',
        wireDim: 'rgba(61,217,232,0.35)',
        rim: '#e8a030',
        rimGlow: 'rgba(232,160,48,0.6)',
        scan: '#3dd9e8',
        crater: '#1a3040',
        star: 'rgba(200,220,240,0.7)'
      };
    }
    return {
      bg: '#dce4ec',
      grid: 'rgba(8,120,160,0.06)',
      wire: '#0878a0',
      wireDim: 'rgba(8,120,160,0.4)',
      rim: '#b07010',
      rimGlow: 'rgba(176,112,16,0.5)',
      scan: '#0878a0',
      crater: '#a0b8c8',
      star: 'rgba(40,60,80,0.5)'
    };
  }

  function drawStars(c, t) {
    var seed = 42;
    for (var i = 0; i < 60; i++) {
      seed = (seed * 16807 + 7) % 2147483647;
      var sx = (seed % 1000) / 1000 * w;
      seed = (seed * 16807 + 7) % 2147483647;
      var sy = (seed % 1000) / 1000 * h;
      var blink = 0.4 + 0.6 * Math.sin(t * 0.001 + i * 1.7);
      c.globalAlpha = blink * 0.8;
      c.fillStyle = getColors().star;
      c.fillRect(sx, sy, 1.5, 1.5);
    }
    c.globalAlpha = 1;
  }

  function drawAsteroid(c, cx, cy, r, angle) {
    c.save();
    c.translate(cx, cy);
    c.rotate(angle * 0.15);

    var col = getColors();

    c.beginPath();
    c.ellipse(0, 0, r * 1.1, r * 0.85, 0, 0, Math.PI * 2);
    c.strokeStyle = col.wireDim;
    c.lineWidth = 1;
    c.stroke();

    c.beginPath();
    c.ellipse(0, 0, r, r * 0.78, 0, 0, Math.PI * 2);
    c.strokeStyle = col.wire;
    c.lineWidth = 1.5;
    c.stroke();

    var craterX = r * 0.15;
    var craterY = -r * 0.1;
    var craterR = r * 0.42;
    c.beginPath();
    c.arc(craterX, craterY, craterR, Math.PI * 0.15, Math.PI * 1.05, false);
    c.strokeStyle = col.wire;
    c.lineWidth = 1.2;
    c.stroke();

    c.beginPath();
    c.arc(craterX, craterY, craterR * 0.7, Math.PI * 0.3, Math.PI * 0.9, false);
    c.strokeStyle = col.wireDim;
    c.lineWidth = 0.8;
    c.stroke();

    c.fillStyle = col.crater;
    c.globalAlpha = 0.25;
    c.beginPath();
    c.arc(craterX, craterY, craterR * 0.65, 0, Math.PI * 2);
    c.fill();
    c.globalAlpha = 1;

    var rimPhase = Math.sin(spinAngle);
    if (rimPhase > -0.3) {
      var rimAlpha = Math.max(0, (rimPhase + 0.3) / 1.3);
      var grad = c.createRadialGradient(craterX + craterR * 0.6, craterY - craterR * 0.5, 0, craterX + craterR * 0.6, craterY - craterR * 0.5, craterR * 0.5);
      grad.addColorStop(0, col.rimGlow);
      grad.addColorStop(1, 'transparent');
      c.globalAlpha = rimAlpha * 0.7;
      c.fillStyle = grad;
      c.beginPath();
      c.arc(craterX + craterR * 0.55, craterY - craterR * 0.45, craterR * 0.35, 0, Math.PI * 2);
      c.fill();
      c.globalAlpha = 1;

      c.strokeStyle = col.rim;
      c.lineWidth = 2;
      c.globalAlpha = rimAlpha;
      c.beginPath();
      c.arc(craterX, craterY, craterR, Math.PI * 0.55, Math.PI * 0.85, false);
      c.stroke();
      c.globalAlpha = 1;
    }

    c.strokeStyle = col.wireDim;
    c.lineWidth = 0.5;
    for (var li = 0; li < 6; li++) {
      var la = (li / 6) * Math.PI * 2;
      c.beginPath();
      c.moveTo(Math.cos(la) * r * 0.3, Math.sin(la) * r * 0.25);
      c.lineTo(Math.cos(la) * r * 0.95, Math.sin(la) * r * 0.72);
      c.stroke();
    }

    c.restore();
  }

  function drawScanLine(c, y) {
    var col = getColors();
    var grad = c.createLinearGradient(0, y - 8, 0, y + 8);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.45, col.scan);
    grad.addColorStop(0.55, '#ffffff');
    grad.addColorStop(1, 'transparent');
    c.fillStyle = grad;
    c.globalAlpha = 0.85;
    c.fillRect(0, y - 2, w, 4);
    c.globalAlpha = 0.15;
    c.fillRect(0, y - 12, w, 24);
    c.globalAlpha = 1;
  }

  function drawTelemetry(c) {
    var col = getColors();
    c.strokeStyle = col.wireDim;
    c.lineWidth = 0.5;
    c.globalAlpha = 0.5;
    c.strokeRect(8, 8, w - 16, h - 16);
    c.globalAlpha = 1;

    c.font = '10px ui-monospace, monospace';
    c.fillStyle = col.wireDim;
    c.fillText('HERA-IMG · DIMORPHOS', 14, 22);
    c.fillText('ALT ' + (870 + Math.floor(Math.sin(elapsed * 0.3) * 3)) + ' km', 14, h - 12);
    c.fillText('SPIN ' + spinSpeed.toFixed(2) + ' rad/s', w - 110, h - 12);

    var rimY = getRimY();
    var dist = Math.abs(scanY - rimY);
    var inZone = dist < goodWindow;
    c.fillStyle = inZone ? col.rim : col.wireDim;
    c.fillText(inZone ? '◉ RIM ALIGNED' : '○ SEEK RIM', w - 110, 22);
  }

  function drawInterference(c) {
    if (interference <= 0) return;
    c.save();
    c.globalAlpha = interference * 0.35;
    for (var i = 0; i < 8; i++) {
      var sy = Math.random() * h;
      c.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#000000';
      c.fillRect(0, sy, w, 2 + Math.random() * 6);
    }
    c.globalAlpha = interference * 0.15;
    c.fillStyle = '#ffffff';
    c.fillRect(0, 0, w, h);
    c.restore();
  }

  function drawFreezeFlash(c) {
    if (freezeFlash <= 0) return;
    c.fillStyle = 'rgba(255,255,255,' + (freezeFlash * 0.5) + ')';
    c.fillRect(0, 0, w, h);
  }

  function drawParticles(c) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= 0.016;
      p.x += p.vx;
      p.y += p.vy;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      c.globalAlpha = p.life;
      c.fillStyle = p.color;
      c.fillRect(p.x, p.y, p.size, p.size);
    }
    c.globalAlpha = 1;
  }

  function spawnParticles(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        life: 0.5 + Math.random() * 0.4,
        size: 2 + Math.random() * 2,
        color: color
      });
    }
  }

  function drawScene(t) {
    var c = ctx;
    var col = getColors();
    c.fillStyle = col.bg;
    c.fillRect(0, 0, w, h);

    drawStars(c, t);

    c.strokeStyle = col.grid;
    c.lineWidth = 0.5;
    var gs = 30;
    for (var gx = 0; gx < w; gx += gs) {
      c.beginPath(); c.moveTo(gx, 0); c.lineTo(gx, h); c.stroke();
    }
    for (var gy = 0; gy < h; gy += gs) {
      c.beginPath(); c.moveTo(0, gy); c.lineTo(w, gy); c.stroke();
    }

    var cx = w * 0.5;
    var cy = h * 0.52;
    var r = Math.min(w, h) * 0.28;
    drawAsteroid(c, cx, cy, r, spinAngle);

    if (state === 'playing') {
      drawScanLine(c, scanY);
      var rimY = getRimY();
      var zoneAlpha = 0.12 + 0.08 * Math.sin(t * 0.005);
      c.fillStyle = col.rimGlow;
      c.globalAlpha = zoneAlpha;
      c.fillRect(0, rimY - goodWindow, w, goodWindow * 2);
      c.globalAlpha = zoneAlpha * 1.5;
      c.fillRect(0, rimY - perfectWindow, w, perfectWindow * 2);
      c.globalAlpha = 1;

      c.setLineDash([4, 4]);
      c.strokeStyle = col.rim;
      c.lineWidth = 1;
      c.globalAlpha = 0.6;
      c.beginPath();
      c.moveTo(0, rimY);
      c.lineTo(w, rimY);
      c.stroke();
      c.setLineDash([]);
      c.globalAlpha = 1;
    }

    drawTelemetry(c);
    drawInterference(c);
    drawFreezeFlash(c);
    drawParticles(c);
  }

  function captureToMosaic(snapCtx) {
    if (framesCaptured >= TOTAL_FRAMES) return;
    var tile = mosaicTiles[framesCaptured];
    if (!tile) return;
    var sc = tile.canvas.getContext('2d');
    if (!sc) return;
    sc.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, 32, 32);
    tile.el.classList.add('filled');
    tile.filled = true;
    framesCaptured++;
    framesVal.textContent = framesCaptured + '/' + TOTAL_FRAMES;
  }

  function showFeedback(text, cls) {
    feedback.textContent = text;
    feedback.className = 'show ' + (cls || '');
    clearTimeout(showFeedback._t);
    showFeedback._t = setTimeout(function () {
      feedback.className = '';
    }, 600);
  }

  function attemptCapture() {
    if (state !== 'playing' || tapCooldown > 0) return;
    tapCooldown = 0.35;

    var rimY = getRimY();
    var dist = Math.abs(scanY - rimY);

    if (dist <= perfectWindow) {
      score += 150;
      signal = Math.min(100, signal + 5);
      freezeFlash = 1;
      showFeedback('PERFECT FRAME', 'perfect');
      playTone(880, 0.12, 0.1);
      if (navigator.vibrate) navigator.vibrate(30);
      spawnParticles(w * 0.5, scanY, getColors().rim, 12);
      captureToMosaic();
    } else if (dist <= goodWindow) {
      score += 80;
      signal = Math.min(100, signal + 2);
      freezeFlash = 0.6;
      showFeedback('FRAME OK', 'good');
      playTone(660, 0.1, 0.08);
      if (navigator.vibrate) navigator.vibrate(15);
      spawnParticles(w * 0.5, scanY, getColors().wire, 6);
      captureToMosaic();
    } else {
      score = Math.max(0, score - 20);
      signal = Math.max(0, signal - 12);
      showFeedback('MISALIGN', 'miss');
      playTone(220, 0.15, 0.06);
      if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
    }

    scoreVal.textContent = score;
    signalBar.style.width = signal + '%';

    if (framesCaptured >= TOTAL_FRAMES) {
      endGame(true);
    } else if (signal <= 0) {
      endGame(false);
    }
  }

  function endGame(won) {
    state = 'gameover';
    goTitle.textContent = won ? 'MOSAIC COMPLETE' : 'SIGNAL LOST';
    goFrames.textContent = framesCaptured;
    goScore.textContent = score;
    gameoverOverlay.classList.remove('hidden');
    if (won) {
      playTone(523, 0.2, 0.1);
      setTimeout(function () { playTone(659, 0.2, 0.1); }, 150);
      setTimeout(function () { playTone(784, 0.3, 0.1); }, 300);
    } else {
      playTone(180, 0.4, 0.08);
    }
  }

  function resetGame() {
    state = 'playing';
    spinAngle = 0;
    spinSpeed = 1.2;
    scanY = 0;
    scanSpeed = 90;
    signal = 100;
    score = 0;
    framesCaptured = 0;
    tapCooldown = 0;
    perfectWindow = 22;
    goodWindow = 42;
    interference = 0;
    interferenceTimer = 0;
    freezeFlash = 0;
    elapsed = 0;
    particles = [];
    scoreVal.textContent = '0';
    framesVal.textContent = '0/' + TOTAL_FRAMES;
    signalBar.style.width = '100%';
    buildMosaic();
    titleOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
  }

  function update(dt) {
    if (state !== 'playing') return;

    elapsed += dt;
    spinAngle += spinSpeed * dt;
    scanY += scanSpeed * dt;
    if (scanY > h + 20) scanY = -20;

    signal -= dt * 1.8;
    signalBar.style.width = Math.max(0, signal) + '%';

    tapCooldown = Math.max(0, tapCooldown - dt);
    freezeFlash = Math.max(0, freezeFlash - dt * 3);

    var esc = Math.min(elapsed / 50, 1);
    spinSpeed = 1.2 + esc * 2.8;
    scanSpeed = 90 + esc * 60;
    perfectWindow = Math.max(10, 22 - esc * 12);
    goodWindow = Math.max(20, 42 - esc * 18);

    interferenceTimer -= dt;
    if (interferenceTimer <= 0 && esc > 0.15) {
      interferenceTimer = 2.5 - esc * 1.2;
      interference = 0.6 + Math.random() * 0.4;
    }
    if (interference > 0) {
      interference = Math.max(0, interference - dt * 2.5);
    }

    if (signal <= 0) endGame(false);
  }

  function loop(t) {
    if (!lastTime) lastTime = t;
    var dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;
    detectDarkMode();
    update(dt);
    drawScene(t);
    animId = requestAnimationFrame(loop);
  }

  function onTap(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (state === 'playing') {
      initAudio();
      attemptCapture();
    }
  }

  function onKey(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'playing') {
        initAudio();
        attemptCapture();
      }
    }
  }

  startBtn.addEventListener('click', function () {
    initAudio();
    resetGame();
  });

  restartBtn.addEventListener('click', function () {
    initAudio();
    resetGame();
  });

  canvas.addEventListener('touchstart', onTap, { passive: false });
  canvas.addEventListener('mousedown', onTap);
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', resize);

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', detectDarkMode);
  }

  buildMosaic();
  resize();
  detectDarkMode();
  drawScene(0);
  animId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
