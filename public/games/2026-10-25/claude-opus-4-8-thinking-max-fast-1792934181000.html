<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04090c" />
<title>RESOLVE // dns last hop</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;}
  :root{
    --bg:#05090c; --bg2:#06130e;
    --fg:#d7ffe9; --dim:#6f9a88;
    --accent:#2bf59a; --accent2:#49ffd0;
    --danger:#ff415c; --warn:#ffb44d;
    --panel:rgba(6,16,13,0.66); --line:#1c4537;
    --btnbd:#2f7a5f; --shadow:rgba(0,0,0,0.55);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#05090c; --bg2:#06130e;
      --fg:#d7ffe9; --dim:#6f9a88;
      --accent:#2bf59a; --accent2:#49ffd0;
      --danger:#ff415c; --warn:#ffb44d;
      --panel:rgba(6,16,13,0.66); --line:#1c4537;
      --btnbd:#2f7a5f; --shadow:rgba(0,0,0,0.55);
    }
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef4f0; --bg2:#e1efe7;
      --fg:#0c3a2b; --dim:#5a7d6d;
      --accent:#0a9b57; --accent2:#0b8f87;
      --danger:#cc1f45; --warn:#9a5a00;
      --panel:rgba(248,252,250,0.74); --line:#bcd6c9;
      --btnbd:#7fae99; --shadow:rgba(20,70,52,0.16);
    }
  }
  body{
    background:var(--bg); color:var(--fg);
    font-family:ui-monospace,'SFMono-Regular',Menlo,Monaco,Consolas,monospace;
    overflow:hidden; overscroll-behavior:none; -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #app{
    position:fixed; inset:0; width:100dvw; height:100dvh; overflow:hidden;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  canvas#game{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; left:0; right:0; top:0;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px 16px;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:10px; pointer-events:none; z-index:5;
    opacity:0; transition:opacity .35s ease;
  }
  #hud.show{opacity:1;}
  .hud-col{display:flex; flex-direction:column; gap:2px;}
  .hud-col.right{align-items:flex-end;}
  .hud-col.center{align-items:center; flex:1;}
  .score{font-size:clamp(26px,8vw,40px); font-weight:600; letter-spacing:.02em; line-height:1; font-variant-numeric:tabular-nums;}
  .mult{font-size:12px; letter-spacing:.18em; color:var(--dim); height:14px;}
  .mult.hot{color:var(--accent2);}
  .host{font-size:11px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46vw;}
  .pips{display:flex; gap:7px; margin-bottom:8px;}
  .pips i{width:12px; height:12px; transform:rotate(45deg); background:var(--accent); box-shadow:0 0 10px var(--accent); transition:all .2s ease;}
  .pips i.off{background:transparent; box-shadow:none; border:1.5px solid var(--line);}
  .icbtn{
    pointer-events:auto; -webkit-user-select:none; user-select:none;
    width:44px; height:44px; border-radius:10px;
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    font:inherit; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px);
  }
  .icbtn:active{transform:scale(.94);}

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px; gap:0;
    pointer-events:none;
  }
  .overlay.hidden{display:none;}
  .overlay .wrap{
    pointer-events:none; max-width:460px; width:100%;
    display:flex; flex-direction:column; align-items:center;
  }
  .tag{font-size:11px; letter-spacing:.38em; text-transform:uppercase; color:var(--dim); margin-bottom:18px;}
  .logo{
    font-size:clamp(46px,16vw,92px); font-weight:700; letter-spacing:.04em; line-height:.92; margin:0;
  }
  .logo b{color:var(--accent); font-weight:700;}
  .sub{font-size:clamp(13px,3.6vw,15px); line-height:1.5; color:var(--fg); opacity:.82; margin:18px 6px 28px; max-width:34ch;}
  .btn{
    pointer-events:auto; font:inherit; font-weight:600; text-transform:uppercase;
    letter-spacing:.16em; font-size:15px;
    padding:0 30px; min-height:56px; min-width:210px;
    color:#04110b; background:var(--accent); border:none; border-radius:12px;
    cursor:pointer; box-shadow:0 10px 30px var(--shadow);
    transition:transform .1s ease, filter .14s ease; will-change:transform;
  }
  @media (prefers-color-scheme: light){ .btn{color:#f6fffb;} }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(2px) scale(.985);}
  .keys{margin-top:22px; font-size:11px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase;}
  .pulse{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-left:2px; animation:bl 1.1s steps(2) infinite; vertical-align:middle;}
  @keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:.15}}

  .gotitle{font-size:clamp(30px,10vw,54px); font-weight:700; letter-spacing:.03em; margin:0;}
  .scores{display:flex; gap:38px; margin:26px 0 30px; justify-content:center;}
  .scores .lbl{display:block; font-size:10px; letter-spacing:.26em; color:var(--dim); margin-bottom:6px; text-transform:uppercase;}
  .scores .val{display:block; font-size:clamp(30px,9vw,46px); font-weight:600; font-variant-numeric:tabular-nums; line-height:1;}
  .scores .val.best{color:var(--accent2);}
  .newbest{font-size:11px; letter-spacing:.2em; color:var(--warn); text-transform:uppercase; height:14px; margin-top:14px;}

  .fadein{animation:fi .4s ease both;}
  @keyframes fi{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
</style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud" aria-hidden="true">
      <div class="hud-col left">
        <div class="score" id="score">0</div>
        <div class="mult" id="mult">&nbsp;</div>
      </div>
      <div class="hud-col center">
        <div class="host" id="host">resolving</div>
      </div>
      <div class="hud-col right">
        <div class="pips" id="pips"><i></i><i></i><i></i></div>
        <button class="icbtn" id="mute" aria-label="toggle sound">♪</button>
      </div>
    </div>

    <div id="title" class="overlay">
      <div class="wrap fadein">
        <div class="tag">dns &middot; last hop</div>
        <h1 class="logo">RE<b>SOLVE</b></h1>
        <p class="sub">A query packet races upstream through the mesh. Steer it into the open gateway before the firewall seals the route.</p>
        <button class="btn" data-smoke="start" id="startBtn" aria-label="start game">Initialize<span class="pulse"></span></button>
        <div class="keys">drag / swipe to steer &nbsp;&middot;&nbsp; &#9664; &#9654; keys</div>
      </div>
    </div>

    <div id="over" class="overlay hidden">
      <div class="wrap">
        <div class="tag" id="overtag">connection reset</div>
        <h2 class="gotitle">SIGNAL LOST</h2>
        <div class="newbest" id="newbest">&nbsp;</div>
        <div class="scores">
          <div><span class="lbl">routed</span><span class="val" id="finalScore">0</span></div>
          <div><span class="lbl">best</span><span class="val best" id="bestScore">0</span></div>
        </div>
        <button class="btn" data-smoke="restart" id="restartBtn" aria-label="restart play again">Reconnect &#8635;</button>
        <div class="keys">space / enter to retry</div>
      </div>
    </div>
  </div>

<script>
(function(){
"use strict";

// ---------- helpers ----------
var clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
var lerp=function(a,b,t){return a+(b-a)*t;};
var rand=function(a,b){return a+Math.random()*(b-a);};
var easeIO=function(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
var easeOut=function(t){return 1-Math.pow(1-t,3);};

// ---------- element refs (script is at end of body) ----------
var app=document.getElementById('app');
var cvs=document.getElementById('game');
var ctx=(cvs&&cvs.getContext)?cvs.getContext('2d'):null;
var hud=document.getElementById('hud');
var elScore=document.getElementById('score');
var elMult=document.getElementById('mult');
var elHost=document.getElementById('host');
var elPips=document.getElementById('pips');
var elMute=document.getElementById('mute');
var elTitle=document.getElementById('title');
var elOver=document.getElementById('over');
var elFinal=document.getElementById('finalScore');
var elBest=document.getElementById('bestScore');
var elNewBest=document.getElementById('newbest');
var elOverTag=document.getElementById('overtag');
var startBtn=document.getElementById('startBtn');
var restartBtn=document.getElementById('restartBtn');

// ---------- theme ----------
var mqDark=null;
try{ mqDark=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null; }catch(e){ mqDark=null; }
function isDark(){ return mqDark?mqDark.matches:true; }
var TH={};
function buildTheme(){
  if(isDark()){
    TH={
      bg0:'#05090c', bg1:'#081712',
      edge:'rgba(46,224,150,0.16)', edge2:'rgba(46,224,150,0.05)',
      node:'rgba(90,255,185,0.5)', pulse:'#5effc0',
      wallFill:'#0f2019', wallFill2:'#163025', wallEdge:'#356b57', stripe:'#ffb44d',
      gap:'#49ffd0', gapSoft:'rgba(73,255,208,0.9)',
      packet:'#aeffdd', packetCore:'#ffffff', packetGlow:'rgba(43,245,154,0.55)', packetRing:'#eafff7', glowA:0.85, glowR:3.2,
      danger:'#ff4d64', warn:'#ffb44d',
      text:'#d7ffe9', dim:'rgba(150,210,186,0.75)',
      orb:'#5effc0', repair:'#ffd36b',
      vignette:'rgba(0,0,0,0.5)', scan:'rgba(46,224,150,0.05)'
    };
  } else {
    TH={
      bg0:'#eef4f0', bg1:'#dcebe2',
      edge:'rgba(10,120,80,0.18)', edge2:'rgba(10,120,80,0.05)',
      node:'rgba(10,130,85,0.5)', pulse:'#0a9b57',
      wallFill:'#b7d2c5', wallFill2:'#c6ddd1', wallEdge:'#6a9a84', stripe:'#b26a00',
      gap:'#09857a', gapSoft:'rgba(9,133,122,0.9)',
      packet:'#0b8a53', packetCore:'#f4fff9', packetGlow:'rgba(10,140,86,0.3)', packetRing:'#064028', glowA:0.4, glowR:2.5,
      danger:'#cc1f45', warn:'#9a5a00',
      text:'#0c3a2b', dim:'rgba(50,100,80,0.8)',
      orb:'#0a9b57', repair:'#b26a00',
      vignette:'rgba(30,70,52,0.1)', scan:'rgba(10,120,80,0.04)'
    };
  }
}
buildTheme();
try{ if(mqDark&&mqDark.addEventListener) mqDark.addEventListener('change', buildTheme); }catch(e){}

// ---------- canvas sizing ----------
var W=0,H=0,DPR=1;
var pr=12, py=0, padX=24, minX=0, maxX=0, wt=14;
function resize(){
  var rect=app.getBoundingClientRect();
  W=Math.max(1,Math.round(rect.width));
  H=Math.max(1,Math.round(rect.height));
  DPR=clamp(window.devicePixelRatio||1,1,2.5);
  if(cvs){ cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR); }
  pr=clamp(Math.min(W,H)*0.029, 9, 16);
  wt=clamp(H*0.02, 13, 22);
  py=Math.round(H*0.74);
  padX=clamp(W*0.055, 14, 40);
  minX=padX+pr; maxX=W-padX-pr;
  if(packet){ packet.x=clamp(packet.x,minX,maxX); packet.tx=clamp(packet.tx,minX,maxX); }
}

// ---------- background topology ----------
var topo={nodes:[],edges:[],pulses:[]};
function buildTopo(){
  topo.nodes=[]; topo.edges=[]; topo.pulses=[];
  var n=Math.round(clamp((36), 26, 46));
  var i,j;
  for(i=0;i<n;i++){ topo.nodes.push({x:Math.random(),y:Math.random(),p:Math.random()*6.28,s:rand(0.4,1)}); }
  // connect each node to 2 nearest
  for(i=0;i<n;i++){
    var best=[-1,-1], bd=[1e9,1e9];
    for(j=0;j<n;j++){ if(i===j)continue;
      var dx=topo.nodes[i].x-topo.nodes[j].x, dy=topo.nodes[i].y-topo.nodes[j].y;
      var d=dx*dx+dy*dy;
      if(d<bd[0]){ bd[1]=bd[0]; best[1]=best[0]; bd[0]=d; best[0]=j; }
      else if(d<bd[1]){ bd[1]=d; best[1]=j; }
    }
    if(best[0]>=0) addEdge(i,best[0]);
    if(best[1]>=0) addEdge(i,best[1]);
  }
  var pc=Math.min(12, topo.edges.length);
  for(i=0;i<pc;i++){ topo.pulses.push({e:(Math.random()*topo.edges.length)|0, t:Math.random(), sp:rand(0.12,0.4), dir:Math.random()<0.5?1:-1}); }
}
function addEdge(a,b){
  for(var k=0;k<topo.edges.length;k++){ var e=topo.edges[k]; if((e.a===a&&e.b===b)||(e.a===b&&e.b===a)) return; }
  topo.edges.push({a:a,b:b});
}
buildTopo();

// ---------- game state ----------
var state='title'; // title | playing | over
var packet=null;
var walls=[], orbs=[], parts=[], pops=[];
var score=0, best=0, combo=0, mult=1, integrity=3, maxInt=3;
var elapsed=0, threads=0, spawnTimer=0, orbSpawnCd=0;
var shake=0, hitPause=0, invuln=0;
var flash={r:0,g:0,b:0,a:0};
var banner={text:'',life:0,max:1};
var steering=false, keyDir=0;
var errCount=0, rafId=0, lastT=0;
var surge=0; // visual speed-surge pulse

var HOSTS=['edge-dns.sf','root.mesh','sunrise.sh','relay.0x7c','archive.node','shortcut.io','beacon.dns','tenth.degree','null.route','uplink.sfo'];
var hostIdx=0;

function resetPacket(){
  packet={x:W*0.5, tx:W*0.5, y:py, vx:0, trail:[], ang:0};
}

// ---------- difficulty ----------
function diffNow(){ return clamp(elapsed/40 + threads*0.004, 0, 1.25); }

// ---------- audio (guarded) ----------
var AC=null, master=null, muted=false, audioReady=false;
function initAudio(){
  if(audioReady) return;
  try{
    var ACtor=window.AudioContext||window.webkitAudioContext;
    if(!ACtor) return;
    AC=new ACtor();
    master=AC.createGain(); master.gain.value=0.85; master.connect(AC.destination);
    audioReady=true;
  }catch(e){ AC=null; audioReady=false; }
}
function resumeAudio(){ try{ if(AC&&AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(freq,dur,type,vol,when,slideTo){
  if(!AC||muted) return;
  try{
    var t=AC.currentTime+(when||0);
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime((vol||0.2),t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function noise(dur,vol){
  if(!AC||muted) return;
  try{
    var n=Math.floor(AC.sampleRate*dur);
    var buf=AC.createBuffer(1,n,AC.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2); }
    var s=AC.createBufferSource(); s.buffer=buf;
    var g=AC.createGain(); g.gain.value=vol||0.2;
    var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=0.8;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }catch(e){}
}
function sThread(){ var step=Math.min(combo,20); tone(300*Math.pow(2,step/19),0.13,'triangle',0.16); }
function sClutch(){ tone(660,0.09,'sine',0.17,0); tone(990,0.1,'sine',0.16,0.06); tone(1320,0.14,'sine',0.15,0.12); }
function sOrb(){ tone(900,0.08,'sine',0.14,0,1300); }
function sRepair(){ tone(520,0.1,'sine',0.16,0,780); tone(780,0.12,'sine',0.14,0.08); }
function sHit(){ noise(0.22,0.25); tone(150,0.22,'sawtooth',0.22,0,60); }
function sDeath(){ tone(320,0.5,'sawtooth',0.22,0,70); tone(160,0.6,'square',0.16,0.04,50); noise(0.4,0.18); }
function sStart(){ tone(440,0.09,'square',0.12,0,660); tone(660,0.1,'square',0.1,0.07); }
function sHost(){ tone(587,0.1,'sine',0.14,0); tone(880,0.12,'sine',0.13,0.07); }

function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

function toggleMute(){
  muted=!muted;
  if(elMute){ elMute.textContent=muted?'✕':'♪'; elMute.style.color=muted?'var(--dim)':''; }
}

// ---------- spawning ----------
function makeGap(cx,half,type){
  return {cx:cx, hw0:half, hw:half, type:type, tight:(type==='closing'&&Math.random()<0.5), sealP:rand(0.5,0.78)};
}
function spawnWall(){
  var D=diffNow();
  var gaps=[];
  var forkChance=clamp((D-0.24)/0.7,0,0.5);
  var closeChance=clamp((D-0.08)/0.7,0,0.8);
  var baseHalf=Math.max(pr*1.75, lerp(W*0.235, W*0.092, Math.min(D,1)));
  if(Math.random()<forkChance){
    var half=Math.max(pr*1.6, baseHalf*0.8);
    var aX=rand(minX+half, W*0.5-half*0.15);
    var bX=rand(W*0.5+half*0.15, maxX-half);
    if(aX>bX){ var tmp=aX; aX=bX; bX=tmp; }
    var realLeft=Math.random()<0.5;
    var realX=realLeft?aX:bX, decoyX=realLeft?bX:aX;
    var realGap=makeGap(realX, half, Math.random()<closeChance?'closing':'open');
    realGap.tight=false; // keep forks fair: real gap never slams fully tight
    gaps.push(realGap);
    gaps.push(makeGap(decoyX, half, 'decoy'));
  } else {
    var h=baseHalf;
    var cx=rand(minX+h, maxX-h);
    gaps.push(makeGap(cx, h, Math.random()<closeChance?'closing':'open'));
  }
  var wall={cy:-wt, prevCy:-wt-2, gaps:gaps, resolved:false, wt:wt, scan:Math.random()};
  walls.push(wall);
  // maybe pair an orb into the real gap
  if(Math.random()<0.55){
    var g=gaps[0];
    var rep=(integrity<maxInt && Math.random()<0.14);
    orbs.push({x:clamp(g.cx+rand(-g.hw0*0.25,g.hw0*0.25),minX,maxX), y:wall.cy-pr*3.2, r:pr*0.72, repair:rep, got:false, ph:Math.random()*6.28});
  }
}

// ---------- particles / pops ----------
function burst(x,y,color,count,spd,life){
  for(var i=0;i<count;i++){
    var a=Math.random()*6.2832, s=rand(spd*0.3,spd);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(life*0.5,life),max:life,color:color,size:rand(1.5,3.6),g:rand(0,40)});
  }
}
function pop(x,y,text,color,size){
  pops.push({x:x,y:y,text:text,color:color,size:size||14,life:0.9,max:0.9,vy:-H*0.06});
}

// ---------- gameplay events ----------
function loseIntegrity(){
  if(invuln>0) return;
  integrity--; combo=0; mult=1; invuln=0.75;
  shake=Math.max(shake,16); flash={r:255,g:65,b:92,a:0.42};
  burst(packet.x,packet.y,TH.danger,22,H*0.5,0.7);
  hitPause=Math.max(hitPause,0.05);
  sHit(); buzz([25,40,25]);
  updateHUD();
  if(integrity<=0){ gameOver(); }
}
function gameOver(){
  if(state!=='playing') return;
  state='over';
  burst(packet.x,packet.y,TH.packet,46,H*0.75,1.0);
  burst(packet.x,packet.y,TH.danger,20,H*0.5,0.8);
  shake=Math.max(shake,26); flash={r:255,g:65,b:92,a:0.5};
  hitPause=0.09; sDeath(); buzz([60,50,120]);
  var nb=score>best;
  if(nb) best=score;
  if(elFinal) elFinal.textContent=String(score);
  if(elBest) elBest.textContent=String(best);
  if(elNewBest) elNewBest.innerHTML=nb?'&#9733; new best':'&nbsp;';
  if(elOverTag) elOverTag.textContent=pickResetMsg();
  if(hud) hud.classList.remove('show');
  // reveal overlay promptly, animate the wrap in
  if(elOver){
    elOver.classList.remove('hidden');
    var wrap=elOver.querySelector('.wrap');
    if(wrap){ wrap.classList.remove('fadein'); void wrap.offsetWidth; wrap.classList.add('fadein'); }
  }
}
var RESETMSG=['connection reset','route withdrawn','ttl expired','gateway sealed','packet dropped','nxdomain'];
function pickResetMsg(){ return RESETMSG[(Math.random()*RESETMSG.length)|0]; }

function resolveHost(){
  var host=HOSTS[hostIdx%HOSTS.length];
  hostIdx++;
  banner={text:'RESOLVED \u25B8 '+host, life:1.6, max:1.6};
  score+=100; surge=1; flash={r:43,g:245,b:154,a:0.14};
  sHost(); buzz(12);
  if(elHost) elHost.textContent='\u2192 '+HOSTS[hostIdx%HOSTS.length];
}

// ---------- start / restart ----------
function startGame(){
  initAudio(); resumeAudio();
  score=0; combo=0; mult=1; integrity=maxInt; elapsed=0; threads=0;
  spawnTimer=0.75; orbSpawnCd=1.2; hostIdx=0;
  walls.length=0; orbs.length=0; parts.length=0; pops.length=0;
  shake=0; hitPause=0; invuln=0.4; surge=0;
  flash={r:0,g:0,b:0,a:0}; banner={text:'',life:0,max:1};
  resetPacket();
  if(elHost) elHost.textContent='\u2192 '+HOSTS[0];
  if(elTitle) elTitle.classList.add('hidden');
  if(elOver) elOver.classList.add('hidden');
  if(hud){ hud.classList.add('show'); hud.setAttribute('aria-hidden','false'); }
  updateHUD();
  state='playing';
  sStart();
}
function restartGame(){ startGame(); }

// ---------- HUD ----------
function updateHUD(){
  if(elScore) elScore.textContent=String(score);
  if(elMult){
    if(mult>1){ elMult.textContent='combo \u00D7'+mult; elMult.classList.add('hot'); }
    else { elMult.innerHTML='&nbsp;'; elMult.classList.remove('hot'); }
  }
  if(elPips){
    var kids=elPips.children;
    for(var i=0;i<kids.length;i++){ if(i<integrity) kids[i].classList.remove('off'); else kids[i].classList.add('off'); }
  }
}

// ---------- update ----------
function update(dt){
  // ambient drift always
  if(state!=='playing'){
    // decay transient fx on non-play states
    flash.a=Math.max(0,flash.a-dt*1.6);
    shake=Math.max(0,shake-dt*60);
    updateParts(dt); updatePops(dt);
    if(banner.life>0) banner.life-=dt;
    if(surge>0) surge=Math.max(0,surge-dt*1.6);
    return;
  }

  elapsed+=dt;
  if(invuln>0) invuln-=dt;
  if(surge>0) surge=Math.max(0,surge-dt*1.6);

  var gp=(hitPause>0)?0:dt;
  if(hitPause>0) hitPause=Math.max(0,hitPause-dt);

  var D=diffNow();
  var speed=(0.30+0.60*Math.min(D,1.18))*H;
  var interval=Math.max(0.62, lerp(1.45,0.74,Math.min(D,1)));

  // steering
  if(keyDir!==0){ packet.tx=clamp(packet.tx+keyDir*(W*1.95)*gp, minX, maxX); }
  var px0=packet.x;
  var k=1-Math.exp(-gp*17);
  packet.x+=(packet.tx-packet.x)*k;
  packet.x=clamp(packet.x,minX,maxX);
  packet.vx=(gp>0)?((packet.x-px0)/gp):0;
  packet.ang=clamp(packet.vx/(W*2.0),-0.5,0.5);
  // trail
  packet.trail.push({x:packet.x,y:packet.y});
  if(packet.trail.length>16) packet.trail.shift();

  // spawn walls
  spawnTimer-=gp;
  if(spawnTimer<=0){ spawnWall(); spawnTimer=interval+rand(-0.05,0.08); }

  // update walls
  for(var i=walls.length-1;i>=0;i--){
    var wl=walls[i];
    wl.prevCy=wl.cy; wl.cy+=speed*gp;
    var spawnY=-wl.wt;
    var t=clamp((wl.cy-spawnY)/(py-spawnY),0,1);
    for(var gi=0;gi<wl.gaps.length;gi++){
      var g=wl.gaps[gi];
      if(g.type==='open'){ g.hw=g.hw0; }
      else if(g.type==='closing'){ var mh=g.tight?pr*1.04:pr*1.7; g.hw=lerp(g.hw0,mh,easeIO(t)); }
      else { g.hw=g.hw0*clamp(1-t/g.sealP,0,1); } // decoy seals
    }
    // crossing evaluation
    if(!wl.resolved && wl.prevCy<py && wl.cy>=py){
      wl.resolved=true;
      var g2=openAt(wl,packet.x);
      if(g2){
        threads++; combo++; mult=1+Math.floor(combo/5);
        var clutch=(g2.type==='closing'&&g2.tight&&g2.hw<pr*1.35);
        var gain=(10)*mult;
        score+=gain;
        pop(packet.x,py-pr*2.4,'+'+gain, TH.gap, 14);
        burst(packet.x,py,TH.gap,10,H*0.3,0.45);
        sThread();
        if(clutch){
          score+=50; pop(packet.x,py-pr*4.2,'CLUTCH +50', TH.warn, 17);
          flash={r:43,g:245,b:154,a:0.26}; shake=Math.max(shake,8); hitPause=Math.max(hitPause,0.06);
          burst(packet.x,py,TH.warn,16,H*0.5,0.6); sClutch(); buzz(18);
        }
        if(combo>0 && combo%5===0){ flash={r:43,g:245,b:154,a:0.12}; }
        if(threads%8===0){ resolveHost(); }
        updateHUD();
      } else {
        loseIntegrity();
      }
    }
    if(wl.cy-wl.wt>H+4){ walls.splice(i,1); }
  }

  // orbs
  for(var oi=orbs.length-1;oi>=0;oi--){
    var ob=orbs[oi];
    ob.y+=speed*gp; ob.ph+=dt*4;
    if(!ob.got){
      var dx=ob.x-packet.x, dy=ob.y-packet.y;
      if(dx*dx+dy*dy < (pr+ob.r)*(pr+ob.r)){
        ob.got=true;
        if(ob.repair && integrity<maxInt){ integrity++; pop(ob.x,ob.y-pr,'+REPAIR', TH.repair,14); sRepair(); burst(ob.x,ob.y,TH.repair,14,H*0.4,0.6); buzz(14); }
        else { score+=25; pop(ob.x,ob.y-pr,'+25', TH.orb,13); sOrb(); burst(ob.x,ob.y,TH.orb,10,H*0.35,0.45); }
        updateHUD();
      }
    }
    if(ob.y-ob.r>H+6 || ob.got){ orbs.splice(oi,1); }
  }

  // fx decay
  flash.a=Math.max(0,flash.a-dt*1.7);
  shake=Math.max(0,shake-dt*55);
  if(banner.life>0) banner.life-=dt;
  updateParts(gp); updatePops(dt);
}

function openAt(wl,x){
  for(var i=0;i<wl.gaps.length;i++){
    var g=wl.gaps[i];
    if(g.hw>pr*0.5 && Math.abs(x-g.cx)<=g.hw+pr*0.5) return g;
  }
  return null;
}
function updateParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.life-=dt;
    if(p.life<=0) parts.splice(i,1);
  }
}
function updatePops(dt){
  for(var i=pops.length-1;i>=0;i--){
    var p=pops[i]; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0) pops.splice(i,1);
  }
}

// ---------- attract demo (title) ----------
var demo={cy:-30, gapX:0.5, ghost:0.5, t:0};
function updateDemo(dt){
  demo.t+=dt;
  demo.cy+=H*0.16*dt;
  var target=demo.gapX*W;
  demo.ghost+=(target-demo.ghost)*(1-Math.exp(-dt*5));
  if(demo.cy>py+H*0.12){ demo.cy=-30; demo.gapX=rand(0.22,0.78); }
}

// ---------- render ----------
function render(){
  if(!ctx) return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  // background
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,TH.bg0); bg.addColorStop(1,TH.bg1);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  ctx.save();
  if(shake>0.2){ ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake); }

  drawTopo();
  drawRails();
  if(state==='title') drawDemo();
  drawWalls();
  drawOrbs();
  if(state!=='over' || parts.length>0){ drawPacket(); }
  if(surge>0 && packet){
    var rr=lerp(pr*1.4, Math.max(W,H)*0.62, 1-surge);
    ctx.globalAlpha=surge*0.35; ctx.strokeStyle=TH.gap; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(packet.x,packet.y,rr,0,6.2832); ctx.stroke();
    ctx.globalAlpha=1;
  }
  drawParts();
  drawPops();
  drawBanner();

  ctx.restore();

  // full-screen flash
  if(flash.a>0.001){ ctx.fillStyle='rgba('+flash.r+','+flash.g+','+flash.b+','+flash.a.toFixed(3)+')'; ctx.fillRect(0,0,W,H); }
  drawVignette();
}

function nodeXY(nd){ return {x: nd.x*W, y: nd.y*H}; }
function drawTopo(){
  var i;
  ctx.lineWidth=1;
  ctx.strokeStyle=TH.edge;
  ctx.beginPath();
  for(i=0;i<topo.edges.length;i++){
    var e=topo.edges[i];
    var a=topo.nodes[e.a], b=topo.nodes[e.b];
    if(!a||!b) continue;
    ctx.moveTo(a.x*W,a.y*H); ctx.lineTo(b.x*W,b.y*H);
  }
  ctx.stroke();
  // nodes
  for(i=0;i<topo.nodes.length;i++){
    var nd=topo.nodes[i];
    var fl=0.5+0.5*Math.sin(nd.p+ (typeof performance!=='undefined'?performance.now():Date.now())*0.0012*nd.s);
    ctx.globalAlpha=0.25+0.4*fl;
    ctx.fillStyle=TH.node;
    var sz=1.3+1.6*nd.s;
    ctx.fillRect(nd.x*W-sz*0.5, nd.y*H-sz*0.5, sz, sz);
  }
  ctx.globalAlpha=1;
  // pulses
  for(i=0;i<topo.pulses.length;i++){
    var pu=topo.pulses[i];
    var ed=topo.edges[pu.e]; if(!ed) continue;
    var na=topo.nodes[ed.a], nb=topo.nodes[ed.b]; if(!na||!nb) continue;
    pu.t+=pu.sp*pu.dir*0.016;
    if(pu.t>1){ pu.t=0; pu.e=(Math.random()*topo.edges.length)|0; }
    if(pu.t<0){ pu.t=1; pu.e=(Math.random()*topo.edges.length)|0; }
    var tt=pu.t;
    var x=lerp(na.x,nb.x,tt)*W, y=lerp(na.y,nb.y,tt)*H;
    ctx.fillStyle=TH.pulse; ctx.globalAlpha=0.55;
    ctx.beginPath(); ctx.arc(x,y,1.8,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawRails(){
  ctx.strokeStyle=TH.edge; ctx.lineWidth=1.5; ctx.globalAlpha=0.6;
  ctx.beginPath();
  ctx.moveTo(padX*0.6,0); ctx.lineTo(padX*0.6,H);
  ctx.moveTo(W-padX*0.6,0); ctx.lineTo(W-padX*0.6,H);
  ctx.stroke(); ctx.globalAlpha=1;
}

function roundRect(x,y,w,h,r){
  r=Math.min(r,h*0.5,w*0.5);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawWalls(){
  var left=padX*0.6, right=W-padX*0.6;
  for(var i=0;i<walls.length;i++){
    var wl=walls[i];
    var y=wl.cy-wl.wt*0.5;
    // build solid runs = [left,right] minus open gaps
    var gaps=[];
    for(var gi=0;gi<wl.gaps.length;gi++){
      var g=wl.gaps[gi];
      if(g.hw>0.5){ gaps.push({a:g.cx-g.hw,b:g.cx+g.hw,g:g}); }
    }
    gaps.sort(function(p,q){return p.a-q.a;});
    var cursor=left;
    for(var s=0;s<=gaps.length;s++){
      var segEnd=(s<gaps.length)?gaps[s].a:right;
      if(segEnd>cursor+0.5){
        drawBar(cursor,y,segEnd-cursor,wl.wt);
      }
      if(s<gaps.length){ cursor=Math.max(cursor,gaps[s].b); }
    }
    // gateway doorways
    for(var gj=0;gj<gaps.length;gj++){
      drawGate(gaps[gj].g, y, wl.wt);
    }
  }
}
function drawBar(x,y,w,h){
  var r=Math.min(4,h*0.3);
  var fill=ctx.createLinearGradient(0,y,0,y+h);
  fill.addColorStop(0,TH.wallFill2); fill.addColorStop(1,TH.wallFill);
  ctx.fillStyle=fill;
  roundRect(x,y,w,h,r); ctx.fill();
  // hazard stripes => "sealed / barrier"
  ctx.save();
  roundRect(x,y,w,h,r); ctx.clip();
  ctx.globalAlpha=0.1; ctx.strokeStyle=TH.stripe; ctx.lineWidth=2.2;
  var off=((typeof performance!=='undefined'?performance.now():Date.now())*0.02)%14;
  for(var sx=x-h-14+off; sx<x+w+h; sx+=14){ ctx.beginPath(); ctx.moveTo(sx,y+h); ctx.lineTo(sx+h,y); ctx.stroke(); }
  ctx.restore();
  // matte border
  ctx.strokeStyle=TH.wallEdge; ctx.lineWidth=1.2; ctx.globalAlpha=1;
  roundRect(x,y,w,h,r); ctx.stroke();
}
function drawGate(g,y,h){
  var cx=g.cx, hw=g.hw;
  var isOpen=(g.type==='open');
  var col=(g.type==='decoy')?TH.danger:((g.type==='closing')?TH.warn:TH.gap);
  var now=(typeof performance!=='undefined'?performance.now():Date.now());
  // glowing doorway beam (the safe route)
  var lg=ctx.createLinearGradient(cx-hw,0,cx+hw,0);
  lg.addColorStop(0,'rgba(0,0,0,0)'); lg.addColorStop(0.5,col); lg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=isOpen?0.26:0.16; ctx.fillStyle=lg;
  ctx.fillRect(cx-hw, y-h*0.8, hw*2, h*2.6);
  ctx.globalAlpha=1;
  // glowing posts
  ctx.save();
  ctx.shadowColor=col; ctx.shadowBlur=15;
  ctx.fillStyle=col;
  var pw=3.4;
  roundRect(cx-hw-pw*0.5, y-4, pw, h+8, 1.6); ctx.fill();
  roundRect(cx+hw-pw*0.5, y-4, pw, h+8, 1.6); ctx.fill();
  // top/bottom caps turning inward
  ctx.fillRect(cx-hw, y-4, 6, 2.6); ctx.fillRect(cx-hw, y+h+1.4, 6, 2.6);
  ctx.fillRect(cx+hw-6, y-4, 6, 2.6); ctx.fillRect(cx+hw-6, y+h+1.4, 6, 2.6);
  ctx.restore();
  // chevrons indicating closing for closing/decoy gates
  if(g.type==='closing'||g.type==='decoy'){
    var pulse=0.5+0.5*Math.sin(now*0.012);
    ctx.globalAlpha=0.45+0.5*pulse;
    ctx.strokeStyle=col; ctx.lineWidth=2.2;
    var midY=y+h*0.5, aw=5, ah=5;
    ctx.beginPath(); ctx.moveTo(cx-hw+2,midY-ah); ctx.lineTo(cx-hw+2+aw,midY); ctx.lineTo(cx-hw+2,midY+ah); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+hw-2,midY-ah); ctx.lineTo(cx+hw-2-aw,midY); ctx.lineTo(cx+hw-2,midY+ah); ctx.stroke();
    ctx.globalAlpha=1;
  }
}

function drawOrbs(){
  for(var i=0;i<orbs.length;i++){
    var o=orbs[i];
    var col=o.repair?TH.repair:TH.orb;
    var pulse=0.6+0.4*Math.sin(o.ph);
    ctx.save();
    var rg=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*2.4);
    rg.addColorStop(0,col); rg.addColorStop(0.4,col); rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=0.35*pulse; ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r*2.4,0,6.2832); ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=col;
    if(o.repair){
      // cross
      var a=o.r*0.55;
      ctx.fillRect(o.x-a,o.y-a*0.42,a*2,a*0.84);
      ctx.fillRect(o.x-a*0.42,o.y-a,a*0.84,a*2);
    } else {
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r*0.62,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPacket(){
  if(!packet) return;
  // trail
  for(var i=0;i<packet.trail.length;i++){
    var tp=packet.trail[i];
    var a=(i/packet.trail.length);
    ctx.globalAlpha=a*0.33;
    ctx.fillStyle=TH.packet;
    var s=pr*(0.3+0.6*a);
    ctx.beginPath(); ctx.arc(tp.x,tp.y,s,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;

  var blink=(invuln>0)?(0.5+0.5*Math.abs(Math.sin((typeof performance!=='undefined'?performance.now():Date.now())*0.02))):1;
  var gR=pr*(TH.glowR||3.0);
  // glow
  var gr=ctx.createRadialGradient(packet.x,packet.y,0,packet.x,packet.y,gR);
  gr.addColorStop(0,TH.packetGlow); gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=(TH.glowA||0.8)*blink; ctx.fillStyle=gr;
  ctx.beginPath(); ctx.arc(packet.x,packet.y,gR,0,6.2832); ctx.fill();
  ctx.globalAlpha=1;

  // body (rounded square) with crisp ring
  ctx.save();
  ctx.translate(packet.x,packet.y);
  ctx.rotate(packet.ang);
  ctx.globalAlpha=blink;
  ctx.shadowColor=TH.packet; ctx.shadowBlur=14;
  ctx.fillStyle=TH.packet;
  roundRect(-pr,-pr,pr*2,pr*2,pr*0.5); ctx.fill();
  ctx.shadowBlur=0;
  // crisp ring
  ctx.strokeStyle=TH.packetRing; ctx.lineWidth=1.6; ctx.globalAlpha=blink*0.9;
  roundRect(-pr,-pr,pr*2,pr*2,pr*0.5); ctx.stroke();
  // inner core
  ctx.fillStyle=TH.packetCore; ctx.globalAlpha=blink*0.95;
  roundRect(-pr*0.4,-pr*0.4,pr*0.8,pr*0.8,pr*0.22); ctx.fill();
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawParts(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size*0.5,p.y-p.size*0.5,p.size,p.size);
  }
  ctx.globalAlpha=1;
}
function drawPops(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(var i=0;i<pops.length;i++){
    var p=pops[i];
    var a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    ctx.font='600 '+p.size+'px ui-monospace,Menlo,monospace';
    ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;
}
function drawBanner(){
  if(banner.life<=0) return;
  var a=clamp(banner.life/0.4,0,1)*clamp((banner.max-banner.life)/0.25,0,1);
  a=Math.min(a,1);
  ctx.globalAlpha=a;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=TH.gap;
  ctx.font='600 '+Math.round(clamp(W*0.045,15,22))+'px ui-monospace,Menlo,monospace';
  ctx.fillText(banner.text, W*0.5, H*0.32);
  ctx.globalAlpha=1;
}

function drawDemo(){
  // faint demo wall + ghost packet
  var left=padX*0.6, right=W-padX*0.6;
  var y=demo.cy-wt*0.5;
  var hw=Math.max(pr*2.0, W*0.16);
  var cx=demo.gapX*W;
  ctx.globalAlpha=0.55;
  if(cx-hw>left) drawBar(left,y,(cx-hw)-left,wt);
  if(right>cx+hw) drawBar(cx+hw,y,right-(cx+hw),wt);
  ctx.globalAlpha=1;
  drawGate({cx:cx,hw:hw,type:'open'},y,wt);
  // ghost packet
  ctx.globalAlpha=0.6;
  var gr=ctx.createRadialGradient(demo.ghost,py,0,demo.ghost,py,pr*2.6);
  gr.addColorStop(0,TH.packetGlow); gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(demo.ghost,py,pr*2.6,0,6.2832); ctx.fill();
  ctx.fillStyle=TH.packet;
  roundRect(demo.ghost-pr*0.8,py-pr*0.8,pr*1.6,pr*1.6,pr*0.4); ctx.fill();
  ctx.globalAlpha=1;
}

function drawVignette(){
  var vg=ctx.createRadialGradient(W*0.5,H*0.5,Math.min(W,H)*0.28,W*0.5,H*0.52,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,TH.vignette);
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

// ---------- loop ----------
function step(t){
  var dt=(lastT? (t-lastT):16)/1000;
  lastT=t;
  if(dt>0.05) dt=0.05;
  if(dt<0) dt=0;
  if(state==='title'){ updateDemo(dt); }
  update(dt);
  render();
}
function loop(t){
  rafId=requestAnimationFrame(loop);
  try{ step(t); }
  catch(e){ errCount++; if(errCount>10){ cancelAnimationFrame(rafId); } }
}

// ---------- input ----------
function setTargetFromEvent(e){
  if(!cvs) return;
  var rect=cvs.getBoundingClientRect();
  var cx=(e.clientX!=null)?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:0);
  var x=(cx-rect.left)*(W/Math.max(1,rect.width));
  packet.tx=clamp(x,minX,maxX);
}
function isBtn(e){ return e.target&&e.target.closest&&e.target.closest('button'); }
function onDown(e){
  if(isBtn(e)) return;
  if(state!=='playing' || !packet) return;
  steering=true; setTargetFromEvent(e);
  if(e.cancelable) e.preventDefault();
  try{ if(e.pointerId!=null && app.setPointerCapture) app.setPointerCapture(e.pointerId); }catch(_){}
}
function onMove(e){
  if(!steering || state!=='playing' || !packet) return;
  setTargetFromEvent(e);
  if(e.cancelable) e.preventDefault();
}
function onUp(e){ steering=false; }

function onKey(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){ keyDir=-1; if(e.preventDefault)e.preventDefault(); }
  else if(k==='ArrowRight'||k==='d'||k==='D'){ keyDir=1; if(e.preventDefault)e.preventDefault(); }
  else if(k===' '||k==='Enter'){
    if(state==='title'){ startGame(); }
    else if(state==='over'){ restartGame(); }
    if(e.preventDefault)e.preventDefault();
  }
  else if(k==='m'||k==='M'){ toggleMute(); }
}
function onKeyUp(e){
  var k=e.key;
  if((k==='ArrowLeft'||k==='a'||k==='A')&&keyDir<0) keyDir=0;
  if((k==='ArrowRight'||k==='d'||k==='D')&&keyDir>0) keyDir=0;
}

// ---------- init ----------
function init(){
  if(!ctx){
    // Canvas unavailable: keep page usable; wire start to just hide title.
    if(startBtn) startBtn.addEventListener('click', function(){ if(elTitle) elTitle.classList.add('hidden'); });
    return;
  }
  resize();
  try{
    if(window.ResizeObserver){ var ro=new ResizeObserver(resize); ro.observe(app); }
    else { window.addEventListener('resize', resize); }
  }catch(e){ window.addEventListener('resize', resize); }
  window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });

  app.addEventListener('pointerdown', onDown, {passive:false});
  app.addEventListener('pointermove', onMove, {passive:false});
  window.addEventListener('pointerup', onUp, {passive:false});
  window.addEventListener('pointercancel', onUp, {passive:false});
  window.addEventListener('keydown', onKey, {passive:false});
  window.addEventListener('keyup', onKeyUp, {passive:false});

  if(startBtn) startBtn.addEventListener('click', function(ev){ ev.preventDefault(); startGame(); });
  if(restartBtn) restartBtn.addEventListener('click', function(ev){ ev.preventDefault(); restartGame(); });
  if(elMute) elMute.addEventListener('click', function(ev){ ev.preventDefault(); initAudio(); resumeAudio(); toggleMute(); });

  resetPacket();
  if(elHost) elHost.textContent='\u2192 '+HOSTS[0];
  rafId=requestAnimationFrame(loop);
}

try{ init(); }catch(e){ /* never throw at load */ }

})();
</script>
</body>
</html>
