<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thinking...</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="status">Thinking...</p>
    <p class="subtext">Listening to patterns in the noise</p>
  </main>
  <script>
    const phrases = [
      "Listening to patterns in the noise",
      "Synthesizing recent activity",
      "Finding threads between moments",
      "Remembering what matters"
    ];
    let i = 0;
    const subtext = document.querySelector('.subtext');
    setInterval(() => {
      i = (i + 1) % phrases.length;
      subtext.style.opacity = 0;
      setTimeout(() => {
        subtext.textContent = phrases[i];
        subtext.style.opacity = 1;
      }, 400);
    }, 3000);

    // Redirect to generated site after brief delay
    setTimeout(() => {
      window.location.href = '/';
    }, 2500);
  </script>
</body>
</html>
