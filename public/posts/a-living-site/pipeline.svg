<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" fill="none">
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="760" rx="26" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="759" rx="26" stroke="rgba(38,37,30,0.10)"/>

  <text x="56" y="80" class="t" font-size="28" font-weight="600" fill="#26251e">The loop</text>
  <text x="56" y="114" class="t" font-size="16" fill="rgba(38,37,30,0.65)">From activity → brief → HTML → archive → viewer. Built to be observable and safe.</text>

  <!-- Left column: sources -->
  <g transform="translate(56 160)">
    <rect x="0" y="0" width="312" height="520" rx="18" fill="rgba(38,37,30,0.03)" stroke="rgba(38,37,30,0.08)"/>
    <text x="22" y="42" class="t" font-size="14" font-weight="600" fill="rgba(38,37,30,0.60)">inputs</text>

    <g transform="translate(22 70)">
      <g>
        <rect x="0" y="0" width="268" height="64" rx="14" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
        <text x="16" y="26" class="t" font-size="14" font-weight="600" fill="#26251e">data/latest.json</text>
        <text x="16" y="46" class="t" font-size="13" fill="rgba(38,37,30,0.60)">aggregated sources + analysis</text>
      </g>
      <g transform="translate(0 78)">
        <rect x="0" y="0" width="268" height="64" rx="14" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
        <text x="16" y="26" class="t" font-size="14" font-weight="600" fill="#26251e">data/brief.json</text>
        <text x="16" y="46" class="t" font-size="13" fill="rgba(38,37,30,0.60)">human voice + direction</text>
      </g>
      <g transform="translate(0 156)">
        <rect x="0" y="0" width="268" height="64" rx="14" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
        <text x="16" y="26" class="t" font-size="14" font-weight="600" fill="#26251e">data/reference.html</text>
        <text x="16" y="46" class="t" font-size="13" fill="rgba(38,37,30,0.60)">semantic content, no style</text>
      </g>
      <g transform="translate(0 258)">
        <text x="0" y="0" class="t" font-size="13" fill="rgba(38,37,30,0.55)">sources (examples)</text>
        <text x="0" y="26" class="mono" font-size="12" fill="rgba(38,37,30,0.55)">GitHub • Spotify • Typefully • Weather</text>
      </g>
    </g>
  </g>

  <!-- Middle: processing -->
  <g transform="translate(410 160)">
    <rect x="0" y="0" width="410" height="520" rx="18" fill="rgba(38,37,30,0.03)" stroke="rgba(38,37,30,0.08)"/>
    <text x="22" y="42" class="t" font-size="14" font-weight="600" fill="rgba(38,37,30,0.60)">processing</text>

    <g transform="translate(22 70)">
      <rect x="0" y="0" width="366" height="84" rx="16" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
      <text x="18" y="30" class="t" font-size="14" font-weight="600" fill="#26251e">Aggregator</text>
      <text x="18" y="52" class="t" font-size="13" fill="rgba(38,37,30,0.60)">fetchers → history snapshots → baseline → narrative signals</text>
      <text x="18" y="72" class="mono" font-size="12" fill="rgba(38,37,30,0.52)">infra/aggregator.ts</text>
    </g>

    <g transform="translate(22 180)">
      <rect x="0" y="0" width="366" height="84" rx="16" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
      <text x="18" y="30" class="t" font-size="14" font-weight="600" fill="#26251e">Curator agent</text>
      <text x="18" y="52" class="t" font-size="13" fill="rgba(38,37,30,0.60)">turns raw signals into a brief + a clean reference HTML</text>
      <text x="18" y="72" class="mono" font-size="12" fill="rgba(38,37,30,0.52)">infra/prompts/curator.md</text>
    </g>

    <g transform="translate(22 290)">
      <rect x="0" y="0" width="366" height="100" rx="16" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
      <text x="18" y="30" class="t" font-size="14" font-weight="600" fill="#26251e">Generator (multi-model)</text>
      <text x="18" y="52" class="t" font-size="13" fill="rgba(38,37,30,0.60)">Cursor writes a single standalone HTML file per model</text>
      <text x="18" y="72" class="mono" font-size="12" fill="rgba(38,37,30,0.52)">generated/&lt;model&gt;.html</text>
      <text x="18" y="92" class="mono" font-size="12" fill="rgba(38,37,30,0.52)">scripts/regenerate-local.sh</text>
    </g>

    <g transform="translate(22 420)">
      <rect x="0" y="0" width="366" height="84" rx="16" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
      <text x="18" y="30" class="t" font-size="14" font-weight="600" fill="#26251e">Archive + manifest</text>
      <text x="18" y="52" class="t" font-size="13" fill="rgba(38,37,30,0.60)">save logs, copy HTML, and index builds for browsing</text>
      <text x="18" y="72" class="mono" font-size="12" fill="rgba(38,37,30,0.52)">infra/save-build-log.ts</text>
    </g>
  </g>

  <!-- Right: outputs -->
  <g transform="translate(864 160)">
    <rect x="0" y="0" width="360" height="520" rx="18" fill="rgba(38,37,30,0.03)" stroke="rgba(38,37,30,0.08)"/>
    <text x="22" y="42" class="t" font-size="14" font-weight="600" fill="rgba(38,37,30,0.60)">outputs</text>

    <g transform="translate(22 70)">
      <rect x="0" y="0" width="316" height="84" rx="16" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
      <text x="18" y="30" class="t" font-size="14" font-weight="600" fill="#26251e">public/builds/</text>
      <text x="18" y="52" class="t" font-size="13" fill="rgba(38,37,30,0.60)">dated HTML archive</text>
      <text x="18" y="72" class="mono" font-size="12" fill="rgba(38,37,30,0.52)">manifest.json + history.json</text>
    </g>

    <g transform="translate(22 180)">
      <rect x="0" y="0" width="316" height="84" rx="16" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
      <text x="18" y="30" class="t" font-size="14" font-weight="600" fill="#26251e">/builds</text>
      <text x="18" y="52" class="t" font-size="13" fill="rgba(38,37,30,0.60)">browse outputs + agent logs</text>
      <text x="18" y="72" class="mono" font-size="12" fill="rgba(38,37,30,0.52)">app/builds + components/builds</text>
    </g>

    <g transform="translate(22 290)">
      <rect x="0" y="0" width="316" height="100" rx="16" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
      <text x="18" y="30" class="t" font-size="14" font-weight="600" fill="#26251e">/agent</text>
      <text x="18" y="52" class="t" font-size="13" fill="rgba(38,37,30,0.60)">view a specific model build</text>
      <text x="18" y="72" class="t" font-size="13" fill="rgba(38,37,30,0.60)">renders in Shadow DOM</text>
      <text x="18" y="92" class="mono" font-size="12" fill="rgba(38,37,30,0.52)">components/site-viewer.tsx</text>
    </g>

    <g transform="translate(22 420)">
      <rect x="0" y="0" width="316" height="84" rx="16" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
      <text x="18" y="30" class="t" font-size="14" font-weight="600" fill="#26251e">Live build stream</text>
      <text x="18" y="52" class="t" font-size="13" fill="rgba(38,37,30,0.60)">GitHub → webhook → Redis → SSE</text>
      <text x="18" y="72" class="mono" font-size="12" fill="rgba(38,37,30,0.52)">/api/build/events + /api/build/stream</text>
    </g>
  </g>

  <!-- Connectors -->
  <g stroke="rgba(38,37,30,0.22)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M368 278H410"/>
    <path d="M368 356H410"/>
    <path d="M368 434H410"/>
    <path d="M820 320H864"/>
    <path d="M820 430H864"/>
    <path d="M820 540H864"/>
  </g>
</svg>

