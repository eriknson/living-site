<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" fill="none">
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="680" rx="26" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="679" rx="26" stroke="rgba(38,37,30,0.10)"/>

  <text x="56" y="84" class="t" font-size="28" font-weight="600" fill="#26251e">Trust boundary</text>
  <text x="56" y="118" class="t" font-size="16" fill="rgba(38,37,30,0.65)">Let the model create. Don’t let it rewrite the machinery.</text>

  <!-- Protected box -->
  <g transform="translate(56 160)">
    <rect x="0" y="0" width="560" height="460" rx="20" fill="rgba(38,37,30,0.02)" stroke="rgba(38,37,30,0.10)"/>
    <text x="22" y="44" class="t" font-size="14" font-weight="600" fill="rgba(38,37,30,0.60)">protected / hand-written</text>
    <text x="22" y="72" class="t" font-size="13" fill="rgba(38,37,30,0.60)">infra, workflows, data model, viewer UI</text>

    <g class="mono" font-size="12" fill="rgba(38,37,30,0.65)">
      <text x="22" y="118">infra/</text>
      <text x="22" y="146">.github/workflows/</text>
      <text x="22" y="174">app/ + components/</text>
      <text x="22" y="202">public/loading/</text>
      <text x="22" y="230">lib/manifest*</text>
      <text x="22" y="258">data/history/*</text>
    </g>

    <g transform="translate(22 302)">
      <rect x="0" y="0" width="516" height="136" rx="16" fill="#fff" stroke="rgba(38,37,30,0.10)"/>
      <text x="16" y="28" class="t" font-size="14" font-weight="600" fill="#26251e">Why this matters</text>
      <text x="16" y="54" class="t" font-size="13" fill="rgba(38,37,30,0.62)">
        The fastest way to lose trust in “living” software is letting a model
      </text>
      <text x="16" y="74" class="t" font-size="13" fill="rgba(38,37,30,0.62)">
        touch the scaffolding. The loop must remain legible and recoverable.
      </text>
      <text x="16" y="102" class="t" font-size="13" fill="rgba(38,37,30,0.62)">
        So the generator writes output, and everything else enforces boundaries.
      </text>
    </g>
  </g>

  <!-- Editable box -->
  <g transform="translate(664 160)">
    <rect x="0" y="0" width="560" height="460" rx="20" fill="rgba(20,120,80,0.05)" stroke="rgba(20,120,80,0.18)"/>
    <text x="22" y="44" class="t" font-size="14" font-weight="600" fill="rgba(20,120,80,0.85)">model-writable surface</text>
    <text x="22" y="72" class="t" font-size="13" fill="rgba(20,120,80,0.75)">single file output per model, archived after generation</text>

    <g class="mono" font-size="12" fill="rgba(38,37,30,0.65)">
      <text x="22" y="118">generated/&lt;model&gt;.html</text>
      <text x="22" y="146">public/builds/YYYY-MM-DD/&lt;model&gt;-&lt;timestamp&gt;.html</text>
    </g>

    <g transform="translate(22 196)">
      <rect x="0" y="0" width="516" height="242" rx="16" fill="#fff" stroke="rgba(20,120,80,0.18)"/>
      <text x="16" y="28" class="t" font-size="14" font-weight="600" fill="#26251e">Constraints as design</text>
      <text x="16" y="54" class="t" font-size="13" fill="rgba(38,37,30,0.62)">
        - The model outputs a standalone page (HTML + CSS + optional JS).
      </text>
      <text x="16" y="76" class="t" font-size="13" fill="rgba(38,37,30,0.62)">
        - It can be bold. It can be weird. It can be different every day.
      </text>
      <text x="16" y="98" class="t" font-size="13" fill="rgba(38,37,30,0.62)">
        - But it lives inside a predictable frame: archive, manifest, viewer.
      </text>

      <text x="16" y="134" class="t" font-size="13" fill="rgba(38,37,30,0.62)">
        That’s how you get variation without sacrificing continuity.
      </text>

      <rect x="16" y="160" width="484" height="62" rx="12" fill="rgba(38,37,30,0.03)" stroke="rgba(38,37,30,0.08)"/>
      <text x="32" y="186" class="mono" font-size="12" fill="rgba(38,37,30,0.65)">cursor-agent -p --force --model &lt;model&gt; ...</text>
      <text x="32" y="206" class="mono" font-size="12" fill="rgba(38,37,30,0.55)">&gt; writes generated/&lt;model&gt;.html</text>
    </g>
  </g>

  <!-- Divider arrow -->
  <g stroke="rgba(38,37,30,0.22)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M616 392H664"/>
    <path d="M654 382L664 392L654 402"/>
  </g>
</svg>

